<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LoTaR</title>
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#111315" />
        <link
            rel="icon"
            href="./assets/branding/favicon.ico?no-inline"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64"
        />
        <link rel="icon" href="./assets/branding/lotar-app-icon.svg" type="image/svg+xml" sizes="any" />
        <script>
            // Apply the saved theme and light/dark mode before the first paint, so the
            // page never flashes the default colours (view/utils/theme.ts owns these keys).
            ;(function () {
                try {
                    var root = document.documentElement
                    var name = localStorage.getItem('lotar.themeName') || localStorage.getItem('lotar.repositoryTheme')
                    root.setAttribute('data-theme-name', /^[a-z]+$/.test(name || '') ? name : 'lotar')
                    var mode = localStorage.getItem('lotar.theme')
                    if (mode !== 'light' && mode !== 'dark') {
                        mode =
                            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                                ? 'dark'
                                : 'light'
                    }
                    root.setAttribute('data-mode', mode)
                } catch (error) {
                    // Storage can be unavailable (private windows); CSS falls back to the OS mode.
                }
            })()
        </script>
    </head>

    <body>
        <div id="app"></div>
        <link rel="stylesheet" href="./styles.css" />
        <script type="module" src="./main.ts"></script>
    </body>
</html>
