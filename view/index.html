<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LoTaR</title>
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#111315" />
        <link
            rel="icon"
            href="./assets/branding/favicon.ico?no-inline"
            type="image/x-icon"
            sizes="16x16 32x32 48x48 64x64"
        />
        <link rel="icon" href="./assets/branding/lotar-app-icon.svg" type="image/svg+xml" sizes="any" />
        <script>
            // Apply the saved theme and light/dark mode before the first paint, so the
            // page never flashes the default colours (view/utils/theme.ts owns these keys).
            ;(function () {
                try {
                    var root = document.documentElement
                    var value =
                        localStorage.getItem('lotar.themeName') || localStorage.getItem('lotar.repositoryTheme') || ''
                    // Ids from before palettes (view/utils/themes.ts LEGACY_THEME_ALIASES).
                    var legacy = {
                        lotar: 'classic',
                        ocean: 'classic:ocean',
                        forest: 'classic:forest',
                        ember: 'classic:ember',
                        violet: 'classic:violet',
                        rose: 'classic:rose',
                    }
                    value = legacy[value] || value
                    var parts = /^[a-z]+(:[a-z]+)?$/.test(value) ? value.split(':') : ['classic']
                    root.setAttribute('data-theme-name', parts[0])
                    if (parts[1]) root.setAttribute('data-theme-palette', parts[1])
                    var mode = localStorage.getItem('lotar.theme')
                    if (mode !== 'light' && mode !== 'dark') {
                        mode =
                            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                                ? 'dark'
                                : 'light'
                    }
                    root.setAttribute('data-mode', mode)
                } catch (error) {
                    // Storage can be unavailable (private windows); CSS falls back to the OS mode.
                }
            })()
        </script>
        <!-- The repository skin (ui.theme_file), reduced to theme variables; empty without one. -->
        <link rel="stylesheet" href="/api/branding/theme.css" />
    </head>

    <body>
        <div id="app"></div>
        <link rel="stylesheet" href="./styles.css" />
        <script type="module" src="./main.ts"></script>
    </body>
</html>
