# Rust formatting configuration for Lotar
# Using only stable rustfmt features for consistent code style

# Basic formatting
# Match Cargo.toml so standalone rustfmt (editors) formats like `cargo fmt`,
# which already passes the crate's 2024 edition and style.
edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4

# String and misc formatting
newline_style = "Unix"
remove_nested_parens = true
use_small_heuristics = "Default"
