# DEV-497: a workspace, so a web-only change rebuilds only the embedded assets
# (crates/lotar-web-assets) and the `lotar` binary (this package). The library
# and its tests (crates/lotar-lib) don't depend on the assets. The binary's
# package is the root one, named `lotar`, so `cargo install lotar` and
# `cargo install --path .` install the `lotar` command.
[workspace]
members = [".", "crates/lotar-lib", "crates/lotar-web-assets"]
# Without this, cargo at the root builds and tests only the binary's package.
default-members = [".", "crates/lotar-lib", "crates/lotar-web-assets"]
resolver = "3"

[workspace.package]
version = "0.15.0"
edition = "2024"
authors = ["Ravi Gairola <mallox@pyxzl.net>"]
license = "MIT"
repository = "https://github.com/localtaskrepo/lotar"
homepage = "https://localtaskrepo.github.io/lotar/"

[workspace.dependencies]
tempfile = "3.27.0"
serde_json = { version = "1.0.154", features = ["std"], default-features = false }
clap = { version = "4.6.7", features = ["derive", "std", "env", "error-context", "suggestions"], default-features = false }
# The workspace crates, published together at the workspace version: bump
# these with [workspace.package] (docs/release-guide.md).
lotar-lib = { path = "crates/lotar-lib", version = "=0.15.0" }
lotar-web-assets = { path = "crates/lotar-web-assets", version = "=0.15.0" }

[package]
name = "lotar"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A git-native task management CLI that stores issues as YAML files in your repository"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/localtaskrepo/lotar/tree/main/docs"
readme = "README.md"
keywords = ["cli", "task-management", "git", "yaml", "issue-tracker"]
categories = ["command-line-utilities", "development-tools"]
# Without a list the root package would publish the whole repository.
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE"]
default-run = "lotar"

# `cargo install --path .` installs both: `lotar agent list-running` needs the
# wrapper (docs/help/install.md). It uses only std, not the library.
[[bin]]
name = "lotar"
path = "src/main.rs"

[[bin]]
name = "lotar-agent-wrapper"
path = "src/bin/lotar_agent_wrapper.rs"

# Lint levels for every target (lib, bins, tests) of every workspace package.
# CI and the pre-push hook run clippy with -D warnings, so "warn" blocks merges. Suppress with
# #[expect(lint, reason = "...")] so stale suppressions are reported.
# (needless_pass_by_value is enabled for the library only, in crates/lotar-lib/src/lib.rs.)
[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn" # no unwrap outside tests (clippy.toml allows it there); use ? or expect("why it cannot fail")

[lints]
workspace = true

[dependencies]
lotar-lib.workspace = true
lotar-web-assets.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Production release profile optimized for minimal binary size
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"
debug = false

# Image decoding for attachment thumbnails is the one hot path where opt-level
# "z" hurts: built for speed it makes thumbnails about 5x faster (a 24 MP JPEG
# ~330 ms -> ~70 ms) for ~114 KB of binary (DEV-221).
[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

# Profile for running Rust tests in CI.
#
# The default release profile is tuned for smallest binary size (fat LTO,
# opt-level=z, single codegen unit), which significantly slows compiling/linking
# the many test binaries. Tests are I/O-bound (subprocess/file ops), so a lower
# opt-level barely affects runtime but speeds compile time; high codegen-units
# parallelize codegen, and incremental compilation speeds the change->test loop.
[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
lto = false
panic = "unwind"
strip = "none"
# Keep debug info in object files instead of linking it into every test
# binary: with ~100 test binaries this is the dominant link-time cost.
split-debuginfo = "unpacked"

# Fast-to-build profile for smoke/E2E tests. Smoke tests exercise functionality,
# not performance, so they don't need the size-optimizing fat-LTO/opt-z of
# `release`; this rebuilds the test binary in a fraction of the time.
# Output: target/smoke/lotar.
[profile.smoke]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = false
panic = "unwind"
strip = "none"
split-debuginfo = "unpacked"

# Profile for local test runs (`npm test`, `npm run test:rust:agent`); CI and
# releases keep `ci`. Many agent worktrees compile at once, so CPU per build
# counts most: lotar's own crate unoptimized needs about 60% less CPU than
# `ci` (DEV-346). Dependencies stay optimized (sccache builds them once):
# unoptimized, some tests got up to 20x slower (log output bursts, image
# decoding) and missed their deadlines. No debug info, as in `ci`.
[profile.local]
inherits = "dev"
debug = false

[profile.local.package."*"]
opt-level = 2
