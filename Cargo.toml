[package]
name = "lotar"
version = "0.9.2"
edition = "2024"
default-run = "lotar"
authors = ["Ravi Gairola <mallox@pyxzl.net>"]
description = "A git-native task management CLI that stores issues as YAML files in your repository"
license = "MIT"
repository = "https://github.com/localtaskrepo/lotar"
homepage = "https://localtaskrepo.github.io/lotar/"
documentation = "https://github.com/localtaskrepo/lotar/tree/main/docs"
readme = "README.md"
keywords = ["cli", "task-management", "git", "yaml", "issue-tracker"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "lotar"
path = "src/main.rs"

[[bin]]
name = "lotar-agent-wrapper"
path = "src/bin/lotar_agent_wrapper.rs"

# Lint levels for every target (lib, bins, tests). CI and the pre-push hook
# run clippy with -D warnings, so "warn" blocks merges. Suppress with
# #[expect(lint, reason = "...")] so stale suppressions are reported.
# (needless_pass_by_value is enabled for the library only, in src/lib.rs.)
[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"

# Optimize dependencies for smaller binaries
[dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode", "unicode-perl"] }
include_dir = "0.7.4"
chrono = { version = "0.4.45", features = ["serde", "clock"], default-features = false }
serde = { version = "1.0.229", features = ["derive"], default-features = false }
serde_yaml_ng = "0.10.0"
serde_json = { version = "1.0.154", features = ["std"], default-features = false }
thiserror = "2.0.21"
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive", "std", "env"], default-features = false }
clap_complete = "4.6.11"
rayon = { version = "1.12.0", default-features = false, optional = true }
ignore = { version = "0.4.33" }
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ureq = { version = "3.4.2", features = ["json"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libc = "0.2.191"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
fs2 = "0.4.3"

# Production release profile optimized for minimal binary size
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"
debug = false

# Profile for running Rust tests (CI and local).
#
# The default release profile is tuned for smallest binary size (fat LTO,
# opt-level=z, single codegen unit), which significantly slows compiling/linking
# the many test binaries. Tests are I/O-bound (subprocess/file ops), so a lower
# opt-level barely affects runtime but speeds compile time; high codegen-units
# parallelize codegen, and incremental compilation speeds the change->test loop.
[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
lto = false
panic = "unwind"
strip = "none"
# Keep debug info in object files instead of linking it into every test
# binary: with ~100 test binaries this is the dominant link-time cost.
split-debuginfo = "unpacked"

# Fast-to-build profile for smoke/E2E tests. Smoke tests exercise functionality,
# not performance, so they don't need the size-optimizing fat-LTO/opt-z of
# `release`; this rebuilds the test binary in a fraction of the time.
# Output: target/smoke/lotar.
[profile.smoke]
inherits = "release"
opt-level = 2
codegen-units = 16
lto = false
panic = "unwind"
strip = "none"
split-debuginfo = "unpacked"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
ctor = "1.0.13"
dtor = "1.0.6"

[features]
default = ["parallel"]
schema = ["schemars"]

# Optional features
parallel = ["dep:rayon"]

[dependencies.schemars]
version = "1.2.3"
optional = true
