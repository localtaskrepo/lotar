comments:
- date: 2026-11-14T07:36:46.449030+00:00
  author: claude
  text: |-
    Check reproduced: DEV-468 history at 19:40:30Z shows the rule's tag and comment, then Merging->HelpNeeded and @merge->claude in one entry. Cause: AutomationService::apply_job_event (crates/lotar-lib/src/services/automation_service.rs, without_outcome_fields) removes a rule's set.assignee/status when the job recorded one, but still runs the rule's comment, tags and agent. The codex merge agent picked the built-in fallback 'to its reporter (claude)' instead of the merge prompt's 'assign the ticket to mallox'. No other session has a decision (DEV-524's thread only filed this).

    Question for mallox: which fix? (A) Recommended: when the job's recorded assignee is the ticket's reporter and that reporter is an agent name (a harness like claude/codex, not a person), the outcome drops that assignee and the end rule's set.assignee (@fix) stands, so the promised retry runs. This covers both 'Done when' items. (B) The outcome keeps winning, but a rule whose set fields the outcome replaced runs no comment/agent, and an agent-named reporter is replaced by mallox in the hand-back so it reaches the inbox. Reply A, B or something else.
- date: 2026-11-15T00:28:22.337302+00:00
  author: mallox
  text: 'Answer: A (A job''s hand-back to the ticket''s agent-named reporter is dropped, the rule''s @fix stands and the retry runs) (answered in INBOX-127)'
- date: 2026-11-15T00:59:17.522921+00:00
  author: claude
  text: |-
    Fixed as option A (mallox, INBOX-127): a job's hand-back to an agent-named reporter gives way to the end rule's assignee, so the promised retry runs. Commit `b113afca` (signed).

    - `apply_job_event` (`crates/lotar-lib/src/services/automation_service.rs`): when the recorded assignee is the ticket's reporter and that name is an agent runner (`AGENT_RUNNERS`: claude, codex, ...), and a matching end rule sets an assignee, the recorded status and assignee are dropped (`without_agent_reporter_hand_back`). A hand-back to a person still wins (DEV-320). With no rule assigning, the hand-back stays.
    - Regression test `crates/lotar-lib/tests/dev528_agent_reporter_hand_back_test.rs`: the agent-reporter case fails before the fix (assignee `claude`, expected `fixer`), passes after; the person case passes both.
    - Docs: `docs/help/agent.md` (status and assignee during a job), `docs/help/automation.md`.
    - Checks: `npm run lint:agent`, `npm run test:agent` (2156 Rust, 1537 UI, hooks) and `npm run test:smoke:agent` (401) passed; `npm run build:web` ran first in this fresh worktree.
- date: 2026-11-15T01:29:50.086969+00:00
  author: codex
  text: |-
    Review: passed — no blocking findings in `b113afca`.

    - Read full diff, owner option A, related ticket context, live retry rule, guidance and main history; confirmed DEV-468 history check.
    - Agent-reporter hand-back yields to the retry rule; human hand-back retains precedence. No UI or stray files.
    - Both regression tests passed with `RUSTC_WRAPPER= npm run test:rust:agent -- dev528`; runner exited 1 for leftover `xcrun_db`. Initial sccache attempt was sandbox-denied. Web build and diff whitespace check passed.
    - Full lint/tests/smoke passed per fix agent; not repeated independently. Files, status and assignee unchanged. No durable guidance finding.
