  - DEV-524
comments:
- date: 2026-11-14T07:36:46.449030+00:00
  author: claude
  text: |-
    Check reproduced: DEV-468 history at 19:40:30Z shows the rule's tag and comment, then Merging->HelpNeeded and @merge->claude in one entry. Cause: AutomationService::apply_job_event (crates/lotar-lib/src/services/automation_service.rs, without_outcome_fields) removes a rule's set.assignee/status when the job recorded one, but still runs the rule's comment, tags and agent. The codex merge agent picked the built-in fallback 'to its reporter (claude)' instead of the merge prompt's 'assign the ticket to mallox'. No other session has a decision (DEV-524's thread only filed this).

    Question for mallox: which fix? (A) Recommended: when the job's recorded assignee is the ticket's reporter and that reporter is an agent name (a harness like claude/codex, not a person), the outcome drops that assignee and the end rule's set.assignee (@fix) stands, so the promised retry runs. This covers both 'Done when' items. (B) The outcome keeps winning, but a rule whose set fields the outcome replaced runs no comment/agent, and an agent-named reporter is replaced by mallox in the hand-back so it reaches the inbox. Reply A, B or something else.
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A29313446-ef0d-4734-8002-6fe4ae9daf46
description: |-
  Found while working DEV-524. DEV-468 at 2026-11-13 19:40:30Z: merge job job-20261113T193938.781Z-34 failed. The merge agent (codex) had set HelpNeeded and assigned the reporter `claude` during the job ("Returning to reporter for integration follow-up"; its log says "HelpNeeded, assigned to claude"). At job end the rule "Merge failed: retry with @fix" ran: it added merge-retried and commented "the fix agent retries it on branch ...", but the job's recorded outcome replaced its `assignee: @fix` (DEV-320), so the ticket went to HelpNeeded under claude and no fix agent started. Nothing picks up tickets assigned to an agent's reporter name, so it sat for 11 hours.

  This is not the dependency check (no `blocked` tag was added, DEV-524).

  ## Check

  `.tasks/DEV/468.yml` history at 19:40:30Z: tags + automation comment, then status Merging -> HelpNeeded and assignee @merge -> claude in one entry.

  ## Done when

  - [ ] A rule's comment never promises a retry that the job's recorded outcome cancelled, or the outcome doesn't override a retry rule's assignee when it only hands the ticket to an agent-named reporter (owner decides which).
  - [ ] A job's hand-back to a reporter that is an agent (claude, codex) reaches someone who acts on it.
  - [ ] Regression test that fails before the fix.
