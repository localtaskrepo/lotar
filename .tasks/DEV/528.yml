title: A failed job's hand-back to an agent reporter overrides the retry rule, whose comment still promises the retry
status: HelpNeeded
priority: Medium
type: Bug
reporter: claude
assignee: mallox
created: 2026-11-14T07:09:13.519705+00:00
modified: 2026-11-14T07:36:56.030201+00:00
