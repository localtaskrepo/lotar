- date: 2026-11-20T22:47:01.296826+00:00
  author: claude
  text: |-
    Fixed: a real race in the pause, not a slow deadline. A try that outlasted the retry interval let a second held job start.

    - The failing line 173 in DEV-734's run was the 5 s check `assert!(queued(&queue, "TEST-2"))`, not the 30 s wait (the test ended after 26 s). `TEST-2` had left the queue and was running
    - Cause 1: `next_try_at` counted from the moment a try started. Under load TEST-1's commit retry took 3 s, longer than the 2 s interval, so the next try came due while it ran and went to the held `TEST-2`. In production (10 min interval) a disk-pause retry that reruns the agent for over 10 min would do the same
    - Cause 2: when the paused job was still finishing as its retry was taken, the retry hit "ticket busy" and went back to the end of the queue (`settle_taken`), behind `TEST-2`
    - Fix in `agent_queue_service.rs`: `QueuePause.trying` holds the ticket whose job paused the queue or took the last try. No try is due until that job has ended (`try_free`), in the queue worker and in `lotar serve` (`take_held_try`). Old queue files still load (field is optional)
    - The signing test now runs with `LOTAR_AGENT_PAUSE_RETRY_SECONDS=0`, so the race shows without load: the first half of the fix still failed 1 of 3 runs that way, the full fix passed 8/8. A failing `wait_for` or the 5 s check now prints every job's log
    - New unit-test case in `a_pause_holds_jobs_in_its_scope_and_admits_one_try_when_due`; it fails without the fix
    - `docs/help/agent.md` (Paused queue, Retry) says a try waits for the previous one to end
