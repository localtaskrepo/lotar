description: 'Follow-up to DEV-8/DEV-9 after developer UI feedback: relationship tab is too bulky. Compact categories/chips with on-demand add and secondary controls, preserve keyboard/touch and native drag/drop safety, remove always-expanded embedded graph and repetitive descriptions. Add Dependencies to actual top navigation and Preferences visibility registry with persistence/reset/direct URL behavior. Make existing safe-repair capability obvious through a Fix relationships action and compact integrity summary on dependency page; retain preview, scope warning and explicit revision-bound apply, no silent repair. Refine dependency view information density using established components. Verify targeted UI, desktop/mobile browser flows and final lint/test/fresh smoke gates. Preserve existing uncommitted dependency implementation and unrelated Cargo/DEV-137 work.'
