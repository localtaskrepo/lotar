- date: 2026-10-30T01:06:55.820854+00:00
  text: "This may also be an opportunity to merge the scoop and homebrew repos into one, if possible, along with other repos that may be added. \nThere may even be a case for merging them back into the main repo if that provides any benefits."
- date: 2026-10-30T18:43:31.009887+00:00
  text: 'Plan (Phase 1, agreed): keep separate repos per channel (no tap/bucket merge, nothing folded into main). 1) Homebrew formula gains on_linux (musl x64/arm64 static builds) in release.yml update-homebrew-tap; formula + Scoop manifest + package.json license ISC -> MIT (LICENSE/Cargo.toml are MIT). 2) site/install.sh (POSIX sh; Linux musl + macOS; sha256 check; ~/.local/bin default; LOTAR_VERSION/LOTAR_INSTALL_DIR) and site/install.ps1 (Windows x64 zip, hash check, user PATH), served by Pages at localtaskrepo.github.io/lotar/. 3) New release job builds .deb/.rpm (amd64/arm64) with pinned nfpm from the musl tarballs, sha256 + cosign, uploads to the release; quick links updated. 4) homebrew-verify: retired macos-13 -> macos-15-intel, add Linux job; new verify workflow for install scripts and deb/rpm. 5) Docs: install.md, README, homepage install tabs, release-guide. Checks: actionlint, shellcheck, local script runs (macOS + alpine/debian containers, checksum-mismatch case), nfpm build + install in debian/fedora containers, formula syntax/brew install from local tap. Later phases: npm (per-platform binary packages), winget, AUR; crates.io/binstall deprioritized.'
- date: 2026-10-30T19:14:22.764604+00:00
  text: |-
    Outcome (Phase 1 implemented, uncommitted): release.yml update-homebrew-tap adds on_linux (musl x64/arm64) and fixes license ISC->MIT (Scoop manifest, package.json, package-lock root too). Also fixed a live bug: the formula test block was generated by a Python f-string, so the published tap has shell_output("#<built-in function bin>/lotar --version"); now #{{bin}} plus a guard that fails the job if interpolation breaks. New package-linux job: pinned nfpm 2.48.0 (sha256), builds lotar-<tag>-linux-{x64,arm64}.{deb,rpm} from the musl archives via packaging/nfpm.yaml (/usr/bin/lotar + license), sha256 + cosign v2, gh release upload; tap/bucket/docker do not wait for it; quick links list packages + install commands. site/install.sh (POSIX sh, curl or BusyBox wget, sha256 check, ~/.local/bin, --version/--to or LOTAR_VERSION/LOTAR_INSTALL_DIR, Rosetta detection, atomic replace) and site/install.ps1 (x64 zip, hash check, %LOCALAPPDATA%\Programs\lotar, user PATH, ARM64 via emulation), published by the existing Homepage workflow. homebrew-verify: macos-13 (retired Dec 2025) -> macos-15-intel/macos-15 + ubuntu-latest Linuxbrew, adds brew test. New install-verify.yml (scripts on Ubuntu x64/arm64, Alpine, macOS x2, Windows pwsh + PowerShell 5.1 on PRs touching scripts; deb/rpm in Debian/Fedora x64/arm64 on manual dispatch). Docs: install.md, README, docs/README.md (also fixed wrong .tar.gz.sha256 name), release-guide, homepage Install script tab, bug template.
    Evidence: workflow formula steps run locally against v0.11.0 -> brew install + brew test pass in homebrew/brew (Linux x64). Workflow download+build steps run locally (nfpm from its official image) -> 4 packages; install/run/remove pass in debian:stable-slim and fedora:latest, arm64 and x64. install.sh: shellcheck clean; macOS host, alpine (BusyBox wget) arm64/x64, debian dash+curl, piped stdin, missing downloader error, tampered checksum (curl and wget) installs nothing. install.ps1: parse clean; pwsh container via iex installs lotar.exe (x64/ARM64 paths), x86 rejected, tampered checksum installs nothing. actionlint clean except a pre-existing SC2193 in the release strip step (unchanged). Homepage built and screenshotted (desktop/390px, no overflow). npm run lint:agent clean; full test/smoke not rerun (no app code changed since the green DEV-251 run).
    Not verified here (GitHub-only): package-linux job, cosign on packages, Windows execution of install.ps1 (real .exe run + user PATH), the verify workflows themselves, Pages serving the scripts.
    Remaining / next: commit; open a PR or run install-verify.yml + homebrew-verify.yml after merge (scripts work against v0.11.0 already); after the next release run install-verify with that tag to check deb/rpm and homebrew-verify for Linux. Phase 2 candidates: npm per-platform binary packages (user has an npm account), winget, AUR lotar-bin; crates.io/binstall low priority. Decision: separate repo per channel, nothing folded into main.
    Guidance: no durable finding.
- date: 2026-10-30T23:39:52.553210+00:00
  text: 'Phase 1 committed: dc3d047 (with DEV-251 658dd6a, DEV-252 ee1ae65); not pushed. Plan (Phase 2, npm): user chose main package ''lotar'' + platform packages @localtaskrepo/lotar-{darwin-arm64,darwin-x64,linux-x64,linux-arm64,win32-x64} (needs npm org localtaskrepo). Platform packages carry the release binary (musl for Linux; win32-x64 also allows arm64 via emulation) with os/cpu fields; main package has a small Node launcher (bin/lotar.js) and exact-version optionalDependencies, no postinstall. scripts/npm-packages.mjs assembles packages from the release archives (node:test coverage); release job publish-npm downloads + checks archives, publishes platform packages then main, skips versions already published, dist-tag next for prereleases, trusted publishing (OIDC, npm >= 11.5.1) with optional NPM_TOKEN secret only to bootstrap the first publish (classic tokens revoked Dec 2025, write tokens max 90 days). Root package.json gets private: true (it is named @localtaskrepo/lotar). Docs: install.md npm + MCP npx usage, release-guide bootstrap steps, README/homepage; install-verify gains an npm job. Checks: unit tests, local Verdaccio registry publish + install/npx in node containers (arm64/x64), actionlint.'
- date: 2026-10-30T23:49:36.532826+00:00
  text: |-
    Outcome (npm, uncommitted at time of writing): packaging/npm/lotar (CommonJS launcher bin/lotar.js: maps platform-arch to @localtaskrepo/lotar-<platform>, win32-arm64 -> win32-x64, inherits stdio, forwards SIGTERM/SIGHUP, re-raises child signals, clear errors for unsupported platform or omitted optional dep; npm README with npx/MCP usage). scripts/npm-packages.mjs builds 5 platform packages (os/cpu, exec bit, preferUnplugged) + main lotar (exact-version optionalDependencies, no scripts) and publish-order.json; scripts/tests/npm-packages.test.mjs (7 cases, in test:release). release.yml publish-npm job: Node 24, npm >= 11.5.1 check, downloads + checks 5 archives, assembles, publishes platform packages then lotar with --provenance, skips published versions, dist-tag next for prereleases, NPM_TOKEN only for bootstrap; release page lists npm. install-verify gains an npm job (5 OSes, dispatch only). Root package.json private: true (named @localtaskrepo/lotar). ESLint override for the CommonJS launcher. Docs: install.md npm section, mcp.md client command, README, docs/README, homepage 'Script & npm' tab, release-guide one-time npm setup (org, temporary granular token, trusted publisher per package, revoke).
    Evidence: local run of the real download step caught and fixed a CRLF bug in the Windows .sha256 (sha256sum --check failed); now passes with GNU tools. Assembled packages from v0.11.0 (pack contents and 755 modes checked), published all 6 to a throwaway Verdaccio registry with the real publish step (provenance flag removed), rerun skipped all 6. node:24 arm64 and x64: npm i -g installs only the matching platform package, lotar --version and npx -y lotar work, MCP initialize round-trips through the launcher, exit codes match the binary, SIGTERM to the launcher stops the binary; project install with --omit=optional shows the intended error (global installs ignore --omit=optional). actionlint clean except the pre-existing SC2193; npm run lint:agent clean; npm run test:release 40/40. Rust/UI tests and smoke not rerun (no app code changed).
    Remaining: user creates npm org localtaskrepo and bootstraps the first publish (docs/release-guide.md One-Time npm Setup), then configures trusted publishing for the 6 packages and revokes the token. GitHub-only checks still pending: package-linux, publish-npm (OIDC + provenance), install-verify and homebrew-verify runs. Later candidates: winget, AUR lotar-bin.
- date: 2026-10-31T00:09:43.667370+00:00
  text: 'CI: QA on f4b0d79 (and so 349b236) failed in Windows Binary Sanity: test:release runs on Windows, where the buildPackages test needs zip and Unix exec bits. That case now skips on win32 (packaging only runs on the Linux release runner); the other npm tests already passed on Windows. Release is blocked until a commit with this fix is QA-green.'
- date: 2026-10-31T00:32:45.274809+00:00
  text: 'v0.11.1 release: every job passed except publish-npm. The bootstrap token got E404 on PUT @localtaskrepo/lotar-darwin-arm64 (no publish rights in the new scope); nothing was published. npm 11.20 docs: npm trust needs the package to exist and an interactive 2FA login (bypass-2FA tokens unsupported); bypass-2FA tokens lose direct publishing in Jan 2027; trusted publishing configs expire after 48h until their first publish. Changed approach: removed the NPM_TOKEN path from publish-npm; release-guide One-Time npm Setup now = create org, build + publish the first version by hand (npm login, 6x npm publish --access public), then npm trust github <pkg> --repo localtaskrepo/lotar --file release.yml --allow-publish shortly before the next tag. Built the v0.11.1 packages from the release archives (checksums OK) for the user to publish. Next: user publishes, deletes the NPM_TOKEN secret and revokes the token; configure trust right before the next release, then run install-verify.'
- date: 2026-10-31T00:44:01.779312+00:00
  text: 'First manual publish: npm rejected unscoped ''lotar'' (E403, too similar to tar, lokap, jotai); none of the platform packages are on npm either, so nothing to clean up. User chose @localtaskrepo/lotar as the main package (command stays lotar). Renamed in scripts/npm-packages.mjs (output dir stays dist/lotar), tests, launcher message, npm README, install.md, mcp.md, README, docs/README, homepage, release page npm line, release-guide trust loop, install-verify npm job (nested path @localtaskrepo/lotar/node_modules/@localtaskrepo). Root workspace package renamed to @localtaskrepo/lotar-workspace (private) to avoid two packages with one name. Rebuilt v0.11.1 packages; Verdaccio publish of all 6 + node:24 global install, npx, MCP initialize OK; test:release 40/40, lint and actionlint clean. Next: user publishes the 6 rebuilt packages, then npm trust before the next tag.'
- date: 2026-10-31T00:51:06.450620+00:00
  text: 'npm v0.11.1 published by hand: all 6 packages exist in the org (npm access list); public view lagged a few minutes each time. npm trust cannot run from the agent shell: without a TTY it fails with EOTP and a one-time browser link, so no trust config was created (3 attempts failed before the loop was stopped). User runs the loop interactively (script in the session scratchpad, same as release-guide step 3). NPM_TOKEN token revoked by user, but the repo secret still exists (unused by the workflow). Next: trust loop within 48h of the next tag, then install-verify.'
- date: 2026-10-31T01:00:46.787890+00:00
  text: 'NPM_TOKEN repo secret deleted by user (confirmed via gh secret list). Remaining: user runs the npm trust loop within 48h of the next tag; after that release, run install-verify (npm, deb/rpm, scripts) and homebrew-verify with the tag, then close.'
description: |-
  Right now we support homebrew and scoop as well as direct downloads from the release page.
  Investigate what other platforms make sense to distribute the built binaries with, ideally, so that linux also is supported.
