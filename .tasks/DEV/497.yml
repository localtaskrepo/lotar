description: |-
  First step of the cargo workspace the owner approved (DEV-493, 2026-11-13: "Yes on all of those ideas"). A web-only change should rebuild only the embedded assets and the link, not the library and its tests.

  ## Context

  - `build.rs` watches `target/web` and `target/web-embed`, and `include_dir!` in `src/web_server.rs` embeds them. Each web build reruns the build script, which recompiles every target of the package: library, unit tests, integration tests, both binaries.
  - Cargo recompiles every dependent of a rebuilt package. A separate assets crate only helps if the library and the tests don't depend on it.

  ## Plan

  - Make the repo a cargo workspace. Put the web embed into a package of its own (its own `build.rs` for the web part; the help docs and OpenAPI stay with the library) and the `lotar` binary into a package that depends on the library and the assets. The library reads the assets through a hook the binary sets at start. Tests that need real assets go through the binary.
  - Keep the binary names, `cargo install` from the repo, and the release tooling working: `release.yml`, `Cross.toml`, `packaging/` (nfpm, npm, Homebrew, Scoop), `Dockerfile`, `scripts/` that call cargo, and the smoke build profile.
  - Update the path filters in `ci.yml` from DEV-493 if paths move, and `docs/developers/`.

  ## Done when

  - [ ] After `npm run build:web`, `cargo build` and `cargo nextest run --no-run` recompile only the assets package and the binary (shown with timings).
  - [ ] Release builds, the smoke suite and the packaging checks still pass.
