description: 'Two tickets now wait for the next release to run their checks (rule of 2, owner 2026-11-11): ''Maybe we should create a ticket for the next release which other agents can check ... They need to be triggered when the release is done, so we need a release process defined and set up for lotar''. Owner decisions 2026-11-11: a waiting ticket is ''Blocked + depends on release'' (status Blocked, depends_on the ''Release vX.Y.Z'' ticket, e.g. DEV-369); the checks start on ''Closing the release ticket'': the last release-guide step, after brew upgrade lotar on this Mac, sets the release ticket Done. Set up: (1) an automation rule in lotar''s .tasks config that, when a release ticket goes Done, hands every Blocked ticket depending on it to @fix with a prompt like ''Release <version> is installed: run your check, close the ticket or report what still fails''; (2) docs/release-guide.md: create the next release ticket, link waiting tickets, close it after installing; (3) the agent guidance (lotar-dev-tracking or development-workflow skill): a ticket whose check needs a release goes Blocked + depends_on the open release ticket, not HelpNeeded. Open for the implementer: rule conditions need their field to change in the update (docs/help/automation.md Triggers), and actions apply to the ticket that fired, so reaching the dependents may need a run: lotar automation run ... --select step or a small lotar change; propose before adding code. Check: create a test release ticket and a Blocked dependent in a temp workspace, close the release ticket, and the dependent is assigned to the check agent. Done when that works with a test, and the docs and guidance describe it.'
