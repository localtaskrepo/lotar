comments:
- date: 2026-11-12T06:39:43.328867+00:00
  text: 'claude: Owner 2026-11-11 (mallox), on the trigger: ''we can use the depends on relationship between tickets to standardize the release trigger''. So the standard is: a ticket that waits for a release depends_on that release''s ticket, and closing the release ticket starts the checks of its dependents, found through that relationship (not through tags or a hand-kept list). Current dependents of DEV-369: DEV-361, DEV-364.'
- date: 2026-11-12T06:42:38.767922+00:00
  text: 'claude: Scope addition, owner decision 2026-11-11 (mallox): ''Add to DEV-370''. Add a release skill, .github/skills/release/SKILL.md, plus a row in AGENTS.md''s skill table. It covers: check that main holds every fix of the release ticket''s dependents; version bump (stay on 0.13.x patch bumps); QA green for the commit; signed tag and push only with the owner''s OK; release workflow green; brew upgrade lotar on this Mac; close the release ticket, which starts the dependents'' checks; open the next release ticket. docs/release-guide.md stays the reference and the skill points to it rather than copying it. Validate the skill with instruction-maintenance.'
- date: 2026-11-12T06:48:19.204606+00:00
  text: 'claude: Done in 068c2a2 on agent/DEV-370, with no lotar code change. (1) .tasks/DEV/automation.yml, below the standards rules: ''Release installed: start the waiting checks'' fires when a ticket goes Done. Its sh command exits unless the title starts with ''Release v'', then follows the release''s blocks list (the reciprocal of depends_on, so the waiting tickets are found through the relationship, not tags or a list) and runs the manual rule ''Release installed: run the waiting check'' with --select ''status:blocked id:/^DEV-N$/'' for each one. That rule assigns the ticket to @fix with a prompt: run the check against the installed lotar; if it passes, comment and stop (the merge agent finds nothing and closes it); if it fails, HelpNeeded to mallox. It uses the lotar on PATH and needs the repo trusted (lotar trust) after the merge, as every run action does. (2) docs/release-guide.md: a new section ''Tickets waiting for a release'', and step 4 of Cutting a Release (brew upgrade, close the release ticket, open the next one). I also fixed stale lines: no package.json bump and no CHANGELOG.md (the workflow writes the notes), and a signed tag in Cutting a Release. (3) lotar-dev-tracking skill: a ticket whose check needs a release goes Blocked + depends_on the open release ticket, not HelpNeeded. (4) The added scope: a new .github/skills/release/SKILL.md (fixes on main, 0.13.x bump, QA green, signed tag only with the owner''s OK, Release workflow green, brew upgrade, close the ticket, open the next one), which points to the guide, plus a row in AGENTS.md. Validated with instruction-maintenance: its commands work on the real backlog (DEV-369 blocks DEV-361, DEV-364), links and anchors resolve, git diff --check is clean. Test: tests/dev370_release_waiting_checks_test.rs copies the real automation.yml into a temp workspace. Closing ''Release v9.9.9'' hands its Blocked dependent to @fix with the prompt; a Blocked ticket waiting on other work, and another ticket going Done, start nothing. It fails without the rules. Checks: npm run lint, npm test (Rust 2019, UI 1444), npm run smoke (379), all pass. Note: main''s .tasks/DEV/automation.yml has uncommitted edits (session: continue, DEV-368) in hunks separate from mine.'
- date: 2026-11-12T06:53:29.089059+00:00
  text: 'claude: Merge refused, not pushed. Branch t3/release-process-waiting-checks holds 068c2a2 (DEV-370), already on top of main c724ed9, so no rebase was needed. Checks in the worktree all pass: npm run lint, npm test (2019 Rust, 1444 UI), npm run smoke (379). git -C <root> merge --ff-only refused: the main checkout has an uncommitted edit to .tasks/DEV/automation.yml (the @merge rule gets session: continue and new prompt text, the open item from DEV-368), and the merge would overwrite it. The two changes are in separate hunks (that edit is near line 93, DEV-370 appends rules at the end), so once the edit is committed, main fast-forwards after a rebase with no conflict. I didn''t commit, stash or touch anything in the main checkout. Question: may the merge agent commit that automation.yml edit with the ticket files (DEV-370 Ticket updates), then rebase, fast-forward and push?'
- date: 2026-11-12T06:53:43.413902+00:00
  text: The merge agent's job job-20261112T064831.342Z-2 failed (lotar agent logs job-20261112T064831.342Z-2); the fix agent retries it on branch t3/release-process-waiting-checks.
