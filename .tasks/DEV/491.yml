description: |-
  Comments by the author `automation` (job failed, retry started, thread waits for an answer) sit between the agents' and the owner's comments at the same weight, so the conversation is hard to follow on a ticket like DEV-466 or STD-82. Owner chose to show them de-emphasized on 2026-11-13.

  ## Plan

  - Comments tab: comments whose author is `automation` render smaller and muted, with the text still readable and links working. A question from automation (once the question comment type exists) stays full weight: it waits for the owner.
  - No data change.

  ## Done when

  - [ ] Automation comments render muted in light and dark themes, on phone width too (screenshots before and after).
  - [ ] lint, test and smoke pass.
