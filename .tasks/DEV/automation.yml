# Source: standards configs/lotar/automation.yml. Repo-health tickets (tag health, filed by
# node ~/Development/standards/scripts/repos.ts --report) start a fix agent as a T3 Code thread; tag owner never does.
# So does a ticket an agent files without an assignee (owner 2026-11-11, skill lotar-workflow). Jobs run in worktrees;
# a finished fix job goes to an agent reviewer (owner 2026-11-12, STD-59), then to @merge, which brings its branch into
# the main checkout (owner 2026-11-11, STD-35). What waits for the owner goes to his inbox in standards (STD-54). Goes
# into each repo's .tasks/<PROJECT>/automation.yml; the repo's own rules follow below these. Setup, retries and the
# model choice: configs/lotar/README.md. The statuses Reviewing and Merging are agent stages; none waits for the owner,
# who follows the fix agents in T3 (2026-11-11, 2026-11-12) and the headless reviews and merges on lotar's Agents page
# (2026-11-14, STD-124).
automation:
  rules:
    - name: "Health: start the fix agent"
      when:
        all:
          - tags: { any: [health] }
          - not: { tags: { any: [light] } }
      on:
        created:
          set:
            assignee: "@fix"
          # The ticket fields model and provider override the profile's (set both for another provider's model);
          # empty keeps the profile's.
          agent: &fix
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: &fix-prompt |
              Fix the repo problem in ticket ${{ticket.id}} ("${{ticket.title}}"). Run lotar with
              LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex): lotar records it as the comment's author.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. Read the ticket: what was found, how to check it, what done looks like. Run its check command (a
                 day's bundle, finding health:<date>, names one per finding: fix them all). After
                 a failed merge your branch may hold earlier commits (git log <main>..HEAD): build on them.
              2. Fix it the way this repo's AGENTS.md says: the smallest change, with targeted tests and checks for
                 what it changes, not the full suites: the merge runs them once (owner 2026-11-22, lotar DEV-797).
              3. Never delete or discard work that isn't saved elsewhere (unmerged commits, uncommitted changes,
                 files a tool or another session may still use), and never decide what only the owner decides.
                 Before asking him, ask the agents that are running (T3 threads, other sessions) what they know, and
                 file every bug you find in its repo (lotar add --finding; a test that fails only under load and
                 passes alone goes on the repo's flaky list instead, skill lotar-workflow). When the fix still needs him, comment one
                 question, set the status to HelpNeeded, assign the ticket to mallox (the owner) and stop.
                 It waits for another ticket: lotar task relationships add --kind depends-on ${{ticket.id}} <ID>, lotar
                 task edit ${{ticket.id}} --tag waits, comment what it waits for and stop. The ticket goes Blocked,
                 and you continue in this thread when <ID> is done; tag waits keeps the review away until then.
                 He decided these already, so never ask them (STD-156: FND-11, QIS-198 asked though G-20 was answered):
                 a push of finished work in a repo whose entry in ~/Development/standards/repos.json says "push": true
                 ("On private repos you can decide to push in general", 2026-11-11,
                 docs/decisions/2026-11-11-formatting.md; finished work only,
                 docs/decisions/2026-11-12-push-finished-work.md): push it as the merge agent's
                 step 6 does, also in this job; a config copy behind its source in ~/Development/standards/configs:
                 copy it again; lotar trust after a rules change ("you can run lotar trust for me", 2026-11-11,
                 docs/decisions/2026-11-11-repo-health.md).
                 He answers in this thread, also while your job still runs: finish steps 4 to 6, then start the
                 review with lotar automation run "Answered in the thread: review on Codex" --select 'id:${{ticket.id}}'
                 (you on Claude Sonnet: "... light review"; on Codex: "... review on Claude"). The rule skips a ticket
                 an agent still holds; then the job's end moves it on.
              4. When you changed files: commit them on your worktree's branch, signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push your commits (step 3's push is of commits
                 already on main): the merge agent does that, then reruns the check command against the main checkout.
              5. Nothing to commit (the problem is gone already, or the fix needs no file change) and no commits beyond
                 main (git log <main>..HEAD, main being the main checkout's branch): comment the reason in one line,
                 then lotar status ${{ticket.id}} Done (WontDo when the ticket's "Done when" says so) and
                 lotar assignee ${{ticket.id}} --clear, and stop. No review or merge follows.
              6. Otherwise comment the outcome: what you changed, the commit hash, the checks that ran. When your job
                 ends, an agent on another model reviews it, then the merge agent takes over.
                 Changed pages, components or styles: tag the ticket ui (lotar task edit ${{ticket.id}} --tag ui)
                 and attach the before and after screenshots of skill ui-review (lotar task reference add upload
                 ${{ticket.id}} <file>), linked in that comment; the reviewer blocks without them.
    - name: "Health: start the light fix agent"
      when:
        all:
          - tags: { any: [health] }
          - tags: { any: [light] }
      on:
        created:
          set:
            assignee: "@fix-light"
          agent: *fix
    # An agent's ticket nobody took: @fix works it. The filer assigns itself, the
    # owner (a question) or @fix-light (mechanical) instead when that fits; proposals, owner and recurring tickets wait.
    # A Change ticket (local's change records) belongs to the agent making that change. A ticket filed Blocked waits:
    # its depends_on follows the add, and "Prerequisites done" starts it (STD-102).
    - name: "Agent tickets: start the fix agent"
      when:
        all:
          - any:
              - reporter: claude
              - reporter: codex
          - not: { assignee: "@any" }
          # Tag flaky: the repo's flaky list (skill lotar-workflow), fixed in one batch (owner 2026-11-22, STD-299).
          - not: { tags: { any: [health, proposal, owner, recurring, flaky] } }
          - not: { type: Change }
          - not: { type: Research }
          - not: { status: Blocked }
      on:
        created:
          set:
            assignee: "@fix"
          # Without a prompt the job runs on lotar's built-in instructions, which leave the changes uncommitted
          # (DEV-332, 2026-11-12).
          agent: &work
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: &work-prompt |
              Work ticket ${{ticket.id}} ("${{ticket.title}}"): read it and its relationships, then do it the way this
              repo's AGENTS.md says, with targeted tests and checks for what you change, not the full suites: the
              merge runs them once (owner 2026-11-22, lotar DEV-797). Run lotar with LOTAR_DEFAULT_REPORTER set to
              your agent name (claude, codex). After a failed merge your branch may hold earlier commits
              (git log <main>..HEAD): build on them.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. Before you code: a ticket without "## Done when", or with one that doesn't say what each surface and
                 case must do, gets one in its description (lotar task edit ${{ticket.id}} -D ...), checkboxes the
                 reviewer can check. Where the owner's words settle a point, quote them and follow them as written.
                 Say which value wins when two can apply, and what happens when a step fails. Find the callers in
                 every repo that may use what you change, and read the whole search output.
                 Before your first edit, list the project's running and waiting T3 threads (t3_thread_list) and tell
                 each one whose ticket is about the same files what you will change (skill cross-project-help).
              2. Never delete or discard work that isn't saved elsewhere, and never decide what only the owner decides.
                 Ask the running agents (T3 threads) first; when it still needs him, comment one question, set the
                 status to HelpNeeded, assign the ticket to mallox and stop.
                 It waits for another ticket: lotar task relationships add --kind depends-on ${{ticket.id}} <ID>, lotar
                 task edit ${{ticket.id}} --tag waits, comment what it waits for and stop. The ticket goes Blocked,
                 and you continue in this thread when <ID> is done; tag waits keeps the review away until then.
                 Never ask what he decided already (STD-156): a push of finished work where
                 ~/Development/standards/repos.json says "push": true ("On private repos you can decide to push in
                 general", docs/decisions/2026-11-11-formatting.md, docs/decisions/2026-11-12-push-finished-work.md),
                 copying a config again from ~/Development/standards/configs, lotar trust after a rules change
                 ("you can run lotar trust for me", docs/decisions/2026-11-11-repo-health.md): do them.
                 He answers in this thread, also while your job still runs: finish steps 3 to 6, then start the
                 review with lotar automation run "Answered in the thread: review on Codex" --select 'id:${{ticket.id}}'
                 (you on Claude Sonnet: "... light review"; on Codex: "... review on Claude"). The rule skips a ticket
                 an agent still holds; then the job's end moves it on.
              3. Commit your changes on your worktree's branch, signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push your commits (step 2's push is of commits
                 already on main): the merge agent does that.
              4. Don't end your turn while tests or other background work still run: the job ends with your turn.
              5. Nothing to commit (the work is done already, or needs no file change) and no commits beyond main
                 (git log <main>..HEAD, main being the main checkout's branch): comment the reason in one line, then
                 lotar status ${{ticket.id}} Done (WontDo when the ticket's "Done when" says so) and
                 lotar assignee ${{ticket.id}} --clear, and stop. No review or merge follows.
              6. Otherwise comment the outcome: what you changed, the commit hash, the checks that ran. When your job
                 ends, an agent on another model reviews it, then the merge agent takes over.
                 Changed pages, components or styles: tag the ticket ui (lotar task edit ${{ticket.id}} --tag ui)
                 and attach the before and after screenshots of skill ui-review (lotar task reference add upload
                 ${{ticket.id}} <file>), linked in that comment; the reviewer blocks without them.
    # A Research ticket ends in a write-up with sources, one recommendation and a question for the owner, not a code
    # change (owner 2026-11-22, STD-305: "@research + new type", docs/decisions/2026-11-22-research-role.md). Anyone's,
    # not only an agent's; proposals, owner and recurring tickets wait as above. A write-up file gets the light source
    # check, the merge, then goes to him ("Research done", "Research merged"); an answer in a comment goes to him at once.
    - name: "Research: start the research agent"
      when:
        all:
          - type: Research
          - not: { assignee: "@any" }
          - not: { tags: { any: [proposal, owner, recurring] } }
          - not: { status: Blocked }
      on:
        created:
          set:
            assignee: "@research"
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: |
              Research ticket ${{ticket.id}} ("${{ticket.title}}"): answer its question. Change no code. Run lotar with
              LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex).
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. Read the ticket, its comments and relationships, and the owner decisions it names (docs/decisions):
                 what he asked and what the answer must let him decide. Ask the running agents (T3 threads) what they
                 know first (skill cross-project-help).
              2. Check every fact on the web: current releases, versions, prices and limits from the project's own
                 pages or release notes, never from memory. Each fact gets its source (a link) and the date you checked
                 it. A fact you couldn't check: say so, don't state it.
              3. Write the result. Fits one phone screen: the comment of step 4 is the write-up. Longer:
                 docs/research/<topic>.md (<topic> a short kebab-case name): what was asked, the options compared,
                 every claim with its source, the recommendation. Commit it on your worktree's branch, signed, never
                 with --no-verify, message "${{ticket.id}} ${{ticket.title}}"; don't merge or push. No other file:
                 no code, configs, rules or skills; a change the research shows is needed is a ticket of its own
                 (skill lotar-workflow), related to ${{ticket.id}}.
              4. End with one recommendation and its cost (agent time, money, upkeep). Comment the outcome, the
                 findings with their sources, the recommendation and its cost, and the write-up's path. Then ask one
                 question he can answer in a line: lotar comment ${{ticket.id}} --question "<question>" --option
                 "<key>: <label>" for each choice, --recommend <key>.
              5. No write-up file: set the status to HelpNeeded, assign the ticket to mallox and stop. With one: leave
                 status and assignee. When your job ends a light check that its claims have sources runs, the file
                 lands on main, and the ticket goes to him with your question.
              Never delete or discard work that isn't saved elsewhere, and never decide what only the owner decides.
              His answer in this thread, also while your job still runs: comment his words on the ticket and file
              the work it starts as tickets of their own, related to ${{ticket.id}}, quoting him (their agent records
              his decision in docs/decisions); then lotar status ${{ticket.id}} Done and lotar assignee ${{ticket.id}} --clear.
    # Every job's worktree gets the repo's install from repos.json before the agent's first turn: lotar runs job_started
    # rules after it made the worktree. The only trigger, no T3 Code scripts (owner 2026-11-20, STD-270: "keep
    # automation all in one place", docs/decisions/2026-11-20-worktree-setup.md). It skips an install that already ran
    # on the same lockfiles (review and merge reuse the worktree). A failed install is a comment on the ticket, not a
    # failed job: the agent installs itself. Up to 20 minutes, as quarter-inch-studio installs five folders.
    - name: "Jobs: set up the worktree"
      when:
        assignee: "@agent"
      on:
        job_started:
          run:
            command: sh
            args: [-c, 'node "$HOME/Development/standards/scripts/worktree.ts" create']
            timeout: 20m
            ignore_failure: true
    - name: "Health: fix agent lifecycle"
      when:
        any:
          - assignee: "@fix"
          - assignee: "@fix-light"
          - assignee: "@fix-fable"
          - assignee: "@fix-retry"
          - assignee: "@research"
      on:
        job_started:
          set:
            status: InProgress
          # A rule's own change fires no other rule: a job that a rule starts on a HelpNeeded ticket (a manual retry,
          # his comment) closes its inbox ticket here. The status is set before the command runs (STD-103).
          run: &inbox 'node "$HOME/Development/standards/scripts/repos.ts" --inbox ${{ticket.id}}'
    # A fix job's work goes to an agent reviewer before the merge (owner 2026-11-12, STD-59: "Yes, I agree with your
    # recommendations", docs/decisions/2026-11-12-qa-step.md): a new headless session, the cheap model after @fix-light
    # (STD-124). Not the ticket's model fields: they pick the fix agent's model. Work that commits only .tasks passes at
    # once. A fix agent that hands the ticket back (HelpNeeded) sets status and assignee itself, which replaces these,
    # so no review starts; one that waits for another ticket tags it waits (below). So does one that commits nothing:
    # it sets Done (or WontDo) and clears the assignee (owner 2026-11-13, STD-87, docs/decisions/2026-11-13-no-change-closes.md).
    # UI work (tag ui, or a diff that changes pages, components or styles) also gets the ui-review step with screenshots
    # (owner 2026-11-13, STD-97, docs/decisions/2026-11-13-agent-roles.md). lotar's conditions match ticket fields, not
    # changed files, so the review prompt checks both instead of a rule per tag.
    - name: "Fix done: review on Codex"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-fable"
          - not: { tags: { any: [waits] } }
      on:
        job_completed:
          set:
            assignee: "@review"
            status: Reviewing
          agent: &review
            # A new session on the fix branch, also on the author's provider and model (lotar DEV-414).
            session: fresh
            prompt: |
              Review the work for ticket ${{ticket.id}} ("${{ticket.title}}") before it is merged. A fix agent
              committed it on your worktree's branch; you didn't write it. Run lotar with LOTAR_DEFAULT_REPORTER set
              to your agent name (claude, codex). Change no files, commit nothing and leave status and assignee as
              they are: when your job ends the rules send the work on by tag review-blocked. You run headless: nobody
              reads this session, so never ask in it; what you find goes into the ticket's comments.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. The work: git log <main>..HEAD and its diff, main being the main checkout's branch (git -C <root>
                 branch --show-current, <root> the first entry of git worktree list). When the ticket branch has
                 commits HEAD lacks (git log HEAD..${{agent.worktree_branch}}) and its last commit is newer (git log -1
                 --format=%cI), this worktree holds the version before a rework (STD-151): review that branch instead
                 of HEAD. No commits, or only .tasks changed: comment "Review: nothing to review" and stop.
              2. Read what it must agree with, not only the diff: the ticket and its comments (what "Done when" asks,
                 what the fix agent claims), its related tickets, the owner decisions it touches (docs/decisions, the
                 ticket's quotes), this repo's AGENTS.md, and the recent commits to the touched files on main
                 (git log -5 <main> -- <file>), which may have changed what the fix relies on.
                 Before you rerun checks: when ~/Development/standards/repos.json gives this repo an "install"
                 (npm ci), run it in your worktree, without asking; it fails: say so in the outcome.
              3. Check: it does all that "Done when" asks and nothing the ticket didn't ask (a "Done when" the fix
                 agent wrote must cover what the ticket asked, not only what it built); each claim that relies on
                 something outside the change holds (another check, a config or rule that uses the code, "still
                 covered"); it decides nothing only the owner decides; a bug fix has a test that failed before it; no
                 stray files, no second branch or copy of the same fix. Rerun the checks the fix agent names that
                 finish in a few minutes, targeted ones, not the full suites: the merge runs them once (owner
                 2026-11-22, lotar DEV-797). Put back whatever they change. When step 1 reviews the ticket branch,
                 this worktree is on the old commit: run them, and step 4's app, in a detached copy instead (git
                 worktree add --detach <scratch> ${{agent.worktree_branch}}, <scratch> a new folder outside the repo,
                 set up as the repo's AGENTS.md says) and remove it afterwards (git worktree remove --force <scratch>).
              4. UI work (tag ui, the ticket's tags: ${{ticket.tags}}; or the diff changes pages, components or
                 styles): follow skill ui-review. The fix agent's comments link screenshots of every changed page,
                 before and after, in light and dark mode at 1920, 1440 and 390 px wide (ticket attachments): read
                 them. Then start the app in this worktree as the repo's AGENTS.md says, take your own after
                 screenshots into a scratch folder outside the repo and read them. Missing screenshots, or a visible
                 problem in either set, is blocking. An app that won't start here: say why in the outcome.
              5. Blocking: the merge would put a bug, a decision the owner didn't make or unfinished work on main.
                 Comment the findings, each with file and line, what is wrong and what would fix it, then
                 lotar task edit ${{ticket.id}} --tag review-blocked. The fix agent reworks it once; a second
                 blocking review goes to the owner.
              6. Minor (real, but the merge can go ahead): file each as a ticket in its repo, related to
                 ${{ticket.id}} (skill lotar-workflow). Noise and taste: leave out.
              7. Don't end your turn while checks still run: the job ends with your turn. Comment the outcome, starting
                 "Review: passed" or "Review: blocking": what you read and reran, the findings, the tickets filed.
    - name: "Fix done: review on Claude"
      when:
        all:
          - assignee: "@fix-retry"
          - not: { tags: { any: [waits] } }
      on:
        job_completed:
          set:
            assignee: "@review-claude"
            status: Reviewing
          agent: *review
    - name: "Fix done: light review"
      when:
        all:
          - assignee: "@fix-light"
          - not: { tags: { any: [waits] } }
      on:
        job_completed:
          set:
            assignee: "@review-light"
            status: Reviewing
          agent: *review
    # A research job that committed a write-up: no code review, a light check that its claims have sources on the
    # cheap model (STD-305), then "Review passed: merge". One that answered in a comment set HelpNeeded and mallox
    # itself, which replaces these, so no check starts.
    - name: "Research done: source check"
      when:
        assignee: "@research"
      on:
        job_completed:
          set:
            assignee: "@review-light"
            status: Reviewing
          agent: &source-check
            session: fresh
            prompt: |
              Check the write-up for Research ticket ${{ticket.id}} ("${{ticket.title}}") before it lands on main. A
              research agent committed it on your worktree's branch; you didn't write it. Run lotar with
              LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Change no files, commit nothing and leave
              status and assignee as they are: when your job ends the rules send it on by tag review-blocked. You run
              headless: nobody reads this session, so never ask in it; what you find goes into the ticket's comments.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. The work: git log <main>..HEAD and its diff, main being the main checkout's branch (git -C <root>
                 branch --show-current, <root> the first entry of git worktree list). No commits: comment "Review:
                 nothing to review" and stop.
              2. A light check, not a code review: the commits change only docs/research/*.md (and .tasks); each fact
                 it states (a release, version, price, limit, what a tool does) names its source, a link; it ends with
                 one recommendation and its cost. Open the sources the recommendation rests on: they must say it.
              3. Blocking: another file changed, a fact without a source, or a source that says otherwise. Comment
                 each with file and line, then lotar task edit ${{ticket.id}} --tag review-blocked. Taste and wording
                 aren't findings.
              4. Comment the outcome, starting "Review: passed" or "Review: blocking": what you read, the findings.
    # A fix job that ends waiting for another ticket (tag waits, from the fix and work prompts) gets no review: it goes
    # Blocked on its fix profile, and "Prerequisites done" continues it there, then the review follows. Without the tag
    # it went to @review, whose job lotar parked Blocked; after the unblock tell_agent ran the fix as @review, whose end
    # merged it unreviewed (STD-207). The tag, not the status: a status the job sets applies only after its end rules.
    - name: "Fix waits: Blocked until its prerequisites are done"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-retry"
          - tags: { any: [waits] }
      on:
        job_completed:
          set:
            status: Blocked
    - name: "Review lifecycle"
      when:
        any:
          - assignee: "@review"
          - assignee: "@review-claude"
          - assignee: "@review-light"
      on:
        job_started:
          set:
            status: Reviewing
    # Only a passed review merges (owner 2026-11-15, STD-133: "no merges without review"). In a repo whose
    # .tasks/config.yml has agent.merge, lotar merges itself and starts @merge only for what needs judgment, always in
    # a fresh session with its comment before this prompt (lotar DEV-605, owner 2026-11-15, STD-188). session: continue
    # counts only without agent.merge (or untrusted): the merge continues the reviewer's session when it ran on
    # @merge's runner (Claude, lotar DEV-565), in the fix branch's worktree (owner 2026-11-11,
    # docs/decisions/2026-11-11-merge-in-fix-thread.md, STD-47); after a Codex review it starts a session of its own
    # (STD-124). Headless either way. Not the ticket's model fields.
    - name: "Review passed: merge"
      when:
        all:
          - any:
              - assignee: "@review"
              - assignee: "@review-claude"
              - assignee: "@review-light"
          - not: { tags: { any: [review-blocked] } }
      on:
        job_completed:
          set: &merging
            assignee: "@merge"
            status: Merging
          agent:
            session: continue
            prompt: &merge-prompt |
              Merge the work for ticket ${{ticket.id}} ("${{ticket.title}}") into the main checkout (<root>, the
              first entry of git worktree list). When this session did the review, this turn is the merge: it
              replaces the earlier "Change no files". Your worktree's branch holds the fix agent's commits. Run lotar
              with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). You run headless: nobody reads this
              session, so never ask in it. To hand back, comment one question, set the status to HelpNeeded, assign
              the ticket to mallox and stop: that files it in his inbox.
              When lotar's own merge handed off (its comment comes before this prompt), it ran these steps until one
              needed judgment: start at that step, keep what it landed, and redo no step it finished.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. Main is the main checkout's current branch (git -C <root> branch --show-current). When the ticket
                 branch has commits HEAD lacks (git log HEAD..${{agent.worktree_branch}}) and its last commit is newer
                 (git log -1 --format=%cI), this worktree holds the version before a rework, which the review blocked
                 (STD-151): git reset --keep ${{agent.worktree_branch}} (the old commit stays in the reflog); refused:
                 hand back. No commits beyond main (git log <main>..HEAD): comment "nothing to merge" and
                 stop.
              2. Rebase onto main. Resolve a conflict only when you are certain both sides' intent is kept (for
                 example separate hunks in a list); otherwise git rebase --abort, comment the conflicting files and
                 what each side wanted, and hand back.
                 Then, when ~/Development/standards/repos.json gives this repo an "install" (npm ci), run it in your
                 worktree, without asking, so the checks run on the rebased lockfile (lotar DEV-556). It fails: hand
                 back.
              3. Run the checks this repo's AGENTS.md names (agent.merge checks in .tasks/config.yml, where set), in
                 your worktree: the full suites, which only the merge runs (owner 2026-11-22, lotar DEV-797). One
                 fails: hand back.
                 Skip a check the fix or rework comment says passed on the commit that is still HEAD (the rebase
                 changed nothing: same hash before and after), and name it as skipped in your comment.
              4. git -C <root> merge --ff-only <your branch>. Main moved on: back to step 2. Refused
                 because of uncommitted changes in the main checkout: hand back. Then the lotar files: when
                 git -C <root> status --short .tasks lists changes (tickets and config, also other tickets'), and
                 git -C <root> log -1 is still the last commit you merged, git -C <root> add .tasks and
                 git -C <root> commit --amend --no-edit -- .tasks: they belong to no ticket (owner 2026-11-12).
                 Nothing else: never stash, reset, commit other files or check out anything in the main checkout.
              5. The merged commits change rules or agent profiles (git -C <root> diff --name-only <main before
                 step 4>..<main> -- .tasks/automation.yml '.tasks/*/automation.yml' .tasks/config.yml
                 '.tasks/*/config.yml' lists a file): run lotar trust in <root> (the owner lets agents trust,
                 2026-11-11), else lotar skips the rules' run commands; lotar trust --status there must say Trusted.
              6. Push only if ~/Development/standards/repos.json lists this repo with "push": true, and only
                 finished work (owner 2026-11-12): the main checkout is clean (git -C <root> status --short lists
                 nothing), and no unpushed commit (git -C <root> log @{u}..) belongs to work still in progress (another
                 ticket InProgress, a session still working in the main checkout). Then git -C <root> push, also
                 others' finished commits. One unfinished: push the commits before it, git -C <root> push origin
                 <sha>:<main>, and comment what waits. Never with --no-verify. Refused: hand back.
              7. A health ticket names check commands (one per finding in a day's bundle): run each again; none may
                 still list its finding.
              8. Comment the outcome: the commits merged, pushed or why not, trusted or not, the checks that ran. The
                 ticket goes to Done when your job ends (a Research ticket: to mallox with its question).
    # A failed review job (a crash) doesn't merge: until 2026-11-15 it merged without a review, and FND-3, STD-128 and
    # LOCA-326 reached main unreviewed (owner 2026-11-15, STD-133: "no merges without review"). It waits for mallox. A
    # review that tagged review-blocked and then failed goes the blocked way below (STD-139). A usage limit (Codex on
    # 2026-11-15) no longer fails a job: it pauses ("Job paused: comment once" below).
    - name: "Review failed: hand to mallox"
      when:
        all:
          - any:
              - assignee: "@review"
              - assignee: "@review-claude"
              - assignee: "@review-light"
          - not: { tags: { any: [review-blocked] } }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          run: >-
            env LOTAR_DEFAULT_REPORTER=automation sh -c 'node "$HOME/Development/standards/scripts/repos.ts" --asked
            "$1" "$3" || lotar comment "$1" --question "$2" --option "fix: An agent checks the branch and sends it to
            review again" --set "fix:assignee=@fix" --option "self: I merge it myself" --set "self:status=InProgress"
            --option "wontdo: WontDo" --set "wontdo:status=WontDo" --set "wontdo:assignee="; node
            "$HOME/Development/standards/scripts/repos.ts" --inbox "$1"' sh ${{ticket.id}} "The review job
            ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}), so the work on branch
            ${{agent.worktree_branch}} isn't merged without a review. Review again, merge it yourself, or WontDo?"
            ${{agent.job_id}}
    # Blocking findings go back to the author's profile, as the next turn of its own T3 thread, not the reviewer's
    # (lotar 0.15.0, DEV-472; owner 2026-11-13, STD-88). Twice, then the third blocking review asks mallox: his answer
    # was "fix" 9 times out of 9 (owner 2026-11-15, STD-156, docs/decisions/2026-11-15-inbox-triage.md). Tag
    # review-returned marks one rework, review-returned-twice the second. Also when the review job failed after it
    # tagged review-blocked (STD-139).
    - name: "Review blocked: back to @fix"
      when:
        all:
          - assignee: "@review"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
      on:
        job_completed: &back-to-fix
          set:
            assignee: "@fix"
          add: &returned
            tags: [review-returned]
          remove: &unblocked
            tags: [review-blocked]
          agent: &rework
            # The continued thread keeps its model; these pick the model of a new one when that thread is gone.
            session: continue
            thread_name: "${{ticket.id}} rework: ${{ticket.title}}"
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: |
              The review of ticket ${{ticket.id}} ("${{ticket.title}}") found blocking problems: its last comments name
              them. Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Your worktree's
              branch holds the earlier commits (git log <main>..HEAD): build on them.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. First check the review read your branch's HEAD (git log -1 --format=%h): its comment names the commit
                 or quotes the code it read. It read an older commit (INBOX-260, STD-156): change nothing, comment
                 "Review read <its commit>, not HEAD <hash>: review again", take back this round's tag so it doesn't
                 count (lotar task edit ${{ticket.id}} --untag review-returned-twice when the ticket has it, else
                 --untag review-returned) and end your turn; the review runs again. Otherwise fix each finding the
                 way this repo's AGENTS.md says, with targeted tests and checks for what you change (the merge runs
                 the full suites), or answer in a comment why it isn't a problem. Never delete or discard work that
                 isn't saved elsewhere. A finding only the owner can decide: comment one question, set the status to
                 HelpNeeded, assign the ticket to mallox and stop.
                 He answers in this thread, also while your job still runs: finish steps 2 and 3, then start the
                 review with lotar automation run "Answered in the thread: review on Codex" --select 'id:${{ticket.id}}'
                 (you on Claude Sonnet: "... light review"; on Codex: "... review on Claude"). The rule skips a ticket
                 an agent still holds; then the job's end moves it on.
              2. Amend the earlier commit (it isn't pushed), signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push.
              3. Don't end your turn while tests still run. Comment the outcome: what you did about each finding, the
                 commit hash, the checks that ran. When your job ends the work is reviewed again.
        job_failed: *back-to-fix
    - name: "Review blocked: back to @fix-retry"
      when:
        all:
          - assignee: "@review-claude"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
      on:
        job_completed: &back-to-fix-retry
          set:
            assignee: "@fix-retry"
          add: *returned
          remove: *unblocked
          agent: *rework
        job_failed: *back-to-fix-retry
    - name: "Review blocked: back to @fix-light"
      when:
        all:
          - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
          - not: { type: Research }
      on:
        job_completed: &back-to-fix-light
          set:
            assignee: "@fix-light"
          add: *returned
          remove: *unblocked
          agent: *rework
        job_failed: *back-to-fix-light
    # A blocked source check goes back to the research agent, as the next turn of its thread (STD-305), with a prompt of
    # its own: the code rework's would start a code review after his answer in the thread (STD-307).
    - name: "Research check blocked: back to @research"
      when:
        all:
          - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
          - type: Research
      on:
        job_completed: &back-to-research
          set:
            assignee: "@research"
          add: *returned
          remove: *unblocked
          agent: &research-rework
            session: continue
            thread_name: "${{ticket.id}} rework: ${{ticket.title}}"
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: |
              The source check of Research ticket ${{ticket.id}} ("${{ticket.title}}") found blocking problems: its last
              comments name them. Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Your
              worktree's branch holds the write-up commit (git log <main>..HEAD): build on it.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. First check the check read your branch's HEAD (git log -1 --format=%h): its comment names the commit
                 or quotes the text it read. It read an older commit: change nothing, comment "Review read <its
                 commit>, not HEAD <hash>: review again", take back this round's tag (lotar task edit ${{ticket.id}}
                 --untag review-returned-twice when the ticket has it, else --untag review-returned) and end your turn;
                 the check runs again. Otherwise fix each finding in the write-up under docs/research, checking the
                 fact on the web with its source, or answer in a comment why it isn't one. Change no other file. Never
                 delete or discard work that isn't saved elsewhere. A finding only the owner can decide: comment one
                 question, set the status to HelpNeeded, assign the ticket to mallox and stop.
                 He answers in this thread, also while your job still runs: finish steps 2 and 3, then start the
                 check with lotar automation run "Answered in the thread: source check" --select 'id:${{ticket.id}}',
                 never a review rule. The rule skips a ticket an agent still holds; then the job's end moves it on.
              2. Amend the write-up commit (it isn't pushed), signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push.
              3. Comment the outcome: what you did about each finding, the commit hash. Leave status and assignee:
                 when your job ends the source check runs again.
        job_failed: *back-to-research
    - name: "Review blocked again: rework on @fix"
      when:
        all:
          - assignee: "@review"
          - tags: { any: [review-blocked] }
          - tags: { any: [review-returned] }
          - not: { tags: { any: [review-returned-twice] } }
      on:
        job_completed: &again-to-fix
          set:
            assignee: "@fix"
          add: &returned-twice
            tags: [review-returned-twice]
          remove: *unblocked
          agent: *rework
        job_failed: *again-to-fix
    - name: "Review blocked again: rework on @fix-retry"
      when:
        all:
          - assignee: "@review-claude"
          - tags: { any: [review-blocked] }
          - tags: { any: [review-returned] }
          - not: { tags: { any: [review-returned-twice] } }
      on:
        job_completed: &again-to-fix-retry
          set:
            assignee: "@fix-retry"
          add: *returned-twice
          remove: *unblocked
          agent: *rework
        job_failed: *again-to-fix-retry
    - name: "Review blocked again: rework on @fix-light"
      when:
        all:
          - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - tags: { any: [review-returned] }
          - not: { tags: { any: [review-returned-twice] } }
          - not: { type: Research }
      on:
        job_completed: &again-to-fix-light
          set:
            assignee: "@fix-light"
          add: *returned-twice
          remove: *unblocked
          agent: *rework
        job_failed: *again-to-fix-light
    - name: "Research check blocked again: rework on @research"
      when:
        all:
          - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - tags: { any: [review-returned] }
          - not: { tags: { any: [review-returned-twice] } }
          - type: Research
      on:
        job_completed: &again-to-research
          set:
            assignee: "@research"
          add: *returned-twice
          remove: *unblocked
          agent: *research-rework
        job_failed: *again-to-research
    # The triage writes what each round fixed and whether the findings converge into his inbox ticket (inbox.yml).
    - name: "Review blocked a third time: hand to mallox"
      when:
        all:
          - any:
              - assignee: "@review"
              - assignee: "@review-claude"
              - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - tags: { any: [review-returned-twice] }
      on:
        job_completed: &to-mallox
          set:
            status: HelpNeeded
            assignee: mallox
          # Only a new blocking review sets it again, so a pass after the owner's rework merges (STD-93).
          remove: *unblocked
          # A question comment (lotar 0.15): a rule's comment is plain text, so the run asks it, then files the ticket
          # in the inbox itself (a rule's own change fires no other rule). Each option sets what it means (STD-100).
          run: >-
            env LOTAR_DEFAULT_REPORTER=automation sh -c 'lotar comment "$1" --question "$2" --option "fix: An agent
            reworks it once more" --set "fix:assignee=@fix" --option "decide: I decide the findings (say how)"
            --option "wontdo: WontDo" --set "wontdo:status=WontDo" --set "wontdo:assignee="; node
            "$HOME/Development/standards/scripts/repos.ts" --inbox "$1"' sh ${{ticket.id}} "The review found blocking
            problems a third time, after two reworks (the comments above). Rework, your decision on the findings, or
            WontDo?"
        job_failed: *to-mallox
    # A failed fix job goes to @fix-retry once before it waits for mallox (owner 2026-11-12, STD-55): STD-18's job
    # failed only because the agent ended its turn while the commit hook ran. The retry keeps the branch and runs on
    # the profile's model, not the ticket's fields. Tag fix-retried sends a second failure to mallox. A rate or usage
    # limit doesn't get here: the job pauses and reruns on its own profile after the reset ("Job paused: comment once"),
    # so no retry hits the limit again (owner 2026-11-16, INBOX-379: "don't retry a job that failed on a rate limit").
    # A job whose agent asked mallox ends with him: his hand-back replaces set.assignee, so no retry starts, and the run
    # leaves no retry comment over his question and takes the tag off again (repos.ts --asked, STD-320).
    - name: "Fix failed: retry on @fix-retry"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
          - tags: { any: [health] }
          - not: { tags: { any: [fix-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix-retry"
          add:
            tags: [fix-retried]
          run: &fix-retry >-
            env LOTAR_DEFAULT_REPORTER=automation sh -c 'if node "$HOME/Development/standards/scripts/repos.ts" --asked
            "$1" "$2"; then lotar task edit "$1" --untag fix-retried; else lotar comment "$1" -m "$3"; fi' sh
            ${{ticket.id}} ${{agent.job_id}} "The fix agent's job ${{agent.job_id}} failed (lotar agent logs
            ${{agent.job_id}}); @fix-retry retries it on branch ${{agent.worktree_branch}}."
          agent:
            prompt: *fix-prompt
    - name: "Fix failed: retry an agent ticket on @fix-retry"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
          - not: { tags: { any: [health, fix-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix-retry"
          add:
            tags: [fix-retried]
          run: *fix-retry
          agent:
            prompt: *work-prompt
    # A retry, or a @fix-retry job (only retries start one). It asks a question: repos.ts reports a
    # HelpNeeded ticket whose last comment asks none (check question). Not when the job's agent asked him already
    # (repos.ts --asked): his hand-back is the job's outcome, and the retry options replaced its question (STD-306).
    - name: "Fix failed again: hand to mallox"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-retry"
          - any:
              - assignee: "@fix-retry"
              - tags: { any: [fix-retried] }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          run: >-
            env LOTAR_DEFAULT_REPORTER=automation sh -c 'node "$HOME/Development/standards/scripts/repos.ts" --asked
            "$1" "$3" || lotar comment "$1" --question "$2" --option "fix: Retry with @fix" --set "fix:assignee=@fix"
            --option "fix-fable: Retry with @fix-fable" --set "fix-fable:assignee=@fix-fable" --option "fix-retry: Retry
            with @fix-retry" --set "fix-retry:assignee=@fix-retry" --option "wontdo: WontDo" --set
            "wontdo:status=WontDo" --set "wontdo:assignee="; node "$HOME/Development/standards/scripts/repos.ts" --inbox
            "$1"' sh ${{ticket.id}} "The fix agent's job ${{agent.job_id}} failed again (lotar agent logs
            ${{agent.job_id}}). Retry with which agent, or WontDo?" ${{agent.job_id}}
    # A failed research job asks mallox at once: it changed no code a retry would keep (STD-305). Not when the
    # research agent asked him already (repos.ts --asked, STD-306).
    - name: "Research failed: hand to mallox"
      when:
        assignee: "@research"
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          run: >-
            env LOTAR_DEFAULT_REPORTER=automation sh -c 'node "$HOME/Development/standards/scripts/repos.ts" --asked
            "$1" "$3" || lotar comment "$1" --question "$2" --option "research: Retry with @research" --set
            "research:assignee=@research" --option "wontdo: WontDo" --set "wontdo:status=WontDo" --set
            "wontdo:assignee="; node "$HOME/Development/standards/scripts/repos.ts" --inbox "$1"' sh ${{ticket.id}}
            "The research agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}). Retry with
            @research, or WontDo?" ${{agent.job_id}}
    # A merge agent that stops for a conflict or a failing check hands the ticket to mallox itself; the retry goes to
    # the fix agent, whose branch the next merge picks up.
    - name: "Merge agent lifecycle"
      when:
        all:
          - assignee: "@merge"
          - not: { type: Research }
      on:
        job_started: &merging-status
          set:
            status: Merging
        job_completed:
          set:
            status: Done
          # A rule's own change doesn't fire the "clear the tags" rule below.
          remove: &done-tags
            tags: [merge-retried, fix-retried, review-blocked, review-returned, review-returned-twice, retry-fix,
              retry-fable, job-paused]
    # A merged write-up is on main: the research agent's question goes to mallox (STD-305). Its question comment stays
    # open after the check's and the merge's comments, so the inbox asks it. A rule's own change fires no other rule:
    # this one files the inbox ticket itself.
    - name: "Research merged: the question goes to mallox"
      when:
        all:
          - assignee: "@merge"
          - type: Research
      on:
        job_started: *merging-status
        job_completed:
          set:
            status: HelpNeeded
            assignee: mallox
          remove: *done-tags
          run: *inbox
    # A failed merge job (a crash, or a false failure like DEV-342's) goes back to the fix agent once, which ends with
    # nothing to do when the work is on main already; tag merge-retried sends a second failure to mallox, so fix,
    # merge, fail can't loop (owner 2026-11-11, STD-46). A Research ticket's goes to @research instead (below): the fix
# agent would find nothing to do, set Done and drop the question for mallox (STD-307).
    - name: "Merge failed: retry with @fix"
      when:
        all:
          - assignee: "@merge"
          - tags: { any: [health] }
          - not: { tags: { any: [merge-retried] } }
          - not: { type: Research }
      on:
        job_failed:
          set:
            assignee: "@fix"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the fix agent retries
            it on branch ${{agent.worktree_branch}}.
          agent: *fix
    - name: "Merge failed: retry an agent ticket with @fix"
      when:
        all:
          - assignee: "@merge"
          - not: { tags: { any: [health, merge-retried] } }
          - not: { type: Research }
      on:
        job_failed:
          set:
            assignee: "@fix"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the fix agent retries
            it on branch ${{agent.worktree_branch}}.
          agent: *work
    # Its job's end runs "Research done: source check", then the merge again; a second failure goes to mallox below.
    - name: "Research merge failed: retry with @research"
      when:
        all:
          - assignee: "@merge"
          - type: Research
          - not: { tags: { any: [merge-retried] } }
      on:
        job_failed:
          set:
            assignee: "@research"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the research agent
            retries it on branch ${{agent.worktree_branch}}.
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: |
              The merge of Research ticket ${{ticket.id}} ("${{ticket.title}}") failed: the merge agent's job
              ${{agent.job_id}} (lotar agent logs ${{agent.job_id}}, and the ticket's last comments). Run lotar with
              LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Your worktree's branch holds the
              write-up commit. Change no code: only the write-up under docs/research.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              1. Main is the main checkout's branch (git -C <root> branch --show-current, <root> the first entry of
                 git worktree list). The write-up is on main already (git log <main>..HEAD lists nothing, or the
                 file on main is the one you wrote): comment that in one line, set the status to HelpNeeded, assign
                 the ticket to mallox and stop. Its question comment stands; never set Done.
              2. Otherwise rebase onto main, fix what failed and amend the write-up commit, signed, never with
                 --no-verify, message "${{ticket.id}} ${{ticket.title}}"; don't merge or push. Never delete or discard work that
                 isn't saved elsewhere. What only the owner can decide: comment one question, set the status to
                 HelpNeeded, assign the ticket to mallox and stop.
              3. Comment the outcome: what failed, what you changed, the commit hash. Leave status and assignee:
                 when your job ends the source check and the merge run again.
    - name: "Merge failed again: hand to mallox"
      when:
        all:
          - assignee: "@merge"
          - tags: { any: [merge-retried] }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          run: >-
            env LOTAR_DEFAULT_REPORTER=automation sh -c 'node "$HOME/Development/standards/scripts/repos.ts" --asked
            "$1" "$3" || lotar comment "$1" --question "$2" --option "fix: Retry with @fix" --set "fix:assignee=@fix"
            --option "self: I merge it myself" --set "self:status=InProgress"; node
            "$HOME/Development/standards/scripts/repos.ts" --inbox "$1"' sh ${{ticket.id}} "The merge agent's job
            ${{agent.job_id}} failed again (lotar agent logs ${{agent.job_id}}). The fix is on branch
            ${{agent.worktree_branch}}. Retry with @fix, or will you merge it yourself?" ${{agent.job_id}}
    # A job that stops on its provider's usage or rate limit, or on a paused queue (commit signing, a full disk), pauses
    # instead of failing (lotar DEV-584; t3 jobs since 0.15.6): no job_failed rule runs, the ticket keeps its status and
    # assignee, and the job reruns on the same profile once the limit resets or the pause ends. So nobody is asked; one
    # comment says so (STD-246). Tag job-paused keeps a pause that repeats, or a later job's, quiet until the ticket is done.
    - name: "Job paused: comment once"
      when:
        not: { tags: { any: [job-paused] } }
      on:
        job_paused:
          add:
            tags: [job-paused]
          comment: >-
            Paused, not failed: the job ${{agent.job_id}} (${{agent.profile}}) stopped on a usage limit or a paused
            queue and runs again by itself, on a usage limit at its reset. Nobody needs to act; lotar agent list-jobs
            shows when it resumes, lotar agent logs ${{agent.job_id}} why.
    # Not "and tagged": on updated every field condition needs that field to change in the same update.
    - name: "Retries: clear the tags when done"
      when:
        status: Done
      on:
        updated:
          remove: *done-tags
    # A ticket that waits for others is Blocked and depends on them. When the last one is done its agent continues
    # (owner 2026-11-12, STD-56: "when a ticket the blocks other tickets is done, it should automatically kick of
    # agents for those tickets"). tell_agent queues the message to a running job, else starts @fix as the next turn of
    # the ticket's last T3 thread; agent: fix, because a ticket a merge agent handed back was last assigned to @merge
    # (lotar DEV-396). Proposals and owner tickets wait for him. A prerequisite in another repo (lotar:DEV-374) can't
    # notify this one: the daily repos.ts --fix runs this rule in every repo (lotar automation run <name>). No manual
    # action: a manual run would start every Blocked ticket.
    - name: "Prerequisites done: continue the waiting ticket"
      when:
        all:
          - status: Blocked
          - not: { tags: { any: [proposal, owner] } }
      on:
        unblocked:
          remove: &waits
            tags: [waits]
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
          tell_agent:
            agent: fix
            message: |
              Ticket ${{ticket.id}} ("${{ticket.title}}") waited for ${{unblocked.by}}, which is done now. Run lotar
              with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and its comments:
              what it waited to do and what done looks like.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              - It waited only to run a check against a lotar release ("Release v..."): that release is installed
                now, lotar --version prints it. Run the check. It passes: change no files, comment the check and its
                result, then lotar status ${{ticket.id}} Done and lotar assignee ${{ticket.id}} --clear, and stop.
                It still fails: comment what you ran and what still fails, set the status to HelpNeeded, assign the
                ticket to mallox and stop. Don't fix it in this job: the owner decides what comes next.
              - Otherwise continue the ticket from where it stopped, the way this repo's AGENTS.md says, with targeted
                tests for what you change (the merge runs the full suites). Commit on
                your worktree's branch, signed, never with --no-verify, message "${{ticket.id}} ${{ticket.title}}";
                don't merge or push: the merge agent does that when your job ends. Don't end your turn while tests
                still run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              Never delete work that isn't saved elsewhere, and never decide what only the owner decides: then
              comment one question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # The owner's comment on any ticket reaches its agent (owner 2026-11-12, STD-56: "a comment on any tickets kicks of
    # or queues for an agent, then we should do that as well. Let's do it right from the start"): queued to a running
    # job, else @fix starts with it as the next turn of the ticket's last T3 thread. Only his comments, and the inbox
    # triage agent's answers for him (STD-54): an agent's own would come back to it. An answer that changes nothing
    # sets status and assignee back, so no merge follows. His comment closes the ticket's inbox ticket (repos.ts
    # --inbox): the job it starts sets the status by rule, which fires no other rule (STD-101).
    - name: "Comments: the owner's comment reaches the agent"
      when:
        all:
          - comment: { author: [mallox, triage] }
          # Not an answer that chose options and so left the ticket where no agent acts: closed, or InProgress with
          # him (the questions above: WontDo, "I merge it myself"). The resulting state, not the option keys: any
          # question may use any key (STD-100). His own words still reach the agent.
          - not:
              all:
                - not: { comment: { answer: { exists: false } } }
                - any:
                    - current: { status: [Done, WontDo] }
                    - current: { all: [{ status: InProgress }, { assignee: mallox }] }
      on:
        commented:
          run: *inbox
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
          tell_agent:
            agent: fix
            message: |
              ${{comment.author}} commented on ticket ${{ticket.id}} ("${{ticket.title}}"), which was ${{ticket.status}}
              and assigned to "${{ticket.assignee}}" (mallox is the owner; triage answers for him from what he decided
              before and names where the answer comes from):
              ${{comment.text}}
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and act on
              his comment:
              - The ticket was InProgress, Reviewing or Merging with an agent (@...) as assignee: this is a further
                turn of the job that runs on it. Answer in a comment, change the work as he asks and carry on as before.
              - It answers what the ticket waits for, or asks for a change: do the work the way this repo's AGENTS.md
                says, with targeted tests for what you change (the merge runs the full suites). Commit on your
                worktree's branch, signed, never with --no-verify, message "${{ticket.id}} ${{ticket.title}}"; don't
                merge or push: the merge agent does that when your job ends. Don't end your turn while tests still
                run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              - It shows the done criteria are met and nothing is left to do (a triage comment, for example): comment
                the evidence in one line, then lotar status ${{ticket.id}} Done and lotar assignee ${{ticket.id}}
                --clear; setting it back would keep it open and the inbox would report it again.
              - Otherwise it asks something or needs no change: answer in one comment, then set the status back to
                ${{ticket.status}} and the assignee back to "${{ticket.assignee}}" (empty: lotar assignee ${{ticket.id}}
                --clear), so no merge follows.
              Never delete work that isn't saved elsewhere, and never decide what only he decides: then comment one
              question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # What waits for the owner goes to his inbox, project INBOX in standards (owner 2026-11-12, STD-54,
    # docs/decisions/2026-11-12-owner-inbox.md): HelpNeeded with assignee mallox, in either order, or tag owner, also
    # when a ticket with tag owner comes back to mallox (G-26 went from @fix to mallox in Todo, STD-234). A status an
    # agent sets during its job fires these rules when the job ends; the live check (repos.ts --live --report, every 5
    # minutes) files what a rule's own change set or a skipped rule missed.
    - name: "Inbox: file what waits for the owner"
      when:
        any:
          - all:
              - status: HelpNeeded
              - current: { assignee: mallox }
          - all:
              - assignee: mallox
              - current: { status: HelpNeeded }
          - all:
              - assignee: mallox
              - current: { tags: { any: [owner] } }
          - tags: { any: [owner] }
      on:
        created:
          run: *inbox
        updated:
          run: *inbox
    # Its inbox ticket closes as soon as the ticket leaves HelpNeeded, also when he answered in the agent's thread and
    # not on a ticket (STD-101), or leaves him: his answer that sets @fix keeps it HelpNeeded until the job starts
    # (INBOX-268, STD-156). --inbox leaves it open while the ticket still waits (tag owner).
    - name: "Inbox: close what no longer waits"
      when:
        any:
          - changes:
              status: { from: HelpNeeded }
          - changes:
              assignee: { from: mallox }
      on:
        updated:
          run: *inbox
    # Manual: after answering a HelpNeeded question or a failed job. Always pass --select, or every waiting ticket starts.
    - name: "Health: retry with @fix"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix"
          agent: *fix
    - name: "Health: retry with @fix-fable"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix-fable"
          agent: *fix
    - name: "Health: retry with @fix-retry"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix-retry"
          agent: *fix
    # Manual: the owner answered in the agent's T3 thread after its job had ended (it handed the ticket back), and the
    # agent finished the work there. No job ends then, so no "Fix done" rule fires (STD-109, LOCA-319). The agent runs
    # the one for its own model, as its prompt says: on Codex after Claude, on Claude after Codex, light after Sonnet.
    # Always pass --select.
    - name: "Answered in the thread: review on Codex"
      when: &answered
        all:
          - any:
              - status: InProgress
              - status: HelpNeeded
          - not: { assignee: "@agent" }
      on:
        manual:
          set:
            assignee: "@review"
            status: Reviewing
          agent: *review
          # A rule's own change fires no other rule: this one closes the inbox ticket itself.
          run: *inbox
    - name: "Answered in the thread: review on Claude"
      when: *answered
      on:
        manual:
          set:
            assignee: "@review-claude"
            status: Reviewing
          agent: *review
          run: *inbox
    - name: "Answered in the thread: light review"
      when: *answered
      on:
        manual:
          set:
            assignee: "@review-light"
            status: Reviewing
          agent: *review
          run: *inbox
    # A Research write-up reworked after his answer in the thread gets the source check, not a code review (STD-307).
    - name: "Answered in the thread: source check"
      when:
        all:
          - type: Research
          - any:
              - status: InProgress
              - status: HelpNeeded
          - not: { assignee: "@agent" }
      on:
        manual:
          set:
            assignee: "@review-light"
            status: Reviewing
          agent: *source-check
          run: *inbox
    # Manual: the live check restarts a ticket stalled between agent steps (owner 2026-11-15, STD-167: "yes, build the
    # STD-113 recovery"; docs/decisions/2026-11-15-stall-recovery.md). repos.ts --live --report picks the step and runs
    # one of these, or the "Answered in the thread" rules above for a review. tell_agent keeps the assignee and starts
    # it as the next turn of its own thread, with the rule's prompt: assigning a profile by hand is what DEV-576 forbids.
    # Always pass --select.
    - name: "Stalled: restart the fix agent"
      when:
        all:
          - status: InProgress
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-retry"
          - not: { tags: { any: [health] } }
      on:
        manual:
          tell_agent:
            message: *work-prompt
    - name: "Stalled: restart the health fix agent"
      when:
        all:
          - status: InProgress
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-retry"
          - tags: { any: [health] }
      on:
        manual:
          tell_agent:
            message: *fix-prompt
    # A Blocked fix ticket whose prerequisites are all in its repo and done but whose unblocked event was lost: lotar
    # replays unblocked only across repos (lotar DEV-663), so repos.ts sets it InProgress and runs this, which keeps the
    # unblocked message and its release-check branch; the fix prompt would have it fix what the owner decides (STD-201).
    - name: "Stalled: continue the unblocked ticket"
      when:
        all:
          - status: InProgress
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-retry"
      on:
        manual:
          remove: *waits
          tell_agent:
            # The message of "Prerequisites done" with the prerequisites by ID: a manual run has no ${{unblocked.by}}.
            message: |
              Ticket ${{ticket.id}} ("${{ticket.title}}") waited for ${{ticket.relationships.depends_on[*]}}, which are
              done now: lotar task relationships ${{ticket.id}} shows their titles. Run lotar
              with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and its comments:
              what it waited to do and what done looks like.
              Comments in short markdown, for the owner reading on his phone: a one-line outcome, then bullets for
              findings or evidence, with paths, commands and hashes in backticks.
              - It waited only to run a check against a lotar release ("Release v..."): that release is installed
                now, lotar --version prints it. Run the check. It passes: change no files, comment the check and its
                result, then lotar status ${{ticket.id}} Done and lotar assignee ${{ticket.id}} --clear, and stop.
                It still fails: comment what you ran and what still fails, set the status to HelpNeeded, assign the
                ticket to mallox and stop. Don't fix it in this job: the owner decides what comes next.
              - Otherwise continue the ticket from where it stopped, the way this repo's AGENTS.md says, with targeted
                tests for what you change (the merge runs the full suites). Commit on
                your worktree's branch, signed, never with --no-verify, message "${{ticket.id}} ${{ticket.title}}";
                don't merge or push: the merge agent does that when your job ends. Don't end your turn while tests
                still run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              Never delete work that isn't saved elsewhere, and never decide what only the owner decides: then
              comment one question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # repos.ts runs it only after a "Review: passed" newer than the branch's last commit, and clears the assignee first:
    # a rule's set starts an agent only when the assignee changes.
    - name: "Stalled: merge after a passed review"
      when:
        all:
          - any:
              - status: InProgress
              - status: Reviewing
              - status: Merging
          - not: { assignee: "@agent" }
      on:
        manual:
          set: *merging
          agent:
            session: continue
            prompt: *merge-prompt
    # lotar's own rules follow.
    # Note on "Prerequisites done: continue the waiting ticket" above: a ticket whose job the dependency check held
    # back gets that job instead, as it was (DEV-530).
    # A ticket that starts to wait (HelpNeeded, Blocked) keeps only its dependencies' build output: cargo clean
    # --workspace drops target/debug/incremental and the workspace crates' artifacts (3.4 GB to 0.7 GB in DEV-653's
    # worktree), which the resumed job rebuilds in about a minute (owner 2026-11-18, DEV-653: "Yes, build the waiting-state
    # rule and run it on a real ticket"; this changes STD-95's "build output stays until Done" for waiting tickets).
    # It fires on a person's status change and on an agent's hand-back, applied once its job ended. Waits that a rule
    # or lotar sets fire no rule (rules that hand a ticket to mallox, a T3 thread waiting for an answer, Blocked on open
    # prerequisites): `agent.worktree.waiting_run` in DEV/config.yml runs the same command for those at the job's end
    # or the held-back start (DEV-712). The fix, review and merge steps keep their build output: the next
    # step reuses it (DEV-653's measurements). lotar runs nothing while a job runs for the ticket; a lotar without
    # `agent worktree run` (before DEV-653) fails it.
    - name: "Waiting: drop the workspace build output"
      when:
        any:
          - status: HelpNeeded
          - status: Blocked
      on:
        updated:
          run:
            command: lotar
            args: [agent, worktree, run, "${{ticket.id}}", --, cargo, clean, --workspace]
            ignore_failure: true
