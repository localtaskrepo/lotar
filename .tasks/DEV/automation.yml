# Source: standards configs/lotar/automation.yml. Repo-health tickets (tag health, filed by
# node ~/Development/standards/scripts/repos.ts --report) start a fix agent as a T3 Code thread; tag owner never does.
# So does a ticket an agent files without an assignee (owner 2026-11-11, skill lotar-workflow). Jobs run in worktrees;
# a finished fix job goes to @merge, which brings its branch into the main checkout (owner 2026-11-11, STD-35).
# Goes into each repo's .tasks/<PROJECT>/automation.yml; the repo's own rules follow below these. Setup, retries and
# the model choice: configs/lotar/README.md. No review status: the owner follows the agents in T3 (2026-11-11).
automation:
  rules:
    - name: "Health: start the fix agent"
      when:
        all:
          - tags: { any: [health] }
          - not: { tags: { any: [light] } }
      on:
        created:
          set:
            assignee: "@fix"
          # The ticket fields model and provider override the profile's (set both for another provider's model);
          # empty keeps the profile's.
          agent: &fix
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: &fix-prompt |
              Fix the repo problem in ticket ${{ticket.id}} ("${{ticket.title}}"). Run lotar with
              LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex): lotar records it as the comment's author.
              1. Read the ticket: what was found, how to check it, what done looks like. Run its check command. If the
                 problem is gone already, say so in a comment and stop. After a failed merge your branch may hold
                 earlier commits (git log <main>..HEAD): build on them.
              2. Fix it the way this repo's AGENTS.md says: the smallest change, with the tests and checks it names.
              3. Never delete or discard work that isn't saved elsewhere (unmerged commits, uncommitted changes,
                 files a tool or another session may still use), and never decide what only the owner decides.
                 Before asking him, ask the agents that are running (T3 threads, other sessions) what they know, and
                 file every bug you find in its repo (lotar add --finding). When the fix still needs him, comment one
                 question, set the status to HelpNeeded, assign the ticket to mallox (the owner) and stop.
              4. When you changed files: commit them on your worktree's branch, signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push: the merge agent does that, then reruns the
                 check command against the main checkout.
              5. Comment the outcome: what you changed, the commit hash, the checks that ran. When your job ends, the
                 merge agent takes over.
    - name: "Health: start the light fix agent"
      when:
        all:
          - tags: { any: [health] }
          - tags: { any: [light] }
      on:
        created:
          set:
            assignee: "@fix-light"
          agent: *fix
    # An agent's ticket nobody took: @fix works it. The filer assigns itself, the
    # owner (a question) or @fix-light (mechanical) instead when that fits; proposals, owner and recurring tickets wait.
    # A Change ticket (local's change records) belongs to the agent making that change.
    - name: "Agent tickets: start the fix agent"
      when:
        all:
          - any:
              - reporter: claude
              - reporter: codex
          - not: { assignee: "@any" }
          - not: { tags: { any: [health, proposal, owner, recurring] } }
          - not: { type: Change }
      on:
        created:
          set:
            assignee: "@fix"
          # Without a prompt the job runs on lotar's built-in instructions, which leave the changes uncommitted
          # (DEV-332, 2026-11-12).
          agent: &work
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: &work-prompt |
              Work ticket ${{ticket.id}} ("${{ticket.title}}"): read it and its relationships, then do it the way this
              repo's AGENTS.md says, with the tests and checks it names. Run lotar with LOTAR_DEFAULT_REPORTER set to
              your agent name (claude, codex). After a failed merge your branch may hold earlier commits
              (git log <main>..HEAD): build on them; when the work is done already, comment that and stop.
              1. Never delete or discard work that isn't saved elsewhere, and never decide what only the owner decides.
                 Ask the running agents (T3 threads) first; when it still needs him, comment one question, set the
                 status to HelpNeeded, assign the ticket to mallox and stop.
              2. Commit your changes on your worktree's branch, signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push: the merge agent does that.
              3. Don't end your turn while tests or other background work still run: the job ends with your turn.
              4. Comment the outcome: what you changed, the commit hash, the checks that ran. When your job ends, the
                 merge agent takes over.
    - name: "Health: fix agent lifecycle"
      when:
        any:
          - assignee: "@fix"
          - assignee: "@fix-light"
          - assignee: "@fix-fable"
          - assignee: "@fix-codex"
      on:
        job_started:
          set:
            status: InProgress
        # The merge runs as the next turn of the fix agent's T3 thread, in its worktree and on its model (owner
        # 2026-11-11, docs/decisions/2026-11-11-merge-in-fix-thread.md, STD-47); lotar before DEV-368 ignores
        # session and starts a thread of its own. Not the ticket's model fields: they pick the fix agent's model.
        job_completed:
          set:
            assignee: "@merge"
          agent:
            session: continue
            prompt: |
              Merge the work for ticket ${{ticket.id}} ("${{ticket.title}}") into the main checkout (<root>, the
              first entry of git worktree list). When this thread did the fix, this turn is the merge: it replaces
              the earlier "Don't merge or push". Your worktree's branch holds the fix agent's commits. Run lotar
              with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex).
              1. Main is the main checkout's current branch (git -C <root> branch --show-current). No commits
                 beyond main (git log <main>..HEAD): comment "nothing to merge" and stop.
              2. Rebase onto main. Resolve a conflict only when you are certain both sides' intent is kept (for
                 example separate hunks in a list); otherwise git rebase --abort, comment the conflicting files and
                 what each side wanted, set the status to HelpNeeded, assign the ticket to mallox and stop.
              3. Run the checks this repo's AGENTS.md names, in your worktree. One fails: hand back as in step 2.
              4. git -C <root> merge --ff-only <your branch>. Main moved on: back to step 2. Refused
                 because of uncommitted changes in the main checkout: hand back. Then the ticket files: when
                 git -C <root> status --short .tasks lists changes, git -C <root> add .tasks and
                 git -C <root> commit -m "${{ticket.id}} Ticket updates" -- .tasks (all of them, also other
                 tickets': they are a status update). Nothing else: never stash, reset, commit other files or check
                 out anything in the main checkout.
              5. Push only if ~/Development/standards/repos.json lists this repo with "push": true, and only
                 finished work (owner 2026-11-12): the main checkout is clean (git -C <root> status --short lists
                 nothing), and no unpushed commit (git -C <root> log @{u}..) belongs to work still in progress (another
                 ticket InProgress, a session still working in the main checkout). Then git -C <root> push, also
                 others' finished commits. One unfinished: push the commits before it, git -C <root> push origin
                 <sha>:<main>, and comment what waits. Never with --no-verify. Refused: hand back.
              6. A health ticket names a check command: run it again; it must no longer list the finding.
              7. Comment the outcome: the commits merged, pushed or why not, the checks that ran. The ticket goes
                 to Done when your job ends.
    # A failed fix job goes to @fix-codex once before it waits for mallox (owner 2026-11-12, STD-55): STD-18's job
    # failed only because the agent ended its turn while the commit hook ran. Codex, because it is another provider
    # and model: a Claude outage, rate limit or habit doesn't fail the retry too. The retry keeps the branch and runs on
    # the profile's model, not the ticket's fields. Tag fix-retried sends a second failure to mallox.
    - name: "Fix failed: retry on @fix-codex"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
          - tags: { any: [health] }
          - not: { tags: { any: [fix-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix-codex"
          add:
            tags: [fix-retried]
          comment: &fix-retry >-
            The fix agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); @fix-codex retries it on
            branch ${{agent.worktree_branch}}.
          agent:
            prompt: *fix-prompt
    - name: "Fix failed: retry an agent ticket on @fix-codex"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
          - not: { tags: { any: [health, fix-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix-codex"
          add:
            tags: [fix-retried]
          comment: *fix-retry
          agent:
            prompt: *work-prompt
    # A retry, or a @fix-codex job (only retries start one). The comment asks a question: repos.ts reports a
    # HelpNeeded ticket whose last comment asks none (check question).
    - name: "Fix failed again: hand to mallox"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-codex"
          - any:
              - assignee: "@fix-codex"
              - tags: { any: [fix-retried] }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          comment: >-
            The fix agent's job ${{agent.job_id}} failed again: lotar agent logs ${{agent.job_id}}. Should an agent try
            again (lotar automation run "Health: retry with @fix" --select 'id:${{ticket.id}}', or @fix-fable,
            @fix-codex; for an agent's ticket lotar assignee ${{ticket.id}} @fix), or is it WontDo?
    # A merge agent that stops for a conflict or a failing check hands the ticket to mallox itself; the retry goes to
    # the fix agent, whose branch the next merge picks up.
    - name: "Merge agent lifecycle"
      when:
        assignee: "@merge"
      on:
        job_started:
          set:
            status: InProgress
        job_completed:
          set:
            status: Done
          # A rule's own change doesn't fire the "clear the tags" rule below.
          remove:
            tags: [merge-retried, fix-retried]
    # A failed merge job (a crash, or a false failure like DEV-342's) goes back to the fix agent once, which ends with
    # nothing to do when the work is on main already; tag merge-retried sends a second failure to mallox, so fix,
    # merge, fail can't loop (owner 2026-11-11, STD-46).
    - name: "Merge failed: retry with @fix"
      when:
        all:
          - assignee: "@merge"
          - tags: { any: [health] }
          - not: { tags: { any: [merge-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the fix agent retries
            it on branch ${{agent.worktree_branch}}.
          agent: *fix
    - name: "Merge failed: retry an agent ticket with @fix"
      when:
        all:
          - assignee: "@merge"
          - not: { tags: { any: [health, merge-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the fix agent retries
            it on branch ${{agent.worktree_branch}}.
          agent: *work
    - name: "Merge failed again: hand to mallox"
      when:
        all:
          - assignee: "@merge"
          - tags: { any: [merge-retried] }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          comment: >-
            The merge agent's job ${{agent.job_id}} failed again: lotar agent logs ${{agent.job_id}}. The fix is on
            branch ${{agent.worktree_branch}}. Should an agent try again (lotar automation run "Health: retry with @fix"
            --select 'id:${{ticket.id}}', or for an agent's ticket lotar assignee ${{ticket.id}} @fix), or will you
            merge it yourself?
    # Not "and tagged": on updated every field condition needs that field to change in the same update.
    - name: "Retries: clear the tags when done"
      when:
        status: Done
      on:
        updated:
          remove:
            tags: [merge-retried, fix-retried]
    # A ticket that waits for others is Blocked and depends on them. When the last one is done its agent continues
    # (owner 2026-11-12, STD-56: "when a ticket the blocks other tickets is done, it should automatically kick of
    # agents for those tickets"). tell_agent queues the message to a running job, else starts @fix as the next turn of
    # the ticket's last T3 thread; agent: fix, because a ticket a merge agent handed back was last assigned to @merge
    # (lotar DEV-396). Proposals and owner tickets wait for him. A prerequisite in another repo (lotar:DEV-374) can't
    # notify this one: the daily repos.ts --fix runs this rule in every repo (lotar automation run <name>). No manual
    # action: a manual run would start every Blocked ticket.
    - name: "Prerequisites done: continue the waiting ticket"
      when:
        all:
          - status: Blocked
          - not: { tags: { any: [proposal, owner] } }
      on:
        unblocked:
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
          tell_agent:
            agent: fix
            message: |
              Ticket ${{ticket.id}} ("${{ticket.title}}") waited for ${{unblocked.by}}, which is done now. Run lotar
              with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and its comments:
              what it waited to do and what done looks like.
              - It waited only to run a check against a lotar release ("Release v..."): that release is installed
                now, lotar --version prints it. Run the check. It passes: comment the check and its result, and stop;
                change no files, so when your job ends the merge agent finds nothing to merge and closes the ticket.
                It still fails: comment what you ran and what still fails, set the status to HelpNeeded, assign the
                ticket to mallox and stop. Don't fix it in this job: the owner decides what comes next.
              - Otherwise continue the ticket from where it stopped, the way this repo's AGENTS.md says. Commit on
                your worktree's branch, signed, never with --no-verify, message "${{ticket.id}} ${{ticket.title}}";
                don't merge or push: the merge agent does that when your job ends. Don't end your turn while tests
                still run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              Never delete work that isn't saved elsewhere, and never decide what only the owner decides: then
              comment one question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # The owner's comment on any ticket reaches its agent (owner 2026-11-12, STD-56: "a comment on any tickets kicks of
    # or queues for an agent, then we should do that as well. Let's do it right from the start"): queued to a running
    # job, else @fix starts with it as the next turn of the ticket's last T3 thread. Only his comments: an agent's own
    # would come back to it. An answer that changes nothing sets status and assignee back, so no merge follows.
    - name: "Comments: the owner's comment reaches the agent"
      when:
        comment: { author: mallox }
      on:
        commented:
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
          tell_agent:
            agent: fix
            message: |
              mallox (the owner) commented on ticket ${{ticket.id}} ("${{ticket.title}}"), which was ${{ticket.status}}
              and assigned to "${{ticket.assignee}}":
              ${{comment.text}}
              Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and act on
              his comment:
              - The ticket was InProgress with an agent (@...) as assignee: this is a further turn of the job that
                runs on it. Answer in a comment, change the work as he asks and carry on as before.
              - It answers what the ticket waits for, or asks for a change: do the work the way this repo's AGENTS.md
                says. Commit on your worktree's branch, signed, never with --no-verify, message "${{ticket.id}}
                ${{ticket.title}}"; don't merge or push: the merge agent does that when your job ends. Don't end your
                turn while tests still run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              - It asks something or needs no change: answer in one comment, then set the status back to
                ${{ticket.status}} and the assignee back to "${{ticket.assignee}}" (empty: none), so no merge follows.
              Never delete work that isn't saved elsewhere, and never decide what only he decides: then comment one
              question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # Manual: after answering a HelpNeeded question or a failed job. Always pass --select, or every waiting ticket starts.
    - name: "Health: retry with @fix"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix"
          agent: *fix
    - name: "Health: retry with @fix-fable"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix-fable"
          agent: *fix
    - name: "Health: retry with @fix-codex"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix-codex"
          agent: *fix
