# Source: standards configs/lotar/automation.yml. Repo-health tickets (tag health, filed by
# node ~/Development/standards/scripts/repos.ts --report) start a fix agent as a T3 Code thread; tag owner never does.
# So does a ticket an agent files without an assignee (owner 2026-11-11, skill lotar-workflow). Jobs run in worktrees;
# a finished fix job goes to an agent reviewer (owner 2026-11-12, STD-59), then to @merge, which brings its branch into
# the main checkout (owner 2026-11-11, STD-35). What waits for the owner goes to his inbox in standards (STD-54). Goes
# into each repo's .tasks/<PROJECT>/automation.yml; the repo's own rules follow below these. Setup, retries and the
# model choice: configs/lotar/README.md. The statuses Reviewing and Merging are agent stages; none waits for the owner,
# who follows the agents in T3 (2026-11-11, 2026-11-12).
automation:
  rules:
    - name: "Health: start the fix agent"
      when:
        all:
          - tags: { any: [health] }
          - not: { tags: { any: [light] } }
      on:
        created:
          set:
            assignee: "@fix"
          # The ticket fields model and provider override the profile's (set both for another provider's model);
          # empty keeps the profile's.
          agent: &fix
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: &fix-prompt |
              Fix the repo problem in ticket ${{ticket.id}} ("${{ticket.title}}"). Run lotar with
              LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex): lotar records it as the comment's author.
              First rename this thread to "${{ticket.id}} fix: ${{ticket.title}}" (T3 Code tool t3_thread_update,
              action rename, no threadId).
              1. Read the ticket: what was found, how to check it, what done looks like. Run its check command. After
                 a failed merge your branch may hold earlier commits (git log <main>..HEAD): build on them.
              2. Fix it the way this repo's AGENTS.md says: the smallest change, with the tests and checks it names.
              3. Never delete or discard work that isn't saved elsewhere (unmerged commits, uncommitted changes,
                 files a tool or another session may still use), and never decide what only the owner decides.
                 Before asking him, ask the agents that are running (T3 threads, other sessions) what they know, and
                 file every bug you find in its repo (lotar add --finding). When the fix still needs him, comment one
                 question, set the status to HelpNeeded, assign the ticket to mallox (the owner) and stop.
              4. When you changed files: commit them on your worktree's branch, signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push: the merge agent does that, then reruns the
                 check command against the main checkout.
              5. Nothing to commit (the problem is gone already, or the fix needs no file change) and no commits beyond
                 main (git log <main>..HEAD, main being the main checkout's branch): comment the reason in one line,
                 then lotar status ${{ticket.id}} Done (WontDo when the ticket's "Done when" says so) and
                 lotar assignee ${{ticket.id}} --clear, and stop. No review or merge follows.
              6. Otherwise comment the outcome: what you changed, the commit hash, the checks that ran. When your job
                 ends, an agent on another model reviews it, then the merge agent takes over.
                 Changed pages, components or styles: tag the ticket ui (lotar task edit ${{ticket.id}} --tag ui)
                 and attach the before and after screenshots of skill ui-review (lotar task reference add upload
                 ${{ticket.id}} <file>), linked in that comment; the reviewer blocks without them.
    - name: "Health: start the light fix agent"
      when:
        all:
          - tags: { any: [health] }
          - tags: { any: [light] }
      on:
        created:
          set:
            assignee: "@fix-light"
          agent: *fix
    # An agent's ticket nobody took: @fix works it. The filer assigns itself, the
    # owner (a question) or @fix-light (mechanical) instead when that fits; proposals, owner and recurring tickets wait.
    # A Change ticket (local's change records) belongs to the agent making that change. A ticket filed Blocked waits:
    # its depends_on follows the add, and "Prerequisites done" starts it (STD-102).
    - name: "Agent tickets: start the fix agent"
      when:
        all:
          - any:
              - reporter: claude
              - reporter: codex
          - not: { assignee: "@any" }
          - not: { tags: { any: [health, proposal, owner, recurring] } }
          - not: { type: Change }
          - not: { status: Blocked }
      on:
        created:
          set:
            assignee: "@fix"
          # Without a prompt the job runs on lotar's built-in instructions, which leave the changes uncommitted
          # (DEV-332, 2026-11-12).
          agent: &work
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: &work-prompt |
              Work ticket ${{ticket.id}} ("${{ticket.title}}"): read it and its relationships, then do it the way this
              repo's AGENTS.md says, with the tests and checks it names. Run lotar with LOTAR_DEFAULT_REPORTER set to
              your agent name (claude, codex). After a failed merge your branch may hold earlier commits
              (git log <main>..HEAD): build on them. First rename this thread to "${{ticket.id}} fix: ${{ticket.title}}"
              (T3 Code tool t3_thread_update, action rename, no threadId).
              1. Never delete or discard work that isn't saved elsewhere, and never decide what only the owner decides.
                 Ask the running agents (T3 threads) first; when it still needs him, comment one question, set the
                 status to HelpNeeded, assign the ticket to mallox and stop.
              2. Commit your changes on your worktree's branch, signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push: the merge agent does that.
              3. Don't end your turn while tests or other background work still run: the job ends with your turn.
              4. Nothing to commit (the work is done already, or needs no file change) and no commits beyond main
                 (git log <main>..HEAD, main being the main checkout's branch): comment the reason in one line, then
                 lotar status ${{ticket.id}} Done (WontDo when the ticket's "Done when" says so) and
                 lotar assignee ${{ticket.id}} --clear, and stop. No review or merge follows.
              5. Otherwise comment the outcome: what you changed, the commit hash, the checks that ran. When your job
                 ends, an agent on another model reviews it, then the merge agent takes over.
                 Changed pages, components or styles: tag the ticket ui (lotar task edit ${{ticket.id}} --tag ui)
                 and attach the before and after screenshots of skill ui-review (lotar task reference add upload
                 ${{ticket.id}} <file>), linked in that comment; the reviewer blocks without them.
    - name: "Health: fix agent lifecycle"
      when:
        any:
          - assignee: "@fix"
          - assignee: "@fix-light"
          - assignee: "@fix-fable"
          - assignee: "@fix-codex"
      on:
        job_started:
          set:
            status: InProgress
    # A fix job's work goes to an agent reviewer before the merge (owner 2026-11-12, STD-59: "Yes, I agree with your
    # recommendations", docs/decisions/2026-11-12-qa-step.md): a new thread on another provider than the author, the
    # cheap model after @fix-light (lotar 0.14.3 for session: fresh). Not the ticket's model fields: they pick the fix agent's model. Work that commits
    # only .tasks passes at once. A fix agent that hands the ticket back (HelpNeeded, Blocked) sets status and assignee
    # itself, which replaces these, so no review starts. So does one that commits nothing: it sets Done (or WontDo) and
    # clears the assignee (owner 2026-11-13, STD-87, docs/decisions/2026-11-13-no-change-closes.md).
    # UI work (tag ui, or a diff that changes pages, components or styles) also gets the ui-review step with screenshots
    # (owner 2026-11-13, STD-97, docs/decisions/2026-11-13-agent-roles.md). lotar's conditions match ticket fields, not
    # changed files, so the review prompt checks both instead of a rule per tag.
    - name: "Fix done: review on Codex"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-fable"
          - not: { tags: { any: [review-child] } }
      on:
        job_completed:
          set:
            assignee: "@review"
            status: Reviewing
          agent: &review
            # A new thread on the fix branch, also on the author's provider and model (lotar DEV-414).
            session: fresh
            prompt: |
              Review the work for ticket ${{ticket.id}} ("${{ticket.title}}") before it is merged. A fix agent
              committed it on your worktree's branch; you didn't write it. Run lotar with LOTAR_DEFAULT_REPORTER set
              to your agent name (claude, codex). Change no files, commit nothing and leave status and assignee as
              they are: when your job ends the rules send the work on by tag review-blocked. First rename this thread
              to "${{ticket.id}} review: ${{ticket.title}}" (T3 Code tool t3_thread_update, action rename, no
              threadId).
              1. The work: git log <main>..HEAD and its diff, main being the main checkout's branch (git -C <root>
                 branch --show-current, <root> the first entry of git worktree list). No commits, or only .tasks
                 changed: comment "Review: nothing to review" and stop.
              2. Read what it must agree with, not only the diff: the ticket and its comments (what "Done when" asks,
                 what the fix agent claims), its related tickets, the owner decisions it touches (docs/decisions, the
                 ticket's quotes), this repo's AGENTS.md, and the recent commits to the touched files on main
                 (git log -5 <main> -- <file>), which may have changed what the fix relies on.
              3. Check: it does all that "Done when" asks and nothing the ticket didn't ask; each claim that relies on
                 something outside the change holds (another check, a config or rule that uses the code, "still
                 covered"); it decides nothing only the owner decides; a bug fix has a test that failed before it; no
                 stray files, no second branch or copy of the same fix. Rerun the checks the fix agent names that
                 finish in a few minutes, and put back whatever they change.
              4. UI work (tag ui, the ticket's tags: ${{ticket.tags}}; or the diff changes pages, components or
                 styles): follow skill ui-review. The fix agent's comments link screenshots of every changed page,
                 before and after, in light and dark mode at 1920, 1440 and 390 px wide (ticket attachments): read
                 them. Then start the app in this worktree as the repo's AGENTS.md says, take your own after
                 screenshots into a scratch folder outside the repo and read them. Missing screenshots, or a visible
                 problem in either set, is blocking. An app that won't start here: say why in the outcome.
              5. Blocking: the merge would put a bug, a decision the owner didn't make or unfinished work on main.
                 Comment the findings, each with file and line, what is wrong and what would fix it, then
                 lotar task edit ${{ticket.id}} --tag review-blocked. The fix agent reworks it once; a second
                 blocking review goes to the owner.
              6. Minor (real, but the merge can go ahead): file each as a ticket in its repo, related to
                 ${{ticket.id}} (skill lotar-workflow). Noise and taste: leave out.
              7. Don't end your turn while checks still run: the job ends with your turn. Comment the outcome, starting
                 "Review: passed" or "Review: blocking": what you read and reran, the findings, the tickets filed.
    - name: "Fix done: review on Claude"
      when:
        all:
          - assignee: "@fix-codex"
          - not: { tags: { any: [review-child] } }
      on:
        job_completed:
          set:
            assignee: "@review-claude"
            status: Reviewing
          agent: *review
    - name: "Fix done: light review"
      when:
        all:
          - assignee: "@fix-light"
          - not: { tags: { any: [review-child] } }
      on:
        job_completed:
          set:
            assignee: "@review-light"
            status: Reviewing
          agent: *review
    # Pilot (owner 2026-11-13, STD-88, docs/decisions/2026-11-13-thread-noise.md): with tag review-child, the review
    # is a T3 child thread of the fix thread, in its worktree, instead of a top-level thread of its own. lotar runs it
    # as the fix thread's next turn, which starts the child with the brief below: T3's CLI can't start a child
    # (pingdotgg/t3code#33235). The reviewer profiles stay assigned, so the review, merge and rework rules apply
    # unchanged; the merge and the rework then continue the fix thread. The brief is the review prompt above; change
    # both together.
    - name: "Fix done: review on Codex in a child thread"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-fable"
          - tags: { any: [review-child] }
      on:
        job_completed:
          set:
            assignee: "@review"
            status: Reviewing
          agent: &review-child
            session: continue
            prompt: |
              This turn starts the review of ticket ${{ticket.id}} ("${{ticket.title}}") in a child thread; you don't
              review it yourself. Change no files and leave status and assignee as they are.
              1. The reviewer runs on the provider and model of a lotar profile in
                 ~/Development/standards/configs/lotar/agents.yml: review after fix and fix-fable (your model is
                 Claude), review-claude after fix-codex (Codex), review-light after fix-light (the cheap model).
              2. Call the T3 Code tool delegate_task: title "${{ticket.id}} review: ${{ticket.title}}", role review,
                 isolation shared (this worktree), mode wait, timeoutMs 3600000, target providerInstanceId and model
                 from that profile, task the brief below the line, word for word.
              3. The wait ends before the child does: wait again (t3_thread_wait on its childThreadId). Don't end your
                 turn while it runs: the job ends with your turn, and the rules read the child's tag review-blocked.
              4. The child failed or commented nothing: comment "Review: child thread failed" with its link. Otherwise
                 reply with its outcome line ("Review: passed" or "Review: blocking") and its link.
              ---
              Review the work for ticket ${{ticket.id}} ("${{ticket.title}}") before it is merged. A fix agent
              committed it on your worktree's branch; you didn't write it. Run lotar with LOTAR_DEFAULT_REPORTER set
              to your agent name (claude, codex). Change no files, commit nothing and leave status and assignee as
              they are: when your job ends the rules send the work on by tag review-blocked.
              1. The work: git log <main>..HEAD and its diff, main being the main checkout's branch (git -C <root>
                 branch --show-current, <root> the first entry of git worktree list). No commits, or only .tasks
                 changed: comment "Review: nothing to review" and stop.
              2. Read what it must agree with, not only the diff: the ticket and its comments (what "Done when" asks,
                 what the fix agent claims), its related tickets, the owner decisions it touches (docs/decisions, the
                 ticket's quotes), this repo's AGENTS.md, and the recent commits to the touched files on main
                 (git log -5 <main> -- <file>), which may have changed what the fix relies on.
              3. Check: it does all that "Done when" asks and nothing the ticket didn't ask; each claim that relies on
                 something outside the change holds (another check, a config or rule that uses the code, "still
                 covered"); it decides nothing only the owner decides; a bug fix has a test that failed before it; no
                 stray files, no second branch or copy of the same fix. Rerun the checks the fix agent names that
                 finish in a few minutes, and put back whatever they change.
              4. UI work (tag ui, the ticket's tags: ${{ticket.tags}}; or the diff changes pages, components or
                 styles): follow skill ui-review. The fix agent's comments link screenshots of every changed page,
                 before and after, in light and dark mode at 1920, 1440 and 390 px wide (ticket attachments): read
                 them. Then start the app in this worktree as the repo's AGENTS.md says, take your own after
                 screenshots into a scratch folder outside the repo and read them. Missing screenshots, or a visible
                 problem in either set, is blocking. An app that won't start here: say why in the outcome.
              5. Blocking: the merge would put a bug, a decision the owner didn't make or unfinished work on main.
                 Comment the findings, each with file and line, what is wrong and what would fix it, then
                 lotar task edit ${{ticket.id}} --tag review-blocked. The fix agent reworks it once; a second
                 blocking review goes to the owner.
              6. Minor (real, but the merge can go ahead): file each as a ticket in its repo, related to
                 ${{ticket.id}} (skill lotar-workflow). Noise and taste: leave out.
              7. Don't end your turn while checks still run: your reply goes to the fix thread. Comment the outcome,
                 starting "Review: passed" or "Review: blocking": what you read and reran, the findings, the tickets
                 filed.
    - name: "Fix done: review on Claude in a child thread"
      when:
        all:
          - assignee: "@fix-codex"
          - tags: { any: [review-child] }
      on:
        job_completed:
          set:
            assignee: "@review-claude"
            status: Reviewing
          agent: *review-child
    - name: "Fix done: light review in a child thread"
      when:
        all:
          - assignee: "@fix-light"
          - tags: { any: [review-child] }
      on:
        job_completed:
          set:
            assignee: "@review-light"
            status: Reviewing
          agent: *review-child
    - name: "Review lifecycle"
      when:
        any:
          - assignee: "@review"
          - assignee: "@review-claude"
          - assignee: "@review-light"
      on:
        job_started:
          set:
            status: Reviewing
    # Passed, or the review job failed: the merge goes ahead (before STD-59 every fix merged without a review). The
    # merge runs as the next turn of the ticket's last T3 thread, the reviewer's, in the fix branch's worktree (owner
    # 2026-11-11, docs/decisions/2026-11-11-merge-in-fix-thread.md, STD-47). Not the ticket's model fields.
    - name: "Review passed: merge"
      when:
        all:
          - any:
              - assignee: "@review"
              - assignee: "@review-claude"
              - assignee: "@review-light"
          - not: { tags: { any: [review-blocked] } }
      on:
        job_completed:
          set: &merging
            assignee: "@merge"
            status: Merging
          agent: &merge
            session: continue
            prompt: |
              Merge the work for ticket ${{ticket.id}} ("${{ticket.title}}") into the main checkout (<root>, the
              first entry of git worktree list). When this thread did the fix or its review, this turn is the merge:
              it replaces the earlier "Don't merge or push" and "Change no files". Your worktree's branch holds the
              fix agent's commits. Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex).
              First rename this thread to "${{ticket.id}} merge: ${{ticket.title}}" (T3 Code tool t3_thread_update,
              action rename, no threadId).
              1. Main is the main checkout's current branch (git -C <root> branch --show-current). No commits
                 beyond main (git log <main>..HEAD): comment "nothing to merge" and stop.
              2. Rebase onto main. Resolve a conflict only when you are certain both sides' intent is kept (for
                 example separate hunks in a list); otherwise git rebase --abort, comment the conflicting files and
                 what each side wanted, set the status to HelpNeeded, assign the ticket to mallox and stop.
              3. Run the checks this repo's AGENTS.md names, in your worktree. One fails: hand back as in step 2.
                 Skip a check the fix or rework comment says passed on the commit that is still HEAD (the rebase
                 changed nothing: same hash before and after), and name it as skipped in your comment.
              4. git -C <root> merge --ff-only <your branch>. Main moved on: back to step 2. Refused
                 because of uncommitted changes in the main checkout: hand back. Then the lotar files: when
                 git -C <root> status --short .tasks lists changes (tickets and config, also other tickets'), and
                 git -C <root> log -1 is still the last commit you merged, git -C <root> add .tasks and
                 git -C <root> commit --amend --no-edit -- .tasks: they belong to no ticket (owner 2026-11-12).
                 Nothing else: never stash, reset, commit other files or check out anything in the main checkout.
              5. Push only if ~/Development/standards/repos.json lists this repo with "push": true, and only
                 finished work (owner 2026-11-12): the main checkout is clean (git -C <root> status --short lists
                 nothing), and no unpushed commit (git -C <root> log @{u}..) belongs to work still in progress (another
                 ticket InProgress, a session still working in the main checkout). Then git -C <root> push, also
                 others' finished commits. One unfinished: push the commits before it, git -C <root> push origin
                 <sha>:<main>, and comment what waits. Never with --no-verify. Refused: hand back.
              6. A health ticket names a check command: run it again; it must no longer list the finding.
              7. Comment the outcome: the commits merged, pushed or why not, the checks that ran. The ticket goes
                 to Done when your job ends.
    - name: "Review failed: merge without it"
      when:
        any:
          - assignee: "@review"
          - assignee: "@review-claude"
          - assignee: "@review-light"
      on:
        job_failed:
          set: *merging
          comment: >-
            The review job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the merge goes ahead without
            a review.
          agent: *merge
    # Blocking findings go back to the author's profile once, which builds on its branch in a new thread (the
    # reviewer's runs another model, lotar DEV-408); tag review-returned sends a second blocking review to mallox.
    - name: "Review blocked: back to @fix"
      when:
        all:
          - assignee: "@review"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
      on:
        job_completed:
          set:
            assignee: "@fix"
          add: &returned
            tags: [review-returned]
          remove: &unblocked
            tags: [review-blocked]
          agent: &rework
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
            prompt: |
              The review of ticket ${{ticket.id}} ("${{ticket.title}}") found blocking problems: its last comments name
              them. Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Your worktree's
              branch holds the earlier commits (git log <main>..HEAD): build on them. First rename this thread to
              "${{ticket.id}} rework: ${{ticket.title}}" (T3 Code tool t3_thread_update, action rename, no threadId).
              1. Fix each finding the way this repo's AGENTS.md says, with the tests and checks it names, or answer in
                 a comment why it isn't a problem. Never delete or discard work that isn't saved elsewhere. A finding
                 only the owner can decide: comment one question, set the status to HelpNeeded, assign the ticket to
                 mallox and stop.
              2. Amend the earlier commit (it isn't pushed), signed, never with --no-verify, message
                 "${{ticket.id}} ${{ticket.title}}". Don't merge or push.
              3. Don't end your turn while tests still run. Comment the outcome: what you did about each finding, the
                 commit hash, the checks that ran. When your job ends the work is reviewed again.
    - name: "Review blocked: back to @fix-codex"
      when:
        all:
          - assignee: "@review-claude"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
      on:
        job_completed:
          set:
            assignee: "@fix-codex"
          add: *returned
          remove: *unblocked
          agent: *rework
    - name: "Review blocked: back to @fix-light"
      when:
        all:
          - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - not: { tags: { any: [review-returned] } }
      on:
        job_completed:
          set:
            assignee: "@fix-light"
          add: *returned
          remove: *unblocked
          agent: *rework
    - name: "Review blocked again: hand to mallox"
      when:
        all:
          - any:
              - assignee: "@review"
              - assignee: "@review-claude"
              - assignee: "@review-light"
          - tags: { any: [review-blocked] }
          - tags: { any: [review-returned] }
      on:
        job_completed:
          set:
            status: HelpNeeded
            assignee: mallox
          # Only a new blocking review sets it again, so a pass after the owner's rework merges (STD-93).
          remove: *unblocked
          comment: >-
            The review found blocking problems again after one rework (the comments above). Should an agent rework it
            once more (lotar assignee ${{ticket.id}} @fix), will you decide the findings, or is it WontDo?
          # A rule's own change fires no other rule, so this one files the ticket in the inbox itself.
          run: &inbox 'node "$HOME/Development/standards/scripts/repos.ts" --inbox ${{ticket.id}}'
    # A failed fix job goes to @fix-codex once before it waits for mallox (owner 2026-11-12, STD-55): STD-18's job
    # failed only because the agent ended its turn while the commit hook ran. Codex, because it is another provider
    # and model: a Claude outage, rate limit or habit doesn't fail the retry too. The retry keeps the branch and runs on
    # the profile's model, not the ticket's fields. Tag fix-retried sends a second failure to mallox.
    - name: "Fix failed: retry on @fix-codex"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
          - tags: { any: [health] }
          - not: { tags: { any: [fix-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix-codex"
          add:
            tags: [fix-retried]
          comment: &fix-retry >-
            The fix agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); @fix-codex retries it on
            branch ${{agent.worktree_branch}}.
          agent:
            prompt: *fix-prompt
    - name: "Fix failed: retry an agent ticket on @fix-codex"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
          - not: { tags: { any: [health, fix-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix-codex"
          add:
            tags: [fix-retried]
          comment: *fix-retry
          agent:
            prompt: *work-prompt
    # A retry, or a @fix-codex job (only retries start one). The comment asks a question: repos.ts reports a
    # HelpNeeded ticket whose last comment asks none (check question).
    - name: "Fix failed again: hand to mallox"
      when:
        all:
          - any:
              - assignee: "@fix"
              - assignee: "@fix-light"
              - assignee: "@fix-fable"
              - assignee: "@fix-codex"
          - any:
              - assignee: "@fix-codex"
              - tags: { any: [fix-retried] }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          comment: >-
            The fix agent's job ${{agent.job_id}} failed again: lotar agent logs ${{agent.job_id}}. Should an agent try
            again (lotar automation run "Health: retry with @fix" --select 'id:${{ticket.id}}', or @fix-fable,
            @fix-codex; for an agent's ticket lotar assignee ${{ticket.id}} @fix), or is it WontDo?
          run: *inbox
    # A merge agent that stops for a conflict or a failing check hands the ticket to mallox itself; the retry goes to
    # the fix agent, whose branch the next merge picks up.
    - name: "Merge agent lifecycle"
      when:
        assignee: "@merge"
      on:
        job_started:
          set:
            status: Merging
        job_completed:
          set:
            status: Done
          # A rule's own change doesn't fire the "clear the tags" rule below.
          remove: &done-tags
            tags: [merge-retried, fix-retried, review-blocked, review-returned]
    # A failed merge job (a crash, or a false failure like DEV-342's) goes back to the fix agent once, which ends with
    # nothing to do when the work is on main already; tag merge-retried sends a second failure to mallox, so fix,
    # merge, fail can't loop (owner 2026-11-11, STD-46).
    - name: "Merge failed: retry with @fix"
      when:
        all:
          - assignee: "@merge"
          - tags: { any: [health] }
          - not: { tags: { any: [merge-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the fix agent retries
            it on branch ${{agent.worktree_branch}}.
          agent: *fix
    - name: "Merge failed: retry an agent ticket with @fix"
      when:
        all:
          - assignee: "@merge"
          - not: { tags: { any: [health, merge-retried] } }
      on:
        job_failed:
          set:
            assignee: "@fix"
          add:
            tags: [merge-retried]
          comment: >-
            The merge agent's job ${{agent.job_id}} failed (lotar agent logs ${{agent.job_id}}); the fix agent retries
            it on branch ${{agent.worktree_branch}}.
          agent: *work
    - name: "Merge failed again: hand to mallox"
      when:
        all:
          - assignee: "@merge"
          - tags: { any: [merge-retried] }
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: mallox
          comment: >-
            The merge agent's job ${{agent.job_id}} failed again: lotar agent logs ${{agent.job_id}}. The fix is on
            branch ${{agent.worktree_branch}}. Should an agent try again (lotar automation run "Health: retry with @fix"
            --select 'id:${{ticket.id}}', or for an agent's ticket lotar assignee ${{ticket.id}} @fix), or will you
            merge it yourself?
          run: *inbox
    # Not "and tagged": on updated every field condition needs that field to change in the same update.
    - name: "Retries: clear the tags when done"
      when:
        status: Done
      on:
        updated:
          remove: *done-tags
    # A ticket that waits for others is Blocked and depends on them. When the last one is done its agent continues
    # (owner 2026-11-12, STD-56: "when a ticket the blocks other tickets is done, it should automatically kick of
    # agents for those tickets"). tell_agent queues the message to a running job, else starts @fix as the next turn of
    # the ticket's last T3 thread; agent: fix, because a ticket a merge agent handed back was last assigned to @merge
    # (lotar DEV-396). Proposals and owner tickets wait for him. A prerequisite in another repo (lotar:DEV-374) can't
    # notify this one: the daily repos.ts --fix runs this rule in every repo (lotar automation run <name>). No manual
    # action: a manual run would start every Blocked ticket.
    - name: "Prerequisites done: continue the waiting ticket"
      when:
        all:
          - status: Blocked
          - not: { tags: { any: [proposal, owner] } }
      on:
        unblocked:
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
          tell_agent:
            agent: fix
            message: |
              Ticket ${{ticket.id}} ("${{ticket.title}}") waited for ${{unblocked.by}}, which is done now. Run lotar
              with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and its comments:
              what it waited to do and what done looks like.
              - It waited only to run a check against a lotar release ("Release v..."): that release is installed
                now, lotar --version prints it. Run the check. It passes: change no files, comment the check and its
                result, then lotar status ${{ticket.id}} Done and lotar assignee ${{ticket.id}} --clear, and stop.
                It still fails: comment what you ran and what still fails, set the status to HelpNeeded, assign the
                ticket to mallox and stop. Don't fix it in this job: the owner decides what comes next.
              - Otherwise continue the ticket from where it stopped, the way this repo's AGENTS.md says. Commit on
                your worktree's branch, signed, never with --no-verify, message "${{ticket.id}} ${{ticket.title}}";
                don't merge or push: the merge agent does that when your job ends. Don't end your turn while tests
                still run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              Never delete work that isn't saved elsewhere, and never decide what only the owner decides: then
              comment one question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # The owner's comment on any ticket reaches its agent (owner 2026-11-12, STD-56: "a comment on any tickets kicks of
    # or queues for an agent, then we should do that as well. Let's do it right from the start"): queued to a running
    # job, else @fix starts with it as the next turn of the ticket's last T3 thread. Only his comments, and the inbox
    # triage agent's answers for him (STD-54): an agent's own would come back to it. An answer that changes nothing
    # sets status and assignee back, so no merge follows. His comment closes the ticket's inbox ticket (repos.ts
    # --inbox): the job it starts sets the status by rule, which fires no other rule (STD-101).
    - name: "Comments: the owner's comment reaches the agent"
      when:
        comment: { author: [mallox, triage] }
      on:
        commented:
          run: *inbox
          agent:
            model: "${{ticket.field:model}}"
            provider: "${{ticket.field:provider}}"
          tell_agent:
            agent: fix
            message: |
              ${{comment.author}} commented on ticket ${{ticket.id}} ("${{ticket.title}}"), which was ${{ticket.status}}
              and assigned to "${{ticket.assignee}}" (mallox is the owner; triage answers for him from what he decided
              before and names where the answer comes from):
              ${{comment.text}}
              Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name (claude, codex). Read the ticket and act on
              his comment:
              - The ticket was InProgress, Reviewing or Merging with an agent (@...) as assignee: this is a further
                turn of the job that runs on it. Answer in a comment, change the work as he asks and carry on as before.
              - It answers what the ticket waits for, or asks for a change: do the work the way this repo's AGENTS.md
                says. Commit on your worktree's branch, signed, never with --no-verify, message "${{ticket.id}}
                ${{ticket.title}}"; don't merge or push: the merge agent does that when your job ends. Don't end your
                turn while tests still run. Comment the outcome: what you changed, the commit hash, the checks that ran.
              - It asks something or needs no change: answer in one comment, then set the status back to
                ${{ticket.status}} and the assignee back to "${{ticket.assignee}}" (empty: none), so no merge follows.
              Never delete work that isn't saved elsewhere, and never decide what only he decides: then comment one
              question, set the status to HelpNeeded, assign the ticket to mallox and stop.
    # What waits for the owner goes to his inbox, project INBOX in standards (owner 2026-11-12, STD-54,
    # docs/decisions/2026-11-12-owner-inbox.md): HelpNeeded with assignee mallox, in either order, or tag owner. A
    # status an agent sets during its job fires these rules when the job ends; the daily repos.ts --report files what
    # a rule's own change set.
    - name: "Inbox: file what waits for the owner"
      when:
        any:
          - all:
              - status: HelpNeeded
              - current: { assignee: mallox }
          - all:
              - assignee: mallox
              - current: { status: HelpNeeded }
          - tags: { any: [owner] }
      on:
        created:
          run: *inbox
        updated:
          run: *inbox
    # Its inbox ticket closes as soon as the ticket leaves HelpNeeded, also when he answered in the agent's thread and
    # not on a ticket (STD-101); --inbox leaves it open while the ticket still waits (tag owner).
    - name: "Inbox: close what no longer waits"
      when:
        changes:
          status: { from: HelpNeeded }
      on:
        updated:
          run: *inbox
    # Manual: after answering a HelpNeeded question or a failed job. Always pass --select, or every waiting ticket starts.
    - name: "Health: retry with @fix"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix"
          agent: *fix
    - name: "Health: retry with @fix-fable"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix-fable"
          agent: *fix
    - name: "Health: retry with @fix-codex"
      when:
        all:
          - tags: { any: [health] }
          - status: HelpNeeded
      on:
        manual:
          set:
            assignee: "@fix-codex"
          agent: *fix
