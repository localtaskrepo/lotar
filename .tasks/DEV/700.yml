description: |-
  Found (review of DEV-652): DEV-652's "Done when" asks for checks on a real ticket, not assumed, and none ran: the installed lotar is 0.15.3 without `f16031633`. Tests cover them with a fake t3 (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs`).

  Waits (Blocked) for DEV-652 to merge and for the release that ships it (DEV-702, Release v0.15.5) to be installed: `lotar --version` prints 0.15.5 or later. Closing DEV-702 hands this ticket to @fix.

  ## Done when
  Checked on one real ticket that gets fix, review and merge jobs on the t3 runner, run by the installed build, not assumed:
  - [ ] All its jobs ran in one worktree under lotar's worktree folder on `agent/<ID>`; `ls -t ~/.t3/worktrees/lotar | head` shows nothing new for it.
  - [ ] Its thread shows in T3 Code with its title and is linked on the ticket.
  - [ ] A job with `session: continue` continued that same thread (same thread link).
  - [ ] A job that ended with the ticket moving on logged `Settled the T3 Code thread` (`lotar agent logs <job>`).
  - [ ] A job that ended HelpNeeded or failed logged `stays active`. If no job on that ticket ends this way, run one that hands back (HelpNeeded) on a scratch ticket made with `npm run seed:test-tasks`, never a fake DEV ticket.
  - [ ] A comment lists the ticket and the job IDs for each point.

  A point that fails: comment what ran and what failed, set HelpNeeded, assign mallox; don't fix it in this job.
