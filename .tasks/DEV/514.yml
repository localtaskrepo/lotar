description: 'Found 2026-11-14 (standards STD-110): standards'' .tasks changed after the last lotar trust, so the server skipped the inbox relay command for five owner answers but applied the rule''s set status Done; the only trace is one ''[lotar][warn] Skipped automation run commands'' line in the server''s stderr (printed once per process), nothing on the tickets, no automation_failed SSE event. Check: in a scratch repo with a rule that has run and set, change automation.yml after lotar trust, fire the rule: the ticket shows nothing. Done: a skipped run is reported like a failed one (Automation rule ''<name>'' skipped on <ID>, an automation_failed or automation_skipped SSE event, visible in the web UI), and docs/help/automation.md says whether the rule''s other actions apply when its run is skipped (an option to skip them would fit).'
