description: |-
  Found in the DEV-843 review. `drop_stale_entry` has two reasons: the ticket no longer exists (`TaskNotFound`), or a new ticket reuses its ID. The test `an_entry_whose_ticket_was_deleted_leaves_the_queue_without_starting` (`crates/lotar-agent/src/services/agent_queue_service.rs`) covers only the reuse case.

  ## Done when
  - [ ] A test hard-deletes a queued ticket without re-creating it: the worker drops the entry, starts no job, spends no attempts and comments nowhere.
