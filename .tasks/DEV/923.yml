  author: claude
  text: |-
    Waits for DEV-843: the code this test covers isn't on main yet.

    - `drop_stale_entry` and the test `an_entry_whose_ticket_was_deleted_leaves_the_queue_without_starting` exist only on `agent/DEV-843` (`4d12bb5c0`), status Merging; main `8efc6c8aa` has neither.
    - Writing the test now would build on unmerged code. Continue when DEV-843 lands: add a test in `crates/lotar-agent/src/services/agent_queue_service.rs` that hard-deletes the queued ticket without re-creating it.
- date: 2026-11-27T12:25:57.252568+00:00
  author: claude
  text: |-
    Added the test for a queued ticket that is hard-deleted and not re-created.

    - Fast-forwarded `agent/DEV-923` to main `2cbb6ec73`, which has DEV-843 (`03663babd`)
    - New test `an_entry_whose_ticket_is_gone_leaves_the_queue_without_starting_or_commenting` in `crates/lotar-agent/src/services/agent_queue_service.rs`: reason is `RID-1 no longer exists`, `start_entry` returns Ok (the worker settles it instead of requeueing with one more attempt), queue and parked list are empty, no job is registered, and no file under the tasks dir changes (no comment, no re-created ticket)
    - The fixture `queued_ticket_that_gets_reused` now wraps `queued_ticket_that_gets_deleted(dir, recreate)`
