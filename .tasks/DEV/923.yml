- date: 2026-11-27T09:11:29.108523+00:00
  author: claude
  text: |-
    Waits for DEV-843: the code this test covers isn't on main yet.

    - `drop_stale_entry` and the test `an_entry_whose_ticket_was_deleted_leaves_the_queue_without_starting` exist only on `agent/DEV-843` (`4d12bb5c0`), status Merging; main `8efc6c8aa` has neither.
    - Writing the test now would build on unmerged code. Continue when DEV-843 lands: add a test in `crates/lotar-agent/src/services/agent_queue_service.rs` that hard-deletes the queued ticket without re-creating it.
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3A028b7825cedd9d889f13fe98fc9c83df6c45dc4198d6be79bfc5618f2ad7019f
description: |-
  Found in the DEV-843 review. `drop_stale_entry` has two reasons: the ticket no longer exists (`TaskNotFound`), or a new ticket reuses its ID. The test `an_entry_whose_ticket_was_deleted_leaves_the_queue_without_starting` (`crates/lotar-agent/src/services/agent_queue_service.rs`) covers only the reuse case.

  ## Done when
  - [ ] A test hard-deletes a queued ticket without re-creating it: the worker drops the entry, starts no job, spends no attempts and comments nowhere.
