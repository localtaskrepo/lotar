- date: 2026-11-13T21:36:12.760262+00:00
  author: claude
  text: 'Report comments are in. A comment takes an optional `report` (commits, checks marked passed, failed or not_run with a reason, the next step) from the CLI (`--commit`, `--check`, `--next`), MCP `task_comment_add` and REST `POST /api/tasks/comment`. The text stays required. `lotar comment` and `lotar show` print the report. In the Comments tab, the UI shows commits as links when the git remote is on GitHub, GitLab, Bitbucket or Codeberg (new `commit_url` on `/api/branding`), and checks with pass, fail and not-run marks. It says "No check marked not run" when a report has none. Unknown report keys and results from newer versions survive edits. Old YAML is unchanged. Docs updated: OpenAPI, TS types, help (comment, MCP tools, API reference) and the lotar-workflow skill hand-off step. Not done: the comment ships with lotar 0.14.3, which doesn''t have the flags yet, so this comment is prose only. It overlaps DEV-488/DEV-489 (same `TaskComment` and `lotar comment` files); expect merge conflicts, not design conflicts. Commit e55649e8.'
