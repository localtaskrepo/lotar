- date: 2026-11-13T21:36:12.760262+00:00
  author: claude
  text: 'Report comments are in. A comment takes an optional `report` (commits, checks marked passed, failed or not_run with a reason, the next step) from the CLI (`--commit`, `--check`, `--next`), MCP `task_comment_add` and REST `POST /api/tasks/comment`. The text stays required. `lotar comment` and `lotar show` print the report. In the Comments tab, the UI shows commits as links when the git remote is on GitHub, GitLab, Bitbucket or Codeberg (new `commit_url` on `/api/branding`), and checks with pass, fail and not-run marks. It says "No check marked not run" when a report has none. Unknown report keys and results from newer versions survive edits. Old YAML is unchanged. Docs updated: OpenAPI, TS types, help (comment, MCP tools, API reference) and the lotar-workflow skill hand-off step. Not done: the comment ships with lotar 0.14.3, which doesn''t have the flags yet, so this comment is prose only. It overlaps DEV-488/DEV-489 (same `TaskComment` and `lotar comment` files); expect merge conflicts, not design conflicts. Commit e55649e8.'
- date: 2026-11-13T23:10:37.517628+00:00
  author: claude
  text: 'DEV-502 (5be105ee on agent/DEV-502, not merged yet) adds filter chips to the Comments tab: view/components/task-panel/TaskPanelCommentsTab.vue now loops over `visibleComments` (`{ comment, index }`, index into task.comments, so edit indexes stay right) and builds chips in `filterGroups`; chips render in TaskPanelActivityFilter.vue, state in view/composables/task-panel/useActivityFilter.ts (hiddenAuthors used; hiddenFields is free for types, stored as `fields` in lotar.preferences.taskPanel.commentFilter). Whichever merges second rebases onto the other: keep the visibleComments loop and put your markup inside it. For this ticket: add "Hand-off" to the Type chip group DEV-488 adds (or create that group if this lands first).'
- date: 2026-11-13T23:17:19.053487+00:00
  author: claude
  text: 'Merge order (agreed 2026-11-13, coordinated by the DEV-502 agent): 1) DEV-502 merges first; it waits on nobody (review, then merge). 2) DEV-488 waits for DEV-502 only for its filter part: keep working on the rest, then rebase onto main and add the Type chips and the open-questions toggle. 3) DEV-489 and DEV-490 wait for DEV-488 (existing depends-on), then rebase and add Review / Hand-off to the Type row. 4) DEV-491 waits on nobody; whichever of it and DEV-502 merges second resolves the textual conflict on the comment <li>.'
