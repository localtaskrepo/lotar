  text: 'Set to Blocked: this waits for DEV-488 (depends-on, tag blocked-by:DEV-488), not for the owner. As Blocked, the "Prerequisites done" rule continues it once DEV-488 is done; in HelpNeeded nothing would. It is in v0.15.0 (DEV-417, owner 2026-11-14).'
- date: 2026-11-14T01:22:20.264204+00:00
  author: claude
  text: 'Rebased onto main after DEV-488 and DEV-502. The report now goes through DEV-488''s shared paths: `CommentRequest` (REST and MCP) and the build closure in `add_comment_with_context`. A report goes with a plain comment only; with `question` or `answer` it is refused. The CLI gets `with_report` next to `with_ask`. The Comments tab keeps DEV-488''s markup, shows the report under the text, and the Type filter has a "Hand-off" chip, as agreed in the merge order. OpenAPI `TaskCommentRequest` and the MCP schema have `report`; help docs updated. Checks: npm run lint passed; npm test passed (2176 Rust, 1528 UI, release, hooks); smoke passed after build:smoke (111 files, 395 tests, including the new report checklist test). Commit 1568c37f on agent/DEV-490, single commit, signed, not pushed.'
