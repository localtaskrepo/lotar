comments:
- date: 2026-11-13T21:36:12.760262+00:00
  author: claude
  text: 'Report comments are in. A comment takes an optional `report` (commits, checks marked passed, failed or not_run with a reason, the next step) from the CLI (`--commit`, `--check`, `--next`), MCP `task_comment_add` and REST `POST /api/tasks/comment`. The text stays required. `lotar comment` and `lotar show` print the report. In the Comments tab, the UI shows commits as links when the git remote is on GitHub, GitLab, Bitbucket or Codeberg (new `commit_url` on `/api/branding`), and checks with pass, fail and not-run marks. It says "No check marked not run" when a report has none. Unknown report keys and results from newer versions survive edits. Old YAML is unchanged. Docs updated: OpenAPI, TS types, help (comment, MCP tools, API reference) and the lotar-workflow skill hand-off step. Not done: the comment ships with lotar 0.14.3, which doesn''t have the flags yet, so this comment is prose only. It overlaps DEV-488/DEV-489 (same `TaskComment` and `lotar comment` files); expect merge conflicts, not design conflicts. Commit e55649e8.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A92f9648a-c12b-4124-9284-32c1807b437d
description: |-
  Agents end their work with long prose comments that list the commit, the checks that passed and failed and the checks that did not run (e.g. DEV-466's 19:38 comment). The owner's rule is "say which checks didn't run". A `report` comment with those parts as fields shows them as a checklist and makes a missing "not run" visible. Owner chose it on 2026-11-13 together with the question comment type.

  ## Plan

  - Optional `report` block on `TaskComment`: `commits` (hash and what it is), `checks` (command and `passed`, `failed` or `not_run` with a reason), `next` (the next step). `text` stays the prose summary.
  - CLI `lotar comment <id> --commit "<sha>: <what>" --check "<cmd>=passed|failed|not_run[: reason]" --next "..."`, MCP and REST with the same fields; API types, OpenAPI and help docs agree.
  - UI: commits as links where a remote is known, checks as a list with pass, fail and not-run marks.
  - lotar's `lotar-workflow` skill: hand-off comments use it.

  ## Done when

  - [ ] Report comments round-trip through CLI, MCP and REST; old YAML unchanged.
  - [ ] The UI shows the checklist (smoke).
  - [ ] Docs agree; lint, test and smoke pass.

  Risk: a fixed shape tends to come back half filled. Keep every field optional and the prose `text` required.
