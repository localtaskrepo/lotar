description: |-
  Agents end their work with long prose comments that list the commit, the checks that passed and failed and the checks that did not run (e.g. DEV-466's 19:38 comment). The owner's rule is "say which checks didn't run". A `report` comment with those parts as fields shows them as a checklist and makes a missing "not run" visible. Owner chose it on 2026-11-13 together with the question comment type.

  ## Plan

  - Optional `report` block on `TaskComment`: `commits` (hash and what it is), `checks` (command and `passed`, `failed` or `not_run` with a reason), `next` (the next step). `text` stays the prose summary.
  - CLI `lotar comment <id> --commit "<sha>: <what>" --check "<cmd>=passed|failed|not_run[: reason]" --next "..."`, MCP and REST with the same fields; API types, OpenAPI and help docs agree.
  - UI: commits as links where a remote is known, checks as a list with pass, fail and not-run marks.
  - lotar's `lotar-workflow` skill: hand-off comments use it.

  ## Done when

  - [ ] Report comments round-trip through CLI, MCP and REST; old YAML unchanged.
  - [ ] The UI shows the checklist (smoke).
  - [ ] Docs agree; lint, test and smoke pass.

  Risk: a fixed shape tends to come back half filled. Keep every field optional and the prose `text` required.
