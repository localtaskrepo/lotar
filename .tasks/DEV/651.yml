description: |-
  Next lotar release, a patch bump to v0.15.3, mainly for DEV-630 (the queue worker honors max_parallel_jobs; 0.15.2 ran 4 lotar jobs with a limit of 2 and filled the disk).

  Steps: `.github/skills/release/SKILL.md` and `docs/release-guide.md`. Tickets that wait for this release are Blocked and depend on it (`lotar task relationships add DEV-N <this> --kind depends-on`); closing this ticket hands them to @fix to run their checks.

  ## Done when

  Patch bump: "a patch by default" (owner, 2026-11-11, release guide). Pushing the tag publishes the release, so it waits for the owner's OK (release skill step 4); a failing step stops the release there and is commented here.

  - [ ] Release record 0.15.3 exists and holds this ticket and every DEV ticket from `git log v0.15.2..main` that was in no release (`lotar list 'release:none'` shows none of them).
  - [ ] `Cargo.toml` `[workspace.package]` version and the three `=X.Y.Z` pins under `[workspace.dependencies]` say 0.15.3; `Cargo.lock` matches; no doc still names 0.15.2 as the current release.
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass on the bump commit `DEV-651 Release v0.15.3`; a failure is fixed or reported, never skipped.
  - [ ] The bump is on main and its Quality Assurance run succeeded (`gh run list --workflow "Quality Assurance" --commit <sha>`).
  - [ ] With the owner's OK: signed tag `v0.15.3` pushed, `lotar release release 0.15.3`; every job of the Release run is green (a failed job is re-run once, then reported).
  - [ ] `brew upgrade lotar`; `lotar --version` prints 0.15.3 and `codesign -dvv` shows the Developer ID identity.
  - [ ] This ticket Done; the Blocked tickets that depend on it are with @fix.
  - [ ] Ticket `Release v0.15.4` (Chore, assignee mallox) and release record 0.15.4 holding it exist.
