- at: 2026-11-26T01:29:48.178813+00:00
  actor: claude
  changes:
  - field: description
    old: |-
      Found (2026-11-22, chief of staff): standards' rule 'Inbox: the owner's answer goes to the source' (standards .tasks/INBOX/automation.yml) runs `lotar --tasks-dir <source_repo>/.tasks comment <source> --answer ...` and then `lotar status <INBOX> Done`. On INBOX-651 (source STD-299, 21:04 UTC, lotar 0.15.6) the comment was written on STD-299 at once, but the command didn't return: the server log (~/Library/Logs/lotar-services/standards.log) says 'Automation run command did not finish within 300s and was stopped'. So INBOX-651 stayed Todo, STD-299 stayed HelpNeeded/mallox, and the STD rule 'Comments: the owner's comment reaches the agent' (its set, run and tell_agent) didn't take effect: no job started. The same failure earlier today on INBOX-567 (STD-257), INBOX-580 (STD-262), INBOX-592 (DEV-732), while INBOX-554 (STD-210), 613 (DEV-757), 621 (LOCA-571) went through: intermittent, not tied to one repo. The owner felt his inbox inputs didn't respond. The step the STD rule runs, `repos.ts --inbox STD-299`, takes 0.2 s alone. Suspects: the nested lotar call's own automation (tell_agent, or the storage lock the outer server run holds, crates/lotar-agent/src/services/automation_service.rs), and whether the server blocks the comment request for those 300 s. Done when: a nested lotar comment from a run command returns within seconds and its own rules fire, with a test that reproduces the hang first; and a run that times out leaves a visible comment on the ticket, not only a server log line.

      Cause (found 2026-11-22 while working this ticket): DEV-812. The 'Inbox: the owner's answer goes to the source' runs hung on lotar's git calls with no timeout: macOS held git's open of ~/.gitconfig (a symlink into Dropbox) behind an access check for the newly upgraded lotar path. The nested comment itself was fast: a replica of standards' INBOX/STD rules relayed in 0.4 s through `lotar serve`, also with 5 answers at once.

      ## Done when

      - [x] A waited-for run that times out leaves a comment on its ticket naming the rule and the timeout, besides the stderr line and the automation_failed event. The rule's later actions still don't run. If writing that comment fails, the run's error is still what's reported, and the comment's failure goes to stderr.
      - [x] Test: dev278 `run_commands_time_out` fails before the change (no comment) and passes after.
      - [ ] The nested comment returns within seconds while git hangs: that is DEV-812's git timeout. This ticket depends on DEV-812 for it; check it once DEV-812 lands.
      - [x] npm run lint, npm test, npm run smoke pass.
    new: '-'
