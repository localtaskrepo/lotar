- date: 2026-11-26T01:30:37.275315+00:00
  author: claude
  text: |-
    Fix 2 done here, fix 1 filed in standards as STD-369; DEV-808 waits on STD-369.

    - Fix 2 (`c049f6f1c`): when a run times out, lotar now kills the whole process tree, including the process groups its children started, such as a nested `lotar` run. `kill_process_group` in `crates/lotar-core/src/utils/git.rs` stops the tree, lists it with `ps` and kills each group. `run_and_wait` in `automation_service.rs` now uses it.
    - It was worse than orphans: the orphaned group kept the run's output pipe open, so the outer run never returned. The new test `run_timeout_stops_nested_process_groups` (dev278) hung for 580 s before the change and passes in about 1 s after it.
    - Replica with this branch's build: an outer run with a 3 s limit calls `lotar comment` on SR-1, and SR-1's rule runs `git` with `HOME/.gitconfig` a FIFO. The run stopped at 3.1 s, IN-1 got the timeout comment, and no `sh` or `git` was left behind.
    - Fix 1: [STD-369](https://standards.pyxzl.net/task/STD-369) asks for a timeout on `git()` in `scripts/repos.ts`. Filed with `--finding git-timeout:scripts/repos.ts --tag health`. DEV-808 depends on it and is tagged `waits`.
    - Found on the way: the installed `0.15.6` stored `task edit -D -` as a literal `-` (DEV-842, already fixed on main). I restored the description.
