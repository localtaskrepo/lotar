- date: 2026-11-23T02:46:38.539871+00:00
  author: claude
  text: |-
    Timeout comment done; the hang itself is DEV-812, so this waits on it.
    - Cause: lotar's git calls have no timeout. After the brew upgrade, macOS held git's open of `~/.gitconfig` (Dropbox) behind an access check, and the `lotar` calls of `repos.ts --inbox` sat there until 300 s. A replica of the INBOX/STD rules relays in 0.4 s, also with 5 answers at once.
    - Change: a waited-for run that times out now comments on its ticket: `Automation rule '…' stopped its run on X: it did not finish within Ns. The rule's actions after it didn't run.`
    - Test: `run_commands_time_out` (dev278) failed before, passes now.
    - Filed on the way: DEV-822 (runs fail with ENOENT for `--tasks-dir .tasks`), DEV-823 (a live transaction in another project refuses writes as a crashed one).
  report:
    commits:
    - hash: f5a3211f2
      what: run timeout comments on the ticket
    checks:
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: passed
    next: 'Once DEV-812 lands: check an inbox answer relays within seconds while git hangs, then set Done'
- date: 2026-11-25T17:10:31.305638+00:00
