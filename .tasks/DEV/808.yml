- date: 2026-11-25T17:25:41.972388+00:00
  author: claude
  text: |-
    Still hangs with DEV-812: the git call that blocked the relay was standards' `repos.ts`, not lotar's. DEV-812 can't fix it.

    - Installed lotar is still `0.15.6` from Nov 22, before DEV-812. So I built main `d4084d484` plus this branch's `f5a3211f2` in a scratch folder.
    - The test: a copy of the INBOX and STD rules in two scratch git repos, with `HOME/.gitconfig` replaced by a FIFO, so any git call blocks like the Dropbox open did.
    - The source rule runs `lotar list`: the relay takes **0 s**. It's 0 s on the old 0.15.6 too, so lotar's own git calls never hung the relay.
    - The source rule runs `git -C <repo>/.tasks rev-parse --path-format=absolute --git-common-dir`: the relay hits the **300 s** limit. IN-1 stays Todo and gets this branch's timeout comment. That is the exact call the DEV-812 report saw hung. It comes from `mainCheckout()` in `standards/scripts/repos.ts:181`, whose `git()` helper (`:164`) calls `spawnSync` with no timeout.
    - Second gap, in lotar: when the outer run times out, the nested rule's `sh` and `git` keep running as orphans (own process group, parent 1). Only the outer process group is killed. That matches DEV-812's "repos.ts children stay blocked".
    - The trigger is gone for now: `~/.gitconfig` is a regular file, no longer a Dropbox symlink.
    - No files changed in this round. I removed my scratch processes.

    **Question:** should I file two fixes and let DEV-808 wait on them, or close DEV-808 now that `~/.gitconfig` is fixed? The two fixes: a timeout on `repos.ts`'s `git()` in standards, and lotar stopping a nested run's process group when the outer run times out.
  report:
    checks:
    - command: inbox relay replica, ~/.gitconfig a FIFO, build of main d4084d484 + f5a3211f2
      result: failed
      reason: still 300 s; the git that hangs is standards' repos.ts, not lotar
    - command: same replica, source rule runs lotar instead of git
      result: passed
      reason: 0 s, IN-1 Done, SR-1 commented and InProgress
    - command: same replica on installed 0.15.6 (pre-DEV-812), source rule runs lotar
      result: passed
      reason: 0 s, lotar's own git calls never hung it
    next: 'Owner: answer the question above'
- date: 2026-11-25T17:25:58.188735+00:00
  author: triage
  text: |-
    Answer: file the two fixes and keep DEV-808 open until they land. Don't close it on the gitconfig change alone.

    - Source: the owner's global rule "A repo problem you leave: lotar add ... --finding <check>:<subject> --tag health" (`~/.claude/CLAUDE.md`), and "an obvious small flaw: fix it right away". Filing and fixing these is in scope, no approval needed.
    - Fix 1: a timeout on `git()` in `standards/scripts/repos.ts:164`. File it in standards.
    - Fix 2: lotar kills a nested run's process group when the outer run times out. Do it here or file it in lotar.
    - Then check an inbox answer relays within seconds while git hangs, and set Done.
