description: |-
  Found by STD-54 (the owner's inbox, https://standards.pyxzl.net/task/STD-54): a status or assignee an agent sets during its job (docs/help/agent.md, Status and assignee during a job) applies when the job ends, but fires no updated or assigned rule. The common hand-back, HelpNeeded and assignee mallox from a T3 thread, therefore never reaches a rule like

      when: { all: [ { status: HelpNeeded }, { current: { assignee: mallox } } ] }
      on: { updated: { run: ... } }

  Reproduced with lotar 0.14.1: a command-runner profile whose script runs lotar status <ID> HelpNeeded and lotar assignee <ID> mallox without the LOTAR_* environment (as a T3 thread does); both are deferred, applied at job end, and the updated rule never runs, while the same two commands outside a job fire it.

  ## Done when
  - Applying a job's outcome dispatches the change events (updated, assigned) for the fields it changed, with previous.* the state before, after the job_completed/job_failed/job_cancelled rules ran.
  - A rule's own set still fires no other rule (loop safety), and docs/help/agent.md and automation.md say which changes fire rules.
  - A test with a job whose outcome sets status and assignee and a rule on updated.

  Until then the standards inbox relies on its daily sweep (repos.ts --report).
