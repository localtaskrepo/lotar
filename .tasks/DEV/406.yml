  text: 'Done in c858ddf on agent/DEV-406. apply_job_outcome (src/services/automation_service.rs) now applies the outcome without automation and then dispatches apply_task_update with previous = the ticket after the job_completed/failed/cancelled rules ran, so updated and assigned rules fire (an agent profile as assignee still starts its job, via the same path). A no-op outcome fires nothing. A rule''s own set/add/remove/comment still fires no change rules (only unblocked), as before. Docs: agent.md (Status and assignee during a job) and automation.md (job hooks, plus a new Execution semantics bullet on which changes fire rules). Test: dev320_job_outcome_test::the_outcome_fires_the_updated_and_assigned_rules covers outcome HelpNeeded + mallox, an updated rule with all/current (fires, previous.status/priority from after the end rule), an assigned rule (previous.assignee), and a rule on the end rule''s priority set (doesn''t fire). It fails without the fix. Checks: lint:agent, test:agent (Rust, UI, release, hooks), test:smoke:agent (385 passed), all green.'
