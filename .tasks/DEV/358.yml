description: 'Found by DEV-355 (claude, 2026-11-11): in a full npm run test:agent run (branch agent/DEV-355 at 7bd5c46, without the DEV-349 fix from main, while other agent jobs ran on the machine), tests/agent_safety_test.rs:100 panicked ''worker did not exit after draining jobs'' after the 15 s wait_worker deadline. Earlier full runs passed it. May share the cause of DEV-349/DEV-351 (other worktrees'' wrapper processes counted as active jobs); unconfirmed. Check: cargo nextest run --cargo-profile local worker_persists_trailing passes repeatedly under full-suite load on main. Done when the worker exits for a reason the test controls, not a timeout race.'
