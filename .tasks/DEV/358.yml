comments:
- date: 2026-11-12T05:02:05.534862+00:00
  text: 'claude: Reproduced on main (f10a63c) standalone: 4 of 6 runs hit the 15 s deadline. Not DEV-349: the worker is busy, one log event (open+2 writes+close) per stderr line, ~2.5 ms each under I/O load, so 6000 lines outlast 15 s. A second failure under load: ''trailing stderr must be persisted''. read_job_output stopped 5 s after the runner exited even while reading output the runner left in the pipe, failing the job and dropping its last lines (docs/help/agent.md promised available output is drained). Fix in progress: drain the bytes in the pipe at exit (FIONREAD/PeekNamedPipe) before the 5 s descendant limit starts; one write per log event; test burst 100 lines of 1 KB (still more than a pipe holds).'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Acb13752d-02d4-4f9a-8cdf-d5868377dfce
description: 'Found by DEV-355 (claude, 2026-11-11): in a full npm run test:agent run (branch agent/DEV-355 at 7bd5c46, without the DEV-349 fix from main, while other agent jobs ran on the machine), tests/agent_safety_test.rs:100 panicked ''worker did not exit after draining jobs'' after the 15 s wait_worker deadline. Earlier full runs passed it. May share the cause of DEV-349/DEV-351 (other worktrees'' wrapper processes counted as active jobs); unconfirmed. Check: cargo nextest run --cargo-profile local worker_persists_trailing passes repeatedly under full-suite load on main. Done when the worker exits for a reason the test controls, not a timeout race.'
