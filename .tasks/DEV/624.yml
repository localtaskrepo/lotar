- date: 2026-11-16T23:23:29.772740+00:00
  author: claude
  text: |-
    Fixed: serve tests now wait up to 15 s for a response, not 1.5 s.

    - `crates/lotar-lib/tests/cli_serve_features_test.rs`: new `RESPONSE_TIMEOUT` (15 s) in `http_request`, as DEV-354/DEV-359 did for `web_api_integration_test.rs`. A real hang still fails within that.
    - Status 0 only happened when no header came within the per-read wait; a late answer now counts.
    - Before check not reproduced: with the old 1.5 s, 3 runs at load ~140 also passed (tests finish in 0.3 s now), so the evidence is the 5 passes after the fix plus the code path.
    - Found while testing: `serve_reports_requested_port_exactly` failed 1 in 11 parallel runs (reserved port taken before serve binds it). Filed as DEV-627.
