  text: |-
    Draft done: `agent-team` template (19 rules, 4 profiles) plus the list of our rules that are generic.

    - Draft: `docs/developers/agent-team-template.draft.yml`; list and gaps: `docs/developers/agent-team-template.md`. Not registered, `lotar init` doesn't offer it yet.
    - Flow: `@implement` → `@review` on a second provider (Codex), fresh session → `@merge` → Done. Two rework rounds, then the reporter is asked. One retry on `@implement-retry`. Merge retries once. `waits` → Blocked → continue when prerequisites are done. A person's comment reaches the agent. A no-change job closes itself. Paused jobs comment once.
