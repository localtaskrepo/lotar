  text: |-
    Explore done: draft template `agent-team.yml` committed, and our rules sorted into generic and ours-only.

    **Draft** `crates/lotar-lib/src/cli/handlers/config/init/templates/agent-team.yml` (`d9394237f`), 23 rules, not yet listed by `lotar init`:
    - Profiles `@implement`, `@implement-retry`, `@review` (codex, fresh session), `@merge`
    - Statuses Todo, InProgress, Reviewing, Merging, Blocked, HelpNeeded, Done, WontDo
    - Questions and failures go to `@reporter`; no names, repos or hosts of ours

    **Generic, in the draft** (from standards `automation.yml`):
    - Implement → review on another runner → merge ("Fix done: review on Codex", "Review passed: merge")
    - A failed review asks the reporter instead of merging
    - Blocked review: two reworks in the implementer's session, the third asks the reporter
    - A failed job retries once on `@implement-retry`, then asks the reporter
    - A failed merge goes back to the implementer once, then to the reporter
    - Tag `waits` → Blocked, and "Prerequisites done" continues it (tell_agent)
    - A person's comment reaches the agent (tell_agent)
    - A no-change job closes the ticket itself (prompt step)
    - "Job paused: comment once", clear the tags on Done

    **Left out, ours alone:**
    - Health, light, fable and research profiles and rules; Research type
    - Inbox and triage, `repos.ts` (`--inbox`, `--asked`, `--live`), worktree install from `repos.json`
    - T3 thread names and tools, thread-list and cross-project steps, "Answered in the thread", "Stalled" rules
    - `repos.json` push rule, `lotar trust` by agents, the ui-review screenshot steps, the phone format
    - Question comments with options: a rule can only post plain text, so ours use `run: lotar comment --question` (needs trust). The draft's comments name the choices in words.

    **Found in lotar while drafting:**
    - `comment: { author: "@user" }` matches agents' comments too: `@user` means "not a profile name", and agents comment as `claude`/`codex`. The draft lists the runner names to exclude them. A `@person` placeholder would be cleaner. Proposed as part of the build, not filed yet.
    - A real comment in my scratch test queued a real `@implement` job. I removed it before it started (`lotar agent queue remove`).
