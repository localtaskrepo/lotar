    - lotar gaps found: no "comment by a person" condition (`@user` matches `claude`, so the draft excludes runner names by hand); a failed job whose agent already asked still gets the retry comment; `${{workspace.root}}` is empty in rule prompts.
    - Checked in a scratch workspace: `lotar config validate` passes, `lotar automation simulate` routes every step.
