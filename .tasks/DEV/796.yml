  author: claude
  text: |-
    Drafted `agent-team` (attached: `agent-team.62b50a5c4b3d30bc978cd67f599e1c4f.yml`, 440 lines, 21 rules); nothing wired into lotar yet.

    **Generic, in the draft**
    - implement → review in a fresh session on a second provider (Claude → Codex) → merge → Done
    - Review verdict via `lotar comment --review block`; a rule tags it, two reworks in the author's own session, third block → `@reporter`
    - No merge after a crashed review
    - Failed implement job: one retry on `@implement-retry`; failed merge: back to `@implement` once; second failure → `@reporter`
    - Usage-limit pause comments once; agent waits on a ticket (depends-on + tag `waits`) → Blocked → continues when done
    - A person's comment reaches the agent (`tell_agent`); a no-change job closes itself; optional `agent.merge`

    **Ours alone, left out**
    - health/light tickets, `repos.ts` (inbox, `--asked`, worktree setup), INBOX triage, Research type
    - T3-specific: "Answered in the thread" rules, thread tools, `t3_thread_list` step
    - `mallox`, `repos.json` push list, the auto-start of tickets agents file, Stalled restarts, `@fix-fable`/`@fix-light`
    - UI screenshot rule (needs skill `ui-review`)

    **Checked**
    - `lotar config validate` passed on the draft's config in a scratch repo
    - `lotar automation simulate`: manual start, a person's comment, review verdict tag, blocked review → rework all route as meant

    **lotar gaps it shows**
    - A rule's `comment` can't ask a question with options: ours uses `run: lotar comment --question` (needs trust), the draft writes plain text
    - Agent comments carry the person's name unless the prompt sets `LOTAR_DEFAULT_REPORTER`; the comment rule relies on that. lotar could set it to the profile name in jobs.
    - `${{agent.profile}}` in a next job's prompt is the ended job's, so prompts hardcode their names
