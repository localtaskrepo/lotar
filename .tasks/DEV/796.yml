- date: 2026-11-24T16:04:56.070840+00:00
  author: claude
  text: |-
    Drafted `agent-team` (attached: `DEV-796-agent-team-draft.yml`, 385 lines) and sorted our rules into generic and ours. Nothing is wired into lotar yet, so there's no commit.

    **Generic, in the draft** (from standards `configs/lotar/automation.yml`)
    - Review in a fresh session on a second runner (`@review`, codex; claude implements)
    - Blocking review goes back to `@implement` twice (tags `review-returned`, `-twice`), the third time to `@reporter`
    - A crashed review doesn't merge; it goes to `@reporter`
    - A failed implement job retries once on `@implement-retry`, then goes to `@reporter`
    - A failed merge goes back to `@implement` once, then to `@reporter`
    - Tag `waits` sends the ticket to Blocked; the `unblocked` event continues it with `tell_agent`
    - A person's comment reaches the agent (`tell_agent`) on InProgress, Reviewing, Merging and HelpNeeded tickets
    - A job with nothing to commit closes the ticket itself; a "Done when" is written before the code
    - A paused job comments once; Done clears the workflow tags

    **Ours alone, left out**
    - Health findings, `@fix-light`/`@fix-fable`, Research type, the inbox and triage, `repos.ts --inbox/--asked/--live` (stall restarts), `worktree.ts`
    - T3 thread names, `t3_thread_list`/cross-project-help, `repos.json` push/install, `mallox`, ticket model fields

    **Needs your decision before it ships**
    - Agent-filed tickets start `@fix` on their own (reporter claude/codex): left out, assigning `@implement` starts the work
    - The UI step with screenshots (skill ui-review): left out, since it depends on a skill
    - Question comments with options (`lotar comment --question`) need a `run`, and `run` needs `lotar trust`: the draft uses plain comments instead

    **lotar gaps the draft ran into**
    - `lotar config validate` doesn't check automation.yml: a rule with `status: Nope` passed. The ticket's done check needs `automation simulate` or a new validate step
    - A comment's author can't be told apart: `@agent` matches only `@profile` names, and agents comment as `claude`/`codex`. The draft therefore lists runner names
    - A profile assigned by hand gets the prompt of the first rule that assigns it, here the rework prompt, so the work instructions are in the profile's `instructions`

    **Checked**
    - `lotar config validate --project TEAM` passes for the draft in a scratch repo
    - `lotar automation simulate` runs these steps: implement done → review, implement failed → retry, review blocked second time → rework, third time → reporter, comment → tell_agent
    - The simulate runs queued 2 real jobs from the scratch repo (`TEAM-1`, `TEAM-2`). I removed both with `lotar agent queue remove` before they started; the memory hold kept them from running
