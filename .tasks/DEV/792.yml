- date: 2026-11-22T18:58:43.115280+00:00
  author: claude
  text: |-
    A failed start wait now reports within 1 s instead of hanging to vitest's 120 s timeout.

    - `smoke/tests/harness.agent-launcher.smoke.spec.ts`: new `exitDetail(exit)` races the wrapper exit against 1 s; the shim, fwd and conflict catch blocks all use it.
    - `awaitExit` also exposes `stderrSoFar()`, so a hung wrapper still reports its stderr (`wrapper still running stderr=…`).
    - Check: with the shim wait set to label `nolabel` for 2 s, the test failed in ~3 s with that message (change reverted).
    - On main the waits are still 10 s; DEV-781 (Merging) raises them to 45 s and doesn't touch these catch lines, so the two combine without conflict.
