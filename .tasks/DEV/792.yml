description: |-
  Found (review of DEV-781): in `smoke/tests/harness.agent-launcher.smoke.spec.ts` the shim and fwd tests (lines ~396 and ~456) catch a failed `gate.waitForStarted` (now 45 s) and then `await exit`, whose bound is now 90 s. 45 + 90 s is past the 120 s `testTimeout`, so a hung wrapper ends in vitest's generic timeout and the stderr diagnostic is lost. The conflict test already races `exit` against 1 s.
  Check: read the two catch blocks; or force waitForStarted to fail with a wrapper that hangs.
  Done: both catch blocks race `exit` against a short bound like the conflict test, or the test timeout covers the waits.
