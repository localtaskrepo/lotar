description: |-
  Found in the DEV-768 review: `f6a3671d2` (now `a7d97ede2` on `agent/DEV-768`) adds `agents.<name>.description`, shown under the name and matched by the picker's search, but two docs still describe the state before it.

  - `docs/help/serve.md` (Assignee picker bullet): 'Each agent shows its runner, model, effort and provider. Every word you type must match a name, runner, model, effort or provider' – should name the description line and that search matches it.
  - `docs/help/api-quick-reference.md` (GET /api/agents/profiles): the field list '(name, runner, model?, effort?, provider?, permissions)' leaves out description?.

  Both lines come from DEV-768 and exist only on its branch: this ticket starts after DEV-768 is on main.

  ## Done when
  - [ ] `docs/help/serve.md` Assignee picker bullet says each agent shows its description (when set) under the name, and that every typed word may also match the description.
  - [ ] `docs/help/api-quick-reference.md` GET /api/agents/profiles field list reads `(name, runner, description?, model?, effort?, provider?, permissions)`, matching `AgentProfileInfo` in `api_types.rs` and `view/api/types.ts`.
  - [ ] No other help page describes the picker or profile fields without the description (`grep -rn` over `docs/help`).
