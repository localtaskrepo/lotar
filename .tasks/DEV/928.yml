- date: 2026-11-27T13:11:22.942512+00:00
  author: claude
  text: |-
    Added the test: a refused internal-API settle is noted once and retried at the next look.

    - `a_failed_thread_the_internal_api_doesnt_settle_is_noted_once_and_retried` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: a done ticket's thread listed `failed`, with `ws-refuse` set. The first look notes `was not settled` once, the second adds no note, and after `ws-refuse` is removed the third settles it (`ws_settle`, `Settled the T3 Code thread …`).
    - The looks are throttled (`look_every`), so a second look in a row didn't run and passed without testing anything. The test sets `LOTAR_AGENT_RESUMED_LOOK_SECONDS=0` so every look runs.
    - No product code changed. Diff: 29 lines, so no `small-diff` tag.
