- date: 2026-11-17T02:10:37.465076+00:00
  author: claude
  text: |-
    Review: blocking. The adoption logic does what "Done when" asks, but its main test is flaky.

    **Blocking**
    - `crates/lotar-lib/tests/dev626_resumed_t3_threads_test.rs:151`: `wait_for("the job to end", … job.status != "running")` passes at once while the adopted job is still `queued`. `resumed.rs:296` creates the job as `AgentJobStatus::Queued`, and it becomes `running` only when the spawned thread reaches `mark_started`, after `init_job_log` has run. Under load, `assert_eq!(ended.status, "completed")` at line 153 then fails. It failed in 1 of 2 full `cargo nextest run --workspace` runs here and passes alone. The same wait at line 182 lets the second test end while the job still runs. Fix: wait for an end status (`completed`/`failed`/`cancelled`), not `!= "running"`.

    **Read and checked**
    - Diff `main..HEAD`: `1227e5bd` (DEV-620) is patch-identical to main's `6a78ba88` (`git cherry` shows `-`), so a rebase drops it. The real change is `55e2126a`.
    - Field names match the real `t3 thread list --json`: `threadId`, `status`, `latestRunId`, `link`.
    - The adopted job's merge-job fields (`main_head_at_start`, `assignee_at_start`) are filled by `start_job`, so `ensure_branch_merged` works as for other jobs.
    - The `max_parallel_jobs` gap is filed as DEV-630, not handled here, as the ticket says.
    - No owner decision is involved: "adopt" is claude's decision, quoted in the ticket.
    - Clippy, rustfmt and prettier are clean. The fix agent named no checks it ran.

    **Minor, filed**
    - DEV-639: a resumed thread is taken over while a newer thread of the ticket waits for an answer (against DEV-600's hold).
  report:
