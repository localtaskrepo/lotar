- date: 2026-11-17T01:13:44.541125+00:00
  author: claude
  text: |-
    Done: lotar now takes over a T3 thread that runs again with no lotar job, so its result reaches the ticket.

    - **Decision: adopt, not stop.** T3's CLI can't interrupt a thread (`t3 thread` offers only list, start, send and show; harnessmux 0.1.9 says the same). Adopting also keeps the thread's work instead of redoing a fresh build plus lint, test and smoke.
    - `agent_job_service/resumed.rs`: the queue worker and `lotar serve` look every 30 s. One `t3 thread list` call covers all threads, and only when an ended t3 job has one.
    - **Adopting:** the newest job's thread on an open ticket with no active or queued job becomes a new job of that profile. The ticket goes back to `@<profile>`, the `job_started` rules run, and the job follows the run without sending a turn. Its end rules run once. It counts toward the job limit.
    - **Duplicates:** a second running thread of the ticket, or one beside an active job, gets one comment per run asking to stop it in T3 Code.
    - **Left alone:** a thread waiting for an answer, a ticket with a queued entry, a done ticket's thread, and a cancelled job's thread.
    - **Cross-process:** a lock per ticket and a marker per thread run; the record is written before the lock is released. Session ownership is checked through harnessmux's socket, because pids can be reused after a reboot.
    - **Tests:** `tests/dev626_resumed_t3_threads_test.rs` uses a fake t3 (adopt plus end rule once, second thread, waiting thread, cancelled job). The adoption tests fail without the fix.
    - **Docs:** `docs/help/agent.md`, T3 Code threads section.
    - **Limit finding:** the worker ignores a project's `max_parallel_jobs`, on main too. Filed as DEV-630.
    - **Follow-up for the owner:** the standards prompt step "answered in the thread → `lotar automation run ... review`" now overlaps with adoption, whose end rules already move the ticket on. Worth simplifying in `configs/lotar/automation.yml`.
    - **Disk:** the disk filled twice. With the owner's OK I removed `target/` in DEV-604's four worktrees (DEV-604 is Done). The owner freed the rest.
    - **Build:** sccache's server has lost its temp dir (`/var/folders/.../lotar-rust-temp-5iNLa7`), so every build here ran with `RUSTC_WRAPPER=`.
