- date: 2026-11-23T03:18:23.004479+00:00
  author: claude
  text: |-
    It happened again in the DEV-771 review job (2026-11-22).

    - In a scratch folder outside the repo, `lotar add` went to the real backlog and created DEV-824..826 (assigned `@fix` by `agent run`). They were never in the real queue, and I deleted them within minutes
    - Workaround: set `LOTAR_TASKS_DIR` and `LOTAR_WORKSPACE_ROOT` to the scratch folder. The scratch repo also needs `LOTAR_TRUST_ALL=1` before `agent run` queues anything
- date: 2026-11-23T04:28:09.732030+00:00
  author: claude
  text: |-
    Hit again by the DEV-802 review job: scratch `lotar add` in `/tmp` went to the real backlog.

    - Created DEV-825 ("first") and DEV-826 ("main again") in the main checkout's `.tasks/DEV`; both untracked, unreferenced, removed within a minute.
    - Workaround used: `env -u LOTAR_TASKS_DIR -u LOTAR_WORKSPACE_ROOT lotar ...`.
- date: 2026-11-23T04:46:40.948879+00:00
  author: claude
  text: |-
    Fixed: `npm run seed:test-tasks` now always seeds its own folder, even inside an agent job.

    - `scripts/demo/workspace.mjs`: new `seedEnvironment(dir)` drops every inherited `LOTAR_*` (`LOTAR_TASKS_DIR`, `LOTAR_WORKSPACE_ROOT`, `LOTAR_PROJECT`, ...) and sets `LOTAR_TASKS_DIR=<dir>/.tasks`; `demoEnvironment` builds on it
    - `scripts/generate-test-tasks.mjs`: the add/enrich calls and `--serve` use `seedEnvironment`, `--demo --serve` uses `demoEnvironment`. `--dir` is resolved to an absolute path (a relative one would have pointed lotar at `<dir>/<dir>/.tasks`)
    - New `scripts/tests/seed-test-tasks.test.mjs`: runs the script with a stub lotar and a decoy backlog. Added as `npm run test:seed` (with the existing `demo-workspace.test.mjs`, which nothing ran before) in `npm test`, `test:agent` and CI `ui_tests`
    - `AGENTS.md`: in a job, scratch `lotar` commands need `env -u LOTAR_TASKS_DIR -u LOTAR_WORKSPACE_ROOT` or `--tasks-dir`
    - No UI change. Guidance: the AGENTS.md line above is the only guidance change
