- date: 2026-11-24T17:23:01.837284+00:00
  author: claude
  text: |-
    Review: blocking. The code fix is correct, but the commit and the ticket each need one fix before merge.

    **Blocking**
    - Commit `4cf6a8cd7` has the subject `DEV-818 Example ticket for the Agents page`. That is the title of the deleted ticket that had this ID before (see DEV-843), not this ticket's title. On main it would stay wrong for good. Fix: `git commit --amend` the subject to `DEV-818 In an agent job, lotar commands in a scratch folder write to the real backlog: the job's LOTAR_TASKS_DIR wins over the folder's .tasks` and keep the body.
    - The ticket's description is now `-`. The fix job's edit at 2026-11-23 04:34Z replaced the Found / Done when text: `-D -` stores a literal dash and doesn't read stdin (DEV-842). The comment says the Done when was "tightened", but it is gone. Fix: restore the old text from `lotar task timeline DEV-818` (the 04:34Z description change). Use `-D "<text>"`, not `-D -`, and tick both boxes.

    **Checked, fine**
    - Diff `main...HEAD`: 7 files, only the seeder, its test, `package.json`/CI wiring, `AGENTS.md` and `docs/developers/testing.md`. No stray files and no second branch. It merges cleanly onto main `504d8b538`.
    - Done when 1: `seedEnvironment` in `scripts/demo/workspace.mjs:26` covers the add and enrich calls and `--serve` in `scripts/generate-test-tasks.mjs:140,239`. `--demo --serve` uses `demoEnvironment` (`:167`). `screenshots.mjs` behaves as before.
    - Done when 2: the new `AGENTS.md` line is right. In this job, `--tasks-dir <dir>/.tasks` won over the job's `LOTAR_TASKS_DIR` (tried).
    - `npm ci`: ok. `npm run test:seed`: 4/4 passed.
    - Failing test first: with the old `generate-test-tasks.mjs`, the new test fails (lotar saw the decoy backlog and `LOTAR_PROJECT=DEV`).
    - Real binary in this job's environment: `generate-test-tasks.mjs --count 4` put 4 tasks in the seed folder. The real backlog stayed at 1335 files.
    - `prettier --check` and `oxlint` on the 3 changed scripts: clean. The Prettier warnings on `package.json` and `ci.yml` are already on main, and `fmt:js:check` doesn't cover those files.
    - Not rerun: full `lint:agent`, `test:agent`, `test:smoke:agent` (the fix agent reports them passed). No UI change, so no UI review.

    **Filed (minor)**
    - DEV-842: `lotar task edit/add -D -` saves `-` instead of reading stdin.
    - DEV-843: a queued job for a hard-deleted ticket runs on the ticket that reuses its ID, with the old title in its prompt.
