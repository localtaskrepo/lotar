description: |-
  Found in the review of DEV-789.

  ## Found

  An agent job exports `LOTAR_TASKS_DIR=<main checkout>/.tasks`, and it wins over a folder's own `.tasks`. So a `lotar add` that an agent runs in a scratch folder for a manual check creates real DEV tickets. Without a project config, those tickets also get the default `@fix` assignee.

  - DEV-789 review: `lotar add` in `/tmp/...` created DEV-818 (assignee `@fix`). I hard-deleted it before a job started.
  - DEV-771: the same thing created DEV-798..801 (its comment of 2026-11-22).
  - Check: `cd <dir with .tasks/config.yml> && lotar list` inside a job lists DEV; `env -u LOTAR_TASKS_DIR lotar list` lists the folder.
  - `scripts/generate-test-tasks.mjs` (`npm run seed:test-tasks`, which AGENTS.md names for manual scenarios) spawns lotar with `{ ...process.env }`, so in a job it would seed into the real backlog too.

  ## Done when

  - [x] `npm run seed:test-tasks` (both its `lotar add` calls and `--serve`) ignores an inherited `LOTAR_TASKS_DIR`, with a test.
  - [x] The guidance for manual scenarios (AGENTS.md or testing-strategy) says that in a job, scratch `lotar` commands need `env -u LOTAR_TASKS_DIR` or `--tasks-dir`.
tags:
- agent
- health
