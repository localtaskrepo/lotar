  Move the `agent.job_history.keep_days` and `agent.job_history.max_mb` lines after `agent.memory_gate.settle_seconds`.

  ## Done when

  - [ ] The three `agent.memory_gate.*` lines are together, followed by the two `agent.job_history.*` lines.
