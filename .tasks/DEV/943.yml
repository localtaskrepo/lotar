description: |-
  Found in the DEV-941 review (2026-11-27).

  - DEV-941 changed `kept::settle` (`crates/lotar-agent/src/services/agent_job_service/kept.rs:145`) from `is_some_and(settled)` to `is_none_or(settled)`: a later job's thread that T3 Code's list leaves out (older settled, archived) now lets the earlier kept threads be settled (DEV-747 rule).
  - No test covers it: the dev503 fake snapshot lists every thread, settled ones too.

  ## Done when

  - [ ] A dev503 test leaves the later job's thread out of the fake snapshot and checks that the earlier completed kept thread is settled, and that a thread not listed is never settled itself.
