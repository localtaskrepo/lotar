    Added a dev503 test: a later thread that T3 Code's list leaves out counts as settled. Commit `5a13b3c95`.

    - New test `a_later_thread_the_list_leaves_out_counts_as_settled` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`. Two jobs run on an open ticket (InProgress, assigned to mallox). While both threads are listed unsettled, nothing is settled. With `thread-1` left out of the list, `thread-0` is settled and `thread-1` never is, also after another look.
    - The fake `t3 thread list` and the WebSocket shell snapshot leave out a thread when a `hidden-<id>` file is there.
    - With the old `is_some_and` back at `kept.rs:145`, the test fails, so it covers DEV-941's rule.
    - The branch was fast-forwarded onto main (`1a7112098`, DEV-941) first.
