- date: 2026-11-24T21:18:35.359789+00:00
  author: claude
  text: |-
    Reproduced live on this ticket: T3 resumed both paused job threads at the reset, so two sessions worked in the DEV-833 worktree at once. I stopped and left the fix to the other session.

    - Threads `mcp:launch:d283ffe…` (19:10Z job) and `mcp:launch:6ec0824…` (20:10Z retry) both `running` since about 21:14Z, each sent "Continue where you left off." by T3
    - Neither thread was taken over: `agent list-jobs` shows no DEV-833 job, and the 21:10Z retry is still queued, so it would start a third session
    - Hourly retries: the reset time is only in the assistant message ("resets 1pm (America/Los_Angeles)"), and `usage_limit_pause` reads only `runner_errors`, so it waits the default hour
    - The uncommitted diff in the worktree (`after_limit`, the retry continues the same T3 thread) belongs to the 6ec0824 session; I sent it these findings and made no edits
