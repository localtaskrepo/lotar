- date: 2026-11-24T21:26:14.274264+00:00
  author: claude
  text: |-
    Cause found, fix in progress on `agent/DEV-833`: each hourly retry of a paused t3 job opened a new T3 thread, and T3 resumes every paused thread at the reset

    - T3 marks each paused turn ("This turn is paused until the 7-day limit resets in 21h 43m") and sends "Continue where you left off." at the reset (DEV-800 thread `mcp:launch:947bb4…`)
    - lotar sees only "Try again later", waits an hour, and the retry (`session` new, or idle past `continue_within_minutes` 55) starts thread N+1
    - Fix: a t3 limit retry continues the paused job's thread (`session: continue`, no idle handoff), and the reset time comes from the agent's reply ("resets 1pm (America/Los_Angeles)") when the runner's error names none
- date: 2026-11-24T21:48:50.912806+00:00
  author: claude
  text: |-
    Fixed: a t3 job's retry after a usage limit now continues the paused job's T3 Code thread instead of starting a new one.

    - Cause: T3 Code pauses the turn and resumes it at the reset by itself. lotar saw only "Try again later", retried every hour in a new thread, and T3 Code resumed every one of those threads at the reset. DEV-800 had about 10.
    - The retry now has `session: continue`, also past `continue_within_minutes`. The job note says "in the same T3 Code thread".
    - When the error names no reset, the reset is read from a limit line in the agent's reply ("resets 1pm (America/Los_Angeles)"), so there are no hourly retries.
    - New test in `dev503_harness_jobs_test.rs`: one `t3_thread_launch`, then one `t3_thread_send` to the same thread. The docs (`docs/help/agent.md`, Usage limits) are updated.
    - Retries already in the queue from the old binary (DEV-833's 21:10Z one) still start a new thread.
    - Possible follow-up for harnessmux, not filed: report T3's `system_notice` limit item and its reset epoch.
    - Guidance: no durable finding.
