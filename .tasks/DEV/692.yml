- date: 2026-11-18T04:03:32.949630+00:00
  author: claude
  text: |-
    **Done.** List rows leave out description, comments and history; JSON is gzipped; a ticket change refreshes only that ticket.

    Copy of this repo's tasks (694 DEV tasks, 859 total), release builds, median of 5 local calls:

    | request | before | after |
    |---|---|---|
    | full list (`limit=1000`) | 6.84 MB, 78 ms | 751 KB plain / **155 KB gzip**, 38 ms |
    | page of 50 | 844 KB, 36 ms | 15.5 KB gzip, 34 ms |
    | one ticket changed | full list reload (6.7 MB) | `ids=DEV-691`: 784 B |
    | Insights (`include=history`) | 6.84 MB | 556 KB gzip, 64 ms |

    - Open questions, comment and history counts and the board age come from new row fields (`open_question`, `comment_count`, `history_count`, `status_since`).
    - The task panel loads the full ticket with `/api/tasks/get`, so comments still show.
    - Pages look the same before and after: 13 of 18 screenshot pairs are byte-identical and were stored once.

    Screenshots (light/dark at 1920, 1440 and 390 are attached):
    - [list before](attachment:before-list-light-1920.e1e04cc20ed4d4fa065f9563bf92cb7e.png) / [after](attachment:after-list-light-1920.717dbb6b58cf3462447195c27803a211.png)
    - [list phone dark before](attachment:before-list-dark-390.dcc42c52f7fa48bd6b5d195dc70311c5.png) / [after](attachment:after-list-dark-390.b00c86896447c6f1fec1556bf56fdc19.png)
    - [board dark](attachment:after-board-dark-1920.3501b36302298a74b9ea99c5224f8979.png), [insights phone](attachment:after-insights-dark-390.4ce6d3778ececabdd6161ce4bc71c291.png) (same before and after)
    - [panel with comments](attachment:after-panel-light-1440.a8cca1fa5067a859b8fb8435edf17b44.png)
