description: |-
  Owner 2026-11-17 in the cos thread, on lotar and T3 performance ("We now have over a thousand items on each of them and we're quickly creating more. I want to make sure we don't run into issues and slow downs"), picked "Slim ticket list API".

  Measured 2026-11-17 against lotar serve 0.15.3 (load ~25): a full ticket list for lotar is 6.75 MB uncompressed (855 tasks, 3284 comments, 11403 history entries), standards 4.3 MB, local 2.3 MB; 0.26-0.32 s server time. In a 50-row page, comments are 472 KB and history 418 KB of ~1 MB: about 90 %. The web view fetches the whole list again after every ticket change. lotar passes 1000 tickets in about 3 days (a second page request); at current growth list time doubles in 1-2 weeks. Raw numbers: the chief of staff's measurement notes (perf/raw.md in its session scratchpad).

  Change:
  - List and search endpoints return list rows without comments and history (counts instead, where a view shows them); the single-ticket endpoint keeps everything.
  - Compress API responses (gzip or br when the client accepts it).
  - After a ticket change event, the web view updates that ticket instead of fetching the whole list.

  Measured again 2026-11-17 (claude, 859 tasks): without comments and history the rows are still 1.45 MB, 0.8 MB of it descriptions, which no list view shows (only the task panel, which loads the ticket itself). So list rows leave out the description too.

  ## Done when

  - [x] `GET /api/tasks/list` (list and search, `q=`) rows leave out `comments`, `history` and `description`, and carry `comment_count`, `history_count`, `open_question` (the newest unanswered question, when there is one) and `status_since` (when the task entered its current status: the latest change into it, else created when it never changed status, else the latest status change). `GET /api/tasks/get`, SSE payloads, mutation responses, MCP and CLI keep the full ticket.
  - [x] `include=history` on the list puts `history` back in each row (the Insights page uses it: activity, cycle times and trends need every entry). An unknown `include` value is a 400.
  - [x] `ids=A,B` on the list answers only those tickets: the ones that match the filter, with `positions` (their index in the full filtered order) and `total` of the full query. More than 100 IDs is a 400.
  - [x] The lotar list for all tickets is under 1 MB uncompressed.
  - [x] API JSON responses are gzip-compressed when the request's `Accept-Encoding` allows gzip (not `gzip;q=0`), with `Vary: Accept-Encoding`; small bodies (< 1 KB), 304s, HEAD and responses that set their own encoding (attachments) go out as before. br is not added (no new dependency; gzip comes from flate2, already used).
  - [x] Web view, after a task created/updated/deleted event (SSE or its own change): the ticket itself comes from the event's DTO or one `GET /api/tasks/get`, and each mounted list asks `list?ids=<that id>` instead of reloading the whole list; a burst of events shares one request per list. Falls back to the full reload when a full reload is running or due, the list was never loaded completely, more than 50 IDs are pending, or the `ids` request fails. Reconnects and the day roll still reload in full (test).
  - [x] A list row never wipes data a full ticket in the store holds: a row with the same `modified` keeps the ticket's comments, history and description; the open task panel ignores a row and fetches the full ticket instead of merging a row's missing description (test).
  - [x] No view loses data it shows today: task list (open question badge), board (open question, column age rules), search, insights (via `include=history`), calendar, the task panel and its timeline; checked in the browser and by the smoke suite.
  - [x] `crates/lotar-core/src/api_types.rs`, `view/api/types.ts`, `docs/openapi.json` and `docs/help` agree on the new list row.
  - [x] Before/after sizes and times for lotar are in a comment; `npm run lint`, `npm test`, `npm run smoke` pass.
