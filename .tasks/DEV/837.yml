    - **Done when:** the JSON `disk_hold` and the reason are shown. The cleanup leaves a worktree with a running job, recent builds, the worktrees and uncommitted files untouched (unit test). The floor is documented (`agent.md#disk-gate`, `config-reference.md`), with a built-in default of 60 GB.
