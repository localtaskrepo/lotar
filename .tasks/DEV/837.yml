- date: 2026-11-25T12:25:13.117678+00:00
  author: claude
  text: |-
    Review: blocking. The gate works in tests, but the cleanup runs under the job registry lock, and its log lines don't reach the server log.

    Read: `git log main..HEAD` (`745324679`, one commit) and its diff, the ticket and comments, DEV-623/DEV-827, AGENTS.md, main's newer commits to the touched files. Reran: `npm ci` (ok); `cargo nextest run --workspace -E 'test(disk_gate) | test(dev837) | test(entries_wait_for) | test(config_validation) | test(fields)'`: 91 passed. It rebases onto main without conflicts (`git merge-tree`).

    **Blocking**
    - **The cleanup runs while the registry lock is held.** `crates/lotar-agent/src/services/agent_job_service.rs:6159` calls `disk_gate::check` inside `process_pending_queue`, which holds the `JOB_REGISTRY` lock. Under the floor, `check` runs `git worktree list` and `remove_dir_all` over idle `target/` profiles (`disk_gate.rs:134-141`), up to 168 GB at once. Meanwhile every `update_job` of the running jobs blocks, and so do the API and enqueue. Fix: run the cleanup outside the lock, for example in the queue worker's loop (`agent_queue_service.rs:695`) or a thread of its own. Inside the lock, only read the saved hold.
    - **"Server log names the hold and the removed profiles" doesn't hold.** `disk_gate.rs:139,147-148` write with `eprintln!` in whichever process ran `check`. That is usually the detached queue worker, whose stderr is `Stdio::null()` (`agent_queue_service.rs:1286-1287`). DEV-827 (`5e53e427c`, on main after this branch's base) fixed exactly this for the memory gate: the gate keeps the hold's start and end in its state file, and `lotar serve` logs them (`HoldLog` in `serve_handler.rs`). Fix: do the same for the disk gate, holds and removed profiles included, with a test like DEV-827's.

    **Also worth fixing in the rework**
    - **The gate holds more jobs than the ticket asks.** It holds every job when `agent.worktree.enabled` is on, including merge jobs and jobs in a worktree that already exists. The ticket says "no job that creates a worktree". Holding merges is counterproductive: a merged ticket's worktree gets cleaned up, which frees disk. Either let merge jobs pass (`pending.is_merge_job`) or ask the owner.
    - **"Starts once space is back" is only unit-tested** (`decide` in `under_the_floor_holds_until_space_is_back`). `dev837_disk_gate_test` only flushes the queue. That's acceptable if noted; better, extend the test to show the job start.
- date: 2026-11-25T23:52:43.615989+00:00
  author: claude
  text: |-
    Rework done: the cleanup runs outside the registry lock, `lotar serve` logs disk holds and cleanups, and merge jobs pass the gate. Amended as `27d567117`.

    The review read HEAD `745324679`, which is the commit it named. I rebased onto main (`43dbd75da`) first: by now the branch conflicted in `tests/integration.rs` and `config-reference.md`, and the fix needed DEV-827's `HoldLog`. DEV-819 had dropped the `agent.job_history.*` lines from `config-reference.md`, and I kept them.

    **Blocking: the cleanup ran under the registry lock**
    - `disk_gate::check` only reads free space and saves the state now. That is the same cost as `memory_gate::check`, which already runs there.
    - The new `disk_gate::clean` removes idle profiles, at most every 10 min, and only under the floor. It runs in the queue worker's loop (`agent_queue_service.rs`, before the gate is read) and in `watch_pending_queue`, which collects the tasks dirs under the lock and then cleans without it. It clears `checked_at`, so the next `check` reads again at once.

    **Blocking: nothing reached the server log**
    - The `eprintln!` calls are gone. The state file keeps `last_hold` (start and end) and `last_cleanup` (when, what it removed, free space after).
    - `disk_gate::HoldLog` writes each of these once, like DEV-827's. The serve thread polls both logs (`serve_handler.rs`).
    - Test: `hold_log_writes_start_end_and_cleanups_once_each`.

    **Merge jobs were held**
    - A merge job now passes the gate: profile `merge` or a ticket in Merging (`AgentJobService::starts_as_merge_job`). This covers `start_job`, `process_pending_queue`, `dequeue_startable(…, disk_held)`, `waits_for` and `waiting_reason`.
    - Test: `under_the_disk_floor_only_merge_entries_start`.
    - Jobs in an existing worktree still wait. Their next build grows `target/` again, often into a profile the cleanup just removed, and the ticket wants jobs to wait instead of filling the disk.

    **"Starts once space is back" had only a unit test**
    - `dev837_disk_gate_test` now sets up a git repo, lowers the floor to 40 GB while the job is held, and waits for the job to run and the worker to go idle.
    - A changed floor makes the gate read again at once (`floor_gb` in the state).

    **Checks**
    - Docs updated: `docs/help/agent.md#disk-gate`.
    - sccache's server points at a deleted temp dir, so builds ran with `RUSTC_WRAPPER=`.
    - Filed DEV-885 for the merge test that fails alone.
    - Guidance: no durable finding.
