    - `cargo clippy --workspace --all-targets`: clean
    - `rustfmt --check` and `prettier --check` on the changed files: clean

    Findings:
    - **Registry lock:** fixed. Under the lock, `disk_gate::check` only reads free space (`agent_job_service.rs` `process_pending_queue`). `disk_gate::clean` runs in the worker loop and in `watch_pending_queue`, after the lock is released.
    - **Server log:** fixed. The state file keeps `last_hold` and `last_cleanup`, and `serve_handler.rs` polls `disk_gate::HoldLog` next to the memory gate's. The `eprintln!` calls are gone. The test is `hold_log_writes_start_end_and_cleanups_once_each`.
