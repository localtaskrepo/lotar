description: |-
  Each open lotar ticket keeps a job worktree with its own Rust target/ of 4 to 14 GB. On 2026-11-24, 46 such worktrees held 168 GB, and free disk fell from 301 GB to 181 GB in two days (about 65 GB a day). At that pace the Mac drops under the live disk check's 50 GB floor in about two days and fills in about three; the last time it filled was 2026-11-17. The queue already holds jobs while memory is short (DEV-623) but starts jobs regardless of free disk. Found by reliability (2026-11-24).

  ## Evidence
  - `du -sh ~/Development/@localtaskrepo/.lotar-worktrees/lotar/*`: 46 worktrees with target/, largest DEV-767 14 GB, DEV-815 8.7 GB, DEV-812 7.0 GB. Of those tickets 18 are Reviewing, 8 Blocked, 7 Merging, 4 InProgress, 11 Done.
  - `df -h /System/Volumes/Data`: 181 GB free on 2026-11-24, 301 GB on 2026-11-22 (standards docs/evidence/reliability.md).
  - repos.ts --fix removes cargo profiles only from worktrees idle for a day (STD-111), and the live disk check only alerts (local, MIN_FREE_GB 50). With this many open tickets moving every day, neither keeps up.
  - The build root (DEV-762, on in LOCA-571) moves builds to /Volumes/Builds in the same APFS container: it caps builds with the volume's quota but doesn't slow the growth.

  ## Proposal
  - A disk gate next to the memory gate: the queue starts no job that creates a worktree while free space on the worktree's volume (the build root's when set) is under a configured floor, e.g. `agent.queue.min_free_disk_gb` (default 60). It holds the job with a reason in the queue and the server log, the same way `memory_hold` does.
  - Under the floor, before holding, it removes cargo profiles from worktrees of tickets with no running job for at least 6 hours, oldest first (what repos.ts does after a day). It never removes the worktree itself or uncommitted work.

  ## Cost
  - One lotar fix job of medium size: reuse the memory gate's hold path, plus one cleanup function and its tests.
  - Jobs wait while the disk is low instead of filling it. A cleaned worktree's next job rebuilds, with sccache warm.

  ## Done when
  - [ ] With free disk under the floor, `lotar agent queue --format json` shows the next job held with a disk reason, and it starts once space is back.
  - [ ] The cleanup frees cargo profiles of idle worktrees first, and a test shows a worktree with a running job stays untouched.
  - [ ] Config and docs name the floor; the default is set on this Mac.
