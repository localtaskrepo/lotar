    Reran:
    - `npm ci`: ok
    - `RUSTC_WRAPPER= cargo nextest run --workspace -E 'test(disk_gate) | test(dev837) | test(entries_wait_for) | test(dequeue) | test(config_validation) | test(fields) | test(memory_gate) | test(dev623) | test(hold_log)'`: 109 passed
