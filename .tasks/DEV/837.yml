- date: 2026-11-24T21:54:03.512983+00:00
  author: claude
  text: |-
    Disk gate built: no new worktree job while free disk is under `agent.disk_gate.min_free_gb` (default 60); idle builds are cleaned first.

    - New `crates/lotar-agent/src/services/disk_gate.rs`, beside the memory gate. It reads the free space of the build root's volume (else the worktree dir's). Only when `agent.worktree.enabled` is on; `min_free_gb: 0` turns it off.
    - Under the floor it first removes the cargo profiles (folders in `target/` with a `.fingerprint`) of worktrees with no running job and no build or commit for `agent.disk_gate.idle_hours` (default 6), oldest first, until space is back. It never removes worktrees or other files. It checks again at most every 10 min while held.
    - Still under: entries stay queued (attempts unchanged), `lotar agent queue` / `list-jobs` show `disk_hold` and `waiting for disk space: …`, and the server log names the hold and the removed profiles.
    - Tests: `dev837_disk_gate_test` (the queue holds with the disk reason), unit tests for the hold ending at the floor, and the cleanup: running and recent worktrees untouched, uncommitted files kept.
    - Test envs (`tests/common`, `unit_test_environment.rs`, smoke `workspace.ts`) set `LOTAR_DISK_FREE_GB=1000`. Without it `dev604` was held by this Mac's real disk (38 GB free).
    - Default 60 GB is built in, so it applies on this Mac with no config edit. Also moved a misplaced `memory_gate.settle_seconds` line in `docs/help/config-reference.md`.
    - Guidance: no durable finding.
