description: 'Discovered while verifying DEV-104: opening Agent Jobs logs trusted any partial SSE cache and skipped persisted history, so live phase-one output stayed invisible until the unchanged20-second fixture expired. Repair fetch-on-open and per-job in-flight handling, and use stable positive per-job event sequence IDs shared by REST snapshots and SSE instead of ambiguous content matching. Synchronize Rust/TypeScript/OpenAPI/help contracts; preserve exact-once terminal records, genuinely repeated chunks, immediate ordered backfill, bounded retention, and immutable event identity. Preserve existing JSONL/CLI/task YAML storage formats. Do not extend test or fixture timeouts, introduce retries or concurrency changes, or weaken the real-running assertion. Completed implementation, review findings/corrections, red-green evidence, and full gate results are recorded in comments.'
