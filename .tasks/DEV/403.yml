description: |-
  ## Found
  On QIS-170 (quarter-inch-studio), agent comments made with `LOTAR_DEFAULT_REPORTER=claude` were stored as `author: mallox`. QIS's `config.yml` sets `default.reporter: mallox`. The `commented` rule then took each agent comment for an owner comment and started another agent turn: a loop (2026-11-13, lotar 0.14.1).

  ## Reproduce
  1. Run `git init` in an empty directory, then `lotar --tasks-dir <dir>/.tasks add t --project T`.
  2. Run `LOTAR_DEFAULT_REPORTER=claude lotar --tasks-dir <dir>/.tasks comment T-1 x`. Result: `author: claude` (correct).
  3. Add `default: { reporter: mallox }` to `.tasks/T/config.yml` and comment again. Result: `author: mallox` (wrong).

  ## Done when
  - [ ] `LOTAR_DEFAULT_REPORTER` wins over a project's `default.reporter` for comment authors and history actors (or the agent identity comes from another source that config can't override), with a test.
  - [ ] Automation prompts that say 'set LOTAR_DEFAULT_REPORTER' produce agent-authored comments in a repo like QIS.
