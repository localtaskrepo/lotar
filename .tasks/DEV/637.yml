- date: 2026-11-18T21:17:51.257300+00:00
  author: claude
  text: |-
    Fixed: closing a ticket drops the job it held back for its prerequisites.

    - `fire_unblocked_dependents` (`crates/lotar-agent/src/services/automation_service.rs`) runs after every committed update (CLI, REST, MCP, rules). On open→done it now calls `take_parked` for the ticket itself.
    - If the drop fails, the status change still stands. lotar prints the reason and sends an `automation_failed` event that names `lotar agent queue remove <id>`, and the entry stays in the queue.
    - Test `a_held_back_job_is_dropped_when_its_ticket_is_closed` (`agent_automation_integration_test.rs`): open→open and Done→WontDo keep the job; →Done drops it, no job starts and `move_task` works; an unreadable queue file keeps the entry and sends the event. Without the fix it failed at "closing the ticket drops the job".
    - `docs/help/automation.md` and the `dependents_unblocked` doc in `hooks.rs` describe the new behavior.
    - Rebased onto main (DEV-530 `77ff5dce`). Skipped the branch's old DEV-612 copy `5e4b406b`: its code matches main `105f027a`.
