description: |-
  Found in the DEV-530 review (`cf8caa2a`).

  ## Found

  - `resume_parked_job` drops a parked job only when the `unblocked` event fires or the agent is assigned again. `fire_unblocked_dependents` skips a dependent that is done itself, so a held ticket set to Done or WontDo by hand keeps its parked entry for good.
  - It stays listed in `lotar agent queue`, and `ensure_no_agent_work` (`task_move.rs`) refuses to move the ticket ("running or queued") until `lotar agent queue remove` takes it out.
  - The parked list exists only on `agent/DEV-530` (not merged): this ticket waits for DEV-530.

  ## Done when

  - [ ] A ticket with a parked job that reaches a done state of its project (Done, WontDo) drops the job in the same committed update, whatever made the change (CLI `status`/`edit`, REST, MCP, automation). Test fails before.
  - [ ] A change between two open states, or between two done states, leaves the parked job alone.
  - [ ] Dropping fails (queue file unreadable or locked): the status change still succeeds, and lotar reports it as an `automation_failed` warning; the entry stays for `lotar agent queue remove`.
  - [ ] `lotar agent queue` no longer lists the ticket, and `lotar task move` moves it.
  - [ ] npm run lint, npm test, npm run smoke pass.
