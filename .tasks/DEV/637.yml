  text: |-
    Review: passed. `55fd0880` drops the parked job when the ticket closes, and meets every "Done when" item.

    - Reviewed: `HEAD` = `t3/dev-637-drop-parked-job-on-done` (no rework branch), 4 files, no stray files.
    - Fix: `fire_unblocked_dependents` (`crates/lotar-agent/src/services/automation_service.rs:524`) calls `take_parked` on open→done by the project's `is_done`. It runs from `TaskService::update_with_relationship_delta` (`task_service.rs:1449`) after the commit, on every update path (CLI, REST, MCP, rules), automation off included.
    - Failure path: `report_automation_failure` emits `automation_failed` with a `lotar agent queue remove` hint; the status change stands.
    - Queue and move: `lotar agent queue` (`cli/handlers/agent.rs:446`) and `ensure_no_agent_work` (`task_hooks.rs:57`) read the same `list_parked` the test checks.
    - Test `a_held_back_job_is_dropped_when_its_ticket_is_closed` fails on `HEAD^` ("closing the ticket drops the job") and passes with the fix. It covers open→open, open→done, done→done, an unreadable queue and `move_task`.
    - Docs: `docs/help/automation.md` matches the behaviour.
    - Branch is behind `main` (`d37a26bb`, `b98cd767`); `git merge-tree` shows no conflicts.
    - Reran after `npm ci`: `npm run lint:agent` passed, `npm run test:rust:agent` passed (2392 tests), `npm run test:smoke:agent` passed (405 tests). `test:ui`, `test:release`, `test:hooks` not run: the change touches no frontend or script.
    - No UI change, no owner decision touched, no tickets filed.
