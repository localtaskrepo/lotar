  Preserve this as a design question: should setting A.depends_on=B automatically create or derive B.blocks=A? Decide persistence versus derivation and removal behavior, then cover reciprocal consistency and partial-write failures. Current manual reciprocal backlog links do not implement automatic application behavior.
