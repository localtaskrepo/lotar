- date: 2026-11-26T01:14:50.615571+00:00
  author: claude
  text: |-
    Not reproducible on current main (`87482fff4`): 56 of 56 runs of the file pass, nothing to change.

    - Built with `npm run build:smoke`, then ran `npx vitest run --config smoke/vitest.config.ts tests/ui.relationships.smoke.spec.ts`: 8 of 8 alone, 24 of 24 two at a time, 24 of 24 four at a time (load 10 to 49). That covers both "preserves plot height…" and "exposes Dependencies in navigation…".
    - No commit since `c0fe875d6` touches `DependencyGraph.vue`, `Dependencies.vue`, `useRelationshipGraph.ts` or the spec, so the cause is still unknown.
    - From the ticket's numbers: `plotTop` +262 while `documentHeight` grew only 147. That fits the window scrolling to the top (262 to 0) better than content showing up above the plot.
    - If it comes back: log `windowY` and the page's child heights in the failure message (the test already prints `before` and `pending`).
    - Full `npm run smoke` not run here: the merge runs it (DEV-797).
- date: 2026-11-26T07:25:17.281194+00:00
  author: claude
  text: |-
    Reproduces again during the DEV-869 merge: same 262 px `plotTop` shift.

    - Failed in 3 of 4 full `npm run -s smoke` runs on `0e78bed6b`+DEV-869 and `eb9b383f7`+DEV-869 (rebased `6c501d7ed`, which only changes `trust.rs`/`docs/help/trust.md`); same numbers each time: `plotTop` 79.9 -> 341.9, `documentHeight` 1370 -> 1517, `top` 2196 -> 0
    - Passes alone: `npm run -s test:smoke:quick -- tests/ui.relationships.smoke.spec.ts -t "preserves plot height"`
    - Machine load ~13 during the runs
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3A2047b5bca257970a7c7dcdd461b6ab41265cf35e0e13fa1452803bf835b82425
description: |-
  Found during the DEV-799 merge on main `c0fe875d6` (server and UI as on main): `tests/ui.relationships.smoke.spec.ts` > preserves plot height and page/plot scroll through a delayed root reload failed 1 of 8 runs of its file alone (load 5 to 13). Each failure is identical: `documentHeight` 1370 -> 1517, `plotTop` 79.9 -> 341.9, `scrollTop` 2196 -> 0. Something 147 px tall appears above the plot while the root graph request is held. The same file's 'exposes Dependencies in navigation and persists its Preferences visibility' test failed 5 of 14 runs on main too. Passes as a single test (`-t`), so it is a race between tests of the file, not wall-clock load (the wall-clock group would not help).

  Check: `for i in 1 2 3 4 5 6 7 8; do npx vitest run --config smoke/vitest.config.ts tests/ui.relationships.smoke.spec.ts; done` after `npm run build:smoke`.

  Done: the file passes 8 of 8 runs alone and the full `npm run smoke` passes.
