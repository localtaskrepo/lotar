- date: 2026-11-17T08:45:49.346506+00:00
  author: claude
  text: |-
    Both tests moved to `crates/lotar-agent`, and they run with `-p lotar-agent`.

    - Base: `lotar-agent` exists only on `agent/DEV-634`, so I cherry-picked its 2 commits onto this branch. Resetting the branch to it was refused. Merge DEV-634 first.
    - `dev566_moved_during_job_test`: now in lotar-agent's `integration` binary. A temp `.tasks` dir replaces `TestFixtures`, which it used only for `new`/`create_storage`/`get_temp_path`, so `TestFixtures` stays in lotar-lib.
    - `automation_async_run_test` was in lotar-lib's `windows_regressions` binary, not `integration.rs`. It is now in a new lotar-agent `windows_regressions` binary. The Windows job's unchanged `--test windows_regressions` selects both binaries (checked with `cargo nextest list`).
    - `ci_windows_reporting_contract_test` now checks which binary holds each module. It fails when the module is dropped (checked, then restored).
    - Docs: ci.yml comment, `crates/lotar-lib/tests/README.md`, `platform-test-verification.md`, testing-strategy.
    - Commit `7486679f0` has a generated message ("changes from the fix agent"), not the one asked for: something committed my staged work first. It is on `t3/move-automation-tests-to-lotar-agent` too, so I left it unamended to keep the two branches the same.
    - Guidance: testing-strategy now names `tests/windows_regressions.rs` for service-only tests Windows CI must run.
  report:
    commits:
    - hash: 7486679f0
      what: both tests moved to lotar-agent, Windows binary, contract test, docs
    - hash: bafbec164
      what: DEV-634's 4fc0e04b6, cherry-picked as the base
    - hash: 62c863ac8
      what: DEV-634's 1192c4e54, cherry-picked as the base
    checks:
