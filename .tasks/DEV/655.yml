description: |-
  Found in the DEV-634 review: testing-strategy says agent and automation tests that need only the services go in `crates/lotar-agent`, but two stayed in `crates/lotar-lib/tests`.

  - `automation_async_run_test.rs`: calls only `lotar::services::automation_service` (`BoundedTail`, `stderr_eof_within_grace`, `windows_async_stdio`). It is in lotar-lib's `windows_regressions` binary (DEV-495), the one test binary the Windows CI job runs, not in `integration.rs`.
  - `dev566_moved_during_job_test.rs`: calls `AutomationService` and `TaskService` in process, through lotar-lib's `common::TestFixtures`.

  Builds on DEV-634 (`lotar-agent` exists only on `agent/DEV-634`), so this branch carries its two commits until DEV-634 is on main.

  Owner, 2026-11-17 (INBOX-415): "Land DEV-634 and DEV-655 together, then close DEV-634": this branch's merge lands DEV-634's two commits with DEV-655's; afterwards DEV-634 goes to Done.

  ## Done when
  - [ ] Both run in `cargo nextest run -p lotar-agent --cargo-profile dev` and are gone from `crates/lotar-lib/tests` (`integration.rs` and `windows_regressions.rs`).
  - [ ] `dev566_moved_during_job_test` is a module of lotar-agent's `integration` binary, with a temp `.tasks` dir in place of lotar-lib's `TestFixtures` (it uses only `new`, `create_storage`, `get_temp_path`, so `TestFixtures` itself doesn't move).
  - [ ] `automation_async_run_test` is in a new lotar-agent test binary `windows_regressions`, so the Windows CI job still runs it natively: the job's unchanged `--test windows_regressions --bin lotar-agent-wrapper` selects both packages' `windows_regressions` binaries, run and coverage manifest alike.
  - [ ] `ci_windows_reporting_contract_test` checks the module is in lotar-agent's `windows_regressions.rs` and in neither lotar-lib binary; it fails if the module is dropped.
  - [ ] Docs naming the Windows selection (`crates/lotar-lib/tests/README.md`, `docs/developers/platform-test-verification.md`, the ci.yml comment) name both binaries.
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass.
