- date: 2026-11-23T07:07:16.082351+00:00
  author: claude
  text: |-
    Review: blocking. The reported case is fixed, but two common comment placements still drop every comment in the file, and `config init --force` no longer overwrites.

    Read: commit `32b98d922` (`git diff main...HEAD`, 11 files), DEV-266, DEV-407, `docs/help/config.md`, every caller of `save_project_config`/`save_global_config`. It merges cleanly onto main (`108a6996c`, 4 commits ahead).

    Reran:
    - `npm ci`: passed
    - `npm run -s lint:agent`: passed
    - `cargo nextest run -p lotar-core yaml_patch`: 5/5 passed
    - `cargo nextest run -p lotar-lib --test integration -E 'test(/dev811|dev407|dev266|config/)'`: 273/273 passed
    - Ticket check on a copy of the real DEV config: only `- Spike` added, owner comments and `waiting_run: [cargo, clean, --workspace]` kept
    - Not rerun: full `npm test` and smoke, since the review is blocking

    **1. A comment the scan doesn't expect makes the patch fail, and the write falls back to canonical YAML: all comments in the file are gone.** Both cases are valid YAML:
    - A comment between list items at the key's indent (`issue.types` uses this layout):
      `issue:\n  types:\n  - Bug\n  # chore next\n  - Chore` → `config set issue.types Bug,Chore,Feature` drops every comment.
    - A comment at column 0 inside a nested section:
      `agent:\n  worktree:\n# owner: 3\n    max_parallel_jobs: 3 # owner` → `config set agent_worktree_max_parallel_jobs 4` drops every comment. This also happens when the changed key is a plain scalar.
    - Where: `crates/lotar-core/src/config/yaml_patch.rs:156-159` (`find_entry`). A comment line at the entry's indent or less ends the entry. The remaining items, or the nested keys, then count as outside it, the patched text gets a duplicate, verify rejects it, and the canonical fallback runs.
    - Fix: skip comment-only lines when finding where an entry ends. Only a content line at the entry's indent or less (other than `- item`) should end it, and trailing comment and blank lines then belong to the next key. Add both layouts to the `yaml_patch.rs` tests.

    **2. `lotar config init --project=PRJ --force` no longer overwrites the file.** It now goes through the patch, so old comments and unknown keys stay. In a scratch repo, `# old comment: max 3 (owner)` and `foo_unknown: 1` survived `config init --force`, and the stale comment now sits above reset values.
    - Where: `crates/lotar-lib/src/cli/handlers/config/init/mod.rs:204` (and `:170` global), via `save_project_config` in `crates/lotar-core/src/config/operations.rs:440`.
    - `docs/help/config.md:58` says "`--force` overwrites existing config", and DEV-811 asked only about `config set`.
    - Fix: write canonical YAML on init, for example with a save variant that skips the patch, plus a test.

    Note: this job's environment sets `LOTAR_TASKS_DIR` to the main checkout, so my first probe wrote to `.tasks/config.yml` and `.tasks/DEV/config.yml` there. I removed exactly my three lines. The uncommitted `agent.memory_gate.max_swap_percent: 95` in `.tasks/config.yml` belongs to someone else and is left as it was. The patch kept that edit and the owner comments, which is more evidence the main path works.
