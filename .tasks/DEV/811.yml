- date: 2026-11-23T03:03:10.100714+00:00
  author: claude
  text: |-
    `config set` (and every config write) now rewrites only the keys that changed; comments and other keys' formatting stay.

    - New `crates/lotar-core/src/config/yaml_patch.rs`: diffs the canonical YAML before/after and patches just those keys into the file text. Keeps the key line and its comment, item indent, flow lists (`[cargo, clean, --workspace]`), and dotted/flat spellings; new keys join their section.
    - Safe fallback to the old canonical rewrite when the patched file doesn't parse back to exactly the new config, or a field would be spelled twice (`project.id` + `project.name`).
    - Used by `save_project_config` and the global save (`server.port` pin is checked too); replaces DEV-407's members/name-only patch.
    - Tests: `dev811_config_set_comments_test.rs` (project + global), unit tests in `yaml_patch.rs`. Updated three tests that asserted the old canonical rewrite: DEV-266 key order (a hand-written map now keeps its order), the DEV-407 fallback case, and the `ui.scan-settings` smoke test (keeps the quoted pattern).
    - `docs/help/config.md` updated. No guidance correction.
