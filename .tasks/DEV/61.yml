description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: D7.

  CLI file references are repository-relative, while UI treats all file entries as attachment URLs. Define a backward-compatible discriminator or distinct representation and migration/read policy. Acceptance: legacy attachments still open, repo-file references resolve correctly, code anchors use supported path#L syntax, and detach/download operations cannot cross storage roots. Sync Rust/TS/OpenAPI and help examples. Scope: reference_service.rs, attachment_service.rs, TaskPanel reference rendering and DTOs.

  Related umbrella: DEV-53.
  Prerequisites/coordination: DEV-56.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
