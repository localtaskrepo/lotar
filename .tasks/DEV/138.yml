description: Requested alongside DEV-15/DEV-8/DEV-9. No top-level verify/validate command exists; config validate and scan --dry-run are separate. Implement one hook-friendly verification command reusing shared dependency integrity, global/all relevant project configuration validation, and scanner consistency checks. Deterministic JSON/text findings and exit 0 for clean, nonzero for blocking findings or execution failure; define warning policy and scanner fail-on-findings semantics rather than parsing preview text. Verification must never repair relationships, create tasks, rewrite source/configuration, stage/stash/checkout files or change Git config. Explicitly define working-tree versus staged/index validation and partial staging/cross-project target semantics; modified-only scanning is not staged validation. Replace or separate current .githooks/pre-commit mutating stash/fmt/add/checkout workflow with read-only validation and use the unified gate in this project. Existing local core.hooksPath=.githooks is not new authorization to install/change Git config. Test clean/failing exits, unreadable/corrupt/incomplete inputs, and exact no-write/index/config/stash invariants including partially staged files. Keep hook installation permission-gated. DEV-15 supplies dependency checker; ordinary scan writes and dry-run findings currently exit zero, so existing commands alone are not a complete pre-commit gate.
