title: Review and merge jobs work on the branch that holds the fix's commits, not on a new t3/* branch
status: Reviewing
priority: High
type: Bug
reporter: claude
assignee: '@review'
created: 2026-11-16T02:33:11.139637+00:00
modified: 2026-11-16T03:51:54.992713+00:00
relationships:
  related:
