description: |-
  Source: the chief of staff's token-use analysis, 2026-11-14 00:00 to 2026-11-15 16:15 PST (notes: /private/tmp/claude-501/-Users-mallox-Development-staff/0ac34df1-8fd4-4e3f-b9d4-c9c5d3f89ba1/scratchpad/notes.md, per-job costs: /private/tmp/claude-501/-Users-mallox-Development-staff/0ac34df1-8fd4-4e3f-b9d4-c9c5d3f89ba1/scratchpad/jobs_cost3.json). Owner 2026-11-15 picked this recommendation from the options picker.

  ## Found
  - 48 merges or reviews failed on branch mismatches in 40 hours (about $40-60 of the jobs, with the retries they caused). Merges fail with "t3/... is not merged into the main checkout's current branch"; reviews check stale branches.
  - standards STD-133: the fix committed f9f71b7 on t3/harden-agent-plumbing; the review ran on t3/harden-agent-plumbing-1 and the merge on t3/harden-agent-plumbing-2, both behind main. Each found nothing, and the ticket went to Done with nothing on main (reopened 2026-11-15).
  - DEV-583 makes the T3 prompt name the thread's real branch; it doesn't make the review and the merge start where the fix's commits are.- Cause in STD-133 (job logs in standards `.tasks/@agent-logs`): the fix thread committed `f9f71b7` on `t3/harden-agent-plumbing`, an earlier thread's branch created from `agent/STD-133`, while LoTaR recorded the job's worktree on `agent/STD-133`. So `agent/STD-133` stayed at main, the review and merge threads started from it, and the merge counted a branch with nothing beyond main as merged.

  ## Done when
  - [ ] Every job of a ticket (fix, review, merge; T3 and headless) starts from the branch that holds the ticket's newest fix commit, whatever T3 Code named it: before the job plans its worktree, LoTaR points `agent/<ID>` at the ticket's branch (`agent/<ID>` or a branch traced to it through its reflog, `BranchOwners`) whose tip is newest among those with commits not in the main checkout's branch. The job log says so.
  - [ ] Which wins: `agent/<ID>` stays where it is when it has commits of its own beyond main that the newer branch doesn't build on (diverged work isn't LoTaR's to pick); otherwise the newest branch wins. A branch whose work landed (also rebased) doesn't count.
  - [ ] A step fails: when `agent/<ID>` can't move there (git refuses), the job fails at the start with both branch names, before any thread starts.
  - [ ] A merge job whose branch held nothing beyond main when it started fails, naming the ticket's branch that has unlanded commits, instead of completing, so the ticket can't go Done through the merge step with none of its fix commits on main. A merge with no unlanded ticket work anywhere passes as before.
  - [ ] A test with the fake t3 reproduces the STD-133 case (fix commits on an earlier thread's `t3/x`, review and merge threads on new `t3/*` branches): the review starts from the fix and the merge lands it on main. Fails before the change. A second test: a merge whose thread branch ends with nothing beyond main fails, naming the branch.
  - [ ] `docs/help/agent.md` describes it.
