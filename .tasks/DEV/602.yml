comments:
- date: 2026-11-16T03:48:30.481925+00:00
  author: claude
  text: |-
    Fixed: every job now starts from the ticket's branch with the newest work main lacks, and a merge that brings nothing can't end Done while the fix is on another branch.

    - Cause in STD-133: the fix thread committed `f9f71b7` on an earlier thread's `t3/harden-agent-plumbing`, while LoTaR logged the job's worktree on `agent/STD-133`. So `agent/STD-133` stayed at main, the review (`-1`) and merge (`-2`) threads started from it, and the merge counted a branch with nothing in it as landed.
    - Job start (`follow_ticket_work` in `agent_job_service.rs`): before setting up the worktree, LoTaR points `agent/<ID>` at the newest of the ticket's branches with unlanded commits. It looks at reflog-traced branches and the branches earlier jobs logged. It doesn't move when `agent/<ID>` has diverged work of its own. When git refuses the move, the job fails before it starts.
    - Merge end (`ensure_branch_merged`): a branch with nothing beyond main at the start fails the job while another ticket branch holds unlanded work, and the message names that branch.
    - From the DEV-593 merge thread: leftover copies of a fix that main holds rebased and amended (`t3/81a4c186`, `agent/DEV-593`) don't count. The check reuses cleanup's `superseded_removal`: a later main commit whose subject starts with the ticket ID.
    - Tests in `dev503_harness_jobs_test.rs`: `review_and_merge_start_from_the_branch_that_holds_the_fix` (STD-133), `a_merge_that_brings_nothing_while_the_ticket_has_unlanded_work_fails`, `a_leftover_copy_of_a_fix_that_main_supersedes_is_not_unlanded_work`. Each one fails without its part of the change.
    - Docs: `docs/help/agent.md` (Worktrees, merge job paragraph). "Done when" is sharpened in the description.
    - Guidance: no durable finding.
  report:
    commits:
    - hash: '67499e12'
      what: jobs start from the ticket branch with the newest unlanded work; a merge that brings nothing fails while the fix is elsewhere
    checks:
    - command: npm run lint:agent
      result: passed
    - command: npm run test:agent
      result: passed
      reason: 2241 Rust, 1548 UI
    - command: npm run test:smoke:agent
      result: passed
      reason: 405/405, before the superseded-copy change (Rust-only, covered by the rerun test suite)
    - command: new tests fail before the change
      result: passed
      reason: all 3
    - command: live STD-133-style run with real T3
      result: not_run
      reason: covered by the fake-t3 tests
    next: Review on another model, then merge
- date: 2026-11-16T04:47:48.548407+00:00
  author: claude
  text: |-
    Review: passed. The fix does what "Done when" asks, and the tests fail without it. One minor follow-up filed as DEV-612.

    - Read: the ticket and the fix agent's comment, `git diff main...HEAD` (`67499e12`: `agent_job_service.rs`, `dev503_harness_jobs_test.rs`, `docs/help/agent.md`), `move_ticket_branch`, `superseded_removal`, `branch_landed`, the `BranchOwners` trace, and main's newer commits to the file (DEV-594 `bab2586f`, DEV-593 `e1904446`). `git merge-tree` against main: no conflicts.
    - Job start: `follow_ticket_work` runs in `run_job` for every runner, before the worktree is planned. It fails the job with both branch names when git refuses the move, and it logs the move. When `agent/<ID>` has diverged work of its own, it stays where it is.
    - Merge end: `ensure_branch_merged` fails a merge whose branch has nothing beyond main as it was at the start, while another branch of the ticket holds unlanded work, and the message names that branch.
    - Tests fail before the fix: with `agent_job_service.rs` set back to `7a19ab6d`, the STD-133 test and the "merge brings nothing" test fail. The leftover-copy test fails once the `superseded_removal` filter is removed. The file is restored; the worktree is clean.
    - Reran: `npm run lint:agent` passed. `npm run test:agent` passed (2241 Rust, 1548 UI). Not rerun: `npm run test:smoke:agent` (Rust-only change; the fix agent ran it, 405/405).
    - Minor, filed as DEV-612: branches are matched by the names earlier jobs logged. For a reopened ticket, a freed `t3/<topic>` name that another ticket's thread reuses can be followed.
- date: 2026-11-16T05:48:57.054558+00:00
  author: claude
  text: |-
    Merged and pushed: `3db5898c` is on `main` and `origin/main`.

    - Rebased twice, because main moved during the checks. The second rebase conflicted with DEV-603 in `run_job` (`agent_job_service.rs`): two separate insertions at the same spot. I kept both, DEV-603's idle-session check first, then `follow_ticket_work`. The diff is unchanged (164+/8-).
    - Checks on the final commit: `npm run lint:agent` passed, `npm run test:agent` passed (2256 Rust, 1548 UI), `npm run smoke` passed (405/405).
    - Flake: one earlier `test:agent` run failed in a watcher SSE test (`watcher_reports_config_edits_and_ignores_internal_files` / `sprint_changes_announce_the_sprint_and_its_tasks`) at load ~25. A rerun passed. Already tracked as DEV-585.
    - Amended the main checkout's `.tasks` changes into the merge commit. No rule or config files changed, so I didn't run `lotar trust`.
    - `agent/DEV-602` still points at the pre-rebase `67499e12`, checked out in `agent-DEV-602-73ef697588699b5a`. Main supersedes it with a later `DEV-602` commit, so cleanup handles it.
