- date: 2026-11-18T23:17:40.774408+00:00
  author: claude
  text: |-
    Waits for [DEV-712](https://lotar.pyxzl.net/task/DEV-712): the code to fix isn't on main yet.

    - `run_waiting_command` and `agent.worktree.waiting_run` exist only on `agent/DEV-712` (`fbf4982dc`, status Reviewing); main (`3cb2acfa8`) has neither.
    - Fixing it now would stack on an unreviewed commit that its review may still change.
    - Once DEV-712 is on main: check trust only when the `waiting_run` in effect comes from a repository config (`.tasks/config.yml` or a project config), not from `~/.lotar.yml`, and add a test that covers both cases.
- date: 2026-11-18T23:35:35.014522+00:00
  author: claude
  text: |-
    Fixed: a `waiting_run` from your home config now runs in an untrusted repository; a repository's still needs `lotar trust`.

    - `run_waiting_command` (`crates/lotar-agent/src/services/agent_job_service.rs`) checks trust only when the user's own layers (home `~/.lotar`, env, CLI) don't set that exact command. The new `own_layers_config()` in `crates/lotar-core/src/config/resolution.rs` resolves those layers.
    - Which one wins follows the usual precedence. Home beats the repository's `.tasks/config.yml`, so its command runs without trust. A project config beats home, so its command still needs trust and is skipped and logged when untrusted.
    - Test (`agent_safety_test.rs`, waiting test): in an untrusted repository the repository's command is skipped, and a home config's command runs.
    - Docs: `docs/help/trust.md`, `agent.md` and `config-reference.md`.
