- date: 2026-11-18T23:17:40.774408+00:00
  author: claude
  text: |-
    Waits for [DEV-712](https://lotar.pyxzl.net/task/DEV-712): the code to fix isn't on main yet.

    - `run_waiting_command` and `agent.worktree.waiting_run` exist only on `agent/DEV-712` (`fbf4982dc`, status Reviewing); main (`3cb2acfa8`) has neither.
    - Fixing it now would stack on an unreviewed commit that its review may still change.
    - Once DEV-712 is on main: check trust only when the `waiting_run` in effect comes from a repository config (`.tasks/config.yml` or a project config), not from `~/.lotar.yml`, and add a test that covers both cases.
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Ae356ada3-5c1b-41fe-9622-12ac9d56068c
description: |-
  Found in DEV-712's review (2026-11-18).

  - `run_waiting_command` (`crates/lotar-agent/src/services/agent_job_service.rs`) checks `TrustService::allows_commands(tasks_dir)` for the whole workspace, whatever config the command comes from.
  - So a `waiting_run` set in `~/.lotar.yml` (the user's own) is skipped when the repository has other untrusted sources (rules, profiles, `agent.merge`).
  - DEV-712 asks only a repository config's command to need trust; `docs/help/trust.md` says the user's own settings always run.

  ## Done when
  - [ ] A home-config `waiting_run` runs in an untrusted repository; a repository's still needs `lotar trust`. A test shows both.
