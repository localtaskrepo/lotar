references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Ae356ada3-5c1b-41fe-9622-12ac9d56068c
description: |-
  Found in DEV-712's review (2026-11-18).

  - `run_waiting_command` (`crates/lotar-agent/src/services/agent_job_service.rs`) checks `TrustService::allows_commands(tasks_dir)` for the whole workspace, whatever config the command comes from.
  - So a `waiting_run` set in the home config (`~/.lotar`, the user's own) is skipped when the repository has other untrusted sources (rules, profiles, `agent.merge`).
  - DEV-712 asks only a repository config's command to need trust; `docs/help/trust.md` says the user's own settings always run.

  ## Done when
  - [ ] A home-config `waiting_run` runs in an untrusted repository; a repository's still needs `lotar trust`. A test shows both.
  - [ ] Which wins: the usual precedence (CLI > env > project > home > global). Home beats the repository's `.tasks/config.yml`, so its command runs untrusted; a project config's command beats home and needs trust; untrusted, it is skipped and the log says so, as before.
  - [ ] `docs/help/trust.md`, `agent.md` and `config-reference.md` say so.
