- date: 2026-11-17T21:48:53.895436+00:00
  author: claude
  text: |-
    Fixed: a job's Claude settings go only to its own thread's worktree.

    - `t3_worktree_setup.rs`: a record without a branch (thread from the existing ticket branch) now needs the worktree's commit **and** T3 Code's thread in that worktree titled like the job's thread (`t3 thread list --json`, then `t3 thread show <id> --json`). Owner's or another ticket's thread at the same commit doesn't take it.
    - T3 Code can't be asked: the record isn't claimed, setup warns, exits 0; the job log says why.
    - Two matching records: the newest wins (was oldest).
    - `record()` returns a `Recorded` guard; `run_session` early returns (`job_agent_table`, `open_session`, stopped) drop it, which deletes the record.
    - `setup()` and `record()` delete records older than 10 min (unreadable ones by file age) and leave the job a "script doesn't run the command" result.
    - `docs/help/agent.md` T3 section says how matching works.
    - Built on main after DEV-618 landed (`3db41eb3b`); one commit `f8aa497a9`.
