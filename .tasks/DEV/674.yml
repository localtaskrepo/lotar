description: |-
  Found reviewing DEV-618 (`crates/lotar-lib/src/services/t3_worktree_setup.rs`, `agent_job_service.rs` `run_session`).

  - A job whose thread starts from an existing ticket branch records no branch; `setup()` claims it for any new worktree whose HEAD is that commit. A thread the owner starts in worktree mode from the same commit within 10 minutes (`PENDING_SECS`), or another job's thread on a ticket branch at the same commit, can take it: the owner's session then loses tools he keeps (owner 2026-11-15, INBOX-351: "1 and 4 only in job sessions").
  - `run_session` returns early after `record_t3_worktree_setup` when `job_agent_table` or `open_session` fails, so `finish()` never removes the record. It stays claimable for 10 minutes, and expired records are never deleted from `.git/lotar/t3-worktree-setup/`.
  - Candidates are claimed oldest first, so a retried job's thread can take the earlier job's leftover record; the new job's log then says the script doesn't run the command.

  ## Done when
  - [ ] Every exit of `run_session` after the record was written removes it: early failures (`job_agent_table`, `open_session`, a stopped job) delete it without a log line; the normal end keeps `finish()`'s log line.
  - [ ] A record for a new ticket branch matches only the worktree on that branch (as today: T3 Code makes that branch for the job's thread).
  - [ ] A record for a thread from an existing ticket branch matches only when the worktree's HEAD is the commit **and** T3 Code's thread whose `worktreePath` is this worktree has the job's thread title (`t3 thread list --json`, then `t3 thread show <id> --json`). The owner's own thread or another ticket's thread at the same commit doesn't take it.
  - [ ] When T3 Code can't be asked (no `t3`, server down, an error), the commit record isn't claimed; `setup()` warns and exits 0, and the job's log says why the thread started without the settings.
  - [ ] Two records match (a leftover and a retry, same title): the newest wins.
  - [ ] `setup()` and `record()` delete expired records (older than `PENDING_SECS`, 10 minutes), also unreadable ones by file age.
  - [ ] `docs/help/agent.md` says how a thread from the existing ticket branch is matched.
  - [ ] Unit tests for each case; `npm run lint`, `npm test`, `npm run smoke` pass.
