- date: 2026-11-17T21:59:32.354844+00:00
  author: claude
  text: |-
    Review: blocking. An expired record overwrites the "T3 Code couldn't be asked" reason, so the job log gives the wrong cause.

    - **Bug:** `crates/lotar-agent/src/services/t3_worktree_setup.rs:146`. `prune()` always writes `NOT_CLAIMED` to `<job>.result`. When T3 Code can't be asked, `setup()` (`:208`–`:216`) writes the reason to `<job>.result` and leaves `<job>.json` in place. Once that record is 10 minutes old, the next `record()` or `setup()` by any job deletes it and replaces the reason with "the script doesn't run `lotar agent worktree setup`". Most sessions run longer than 10 minutes, so `finish()` usually logs the wrong cause. That breaks the Done-when item "the job's log says why the thread started without the settings". The test `a_commit_record_is_left_when_t3_code_cant_say_whose_worktree_it_is` calls `finish()` straight away, so it can't catch this.
    - **Fix:** in `prune()`, write `NOT_CLAIMED` only when no `.result` exists yet (e.g. `OpenOptions::new().write(true).create_new(true)`). Add a test: T3 Code can't be asked, the record expires, another `record()` runs, and `finish()` still says "T3 Code couldn't say which thread".
    - **Test gap (same rework):** the Done-when item "unreadable ones by file age" has no test for an *old* unreadable record. `expired_records_are_deleted_and_their_jobs_learn_why` only checks that a fresh one stays. Add one, e.g. set the file's mtime 11 min back with `File::set_modified`.
    - **Checked and OK:**
      - Every early return of `run_session` drops `Recorded`, which deletes the record without a log line.
      - A branch record still matches by branch.
      - Of two matching records, the newest wins.
      - `docs/help/agent.md` is updated.
      - The CLI warns and exits 0 (`crates/lotar-lib/src/cli/handlers/agent.rs:633`).
    - **Outside claim verified:** the fields `threadId`, `title` and `thread.worktreePath` match `~/.t3/bin/t3 thread list/show --json`. In T3 Code's bundled server, thread start dispatches `thread.metadata.update` with `worktreePath` before `setupScripts.runForThread`, so the title lookup works while the script runs.
    - **Read:** the diff `main...HEAD` of `f8aa497a9` (3 files), the ticket and its comments, DEV-618, and `git log -5 main` on the touched files. `bcd8bbcd8` (DEV-623) touches `agent_job_service.rs`; `git merge-tree` merges it cleanly.
    - **Reran:** `npm ci` ok; `cargo nextest run -p lotar-agent t3_worktree_setup` 8/8; `npm run lint:agent` ok; `npm test` 2338/2338; `npm run smoke` 405/405.
    - **Filed:** a minor follow-up for `.result` files that are never deleted.
    - No UI changes, so no screenshots needed.
