- date: 2026-11-22T19:23:18.160976+00:00
  author: claude
  text: |-
    Ready for review: the branch is rebased onto main and the full smoke suite passes under heavy load.

    - Rebased onto main: it conflicted with DEV-781 in `smoke/tests/harness.agent-launcher.smoke.spec.ts`. I kept main's version: its `FIXTURE_WAIT_MS` (90 s exit bound) replaces my 60 s `awaitExit` change. The commit is now `65b7b571d` (was `a9bc39a7a`): `smoke/helpers/ui.ts`, `smoke/helpers/server.ts`, 2 new tests
    - `npm run smoke` passed 408/408 in about 2 min, at load average 68-103 on 14 cores
    - My first smoke run failed 343 tests at once with `LoTaR binary was not found at target/debug/lotar`, although `cargo build` printed `Finished`. The rerun passed. Possibly a concurrent cargo run; I couldn't reproduce it
    - That run also left 7 `lotar smoke agents/gate` temp dirs: the launcher tests skip cleanup when the wrapper binary is missing. This only happens on that setup error
