- date: 2026-11-22T13:45:10.453875+00:00
  author: claude
  text: |-
    Fixed: a smoke test that times out under load no longer leaks its browser, and the server and launcher hang guards hold up under load.

    - Cause 1, reproduced: `withBrowser` (`smoke/helpers/ui.ts`) registered its owed cleanup only after `chromium.launch` returned. A test that timed out while Chromium was still starting leaked it, which gave the `Tests left ... playwright-artifacts` failure in `harness.failed-test-cleanup`. The cleanup is now owed from the launch on. New fixture test `times out while its browser is still launching` (50 ms timeout): fails without the fix with exactly that error, passes with it
    - `harness.server` occupied port: the error said "exited before becoming ready" but had no "Failed to bind", so stderr was missing. `startLotarServer` now waits (5 s max) for the exited server's stderr to close before it reports. I couldn't make the race fail locally, also not with a blocked event loop; the new test `reports the whole stderr of a child that exits before ready` guards it. The default readiness bound goes from 15 s to 60 s (a hang guard)
    - `harness.agent-launcher`: `awaitExit` counted 20 s from spawn, across a 10 s start wait. Now 60 s, still under the 120 s test timeout
    - The UI timeouts (`ui.theming`, `ui.filter-panel` and 3 more): those tests take 1-5 s at load ~30, so a 120 s timeout means the machine stalled 25-100x, as in DEV-779 (Time Machine, memory pressure). I left `testTimeout` at 120 s
