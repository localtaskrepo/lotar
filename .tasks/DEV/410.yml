  text: 'Fixed in commit 522763f9 on agent/DEV-410. Reproduced first: a new test (tests/dev241_automation_test.rs, a_run_matches_tasks_an_earlier_action_changed_as_they_are_now) has ''Ship'' close AM-3, which unblocks AM-4 back to Todo; without the fix the run left AM-4 at Todo. New src/storage/write_log.rs: a thread-local log of the task IDs written while it is open, fed by StorageOperations edit/mutate/delete/move_archive and transaction publishes. run_manual opens it and re-reads (TaskService::get) only the tasks it names before matching; every other task still uses the one listing, so DEV-400''s budget holds (performance_test: 19 passed). Not covered: a second manual rule on the same task still sees that task as listed, as it did before DEV-400. Checks: npm run lint (lint:agent), npm test (2121 Rust + 1507 UI + others, exit 0), npm run smoke (385 passed).'
