description: |-
  A real (not dry) `lotar automation run` matches each task against a snapshot read before the loop (DEV-400). When an earlier action in the same run changes a later task (closing A fires B's `unblocked` rules through `fire_unblocked_dependents`), the loop matches B's manual rule against B's old state. Before DEV-400 each task was re-read when the loop reached it. Found by the QA test run in standards (STD-59, 2026-11-12); medium confidence, read from the code, not reproduced.

  ## Evidence
  - `src/services/automation_service.rs` `run_manual`, around lines 729-751.
  - `src/services/task_service.rs` around line 1302 (`fire_unblocked_dependents`).
  - DEV-400's checks were dry runs, which write nothing.

  ## Done when
  - [ ] A test where a manual action on one task changes another task that the same run matches later; the later match sees the new state
  - [ ] Re-read only tasks an earlier action in the run wrote to, so DEV-400's performance budget holds
