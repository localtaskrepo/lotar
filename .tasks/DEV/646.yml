- date: 2026-11-17T05:34:05.991122+00:00
  author: claude
  text: |-
    Fixed: every `RespectLimits` start now uses the queue worker's limits, counting the jobs of every lotar process.

    - `agent_job_service.rs`: `start_job`, `process_pending_queue` and `waiting_reason` call DEV-630's `AgentQueueService::slot_wait_reason`, with this process's slot-holding jobs (dispatched or running, not queued); the `agent_active_jobs` records are added and deduplicated by job id there
    - Global limit = total of all projects; a project's own limit applies on top. A limit of `0` keeps jobs waiting; merge jobs still wait for each other
    - New watcher: while jobs wait in this process, it checks for a free slot every 500 ms, so a job ending in another process frees the slot. `process_pending_queue` now starts every job that fits, in queue order
    - A config that can't be read: `start_job` fails with the error, as before; a waiting job stays waiting
    - Reason text: `it is waiting for a free slot (1 of LIM's agent.worktree.max_parallel_jobs 1 running)` or `... of the global ...`
    - `queue_stats().max_parallel` shows the global limit now, not the last ticket's project limit
    - Test `dev646_serve_shared_job_limits_test` (2 cases: project limit, global limit): one job runs via `agent run --wait` in another process, the next `start_job` waits and starts once it ends. Both fail on the old `agent_job_service.rs`
    - Updated the expected reason text in `agent_automation_integration_test`; `docs/help/agent.md` says serve, MCP, automation and `agent run --wait` apply the same limits
    - Rebased onto main first, dropping a duplicate DEV-633 commit (`git cherry` showed the same code as `9c10760fa`)
