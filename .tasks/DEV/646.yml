description: |-
  Found in the DEV-630 review (2026-11-16).

  ## Found
  - `AgentJobService::start_job` (`crates/lotar-lib/src/services/agent_job_service.rs:334-336`) sets the registry's `max_parallel_jobs` from the starting ticket's project config. It then compares that value with `running_count`, which counts only this process's jobs, from every project.
  - So `lotar serve` ignores jobs that the queue worker and `agent run --wait` run, and one project's limit decides for all of them.
  - Same path: `process_pending_queue` (starts a waiting job when one of this process's jobs ends), `waiting_reason`, and every `JobStartMode::RespectLimits` caller: web `POST` jobs (`routes/jobs.rs`), MCP (`mcp/server/handlers/agent.rs`), automation in server mode (`automation_service.rs`), `lotar agent run --wait`.

  ## Done when
  - [ ] Every `RespectLimits` start (list above) starts a job only when the queue worker after DEV-630 would: the same rule (DEV-630 rework: the global `max_parallel_jobs` is a total across all projects, a project's own limit applies to that project on top), through the same function as the worker, not a copy.
  - [ ] Jobs are counted in every lotar process: this process's registry plus the `agent_active_jobs` records, deduplicated by job id.
  - [ ] A job without a free slot waits and starts once a slot frees, also when the job that ends ran in another process.
  - [ ] A merge job still waits for the other merge job; a limit of `0` keeps jobs waiting.
  - [ ] The waiting reason names the limit that holds the job (total or the project's).
  - [ ] The config can't be read: the start fails with the error, as today; no job starts past a limit.
  - [ ] Test with two processes: one runs a job via `agent run --wait`, the other starts jobs through `start_job`; the second job waits for the first process's job to end. Fails on the old code.
  - [ ] `docs/help/agent.md` says `lotar serve` applies the same limits as the worker.
