- date: 2026-11-12T10:35:46.590246+00:00
  author: claude
  text: |-
    claude: Done on branch agent/DEV-373, commit 741b4eb 'DEV-373 Add versions' (signed, not pushed or merged).

    To try (from the worktree, after cargo build; or after the merge):
      lotar config set custom_field_properties 'affects=version, fixed_in=version' --global   (or in YAML: custom: { fields: [product, { name: affects, type: version }] })
      lotar add "Crash" --field affects=v0.13.2        -> stored as '0.13.2'
      lotar add "Leak" --field affects=0.13.1,0.14.0   -> a list
      lotar add "Bad" --field affects=later            -> refused: 'later' is not a version
      lotar list 'affects>=0.13' 'affects<0.14'        (quote: < and > redirect in a shell)
      lotar list affects=0.13 / affects=^0.13 / affects=~0.13.2 / '-affects>=0.14'
      lotar list --sort-by affects order=asc           -> version order (0.9.1 before 0.10.0)
      Web UI: search box takes the same terms; Config > Tags & fields > Version fields; task panel flags 'soon' in a version field and does not save it.
      Automation: when: { current: { affects: { version: '>=0.13 <0.14' } }, status: InProgress }
    lotar's own DEV project now declares affects and fixed_in as version fields (.tasks/DEV/config.yml, custom.field_properties).

    What changed: typed custom fields (custom_field_properties, split from/folded into custom.fields like tag colours; config set/inspect/validate); src/utils/version.rs (parse, semver precedence, ranges) and view/utils/versions.ts; writes normalised in task_validation (CLI add/edit, REST, MCP, move); query terms in both search parsers + shared fixture; version filters and sort in task_list; automation 'version' operator + validation, rule dialog option; Config page list; task panel check; docs (config, config-reference, list, add, automation, mcp-tools, task-model), OpenAPI descriptions, MCP tool descriptions.

    Decisions the plan left open: (1) own parser, not the semver crate: semver cannot hold a partial value like 0.13 meaning every 0.13.x, and its bare '0.13' requirement means ^0.13. (2) A value matches when it overlaps the range, so affects: 0.13 matches affects>=0.13.2. (3) Plain precedence for prereleases: <0.14 leaves out 0.14.0-rc.1, <0.14.0 includes it. (4) Up to three numbers (1.2.3.4 is refused). (5) A comma in a CLI value makes a list. (6) An unchanged hand-written value that is not a version passes, so it never blocks other edits; searches skip it. (7) A declared custom field may also stand at the top level of an automation condition. (8) A REST URL key cannot hold '>=': use query=affects>=0.13 or affects=>=0.13.

    Checks: npm run lint (lint:agent) clean; npm test (test:agent): 2061 Rust, 1469 UI, release and hook tests pass; npm run smoke: 104 files / 381 tests pass, including the new ui.version-fields smoke test. New tests: utils::version unit tests, config_custom_field_types_test, custom_field_versions_test (CLI + REST), dev373_automation_version_conditions_test, MCP version test, shared search fixture cases, versions.spec.ts, config form and automation round-trip specs.
