comments:
- date: 2026-11-16T03:40:37.686895+00:00
  author: claude
  text: |-
    Done: a `session: continue` job resumes only within `continue_within_minutes` (profile, default 55) of the session's last turn; older, it starts a new session with a handoff.

    - `run_job` (`agent_job_service.rs`): checks the session's `last_used` before touching its worktree; the job log says `Continuing the session …, last used N minutes ago (within …, M)` or `… not within continue_within_minutes (M); this job starts a new one with a handoff`
    - Handoff appended to the prompt: the skipped session, ticket branch + newest commit (`git log -1`), the newest 3 comments (cut at 1,500 chars); left out parts when git or the ticket can't be read
    - The job's own profile sets the time (a merge continuing the reviewer's thread uses the merge profile's); `0` never resumes; an unparseable `last_used` resumes as before
    - Tests: `session_continue_resumes_a_session_used_within_the_time`, `session_continue_starts_a_new_session_with_a_handoff_after_the_time` (`dev503_harness_jobs_test.rs`)
    - Docs: `docs/help/agent.md#sessions`, `config-reference.md`
    - No config change needed in standards' `configs/lotar` (the default applies); its README could mention it once released
    - Told the DEV-602 thread (same `run_job` code) what changes
  report:
    commits:
