- date: 2026-11-16T04:47:41.675193+00:00
  author: claude
  text: |-
    Review: passed. `d9e58bcb` does what "Done when" asks; one minor follow-up filed.

    - Read: the diff (`git diff main...HEAD`, 5 files), the ticket and the fix comment, DEV-602, AGENTS.md, and main's newer `agent_job_service.rs` commits (DEV-593, DEV-594): they merge cleanly (`git merge-tree`) and don't touch the new check
    - Premise holds: harnessmux 0.1.9 sets `last_used` on every state change, including a turn's end (`session.rs` `set_state`)
    - `run_job`: the idle check runs only on a session that `continuable_session` accepted, so the other "can't continue" reasons are unchanged and get no handoff; an unparseable `last_used` resumes; `0` never resumes (`idle >= limit`); the limit comes from the job's own profile (`resolve_profile`), and rules can't set it
    - The handoff happens before the T3 worktree lookup, so a fresh job takes the usual `plan_t3_worktree` path; it names the new session under the job's own profile
    - Tests `session_continue_resumes_a_session_used_within_the_time` and `..._starts_a_new_session_with_a_handoff_after_the_time` cover both cases, including the log line, `session/new` vs `session/resume`, and a comment in the handoff
    - Docs: `agent.md#sessions` and `config-reference.md` agree with the code
    - Minor, filed as DEV-611: on a fix rework, the new session has the same name as the old one, so harnessmux deletes the old record and event log (`registry.remove`). The handoff names a session whose log is gone.
    - No files changed; status and assignee are unchanged
  report:
