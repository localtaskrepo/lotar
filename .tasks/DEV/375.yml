description: 'Found 2026-11-12 during the DEV-373 merge: npm run smoke failed once in smoke/tests/api.automation.smoke.spec.ts ''monitor counterfactual: wait-then-read wedges a chatty stderr child, concurrent drain completes'' (line 730: expected the aborted-old marker to be absent, it existed). The file passed 3 of 3 runs alone and the full suite passed earlier the same night, so it looks load/timing dependent. Check: npm run smoke (full suite, repeated). Done: the test passes reliably under full-suite load.'
