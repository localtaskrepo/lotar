- date: 2026-11-12T10:48:44.854738+00:00
  author: claude
  text: 'claude: Fixed in 082f1c7 (branch agent/DEV-375). Cause: the old-shape guard in the counterfactual test started its 4s kill timer at spawn, but the child''s own 3s abort bound only starts after Node startup. Under suite load the guard could kill the child just after it wrote aborted-old.marker (or fire after it had already exited), so the test took the Windows-wedge branch and asserted the marker absent. Change (smoke/tests/api.automation.smoke.spec.ts only): the guard skips the kill if the child has already exited, and the guard is 15s on POSIX (the child always self-aborts first) and stays 4s on Windows. Checks: npm run smoke (build + full suite) 381/381; full quick smoke 3x more under 6 extra CPU-burning processes, 381/381 each; npm run lint:agent and npm run test:agent pass.'
- date: 2026-11-12T10:52:20.955479+00:00
  author: claude
  text: 'claude: Merged. The branch was already on main''s tip (7798ae0), so the rebase changed nothing; lint, test and smoke had already passed on 082f1c7 itself. Fast-forwarded main to 082f1c7, committed the pending .tasks changes (DEV-364, DEV-373, DEV-375) as 916b0cd ''DEV-375 Ticket updates'', and pushed 7798ae0..916b0cd to origin/main (repos.json allows push, and the only unpushed commits were these two). Check rerun in the main checkout: npm run smoke (build + full suite) 381/381, plus a second full run 381/381.'
