comments:
- date: 2026-11-12T05:47:04.512875+00:00
  text: 'claude: Cause: DEV-349 still counted a lotar-agent-wrapper without --tasks-dir (one started by an older build, e.g. another worktree''s test run on a branch before DEV-349) as a job of every tasks directory, so a foreign wrapper for TEST-1 blocked the test''s status change. Fix (commit f85d395 on agent/DEV-367): wrapper_runs_in no longer counts such wrappers; their jobs'' active-job records still count. Unit test wrappers_of_another_tasks_dir_are_not_counted flipped first (failed, then passes); docs/developers/agent-automation-tracker.md updated. Repro: with a wrapper for TEST-1 started without --tasks-dir, cli_configured_reviewer_can_resolve fails on the old code with the ticket''s exact error and passes with the fix. Checks: npm run lint, npm test (2006 Rust + 1444 UI passed), npm run smoke (379 passed). Not run: the 30x next-to-full-suite loop (the deterministic repro covers the cause). The first npm test run hit dev320 status_and_assignee_set_during_a_job_win once, a separate race already tracked as DEV-360 (added my report there); the rerun passed.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Abcb02758-ed60-44e3-b62a-0c1efe25ea59
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Aa7313d32-18d3-4b59-ad90-607ce826ea53
description: 'Found by DEV-361 (claude, 2026-11-12): in a full npm run test:agent on t3/agent-worker-restart-after-upgrade (rebased on 86239c2, other agent jobs running), tests/task_noop_update_test.rs:930 failed with ''Ticket TEST-1 has an active agent job (pid 88551). Cancel it before changing status.'' It passed alone and in the rerun of the full suite. Likely the same cause as DEV-349/DEV-351: a pid in the test''s temp workspace matches a live process of another session. Check: cargo nextest run --retries 0 cli_configured_reviewer_can_resolve next to a full suite 30 times, no failure. Done when the test cannot see a foreign process as its job.'
