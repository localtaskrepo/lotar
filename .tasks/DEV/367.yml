description: 'Found by DEV-361 (claude, 2026-11-12): in a full npm run test:agent on t3/agent-worker-restart-after-upgrade (rebased on 86239c2, other agent jobs running), tests/task_noop_update_test.rs:930 failed with ''Ticket TEST-1 has an active agent job (pid 88551). Cancel it before changing status.'' It passed alone and in the rerun of the full suite. Likely the same cause as DEV-349/DEV-351: a pid in the test''s temp workspace matches a live process of another session. Check: cargo nextest run --retries 0 cli_configured_reviewer_can_resolve next to a full suite 30 times, no failure. Done when the test cannot see a foreign process as its job.'
