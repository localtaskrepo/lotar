description: |-
  Found in the DEV-626 review (2026-11-16).

  ## Found
  - `crates/lotar-lib/src/services/agent_job_service/resumed.rs:169` (branch `agent/DEV-626`, not on main yet) drops a thread that waits for an answer (`pendingRequestCount > 0`) from the list, and then takes over the next running thread of the ticket.
  - DEV-600 says a waiting thread holds the ticket: no other job on the ticket starts. With two resumed threads (the newer one waiting, an older one running), lotar takes the older one over beside the waiting one.

  ## Done when
  - [ ] A ticket whose resumed threads include one that waits for an answer (`t3 thread show` has `pendingRequestCount > 0`, or `t3 thread list` lists it as `waiting`) takes over none of them, whether the waiting one is the newest or an older one.
  - [ ] Each of its other running threads gets one comment per thread run that names it and the waiting thread and says to stop it in T3 Code; a second look at the same run adds no comment.
  - [ ] The waiting thread itself gets no comment and keeps the ticket's assignee, as in DEV-626.
  - [ ] When `t3 thread show` fails for a thread, it counts as not waiting (as before); the next look asks again.
  - [ ] Unchanged: no waiting thread → the newest job's thread is taken over (DEV-626); a queued entry or a done ticket → nothing happens.
  - [ ] A test with the fake t3 in `tests/dev626_resumed_t3_threads_test.rs`: newer thread waits, older one runs → no job, one comment on the older thread, none after a second look.
