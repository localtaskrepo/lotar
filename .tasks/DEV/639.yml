- date: 2026-11-17T02:52:38.519606+00:00
  author: claude
  text: |-
    Fixed: while a resumed thread of a ticket waits for an answer, lotar takes over none of its threads.

    - **Branch base:** `resumed.rs` is only on `agent/DEV-626` (Reviewing), so this branch carries that commit cherry-picked onto main. DEV-626 must land first.
    - `resumed.rs` `on_ticket`: waiting threads are now split off from the others instead of dropped. If any waits and no job is active, nothing is taken over. Each other running thread gets the "stop it in T3 Code" comment, which names the waiting thread, once per run.
    - A thread `t3 thread list` lists as `waiting` also counts as waiting (before, only `running` ones were looked at).
    - **Tests** in `dev626_resumed_t3_threads_test.rs`: newer thread waits, older one runs: no job, one comment, none after a second look through another path. A `waiting` listed thread holds the ticket too. Both failed before the fix.
    - **Docs:** `docs/help/agent.md`, T3 Code threads section.
    - **Guidance:** no durable finding.
  report:
    commits:
    - hash: 66fee083f
      what: DEV-626 commit 55e2126a9 cherry-picked onto main (resumed.rs exists only there); drops out once DEV-626 lands
    - hash: 08cd964f2
      what: a waiting thread holds the ticket, no other thread is taken over
    checks:
