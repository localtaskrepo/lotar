- date: 2026-11-17T03:35:12.627325+00:00
  author: claude
  text: |-
    Review: passed. `08cd964f2` does everything "Done when" asks, and no blocking findings.

    - **Read:** `git log main..HEAD` (`66fee083f` is a DEV-626 copy, `08cd964f2` is the fix), the full diff, the ticket and its comments, DEV-600 and DEV-626, `docs/help/agent.md`. No UI changes, no stray files.
    - **Logic:** `resumed.rs` `on_ticket` now keeps waiting threads separate instead of dropping them. When one waits and no job is busy, `beside` names it, so nothing is taken over and the others get the "stop it in T3 Code" comment once per run. A waiting thread uses up no `first_look_at_run`, so it gets no comment and keeps the assignee. A failed `t3 thread show` still counts as not waiting. The queued, done and busy cases are unchanged.
    - **Fails before:** I ran both new tests on `66fee083f` with the new test file, in a scratch worktree I then removed. Both fail (`dev626_resumed_t3_threads_test.rs:236` and `:262`). On HEAD they pass.
    - **Reran:** `npm run lint:agent` passed. `node scripts/rust-test-runner.mjs --agent dev626` ran 4 times: 6/6 passed 3 times. One run failed `a_thread_t3_code_runs_again_after_its_job_ended_is_taken_over_and_its_end_rules_run_once`, DEV-626's known flaky test, which is already fixed on `agent/DEV-626` (`5d6344feb`, `wait_for_end`). `npm run smoke` and the full `npm test` didn't run.
    - **Merge order:** the DEV-626 copy on this branch is older than `agent/DEV-626` (`5d6344feb`). Land DEV-626 first, rebase this branch and drop `66fee083f`, keeping DEV-626's version.
    - **Note:** harnessmux 0.1.9 reports a waiting thread as `running` with `pendingRequestCount` above 0. The `waiting` list status the fix also accepts may never appear. It does no harm.
    - **Filed:** [DEV-648](https://lotar.pyxzl.net/task/DEV-648). Filtered runs of several Rust tests leave `.lotar-test-scratch` behind (seen with dev510 too, which this branch doesn't change), so the runner exits 1 after passing tests.
