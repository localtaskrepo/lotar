  text: 'Fixed: when git log fails, LoTaR asks git whether HEAD exists (git rev-parse --verify --quiet HEAD, locale-independent); without commits the history is empty instead of an error. Covers task history, activity feeds and every other run_git_log user. Test: task_history_is_empty_before_the_first_commit; REST /api/tasks/history in a commit-less repo now returns 200 [].'
description: 'Found during DEV-216 verification. In a workspace that is a git repository with no commits yet (fresh git init), GET /api/tasks/history?id=<ID> returns 500 INTERNAL with ''git log failed ... your current branch main does not have any commits yet''. The task panel shows a console error on open. Expected: an empty history (no commits means no history), not an error. Repro: git init a folder, lotar add a task, lotar serve, open the task panel.'
