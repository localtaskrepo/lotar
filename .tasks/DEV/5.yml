relationships:
  related:
  - DEV-230
comments:
- date: 2026-09-06T11:21:52.630479+00:00
  text: 'Backlog reconciliation: Remains Todo for a general AND/OR/NOT custom-query language with defined precedence/grouping. Current repeated key/value filters and automation conditions are not equivalent. DEV-57 and DEV-75 cover current query parity/basic documented predicates; preserve this broader feature as a separate scope.'
- date: 2026-09-06T13:12:53.777324+00:00
  text: |-
    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 5: Extend custom fields to support more complex queries (AND/OR logic, NOT operations, etc.)
- date: 2026-10-28T02:06:17.858945+00:00
  text: Feature should probably be expanded to consider complex queries for any field and as an extension of the existing query language
- date: 2026-10-28T21:29:49.554245+00:00
  text: 'Scope decided 2026-10-28: no OR operator for now (add only if enough users ask). The query language stays: values of one key are ORed (status:todo,done or status:todo status:done), different keys are ANDed, plus negation: a leading minus excludes a filter, -key:value / -field:name=value (as -word already excludes search words). Works for any filter key, in the web search box, lotar list, and REST/MCP query, via the shared parser and task query (DEV-230/231/235).'
- date: 2026-10-28T23:50:45.615151+00:00
  text: 'Outcome: a leading minus excludes any filter (-status:done, -tag:wip,draft, -field:area=billing, -has:tag, -mine:true) in the web search box, lotar list (bare args, routed past clap by the preprocessor; short flags unaffected), REST/MCP query, sprint backlog, stats --filter, sprint --select. No OR operator (decided). Both parsers share 67 cases; the shared query removes tasks matching any exclusion (graph too); UI shows ''Not <label>'' chips and sends exclusions in query. q/order/sort_by/deletion cannot be excluded. Evidence: dev231 excluded_filters_work_everywhere, preprocess routing unit test, UI specs. Gates: lint, 1834 Rust, 1369 UI, release 33, hooks 5, smoke 361. Committed with DEV-3 and DEV-13. Guidance: no durable finding.'
description: |-
  Migrated checklist requirements:
  Define custom-field AND/OR/NOT expressions, precedence and grouping, then implement consistent query semantics. Existing repeated key/value filters and automation conditions are not this general language. Coordinate DEV-57/75 without duplicating those narrower parity fixes.
