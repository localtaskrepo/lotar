- date: 2026-11-23T07:49:27.544311+00:00
  author: claude
  text: |-
    Fixed: a worktree added with `git worktree add --relative-paths` now counts when `lotar add` picks the next ID.

    - Cause: `checkout_tops` (`crates/lotar-core/src/utils/git.rs`) read the relative `gitdir` line (`../../../../wt/.git`) against the process's cwd, so that worktree was left out.
    - Fix: the line now resolves against its admin folder (`.git/worktrees/<name>/`). An absolute line works as before. An empty line is skipped, so it no longer resolves to the admin folder itself.
    - Failing test first: `checkouts_of_one_repository_get_distinct_ids` (`crates/lotar-lib/tests/dev270_task_numbers_test.rs`) now adds a `--relative-paths` worktree. Before the fix, two checkouts both got `DEV-5`; with the fix they get `DEV-5` and `DEV-6`.
    - New unit test `checkout_tops_resolve_relative_gitdir_lines_against_the_admin_folder` (`crates/lotar-core/tests/common/dev73_git_metadata_cases.rs`) writes relative, absolute, empty and dangling lines by hand, so no git process is needed.
    - Branch: DEV-802's commit `b7256c744` isn't on main yet (its ticket is in Merging), so I cherry-picked it as `65d57abd3`. Merge after DEV-802 lands; rebasing onto main then skips that commit.
    - Guidance: no durable finding.
  report:
    commits:
