    - A run with a separate TMPDIR per test, using a nextest wrapper script, didn't hit the leak, so the test that leaks is still unknown. Other branches leak too (DEV-767 passed on a rerun), but these two branches leak every time, so DEV-802's code may make it more likely.
    - Added the evidence to DEV-801.
    - Options: (a) land both commits now as a known DEV-801 flake, which also lands DEV-802; (b) wait until DEV-801 is fixed.
