description: |-
  Found: reviewing DEV-802, `checkout_tops` (`crates/lotar-core/src/utils/git.rs`, new in b7256c744) reads each `.git/worktrees/<name>/gitdir` line as a path and canonicalizes it against the process's cwd. Git 2.48+ writes it relative to that admin folder when a worktree is added with `--relative-paths` (or `worktree.useRelativePaths=true`), e.g. `../../../../wt/.git`, so that worktree is left out and its ticket IDs can be handed out again. Check: in a scratch repo, `git worktree add --relative-paths -b wt ../wt` and `git worktree add -b wt2 ../wt2`, then `lotar add` in wt and in wt2 (with LOTAR_TASKS_DIR unset): both got DEV-3. lotar's own agent worktrees use absolute paths, so jobs are not hit today. Done: a relative gitdir line resolves against the admin folder (as `metadata_directory` already does), and the DEV-802 test covers a --relative-paths worktree.

  ## Done when

  - [ ] `checkout_tops` resolves a relative `gitdir` line against its admin folder (`.git/worktrees/<name>/`), the way `metadata_directory` does; an absolute line works as before.
  - [ ] The result does not depend on the process's cwd.
  - [ ] A `gitdir` line that is empty, unreadable or points at a folder that no longer exists still leaves that worktree out (no error, no panic); the other checkouts still count.
  - [ ] `checkouts_of_one_repository_get_distinct_ids` (`crates/lotar-lib/tests/dev270_task_numbers_test.rs`) adds a worktree made with `git worktree add --relative-paths` (git 2.48+, as on the CI runners); `lotar add` there and then in the absolute-path worktree get distinct IDs. A unit test in `dev73_git_metadata_cases.rs` writes relative, absolute, empty and dangling `gitdir` lines by hand, so the parsing is covered without git.
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass.
