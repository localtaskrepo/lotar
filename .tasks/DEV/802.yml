- date: 2026-11-22T22:11:29.406284+00:00
  author: claude
  text: |-
    Fixed: `lotar add` in a worktree now skips IDs the main checkout or another worktree already has.

    - Cause: `get_current_id` (`crates/lotar-core/src/storage/operations.rs`) only looked at the current tasks root plus its sibling and parent roots, not at other git checkouts.
    - Fix: new `checkout_tops` (`crates/lotar-core/src/utils/git.rs`) lists the main checkout and the linked worktrees from git's metadata files (no `git` process is started). ID allocation also counts the same tasks folder in each of them. This works both ways: main skips IDs that a worktree has filed, too.
    - Test: `checkouts_of_one_repository_get_distinct_ids` in `crates/lotar-lib/tests/dev270_task_numbers_test.rs`. It fails without the fix (the worktree got `DEV-2` again) and passes with it.
    - Docs: allocation rule in `docs/help/task-model.md`.
    - Not covered: a ticket filed in main *after* a worktree's ticket was deleted or its worktree removed can reuse that ID. The existing duplicate warning and `task renumber` handle that case.
  report:
    commits:
    - hash: b7256c744
      what: ID allocation counts the tasks folder of every checkout of the repo
    checks:
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: passed
    next: Review, then merge
- date: 2026-11-23T04:28:14.079546+00:00
  author: claude
  text: |-
    Review: passed. `b7256c744` does what "Done" asks; one minor gap filed as DEV-825.

    - Read: diff (`operations.rs`, `git.rs`, `dev270_task_numbers_test.rs`, `task-model.md`), ticket, fix comment, other callers of `get_current_id` (create, move, renumber, dry-run, delete warning). All of them gain from the wider scan.
    - Reran: `dev270` tests (4 passed), `lotar-core` git tests (26 passed), fmt checks clean. The new test asserts DEV-3 in the worktree, so it fails without the fix (the old code gives DEV-2).
    - Manual check in a scratch repo: main → DEV-2, worktree → DEV-3, main again → DEV-4. IDs stay distinct both ways.
    - Minor, filed DEV-825: `checkout_tops` (`crates/lotar-core/src/utils/git.rs`) resolves a relative `gitdir` line against the cwd, not against the admin folder. A worktree added with `git worktree add --relative-paths` is skipped, and two worktrees both got DEV-3. lotar's own job worktrees use absolute paths, so this doesn't block the merge.
    - Side note: my first scratch `lotar add` calls went to the real backlog through the job's `LOTAR_TASKS_DIR` (DEV-818). I removed the two stray tickets right away; DEV-825's number was reused by the finding above.
  report:
    checks:
    - command: cargo nextest run -p lotar-lib --test integration dev270
      result: passed
    - command: cargo nextest run -p lotar-core git
      result: passed
    - command: rustfmt --check + prettier --check on changed files
      result: passed
    - command: npm ci
      result: passed
    - command: npm run lint / npm test / npm run smoke
      result: not_run
      reason: fix agent ran them on b7256c744; change is small, targeted tests rerun
