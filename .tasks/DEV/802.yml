description: 'Found: the DEV-738 review job filed its docs follow-up with lotar add in the DEV-738 worktree. Its .tasks copy predates main''s DEV-788 (flaky smoke, 2026-11-22T07:34), so the new ticket got DEV-788 too (commit c1dc25aa2 on agent/DEV-738 adds .tasks/DEV/788.yml). Its fix job then ran on agent/DEV-788, the flaky-smoke ticket''s branch, and merging agent/DEV-738 would hit an add/add conflict on .tasks/DEV/788.yml. Check: from a job worktree, lotar add allocates an ID that is already taken in the main checkout''s .tasks. Done: tickets filed from a job''s worktree go to the main checkout''s tasks directory (or get an ID free there), and a test covers it.'
tags:
- health
custom_fields:
  finding: lotar:ticket-id-collision
