- date: 2026-11-21T23:27:56.757332+00:00
  author: claude
  text: |-
    Done: each job records its first turn's prompt and settings in a `run_inputs` log line, readable from the Instructions button, `GET /api/jobs/inputs` and `lotar agent logs <job> --inputs`.

    - Recording: `agent_job_service/run_inputs.rs` (new). `build_prompt` marks sections; merge hand-off and Handoff are tracked too. `env`, MCP env and headers are names only.
    - REST: `GET /api/jobs/inputs?id=` returns `{inputs}` (null when not recorded), 404 for an unknown job. Not in `/api/jobs/logs` or SSE. `api_types.rs`, `types.ts`, `openapi.json`, `docs/help/agent.md` (new section "Run inputs") and `api-quick-reference.md` agree.
    - UI: `view/components/AgentRunInputs.vue`, mounted in the log panel on the Agents page and in the task panel thread: settings table, collapsible prompt sections, Copy prompt and Copy all, "Not recorded for this job", error with Retry. Settings stack on narrow screens.
    - Tests: Rust unit tests (sections, redaction with a secret value, log round trip), 2 integration tests in `dev503_harness_jobs_test.rs`, `view/__tests__/AgentRunInputs.spec.ts`, and a smoke test in `ui.agent-jobs.smoke.spec.ts`.
    - Screenshots: before = installed lotar 0.15.5, after = this branch, on a throwaway workspace.

