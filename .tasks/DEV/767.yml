description: |-
  A job's log doesn't say what went into the run. The prompt lotar builds (8–12 KB: agent instructions, "This job", ticket context, relationships, comments, recent context, earlier sessions, user request) and the session settings are never written to lotar's log. The first turn is deliberately not logged (`drive_turns`, `agent_job_service.rs` ~:4592). The owner asked on 2026-11-21 for "the instruction set that a run used. As a button that you can expand … to reconstruct and fine tune it".

  ## Today

  - The prompt is built in `start_job` / `build_prompt` (`crates/lotar-agent/src/services/agent_job_service.rs` ~:372-390, :1411-1525), from `resolve_agent_instructions` (:1170), `job_notes` (:1240), `earlier_sessions_text` and the merge hand-off prepended in `run_job` (:3450).
  - Session settings come from `session_profile` (`crates/lotar-agent/src/services/agent_runner.rs` :320-348) plus `add_dirs`, the `lotar` MCP server and its tool list, T3 title and Claude settings (`run_session`, AJS :4100-4170).
  - Only `model`, `effort` and `agent_profile` reach the log header. The full prompt is only in harnessmux's `turn.started` event, and those session files are pruned and restarted separately.

  ## Plan

  - [ ] When a job sends its first turn, write one `run_inputs` line to its log:
    - `prompt`: the full text plus its sections (heading, start, length). Split it in `build_prompt`; don't parse it back afterwards.
    - `instructions_source`: the built-in docs file, `agent.instructions` inline or a file path, plus the profile's own instructions.
    - `settings`: runner, agent, model, effort, provider, permissions, `on_permission`, rules (allow/deny, `git push` deny, write confinement), ACP options, `add_dirs`, MCP servers and allowed tools, session mode (new, continue, fresh, resumed).
    - `env`: names only, never values. Same for anything else that can hold a secret.
  - [ ] Later turns already log `agent_job_input`.
  - [ ] `GET /api/jobs/logs` (or a new `GET /api/jobs/inputs?id=`) returns it on demand. Don't send it over SSE.
  - [ ] UI: a collapsed **Instructions** button in the job's log panel (Agents page and task panel thread). It opens the settings as a small table and the prompt as collapsible sections, one per heading, with Copy prompt and Copy all. Keep it separate (for example `view/components/AgentRunInputs.vue`) so the log viewer rebuild can place it.
  - [ ] `lotar agent logs <job> --inputs` prints the same (or say why not).
  - [ ] REST contract files agree (api_types.rs, view/api/types.ts, docs/openapi.json, docs/help/agent.md).
  - [ ] Jobs from before this change say "Not recorded for this job".

  ## Done when

  - [x] A job that sends its first turn (harnessmux session or `command` runner) writes exactly one `run_inputs` line to its log before the turn goes out; `prompt` is exactly the text the agent got, including a merge hand-off put in front and an idle-session handoff appended.
  - [x] `sections` cover the prompt in order without gaps (offsets in Unicode code points), one per heading `build_prompt` writes (Agent instructions, This job, Ticket context, Relationships, Comments, Recent context, Earlier agent sessions on this ticket, User request), plus Merge hand-off and Handoff when present.
  - [x] `env` lists variable names only; env values, MCP server env values and HTTP header values never appear in the line (a unit test checks with a secret value). The prompt itself is recorded as sent.
  - [x] A commit retry that doesn't run the agent writes no `run_inputs`. Writing the line fails or logging is off: the job runs on, and its inputs read as not recorded.
  - [x] `GET /api/jobs/inputs?id=` returns `{inputs}` (null when not recorded) for a job this server or a log knows, 404 for an unknown job; `/api/jobs/logs` and SSE don't carry it. api_types.rs, view/api/types.ts, docs/openapi.json and docs/help/agent.md agree.
  - [x] Web UI, Agents page and task panel thread: a collapsed **Instructions** button in the job's log panel loads the inputs when first opened; it shows the settings as a table and the prompt as collapsible sections, with Copy prompt (the exact prompt) and Copy all (settings and prompt as JSON). A job without the line says "Not recorded for this job"; a failed load shows the error and can retry.
  - [x] `lotar agent logs <job> --inputs` prints the settings and the prompt (`--format json`: the record); without a record it says "Not recorded for this job".
  - [x] Rust tests (sections, redaction, log round trip, a log without the line), a Vitest for the component, and a smoke test that opens the button on a real job.
