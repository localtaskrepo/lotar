- date: 2026-11-20T22:04:29.151191+00:00
  author: claude
  text: |-
    Review: passed. The log line now tells a gone worktree from a program missing on PATH, and the DEV-728 cause is known.

    - Read: commit `14b6f9177` (`crates/lotar-agent/src/services/agent_job_service.rs`, `docs/help/agent.md`), all ticket comments, DEV-731 and DEV-732, and the last 5 main commits to both files.
    - Done when: `start_failure` returns "the folder is gone", "`<program>` doesn't exist" or "`<program>` is not on this lotar's PATH (<PATH>)", and passes other errors through unchanged. The cause is recorded: `cargo` was missing from the worker's inherited PATH and the folder was there (`stat` evidence). That fix is in DEV-731.
    - The PATH shown is the one the spawn used: `clear_repository_env` only drops `GIT_*` routing keys, not `PATH`.
    - Test `waiting_run_start_failure_names_the_missing_program_or_folder` runs all three real spawns. `start_failure` is new, so there is no "fails on the old code" version of it; the old raw `os error 2` couldn't tell the cases apart.
    - Main moved on (DEV-711, DEV-729, DEV-733 touch the same files) but `git merge-tree main HEAD` is clean. No stray files and no second branch.
    - `npm ci`: passed.
    - Reran: `cargo nextest run -p lotar-agent waiting_run` (1 passed), `cargo clippy -p lotar-agent --all-targets --all-features -- -D warnings` (clean), `rustfmt --check` and `prettier --check` on the touched files (clean). Not rerun: full `npm test` and `npm run smoke` (they passed on this commit in the fix session).
    - No UI changes. No tickets filed.
