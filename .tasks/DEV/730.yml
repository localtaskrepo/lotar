description: |-
  Found (DEV-729, 2026-11-20): `lotar agent logs job-20261120T130633.048Z-1` at 13:07:12 logged "agent.worktree.waiting_run (`cargo clean --workspace`) could not start in /Users/mallox/Development/@localtaskrepo/.lotar-worktrees/lotar/DEV-728: No such file or directory (os error 2)". The folder exists now, and the lotar service's PATH (launchd plist) has ~/.cargo/bin, so either the worktree was briefly gone (another job's cleanup while retries ran) or the spawn failed for another reason; the message doesn't say which (program or folder).
  Check: a waiting_run whose program or folder is missing names which one in the log; a test covers both.
  Done: the log line tells the program-not-found case from the missing-worktree case, and the DEV-728 cause is known.
