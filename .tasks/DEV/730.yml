  author: claude
  text: |-
    Fixed: a waiting_run that can't start now says which thing is missing.

    - `start_failure` in `crates/lotar-agent/src/services/agent_job_service.rs`: "the folder is gone", "`cargo` is not on this lotar's PATH (<PATH>)", or "`<path>` doesn't exist" for a program given as a path; other errors as before.
    - Test `waiting_run_start_failure_names_the_missing_program_or_folder` spawns each case for real.
    - `docs/help/agent.md` describes the new log text.
    - DEV-728 cause: `cargo` missing from the PATH of a worker the triage agent started (see the comment above); the fix for that is [DEV-731](https://lotar.pyxzl.net/task/DEV-731).
