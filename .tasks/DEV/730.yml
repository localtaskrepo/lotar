- date: 2026-11-20T13:33:48.900923+00:00
  author: claude
  text: |-
    Cause found: `cargo` wasn't on the PATH of the worker that ran the job; the worktree was there.

    - `DEV-728` folder: born 13:01:12 UTC, unchanged since (`stat` birth/ctime), so it never went away. Same for DEV-726 and DEV-727, which failed the same way.
    - Jobs `-1`..`-27` (05:22–13:06 UTC) ran in one `lotar agent worker`, started by the triage agent's `lotar assignee`. The job at 13:07 ran in another worker triage started.
    - A worker triage started at 12:51 (harnessmux, still running) has `PATH=/opt/homebrew/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin`: no `~/.cargo/bin`. The worker started 13:23 has it, and its run for DEV-729 worked.
    - Filed the root cause as [DEV-731](https://lotar.pyxzl.net/task/DEV-731).
    - Fix here: the log line now says "the folder is gone" or "`cargo` is not on this lotar's PATH (<PATH>)".
