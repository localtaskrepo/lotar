description: 'Found: build_command (crates/lotar-lib/src/services/agent_runner.rs) puts the whole prompt in LOTAR_AGENT_PROMPT. Linux caps one environment string at 128 KiB (MAX_ARG_STRLEN), so the spawn fails with ''Argument list too long (os error 7)'' and the job fails. Seen in CI on main while fixing DEV-533 (test with a 256 KiB prompt, since removed). Check: start a command-runner job with a 200 KiB prompt on Linux. Done: such a job starts and its program can read the full prompt (e.g. also offer it in a file, LOTAR_AGENT_PROMPT_FILE), docs/help/agent.md updated.'
