- date: 2026-11-14T18:49:02.758797+00:00
  author: claude
  text: 'Fixed in 22bce0cd (branch agent/DEV-542). A command runner''s prompt is now always in a file named by LOTAR_AGENT_PROMPT_FILE: <job>.prompt next to the job''s active record, mode 0600, removed by unregister when the job ends, so it is still there when an orphaned job outlives its lotar process. LOTAR_AGENT_PROMPT stays set only while NAME=value fits Linux''s 128 KiB MAX_ARG_STRLEN. docs/help/agent.md updated. Tests: a unit test for the cutoff, a write/remove check in agent_active_jobs, and an integration test with a 200 KiB prompt (its program reads the file, and LOTAR_AGENT_PROMPT is unset). Check on Linux (rust:1.99.1 in Docker): main''s code fails with ''Failed to spawn runner: Argument list too long (os error 7)'', and the fix passes, as does the existing 256 KiB an_agent_that_never_reads_its_prompt_still_completes. On macOS: npm run lint:agent, test:agent (2172 Rust + 1537 UI) and test:smoke:agent (401) all pass. Guidance: no durable finding.'
