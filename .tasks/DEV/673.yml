- date: 2026-11-17T20:07:27.811407+00:00
  author: claude
  text: |-
    Fixed: the job that ends no longer counts as working in an earlier job's worktree, so the ticket branch moves there.

    - Cause: the earlier fix job (`job-20261115T213415.235Z-72`) left `/Users/mallox/.t3/worktrees/lotar/DEV-530` clean on `agent/DEV-530`. The failing job `job-20261117T194848.004Z-23` ran in the same harnessmux session `lotar-95e687-DEV-530-fix`. `finished_job_worktree` saw that session in the ending job's own active record ("a running job continues its session"), so the worktree looked in use. DEV-595's move-in-worktree step was skipped and `git branch --force` failed.
    - DEV-595's test passed because its two jobs used different profiles, so different sessions.
    - Change: `move_ticket_branch` and `finished_job_worktree` in `crates/lotar-agent/src/services/agent_job_service.rs` take the ending job's id and leave it out. The job end passes it; the job start (`follow_ticket_work`) passes none.
    - Test: `the_tickets_branch_moves_in_the_worktree_of_an_earlier_job_in_the_same_session` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`. Before the fix it failed with the DEV-530 error.
    - Docs: `docs/help/agent.md` line on finished job worktrees updated in place.
  report:
