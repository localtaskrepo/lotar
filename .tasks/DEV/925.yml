- date: 2026-11-27T12:12:09.210091+00:00
  author: claude
  text: |-
    Already fixed on main: both tests pass while a real lotar holds port 47586, no change needed.

    - `t3_harness_with` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs` sets `LOTAR_CHECK_LOCK_HELD=1` since DEV-908 (`8f8365754`, 2026-11-26).
    - The test ctor in `crates/lotar-lib/tests/common/mod.rs` sets it for every integration test since DEV-890 (`d1061401e`); tests that need the lock set their own `LOTAR_CHECK_LOCK_PORT` and clear it (DEV-867, DEV-797).
    - The DEV-867 review that found this most likely ran on a branch from before those commits.
    - Check: with `LOTAR_CHECK_LOCK_HELD` unset in the parent and `127.0.0.1:47586` held by a real lotar (pid 61697), both tests passed in 1.8 s.
  report:
    checks:
    - command: env -u LOTAR_CHECK_LOCK_HELD cargo nextest run -p lotar-lib --test integration -E 'test(a_continued_merge_in_the_reviews_process) | test(a_continued_merge_without_a_session_of_its_own)'
      result: passed
      reason: 2 passed in 1.8 s while lotar pid 61697 listened on 47586
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3A3b93868ddae9a7d3fe0f2de616f91fb61fe88cd5dc4ead363fb89d0dee2cc64e
description: |-
  Found in the DEV-867 review (2026-11-27).

  - `a_continued_merge_in_the_reviews_process_runs_with_the_merge_profiles_env` and `a_continued_merge_without_a_session_of_its_own_takes_the_reviews_thread` (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs`) start merge agents on the default lock port 47586.
  - While DEV-913's merge held that port, both failed with "timed out waiting for the merge" (60 s); with `LOTAR_CHECK_LOCK_HELD=1` both pass in 2 s.
  - Inside a merge run they pass because lotar sets `LOTAR_CHECK_LOCK_HELD=1`; a fix or review job's targeted run, or `npm test` by hand, fails whenever a merge runs on the machine.
  - DEV-867's and DEV-797's own tests already bind a free port via `LOTAR_CHECK_LOCK_PORT`.

  ## Done when
  - [ ] Tests that start a merge agent don't use the machine's lock port (the test harness sets `LOTAR_CHECK_LOCK_PORT` to a free port, or `LOTAR_CHECK_LOCK_HELD=1`, unless a test sets its own).
  - [ ] Both tests pass while port 47586 is held from outside.
