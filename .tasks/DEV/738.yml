description: |-
  Found in the DEV-734 review (2026-11-20): `resume_session_to_end` (`crates/lotar-agent/src/services/agent_job_service.rs:2169`) now queues any taken-over job whose session can't be opened again with `session: fresh`. For a `t3` job the T3 Code thread keeps running in T3 Code (docs/help/agent.md: the takeover follows it, and starts no thread when it can't tell whether one exists, as that could be a second one). When only harnessmux's record is gone (the test `a_taken_over_job_whose_session_cant_be_resumed_runs_again` in `dev510_t3_session_test.rs` does exactly this), the retry starts a second thread next to the first. Check: take over a t3 job whose harnessmux session record is deleted while its thread still runs. Done: lotar starts no second thread then (fails as before, or finds the thread by its title) and the docs say which.

  ## Done when
  - [ ] A taken-over `t3` job whose session can't be opened again (its harnessmux record is gone) is not queued to run again: it fails as before DEV-734, with the reason, its `job_failed` rules run, and no second T3 Code thread starts. Its thread may still run in T3 Code with no job following it (the failed job names no thread and the record is gone, so the thread look-up can't take it over); the docs say to look at it in T3 Code.
  - [ ] Other session runners (Claude, Codex, …) keep DEV-734's behaviour: the job ends paused and runs again first with `session: fresh`.
  - [ ] Test in `dev510_t3_session_test.rs`: the t3 takeover with the record deleted ends `failed`, queues no entry for the ticket, and makes no second thread; it fails on DEV-734's code. A non-t3 test still covers the run-again path (add one if `a_taken_over_job_whose_session_cant_be_resumed_runs_again` was the only one).
  - [ ] docs/help/agent.md (Takeover after a restart) says a `t3` job fails there instead of running again, and why (a second thread).
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass.
