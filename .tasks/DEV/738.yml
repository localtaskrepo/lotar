  text: |-
    Waits for DEV-734: the code this ticket fixes is only on its branch, not on main yet.

    - `run_again_in_new_session` and the test `a_taken_over_job_whose_session_cant_be_resumed_runs_again` exist only in `aa2b8b2f8` on `agent/DEV-734` (status Merging)
    - Planned fix: `resume_session_to_end` doesn't queue a `t3` job again; it fails as before, with no second thread. Other runners keep DEV-734's re-run
