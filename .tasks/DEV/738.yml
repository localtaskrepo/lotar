- date: 2026-11-22T11:20:08.182425+00:00
  author: claude
  text: |-
    Fixed: a taken-over `t3` job whose session can't be resumed now fails instead of running again, so no second T3 Code thread starts.

    - `resume_session_to_end` (`crates/lotar-agent/src/services/agent_job_service.rs`): for `t3` it fails the job with the reason and "It doesn't run again: … a new session would start a second thread"; `job_failed` rules run. Other runners keep DEV-734's paused + `session: fresh` re-run
    - Test `a_taken_over_t3_job_whose_session_cant_be_resumed_fails_without_a_second_thread` (`dev510_t3_session_test.rs`): ends `failed`, nothing queued for the ticket, one `thread start`, the `job_failed` rule ran once. It fails on DEV-734's code (status `paused`)
    - The run-again path had only the t3 test, so I added `a_taken_over_job_whose_session_cant_be_resumed_runs_again` in `dev503_harness_jobs_test.rs` with the fake Claude ACP agent (`FAKE_HOLD` + `FAKE_NO_RESUME`): paused, re-queued with `session: fresh`
    - Finding: the thread look-up can't take that thread over later. The failed job's last status names no thread and harnessmux's record is gone. I corrected the first "Done when" bullet, and `docs/help/agent.md` (Takeover after a restart) now says no job follows the thread and to look at it in T3 Code
    - Branch fast-forwarded onto main (`b18be094a`, has DEV-734) before the change
