    Review: blocking

    - `crates/lotar-lib/src/services/agent_runner.rs:110`: existing own-profile session wins over newer review. A second merge returns to its old thread rather than the latest review, contrary to Done. Choose latest across profiles; test merge, newer review, merge.
    - `crates/lotar-lib/src/services/agent_runner.rs:189`: owned-session early return bypasses environment update. In `lotar serve` merge retains review environment, as fix report acknowledges. Update owned sessions too and test same-process handoff.
    - Read full diff `4a11cadf`, ticket/report, migration context and owner same-thread decision. Added test covers first merge only.
