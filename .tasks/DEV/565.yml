- date: 2026-11-15T18:19:27.745448+00:00
  author: claude
  text: |-
    Rework: finding 2 fixed; finding 1 kept as designed, because the owner's DEV-472 design asks for it.

    - Finding 1 (own profile's session beats a newer review): not a bug. "As in 0.15.0" means DEV-472 (Done): "take the ticket's newest earlier thread from a job of the same agent profile. With none, … newest thread". Taking the newest of any profile would put a rework after a blocking review into the reviewer's Codex thread, the case DEV-472 fixed. The Done line's "whatever profile ran it" applies when the profile has no session yet, as the standards merge does.
    - Finding 2 (in-process session keeps the old env): fixed in `agent_runner.rs` `open_session`. An open session whose recorded env differs from the new job's stops: close sends the backend the same command as the idle TTL, and its record goes back to `Idle`. It then resumes with the new job's env. New test `a_continued_merge_in_the_reviews_process_runs_with_the_merge_profiles_env` (Server mode) timed out before the fix.
    - Side effect: an in-process continue now restarts the agent with `session/resume`, because the ticket's `LOTAR_` vars change between jobs. The pipeline test now asserts the resume. The fake numbers its replies per process, so its "fix 2" check became a count.
    - Reviewer's `ENOTEMPTY`: that run used the installed 0.15.1. With this build the check passes 3 times out of 3.
    - Docs: `docs/help/agent.md` Sessions.
