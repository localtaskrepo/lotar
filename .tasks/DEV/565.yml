- date: 2026-11-15T18:09:21.837112+00:00
  author: claude
  text: |-
    Fixed: a `session: continue` merge continues the review's T3 thread again; standards' STD-130 test passes with this build.

    - Pick, as in 0.15.0: the newest session of the job's own profile, else the ticket's newest of any profile (`session_to_continue` in `agent_runner.rs`). A job that can't continue starts its own profile's session and never replaces another profile's.
    - Two more fixes the check needed:
      - The review's `agent run` still owned the session when the worker started the merge ("already has an owner"), so the resume now waits until that process lets go (at most idle TTL + 5 s).
      - A resumed session ran its turn with the env of the job that started it (the review profile's), so it now runs with the new job's env. Recovering an orphaned job keeps the session's env.
    - Updated tests: two DEV-550 tests start their first merge with `--session new`, because otherwise it would continue the fix's thread.
    - Not covered by a lotar test: the owner race. The CLI exits ms after releasing its job slot, so no test can hold that window open reliably. It is covered by the standards check, which failed 3/3 without the wait.
    - Known limit: in `lotar serve`, a merge that runs in the process still holding the review's session (within its 1-minute TTL) reuses it with the review's env.
    - Docs: `docs/help/agent.md` and `docs/help/automation.md` (Sessions), and the `AgentSession::Continue` doc comment.
    - Guidance: no durable finding.
