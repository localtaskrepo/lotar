description: |-
  Found: since lotar 0.15.1 (DEV-503, harnessmux) a `session: continue` job resumes only `<repo>-<hash>-<ticket>-<profile>`, so the standards rule "Review passed: merge" (profile merge, session: continue) logs "No earlier session repo-…-STD-1-merge; this job starts a new one." and starts a new thread instead of the reviewer's. The same holds for the review-child pilot (STD-88: merge and rework continue the fix thread). DEV-503's approved design said "session: continue uses named sessions, one per ticket"; the owner decided 2026-11-11 that the merge runs in the reviewer's thread (standards docs/decisions/2026-11-11-merge-in-fix-thread.md, DEV-368). DEV-503's hand-off lists the per-profile session but not that it drops this.
  Check: in ~/Development/standards, `node --test --test-name-pattern=STD-130 scripts/automation.test.ts` fails on 0.15.1 (`start merge thread-1` instead of `send merge thread-0`) and passes on 0.15.0 (`/opt/homebrew/Cellar/lotar/0.15.0/bin/lotar`). It fails standards' commit gate, so no standards commit lands (STD-136).
  Done: a `session: continue` job takes the next turn of the ticket's latest session, whatever profile ran it (as in 0.15.0), and that standards test passes.
