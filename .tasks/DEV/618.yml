description: |-
  Source: standards STD-183 (docs/evidence/job-context.md). Owner 2026-11-15: "All six; 1 and 4 only in job sessions" (answered in INBOX-351): unused tools and the claude.ai connectors go off in job sessions only, his own sessions keep them.

  Owner 2026-11-17 (INBOX-445): "We already call npm ci or a different command in all repos. Maybe we just default to run npm in all projects if a package.json exists or recommend a better approach with a different default command to run on triggers." So: the file is written by the T3 project's worktree-create script (the one that runs `npm ci` today), which calls a new `lotar agent worktree setup` first.

  ## Found
  - A Claude T3 job's first call is 50k to 60k tokens. The Artifact tool alone is 12.8k; Artifact, Workflow, ScheduleWakeup and ReportFindings were used in 1 of 735 job sessions; claude.ai connectors in 3.
  - The claude and codex runners already pass a profile's tools.disallowed and env. The t3 runner can't: "T3's CLI has no effort, permissions, MCP servers or interrupt" (docs/help/agent.md).
  - Measured: a Claude settings file with `permissions.deny` takes a bare Opus session's first call from 40.2k to about 20k tokens. `env.ENABLE_CLAUDEAI_MCP_SERVERS` in the file does not turn connectors off; deny rules on `mcp__claude_ai_*` do.
  - T3 Code makes a job's worktree (`t3 thread start --worktree`), runs the project's one `runOnWorktreeCreate` script in it (with `T3CODE_WORKTREE_PATH`; `async: false` holds the agent), also for threads started from the CLI. T3's Claude sessions load `user`, `project` and `local` settings.

  ## Done when
  - [ ] `lotar agent worktree setup`, run in a new T3 worktree, writes `.claude/settings.local.json` there with the job profile's `tools.disallowed` as `permissions.deny` and its `env` as `env`, when a t3 job of that repository that runs provider claudeAgent (or no provider) is starting a new thread on that worktree's branch or commit (lotar records that before `t3 thread start`).
  - [ ] A settings.local.json already there keeps its own keys; the profile's deny entries are added (no duplicates), its env keys win.
  - [ ] The file never lands in a commit: when git doesn't ignore it already, it goes into the repository's `info/exclude`; the worktree's own .gitignore stays unchanged.
  - [ ] The command does nothing and exits 0 outside a job worktree (the owner's own threads, other repos, no git). It exits 0 when writing fails too, and says why; the job's log says whether the file was written, why not, or that the script never ran the command. Profiles without these keys, other providers and continued threads are unchanged.
  - [ ] docs/help/agent.md says which profile keys reach a t3 thread and the script command to set in T3 Code (`lotar agent worktree setup; npm ci`).
