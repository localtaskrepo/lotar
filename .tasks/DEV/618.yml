- date: 2026-11-16T19:14:25.198550+00:00
  author: claude
  text: |-
    Correction from standards (measured by the STD-183 Codex thread, bare `claude -p` on Opus in a repo with `.claude/settings.local.json`):

    - `env: {ENABLE_CLAUDEAI_MCP_SERVERS: "false"}` in a settings file does **not** turn the claude.ai connectors off (20.1k, same as deny alone); only the process environment does (19.1k)
    - Deny rules on the servers work from the file: add `mcp__claude_ai_Google_Drive`, `mcp__claude_ai_Google_Calendar`, `mcp__claude_ai_Claude_Docs`, `mcp__claude_ai_Gmail`, `mcp__claude_ai_Context7`, `mcp__claude_ai_Pyxzl_Staff` to `permissions.deny`: 19.6k to 20.4k, no mcp__ tools left
    - So for t3 threads: connectors off is deny rules (from the profile's `tools.disallowed`), not env. Not checked yet: whether T3's Claude sessions load `settings.local.json` (the SDK's settingSources); check that first
- date: 2026-11-16T19:25:25.687063+00:00
  author: claude
  text: |-
    Blocked: lotar can't write `.claude/settings.local.json` into a t3 job's worktree before its thread starts.

    - T3 Code makes the worktree itself, inside `t3 thread start --worktree <base>`, and starts the agent right after. lotar never sees the worktree before the agent starts.
    - Pre-creating the folder doesn't work: `git worktree add` refuses a non-empty path (`path_already_exists`, DEV-596). The `t3` CLI has no flag for an existing worktree, for Claude settings or for env (`t3 thread start --help`).
    - T3 Code project scripts have `runOnWorktreeCreate` with `async: false` ("hold the agent until the script exits"), found in the T3 Code app's own source. That is the one hook that runs before the agent starts. I haven't checked that it also runs for threads started from the CLI.
    - No code changed. Branch `agent/DEV-618` has no commits beyond main.

    **Question:** which way do you want it?
    1. A T3 Code project script for lotar (`runOnWorktreeCreate`, wait for setup) that runs a new `lotar agent t3-worktree-setup` command. The command writes the file only in a lotar job's worktree and does nothing in your own threads. You add the script once per T3 project, and docs/help/agent.md says how. The file is in place before the agent starts.
    2. No T3 setup: lotar watches for the job's new worktree and writes the file the moment it appears. This races the Claude start, so the first call can miss the savings, and the "written before the thread starts" check in Done when would change to "as soon as the worktree appears".
    3. Wait for a `t3` CLI option that passes Claude settings or env, and leave this ticket until then.
- date: 2026-11-17T19:27:57.681568+00:00
  author: mallox
  text: We already call npm ci or a different command in all repos. Maybe we just default to run npm in all projects if a package.json exists or recommend a better approach with a different default command to run on triggers. Also, onWorktree might not trigger since t3 isn't creating work trees (answered in INBOX-445)
- date: 2026-11-17T19:48:30.271692+00:00
  author: claude
  text: |-
    Done, your way: the existing worktree script (`npm ci`) gets lotar in front of it. No new default command needed.

    - T3 does make the job worktrees: lotar starts job threads with `t3 thread start --worktree <base>`. Your own threads don't get one, because your T3 default is `local`. The doc line "T3 Code threads no longer create worktrees" was wrong, and I fixed it in `docs/help/agent.md`.
    - Your scripts run for CLI-started job threads too: this thread's worktree got `node_modules` 1s after it was created. T3 runs only the **first** script with `runOnWorktreeCreate`, so lotar has to be in that same command: `lotar agent worktree setup; npm ci`. It always exits 0, so `npm ci` runs every time.
    - How it works: before `t3 thread start`, the job leaves a record in `.git/lotar/t3-worktree-setup/`. The command claims it in the new worktree (matched by branch, or by commit when the thread starts from the existing ticket branch) and merges the record into `.claude/settings.local.json`: deny rules added, profile env keys win. If git doesn't ignore the file yet, it is added to `.git/info/exclude`. In your own threads and in other repos the command does nothing.
    - The job log says `Wrote …`, or why not (the settings file is tracked or isn't valid JSON), or that the script doesn't run the command.
    - T3's Claude sessions load `user`, `project` and `local` settings (from T3 Code's bundled Claude adapter).
    - Connectors: list them as `mcp__claude_ai_*` in `tools.disallowed`. `ENABLE_CLAUDEAI_MCP_SERVERS` in the file does nothing (17 Nov comment).
    - Tests: `t3_worktree_setup` unit tests, plus 2 job tests in `dev510_t3_session_test.rs` (a fake t3 makes the worktree and runs the command). I also ran the built binary by hand in throwaway repos.
