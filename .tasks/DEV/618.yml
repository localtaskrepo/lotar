description: |-
  Source: standards STD-183 (docs/evidence/job-context.md). Owner 2026-11-15: "All six; 1 and 4 only in job sessions" (answered in INBOX-351): unused tools and the claude.ai connectors go off in job sessions only, his own sessions keep them.

  ## Found
  - A Claude T3 job's first call is 50k to 60k tokens. The Artifact tool alone is 12.8k; Artifact, Workflow, ScheduleWakeup and ReportFindings were used in 1 of 735 job sessions; claude.ai connectors in 3.
  - The claude and codex runners already pass a profile's tools.disallowed and env. The t3 runner can't: "T3's CLI has no effort, permissions, MCP servers or interrupt" (docs/help/agent.md).
  - Measured: a Claude settings file `{"permissions":{"deny":["Artifact","Workflow","ScheduleWakeup","ReportFindings"]},"env":{"ENABLE_CLAUDEAI_MCP_SERVERS":"false"}}` takes a bare Opus session's first call from 40.2k to 20.9k tokens.

  ## Done when
  - [ ] A t3 job with provider claudeAgent whose profile sets tools.disallowed or env starts its thread in a worktree whose `.claude/settings.local.json` holds them (deny rules and env), written before the thread starts.
  - [ ] A settings.local.json already there keeps its own keys; the profile's deny entries are added, its env keys win.
  - [ ] The file never lands in a commit: not in LoTaR's commit of leftovers at the job's end, not in the agent's (git info/exclude or equivalent); the worktree's own .gitignore stays unchanged.
  - [ ] Profiles without these keys, other providers and threads outside job worktrees are unchanged; writing the file fails: the job logs why and starts the thread without it.
  - [ ] docs/help/agent.md says which profile keys reach a t3 thread.
