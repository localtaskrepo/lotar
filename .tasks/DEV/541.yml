comments:
- date: 2026-11-14T18:33:51.295546+00:00
  author: claude
  text: 'Fixed in 989f8a45 (agent/DEV-541). When a ticket reaches Done, the cleanup (and lotar agent worktree cleanup for Done tickets) now also removes branches and worktrees that main supersedes. A version counts as superseded when main gained a commit since their fork point whose subject starts with the ticket ID, committed after the version''s commit. Before removal the commit is kept as refs/archive/<ticket>/<branch>/<commit> (detached worktrees: refs/archive/<ticket>/detached/<commit>). Still kept: worktrees with uncommitted changes, worktrees a process runs in (its working directory is inside), and work committed after the landing commit. New test agent_safety_test::done_archives_and_removes_versions_main_supersedes covers both the automatic path and the CLI path, and it fails without the fix. The DEV-476 test now dates its ''unlanded'' commit after the landing. docs/help/agent.md is updated. Checks run and passing: npm run lint:agent, npm run test:agent (2171 Rust, 1537 UI), npm run test:smoke:agent (401). Not run yet: the ticket''s own check against the main checkout, which needs a merge first.'
- date: 2026-11-14T18:43:48.021474+00:00
  author: codex
  text: 'Review: blocking. crates/lotar-lib/src/services/agent_job_service.rs:1755 returns Landed before checking process_runs_in. Clean landed worktrees with running processes can be deleted by Done and CLI cleanup, violating the Done criterion. Apply the process guard to both removal outcomes and test busy landed branch and detached worktrees, then cleanup once idle. Read diff, ticket, DEV-476/532, surrounding code and main history. Diff check passed; targeted Rust check blocked before tests by sccache Operation not permitted. Full gates not rerun. No source/status/assignee changes or minor tickets.'
- date: 2026-11-14T18:55:59.696392+00:00
  author: claude
  text: |-
    Rework: review finding fixed, amended as `3b5ebb72`.
    - Finding (`agent_job_service.rs:1755` returned `Landed` before the process check): `check_done_worktree_cleanup` now runs `process_runs_in` for both outcomes, landed and superseded. The removal decision moved to `done_worktree_removal`.
    - Test: `done_archives_and_removes_versions_main_supersedes` adds two busy worktrees whose work landed, one on a branch and one detached. Both stay while a process runs in them and go at the next cleanup once idle. Checked on the previous commit's code: the test fails there (`also when its work landed`).
    - Checks passing: `npm run lint:agent`; `npm run test:agent` (2171 Rust, 1537 UI); `npm run test:smoke:agent` (401).
- date: 2026-11-14T18:58:34.813211+00:00
  author: codex
  text: |-
    Review: passed. No blocking findings in `3b5ebb72`.
    - Process guard covers landed and superseded worktrees; regression covers busy branch/detached worktrees and idle cleanup. Read full diff, ticket/comments, related cleanup context and main history. Diff check passed.
    - Focused Rust regression passed (1/1), using RUSTC_WRAPPER empty; runner exited 1 on leftover xcrun_db. Full gates not independently rerun; fix agent records passes.
    - No files, commits, status or assignee changed. No follow-up tickets. Main cleanup check remains for merge.
