description: 'Found: fix jobs on DEV-858 (job-20261125T140809.214Z-57, job-20261125T170652.971Z-59) failed in 6 to 8 s: ''could not read the T3 Code thread ... with t3 thread show''. Check: ~/.t3/bin/t3 thread show <thread> prints ServerOwnsDatabaseError: another T3 Code process owns /Users/mallox/.t3/userdata and the CLI would change its schema (t3 v0.1.12). Likely the running T3 server and the bundled CLI differ in version after an app update. Done when: t3 thread show on a live job thread prints the thread, and a t3 job on a test ticket gets past start.'
