    Review fixes round (independent review: no implementation blockers; smoke separately blocked, see below):

    1. docs/help/automation.md reference-changes bullet corrected: only change-dependent predicates (changes group, short-form field conditions, custom-field conditions - all require the named field to have changed) stay silent on the empty reference changeset; current-state predicates (sprint conditions, date-window before/within/older_than on due_date) keep normal matching and can fire. Previous "rules with when conditions stay silent" wording was incorrect.
    2. MCP single-task attachment add (src/mcp/server/handlers/tasks.rs): blob-existence check moved INSIDE the store lock (lock first, then resolve_attachment_path), matching the bulk handler and CLI, closing the check-then-attach deletion race. Error envelopes unchanged. New deterministic regression mcp_single_attachment_add_checks_blob_under_the_store_lock (tests/dev60_shared_mutation_test.rs): independently holds the store lock, calls the real MCP tool with a missing blob, asserts the LOCK contention error surfaces (proving acquisition precedes the check; bounded by the standard 2s wait, no sleeps), then after release asserts the fail-closed "Attachment not found" path and that nothing was attached. dev60 suite now 14 tests.

    Caveat documented (not fixed, preexisting, out of scope): REST POST /api/tasks/comment/update emits task_updated even when the new text equals the old one (the service no-ops byte-equal but the route emits). DEV-60 no-op silence claims are scoped to reference/attachment mutations only; no REST/MCP event or API shape was touched for comments.

