- date: 2026-09-16T06:08:38.611002+00:00
  text: |-
    Plan (research verified in current checkout; implementation not started):

    Verified problems: (1) MCP bulk comments (mcp/server/handlers/tasks.rs:962-1065) inline-duplicate the comment write with NO on.commented automation and an improper id fallback (TaskId::parse().ok().unwrap_or_default()); single CLI/REST/MCP all delegate to TaskService::add_comment (fires once, history comment_added, modified bumped, REST emits task_updated). (2) All reference mutations (ReferenceService link/code/platform/file attach+detach, AttachmentService attach/detach_managed_reference) load-clone-edit with no history entry, no automation, no SSE; REST reference routes (8 plus upload/remove) emit nothing; append_automation_comment (automation_service.rs:1332) is a third raw comment duplicate (actor automation, intentionally non-recursive). (3) storage.edit re-reads fresh under the task lock but merges ONLY extra_fields, so caller snapshots can overwrite concurrent comment/reference writes (lost updates); MCP bulk reference gate demands a repo root for kind code||file regardless of direction, so bulk code detach fails outside Git although the single MCP code-remove arm and CLI need no root.

    Design: (A) Storage mutation primitive Storage/StorageOperations::apply_task_mutation(root,id,closure): refuse_cross_root, with_storage_lock(project,task) preserving the DEV-55 pending-journal refusal (NO MultiFileTransaction, no nested locks), parse fresh YAML inside the lock, clone pre-state for the previous DTO, closure mutates and returns changed, serialize ONLY when changed (no-op leaves bytes identical; single now reused for history at + modified). (B) Comments: TaskService::add_comment_with_context(id,text,CommentContext{actor_override,fire_commented}); add_comment = default context (fires on.commented post-commit in-service; no store locks involved); update_comment and append_automation_comment route through the same primitive, automation comment uses actor=automation + fire_commented=false (non-recursion preserved); MCP bulk comment delegates per item to add_comment preserving updated/failed/stop_on_error envelopes, malformed/unknown ids become per-item service errors (no fallback). (C) References: all attach/detach reworked onto the primitive; each changed op records ONE history entry reference_added/reference_removed (old/new kind:value), bumps modified once, preserves every typed guard (managed/file/code membership, store-path rejection, code normalization, platform validation); no-op = no write, no history, no timestamp churn; functions return a receipt (previous DTO, current DTO, changed) and do NOT run hooks in-service because attachment kinds execute under caller store locks. (D) Post-commit dispatch helper runs AutomationService::apply_task_update(storage,Some(prev),cur,config) for CHANGED reference ops only, at call sites AFTER all relevant locks drop: store-guard scope blocks in REST upload/remove, MCP single attachment arm, CLI attachment add/remove, per-item after attachment_bulk_item returns (lock already dropped); REST reference routes additionally emit api_events::emit_task_updated once per changed mutation; MCP/CLI emit no SSE (unchanged; MCP watcher id-only notifications stay a separate preexisting channel - exactly-once claimed for programmatic api_events emission only, no cross-channel dedup claim). (E) Automation decision, evidence-based: trigger vocabulary is created/updated/assigned/commented/sprint_changed/job_* (no reference trigger); ChangeSet::new cannot represent references and unknown condition fields fail closed (automation_matching.rs), so reference changes fire on.updated with an empty field changeset: bare on.updated and legacy start rules fire meaningfully, conditioned rules correctly stay silent. Not-firing (status quo) rejected: ticket description explicitly lists automation among omitted reference behaviors; the pipeline supports this subset with no rule-schema change. Extending condition vocabulary to references is out of scope (schema change; follow-up if wanted). (F) Sync: attach_sync_reference routes through the shared primitive (gains history + no lost updates) with the same post-commit dispatch - consistent with sync creation already firing on.created via TaskService::create (task_service.rs:278); envelope unchanged. (G) Bulk reference gate becomes per-arm: code ADD, file ADD, file REMOVE need a repo root; code REMOVE does not; missing root for a needing arm is a per-item failed entry (stop_on_error respected); response envelope unchanged.

    Files: wave 1 src/storage/operations.rs (+manager wrapper), src/services/task_service.rs, reference_service.rs, attachment_service.rs, automation_service.rs (append_automation_comment only; DEV-59 apply_action untouched). Wave 2 src/routes/tasks.rs, src/mcp/server/handlers/tasks.rs, src/cli/handlers/task/reference.rs + comment.rs (dispatch only), src/services/sync_service.rs. Wave 3 docs/help/task-model.md + docs/developers/task-model.md (reference history vocabulary, event semantics, watcher caveat), docs/help/automation.md (on.updated on reference changes + condition limitation), docs/help/mcp-tools.md (bulk behavior consistency). NO REST DTO/OpenAPI/view changes (contract tests must stay green).

    Tests: new tests/dev60_shared_mutation_test.rs - comment exactly-once single+bulk (on.commented once per task, one comment_added history, actor guards, automation-comment non-recursion); reference no-op byte-equal (file unchanged, no history/modified/event, changed=false); changed reference = one history entry + one modified bump + exactly one task_updated via api_events::subscribe + bare on.updated fires exactly once; concurrent comment+reference on one task lose nothing; per-item failure + stop_on_error envelopes; padded-alias canonicalization; Gitless bulk code detach (fixture outside any repo ancestry) with bulk code ADD failing per-item; dev61 (typed membership, refcount, store-lock contention) and sync suites stay green. Isolated tempdirs, no git init, no cfg gating, no agent processes.

    Checks: targeted nextest (dev60/dev61/dev56/dev59 filters), then full gates npm run lint:agent, npm run test:agent, npm run test:smoke:agent (fresh build). Hazards: store-guard scope restructure in REST upload/remove must preserve cleanup-on-failure semantics; sync tests asserting exact task bytes may need expectation updates (history now recorded); automation during bulk performs N rule loads (accepted, matches per-item service pattern); exactly-once scope excludes the watcher channel (documented).
- date: 2026-09-16T07:37:26.987532+00:00
  text: |-
    Implemented (awaiting independent review; full gates deferred per instruction; status stays InProgress):

    Core: (1) Storage mutation primitive StorageOperations::mutate / Storage::mutate_task (src/storage/operations.rs, src/storage/manager.rs): refuse_cross_root + with_storage_lock (DEV-55 pending-journal refusal preserved, NO MultiFileTransaction, no nested storage.edit), fresh YAML parse INSIDE the project task lock, closure mutates the fresh state (concurrent writes to other fields cannot be lost), serialize+atomic-write only when changed (no-op leaves bytes identical), same serialization/extra_fields behavior as edit. TaskMutationOutcome{before,after,changed} with previous() only when changed. (2) Comments: TaskService CommentContext{actor_override,fire_commented} (Default fires on.commented; ::automation() = actor automation, no recursion); add_comment_with_context + update_comment run through mutate_task (single now reused for history at+modified); AutomationService::append_automation_comment delegates (third raw duplicate removed; DEV-59 apply_action untouched). (3) References: ReferenceMutationOutcome #[must_use]{task,changed,previous:Option} + ReferenceService::commit_reference_change (typed guards preserved per kind; ONE reference_added/reference_removed history entry with kind:value old/new; modified bumped once; no-op = no write/history/timestamp/hooks) + dispatch_post_commit (skips unchanged; apply_task_update(prev,cur) fires updated + legacy start; cfg(test) asserts attachment store locks held == 0). All 8 ReferenceService fns + AttachmentService attach/detach_managed_reference return outcomes.

    Surfaces: REST upload/remove restructured so the store guard drops after the LAST blob operation (failure cleanup stays inside the lock, only-created blobs removed, typed membership gate + refcount/delete preserved) and hooks/events run after; 8 reference routes dispatch + emit exactly one task_updated per changed op (upload attached=false = store-only change, no task event; response shapes unchanged). MCP bulk_comment_add delegates per item to add_comment (envelopes updated/failed/stop_on_error preserved; malformed ids per-item errors, padded aliases canonical in DTOs); bulk reference gate now per-arm (code ADD/file ADD/file REMOVE require repo root per item with "Unable to locate git repository"; code REMOVE works Gitless); bulk + single reference handlers dispatch after per-item/single store locks drop; attachment_bulk_item returns outcome. CLI reference handlers (all kinds) dispatch after scoped store guards. sync attach_sync_reference dispatches with unchanged (TaskDTO,bool) envelope.

    Tests: new tests/dev60_shared_mutation_test.rs (12 tests: bulk on.commented exactly-once per task w/ actor+modified/history, alias+malformed+stop envelopes, automation comment actor/no-recursion, update_comment silent on on.commented + byte-equal no-op, reference history/timestamp/event exactly-once + byte-equal no-op + failure no-hooks, bare on.updated fires once + conditioned rule silent on empty changeset, 6-thread concurrent refs+comments lose nothing, Gitless bulk code remove + per-item root failures, bulk reference envelopes/alias/stop, upload+MCP attachment hooks fire after store-lock release (rule effect observable per firing), upload no-op store-only no-event + membership fail-closed) + tests/common/dev60_lock_order_cases.rs included into reference_service cfg(test) (dispatch refuses under a held store lock via catch_unwind, deterministic counter, runs after drop). fixtures: unique repo-anchored (CARGO_TARGET_TMPDIR) + Gitless (plain tempdir, no .git ancestry), no git init, no cfg gating. dev61 call sites updated to outcome type.

    Docs: docs/help/mcp-tools.md (bulk comment/reference semantics + per-arm repo-root), docs/help/automation.md (reference changes dispatch updated with empty changeset; automation comments never re-dispatch), docs/help/task-model.md + docs/developers/task-model.md (change-log vocabulary reference_added/removed kind:value, no-op byte-equality, event exactly-once + store-only upload semantics, watcher no cross-channel dedup, locked mutator). No REST/OpenAPI/view changes.

    Verification (PATH ~/.cargo/bin): cargo nextest run --cargo-profile ci --retries 0: dev60+dev61+dev59+dev56+dev82+cli_single_field_automation+openapi_contract 68/68; sync/mcp/bulk/comment/reference/upload/attachment/storage_path_safety/retry_safety 164/164; full suite --no-fail-fast 1035 passed / 6 known git-gated skips (one intermittent pre-existing leaky-thread flag, not reproducing, consistent with the known sync/MCP diagnostic); dev60 suite 13/13 after final clippy fix. cargo clippy --all-targets --all-features -D warnings clean; npm run lint:backend:fast clean; cargo fmt --all --check clean.

    Outstanding: independent review, then the full-gates wave (lint:agent, test:agent Rust+UI, test:smoke:agent fresh build). No browser smoke spec added: SSE semantics are pinned by in-process real-route assertions (api_events registry); existing SSE smoke covers the channel. No commits/staging/git used; prior README/82/59 work untouched.
