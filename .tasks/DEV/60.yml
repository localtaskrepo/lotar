- date: 2026-09-16T09:03:46.215852+00:00
  text: |-
    Smoke sole-failure triage + fix (test adaptation, user-authorized; no production change):

    Root cause CONFIRMED as false assertion, not a server/writer bug: smoke ui.reference-kinds test 1 polled raw task YAML .includes("attachment:") for ABSENCE after end-to-end detach. DEV-60 intentionally records the removal as an audit history entry whose old value is "attachment:<stored name>", so the substring legitimately persists in the file forever while typed membership is gone. The prior verification wave misread that substring as a persistent reference. Production exonerated on the parsed artifact: after the UI detach the parsed YAML references list is EMPTY (no attachment entry), exactly ONE reference_removed history entry exists with old "attachment:<storedPath>" and new null, the chip detaches, and the blob is reclaimed from the store.

    Fix (smoke/tests/ui.reference-kinds.smoke.spec.ts only, minimal): (1) test 1 detach now polls typed membership from parsed YAML (parse from the existing yaml dependency, matching cli.relationships/mcp.members helper pattern) - references.some(entry => entry.attachment === storedPath) must become false, references list length 0, plus asserts exactly one reference_removed entry with old "attachment:<storedPath>" / new null (audit trail proven). (2) test 2 file detach had the same latent vulnerable pattern (raw substring absence) and got the same discipline: typed file-membership absence + exactly one reference_removed with old "file:<repoFile>" + preserved repo file unchanged. Positive .toContain assertions elsewhere in the file are not vulnerable to the history false-signal (history old values carry no space after the kind colon; membership lines do) and were left unchanged. Helpers typedReferences/historyChanges/readParsedTask added; removed a duplicate import slip during the edit.

    Environment note (user-authorized, recorded for accuracy): the smoke helper host-matching/port fix was user-authorized and applied in the coordinator wave (not by this agent); with it, smoke runs have zero port errors - 3 new harness tests passed there. Full latest smoke before this fix: 125 passed / 1 failed (this false assertion) / 23 skipped = 149 across 41 files; the two earlier smoke failures are historical/superseded. After the spec fix, targeted real-browser rerun on the current binary (no rebuild): npm run test:smoke:quick -- smoke/tests/ui.reference-kinds.smoke.spec.ts => 4/4 passed in 10.7s with PLAYWRIGHT_BROWSERS_PATH + sandbox chromium args. Full smoke gate rerun deferred to the next wave per instruction.

    Counts for the record: DEV-60 adds 13 integration tests (tests/dev60_shared_mutation_test.rs) + 1 lib test (dev60_lock_order_cases include) = 14; Rust total is now 1036 passed / 6 known git-gated skips (1022 was the pre-DEV-60 baseline from DEV-59). Full final gates from review wave: lint PASS, Rust 1036/6, UI 415. Status stays InProgress pending the full smoke rerun. No git commands, staging, or commits; no core changes (no actual bug found; reported before any change as required).
- date: 2026-09-16T09:10:05.815072+00:00
