    Closing record (final review signoff: production/docs, authorized harness fix, and adapted reference spec confirmed; full final smoke PASS):

    Outcome: Bulk comments and reference/attachment mutations now route through one shared locked mutation pipeline. Storage::mutate_task parses the task fresh INSIDE the project task lock and applies mutations to that state (concurrent writers to comments/references/other fields cannot lose each other), preserving cross-root/canonical refusal and the DEV-55 pending-journal fail-closed behavior with identical serialization and extra_fields handling; unchanged mutations skip the write entirely (byte-identical). Comments: TaskService CommentContext (interactive default fires on.commented post-commit; automation comments record actor=automation and never re-dispatch - DEV-59 apply_action composition untouched); MCP bulk comments delegate per item with updated/failed/stop_on_error envelopes, canonical DTO ids for padded aliases, per-item malformed-id failures. References: all kinds (link/code/file/jira/github/attachment, all surfaces incl. sync) record exactly one reference_added/reference_removed history entry with kind:value old/new per CHANGED op, bump modified once, dispatch on.updated (+legacy start) post-commit with prev/current receipts strictly AFTER every lock drops (attachment store guard scoped after the last blob operation; deterministic held-lock refusal test), and rich REST task_updated events exactly once per changed op; no-op reference ops are fully silent; bulk code detach works outside Git while code ADD and file ops keep the per-item repo-root requirement; typed file/attachment store guards, refcount reclamation, and cleanup-on-failure semantics from DEV-61/56 preserved. The MCP single attachment add blob check moved under the store lock. Raw-YAML smoke assertions fixed to parsed typed membership + exact audit entries. No REST/MCP API shape changes; existing shapes verified unchanged.

    Evidence: 14 new Rust tests (13 in tests/dev60_shared_mutation_test.rs + 1 lib include tests/common/dev60_lock_order_cases.rs) - bulk on.commented exactly-once per task with actor/history/timestamps, alias+malformed+stop envelopes, automation-comment actor and recursion suppression, update_comment silent on on.commented + byte-equal no-op, reference history/timestamp/event exactly-once + byte-equal no-op + failure-no-hooks, bare on.updated fires once with conditioned rules silent (empty changeset; current-state predicates documented as still matching), 6-thread concurrent refs+comments lose nothing, Gitless bulk code remove + per-item root failures, bulk reference envelopes, upload/MCP attachment hooks after store-lock release, upload no-op store-only no-event + membership fail-closed, MCP single attachment lock-before-check ordering (deterministic, held fs2 lock, no sleeps). Final gates: npm run lint:agent PASS; test:agent default concurrency --retries 0: Rust 1036 passed / 6 skipped across 119 binaries (1022 pre-DEV-60 baseline + 14) and UI 415 passed across 60 files (valid unchanged since; only the smoke spec was adapted afterward); freshly built full smoke npm run test:smoke:agent exit 0: 126 passed / 23 skipped = 149 across 41 files (36 pass / 5 skip), ZERO bind errors, 3 new harness tests + 4 adapted reference-kinds browser tests passed. Smoke history disclosed: 121/2 and 109/14 failed runs were environment port collisions with orphaned servers (coordinator-fixed via the user-authorized host-matching probe; not substantiated that all 153 orphans existed - ~103 listeners verified; cleanup was denied and no existing servers stopped); 125/1 was the raw-YAML false assertion (verifier initially misinferred a persistent reference/REST rewriter; corrected to parsed-membership verification - no persistence bug) before the final 126-pass run.

    Remaining (known limits, explicit): 13 whole Rust test files plus parts of 4 more are cfg-excluded (no_git_tests) and 6 ignored - not counted as verified; 23 smoke skips are pre-existing git-gated exclusions. Direct tsc over the smoke tsconfig fails TS5107 (node10) and, with a bundler override, surfaces 21 pre-existing typing errors across 12 files outside the changed files; lint:agent typechecks only view/ via vue-tsc, so no all-TypeScript health is claimed. The smoke host probe retains a close->bind TOCTOU window and prints readiness before binding (context left on DEV-76, comment only). Identical-text comment edits still emit a preexisting REST task_updated; the no-op silence guarantee is references/attachments only. No power-loss durability claims beyond DEV-55. Work uncommitted/unintegrated by policy; no commit reference to append.

    Guidance: No durable guidance correction proven this cycle; none recorded. Other backlog tickets remain untouched/unstarted except the comment-only context note added to DEV-76.
description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: S11 M12 M13.

  Single comment automation exists (DEV-11/27), but MCP bulk comments bypass it. Reference/attachment edits duplicate direct storage mutation and omit history/automation/fine-grained events. Unify these paths with a service mutation primitive and per-item bulk failures. Code-reference removal must not require Git when the equivalent single operation does not. Acceptance: single/bulk CLI/REST/MCP operations emit intended history, timestamps and events exactly once, including on.commented; bulk code detach works outside Git; no unrelated references are lost.

  Related umbrella: DEV-53.
  Prerequisites/coordination: DEV-54.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
