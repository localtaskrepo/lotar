- date: 2026-11-18T02:27:18.765325+00:00
  author: claude
  text: |-
    Review: passed. `7303f1e1b` does what the ticket's "Done" asks, and its test fails on main's code.

    - **Read:** the diff in `agent_job_service.rs` (`branch_keeping`, `kept_note`, `move_ticket_branch`, `follow_ticket_work`), the two new tests in `dev503_harness_jobs_test.rs`, and the 5 most recent commits to both files on `main`. `main`'s newer DEV-685 commit merges cleanly with this one (`git merge-tree`).
    - **Test fails before the fix:** on `main`'s `agent_job_service.rs`, `the_tickets_branch_follows_a_thread_that_rebased_its_commit_and_kept_a_backup` fails with "it has commits that t3/topic-0 lacks". With the fix it passes.
    - **Pitfall:** `cargo nextest -p lotar-lib` doesn't rebuild `target/debug/lotar`, so a stale binary passed both versions. Build the workspace first (`crates/lotar-lib/tests/common/mod.rs` says so).
    - **Reran:** `npm ci`; the `dev503` tests (45 passed); `npm run lint`; `npm run test:agent` (2360 Rust tests, 1548 UI tests). The worktree is unchanged afterwards.
    - **Side effect checked:** a rework thread that resets to main and drops the fix completes on `main` too, because of the existing `started_from` amend rule. So the new rule widens an existing tolerance and isn't a new kind of loss.
    - **Minor, filed:** [DEV-689](https://lotar.pyxzl.net/task/DEV-689). No test covers the `follow_ticket_work` path, and `branch_keeping` accepts any branch, including an older `t3/topic-N` of the same ticket. That weakens the DEV-602 guard.
    - Not rerun: `npm run smoke` (backend-only change).
