description: |-
  Found: LOCA-518 job-20261118T020016.526Z-13 (standards STD-222) failed with 'agent/LOCA-518 stays where it is, not at t3/48a9eb75 of the T3 Code thread: it has commits that t3/48a9eb75 lacks'. agent/LOCA-518 held 1572eaf; the thread rebased it onto main as 1039a25 with a different patch, and kept the old commit as backup/LOCA-518-1572eaf. move_ticket_branch (crates/lotar-agent/src/services/agent_job_service.rs) only lets it through when the branch is at started_from or landed; git cherry then reports 1572eaf as missing although another branch keeps it, so moving would drop nothing. follow_ticket_work has the same gap (it skips when the ticket tip isn't an ancestor of the holder).

  Check: a test in crates/lotar-lib/tests/dev503_harness_jobs_test.rs where agent/TEST-1 holds commit A, the thread's branch holds a rewrite A' on a newer main, and backup/TEST-1-A points at A: the job moves agent/TEST-1 to the thread's branch. Without the backup branch it still refuses.

  Done: the commits git cherry reports as lacking don't block the move when another local branch (git for-each-ref --contains <ticket tip> refs/heads/, ticket branch excluded) keeps the ticket's tip; the job notes which branch keeps them. Same rule in follow_ticket_work. Proposed by claude; LOCA-518's branch was moved by hand meanwhile.
