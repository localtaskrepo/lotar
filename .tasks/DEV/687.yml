comments:
- date: 2026-11-18T02:17:42.835571+00:00
  author: claude
  text: |-
    Fixed: a ticket branch whose tip another local branch keeps now moves to the thread's branch.

    - `move_ticket_branch` (`crates/lotar-agent/src/services/agent_job_service.rs`): when `git cherry` reports commits the thread's branch lacks, `branch_keeping` (`git for-each-ref --contains <tip> refs/heads/`, ticket branch excluded) is checked; if a branch keeps the tip, the move goes ahead and the job note adds "Its commits that <thread> lacks stay on <branch>."
    - `follow_ticket_work`: same rule; it no longer skips when the holder doesn't build on the ticket tip but another branch keeps that tip.
    - Tests in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: with `backup/TEST-1-A` the branch moves and the job names the backup; without the backup it still refuses.
    - Not covered by a test: the `follow_ticket_work` path. Side effect: a ticket tip that an older `t3/topic-N` also contains now counts as kept, so the ticket branch follows a newer holder even when the holder doesn't build on it. Nothing is lost, because the old branch still holds the commits.
