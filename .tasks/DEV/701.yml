comments:
- date: 2026-11-18T05:38:00.171921+00:00
  author: claude
  text: |-
    Fixed: a manual rule that assigns the agent the ticket already has now queues its job.

    - Cause: `apply_action` only queued when the assignee changed (`maybe_queue_agent_on_assignment` returns early when previous == new), while `describe_action` always printed "Queue agent job".
    - Fix in `crates/lotar-agent/src/services/automation_service.rs`: for `manual` events with `set.assignee`, queue even if unchanged (as `tell_agent` already does); event rules keep "only on change" so they don't loop.
    - When the job can't start (active job, prerequisites, `max_iterations`), `lotar automation run` now prints the reason as a `note:` under the action.
    - Failing test first: `manual_rule_queues_a_job_for_the_agent_the_ticket_already_has` in `crates/lotar-lib/tests/agent_automation_integration_test.rs` (failed with no job, passes now).
    - Docs: `docs/help/automation.md` manual-run section.
  report:
    commits:
