description: 'Found 2026-11-17 by the chief of staff: standards INBOX-397 had assignee @triage with no job. lotar automation run "Inbox: triage again" --select id:INBOX-397 (set assignee @triage, agent triage) printed "Set assignee to agent ''triage''" and "Queue agent job for profile ''triage''", yet lotar agent list-jobs showed no job. After lotar task edit INBOX-397 --assignee mallox the same command queued job-20261118T044015.808Z-1 at once. The same rule queued jobs for INBOX-402, 441 and 443, which had other assignees. Check: an automation run whose agent action targets a ticket already assigned to that agent queues a job (or says why not). Done: a failing test first, then the fix; the CLI never prints "Queue agent job" without queueing one.'
