- date: 2026-11-18T05:38:00.171921+00:00
  author: claude
  text: |-
    Fixed: a manual rule that assigns the agent the ticket already has now queues its job.

    - Cause: `apply_action` only queued when the assignee changed (`maybe_queue_agent_on_assignment` returns early when previous == new), while `describe_action` always printed "Queue agent job".
    - Fix in `crates/lotar-agent/src/services/automation_service.rs`: for `manual` events with `set.assignee`, queue even if unchanged (as `tell_agent` already does); event rules keep "only on change" so they don't loop.
    - When the job can't start (active job, prerequisites, `max_iterations`), `lotar automation run` now prints the reason as a `note:` under the action.
    - Failing test first: `manual_rule_queues_a_job_for_the_agent_the_ticket_already_has` in `crates/lotar-lib/tests/agent_automation_integration_test.rs` (failed with no job, passes now).
    - Docs: `docs/help/automation.md` manual-run section.
  report:
    commits:
    - hash: 2e50a083d
      what: manual run starts the job of an agent the ticket already has, prints why when it can't
    checks:
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: passed
    next: Review, then merge
- date: 2026-11-18T06:07:54.785408+00:00
  author: claude
  text: |-
    Review: blocking. The manual path is fixed, but `lotar automation run` still prints "Queue agent job" without queueing one when it replays an `unblocked` rule.

    - Reviewed `2e50a083d` (the only commit in `main..HEAD`; the branch has no newer rework). Main moved since (`c763f96e9`), but no commit there touches the changed files.
    - Reran: `npm ci` ok; `cargo nextest run -p lotar-lib --test integration -E 'test(/agent_automation_integration_test::/)'` 53 passed; the new test fails with the old `automation_service.rs` (no job at `agent_automation_integration_test.rs:3422`) and passes with the fix; `cargo clippy -p lotar-agent --all-targets -D warnings`, `rustfmt --check` and `prettier --check` on the changed files are clean. Full `npm run lint/test/smoke` not rerun.
    - **Blocking: the unblocked path still prints the false line.** `run_unblocked` (`crates/lotar-agent/src/services/automation_service.rs:1036`) builds its output with `describe_action`, which adds "Queue agent job for profile 'X'" whenever `set.assignee` names an agent profile (`:1240-1265`). `apply_action` queues only for `AutomationEvent::Manual` (`reassigns_agent`, `:2332`). An unblocked rule sets the assignee to the agent the ticket already has (blocking keeps the agent as assignee, `docs/help/automation.md:45`), so `maybe_queue_agent_on_assignment` returns at `previous == new` (`:2818`). The run then prints "Queue agent job" with no job and no `note:`, which breaks the ticket's Done ("the CLI never prints 'Queue agent job' without queueing one").
    - Fix: make `describe_action` print the `queue_agent` line only when a job will be queued: manual events, or `current.assignee` differs from the new one. Otherwise print e.g. "assignee unchanged, no job (use tell_agent)", as the docs at `automation.md:480` already describe. Add a test that replays an unblocked rule on a ticket already assigned to the agent and checks the output.
    - Note, not blocking: running the same manual rule twice now starts a second job once the first has ended (the fix agent says so). The docs say to use a cooldown or a condition for that, so it's fine.
- date: 2026-11-18T06:18:20.275395+00:00
  author: claude
  text: |-
    Rework: the unblocked replay no longer prints "Queue agent job" without queueing one.

    - The review read HEAD `2e50a083d`, so I fixed its finding.
    - `describe_action` now gets the event. For any event other than `manual`, when the rule sets the assignee the ticket already has, it prints `no_agent_job` "No agent job: the ticket is already assigned to @x (tell_agent starts it)" instead of `queue_agent`. This covers `run_unblocked` and `lotar automation simulate`.
    - New test, failing first: `unblocked_replay_says_no_job_for_the_agent_the_ticket_already_has` in `crates/lotar-lib/tests/agent_automation_integration_test.rs`. Against the old source it printed `queue_agent`; with the fix it passes and no job starts.
    - Docs: the manual-run line in `docs/help/automation.md` names the new line.
    - Amended into `01c91d247`. Full lint, test (2374 Rust, 1561 UI) and smoke (405) passed.
