- date: 2026-11-11T23:47:44.591104+00:00
  text: 'Fixed in 5aa20dd (pushed to main). scripts/agent-live-check.mjs now sets LOTAR_TRUST_ALL=1 (with LOTAR_AGENT_LOGS_DIR, in a new lotarEnv helper) for every lotar command and for withServer, so its throwaway repos'' agent profiles run without extra env. Chose the env var over ''lotar trust'' because trust records live in ~/.lotar.trust.yml and would pile up one per run (same problem as DEV-328). Check: npm run agents:live -- --runner codex --scenario settings PASS (6s) without LOTAR_TRUST_ALL in the shell; pipeline scenario PASS too (64s, NeedsReview, worktree, comment, 1 agent commit). npm run lint passes. npm test and npm run smoke not run: they don''t cover this manual script. Staged only my hunks; DEV-328''s session committed its change to the same file (a385db8) meanwhile and its pending .tasks/DEV/328.yml edit is left to it.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A80174681-f8fa-4499-9214-f151054077b7
description: 'Found while fixing DEV-328 (2026-11-11): node scripts/agent-live-check.mjs --runner codex --scenario settings fails in 0s with ''agent profiles are not trusted yet ... run lotar trust (or set LOTAR_TRUST_ALL=1 in CI)''; pipeline stays Todo. With LOTAR_TRUST_ALL=1 both pass. Check: npm run agents:live -- --runner codex --scenario settings. Done: the script trusts its own throwaway repos (lotar trust in makeRepo/writeConfig, or LOTAR_TRUST_ALL=1 in lotar()/withServer env) and the scenario passes without extra env.'
