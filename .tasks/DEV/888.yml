      - Before (fix reverted): `DEV-888-before-light-1920.png`, `-1440`, `-390`, `DEV-888-before-dark-1920.png`, `-1440`, `-390`: the button reads Instructions, panel closed after the log arrives.
      - After (`aa504a2ed`): `DEV-888-after-light-1920.png`, `-1440`, `-390`, `DEV-888-after-dark-1920.png`, `-1440`, `-390`: button reads Hide instructions, panel open.
