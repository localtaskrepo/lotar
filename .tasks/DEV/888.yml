  author: claude
  text: |-
    Fixed: an Instructions panel opened while the logs load stays open when the log arrives.

    - `AgentRunInputs` (`v-model:open`) and `AgentJobLog` (`v-model:instructions-open`) now take the open state from the page; `view/pages/AgentJobs.vue` keeps it per job, so the swap keeps the panel open.
    - Same swap in the task panel timeline (`TaskPanelTimelineTab.vue`), fixed the same way.
    - Unit test in `view/__tests__/AgentJobs.spec.ts` (fails without the fix: `expected 'Instructions' to be 'Hide instructions'`); smoke test in `smoke/tests/ui.agent-jobs.smoke.spec.ts` holds `/api/jobs/logs` with `page.route` as the ticket's check says.
    - Screenshots attached: `DEV-888-before.png` (panel gone after the log arrives), `DEV-888-after.png` (panel stays open, button reads Hide instructions).
    - Guidance: no durable finding.
