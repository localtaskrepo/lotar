    next: Review, then merge
- date: 2026-11-26T18:40:39.769644+00:00
  author: claude
  text: |-
    Review: blocking. The fix works, but most of the required screenshots are missing.

    - **Missing screenshots (blocking under ui-review / STD-97):** the ticket has one before and one after image, both light mode at about 1150 px. The rule asks for before and after in light and dark at 1920, 1440 and 390 px. Fix: take both sets with `/api/jobs/logs` held, upload them with `lotar task reference add upload DEV-888 <file>` and link them in the hand-off comment.
    - **Code (`aa504a2ed`):** correct. `view/pages/AgentJobs.vue:285,293` and `TaskPanelTimelineTab.vue:108,120` share one `instructionsOpen[job.id]` between the two buttons. `defineModel` with `default: false` plus `watch(..., { immediate: true })` keeps the panel loading on first open (`AgentJobLog.vue:253-255`, `AgentRunInputs.vue:26-29`). Done when is met.
    - **Test fails before the fix:** with the 4 Vue files reverted in a detached copy, the DEV-888 unit test fails with `expected 'Instructions' to be 'Hide instructions'`.
    - **Reran:** `npm ci` passed. `npm run test:ui:agent -- __tests__/AgentJobs.spec.ts __tests__/AgentRunInputs.spec.ts __tests__/AgentJobLog.spec.ts __tests__/TaskPanel`: 208 passed. `npm run build:smoke`, then `npm run test:smoke:quick:agent -- tests/ui.agent-jobs.smoke.spec.ts -t Instructions`: 2 passed.
    - **My after screenshots:** scratch app from `target/debug/lotar`, logs held with `page.route`. Instructions opened while loading reads "Hide instructions", `aria-expanded=true` after the log arrives, in light and dark at 1920, 1440 and 390 px. No visual problem in the changed area.
    - **Note, not blocking:** the open state now lasts while the page is open. Hide logs, then Show logs, reopens the panel. Before, it always started closed. This seems fine.
    - **Main since `aa504a2ed`:** `589f23c7d` (DEV-880), `eb9b383f7` (DEV-865) and `279d3423c` (DEV-875) touch these files but do not affect the fix. No stray files, no second branch.
    - **Not run:** full `npm run lint`, `npm test`, `npm run smoke` (the merge runs them, DEV-797).
