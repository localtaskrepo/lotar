description: 'Found: in DEV-875, while a job card''s logs load, `view/pages/AgentJobs.vue` shows a standalone `AgentRunInputs` with its own Instructions button; once the logs arrive it unmounts and `AgentJobLog` mounts with its panel closed, so a panel the user opened is gone. Check: delay `/api/jobs/logs` (page.route), click Instructions before the log shows, and the panel should stay open. Done: the open state carries over to the log''s header button (or the placeholder button is not offered while loading).'
