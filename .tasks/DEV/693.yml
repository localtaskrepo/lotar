description: |-
  Owner 2026-11-17 in the cos thread, on lotar and T3 performance, picked "Job history by age" (keep job logs by days, for example 14, instead of the last 500 per repo).

  Measured 2026-11-17: @agent-logs is capped at 500 (MAX_JOB_LOGS), 3.0-3.4 MB per repo; lotar ran 284 jobs on 2026-11-17 (UTC), so the cap keeps about 2 days. Older jobs drop out of `lotar agent list-jobs`, `lotar agent logs` and the timeline while their tickets still link them (comments name job IDs). Related: DEV-211 (keep job logs by default, Done), DEV-560 (timeline showed only the last 200 events).

  Change: keep job records and logs for a configurable age (default 14 days) with a size guard instead of a count; never drop a job of an open ticket or a running one.

  ## Done when

  - [ ] The 500-log count cap (`MAX_JOB_LOGS`) is gone. When a job starts, LoTaR prunes its log folder by age: a job log last written more than `agent.job_history.keep_days` days ago (global config, default 14) is removed.
  - [ ] Size guard: while the folder's job logs are over `agent.job_history.max_mb` MiB (default 100; 0 = no size guard), the oldest removable logs go first, also ones younger than `keep_days`.
  - [ ] Never removed, by age or by size: a job of an open ticket (status not a done state), a job whose ticket file exists but can't be read, and a running job (in this process or in another one's active-job record). These win over both limits: the folder may stay over `max_mb`.
  - [ ] Removable: jobs of Done/WontDo tickets, of tickets that no longer exist, and logs without a header.
  - [ ] Jobs that drop from memory after a day keep showing in `lotar agent list-jobs`, `lotar agent logs` and the timeline as long as their log is kept (they read the logs; unchanged).
  - [ ] A failed prune (unreadable folder or file, failed delete) skips that file and never stops the job from starting.
  - [ ] The setting is documented in `docs/help/agent.md` and `docs/help/config-reference.md`.
  - [ ] A test shows a 15-day-old job of a Done ticket removed and a 15-day-old job of an open ticket kept; another shows the size guard removing the oldest removable log first.
  - [ ] lotar's size per repo at 14 days is estimated in a comment.
