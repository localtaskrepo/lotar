  - DEV-560
comments:
- date: 2026-11-18T03:39:59.528116+00:00
  author: claude
  text: |-
    Job logs are now kept by age (14 days) with a 100 MiB size guard instead of the newest 500.

    - New global setting `agent.job_history` (`keep_days: 14`, `max_mb: 100`, `0` = no size limit), documented in `docs/help/agent.md` and `docs/help/config-reference.md`.
    - Pruning moved from `init_log` to job start (`prune_job_logs` in `agent_job_service.rs`): it never removes a job of an open ticket, of a ticket whose file can't be read, or a running job (this process or another one's active-job record). Those win over both limits. Done, archived and deleted tickets' jobs go, and so do logs without a header.
    - Over `max_mb`, the oldest removable logs go first, also younger ones. A file that can't be read or removed is skipped; the job still starts.
    - Tests: `old_job_logs_go_unless_their_ticket_is_open` (15-day-old Done-ticket job removed, open-ticket job kept), `logs_past_keep_days_go_unless_kept`, `size_guard_removes_the_oldest_removable_logs_first`, `agent_job_history_round_trips`.
    - Size estimate: today's `@agent-logs` holds 501 logs in 2.5 MB over 2.2 days, about 5 KB per job and 230 jobs a day. 14 days is about 3,200 jobs, about 16 MB per repo (about 20 MB at 284 jobs a day), well under the 100 MiB guard.
    - Unchanged: a server keeps finished jobs in memory for a day; `list-jobs`, `logs` and the timeline read older ones from the logs.
  report:
    commits:
    - hash: 76504c10b
      what: prune job logs by age and size, keep open tickets' and running jobs
