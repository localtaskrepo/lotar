- date: 2026-11-16T04:48:26.433447+00:00
  author: claude
  text: |-
    Review: blocking. The pause works and its tests pass, but a paused job hangs `agent run --wait` and drops the agent's own status/assignee hand-back.

    Read: `git log main..HEAD` (`6fc5011a`, merges cleanly onto main `1b6c7857`), its diff, the ticket and the fix agent's comments, DEV-584, `docs/help/agent.md`, AGENTS.md. Reran: 36 tests (`dev604_*`, both new unit tests, `dev503`, `dev279`, `dev522`, queue tests), all pass. Reproduced both bugs with the branch's binary in a scratch workspace.

    **Blocking**
    1. `crates/lotar-lib/src/cli/handlers/agent.rs:970` `job_is_terminal` doesn't count `paused`. `lotar agent run TEST-1 go --agent writer --wait --timeout-seconds 20` with a runner that prints `No space left on device`: the job is `paused` after 0.2 s, but the command waits the full 20 s and says "Timed out". Without a timeout it never returns. Docs line 9 says `--wait` returns once the job ends. Fix: treat `paused` as an end, exit non-zero with "paused", and add a test.
    2. `agent_job_service.rs:4302`: a paused job skips `apply_job_end_rules`, and the agent's recorded outcome is applied there. A runner that ran `lotar status TEST-1 InProgress` and `lotar assignee TEST-1 mallox`, then hit a full disk: the log says "InProgress will be set when job … ends", but the ticket stays `Todo`, unassigned, and no `.outcome.json` or `.pending.json` is left. The commit-only retry then runs `job_completed` rules as if the agent finished, so an agent that handed the ticket back to the owner with a question loses that hand-back. Fix: keep the paused job's outcome and apply it when the retry ends (or apply it at the pause and let the retry skip end rules when the agent handed back). Add a test for each.
    3. UI: `view/composables/useAgentActivity.ts:18-19` (`DONE_EVENTS`, `EVENTS`) and `view/pages/AgentJobs.vue:544` don't know `agent_job_paused`. A ticket whose job paused keeps its "agent running" indicator until a reload, and the Agents page doesn't refresh. Fix: subscribe to the event, end the job on it, and give it a label in `view/utils/agentJobs.ts`.

    **Smaller things for the rework**
    - `agent_job_service.rs:343` calls `admit()`, which uses up the due try, before checking for a free slot. A job that is then queued for lack of a slot is held again in `process_pending_queue`, so that try is lost for an interval. Also, a held job started in `serve` can take the try before the paused job's retry in the worker queue ("the paused job's retry first").
    - `agent_job_service.rs:4490`: the old doc line on `process_pending_queue` is still above the new one.
- date: 2026-11-16T05:56:31.087493+00:00
  author: claude
  text: |-
    Rework done: all three blocking findings and both smaller ones are fixed, amended into `e4edce9b`.

    - **1. `--wait` hang:** `job_is_terminal` (`cli/handlers/agent.rs`) counts `paused`. `agent run --wait` returns when the job pauses and exits non-zero with `ended with status paused`. New test `waiting_for_a_job_ends_when_it_pauses`.
    - **2. Lost hand-back:** at the pause, the job's recorded status/assignee (`peek_outcome`) and the ticket's current values go into the retry's queue entry (`CarriedOutcome`). The retry records them as its own outcome when it starts (`carry_outcome`), so they apply when it ends, like any job's. A field the owner changed during the pause keeps the owner's value, and the log says what was taken over or dropped. Tests: the signing test checks the agent's `InProgress`/`mallox` lands after the retry. The disk test checks the owner's `sam`, set during the pause, survives while the paused job's status still applies. Both tests failed with `carry_outcome` switched off.
    - **3. UI:** `agent_job_paused` is now in `useAgentActivity.ts` (ends the indicator), `AgentJobs.vue` (subscribe + refresh, warning-coloured `paused` chip and card) and `TaskPanelTimelineTab.vue`, with the label `Paused` in `utils/agentJobs.ts`. SSE docs list the event. UI tests: `AgentActivityIndicator.spec.ts`, `agentJobsUtils.spec.ts`.
    - **Smaller ones:** `admit()` is gone. Jobs held in `lotar serve` check the pause read-only (`AgentQueueService::holding`) and never take the scheduled try. Only the worker takes it, from the front of its queue (the paused job's retry), and only when it has a slot. The unit test checks that no slot uses no try. The stale doc line on `process_pending_queue` is removed.
    - Screenshots (Agents page with a paused job): `DEV-604-agents-before-{light,dark}-{1920,1440,390}.png` and `DEV-604-agents-after-…png`, attached to this ticket. Before, the paused chip and log line were unstyled grey; after, they show in the warning colour, with the text label kept.
    - Docs: `docs/help/agent.md` § Paused queue (ticket, `--wait`, who takes the try), `docs/help/sse.md`, `docs/developers/sse.md`.
