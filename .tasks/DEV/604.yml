        - The paused job reads `paused` (job status, log status line, event `agent_job_paused` with the reason); the ticket keeps its status and assignee.
      - [ ] While such a pause is open, lotar starts no new job that would hit it (signing: any job that commits; disk: any job) and tries one job again on a schedule (default 10 minutes); the first success resumes the queue. list-jobs shows the pause and its reason.
        - "Commits": the job runs in an agent worktree (`agent.worktree.enabled`) with a profile that isn't `permissions: read-only`. Read-only jobs still start during a signing pause.
        - The pause is kept in the agent queue's state file, so the server, the queue worker and later processes all see it, also after a restart.
        - Held jobs wait: queue entries stay queued, jobs started in `lotar serve` wait as queued with the reason. The paused job's own retry goes first in the queue.
        - Schedule: one held job (the paused job's retry first) starts every 10 minutes; `LOTAR_AGENT_PAUSE_RETRY_SECONDS` overrides that (tests). That job failing the same way pauses again for another 10 minutes; failing another way runs the usual failure rules and the pause stays.
        - Any job in the pause's scope that completes ends the pause; the held jobs then start as slots allow.
        - `lotar agent list-jobs` (text and `--format json`, key `pause`) and `lotar agent queue` show the reason, since when, the next try and the job that paused it.
      - [ ] A signing failure keeps the worktree as it is: the resumed job first retries the commit (the staged work stays) instead of starting the agent's task again.
        - Paused at LoTaR's end-of-job commit (signing or disk): the worktree is neither cleaned up nor reset; the retry is a commit-only job on the same profile and worktree that runs no agent, commits, then ends like the original (branch follow, merge check, `job_completed` rules).
        - Worktree gone by then: the retry runs the agent's task again.
        - A disk pause still removes the job's build output (`agent.worktree.cleanup_paths`), which frees space.
      - [ ] Tests with a fake signer that fails and a fake disk-full error.
        - A repo whose `gpg.program` is a script that fails, then succeeds: the job pauses, a held job waits, the retry commits the staged work without running the agent, the queue resumes.
        - A runner whose output says `No space left on device`: the job pauses, every job is held.
        - Docs: `docs/help/agent.md`.
