- date: 2026-11-16T19:28:29.529225+00:00
  author: claude
  text: |-
    Review: blocking. The rework fixes all five earlier findings, but in `lotar serve` a pause can hold jobs forever: jobs held there never get the scheduled try.

    Read: `git log main..HEAD` (`e4edce9b`), its diff, the ticket, the fix agent's comments, the first review, `docs/help/agent.md` § Paused queue, AGENTS.md, and the 6 attached before/after screenshots I looked at (1440 light, 390 dark). Reran: nothing finished. `cargo nextest run -p lotar-lib -E 'test(/dev604|a_pause_holds|signing_and_disk|waiting_for_a_job_ends_when_it_pauses|dev279|enqueue_deduplicates/)'` was still compiling after 30 min (load average 130–157, a cold `target/`) and was stopped. The finding below comes from reading the code.

    **Blocking**
    1. **A pause can stay open forever in `lotar serve`.** In server mode, rules start jobs with `start_job_with_tasks_dir` (`automation_service.rs:2735`). During a pause these jobs wait in serve's memory (`agent_job_service.rs:353`, `:4574`). By design they never take the scheduled try (`watch_paused_queue`, `:4609`). Only queue-file entries do, and the pause ends only when a job in its scope completes. So once the worker queue has no entry in scope, nothing can ever end the pause. The worker then exits (`agent_queue_service.rs:502`), and every held serve job waits until someone edits the queue file by hand. There is no command to clear a pause. This happens when:
       - the paused job's retry fails another way: `job_failed` rules run, the pause stays (docs: "the pause stays"), and the rules' next job is held in serve;
       - the retry is dropped before it starts: `start_entry` returns without starting it when prerequisites block it (`agent_queue_service.rs:554`; main adds `queued_stage_allows_start` there too), it uses up its 3 attempts, or it is cancelled.
       - The ticket says one held job starts every 10 minutes. Here held serve jobs never start.
       - Fix: when no queue entry in the pause's scope is waiting, give the due try to a held serve job: take it under the queue lock, as `dequeue_entries` does, so only one process gets it. Or put held serve jobs into the queue file. Add a test: pause, the retry fails another way, a job held in serve still starts after `LOTAR_AGENT_PAUSE_RETRY_SECONDS`.

    **For the merge (not blocking)**
    - The branch no longer applies to main: there are conflicts in `agent_queue_service.rs` (DEV-600's `held_by`, `queued_stage_allows_start` in `start_entry`) and in `agent_job_service.rs`. The rework should rebase onto main and run the checks again.

    **Checked and fine**
    - Earlier findings: `--wait` returns on `paused` (`cli/handlers/agent.rs:970`); the hand-back is carried by `CarriedOutcome`/`carry_outcome` and an owner edit made during the pause wins; the UI handles `agent_job_paused`; `lotar serve` no longer takes the try; the stale doc line is gone.
    - Screenshots: before shows a grey `PAUSED` chip, after shows the warning colour on the chip, the card edge and the log line, with no layout problems at 1440 or 390. I took no screenshots of my own: there is no build in this worktree, and a fresh release build plus the web build would have taken long on a machine that is busy and had just run out of disk space. This is reported as a check that didn't run, not as a passed check.
