- date: 2026-11-16T03:51:54.680927+00:00
  author: claude
  text: |-
    Done: signing and full-disk failures now pause the queue instead of failing jobs. A signing failure at LoTaR's commit is retried as a commit-only job.

    - Detection (`pause_cause_in` in `agent_job_service.rs`): reads LoTaR's failure note, the agent's last message and the last 10 events. If both a disk and a signing line show up, disk wins. The job ends `paused` (`agent_job_paused`): no end rules run, the ticket keeps its status and assignee, and the worktree is not cleaned up.
    - Pause state is kept in the queue file (`agent_queue_service.rs`: `QueuePause`, `admit`, `end_pause`, `pause`). The worker's dequeue and the server's in-memory queue hold jobs in scope: disk holds every job, signing holds worktree jobs that aren't read-only. One held job (the paused job's retry first) starts every 10 min (`LOTAR_AGENT_PAUSE_RETRY_SECONDS`). The first in-scope job that completes ends the pause.
    - Commit retry: the queue entry carries `commit_retry` (worktree path and branch). `run_job` skips the agent and `finalize_job` commits. If the worktree is gone, the agent runs again.
    - `lotar agent list-jobs` and `lotar agent queue` show the pause (`pause` in JSON). Docs: `docs/help/agent.md` § Paused queue.
    - Tests: `dev604_queue_pauses_test.rs` uses a fake `gpg.program` that fails and then signs: the retry commits, the agent ran once, and the held job runs after the pause ends. A fake `No space left on device` runner holds every job. Unit tests cover admission and matching.
    - Not done: no `job_paused` rule event (DEV-584 adds the usage-limit reason and that event). The retry interval is an env var, not a config key.
    - Told DEV-602/603/594 which functions I touch; told DEV-605 how its own merge commit can pause.
