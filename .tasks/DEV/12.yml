  text: 'Backlog review: script/action template expansion is implemented in automation/template.rs and covered by template_expansion_in_run_action. Agent instruction text is still appended without expansion. This combined feature remains Todo; remaining scope is instruction/file interpolation using a defined context and the existing template engine, not a second script-template implementation.'
- date: 2026-09-06T13:12:53.954505+00:00
  text: |-
    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 13: Template variables for agent instructions and script that get filled in at runtime. Should follow env/bash syntax for both inline and file-based instructions. This allows for dynamic instructions that can reference ticket fields, context variables, etc. Should support lists for properties like "references". Bash/env syntax allows to address both simple values and complex structures (e.g., `${{references[*].id}}` to get a list of all reference IDs).
description: |-
  Migrated checklist requirements:
  Scalar action/script expansion already exists, but the original requirement is broader: runtime variables in inline and file-based agent instructions/scripts, ticket and context values, and structured/list selection such as ${{references[*].id}}. Keep Todo. Define the supported env/bash-style grammar and safe escaping/expansion behavior, reuse the existing engine where possible, and add scalar/list plus inline/file regressions. Do not label list or instruction expansion complete based only on scalar script tests.
