description: |-
  ## Found

  On DEV-523 (2026-11-14 to 2026-11-15), the fix agent amended its rework onto the ticket branch `agent/DEV-523` (`53f61bbd`). The next Codex review and merge ran in the earlier Codex thread, whose T3 worktree is `t3-e406fab9-68e0849856ea5fae` on branch `t3/merge-job-stop-keeps-main-1`, still at the older version `81c1488d`. The merge agent found HEAD at `81c1488d` and stopped (comment 2026-11-14T23:59Z). Automation then reported the fix as being on `t3/merge-job-stop-keeps-main-1`, not on the ticket branch. A third superseded copy sits on `t3/merge-job-stop-keeps-main` (`eca8ccb2`).

  DEV-468 made a rework commit on the ticket branch. A thread that continues (`session: continue` on the merge rule in `.tasks/DEV/automation.yml`) keeps its own worktree branch, so it never sees the amended commit.

  On main since the harnessmux runner (DEV-503) it is worse: a continued T3 job runs with the main checkout as its directory and records no worktree, so LoTaR neither commits what it left uncommitted nor moves the ticket branch to its work (DEV-468), and an amended rework (the rework prompt says "Amend the earlier commit") is refused by the ticket-branch move, since `agent/<ID>` then holds the pre-amend commit.

  ## Done when

  - [ ] A T3 job that continues an earlier thread (`session: continue`, any profile: review, merge, rework) first brings that thread's worktree to the ticket branch's current commit:
    - worktree already there: nothing changes;
    - its branch is behind the ticket branch, or still at the commit the ticket branch pointed to when that thread's last job ended (the ticket branch moved on since, e.g. an amended rework): LoTaR moves the thread's branch to the ticket branch's commit and the job log says so;
    - otherwise (worktree gone, uncommitted changes, commits the ticket branch lacks, or older job logs that don't record the worktree): LoTaR touches nothing, the job starts a new thread on the ticket branch instead, and the job log says why.
  - [ ] The ticket branch wins over the thread's branch only in the cases above; work only on the thread's branch is never dropped.
  - [ ] A continued T3 job records its thread's worktree, so leftover work is committed and the ticket branch follows the thread when the job ends, as for a new thread.
  - [ ] A thread that started from the ticket branch's commit and rewrote it (amend) moves the ticket branch when the ticket branch hasn't moved since the job started; a ticket branch that moved meanwhile still refuses, as today.
  - [ ] Regression test: a rework amends the ticket branch, then a continued merge job sees the new commit (and fails without the fix).
  - [ ] `docs/help/agent.md` describes it.
  - [ ] npm run lint, npm test and npm run smoke pass.
