- date: 2026-11-15T01:49:44.291431+00:00
  author: claude
  text: |-
    Fixed in `3aa4daa5` on `agent/DEV-550`: a continued T3 thread now starts from the ticket branch's current commit.

    - Cause on main: since harnessmux (DEV-503), a `session: continue` T3 job ran with the main checkout as its directory and recorded no worktree. So it sent its turn to the thread's own stale branch, skipped the leftover-work commit and never moved `agent/<ID>`. An amended rework was also refused by the ticket-branch move (the pre-amend commit counted as "commits the thread lacks").
    - Before the turn, `continued_thread_worktree` (`agent_job_service.rs`) finds the thread's worktree from the session's last job log. It moves the thread's branch to the ticket branch (`git reset --keep`) when that branch is behind the ticket branch, or still at the commit the ticket branch had when that job ended. Otherwise (worktree gone, uncommitted changes, commits of its own, older logs) it changes nothing: the job starts a new thread on the ticket branch and the log says why.
    - Job status lines now record `worktree_path`, `worktree_branch` and `ticket_commit`. A continued job uses the thread's worktree, so commit and follow work as for a new thread.
    - `move_ticket_branch` accepts a rewrite (amend) when the ticket branch is still at the commit the thread started from.
    - Tests (`tests/dev503_harness_jobs_test.rs`, fake `t3` now handles `thread send`): `a_continued_merge_thread_starts_from_the_rework_that_amended_the_ticket_branch` failed before the fix (ticket branch stayed at the pre-amend fix) and passes now. Also added `a_continued_thread_with_work_of_its_own_leaves_it_and_starts_a_new_thread`.
    - Side fix: `merge_agent_that_hands_back_without_end_rules_does_not_land` was flaky on main too (it read the ticket before the job's outcome was applied). Its helper now waits for `job_settled`, and it passed 8 of 8 runs with retries off.
    - Docs: `docs/help/agent.md` (T3 Code threads).
    - Checks: `npm run lint:agent` passes. `npm run test:agent` passes (2185 Rust, 1537 UI, 50 release, 7 hooks). `npm run test:smoke:agent` passes (402).
    - Told the DEV-509 thread which files this touches; it has a small overlap in `agent_job_service.rs` and `agent.md`.
    - Not covered: jobs whose log came from lotar 0.15.0 (like DEV-523's merge thread) have no recorded worktree, so their continuation starts a new thread on the ticket branch.
