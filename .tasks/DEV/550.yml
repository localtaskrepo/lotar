- date: 2026-11-15T03:02:15.361707+00:00
  author: claude
  text: |-
    Rework: review finding fixed in `27131660` (amended).

    - Finding (a continued job adopts a worktree another thread makes during its turn): fixed. `run_session` in `agent_job_service.rs` takes the worktree snapshot for `record_t3_worktree` only for a new thread. A continued thread keeps the worktree `continued_thread_worktree` checked, so leftover commits and the ticket-branch move stay on it.
    - New test `a_continued_thread_keeps_its_worktree_when_another_appears_during_its_turn` (`tests/dev503_harness_jobs_test.rs`): during a continued fix turn, a worktree `other` appears with an uncommitted file. Before the fix LoTaR committed it on `other` and the test failed. It passes now: `other` and `agent/TEST-1` stay unchanged.
    - `docs/help/agent.md` now says a worktree another thread makes during the turn is not the job's.
    - Checks: `npm run lint:agent` passes. `npm run test:agent` passes (2186 Rust, 1537 UI, 50 release, 7 hooks). `npm run test:smoke:agent` passes (402). The Mac was heavily loaded (load average 77), so smoke ran slowly.
