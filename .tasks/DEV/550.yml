  text: |-
    Rework (owner: fix, INBOX-195): second review finding fixed in `6a66c403` (amended).

    - Finding (a session name outlives its thread, so a continued job could take the worktree of the thread it replaced): fixed. Each job's status line now records its T3 thread id (`agent_session`, from the harnessmux session record). `continued_thread_worktree` in `agent_job_service.rs` takes only the session's latest logged job, and only when that job ended in the thread being continued. Otherwise, including a latest log without that data, it fails closed: a new thread on the ticket branch, the log says why, and no other branch is touched.
    - New test `a_continued_thread_never_takes_the_worktree_of_the_thread_it_replaced` (`tests/dev503_harness_jobs_test.rs`): a `--session new` job replaces the thread, its log is rewritten as an older lotar would have written it, then a continued job runs. Before the fix LoTaR moved the replaced thread's branch `t3/topic-0` and the test failed. Now that branch is unchanged, a new thread starts from the replacement's work, and the ticket branch follows it.
    - Earlier findings stay fixed; their tests pass.
    - `docs/help/agent.md` updated.
    - Checks: `npm run lint:agent` passes. `npm run test:agent` passes (2187 Rust, 1537 UI, 50 release, 7 hooks). `npm run test:smoke:agent` passes (402).
