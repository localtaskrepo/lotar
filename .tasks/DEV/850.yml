description: |-
  Ravi asked on 2026-11-24 to use the LoTaR ticket timeline to review the full chain of work across T3 and headless harnessmux jobs. Keep ticket files small by storing references to transcripts and showing the original text in the UI when someone opens a job. Figure out what that should feel like on a phone and what the links can reliably resolve.

  ## What to investigate

  - Use the existing timeline and job log reader as the starting point. Sketch how fix, review, rework and merge attempts would show their outcome, checks, review findings and commit or diff. Show how someone expands a phase to read the conversation and opens the source in T3 when available.
  - Compare extending existing job and session references with adding a typed transcript reference. Check what identity is already recorded for T3, harnessmux events, Claude Code and OpenAI Codex. Determine whether source kind and format version are enough to choose a reader, and how to identify the exact job or turn when one session serves several attempts. Verify on real retained examples.
  - Compare loading on expand with limited prefetch for visible details. Evaluate reuse of the authenticated job log endpoint and a bounded, paged reader for other sources. Show loading, expired, offline and unsupported-format states. Keep the timeline useful if the source is unavailable and keep raw transcript data in its existing store.
  - Check existing retention and access rules. Recommend which compact phase details should remain after logs expire, how mobile reaches a transcript on the machine that owns it, and how the reader limits transcript resolution to known sources. Treat Open in T3 as a link to an existing thread. Evaluate selective import separately as a way to continue a finished headless session.

  ## Done when

  - [x] Record a recommendation, with source links and a mobile-sized sketch of a ticket with T3 and headless jobs. Show a collapsed phase, an expanded conversation and a missing transcript.
  - [x] Exercise the existing read paths on one T3 job and retained Claude Code and Codex headless examples, or record exactly which source could not be verified. Include a reused session and explain how the view gets the right turn.
  - [x] Recommend the smallest implementation slice and identify any open choice for Ravi. This ticket is for research and design. Implementation gets its own ticket once the approach is agreed.

  Start with the ticket timeline in `view/components/task-panel/TaskPanelTimelineTab.vue`, job logs in `view/pages/AgentJobs.vue`, and `lotar task timeline <ID> --threads`. DEV-849 covers reciprocal links and live T3 state.
