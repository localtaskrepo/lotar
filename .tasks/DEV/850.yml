- date: 2026-11-25T08:07:50.438443+00:00
  author: claude
  text: |-
    Review: blocking. One claim contradicts the source it rests on.

    - Read: `main..HEAD` is one commit, `ed765c1a0`. It changes only `docs/research/inline-transcript-review.md`. I read all 193 lines and opened the harnessmux README and the Claude settings reference.
    - Passed: the commit touches no other file. Facts carry links. It ends with one recommendation, its cost and one open choice. Claude's 30-day default (`cleanupPeriodDays`), the `v:1` events table, the 16 KB output cap, `session/resume` and `session/load`, and `Session::send` returning the turn all match the sources.
    - **Blocking, lines 70–71 and 126–127:** the write-up says a T3 session's harnessmux log has "no tool calls" and "the full detail stays in T3", so T3 jobs show only replies. The [harnessmux README](https://github.com/localtaskrepo/harnessmux#sessions) (section on t3, "While a t3 turn runs…") says the opposite. harnessmux reads the thread's activity every 2 seconds and sends each command, file change and tool as `tool.started` and `tool.finished` (with `output`), plus `thought.delta` and `plan`. The README names T3 Code 0.1.11 for this (line 132 of the README). The log checked, `lotar-95e687-DEV-849-fix.events.jsonl`, may predate that or come from the installed 0.1.10 CLI (line 52 of the write-up). The write-up needs to check that a log written by lotar's 0.3.0 library holds T3 tool events. Then it needs to fix the T3 bullets, the mobile sketch's T3 phase and slice item 3 to match.
    - Not blocking: the Codex row (line 48) rests on a discussion and an issue, not official docs. The write-up says so itself.

    Next step: the research agent re-checks a T3 log from lotar 0.3.0 and corrects those lines.
