- date: 2026-11-24T21:24:56.947275+00:00
  author: claude
  text: |-
    Recommendation: read the harnessmux `v:1` event log through a paged reader by job id, loaded on expand, with a typed transcript reference in the job log.

    - Write-up: `docs/research/inline-transcript-review.md` (commit `ed765c1a0`)
    - Today the job log names its session only in free text. Session names are reused after handoffs (DEV-791), and turns carry no job id, so the right turn of a reused session can only be found by time window (checked on ASP-18 review/merge, session `autospec-c2ad4b-ASP-18-review`, turns 1 and 2)
    - harnessmux events are documented and the same for Claude, Codex and T3 ([README](https://github.com/localtaskrepo/harnessmux#events), v0.3.0). Native Claude and Codex files are internal, and Claude deletes them after 30 days ([settings](https://code.claude.com/docs/en/settings-reference)), so lotar shouldn't parse them
    - `Session::send` returns the turn, so lotar can record `{session, agent_session, turn, format, link}` when it sends
    - New `GET /api/jobs/transcript?id=&after=&limit=`: job id only, never a path, reading only the harnessmux sessions dir. `/api/jobs/logs` stays light
    - T3 jobs show the replies from the harnessmux log plus Open in T3 (the recorded thread link)
    - States: loading, expired (summary, commits and checks stay), offline/other machine, unsupported `v`
    - Not checked: Codex session reuse (no multi-turn Codex session exists); the T3 thread where this was asked was not found
    - Cost: one ticket, about 3 agent runs (Rust reader and API, UI section, smoke test); no money; low upkeep (one documented format)
    - harnessmux keeps sessions forever (188 MB after 9 days here): a harnessmux topic, not filed
