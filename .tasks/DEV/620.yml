- date: 2026-11-16T22:35:55.151774+00:00
  author: claude
  text: |-
    Measured: job prompts on DEV-563 (churned: 20 comments, 18 stored entries) are about two thirds shorter.

    | Job | Before | After |
    |---|---|---|
    | fix | 50.1k | 15.6k |
    | review | 42.1k | 14.0k |
    | merge | 47.1k | 16.2k |

    - Characters, ticket part + instructions and "This job" notes. Ticket part rebuilt with the real `build_prompt` from DEV-563's comments, history and `.context` as each job's prompt saw them (last fix, review and merge in the context): fix 44.9k → 12.2k, review 36.8k → 10.5k, merge 41.8k → 12.7k
    - Instructions + notes for a T3 fix job: 5,230 → 3,475 (66%); instructions alone 3,935 → 2,421
    - Recent context default 2 entries: stored prompts are median 2.5k (the rule's boilerplate, p90 3.3k), replies median 1.0k (p90 2.3k), across 276 `.context` files; the comments now carry the older rounds
    - The picks on DEV-563: open question (automation's retry question), newest fix report, newest review
