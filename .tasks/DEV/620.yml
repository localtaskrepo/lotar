description: |-
  Source: standards STD-183 (docs/evidence/job-context.md). Owner 2026-11-15: "All six" (answered in INBOX-351), proposals 3 and 5.

  ## Found
  - Job prompts: fix mean 12k characters, review 19k, merge 34k (max 45k). The ticket context with its whole comment history and the last 20 prompts and replies is most of it: merge 26k characters on average. On Claude a merge job's prompt is 14.8k tokens, written fresh to the cache and re-read on every call.
  - The built-in agent instructions are 5.2k characters (about 1.8k tokens) in every job.
  - 2026-11-16 (claude): today's prompt carries no comments; the history is the "Recent context": up to 20 stored prompts (median 2.5k, the rule's boilerplate) and replies (median 1.0k), uncut. The 5.2k are the built-in instructions (3.9k) plus the "This job" notes (1.3k).

  ## Done when
  - [ ] The prompt has a "Comments" section: the open question (the newest comment before the ticket was last assigned to a person, not written by that person, or the newest with a `question`), the answer to it when there is one (labelled "Question" then), the newest fix comment and the newest review comment, oldest first, each cut at 1,500 characters with " …", plus the comment count and `lotar show <ID>` / `lotar task timeline <ID>` for the rest. Phase of a comment = the profile last assigned when it was written (an agent working on after a hand-back continues that phase): `@review…` review (or a comment with `review`), `@merge…` neither, other `@…` fix; automation's comments are not fix or review comments. The answer is the first later comment with an `answer` or by the person the question's phase handed the ticket to. Older comments are left out. No comments on the ticket: no section.
  - [ ] Recent context carries the newest `context_entries` (profile setting, default 2: the previous job's prompt and reply) of the stored entries, each cut at 1,500 characters; `0` leaves the section out. Stored entries stay 20.
  - [ ] Profile `full_history: true` gives the old prompt: all stored entries uncut, no Comments section; it wins over `context_entries`.
  - [ ] Built-in instructions plus "This job" notes are at most two thirds of before (≤ 3.47k of 5.2k characters, expanded for a T3 fix job), saying the same; the tests that pin their phrases pass.
  - [ ] Measured before and after on a fix, review and merge prompt of the same ticket; numbers in the ticket.
  - [ ] docs/help/agent.md and config-reference.md describe the sections and both settings.
