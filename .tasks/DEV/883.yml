- date: 2026-11-26T02:11:58.070807+00:00
  author: claude
  text: |-
    Fixed: `config validate` fails on a bad home config and names the key; every load warns that the home config is ignored.

    - Cause: one bad value fails the whole `~/.lotar` parse, and every load skips the home layer silently (`if let Ok(...)`); validate never looked at the home config
    - `crates/lotar-core/src/config/normalization.rs`: the parse error names the key path, found by dropping one key at a time: `Invalid type for config field 'agents.bad.stall_timeout_seconds'` (key names only, values may be credentials)
    - `crates/lotar-core/src/config/persistence.rs`: `load_home_config` warns once per run on stderr: `Home config … is ignored: … Run lotar config validate.`
    - `crates/lotar-lib/src/cli/handlers/config/validate.rs`: `Invalid home config (~/.lotar): …`, exit 1
    - Ticket check with the new build: validate fails with exit 1 and names `agents.bad.stall_timeout_seconds`; `config show` prints the warning
    - Tests: `names_the_agent_profile_and_key` (unit), `test_config_validate_fails_on_unparsable_home_agent_profile` (CLI); doc in `docs/help/config.md`
    - Guidance: no durable finding
