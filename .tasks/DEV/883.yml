- date: 2026-11-26T07:06:20.559482+00:00
  author: claude
  text: |-
    Review: passed. `73ef3fa65` does what the ticket asks; one minor follow-up filed.

    - Read: ticket, fix comment, diff (5 files), AGENTS.md. Main's newer commits don't touch these files. repos.json has no install step for lotar
    - Done when: `config validate` exits 1 and names `agents.bad.stall_timeout_seconds` without the value. `config show` warns on stderr that the home config is ignored and keeps stdout valid JSON. The ticket offered "fails loudly" as an option, so this is within scope
    - Error-path walk (`normalization.rs:274`) only runs when parsing fails. It falls back to the old generic message when more than one key is bad. Values stay out of messages
    - Validate's home check respects `home_config_honored()` (inside `load_home_config`), so tests stay hermetic
    - Tests: the unit test and the CLI test pass. Before the fix, validate never read `~/.lotar`, so the CLI test could not pass on main
    - No UI change, no stray files, a single branch
    - Minor, filed as [DEV-893](https://lotar.pyxzl.net/task/DEV-893): validate still prints `✅ Global configuration is valid` right after the home config error (`validate.rs:43-61`)
