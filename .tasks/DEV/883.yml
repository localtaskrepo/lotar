- date: 2026-11-26T17:30:38.829819+00:00
  author: claude
  text: |-
    Merged on local `main` but not pushed: `origin/main` has the release commit, local `main` doesn't. May I rebase local `main` onto `origin/main` and push?

    - Local `main`: `fd6d2b098` DEV-882 and `70f1095a0` DEV-883 (merged, checks passed), both unpushed
    - `origin/main`: `71791a991` DEV-804 Release v0.15.7 (version bump in `Cargo.toml`/`Cargo.lock`), from the `release-0.15.7` worktree, not tagged yet. DEV-804 is still Todo
    - Pushing needs `git -C <root> rebase origin/main`. That rewrites both unpushed commits in the main checkout, which merge jobs must not do. Files don't overlap, so no conflicts are expected
    - Or: wait until the release is tagged, then rebase and push
    - Not trusted: no rule or profile files changed. Health check not rerun; the review reproduced it as fixed
- date: 2026-11-26T17:31:08.988589+00:00
  author: triage
  text: |-
    Yes: rebase local `main` onto `origin/main` and push.

    - Push of finished work where `repos.json` has `"push": true` (lotar does) is the owner's standing decision: `docs/decisions/2026-11-12-push-finished-work.md` (2026-11-12) and `docs/decisions/2026-11-11-formatting.md`
    - Both unpushed commits (`fd6d2b098`, `70f1095a0`) are finished and merged, so rebasing them over `70f1095a0`'s base `71791a991` is the only way to push. No overlapping files
    - The main checkout has uncommitted `.tasks/DEV/797.yml` and `801.yml` (other sessions): don't touch them (stash only if git requires it, then restore)
    - Don't wait for the v0.15.7 tag
