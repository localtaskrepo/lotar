- date: 2026-11-12T23:18:33.606596+00:00
  author: claude
  text: 'Done on branch agent/DEV-389. New GET /api/relationships/cross-repo?refs=repo:ID,... returns each reference resolved now (reference, title, status, done, url, or unresolved with the reason); in src/api_types.rs (CrossRepoTaskDTO), view/api/types.ts (CrossRepoTask), docs/openapi.json, docs/help/api-quick-reference.md. I used a separate request instead of the task DTO so task lists don''t read other repos. Task panel Relationships tab: a repo:ID chip shows the status (or ''unresolved'', reason on hover) and opens the other repo''s link in a new tab; typing repo:ID adds it as written (no local suggestions take over); typing or dragging one into a category other than Depends on/Related is refused in the UI. Docs: docs/help/task.md (Tasks in another repo). Tests: Rust REST test in tests/dev386_cross_repo_relationships_test.rs, Vitest cases in TaskRelationships.spec.ts, Playwright smoke smoke/tests/ui.cross-repo-relationships.smoke.spec.ts. npm run lint, npm test (2107 Rust, 1505 UI) and npm run smoke (385) pass. Limit: the other repo sends no events, so its status refreshes when the tab opens or the chips change.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Add47aab2-5009-4849-a754-cffb5eb15e59
description: |-
  DEV-386 lets depends_on and related name a task in another repo's LoTaR (repo name, a colon, the ID; see docs/help/task.md, Tasks in another repo). The CLI shows them with status, title and link; the web task panel still lists them like local IDs, so a chip links to a task that does not exist here.

  ## Plan
  - REST: the task DTO (or the relationships tab's request) carries the resolved cross-repo tasks from `services::external_tasks::resolve`: title, status, done, url, or why unresolved. Keep src/api_types.rs, view/api/types.ts, docs/openapi.json and the help docs in agreement.
  - Task panel: such chips open the other repo's link in a new tab and show status (or unresolved); adding one by typing the reference works; dragging is limited to Depends on and Related.
  - Playwright smoke test.

  ## Done when
  - [ ] A cross-repo dependency shows its status and opens its link from the task panel, with a smoke test
  - [ ] Documented

  Blocked until DEV-386 is merged.
