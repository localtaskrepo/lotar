comments:
- date: 2026-11-27T04:17:13.015891+00:00
  author: claude
  text: |-
    Fixed: a build no longer reuses another checkout's `LOTAR_DOCS_DIR` / `LOTAR_WEB_EMBED_DIR`.

    - Cause: cargo hashes path packages the same in every checkout, and `rerun-if-changed=../../docs/...` is relative, so a copy's build-script output stays fresh in the other checkout's `target/`.
    - `rerun-if-env-changed=CARGO_MANIFEST_DIR` doesn't help: cargo checks its own env, where that var isn't set (tried in a scratch workspace).
    - Fix: new `.cargo/config.toml` sets `LOTAR_CHECKOUT_DIR = { value = "", relative = true }` (the checkout root). `crates/lotar-agent/build.rs`, `crates/lotar-lib/build.rs` and `crates/lotar-web-assets/build.rs` emit `rerun-if-env-changed=LOTAR_CHECKOUT_DIR`. A packaged crate has no config, so the var stays unset there.
    - Test: `crates/lotar-lib/tests/build_script_checkout_test.rs` checks the config and the three scripts, and that `REPO_ROOT` and `LOTAR_DOCS_DIR` point at this checkout.
    - Repro with the real crates: a copy of the repo built into this `target/` and was then deleted. Without the fix, `cargo check -p lotar-agent` failed with `couldn't read …/copy/crates/lotar-agent/../../docs/help/agent-instructions.md`. With the fix it built clean.
    - The ticket's `grep -rl review-scratch target/debug/build/*/*/run/stdout` found nothing in this worktree.
    - 47 lines changed, so no `small-diff` tag.
  report:
    commits:
    - hash: 2ec689b70
      what: build scripts rerun when the checkout changes
    checks:
