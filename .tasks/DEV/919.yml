- date: 2026-11-27T09:51:52.329209+00:00
  author: claude
  text: |-
    Review: passed. `2ec689b70` stops a build from reusing another checkout's `LOTAR_DOCS_DIR` / `LOTAR_WEB_EMBED_DIR`; one minor gap filed as DEV-927.

    - Read: the ticket, the fix comment, the diff (`.cargo/config.toml`, the three `build.rs` files, `crates/lotar-lib/tests/build_script_checkout_test.rs`), recent main commits to the build scripts (`bafbec164`, `385b207d0`), and the packaging `include` lists. The packaged crates ship no `.cargo/` and no tests, so publishing is unaffected.
    - Fix works (cargo 1.100), tried in my own scratch workspace: two copies share a `--target-dir`. Without the config the second build printed the first copy's path. With `LOTAR_CHECKOUT_DIR = { value = "", relative = true }` plus `rerun-if-env-changed`, each printed its own.
    - Reran: `cargo nextest run -p lotar-lib --test integration build_script_checkout`: 3 passed. `rustfmt --edition 2024 --check` on the 4 changed `.rs` files: ok. `cargo clippy -p lotar-lib -p lotar-agent -p lotar-web-assets --tests`: clean. The ticket's `grep -rl review-scratch target/debug/build/*/*/run/stdout`: nothing found. `npm ci`: ok.
    - Test: `the_built_library_points_at_this_checkout` fails in the stale case. The other two only check that the source text is there. That is enough for a guard like this.
    - Minor gap, filed as [DEV-927](https://lotar.pyxzl.net/task/DEV-927): cargo reads `.cargo/config.toml` from the current directory. So `cargo build --manifest-path <copy>/Cargo.toml` run from checkout A still leaves A with the copy's paths (reproduced). Building from inside the copy, the case in this ticket, is fixed.
    - No stray files, nothing for the owner to decide, no UI.
