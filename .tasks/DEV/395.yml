description: |-
  Three small gaps in version support that make version fields harder to use than they need to be. Found by claude in an audit of version support, 2026-11-12.

  ## Gaps

  - **Filter suggestions**: the web search box's value suggestions skip tickets whose field holds a list (`view/composables/useFilterOptions.ts` takes only strings, numbers and booleans) and sort values alphabetically (`localeCompare`). For a version field: take each item of a list, and sort in version order.
  - **MCP field hints** list custom field names without their types (`src/mcp/server/hints.rs`), so an agent learns that `affects` holds versions only when a write is refused. Add the type where the hints name the fields.
  - **Version input** in the task panel (`view/components/task-panel/TaskPanelCustomFieldsSection.vue`) checks a value but suggests none, so `0.15` and `0.15.0` drift apart. Suggest versions already used in that field.

  ## Done when

  - [ ] Each gap is fixed with a test (unit or smoke for the UI ones, an MCP test for the hints).
