- date: 2026-11-03T22:25:36.460093+00:00
  text: |-
    Outcome: fixed. CustomFields (both feature variants) and the persisted config maps (branch type/status/priority aliases, agents, remotes, auth_profiles, sync mapping values, agent profile env, resolved agent_profiles) are BTreeMaps, so task and config files list keys in sorted order on every write. Existing files are reordered once on their next write, then stay stable. JSON/schema output is unaffected apart from sorted keys.
    Evidence: tests/dev266_stable_key_order_test.rs (six custom fields stay sorted across four edits; branch.type_aliases stays sorted across four config set runs); full Rust suite 1896/1896; clippy --all-features clean.
description: |-
  Found by the DEV-253 product review and confirmed by an independent check that re-read the code and reproduced it where feasible.

  Findings:

  1. [medium] `custom_fields` and config maps are serialized from a HashMap, so key order changes on every write and causes git noise and merge conflicts (review ref storage-core#2)
     Where: src/types.rs:451, src/storage/task.rs:67, src/config/types.rs:504, src/config/types.rs:532, src/config/types.rs:541
     Evidence: `pub type CustomFields = HashMap<String, serde_yaml_ng::Value>` serializes in RandomState iteration order, which differs per process. Repro: `lotar add CF --field=alpha=1 ... --field=zeta=6`, then `lotar edit 2 --title "CF $i"` five times. The order of `custom_fields:` changed on every write: `gamma epsilon zeta alpha beta delta` / `zeta beta gamma delta epsilon alpha` / ... Config writes behave the same way: four `lotar config set default_priority ... --project ALPH` runs reordered `branch.type_aliases` each time (`fix spike epic feat chore` → `chore fix feat spike epic` → ...). The same applies to `agents`, `remotes`, `auth_profiles` and the status/priority aliases.
     Impact: For a git-native tracker, any unrelated edit (title, status, comment) rewrites the whole custom_fields block in a new order. Diffs get noisy, history becomes hard to read, and two people editing different fields of one task on separate branches get spurious merge conflicts. Config files churn the same way.
     Suggested fix: Use `BTreeMap` (sorted) or `IndexMap` with insertion order preserved from parse for `CustomFields` and the persisted config maps. JSON and schema output are unaffected by the order.

  Acceptance: each finding above is fixed (with a regression test where behavior changes) or explicitly declined with a reason recorded here.
