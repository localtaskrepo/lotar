- date: 2026-11-27T12:15:30.354282+00:00
  author: claude
  text: |-
    Fixed: a kept copy of a shorter, prefix-named session no longer counts as the job's.

    - Rebased `agent/DEV-918` onto main (DEV-909 `1ee3ef1f4` is in).
    - `candidates()` in `crates/lotar-agent/src/services/agent_job_service/transcript.rs` takes a kept `<base>.<stamp>` only when `base == name`, or `base` is exactly `KEPT_BASE_CHARS` (47) and the name starts with it.
    - `KEPT_BASE_CHARS` is a new const in `crates/lotar-agent/src/services/agent_runner.rs`; `keep_session` cuts with it, so the two can't drift.
    - New tests: `a_kept_copy_of_a_prefix_named_session_is_not_the_jobs` (`lotar-x-DEV-1-fix` copy vs session `lotar-x-DEV-1-fix-ui`: expired; failed on the old check) and `a_kept_copy_of_a_long_name_answers_with_its_cut_base`.
