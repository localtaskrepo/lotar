- date: 2026-11-20T23:07:05.819282+00:00
  author: claude
  text: |-
    Both review findings fixed: the DEV-273 rule now has a test that fails with the bug put back, every time.

    - **Bug 1 (ready read in 500 ms):** `sse_delivers_during_a_steady_stream_of_events` now waits for `ready` with `read_sse_until(..., WATCH_EVENT_DEADLINE, ...)` and asserts it, then waits for a `task_updated`, not just any event.
    - **Bug 2 (the socket test can't catch the bug under load):** agreed, load can always stretch a gap past the 20 ms test debounce. Took the reviewer's second option: the rule moved into `flush_deadline()` in `crates/lotar-lib/src/web_server.rs`, which the SSE loop calls. The new unit test `later_events_do_not_push_the_sse_flush_back` feeds it events 15 ms apart with a 20 ms debounce.
    - With the bug put back (`now + debounce` on every event), the unit test failed; with the fix it passes. Source restored after.
    - The socket test now only checks that the stream reaches the client while it runs: the emitter keeps sending until the client gets an event (cap 30 s, longer than the client's 15 s wait). No fixed wall-clock deadline left, as Done asks.
    - Amended `6a6ca2ddc` → `4141311d2` (signed).
  report:
    commits:
    - hash: 4141311d2
      what: deadline rule unit-tested; socket test waits for ready and checks wiring only
    checks:
