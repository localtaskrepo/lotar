- date: 2026-11-20T21:36:18.504677+00:00
  author: claude
  text: |-
    Test no longer has a 1.5 s deadline, and now actually catches the DEV-273 bug.

    - `crates/lotar-lib/tests/web_api_integration_test.rs`: waits up to `WATCH_EVENT_DEADLINE` (15 s) for the first event, then asserts the emitter had not finished yet (an `AtomicBool` set after the last emit). So a slow machine can't fail it, but delivery only after the stream stops still fails.
    - Also found: test servers run with `LOTAR_TEST_FAST_IO=1`, which caps the debounce at 20 ms (`web_server.rs:799`). The old 50 ms gap between events was longer than that, so the test passed even with the moving-deadline bug put back. Events now come every 5 ms (300 of them, ~1.5 s+).
    - Checked: with the bug put back (`if buffer.is_empty()` → `if true` in `web_server.rs:855`) the test fails; with the fix it passes.
    - Worktree had no `node_modules`; ran `npm ci` first.
  report:
    commits:
    - hash: 6a6ca2ddc
      what: steady-stream SSE test waits for the first event and checks the stream was still running
