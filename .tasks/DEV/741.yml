- date: 2026-11-20T22:21:06.354186+00:00
  author: claude
  text: |-
    Review: blocking. The test passes with the DEV-273 bug put back, so it still checks nothing.

    - Read: commit `6a6ca2ddc` (only `crates/lotar-lib/tests/web_api_integration_test.rs`), the ticket, DEV-273, the SSE loop in `crates/lotar-lib/src/web_server.rs:740-880`, recent commits to both files on main.
    - The 1.5 s deadline is gone, as Done asks. Under load the test can't flake now, but it doesn't check what it should.
    - **Bug 1, `web_api_integration_test.rs:1432`:** the `ready` event is still read with a 500 ms budget. The server waits up to 5 s for the watcher before sending `ready` (`web_server.rs:758`). Here `ready` came after 712 ms, so `first` at `:1449` was `[("ready", "{}")]` and the test passed. This is probably also why it failed before: with the stream already over 1.5 s, it saw nothing.
      - Fix: wait for `ready` with `read_sse_until(..., WATCH_EVENT_DEADLINE, leftover, |e| e.iter().any(|(k, _)| k == "ready"))`, as the tests at `:1477` and `:1528` do. Then assert that `first` is a `task_updated`.
    - **Bug 2, `:1442-1445`:** even with bug 1 fixed in a scratch copy, the bug put back (`if buffer.is_empty()` → `if true`, `web_server.rs:855`) passed 4 of 4 runs at load ~15-26. Events still came while the stream ran. A 5 ms sleep plus the emit often takes more than the 20 ms fast-IO debounce, so the moving deadline still runs out. The fix agent's claim that the test fails with the bug put back didn't hold here.
      - Fix: the test needs a gap between events that load can't stretch past the debounce. Options: emit in a tight loop without sleeping, or test the deadline rule as a pure function of the event times instead of over a socket.
    - Put the bug back in a detached copy (`/tmp/dev741-review-scratch`, now removed). This worktree is unchanged.
    - Filed [DEV-743](https://lotar.pyxzl.net/task/DEV-743): `merge_agent_that_hands_back_without_end_rules_does_not_land` failed in my `npm run -s test:agent` at load ~38. That test is outside this diff.
  report:
