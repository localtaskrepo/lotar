description: |-
  ## Found (communication review, 2026-11-24)

  On 2026-11-23 from about 19:00Z the Mac's Claude login expired (local LOCA-601). lotar failed each Claude job on "Claude could not authenticate", then ran the failure path for every ticket on its own:

  - 46 failed jobs in the window: lotar 30 (t3), standards 12 (t3) plus 2 headless triage jobs ("Authentication required"), local 4.
  - Each ticket went fix, then @fix-retry seconds later, then the owner question "Retry with which agent, or WontDo?", then an inbox entry and a triage run: 22 inbox entries (INBOX-666 to INBOX-688), all answered "Blocked on LOCA-601".
  - STD-334 (standards) looped: six failed jobs and three triage runs between 19:25Z and 19:28Z. The triage's hand-back (Todo, @fix) started a new job that failed on the same login, which asked the owner again.
  - The owner saw "a bunch of failed threads in t3" (chief of staff thread, 2026-11-23 21:04Z).

  DEV-604 already pauses the queue on a commit-signing failure or a full disk, and DEV-740 pauses on a limit line inside an auth_required failure. A plain auth_required failure with no limit line still fails each job.

  ## Check

  Run a job with a runner whose failure is harnessmux kind auth_required (or text "could not authenticate", "Authentication required", "login reached its time limit"): today it ends failed, runs the job_failed rules and asks the owner.

  ## Done when

  - [ ] An auth_required failure from the runner (not an agent message) ends the job paused with that reason, like DEV-604: no failure rule, no retry tag, no owner question.
  - [ ] While the pause is open, lotar starts no new job for that provider and tries one job again on a schedule; the first success resumes the queue.
  - [ ] One notice for the owner per pause (not one per ticket); list-jobs shows the pause and its reason.
  - [ ] A test covers the auth pause and its resume; docs/help/agent.md says what counts.
