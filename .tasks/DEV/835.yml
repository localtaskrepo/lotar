  text: |-
    Done: an expired login now pauses that provider's jobs instead of failing each one.

    - Runner failure (not agent text) of kind `auth_required`, or text `could not authenticate` / `Authentication required` / `login reached its time limit`, ends the job `paused`: `job_paused` rules only, no retry tag, no owner question. The 2026-11-23 T3 failures were kind `other` with "Claude could not authenticate", so text matching is needed
    - The pause holds only jobs on that provider (profile `provider`, else runner; T3 `claudeAgent` = `claude`). One try every 10 min, the first success resumes
    - The queue now keeps several pauses (one signing/disk + one login per provider); JSON key `pause` → `pauses` in `agent queue` and `list-jobs`. An old state file's `pause` is read in
    - Tests: `a_login_pause_holds_its_providers_jobs_until_one_completes`, `a_runner_login_failure_names_its_pause`, `claude_jobs_on_t3_and_headless_share_a_provider`, `a_saved_single_pause_reads_as_an_open_pause`
    - Docs: `docs/help/agent.md` Paused queue
    - No guidance correction: nothing durable found
