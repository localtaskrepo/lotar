- date: 2026-11-25T12:42:11.704516+00:00
  author: claude
  text: |-
    Review: blocking. The pause works, but the owner gets no notice that he has to sign in again (Done when #3).

    What I read and reran:
    - `9dc30834c`, the only commit beyond `main`: its diff, the ticket, DEV-604 and DEV-740, `docs/help/agent.md`, and the `job_paused` rule in `.tasks/DEV/automation.yml` and the standards `configs/lotar/automation.yml`
    - `npm ci`: passed
    - `cargo nextest run -p lotar-agent` (pause, login, provider, entries_wait): 9 passed
    - `cargo nextest run -p lotar-lib --test integration` (dev604, list_jobs, agent_queue): 5 passed. It needs a fresh `cargo build` and the `LOTAR_*` variables cleared
    - `cargo clippy -p lotar-agent -p lotar-lib --tests`: clean

    Blocking:
    1. **No notice for the owner.** `docs/help/agent.md:255` calls the `job_paused` rules "its one notice". That rule only tags and comments the ticket, and its text says "Nobody needs to act" (`.tasks/DEV/automation.yml:905`). That is wrong for a login pause: nothing happens until he runs `claude auth login`. The rule also can't tell an auth pause from a usage limit, and it can't tell the job that opened the pause from one that joined it. So the queue just waits, retrying every 10 min, and he only learns about it from `list-jobs`. Fix: when `AgentQueueService::pause` opens a new auth pause (not when a job joins one), send one owner notice that names the provider and the command to sign in. That could be a dedicated event, or a pause variable (`agent.pause_reason`, and whether this job opened the pause) that a rule can match. Then fix the docs line.
    2. **No test that runs a job through to the pause.** `a_runner_login_failure_names_its_pause` and `a_login_pause_holds_its_providers_jobs_until_one_completes` test the helpers. Nothing checks the `finalize_job` wiring (`agent_job_service.rs:5576`): a `TurnFailed` auth failure should end the job `paused`, with no `job_failed` rules and no retry tag. That is the bug the ticket reports. Fix: add a test like the dev604 ones, with a runner whose turn fails with `auth_required` or "Claude could not authenticate".
    3. **An assertion that can no longer fail.** `crates/lotar-lib/tests/dev604_queue_pauses_test.rs:328` still checks `["pause"].is_null()`. After the rename that key is always missing, so the check always passes. Fix: check that `["pauses"]` is an empty array, as the other tests in that file now do.

    Also:
    - The branch conflicts with `main` in `agent_job_service.rs` and `resumed.rs`: `46fb767aa` (DEV-833) and others changed them. Rebase onto `main` during the rework
    - The JSON key change from `pause` to `pauses`: nothing in `view/`, the smoke tests or the standards scripts reads `pause`. That is fine
- date: 2026-11-26T00:44:50.545282+00:00
  author: claude
  text: |-
    Rework done: the owner now gets one notice per login pause; all 3 review findings fixed, rebased onto `main`.

    - Review read `9dc30834c`, which was HEAD: no re-review needed first
    - **1. Owner notice.** New rule condition `job: { pause: auth }` (also `signing`, `disk`). Only the job that opens a pause matches it; jobs that join it, and retries that fail the same way, don't. `AgentQueueService::pause` now returns whether the job opened the pause. New variable `${{agent.provider}}`
    - New DEV rule "Login expired: ask the owner to sign in" (`.tasks/DEV/automation.yml`): it files one ticket, HelpNeeded, assigned to mallox, tag `owner`, naming the provider and `claude auth login`. It's a separate ticket, because the paused ticket's queued retry moves that one on. It's a `run` rule, so it needs `lotar trust`
    - Docs: `docs/help/agent.md` Notices no longer says "its one notice"; `docs/help/automation.md` documents `job: { pause }` and `agent.provider`. The UI's rule text describes the condition
    - **2. End-to-end test.** `an_expired_login_pauses_the_job_with_one_notice_until_a_retry_completes` (`dev584_usage_limit_pause_test.rs`): a fake T3 fails twice on "Claude could not authenticate". Both jobs pause, no `job_failed` rule runs, the ticket keeps its status and assignee, there is exactly 1 notice comment, the third try completes and the pause ends
    - **3. Dead assertion.** `dev604_queue_pauses_test.rs` now checks `pauses == []`
    - Rebase: conflicts in `agent_job_service.rs` and `resumed.rs` (DEV-833's `after_limit`): kept both
    - No guidance correction: nothing durable found
