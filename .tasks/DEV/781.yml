- date: 2026-11-22T04:25:26.768046+00:00
  author: claude
  text: |-
    Seen again in DEV-762's merge, 2026-11-21, under load average 30–46: a different set fails on each full run, and each passes alone.

    - Run 1 (lotar's merge): `ui.theming.smoke.spec.ts:41` poll timeout, `ui.agent-jobs.smoke.spec.ts:777`, plus one more.
    - Run 2: `ui.agent-jobs.smoke.spec.ts:458` "streams log entries live" (`.job-card` wait 15 s, DEV-750's case again) and `ui.config-coverage.smoke.spec.ts:135` (120 s test timeout).
    - Alone: `npm run -s test:smoke:quick:agent -- tests/ui.agent-jobs.smoke.spec.ts tests/ui.theming.smoke.spec.ts` and the same with `tests/ui.config-coverage.smoke.spec.ts`: 14/14 passed each time.
- date: 2026-11-22T05:58:33.690408+00:00
  author: claude
  text: |-
    Smoke waits now sized for full-suite load, in the two named tests and the three from the newest comment.

    - `smoke/tests/ui.theming.smoke.spec.ts`: it uses Playwright's own `expect`, whose default is 5 s (the smoke config's 15 s applies only to vitest's `expect`). It now uses `expect.configure({ timeout: 15_000 })` for the whole file.
    - `smoke/tests/harness.agent-launcher.smoke.spec.ts`: the 12 waits on the spawned wrapper and gate agent went from 10 s to `FIXTURE_WAIT_MS = 45_000`. The `awaitExit` bound went from 20 s to 90 s so it outlasts those waits.
    - `smoke/tests/ui.agent-jobs.smoke.spec.ts:458,780,784`: the `.job-card` and `.job-question` waits went from 15 s to the file's existing `WAIT_BUDGET_MS` (45 s).
    - `smoke/tests/ui.config-coverage.smoke.spec.ts`: the describe timeout went from 120 s to 300 s, as DEV-755 did for the dialogs tests.
    - I could not reproduce load average 36 here. The full smoke ran at 13–23.
