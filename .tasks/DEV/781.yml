      reason: 24/24
    next: Review, then merge and rerun full smoke on main under load
- date: 2026-11-22T11:09:30.523127+00:00
  author: claude
  text: |-
    Review: passed. `4ecad949b` raises the waits in the 2 named tests and the 3 from the 04:25 comment, and changes nothing else.

    - Read: the diff against the merge base (only the 4 `smoke/tests/*` files), the ticket and both comments, DEV-755's approach, `smoke/vitest.config.ts` (`testTimeout` 120 s, vitest poll 15 s) and main's newer commits to these files (DEV-765 only adds a test to `ui.agent-jobs`). `git merge-tree main HEAD` is clean.
    - `ui.theming`: the claim holds. Playwright's `expect.poll` uses `info.timeout` from `expect.configure` (`node_modules/playwright/lib/matchers/expect.js`), so 15 s covers line 41.
    - `harness.agent-launcher`: every 10 s wait is now `FIXTURE_WAIT_MS` (45 s), and `awaitExit` is bounded at 90 s.
    - `ui.agent-jobs`: `WAIT_BUDGET_MS` (45 s) already existed in the file. `ui.config-coverage`: describe timeout 300 s, the same as DEV-755.
    - Reran: `npm ci` passed. `npm run -s test:smoke:quick:agent -- <the 4 files>` passed 24/24 at load 17–33. `tsc --project smoke/tsconfig.json --noEmit`, `oxlint` and `prettier --check` on the 4 files passed.
    - Not rerun: the full `npm run smoke` under load (the ticket's check; the fix agent ran it at load 13–23, 406/406), full `npm run lint` and `npm test`. The change touches only smoke files.
    - No UI changes, so no screenshots were needed.
    - Minor, filed DEV-792: in the shim and fwd tests, a failed 45 s start wait followed by `await exit` (up to 90 s) runs past the 120 s test timeout. The wrapper's stderr diagnostic is then lost. The conflict test already races `exit` against 1 s.
