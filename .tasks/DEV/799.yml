- date: 2026-11-23T03:53:21.313930+00:00
  author: claude
  text: |-
    Review: blocking. The fix covers an unlikely cause and misses the likely one: on Linux the watcher can drop the first release file.

    - Reviewed `d4b3cb4de` (only commit on `main..HEAD`; no newer ticket-branch commit). `npm ci` ok.
    - Reran: `vitest --config view/vitest.config.ts useReleases.spec.ts Dependencies.navigation.spec.ts` 5/5 passed; `npm run build:smoke`, then `tests/ui.releases.smoke.spec.ts` 3 of 3 runs passed (macOS); prettier check on the 4 files ok. The new unit test fails without the fix: no `open`/`ready` handlers were registered before.
    - CI log (run `45057966596` attempt 1, job `137317853112`, ubuntu): the test took 17.5 s, of which the 15 s poll. So the page loaded, the menu opened and the POST succeeded in about 2.5 s. The app's EventSource subscribes on mount, long before the POST. The fix's cause ("release created before the stream listened") hardly fits that.
    - Likely cause: `release_changed` comes only from the file watcher (`crates/lotar-lib/src/web_server.rs:1238`). The first release creates `@releases/`, then writes the file right after (`crates/lotar-core/src/storage/release.rs:185-190`). notify 8.2's inotify backend adds the watch on a new directory only after it sees the dir's create event (`notify-8.2.0/src/inotify.rs:61-71, 383-412`). It reports no files already inside. A file written before that watch exists is never announced. That race opens only on Linux and only under load. macOS FSEvents doesn't have it, which explains why it doesn't reproduce here.
    - With the fix, `ready` and its reload arrive right after page load, before the POST. A dropped watcher event still leaves the item disabled, so "passes repeatedly in the full suite" isn't shown.
    - To fix: in the watcher loop (`web_server.rs` `process_watch_batch`, ~line 1180), when a created path is a directory, scan it and treat the files already in it as changed. The fingerprints dedupe repeats. Add a Rust test that creates the first release over REST and expects `release_changed` on SSE. The same race hits a new `@sprints/` or a project folder's first task, so fix it generally.
    - `useReleases.ts` reloading on `open`/`ready` is harmless and can stay; it costs one extra `releases/list` on page load.
- date: 2026-11-23T07:17:46.890209+00:00
  author: claude
  text: |-
    Fixed the review's finding: the server's watcher now announces files inside a folder it sees for the first time.

    - Review read `d4b3cb4de`, which was HEAD; amended to `74d41a697`.
    - `crates/lotar-lib/src/web_server.rs` `process_watch_batch`: when a path is a directory not announced before (new, or recreated), its entries join the batch, recursively. Fingerprints dedupe files also reported on their own. Existing folders aren't rescanned (their fingerprint is already known). Covers the first release (`@releases/`), first sprint (`@sprints/`) and a new project's first task.
    - New test `watcher_announces_files_inside_a_new_folder`: only the folders' create events arrive, as on inotify; it expects `release_changed` for the release and `task_updated` for the task. Failed before the fix (no events), passes now.
    - The test feeds the batch directly rather than REST then SSE: on macOS FSEvents the race doesn't occur, so an end-to-end test would pass without the fix.
    - Kept the `useReleases.ts` reload on `open`/`ready`, as the review allowed.
