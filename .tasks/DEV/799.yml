- date: 2026-11-26T01:54:52.975870+00:00
  author: claude
  text: |-
    Task-view race understood and fixed: the test measured while the panel's open animation was still at its start. It's a test race, not caused by this branch's code.

    - The overlay opens from `translateX(40px)` (`task-panel-enter-from` in `view/components/TaskPanel.vue`). Vue holds that start for two animation frames before the transition runs.
    - In those frames the toggle doesn't move, so Playwright's click goes through. The large view then measures 40 px right of center: |left − right| = 80, the exact failure.
    - Reproduced with animation frames delayed 400 ms: `expected 80 to be less than 4`, 2 of 2 runs. On a busy runner frames slow the same way. This branch's extra release reload on page load adds work then, which likely made the window more frequent, not the cause.
    - Fix in `smoke/tests/ui.task-view.smoke.spec.ts`: after the toggle shows, wait until the overlay has no `task-panel-enter*` class and no running transition, then measure.
    - Amended into the ticket's commit: `0079a1677`.
