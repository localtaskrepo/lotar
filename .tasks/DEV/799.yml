description: |-
  Found in Quality Assurance run 45057966596 (attempt 1) on main `78c006d4b`, the v0.15.6 release commit (DEV-725): `tests/ui.releases.smoke.spec.ts` > offers Add to release in the row menu once a release appears (DEV-464) failed at line 125, `expect.poll(() => item.isEnabled())`: the Add to release item did not become enabled in time after the release was created. 1 of 407 smoke tests failed on the GitHub runner, so this is not the local machine's load. DEV-615 fixed an earlier failure of the same test at the release creation step.

  Check: `npx vitest run --config smoke/vitest.config.ts tests/ui.releases.smoke.spec.ts -t 'offers Add to release in the row menu'` passes alone (3.4 s, 2026-11-22), and the full local smoke run on `78c006d4b` passed (407 of 407).

  Done: the test waits for what enables the item (the release list refresh after release_changed), or the row menu enables the item once the release appears, and the test passes repeatedly in the full suite.
