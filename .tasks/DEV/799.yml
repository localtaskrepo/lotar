- date: 2026-11-22T21:39:08.887960+00:00
  author: claude
  text: |-
    Cause found: the release list misses a release created before the page's event stream subscribed.

    - `view/composables/useReleases.ts` reloaded only on `release_changed` and on a *re*open, not the first open; the watcher can also start late, so the create sends no event.
    - Fix: reload on every stream `open` and `ready`; smoke test starts the server with `LOTAR_SSE_READY=1` (ready comes after the watcher watches).
    - Failing unit test first in `view/__tests__/useReleases.spec.ts`; now passes. Building for smoke.
- date: 2026-11-22T21:53:38.658557+00:00
  author: claude
  text: |-
    Fixed: the row menu's release list now catches a release created before the page's event stream was listening.

    - `view/composables/useReleases.ts`: it reloads on every stream `open` and `ready`, not only on `release_changed` and reconnects. A release created before the subscription or before the server's watcher started sent no event, so Add to release stayed disabled.
    - `smoke/tests/ui.releases.smoke.spec.ts`: the server starts with `LOTAR_SSE_READY=1`, so `ready` arrives only after the watcher watches.
    - New unit test in `view/__tests__/useReleases.spec.ts`, failing before the fix. The `useSse` mock in `view/__tests__/Dependencies.navigation.spec.ts` now accepts calls without options.
    - The CI failure couldn't be reproduced locally; the releases spec passes 5 of 5, full smoke 407 of 407.
