- date: 2026-11-15T19:51:52.799436+00:00
  author: claude
  text: |-
    Fixed: a merge job whose work is on main no longer fails when the ticket branch is checked out in another worktree.

    - Cause: `move_ticket_branch` in `crates/lotar-lib/src/services/agent_job_service.rs` ran `git branch --force`, which git refuses for a branch checked out elsewhere
    - Fix: when that fails and the thread's tip has landed in the main checkout (`commit_landed`), the branch stays and the job logs a note; otherwise it still fails as before
    - Nothing is reset in the other worktree: it may belong to a running agent
    - Test: `a_merged_thread_leaves_a_ticket_branch_checked_out_elsewhere_and_completes` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs` reproduces the ticket's check; it fails without the fix
  report:
    commits:
    - hash: f1480c15
      what: skip moving a ticket branch git won't move when the thread's work is on main
    checks:
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
      reason: 2212 Rust + 1547 UI tests
    - command: npm run smoke
      result: passed
      reason: 404 tests
    next: Review on another model, then merge
