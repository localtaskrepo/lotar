  text: |-
    Review: passed — no blocking code findings in `f1480c15`.

    - Read the ticket and comments, relationships (none), repository guidance, both changed files, landing/completion helpers, and recent main history. No UI changes; `docs/decisions` is absent.
    - The guard still rejects dropping unlanded ticket work. When the thread tip is landed, skipping a refused branch move preserves the other worktree and permits normal completion.
    - Reran `RUSTC_WRAPPER= npm run test:rust -- dev503_harness_jobs_test` with approval: all 22 tests passed, including the new regression and existing refusal coverage. The runner nevertheless exited 1 because `.lotar-test-scratch` remained; this is a verification limitation, not a clean gate pass. Initial sandbox runs hit sccache/socket restrictions and were stopped.
    - Full lint, UI and smoke gates were not repeated; the implementation comment records their passes. No files edited, commits made, or status/assignee changes. No durable guidance finding.
- date: 2026-11-15T20:10:59.850078+00:00
  author: claude
  text: |-
    Merge stopped: rebase onto main conflicts with DEV-573 (`e0f88162`) in `move_ticket_branch`; not landed.

    - Conflict: `crates/lotar-lib/src/services/agent_job_service.rs`, `move_ticket_branch`. Rebase aborted; `agent/DEV-577` still holds `f1480c15` on old main `8425fc6e`.
    - DEV-573 (on main): before `git branch --force`, it now runs `git checkout --detach` in every linked worktree that has the ticket branch checked out, and fails the job if a detach fails.
    - DEV-577 (this branch): leaves a worktree that holds the branch alone, on purpose (it may be a running agent's, as in STD-136), and lets the job finish when the work is already on main.
    - Combined as-is, DEV-573 detaches first, so DEV-577's fallback almost never runs, and the STD-136 case would detach the running fix agent's worktree, which DEV-577 avoided. The code merges, but I can't tell that both intents still hold.
    - No checks ran; nothing changed in the main checkout.

    Question: should a landed merge job detach a worktree that holds the ticket branch (DEV-573, including a running agent's), or leave it and skip the move (DEV-577)? With DEV-577, the rework keeps the DEV-573 detach only for worktrees of finished jobs.
- date: 2026-11-15T20:19:48.303874+00:00
  author: claude
  text: |-
    Seen again with a fix job, not only a merge job: standards STD-139, job `job-20261115T195302.622Z-4`.

    - The fix thread committed `6047d6a` on `t3/review-failed-respect-blocked-tag-1`; `git branch --force agent/STD-139 6047d6a` was refused because an earlier attempt's worktree `agent-STD-139-84cdd5b29b319e22` had `agent/STD-139` checked out.
    - The job ended failed and the ticket went to the owner, though the work was committed and its checks passed.
    - Workaround used: `git checkout --detach` in the old worktree before the next job ended.
    - So `follow_thread_branch` (`crates/lotar-lib/src/services/agent_job_service.rs`) needs the same handling for every T3 job, not only when the work is on main.
- date: 2026-11-15T20:28:06.090580+00:00
  author: mallox
  text: 'Answer: finished-only (Detach only worktrees of finished jobs; leave a running agent''s worktree and skip the move) (answered in INBOX-291)'
