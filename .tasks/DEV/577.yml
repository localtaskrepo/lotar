- date: 2026-11-15T21:54:32.386539+00:00
  author: claude
  text: |-
    Reworked as answered (finished-only, INBOX-291): rebased onto main, DEV-573's detach now applies only to finished jobs' worktrees.

    - `move_ticket_branch` in `crates/lotar-lib/src/services/agent_job_service.rs` detaches a worktree on the ticket branch only when an ended job's log recorded it and no running job continues that job's session (`finished_job_worktrees`)
    - Any other worktree (a running agent's, one no job recorded) stays on the branch; the move is skipped when the thread's work is on main, else the job fails as before
    - Tests in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: DEV-573's stale worktree is now a finished job's (still detached); DEV-577's test asserts the unrecorded worktree stays on `agent/TEST-1`
    - Commit `55b78b15` replaces `f1480c15` (amended in the rebase); `npm ci` ran after the rebase
