  text: |-
    Progress: rebased onto main past DEV-595 and DEV-602; committed `e087ae1b`, checks still running.

    - Main's DEV-595 (`d4750e91`) resets a clean worktree on the ticket branch, or detaches one with changes, for any worktree, a running agent's too. This conflicts with the finished-only answer (INBOX-291).
    - `move_ticket_branch` now resets or detaches only a finished job's worktree (`finished_job_worktree`): an ended job's log names it, no running job continues that job's session, and T3 Code no longer runs that job's thread or waits for an answer in it (`t3_thread_busy`, shared with DEV-594's `running_t3_thread`).
    - Any other worktree stays as it is. The move is then skipped when the work is on main (`BranchMove::Stayed`), else the job fails as before.
    - Tests: the DEV-573 and DEV-595 tests now make their worktree with a finished `stale` job; DEV-577's test fails on main's code (main moved the branch in the other worktree, no "stays where it is" note) and passes with the fix. The 35 tests in `dev503_harness_jobs_test.rs` pass.
    - `docs/help/agent.md` updated in place.
