  text: |-
    Removed the leftovers of Done tickets, as the owner allowed in INBOX-38 (2026-11-13: 'when branches and workspaces are no longer needed they can be removed'). The check went from 84 commits to 29.

    - **Removed:** 95 branches and 74 worktrees whose commits all belong to Done tickets (DEV-468 to DEV-524). Every worktree was clean and had no process running in it. Each one's commit is kept under `refs/archive/DEV-532/{heads,worktrees}/<name>`, so nothing is lost. To restore one: `git branch <name> refs/archive/DEV-532/heads/<name>`.
    - **Kept:** the branches of open tickets: DEV-466 (Reviewing); DEV-467, 496, 509, 516, 520, 523 and 530 (HelpNeeded). They clear when those tickets merge. Also kept: t3/dependency-check-blocked-busy-lock (DEV-524), because a process is still running in its worktree. main's 14 commits go out with the merge agent's next push.
    - **Cause:** filed as DEV-541. The cleanup at Done keeps a ticket's superseded versions, because they differ from what landed on main.

    No files changed, no commit. Check run: `node ~/Development/standards/scripts/repos.ts localtaskrepo/lotar`.
