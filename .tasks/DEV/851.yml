description: |-
  An automation rule's `comment:` posts plain text only (`AutomationAction.comment: Option<String>`, `crates/lotar-agent/src/automation/types.rs`). A rule that asks the reporter a question with options has to use `run: lotar comment --question`, and `run` needs `lotar trust`. A built-in template can't rely on trust, so DEV-796's `agent-team` draft writes the choices in words and the answer can't set fields. Owner decision 2026-11-24 on DEV-796 (INBOX-698): "First fix the lotar gaps (question comments in rules, job reporter), then build".

  ## Proposal

  - `comment:` also takes a map: `{ text, question: { options: [{ key, label, set }], recommended, multiple, other } }`, the same shape as a comment's `question` (`CommentQuestion`, `crates/lotar-core/src/types.rs`, DEV-488). A string stays valid.
  - `text` and option labels accept `${{...}}` templates; the posted comment is a question comment as `lotar comment --question` writes it.
  - `lotar automation simulate` shows the question and its options.

  ## Done when

  - [ ] A rule with a question comment posts a comment whose `question` an answer can choose, without `lotar trust`; option `set` applies on the answer.
  - [ ] Existing string comments load and behave as before.
  - [ ] `lotar config validate` refuses a question with no options or an unknown `set` field.
  - [ ] docs/help (automation actions) describes it; tests cover the rule and the simulate output.
