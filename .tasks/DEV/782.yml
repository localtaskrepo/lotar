  text: |-
    Done: after a reload, a job in another process that waits on a question now shows **Asks**.

    - Branch fast-forwarded to main (DEV-765 is there), then `72d6e632f`
    - `saved_job_dto` → new `logged_question` in `crates/lotar-agent/src/services/agent_job_service.rs`: question = last event's message, no `options`, empty `request`, only if the last event is `agent_job_question`, there's no status line and a live process holds the job
    - Also requires *running*: a logged job no process holds reports `failed`, so it asks nothing
    - Later event or end status → `question` null; Agents page shows the question with no buttons (no options)
    - Tests: `dev782_logged_question_tests` (fails without the fix), new case in `view/__tests__/AgentActivityIndicator.spec.ts`
    - Docs: `docs/help/agent.md` (jobs of other processes)
    - Left as is: the live Agents page card gets `question: null` from the log follower, so its question box only shows after a reload; the pill is the same both ways
