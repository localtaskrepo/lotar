    - Done when refined in the description
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3A1a9fe5ab501c624ca185ae91163eb6fa7887ac67e73bf1101117f32b9b4be6a7
description: |-
  Found while reviewing DEV-765.

  - Live: the `agent_job_question` event the log follower sends makes the activity pill say **Asks** (`view/composables/useAgentActivity.ts`, `applyAgentJobEvent`).
  - After a reload: `fromJob` takes the question from `GET /api/jobs`, and `saved_job_dto` (`crates/lotar-agent/src/services/agent_job_service.rs` ~:950) always sets `question: None` for logged jobs. So a queue-worker job that still waits shows **Working** until its next event.
  - Fix: `saved_job_dto` reports the question when a logged job's last event is `agent_job_question` and its log has no end status. Title = that event's message (what the live pill shows), no answer options, empty request id (only the job's own process can answer).

  ## Done when
  - [ ] `GET /api/jobs` and `GET /api/jobs/<id>` for a logged job whose last event is `agent_job_question` and that has no end status carry `question.title` = that event's message, `options` empty.
  - [ ] Any later event (the answer's progress note, a message, a tool) or an end status wins: `question` is null.
  - [ ] A reload while such a job waits shows **Asks** on the pill, the same as the live view; the Agents page shows no answer buttons for it.
  - [ ] A Rust test covers the DTO cases above; the UI test of `fromJob` covers the pill after a reload.
tags:
