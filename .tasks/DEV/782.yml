- date: 2026-11-23T04:28:29.882989+00:00
  author: claude
  text: |-
    Review: blocking. The fix works, but the screenshots are missing and the help text names an API route that doesn't exist.

    **Blocking**
    - **No screenshots.** The ticket is tagged `ui`, and the change alters what the pages show after a reload. On the Agents page, the job's card now shows a framed box "The agent asks: …" with no buttons. Before the fix, that box never appeared. The board and task pill also say **Asks** instead of Working. The owner's rule (2026-11-13, STD-97) asks for before and after screenshots in light and dark mode at 1920, 1440 and 390 px, attached to the ticket. The hand-off says "No page, component or style changed", but what those pages show did change. To fix: take both sets for the Agents page and the board, and attach them.
    - **Wrong route in the help text.** `docs/help/agent.md:222` names `GET /api/jobs/<id>`, which doesn't exist: the server returns `Route not found`. The real route is `/api/jobs/get?id=`, as in `docs/help/api-quick-reference.md:52` and `docs/openapi.json`. To fix: write `/api/jobs/get` in that sentence.

    **Checked, OK**
    - The diff `main...799bb8b8a` covers `saved_job_dto` and `logged_question` in `agent_job_service.rs` ~:950, the help text, and `AgentActivityIndicator.spec.ts`. It covers every "Done when" item, and nothing outside the ticket.
    - Rebased onto main `f95414e5a` (12 commits ahead) in a scratch copy, the commit applies cleanly.
      - `npm run lint:agent` passes.
      - The Rust tests (`test:rust:agent`, 2471) and the UI tests (`test:ui:agent`, 1568) pass. `test:release` and `test:hooks` pass too.
    - `npm run -s test:agent` still exited 1: a test left a temp folder (`.tmpiU1LnI`) behind, at load average 77. That isn't caused by this change; I reported it on the flaky list [DEV-801](https://lotar.pyxzl.net/task/DEV-801).
    - The test fails without the fix: with `question: None` put back, the `dev782` test fails.
    - Checked in the running app. I made a scratch workspace with a job log that ends on an `agent_job_question` and a fake record saying another live process runs the job.
      - `/api/jobs` and `/api/jobs/get` return `question {title, options: [], request: ""}`.
      - After a reload, the pill says **Asks** in light and dark at all 3 widths.
      - The Agents card shows the question with no buttons, and its layout is fine.
    - The `running` check (a live process must hold the job) is correct: a log with no end and no live process is `failed`.
    - Smoke not rerun: it takes too long under this load. The fix agent reported 407 passed.

    **Filed (minor)**
    - [DEV-826](https://lotar.pyxzl.net/task/DEV-826): the Agents card shows this question box after a reload but not live. While live, the log follower sends `question: null`.
