    Waits for DEV-765: the **Asks** pill and the log follower this fixes are only on `agent/DEV-765` (status Merging), not on main.

    - Plan: `saved_job_dto` fills `question` (title = last `agent_job_question` message, no options) while that is the log's last event and no end status follows
