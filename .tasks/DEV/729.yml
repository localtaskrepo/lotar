description: |-
  Found (DEV-728 fix, 2026-11-20): three fix jobs in a row (job-20261120T130111.184Z-26, job-20261120T130512.436Z-27, job-20261120T130633.048Z-1) were recorded as failed seconds after they started a long check (3x `npm run -s test:agent`) as a background command and marked it with T3's `t3_background_wait`. `lotar agent logs job-20261120T130633.048Z-1`: "the T3 Code thread's run ended with status 'waiting'", then "[agent_job_failed] The t3 runner exited with code 1". The threads kept working: all three later finished the checks, and commit 969484160 and three hand-off comments landed on a ticket already moved to HelpNeeded with a retry question. So each retry started another agent on the same worktree while the earlier ones still ran.
  Also in that log: "agent.worktree.waiting_run (`cargo clean --workspace`) could not start in <worktree>: No such file or directory (os error 2)".
  Check: a t3 job whose thread ends a turn in status 'waiting' (background command pending) stays running until the thread finishes, or fails only after the thread is really done; a test covers it.
  Done: a job that waits on a background command is not reported as failed and not retried while its thread works.
