- date: 2026-11-20T21:28:47.685391+00:00
  author: claude
  text: |-
    Merged to main but not pushed yet: `test:agent` is running again on `399973c57` in the main checkout.

    - lotar fast-forwarded `main` to `399973c57` at 13:27:08 and set Done while the merge agent was still running `test:agent` in the worktree. It then removed the worktree, so that run failed with `target/debug/lotar is missing`, not from the code.
    - Cause: the merge agent's turn ended while it waited on a background command, and lotar treated that as the job's end (same kind of bug as this ticket, for claude jobs).
    - The two tests that failed in lotar's own check run (`dev604 a_signing_failure_pauses_the_queue…`, `dev605 a_check_that_leaves_a_process_running…`) pass on their own; they are timing tests and the load average was ~26.
    - Next: when `test:agent` and `smoke` pass on main, push; otherwise hand back.
