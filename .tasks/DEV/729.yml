- date: 2026-11-20T20:02:58.205359+00:00
  author: claude
  text: |-
    Fixed: lotar now uses harnessmux 0.2.0, so a t3 job whose thread waits on a background command keeps running.

    - `Cargo.toml`: `harnessmux = "0.2.0"` (HARN-3: `waiting` with `pendingBackgroundTasks` keeps the turn running).
    - `agent_job_service.rs`: `TurnFailed { error, .. }` match; unit tests build failures with `EventBody::failed`.
    - New test `a_t3_job_runs_on_while_its_thread_waits_on_a_background_command` (`dev503_harness_jobs_test.rs`): the fake `t3` reports status `waiting` with a background task for two polls, then completes. The job succeeds, starts one thread, logs no failure.
    - On 0.1.10 the same test failed with "the T3 Code thread's run ended with status 'waiting'", the bug from the ticket.
    - Overlap: [DEV-711](https://lotar.pyxzl.net/task/DEV-711) needs the same bump; it's done here, so it only needs the typed `kind`/`resets_at` part.
