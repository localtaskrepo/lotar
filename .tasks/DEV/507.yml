  text: 'Correction to "publishing can''t be undone" in the outcome comment: a published version can''t be changed or republished (a fix is a new version), and a yank only stops new projects from resolving it while it stays downloadable. A whole crate can be deleted within 72 hours of publishing, or later if it has one owner and fewer than 500 downloads a month (crates.io usage policy, RFC 3660).'
