description: |-
  The owner is publishing lotar on crates.io (2026-11-13: "We're actually currently working on publishing in crates. The token has already been added"). After DEV-497 the workspace has three publishable crates (lotar = the binary, lotar-lib, lotar-web-assets), but two of them still read files outside their crate folder, which cargo package leaves out:

  - lotar-lib: build.rs embeds docs/help and docs/openapi.json, and src/services/agent_job_service.rs includes docs/help/agent-instructions.md. cargo package -p lotar-lib fails its verify build: read docs/openapi.json: No such file or directory.
  - lotar-web-assets: include_dir! reads target/web-embed. The packaged crate builds, but embeds an empty folder, so a lotar installed from crates.io would serve no UI.

  ## Publishing: trusted publishing, the token once

  The owner, 2026-11-14, in the thread: "Trusted, token once". `publish-crates` publishes through crates.io trusted publishing, as harnessmux's `publish` job and lotar's own `publish-npm` do. The `CARGO_REGISTRY_TOKEN` secret is used for the first release only, because trusted publishing can be set up only for a crate that already exists on crates.io.

  - The job runs in a GitHub environment `release` in localtaskrepo/lotar, limited to `v*` tags (harnessmux has the same one), with `id-token: write`.
  - It gets its token from `rust-lang/crates-io-auth-action` (pinned to a commit SHA, like every action here, DEV-163). For the first release it falls back to `secrets.CARGO_REGISTRY_TOKEN`, so 0.15.0 can create the three crates.
  - After 0.15.0: the owner adds a trusted publisher on crates.io for each of the three crates (repository localtaskrepo/lotar, workflow `release.yml`, environment `release`) and turns on "trusted publishing only". He then revokes the token and deletes `CARGO_REGISTRY_TOKEN` from lotar and harnessmux. harnessmux's copy isn't used even now: its AGENTS.md says "no token is stored". Then remove the fallback from the job.

  ## Done when

  - [ ] cargo package (with its verify build) passes for lotar-web-assets, lotar-lib and lotar, in that order, and a lotar installed from the packaged crates serves the web UI and lotar help.
  - [ ] The release workflow publishes the three crates in order: trusted publishing in the `release` environment, with the token fallback only for the first release.
  - [ ] docs/release-guide.md describes the setup and the steps after the first release.
