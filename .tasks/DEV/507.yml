description: |-
  The owner is publishing lotar on crates.io (2026-11-13: "We're actually currently working on publishing in crates. The token has already been added"). After DEV-497 the workspace has three publishable crates (lotar = the binary, lotar-lib, lotar-web-assets), but two of them still read files outside their crate folder, which cargo package leaves out:

  - lotar-lib: build.rs embeds docs/help and docs/openapi.json, and src/services/agent_job_service.rs includes docs/help/agent-instructions.md. cargo package -p lotar-lib fails its verify build: read docs/openapi.json: No such file or directory.
  - lotar-web-assets: include_dir! reads target/web-embed. The packaged crate builds, but embeds an empty folder, so a lotar installed from crates.io would serve no UI.

  ## Done when

  - [ ] cargo package (with its verify build) passes for lotar-web-assets, lotar-lib and lotar, in that order, and a lotar installed from the packaged crates serves the web UI and lotar help.
  - [ ] The release workflow publishes the three crates in order, or the owner decides it stays manual.
