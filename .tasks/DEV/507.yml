  text: 'Done in 5bef3dba (signed), on top of DEV-497''s latest commit 35c91373, which is still under review and not on main: the branch carries both commits. If DEV-497 is amended again, rebase this commit onto it. Changes: crates/lotar-lib/build.rs and crates/lotar-web-assets/build.rs use the repository''s docs/ and target/web-embed inside the workspace (folder crates/<name>). A packaged crate (folder <name>-<version>) uses copies in its own docs/ and web-embed/, and its build fails with a clear message when they are missing, so an empty UI can''t be published. agent_job_service.rs reads agent-instructions.md through LOTAR_DOCS_DIR, which build.rs sets. New scripts/stage-crates.mjs makes those copies (both gitignored), with tests in scripts/tests/stage-crates.test.mjs (part of test:release). include lists on all three packages: without one, the root lotar package would have published 1241 repo files, .tasks/ included. Patterns start with / because README.md alone also matched node_modules/**/README.md. Release workflow: new job publish-crates (after build-and-release, stable tags only, because Cargo.toml has the version without the prerelease suffix) runs build:web, stage-crates and cargo publish --locked --allow-dirty -p lotar-web-assets -p lotar-lib -p lotar, and skips versions already on crates.io. It reads the secret CARGO_REGISTRY_TOKEN. Note: the repo has no secret by that name (gh secret list), so the job fails clearly at the next stable tag until the token is added under that name. docs/release-guide.md (job, artifacts, prerelease table) and docs/developers/main.md are updated. Checks: npm run build:web && node scripts/stage-crates.mjs && cargo package --allow-dirty -p lotar-web-assets -p lotar-lib -p lotar passed with all three verify builds (lotar verified against the packaged lib and assets from cargo''s temp registry). From the unpacked .crate files, cargo install lotar into a scratch root, run in an empty folder: lotar help list renders, and serve returns the embedded index.html and /api/openapi.json (303 KB). npm run lint:agent, npm run test:agent (2142 Rust, 1515 UI, 50 release, 7 hooks), smoke 390/390, cargo deny check: all pass. Not run: a real cargo publish (no token, and publishing can''t be undone). Observation for DEV-497: in 35c91373 lotar-agent-wrapper is a bin of lotar-lib, so cargo install lotar from crates.io installs only lotar (the wrapper needs cargo install lotar-lib).'
