    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 4: Allow ticket files to be stored in nested folders and handle them transparently (allows for devs to group tickets together without breaking the scanning logic. This also paves the way for very large repos that e.g. want to put old tickets into archives). Maybe we even support an "archive" function.
description: |-
