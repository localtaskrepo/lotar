description: |-
  Found in DEV-653's review (2026-11-18, commit `05ea0d37e`).

  `lotar agent worktree run` (`worktree_run`, `crates/lotar-lib/src/cli/handlers/agent.rs`) skips a ticket only while a lotar job runs for it (`has_active_job`, `running_job_for_ticket`). A T3 Code thread can run on after its job ended: it resumes a turn it paused for a usage limit, or the owner answers in the thread (DEV-594, DEV-600). lotar's own cleanup counts that thread as still working in the worktree (`finished_job_worktree` and `running_t3_thread` in `crates/lotar-agent/src/services/agent_job_service.rs`); `worktree run` doesn't.

  Effect: a person sets such a ticket to HelpNeeded or Blocked, DEV's waiting rule runs `cargo clean --workspace` in the worktree under the thread's running build or tests, and they fail.

  Builds on DEV-653 (`worktree run` exists only there until it lands).

  ## Done when
  - [ ] `worktree run` runs nothing while a T3 Code thread of an earlier t3 job on the ticket runs (status `running` or an active run) or waits for an answer (pending requests), the same check a new job's start makes (`running_t3_thread`). It exits 0 and says "Ran nothing: the T3 Code thread <id> of the job <job> still runs" / "... waits for an answer" (JSON: `skipped`).
  - [ ] A running lotar job and a thread both apply: the job's message wins (checked first). No worktree: "has no agent worktree" wins over both.
  - [ ] T3 Code can't be asked (no `t3` in the agent table, `t3 thread show` fails): the thread doesn't count, the command runs, as lotar's own worktree cleanup does.
  - [ ] Once the thread is completed and waits for nothing, the command runs.
  - [ ] A test shows the running, waiting and completed cases (a shell script stands in for `t3`, as in `dev626_resumed_t3_threads_test.rs`).
  - [ ] docs/help/agent.md "Build output while a ticket waits" says so.
