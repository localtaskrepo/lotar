  text: |-
    `worktree run` now runs nothing while the ticket's T3 Code thread runs or waits for an answer.

    - `worktree run` exists only on DEV-653's branch (in Merging), so `05ea0d37e` is cherry-picked as `1614afdde` under the fix; DEV-713 now depends on DEV-653.
    - `AgentJobService::t3_thread_holding` wraps `running_t3_thread`, the same check a new job's start makes; `worktree_run` calls it after the lotar-job check, so a running job is named first.
    - Says "Ran nothing: the T3 Code thread t1 of the job … still runs / waits for an answer". T3 Code can't be asked: the thread doesn't count and the command runs, as `finished_job_worktree` does.
    - Test `worktree_run_runs_nothing_while_the_ticket_thread_runs_or_waits_for_an_answer` (fake `t3`, in `dev626_resumed_t3_threads_test.rs`) fails without the fix and passes with it.
    - `docs/help/agent.md` "Build output while a ticket waits" and the command list say so.
    - Not changed: `worktree cleanup --all` still checks lotar jobs only (out of scope).
