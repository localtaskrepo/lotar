  text: 'Removed the two tracked .pyc files (git rm --cached; local copies kept) and added __pycache__/ to .gitignore. Commit 9be309fb. Checks: git ls-files | grep __pycache__ lists nothing; git check-ignore matches scripts/__pycache__/*.pyc via .gitignore:9. The cpython-315 files from 952950c3 aren''t on this branch''s base; if main has them, the merge must drop them too (the rule now ignores them). No lint/test/smoke run: ignore-file and untracking only, no code change.'
