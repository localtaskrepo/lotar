description: |-
  Found in the review of DEV-771 (branch agent/DEV-771, 3333807b1): with 3 tickets in the on-disk queue the All tab shows 'All 0' above the **Waiting in the queue** card listing them (view/pages/AgentJobs.vue:401 counts jobs only). The Queued tab counts jobs waiting for prerequisites too (AgentJobs.vue:406), while the Queued count at the top and docs/help/agent.md say they don't count as queued.

  Check: 3 tickets queued, 1 waiting for prerequisites, no jobs: the tab counts and the top Queued count follow one rule that docs/help/agent.md states.

  Done when: All and Queued tab counts include the waiting tickets consistently with the top counts; a Vitest covers it.
