- date: 2026-11-16T04:16:30.910333+00:00
  author: claude
  text: |-
    Follow-up with DEV-604 (queue pause on signing / disk-full failures), for whichever of the two lands second.

    - Today: a signing or ENOSPC failure in lotar's own rebase or `.tasks` amend hands off to the merge agent, with git's stderr in the comment and the prompt. The agent's job then pauses on the same text at its end, but only after one agent run.
    - Better: in `crates/lotar-lib/src/services/agent_job_service/merge.rs`, check the failure text with DEV-604's `pause_cause_in` (made `pub(crate)`). On a match, end the job failed with git's stderr as the failure note, so it pauses without starting an agent.
- date: 2026-11-16T04:54:25.136485+00:00
  author: claude
  text: |-
    Review: blocking. The merge flow does what "Done when" asks, but a check can hang the job forever, and a test "Done when" requires is missing.

    Read: `aa89bae8` (the whole diff, `merge.rs` in full), the ticket and fix comment, `finalize_job` / `ensure_branch_merged` / `merged_landed` on main, trust and tests setup. Main moved by `1b6c7857` (DEV-588) only, which touches nothing here.

    **Blocking**
    - `crates/lotar-lib/src/services/agent_job_service/merge.rs:495`: after the check exits, `drain.join()` waits until every process that holds stdout/stderr closes it. A check that leaves a background process running (a dev server from smoke, a watcher, `sleep 600 &`) keeps the job stuck in this wait. The cancel check at `:488` isn't reached any more, so the job can't be cancelled either, and merge jobs run one at a time, so the whole merge queue stops. The runner path guards against exactly this with `OUTPUT_DRAIN_LIMIT` (`agent_job_service.rs:28`, `read_job_output`). Fix: stop waiting for the drains a bounded time after the exit, as `read_job_output` does, and add a test with a check like `sh -c 'sleep 30 & exit 0'`. Shell proof: `sh -c 'sleep 3 & exit 0' | cat` takes 3 s.
    - `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`: "Done when" asks for a test that an untrusted repo keeps today's behaviour. There isn't one (the fix comment says so). This is the safety gate for running repository commands (`agent_job_service.rs:2720`). Fix: one test that clears `LOTAR_TRUST_ALL` and points `LOTAR_TRUST_FILE` at an empty temp file (as `tests/common/mod.rs:220` describes), then asserts that the merge agent ran without the hand-off text and that no check ran.

    **While at it (not blocking)**
    - `docs/help/agent.md:503` step 5 says "rules or agent profiles". Now `agent.merge` counts for trust too.

    **Checked and OK**
    - Nothing to merge, the skipped check, 3 rounds, the `.tasks` amend only while it is main's tip, push only when main is clean and `@{u}..` holds only this merge's commits, never `--no-verify`, `session: Fresh` on a hand-off, and `job_completed` through `finalize_job` (`merged_landed` accepts the amended tip).
    - The merge runs only inside merge jobs, so there is still no merge without a passed review. [STD-188](https://standards.pyxzl.net/task/STD-188) is filed and linked.
  report:
    checks:
    - command: npm run lint:agent
      result: passed
    - command: cargo nextest run -E 'test(dev605) | test(trust) | test(merge) | test(fields) | test(agent_job)'
      result: passed
      reason: 142 tests
    - command: npm test
      result: not_run
      reason: review blocks on code findings; targeted suites ran instead
    - command: npm run smoke
      result: not_run
      reason: no UI change; review blocks anyway
    next: 'Fix agent: bound the output drain in merge.rs run_process, add the untrusted-repo test, then review again'
- date: 2026-11-16T05:51:43.880421+00:00
  author: claude
  text: |-
    Rework done: both blocking findings fixed, amended as `25188cfe`.

    - **Check hangs the merge** (`merge.rs` `run_process`): after the command exits, lotar waits for its output at most `OUTPUT_DRAIN_LIMIT` (5 s, as the runner does), then stops the process group (`terminate_child`), so a leftover server can't hold up the merge queue. Test `a_check_that_leaves_a_process_running_doesnt_hold_up_the_merge` (check `sleep 30 & exit 0`): it took 31.5 s and failed without the fix, and passes with it.
    - **Untrusted repo test**: `an_untrusted_repository_leaves_the_merge_to_the_agent` clears `LOTAR_TRUST_ALL`, uses an empty `LOTAR_TRUST_FILE`, and puts the merge profile in a home config, so only the repo's `agent.merge` is untrusted. The merge agent runs without the hand-off and the check doesn't run. It fails with the trust gate removed.
    - **Not blocking, fixed**: `docs/help/agent.md` step 5 and the trust messages in `merge.rs` now say "rules, agent profiles or `agent.merge`". The doc also says what a check leaves running is stopped 5 s after it exits.
  report:
    commits:
    - hash: 25188cfe
      what: amended; bounded output wait for checks, untrusted-repo test, trust wording
