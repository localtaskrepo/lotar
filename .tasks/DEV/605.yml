- date: 2026-11-16T04:54:25.136485+00:00
  author: claude
  text: |-
    Review: blocking. The merge flow does what "Done when" asks, but a check can hang the job forever, and a test "Done when" requires is missing.

    Read: `aa89bae8` (the whole diff, `merge.rs` in full), the ticket and fix comment, `finalize_job` / `ensure_branch_merged` / `merged_landed` on main, trust and tests setup. Main moved by `1b6c7857` (DEV-588) only, which touches nothing here.

    **Blocking**
    - `crates/lotar-lib/src/services/agent_job_service/merge.rs:495`: after the check exits, `drain.join()` waits until every process that holds stdout/stderr closes it. A check that leaves a background process running (a dev server from smoke, a watcher, `sleep 600 &`) keeps the job stuck in this wait. The cancel check at `:488` isn't reached any more, so the job can't be cancelled either, and merge jobs run one at a time, so the whole merge queue stops. The runner path guards against exactly this with `OUTPUT_DRAIN_LIMIT` (`agent_job_service.rs:28`, `read_job_output`). Fix: stop waiting for the drains a bounded time after the exit, as `read_job_output` does, and add a test with a check like `sh -c 'sleep 30 & exit 0'`. Shell proof: `sh -c 'sleep 3 & exit 0' | cat` takes 3 s.
    - `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`: "Done when" asks for a test that an untrusted repo keeps today's behaviour. There isn't one (the fix comment says so). This is the safety gate for running repository commands (`agent_job_service.rs:2720`). Fix: one test that clears `LOTAR_TRUST_ALL` and points `LOTAR_TRUST_FILE` at an empty temp file (as `tests/common/mod.rs:220` describes), then asserts that the merge agent ran without the hand-off text and that no check ran.

    **While at it (not blocking)**
    - `docs/help/agent.md:503` step 5 says "rules or agent profiles". Now `agent.merge` counts for trust too.

    **Checked and OK**
    - Nothing to merge, the skipped check, 3 rounds, the `.tasks` amend only while it is main's tip, push only when main is clean and `@{u}..` holds only this merge's commits, never `--no-verify`, `session: Fresh` on a hand-off, and `job_completed` through `finalize_job` (`merged_landed` accepts the amended tip).
    - The merge runs only inside merge jobs, so there is still no merge without a passed review. [STD-188](https://standards.pyxzl.net/task/STD-188) is filed and linked.
