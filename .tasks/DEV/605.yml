description: |-
  Source: the chief of staff's token-use analysis, 2026-11-14 00:00 to 2026-11-15 16:15 PST (notes: /private/tmp/claude-501/-Users-mallox-Development-staff/0ac34df1-8fd4-4e3f-b9d4-c9c5d3f89ba1/scratchpad/notes.md, per-job costs: /private/tmp/claude-501/-Users-mallox-Development-staff/0ac34df1-8fd4-4e3f-b9d4-c9c5d3f89ba1/scratchpad/jobs_cost3.json). Owner 2026-11-15 picked this recommendation from the options picker. Owner 2026-11-15: this replaces his 2026-11-12 decision to run merges as a turn of the fix thread (standards docs/decisions/2026-11-11-merge-in-fix-thread.md); standards STD-124 (reviews and merges headless) is related.

  ## Found
  - 181 merge jobs in 40 hours ($45): 70 of 77 merge transcripts ran on Opus inside the fix thread's large context; 31 found nothing to merge and 34 failed.

  ## Design (claude, 2026-11-15)
  - lotar can't read the checks out of a repo's AGENTS.md, so a repo names them in its config: `agent.merge` in `.tasks/config.yml` (or the home/global config; a project config replaces it whole). Keys: `checks` (commands, in order), `install` (the repo's install, repos.json "install"), `push` (repos.json "push"), `finding_check` (the command that lists findings, e.g. repos.ts). Without `agent.merge` nothing changes: the merge agent merges as today.
  - `agent.merge` runs commands, so it counts for `lotar trust` like rules and agent profiles: an untrusted repo doesn't run them and the merge agent merges as today.
  - It runs inside the merge job (profile `merge`, or a ticket in Merging), before any agent starts. The job, its log and its rules stay as they are: `job_completed` (standards "Merge agent lifecycle") closes the ticket, `job_failed` retries.

  ## Done when
  - [ ] Clean path, no agent started: in a merge job of a repo with `agent.merge`, lotar rebases the ticket's branch (`agent/<ID>`) onto the main checkout's current branch in the worktree that has it checked out (else its own new worktree), runs `install` when the rebase changed a lockfile (package-lock.json, pnpm-lock.yaml, yarn.lock) or the worktree is new, runs each check, fast-forwards the main checkout, amends pending `.tasks` changes into the merged commit when it is still main's tip (owner 2026-11-12, as the merge prompt step 4), runs `lotar trust` when the merged commits change rules or config and the repo was Trusted before, pushes when `push: true`, reruns `finding_check` for a ticket with a finding key, comments the outcome with a report (commits, checks), and the job completes.
  - [ ] A check whose command the latest report comment lists as passed on the commit that is still HEAD (the rebase changed nothing) is skipped and named as skipped, as the merge prompt step 3 says.
  - [ ] Nothing to merge (no commits beyond main, or the work is on main already): comment "nothing to merge", the job completes, no agent.
  - [ ] Main moved during the checks: rebase and check again, at most 3 rounds, then hand off.
  - [ ] Push only finished work (owner 2026-11-12): the main checkout is clean after the `.tasks` amend and `git log @{u}..` holds only this merge's commits. Never `--no-verify`.
  - [ ] Hand-off, only for what needs judgment: a rebase conflict (rebase aborted, conflicting files named), a failed install or check (command and output tail), a dirty ticket worktree or checks that changed files, a fast-forward git refuses (uncommitted changes in the main checkout), unpushed commits of others in the way, no upstream or a refused push, a failed trust, a finding check that still lists the finding. lotar comments why, and the merge agent starts in a fresh session (`session: fresh`, whatever the rule or profile says) on the merge profile's model, its prompt led by the hand-off: what lotar did (commits landed or not) and what is left.
  - [ ] Which wins: a step that fails hands off; nothing after it runs. Work lotar already landed stays landed and the hand-off says so. The job's end follows the agent as today (lands or fails, rules as today).
  - [ ] No merge without a passed review stays true (standards STD-133 step 1): lotar's merge runs only inside a merge job, which the rules start after a passed review; it adds no other way to start one.
  - [ ] Tests (real git repos, command-runner merge profile that records whether it ran): clean path lands and pushes with no agent; nothing to merge; each hand-off (conflict, failed check, others' unpushed commits, refused push) starts the agent fresh with the hand-off in its prompt; untrusted repo and no `agent.merge` keep today's behaviour; config parses and trust covers `agent.merge`.
  - [ ] Docs: `docs/help/agent.md`, `docs/help/config-reference.md`. Standards adopts it in its own ticket (configs per repo, merge profile model, prompt): filed and linked here.
