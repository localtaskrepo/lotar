- date: 2026-11-16T05:51:43.880421+00:00
  author: claude
  text: |-
    Rework done: both blocking findings fixed, amended as `25188cfe`.

    - **Check hangs the merge** (`merge.rs` `run_process`): after the command exits, lotar waits for its output at most `OUTPUT_DRAIN_LIMIT` (5 s, as the runner does), then stops the process group (`terminate_child`), so a leftover server can't hold up the merge queue. Test `a_check_that_leaves_a_process_running_doesnt_hold_up_the_merge` (check `sleep 30 & exit 0`): it took 31.5 s and failed without the fix, and passes with it.
    - **Untrusted repo test**: `an_untrusted_repository_leaves_the_merge_to_the_agent` clears `LOTAR_TRUST_ALL`, uses an empty `LOTAR_TRUST_FILE`, and puts the merge profile in a home config, so only the repo's `agent.merge` is untrusted. The merge agent runs without the hand-off and the check doesn't run. It fails with the trust gate removed.
    - **Not blocking, fixed**: `docs/help/agent.md` step 5 and the trust messages in `merge.rs` now say "rules, agent profiles or `agent.merge`". The doc also says what a check leaves running is stopped 5 s after it exits.
