- date: 2026-11-16T04:16:01.944881+00:00
  author: claude
  text: |-
    Done: a merge job of a repo with `agent.merge` merges without an agent; the merge agent starts only on a hand-off, in a fresh session.

    - Config `agent.merge` (`checks`, `install`, `push`, `finding_check`) in `.tasks/config.yml` or a project's; project replaces whole. Absent: nothing changes. lotar can't read checks from AGENTS.md, so the repo names them.
    - `lotar trust` covers `agent.merge` (`crates/lotar-core/src/config/trust.rs`); untrusted repo: the merge agent merges as today
    - New `crates/lotar-lib/src/services/agent_job_service/merge.rs`: rebase in the worktree holding `agent/<ID>` (else a new one), install on lockfile change, checks (skips one the latest report passed on the unchanged commit), `ff-only` (3 rounds if main moves), `.tasks` amend, re-trust if Trusted before, push only finished work, finding check, outcome comment with report
    - Hand-offs: conflict (rebase aborted), failed install/check, dirty worktree, refused ff, others' unpushed commits, no upstream/refused push, failed trust, finding still listed. Comment says why; agent gets it before its prompt, `session: fresh`, profile's model
    - `run_job` start steps moved into `start_job` so lotar's merge and the agent share one start
    - No new way to start a merge: only inside merge jobs (STD-133 step 1 unchanged)
    - Tests: `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs` (9: clean+push, skip, nothing to merge, conflict, failed check, others' commits, refused push, no config, config) + trust unit test
    - Not tested: the untrusted-repo path (needs a home-config profile) and that T3 really opens a new thread (command runner in tests)
    - Docs: `docs/help/agent.md#lotars-own-merge`, `config-reference.md`, `trust.md`; UI type `view/api/types.ts`
    - Standards: [STD-188](https://standards.pyxzl.net/task/STD-188) sets `agent.merge` per repo and a model for @merge
    - No guidance correction
