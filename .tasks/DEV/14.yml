- date: 2026-09-08T14:00:16.285533+00:00
  text: 'Implemented docs/help/agent-skills.md and standalone docs/help/skills/lotar-workflow/SKILL.md, linked from help index and docs overview. Template covers scoped CLI/MCP tracking, configured workflow values, workspace verification, serialized shared updates, and task-backed handoffs; it is independent of DEV conventions and the built-in agent-job prompt. Initial isolated CLI/MCP examples and read-only no-mutation check passed. Next: final link/frontmatter and custom-status validation; no live model evaluation while quota is constrained.'
- date: 2026-09-08T14:03:06.277399+00:00
  text: 'Review-ready: generic skill and guide are linked from docs overview/help index. Validated all 11 skill frontmatters, 81 local links, JSON snippets, isolated CLI create/read/search/status/comment/relationships and MCP schema/config/list/get/comment/default-state update on lotar 0.8.0. Read-only operations and rejected custom-status update leave ticket unchanged; custom-state CLI fallback passes. MCP project-enum mismatch recorded on DEV-54 and documented. No built-in runtime prompt or application code changed; full lint/test/smoke not run for this documentation scope. No live model/harness discovery evaluation due quota constraint. Remaining: developer review and authorized commit.'
- date: 2026-09-08T17:54:20.556594+00:00
  text: 'Follow-up: user-facing guide now uses generic skill discovery and transport-neutral MCP setup values, retaining only GitHub-specific installation guidance. Removed tool-specific configuration snippets; standalone skill behavior unchanged. Metadata/link checks and isolated CLI/MCP examples pass; known DEV-54 custom-status limitation remains documented.'
description: 'Provide a standalone, reusable SKILL.md template and user documentation for using LoTaR from coding agents across harnesses. Scope clarified on 2026-09-08: the built-in agent-job prompt alone is insufficient for this request. Acceptance: documented discovery/setup, explicit workspace and configured statuses, CLI/MCP operations, task-backed progress and handoff, and isolated example validation. Preserve the existing built-in job prompt and original historical comments; coordinate repository-specific guidance with DEV-85.'
