- date: 2026-11-22T04:35:11.791856+00:00
  author: claude
  text: |-
    The suite now tolerates the stall: the UI test timeout is 120 s, a hang guard instead of a speed budget.

    - Cause: the machine stalls, not vitest. The check run is normal now (7.7 s, ~0.29 s startup per worker at load 19-37), and the suite peaks at only 2.3 GB RSS (`/usr/bin/time -l`).
    - Hourly Time Machine backups to Nyx overlap two of the three stalls. The DEV-755 merge run started at 12:16 during the 12:15-12:36 backup, and the DEV-764 review run at ~16:15 during the 16:15-16:32 one. `diskimagesiod` wrote 2.1 GB in each window (`/Library/Logs/DiagnosticReports/diskimagesiod_*.diag`). Every backup logs `Failed event collection`, so each one does a full scan of the Data volume.
    - Memory pressure: a JetsamEvent at 11:54 shows ~240 MB free, about 9 GB compressed and rustc/clippy running. The DEV-753 stall at 06:30 matches no backup, so the stalls have more than one cause.
    - Reproduced: freezing vitest for 45 s mid-run made 2 tests time out at 30 s, the same error as in the merges. With 120 s the same run passes 94/94.
    - Fix in `view/vitest.config.ts`: `testTimeout` and `hookTimeout` go from 30 s to 120 s, the same bound as the Rust waits (DEV-753). A truly hung test still fails, after 2 minutes.
    - Not done: the TM full-scan error (`Failed to collect events`) is a machine matter for the owner, not lotar's.
