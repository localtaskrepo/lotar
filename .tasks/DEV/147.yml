  text: 'Outcome: root cause is not the result count but wrapping. Relationship suggestions render as .btn ghost buttons (inline-flex, justify-content:center, default button text-align:center); any suggestion whose ''ID title'' is long enough to wrap became a centered multi-line block, so searches that happen to include a long title looked centered. Added .relationship-suggestion (width:100%, justify-content:flex-start, text-align:left) in TaskPanelRelationshipsTab.vue so every row is a full-width, left-aligned option. Evidence: reproduced with a long-title task in a seeded workspace (screenshots before/after at 1280 and 390); new smoke case ''left-aligns wrapped relationship suggestions as full-width rows'' in smoke/tests/ui.relationships.smoke.spec.ts passes and fails without the CSS (expected ''center'' to be ''left''). Remaining: none; full gates at end of batch. Guidance: no durable finding.'
description: When adding a task as a relationship, some inputs case the auto-complete to be centered instead of left aligned. This doesn't happen for all searches. In the example I was searching "config" and it was centered, searching for "configs" aligned it left. My guess is that the former had more results and thus broke something.
