  text: 'Picking a key suggestion (e.g. status:) from the search autocomplete inserted a trailing space, which left the current fragment empty and re-showed the key list instead of the key''s values, forcing a manual backspace. Two fixes in FilterBar: replaceFragment no longer appends a space when the replacement ends with '':'' so the fragment stays ''status:'', and pickSuggestion keeps the suggestion list open after a key-prefix pick so value suggestions render immediately. Verified E2E: type ''sta'' -> Enter -> input ''status:'' with value list shown -> arrow+Enter applies the value (chip + URL sync). Gates: lint clean, vitest 236/236 (+1 regression test).'
