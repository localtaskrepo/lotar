- date: 2026-11-15T22:11:13.010162+00:00
  author: claude
  text: |-
    Fixed: smoke suites no longer overlap, and a timed-out test leaves nothing in the temp folder.

    - **Cause of the 12 failures:** two smoke suites on one machine starve each other's Chromium. They are all 30 s action timeouts or 15 s polls, not wrong values (`ui.question-comments:108` is a poll too).
      - One suite passed 404/404 at load 286 (another session's 12 `yes` + nextest).
      - Two suites side by side: one failed, `ui.theming` `fill` timed out waiting for "visible, enabled and editable" (load 246, swap 7.5/9 GB).
      - DEV-580's run changed only a Rust test, so its tree could not cause UI failures.
    - **Fix 1:** `smoke/helpers/run-lock.ts` (global setup) holds port `47586` for the run, so a second run waits (30 min max). The OS frees the port when a run dies; nested runs skip the lock via `LOTAR_SMOKE_LOCK_HELD`.
    - **Cause of the leftovers:** Vitest gives up on a timed-out test, but the test's `finally` hasn't run yet when the run ends. Reproduced the exact 3 entries: `playwright-artifacts-*`, `playwright_chromiumdev_profile-*`, workspace.
    - **Fix 2:** `smoke/helpers/owed-cleanup.ts`. `withBrowser`, `launchAndWaitReady` and `SmokeWorkspace` register what they open. After a file with a failed test, `setup.ts` closes browsers and servers, then removes workspaces. After a passing file nothing is cleaned, so the guards still catch real leaks.
    - **Regression test:** `harness.failed-test-cleanup` runs a nested Vitest on `smoke/fixtures/timed-out-test`. It fails without fix 2 (`Tests left 3 entries`) and passes with it.
    - Two parallel suites with the lock: the second waited, and both passed 405/405.
