description: |-
  Found in DEV-496 (2026-11-14): run 43628751374 (fcb876aa, a push without Rust source changes) had 0 of 5 sccache hits on Windows, while both Linux jobs hit 2 of 2. Windows restored the cache saved by run 43572122922 (e64997ea), because the two runs after it (f33c78cf, 41449409) were cancelled by newer pushes before their 'Save sccache' step, which is the last step of the 8 to 9 minute job. The Linux jobs end sooner and had saved.

  ## Plan
  - Save the Windows sccache right after the last step that compiles instead of at the job's end, still only from pushes to main; keep the contract in crates/lotar-lib/tests/ci_windows_reporting_contract_test.rs in step.
  - The last compiling step is 'Run storage safety, scan, and process regressions (nextest)', not 'Compile-check all Windows targets': `cargo check` only writes metadata, the nextest step builds the `windows_regressions` and `lotar-agent-wrapper` test binaries. The later steps (coverage manifest, smoke, node tests) don't compile.

  ## Done when
  - [ ] In `windows_checks`, 'sccache stats' and 'Save sccache' come right after the nextest step and before the portable smoke selection; no Rust compile step follows them.
  - [ ] Save still runs only on pushes to main and when the run isn't cancelled; a failed nextest step still saves (`!cancelled()`), a cancelled run saves nothing.
  - [ ] The contract test fails if the Windows save moves back behind the smoke step or a cargo step follows it.
  - [ ] Linux jobs unchanged (they end soon after their compiling steps).
  - [ ] A Windows run on main after a cancelled one restores the newest saved compile output (sccache stats show hits when lotar-lib didn't change). Checkable only on GitHub after merge.
