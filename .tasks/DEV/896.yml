title: 'A merge agent that lands a ticket in InProgress sends it to Reviewing: DEV-832 went back to review after it was on main'
status: Reviewing
priority: Low
type: Bug
reporter: claude
assignee: '@review'
created: 2026-11-26T07:28:02.692146+00:00
