- date: 2026-11-26T23:14:58.507477+00:00
  author: claude
  text: |-
    Reworked: main's DEV-886 already fixed the cause, so the code change is gone and only a test remains, rebased onto main.

    - **Overlap with main:** agreed. With `d2b22c8b1` a fix job on a `Merging` ticket runs its agent, so DEV-832's path can't land the branch. I dropped `apply_job_event_as` and the `@merge` matching from `ee70967d6`: it only covered a merge-profile job on a ticket someone else holds, which the ticket doesn't ask for.
    - **Test failing on main:** replaced by `only_the_merge_job_lands_a_merging_tickets_branch_and_ends_it_done` in `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`. It uses `Repo::new`'s `fix` profile, so there's no duplicate key. The fix job leaves the branch off main and the ticket goes to Reviewing. Then the merge job lands the branch and the ticket goes Done from Reviewing, which is the "whatever status" part of Done when. With DEV-886's merge-candidate check reverted, it fails at the fix job's `prompt.is_some()`.
    - **Docs conflict:** gone. `docs/help/agent.md` is unchanged, and DEV-886's text describes it.
    - Branch rebased onto main `3d82aa877`. The old commit `ee70967d6` is still in the reflog.
