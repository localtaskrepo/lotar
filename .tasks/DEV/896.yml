- date: 2026-11-26T17:30:52.308456+00:00
  author: claude
  text: |-
    Fixed: a merge job that completes now ends as the merge agent's does, whichever profile ran it.

    - **Cause:** the failed merge sent DEV-832 to `@fix` while it was still `Merging`. A job on a ticket in `Merging` is a merge job, so lotar's own merge ran in the fix job and handed off, and the agent landed `5d3223431`. The fix lifecycle's start rule had moved it to InProgress, and at the end `Fix done: review on Codex` matched `@fix`, which sent it to Reviewing.
    - **Change:** `apply_job_end_rules` (`crates/lotar-agent/src/services/agent_job_service.rs`) matches a completed merge job's rules as if `@merge` held the ticket, through the new `AutomationService::apply_job_event_as`. The changes apply to the ticket as it is. So `Merge agent lifecycle` sets Done, and no review starts. The rules files don't change.
    - **Test:** `a_fix_job_that_lands_the_branch_ends_as_the_merge_does` in `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`. It fails without the fix (`Reviewing`) and passes with it (`Done`). It sets no `agent.merge` checks, so it doesn't wait for the machine's check lock.
    - **Docs:** `docs/help/agent.md`, in the merge job paragraph.
    - **Side effect:** a Research retry on a ticket in `Merging` whose merge lands now goes straight to mallox with its question (`Research merged`). Before, it went through the source check again.
    - **Flaky:** two dev605 tests timed out waiting on the check lock that DEV-883's suite held. They passed on retry, and I reported them on DEV-801.
  report:
    commits:
    - hash: ee70967d6
      what: a completed merge job's end rules match as @merge
    checks:
    - command: cargo nextest run -p lotar-lib --test integration -E 'test(/a_fix_job_that_lands/)'
      result: passed
      reason: fails without the fix (Reviewing), passes with it (Done)
    - command: cargo nextest run --workspace -E 'test(/dev605|dev566|dev320|dev528|dev465|dev516|dev680|dev503|merge|job_end|reassigned/)'
      result: passed
      reason: 133 of 133, 2 dev605 tests needed retries (check lock, reported on DEV-801)
    - command: cargo clippy -p lotar-agent -p lotar-lib --tests
      result: passed
    - command: rustfmt --check, prettier --check on changed files
      result: passed
    - command: npm run lint, npm test, npm run smoke
      result: not_run
      reason: the merge runs the full suites (DEV-797)
    next: Review, then merge
- date: 2026-11-26T20:27:02.651488+00:00
  author: claude
  text: |-
    Review: blocking. Main fixed the cause in DEV-886 (`d2b22c8b1`), and once rebased onto main this branch's new test fails.

    - **Overlap with main:** `d2b22c8b1` (DEV-886, on main after this branch's base `eeb1ad55d`) changed `is_merge_job_candidate` (`crates/lotar-agent/src/services/agent_job_service.rs:6572` on main). Now a `fix` job on a ticket in `Merging` is no merge job: it runs the fix agent, not lotar's merge (test `a_fix_job_on_a_merging_ticket_runs_its_agent`). That covers DEV-832's path, where a fix job landed the branch. With that, the `apply_job_event_as(..., "@merge")` change at `agent_job_service.rs:6248` only matters for a `merge`-profile job on a ticket someone else holds. The ticket doesn't describe that case.
    - **The test fails on main:** I cherry-picked `ee70967d6` onto main in a scratch worktree and ran `cargo nextest run -p lotar-lib --test integration -E 'test(/dev605/)'`. `a_fix_job_that_lands_the_branch_ends_as_the_merge_does` fails 3 of 3 tries with `Invalid config YAML`, because main's `Repo::new` already defines `agents.fix` and the test (`dev605_merge_without_agent_test.rs:255`) appends a second `fix:` key. Even with valid YAML, its scenario no longer happens after DEV-886: the fix job doesn't merge.
    - **Docs conflict:** `docs/help/agent.md`, the merge job paragraph, conflicts with DEV-886's rewrite (`git merge-tree --write-tree main HEAD`).
    - **On HEAD alone** the new test passes (`cargo nextest run -p lotar-lib --test integration -E 'test(/a_fix_job_that_lands_the_branch/)'`). `npm ci` passed.
    - **To fix:** rebase onto main. Then pick one:
      - Drop the code change and close the ticket as fixed by DEV-886, pointing to `a_fix_job_on_a_merging_ticket_runs_its_agent`.
      - Keep `apply_job_event_as` for a `merge`-profile job that completes while another assignee holds the ticket. Then add a test of that case that passes on main, and fold the docs sentence into DEV-886's paragraph.
    - **Flaky, already known:** `a_check_that_fails_once_then_passes_lands_without_an_agent` passed only on its 3rd try. It's the check-lock wait the fix agent already reported on DEV-801.
    - No minor tickets filed.
