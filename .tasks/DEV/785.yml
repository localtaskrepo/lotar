  text: |-
    Timing tests now run in a serial `wall-clock` group in nextest, UI and smoke; full suites pass at load average 33+.

    - Rust `.config/nextest.toml`: group `agent-processes` became `wall-clock` (`max-threads = 1`, `priority = 50` so it starts first, `retries = 2` as before). 132 tests: agent automation + safety (already in it), `dev604_queue_pauses_test`, `dev605_merge_without_agent_test`, `web_api_integration_test::sse_*`, the DEV-761 dev503 test and the DEV-773 audit test. DEV-760 stays out (date bug)
    - UI `view/vitest.config.ts`, smoke `smoke/vitest.config.ts`: `WALL_CLOCK_SPECS` lists, run as a `wall-clock` project after the parallel files, one file at a time. Smoke: 8 files from DEV-750/751/755/775/781; UI: `SprintsList.backlogPagination.spec.ts` (DEV-764). Each file runs exactly once (139 UI, 118 smoke, checked with `vitest list`)
    - Rule in `AGENTS.md`, lists named in the `testing-strategy` skill and `smoke/README.md`
    - Cost: `test:rust:agent` 122 s → 164 s (load ~15); smoke 39 s → 65 s (the second run started at load 32, so partly load)
    - Told the DEV-784 thread: it edits the same two vitest configs (`globalSetup` line only), so the rebase should be easy
