description: |-
  Evidence 2026-11-21 (owner asked to speed the queue up; he picked this, 2026-11-21 ~19:00 PST): last 48 h 55 tickets, 189 jobs, 82.5 slot-hours on 3 slots; merge agent 34 jobs, median 34 min, 33 h; flaky-test tickets 27 h (DEV-748..761); load average 17-20 on 14 cores, 36 seen (DEV-755). DEV-748..761 were one ticket per timing test that failed under load, each with fix, review and merge jobs rerunning the suite.

  Owner's words: "put tests that wait on wall-clock budgets (SSE stream, merge-without-agent, queue/worker timing, the smoke specs named in DEV-750/755) in a nextest test-group with max-threads 1 and the UI/smoke equivalents; the rule for new ones in AGENTS.md; a flaky timing test joins the group instead of getting its own ticket."

  ## Done when

  - [ ] Rust: `.config/nextest.toml` has one test-group with `max-threads = 1` for wall-clock tests. It holds the agent automation and agent safety suites (already serial), the SSE tests of `web_api_integration_test`, `dev604_queue_pauses_test`, `dev605_merge_without_agent_test`, and the other Rust tests named in DEV-741..773 flake tickets (dev503 harness hand-off, audit hanging cat-file). `cargo nextest show-config test-groups` lists them. DEV-760 (a date bug, not timing) stays out.
  - [ ] Group tests keep `retries = 2` in plain `test:rust`; `test:agent` still runs them with `--retries 0`, so they must pass on scheduling alone.
  - [ ] UI (`view/vitest.config.ts`) and smoke (`smoke/vitest.config.ts`): timing spec files run in a separate project, one file at a time, after the parallel files finish. Smoke: the files of DEV-750, DEV-751, DEV-755, DEV-775, DEV-781; UI: `SprintsList.backlogPagination.spec.ts` (DEV-764). Every other file still runs in parallel; each spec file runs exactly once (none dropped, none twice); a file filter on the command line (`npm run test:smoke:agent -- <file>`) still works for files of both projects.
  - [ ] The global setups (smoke run lock, server guard, temp guard) still work with the projects: a run leaves no server or temp file and fails as before when one leaks.
  - [ ] AGENTS.md says: a test that waits on a wall-clock budget, or fails under load and passes alone, goes in the serial group (nextest override or the vitest timing list) in the change that finds it, named in the hand-off comment, instead of a ticket of its own. A test that fails alone too is a real bug and still gets a ticket. The testing-strategy skill says where the lists are.
  - [ ] When the group makes the suite slower: the wall time of `npm run -s test:rust:agent` and full smoke before and after is in the hand-off comment.
  - [ ] `npm run -s test:agent` and `npm run -s test:smoke:agent` pass at load average >= 30 (raised with busy loops if the machine is quieter), `npm run -s lint:agent` passes.
