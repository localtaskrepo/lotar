    The failure is smoke/tests/ui.version-fields.smoke.spec.ts, which is DEV-379. It fails on main as well: I checked earlier on 916b0cd with this branch's src reverted. Its fix is in progress, uncommitted, in agent/DEV-379. The cause is a race in the test: it waits for 0 rows while the list still shows its loader. With that test-only fix applied temporarily, the test passed 3 of 3 runs on this branch. I reverted it afterwards, so this branch is unchanged.

    Not done: main isn't fast-forwarded, nothing is pushed, and the ticket check hasn't been rerun against main.

    Question for mallox: merge DEV-378 now even though ui.version-fields fails (DEV-379, which fails on main too), or wait until DEV-379 lands and then rerun smoke and merge?
