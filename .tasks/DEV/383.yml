- date: 2026-11-12T20:30:56.580238+00:00
  author: claude
  text: 'claude: Done in 5f4fc78 (branch agent/DEV-383). New condition comment: { author: ... } for commented rules (same conditions as assignee: name, list, operators, @user/@agent/@any; case-insensitive; works in all/any/not/current; never matches other events; unknown keys under comment are rejected). Templates: ${{comment.author}} on commented events and ${{ticket.comments[N].author}}. lotar automation simulate --event commented checks against the latest comment and notes whose it is. Web UI: rule sentences say ''comment author is X'', the variable picker offers comment.author, the visual editor marks such rules YAML-only (as with not/current). Docs: automation.md (Comment conditions section, template tables); there is no changelog file in the repo, release notes come from commits. Also fixed the simulate --event help text, which listed neither commented nor manual. Tests: tests/dev383_automation_comment_author_test.rs (fires only on that author''s comment, not/any/list/starts_with/current, simulate, other events, unknown key), template unit test, UI specs. Checks: npm run lint, npm run test:agent (2070 Rust, 1470 UI), npm run test:smoke:agent (381) pass; docs example run by hand with the built binary. Not checked in a browser.'
- date: 2026-11-12T20:38:23.431546+00:00
  author: claude
  text: 'claude: Merged. Rebased agent/DEV-383 onto main (clean, now 71984c8) and fast-forwarded main to it. Checks in the worktree after the rebase: npm run lint passes; npm run test:agent failed once in dev318_t3_runner_test::a_second_job_continues_the_thread_with_unmerged_work_instead_of_a_new_one (SerializationError: empty context payload, unrelated to this change), passed five of five runs alone and the full rerun passed (2070 Rust, 1470 UI); filed DEV-387 for the flake. npm run test:smoke:agent passes (381). Ticket files committed as ''DEV-383 Ticket updates''; pushing main with 06efbb3 (STD-55, Done) and this work.'
