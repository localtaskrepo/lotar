description: |-
  Automation rules can't tell who wrote a comment: the `commented` hook only offers `${{comment.text}}`, although comments store their author since DEV-327. Needed for standards STD-54 (the owner's inbox project): a comment by the owner on an inbox ticket is his answer and must start the hand-back, without a status change. Owner 2026-11-12: "We can probably create an automation that can just change status or trigger a command on comment by me."

  ## Plan
  - `${{comment.author}}` in templates on `commented` events.
  - A condition on the comment's author for `commented` rules (e.g. `comment: { author: mallox }`, also with `not`/`any`), checked by `lotar automation simulate --event commented` and shown in the web UI's rule sentences.
  - Docs: automation.md (conditions, template variables), changelog.

  ## Done when
  - [ ] A rule with an author condition fires on that person's comment only, with a test
  - [ ] Template variable and condition documented
