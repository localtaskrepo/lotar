  text: 'Fixed: the board-state test now waits for the filtered query to land before scrolling, and checks Back-navigation scroll restore against the router''s 1.5 s restore budget (view/utils/routerScroll.ts): a round where the board rendered tall enough within the budget must restore exactly; slower rounds retry up to three times and the test fails if none is fast enough. Verified in the loaded run (48/48) and full smoke 359/359.'
description: tests/ui.board-state.smoke.spec.ts 'keeps filter, sort, grouping, collapsed lanes, expanded columns and scroll' fails with 'expected +0 to be 400' (scroll position not restored yet) in full smoke runs on a heavily loaded machine (load average 40+), seen during DEV-219 and DEV-222; it passes when run alone. Likely the check reads scrollTop before the board finished restoring; wait for the restored state instead of a fixed point in time.
