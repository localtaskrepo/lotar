description: |-
  Found while reviewing DEV-782.

  - After a reload, `GET /api/jobs` gives such a job a `question` (title only, no options), so its card on the Agents page shows the box 'The agent asks: …' without buttons (`view/pages/AgentJobs.vue` ~:183).
  - Live, the log follower sends the `agent_job_question` event with `question: null` (`crates/lotar-agent/src/services/agent_job_service/follow.rs` ~:141 builds the DTO with no events), and `updateFromEvent` takes `payload.question`: the card shows the question only as its last message, no box.
  - docs/help/agent.md says 'A question of such a job shows … its card has no buttons'.

  ## Done when
  - [ ] Live and after a reload the card of a job in another process that waits on a question looks the same (box with the title, no buttons), and the next event clears it in both.
  - [ ] A test covers the live case.
