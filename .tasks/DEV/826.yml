  text: |-
    Waits for DEV-782: the reload half of this ticket is its fix, not yet on main.

    - DEV-782's `799bb8b8a` (branch `agent/DEV-782`, status Reviewing) adds `logged_question` to `saved_job_dto`; on main `saved_job_dto` still sets `question: None`, so today neither reload nor live shows the box
    - Live fix once it lands: `LogFollower::api_event` in `crates/lotar-agent/src/services/agent_job_service/follow.rs` passes the current event (as a `JobLogEntry`) in the `SavedJob` events instead of `Vec::new()`, so `logged_question` gives the same title-only question; the next event clears it, as after a reload
    - Test: a `follow.rs` test that an `agent_job_question` line yields `question.title` = its message, no options, and the next line `question: null`
    - No code changed in this job; nothing committed
references:
