- date: 2026-11-23T07:49:44.529276+00:00
  author: claude
  text: |-
    Waits for DEV-782: the reload half of this ticket is its fix, not yet on main.

    - DEV-782's `799bb8b8a` (branch `agent/DEV-782`, status Reviewing) adds `logged_question` to `saved_job_dto`; on main `saved_job_dto` still sets `question: None`, so today neither reload nor live shows the box
    - Live fix once it lands: `LogFollower::api_event` in `crates/lotar-agent/src/services/agent_job_service/follow.rs` passes the current event (as a `JobLogEntry`) in the `SavedJob` events instead of `Vec::new()`, so `logged_question` gives the same title-only question; the next event clears it, as after a reload
    - Test: a `follow.rs` test that an `agent_job_question` line yields `question.title` = its message, no options, and the next line `question: null`
    - No code changed in this job; nothing committed
- date: 2026-11-27T04:12:37.730866+00:00
  author: claude
  text: |-
    Live question of a job in another process now shows in the box, as after a reload.

    - DEV-782 is on main (`5ae578620`), so `logged_question` exists
    - `LogFollower::api_event` in `crates/lotar-agent/src/services/agent_job_service/follow.rs` passes the current event as the job's last log entry instead of no events: an `agent_job_question` line gets `question` = its message as title, no options, empty `request`; the next line sends `question: null`
    - The page already takes `payload.question` (`view/pages/AgentJobs.vue:794`), so no UI change; `docs/help/agent.md` already describes this
    - New test `a_followed_question_carries_its_title_and_the_next_line_clears_it`: failed before the fix, passes now
