    Outcome: fixed the Linux CI serve-output capture race in tests/cli_serve_features_test.rs only. Each stdout/stderr reader now retains a completion sender until its capture loop finishes; completion is channel disconnection after BOTH readers finish. Stop reaps the owned child and drains capture within the original absolute STOP deadline; early-exit diagnostics use the original READY deadline. The fallback case requests/asserts workspace data and stops before reading complete output, retaining every preferred/actual port, banner, ANSI, payload and exit assertion. Added a channel-gated regression proving stdout readiness/completion is not stderr completion. No production serve behavior or timeout/retry/concurrency/assertion/skip change.
