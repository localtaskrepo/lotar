- date: 2026-11-06T02:46:33.737770+00:00
  text: |-
    Implemented; it ships with the next release once the two new npm packages are bootstrapped (placeholder publish plus npm trust; steps in docs/release-guide.md 'Adding a platform package').
    - release.yml: new build entries windows-arm64 (native windows-11-arm, aarch64-pc-windows-msvc, with a step that finds clang for ring) and linux-musl-armv7 (cross with armv7-unknown-linux-musleabihf, image pinned by digest in Cross.toml). The build entries use a cross flag instead of hard-coded aarch64 conditions, and packaging keys on target == windows rather than windows-latest. Also: the npm archive list, release page links, a deb-only armv7 package (nfpm arm7 -> armhf; no rpm, since Fedora/RHEL dropped 32-bit ARM), a Scoop arm64 entry, and Docker linux/arm/v7 (the Dockerfile maps TARGETARCH arm to armv7).
    - npm: new packages @localtaskrepo/lotar-win32-arm64 and @localtaskrepo/lotar-linux-arm; win32-x64 is x64-only now; the launcher maps win32-arm64 and linux-arm.
    - install.ps1 picks windows-arm64 on ARM64 and falls back to x64 for releases without it; install.sh maps armv7l/armv7* on Linux.
    - CI: a new QA job release_targets builds both targets on every push (Windows arm64 also runs --version natively), so a broken ARM build blocks the release. install-verify adds Windows ARM runs for install.ps1 (with a PE machine check) and npm, plus an armv7 deb and an install.sh/npm job under QEMU.
    - Docs: install.md, docker.md, release-guide.md.
    Verification limits: armv7 could not be built locally (rustc segfaults under Docker's amd64 emulation on Apple Silicon), and Windows arm64 can't be built on macOS. Both are first exercised by the new QA job on the next push. npm package, release-page and workflow contract tests pass.
- date: 2026-11-06T02:57:14.336412+00:00
  text: 'npm bootstrap: published @localtaskrepo/lotar-win32-arm64@0.0.0 and @localtaskrepo/lotar-linux-arm@0.0.0 (placeholders, no binary) as mallocator, through opgate with the new 7-day token in ''NPM Token (LoTaR)''. The previous token in that item had been removed (401). Still open for the owner: connect trusted publishing for both packages shortly before tagging the next release (npm drops it after 48 h without a publish). npm trust rejects granular tokens with bypass-2FA, so it needs npm login in a terminal or Settings -> Trusted publishing on npmjs.com (GitHub Actions, localtaskrepo/lotar, release.yml). Then tag; publish-npm publishes the real versions.'
- date: 2026-11-06T03:29:51.933320+00:00
  text: |-
    v0.12.1 released and checked.
    - Release run: all 17 jobs green, including both new builds (windows-11-arm native; armv7 via cross).
    - Assets: windows-arm64.zip is PE32+ Aarch64, linux-musl-armv7 is a static ELF 32-bit ARM EABI5, the armv7 .deb is Architecture armhf. Each has its .sha256 (verified) and Sigstore .sig/.pem.
    - npm: all eight packages at 0.12.1 with provenance; the new win32-arm64 and linux-arm published through trusted publishing.
    - Scoop 0.12.1 manifest has the arm64 entry.
    - Docker mallox/lotar:0.12.1 includes linux/arm/v7, and it runs (lotar 0.12.1 under emulation here).
    - install-verify (run 42156206945) passes for install.ps1 on windows-11-arm (pwsh and Windows PowerShell, PE machine check), npm on Windows arm64, the armv7 deb under QEMU and install.sh in Alpine armv7 under QEMU.
    - Fixed in the verify workflow: the armv7 npm step used node:24, which has no arm/v7 image (now node:22). The rpm checks used rpm -i, which RPM 6 / Fedora 45 refuses for unsigned packages; they now use the documented 'dnf install' (follow-up DEV-310 to GPG-sign rpms).
    - npm on Linux arm64 failed only because the registry hadn't caught up with the new versions yet; it is visible now. Next: push the fix and rerun install-verify for v0.12.1.
description: 'Add two platforms to every release channel: Windows arm64 (aarch64-pc-windows-msvc; today Windows on ARM runs the x64 build under emulation) and Linux armv7 (armv7-unknown-linux-musleabihf, static, for 32-bit Raspberry Pi OS and older Pis). Covers the release build matrix, checksums/signing/upload, the release page, npm platform packages (@localtaskrepo/lotar-win32-arm64, @localtaskrepo/lotar-linux-arm) and the launcher, install.ps1/install.sh architecture selection, the Scoop arm64 entry, .deb/.rpm for armhf, install verification, docs and tests. The first version of each new npm package must be published by hand before trusted publishing works (docs/release-guide.md).'
