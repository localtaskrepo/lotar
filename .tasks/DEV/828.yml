description: |-
  Found in the DEV-809 review (2026-11-22).

  `lotar --format json comment <ID>` and `lotar --format json show <ID>` drop deleted comments (`crates/lotar-lib/src/cli/handlers/comment.rs` `render_comment_list`, `crates/lotar-lib/src/cli/handlers/task/show.rs` `handle_show`), but the items carry no number. Text output prints `#N` (stored position), and `lotar comment <ID> --edit|--delete|--restore <N>` takes that N. An agent reading JSON and counting positions after a delete is off by one per deleted comment above: `--delete 3` hits the wrong comment (restorable, but `--edit` overwrites the wrong text).

  ## Done when
  - [ ] Each JSON comment item from `lotar comment <ID>` and `lotar show <ID>` carries its 1-based stored number (e.g. `number`), the one `--edit/--delete/--restore` take; deleted ones stay out as now.
  - [ ] Test: delete #2 of three, JSON lists numbers 1 and 3.
  - [ ] `docs/help/comment.md` says so.
