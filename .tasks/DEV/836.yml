- date: 2026-11-24T22:22:35.461304+00:00
  author: claude
  text: |-
    Review: blocking. One path still leaves every resumed thread of a ticket running: a ticket with a queued job.

    - **Finding:** `crates/lotar-agent/src/services/agent_job_service/resumed.rs:203` returns before anything is stopped when the ticket has a queued entry that is no usage-limit retry. At a limit reset, all N resumed threads then keep running in the one worktree, which is the bug this ticket is about. "Done when" asks for at most one thread per ticket. `docs/help/agent.md:191` documents this gap ("Left alone too are the threads of a ticket with a queued entry"). **Fix:** in that branch, keep the newest thread for the queued job to wait on and `stop()` the rest. Add a test next to `a_thread_t3_code_resumes_is_left_to_a_queued_job_that_is_no_usage_limit_retry` (`crates/lotar-lib/tests/dev626_resumed_t3_threads_test.rs:387`) with two running threads plus a queued entry, and update the doc line.
    - **Verified:** T3 Code's limit resume skips settled threads. Its server SQL in `app.asar` filters `json_extract(t.payload_json, '$.settledOverride') IS NOT 'settled'`, so `settle_superseded` (`kept.rs`) works as claimed.
    - **Checked, fine:** the newest thread is taken over and the others are stopped. A Blocked ticket has all its threads stopped; the name check matches `automation_service.rs:3450`. A thread that waits for an answer holds the ticket and the others are stopped. A retry that races T3's resume ends with one thread either way: the failed thread is settled first, or the resumed one is taken over and the retry is dropped. The new tests' asserts would fail on main.
    - **Reran:** `npm ci` passed. `cargo nextest run -p lotar-lib --test '*' -E 'test(/dev626|resumed_t3/)'`: 12 passed. `cargo nextest run -p lotar-agent -E 'test(/t3_thread_api|kept|resumed/)'`: 10 passed. `cargo clippy -p lotar-agent --all-targets`: clean.
    - **Not rerun:** the full lint, test and smoke suites, which the merge runs. Nobody has seen this work at a real T3 limit reset.
    - No UI changes, so no screenshots needed. No stray files, one commit (`dbdedd4a6`).
