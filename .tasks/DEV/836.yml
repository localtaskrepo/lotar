- date: 2026-11-24T21:41:53.998708+00:00
  author: claude
  text: |-
    A limit resume now runs one thread per ticket, none on a Blocked ticket, and a job's retry settles the thread it replaces.

    - `resumed.rs`: lotar still takes over the newest resumed thread and now stops the other ones (`thread.stop` over T3's internal API, `t3_thread_api.rs`) instead of commenting "stop it in T3 Code". On a `Blocked` ticket it takes none over and stops them all.
    - `kept.rs` `settle_superseded` (called from `run_session`): a new `t3` job settles the earlier jobs' `failed` threads, which are unsettled, on its ticket. T3's limit resume skips a thread whose `settledOverride` is `"settled"` (checked in T3 Code's server code), so a retry leaves no thread for T3 to wake later.
    - I checked the commands in T3 Code's orchestration schema: `thread.stop {threadId, reason?}`, `thread.settle {threadId, expectedLatestRunId?}`.
    - `docs/help/agent.md` describes the new behavior.
    - This ticket hit the bug too: T3 resumed both DEV-836 threads (`70c52b10…` from 19:11, `fdff9233…` from 20:11) in this worktree. I asked the older one to stop and kept one commit.
    - STD-328 now has one thread, waiting on background work, not several running.
