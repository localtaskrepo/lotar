description: 'Found: on 2026-11-24 at 16:00 UTC, T3 Code''s limit-resume message (''Continue where you left off.'') restarted 10 STD-328 fix threads from jobs filed hourly on 2026-11-23 (07:51 to 18:30). All of them run Opus in /Users/mallox/Development/.lotar-worktrees/standards/STD-328, with no lotar job (lotar agent list-jobs shows only failed jobs). lotar commented ''Stop it in T3 Code'', but nobody acts on that, and the threads would race on one worktree and on its dependency updates. DEV-626 (Done) covered resume after a restart, not resume after a limit. Check: t3_thread_list titleContains STD-328 shows several threads running at once. Done when a limit resume runs at most one thread per ticket (the newest tracked job, or none while the ticket is Blocked), and lotar''s job retries don''t leave a T3 thread behind that T3 can resume later.'
