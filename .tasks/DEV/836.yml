  text: |-
    Review finding fixed: with a queued job, the newest resumed thread runs and lotar stops the others.

    - The review read HEAD `dbdedd4a6` (it quoted `resumed.rs:203`).
    - `resumed.rs` `on_ticket`: a queued entry that is no usage-limit retry no longer returns early. The newest thread is left for the queued job to wait on, and each other thread is stopped with the comment `… beside the thread <link> that the ticket's queued job waits for. lotar stopped it …`.
    - New test `a_queued_job_waits_for_the_newest_resumed_thread_and_the_others_are_stopped` in `dev626_resumed_t3_threads_test.rs`: two running threads plus a queued entry give `thread.stop t1` only, no takeover, and the entry stays queued.
    - `docs/help/agent.md`: the "Left alone too…" line now describes this.
    - Amended into `c561b9721`, signed.
