  text: 'Paused, not failed: the job job-20261124T191057.251Z-26 (fix) stopped on a usage limit or a paused queue and runs again by itself, on a usage limit at its reset. Nobody needs to act; lotar agent list-jobs shows when it resumes, lotar agent logs job-20261124T191057.251Z-26 why.'
- date: 2026-11-24T20:46:41.727216+00:00
  author: codex
  text: |-
    Before the 13:00 Pacific reset on Nov 24, T3's local projection showed 81 unsettled threads armed for that timestamp. Joining the armed run to the latest failed run showed 38 same-title, same-worktree pairs, each with five items in both failed runs. The same issue is therefore armed for another reset, even on tickets that hit the limit before generating useful work. LoTaR had 58 queued entries when checked at 12:39, with retries staggered; T3 can wake its armed threads separately.

    Treat a settled superseded attempt as ineligible, and preserve one queue-owned path per ticket and its phase. Also prevent an already-started limited thread from being duplicated by the fallback retry when T3 has the true reset time but LoTaR's error string carries only a generic 429.
