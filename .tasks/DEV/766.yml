- date: 2026-11-21T23:03:06.813874+00:00
  author: claude
  text: |-
    Done: tool calls and thinking are their own job log entries. Each tool call is stored with its command or path, status and output (cut to 4 KB), and thinking shows folded in the Agents log and the timeline.

    - Rust: a new `tools.rs` builds `AgentJobTool` from the ACP update (`event.raw`). A call gets one `agent_job_tool` entry when it starts and one when it ends, and a call whose start never arrived gets only the end entry. Output has ANSI codes and a wrapping console fence removed and is cut at 4 KB, with `output_bytes` holding the full size. Thinking is `agent_job_thought`, one entry per paragraph. Usage now carries `context_used`/`context_size`, and the latest value wins.
    - Contract: `api_types.rs`, `view/api/types.ts`, `docs/openapi.json` (AgentJobTool, `tool` on AgentJobLogEntry, context fields) and `docs/help/sse.md` and `agent.md` match.
    - UI: each tool row shows Run/Read/Edit/Search with the command or path. While a call runs its row says `· running`, and the end entry replaces it. A failed call shows in red with its first 8 output lines. Thinking is a folded entry with Hide when it is open. Old logs with "Tool:"/"Failed:" lines look as before.
    - Size: in a test job with 40 Claude calls of 20 KB output each, the log stays at 187 KB. Real outputs I sampled average about 1.3 KB after the cap.
    - Limit: Claude's Bash command only reaches lotar with harnessmux 0.3 (sends tool.updated), so until then a Claude call shows its title. The follow-up is [DEV-774](https://lotar.pyxzl.net/task/DEV-774).
    - Screenshots (synthetic Codex job, before = installed 0.15.5): [before light 1440](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-before-light-1440.512efd6a94e751d8a6ef8384bbf22368.png), [after light 1440](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-after-light-1440.9151c63daf4eaede98613a2503ef5c80.png), [before dark 1440](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-before-dark-1440.cf5208cb376af5b917cefea18a632056.png), [after dark 1440](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-after-dark-1440.a29ad4c8b0fead76fa59790a26ae6958.png), [before light 390](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-before-light-390.ccc510a1fd8a18d3693e304beed171db.png), [after light 390](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-after-light-390.7dbb84dfd2950d784b7c12cfac68a153.png), [before dark 390](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-before-dark-390.7478353ddb0de88302303b5e26af5c42.png), [after dark 390](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-after-dark-390.515947b06ed890939e4faf3afa0fb52f.png), [after, thinking open](https://lotar.pyxzl.net/api/attachments/get?path=DEV-766-after-light-1440-thinking-open.a01681c1cf879255078bd76bb7d1072a.png). The 1920 px shots matched 1440 and are not attached.
