description: |-
  Job logs show a tool call as the text `Tool: <title>`. For Claude the title is almost always generic: 2,574 of the tool lines in `.tasks/@agent-logs` (2026-11-17 to 2026-11-21) are `Tool: Terminal`, with no command and no result. A failed tool shows only its id (`Failed: toolu_0111…`, 46 times). The owner asked on 2026-11-21 to show tool calls in the logs.

  ## Cause

  `drive_turns` in `crates/lotar-agent/src/services/agent_job_service.rs` (about :4495-4727):

  - `ToolStarted` → `agent_job_progress` "Tool: <title>": `id` and `kind` are dropped.
  - `ToolFinished` is logged only when it failed, by title or id.
  - `ThoughtDelta`, `ConfigChanged`, `Usage` (context window, rate limit) and every event's `raw` are ignored.
  - The UI guesses tool lines with a regex (`view/utils/agentJobs.ts` `isToolLine`).

  ## Plan

  - [ ] New log kind `agent_job_tool` with a structured `tool` object on `AgentJobLogEntry` and the SSE event: `{ id, kind, title, status: running|completed|failed, input?, paths?, output?, started_at, finished_at? }`. A tool's start and end are two entries with the same `tool.id`; the UI pairs them.
  - [ ] Fill it from what harnessmux 0.2.x already gives: `id`, `kind`, `title`, `status`, and the output from `Event.raw` (`update.content` text, else `rawOutput`), and Codex's command from its title. Once HARN-14 ships, take `input`, `paths` and `output` from its fields instead of `raw`.
  - [ ] Output: ANSI codes removed, capped at about 4 KB per call, noting the cut and the full size. Input summarised for display (the command for `execute`; the path for read/edit; the query for search). Keep the raw input JSON too, capped.
  - [ ] Thinking: new kind `agent_job_thought`, buffered per paragraph like replies. The owner chose on 2026-11-21: "Collapsed, off by default".
  - [ ] Context window: keep the latest `context_used`/`context_size` on the job (`AgentJobUsage`), so the UI can show it live.
  - [ ] Plans (once HARN-14 adds them): `agent_job_plan` with the entries.
  - [ ] Old logs keep reading: `agent_job_progress` "Tool: …" entries stay valid input.
  - [ ] REST contract: `crates/lotar-core/src/api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, `docs/help/agent.md` agree (skill api-contract-change-end-to-end).
  - [ ] The current log view shows the new kinds plainly (label, command or path). The full tool-row design is DEV ticket "Agent job log viewer: filters, search, folded tool calls".
  - [ ] Log size: check against the pruning (DEV-693). A Claude review job with about 40 tool calls should stay well under 200 KB.

  ## Done when

  Owner, 2026-11-21: show tool calls in the logs; thinking "Collapsed, off by default".

  harnessmux on crates.io is 0.2.0; HARN-14's fields (0.3.0) aren't published (HARN-13 waits for the owner). This ticket reads what 0.2.0 gives, from `Event.raw`; the bump to 0.3 and Claude's command from `tool.updated` is the follow-up ticket.

  - [ ] **Log entries**: each tool call is two `agent_job_tool` entries with the same `tool.id`: `status: running` at its start, `completed`/`failed` at its end. The end entry is complete on its own (title, kind, input, paths, `started_at`, `finished_at`, output), so a reader can show only it. `message` is a plain line for CLI, MCP and old readers: `<title>` or `<title>: <input>`, with `Failed: ` in front for a failed call.
  - [ ] **Which value wins**: title and kind from the start event, a later non-empty title replaces a generic one; input from `rawInput` when it is not empty, on whichever event has it first; paths from `locations`. Output: the text `content` items, else `rawOutput` (string, else compact JSON). No output: the field is left out.
  - [ ] **Input summary**: `command` for execute (Codex: also the title), `file_path`/`path` or the first path for read/edit, `query`/`pattern`/`url` for search/fetch, else none. `raw_input`: the input JSON, cut at 1 KB, on the end entry only.
  - [ ] **Output cap**: ANSI codes removed, a Markdown code fence around the whole text removed, cut at 4 KB on a character boundary; a cut sets `output_bytes` to the full size. Without a cut `output_bytes` is left out.
  - [ ] **A tool's end without its start** (the job began mid-call, or the start was before the job's turn): the end entry has what the end event carries, `started_at` left out. A start without an end (turn cancelled): only the running entry stays.
  - [ ] **Thinking**: `thought.delta` text is buffered per paragraph like replies into `agent_job_thought` entries; the buffer is flushed before a tool call, a reply, a question and at the turn's end. The log views show it collapsed ("Thinking", click to open).
  - [ ] **Context window**: a `usage` event's `context_used`/`context_size` replace the job's (`AgentJobUsage`), the latest wins; they are not summed over turns.
  - [ ] **SSE and REST**: `agent_job_tool` and `agent_job_thought` stream like the other `agent_job_*` events with a `tool` object on tool events; `GET /api/jobs/logs` and the task timeline's threads return the same `tool`. The saved log keeps it. `api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, `docs/help/agent.md` and `docs/help/sse.md` agree.
  - [ ] **Old logs**: `agent_job_progress` "Tool: …" and "Failed: …" lines still show as tool lines; logs without `tool` still load.
  - [ ] **UI** (Agents page log and task panel thread): a tool row shows its kind label, input (command or path) or title, and status; a failed one is red with the start of its output; a running entry is hidden once its end entry is there. The full design stays DEV-769.
  - [ ] **Size**: a test logs 40 Claude-shaped tool calls with long output; the saved log stays under 200 KB.
  - [ ] Tests cover Claude- and Codex-shaped events, the output cap, ANSI stripping, the end without a start, thought buffering and context usage. `npm run lint`, `npm test`, `npm run smoke` pass.
