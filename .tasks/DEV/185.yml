  text: 'Done. (1) Natural task ID order everywhere: storage::compare_task_ids (Rust) and compareTaskIds (TS) order by prefix, then numeric suffix, then spelling; used for sort_by=id and the default tiebreak in task_query (REST/MCP/CLI lists), sprint reports, CLI listing, search results, the shared UI sort and Sprints manual-order ties. Docs/openapi/MCP descriptions updated. (2) Board controls use ''Group by'' / ''Sort by'' labels with short options. (3) Board state now survives leaving and returning: FilterBar restores the saved filter when the URL only carries the same ?project= (browser Back); collapsed swimlanes saved per project+grouping; ''Show more'' expansion kept per tab for the unchanged filter; router scrollBehavior restores scroll on Back/Forward. (4) User follow-ups: board Fields button moved to the header next to Columns (list icon); removed in-page Dependencies links on Sprints and Insights (task panel ''open in graph'' link kept); Dependencies header now has Fields, Clear filters and a Reload button. Tests: Rust natural_order_tests, taskSort compareTaskIds, smoke ui.board-state (nav link + Back), ui.board-sort. Verified: lint:agent, test:agent (1691 Rust, 1154 UI), full smoke 344/345 with one DEV-170 load flake passing 3/3 in isolation; later UI-only edits re-verified with all UI tests and 56 board/dependencies/insights/sprints smoke tests.'
