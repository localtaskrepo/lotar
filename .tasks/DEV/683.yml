- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A99135d3c-e4c5-4c4b-8d8b-1698f984e0be
description: |-
  harnessmux reports a failed turn as `turn.failed {error: String}`, built from the error's text, and drops what the adapters already send: the kind of failure and when a usage limit resets. DEV-584 (pause a job until the usage-limit reset) has to guess both from text. Found in the survey of similar projects mallox asked for on 2026-11-17 ([report](https://claude.ai/artifact/KSCDeRRHZqQRqkqHfjVRKf), section harnessmux).

  ## Evidence
  - claude-agent-acp (the pinned adapter): a failed turn's JSON-RPC error `data` is `{errorKind, rateLimit}` with `rateLimit.resetsAt` ([src/result-end.ts](https://github.com/agentclientprotocol/claude-agent-acp/blob/main/src/result-end.ts)); `usage_update` carries `_meta["_claude/rateLimit"]`, `quota`, `authStatus` (docs/air-extensions.md).
  - acpx's two-layer error contract: stable code + raw error + `retryable` ([ACPX_ERROR_STRATEGY.md](https://github.com/openclaw/acpx/blob/main/docs/ACPX_ERROR_STRATEGY.md), [error-normalization.ts](https://github.com/openclaw/acpx/blob/main/src/acp/error-normalization.ts)).
  - happy merges push and pull rate-limit data into one shape with `resetsAt` ([usageLimits.ts](https://github.com/slopus/happy/blob/main/packages/happy-cli/src/claude/utils/usageLimits.ts)); its fixture shows the native text "You've hit your limit · resets …", which `FAILURE_TEXTS` doesn't match.
  - harnessmux: `src/error.rs:54`, `src/session.rs:347` (string only, `raw: None`), `src/acp_map.rs:33-41` (Usage reads used, size, cost).

  ## Proposal
  - `turn.failed` gets `kind` (rate_limited, quota, auth_required, overloaded, context_exhausted, transport, other), `resets_at`, `retryable` and `raw`, from the adapter's error data first; text matching stays as the fallback.
  - `usage` events carry the rate-limit window when the adapter sends it.
  - lotar's DEV-584 then reads `kind` and `resets_at` instead of the message.

  ## Done when
  - [ ] recorded sessions for a Claude rate limit and an auth failure replay to the typed fields
  - [ ] lotar's usage-limit handling uses them (DEV-584)
