  text: |-
    Built in harnessmux: `turn.failed` now has `kind`, `resets_at`, `retryable` and `raw`, from the adapter's error data first, text second.

    - Work is in the harnessmux repo, branch `agent/DEV-683` (worktree `~/.t3/worktrees/harnessmux/DEV-683`), commit `85a7484`. lotar is unchanged.
    - Kinds: rate_limited, quota, auth_required, overloaded, context_exhausted, transport, other (`src/failure.rs`). claude-agent-acp's `data.errorKind` and `data.rateLimit.resetsAt` and ACP's `authRequired` (-32000) come first; otherwise the text decides. `retryable` is true for rate_limited, overloaded and transport.
    - `usage` events now carry `rate_limit` (`status`, `window`, `resets_at`, `utilization`) from Claude's `_claude/rateLimit`.
    - "You've hit your limit · resets …" now fails the turn too.
    - Done-when 1: `tests/recordings/claude-limit-then-auth.jsonl` replays a rate limit to `rate_limited` with `resets_at`, and an auth failure to `auth_required` (test `claude_limit_and_auth_errors_fail_the_turn_with_their_kind`). I wrote the recording by hand from the pinned adapter's source (`v2/outcome.js`, `result-end.js`); it wasn't captured live.
    - Limit: a reset time that appears only in the text (Codex's "try again at …") isn't parsed, so `resets_at` stays empty there.
    - Done-when 2 belongs to DEV-584 (HelpNeeded, waits on DEV-604). It needs a harnessmux release, and lotar's match `EventBody::TurnFailed { error }` in `agent_job_service.rs` must become `{ error, .. }`.
    - Docs: README event table, CHANGELOG 0.1.10, AGENTS.md (recordings may keep `_claude/rateLimit`; new failure texts get a kind).
