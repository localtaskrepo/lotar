- date: 2026-11-18T04:06:00.984217+00:00
  author: claude
  text: |-
    Review: blocking. A Codex usage limit now ends as `kind: other` with the text "Internal error", so the reason for the limit is gone from `error`.

    Reviewed harnessmux `agent/DEV-683` at HEAD `6377748` against `main` `0f7afe7`. lotar's own `agent/DEV-683` has no commits.

    **Blocking**
    - `src/failure.rs:61-67` (`Failure::from_acp_error`): when `data` is an object and not a string, the text is only `message`. codex-acp sends `{"code":-32603,"message":"Internal error","data":{"message":"You've hit your usage limit … try again at Nov 21st, 2026 9:36 PM.","codexErrorInfo":"usageLimitExceeded"}}`. The old code used the SDK's `Display`, which gives `Internal error: {…data…}`, so its text contained "usage limit". The new code gives `error: "Internal error"`, `kind: other`, `retryable: false`. This isn't rare: 52 of the `turn.failed` events in `~/.local/state/harnessmux/sessions/*.events.jsonl` have this shape, the most common failure there. DEV-584 would never pause these jobs.
      - Fix: when `data` is an object, take the text from `data.message` (or keep `message: data`, as `describe` does). Map `data.codexErrorInfo` (`usageLimitExceeded` → `rate_limited`, and the other values codex-acp sends). Add a recorded Codex usage-limit error that replays to `kind: rate_limited` in `tests/cli.rs`.

    **Checked, fine**
    - The previous review's findings are fixed: the CHANGELOG entry is under `## 0.2.0 (unreleased)`, and DEV-584's "Done when" has the bump and `TurnFailed { error, .. }` item. `6377748` differs from `98b9bf7` only in `CHANGELOG.md`.
    - Claude: `errorKind` and the `-32000` auth code come first, then the text. `resetsAt` becomes RFC 3339. `usage.rate_limit` comes from `_claude/rateLimit`. The replay test covers the rate limit and the auth failure.
    - The README, the AGENTS.md scrub rule (it keeps `_claude/rateLimit`, which holds no account data) and the MCP output agree with the code.

    **Reran in `~/.t3/worktrees/harnessmux/DEV-683`**
    - `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and `cargo nextest run` (56 passed) all passed. The worktree is still clean.
    - No UI work, so no UI review. repos.json has no install step for harnessmux.

    No minor tickets filed.
