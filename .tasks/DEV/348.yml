- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A2eb9a0af-3279-4c11-81b2-67ac1234fcb2
description: 'Found while merging DEV-343 (2026-11-11). tests/agent_automation_integration_test.rs:2465 ''runner failure should tag agent-failed'' fails about 1 run in 8, also on main without DEV-343 (checked at 2f4184a). Cause: after the hand-back the ticket is already HelpNeeded/Agent Tests, so wait_for_task_state returns at once, before the failed @test run has added the agent-failed tag. Check: cargo nextest run -E ''test(shipped_agent_reviewed_template_handles_hand_back_failure_review_and_merge)'' in a loop. Done: the wait includes the tag, loop of 30 passes.'
