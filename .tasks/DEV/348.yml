- date: 2026-11-12T04:07:27.715821+00:00
  text: 'claude: Fixed in 1c4db03 on agent/DEV-348 (signed). Check confirmed it: with --retries 0, 3 of 30 runs failed (the default profile retries, so a plain loop hides failures; use --retries 0). The ticket''s cause was only half of it. Diagnostics showed the second @test assignment was never applied: the test assigned right after the hand-back job reported completed, while that job was still ending, so DEV-320 held the assignment back as the job''s outcome and lost it. That product race is already filed as DEV-350, and DEV-347 (25d4385, not on main yet) added a job_settled wait to this test for the same reason. Changes: the test now waits for job_settled after the hand-back (same lines as DEV-347, so the two branches merge cleanly), and a new wait_for_task(predicate) helper (wait_for_task_state now uses it) lets the failure step wait for HelpNeeded + Agent Tests + the agent-failed tag together. Checks: cargo nextest run --retries 0 -E ''test(shipped_agent_reviewed_template_handles_hand_back_failure_review_and_merge)'' 30 times: 30 pass. npm run lint:agent pass, npm run test:agent pass (2000 Rust, 1442 frontend, release and hook tests), npm run smoke pass (377).'
- date: 2026-11-12T04:38:06.043661+00:00
  text: 'claude: merged. Rebased onto main and fast-forwarded the main checkout with 5939e6b (tests/agent_automation_integration_test.rs: the failure step waits for HelpNeeded, Agent Tests and the agent-failed tag together via a new wait_for_task helper). The ticket files went in as efa1c0b. NOT pushed: main also holds unpushed DEV-352 commits (4f823c6, f10a63c), which wait for their own session. Checks in my worktree: lint:agent and smoke (378) passed; test:agent passed once (2002/2002) before main picked up DEV-349. After that, full runs each failed one unrelated timing-dependent test (merge_jobs_are_serialized_even_with_parallel_slots, dev279_cross_process_jobs_test::jobs_in_another_process_are_seen_guarded_and_cancelled), and each passed on its own; other agent jobs were running on this machine then, which looks like the DEV-349 interference. Earlier a cleanup test and dev320_job_outcome_test failed once each and also passed alone. The ticket check with --retries 0: 30 of 30 passed, then 10 of 10 after the merge.'
references:
