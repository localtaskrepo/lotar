description: 'Found: Quality Assurance run 44032088895 (main 5181b1410, DEV-635) failed in `crates/lotar-core/src/utils/git.rs:372`: ''the hanging child 6080 is still running''. Locally the test passes (2302 Rust tests on 93bf6ed47). Likely cause: `kill -0` right after the kill also succeeds for a killed process that its new parent hasn''t reaped yet (a zombie). Check: `cargo nextest run -p lotar-core hanging_command_is_killed_at_the_timeout` repeated under load, and the next QA runs. Done: the test waits briefly for the child to disappear or checks that it is a zombie, and QA no longer fails on it.'
