- date: 2026-11-17T07:08:47.514767+00:00
  author: claude
  text: |-
    Fixed: the timeout tests no longer read a zombie or a not-yet-dead child as running.

    - Cause: `kill -0` succeeds for a SIGKILLed process until it is reaped (zombie), or while the signal is still being delivered
    - `crates/lotar-core/src/utils/git.rs`: new test helper `stops_running` polls `ps -o stat= -p <pid>` for up to 5s; gone or state `Z` counts as stopped
    - Applied to both `hanging_command_is_killed_at_the_timeout` and `child_holding_the_output_open_is_killed_at_the_timeout` (same pattern)
  report:
    commits:
    - hash: 1bdfc8370
      what: timeout tests wait up to 5s for the killed child to be gone or a zombie
    checks:
    - command: cargo nextest run -p lotar-core timeout_tests --stress-count 50 (8 busy loops)
      result: passed
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
      reason: 2302 Rust, 1548 frontend
    - command: npm run smoke
      result: passed
      reason: '405'
    - command: next QA runs on CI
      result: not_run
      reason: needs the merge
    next: Review, then merge; watch the next QA runs
- date: 2026-11-17T07:11:35.918909+00:00
  author: claude
  text: |-
    Review: blocking. The fix works for the flaky test, but now the second timeout test passes even when the kill is missing.

    - `crates/lotar-core/src/utils/git.rs:381`: `child_holding_the_output_open_is_killed_at_the_timeout` starts `sleep 3`. `stops_running` waits up to 5s, so an unkilled `sleep 3` exits on its own and the test still passes.
    - Evidence: in a scratch copy with the `libc::kill(-pid, SIGKILL)` line in `kill_process_group` (`git.rs:126`) removed, `hanging_command_is_killed_at_the_timeout` fails (good), but `child_holding_the_output_open_is_killed_at_the_timeout` passes. Before `1bdfc8370`, its immediate `kill -0` would have caught this.
    - Fix: make the sleep outlive the deadline, e.g. `sleep 30`. Verified in the scratch copy: with `sleep 30` the test fails without the kill and passes (0.3s) with it.
    - Otherwise fine: counting the zombie as stopped is right (on CI, PID 1 in a container may never reap it), and `ps -o stat= -p` behaves the same on Linux and macOS.
    - Reran: `cargo nextest run -p lotar-core timeout_tests --stress-count 30` with 8 busy loops: 30/30 passed. I did not rerun lint/test/smoke.
    - Scratch worktree removed; no files changed here.
