description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: S9.

  Create/update can persist tasks or sprint membership before later validation/write failures. Validate the complete operation first and provide atomic staging or rollback across task and sprint files under coordinated exclusion. Acceptance: invalid member/sprint or injected write failure leaves every affected file unchanged; retries do not create duplicates; successful task and sprint views agree. Preserve existing YAML and ordering. Scope: task_service.rs, sprint assignment/storage. This is not solved by DEV-53 lock acquisition safety alone.

  Related umbrella: DEV-53.
  Prerequisites/coordination: DEV-54.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
