- date: 2026-09-11T05:10:43.086789+00:00
  text: 'Plan (DEV-55 transactional task/sprint mutations): (1) Research current create/update paths in task_service, sprint_assignment/integrity, storage locks, SyncJournal precedent. (2) Design bounded coordinated transaction: deterministic lock order, full prevalidation (membership+config) before any write, staged writes with exact-byte backups, atomic publish, rollback on error, durable journal for crash recovery if warranted. (3) Preserve unknown YAML fields and member order; keep automation/events post-commit; no lock reentry. (4) Fault-injection + public-boundary regression tests (nextest, no git). (5) Docs sync (serve.md orphan-temp claim), review instruction-maintenance for obsolete DEV54 guidance. Limits: no arbitrary external editors, no full crash-atomicity claims beyond implementation.'
- date: 2026-09-11T05:21:47.894886+00:00
  text: 'Design (bounded, decided): (1) New storage::transaction MultiFileTransaction: acquires @sprints lock then per-project .task.locks (sorted) via extracted acquire_storage_lock; performs pending-journal recovery (fail-closed on corrupt/traversal/symlink/conflicting-edit; restores exact original bytes; deletes journal) before staging. (2) Stage writes with exact original bytes captured; deterministic order sprints -> project config -> task files; commit = durable journal (atomic write + dir fsync) -> atomic publishes -> journal removal + fsync; any publish error rolls back all files in reverse (restore bytes / remove creations) and returns error; rollback failure retains journal. (3) TaskService create/update: full prevalidation (enums, membership with in-memory auto-populated members, sprint existence) under coordinated exclusion; config auto-populate becomes staged write (never mutates on validation failure); automation/events strictly post-commit outside locks. (4) sprint_assignment::apply_assignment re-lists records under sprints lock and stages all sprint writes (force_single multi-sprint moves atomic); signature takes &mut Vec<SprintRecord> to write back fresh state. (5) sprint_integrity cleanup stages task+sprint writes in one txn (projects pre-scanned, locks sorted). (6) Sprint gains top-level extra_fields preservation like Task. (7) Fault injection: cfg(test) thread-local fail_publish_at under the transaction primitive only; unit tests prove midpublish rollback + crash recovery; integration tests cover public boundaries (invalid member/sprint, retry no duplicate, malformed YAML, concurrency). Limits to document: no full crash atomicity (rollback-based recovery on next participating mutation), config file writes remain unlocked against non-participating config commands, readers may observe intermediate states, lock dirs/files remain after rollback.'
- date: 2026-09-11T05:57:31.239954+00:00
  text: 'Implemented. Architecture: (1) New src/storage/transaction.rs MultiFileTransaction — acquires @sprints lock then sorted per-project .task.locks via extracted safety::acquire_storage_lock; recovers pending .txn-pending.json journals (fail-closed on corrupt/version/traversal/symlink/conflicting-external-edit; restores exact original bytes incl. non-UTF-8 via new safety::atomic_write_bytes; deletes journal); stages writes capturing exact original bytes (no-op writes skipped, duplicate staging rejected); commit = durable journal (fsync + unix dir fsync) -> atomic publishes -> journal removal. Publish failure rolls back all files in reverse (restore bytes / remove creations), removing the journal only when rollback fully succeeds; rollback failure retains the journal and errors with its path. Deterministic stage order: sprint files -> project config -> task file. (2) TaskService::create/update_with_context: full prevalidation (enums, review owner, job lock, membership against in-memory auto-populated config via new config::operations::plan_auto_populated_project_config, sprint existence via apply_memberships_to_records) before any publish; auto-populated project config is staged (never mutated on failure); update re-reads task+sprints under exclusion; automation/events strictly post-commit outside locks. (3) sprint_assignment::apply_assignment refreshes records under the sprints lock and stages all sprint writes (force_single multi-sprint moves atomic); signature now &mut Vec<SprintRecord> writing back durable post-commit state (call sites updated: CLI manage.rs, routes, MCP, automation_service, tests). (4) sprint_integrity::cleanup_missing_sprint_refs stages task+sprint writes in one txn (candidate projects pre-scanned for sorted lock order; task files staged sorted). (5) Sprint gains top-level extra_fields preservation like Task (schemars(skip) under schema feature). Fault injection: cfg(test) thread-local fail_publish_at under the transaction primitive only — no prod env bypass.'
- date: 2026-09-11T05:57:31.252633+00:00
  text: 'Verification: unit (src/storage/transaction.rs, 14 tests): commit/removal, no-op skip, midpublish exact-byte rollback incl. created files + binary originals + 0o600 perms, journal-write failure leaves files unchanged, crash-after-journal recovered by next begin, corrupt/traversal/symlink/conflicting-edit journals fail closed, staging outside-root/twice rejected, dropped-uncommitted writes nothing, cross-thread lock serialization. Service fault cases (tests/common/dev55_transaction_cases.rs): create midpublish failure rolls back task+sprint+config; update task-write failure restores published sprint bytes then retry lands; force_single midbatch failure keeps every membership then retry moves exactly once. Integration (tests/dev55_transactional_mutations_test.rs, 8): invalid sprint create leaves task/sprint/config unchanged (incl. REST /api/tasks/add boundary); strict-member update rejection leaves task+sprint bytes; failed create retry reuses id, single file, single membership; corrupted task YAML update leaves sprint bytes; success preserves unknown sprint fields (x_team_extension) and member order; 6-thread concurrent creates+assignments lose no memberships (18 unique files, sprint holds all, DTOs consistent). Broad: npm run test:rust = 896 passed, 6 skipped (1 documented agent-automation flake recovered on retry 3/3 — pre-existing DEV-48 serialization note). cargo clippy --all-targets --all-features -D warnings clean; cargo fmt --all --check clean; lib+schema feature builds clean. Docs: serve.md write-safety bullet corrected (orphan tmp files are NOT swept — matches safety.rs behavior) + transactional guarantees and precise limits documented.'
