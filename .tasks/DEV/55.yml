- date: 2026-09-11T06:24:16.518797+00:00
  text: 'Reopened per coordinator review; final closure deferred to coordinator gates. Review findings being fixed: M1 (journal recovery must run under the union of requested+journal-derived project locks, acquired deterministically under the sprints lock; staging must be provably inside held locks), L1 (cleanup lock coverage must fail closed / safe-retry when fresh state reveals unlocked projects, not just documented), L2 (parent-dir fsync errors propagated through publish/rollback/recovery; fault tests), L4 (cleanup caller records mutated before commit — write back only after success), M2 (define and test exact acknowledgment semantics around journal removal, incl. removal-rename failure vs root-fsync failure; no error-with-no-journal duplicate-retry trap), L3 (nonparticipating lock-taking writers refuse when a pending journal exists, checked after lock acquisition to avoid check-before-lock races; config writes without any lock stay a documented limit), production staging validates symlinked path components like journal recovery does. Harness: unique isolated TMPDIR for test runs, scratch consolidated under one owned subdir (DEV-90 tracks the gate finding).'
- date: 2026-09-11T06:40:36.242339+00:00
  text: 'Review fixes implemented and verified (DEV-55 stays InProgress pending coordinator final gates). M1: MultiFileTransaction::begin now derives the lock set as the UNION of requested prefixes and every project referenced by a pending journal — parsed and path-validated under the sprints lock (the only lock through which journals are created) — then acquires all project task locks in sorted order BEFORE recovery, so recovery can never restore a file whose lock is not held; sprint_assignment begin(&[]) therefore blocks on (or times out against) a concurrent comment-writer holding that project''s task lock. stage() additionally refuses writes outside @sprints/locked projects. L1: cleanup recomputes the authoritative project set under the locks via txn.ensure_covers(); on newly observed projects it drops the still-write-free transaction and retries with the union lock set (bounded 3 attempts, then fail closed) — no unlocked writes, no mere documentation. L2: parent-directory fsyncs now run per published rename and propagate (fault-proven), rollback and recovery restore-path fsyncs propagate, and a failed rollback retains the journal. L4: cleanup mutates only a local working snapshot; caller records are written back strictly after commit (fault-proven). M2: acknowledgement semantics defined and tested — journal-removal rename is the linearization point; if the rename fails the caller gets an error with the journal retained (next participating mutation rolls back, retry re-applies, no duplicates — tested end-to-end through TaskService); if the rename succeeds but the root fsync fails the commit is still acknowledged (Ok) so an error is never returned alongside removed-journal disk changes. L3: with_storage_lock now refuses nonparticipating writers (raw task edits/comments, direct sprint create/update/delete, scan creation) while a pending journal exists, checked after lock acquisition so no check-before-lock race exists; lock-less config writes stay a documented limit. Production staging now applies the same symlink-component validation as journal recovery and refuses the journal as a staging target. New tests: 9 primitive (recovery waits for journal project''s task lock incl. 2s timeout proof; begin unions locks; ensure_covers; symlink staging refusal; parent-sync failure rollback; failed journal removal retention + recovery + clean retry; removal-fsync-failure acknowledgement; 40-commit reader concurrency with parse checks) + 2 service fault cases (nonparticipating refusal then participating recovery; cleanup failure leaves caller records and files unchanged). Totals: 23 primitive + 5 service fault + 8 integration tests. Broad: npm run test:rust with isolated TMPDIR = 907 passed, 6 skipped (one nondeterministic nextest leaky flag on the known agent async test, informational, not a failure; no retries needed this run). clippy --all-targets --all-features -D warnings clean; cargo fmt --all --check clean. docs/help/serve.md updated with lock-union, refusal, and acknowledgement semantics. Harness: test TMPDIR isolated under the owned scratch subdir; earlier ws1-3 scratch siblings removed (DEV-90).'
- date: 2026-09-11T06:54:49.151494+00:00
  text: 'R1+R2 review fixes (DEV-55 remains InProgress for coordinator gates). R1 (error=>unchanged violated on journal-unlink failure): commit''s final remove_journal failure no longer returns Err with all files NEW — the published writes are rolled back immediately under the still-held locks, then journal cleanup is retried: unlink-retry success => Err with files already restored and journal gone; retry failure => Err with files already restored and the retained journal accurately describing that restored state (recovery = verify-noop + removal retry); rollback failure => journal retained, composite actionable error. Same immediate-unchanged ordering applied to the post-rollback cleanup path with explicit ''files restored'' messaging. Fault hook upgraded to fail_journal_removal_times(n) to prove both paths. New/updated tests: journal_removal_failure_rolls_back_immediately (asserts unchanged AT error return, journal absent — not merely after next retry), persistent_journal_removal_failure_retains_a_valid_journal (two failures => files restored at error + valid journal retained; third failure => begin fails closed with files untouched; then no-op recovery + clean commit), service case nonparticipating_writers_refuse_while_a_journal_is_pending reworked for the new semantics (failed update leaves task file already-restored with journal pending, raw edit refuses, participating update recovers and applies). R2 (misleading durability framing): chose the reviewer''s minimum-scope option — NO power-loss durability claimed on ANY platform. Module doc, remove_journal doc, and serve.md now state the Unix fsyncs are best-effort hardening rather than a proven durable-commit protocol, describe the exact post-acknowledgement resurrection window, and no longer imply Unix power-loss safety; ''rename'' wording corrected to unlink for fs::remove_file. No naive committed-marker was added. Verification (isolated TMPDIR under owned scratch subdir): 100 targeted tests + full npm run test:rust = 908 passed / 6 skipped, zero flakes; cargo fmt --all --check clean; clippy --all-targets --all-features -D warnings clean.'
