description: 'Lost in DEV-503 (owner asked to file it, 2026-11-14). 1) A profile of an agent runner can no longer set command/args (refused with a hint to harnessmux''s agents.toml). A per-profile override needs a small harnessmux API to add or replace one agent-table entry (AgentTable has no insert), then lotar maps the profile''s command and args onto it. 2) Usage lost detail: Copilot''s premium requests and lines added/removed, Claude''s count of model round trips (turns now counts lotar''s turns). Needs more usage fields in harnessmux''s events where the agents report them. Low value; do when touching harnessmux anyway.'
