description: |-
  Found: in the review of DEV-801, `smoke/tests/ui.agent-jobs.smoke.spec.ts` ('shows the prompt and settings a finished job ran with behind its Instructions button') gets a try/catch around `settings.waitFor` that dumps toggle and panel state, with the comment "Seen once under the full suite's load (DEV-801), never alone". The flake it targets (DEV-801 comment 11, DEV-832 merge 2026-11-25) predates DEV-875 (`cb61901d7`, test waits for the loaded log's header) and DEV-888 (the panel stays open across the remount), which found and fixed its cause.
  Check: `npm run -s test:smoke:quick:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts` and the full `npm run -s smoke` once the diagnostic is gone.
  Done: the diagnostic and its comment are removed (or, if the test fails again in a full suite after DEV-875, kept with a comment naming that failure); DEV-801's outcome credits DEV-875 for comment 11.
