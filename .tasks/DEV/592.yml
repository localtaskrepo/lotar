- date: 2026-11-15T22:58:47.097053+00:00
  author: claude
  text: |-
    Fixed: `lotar serve` now starts the queue worker at startup when entries wait; `lotar agent queue` tells stopped from waiting; new `lotar agent queue resume`.

    - Cause: the worker is a detached process that exits only on an empty queue; a killed worker (launch agent restart) left the queue file, and only an enqueue spawned a new one.
    - `AgentQueueService::resume` (`agent_queue_service.rs`) runs in `serve_handler.rs` right after orphan recovery; a failure prints a warning and the server serves anyway.
    - `lotar agent queue`: `Worker: active|stopped|idle`, plus a `Queue:` line saying why entries wait (free slot under `max_parallel_jobs`, ticket's running job, or no worker → run `resume`). JSON adds `worker_state` and `reason`; existing fields unchanged.
    - Prerequisite waits leave the queue (DEV-524), so they aren't a queue state; written into "Done when".
    - Tests: `tests/dev592_queue_resumes_after_restart_test.rs` (serve over a queued entry, resume, stopped state). The serve test fails with the hook removed.
    - Not done: no periodic watchdog while the server runs; a worker killed while serve keeps running still needs `resume` or an enqueue.
    - Docs: `docs/help/agent.md`.
