- date: 2026-11-16T00:10:05.201606+00:00
  author: claude
  text: |-
    Rework done: all three review findings fixed in amended `ed1eb876`.

    - **Exit code on worker-start failure:** `AgentQueueService::resume` returns `Err` only when the queue can't be read; a lock or spawn failure goes into `ResumeOutcome.error`. `agent queue resume` exits 0, prints a warning, JSON `worker_state: "stopped"` plus `error`. `lotar serve` warns and serves on.
    - **Temp leftovers:** the detached worker outlived the tests and wrote after the fixture was gone. `Workspace` now waits on drop until the worker is gone and no job runs; the guarded runner passes with no leftovers.
    - **Coverage added** (`dev592_queue_resumes_after_restart_test.rs`): empty queue at serve start → no worker; worker can't start (lock dir read-only) → serve warns and keeps running, `resume` exits 0 with `error`; running worker → `resume` leaves it alone (`started: false`, "already runs"); active reason "waiting for a free slot … max_parallel_jobs 1".
    - Docs: `docs/help/agent.md` mentions the failure case.
