- date: 2026-11-17T02:26:52.165689+00:00
  author: claude
  text: |-
    Fixed: `read_until_deadline` no longer panics when macOS refuses `set_read_timeout` on a closed socket.

    - `crates/lotar-lib/tests/web_api_integration_test.rs`: EINVAL (`InvalidInput`) from `set_read_timeout` is skipped; the read then returns the leftover bytes or 0. Other errors still panic with a message.
    - New test `read_until_deadline_returns_eof_on_a_socket_shut_down_both_ways`: shuts the socket down both ways, which makes macOS return EINVAL every time. With the old `.unwrap()` it fails with the ticket's `Os { code: 22 }` panic; with the fix it passes.
    - Commit `ecbe7036`
