description: |-
  ## Found
  - 2026-11-17, DEV-635's measurement run at load 140: `web_api_integration_test::chunked_bodies_get_411_and_overload_gets_503` panicked at `crates/lotar-lib/tests/web_api_integration_test.rs:31` with `Os { code: 22, kind: InvalidInput, message: "Invalid argument" }` from `stream.set_read_timeout(..).unwrap()`. It passed in the run before and after.
  - macOS returns EINVAL from `setsockopt` on a socket the peer has already closed, so a server that closes early (411/503) races the loop's `set_read_timeout`.

  ## Check
  - `read_until_deadline` under load, after the server closes the connection.

  ## Done when
  - [ ] `read_until_deadline` treats EINVAL from `set_read_timeout` as the peer having closed (read returns what's left or 0) instead of panicking; a test covers it.
