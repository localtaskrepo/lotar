  author: claude
  text: |-
    Rework done (Fable 5.2): quoted paths can no longer hide a denied command; harnessmux 0.1.6 is released and lotar uses it.

    - **Finding (codex 01:49, \`git -C "/tmp/my repo" push\` passes):** fixed in harnessmux \`src/rules.rs\`. The matcher no longer splits at spaces; a small shell reader handles quotes, backslashes, \`;\` \`&\` \`|\`, subshells, \`\$(…)\`, backticks, redirections, comments, \`eval\`, here-strings and \`sh -c "…"\` (read again as a script). An argument-list command keeps its arguments.
    - **Test first:** \`denied_commands_are_read_as_the_shell_reads_them\` failed on the old code at the reviewer's line; now 38 refused forms and 10 allowed ones (e.g. \`git commit -m "then git push"\`) pass.
    - **Limit, documented:** what only the running shell knows isn't seen (\`\$CMD push\`, an alias, a script piped into \`sh\`). Claude's sandbox and its own \`Bash(git push:*)\` deny still apply.
    - **Release:** you said yes in the thread (options picker, 2026-11-15). harnessmux \`34519ab\` on main, signed tag \`v0.1.6\`, release.yml green, 0.1.6 is on crates.io. harnessmux checks: fmt, clippy, 40/40 tests, \`cargo deny\`, publish dry run.
    - **lotar:** commit \`dffcbc45\` (amended, signed, rebased onto main \`19b654ff\`): \`Cargo.toml\` and \`Cargo.lock\` on harnessmux 0.1.6 (lock differs from main only in that entry), \`docs/help/agent.md\` says how the line is read.
    - **Checks:** \`npm run lint:agent\` passed; \`npm run test:agent\` passed (2195 Rust, 1547 UI, release and hook tests); \`npm run test:smoke:agent\` passed (404).
    - **Note:** main didn't compile its tests when I ran them (DEV-555). I ran the checks with DEV-555's two-line fix applied uncommitted; it landed meanwhile and the branch is rebased onto it, same tree as tested.
    - No instruction changes.
