description: |-
  Found in the DEV-600 review (`af2e42f2`).

  - `crates/lotar-lib/tests/dev503_harness_jobs_test.rs:689` asserts one `AgentQueueService::remove(...)` returns true ("the entry still waits").
  - The queue worker (`agent_queue_service.rs`, `run_worker` loop) dequeues the entry on every 300 ms retry, calls `start_entry`, then `requeue_entry_unchanged`. A `remove` that lands in that gap finds no pending entry and returns false.
  - Seen once in about 40 runs of the dev503/queue tests (`cargo nextest run --workspace -E 'test(/dev503_harness_jobs_test|dev522|dev592|queue/)'`), 6.3 s instead of the usual 2.4 s; passes alone and in the full suite. The panic message wasn't captured, so the cause above is the likely one, not proven.

  ## Done when
  - [ ] The test removes the entry with `wait_for` (retry until `remove` returns true) or otherwise can't race the worker's dequeue.
  - [ ] The test passes 30 stress runs under load (`--stress-count 30` beside the rest of the dev503 tests).
