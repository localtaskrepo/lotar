- date: 2026-11-16T21:44:28.013818+00:00
  author: claude
  text: |-
    Fixed: the test retries `remove` until it returns true, so it can't race the worker's dequeue.

    - Option A was moot: DEV-600 had already merged (`804cb0f9`), so the fix sits on top of main
    - `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: `assert!(remove(...))` → `wait_for("the waiting entry's removal", || remove(...))`
    - Stress run: `a_queue_entry_held_by_a_waiting_thread_says_so_once` passed 30 of 30 iterations
    - Iteration 30 (load ~110) timed out two other tests, and `Harness::drop` panicked again while unwinding (SIGABRT): filed as DEV-625
