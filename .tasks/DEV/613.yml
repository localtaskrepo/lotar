  text: |-
    Question: the test only exists on `agent/DEV-600` (Merging, not on main). Where should the fix go?

    - The race is real: `run_worker` dequeues the entry, `start_entry` runs `t3 thread show`, then requeues it. A `remove` in that gap returns false (`agent_queue_service.rs` on `agent/DEV-600`).
    - Fix (one line, test only), at `dev503_harness_jobs_test.rs:689`: `wait_for("the waiting entry's removal", || AgentQueueService::remove(&tasks_dir, "TEST-1").unwrap());`
    - `agent/DEV-613` (from main) can't hold it: a cherry-pick of `af2e42f2` onto main conflicts in the test file and `docs/help/agent.md`. Resolving that is the DEV-600 merge job's work. No DEV-600 merge job runs yet; its worktree is clean.
    - **A (my pick):** I commit the line on `agent/DEV-600`, so it lands with DEV-600's merge. Then this ticket is Done.
    - **B:** wait until DEV-600 is on main, then rerun this fix from main.
  report:
