    Review: passed. `d973e73b` does what "Done when" asks and still tests an explicit `--port` / `-p`.

    - Read: the commit's own diff (`git diff main...HEAD`, 1 test file), the ticket, `bind_server_socket` in `serve_handler.rs` (an explicit port never falls back, so the `Failed to bind … :<port>` match is the right retry trigger), and the two later commits on main to this file (`f0350293`, `a7715fae`). `git merge-tree` against main: no conflicts.
    - `cargo nextest run --cargo-profile local cli_serve_features_test::`: 16/16 passed.
    - Ticket check, 20 parallel runs at `--test-threads 15`: no requested-port failures. 9 runs failed in `serve_honors_explicit_tasks_dir_for_api_requests`, the DEV-624 timeout. Its fix `a7715fae` is on main but not in this branch's base, so it doesn't count against this change.
    - Failed before: with `ATTEMPTS = 1` the new test fails with `Address already in use`. I put the file back afterwards.
    - `rustfmt --check` and `cargo clippy --profile local -p lotar-lib --tests -D warnings`: clean.
    - No stray files, nothing for the owner to decide. No tickets filed.
