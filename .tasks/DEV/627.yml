- date: 2026-11-16T23:54:29.864615+00:00
  author: claude
  text: |-
    Fixed: requested-port tests retry with a fresh port when another process takes the reserved one first.

    - New `spawn_serve_on_requested_port` in `crates/lotar-lib/tests/cli_serve_features_test.rs`: up to 5 attempts, retries only on `Failed to bind` naming that port; any other early exit still panics
    - `serve_reports_requested_port_exactly` and `serve_short_port_flag_sets_requested_port` use it, so both still test an explicit `--port` / `-p`
    - New test `requested_port_retries_when_the_reserved_port_is_taken_first` holds the first port with a live listener; it fails with 1 attempt (`Failed to bind to 127.0.0.1:57352 ... Address already in use`) and passes with the retry
    - Ticket check: 20 parallel runs, 0 requested-port failures. 2 runs failed in `serve_honors_explicit_tasks_dir_for_api_requests` with status 0 (1.5 s read timeout), which is DEV-624, not filed again
    - The disk is full (`df`: 250 MB free). I removed only this worktree's own `target/` and built against the main checkout's `target/` (`--cargo-profile local`, `RUSTC_WRAPPER=` because sccache failed with exit 254)
