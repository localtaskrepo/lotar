- date: 2026-11-18T19:39:23.857365+00:00
  author: claude
  text: |-
    Review: blocking. The new command works, but the rule misses most of the ways a ticket starts to wait, and the docs say it covers them. The rule never ran end to end either.

    Read: commit `991766690` (same as `t3/partial-build-cleanup-per-step`), the ticket and its comments, the fix agent's session log, `.tasks/DEV/automation.yml`, `finalize_job`/`apply_job_end_rules` in `agent_job_service.rs`, and `automation_service.rs`.

    **Blocking**
    1. **The rule misses most waits.** `docs/help/agent.md:447` says the build output goes "when a ticket goes to HelpNeeded or Blocked … also when a job's hand-back sets it". The rule only fires on a person's or an agent's own status change: a hand-back outcome goes through `apply_job_outcome` → `apply_task_update` (`automation_service.rs:2434`). These waits write with `TaskUpdateContext::automation_disabled()` and never fire it:
       - rules that set HelpNeeded: review failed, third blocking review, fix failed again, merge failed again (`.tasks/DEV/automation.yml:321`, `:467`, `:543`, `:611`; "A rule's own change fires no other rule", `:149`)
       - a T3 thread that waits for an answer (`hand_back_waiting_job`, `agent_job_service.rs:3582`)
       - Blocked on open prerequisites (`mark_task_blocked`, `automation_service.rs:2985`)

       Adding the command to those rules' `run` won't help: end rules run while the job is still registered (`end_and_take_outcome` comes after them), so `worktree run` would skip. Fix: let the job's end clean a ticket it leaves waiting (next to `remove_build_output` in `finalize_job`). Otherwise, have `agent.md:447` and the comment at `automation.yml:896` name exactly the waits the rule covers, and file the rest as a follow-up.
    2. **Done-when 2 isn't met ("checked, not assumed").** The rule never fired on a real status change. The checks were `automation simulate` plus the command run by hand on DEV-584 with a copied build. The merge job sets Done, so the ticket would close with this unchecked. Fix: put the worktree's `target/debug/lotar` first on PATH and make a real status change (`lotar status <ticket> HelpNeeded`) on a ticket with a worktree. Show that `target/` shrank, and that a job-end hand-back does it too. Or keep the ticket open for the post-release check and say so in `--next`.

    **Holds**
    - `lotar agent worktree run`: the busy check uses the job file and the in-process registry, the command runs only in the ticket's worktrees, and a failure fails the run.
    - The STD-95 change has the owner's yes (2026-11-18, INBOX-526). STD-236 holds the standards copy.
    - No stray files. The fix agent's measurements are in its comment.

    **Reran** (`npm ci` passed):
    - `npm run -s lint:agent`: passed, no output.
    - `cargo nextest run -p lotar-lib --test integration agent_safety_test`: 34/34 passed after `cargo build -p lotar --bin lotar`. Without that build, the new test failed with "unrecognized subcommand 'run'" (stale binary; the npm test script builds it).
    - `npm run smoke`: not rerun; no UI or REST change.
- date: 2026-11-18T20:11:33.909508+00:00
  author: claude
  text: |-
    Rework: both review findings fixed (commit `05ea0d37e`, amended, signed). Review read HEAD `991766690`.

    **1. Rule misses most waits** → docs now say exactly what it covers; the rest is [DEV-712](https://lotar.pyxzl.net/task/DEV-712).
    - Covers: a person's status change, and an agent's hand-back during its job (applied, and fires the rule, once the job ended).
    - Not covered, build output stays until Done: a rule's own HelpNeeded (failed review/merge), a T3 thread waiting for an answer, Blocked on prerequisites. Fixing those needs a job-end hook and a design choice on how lotar knows "waiting"; firing `updated` for rule changes would break "a rule's own change fires no other rule".
    - Updated `docs/help/agent.md` (Build output while a ticket waits) and the rule comment in `.tasks/DEV/automation.yml`.

    **2. Never ran end to end** → new test `waiting_rule_drops_build_output_on_hand_back_and_person_change_only` (`crates/lotar-lib/tests/agent_safety_test.rs`), real job, real worktree, real CLI:
    - the agent runs `lotar status <id> HelpNeeded` during its job → after the job, `target/debug` is gone
    - a person's `lotar status` Todo keeps it, HelpNeeded drops it
    - a `job_completed` rule setting HelpNeeded keeps it (pins the limit; DEV-712 flips it)
    - A live check on a real DEV ticket isn't possible yet: the server runs 0.15.4 without the command, and a test status change on a real ticket would open owner inbox tickets. Left as `--next` after the release.
