  author: claude
  text: |-
    **Waiting rule built** (commit 991766690, branch `t3/partial-build-cleanup-per-step`, not merged).

    - New `lotar agent worktree run <TICKET> -- <cmd>`: runs a command in the ticket's agent worktrees. It runs nothing if a job runs for the ticket or there is no worktree.
    - Rule in `.tasks/DEV/automation.yml`: on HelpNeeded/Blocked → `cargo clean --workspace` (keeps dependencies).
    - Docs: `agent.md` (new section), `automation.md`.

    **Measured**
    - `target/` 3.4 GB → 0.7 GB in ~1 s (incremental and lotar crates gone, deps kept).
    - Resume rebuild (`cargo build --bins --tests`): 55 s, with the Mac under heavy load (load 77).

    **Real tickets**
    - DEV-584 (HelpNeeded): cleaned 2.7 GiB in 1.06 s. I had copied a build into its worktree for the test, and I removed it afterwards.
    - DEV-653 itself: skipped, since its job is running.

    **Live:** this needs a lotar release. The server's 0.15.4 doesn't know the command, so it fails, and `ignore_failure` swallows that.
    **Standards copy:** [STD-236](https://standards.pyxzl.net/task/STD-236), Blocked until this lands.
