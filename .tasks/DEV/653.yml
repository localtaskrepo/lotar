    - [DEV-714](https://lotar.pyxzl.net/task/DEV-714): "Done when" 2 (rule run on a real ticket) only runs after a release that has `agent worktree run`. That check now lives in DEV-714, Blocked on this ticket, so it isn't lost when this ticket goes Done at merge.
