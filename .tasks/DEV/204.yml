description: |-
  When a ticket has an image attached we don't use that anywhere to style things up.
  - Previews could be part of the ticket card like in the calendar of board
  - Lists could have icons based on the attached media or previews
  - Display filters can toggle this on or off
  - In the ticket details pane we could show a preview as well instead of just a file name
