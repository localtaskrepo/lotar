- date: 2026-11-17T00:59:17.676750+00:00
  author: claude
  text: |-
    No code change: the job failed because the disk was full, not because of the dirty worktree.

    - All three t3 jobs started at 00:08 (`job-20261117T000834.721Z-1` DEV-613, `...835.458Z-2` DEV-628, `...836.539Z-3` DEV-612) failed with the same `git worktree add failed`. DEV-628 and DEV-612 had no dirty worktree.
    - DEV-628's log the same second: `No space left on device (os error 28)`. The disk has 190 GB free now.
    - Jobs that got this same "uncommitted changes, which LoTaR leaves alone" refusal started their new thread fine: `job-20261115T191140.785Z-9` (DEV-572), `job-20261115T215558.036Z-74` (DEV-585). T3 Code puts the new thread on a `t3/<id>` branch of its own, so the held `agent/<ID>` doesn't block it.
    - First step for DEV-613 is done: its one-line fix is committed, signed, on `agent/DEV-613` as `51144732`.
  report:
    checks:
    - command: start a fix job on a ticket whose branch worktree has uncommitted changes
      result: not_run
      reason: would start a real agent job; DEV-572 and DEV-585 logs already show it working
    next: 'None: DEV-613 continues from 51144732'
