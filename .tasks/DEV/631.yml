description: 'Found: DEV-613 job-20261117T000834.721Z-1 (`lotar agent logs job-20261117T000834.721Z-1`). LoTaR leaves the dirty worktree `agent-DEV-613-435bae192ccea1c1` alone and starts a new T3 thread on `agent/DEV-613`; `git worktree add` fails because the branch is checked out in that worktree. Check: start a fix job on a ticket whose branch worktree has uncommitted changes. Done when: that job continues in the existing worktree (or commits the change) instead of failing. First step for DEV-613: the uncommitted one-line fix in that worktree (`dev503_harness_jobs_test.rs`) gets committed, signed, on `agent/DEV-613`.'
