description: |-
  Part of the owner's route B on DEV-901 (2026-11-26, INBOX-805): besides fix and research jobs in dyson's T3 Code, the profiles lotar runs through harnessmux (`review`, `review-claude`, `review-light`, `triage`, `triage-codex`) run on dyson over ssh. `merge` stays on the Mac. Builds on DEV-901's `agent.hosts`, placement, wake, worktree push/fetch/re-sign and ticket socket.

  A profile's `command`/`args` already replace the adapter command (`crates/lotar-agent/src/services/agent_runner.rs` `with_profile_command`).

  ## Done when
  - [ ] Config: `host` is accepted on `t3`, `claude` and `codex` profiles; on any other runner (`command`, `copilot`, `amp`, ...) and on `merge` it is refused when the config loads, as today for `command`.
  - [ ] Placement, hours, `max_jobs`, wake and the expected-duration rule are DEV-901's, unchanged. Before a `claude`/`codex` job goes there, the host has to answer over ssh and have `python3` and the agent's CLI (`claude` or `codex`; `npx` too when the agent runs its pinned adapter) on its login PATH; no `t3` version check for these runners. A host that fails it keeps the job on the Mac with the reason in the queue (`dyson: codex is not on its PATH`), as DEV-901's probe does.
  - [ ] Launch: the agent runs as `ssh -T -o ControlMaster=no -o ControlPath=none <DEV-901's BatchMode/ConnectTimeout/ServerAlive options> <target> -- sh -lc 'cd <worktree> && exec env <profile env> python3 -c <guard> 10 <agent command>'`. A login shell, as DEV-901's ssh commands use, so PATH has the CLIs. `<agent command>` is the profile's own `command`/`args` when set (they win over the agent's default, and still go through ssh), else the pinned adapter as `npx --yes --package=<npm>@<version> -- <bin>`, else the table's command. The env is the agents.toml `env` and the profile's `env`; not the job's Mac-only variables (`PATH`, `LOTAR_BIN`, `LOTAR_TASKS_DIR`).
  - [ ] Worktree and commits: DEV-901's push, worktree at the same path, bring-back and re-sign, also when the thread waits for an answer. No `t3 project add`, `.claude/settings.local.json` or `.mcp.json` for these runners: their rules and tools go through the ACP session as on the Mac.
  - [ ] Tickets: with the profile's `mcp.lotar`, the agent gets lotar's MCP server as `python3 -c <bridge> <socket>` on dyson, connected to DEV-901's forwarded socket and the server on the Mac; never `lotar mcp` on dyson. The prompt gets DEV-901's "Agent host" note. Without `mcp.lotar` the note says to report ticket changes in the last message.
  - [ ] Disconnect or stop: the guard starts the agent in its own process group and passes stdin/stdout through. When stdin closes (the ssh connection broke, or lotar closed or killed the session), or the guard gets SIGHUP/SIGTERM, the group gets SIGTERM, then SIGKILL after 10 s. When the agent exits by itself, what is left of its group gets the same. No T3 thread stop for these runners.
  - [ ] A setup that fails runs the job on the Mac once a slot frees, as DEV-901 does.
  - [ ] Tests with a fake ssh cover the launch line (profile `command` wins, adapter, env), the guard's SIGTERM-then-SIGKILL on a closed stdin, the probe for these runners and the config check; docs/help (`agent.md` "Agent hosts", `config-reference.md`) names the runners `host` works for.
  - [ ] Out of this change: giving the standards profiles (`~/Development/standards/configs/lotar/agents.yml`) `host: dyson` and `mcp.lotar`, once DEV-901's dyson verification has run. `triage-codex` gets a host only after codex is signed in on dyson (LOCA-631; it wasn't on 2026-11-26).
