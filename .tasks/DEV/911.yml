- date: 2026-11-27T11:12:13.866105+00:00
  author: claude
  text: |-
    **Done**: `host` now works on `claude` and `codex` profiles too.

    - **Probe**: ssh plus `python3`, the agent program, and `npx` + CLI for the adapter (`dyson: codex is not on its PATH`)
    - **Launch**: `ssh -T ... -- sh -lc 'cd <worktree> && exec env <env> python3 -c <guard> 10 <cmd>'`
    - **Env**: agents.toml + profile env only, no Mac PATH or LOTAR_*
    - **Guard**: own process group; closing stdin, SIGHUP or SIGTERM sends TERM, then KILL after 10 s; leftovers are stopped too
    - **Host setup**: no `t3 project add` and no settings files for these runners; `mcp.lotar` uses the ssh socket bridge
    - **Threads**: T3 thread stops apply only to t3 jobs
    - **Tests**: fake ssh (probe, setup, launch line, stdio passthrough, TERM→KILL, leftovers)
    - **Docs**: agent.md and config-reference.md
