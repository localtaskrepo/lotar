- date: 2026-11-27T11:17:05.698285+00:00
  author: claude
  text: |-
    Review: passed. `7ecdf8f50` does what "Done when" asks. One minor follow-up is filed as [DEV-931](https://lotar.pyxzl.net/task/DEV-931).

    - **Read**: the diff of `main..HEAD` (7 files), the ticket, DEV-901 and its decisions, AGENTS.md, and harnessmux 0.5.0 `AgentSpec`/`launch_command`. Also the callers of `job_agent_table` and `resume_session_to_end`.
    - **Config**: `validate_agent_hosts` accepts `t3`, `claude` and `codex` and refuses other runners and `merge`. Tested.
    - **Probe**: `Check::Programs` asks for `python3`, the command's program, and `npx` plus `requires` for the adapter. It is cached per program list, and a refusal keeps the job on the Mac.
    - **Launch**: `ssh -T -o ControlMaster=no -o ControlPath=none <BatchMode…> <target> -- sh -lc 'cd … && exec env … python3 -c <guard> 10 …'`. The profile's `command` wins, else `npx --yes --package=…`. The env is the table env plus the profile env, and the local `spec.env` is taken out.
    - **Guard**: own session, then TERM and KILL after the grace on EOF, SIGHUP, SIGTERM or the agent's own exit. The exit code is passed on.
    - **Host setup**: no `t3 project add` and no settings files. `mcp.lotar` gives the session the ssh socket bridge. The "Agent host" note covers both cases.
    - **Reran**: `npm ci` passed. `cargo nextest run -p lotar-agent -p lotar-core -E 'test(/hosted|agent_hosts|headless|guard|probe|an_unknown_host/)'`: 29 passed. `npm run lint` passed.
    - **Minor, filed as DEV-931**: a lotar restart mid-job resumes a hosted claude/codex session with the Mac's table (`agent_job_service.rs:2568`, `resumed_on_host` is t3 only, `attach` has `thread: true`), so the host's commits don't come back. A job waiting for an answer leaves uncommitted changes on the host. Review and triage rarely write files, so the merge can go ahead.
