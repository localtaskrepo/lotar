  text: 'Backlog reconciliation: Remains Todo for config-stored tag colors. Existing generic styling is not persisted per-tag configuration. Define global/project inheritance, missing-color fallback, contrast, and compatibility with existing string tag lists before implementation.'
- date: 2026-09-06T13:12:54.133770+00:00
  text: |-
    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 21: Allow tags to be assigned a color (Store it in the project config under tags, but keep it backwards compatible)
- date: 2026-10-28T03:36:38.495694+00:00
  text: 'Done. Format (developer chose nested): issue.tags entries are plain names or objects { name, color, ...more later }; loading splits them into tag_properties so tags stays a name list (REST/UI shape additive), writing folds them back (wildcard lists take coloured tags as objects). A project that inherits the tag list uses issue.tag_properties. Global and project merge per tag, project wins. Colours: #rgb, #rrggbb or 17 names; unknown values show uncoloured and config validate warns; unknown keys are preserved. CLI: config set tag_properties accepts a YAML/JSON map or ''ui=#0ea5e9, backend=teal''; config show lists them. UI: coloured chips (tint + border + dot, theme text colour) in task list, board, sprints, hover cards and task panel, fed by the per-project config the completion-policy cache already fetches; Config page ''Tag colours'' editor (name with suggestions, picker, named colours, live preview, project page shows global colours). Docs: config.md Tag colours, config-reference. Verified: npm run lint, npm test (1820 Rust incl. config_tag_properties_test, 1292 UI, 33 release), npm run smoke 361 (new ui.tag-colors), screenshots light/dark/Terminal/390px. Also: ticket-screenshot.mjs now picks the first visible match.'
