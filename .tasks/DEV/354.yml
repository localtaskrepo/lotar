- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A828833fb-19d7-42f5-a803-6c894fccc805
description: 'Found by DEV-352 (claude, 2026-11-11): in a full npm test run (cargo nextest, machine also running other worktrees'' suites), sse_debounce_emits_all_events, sse_debounce_zero_and_invalid_kind_handling, sse_events_with_kinds_and_project_filter and sse_includes_triggered_by_identity failed at tests/web_api_integration_test.rs:152 (http_post_json_with_origin: stream.read(...).unwrap() returned WouldBlock, os error 35) because net_timeout() is 500 ms or 1.5 s; all 9 sse_ tests passed when rerun alone. Check: cargo nextest run --no-fail-fast passes these tests repeatedly under full-suite load. Done when the POST helper waits for the response the server actually sends (read timeout as a deadline long enough for a loaded machine, not a fixed short budget), with the test still failing fast on a real hang.'
