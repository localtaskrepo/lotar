description: 'Found (DEV-643, 2026-11-16, load ~75): `cleanup_done_ticket_worktree` and `maybe_cleanup_worktree` in `crates/lotar-lib/src/services/agent_job_service.rs` hold `JOB_REGISTRY` while they run `git worktree remove` and other git commands; `sample` of the worker showed ~15 threads waiting on the mutex while one `git worktree remove` ran 38 s. DEV-643 moved the task update''s registry lookup out of the storage locks, so CLI writes no longer fail, but job threads still stall. Check: under load, time job events while a done ticket''s worktree is removed. Done: the registry is held only for the in-memory check, not across git.'
