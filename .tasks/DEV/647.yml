- date: 2026-11-17T04:39:18.335444+00:00
  author: claude
  text: |-
    Review: passed. Cleanup now holds `JOB_REGISTRY` only for the in-memory check; git runs under a per-ticket claim. That is what "Done" asks.

    - Reviewed `7303c2302`: `crates/lotar-lib/src/services/agent_job_service.rs` (`CleanupClaim`, `cleaning` set, `CLEANUP_FINISHED` condvar) and the new test in `crates/lotar-lib/tests/agent_safety_test.rs`
    - Locks: every claim drops after its registry guard, so `Drop` can't deadlock. `maybe_cleanup_worktree` drops its claim before it calls `cleanup_done_ticket_worktree`, so it doesn't wait on its own claim. Nothing under a claim calls `start`
    - Same-ticket safety still holds: `start` waits on the condvar. Queued jobs are already in `active_by_ticket`, so cleanup sees them as busy. The cross-process check (`for_ticket_elsewhere`) is unchanged
    - `remove_build_output` was also in scope: before the fix it ran `git rev-parse` and moved files while holding the lock
    - The test fails on the old code: in a detached copy with the old `agent_job_service.rs` it panics at `agent_safety_test.rs:952` (registry blocked)
    - Reran `cargo nextest run --cargo-profile dev --retries 0 --workspace agent_safety_test`: 30/30 passed. The new test passed 5/5 alone. `cargo clippy --workspace --all-targets -- -D warnings`: clean
    - Not rerun: `npm test`, smoke and the ticket's load check (timing job events at load ~75)
    - For the merge: the branch still carries `bb7cc8371`, a pre-rebase copy of DEV-633. Its code matches `9c10760fa` on main, but its `.tasks` files conflict. Cherry-pick or rebase only `7303c2302`, which applies cleanly on main
    - No minor findings, nothing filed
