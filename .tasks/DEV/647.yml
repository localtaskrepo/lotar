- date: 2026-11-17T03:44:30.221745+00:00
  author: claude
  text: |-
    Fixed: worktree cleanup no longer holds the job registry while git runs.

    - Cleanup takes a per-ticket claim (`JobRegistry.cleaning` + `CLEANUP_FINISHED` condvar) under the lock, then releases the lock for `git worktree remove`, branch deletes and archiving
    - Applied in `cleanup_done_ticket_worktree`, `maybe_cleanup_worktree` and `remove_build_output` (that one also ran git under the lock, in `build_output_removable`)
    - `start` waits on the condvar while the ticket is claimed, so a job still can't start in a worktree being removed; other tickets' jobs go on
    - New test in `crates/lotar-lib/tests/agent_safety_test.rs`: a fake `git` on `PATH` pauses `worktree remove`; the registry stays free and a start for the ticket waits. It fails on the old code
    - Ticket's load check (timing under load ~75) not rerun as-is; the test covers the same lock path
