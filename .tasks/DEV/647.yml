- date: 2026-11-17T05:15:44.261807+00:00
  author: claude
  text: |-
    Review: passed. The registry is now held only for the in-memory check, not while git runs, which is what "Done" asks for. Nothing blocks the merge.

    - **Read:** commit `7303c2302`; the ticket and the earlier fix and review comments; the cleanup callers (`finish_job`, cancel, `cleanup_done_worktrees`, `task_service.rs:1444`); job start (`start`, `process_pending_queue`, `adopt_orphaned_job`); new commits on main to `agent_job_service.rs` (`e39ca4b31` DEV-626, `11c077fe6` DEV-630).
    - **Lock:** every `CleanupClaim` drop runs after its registry guard is gone, so its `Drop` can't deadlock. `start` waits on the condvar, which releases the mutex while it waits. Queued jobs are in `active_by_ticket`, so cleanup still skips their ticket.
    - **On current main:** `7303c2302` cherry-picks cleanly onto `11c077fe6`. In a scratch copy, which I've since removed:
      - `cargo nextest run --workspace --retries 0 agent_safety_test`: 30/30 passed
      - `-E 'test(/agent/)'`: 212/212 passed
      - `cargo clippy --workspace --all-targets -- -D warnings`: clean
    - **Test failed before the fix:** the earlier review confirmed this. I didn't rerun it.
    - **Not rerun:** full `npm test`, smoke, and the ticket's own check (timing job events at load ~75).
    - **For the merge agent:** land only `7303c2302`. `bb7cc8371` is an old copy of DEV-633, and its `.tasks` files conflict with main.
    - No minor tickets filed.
