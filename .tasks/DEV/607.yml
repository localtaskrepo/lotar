description: |-
  `smoke/tests/ui.global-actions.smoke.spec.ts` > "keeps actions usable and creates in the known project on desktop" timed out again in a full `npm run test:smoke:agent` run, after DEV-597 was marked Done.

  ## Found
  - 2026-11-15, DEV-593 merge, worktree `t3-9345ff07`, commit `01894368` (Rust-only change, no UI).
  - `locator.click: Timeout 30000ms exceeded` on the Create task dialog's "Close panel" button, line 120; Playwright log: "element is not stable", retried until the timeout.
  - 1 failed / 404 passed. The same file alone (`npm run test:smoke:quick:agent -- smoke/tests/ui.global-actions.smoke.spec.ts`) passed 2/2, and three other full runs that day passed 405/405.

  ## Done when
  - [ ] The test waits for the panel to finish its open transition (or closes it in a way that doesn't need a stable box) so a slow full-suite run can't time out here.
  - [ ] Several full smoke runs under load pass this test.
