- date: 2026-11-16T04:36:40.029975+00:00
  author: claude
  text: |-
    Fixed: the test now closes the Create task panel without waiting for a stable box.

    - `smoke/tests/ui.global-actions.smoke.spec.ts`: the route loop's Close panel uses `dispatchEvent('click')` instead of `click()`. It runs the button's own handler (`requestClose`), so a panel still sliding in (`task-panel` transition, `translateX(40px)`) can't stall it; `waitFor({ state: 'detached' })` still checks it closed.
    - 5 full smoke runs passed 405/405, 4 of them with lint and `npm test` running at load 70–93.
    - Other smoke files use the same `Close panel` `click()` pattern but haven't flaked; left as they are.
