    Fixed: the test no longer races the agent queue.

    - Cause: assigning `@copilot` queues a job; the worker gives up on `fake-runner` after 4 tries and comments, sometimes after the last `freeze`.
    - Reproduced: a 10 s sleep before the last `assert_frozen` failed every time on the give-up comment.
    - Fix: `NoopCliEnv::lotar()` in `crates/lotar-lib/tests/cli_noop_mutations_test.rs` sets `LOTAR_AGENT_QUEUE_DISABLE_WORKER=1`, as the other queue tests do. The job stays queued in the isolated queue dir and never starts. With the sleep left in, the test passed.
    - Fixed the doc comments that said assignment launches nothing.
