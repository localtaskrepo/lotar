description: |-
  Found (DEV-727 merge, 2026-11-20): `npm run -s test:agent` failed in 2 of 4 full runs at `crates/lotar-lib/tests/cli_noop_mutations_test.rs:307` ("unregistered human @-alias and case variants: task YAML bytes must be preserved"); alone it passed 5 of 5. The test assigns `@copilot` with a fake profile (`copilot: fake-runner`) and assumes that launches nothing, but the assignment queues a job; the queue gives up after 4 tries and adds the comment 'The queued @copilot job did not start after 4 tries and left the queue: Validation error: Unsupported runner ''fake-runner''' (DEV-661) to the ticket, sometimes after the test's last `freeze`, so the bytes differ. On main as well: DEV-727 doesn't touch assignment or the queue.
  Check: `npm run -s test:agent` passes 3 full runs in a row; the test doesn't race against the queue (no job queued, or it waits for the queue to settle before freezing).
  Done: the test is deterministic.
