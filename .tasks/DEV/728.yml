  text: |-
    Fixed: the test no longer races the agent queue.

    - `crates/lotar-lib/tests/cli_noop_mutations_test.rs`: `lotar()` sets `LOTAR_AGENT_QUEUE_DISABLE_WORKER=1`, the switch other agent tests use. The `@copilot` job stays queued and never comments on the ticket.
    - Proof: with a 10 s sleep before the last `freeze`, the test passed with the fix (earlier session); the sleep is removed again.
    - Doc comments that said assignment queues nothing are corrected.
