- date: 2026-11-20T09:42:27.551415+00:00
  author: claude
  text: |-
    Review: passed. `08df3f6a0` does what "Done when" asks; nothing blocking, no tickets filed.

    - Read: the diff (5 files), the ticket and its comments, DEV-714/DEV-712 context, AGENTS.md, the last commits to `automation_service.rs`/`agent_job_service.rs` on main (DEV-715–723); nothing there conflicts.
    - Job end: every end path (`JobCompleted`/`Failed`/`Cancelled`/`Paused`) goes through `apply_job_end_rules` (`agent_job_service.rs:5639`), which wraps `apply_job_event` in `with_run_notes`, so the waiting rule's `updated` run gets a line too. Each `run` writes its line in `execute_run_action` (`automation_service.rs:1883`): the rule, the command, its last 10 output lines, `ignore_failure` status, the error or timeout, and a "started" line for `wait: false`. stderr is unchanged.
    - Unchanged elsewhere: a person's `lotar status` has no collector, so its output goes to stderr only. `apply_pending_outcomes` (later worker) and `rerun_skipped_runs` aren't wrapped. `update_job` does nothing for a job the process doesn't know. A note that can't be written changes nothing else.
    - Test: `waiting_build_output_goes_on_hand_back_person_change_and_waits_lotar_sets` checks the job's log for the Waiting rule's line. Main has no such message (`git grep` on main), so the test fails without the fix. Unit tests `run_note_tests` cover scope and the output tail.
    - Docs: `docs/help/agent.md:465` and `docs/help/automation.md:406` say where the line goes.
    - Reran: `npm ci` passed. `npm run lint:agent` passed. Targeted `cargo nextest` (run_note, waiting_build_output, pending_outcome, skipped_run): 14/14 passed.
    - Smoke: `npm run test:smoke:agent` had 404/406 pass at load average ~30. `harness.agent-launcher` (fixture launcher) and `ui.agent-jobs` (reviewed workflow) timed out; both passed when rerun alone (`vitest -t`), so the failures came from load, not the change. Full `npm run test:agent` not rerun: the earlier job ran it on this commit (2417/2417).
    - Worktree left clean.
