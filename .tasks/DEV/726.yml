- date: 2026-11-20T06:52:01.115668+00:00
  author: claude
  text: |-
    Rule runs fired by a job's end now leave a line in `lotar agent logs <job>`; waiting_run was already logged.

    - Why waiting_run left no note in DEV-714: the job started at 03:14 in a 0.15.4 process (DEV-712 `b580a969f` first ships in v0.15.5; 0.15.5 was installed at 04:16, mid-job). The hand-back's rule ran the `lotar` on PATH, which was 0.15.5, so its `cargo clean` worked, but the output went only to stderr.
    - `automation_service.rs`: `with_run_notes` collects one note per `run` on the thread: `Automation rule '<name>' ran `<cmd>` on <ID>.` plus the last 10 output lines, the exit status `ignore_failure` let pass, or the error. `wait: false` logs that it started. Output still goes to stderr as well.
    - `agent_job_service.rs` `apply_job_end_rules`: wraps `apply_job_event`, so the job's own end rules and the `updated`/`assigned` rules its outcome fires are covered. Runs outside a job's end don't change.
    - Test: `agent_safety_test` waiting-rule test now asserts the line; unit tests in `run_note_tests`.
    - Docs: `docs/help/automation.md` (synchronous vs asynchronous) and `docs/help/agent.md` (build output while a ticket waits).
    - No guidance correction.
