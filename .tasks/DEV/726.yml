description: |-
  Found in DEV-714 (2026-11-20). Job `job-20261120T031431.355Z-3` ended at 05:20:18Z with DEV-714 handed back to HelpNeeded. At 05:20:21Z `cargo clean --workspace` ran in `t3-1728bf4d-70d1421059373328` (target/ 1.38 GB -> 551 MB, no lotar crates left in deps), but `lotar agent logs job-20261120T031431.355Z-3` shows no line for it.

  - The rule's `run` prints only to the stderr of the process that ended the job; nothing keeps it (`~/Library/Logs/lotar-services/lotar.log` last written 20:16 local).
  - docs/help/agent.md says each waiting_run goes to the job's log; `agent-DEV-714-04c5d41a65011a74` (branch agent/DEV-714) still has target/ and the log has no waiting_run note, run or skip.

  Cause of the missing waiting_run note (checked 2026-11-19): the job started at 03:14 in a process from 0.15.4, which has no waiting_run (DEV-712 `b580a969f` is first in v0.15.5); 0.15.5 was installed mid-job at 04:16. The hand-back's rule ran `lotar` from PATH, 0.15.5, so its `worktree run` worked. No waiting_run code change is needed.

  ## Done when
  - [ ] A rule's `run` that a job's end fires (the job's own end rules, or the `updated`/`assigned` rules its outcome fires, such as the waiting rule) leaves a line in `lotar agent logs <job>`: the rule, the command, and the last lines of its output; a failed or timed-out run says so with the error. Its output still goes to stderr too.
  - [ ] A `run` with `wait: false` logs that it started (its exit isn't waited for).
  - [ ] Runs outside a job's end (a person's `lotar status`) are unchanged: stderr only. End rules replayed by a later worker log nothing new (unchanged).
  - [ ] When the log line can't be written, nothing else changes.
  - [ ] waiting_run already logs each run, skip and failure (`run_waiting_command_for_job`); the missing note is explained above.
  - [ ] Covered by a test; docs/help/agent.md and docs/help/automation.md say where the line goes.
