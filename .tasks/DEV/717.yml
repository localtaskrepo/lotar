comments:
- date: 2026-11-19T14:06:31.659632+00:00
  author: claude
  text: |-
    Question: should `lotar trust` rerun the runs it skipped by itself, or only list them with a command that reruns them?

    - Plan either way: when a rule's `run` is skipped (untrusted repo), lotar saves the command it would have run (ticket, rule, time) next to the trust record in `~/.lotar.trust.yml`. `lotar trust` lists them.
    - A (recommended): `lotar trust` reruns them right away, but only those whose rule's `run` is unchanged since the skip; changed ones are listed, not run. Agents run `lotar trust` for you, so an inbox answer like INBOX-317 goes on without anyone acting.
    - B: `lotar trust` lists them and prints `lotar trust --rerun-skipped` to run them. Nothing old runs by surprise (e.g. a skipped agent start days later), but someone has to run it, or the answer stays lost.
    - Answer A or B.
- date: 2026-11-19T18:51:59.847048+00:00
  author: mallox
  text: 'Answer: A (lotar trust reruns them right away, only those whose rule is unchanged since the skip; changed ones are listed, not run) (answered in INBOX-556)'
- date: 2026-11-19T19:02:48.586885+00:00
  author: claude
  text: |-
    Done as you chose (A): `lotar trust` now reruns the runs it skipped, if their rule is unchanged.

    - A skipped rule `run` is saved in `~/.lotar.trust.yml` (`skipped_runs`), as it would have run then: command, ticket values, rule, time (`crates/lotar-core/src/config/trust.rs`)
    - `lotar trust` runs them oldest first; a run whose rule's `run` changed is listed, not run. Both are listed in the output (`--format json`: `skipped_runs`) and commented on the ticket, then dropped, so nothing runs twice
    - lotar's own merge reruns them too when it trusts merged rules again
    - The skip comment now says `lotar trust` runs it later
    - Test: `lotar_trust_runs_the_runs_it_skipped` in `crates/lotar-lib/tests/dev259_workspace_trust_test.rs`
    - Docs: `docs/help/trust.md` (Skipped runs), `docs/help/automation.md`
    - Runs skipped before this build (the QIS answers) weren't saved, so they can't rerun
