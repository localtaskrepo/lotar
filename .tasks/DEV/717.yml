description: |-
  ## Found

  - 2026-11-15 23:10 the owner answered INBOX-317 (QIS-95 "close"), INBOX-319 (QIS-20) and INBOX-320 (QIS-58). The standards rule 'Inbox: the owner's answer goes to the source' was skipped on each: standards' rules had changed since the last `lotar trust`. lotar left a comment on each inbox ticket and nothing else.
  - standards was trusted again later, but the skipped runs never ran. The three answers sat for 3.5 days until the chief of staff noticed them (staff, 2026-11-18 midday run) and asked the owner whether to send them on. The inbox entries are still Todo.
  - The same loss happened before in another way (STD-110: answers lost when the relay comment failed).

  ## How to check

  - `lotar --format json show INBOX-317` in ~/Development/standards: the owner's answer, then the 'skipped' automation comment, nothing after it.
  - Reproduce: change a rule, let it skip a run, run `lotar trust`: nothing reruns or lists the skipped run.

  ## Done when

  - After `lotar trust`, the run commands it skipped while untrusted are not silently dropped: `lotar trust` lists them and either reruns them or offers a command that does (which one is the owner's call if it is not obvious; ask him on this ticket).
  - A test: a skipped run is listed (or rerun) after trust.
  - The three QIS answers above are not this ticket's job: the chief of staff has asked the owner about them.
