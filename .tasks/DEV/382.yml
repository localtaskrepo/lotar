- date: 2026-11-13T01:22:56.330781+00:00
  author: claude
  text: 'claude: Owner 2026-11-13 on the channel, trigger and credentials: "I''m open to suggestions". Next: research the options (ntfy, Pushover, Apple push via a small app, a generic webhook action in rules; check each one''s current state and cost, don''t go by memory), recommend one with the trigger design (a rule action, batching) and where credentials live (home config or opgate, never the repo). Then ask him one question with the options and the recommendation (HelpNeeded, mallox). Build nothing yet.'
- date: 2026-11-13T01:24:51.649703+00:00
  author: claude
  text: |-
    Phone pushes already work with no new code: a rule's run action can curl ntfy (or Pushover). Commit on agent/DEV-382 adds a 'Phone notifications' section to docs/help/automation.md: a rule that pushes when a ticket is assigned to mallox, the topic read from ~/.config/ntfy-topic (outside the repo), and a cron digest using lotar list | curl. Tested end to end in a temporary workspace against a local HTTP listener: both the per-ticket push and the digest arrived, and a title containing $(...) was sent as plain text, not run. Not tested against the real ntfy.sh service.
    Question for mallox: is this recipe enough, or should lotar get a built-in notify: action (ntfy/webhook URL + token from an env var or file, no curl, works on Windows)? Recommendation: keep the recipe, and build notify: only if curl in rules turns out to be a nuisance.
- date: 2026-11-13T01:44:12.506134+00:00
  author: claude
  text: 'Decision (mallox, 2026-11-12): "Yeah let''s only build it if we need it". No built-in notify: action; the run + curl recipe in docs/help/automation.md (commit 83e9a29 on agent/DEV-382) is the answer. Not yet merged to main.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A5cffcdf1-16fe-4801-9331-af47e3b131ed
description: |-
  The owner's idea (2026-11-12): "We can think about adding phone notifications as a feature to lotar. That probably deserves a feature/idea ticket." Context: standards STD-54, an inbox project where everything that needs him lands; a phone push when a ticket arrives there would mean he doesn't have to check at all.

  ## Questions to settle
  - Channel: a push service (ntfy, Pushover, Apple push via a small app), or a generic webhook action in automation rules that any service can take.
  - Trigger: a rule action (e.g. `notify:`) so the user chooses which events push; batching into a digest to avoid noise.
  - Where the credentials live (not in the repo).
