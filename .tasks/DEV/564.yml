description: |-
  Child of standards STD-138 (https://standards.pyxzl.net/task/STD-138). Owner by voice, 2026-11-15: "sign every local install of lotar, opgate and harnessmux, including builds from source, with my Developer ID, so keychain and firewall approvals survive new builds. Land it in the next version."

  ## Found
  - harnessmux (`~/Development/@localtaskrepo/harnessmux`) is installed with `cargo install --git ...` or from GitHub Releases (README "Install"); `target/release/harnessmux` on this Mac is `Signature=adhoc`, `Identifier=harnessmux-1f053a7de3487cfc`. Release binaries aren't Developer ID signed either. No `harnessmux` on PATH on this Mac (2026-11-15).
  - lotar embeds harnessmux as a library for its runners, so lotar's own signing (DEV-563) covers that path; this ticket is the standalone `harnessmux` CLI.
  - Identity on this Mac: "Developer ID Application: Ravi Gairola (3HKD37M482)" in the login keychain.
  - `cargo install` has no post-install step, so a signed install needs its own command. harnessmux is Rust only (no npm), so it is `cargo xtask install` (an `xtask` workspace member, not published), the Rust twin of lotar's `npm run install:local` (DEV-563).

  ## Done when
  - [ ] harnessmux's documented local install (README: clone, `cargo xtask install`) builds `harnessmux` and signs it on macOS with that Developer ID, identifier `net.pyxzl.harnessmux`, hardened runtime, before it puts it in `HARNESSMUX_INSTALL_DIR` (default `$CARGO_HOME/bin`, i.e. `~/.cargo/bin`, where `cargo install` puts it).
  - [ ] `HARNESSMUX_SIGNING_IDENTITY` wins over the Developer ID default.
  - [ ] Default identity missing (another machine, CI): ad-hoc signed (same identifier) with a warning naming the identity and saying macOS will ask for keychain and firewall grants again. An explicitly set identity that is missing: the install stops, nothing replaced. Linux/Windows: copied unsigned, no warning.
  - [ ] Identity present but codesign (sign or `--verify --strict`) fails, or the staged binary's `--version` fails: the install stops with the error and leaves the installed binary as it was (the new one is staged next to it and renamed over it only after all checks pass).
  - [ ] `cargo install --git https://github.com/localtaskrepo/harnessmux harnessmux` and `cargo install harnessmux` still work (unsigned, as today); README says so.
  - [ ] `codesign -dvv` on the installed binary shows `Identifier=net.pyxzl.harnessmux`, `TeamIdentifier=3HKD37M482`; checked again after the next version's fresh build.
