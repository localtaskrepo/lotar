- date: 2026-11-15T17:58:44.172268+00:00
  author: claude
  text: |-
    Signed install is built and committed in harnessmux; signing with your Developer ID waits for the keychain to let codesign use the key.

    - `cargo xtask install` (harnessmux `3a3cfca`, branch `agent/DEV-564`): builds, stages `.harnessmux.new` in `HARNESSMUX_INSTALL_DIR` (default `~/.cargo/bin`), signs on macOS (`--options runtime --identifier net.pyxzl.harnessmux`), runs `codesign --verify --strict` and `--version`, then renames over the installed one. Same rules as lotar's `npm run install:local` (DEV-563).
    - `HARNESSMUX_SIGNING_IDENTITY` wins; set but not in the keychain: stops. Default missing: ad-hoc with a warning. Codesign error or no answer in 120 s: stops, installed binary unchanged (checked end to end).
    - `cargo install --git ... harnessmux` still works (checked); without the package name cargo now asks for one, because of the `xtask` workspace member. README and CHANGELOG say so.
    - Ad-hoc run checked: `Identifier=net.pyxzl.harnessmux`, `flags=adhoc,runtime`.
    - Blocker: `codesign --sign "Developer ID Application: Ravi Gairola (3HKD37M482)"` hangs, also outside the sandbox: the keychain asks at the Mac. DEV-563 hit the same and asks you once.
    - No lotar files changed: the lotar branch `agent/DEV-564` has no commits; the merge lands harnessmux `agent/DEV-564`.

    **Question:** once you've allowed codesign to use the Developer ID key (Always Allow at the Mac, or `security set-key-partition-list` as asked in [DEV-563](https://lotar.pyxzl.net/task/DEV-563)), answer here, and I'll run `cargo xtask install` and check `codesign -dvv ~/.cargo/bin/harnessmux`. Is that done?
