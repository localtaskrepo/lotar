- date: 2026-11-15T20:45:34.566409+00:00
  author: codex
  text: |-
    Review: blocking — concurrent installs can replace the verified binary before it is installed.

    - Reviewed harnessmux `3a3cfca`, all nine changed files, README/install and release/CI callers, current main history and the ticket/owner decisions. No source changes or merge.
    - `xtask/src/main.rs:133-137`: every install copies to the same `.harnessmux.new`. After A verifies it, B can overwrite it before A renames it; A then installs B's unchecked binary. B's failure cleanup can also remove A's stage. Use a unique staging file per invocation in the destination directory (or serialize the entire operation), and add an interleaving regression test proving only the checked bytes are installed.
    - Passed: `cargo fmt --all --check`, workspace clippy with `-D warnings`, workspace nextest (49/49), and `cargo deny check` (duplicate syn warning only). Tests initially hit sandbox socket restrictions; approved retry passed. Used `RUSTC_WRAPPER=` and scratch target directory; audit retry also passed outside sandbox.
    - Installed binary shows `Identifier=net.pyxzl.harnessmux`, `TeamIdentifier=3HKD37M482`, hardened runtime. `codesign --verify --strict` passed on approved retry (sandbox trust error initially).
    - Not rerun: install/replacement or next-version fresh-build signing. Next-version verification remains outstanding. Status and assignee unchanged.
