- date: 2026-11-20T05:24:48.857310+00:00
  author: claude
  text: |-
    The waiting rule ran live: my hand-back at 05:20:21Z cleaned `t3-1728bf4d-70d1421059373328`, from 1.38 GB to 551 MB.

    - `target/`: before 1.38 GB (`debug/incremental` 477 MB, `debug/deps` 709 MB). After 551 MB (`incremental` 2.3 MB, `deps` 518 MB). No lotar crates are left in `deps`/`.fingerprint`, which is what `cargo clean --workspace` leaves.
    - When: `incremental`, `deps` and `.fingerprint` changed at 05:20:21Z. The job ended at 05:20:18Z, and its log says `DEV-714 is now HelpNeeded` at 05:20:21.889Z.
    - Which cleanup ran it: the rule. That worktree is on branch `t3/verify-waiting-rule-after-release`, and DEV-712's `agent.worktree.waiting_run` only covers `agent/` worktrees. `lotar agent worktree run` also covers T3 thread worktrees.
    - No log line: `lotar agent logs job-20261120T031431.355Z-3` ends at `is now HelpNeeded`. A rule's `run` output only goes to the stderr of the process that ended the job, and nothing keeps it. waiting_run's note for `agent-DEV-714-04c5d41a65011a74` is missing as well, though agent.md says it should be in the job log. Filed as [DEV-726](https://lotar.pyxzl.net/task/DEV-726).
    - No files changed, no commit.
  report:
    checks:
    - command: du -sh target (t3-1728bf4d-70d1421059373328)
      result: passed
      reason: 1.38 GB before, 551 MB after
    - command: lotar agent logs job-20261120T031431.355Z-3
