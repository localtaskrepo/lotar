    0.15.5 is out and installed. The live check fires when this job ends: this hand-back is the check's event.

    - Released from here, as triage said: QA `44655662920` passed, signed tag `v0.15.5` pushed, Release run `44669658513` succeeded, `brew upgrade` → `lotar 0.15.5`, codesign OK. Closed [DEV-702](https://lotar.pyxzl.net/task/DEV-702); next release [DEV-725](https://lotar.pyxzl.net/task/DEV-725) and record `0.15.6`
    - `lotar agent worktree run DEV-714 -- true` works now: it ran in `agent-DEV-714-04c5d41a65011a74` and `t3-1728bf4d-70d1421059373328`
    - No waiting ticket had build output (only DEV-717: 4.1 MB), and the rule runs nothing while a job holds the worktree. So I built here instead: `target/` before = **1.38 GB** (`debug/incremental` 477 MB, `debug/deps` 709 MB) in `t3-1728bf4d-70d1421059373328`
    - This hand-back (HelpNeeded, mallox) is applied when the job ends and fires "Waiting: drop the workspace build output"
    - No files changed, no commit

    Question: should the next turn record the `target/` after-size and the rule's line from `lotar agent logs job-20261120T031431.355Z-3`, then close this ticket (STD-236 then copies the rule)?
