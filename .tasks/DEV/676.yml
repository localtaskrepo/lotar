  text: |-
    agent/DEV-623 is at `b7d7ca4de` now; no code change needed.

    - Cause: the job ran on the installed `lotar 0.15.3` (`/opt/homebrew/bin/lotar`, installed 08:00). DEV-675's fix `c9a5bae3b` came later (`v0.15.3-21-gc9a5bae3b`), so that build still ran `git branch --force`.
    - The worktree had the case DEV-675 handles: `job-20261117T001050.777Z-5` has an end event but no status line.
    - I did what DEV-675's code does. The worktree `agent-DEV-623-fdc58bb7d25a0a16` was clean and nothing had it open (`lsof`), so I ran `git -C <worktree> reset --keep b7d7ca4de`. It stays checked out there.
    - Nothing lost: `3c5d8a729` → `b7d7ca4de` is a rebase onto main. `git range-diff` shows only DEV-661's docs context changed.
    - `node ~/Development/standards/scripts/repos.ts localtaskrepo/lotar` lists no DEV-623 finding. Once a release ships DEV-675, jobs do this on their own.
