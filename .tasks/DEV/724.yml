- date: 2026-11-19T20:29:12.557367+00:00
  author: claude
  text: |-
    Smoke test now measures the toggle after the layout settles.

    - Cause: `smoke/tests/ui.description-preview.smoke.spec.ts` took the textarea and toggle boxes in two separate `boundingBox()` round trips; under load the layout can change between them (panel slide-in, textarea resize), giving a 9px gap.
    - Fix: one `page.evaluate` reads both rects and the padding in the same animation frame, polled until two frames agree; the assertions (gap < 8px) are unchanged.
    - Test-only change; no UI or style change.
