description: |-
  ## Found

  During the DEV-723 merge, `npm run -s smoke` failed once: `smoke/tests/ui.description-preview.smoke.spec.ts` > 'stays clear of the text and the layout at 1280px', line 41: right-edge gap `8.993408203125` not less than `8`. The file alone passed 3 of 3 runs and the full suite passed on rerun (406/406); DEV-723 only changes Rust worktree cleanup.

  ## Check

  `npm run smoke` several times under full-suite load; the 1280px right-edge assertion holds every time.

  ## Done when

  The test measures after the layout settles (or the toggle's offset is stable), so the full suite does not flake on it.
