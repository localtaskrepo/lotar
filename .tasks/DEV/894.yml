  text: 'Paused, not failed: the job job-20261126T212714.529Z-68 (review) stopped on a usage limit or a paused queue and runs again by itself, on a usage limit at its reset. Nobody needs to act; lotar agent list-jobs shows when it resumes, lotar agent logs job-20261126T212714.529Z-68 why.'
