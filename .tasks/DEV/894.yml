- date: 2026-11-26T20:09:34.734647+00:00
  author: claude
  text: |-
    Doc fixed: `docs/help/agent.md` now says what `created_at` means in each place.

    - List-jobs line: in a job log, `created_at` is when the job left the queue. A job that `lotar serve` held as queued keeps `created_at` = `queued_at` in that server's record (`GET /api/jobs`, the Agents page), also after it runs and ends. Its log, and so `list-jobs` and other processes, has the start time.
    - Code evidence: `agent_job_service.rs` `start_job_inner` sets `queued_at = queued_from.or_else(|| should_queue.then(|| created_at.clone()))`, and nothing reassigns `record.created_at` later (`grep '.created_at = '` finds nothing). `start_job` calls `init_job_log(.., started_at, ..)` for the header.
    - Took the ticket's doc option, not a code change: the Agents page sorts by `created_at`, so changing the record would change the page's order.
    - Branch fast-forwarded to `main` `d2b22c8b1` first (it had no commits of its own), so it holds DEV-882's line.
  report:
    commits:
