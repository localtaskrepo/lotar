description: 'Found in review of DEV-882 (4a46916a2). docs/help/agent.md list-jobs line says `created_at` is when a job left the queue. For a job that `lotar serve` holds as queued, the in-memory record (`GET /api/jobs` while it is queued or running) keeps `created_at` = the time it was queued, which equals `queued_at` (agent_job_service.rs start_job_inner: `queued_at = queued_from.or_else(|| should_queue.then(|| created_at.clone()))`). Only the saved log header takes `created_at` from `started_at` (start_job -> init_job_log). Check: hold a job in serve, read GET /api/jobs. Done: the doc describes created_at for both, or the record''s created_at matches the log header''s.'
