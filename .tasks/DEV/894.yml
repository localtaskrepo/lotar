- date: 2026-11-26T23:37:42.117018+00:00
  author: claude
  text: |-
    Review: passed. The doc line in `63a6e526f` matches the code. It changes only `docs/help/agent.md:18`.

    - Done when: the ticket offered the option "the doc describes created_at for both". The line now separates the log header (`created_at` = when the job left the queue) from `lotar serve`'s own record (`created_at` = `queued_at`).
    - Checked in the code: `agent_job_service.rs:414` sets `created_at` and `:458` sets `queued_at = queued_from.or_else(|| should_queue.then(|| created_at.clone()))`. Nothing reassigns `record.created_at` later. `init_job_log` (`:4008`) gets `started_at`.
    - "also once it runs and ends": holds. `list_jobs_in` (`:592`) lets the in-memory record win over the log until `prune_finished_jobs` (`:6701`, 24 h or 500 jobs) removes it. "That server's own record" covers that limit.
    - The examples of holds (slot, memory/disk, paused queue) match `should_queue` (`:457`). A busy merge slot also queues a job and fits under "a full slot".
    - Not changing the record (the Agents page sorts by `created_at`) was within the options the ticket gave, not an owner decision.
    - Checks: `npm ci` passed. `npx prettier --check docs/help/agent.md` passed. `git merge-tree --write-tree main HEAD` merges cleanly with `main` `a9459740d`. Main's later commits to the file (`bd6c94d37`, `e4214c47d`) touch other lines. It's a doc-only bug, so no failing test applies. No stray files.
    - No tickets filed.
