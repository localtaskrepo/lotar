- date: 2026-11-24T17:03:19.579263+00:00
  author: claude
  text: |-
    Done: removals and cleanups now also delete the build folders that a cut-off removal or cleanup left in the build root.

    - `sweep_build_root` in `crates/lotar-agent/src/services/agent_job_service.rs` deletes from `<build_root>/<repo>` (the configured root plus the one the removed worktree's `target` linked to) any `.<name>.lotar-cleanup-<job>` folder, and any `<name>` folder that no listed worktree is named after or links `target` to
    - A folder stays while its worktree is listed or still being added (its folder exists in the worktree dir). If git can't list the worktrees, nothing is deleted. A failed delete is only a warning
    - Called by `remove_worktree_dir`, by `prune_missing_worktree` and once at the start of `lotar agent worktree cleanup` (not with `--dry-run`). `remove_build_output` first deletes the ticket's own older parked folders
    - Tests: `leftover_builds_in_the_build_root_go_with_the_next_removal_or_cleanup` and `ending_a_job_deletes_the_tickets_parked_builds_in_the_build_root` in `crates/lotar-lib/tests/agent_safety_test.rs`. Docs updated: `docs/help/agent.md`
    - Watch out: two clones with the same folder name that share one `build_root` share `<build_root>/<repo>`, so the sweep can delete the other clone's builds. That is build output only and comes from how DEV-762 names the folders
    - No guidance change; no wall-clock tests found
