- date: 2026-11-24T17:21:34.055398+00:00
  author: claude
  text: |-
    Review: passed. `a66b4c529` does what "Done when" asks; one minor gap filed as [DEV-841](https://lotar.pyxzl.net/task/DEV-841).

    - Reviewed `git diff main...HEAD` (merge-base `d4bdbbbf6`; HEAD = `agent/DEV-778`, no newer rework commits). It touches 4 files: `agent_job_service.rs`, `cli/handlers/agent.rs`, `agent_safety_test.rs`, `docs/help/agent.md`. No stray files. `git merge-tree` against main (`504d8b538`, DEV-774 touches the same file) shows no conflicts
    - `sweep_build_root` (`agent_job_service.rs:1808`) covers the configured root and the linked root, deduplicated. It keeps a folder that a listed worktree is named after or links `target` to, or whose folder exists in the worktree dir. It does nothing when `git worktree list` fails, and a failed delete is only a warning. `remove_worktree_dir` sweeps whatever happened and returns the removal's own result unchanged. With no build root set, nothing is swept
    - Every removal path is covered: `remove_worktree` (Done cleanup, cleanup rules), both CLI calls, and `prune_missing_worktree`. There's also a sweep at the start of CLI cleanup (skipped with `--dry-run`). `remove_build_output` (`:3352`) also deletes the same ticket's older parked folders. The prefix ends in `.`, so `DEV-1` doesn't match `DEV-10`
    - Live builds are safe: the job's build folder is created only after `git worktree add` lists the worktree (`:1626`-`:1633`), so the sweep can't race a worktree being added
    - Tests: `leftover_builds_in_the_build_root_go_with_the_next_removal_or_cleanup` covers an undeletable build, a cut-off removal, a parked folder, a live build and one being added. `ending_a_job_deletes_the_tickets_parked_builds_in_the_build_root` covers parked folders. Without the sweep, both would fail on the `!orphan.exists()` / `!parked.exists()` asserts. I didn't run them against the old code, because the signature change stops them compiling there
    - Reran `cargo nextest run -p lotar-lib --test integration` with the build_root, leftover and parked filters (11 passed). Also reran the cleanup and prune tests in `agent_safety_test` (10 passed). `npm ci` ran first and passed. I didn't rerun lint, the full suite or smoke: the merge runs them
    - Minor, filed as [DEV-841](https://lotar.pyxzl.net/task/DEV-841): the sweep at the start of CLI cleanup (`cli/handlers/agent.rs:665`) uses only the global `build_root`. When a project sets its own, that root's last leftover stays
    - The fix agent's own warning holds: two clones with the same folder name that share a `build_root` share `<build_root>/<repo>`, so a sweep can delete the other clone's live builds. That comes from how DEV-762 names the folders; I filed nothing for it
