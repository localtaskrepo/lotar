description: |-
  Found in the DEV-762 review. `remove_worktree_dir` (crates/lotar-agent/src/services/agent_job_service.rs ~2816) finds the build root folder before the rename, but deletes it only after the trash folder is gone. A removal cut off in between, or a failed delete of that folder, leaves `<build_root>/<repo>/<ticket>` with no link pointing at it. The next removal sweeps leftover `.<name>.lotar-removed` folders but not the build root. `remove_build_output` (~3243) has the same gap for its parked `.<ticket>.lotar-cleanup-<job>` folders in the build root. Those builds then take quota on /Volumes/Builds until someone deletes them by hand.

  Check: interrupt between the rename and the build delete (or make the build folder undeletable), then run `lotar agent worktree cleanup`: the folder stays.

  Done: a later removal or cleanup also deletes orphaned build root folders and parked cleanup folders of that repo, with a test.

  ## Done when

  The build root folder of a repo is `<build_root>/<repo>` (DEV-762). It is found from the configured `agent.worktree.build_root` and from the `target` link of the worktree being removed or cleaned; when both apply and differ, both are swept.

  - [ ] `remove_worktree_dir` (Done cleanup, `lotar agent worktree cleanup`, cleanup rules) also deletes, in that repo's build root folder, every `.<name>.lotar-cleanup-<job>` folder and every `<name>` folder that no worktree of the repo (`git worktree list`, the main checkout included) is named after or links `target` to
  - [ ] `prune_missing_worktree` and `lotar agent worktree cleanup` sweep the configured build root the same way, so the last worktree's leftover goes too
  - [ ] `remove_build_output` sweeps leftover `.<ticket>.lotar-cleanup-<job>` folders of that repo before it parks its own
  - [ ] A live worktree's build is never deleted: a folder whose worktree exists or is being added stays
  - [ ] A failed delete in the sweep is logged as a warning; the removal itself still succeeds or fails as today
  - [ ] Unset build root: nothing changes
  - [ ] Test: a removal cut off after the rename (or a build folder that can't be deleted) leaves the folder; the next removal or cleanup deletes it, and a live worktree's build stays
  - [ ] Docs (`docs/help/agent.md`) say leftovers are swept
tags:
- waits
