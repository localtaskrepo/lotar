description: |-
  Found in the DEV-762 review. `remove_worktree_dir` (crates/lotar-agent/src/services/agent_job_service.rs ~2816) finds the build root folder before the rename, but deletes it only after the trash folder is gone. A removal cut off in between, or a failed delete of that folder, leaves `<build_root>/<repo>/<ticket>` with no link pointing at it. The next removal sweeps leftover `.<name>.lotar-removed` folders but not the build root. `remove_build_output` (~3243) has the same gap for its parked `.<ticket>.lotar-cleanup-<job>` folders in the build root. Those builds then take quota on /Volumes/Builds until someone deletes them by hand.

  Check: interrupt between the rename and the build delete (or make the build folder undeletable), then run `lotar agent worktree cleanup`: the folder stays.

  Done: a later removal or cleanup also deletes orphaned build root folders and parked cleanup folders of that repo, with a test.
