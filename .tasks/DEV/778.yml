    Waiting for DEV-762: the code this ticket fixes isn't on main yet.

    - `build_root_dir`, the build delete in `remove_worktree_dir` and the parked `.<ticket>.lotar-cleanup-<job>` folders exist only in `4e32e4ff3` on `agent/DEV-762`, which is in Merging
    - Added "Done when" to the description; the sweep's callers are only in lotar (`crates/lotar-agent/src/services/agent_job_service.rs`, `crates/lotar-lib/src/cli/handlers/agent.rs`, `crates/lotar-lib/tests/agent_safety_test.rs`)
    - No code changed; next: once DEV-762 is on main, rebase `agent/DEV-778` and do the work
references:
