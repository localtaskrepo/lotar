- date: 2026-11-17T20:14:50.249976+00:00
  author: claude
  text: |-
    Review: passed. `6c8c4df8a` does what "Done when" asks; no findings, no tickets filed.

    - Read: the diff, the ticket and its comment, DEV-530, `AGENTS.md`, and recent main commits to the touched files (DEV-671's runner check runs before this, so it's compatible).
    - `run_job` (`crates/lotar-agent/src/services/agent_job_service.rs:3304`) switches to the session's model/effort only after the idle check and the T3 thread check, and before `start_job` writes the log header. Jobs that start their own session, and jobs that fail before this point (worktree setup, `agent.merge`'s own merge → `Fresh`), keep their profile's values.
    - Resume is unaffected: `open_session` (`agent_runner.rs:240`) copies only `env` into the session record, so the job's profile model doesn't reach a resumed agent. Cost code untouched.
    - The test fails without the fix (`left: (Some("sonnet"), None)`, checked in a detached copy with the old `agent_job_service.rs`) and passes with it.
    - No UI or REST changes. The docs line in `docs/help/agent.md` matches the behavior.
    - Reran: `npm ci` ok; `npm run lint:agent` passed; `npm test` passed (2312 Rust, 1548 UI); `npm run smoke` passed (405). Worktree clean afterwards.
