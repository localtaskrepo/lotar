description: |-
  Found in STD-208 (standards), checking STD-207's headless merge.

  - Job `job-20261117T192917.748Z-5` (STD-207, profile merge, runner claude) continued the review session `standards-04f015-STD-207-review` (Claude session `ec15ec35-d7a5-4d7e-8ea7-63a6a0e3c12a`).
  - Its transcript (`~/.claude/projects/-Users-mallox--t3-worktrees-standards-agent-STD-207-858b7ce3ee398502/ec15ec35-….jsonl`) has every assistant turn on `claude-opus-5-5`, effort medium, also the merge turn after 19:29Z. harnessmux's `standards-04f015-STD-207-review.json` profile says `model: opus`.
  - But `/api/jobs`, the Agents page and `lotar task timeline STD-207` show the job as `merge (claude, sonnet)`: @merge's profile model, not the session's. docs/help/agent.md says the continued session keeps its model and effort, and that jobs show their model and effort.

  Cause: harnessmux resumes a session with the profile in its record (lotar replaces only its env), but the job records its own profile's model and effort (`run_job` in `crates/lotar-agent/src/services/agent_job_service.rs`).

  ## Done when
  - [ ] A job that resumes a session (`session: continue`, of its own or another profile) records the session's model and effort, as harnessmux's session record holds them, in the job record and its log header, so the job list (`/api/jobs`, `lotar agent list-jobs`), `lotar agent status`, `lotar task timeline` and the Agents page show them. The session's values win over the job's profile and over `--model`/`--effort`; a session started without a model or effort shows none (the agent's default), as it runs.
  - [ ] A job that starts a session of its own (`session: new`/`fresh`, no session to continue, one it can't continue, or one idle past `continue_within_minutes`) still shows its profile's (or `--model`/`--effort`) values.
  - [ ] Until the job picks its session (queued, worktree setup) it shows its profile's values; a job whose start fails before that keeps them.
  - [ ] Its cost is unchanged (the agent reports it; nothing in lotar prices by model).
  - [ ] Test: a continued job of a sonnet profile on an opus session shows opus and the session's effort, in memory and in its log; docs/help/agent.md says so.
