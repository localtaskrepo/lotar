- date: 2026-11-17T20:03:28.118166+00:00
  author: claude
  text: |-
    Fixed: a job that resumes a session now shows the session's model and effort.

    - Cause: harnessmux resumes with the profile in its session record (lotar swaps only env), but `run_job` recorded the job profile's model.
    - `crates/lotar-agent/src/services/agent_job_service.rs`: once the session to continue is picked, `profile.model`/`effort` and the job record take the session record's values, before the log header is written. So `/api/jobs`, `agent status`, `list-jobs`, timeline and the Agents page show them.
    - Jobs that start their own session are unchanged; cost logic untouched (the agent reports cost).
    - Test `a_continued_session_shows_the_model_and_effort_it_runs_on` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`; `docs/help/agent.md` updated.
    - Told the DEV-530 thread (same file) what changed.
