description: |-
  Evidence 2026-11-21 (owner asked to speed the queue up; he picked this, 2026-11-21 ~19:00 PST): last 48 h 55 tickets, 189 jobs, 82.5 slot-hours on 3 slots; merge agent 34 jobs, median 34 min, 33 h; flaky-test tickets 27 h (DEV-748..761); load average 17-20 on 14 cores, 36 seen (DEV-755). The queue runs in arrival order (only a paused job's retry goes first): the v0.15.6 release review DEV-725 was 13th of 20 behind Medium fixes, and STD-258, STD-259, STD-273 wait on that release. Do: order queued entries by the ticket's priority (Critical, High, Medium, Low), then queued_at; show the order in lotar agent queue and the Agents page; paused retries still first. Done when: a test queues a Low then a High ticket and the High starts first.

  Owner 2026-11-21 19:20 PST, widening this ticket: "maybe that's part of the feature request to add so that the queue can be managed if needed along with priorities and categorization, etc."
  Why: moving DEV-783..786 up the queue was not possible: an entry holds only ticket and profile, the prompt comes from the rule that queued it, so a removed review or merge can't be put back as it was.
  Also do:
  - Manage: move a queued entry to the front, up, down or to the back (CLI `lotar agent queue move <TICKET> --first|--up|--down|--last`, the Agents page, REST); a moved entry keeps its rule, prompt and settings.
  - Categories: show each entry's kind (fix, review, merge, release ...) in `lotar agent queue` and the Agents page, and let the order take the kind into account (e.g. merges and reviews before new fixes, since they finish work). Propose the default order in a comment before building it if unsure.
  Done when (in addition): a test moves an entry to the front and it starts next with its original prompt; the queue lists show the kind.

  ## Done when

  Order (the owner: "order queued entries by the ticket's priority (Critical, High, Medium, Low), then queued_at"; "e.g. merges and reviews before new fixes, since they finish work"):
  - [ ] A new entry goes by its ticket's priority (the project's configured order, highest first), then its kind (release, merge, review, then fix and every other profile), then arrival. Priority wins over kind: a High fix goes before a Medium merge.
  - [ ] The kind comes from the entry's profile name: one that contains `release`, `merge`, `review` is that kind; `fix-retry` and other names with `fix` are `fix`; other profiles show their own name and rank as `fix`; a bare runner is `run`.
  - [ ] The priority is read from the ticket when the entry is queued and stored on it; a ticket that can't be read gets the project's default priority. A priority change later doesn't move a queued entry (move it by hand).
  - [ ] Paused retries (paused queue, usage limit, unresumable session) still go first; an entry put back because its ticket is busy, or after a failed start, goes back to its place by rank, not to the end.
  - [ ] Test: queue a Low then a High ticket; the High starts first.

  Manage:
  - [ ] `lotar agent queue move <TICKET> --first|--up|--down|--last` (exactly one; `--agent <PROFILE>` when the ticket has entries for several profiles) moves the entry; text and JSON say where it is now. Not queued, or already starting: error naming it, nothing changes.
  - [ ] A moved entry keeps its prompt, profile, model, effort and settings, and keeps its place: later entries are placed among the entries not moved by hand. Paused retries stay first only until someone moves an entry ahead of them.
  - [ ] REST `GET /api/agent-queue` lists the entries in start order; `POST /api/agent-queue/move` `{ticket_id, agent?, to: first|up|down|last}` moves one. `api_types.rs`, `view/api/types.ts`, `docs/openapi.json` and `docs/help` agree.
  - [ ] The Agents page shows the queue in start order with each entry's kind, priority and buttons to move it to the top, up, down and to the bottom; a failed move shows the error.
  - [ ] Test: move an entry to the front; it starts next with its original prompt.

  Categories:
  - [ ] `lotar agent queue` (text and JSON `kind`, `priority`) and the Agents page show each entry's kind.
