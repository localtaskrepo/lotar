- date: 2026-11-22T09:30:44.926217+00:00
  author: claude
  text: |-
    The queue now starts tickets by priority, then kind, then arrival. You can move entries in the CLI, over REST and on the Agents page.

    - Order: paused retries first, then higher priority, then kind (`release` → `merge` → `review` → fix and others), then arrival. The priority is stored when the ticket is queued.
    - Kind comes from the profile name (`review-light` counts as review). A bare runner is `run`.
    - Move: `lotar agent queue move <TICKET> --first|--up|--down|--last [--agent P]`. A moved entry keeps its prompt and settings and isn't sorted again (`kept`).
    - REST: `GET /api/agent-queue`, `POST /api/agent-queue/move`, also in `docs/openapi.json`, `api_types.rs` and `types.ts`.
    - Agents page: a new **Queue** panel shows kind, priority, profile and age, with top/up/down/bottom buttons and an error with Retry. Component: `view/components/AgentQueuePanel.vue`.
    - Tests:
      - `agent_queue_service` unit tests: Low then High, the High starts first; a moved entry starts next with its prompt
      - `dev786_queue_order_test`: CLI kind column and move
      - `AgentQueuePanel.spec.ts`
      - Playwright smoke test in `ui.agent-jobs.smoke.spec.ts`
    - Docs: `docs/help/agent.md` (new "Queue order" section) and `api-quick-reference.md`.
    - Screenshots on the ticket: `dev786-before-*` and `dev786-after-*` (light and dark, 1920/1440/390). Before: the queue wasn't visible on the page at all.
    - Follow-up idea: the page's **Queued** count only counts this server's in-process jobs, so it shows 0 next to a full queue panel.
