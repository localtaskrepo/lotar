- date: 2026-11-23T02:17:10.558810+00:00
  author: claude
  text: |-
    Review: blocking. An entry whose ticket is busy now holds a queue slot on every pass, which slows the queue down.

    Reviewed `bc0c7d822` (only commit past `main`, tree clean).

    **Blocking**
    - `crates/lotar-agent/src/services/agent_queue_service.rs:977` with `:1034` and `:765-770`: before this change, an entry whose ticket is busy ("already has an active job", or a T3 thread hold, DEV-600) went to the end of the queue. Now `place` puts it back at its rank.
      - `dequeue_startable` gives it a slot (`slots.take`) on every 300 ms pass, before the lower entries behind it, and the start then fails as busy.
      - So each busy High/merge/review entry blocks one of DEV's 3 slots for as long as its ticket's job or thread runs. That works against the ticket's goal of speeding the queue up.
      - Fix: in `dequeue_startable`, keep an entry whose ticket has an active job or thread hold without taking a slot. Add a test: a High entry on a busy ticket and a Low entry with one free slot, and the Low starts.
    - `agent_queue_service.rs:931` (`place`, `pinned` branch): an entry someone moved (pinned) that goes back after a busy or failed start is put at index 0. That puts it ahead of paused retries and everything else, not back where it was moved to. "Done when" asks that it go back to its place.
      - Fix: put a pinned entry back at its old index. Or, with the first fix, a busy entry is never taken, so only the failed-start path needs this.

    **Also (small, fix while there)**
    - `crates/lotar-lib/src/cli/handlers/agent.rs:520`: the text output checks `pending.is_empty()` but lists `ordered`, which includes the entries being started. With only starting entries it prints "No pending entries".

    **Checked, fine**
    - Order, kinds, move, REST and contract: `api_types.rs`, `types.ts`, `openapi.json` and `docs/help` agree.
    - In a scratch workspace, the CLI move worked (text and JSON), `--up --down` was refused, and REST gave a 400 for a ticket that isn't queued.
    - Agents page: my screenshots (light/dark, 1920/1440/390) look right. The fix agent's screenshots are on the ticket.
    - The "0 Queued" count beside a full queue is the existing DEV-798.

    **Reran:** `npm ci` (ok); nextest `the_queue_starts…` and `a_moved_entry…` (pass); `dev786_queue_order_test` (pass); vitest `AgentQueuePanel.spec.ts` and `AgentJobs.spec.ts` (36 pass).
    **Not rerun:** full lint, test and smoke. Load average was 60-111, and the builds alone took more than 30 minutes.

    **My mistake, fixed:** this job's `LOTAR_TASKS_DIR` pointed my scratch `lotar add` calls at the real backlog. That created DEV-822..826. They were never queued and nothing referenced them, and I hard-deleted them. DEV-826 was the highest ID, so the next new DEV ticket reuses that number.
