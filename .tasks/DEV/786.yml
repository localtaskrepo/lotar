  text: |-
    Review: blocking. Main now has its own queue list on the Agents page (DEV-771, `928cc5a19`), and this branch adds a second one. The branch doesn't rebase cleanly.

    Reviewed `99c714ed9` (the only commit past `main`, tree clean). Its base `f7733872c` is 10 commits behind `main`.

    **Blocking**
    - **Two queue lists and two APIs for the same queue.** On `main`, DEV-771 added `AgentQueueService::overview`, the `queue` field of `GET /api/jobs` (`AgentQueueOverview`, `AgentQueuedTicket` with `waits_for`), and a "Waiting in the queue" card in `view/pages/AgentJobs.vue:76`. It uses the same `data-testid="agent-queue"`. This branch adds `GET /api/agent-queue` (`AgentQueueEntryInfo`) and a second card, `view/components/AgentQueuePanel.vue`. Merged, the page lists the queue twice, and two REST shapes and the CLI JSON `pending` describe the same entries in different ways.
      - Fix: rebase onto `main` and keep one list. For example, add `kind`, `priority`, `pinned`, `starting` to `AgentQueuedTicket`, list `overview`'s `pending` in start order, and put the move buttons on DEV-771's card. That card already shows `waits_for` and refreshes. Then drop `GET /api/agent-queue`, or keep it only if the page needs it. Update `api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, `docs/help` to match.
    - **Rebase conflicts:** `git merge-tree --write-tree main HEAD` conflicts in `crates/lotar-agent/src/services/agent_queue_service.rs` (imports and `overview`), `crates/lotar-lib/src/cli/handlers/agent.rs` (DEV-771 rewrote the `agent queue` listing) and `crates/lotar-lib/src/cli/args/mod.rs`. Resolving them means deciding how the two lists become one, so a merge job shouldn't do it.

    **Also (small, fix while there)**
    - Retry entries carry no priority. `requeue_first` and `pause` (`agent_queue_service.rs:629`, `:647`) get their entries from `AgentQueueEntry::retry_of` (callers `agent_job_service.rs:5517`, `:5721`), and neither sets `priority`. Usage-limit, paused and unresumable retries therefore show "no priority" or `-`. Order isn't affected, because they are pinned. Fix: set `priority` from `ticket_priority` there.
    - In the fix agent's screenshots the stats say "0 Queued" next to 5 queued entries. On the old base that is DEV-771's bug, which `main` fixes; after the rebase it should be gone. Check it in the new screenshots.

    **The rest holds**
    - Order (priority, then kind, then arrival), `kind()` from the profile name, the priority stored at queue time, pinned entries, moves keeping prompt/model/effort/thread, and busy tickets waiting without a slot all match "Done when" and the first review.
    - The default `issue_priorities` is Low, Medium, High (`crates/lotar-core/src/config/types.rs:1421`), so `Reverse(position)` puts the highest first, as intended.

    **Reran**
    - `npm ci`: ok.
    - `cargo nextest run -p lotar-agent -E 'test(/queue/)'`: 20 passed.
    - `cargo nextest run -p lotar-lib --test integration -E 'test(/dev786/)'`: 1 passed.
    - `vitest` `AgentQueuePanel.spec.ts` and `AgentJobs.spec.ts`: 36 passed.
    - Not run: full `npm run lint`, `npm test`, `npm run smoke`. The rebase changes the code they would check.
    - Screenshots: I read the fix agent's after set (1440 light, 1920 and 390 dark). The layout looks fine. I didn't take my own: the page changes with the rebase, so the rework needs new screenshots anyway.
