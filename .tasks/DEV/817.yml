description: |-
  Found: the owner changed the release rule for every repo (2026-11-22, chief of staff thread): "Only minor changes need my okay. Patch level updates can always be done". Major releases still ask him. Recorded in standards STD-311, docs/decisions/2026-11-22-releases.md. Here .github/skills/release/SKILL.md step 4 still says every tag needs his OK, and docs/release-guide.md (Pre-Release Checklist, step 1) says he picks the bump.

  ## Done when
  - [ ] SKILL.md step 4: a patch release (only Z of vX.Y.Z changes) is tagged, pushed and released without asking; a minor or major release asks him first (HelpNeeded on the release ticket when you can't ask directly), quoting his words.
  - [ ] release-guide.md: the bump stays a patch by default; a minor or major one only on his OK; patch releases need no OK.
  - [ ] No other line in AGENTS.md, docs/ or .github/ still says each release asks him (grep release + OK/owner).
  - [ ] DEV-804 (v0.15.7) and later patch releases go ahead without waiting for him.
