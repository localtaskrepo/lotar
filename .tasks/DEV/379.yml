- date: 2026-11-12T19:20:49.136036+00:00
  author: claude
  text: 'claude: Cause: a race in the test, not a product bug. The search returns the right row every time (with a 1 s wait: always only ''Minor crash''). TasksList shows a loader instead of the old rows while a new filter query loads (by design, view/pages/TasksList.vue:463). The test polled only for ''Old crash'' to be gone, which already holds during that loader moment, then checked ''Minor crash'' once and found 0. Sampling rows every 30 ms after Enter caught the empty table. It failed 4 of 9 runs on this base. Fix: the test now polls for the whole result at once ({Old: 0, Minor: 1, New: 0}). The same assertions stay, none removed. Commit a40a85f on agent/DEV-379. Checks: ticket check command 10 of 10 passes in a row; npm run lint, npm test (2062 Rust + 1469 UI) and npm run smoke (381) pass.'
- date: 2026-11-12T19:25:47.730936+00:00
  author: claude
  text: 'claude: Merged. Rebased agent/DEV-379 onto main (1a6a46b, DEV-378) with no conflicts, fast-forwarded main to b8484d2, and committed ticket files as 41c1a45 ''DEV-379 Ticket updates'' (DEV-373, 375, 377, 378, 379, 380, 381). Not pushed: main also holds DEV-378''s unpushed commit 1a6a46b, which waits for its own session. Checks after the rebase: npm run lint, npm test (2065 Rust + 1469 UI) and npm run smoke (381) pass. The ticket''s check command (build:smoke, then the spec) passed 3 runs in a row.'
