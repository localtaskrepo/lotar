description: |-
  DEV-465's own run on 2026-11-13 shows reviews reading an obsolete commit. The rework after the first blocking review committed `af60ab9c` on a branch T3 Code named for that thread (`t3/failed-merge-landed-skip-fix`), not on `agent/DEV-465`. `agent/DEV-465` stayed at the first fix `ca054282`. Later `session: fresh` review threads checked out `ca054282` and blocked twice on code that main (9921ee06) had already replaced. That sent the ticket to the owner's inbox (INBOX-22, INBOX-23, INBOX-24 within 7 minutes), and the triage agent had to explain that the work was already on main. One fix ended up on six branches: agent/DEV-465, t3/failed-merge-job-already-on-main, t3/failed-merge-already-landed, t3/failed-merge-work-on-main, t3/failed-merge-landed-skip-fix, t3/failed-merge-landed-work.

  ## Found

  - Comments on DEV-465 from 09:54Z (rework) to 10:10Z (the second blocking review, then the triage that reset the branches).
  - Threads: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Ad235e56b-5c16-4772-a251-4b16ae279f39 (rework), https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A9d3c782c-3542-4a4f-ad76-f1853f27a886 and https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A6c91b051-9104-450f-a1e0-b4f08610185c (the reviews of the obsolete copy).
  - DEV-342 (Done) fixed the merge job's branch check; DEV-414 (Done) added the fresh thread on the open branch.

  ## Check

  A test: a rework job in a new thread (DEV-408) commits; the next `session: fresh` job checks out that commit, and the ticket's agent branch points to it.

  ## Done when

  - [ ] Every job of a ticket, in any thread, commits to and reads from one branch (the ticket's agent branch), with a test.
