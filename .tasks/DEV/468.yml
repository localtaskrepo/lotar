  text: 'Rebased by porting: main replaced lotar''s own T3 runner with the harnessmux crate (DEV-503) and deleted tests/dev318_t3_runner_test.rs, so ccc96841/9d77abc6 could not be rebased. The bug is still there on main: plan_t3_worktree starts each thread from agent/<ticket>, while record_t3_worktree records T3 Code''s t3/<topic> branch. New commit 57c416bb (signed) on branch t3/rework-commits-on-ticket-branch-3, on top of main e64997ea: finalize_job, after commit_leftover_work, moves the ticket branch to the T3 thread''s branch (follow_thread_branch / move_ticket_branch in crates/lotar-lib/src/services/agent_job_service.rs). A refused move (unlanded commits the thread lacks, or the branch checked out elsewhere) fails the job and leaves the branch. Compared with 9d77abc6: plain-string reasons (no doubled ''Validation error:''), only t3 jobs, and a ticket branch whose extra commits already landed may move (a merge thread that rewrote commits). Tests in crates/lotar-lib/tests/dev503_harness_jobs_test.rs with a fake t3 CLI through harnessmux: every_t3_thread_of_a_ticket_ends_on_and_starts_from_the_tickets_branch (fix, then rework left uncommitted, then a fresh review starts from LoTaR''s rework commit) and a_ticket_branch_that_cannot_follow_its_thread_fails_the_job. Both fail on main''s code and pass with the fix. docs/help/agent.md T3 section updated. Checks: npm run lint:agent, npm run test:agent (2152 Rust, 1537 UI, release, hooks) and npm run test:smoke:agent (401) passed; build:web had to run first in this fresh worktree. The old commits stay on t3/fix-rework-commits-ticket-branch. Note: docs say T3 threads no longer create worktrees (owner, DEV-503), but this thread itself runs in a T3 worktree on t3/rework-commits-on-ticket-branch-3, so the fix is a no-op when no worktree appears and acts when one does.'
