- date: 2026-11-16T19:42:22.323629+00:00
  author: claude
  text: |-
    The DEV-464 smoke test now waits out a busy server instead of failing on the first refused release create.

    - Could not reproduce: the spec passes alone and inside all UI specs at load ~125; the original status wasn't recorded
    - The create's only refusals that say "mutation was not run" are 503 BUSY (connection cap, `web_server.rs`) and a 400 storage lock still held after 2 s (`safety.rs`); the test retries just those, every 250 ms for up to 15 s
    - The assertion now prints status and body, so a different cause names itself next time
    - `smoke/tests/ui.releases.smoke.spec.ts`, commit `3c4bbaa6` on branch `t3/28cf1eef` (this thread's worktree, not `agent/DEV-615`)
  report:
    commits:
    - hash: 3c4bbaa6
      what: the DEV-464 test retries a create the server refused as busy and names status and body on failure
    checks:
    - command: npx vitest run --config smoke/vitest.config.ts tests/ui.releases.smoke.spec.ts
      result: passed
      reason: 5 runs, 3 of 3 each, with LOTAR_BINARY_PATH=/opt/homebrew/bin/lotar (0.15.1)
    - command: npx vitest run --config smoke/vitest.config.ts tests/ui.
      result: passed
      reason: releases spec 3 of 3 inside all 79 UI specs; 5 other failures come from the 0.15.1 binary
    - command: tsc -p smoke/tsconfig.json, oxlint, prettier
      result: passed
    - command: npm run build:smoke
      result: not_run
      reason: killed after 30 min at load 110-130 (many parallel agent builds)
    - command: npm run lint (Rust parts), npm test, npm run smoke
      result: not_run
      reason: test-only TypeScript change, and no binary of this checkout could be built
    next: Review, then merge; the merge agent reruns the check against main's build
