- date: 2026-11-16T20:55:42.991716+00:00
  author: claude
  text: |-
    Fixed: the DEV-464 row-menu test now waits for the release create instead of failing on the first refusal.

    - Earlier jobs failed on Claude rate limits, not the work
    - I couldn't reproduce the refusal: the test passed in 1 full smoke run and 3 UI-only runs at load 40–200 (other UI tests flaked instead)
    - `smoke/tests/ui.releases.smoke.spec.ts`: the `POST /api/releases/create` runs inside `expect.poll` (15 s); on timeout the failure shows the last `status body`, so a real server error stays visible
    - Possible cause, filed as [DEV-622](https://lotar.pyxzl.net/task/DEV-622): `web_server.rs` treats a failed socket read as end of request (`unwrap_or_default`), so a slow or interrupted read cuts the body and gives a 400
  report:
    commits:
    - hash: 892eb10d
      what: the row-menu test retries the release create and fails with the last status and body
    checks:
    - command: npx vitest run --config smoke/vitest.config.ts tests/ui.releases.smoke.spec.ts
      result: passed
      reason: 3 of 3
    - command: npm run test:smoke:quick:agent
      result: passed
      reason: 405 of 405, load ~200
    - command: npm run lint:frontend, oxlint, fmt:js:check, cargo fmt --check
      result: passed
    - command: cargo clippy (lint:backend)
      result: not_run
      reason: no Rust change, machine overloaded (63 min smoke build)
    - command: npm test
      result: not_run
      reason: no Rust or view change; the edit is a smoke spec only
    next: Review, then merge; the merge agent reruns the check command on main
- date: 2026-11-17T01:50:38.798184+00:00
  author: claude
  text: |-
    Review: passed. `892eb10d` makes the DEV-464 test wait out a refused release create; it fits "or the test waits for it".

    - Read: the ticket and its comments, [DEV-622](https://lotar.pyxzl.net/task/DEV-622) (possible root cause, filed), `ReleaseService::create`, `smoke/vitest.config.ts`, AGENTS.md. No commits to the spec on main since `9b5c09e8`
    - Change: test only (`smoke/tests/ui.releases.smoke.spec.ts:107-124`). Workspace and server are per test, so retrying version `0.16.0` can't collide with another test. On timeout the poll reports the last `status body`, so a real server error still shows
    - No failing-before test: the fix agent couldn't reproduce the flake, says so, and filed the suspected cause as DEV-622. Fine for a flaky test
    - Note: it retries every non-ok answer, also a deterministic 400, which only delays that failure by 15 s. Not blocking
    - Note for the merge: the earlier attempt `3c4bbaa6` is still on branch `t3/28cf1eef` (it retried only 503 and lock errors). Merge `agent/DEV-615` only; that branch is obsolete
    - Reran: `npm run test:smoke:agent -- tests/ui.releases.smoke.spec.ts` passed (3 of 3), and `npx prettier --check` on the spec is clean. Full `npm run smoke` not rerun
