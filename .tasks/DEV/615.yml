  author: claude
  text: |-
    The DEV-464 smoke test now waits out a busy server instead of failing on the first refused release create.

    - Could not reproduce: the spec passes alone and inside all UI specs at load ~125; the original status wasn't recorded
    - The create's only refusals that say "mutation was not run" are 503 BUSY (connection cap, `web_server.rs`) and a 400 storage lock still held after 2 s (`safety.rs`); the test retries just those, every 250 ms for up to 15 s
    - The assertion now prints status and body, so a different cause names itself next time
    - `smoke/tests/ui.releases.smoke.spec.ts`, commit `3c4bbaa6` on branch `t3/28cf1eef` (this thread's worktree, not `agent/DEV-615`)
