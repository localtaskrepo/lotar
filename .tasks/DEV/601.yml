- date: 2026-11-16T03:07:41.388238+00:00
  author: claude
  text: |-
    Fixed: the test now waits up to 60 s for its locks instead of 2 s, and still checks that each transaction reads back its own write.

    - Cause: the lock is polled every 10 ms, so one worker can take it back right after each commit; the other may wait out all 25 of its rounds. The old helper allowed 7 × 2 s = 14 s, and a busy machine went past that.
    - `crates/lotar-core/src/storage/transaction.rs`: removed `begin_retrying_contention`; sets `LOTAR_STORAGE_LOCK_WAIT_MS=60000` with `EnvVarGuard`, the same fix as DEV-588. No production code changed.
    - Load test: 80 runs, 16 at a time, with 24 `yes` CPU burners (load ~70): 0 failures.
