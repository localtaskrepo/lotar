description: |-
  Parallel agent worktrees each compile lotar with the `ci` profile (`npm run test:rust:agent` passes `--cargo-profile ci` in `scripts/rust-test-runner.mjs`). Measured in a fresh clone on 2026-11-11 (standards STD-40, machine load 28 to 84): `cargo build --profile ci --all-targets` 118 s wall, 346 s CPU; `cargo build --all-targets` (dev profile) 72 s wall, 96 s CPU. That's -40% wall and -70% CPU, which counts most with 8 agents building at once. sccache already caches the dependencies (7 s warm); lotar's own crate is the other ~80 s. The owner chose on 2026-11-11 to measure a lighter local profile.

  ## Plan

  - Try a profile for local agent test runs: `opt-level = 0` and `debug = "line-tables-only"` or none (dev's full debug info made target/debug 2.3 GB, against 1.4 GB for ci).
  - Measure cold build, edit-and-rebuild, `target/` size and the full nextest run time against `ci`: the `Cargo.toml` comment says opt-level barely affects runtime; check that for the slow tests.
  - If it wins, use it in `test:rust:agent` (and `npm test` locally if it fits); CI and releases keep `ci`.

  ## Done when

  - [ ] Numbers for both profiles in a comment.
  - [ ] Local agent test runs use the faster profile, or a comment says why `ci` stays.
  - [ ] CI unchanged; `npm run lint`, `npm test` pass.
