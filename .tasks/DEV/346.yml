- date: 2026-11-12T03:45:03.997122+00:00
  text: |-
    claude: Local agent test runs now use a new `agent` Cargo profile; CI and `npm test` keep `ci`. Commit b6abd48 on t3/c9798be3, not merged.

    Changed:
    - Cargo.toml: `[profile.agent]` inherits `dev`, `debug = "line-tables-only"`, `split-debuginfo = "unpacked"`. The fix agent's second profile `agentnodebug` is removed (see below).
    - scripts/rust-test-runner.mjs: `--agent` (npm run test:rust:agent) passes `--cargo-profile agent`, also for the exclusion inventory. Runner tests updated (42/42 pass).
    - .github/skills/testing-strategy/SKILL.md says that test:rust:agent builds with `agent` and `npm test` stays on `ci`.

    Numbers, `cargo nextest run --cargo-profile <p> --no-run` from scratch with warm sccache. Wall time is not usable: the machine ran at load 40 to 230 (8 agents). CPU time (user+sys) is:

    | Profile | Cold build CPU | Rebuild after touching src/lib.rs, CPU | target/<profile> |
    |---|---|---|---|
    | ci | 373 s (390 s in a second run) | 14 s | 1.4 G |
    | agent | 102 s (107 s in a second run) | 14 s | 1.8 G |
    | agentnodebug | 91 s | 18 s | 1.5 G |

    So `agent` takes 27% of the `ci` CPU for a cold build (-73%) and the rebuild costs the same. `agentnodebug` saves 10% more cold CPU but rebuilds slower and drops backtraces, so it is removed. (On wall, 8 agents at once: ci 88 to 143 s, agent 97 to 152 s, because the machine was saturated either way.)

    Full nextest run (1998 tests): ci 69 s (one clean run), agent 101 s in the final `npm run test:agent`. With the machine at load 40 to 200 the runs are not comparable on wall time: ci 136 s and 168 s, agent 116 s and 158 s. The suite is no slower at opt-level 0, so the comment in Cargo.toml holds, slow tests included. Nothing in the performance budget tests failed.

    Flaky tests: under this load, full runs failed some tests with BOTH profiles, with the same families (agent jobs, codeowners, SSE): ci 12 and 3 failures, agent 2 and 8, all of them pass when run alone (the two agent-job tests, 5 of 5). One failure was "Ticket 'TEST-1' has an active agent job" from the machine-wide process scan. That is DEV-349 and DEV-348, not a profile effect. I filed nothing new.

    Checks run on the final tree: `npm run lint:agent` pass; `npm run test:agent` pass (Rust 1998/1998, Vitest 1441, release and hook tests); `npm run smoke` pass (377 tests). `npm test` (the `ci` profile) itself was not run on the final tree, only the `test:agent` variant, which the testing-strategy skill accepts for the gate. CI workflow files are unchanged.
- date: 2026-11-12T03:49:37.657583+00:00
  text: |-
    claude (DEV-346 agent job): Measurements, worktree agent/DEV-346, 14 cores, other sessions running, load 10 to 200 (noisy). sccache warm for dependencies, target dir wiped for each cold build. Edit-and-rebuild = append a comment to src/lib.rs.

    | profile | cold build wall / CPU | rebuild | target size | full nextest |
    |---|---|---|---|---|
    | ci (opt 1) | 88 s / 373 s | 13 s | 1.4 GB | 69 s (load 55); 142 s and 153 s (load 17-24) |
    | dev + line-tables-only debug | 97 s / 102 s | 19 s | 1.8 GB | 51 s, stopped early on DEV-348 flake |
    | dev, no debug | 88 s / 91 s | 33 s | 1.5 GB | 100 s, 1 fail: stderr-burst test 0.7 s -> 15.5 s, past its 15 s deadline |
    | local: dev, no debug, dependencies opt 2 | 127 s / 148 s (load 94-123) | 9 s | 1.4 GB | 118 s and 184 s (alternated with ci runs at load 10-24) |

    Per-test times: with lotar AND its dependencies at opt 0, a few CPU-heavy tests got much slower (worker_persists_trailing_stderr 22x, cached thumbnails 9x, git overrides 8x). Keeping dependencies at opt-level 2 removes that: those tests now run at about ci speed (1.2 s vs 1.4 s, 0.9 s vs 1.1 s, 0.7 s vs 1.0 s). Summed test time over the alternated pairs (fastest of 2 per test): ci 1386 s, local 1206 s. So opt-level barely matters for lotar's own code but does matter for dependencies.

    Result: local needs about 60% less CPU per cold build than ci (148 s vs 373 s), the same target size and an equally fast rebuild. Wall time per build doesn't drop at this load; the gain is the CPU shared by parallel agents.

    Changed: new Cargo profile 'local' (inherits dev, debug = false, dependencies opt-level 2). npm run test:rust (so npm test) and test:rust:agent use it. CI calls nextest with --cargo-profile ci directly, so CI, releases and test:rust:perf are unchanged. Removed the candidate profiles. Runner tests, docs/developers/testing.md and the testing-strategy skill updated.

    Unrelated failures seen on both profiles: DEV-348 (shipped_agent_reviewed flake, 2 of 6 isolated runs failed on each profile); EAGAIN socket errors in web_api tests at load 120+; and other worktrees' lotar-agent-wrapper processes counted as active jobs, now filed as DEV-349.

    Commit 44c51976ed30e753f890b61f8f1d4044c806ea5e (signed, amended from 79fc503). Checks: npm run lint:agent passed; npm test passed (1998 Rust, 1 flaky: DEV-348 passed on retry; 1441 UI; release and hook tests); npm run smoke passed (377). Guidance: no durable finding.
