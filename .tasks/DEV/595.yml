- date: 2026-11-16T00:06:06.962493+00:00
  author: claude
  text: |-
    Fixed: the ticket branch now moves inside a clean worktree that has it checked out, and that worktree stays on the branch.

    - Cause: the MGP-13 job (21:27Z) ran a lotar build from before DEV-573 (`e0f88162`, released in 0.15.1 at 13:56 local), which had no step to detach that worktree. 0.15.1 detaches it, but a detached `agent-<ID>` worktree is the leftover that DEV-596 runs into.
    - Change: `move_ticket_branch` in `agent_job_service.rs` runs `git reset --keep <tip>` in the worktree when `git status --porcelain` is empty. A worktree with changes is still detached first, as before.
    - Tests: new `the_tickets_branch_moves_in_a_clean_worktree_that_has_it_checked_out` (it failed before the fix: the worktree ended detached). The DEV-573 test's stale worktree now has an untracked file, so it still covers the detach.
    - Docs: updated `docs/help/agent.md` in place (it still said a branch checked out in another worktree fails the job).
  report:
    commits:
    - hash: bdcc0f38
      what: move the ticket branch inside a clean worktree that has it checked out
