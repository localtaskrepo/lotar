    - command: npm run smoke
      result: passed
      reason: 405/405
    - command: ticket check (rerun MGP-13 job end)
      result: not_run
      reason: covered by new test the_tickets_branch_moves_in_a_clean_worktree_that_has_it_checked_out
    next: Review, then merge
