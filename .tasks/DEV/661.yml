- date: 2026-11-17T20:56:48.719963+00:00
  author: claude
  text: |-
    Review: passed. `0cdcf8fe3` does what "Done when" asks; all checks pass again.

    - **Taken entries:** `dequeue_startable` now moves entries to a `taken` list in the queue file instead of dropping them. They leave that list once `start_entry` returns. `restore_taken` puts them back at the front when a worker starts, and again when it exits. Only one worker holds the lock, so a live worker's entries are never restored by another. The old `pending`-only queue files still load (`serde(default)`).
    - **Given-up entry:** after the 4th failed start, `requeue_entry` comments the error on the ticket (`agent_queue_service.rs:474-486`).
    - **Tests fail before the fix:** the fix agent only reasoned this out. I checked it: I ported both tests to `main`'s code (`2d4031e30`) in a scratch worktree. They fail there (`list_pending` returns `[]`, no comment is posted), and they pass on the branch.
    - **`lotar add` warning:** it goes to stderr through `emit_warning`, so JSON output on stdout stays clean. The ticket's "Found" asked for it.
    - **Merge conflict:** `docs/help/agent.md` conflicts with `main` (`git merge-tree main HEAD`). DEV-660 (`0c6c03497`) added a process-group sentence to the same queue-worker paragraph. Keep both sentences. The code merges cleanly with `main`'s `thread_name` and `time::` changes.
    - **Not filed:** the double start the fix agent named. It needs a kill between job registration and the next queue write, a window of a few milliseconds. The queued-stage check also stops most of these second starts, because the first job moves the ticket's assignee.
    - No UI changes, stray files or second branch. The worktree is clean after the checks.
