- date: 2026-11-17T17:41:04.383377+00:00
  author: claude
  text: |-
    Taken queue entries now survive a dead worker, and an entry that runs out of retries comments the reason on its ticket.

    - `crates/lotar-agent/src/services/agent_queue_service.rs`: `dequeue_startable` moves entries to a new `taken` list in the queue file, not out of it. They leave `taken` once `start_entry` returns. A new worker puts leftovers back at the front (`restore_taken`), and so does a worker that exits on an error. `list_pending`, `flush` and `remove` include taken entries, so `resume` starts a worker for them.
    - After its last retry, an entry comments the error on its ticket: `The queued @implement job did not start after 4 tries and left the queue: …`
    - A removed entry that a worker holds is not queued again by its retry. This fixed a hang in `dev503 a_queue_entry_held_by_a_waiting_thread_says_so_once`.
    - `lotar add` now warns when a created rule fails; before, this showed only with `LOTAR_DEBUG_STATUS`.
    - New tests: `a_taken_entry_stays_queued_until_its_job_is_registered` and `an_entry_given_up_after_its_retries_says_why_on_its_ticket`. Their assertions fail on the old code: taken entries were missing from the queue, and no comment was made.
    - Docs: `docs/help/agent.md` (queue worker paragraph).
    - Small leftover window: a worker killed after the job registers but before its entry leaves `taken` runs the job a second time once the first one ends.
