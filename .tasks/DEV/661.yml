description: |-
  Found while fixing DEV-660 (2026-11-17).

  ## Found
  - `dequeue_startable` (`crates/lotar-agent/src/services/agent_queue_service.rs`) removes entries from the on-disk queue before `start_entry` registers their job. A worker killed in between (reboot, kill, a crash with `panic = abort`) loses them: no job, no comment, no queue entry. DEV-660 took one cause away (launchd killing the worker's process group); the window stays.
  - An entry whose start fails 4 times is dropped; the error only reaches the worker's stderr, which is `/dev/null`. The ticket keeps its agent assignee and says nothing.
  - `lotar add` prints a created rule's failure only with `LOTAR_DEBUG_STATUS` (`crates/lotar-lib/src/cli/handlers/mod.rs`, around line 515).

  ## Check
  Kill the worker after it takes an entry and before its job starts, or make a start fail 4 times: the entry is queued again, or the ticket says why its job didn't start.

  ## Done when
  - [ ] A taken entry stays recoverable until its job is registered.
  - [ ] A dropped entry comments the reason on its ticket.
  - [ ] Tests for both; they fail before the fix.
tags:
- health
