  text: 'All 9 feedback items shipped: (1) search/filters overlap fixed - root cause was the search input overflowing its flex container by exactly padding+border (no global box-sizing); scoped box-sizing:border-box + min-width:0. (2) Clear-all chip removed (page-header clear button remains the single clear affordance). (3) Project renders as a chip (multi-project mode) with removal support. (4) Chips moved to their own dedicated row below the bar. (5) Sprints migrated to the unified FilterBar - sprint window/allow-closed/highlight-multi view-settings live in a new FilterBar panel slot, hand-rolled columns popover replaced by shared ColumnsMenu. (6) Board header: WIP limits + Done column next to clear/reload; group-by select sits beside Fields in the filter bar. (7) Board columns get hover-revealed + buttons opening the create panel with status prefilled (new initialStatus plumbing through panel controller/host/state; validates against project statuses). (8) Calendar day cells get hover-revealed ''+ Add task'' opening the panel with due date prefilled (initialDueDate plumbing; verified E2E: 2026-09-09 prefill). (9) Preferences gains a Navigation section with per-tab visibility checkboxes (useNavTabs composable, localStorage persistence, Preferences always visible); nav filters live. Verified live at 390px: 0 overflow on all pages. Gates: lint clean, vitest 220/220.'
