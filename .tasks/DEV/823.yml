description: 'Found 2026-11-22 (DEV-808): 5 inbox answers posted at once to a `lotar serve` with standards'' INBOX/STD rules. One relay''s `lotar comment STD-1` failed at once with "A pending task/sprint transaction journal exists at <root>/.txn-pending.json; a crashed multi-file mutation is waiting to be rolled back", while the other relays ran. Nothing had crashed. refuse_under_pending_transaction (crates/lotar-core/src/storage/safety.rs) assumes "journals are only created by writers that hold this same lock", but the task lock is per project folder (STD/.task.lock) and the journal is per workspace, so a live transaction from another project''s writer (here INBOX, `lotar status INBOX-n Done`) looks like a crashed one. Check: two processes, one holding a transaction in project A, the other commenting in project B, must both succeed. Done: a live journal makes other writers wait (or doesn''t apply), and only a crashed one is refused.'
