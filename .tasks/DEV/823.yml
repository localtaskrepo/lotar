- date: 2026-11-25T07:39:25.080997+00:00
  author: claude
  text: |-
    Review: passed. A journal now only blocks writers in the folders it writes; a crashed one still refuses.

    - Read: `28f23fefb` (`safety.rs`, `transaction.rs`, the new test, `docs/developers/task-model.md`), the ticket, AGENTS.md, and the 20 commits main gained since (`DEV-802` and `DEV-838` touch `storage/` but not this logic; the branch rebases cleanly).
    - Holds: every transaction takes the `@sprints` lock first (`MultiFileTransaction::begin`), and `stage` refuses folders whose task lock it doesn't hold. So a journal that writes into the folder a writer has locked can only be a crashed one. Journals for other folders may be live, and rolling them back never touches this folder. Unreadable, unparsable or other-version journals still refuse everywhere.
    - Sprint writers (`sprint_service.rs`, owner `@sprints`) keep refusing whenever any journal lists a sprint file, as before.
    - The test failed before the fix: reverting only `safety.rs` in a detached scratch copy fails `a_journal_for_another_project_does_not_block_writers_here` with `PendingJournalRefusal`. With the fix it passes.
    - Reran: `npm ci` (ok), `cargo nextest run -p lotar-tasks -p lotar-core -E 'test(/dev55|journal|transaction|pending/)'` (31/31 passed), `cargo clippy -p lotar-core -p lotar-tasks --all-targets -D warnings` (clean), `rustfmt --check` on the changed files (ok). All ran with `RUSTC_WRAPPER=`. The full `npm test`, `npm run smoke` and `npm run lint` were not rerun: the fix agent reported them passing, and the change is limited to storage.
    - No UI changes. No stray files and no second copy of the fix. No owner decision involved. No minor tickets filed.
