- date: 2026-11-23T06:53:44.758425+00:00
  author: claude
  text: |-
    Fixed: a pending journal now only blocks writers in the folders it writes.

    - Cause: `refuse_under_pending_transaction` (`crates/lotar-core/src/storage/safety.rs`) refused on any `.txn-pending.json`, but writers hold only their own folder's lock.
    - Fix: it reads the journal (`pending_journal_touches` in `transaction.rs`) and refuses only if a write is under the locked folder. A transaction holds the task lock of every project it journals, so such a journal is a crashed one. Other journals may be live, and their rollback never touches this folder. An unreadable journal still refuses everywhere.
    - Test `a_journal_for_another_project_does_not_block_writers_here` (`dev55_transaction_cases.rs`) failed before the fix and passes now.
    - Updated `docs/developers/task-model.md`.
    - Hit along the way: sccache's temp dir was gone (`lotar-rust-temp-*`), so checks ran with `RUSTC_WRAPPER=`.
