    - Failures: a failed settle is logged once per process (`FAILED` set). When T3 Code can't list its threads, nothing happens until the next scan.
    - Tests: there are 3 new dev503 tests with a fake T3 Code `thread list`. Without `kept.rs` the first two can't pass, since nothing would settle `thread-0`. I didn't build the old code to show it.
    - The removed assertion in `dev626_resumed_t3_threads_test.rs:228` (T3 Code isn't asked about a cancelled job's thread) is replaced by a comment, as DEV-747 now asks T3 Code about those threads.
    - Docs: `docs/help/agent.md:179` says so.
    - Minor ([DEV-754](https://lotar.pyxzl.net/task/DEV-754)): a failed settle names the thread by its id, not by `<link>` as "Done when" asks (`kept.rs`, `settle_ticket`).
