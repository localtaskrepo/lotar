description: |-
  A T3 Code job thread that lotar leaves active is never settled later. On 2026-11-20 the owner saw 43 unsettled threads and asked whether they needed him. 33 of them were leftovers: 21 from failed or cancelled jobs, 2 from jobs that ended while the ticket was HelpNeeded, and the rest from jobs that ran before auto-settle existed. Most of those tickets are Done by now. The owner chose this fix on 2026-11-20 ("Settle + file lotar fix").

  ## Context

  - `settle_t3_thread` (crates/lotar-agent/src/services/agent_job_service.rs:5529) runs only when a job completes. Per docs/help/agent.md:179, the thread stays active when the job failed or was cancelled, or when the ticket waits for a person. That is right at the time, but nothing settles those threads afterwards.
  - Examples:
    - DEV-732: failed jobs job-20261120T134548.567Z-11 and job-20261120T142256.382Z-15 (DEV-729) left threads b70b2201… and f878a77d… active. Later DEV-732 jobs settled their own threads, and the ticket is Done.
    - STD-262 (job-20261120T101421.894Z-1) and FND-24 (job-20261120T180657.811Z-1) were HelpNeeded at job end and are Done now.
  - Agents can't clear these threads by hand. `t3_thread_organize settle` on a full-access `mcp:launch:` thread is refused with `runtime_mode_escalation_denied`, so only lotar (through `harnessmux::backend::t3::settle`) or the owner can settle them.

  ## Plan

  1. Record each t3 job's thread whether or not it was settled. The job's harnessmux session already holds it.
  2. Settle every thread of a ticket that lotar kept active when either of these happens:
     - a later job on the same ticket completes and settles its own thread;
     - the ticket reaches a done state (Done, WontDo, or the project's done statuses), whichever way it got there (agent, owner, web UI, CLI).
     In both cases skip a thread whose run is still going, and log `Settled the T3 Code thread <link>` in the job it belongs to, or in the ticket's history.
  3. Catch-up: the same check runs once on `lotar serve` start, or on `lotar agent worktree cleanup`, so leftovers from before this change get cleared.
  4. Tests: a failed job's thread is settled once a later job completes; a HelpNeeded thread is settled once the ticket is Done; a running thread is left alone.
  5. Update docs/help/agent.md:179.

  ## Done when

  The rule (one check, three triggers): a kept thread is a ticket's T3 Code thread of an ended t3 job (any outcome, cancelled too) that `t3 thread list` shows unsettled with status `completed`. It is settled when its ticket is in a done state, or when the thread of a later-ended job on the same ticket is settled. A thread whose run still goes or waits (status `running`/`waiting`, or a live harnessmux session follows it) is left alone; so is one with another status (`failed`, `interrupted`): harnessmux refuses to settle those.

  - [ ] Trigger: every job end (after the job settles its own thread), and the scan `lotar serve` and the queue worker already run every 30 seconds (DEV-626), which also runs once at `lotar serve` start: that is the catch-up. A done state reached any way (CLI, web UI, agent) is picked up by the next scan or job end; no hook on status changes.
  - [ ] Each settle logs `Settled the T3 Code thread <link>` in the newest job that ran the thread. A settle that fails (no harnessmux session, T3 Code refuses) logs `The T3 Code thread <link> was not settled: <reason>` once per process, and the next thread goes on.
  - [ ] T3 Code can't list its threads: nothing happens, the next scan tries again.
  - [ ] Tests (fake T3 Code): a failed job's thread is settled once a later job completes; a HelpNeeded job's thread is settled once the ticket is Done; a running thread is left alone.
  - [ ] docs/help/agent.md (T3 Code threads) says so.
  - [ ] After the build with this is installed and `lotar serve` restarted, today's leftovers are settled (T3 sidebar shows only threads that still need someone). Checked by the owner or a later job: this job can't install the build.
