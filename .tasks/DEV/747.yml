    Review: passed. Commit `eafd1cc49` does what "Done when" asks. One minor finding is filed as [DEV-754](https://lotar.pyxzl.net/task/DEV-754).

    - Read: the diff of `main..HEAD` (one commit), the ticket and its comments, DEV-626, DEV-729, DEV-732, and the last 5 main commits on each touched file. The branch merges into main without conflicts (`git merge-tree`).
    - One check, three triggers: `kept::settle_now` runs at every job end, after the job settles its own thread (`agent_job_service.rs:5379`). `kept::settle` runs in `resumed::look`, which `lotar serve` and the queue worker run at start and every 30 s. There is no hook on status changes.
