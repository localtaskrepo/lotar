- date: 2026-11-21T00:53:43.741745+00:00
  author: claude
  text: |-
    Kept T3 Code threads are now settled once the ticket is done, or once a later job's thread on the ticket is settled.

    - New `crates/lotar-agent/src/services/agent_job_service/kept.rs`: one check, run at every job end and in the 30 s look `lotar serve` and the worker already run (DEV-626). It also runs once at serve start, which is the catch-up.
    - It uses `t3 thread list` (`settled`, `status`), so it records nothing new. Step 1 of the plan needed no change: the job's status line already holds its thread for every outcome.
    - It settles only threads listed unsettled with status `completed`. It skips a thread that runs or waits, or that a live session follows. A failed settle is logged once per process.
    - It logs `Settled the T3 Code thread <link>` in the newest job that ran the thread.
    - Cancelled jobs' threads count too. `dev626…the_thread_of_a_cancelled_job_is_left_alone` no longer asserts that T3 Code isn't asked.
    - 3 new tests in `dev503_harness_jobs_test.rs` (failed job then a later job; HelpNeeded then Done; running thread left alone). `docs/help/agent.md` is updated.
    - No hook on status changes: a Done set from the CLI or UI is picked up by the next look or job end. `agent worktree cleanup` is unchanged.
    - Guidance: no durable finding.
