  text: |-
    Merge blocked by required checks; main was not changed.
    - Rebased cleanly onto main: `5dd5d739` is now `5e76d9ee`.
    - `RUSTC_WRAPPER= npm run lint:agent` failed with TS2307 for `highlight.js/lib/core` and language imports in `view/utils/highlight.ts`. `test:agent` and `test:smoke:agent` stopped in the web build on the same missing dependency. All commands have finished.
    - No merge, push, trust changes or source edits. The previous review passed; these failures occurred after rebasing onto current main.
    - May I refresh this worktree dependencies with `npm ci`, rerun the required gates, and continue the merge?
