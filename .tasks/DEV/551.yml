- date: 2026-11-15T01:44:44.790425+00:00
  author: claude
  text: |-
    Fixed: the runner no longer fails a passing run for the toolchain's `xcrun_db`; real leftovers still fail it. Commit `5dd5d739`.
    - `scripts/rust-test-runner.mjs`: `runTestsInFreshTemp` ignores the names in `TOOLCHAIN_TEMP_ENTRIES` (`xcrun_db`); exported, with an injectable runner for tests.
    - `scripts/tests/rust-test-runner.test.mjs`: 4 new tests: empty temp folder passes, `xcrun_db` alone passes, `xcrun_db` + a test leftover fails with only the leftover named, a failing run keeps its exit code. They failed before the fix; 46/46 pass now.
    - Not reproduced in a sandbox here (this Claude shell isn't sandboxed); the fake run covers it.
    - Checks: `lint:agent` passed; UI, release, hooks and smoke (403/403) passed. Rust: 2182/2182 passed with `-E 'not test(/without_end_rules/)'`. The full run failed only on `merge_agent_that_hands_back_without_end_rules_does_not_land`, which is already tracked in DEV-516 and is unrelated to this change.
    - New finding DEV-553: that test also leaks a git worktree under `.lotar-test-scratch/.../.lotar-worktrees` even when it passes, so the runner fails a single-test run.
