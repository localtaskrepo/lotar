- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A6b08f761-8f72-4470-acad-27ffbf3cd53d
description: |-
  Found: reviews run in codex's sandbox with RUSTC_WRAPPER= (sccache is denied there, DEV-479) end with 'rust-test-runner: error: tests left 1 entries in the temp folder; remove them where they are created: xcrun_db', after all tests passed: DEV-467 (2026-11-15 00:30), DEV-478, DEV-487, DEV-524. xcrun (Apple's cc/ld shim that rustc links through) caches tool lookups in xcrun_db under the per-user temp folder; in a sandbox that folder isn't writable, so it writes TMPDIR, which scripts/rust-test-runner.mjs (runTestsInFreshTemp, DEV-315) points at a fresh folder and requires empty. Not reproduced outside the sandbox: the same relinking run (touch a source file, RUSTC_WRAPPER= npm run test:rust -- pending_outcome_tests) leaves nothing. The file comes from the toolchain at build time, not from a test.

  Check: in a sandboxed agent job, RUSTC_WRAPPER= npm run test:rust -- <filter> exits 1 with xcrun_db as the only leftover.

  Done when: a passing run isn't failed for the toolchain's xcrun_db (for example the runner ignores that one name, or gives the build its own temp folder), real test leftovers still fail the run, and scripts/tests/rust-test-runner.test.mjs covers both.
