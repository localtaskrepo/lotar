  text: 'Merged into main as 3d4db183 (rebased twice onto a moving main without conflicts, fast-forward, signed). Checks in the worktree on the final rebase: npm run lint passed; cargo nextest 2125 of 2125 passed; the 14 agent, automation and review smoke specs passed (94 tests), because DEV-408 changed agent_job_service.rs since the last full smoke. Earlier on the first rebase: frontend 1507/1507, release 47 and hooks 7 passed; full smoke had 11 UI failures at load ~45 that all passed on rerun. Full Rust runs at load 25 to 35 failed merge-pipeline tests on their 6 to 10 s waits; they timed the same on main''s code as on this branch (2.4 to 3.2 s each, 3 runs apiece), so load caused them, not this change. responses_forbid_cross_site_framing failed next to the other web tests on main''s code too; filed as DEV-413.'
