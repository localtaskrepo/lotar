description: |-
  Worktree cleanup still keeps a branch whose work landed on main in a reworked form that conflicts at every commit. DEV-366 handled rebased and reworked branches but named this case (DEV-343's real branch) as left over, with "a record of what the merge job landed" as the fix, "a follow-up if wanted". No ticket tracked it. Found by the QA test run in standards (STD-59, 2026-11-12).

  ## Done when
  - [ ] The merge job records what it landed for a ticket, and cleanup removes a Done ticket's worktree and branch when that record is on main
  - [ ] Test with a branch whose commits conflict with main's version of the same change
