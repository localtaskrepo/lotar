  text: |-
    Waits for DEV-776 to land on main: the bug comes from its change, which isn't on main yet.

    - DEV-776 (status Merging) added the lone `-` → stdin branch in `resolve_comment_text` (`crates/lotar-lib/src/cli/handlers/comment.rs`); commit `3968c82a1` is only on `agent/DEV-776`
    - `main` (`878c80d5f`) doesn't have it, so the check can't reproduce here, and a fix now would edit the same lines and conflict
    - Plan once DEV-776 is in: refuse more than one of `-m`, `-F` and TEXT (a lone `-` counts as `-F -`) with a hint, in `resolve_comment_text`; tests in `crates/lotar-lib/tests/dev282_cli_safety_test.rs`; update `docs/help/comment.md`
references:
