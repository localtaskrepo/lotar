description: 'Found (DEV-776 review): since DEV-776 a lone `-` as TEXT means `-F -`, which comes before `-m` in `resolve_comment_text` (crates/lotar-lib/src/cli/handlers/comment.rs:362). So `lotar comment <ID> -m msg - <<EOF` saves the stdin text and drops msg without a word; before DEV-776 the `-` was dropped instead. Check: `lotar comment <ID> -m msg - <<<''other''`. Done: giving more than one of -m, -F and TEXT is refused with a hint (or -m and a lone - is), never one silently dropped.'
tags:
- health
