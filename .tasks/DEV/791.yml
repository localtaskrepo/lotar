  text: |-
    Fixed: giving more than one of -m, -F and TEXT is now refused with a hint; nothing is silently dropped.

    - `resolve_comment_text` in `crates/lotar-lib/src/cli/handlers/comment.rs` checks first: e.g. `-m msg -` fails with exit 1, `Give the comment once, not with -m and TEXT: only one of them would be saved. Hint: …`
