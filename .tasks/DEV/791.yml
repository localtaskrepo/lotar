    - Test `more_than_one_comment_source_is_refused` in `crates/lotar-lib/tests/dev282_cli_safety_test.rs`: four combinations, nothing saved
    - Docs: `docs/help/comment.md`, `docs/help/task.md`
    - Branch fast-forwarded to `main` (`e343b4e33`, has DEV-776) before the change
