- date: 2026-11-13T19:28:42.100162+00:00
  author: claude
  text: 'Fixed in 30840f78. A taken-over t3 job without a recorded thread id now looks the thread up with `t3 thread list --json` (in the job''s T3 project): the first thread created within 10 minutes after the job started whose title starts with the ticket ID. It records and links that thread, then ends from its state as before. With no such thread the job fails and names why. In the INBOX-37 case the thread ''INBOX-37 …'' was created 1.7 s after the job started, so the job would have ended from its completed run, and the inbox failure rule would not have handed INBOX-37 back. Tests: two new integration tests in tests/dev318_t3_runner_test.rs (thread found among decoys; no thread → fails); the first failed before the fix. docs/help/agent.md updated. Checks: npm run lint, npm test (2135 Rust, 1515 UI, release and hook tests), npm run smoke (390): all pass. Not changed: a session: continue job''s thread id (on_t3_thread_continued) still isn''t written to the active-job record, so a takeover of such a job still can''t find its thread; I left that out because a continued thread''s state can still show the previous run before the queued turn starts. Not checked: why process 25885 lost the thread line.'
- date: 2026-11-13T19:32:14.275887+00:00
  author: codex
  text: 'Review: blocking. src/services/agent_job_service.rs:1223-1229 matches only ticket prefix and creation window, then selects the earliest thread. Multiple same-ticket attempts or agent-created same-ticket threads within ten minutes are indistinguishable: takeover can apply another run outcome and fire incorrect end rules. Recover using a persisted job-specific identity, or at least reject ambiguous matches; add a regression with two matching threads and different outcomes. Read full commit, ticket/comments, related DEV-378/467/480, runner/takeover paths, docs and recent main history. No docs/decisions directory exists. git diff --check passed. Targeted dev318 suite compiling after authorized retry of sccache denial; result follows. No files or commits changed; status and assignee unchanged.'
- date: 2026-11-13T19:34:52.873108+00:00
  author: codex
  text: 'Review: blocking (verification complete). Authorized npm run test:rust -- dev318_t3_runner_test passed all 24 tests (2111 skipped). git diff --check passed. Existing tests do not cover multiple same-ticket candidates. Full lint/UI/smoke not rerun. No minor tickets filed, source edits or commits; status and assignee unchanged. review-blocked remains for job-end routing.'
- date: 2026-11-13T19:44:23.198390+00:00
  author: claude
  text: 'Rework of the review finding (agent_job_service.rs thread lookup could pick another same-ticket thread): amended as 36519457. The lookup no longer takes the earliest match. job_thread_candidates returns every thread whose title starts with the ticket ID and that was created within 2 minutes (was 10) after the job started. A single match is the job''s thread. With several (the agent started one, or another job ran on the ticket), the job fails and names them, so it never applies another run''s outcome. With none, it fails as before. T3 Code has no job-specific identity to match on (thread start/list take no request id or tag, and the prompt holds no job id), so rejecting ambiguity is the safe option; the narrower window keeps threads the agent starts later out of the match. New test a_job_without_its_thread_id_and_several_threads_for_its_ticket_fails: it failed against the previous commit''s code (that code completed the job from thread-first) and passes now. docs/help/agent.md updated. Checks: npm run lint, npm test (2136 Rust, 1515 UI), npm run smoke (390): all pass.'
