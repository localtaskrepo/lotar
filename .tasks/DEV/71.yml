    Closure — independent review signed off (corrected raw-value validation accepted; all 35 integration + 5 unit DEV-71 tests executed, no git cfg needed).

    Outcome: One config-set candidate for every mutation path. Names normalize across flat and dotted canonical aliases (CONFIG_PATHS incl. default.strict_members/issue.tags exceptions, deterministic ambiguity rejection); names and RAW values are validated BEFORE the matches-global clear conversion, so CLI, service, REST, and MCP enforce the same conflict/validation contract against real affected tasks with per-project inheritance overlays and before/after gating (only newly introduced violations block). Dry run runs the full pipeline minus the write with nonzero exits on failure; --force escapes only task-compatibility conflicts, never schema or resolved invariants. Rejections preserve bytes exactly and create no files; malformed existing global/project configs and task files fail closed. Multi-entry batches save once; empty project values clear field-precisely and preserve agent sibling settings. No REST/MCP API shape change; documentation matches actual CLI --config/--force behavior. No CAS added: config writes remain documented lockless single-file atomic (not concurrent-atomic transactions); accepted canonical writes keep the documented comments/unknown-key lossiness.

    Evidence: FINAL post-production-fix gates all exit 0 — npm run lint:agent (vue-tsc view only, clippy --all-targets --all-features -D warnings, fmt); npm run test:agent nextest default concurrency --retries 0: 1079 passed, 1 LEAKY classification, 6 skipped, across 121 binaries (supersedes the earlier 1071-run that predates the final fix); UI 449 tests / 60 files; smoke fresh build (Rust 17.99s): 134 passed, 23 skipped (157 tests / 42 files; subset 37 pass / 5 skip); panel-persistence targeted 2/2 verified in a real browser. DEV-71 = 40 tests (35 integration + 5 unit).

    Remaining: 13 whole + 4 partial test files cfg-excluded (no_git_tests), 6 ignored, and 23 smoke git-gated skips are baseline exclusions, not passes; existing raw smoke TS debt remains outside lint: view; the single nextest LEAKY flag appeared in the final run and was absent in the prior run, test name unidentified — persisted as a verification follow-up on DEV-76 with log /var/folders/sd/8vwyr5jx7p9_0mknmb7rrsbw0000gn/T/kilo/dev71-verify2-20260917-035114-16743/test-agent.log and nested junit target/nextest/default/target/nextest/junit.xml (latter overwritable). No unsupported pre-existing claim; no hidden retries (--retries 0). Done on the basis of all required gates exiting 0 plus review signoff — the leak is not claimed resolved.

