- date: 2026-09-16T21:33:39.256725+00:00
  text: |-
    Plan (implementation not started; research verified in current checkout):

    SCOPE: One shared config-set candidate path used by CLI set, ConfigService::set (REST/MCP), and the update_config_field/clear_project_field wrappers. Build+validate one candidate against real affected tasks with fresh configs, then a single atomic save; dry-run omits only the write.

    VERIFIED DEFECTS: set.rs dry-run returns before field/value validation and uses fake PROJ-1 conflict logic keyed on 'issue_states.values'; update_config_field (operations.rs:327) swallows malformed configs (unwrap_or_default/new) and saves BEFORE resolved validation; ConfigService::set loops per-field saves (partial state) and ensures config.yml before validation; clear_project_field nukes whole agent_automation/agent_worktree sections; validate_field_name accepts flat only (documented dotted keys rejected); resolution.rs:144 -C override uses naive dot->underscore (breaks default.strict_members, issue.tags).

    DECISIONS: D1 REST/MCP reject task conflicts via existing validation envelope, no new force/dry-run API fields (CLI-only escape). D2 dry-run conflict without force exits nonzero; schema always blocks under force; force escapes only task-enum conflicts (+prefix conflicts), never schema/hard resolved errors. D3 keep lockless writes, one atomic write per operation, no CAS/locks (DEV-55 untouched). D4 field-precise project clears (empty value = clear that override only; preserve sibling agent settings); global empty-value semantics unchanged (empty enum list stays a schema error). Field names canonicalized via CONFIG_PATHS (default.strict_members->strict_members, issue.tags->tags; flat still accepted); canonical-name collisions across multi-field input rejected deterministically. Affected-project resolution respects home/env/CLI precedence with the candidate in memory (reuse pure overlay fns; no cache pollution); masked fields skip task-conflict checks. Task enumeration: primary root only, list_visible_subdirs (excludes @/sprints), fail-closed parse of numeric-stem task yml + project configs; Storage::new forbidden (bootstraps config), use try_open/direct loads. Only newly-introduced violations block (before/after validity per changed constraint). default_status/default_priority not-in-list stay WARNING (no upgrade); hard-error fixtures: alias targets, strict_members w/o members, default_tags subset.

    FILES: new src/config/candidate.rs; operations.rs (wrappers, fail-closed loads, precise clears); normalization.rs (shared field canonicalizer); cli/handlers/config/set.rs rewrite; services/config_service.rs (single-save, ensure moved to save-time, readonly default-project resolution w/ read-only auto_detect_prefix fallback); optional trivial: resolution.rs -C canonicalizer, else explicit follow-up ticket.

    INVARIANTS: rejected change = zero byte changes + no new artifacts beyond pre-existing resolver dir creation (tested at CLI process boundary); accepted = exactly one config file written once; dry-run identical minus write; deterministic alias maps (duplicate rejection, no iteration overwrite); user YAML backwards compatible.

    TESTS: config_validation_test.rs (atomicity, bytes-exact on reject, malformed-config preservation), config_advanced_features_test.rs (dry-run exit codes, force semantics), new candidate integration tests (task conflicts real vs pre-existing-invalid non-blocking, inherited-resolved errors without tasks, warning-not-upgrade, agent-subfield clear, multi-field all-or-nothing, dotted names, no-artifact-on-rejection), REST/MCP conflict rejection envelope. Final gates: npm run lint, npm test, npm run smoke.
- date: 2026-09-16T22:05:25.291325+00:00
