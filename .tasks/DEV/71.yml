    Implementation complete, independent review pending; status stays InProgress.

    OUTCOME: One shared candidate pipeline (src/config/candidate.rs) now backs CLI config set, REST/MCP ConfigService::set, and the update_config_field/clear_project_field wrappers. All entries canonicalize through CONFIG_PATHS (flat + dotted incl. default.strict_members/issue.tags exceptions; ambiguous canonical duplicates rejected deterministically, identical values dedup); schema/config/resolved/real-task validation runs before exactly one atomic write; dry-run runs the identical pipeline minus the write and exits nonzero on would-be rejection (D2); --force escapes only task-compatibility conflicts (D2); REST/MCP keep their request shape and default-reject conflicts (D1); writes stay lockless single-file atomic, no locks/CAS (D3); project empty-value clears are field-precise with sibling-preserving agent/worktree pruning (D4). Affected-project analysis respects per-field project overrides and runtime precedence via new pure resolution::preview_* fns (no cache reads/writes, no storage bootstrap: fail-closed loads, Storage::new avoided). Only NEWLY introduced violations block (before/after comparison at config, resolved, and per-task levels); default_status/default_priority mismatches stay warnings. -C/--config overrides now share the canonicalizer.

    FILES: new src/config/candidate.rs (+5 unit tests); src/config/operations.rs (canonicalize_field_name/is_global_only_field_name, static field lists +web_ui_path gap fix, precise clears, wrappers); src/config/resolution.rs (preview fns, -C canonicalization); src/types.rs (enum_token_eq shared); src/cli/handlers/config/set.rs (rewrite: no ensure before validation, readonly default-project + read-only auto_detect fallback); src/services/config_service.rs (single-save all-or-nothing set, value_matches_global extracted, ConfigSetOutcome shape unchanged + Debug); tests/dev71_config_set_candidate_test.rs (27 tests: real CLI process, direct service, REST route, MCP tool); docs/help/config.md (force/dry-run/lockless-race honesty, dotted names, --config fix: docs claimed -C short flag that was never registered); smoke/tests/ui.panel-persistence reordered to configure custom states BEFORE seeding default-status tasks (new conflict gate is intentional).

    VERIFICATION (nextest --retries 0, no git needed): dev71+config+dry_run+mcp+force+cli_init batch 241 passed; dev67/workspace/storage/api/web/sprints/scan batch 126 passed; cli_/sync_/task_/agent_/sprint_ batch 270 passed (1 pre-existing leaky pass). cargo fmt --all --check clean; clippy --all-targets 0 warnings. Live target/ci/lotar evidence: rejected set leaves fresh tasks dir empty (exit 1); server.port dotted applies canonically with auto-promote; real conflict names ENG-1 with force hint and blocks the write. NOT RUN: full npm test/lint/smoke gates, browser smoke, UI runtime unchanged (deferred to final gates per plan).

    Remaining: independent review; full gates before handoff.
- date: 2026-09-16T22:20:22.504594+00:00
  text: |-
    Review fix applied (validation bypass, classified must-fix): ConfigService::set now canonicalizes and schema-validates ALL raw entries BEFORE the dedup-to-clear conversion (candidate::validate_raw_entries shared with the CLI pipeline), so a malformed CSV like issue_states 'Todo,,Done' can never compare equal-to-global, clear an override, and return 200; REST and MCP inherit the same contract through the service. Empty project values remain accepted only as the documented field-precise clear (validate_raw_entries skips project-scope empties exactly like the candidate); value_matches_global now takes the canonical field and is documented as never the acceptance path for malformed values. Also: clap --force help corrected to 'Apply despite task-compatibility conflicts with existing tasks (schema errors still block)' in src/cli/args/config.rs only (args_config.rs untouched); fail-closed malformed-config errors now name the file/project path.

    New regressions (tests/dev71_config_set_candidate_test.rs, now 35): malformed-CSV rejection for service+CLI+REST(real /api/config/set request, 400, no artifacts on missing dir)+MCP(tool call, error, no artifacts) with bytes-exact preservation and no override clear; project empty enum-clear still works; force cannot bypass resolved alias invariant; malformed project config during global change preserves bytes and names the project; env-mask parity via LOTAR_ISSUE_STATES on an isolated CLI subprocess (masked candidate applies without false task conflicts, no process-global env mutation).

    VERIFICATION post-fix: dev71+config 148/148; combined regression batch (dev71/config/branch/precedence/smart_defaults/normalize/dry_run/mcp/force/cli_init/dev67/workspace/storage/api/web/sprints/scan/cli_/sync_/task_/agent_/sprint_) 562/562 passed, retries 0. cargo fmt --all --check clean; npm run lint:agent clean (vue-tsc + clippy --all-targets --all-features -D warnings + fmt). Live target/ci/lotar: 'Todo,,Done' rejected exit 1 with no override clear; valid set exit 0. Prior full gates (1071 Rust/6 skips, 449 UI, 134 smoke/23 skips) were run BEFORE this fix — full gates must be rerun before final handoff due to the production change. Status stays InProgress pending review confirmation and final gates.
- date: 2026-09-16T22:25:15.952322+00:00
