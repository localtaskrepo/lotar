- date: 2026-11-13T21:43:40.367443+00:00
  author: claude
  text: |-
    Implemented in 0e5d1651 on agent/DEV-488.

    - Model: TaskComment gets optional `question` (options with key, label, optional `set`; recommended, multiple, other) and `answer` (to = question date, choice, note). `text` keeps both in prose; old YAML round-trips unchanged.
    - Answering applies the chosen options' `set` (status, assignee, reporter, priority, type, due_date, effort, tags) as a normal update by the answerer (history actor = answerer, update/assign rules fire), then on.commented. Unknown set fields and invalid values are refused when asking; options never run commands.
    - CLI: `lotar comment ID --question Q --option 'k: label' --set 'k:field=value' --recommend k --multiple --no-other`; `--answer keys [--to date] [note]`; `--answer -- 'words'` answers in words. `lotar show`/`comment` mark [open question]; `has:question` filter in list, REST, MCP and the search box.
    - REST POST /api/tasks/comment and MCP task_comment_add take `question`/`answer`; api types, view/api/types.ts, openapi.json and help docs (comment, automation, mcp-tools, list, task-model, serve) agree.
    - Automation: `comment: { answer: ... }` condition, `${{comment.choice}}`, `${{comment.note}}`.
    - UI: Comments tab shows options as buttons (recommended marked, Other field) and the answer under its question; board cards and Tasks list rows show the open question, answerable in place.
    - Skill lotar-workflow says to ask with --question.

    Checks: npm run lint (lint:agent) clean; npm test (test:agent): 2147 Rust, 1515 UI, release and hook tests pass; npm run smoke (test:smoke:agent): 391 pass, incl. new ui.question-comments smoke (screenshots checked). New tests: tests/dev488_question_comments_test.rs (CLI, REST, MCP, automation, old YAML), unit tests in task_questions/task_query, view/__tests__/questions.spec.ts.
    Not done here (follow-ups in the ticket): STD inbox triage copying questions and forwarding answers.
