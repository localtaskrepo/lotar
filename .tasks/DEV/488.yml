description: |-
  Agents and automation ask the owner multiple-choice questions in prose ("Question for mallox: A, B, C or none?"); he answers in a line and an agent has to read his words back and do the routing. A `question` comment with options, and an `answer` comment that records the choice, lets the UI show buttons and lets an option set the ticket's fields itself. The owner asked for it on 2026-11-13 and chose the full scope (options that set fields, open questions on cards).

  ## Context

  Open owner questions on 2026-11-13, all the same shape:

  - DEV-485: A / B (recommended) / C / none. DEV-483: two options. DEV-478: yes / no.
  - DEV-466, STD-82 (automation comments): rework with @fix / you decide / WontDo; retry with @fix, @fix-fable, @fix-codex or WontDo. Each option means a different assignee or status.
  - QIS-178: in a week / when you ask. QIS-14: accept all eight proposed choices / which change (free text).

  Today the inbox triage rewrites the options into the INBOX ticket's description and the rule "Inbox: the owner's answer goes to the source" (standards `configs/lotar/inbox.yml`) forwards his comment text with "(answered in INBOX-n)".

  ## Plan

  - **Model** (`src/types.rs` `TaskComment`): optional `question` block: `options` (key, label, optional `set:` with the fields automation `set:` accepts, e.g. `assignee`, `status`, `tags`), optional `recommended` key, `multiple` (default false), `other` (free text allowed, default true). Optional `answer` block: `to` (the question comment's `date`; comments have no ID), `choice` (key or keys), optional note. `text` stays the full question or answer in prose, so older lotar versions, `lotar show` and agents reading YAML lose nothing; `extra` already keeps the keys in older versions.
  - **Options that set fields**: answering applies the chosen option's `set:` like an automation `set:` (history actor: the answerer). Only `set:`, never `run:` or `agent:`: option text comes from agents. Validate the fields when the question is asked.
  - **Open question**: a question with no answer pointing to it. `lotar show` marks it; `lotar list` gets a filter (e.g. `question:open`).
  - **CLI**: `lotar comment <id> --question "<q>" --option "<key>: <label>" ... [--recommend <key>] [--multiple]`, and `lotar comment <id> --answer <key> [--to <date>] ["note"]` (default: the last open question).
  - **MCP** `task_comment_add` and REST: the same fields. `src/api_types.rs`, `view/api/types.ts`, `docs/openapi.json` and the help docs agree.
  - **UI**: the Comments tab shows a question as option buttons (recommended marked, "Other" text field) and its answer under it; board cards and the Tasks list show an open question, answerable from there.
  - **Automation**: `${{comment.choice}}` and a `comment: { answer: ... }` condition, so rules can react to a choice.
  - **Help and skill**: lotar's `lotar-workflow` skill and help docs say how to ask with `--question`.

  ## Done when

  - [ ] Question and answer comments round-trip through CLI, MCP and REST; old YAML loads and saves unchanged.
  - [ ] An answer applies its option's `set:` and records it in history; invalid `set:` fields are refused when asking.
  - [ ] The UI answers a question by click and by "Other" text; open questions show on board cards and the Tasks list (Playwright smoke).
  - [ ] Docs, OpenAPI and TS types agree; lint, test and smoke pass.

  ## Follow-ups

  - STD ticket: inbox triage copies the question to the INBOX ticket and forwards the answer with its choice; the shared skill asks with `--question`.
  - Related comment types: review verdict, handoff report, dimmed automation notices (own tickets).
