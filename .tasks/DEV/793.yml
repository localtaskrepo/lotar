- date: 2026-11-25T17:17:28.626514+00:00
  author: claude
  text: |-
    Review findings fixed: the check gate now holds back only lotar's own fast-forward, and a commit retry counts the paused run's reports.

    - Review read `6a37dafe0`, the HEAD then.
    - **Reworked landing:** in `ensure_branch_merged` (`crates/lotar-agent/src/services/agent_job_service.rs`), the reworked-landing note (DEV-411) is now a closure, `landed_reworked`. When checks are unpassed it runs before the `Err`, so a merge agent that landed the work reworked on main completes again. New test `a_merge_job_that_landed_its_work_reworked_completes_without_check_reports`. It fails with the old order and passes now.
    - **Commit retry (DEV-604):** `CommitRetry` gets `checks_since` and `main_head_at_start` (both optional and serde-default, so old queue files still load). `pause_queue` fills them from the paused job. The retry counts reports since the first run's start, and its main head no longer hides the reworked commits. New test `a_commit_retry_counts_the_checks_its_paused_run_reported`.
    - **Rebase:** onto main `d4084d484`. Resolved `hand_off_prompt` with `prompt.prepend("Merge hand-off", ...)` (DEV-767), and in `docs/help/agent.md` kept main's "a check that fails on its rerun too".
    - **Docs:** `docs/help/agent.md` says the gate holds back only lotar's fast-forward (a branch on main or landed reworked counts as merged) and that commit retries count since the paused job started.
    - Amended and signed as `1b2a836ec`. Not pushed.
