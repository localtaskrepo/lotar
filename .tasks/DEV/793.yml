- date: 2026-11-22T18:46:53.150110+00:00
  author: claude
  text: 'Second case, the other way round: DEV-780''s merge job (taken over after the worker restart at 18:45Z) ended its turn on "Waiting for the smoke run to finish" and went Done with nothing merged (`agent/DEV-780` `1fcbc12ba` not on main). Merge requeued by hand. A merge job''s end should check that the branch is on main before `job_completed` sets Done.'
- date: 2026-11-22T19:29:17.031054+00:00
  author: claude
  text: |-
    Fixed: lotar no longer lands a merge whose check failed in the job and never passed.

    - DEV-725 case: when the agent didn't land the branch itself, `ensure_branch_merged` fast-forwarded anyway. Now, if a report since the job started names a check failed (as lotar's merge hand-off does) and no later report names it passed, the job fails with the branch unmerged (`merge::unpassed_check`).
    - DEV-780 case: lotar's own merge writes the job log before the worktree is known, so a taken-over merge job had no branch and `ensure_branch_merged` skipped it. It now falls back to the ticket's branch (`takeover_branch`).
    - An agent that reran the check reports `--check "<cmd>=passed"` or fast-forwards main itself; both still land.
    - Tests: 4 new in `agent_job_service.rs` (failed check stays unmerged, failed then passed lands, older failure ignored, takeover branch). Docs: `docs/help/agent.md` merge-job paragraph.
    - DEV-725 is reopened already (InProgress, the chief of staff's agent releases it, with the owner's OK at 19:02Z), so that part needs nothing here. With this gate, a release ticket's merge can't go Done on a failed smoke run any more. Push and tag stay steps in the release skill.
