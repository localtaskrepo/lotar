- date: 2026-11-20T10:14:49.171443+00:00
  author: claude
  text: |-
    Review: passed. `c90f187fe` makes a bare `HARN-2` work when only one registered repo holds HARN; the STD-259 command itself still needs standards to register harnessmux.

    - **Read:** the diff (`external_tasks.rs` `qualify`, `relationships.rs` `mutate` and the missing-task hint, `docs/help/task.md`), the ticket and its comments, DEV-386, AGENTS.md, testing-strategy. main hasn't touched these files since the branch point (`e63dfc1a2`).
    - **Design fits the ticket:** "registered workspace" = the `repos` setting from DEV-386. A local project wins, a project in two repos stays ambiguous (error), and only one-sided `mutate` paths change (CLI, REST, MCP all go through it).
    - **Test failed before the fix:** with the two source files reverted and the `lotar` binary rebuilt, `a_bare_id_of_a_project_in_one_registered_repo_names_the_ticket_there` failed with "Relationship task 'DEV-1' is missing". With the fix: `cargo nextest run -p lotar-lib --test integration dev386` gave 7/7 passed. Files restored, worktree clean.
    - **Caveat on the fix agent's recheck:** `-p lotar-lib` doesn't rebuild the root `lotar` binary (testing-strategy line 39), so a `-p` run alone proves nothing. My before and after runs rebuilt it with `cargo build -p lotar --bin lotar`.
    - **Also ran:** `npm ci` passed, `rustfmt --edition 2024 --check` on the 3 changed files passed.
    - **Not rerun:** `npm run lint`, `npm test`, `npm run smoke`. The fix agent reports they passed on this same commit.
    - **Done line, outside lotar:** standards' `.tasks/config.yml` `repos:` has no harnessmux. [STD-261](https://standards.pyxzl.net/task/STD-261) adds it but is Blocked on STD-259, which needs STD-261 first, so neither will resume. Filed [STD-262](https://standards.pyxzl.net/task/STD-262), related to DEV-727.
    - **My slip, fixed:** a first `lotar add` without `--tasks-dir` filed that ticket here as DEV-728 (tag health). I hard-deleted it within a minute and removed its `related` link from DEV-727.
