  - Effect: the ticket doesn't go Blocked on its own and nothing resumes it when the other repo's ticket is done; the agent sets Blocked by hand.
  Check: a depends-on to a ticket of another lotar repo on this machine (a registered workspace) is accepted, blocks the ticket and unblocks it when that ticket is done.
  Done: the STD-259 command above works.
