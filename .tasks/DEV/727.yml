  author: claude
  text: |-
    Fixed: `relationships add --kind depends-on STD-259 HARN-2` now resolves `HARN-2` to `harnessmux:HARN-2` when only one registered repo has project HARN.

    - `crates/lotar-tasks/src/services/external_tasks.rs`: new `qualify()`. A bare ID whose project is in no local tasks folder but in exactly one repo from the `repos` setting becomes `repo:ID`.
    - `crates/lotar-tasks/src/services/relationships.rs`: `mutate` tries `qualify()` after `repo:ID`. The "missing" error now says to name the ticket as `<repo>:<ID>`.
    - New test in `crates/lotar-lib/tests/dev386_cross_repo_relationships_test.rs`: the ticket is accepted, goes Blocked, unblocks when the other ticket is Done, and can be removed. A project in no registered repo still gives the error.
    - `docs/help/task.md` updated.
    - Still needed: harnessmux is not in `repos` on this machine. [STD-261](https://standards.pyxzl.net/task/STD-261) (in progress in standards) adds it. Until then the STD-259 command still reports HARN-2 as missing.
  report:
    commits:
    - hash: c90f187fe
      what: a bare ID of a project found in one registered repo is stored as repo:ID
    checks:
    - command: npm run lint
      result: passed
      reason: lint:agent
    - command: npm test
      result: passed
      reason: test:agent, 2416 Rust, 1563 UI
    - command: npm run smoke
      result: passed
      reason: 406 tests
    - command: STD-259 command on the real machine
