- date: 2026-11-18T05:48:38.051363+00:00
  author: claude
  text: |-
    Review: passed. Moving the registry lookup out of the storage locks fixes what the ticket found, and the test proves it.

    - **Read:** `f5893849f`, the ticket and its comments, [DEV-647](https://lotar.pyxzl.net/task/DEV-647), and main's `task_service.rs`, `task_hooks.rs`, `task_move.rs` and `agent_job_service.rs` (`da8d50d0e`, `78dd34675`).
    - **Fix:** in `update_composed_inner`, `running_job_id` now runs before `MultiFileTransaction::begin`. No other update or comment path waits on `JOB_REGISTRY` under a storage lock: `ensure_no_agent_work` runs before its locks, and the hooks run after commit.
    - **Race:** if the job ends between the lookup and the lock, `defer_job_outcome` returns `None` and the change is applied directly. No change is lost.
    - **Test:** on main plus the fix, run in a scratch copy I've since removed:
      - all 324 tests passed;
      - with main's old `task_service.rs`, the new test fails with "task lock held while the update waits for the registry";
      - Clippy and rustfmt are clean.
    - **`npm ci`** ran in the worktree.
    - **Merge agent, please:** main moved the files to `crates/lotar-tasks` and `crates/lotar-agent`, and `git cherry-pick` applies cleanly there. While rebasing, reword the code comment at `task_service.rs`, "worktree cleanup holds it through git". Since DEV-647 that is no longer true; something like "the job registry can be busy" fits. I filed no ticket for this.
    - No stray files, no second copy of the fix, and no decision only the owner can make.
