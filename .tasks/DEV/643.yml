comments:
- date: 2026-11-17T03:19:30.416590+00:00
  author: claude
  text: |-
    Fixed: a task update no longer waits for the job registry while it holds the DEV and sprint locks.

    - Cause, measured live (load ~75): a flock probe saw `.tasks/DEV/.task.lock` and `@sprints/.sprints.lock` held together for up to 18 s. `sample 44303` showed the holder waiting on a mutex while another thread waited on `git worktree remove` (38 s).
    - Chain: `TaskService::update_composed_inner` begins the transaction (both locks), then calls `running_job_id` → `AgentJobService::active_job_id` → `JOB_REGISTRY.lock()`. Worktree cleanup (`cleanup_done_ticket_worktree`, `maybe_cleanup_worktree`) holds `JOB_REGISTRY` through git.
    - Fix: look the running job up before `MultiFileTransaction::begin`, as `task_move` already does (`crates/lotar-lib/src/services/task_service.rs`).
    - Test: `a_task_update_waits_for_the_registry_without_holding_the_storage_locks` holds the registry and checks that both locks stay free; it failed before the fix and passes after.
    - Follow-up filed: [DEV-647](https://lotar.pyxzl.net/task/DEV-647), the registry held through git still stalls job threads.
  report:
    commits:
    - hash: f5893849f
      what: look up the running job before taking the task/sprint locks
    checks:
    - command: npm run lint:agent
      result: passed
    - command: npm run test:agent
      result: passed
      reason: 2283 Rust, 1548 UI, hooks
    - command: npm run test:smoke:agent
      result: passed
      reason: 405 tests
    - command: live check against the running worker
      result: not_run
      reason: the fix ships with the next lotar build; the worker still runs the old one
    next: Review, then merge; after the next install rerun the lock probe under load
- date: 2026-11-17T03:20:12.186677+00:00
  author: claude
  text: |-
    More evidence from the DEV-530 thread: the DEV lock was held for minutes (19:08 to at least 19:16), not a deadlock.

    - Their stacks match mine: the lock holder waits on the job-registry mutex while worktree cleanup holds it through `git worktree remove`. The cleanup runs one removal after another, so the hold lasts minutes.
    - At 19:20 the lock was free in 38 of 40 checks, and a new `git worktree remove` was running under pid 44303.
    - `f5893849f` removes the wait under the lock; [DEV-647](https://lotar.pyxzl.net/task/DEV-647) covers the registry held through git.
- date: 2026-11-17T03:29:52.082264+00:00
  author: claude
  text: |-
    Review: passed. `f5893849f` moves the running-job lookup ahead of the task and sprint locks; the merge can go ahead.

    - Read: the diff, the ticket and its comments, DEV-647, AGENTS.md, and the last 5 commits on main to both touched files.
    - Cause: `update_composed_inner` took both locks (`MultiFileTransaction::begin` locks `@sprints` and the project), then `running_job_id` waited on `JOB_REGISTRY`. The fix looks the job up first, the same way `task_move::ensure_no_agent_work` does.
    - No new race: starting a job never takes the storage locks, so checking under them never kept a job from starting in between. If the job ends between the lookup and the write, `record_outcome` returns `None` and `update_composed` applies the held status and assignee directly (`task_service.rs:990`).
    - Test failed before the fix: with the old `task_service.rs`, the new test failed with `task lock held while the update waits for the registry`. With the fix it passes. Old file put back, tree clean.
    - Reran: `cargo nextest run -p lotar-lib services::task_service services::agent_job_service services::task_move` (59 passed), `cargo clippy -p lotar-lib --all-targets -- -D warnings` (clean), `rustfmt --edition 2024 --check` on both files (clean).
    - Not rerun: the full `npm run lint`, `npm test` and `npm run smoke` (the fix agent reports them passed), and the live check under load, because the installed worker is still the old build. The merge agent's check after the install covers that.
    - Live confirmation of the bug: this comment's first try failed with `DEV/.task.lock is still busy after 2 seconds`.
    - Still open: worktree cleanup keeps the job registry locked through `git worktree remove`. That is DEV-647, already filed. It no longer blocks CLI writes. No new tickets filed.
    - No UI changes, no stray files.
