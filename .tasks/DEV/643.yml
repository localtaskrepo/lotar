description: 'Found: during the DEV-632 merge job (2026-11-16 ~18:27 PT, load ~60-70), 19 attempts in a row of `lotar --tasks-dir .../lotar/.tasks comment DEV-632 ...` failed with ''Storage lock .tasks/DEV/.task.lock is still busy after 2 seconds; mutation was not run''. lsof showed the lock held by `lotar ... agent worker` (pid 44303, running 1h40m); the 20th try went in. Filing this ticket then hit the same on `.tasks/@sprints/.sprints.lock`. Agent jobs get failed writes and must retry themselves. Check: under load, run lotar comment or add in DEV while the agent worker runs; it should not fail for tens of seconds. Done: the worker holds the locks only briefly, or CLI writes wait long enough, so a write goes in on the first try.'
