- date: 2026-11-17T19:05:48.257459+00:00
  author: claude
  text: |-
    Couldn't reproduce the timeout; the test now says where it stopped if it times out again.

    - The ticket's check can't run as written: profile `local` is gone (DEV-579), and `-p lotar-lib` doesn't build the `lotar` binary the test spawns (`crates/lotar-lib/tests/common/mod.rs:33` warns it may be stale or missing). A stale binary probably explains the timeout when the test ran alone. Working check: `cargo build && cargo nextest run --cargo-profile dev --test integration -E 'test(/a_t3_job_taken_over_before_its_thread_id_was_saved_fails/)'`
    - Timed it with temporary probes: the takeover ends in about 8.5 s every time (two rounds of 3 `t3 thread list` tries, 2 s apart, in harnessmux 0.1.9 `backend/t3.rs`). Its other two variants end in under 1 s. At load 120 it was no slower.
    - Checked and ruled out: harnessmux clears the turn before it answers the next `status` call, the storage locks are `flock`s the kernel releases when the killed process dies, and a socket the leftover `sleep 30` child held would fail the resume rather than hang it.
    - Change in `crates/lotar-lib/tests/dev510_t3_session_test.rs`: the "job to end" wait now times out with the job, its events and the fake T3's calls (checked by shortening the deadline to 1 s for one run).
