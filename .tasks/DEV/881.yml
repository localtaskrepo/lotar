comments:
- date: 2026-11-26T02:07:06.711209+00:00
  author: claude
  text: |-
    Added `GET /api/status`: one small, versioned JSON document per instance, with every link absolute.

    - `version: 1`, `instance` (`ui.name`, else the repo folder; `url` = `server.public_url`, else `http://<Host>`), `generated_at`
    - `running`: jobs from this process's memory and the other processes' job records, with ticket, title, profile, started, `job_url` (`/agents?job=<id>`), `ticket_url`
    - `queue`: `count`, `held` + `held_reason` (memory hold or paused queue), and entries in start order as `lotar agent queue` lists them (ticket, profile, queued_at, waits_for)
    - `waiting`: HelpNeeded/Blocked tickets with assignee, `since` (when they got that status) and link
    - Cheap: the waiting list is read in full once, then kept current ticket by ticket from the task events (the server's own writes and the file watcher). A full read happens again only after a project/config change or every 15 min. Code is in `crates/lotar-lib/src/services/status_feed.rs`
    - Docs: `docs/openapi.json` (`StatusFeed` schemas), `docs/help/serve.md#status-feed`, `api-quick-reference.md`, `view/api/types.ts`
    - Test: `crates/lotar-lib/tests/dev881_status_feed_test.rs` covers a running job, a memory-held queue, a HelpNeeded ticket and a Blocked ticket announced by an event
    - Staff connector on the same Mac: `GET http://localhost:<port>/api/status`, server-side. It needs no auth, as for the other endpoints. It must not send a browser `Origin` from another site.
    - No UI, no aggregation in lotar
