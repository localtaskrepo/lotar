  text: 'Done in 164d8483 on agent/DEV-409. Push compare for fixVersions/versions now ignores a leading v (version_values_match in fields.rs; without_version_prefix moved there from github.rs and shared). build_jira_payload lists the Jira project''s versions once per push (GET /rest/api/3/project/{key}/versions, cached in LookupCache.jira_versions) and sends each name in the project''s spelling, so 0.15.0 goes out as v0.15.0; a name the project lacks is sent as is, a failed listing warns once. Dry runs (no client) send names as stored. Test: provider_tests versions::jira_push_uses_the_projects_v_named_version (failed before the fix). docs/help/sync.md pull and Jira push lines corrected. Checks: npm run lint, npm run test:agent, npm run smoke all pass.'
