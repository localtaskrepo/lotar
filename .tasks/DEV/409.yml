description: |-
  Jira sync can't push back a version whose Jira name starts with `v`. Pull stores `v0.15.0` as `0.15.0` (version fields drop the `v`), push sends `{"name": "0.15.0"}`, and the compare before the push doesn't ignore the `v`, so every push of such an issue sends a version the Jira project doesn't have. GitHub milestones got this handling in DEV-392, Jira didn't. Found by the QA test run in standards (STD-59, 2026-11-12).

  ## Evidence
  - `src/services/sync_service/pull.rs` `build_task_update_from_issue`: `normalize_custom_field_value` ends in `version::normalize_value`, which drops the `v`.
  - `src/services/sync_service/payloads.rs` around line 198: `fixversions` / `versions` sent as stored.
  - `src/services/sync_service/fields.rs` `field_values_match`: trims and lowercases only.
  - `github.rs` `without_version_prefix`: the GitHub side ignores the `v` both ways.
  - `docs/help/sync.md` "A pull stores the version's name" is wrong for these names.

  ## Done when
  - [ ] An unchanged Jira issue with `v`-named versions sends no version change on push
  - [ ] A changed version is sent with the spelling the Jira project uses
  - [ ] Provider test with a `v`-named Jira version; docs line corrected
