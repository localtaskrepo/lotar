- date: 2026-11-15T18:44:28.285894+00:00
  author: claude
  text: |-
    Rework: a `--finding` add now names only similar open tickets of the same check; amended to `0b5471a8`.

    - Finding (prefix ignored): fixed. `similar_open` takes the finding key (`finding_service.rs:101`), and the add handler passes it (`cli/handlers/mod.rs:486`). A ticket whose finding has another check prefix is skipped. A ticket without a finding key still counts: it isn't a different check, and dropping it would miss duplicates filed without `--finding`. A plain add stays title-only.
    - Test: `a_finding_names_only_open_tickets_of_the_same_check` in `dev562_similar_open_ticket_test.rs`. It fails with the key passed as `None` and passes with the fix.
    - Help: `docs/help/add.md` "Similar open tickets" now explains the check rule.
