description: |-
  ## Found
  Daily communication review (STD-17), 2026-11-15. The same problem was filed twice, and two fix agents each staged a separate fix:
  - local: LOCA-331 (08:37, finding `opgate:locked-keychain-restart`) and LOCA-333 (08:42, finding `opgate:locked-restart`), both 'opgate restart while the Mac is locked drops the signing key'.
  - standards: STD-134 (09:11:25) and STD-135 (09:11:29), both 'live check flags running launch agents whose last exit was -15'; both changed the same line in `scripts/repos.ts`.
  - The skill lotar-workflow already says 'search a few words before you add one'; agents skip it, and a finding key only catches the exact same key.

  ## Check
  - `lotar add` with a title whose words mostly match an open ticket in the project (for example LOCA-333's title while LOCA-331 is open) names that ticket.
  - `--finding <check>:<subject>` with a new subject but a near-identical title does the same.

  ## Done when
  - `lotar add` warns, naming the open tickets with a similar title (and the same check prefix for findings), and still files unless told not to; or refuses with a flag to override. Pick the simpler one and say why on the ticket.
  - A test covers both cases; docs/help says how it matches.
