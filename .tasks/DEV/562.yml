- date: 2026-11-15T14:16:20.673747+00:00
  author: claude
  text: |-
    `lotar add` now warns about open tickets with a similar title, and still files the ticket.

    - **Warn, not refuse:** simpler. Scripts and the finding flow keep working, no override flag is needed, and an agent that sees the warning can add to the existing ticket and `lotar task delete` the new one.
    - **Matching:** titles count as similar when ≥60% of their distinct lowercase words match (Dice coefficient), ignoring stop words (`a`, `the`, `is`, `on`…). Only open tickets count (not done, not won't do, not archived). With `--finding`, it applies when no ticket has the key, so a new subject with a near-identical title gets the same warning. I didn't add a separate check-prefix rule: title matching already catches LOCA-331/333 and STD-134/135, and a prefix like `worktrees:` alone would flag unrelated subjects.
    - **Output:** `⚠️  Open tickets with a similar title: LOCA-1 "…". If LOCA-3 is the same problem, add to that ticket and delete this one (lotar task delete LOCA-3).` on stderr, a JSON line with `--format json`.
    - **Code:** `FindingService::similar_open` in `crates/lotar-lib/src/services/finding_service.rs`, called in `crates/lotar-lib/src/cli/handlers/mod.rs`. Docs: `docs/help/add.md` § Similar open tickets.
    - **Tests:** `dev562_similar_open_ticket_test.rs` covers a plain add, a finding with a new subject, and done tickets that don't count, plus a unit test for the matcher. `dev311`/`dev312` used "Plain title" twice to check that `add` is quiet, so their second add now uses a different title.
    - **Fixed on the way:** `dev292_performance_test` inherited the global `commit.gpgsign` and failed while the ssh agent had no key. It now sets `commit.gpgsign false` like its sibling tests.
    - **Checks passed:** `npm run lint:agent`, `npm run test:agent` (Rust 2208/2208, UI 1547/1547, release, hooks), `npm run test:smoke:agent` (404/404).
    - **Not committed:** the signed commit failed (`Couldn't find key in agent`; `ssh-add -l`: no identities). The changes are staged on `agent/DEV-562` for LoTaR to commit at job end.
