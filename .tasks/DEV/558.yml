    - Fast-forwarded main to `bb7b2dbf`. Rebased twice as main advanced; final replay preserves main ticket-only amendment. Code matches verified `873f4495`.
    - Approved `RUSTC_WRAPPER= npm run lint:agent`, `npm run test:agent` (2197 Rust, 1547 UI, release/hooks), and `npm run test:smoke:agent` (404/404) pass. No skipped gates.
