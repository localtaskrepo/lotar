comments:
- date: 2026-11-03T21:54:45.751384+00:00
  text: |-
    Outcome: all three findings fixed.
    1. Discovery, the edit-range check and key insertion now share one predicate: the comment text must start with a signal word after stripping whitespace, '/', '!', '*' and '-' (scanner::comment_body). /// and //! doc comments and '- TODO' bullets are findings and get keys; prose mentioning bug/todo/note is no longer a finding. The CLI now warns and skips an entry it cannot edit safely (as REST does) instead of aborting after partial changes.
    2. Rust/rs: a quote opens a char literal only when one closes right after ('x', '\n', '\'', '\u{..}'); lifetimes like <'a> and &'static no longer stop discovery.
    3. replace_line_contents rewrites only the target line and keeps each line's own ending (CRLF, LF, missing final newline); used by both the CLI and REST writers.
    Evidence: unit tests findings_start_with_the_signal_word_after_adornments, rust_lifetimes_do_not_stop_discovery, rust_char_literals_are_told_apart_from_lifetimes (src/scanner.rs), replacing_a_line_keeps_every_line_ending (src/utils/scan.rs); all 71 scan tests pass; manual repro in a scratch repo (doc comments keyed, lifetime file fully scanned, CRLF bytes preserved per od -c, rc 0); docs/help/scan.md updated; clippy clean.
description: |-
  Found by the DEV-253 product review and confirmed by an independent check that re-read the code and reproduced it where feasible.

  Findings:

  1. [high] CLI `lotar scan` aborts the whole run (after partially applying) on any comment where the signal word is not at the start, including Rust `///` and `//!` doc comments (review ref sync-scan-git#0)
     Where: src/scanner.rs:617, src/scanner.rs:708-729, src/cli/handlers/scan_handler.rs:222-229, src/services/scan_service.rs:146-180
     Evidence: Discovery (`process_comment_line`) accepts a comment when `signal_regex.is_match(line)` finds the word anywhere in it. The edit path (`matched_source_comment_range`) only accepts a match at offset 0, after trimming whitespace and `*` but not `/` or `!`. The CLI turns that `None` into a hard error with `?`.

  Minimal repro (scratch repo r3): a.rs=`// TODO: real work item`, b.rs=`/// Filter syntax example: 'status:todo tag:ui'`. `lotar scan` prints `Found 2 TODO comment(s)`, creates R3-1, rewrites a.rs, then fails with `❌ Cannot establish a safe scan comment boundary` (rc=1). Every later run fails the same way.

  Each of these single lines fails on its own: `/// TODO: doc todo`, `//! TODO: inner doc`, `// - TODO: bullet`, `// This is not a bug, it is intended.`, `/// Returns the todo list for the user.`, `// Workaround for the hack in libfoo; see upstream.`.

  On a copy of this repo's src/ a…
     Impact: Any repository with a Rust doc-comment TODO, or prose like 'bug', 'note' or 'todo' inside a comment, cannot use `lotar scan` from the CLI at all. Entries before the bad line are applied (tasks created, sources edited). Entries after it and the anchor-maintenance pass never run. REST/UI scans list these lines as 'failed' entries, which is noisy.
     Suggested fix: Use one predicate for discovery and edit. Either require the signal word at the start of the comment segment in `process_comment_line` (after stripping `/`, `!`, `*`, `-` and whitespace), or let the edit path locate the signal word wherever discovery found it. In the CLI, report a per-entry skip or failure as REST does instead of aborting the run. Add regression tests for `///`, `//!` and mid-sentence words.
     Verifier note: Even `--dry-run` aborts, so users cannot preview past the bad line either.

  2. [medium] In Rust files, a single quote such as a lifetime (`<'a>`, `&'static`) silently stops TODO discovery for the rest of the file (review ref sync-scan-git#3)
     Where: src/scanner.rs:194-216, docs/help/scan.md
     Evidence: `CommentLexer::ranges` opens an ordinary quote on any `'` and marks the source ambiguous if it is still open at end of line. That stops all further discovery in the file. Rust lifetimes and `'static` produce exactly that.

  Repro (scratch repo r1): src/lib.rs with `// TODO: first`, `pub struct Foo<'a> {`, `// TODO: second`, `// TODO: third` → `lotar scan --dry-run` reports only the first.

  Probe on a copy of this repo (a `// TODO: probeend` appended to each of 400 .rs/.ts files): 205 found, 180 silently missed, 15 aborted. Missed files include src/web_server.rs and src/api_types.rs (`&'static`).
     Impact: Rust is advertised as supported, but most real Rust files have a lifetime before most TODOs, so those TODOs are never turned into tasks or anchored, and nothing is reported. The docs list the JS regex/division limitation but not this one.
     Suggested fix: For rs/rust, treat `'` as a char-literal opener only when it closes within a few characters (`'x'`, `'\n'`, `'\u{..}'`); otherwise treat it as a lifetime and do not open a quote. At least log the ambiguity at info level with file:line, and document it.
     Verifier note: docs/help/scan.md:93 does say that 'unterminated ordinary quotes' stop further discovery. So the stop is documented in general terms, but lifetimes are not named, and they make this the normal case for Rust files. I did not re-run the 400-file probe.

  3. [medium] Scan converts every CRLF line ending in an edited source file to LF (review ref sync-scan-git#2)
     Where: src/utils/scan.rs:121-139, src/cli/handlers/scan_handler.rs:343, src/services/scan_service.rs:626
     Evidence: `replace_line_contents` splits with `str::lines()`, which drops `\r`, and rejoins with `\n`.

  Repro (scratch repo enc): `printf 'fn a() {}\r\n// TODO: crlf item\r\nfn b() {}\r\n' > crlf.rs; lotar scan` → `od -c crlf.rs` shows only `\n` on all three lines. A mixed file (`x = 1 # TODO: mixed\r\ny = 2\n`) also loses its `\r`. Files with a BOM or no trailing newline were preserved.
     Impact: In Windows or CRLF repositories, inserting one task key rewrites every line of the file: whole-file diffs, broken .gitattributes expectations and possible merge conflicts. Docs promise a narrow, safe in-place edit.
     Suggested fix: Replace only the target line's byte range, for example with `split_inclusive('\n')`, and keep each line's original terminator. Add CRLF and mixed-ending tests for the CLI and REST writers.
     Verifier note: Severity lowered to medium: no content is lost. The damage is a whole-file line-ending rewrite and diff churn, and it is invisible in repos that normalize with autocrlf/.gitattributes.

  Acceptance: each finding above is fixed (with a regression test where behavior changes) or explicitly declined with a reason recorded here.
