- date: 2026-11-17T06:59:30.149632+00:00
  author: claude
  text: |-
    Blocked: T3 Code's CLI can't start a thread in an existing checkout, so lotar can't hand it its own worktree yet. One question for you below.

    - `t3 thread start` (T3 Code 0.1.9, and upstream main too) only has `--worktree <base>` = a new worktree in `~/.t3/worktrees`. A path as `<project>` maps to the registered project, so the thread would run in the main checkout.
    - T3's server already supports it: `t3_thread_launch` takes `workspaceStrategy: {type: existing_worktree, worktreePath}`. Only the CLI lacks a flag for it. harnessmux's t3 agent (`src/backend/t3.rs`) only knows `--worktree`/`--branch`.
    - Earlier T3 asks went fast upstream (DEV-353: issue #34688 fixed in PR #34696 within a day).
    - Two jobs ran DEV-652 at once (threads `mcp:753f88c8` and `mcp:e7928dfd`); each got its own new T3 worktree, the very thing this ticket removes. I asked the second to stop without changes.
    - No code changed; nothing committed. The cleanup-rules part (your scope comment) doesn't need T3 and can go first as its own commit if you want.

    **Question:** How should a t3 job's thread get lotar's worktree?
    1. (Recommended) I file a T3 Code issue for a `t3 thread start` flag that binds an existing worktree (`existing_worktree`); harnessmux and lotar switch once a release has it.
    2. harnessmux's t3 agent calls T3's `t3_thread_launch` tool itself, without the CLI (a harnessmux ticket; leans on T3 internals).
    3. Now, with no upstream change: lotar registers each ticket worktree as its own T3 project and starts the thread there (one extra T3 project per ticket in the sidebar, removed at cleanup).
