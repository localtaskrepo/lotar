- date: 2026-11-17T06:49:42.579878+00:00
  author: claude
  text: |-
    Scope widened. Owner 2026-11-17 (chief of staff picker), after his idea "we could even drive work trees from the automation system in lotar ... make things even easier and more reliable": "Add to DEV-652".

    ## Also in this ticket
    - Making the worktree stays in the job's code (a job never runs without one, even with rules off or the repo untrusted). Cleanup moves to rules.
    - A cleanup command rules can run (`lotar agent worktree ...`): remove the build output of a ticket's older worktrees, keeping the newest; remove the build of a ticket that waits (HelpNeeded, Blocked) longer than a given time. Idempotent; never touches a worktree of a running job.
    - The Done cleanup (`cleanup_on_done`) and STD-95 ("build output stays until Done", owner 2026-11-13) written as rules in .tasks/DEV/automation.yml and the standards copy (configs/lotar/automation.yml, a standards ticket for that part), so each repo sees and sets its own. Changing STD-95 itself stays the owner's call: the default rules keep today's behaviour; the waiting-ticket rule is proposed, off until he says yes.
    - Done when, added: a scheduled rule (manual action from cron) removes older builds of a ticket on a real ticket; docs/help/automation.md and agent.md say how.
- date: 2026-11-17T06:54:12.983456+00:00
  author: automation
  text: The fix agent's job job-20261117T064733.178Z-159 failed (lotar agent logs job-20261117T064733.178Z-159); @fix-retry retries it on branch agent/DEV-652.
