description: |-
  Owner 2026-11-17 (DEV-579): "I'm not really willing to let t3 handle worktrees again. That was the main reason we moved to harnesmux." Owner 2026-11-16 (chief of staff options picker): "lotar makes them, T3 shows".

  ## Found
  - Every standards profile but two runs on harnessmux's `t3` agent. For those, `plan_t3_worktree` (agent_job_service.rs, DEV-318) has harnessmux start the thread with `t3 thread start --worktree agent/<ID>`, so T3 Code makes a new worktree in ~/.t3/worktrees on a new `t3/...` branch for every new thread. Only claude/codex jobs use `prepare_worktree`.
  - Result on 2026-11-16: DEV-638 had 6 worktrees, DEV-644 3, others 2, each with its own cold build (1-7 GB); 129 GB in ~/.t3/worktrees. DEV-635's build clone skips them.

  ## What
  - A t3 job gets its worktree from `prepare_worktree` like any other runner: one per ticket on `agent/<ID>`, reused by later jobs (fix, review, merge), build cloned (DEV-635). The T3 thread runs in that checkout; T3 Code makes no worktree.
  - First find out how: whether `t3 thread start` can take an existing checkout (a worktree path as project, or another option), and what harnessmux's t3 agent needs (`worktree_base`/`branch` may go). A harnessmux change is a ticket there.
  - Remove what only served T3-made worktrees (moving detached T3 worktrees aside, pointing the ticket branch at the thread's `t3/...` branch) once nothing needs it; docs/help/agent.md and the standards comment in configs/lotar/agents.yml ("T3 Code makes it in ~/.t3/worktrees") say the new state.

  ## Done when
  - [ ] A ticket with fix, review and merge jobs on the t3 runner has one worktree, under lotar's worktree folder, and ~/.t3/worktrees gets nothing new (checked on a real ticket, not assumed).
  - [ ] Threads still show in T3 Code with their title and link on the ticket; `session: continue` still continues the thread.
  - [ ] lint, tests and smoke pass.
