- date: 2026-11-18T00:48:10.044984+00:00
  author: claude
  text: |-
    Implemented on `t3/t3-job-lotar-worktree-2` in `f6d837068` (harnessmux 0.1.10). Not merged.

    - A t3 job now uses the ticket's worktree (`<dir>/<repo>/<ID>` on `agent/<ID>`) like every other runner; harnessmux starts the thread there with `t3_thread_launch` (existing worktree), so T3 Code makes no worktree or branch.
    - Removed the code that pointed the ticket branch at `t3/*` thread branches, moved old worktrees aside, and moved continued threads' branches.
    - `session: continue` sends the turn to the same thread. A thread from before DEV-652 (one that runs in a T3-made worktree) hands off to a new thread in the ticket's worktree.
    - Settling (owner 2026-11-17): after the end rules ran, a completed job calls `t3_thread_organize settle`. The thread stays active when the job failed, or when the ticket is HelpNeeded, or open and assigned to a person. A refusal is only a job note.
    - How I read "assigned to him": open and assigned to anyone who isn't an `@profile`. Done tickets keep mallox as assignee, so a Done ticket still settles.
    - Tests: a fake T3 MCP server in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`; tests for the old behaviour removed or rewritten.
    - Docs: `docs/help/agent.md` (t3 runner, worktrees, settling).
