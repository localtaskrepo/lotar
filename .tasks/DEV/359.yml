description: 'Found by DEV-354 merge (claude, 2026-11-11): in the main checkout, running the web_api_integration_test module with cargo nextest run --no-fail-fast -E ''test(web_api_integration_test::)'' failed this test in 4 of 7 runs at tests/web_api_integration_test.rs:606 (stream.read_to_string(&mut response).unwrap() returned WouldBlock, os error 35) because the stream read timeout is net_timeout() (500 ms). It passes alone and in the DEV-354 worktree. Same cause as DEV-354: the response read uses a short fixed timeout. Check: run that cargo nextest command 5 times; all must pass. Done when this read waits for the response with the read_until_deadline helper added in DEV-354 (deadline, not fixed short budget), still failing fast on a real hang.'
