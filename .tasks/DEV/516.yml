  author: claude
  text: |-
    Rework 2: both review findings fixed, commit `540b21a5` (amended, signed).

    - **Handback without end rules could still merge:** the signal is now the assignee, not rules. A handback reassigns the ticket; finishing only sets a status (no rules) or nothing (rules). `ensure_branch_merged` (`agent_job_service.rs`) compares the assignee at merge-job start with its end value (or the recorded T3 outcome) and leaves the branch unmerged when it changed. The merge-job note now says: if you don't land it, hand back and assign as under Clarifications; LoTaR then leaves the branch unmerged.
    - New test `merge_agent_that_hands_back_without_end_rules_does_not_land`: failed on the previous commit's code, passes now. `merge_agent_that_sets_a_status_without_end_rules_still_lands` still passes (status only → LoTaR fast-forwards).
    - **Test inherited `RUSTC_WRAPPER`:** the stub now exports `RUSTC_WRAPPER=sccache` itself. `RUSTC_WRAPPER= cargo nextest run ... merge_job_|merge_agent_that_|built_in_instructions|job_notes`: 11/11 pass.
    - `docs/help/agent.md` describes the assignee rule.
    - Checks: `npm run lint`, `npm test` (2151 Rust + 1536 UI), `npm run smoke` (400) pass. Live mux run not repeated (prompt change is one sentence in the merge note; host-side merge logic is covered by the tests).
