    Fixed the failing handback test on top of main, commit `90672043` (one test file).

    - **Cause:** a timing problem in the test, not the guard. Since DEV-531, an agent's `lotar status`/`assignee` are recorded and applied when the job ends, after `finished_at` is set. `run_merge_without_end_rules` read the ticket as soon as `finished_at` appeared, so it saw `(Todo, @merge)`. The guard worked: `feature.txt` stayed off main.
