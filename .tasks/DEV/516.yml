  text: |-
    Rework 3: taken-over merge jobs now keep the handback guard, commit `d8498d2e` (amended, signed).

    - **Finding (taken-over job skipped the guard):** `ensure_branch_merged` (`agent_job_service.rs`) now checks a recorded outcome's assignee first, without needing the starting snapshot. The merge job's starting assignee is also saved in its active-job record (`ActiveJob.assignee_at_start` in `agent_active_jobs.rs`; empty means none), and `adopt_orphaned_job` restores it, so a direct reassignment is caught after a takeover too.
    - New unit tests: `a_taken_over_merge_job_without_a_starting_assignee_still_sees_a_recorded_handback` (failed with the previous check, passes now), `a_taken_over_merge_job_handed_back_directly_stays_unmerged`, `a_taken_over_merge_job_that_finished_is_fast_forwarded`, `a_taken_over_merge_job_keeps_its_starting_assignee` (record round trip).
    - Old records without the field: the recorded outcome still counts; a direct change can't be seen there.
    - `docs/help/agent.md` mentions taken-over jobs.
    - Checks: `npm run lint`, `npm test` (2155 Rust + 1536 UI), `npm run smoke` (400) pass; `RUSTC_WRAPPER= cargo nextest run --cargo-profile local -E 'test(merge_) | test(a_taken_over_merge_job)'` 17/17 pass. Live mux run not repeated (no prompt change since).
