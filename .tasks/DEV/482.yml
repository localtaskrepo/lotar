description: |-
  Found 2026-11-13 (LOCA-313 in ~/Development/local): the macOS release binaries carry only the Rust linker's ad-hoc signature (codesign: flags=adhoc,linker-signed, Identifier=lotar-<build hash>, no TeamIdentifier). To macOS every release is a new app, so after each upgrade the firewall blocks `lotar serve` on the LAN again and Dropbox/TCC file-access prompts come back (a git child of the server then hangs on ~/.gitconfig, ticket pages stay on "Loading task…", see DEV-466). This hits every user who installs through Homebrew, npm or the release archives. The Homebrew formula only copies the binary (bin.install), so a signature made in CI reaches users unchanged.

  Owner decision 2026-11-13: "I'm already signed up to the apple developer program. In fact that's how mailgpg and foody are signed today. So let's set it up properly so that other developers don't have to go through this as well every time"

  Do (.github/workflows/release.yml, keeping the DEV-291 split: build code never sees a signing secret):
  - The build job uploads the two macOS archives as unsigned-macos-* instead of release-*.
  - A new job sign-macos (macos-latest, needs build, contents: read) downloads them, imports the Developer ID Application certificate (.p12 secret) into a temporary keychain, signs each binary with codesign --force --options runtime --timestamp --identifier net.pyxzl.lotar --sign "Developer ID Application: Ravi Gairola (3HKD37M482)", checks it (codesign --verify --strict, TeamIdentifier=3HKD37M482), notarizes a zip of it with xcrun notarytool submit --wait (App Store Connect API key secrets; a bare Mach-O can't be stapled, Gatekeeper checks online), re-packs the tar.gz, rewrites the .sha256 and uploads release-macos-*. It deletes the keychain in an always() step. Missing secrets fail the release: never ship unsigned macOS archives silently.
  - build-and-release needs [build, sign-macos]; cosign then signs the final archives, and the tap/scoop/npm steps take the signed ones.
  - The fixed identifier net.pyxzl.lotar stays the same for all future releases (it is part of the designated requirement macOS grants are tied to).
  - Secrets (set by the owner or an agent with his OK, names like mallocator/mailgpg): MACOS_DEVELOPER_ID_P12_BASE64, MACOS_DEVELOPER_ID_P12_PASSWORD, APPLE_NOTARY_KEY_P8_BASE64, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID. Document them and the certificate renewal (Developer ID certificates last 5 years) in docs/release-guide.md.
  - Check that hardened runtime doesn't break lotar: serve, agent jobs, git children, the embedded UI.
  - Add a check to .github/workflows/homebrew-verify.yml: the installed binary shows TeamIdentifier=3HKD37M482 and Identifier=net.pyxzl.lotar.

  Merge only after the secrets exist (LOCA-313 asks the owner for the certificate and the notarization key); otherwise the next release fails.

  Check: after the next release, codesign -dvv /opt/homebrew/opt/lotar/bin/lotar shows Authority=Developer ID Application: Ravi Gairola (3HKD37M482), TeamIdentifier=3HKD37M482, Identifier=net.pyxzl.lotar; spctl -a -t install -vv on a downloaded archive's binary says accepted, source=Notarized Developer ID.

  Done: the release after that one installs through brew upgrade without a new firewall grant or Dropbox prompt on the owner's Mac.
