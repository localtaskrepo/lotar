comments:
- date: 2026-11-14T05:50:39.665056+00:00
  author: claude
  text: 'Plan: (1) drive_session meters cost from usage events (ACP reports the session''s running total, so the job''s cost is the growth since the job started; it starts over when the agent restarts) and cancels the turn and fails the job once it passes max_budget_usd; also fixes multi-turn jobs summing running totals. (2) profile key options: (ACP option id -> value, scalars accepted) passed to harnessmux Profile.options; command refuses it; the effort error points to it. (3) message.delta streams into the job log as agent_job_message parts (whole paragraphs outside code blocks, the rest when a tool or question starts or the turn ends); the final message only adds what wasn''t streamed. Tests in dev503_harness_jobs_test with the fake ACP agent; docs agent.md and config-reference. No REST shape change.'
- date: 2026-11-14T06:43:49.320715+00:00
  author: claude
  text: 'Done in 84788354 on agent/DEV-511. (1) max_budget_usd works again: drive_session meters the cost from harnessmux usage events and, once the job''s cost passes the budget, cancels the agent''s turn and fails the job (''The job cost $0.50, more than the profile''s max_budget_usd of $0.40''). Agents report the session''s running total (claude-agent-acp sends total_cost_usd), so a job''s cost is now the growth over its turns. Before, a multi-turn job added up the running totals, e.g. 0.25 + 0.5 instead of 0.5. A total that drops, or a session.started event, means the agent restarted. A job taken over from a stopped process starts from the cost it already recorded. A job whose agent reports no cost logs that the budget wasn''t checked. (2) New profile key options: (ACP config option id -> value; YAML true/2 are accepted as strings) goes to harnessmux Profile.options. command refuses it. An invalid effort error now points to options (reasoning_effort: ultra). (3) message.delta streams into the job log as agent_job_message parts: each paragraph outside a code block as it arrives, the rest when a tool starts, a question comes or the turn ends. The final message adds only what wasn''t streamed, and last_message stays the whole reply. No REST shape change. Docs: agent.md (model and effort, usage and cost, live replies), config-reference.md. Tests: dev503_harness_jobs_test (streaming while the turn runs and nothing logged twice, cost of two turns, budget failure, options reach session/set_config_option, a bad value fails), unit tests for ReplyStream and CostMeter. Checks: npm run lint ok; npm run test:agent ok (2151 Rust, 1536 UI, 50 release, 7 hooks); npm run smoke ok (114 files, 400 tests). Not run: a live job against a real agent''s cost. Guidance: no lasting finding.'
