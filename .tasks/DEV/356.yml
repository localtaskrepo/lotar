description: 'Found by DEV-351 (claude, 2026-11-11): tests/dev318_t3_runner_test.rs home_profile_and_repo_rule_run_a_t3_thread_and_set_done failed once in npm run test:agent (retries 0) on agent/DEV-351 under load (another session''s suite was running): tests/dev318_t3_runner_test.rs:152 left "Todo", right "Done", so the job read as completed before the rule''s Done was written. It passed on its own right after. DEV-351 only adds a test, so it did not cause this. Check: run it 30 times under load (cargo nextest run --retries 0 next to the full suite) with no failure. Done when the cause is found and fixed, with the test passing without retries.'
