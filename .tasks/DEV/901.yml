- date: 2026-11-27T04:36:05.107+00:00
  author: claude
  text: |-
    Jobs can now run on a second machine over ssh; tested with a fake ssh and T3, not yet on dyson.

    - Config: `agent.hosts.<name>` (ssh, hours, timezone, slots, t3 environment) and `agents.<name>.host`, checked on load.
    - Placement: Mac first. The host only takes a job within its hours, with a free slot, when the expected duration fits; otherwise the queue gives the reason.
    - Wake: at most once per 10 min, within hours.
    - Before a job: t3 version and environment check. A mismatch keeps the job on the Mac and says why.
    - The branch is pushed to a clone and worktree at the same paths on the host.
    - The lotar MCP server stays on the Mac, reached through a forwarded socket.
    - Commits are fetched back and re-signed on the Mac. The host worktree is removed only when it is clean.
    - T3 calls for the job's thread go to the host. Stop or a lost connection stops the thread (SIGTERM, SIGKILL after 10 s).
    - The prompt says the host has no secrets: a job that needs one stops and says so.
    - If host setup fails, the job runs on the Mac and its log header drops the host.
    - Docs: "Agent hosts" in docs/help/agent.md, plus config-reference entries. The REST `host` field is in api_types, types.ts and openapi.
