description: |-
  The owner decided on 2026-11-26 (local LOCA-631, INBOX-757) that the home desktop `dyson` (Debian 13, i5-2500K, 32 GB) takes "Lotar jobs with claude/codex signed in on dyson". lotar runs every job on the Mac today.

  ## Owner's decisions
  - LOCA-631: "Worker now, swarm later" (no tickets, decisions or swarm state on dyson); "No NAS jobs and no NAS credentials on dyson until he says it runs stable"; optional capacity, "don't count on it as always available".
  - 2026-11-26 (INBOX-805): route B, "Also fix and research jobs, through a T3 Code server on dyson".
  - 2026-11-26 (comment #5): "I would prefer if the agents on the mac can decide if they want to turn on the extra machine for work or not based on the work load." Quiet hours: no wakes or new dyson jobs "after 9 pm and before 9am" Pacific.

  ## Route
  t3 profiles (fix, fix-light, fix-fable, fix-retry, research) run in dyson's T3 Code server, linked to the Mac's T3 (`t3 environment list`: label `dyson`). harnessmux starts those threads; it can't name a linked environment yet: **HARN-33** (harnessmux patch release). Reviews and triage over ssh (claude/codex runners): DEV-911, built on this ticket's host layer. `merge` stays on the Mac.

  ## Done when
  - [ ] Config: `agent.hosts.<name>` with `ssh` (target), `t3_environment` (id or label), `max_jobs`, `hours` (`09:00-21:00`), `timezone` (`America/Los_Angeles`) and `wake` (a command, LOCA-707's `scripts/mac/dyson.py wake`). A profile's `host: <name>` makes its jobs eligible for that host. Unknown host, `host` on a `command`/`merge` profile, or a bad `hours`/`timezone`: refused when the config loads. No `host`: Mac only, as today.
  - [ ] Where a job runs: on the Mac while the Mac has a free slot (global and project `max_parallel_jobs`). A job goes to a host only when the Mac is full, the host is within `hours`, has a free slot (`max_jobs`), and the job's expected duration (median of the profile's last 10 jobs, else its timeout) ends before the window closes. Otherwise it waits for the Mac; the queue says why ("dyson: quiet hours until 09:00", "dyson: 2 of max_jobs 2 running").
  - [ ] Wake: eligible work waits, the Mac is full, the host is within `hours` and doesn't answer: lotar runs `wake` once per 10 min. While it boots, the job takes whichever slot frees first. Outside `hours` lotar never wakes it. dyson shuts itself down when idle (LOCA-707); lotar never powers it off.
  - [ ] Before a job goes to dyson: dyson's T3 version equals the Mac's (`t3 --version` over ssh vs local) and the environment answers. Else the job stays on the Mac queue with the reason; never half-started.
  - [ ] Worktree: lotar pushes the job branch over ssh to a clone on dyson at the main checkout's absolute path (created on first use, T3 project registered there) and adds the worktree at the Mac worktree's absolute path, with the profile's Claude settings written there. A failed push or setup: the job stays queued for the Mac with the ssh/git error in its log.
  - [ ] Tickets: no `.tasks` on dyson. The job's lotar MCP server runs on the Mac, reached through a socket forwarded over an ssh connection lotar holds for the job; the remote job's prompt says to use the lotar MCP tools, not the CLI.
  - [ ] Commits come back: at the job's end lotar commits leftover changes on dyson (as for a local job), fetches the branch, re-signs the job's new commits on the Mac and fast-forwards the Mac branch. Fetch or re-sign fails: the ticket is handed back with the error and the remote worktree is kept.
  - [ ] lotar's own T3 calls for the job (thread show, rename, settle, stop; DEV-594 hold, DEV-876 settle) go to dyson's environment.
  - [ ] Stop or lost connection: the thread is stopped through T3 and the forwarding ssh process gets SIGTERM, then SIGKILL after 10 s; nothing of the job keeps running on dyson.
  - [ ] Secrets: no opgate and no credentials on dyson; a job that needs a secret fails and says so. dyson's guard hooks and `t3 update` are LOCA-631 step 6.
  - [ ] Tests with a fake ssh and fake T3 cover the placement rules (Mac first, cap, quiet hours, duration near 21:00), wake, version mismatch, push/fetch/re-sign and cleanup; docs/help describes `agent.hosts` and `host`.
  - [ ] Verified on dyson: one daytime job runs there end to end, and a job queued after 21:00 stays on the Mac.

  Prior art: openai/symphony (SPEC.md Appendix A), sortie-ai/sortie (`docs/architecture/27-appendix-a-ssh-worker-extension.md`).
