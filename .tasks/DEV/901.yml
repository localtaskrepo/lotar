- date: 2026-11-27T10:14:19.125642+00:00
  author: claude
  text: |-
    Fixed the review's blocking finding: a dyson thread that waits for an answer no longer strands its work there.

    - **Review read HEAD** `8c1f4ba84`, so the finding applied.
    - **Waits** (`finish_on_host`): its commits so far are fetched, fast-forwarded and re-signed on the Mac (`Hosted::bring_back_so_far`). dyson's branch then moves to the signed commits (push to `refs/lotar-mac/<branch>`, `reset --soft`). The worktree, uncommitted changes and the MCP bridge stay there for the answer. The dyson slot is freed while it waits.
    - **Answered**: the job that takes the thread over (`resumed.rs` adopt → `resume_session_to_end`) gets the waiting job's worktree and MCP bridge. It holds a dyson slot and runs `finish_on_host` at its end, so the rest comes back signed.
    - **After a lotar restart**: a takeover (adopted or orphaned job with `host` in its header) attaches to the dyson worktree (`Hosted::attach`) and still brings the commits back. The MCP bridge is gone in that case; docs say so.
    - **A new job or merge of the ticket** first brings back what the waiting thread committed meanwhile (`collect_waiting_on_host`). Because dyson's branch was reset to the signed commits, `clear_earlier_worktree` no longer refuses a later dyson job.
    - **Tests** (fake ssh): "waits, answered, commits come back", restart takeover, and a new job after a waiting thread.
    - Fixed a race in this branch's `wake_runs_within_hours_and_at_most_every_ten_minutes`: it read the file before `echo` wrote it, and failed once under load. It now waits for the content.
    - Docs: `docs/help/agent.md` "Commits" bullet.
    - Minor findings: 60 min default is documented; the harnessmux `Cargo.toml`/`Cargo.lock` conflict is for the rebase at merge; "Verified on dyson" is still open.
