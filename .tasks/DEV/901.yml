- date: 2026-11-27T10:06:07.031939+00:00
  author: claude
  text: |-
    Review: blocking. A dyson thread that stops to ask a question strands its work on dyson.

    **Blocking**
    - `crates/lotar-agent/src/services/agent_job_service.rs:4238-4242` (`finish_on_host`): on `RunEnd::WaitingForAnswer`, lotar frees the dyson slot, closes the MCP bridge (`hosted.close()`, `hosted.rs:276`) and returns without `bring_back`. Results:
      - Commits made before the question are never fetched or re-signed.
      - After the owner answers in T3, the thread keeps working on dyson with no lotar MCP server, so it can't touch the ticket.
      - Its commits never come back to the Mac either.
      - It also doesn't count against dyson's `max_jobs`.
      - A later job on the Mac starts without that work. A later job on dyson is refused by `clear_earlier_worktree` (`hosted.rs:163-166`: "has commits the Mac lacks"), because after a fetch HEAD still isn't an ancestor.
      - The merge could land the branch without the dyson commits.
      - This breaks the "Commits come back" and "nothing of the job keeps running on dyson" items in Done when.
    - Fix: when a host job ends waiting, bring its commits back so far, or keep its worktree, slot and bridge for the answered thread. Either way, before the ticket's next job runs or merges, fetch, re-sign and fast-forward from the kept dyson worktree. Reset dyson's branch to the re-signed commits. Add a fake-ssh test for "waits, answered, commits come back".

    **Minor (no ticket)**
    - With no history, the expected duration is 60 min (`agent_hosts.rs:24`). The ticket says "else its timeout", but profiles have no job timeout (only `stall_timeout_seconds`), so 60 min is a fair stand-in. Docs say so.
    - Main moved on: `Cargo.toml` and `Cargo.lock` conflict on harnessmux (main `0.4.0`, branch `0.5.0`). Trivial for the rebase.
    - "Verified on dyson" in Done when is still open (fix comment: not run). The ticket shouldn't go Done until a daytime job has run on dyson and an after-21:00 job has stayed on the Mac.

    **Read and reran**
    - Read: the diff `e1bedb96f..8c1f4ba84` (config, `agent_hosts.rs`, `hosted.rs`, job/queue placement, T3 routing, docs, REST `host` in api_types/types.ts/openapi), the ticket, owner decisions and fix comment #12.
    - Placement (Mac first, both `max_parallel_jobs`, hours, duration, cap), wake (once per 10 min, within hours only), version and environment probe, push/clone/worktree, MCP over a forwarded socket, re-sign by `rebase --force-rebase` and SIGTERM then SIGKILL all match the ticket.
    - `npm ci`: passed.
    - `cargo nextest run -p lotar-agent -p lotar-core -E 'test(agent_host) | test(hosted::) | test(agent_hosts) | test(update_header) | test(agent_queue_service)'`: 42 passed.
    - `npm run lint`: passed. Worktree left clean.
