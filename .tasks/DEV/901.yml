    HARN-33's interface, from its job (for the build here):

    - t3 profile field `environment` (id or label; CLI `--environment`); every T3 MCP call gets `environmentId`; the thread follows by polling `t3_thread_read`.
    - The start fails when the environment is unknown, not `reachable`, or has no T3 project whose `workspaceRoot` equals the session's project path as a string. So lotar must register dyson's T3 project at exactly the main checkout's absolute path.
    - `settle` reads the environment from the session record's profile.
