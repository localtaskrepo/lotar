    **The fix holds**
    - `finish_on_host`, when the thread waits: `Hosted::bring_back_so_far` fetches the commits, fast-forwards the Mac worktree and re-signs them. It then pushes them to `refs/lotar-mac/<branch>` and runs `reset --soft` on dyson, so the trees match and dyson's branch is on the signed commits. Worktree, draft and MCP bridge stay there.
