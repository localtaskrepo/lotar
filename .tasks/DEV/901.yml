    - `cargo nextest run -p lotar-agent -p lotar-core -E 'test(agent_host) | test(hosted::) | test(agent_hosts) | test(update_header) | test(agent_queue_service)'`: 45 passed.
    - `npm run lint`: passed. Worktree left clean.
    - No UI changes, so ui-review didn't apply.

    **Minor**
    - [DEV-929](https://lotar.pyxzl.net/task/DEV-929): a waiting dyson thread that a new job doesn't take over is never stopped. Its MCP `ssh -R` forward stays open until another job of the ticket starts or lotar exits.
