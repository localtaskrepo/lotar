description: |-
  Steps DEV-393 left open (merge comment, 2026-11-12: "Not done (follow-up if wanted)").

  1. **Task table row menu**: an Add to release entry per row, as the bulk actions already offer for selected tickets.
  2. **Releases page**: a project filter, like the other pages' project selector.
  3. **release_changed**: pages that show a release list (task panel, Tasks list filters and column, Calendar, filter bars) refresh it when a release_changed event arrives, not only the Releases page.

  ## Done when

  - [ ] Each of the three works in the browser, with smoke coverage.
  - [ ] npm run lint, npm test and npm run smoke pass.
