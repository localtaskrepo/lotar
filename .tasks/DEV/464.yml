- date: 2026-11-13T09:26:09.144119+00:00
  author: claude
  text: |-
    Done in commit 24fb128d on agent/DEV-464.
    1. Task table row menu: Add to release… per row (disabled while there are no releases), opens the same dialog as the bulk action (TaskTable.vue, TasksList.vue).
    2. Releases page: a project picker in the header, synced to ?project=. It narrows the tickets in each release, their open/done counts and progress, and the backlog (server-side project param). Releases themselves stay workspace-wide.
    3. release_changed: the shared release list (useReleases) subscribes to release_changed while any page uses it and reloads, so task panel, Tasks list filters/column/row menu, Calendar, Board, Insights, Dependencies and filter bars update.
    Tests: useReleases.spec.ts (new), ReleasesList.spec.ts project filter case; jsdom gets an inert EventSource stub in vitest.setup.ts. Smoke: two new cases in ui.releases.smoke.spec.ts (row menu enabled after a release is created over REST, then adds the ticket; project filter). The row-menu smoke case fails with the subscription disabled (checked). Docs: docs/help/releases.md Web UI section.
    Checks: npm run lint, npm test (2126 Rust, 1512 UI), npm run smoke (388) all pass.
