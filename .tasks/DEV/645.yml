description: |-
  Found in the DEV-623 review (2026-11-16).

  `memory_gate::status` (`crates/lotar-lib/src/services/memory_gate.rs:94`) returns the hold saved in `memory-gate-<hash>.json` without looking at its age. `lotar agent list-jobs` prints it unconditionally (`crates/lotar-lib/src/cli/handlers/agent.rs:311`). Only `check` rereads memory, and only the worker loop, `lotar serve` start paths and its tick call it.

  Case: `lotar serve` held a job, then exited (or the held job was removed). Hours later, with memory normal, `lotar agent list-jobs` still says `Queue: new jobs wait for memory: … (held since <old time>)`. `lotar agent queue` hides it while nothing is queued, so it's mainly list-jobs.

  ## Done when
  - [ ] `memory_gate::status` (used by `lotar agent list-jobs`, `lotar agent queue`, the worker state line and `lotar serve`'s waiting reason) reads memory again when the saved reading is older than 2 × 30 s (60 s) or has no time, and that saved reading held or failed. The reading wins over the saved state.
    - Normal now: no hold is shown. Short of memory now: a hold with that reason, since now. Reading fails now: no hold, the error is shown.
    - The fresh reading is not saved: only `check` (the worker, `lotar serve`) writes `memory-gate-<hash>.json`, so the settle time of a running gate is unchanged.
    - A saved reading 60 s old or newer is shown as saved (a held worker rereads every 30 s). A saved open gate (no hold, no error) is shown as before, without a reading.
  - [ ] A test with an old saved hold and a normal reading: `status` shows no hold; the same hold with a recent reading is still shown.
tags:
- waits
