- date: 2026-11-22T02:44:44.140146+00:00
  author: claude
  text: |-
    Both agent-jobs tests now wait out full-run load; the stop-all one also had a real race.

    - Stop-all: the held gate agent exited by itself after the gate's 20 s default (`smoke/helpers/gate-agent.mjs`). Under load the dialog walk takes longer, so the running job *completed* before Stop all and "every job cancelled" could never come true. It now holds for `JOB_END_LIMIT_MS`; the `finally` still releases it.
    - Both tests: the 15-20 s waits now use the file's `WAIT_BUDGET_MS` (45 s), and each test gets `{ timeout: 300_000 }` instead of the shared 120 s cap, as DEV-755 did.
    - Only `smoke/tests/ui.agent-jobs.smoke.spec.ts` changed.
  report:
    commits:
    - hash: a608c74df
      what: hold the stop-all agent past the run, wait budgets and 300 s caps for both tests
