description: 'Found in the DEV-760 merge (2026-11-21), load average 46: `npm run -s smoke` failed in `smoke/tests/ui.agent-jobs.smoke.spec.ts`: ''stops queued and running jobs only after accessible confirmation'' (line 739, ''Timed out after 20000ms waiting for stop-all to cancel every job'') and ''shows the agent''s permission question in the job view and answers it'' (line 784, locator.waitFor 15000ms). Alone the spec passes, 11/11 in 29 s. Check: `npm run -s smoke` under load. Done: like DEV-755, these waits allow for full-run load, so only a hang fails them.'
