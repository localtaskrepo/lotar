description: |-
  Found in the DEV-633 review: `apply_durable_end_action` (`crates/lotar-lib/src/services/automation_service.rs`) keeps every error from `create_dir_all`/`acquire_storage_lock`/`save_end_action` in `UNSAVED_END_ACTIONS`, including permanent ones (permission denied, a file where the folder goes). Those retry every 30 s forever and `has_unsaved_end_actions` keeps the queue worker from exiting. A busy lock (WouldBlock) held by a run of the same job's checkpoint that then finishes and deletes it would also let the kept copy run the steps a second time. The ticket asked for transient errors (ENOSPC, lock).

  ## Done when
  - [ ] A checkpoint that fails on a full disk (`StorageFull`) keeps the end rules and runs them once it can be saved (DEV-633 behavior).
  - [ ] Any other checkpoint error (permission denied, a file where the folder goes) is returned as before and nothing is kept.
  - [ ] A busy lock is not kept: its holder may be this job's checkpoint finishing, so a kept copy could run the steps twice.
  - [ ] A kept entry whose retry fails permanently is dropped with a log line; full disk or busy lock on the retry keeps it for the next try.
  - [ ] A test covers a new permanent failure and a kept entry that then fails permanently.
