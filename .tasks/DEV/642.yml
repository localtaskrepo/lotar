  text: 'The @fix job waits for its open prerequisites: DEV-633.'
- date: 2026-11-17T03:42:06.461768+00:00
  author: claude
  text: |-
    Only a full disk keeps a job's end rules now; any other checkpoint error fails as before.

    - `apply_durable_end_action`: keeps the rules only on `StorageFull`, other errors (permission, file where the folder goes) return unchanged
    - Busy lock is **not** kept: its holder may be this job's checkpoint finishing its steps, so a kept copy could run them twice
    - `save_unsaved_end_actions`: a kept entry whose retry hits a permanent error is dropped with a log line, so it stops holding the worker; full disk or busy lock retries
    - New `lock_end_action` helper; a test-only `checkpoint_fault` fakes ENOSPC
    - Test `end_rules_whose_checkpoint_fails_permanently_are_not_kept`; the DEV-633 test now uses the ENOSPC fake
