references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A250c2a8c-eb09-4e10-aa80-5c5fc3462ccc
description: 'Found in the DEV-633 review: `apply_durable_end_action` (`crates/lotar-lib/src/services/automation_service.rs`) keeps every error from `create_dir_all`/`acquire_storage_lock`/`save_end_action` in `UNSAVED_END_ACTIONS`, including permanent ones (permission denied, a file where the folder goes). Those retry every 30 s forever and `has_unsaved_end_actions` keeps the queue worker from exiting. A busy lock (WouldBlock) held by a run of the same job''s checkpoint that then finishes and deletes it would also let the kept copy run the steps a second time. The ticket asked for transient errors (ENOSPC, lock). Done when only StorageFull (and a busy lock, if safe) is kept, and other errors fail as before, with a test.'
