- date: 2026-11-21T04:12:15.986776+00:00
  author: claude
  text: |-
    Fixed: the reviewed-workflow test now waits for its jobs to end instead of a fixed 20 s.

    - `smoke/tests/ui.agent-jobs.smoke.spec.ts`: `waitForTaskRowText` (used only by this test) polls until `JOB_END_LIMIT_MS` = 240 s instead of 80 × 250 ms, the same pattern as DEV-743
    - the test's own timeout is `2 * JOB_END_LIMIT_MS + 60_000`, so the vitest default of 120 s doesn't cut the two waits short
    - the diff reindents the test because Prettier wraps the `it(...)` call; `git diff -w` shows 15 lines
    - full smoke ran at load avg ~30 and passed
  report:
    commits:
    - hash: a77c8069d
      what: reviewed-workflow row waits end when the jobs do; 240 s limit only catches a hang
    checks:
