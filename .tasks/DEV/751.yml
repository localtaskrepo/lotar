      result: passed
    - command: npm run -s test:smoke:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts -t 'reviewed template'
      result: passed
      reason: 3 s alone
    - command: npm run -s test:smoke:quick:agent
      result: passed
      reason: 406/406, load avg rose to 30
    - command: npm run -s test:agent
      result: passed
      reason: 2436 Rust, 1563 UI, release and hook tests
    next: Review, then merge and rerun npm run -s smoke on main
- date: 2026-11-21T09:21:21.836133+00:00
  author: claude
  text: |-
    Review: passed. The fix waits for the jobs to end and fits the DEV-743 pattern; it conflicts with DEV-750 on main, and the conflict is easy to resolve.

    - Read: the ticket, DEV-741, DEV-743, DEV-750, `AGENTS.md`, and the commit `a77c8069d` (only `smoke/tests/ui.agent-jobs.smoke.spec.ts` changed; `git diff -w` adds 15 lines and removes 4).
    - Done when: the test no longer has a fixed 20 s deadline. `waitForTaskRowText` polls up to `JOB_END_LIMIT_MS` = 240 s, which only catches a hang. The test's own timeout is `2 * JOB_END_LIMIT_MS + 60_000`, above vitest's 120 s default (`smoke/vitest.config.ts:15`). The helper is used only at lines 616 and 626 of this test.
    - Rebase: main's `0595ed4cf` (DEV-750) changed the same helper to `WAIT_BUDGET_MS` = 45 s, and `git merge-tree main HEAD` shows a conflict in `smoke/tests/ui.agent-jobs.smoke.spec.ts`. To resolve it, keep main's `WAIT_BUDGET_MS` and its use in the other helpers. Add `JOB_END_LIMIT_MS`, and only `waitForTaskRowText` uses it, together with the new error text and the test's timeout.
    - Reran: `npm ci` passed. `npx prettier --check` and `npx oxlint` on the file passed (ESLint ignores `smoke/`). `npm run -s test:smoke:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts -t "reviewed template workflow"` passed in 11 s, at a 15-minute load average of 34.
    - Not rerun: the full `npm run smoke` under load, which takes too long for a review. The fix agent reports 406/406 at load avg ~30.
    - No test failed before the fix: the flake can't be reproduced on demand, which is the same limit as DEV-743.
    - Not UI work: no screenshots needed. No stray files or second branch. Nothing for the owner to decide. No tickets filed.
