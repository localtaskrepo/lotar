- date: 2026-11-26T00:50:01.472479+00:00
  author: claude
  text: |-
    Fixed: a relative tasks dir (`--tasks-dir .tasks`) sent the answer's job to a queue no worker reads. It is now made absolute.

    - **Cause:** `TasksDirectoryResolver` returned `--tasks-dir` and `LOTAR_TASKS_DIR` unchanged. The agent queue is keyed by that string (`queue_hash`), and the worker it starts gets the absolute path. The job went into `queue-<hash of ".tasks">.json`, and the worker read a different file.
    - **Second symptom, same cause:** `run` rules start in `tasks_dir.parent()`, which is empty for `.tasks`. That is the `IO error: No such file or directory` the triage saw on STD-336 for "Inbox: close what no longer waits" and "Comments: the owner's comment reaches the agent".
    - **Reproduced:** in a temp repo, `--tasks-dir .tasks comment TEST-6 --answer fix` gives the same two-part failure. With an absolute `--tasks-dir`, the answer starts the job: `maybe_queue_agent_on_assignment` and `ensure_worker` were fine, so the guess in the ticket was wrong.
    - **Fix:** `crates/lotar-core/src/workspace.rs` makes both paths absolute. Documented in `docs/help/precedence.md`.
    - **Evidence it happened for real:** `~/Library/Caches/lotar/agent-queue/queue-b06823c05bdb7cda4004b1281c7001744d021ba39e3f81993eb5805f188f6f3e.json` (tasks_dir `.tasks`, last written 2026-11-25 22:14Z) still holds DEV-850, DEV-849, DEV-848, DEV-827, STD-336, DEV-872 and STD-359. No worker will run them. One source is `.github/skills/lotar-dev-tracking/SKILL.md`, which tells agents to run `lotar --tasks-dir .tasks ...`; that works correctly now. I left the file alone: moving it would start 7 jobs.
    - **Not confirmed:** the exact path the triage passed isn't logged; the two symptoms match the relative case exactly.
    - **Filed:** [DEV-886](https://lotar.pyxzl.net/task/DEV-886). STD-336's @fix retry, job `-51`, failed in 2s with the merge job's verdict and no agent turn.
  report:
    commits:
    - hash: 2b4d67d0a
      what: resolver makes a relative --tasks-dir / LOTAR_TASKS_DIR absolute; test dev860_relative_tasks_dir_test
    checks:
    - command: cargo nextest run -p lotar-lib --test integration dev860
      result: passed
      reason: fails before the fix, passes after
    - command: cargo nextest run -p lotar-lib --test integration (104 modules using --tasks-dir or LOTAR_TASKS_DIR)
      result: passed
      reason: 924 tests, after updating 2 tests that expected the relative path in config show
    - command: cargo nextest run -p lotar-core
      result: passed
