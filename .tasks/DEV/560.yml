description: |-
  The review's blocker on DEV-518 is still on main: for a job the server still holds, `/api/jobs/logs` (and so the Timeline's **Show thread**) returns only the last 200 events kept in memory, although the job log has all of them. Found while preparing v0.15.1 (DEV-513), 2026-11-15.

  ## Cause

  - `0327eb8f` (DEV-518) landed on main although its review blocked it (DEV-523). The owner chose to fix forward on 2026-11-14: "Don't push it or release v0.15.1 (DEV-513) until this rework's review passes."
  - The rework, `6818cb78` on `agent/DEV-518`, was never reviewed or merged. The merge job checked out the old `0327eb8f`, wrote "nothing to merge", and DEV-518 went to Done 5 s later. DEV-532's cleanup then removed the branch; the commit is kept as `refs/archive/DEV-532/heads/agent/DEV-518`.
  - `git diff 0327eb8f 6818cb78` is the rework: 5 files, +100 −26 (`agent_job_service.rs`, `agent_log_service.rs`, `docs/help/agent.md`, `docs/help/api-quick-reference.md`, `docs/openapi.json`), with the regression test `a_held_job_past_the_event_cap_returns_its_whole_thread_with_live_sequences`.

  ## Fix

  Port that diff onto current main (`git diff 0327eb8f 6818cb78 | git apply -3`), rerun lint, test and smoke, and send it through review and merge.

  ## Done when

  - [ ] The rework is on main and its regression test passes there.
  - [ ] Its review passed.
