comments:
- date: 2026-11-13T01:18:58.461870+00:00
  author: claude
  text: 'Reproduced: four parallel test:ui runs at load ~68 each failed ''SprintsList pagination > applies persisted manual backlog order before paging without resetting sprint pages'' with ''Test timed out in 5000ms''. That test takes ~0.8 s on a quiet machine and uses no real timers (renders + flushPromises), so it is CPU-bound, not waiting on anything. Fix: view/vitest.config.ts sets testTimeout and hookTimeout to 30 s. After it: four parallel runs at load ~73 passed 1505/1505 each; at load ~124 the slowest test took 7.0 s and all passed. Commit ab6f9ce on agent/DEV-402. Checks: npm run lint, npm test (2109 Rust + 1505 UI + release + hooks), npm run smoke (385) all pass.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A13bd2776-3d83-4543-9133-0432ebbd2cfe
description: 'Found while fixing DEV-399: `npx vitest run --config view/vitest.config.ts` at load average ~20 on 14 cores failed about 20 tests across Board, Calendar, ConfigView, SprintsList, TaskPanel and useProjects specs, each after 5-9 s (Vitest''s default 5 s testTimeout), e.g. ''joins the 200-event snapshot suffix with the 1000-entry live buffer'', ''opens the overflow day dialog from the keyboard (DEV-288)'', ''notifies every live projects snapshot after creating a project''. The same files passed on a rerun right after, and npm test passed 1507/1507 a few minutes later. Check: npm run test:ui while other agents build (load over 20). Done: view/vitest.config.ts gives tests a budget that holds under that load (the smoke config uses 120 s), or the slow tests wait on what they need; test:ui passes under that load.'
