- date: 2026-11-17T17:42:12.007485+00:00
  author: claude
  text: |-
    `lotar automation run` now replays `unblocked` for in-repo prerequisites too.

    - `run_cross_repo_unblocked` → `run_unblocked` in `crates/lotar-agent/src/services/automation_service.rs`: fires on every open ticket with at least one `depends_on` and none open, not only ones with a `repo:ID` prerequisite. `${{unblocked.by}}` is set as before.
    - Default, no flag: the rule's own `when` (e.g. `status: Blocked` + a `set` out of it) already keeps it from firing every run, as docs required for cross-repo rules.
    - Test `automation_run_fires_unblocked_for_a_done_prerequisite_in_the_same_repo` in `crates/lotar-lib/tests/dev386_cross_repo_relationships_test.rs`: `--select id:STD-1 --dry-run` lists STD-1; a Blocked ticket without prerequisites stays untouched. Failed before the fix.
    - Docs: `docs/help/automation.md` ("When prerequisites are done", `automation run`), `docs/openapi.json`, CLI help.
    - Commit `f70e32dcf`. The STD-200 workaround in standards `scripts/repos.ts` can go back to running the unblocked rule.
