description: |-
  ## Found
  - `lotar automation run <rule> --select id:<ID>` fires an `unblocked` rule only for a ticket with a prerequisite in another repo (`run_cross_repo_unblocked` in `crates/lotar-agent/src/services/automation_service.rs`, docs/help/automation.md "When prerequisites are done"). lotar 0.15.3.
  - When the in-repo event is lost (a close while another job starts or ends, like DEV-660), a Blocked ticket whose prerequisites are all in its repo and done waits forever: nothing can fire its `unblocked` rule again. The standards live check (`scripts/repos.ts`, STD-200) now works around it by setting the ticket InProgress and running a manual restart rule, which loses the rule's `${{unblocked.by}}` message.
  - A `manual` action on the unblocked rule is no fix: a manual run without --select would start every Blocked ticket, prerequisites open or not.

  ## Check
  In a repo with a Blocked ticket A that depends on B in the same repo, B done, and A's unblocked rule never fired: `lotar automation run "<unblocked rule>" --select id:A --dry-run` lists an entry for A.

  ## Done when
  - [ ] A manual run fires `unblocked` rules for every open ticket with at least one prerequisite and none open, in its repo or another, the same way it does for cross-repo ones now (or behind a flag such as `--unblocked`), documented in docs/help/automation.md.
  - [ ] A test with an in-repo prerequisite.
