description: 'Found: STD-216 job-20261118T021821.921Z-1 failed with ''git branch --force agent/STD-216 41462b6 failed: fatal: cannot force update the branch agent/STD-216 used by worktree /Users/mallox/.t3/worktrees/standards/agent-STD-216-d14d5bbe7bff030e''. The fix is done and checked on the thread''s branch; only the move failed. Check: a test where agent/TEST-1 is checked out in a worktree and the thread''s branch is ahead: the job moves the branch anyway (e.g. git -C <worktree> reset --hard or update-ref there, when the worktree is clean) or detaches the worktree first. Done when STD-216''s branch lands without the owner. Related: DEV-687 (the earlier refusal).'
