- date: 2026-11-18T02:36:06.738036+00:00
  author: claude
  text: |-
    Already fixed on main by DEV-673 (`a11c67715`), but the installed lotar 0.15.3 doesn't have it yet: waits for release v0.15.4 (DEV-658).

    - STD-216's job `job-20261118T021821.921Z-1` continued the session `standards-04f015-STD-216-fix`, the same session as the fix job `job-20261118T004740.011Z-739`, whose clean worktree `agent-STD-216-d14d5bbe7bff030e` has `agent/STD-216` checked out
    - 0.15.3 (tag `fcc715939`) counted the ending job's own record as a job still at work in that worktree, so it neither moved the worktree nor the branch: `git branch --force` refused
    - DEV-673 leaves the ending job out (`finished_job_worktree`, `crates/lotar-agent/src/services/agent_job_service.rs`); the test `the_tickets_branch_moves_in_the_worktree_of_an_earlier_job_in_the_same_session` covers this case and passes here
    - `a11c67715` is on main, not in `v0.15.3`; release v0.15.4 (DEV-658) includes it
    - STD-216 itself is unchanged: `agent/STD-216` is at `f2c4f93`, the fix is at `41462b6` on `t3/ls-credential-paths-xargs-guard`, the old worktree is clean. STD-216 waits for DEV-688.
    - No commit: nothing to change
  report:
    checks:
    - command: cargo nextest run --test integration dev503_harness_jobs_test::the_tickets_branch
      result: passed
      reason: 4 tests, incl. the DEV-673 same-session case
    - command: npm run lint
      result: not_run
      reason: no file changed
    - command: npm test
      result: not_run
      reason: no file changed
    - command: npm run smoke
      result: not_run
      reason: no file changed
    next: 'After v0.15.4 is installed (DEV-658), STD-216 continues on its own: check that agent/STD-216 moves to t3/ls-credential-paths-xargs-guard (41462b6) and lands, then set DEV-688 Done'
- date: 2026-11-18T02:36:16.992366+00:00
  author: automation
  text: 'The @review job waits for its open prerequisites: DEV-658.'
- date: 2026-11-18T04:23:06.966531+00:00
  author: claude
  text: |-
    Can't run the check: v0.15.4 is merged but not released or installed.

    - `lotar --version` prints `lotar 0.15.3`; `/opt/homebrew/opt/lotar` → `Cellar/lotar/0.15.3`, the only version in the Cellar
    - [DEV-658](https://lotar.pyxzl.net/task/DEV-658) is Done: its commit `592abd9c4` "DEV-658 Release v0.15.4" is on `main` and pushed
    - No `v0.15.4` tag exists, locally or on `origin` (`git ls-remote --tags origin 'v0.15.*'` stops at `v0.15.3`)
    - STD-216 is unchanged: `agent/STD-216` is at `f2c4f93`, checked out in the clean worktree `agent-STD-216-d14d5bbe7bff030e`; the fix `41462b6` is only on `t3/ls-credential-paths-xargs-guard`
    - No files changed

    Question: should v0.15.4 be tagged, published and installed now, so this check can run on it?
  report:
    checks:
    - command: lotar --version prints 0.15.4
      result: not_run
      reason: installed lotar is 0.15.3
    - command: STD-216 branch lands on the new release
      result: not_run
      reason: release not installed
    next: Tag, publish and install v0.15.4, then rerun this ticket's check
- date: 2026-11-18T04:23:27.223360+00:00
  author: triage
  text: |-
    Yes, tag, publish and install v0.15.4: the owner already approved it.

    - mallox, 2026-11-17, on [DEV-658](https://lotar.pyxzl.net/task/DEV-658): "Now, once QA is green": the OK for step 4 of `.github/skills/release/SKILL.md` (signed tag, push, `lotar release release`), "Follow the skill to the end, incl. brew upgrade and the next release ticket"
    - DEV-658 was closed Done before the tag existed (`git ls-remote --tags origin 'v0.15.*'` stops at `v0.15.3`): finish the release steps, then rerun this check
    - If QA on main is red, file that as the blocker instead of asking again
references:
