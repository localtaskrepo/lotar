  text: 'Claude (Opus 5.5): Done in 4eaad9d on agent/DEV-362. simulate now matches change events like a real update: created uses a new-task change set; updated/sprint_changed/assigned look for an update of one field (assigned always includes assignee) that fires the rule (update_match in automation_matching.rs). A match that needs a field change carries the warning ''Matches only when status changes in the same update.''; a rule needing several fields at once no longer matches, and the no-match result names it (''Done and tagged: matches only when status and tags change in the same update; ...''). CLI prints these notes on no match, the rule editor''s Try it shows them too. Docs: automation.md (field conditions inside all, Simulating rules), warnings field in api_types.rs/types.ts/openapi.json (shape unchanged). Tests: new tests/dev362_simulate_change_events_test.rs (failed before the fix); dev118 preview test now expects the status note. Checks: npm run lint:agent, test:agent (Rust 2006 passed; UI 1444 passed on rerun, Board/SprintsList specs timed out once at 5s under load and pass alone and on full rerun; release, hooks), test:smoke:agent 379 passed; ticket scenario run with the built CLI. Finding, not fixed: field conditions written with the aliases labels/task_type never match a real update, because ChangeSet records tags/type only.'
