description: |-
  Board cards don't show a ticket's relationships, so you can't see at a glance which tickets block others. The owner asked (2026-11-13) for a card field that can be turned on and off like the others and lists the related IDs, e.g. "Blocks" followed by the IDs of the blocked tickets.

  ## Plan

  - New field `relationships` ("Relationships") in the board's card-field menu, off by default; only the board offers it (the task table and hover cards are unchanged).
  - `BoardCardMeta.vue` shows one chip per kind with the IDs: Blocks (highlighted), Depends on, Parent, Children, Fixes, Duplicate of, Related. Long lists show the first IDs and `+N`, the tooltip lists all.

  ## Done when

  - [x] The field toggles relationship chips on board cards and is saved like the other fields
  - [x] Unit test for BoardCardMeta, smoke coverage on the board
  - [x] Help doc (serve.md, Boards) mentions it
  - [x] `npm run lint`, `npm test`, `npm run smoke` pass

  Merged to main 2026-11-13, commit titled "DEV-418 Board cards: optional field ...". Not pushed.
