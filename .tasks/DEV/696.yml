description: |-
  Found in the review of DEV-691 (2026-11-17).

  - DEV-684 is Done after the merge job commented "Nothing to merge: `agent/DEV-684` is in `main` already." That checked lotar's `agent/DEV-684` (no commits). The work is harnessmux commit `65a95a0` on harnessmux `agent/DEV-684`, and it isn't on harnessmux `main` (`0f7afe7`): `git -C ~/Development/@localtaskrepo/harnessmux merge-base --is-ancestor 65a95a0 main` fails.
  - The check is in `crates/lotar-agent/src/services/agent_job_service/merge.rs:137-143`: it only looks at the ticket's own repo.
  - DEV-691 will go the same way: its work is harnessmux `c00cd57` on harnessmux `agent/DEV-691` (on top of `65a95a0`); lotar's `agent/DEV-691` has no commits.

  Check: `git -C ~/Development/@localtaskrepo/harnessmux merge-base --is-ancestor c00cd57 main`.
  Done: harnessmux `65a95a0` and `c00cd57` are on harnessmux main (fast-forward of `agent/DEV-691`, which holds both), and a merge job no longer reports "nothing to merge" for a ticket whose commits are in another repo.
