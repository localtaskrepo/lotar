- date: 2026-11-18T00:06:29.150971+00:00
  author: claude
  text: |-
    Fixed a race in `lotar agent queue`: it read the memory gate twice.

    - CI output had `memory_hold` set but `reason` "waiting for the running jobs of their tickets to end": two different readings in one command.
    - `agent run` only queues; the worker does the first memory reading and writes `memory-gate-<hash>.json` (fsync'd, slow on CI). A debug run caught the worker's `.tmp` file mid-write.
    - `worker_state` read the gate first and found no hold, then the worker's write landed, then the handler's second read found the hold.
    - Fix: the handler reads `memory_gate::status` once and passes the hold to `AgentQueueService::worker_state` (`crates/lotar-agent/src/services/agent_queue_service.rs`, `crates/lotar-lib/src/cli/handlers/agent.rs`).
    - No new test: the race depends on timing, so the evidence is the failing CI run `44192130722`. The existing test now passes 8 runs in a row.
  report:
