project:
  name: Local Task Repo
members:
- '@fix'
- claude
- codex
- fix
- mallox
- none
- triage
issue:
  states:
  - Todo
  - InProgress
  - Reviewing
  - Merging
  - HelpNeeded
  - Blocked
  - Done
  - WontDo
  done_states:
  - Done
  - WontDo
attachments:
  dir: DEV/@attachments
agent:
  worktree:
    # At most 3 jobs at a time in lotar, the rest queue: each runs Rust builds and the smoke suites. Only lotar has a
    # limit (owner 2026-11-15, STD-170, standards docs/decisions/2026-11-15-job-limit.md); raised from 2 to 3 with the
    # memory gate in place (owner 2026-11-21, 13 jobs queued: "3 jobs at a time").
    max_parallel_jobs: 3
    # A ticket a job's end or a held-back start leaves HelpNeeded or Blocked loses the workspace crates' build output,
    # also when a rule or lotar set the wait (owner 2026-11-18, DEV-712: "command (A command lotar runs: setting
    # agent.worktree.waiting_run (cargo clean --workspace), needs lotar trust)").
    waiting_run: [cargo, clean, --workspace]
