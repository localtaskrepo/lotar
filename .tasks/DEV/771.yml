  text: |-
    Fixed: `GET /api/jobs` and the Agents page show the same counts as `lotar agent queue`, and list the waiting tickets.

    - New `AgentQueueService::overview` (`crates/lotar-agent/src/services/agent_queue_service.rs`): counts jobs other processes run and the on-disk queue, falls back to the configured `max_parallel_jobs`, and gives each waiting ticket `waits_for` (queue worker, memory, usage-limit reset, paused queue, free slot, its ticket's running job, `starting`)
