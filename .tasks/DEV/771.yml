- date: 2026-11-22T19:10:47.545213+00:00
  author: claude
  text: |-
    Review: blocking. The Agents page shows raw markdown backticks in each waiting ticket's line. Otherwise the fix does what "Done when" asks.

    - **Blocking:** with no worker running, every row reads ``Waiting for a queue worker; start one with `lotar agent queue resume` `` with the backticks visible (my after screenshots, light and dark, 1920/1440/390). The text comes from `crates/lotar-agent/src/services/agent_queue_service.rs:797`, and `view/pages/AgentJobs.vue:98` prints `waits_for` as plain text. Pause and memory reasons can carry markdown the same way. Fix: show backtick spans as `<code>` (or remove the backticks) in the queue row. Add a Vitest with a `waits_for` that contains backticks
    - **Rebase:** the earlier claim "merges clean" is wrong. `git merge-tree --write-tree main HEAD` exits 1 with two small conflicts: `docs/help/agent.md` ~361 (DEV-766's **Show logs** line, keep both) and the `import type` in `view/pages/AgentJobs.vue` ~322 (add `AgentJobTool`)
    - **Holds:** route and CLI share `AgentQueueService::overview`. `waits_for` follows the order of `dequeue_startable`. In-process queued jobs are separate from the on-disk queue, so the Queued tab doesn't count anything twice. The integration test fails without the fix because there was no `queue` field and running was 0
    - **Reran on `3333807b1`:** `npm ci` passed. `npm run lint:agent` passed. `cargo nextest` on the new and related queue tests passed (14 tests). `vitest view/__tests__/AgentJobs.spec.ts` passed (32 tests). Full `npm test` and smoke: not rerun (the fix agent passed them at 06:04)
    - **Manual check:** `lotar serve` from this branch on a scratch workspace with 3 tickets queued by the CLI. `/api/jobs` showed Running 0, Queued 3, the same as `lotar agent queue`. The fix agent's 12 screenshots were read and look fine; they show the free-slot text, which has no backticks
    - **Minor, filed:** [DEV-798](https://lotar.pyxzl.net/task/DEV-798): the tab counts don't match the list. "All 0" shows above 3 waiting tickets, and the Queued tab counts jobs waiting for prerequisites
    - **My mistake, cleaned up:** the job's `LOTAR_TASKS_DIR` made my first scratch `lotar add` create DEV-798..801 in the main checkout. They were untracked, I deleted them, and no queue entries or jobs exist for them. The number 798 was then reused for the minor ticket above
