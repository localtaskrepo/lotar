- date: 2026-11-22T01:58:29.692575+00:00
  author: claude
  text: |-
    Fixed: `GET /api/jobs` and the Agents page show the same counts as `lotar agent queue`, and list the waiting tickets.

    - New `AgentQueueService::overview` (`crates/lotar-agent/src/services/agent_queue_service.rs`): counts jobs other processes run and the on-disk queue, falls back to the configured `max_parallel_jobs`, and gives each waiting ticket `waits_for` (queue worker, memory, usage-limit reset, paused queue, free slot, its ticket's running job, `starting`)
    - `lotar agent queue` and `GET /api/jobs` share it; the route adds a `queue` field (`api_types.rs`, `view/api/types.ts`, `docs/openapi.json` updated)
    - Agents page: **Waiting in the queue** card on All/Queued tabs in queue order (agent, queued time, what it waits for), jobs waiting for prerequisites below; reads the queue again every 15 s
    - Repro: old build's server answered `running 0, queued 0` while the CLI said Running 1, Queued 3; the new build answers 1/3 and lists the 3 tickets
    - Tests: `dev771_jobs_route_shows_the_queue_test` (entries queued by another CLI process, job record of another process), unit test `each_waiting_entry_says_what_it_waits_for`, Vitest for the card
    - Screenshots before/after, light and dark, 1920/1440/390: `DEV-771-before-*.png`, `DEV-771-after-*.png` on https://lotar.pyxzl.net/task/DEV-771
    - Not changed: the MCP `agent_list_jobs` still counts only its own process
    - Docs: `docs/help/agent.md`, `docs/help/api-quick-reference.md`
