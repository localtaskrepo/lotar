- date: 2026-11-22T09:28:12.457189+00:00
  author: claude
  text: |-
    Question: should harnessmux report a refused resume as its own error? lotar can't tell the steps apart without it.

    - DEV-757 is on main (`89fe192f8`); `agent/DEV-777` is rebased onto `f7733872c`. Nothing changed or committed yet
    - In harnessmux 0.2.0 (and its main, `b589ce1`), `initialize`, `authenticate`, `session/resume`, `session/load` and `set_config_option` all go through `?` into `Error::Protocol(<agent's message>)` (`src/error.rs:54`, `src/backend/acp.rs:154-330`). The message doesn't name the step, and no event comes before the session starts, so lotar's `open_session` (`crates/lotar-agent/src/services/agent_runner.rs:263`) has nothing to check
    - The only way to tell them apart from lotar is to read harnessmux's `HARNESSMUX_RECORD` wire log, which would mean setting a process-wide env var while the server runs other jobs. I don't recommend that
    - Proposal: add `Error::NotResumable(String)` to harnessmux for a refused `session/resume`/`session/load`, release it, then bump lotar and match only that variant in `open_session`, plus a fake-ACP test that refuses `initialize`. Changing harnessmux's public API and publishing a release is your decision
    - Next: on your yes, file the HARN ticket, wait for the release, then finish DEV-777 here
- date: 2026-11-22T18:08:12.827499+00:00
  author: mallox
  text: 'Yes: add the refused-resume error (NotResumable) to harnessmux and release it as a new version, then have lotar resume only on that. Owner 2026-11-22 10:05 PST, relayed by the chief of staff: "Releases of harnessmux can from now on be done by agents when needed. No need to wait for my green light. Lotar releases should still ask me."'
- date: 2026-11-22T20:14:20.239233+00:00
  author: claude
  text: |-
    Done: a continue job now starts a new session only when the agent refuses `session/resume` or `session/load`.

    - harnessmux HARN-25: new `Error::NotResumable` for those two refusals. Released as `v0.3.0` (tag on `651e4a1`, release run `45064053899` passed, crate published). 0.3.0 was still untagged, so HARN-23/24 shipped with it
    - lotar bumps to `harnessmux = "0.3.0"`. `open_session` (`crates/lotar-agent/src/services/agent_runner.rs:263`) matches only `NotResumable`. Any other `Protocol` error fails the job and leaves the session alone
    - 0.3.0 changes `EventBody::ToolFinished`, so a `..` was added in `agent_job_service.rs:4660`
    - Test `a_continue_job_whose_agent_refuses_initialize_fails_and_keeps_the_session`: the fake ACP agent refuses `initialize` on resume. The job fails, there is no second `session/new`, and the session keeps its name (not `<name>.<last used>`)
    - `docs/help/agent.md`: a refused `initialize` or authentication is listed among the start errors that fail the job
