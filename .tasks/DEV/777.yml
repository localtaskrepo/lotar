description: |-
  Found in the DEV-757 review (2026-11-21).

  `open_session` (`crates/lotar-agent/src/services/agent_runner.rs:262`) maps every `harnessmux::Error::Protocol` from `Session::resume` to `OpenSessionError::NotResumable`. harnessmux 0.2.0 returns `Protocol` for any ACP request the agent refuses before the session is ready (`From<agent_client_protocol::Error>` in `src/error.rs:54`): `initialize`, `authenticate`, `session/set_config_option` as well as `session/resume`/`session/load` (`src/backend/acp.rs:265-310`). DEV-757 asks: "Only resume errors fall back."

  Effect: an agent that fails `initialize` or authentication on resume gets its session closed and kept as `<name>.<last used>`, and a new session with a handoff is tried. That one usually fails the same way, so the job still fails, but the old session is no longer resumable.

  ## Done when
  - [ ] Only a refused `session/resume` or `session/load` counts as not resumable (harnessmux tells it apart, or lotar checks the error at that step); other `Protocol` errors fail the job and leave the session as it was
  - [ ] A test with the fake ACP agent refusing `initialize` on resume: the job fails and the session keeps its name
