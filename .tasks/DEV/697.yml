description: |-
  Job-log pruning (DEV-693) removes a job's log when its ticket ID resolves to more than one tasks root, though the ticket exists and may be open. Found in the DEV-693 review, 2026-11-17.

  ## Cause

  `ticket_keeps_its_jobs` in `crates/lotar-agent/src/services/agent_job_service.rs` falls back to `Storage::resolve_task_location(..).is_ok_and(..)` when `ticket_done_state` returns `None`. `resolve_task_location` returns `TaskLookupError::Ambiguous` when several roots hold the ID (nested workspaces with the same prefix, see `dev21_ticket_done_state_tests`), and that counts as "no longer exists", so the log goes. Everywhere else an ambiguous identity is indeterminate and skips cleanup.

  ## Fix

  Remove only on `TaskLookupError::NotFound` (and `Invalid`); keep the log on `Ambiguous`.

  ## Done when

  - [ ] A job whose ticket ID is ambiguous across roots keeps its log past `keep_days` and under the size guard.
  - [ ] Unchanged: a ticket ID no tasks root holds (`NotFound`) or a malformed one (`Invalid`) still lets its job's log go; archived tickets' logs still go.
  - [ ] `docs/help/agent.md` (job history) lists an ID held by several roots among the never-removed cases.
  - [ ] A test with two roots holding the same ID shows it.
