- date: 2026-11-16T00:08:55.974040+00:00
  author: claude
  text: |-
    Fixed: a T3 job for a ticket whose branch is gone moves a detached leftover worktree out of T3 Code's way first.

    - Cause: T3 Code always puts a new branch's worktree at the same path, `<repo>/<branch, / as ->-<sha256(git common dir + NUL + branch)[..16]>`. `sha256("/Users/mallox/Development/local/.git\0agent/LOCA-317")` gives `2aa6ebb394abb948`, the leftover's name.
    - The leftover was detached from `agent/LOCA-317` (DEV-573 take-over), then the branch was deleted, so every job asking for a new `agent/LOCA-317` hit `path_already_exists`.
    - Fix: `plan_t3_worktree` calls the new `move_aside_detached_t3_worktree`, which runs `git worktree move <path> <path>-detached-<n>` for a detached worktree of that ticket at T3's path, changes included, and logs a note. Docs: `docs/help/agent.md`.
    - LOCA-317 unblocked now: moved its leftover by hand to `~/.t3/worktrees/local/agent-LOCA-317-2aa6ebb394abb948-detached-1`. Nothing was deleted. Its staged changes are an older draft of `0a44163`, which is already on `main` in `local`.
  report:
