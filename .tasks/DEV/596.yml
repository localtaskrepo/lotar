- date: 2026-11-16T00:15:03.759893+00:00
  author: claude
  text: |-
    Review: passed. `3bd769d5` fixes the cause and LOCA-317 is unblocked; no findings.

    - Read: the diff (`agent_job_service.rs`, `docs/help/agent.md`), the ticket and fix comment, DEV-573/583/595, recent commits to both files on `main`.
    - T3 path rule checked against T3 Code's own code (`app.asar`, `createWorktree`): a stem of at most 23 bytes, `-`, then the first 16 hex chars of `sha256(<git common dir>\0<branch>)`. `move_aside_detached_t3_worktree` matches it, and it only moves a worktree that is detached from that same ticket branch.
    - Only the new-branch path changed. When the branch exists, T3 gets `base` only, as before. The note shows up in the job log (`agent_job_service.rs:2804`).
    - LOCA-317: the leftover is at `~/.t3/worktrees/local/agent-LOCA-317-2aa6ebb394abb948-detached-1`. Its reflog says it was detached from `agent/LOCA-317`. `agent/LOCA-317` is gone and `0a44163` is on `main` in `local`, so a new ticket branch made from main holds it.
    - Reran: `cargo nextest run -p lotar-lib dev596` passed, `cargo clippy -p lotar-lib --all-targets -D warnings` was clean, and `rustfmt --check` and `prettier --check` passed on the touched files. I didn't rerun full test, smoke or the LOCA-317 job check: the merge agent runs those.
    - No tickets filed.
