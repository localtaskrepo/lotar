- date: 2026-11-15T00:02:32.860469+00:00
  author: claude
  text: |-
    Rework: the flaky takeover test was a race in the test; fixed in `7ec040cc`.

    - Finding: `dev510_t3_session_test.rs:143` summary `Started.` after 32 s. `Started.` is printed only by the fake `thread start` after its 30 s sleep, so the resumed session started a *new* thread instead of following t1.
    - Cause: harnessmux's t3 agent reports the thread id, then calls `thread show` right away; the session owner saves the id to its record in another task. The test killed lotar as soon as `thread show` appeared in `calls`, sometimes before that save, so the resume had no thread.
    - Fix: the test now waits until the harnessmux session record names `agent_session: t1` (`thread_saved()`), the real precondition, before killing lotar. Product code unchanged.
    - Not reproduced locally before the fix (12 runs under CPU load). After it: 20/20 takeover runs under load pass.
    - Real-world note, not fixed here: a lotar killed in that same window (thread made, id not yet saved) still resumes without the thread and starts a new one. The window is the time of one registry write.
    - Commit `7ec040cc` (signed, amended) on `agent/DEV-510`; merges cleanly with current main `8e918799`.
    - Checks on `7ec040cc`:
      - `npm run lint:agent` pass
      - `npm test` pass: 2175 Rust, 1537 UI, release, hooks
      - `npm run smoke` pass: 401
      - `dev510` 3/3
    - Not run: a live T3 thread.
