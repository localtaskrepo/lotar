  text: |-
    Rework 5: the intermittent hang came from the tests, not the takeover. Fixed in harnessmux `05d4c64`.

    - **Cause:** after `kill -9` the test went on right away, but under load the killed owner still answered for a moment. In the hung runs it accepted `send n --wait …` and then died, so `--wait` followed a turn no one ran until the 40 s limit. In others the next command got an empty reply (`the session's owner answered ""`).
    - **Reproduced:** 16 parallel runs of the five T3 tests with every CPU busy: 5 failed (hangs at `send … Continue`, one EOF). Unloaded it never failed.
    - **Fix:** new `Home::kill_owner` in `tests/cli.rs`, used at all three kills: it kills the owner and waits until `kill -0` says the process is gone. No change to `src/`.
    - **After:** 48 loaded parallel runs, all 5 tests pass every time.
    - lotar's tests kill lotar with `Child::kill` + `wait()`, so they don't have this race. lotar is unchanged at `0e558150`.
    - Filed [DEV-578](https://lotar.pyxzl.net/task/DEV-578) (related): `harnessmux send --wait` waits forever when the owner dies after accepting the prompt. That's real, but it's outside this ticket.
