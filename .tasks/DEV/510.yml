    - harnessmux `06129ef` (`agent/DEV-510`, version 0.1.5, fast-forwards main `3c630d0`): an interrupted t3 session with no saved thread id looks in `t3 thread list --json` for the newest thread with the session's title made since the turn began (`last_used`), adopts it and follows its run. No title: nothing to match, as before.
    - Deterministic tests, both fail without the fix:
      - harnessmux `a_t3_session_whose_owner_died_before_it_saved_the_thread_finds_the_thread_by_its_title`: kill the owner, remove `agent_session` from the record, resume. Without the fix: 2nd `thread start`.
      - lotar `a_t3_job_taken_over_before_its_thread_id_was_saved_ends_with_that_thread`: same at job level. Without the fix: summary `Started.`, the review's exact failure.
    - lotar `52cb2190` (amended): test, `docs/help/agent.md`, `Cargo.toml` asks for harnessmux 0.1.5. `Cargo.lock` stays at 0.1.2 until 0.1.5 is published, so it doesn't build yet.
    - 0.1.5 also brings 0.1.3 (DEV-467) and 0.1.4 (DEV-509) into lotar; their lotar sides are still open. lotar's checks pass with them.
    - Checks:
      - harnessmux: fmt, clippy, nextest 39/39, deny pass
