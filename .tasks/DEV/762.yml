- date: 2026-11-21T21:01:06.498914+00:00
  author: claude
  text: |-
    Done: `agent.worktree.build_root` puts a new job worktree's build in `<build_root>/<repo>/<ticket>`, with `target` as a symlink to it.

    - Config: global and per project, `config set agent_worktree_build_root`; relative paths resolve like `dir`. Unset: nothing changes
    - Clone: `clonefile(2)` from the source's resolved build (the main checkout's or an earlier worktree's) into the build root; different volumes: cold build, one job-log line. Never a full copy
    - Cleanup: `remove_worktree_dir` (Done cleanup, `lotar agent worktree cleanup`) deletes the folder; `cleanup_paths: [target]` empties it; `agent worktree run` and `waiting_run` relink and empty it when a command deleted the link (plain `cargo clean`). The folder is found from the link, so it still goes after the setting changes
    - Needs `/target` in `.gitignore`: `target/` doesn't ignore a link. lotar has `/target`; autospec has `target/` and would keep its builds in the worktree until that changes
    - Docs: `docs/help/agent.md` (Worktrees), `docs/help/config-reference.md`; also removed a duplicated `job_history` pair there
    - Tests: `agent_safety_test` (link plus clone, relink after `rm target`, removal; `target/` fallback), `dev153_worktree_settings_test` (config set); the existing DEV-635 test checks that an unset build root makes no link
    - No guidance correction
