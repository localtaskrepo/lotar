- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A04777fdf-8ca7-4659-ae9f-1d47d7b34f57
description: 'Owner decision 2026-11-11 (~/Development/standards/docs/decisions/2026-11-11-repo-health.md): automation starts fixes as T3 Code threads with a choice of model; no review state, Done on job_completed. runner: t3 runs t3 thread start <dir> - --title ''<ID> <title>'' --provider P --model M --wait with the prompt on stdin. Thread link added to the ticket as a link reference as soon as the thread exists; exit 2 (waits for an answer) leaves the ticket for the owner, not success. Profile fields model, provider; lotar worktrees map to t3 --worktree/--branch. No default timeout. Verify home-config profile + repo automation rule starts the job and job_completed can set Done. Fake t3 in tests; one live smoke run.'
