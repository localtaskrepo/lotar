description: |-
  Found 2026-11-22: on all six lotar 0.15.6 servers (launch agents, started 11:28) /api/files/resolve and /api/files/content never answer, so file names in tickets aren't links. /api/tasks/get answers in 0.04 s. A fresh `lotar serve` on the same tasks dir, started from a terminal, serves /api/files/content in 15 ms.

  Cause: each server has a child `git -C <repo>/.tasks rev-parse --path-format=absolute --git-common-dir` running since 11:28, blocked in open() inside read_very_early_config. ~/.gitconfig is a symlink into Dropbox's File Provider folder (~/Library/CloudStorage/Dropbox), and macOS holds the open while it checks Files and Folders access for the process lotar started (sandboxd logs TCCAccessRequestIndirect for a FileProvider domain with lotar as the subject). Each brew upgrade changes lotar's path (Cellar/lotar/<version>), so the check comes back after every upgrade.

  The same hang stops automation runs: 'Inbox: the owner's answer goes to the source' times out after 300 s (INBOX-647, 648, 651, 652), and its repos.ts --inbox children stay blocked on the same git call.

  Expected: git calls from the server have a timeout and fail, so one hung git call gives an error (or no file links) instead of blocking the endpoint until a restart. The machine's git config is fixed separately (standards side).

  Check: with GIT_CONFIG_GLOBAL pointing at a FIFO nobody writes, /api/files/resolve answers within a few seconds.

  Second cause found while fixing (2026-11-23): the file viewer's listing (`RepoFileService`, `ignore` crate) reads `~/.gitconfig` inside lotar's own process to find `core.excludesFile`. That open blocks the request thread the same way, and no child timeout can stop it. `lotar`'s git children also drop `GIT_CONFIG*`, so the check points `HOME` at a folder whose `.gitconfig` is a FIFO.

  ## Done when

  - [ ] Every git child lotar starts through `utils::git::git_command` (server, CLI, agent jobs) is stopped with its children after a timeout and returns a `TimedOut` error; no call site waits on a git child without one.
  - [ ] Read-only git calls stop after 20 s (`GIT_TIMEOUT`); calls that can run long by design (commit with hooks, push, rebase, merge, add, worktree add) stop after a longer limit, not never.
  - [ ] No lotar process reads git's config files itself: the file viewer listing, reference file suggestions and the source scanner get the global excludes file from a timed `git config` call, not from the `ignore` crate.
  - [ ] Global excludes lookup times out (git hangs, 5 s): the file viewer lists no files (no file links, `/api/files/content` answers 404) rather than showing files git would ignore; suggestions and the scanner go on without the global excludes.
  - [ ] Global excludes lookup finds nothing set, git is missing or git errors: git's default (`$XDG_CONFIG_HOME/git/ignore`, else `~/.config/git/ignore`) applies, as before.
  - [ ] With `HOME` pointing at a folder whose `.gitconfig` is a FIFO nobody writes, `/api/files/resolve` and `/api/files/content` answer within a few seconds (automated test).
  - [ ] With a normal git config, file links and the file viewer work as before, globally ignored files stay hidden (tests).
