- date: 2026-11-23T07:19:55.779498+00:00
  author: claude
  text: |-
    Review: passed. `b3ca55304` does what "Done when" asks; no blocking or minor findings.

    - **Read:** the diff (8 files), the ticket and both comments, DEV-808, DEV-813/814 (duplicates, WontDo) and main's commits since the merge base. Main's DEV-784 adds a `git_command(...).status()` call that compiles against the new `GitCommand` (it times it too). `git merge-tree main HEAD` merges cleanly.
    - **Every git child has a limit:** `git_command` returns `GitCommand` (`crates/lotar-core/src/utils/git.rs:48`). Its only `output`/`status` go through `output_within`, which kills the process group and returns `TimedOut`. Only two places get the raw command back: `BlobBatch` (`audit_service.rs:27`, every read limited by `GIT_TIMEOUT`) and the merge job's push (`merge.rs:359`, `run_process` with `GIT_LONG_TIMEOUT`). The only other `Command::new("git")` calls are in tests (`t3_claude_settings.rs`).
    - **No in-process global config read:** `git_global(true)` is gone from all three walks (`scanner.rs`, `repo_file_service.rs`, `reference_service.rs`). `ignore` 0.4.34 opened `$HOME/.gitconfig` itself (`gitignore.rs:636`), which blocks on a FIFO, so `hung_git_config_gives_no_file_links_within_seconds` would hang on main.
    - **Excludes still apply the same way:** `add_ignore` gets the same cwd root and precedence slot as the old global matcher. A timeout empties only the file viewer (`repo_file_service.rs:69`); missing git, a git error or nothing set falls back to `$XDG_CONFIG_HOME/git/ignore` or `~/.config/git/ignore`.
    - **Out of scope, not a finding:** lotar still parses the repo's own `.git/config` (`read_remotes`, `GitConfigDetector`). That file is not the one that hung.
    - **Reran:** `npm ci` (ok). `cargo nextest run -p lotar-core -p lotar-lib -p lotar-tasks -p lotar-agent -E 'test(/timeout_tests/) | test(/dev549/) | test(/repo_file/) | test(/reference/) | test(/scanner/) | test(/merge/)'`: 209 passed in 280 s. `npm run lint:agent` passed. Worktree left clean.
    - **Not rerun:** full `npm test` and `npm run smoke`, too long for this review. The fix agent reports both passed.
    - **No UI changes**, so no ui-review was needed. No tickets filed.
