- date: 2026-11-23T02:41:05.797687+00:00
  author: claude
  text: |-
    From DEV-808 (the inbox relay timeouts are this hang):
    - `clear_repository_env` (`crates/lotar-core/src/utils/git.rs`) strips every `GIT_CONFIG*` key from lotar's git children, so the check's `GIT_CONFIG_GLOBAL` FIFO doesn't reach them. Point `HOME` at a folder whose `.gitconfig` is a FIFO instead.
    - The CLI hangs too, not only the server: `repos.ts --inbox` runs about 5 lotar calls. With `GIT_TIMEOUT` at 20 s each, a hung git can still cost well over a minute per relay. DEV-808 waits on this ticket for its "nested comment returns within seconds" check.
- date: 2026-11-23T03:39:02.537589+00:00
  author: claude
  text: |-
    Fixed: a hung git config gives no file links within ~5 s instead of blocking the file viewer.

    - **Two causes.** Git children had no timeout. Also, the file viewer's walk (`ignore` crate) opened `~/.gitconfig` inside lotar's own process to find `core.excludesFile`, so a child timeout alone would not have unblocked `/api/files/*`.
    - `git_command` now returns `GitCommand` (`crates/lotar-core/src/utils/git.rs`). It has no `output`/`status` without a limit: 20 s (`GIT_TIMEOUT`), or 10 min (`GIT_LONG_TIMEOUT`) for `commit`, `push`, `rebase`, `merge`, `add`, `worktree` and other slow subcommands. All ~60 call sites are covered, and the compiler enforces it.
    - The merge job's `git push` goes through its own cancellable runner, which now also stops after 10 min.
    - `apply_global_excludes` asks `git config --path --get core.excludesFile` with a 5 s limit. The file viewer, reference suggestions and scanner use it.
    - If git doesn't answer in time, the viewer lists no files (no links, 404) rather than show globally ignored files. Suggestions and the scanner carry on without global excludes.
    - Tests: a git child hung on a FIFO `.gitconfig` is stopped at its timeout. `/api/files/resolve` and `/api/files/content` answer in ~5 s with `HOME/.gitconfig` as a FIFO. Globally ignored files stay hidden.
    - Limit: if the excludes file itself sat in Dropbox, lotar still reads it in-process. That is not today's setup.
    - For DEV-808: CLI git calls now stop at 20 s. A relay of ~5 lotar calls can still take ~100 s when git hangs.
