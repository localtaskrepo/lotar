    - Both regression tests passed (2172 skipped), with `RUSTC_WRAPPER=` after sccache sandbox denial. Runner exited 1 for leftover macOS `xcrun_db`; assertions passed.
    - `git diff --check` passed; tree clean. Full lint/UI/smoke not rerun (implementation reports passes). No minor tickets, edits or commits. Status and assignee unchanged.
