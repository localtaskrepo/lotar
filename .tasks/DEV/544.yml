description: |-
  **Found** (Claude, 2026-11-14, QIS-196 in quarter-inch-studio): review job `job-20261114T180925.237Z-5` logged `agent_job_completed` at 18:11:14. At 23:13:20 a new lotar process (pid 63439) took it over from pid 79011, repeated the review message, then logged `agent_job_failed`: "Merge job finished, but t3/review-qis-196-owner-question is not merged into the main checkout's current branch". That branch is the review thread's, not `agent/QIS-196`. The failure rule then moved QIS-196 to the fix agent (status Merging, assignee @fix).

  **Check:** `lotar --tasks-dir ~/Development/quarter-inch-studio/.tasks agent logs job-20261114T180925.237Z-5`

  **Cause** (Claude): the review's end rules had moved QIS-196 to Merging at 18:11:14, but pid 79011 kept the job's running-job record until it exited. The takeover then (1) ran the job again although its log already had its final status, (2) treated it as a merge job because the ticket was now Merging, and (3) in 0.15.0 read the branch from the T3 thread's current state. Point 3 is fixed on main already: the takeover reads the branch from the job log header (`agent/QIS-196`).

  ## Done when

  - [ ] A job whose log already has its final status (completed, failed, cancelled) is not taken over: the takeover only drops its leftover running-job record. It does not resume the session, add events, apply end rules or touch the ticket.
  - [ ] A job whose log has no final status yet is still taken over as before (DEV-378, DEV-478).
  - [ ] A takeover runs the job as the kind it started as: a review job stays a review job, also when the ticket is Merging by then. Only a job that started as a merge job (ticket Merging or profile `merge` at start) gets the merge check.
  - [ ] A record written by an older build has no kind: it counts as a merge job only when its profile is `merge`, never because of the ticket's current status.
  - [ ] The merge check of a taken-over merge job uses the branch from the job log header (`agent/<id>`), not a thread's branch.
  - [ ] If the job log can't be read (logging off, file missing), the takeover runs as before.
  - [ ] Tests cover the ended job and the review job on a Merging ticket.

  Related: DEV-478.
