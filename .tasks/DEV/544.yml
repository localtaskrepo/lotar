- date: 2026-11-14T23:37:35.244615+00:00
  author: claude
  text: |-
    Fixed: a takeover skips jobs that already ended, and a review job stays a review job. Commit `60f27c96`.

    - Cause: QIS-196's review ended at 18:11:14 and its end rules set Merging, but pid 79011 kept the job's running-job record until it exited. The takeover then ran the job again and called it a merge job because of the ticket's *current* status.
    - The `t3/review-…` branch came from 0.15.0, which read the branch from the T3 thread's current state. Main already uses the job log header (`agent/<id>`), so that part needed no change.
    - `adopt_orphaned_job`: if the job log has its final status, only the leftover record is dropped. No resume, no events, no rules.
    - `ActiveJob.merge` records the job's kind when it starts, and the takeover uses it (`takes_over_as_merge_job`). A record from an older build counts as a merge job only when its profile is `merge`.
    - Docs: `docs/help/agent.md` (Jobs whose process died).
    - Tests: `a_job_whose_log_ended_is_not_taken_over` and `a_taken_over_job_keeps_the_kind_it_started_as`. Both fail without the fix and pass with it.
    - Checks: `npm run lint:agent` clean, `npm run test:agent` (2174 Rust, 1537 UI) passed, `npm run test:smoke:agent` (401) passed.
    - Not checked: why pid 79011 kept running for 5 hours after the job ended.
- date: 2026-11-14T23:56:33.815002+00:00
