description: |-
  ## Found
  The DEV-332 job (job-20261112T003829.413Z-1, runner t3) completed at 00:54:29 with the summary "Waiting for the smoke suite to finish." That was the agent's message when it paused its turn to wait for a background smoke run, after calling T3's t3_background_wait to keep the thread Working. `t3 thread start --wait` returned exit 0 at that turn end, so job_completed fired (the @fix lifecycle set the ticket Done) while the agent was still working. The rest of the thread's work, smoke results and the ticket comment, came after the job had ended.

  ## Check
  Start a t3 job whose agent runs a long background command, waits on it with t3_background_wait and ends its turn. Look at `lotar agent logs <job>`: today it completes at that turn end.

  ## Done
  - [ ] Find out whether lotar's runner or T3 Code's `--wait` causes it (src/services/agent_runner.rs build_t3_command, t3_reply; src/services/agent_job_service.rs)
  - [ ] A t3 job ends when the thread is idle, not while it waits on background work, with a test; or, if the cause is in T3 Code, the bug goes to T3 Code and docs/help/agent.md says what to expect
