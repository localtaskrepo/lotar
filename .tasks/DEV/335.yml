- date: 2026-11-12T01:25:26.498781+00:00
  text: |-
    claude: Cause is T3 Code, not lotar. lotar runs 't3 thread start . - … --wait' and takes its exit. In T3 Code 0.1.9 the CLI's --wait (apps/server/dist/binCli-*.mjs, waitForRun) calls the server's t3_thread_wait with the run id only. The server can also wait for awaited background work: t3_thread_wait takes untilDelegatedWorkSettled ('Also wait for its delegated and background tasks and their completions to settle') and then returns resultRun, the run with the final answer. The CLI never passes it, so --wait returns when the turn ends while t3_background_wait still keeps the thread Working. 't3 thread show --json' doesn't show pending background work either, so lotar can't wait for it from outside.

    Done in lotar (uncommitted): the t3 job prompt (src/services/agent_job_service.rs t3_thread_notes) now tells the agent the job ends with its turn, to run checks in the foreground and finish before its final message; tests/dev318_t3_runner_test.rs checks the line; docs/help/agent.md (T3 Code threads) says what to expect. Checks: npm run lint, npm test and npm run smoke pass (npm test only with LOTAR_DEFAULT_REPORTER unset: filed DEV-336).

    Draft for T3 Code: 't3 thread start --wait returns at turn end while t3_background_wait keeps the thread Working. Expected: --wait (and t3 thread show) wait for awaited background work and its wake runs, as t3_thread_wait does with untilDelegatedWorkSettled, and print the resultRun reply. Seen in 0.1.9: the reply was the agent's ''Waiting for the smoke suite to finish.'' and exit 0; the work went on in a later run.'
- date: 2026-11-12T01:25:26.579828+00:00
  text: 'claude: Question for mallox: should I send the draft above to T3 Code (a GitHub issue, or where do you report T3 Code bugs)? Once it is reported, this ticket can be Done; the prompt line stays until T3 Code''s --wait waits for background work.'
- date: 2026-11-12T01:27:37.739464+00:00
  text: Check first if this issue hasn't already been reported. If not, then yes, you can create a draft and send me the link to it for review.
- date: 2026-11-12T01:31:46.171173+00:00
  text: 'claude: Searched pingdotgg/t3code: no issue covers the CLI''s --wait. Related: #24297, #28114, #32563 (delegate_task finishes before the child''s background-wake run) and #34668, fixed by #34674 (merged 2026-11-12 01:26 UTC), which makes t3_thread_list report these threads as ''waiting''. Draft for review (not filed): https://claude.ai/artifact/QDCfFkBf7NF4KEDviGNLsd. Waiting for mallox to approve or edit it; then it gets filed and this ticket can be Done.'
- date: 2026-11-12T01:55:16.712782+00:00
  text: 'claude: Filed by mallox as https://github.com/pingdotgg/t3code/issues/34688 (2026-11-12). lotar side: t3 job prompt line, test and docs/help/agent.md, uncommitted. Drop the prompt line once a T3 Code release has --wait waiting for background work.'
- date: 2026-11-12T04:06:04.573039+00:00
  text: 'claude: T3 Code closed #34688 as completed: the fix is [PR #34696](https://github.com/pingdotgg/t3code/pull/34696), merged 2026-11-12 03:56 UTC (`671f8541`). It is in the CLI only: `--wait` now waits up to 10 s for the run that the background work wakes. The server-side gap stays open, so a slow wake run can still return early. No release has it yet (latest stable v0.1.9; newest preview predates the merge). Removing the prompt line, its test and the doc note: DEV-353, Blocked until a release has the fix.'
