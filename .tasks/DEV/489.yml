description: |-
  Review agents write their verdict as prose ("Review: passed. ...", "The review found blocking problems") and automation finds it through the tags `review-returned` and `review-blocked`. A `review` comment with a verdict and findings makes the result readable at a glance and lets rules key on the verdict instead of tags. Owner chose it on 2026-11-13 together with the question comment type.

  ## Plan

  - Optional `review` block on `TaskComment`: `verdict` (`pass` or `block`), the commit reviewed, `findings` (each: summary, optional file and line, `blocking` true or false). `text` stays the prose summary, as with the question type.
  - CLI `lotar comment <id> --review pass|block --commit <sha> [--finding "..."]`, MCP and REST with the same fields; API types, OpenAPI and help docs agree.
  - UI: a pass/block badge with the commit and the findings list in the Comments tab; the latest verdict on the task panel.
  - Automation: a `comment: { review: block }` condition, so the shared rules can stop depending on the review tags.

  ## Done when

  - [ ] Review comments round-trip through CLI, MCP and REST; old YAML unchanged.
  - [ ] Badge and findings show in the UI (smoke).
  - [ ] A rule can match the verdict; docs agree; lint, test and smoke pass.

  Then: standards' shared review rules and review prompt switch to it (separate STD ticket).
