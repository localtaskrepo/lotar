- date: 2026-11-14T01:20:08.352317+00:00
  author: claude
  text: 'Done in f23b2d15 on agent/DEV-489 (rebased onto main with DEV-488). Comments get an optional review block: verdict pass|block, commit, findings (summary, file, line, blocking); text keeps the verdict, summary and findings in prose. CLI: lotar comment <id> --review pass|block [--commit SHA] [--finding F]... [--blocker F]... [summary], F = "[file[:line]: ]summary"; a pass with a blocker is refused. MCP task_comment_add and REST POST /api/tasks/comment take review {verdict, commit?, findings?}. Automation: comment: { review: block } plus ${{comment.review}} and ${{comment.commit}}. UI: verdict badge with short commit and findings list (blocking first) in the Comments tab, a Review type chip, and the newest verdict next to the status in the panel header. lotar show and lotar comment mark [review: pass|block]. Docs: comment.md (Reviews), automation.md, mcp-tools.md, task-model.md, serve.md, lotar-workflow skill, openapi.json, view/api/types.ts. Checks: npm run lint:agent, npm run test:agent (2175 Rust, 1527 UI, release and hook tests), npm run smoke (111 files, 395 tests incl. new ui.review-comments), all passed; screenshots checked in light and dark. Old YAML round-trips unchanged (tested). Follow-up from the ticket: an STD ticket switches the shared review rules and prompt from the review-blocked tag to this.'
