- date: 2026-11-25T14:24:13.727451+00:00
  author: claude
  text: |-
    Product development (2026-11-25): outside evidence. This is for the owner and is not a change to this ticket's scope.

    - OpenClaw (https://github.com/openclaw/openclaw, MIT, 395k stars, pushed 2026-11-25) reads Claude's usage windows without running a turn. extensions/anthropic/claude-usage.ts calls `GET https://api.anthropic.com/api/oauth/usage` with the Claude OAuth token (`Authorization: Bearer`, `anthropic-beta: oauth-2025-04-20`). The response has `five_hour`, `seven_day` and `seven_day_sonnet`/`seven_day_opus`, each with `utilization` and `resets_at`, plus `extra_usage`. Its v2026.11.10 changelog fixes "string-encoded numeric quotas in Claude ... usage windows" and "honors earlier authenticated quota resets". I read the code, not just the docs.
    - What it would add here: this ticket records a reading only when a job's agent reports one, so there is none while every queue is held (STD-346) or overnight. A poll would give the reset time at any moment. That is the owner's question of 2026-11-24 ("you can't use the claude cli or api or anything from anthropic to get the info?").
    - Caveats: the endpoint is undocumented and may change. It needs Claude Code's OAuth token from the login Keychain. Whether an agent or lotar may read that token is the owner's call (credentials rules, opgate). Without his OK, keep the readings from jobs as planned.
- date: 2026-11-26T00:55:00.991139+00:00
  author: claude
  text: |-
    `lotar usage` shows each provider's newest usage window and reset time from agent jobs.

    - Readings: claude-agent-acp's `_claude/rateLimit` on every turn (`five_hour`, `seven_day`: status, used %, `resets_at`), plus a `rejected` reading when a job pauses on a usage limit.
    - Codex and T3 Code jobs report no windows (harnessmux 0.3.0 passes none on), so their only reading is the pause. Real logs in `~/.local/state/harnessmux/sessions` hold Claude readings only.
    - File: `usage.json` next to the agent queue (`~/Library/Caches/lotar/usage.json`), shared by every repo's server. Writes are locked and atomic. One reading per provider, account and window; the newest wins. A failed write only warns.
    - Account: the profile's `CLAUDE_CONFIG_DIR` / `CODEX_HOME`, else `null`.
    - `lotar usage` and `--format json` (`{"file", "readings"}`) need no tasks dir. With no file it exits 0; a broken file is exit 1 and names the file.
    - Code in `crates/lotar-agent/src/services/provider_usage.rs`, `crates/lotar-lib/src/cli/handlers/usage.rs`; docs in `docs/help/usage.md`.
    - There is no reading while no job runs. The OAuth usage poll (comment of 2026-11-25) stays the owner's call.
    - No guidance correction; no durable finding.
