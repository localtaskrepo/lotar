  text: |-
    Review: passed. `701c218b5` does what "Done when" asks; nothing blocking, no tickets filed.

    - Read: the ticket and its comments, DEV-584, the diff, `docs/help/agent.md`, and main's commits since the base `46fb767aa` (DEV-832, DEV-853, DEV-777 touch `agent_job_service.rs`). `git merge-tree` shows the branch merges onto main `5d3223431` without conflicts.
    - Pause path: `usage_limit_pause` now always calls `resolve_profile`. The request's `provider` still wins there (`agent_job_service.rs:1163`), so the provider named in the pause comment stays the same. If the profile no longer resolves, it falls back to the runner.
    - It records for every runner: `usage_limit_pause` runs on every failed job end (`agent_job_service.rs:5606`). A reset more than 7 days away is saved as `null`, which the docs say.
    - Reran: `npm ci` ok. `cargo nextest run -p lotar-agent -E 'test(provider_usage) | test(a_usage_window…) | test(usage_limit)'`: 20 passed. `-E 'test(/^dev584_usage_limit_pause_test::/)'`: 6 passed. `cargo clippy --workspace --all-targets -D warnings`: clean. `rustfmt --check` and `prettier --check` on the changed files: clean.
    - By hand in a scratch dir with no `.tasks`: `lotar usage` with no file prints an info line, exit 0. JSON gives `{"file", "readings": []}`. A written reading shows as a table. A malformed file is exit 1 naming the file, and so is an unreadable one (`Permission denied`). It creates no tasks dir. `lotar help usage` shows the new page.
    - No UI change, so no screenshots needed. No stray files. It decides nothing that is the owner's to decide: the OAuth poll is left to him.
    - Not run: full `npm test`, `npm run lint`, `npm run smoke` (the merge runs them).
