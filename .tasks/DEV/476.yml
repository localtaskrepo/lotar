description: |-
  Found (DEV-473, 2026-11-13): when a later job starts a new T3 Code thread on the ticket branch, release_branch (src/services/agent_job_service.rs:1442) detaches the earlier thread's worktree. Every job worktree here ends up detached minutes after its job (reflog 'checkout: moving from agent/DEV-464 to HEAD'). At Done, cleanup_done_ticket_worktree (:2299) only looks for a worktree with agent/<ticket> checked out, finds none and returns, so neither the detached worktrees nor agent/<ticket> are removed, although cleanup_on_done and cleanup_delete_branches are on. lotar agent worktree list/cleanup don't see detached worktrees or T3 Code's own t3/* branches either. Result: DEV-464, 469, 470 and 471 are Done and on main, but 7 clean worktrees and 9 branches stay, and the repo-health check reports them as unpushed:branches (DEV-473).

  Check: after a ticket with a fix job and a review job on another model reaches Done, git worktree list and git branch show nothing left for it whose work is on main.

  Done when: the cleanup at Done (and lotar agent worktree cleanup) also removes the ticket's clean detached worktrees and its thread branches (t3/*) whose work is on main, keeps any with work missing from main, with a test for both.
