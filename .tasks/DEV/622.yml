  text: |-
    Review: passed. The fix does what "Done" asks; it is already on main as `b0d4d84e`

    - Reviewed `b0d4d84e` (on main, merged before this review because the first review job failed). Its `web_server.rs` is identical to the branch's `cbfba630`
    - `read_retrying` retries `Interrupted`; header and body reads `return` on any other error, so the connection closes and nothing is dispatched. Both "Done" points are met, nothing beyond the ticket
    - Test `body_read_retries_interrupted_and_fails_on_other_errors` covers `Interrupted` mid-body and a `WouldBlock` timeout. The old `unwrap_or_default` read would have cut the body to `{"a":`, so the test fails before the fix
