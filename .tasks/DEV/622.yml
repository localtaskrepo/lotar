- date: 2026-11-16T23:29:00.286128+00:00
  author: claude
  text: |-
    Fixed: a failed socket read no longer counts as end of request.

    - `crates/lotar-lib/src/web_server.rs`: new `read_retrying` retries `Interrupted`; header and body reads in `handle_connection` return (close the connection, no dispatch) on any other error, such as a timeout
    - body loop moved into `read_body(reader, body, content_length, limit)` so a unit test can drive it
    - test `body_read_retries_interrupted_and_fails_on_other_errors`: a scripted reader with `Interrupted` mid-body gives the full body; `WouldBlock` gives an error. With the old `unwrap_or_default` read it fails with the cut body `{"a":`
    - commit `cbfba630`
  report:
    commits:
    - hash: cbfba630
      what: retry Interrupted socket reads; other read errors close the connection without dispatching
    checks:
