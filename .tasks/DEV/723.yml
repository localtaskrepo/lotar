description: |-
  ## Found

  Review of DEV-722 (`29cc68a92`): a removal cut off after its rename leaves `.<name>.lotar-removed` beside the gone worktree. `prune_missing_worktree` in `crates/lotar-agent/src/services/agent_job_service.rs` deletes only git's entry; the trash (a full worktree copy, build output included) stays until a later `remove_worktree_dir` runs in the same parent folder, which may never happen for the last worktree there.

  ## Check

  After cleanup prunes an entry, `ls -a` of the worktree's parent shows no `.<name>.lotar-removed` for it.

  ## Done when

  Pruning a missing worktree also deletes its `.<name>.lotar-removed` trash beside the gone path; a test covers it.
