  text: 'Context from DEV-60 final smoke verification (comment only; no status/scope change): the user-authorized narrow fix in smoke/helpers/server.ts (getPort({ host }) host-matching probe instead of 127.0.0.1-only) landed with 3 new harness tests and eliminated bind/port-collision errors (final full smoke: zero bind errors, exit 0). Remaining hardening that fits this ticket scope: (1) the host probe still has a close->bind TOCTOU window (port can be taken between probe and bind); (2) the readiness banner is emitted before the actual bind, so a failed bind can follow a "ready" line; (3) orphaned server processes from earlier failed runs were NOT all verified - approximately 103 smoke-workspace listeners were verified; the earlier all-153-orphan claim was not substantiated, a cleanup attempt was denied, and no existing servers were stopped. Suggested shape already in scope here: owned listener/actual port (bind first, then advertise), bounded readiness, lifecycle-owner teardown joining children.'
description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: T3 T8.

  Fixtures release selected ports before binding, accept readiness timeout/EOF, lose split markers and leak server children/threads on failure. Use owned listener/actual port where supported, bounded health/readiness checks and cleanup-safe lifecycle owners. Acceptance: occupied port, split marker, early EOF, timeout and startup failure deterministically fail and leave no child/thread; teardown joins. Scope: web_api_integration_test fixture and smoke/helpers/server.ts.

  Related umbrella: DEV-53.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
