  text: 'Fixed by DEV-236: the unused selection field is replaced by query (web search syntax, shared task query) on /api/sprints/add and /api/sprints/remove, and MCP sprint_add/remove take query too.'
description: 'SprintAssignmentRequest (src/api_types.rs, view/api/types.ts) accepts selection: TaskSelection {filter, where}, but /api/sprints/add and /api/sprints/remove (src/routes/sprints.rs) only read body.tasks, so a client sending a selection silently selects nothing extra. Decide: implement it with the shared task query (e.g. a query string in the web search syntax, like CLI --select) or remove the field from the REST contract (api_types.rs, types.ts, openapi.json, help docs). Found while doing DEV-232.'
