description: 'Found 2026-11-13 on DEV-400 with lotar 0.14.1: job job-20261113T000634.087Z-2 (t3 runner, Claude) logged agent_job_failed at 00:19:11, with no message, while its T3 thread (mcp:3a430fd3-78b4-4fdb-b726-de027a7cccef) was still running and working (T3 status running, no completedAt). The failure fired ''Fix failed: retry on @fix-codex'', which started a second agent on branch agent/DEV-400 while the first was still on it; the Codex agent noticed, held off and asked who owns the work. Two faults: (1) the job ended as failed while the thread ran (compare DEV-378, DEV-353: T3''s --wait and background work), and (2) the failure event has no reason, so neither the log nor the retry says why. Check: lotar agent logs job-20261113T000634.087Z-2 has agent_job_failed with no message while t3 thread mcp:3a430fd3-... was running at that time. Done: a t3 job whose thread still runs is not reported as failed (it waits, or ends with a status that starts no retry), every agent_job_failed carries its reason, with tests.'
