comments:
- date: 2026-11-13T01:06:27.963575+00:00
  author: claude
  text: |-
    claude: Fixed in 45767b3 on agent/DEV-401 (signed, not merged).

    Cause: the job log has exit_code 130. Something sent SIGINT to the `t3 thread start --wait` process, and t3 exited while its thread kept running. lotar treated any non-zero exit as the end of the run, so the job failed. finalize_job only gave agent_job_failed a message for commit or merge failures, so a plain exit failure had none.

    Change (src/services/agent_job_service.rs):
    - When t3 exits with anything other than 0 or 2 and `t3 thread show` reports the thread still running, the job logs 't3 exited (exited with code N) before its thread's run ended.', waits for the run, and then ends from the thread's state: completed, waits for an answer, or failed with the status named. This reuses DEV-378's orphan wait, now pulled out as wait_for_t3_run and t3_run_exit_code. A thread that has already ended keeps t3's exit code, as before.
    - Every agent_job_failed now carries a reason: LoTaR's commit or merge note, else 'The <runner> runner reported a failure.' or 'The <runner> runner exited with code N.' or '... was ended by a signal.' The agent's own last message stays the summary. The reason becomes the summary only when there is no message.
    - docs/help/agent.md (T3 Code threads) describes both.

    Checks:
    - New test a_t3_that_exits_while_its_thread_runs_waits_for_the_run: fake t3 exits 130 while the thread runs, the job stays running, then completes with the thread's reply and runs the job_completed rule (Done). a_failed_run_fails_the_job_with_t3s_error now also asserts the failure event's reason.
    - npm run lint (lint:agent): clean. npm test (test:agent): 2109 Rust and 1505 UI tests pass, plus the release and hook tests. npm run smoke: 385 of 385 pass.
    - I didn't rerun the ticket check against a real T3 thread. The historic log of job-20261113T000634.087Z-2 doesn't change.
