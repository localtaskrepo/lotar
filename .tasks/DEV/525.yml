comments:
- date: 2026-11-14T07:14:23.462133+00:00
  author: claude
  text: 'Fixed in 99535969 on agent/DEV-525. Cause: the comment''s job was not lost. The server created job-20261114T061406.149Z-6 at 06:14:06 and kept it in its in-memory queue behind agent.worktree.max_parallel_jobs (2 in DEV). That job has no log until it starts (its header says 06:32:11, when it ran) and lotar agent queue doesn''t list it (it lists only the queue file of lotar processes outside the server). DEV-508 and DEV-466 came through the CLI''s file queue, which is why they showed up there. The branch having landed was not the cause. Fix: tell_agent now comments on the ticket when the agent doesn''t get the message now: ''Automation rule <name> told no agent on <ID> yet. Agent job <id> is queued: it waits for a free slot: N jobs run, agent.worktree.max_parallel_jobs is M.'' The same comment covers waiting for the other merge job, another job on the ticket still waiting to start, prerequisites, max_iterations, and a start error (the rule still fails as before). New AgentJobService::waiting_reason; docs/help/automation.md (Telling the ticket''s agent) explains it. Test: agent_automation_integration_test::tell_agent_says_on_the_ticket_when_its_job_waits_for_a_slot, which failed before the fix and passes now. Checks: npm run lint clean; npm run test:agent (the npm test suites) 2151 Rust, 1537 UI, 50 release and 7 hooks tests passed; npm run smoke 401/401 passed. Not covered: a plain assignment to an agent that has to wait (not through tell_agent) still says nothing on the ticket.'
- date: 2026-11-14T07:42:21.412282+00:00
