description: 'Found by claude while merging DEV-390, 2026-11-12. Since DEV-391, extract_value_strings (src/utils/custom_fields.rs) reads a list item by item, so the server''s text sort of a custom field (SortSpec::Custom in src/services/task_query.rs) compares a list by its first item, and an empty list as missing. The browser''s copy, cmpCustomField/customFieldValue in view/utils/taskSort.ts, still compares a list as the text [array]. Fix: customFieldValue mirrors custom_value_items (first item; empty list is missing), starting with a failing test in view/__tests__/taskSort.spec.ts. Version fields are not affected (DEV-390 sorts them by lowest version). Done when: sorting a non-version list field gives the same order on the Sprints page as on the Tasks page.'
