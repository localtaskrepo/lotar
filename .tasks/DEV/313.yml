comments:
- date: 2026-11-10T22:04:01.503541+00:00
  text: 'Step 1 (Rust): unwrap_used in [lints.clippy]; clippy.toml = standard (allow unwrap/expect/dbg in tests) + large-error-threshold 200 (the other 7 old settings were defaults or tuned lints that are off). The 27 src unwraps are fixed by restructuring (if-let guards, let-else, a checked active_task/edited_task helper in relationships.rs, ? with the existing ''Invalid relationship task'' error), expect only where impossible (JSON of strings, constant fallback regexes, non-empty line rest). Integration test crate roots (tests/integration.rs, tests/performance_test.rs) allow unwrap in helpers: 644 findings, one line each since DEV-302 made tests one binary. Pre-push clippy uses --message-format=short. Toolchain pin 1.98.1 kept (same 27 findings on 1.99). Gates: lint:agent, test:agent (1972 Rust, 1431 UI, release, hooks), test:smoke:agent 372, cargo deny pass; one agent_automation git_required test failed once under load and passed 3/3 alone and in the full rerun.'
- date: 2026-11-10T22:40:17.172412+00:00
  text: 'Step 2 (TypeScript, part 1, oxlint not yet in the lint scripts): smoke/tsconfig.json moduleResolution bundler (node10 is invalid for tsgolint, so smoke was never type-linted) plus noUncheckedIndexedAccess; smoke is tsc-clean (64 errors fixed). Findings fixed so far: 1,191 -> 241 (oxlint --fix for the mechanical part, then by hand). Found: smoke WorkspaceOptions silently ignored env (9 calls, removed); describe.concurrent.skipIf drops concurrent in vitest (skipIf returns the root suite), so 5 smoke blocks always ran sequentially (now describe.skipIf); ui.panel-persistence job.finally() re-raised the rejection unhandled. Tool limits worked around: tsgolint has no SFC support (no type-aware rules in .vue; types exported from .vue files are error types, so BarRow/StatDelta moved to insightsTypes.ts; the *.vue shim now uses unknown bindings so wrapper.vm as any is not reported as a no-op); narrowing across await makes no-unnecessary-condition call real guards dead (state.pending, entry.dirty, alive): now read through a function. New helpers: utils/errors.ts errorMessage, utils/text.ts displayText (no [object Object]) and removeKey (reactive dictionaries). Gates: lint:agent, test:agent, smoke 371/372 then the failing file and the other 4 changed smoke files 22/22 after the concurrent fix.'
- date: 2026-11-11T02:02:47.769075+00:00
  text: 'Outcome: oxlint is in lint:js, lint:agent, both hooks and CI (lint:js); ESLint checks only .vue templates (eslint-plugin-vue, typescript-eslint kept as the script parser, so DEV-123 still applies); eslint-suppressions.json, @eslint/js and globals removed; lint:frontend also type-checks smoke/. oxlint: 0 findings (from 1,196 incl. smoke); no-non-null-assertion off in .oxlintrc.json pending the owner''s decision, hiding 125 `!` outside tests. Repo additions in .oxlintrc.json: vue plugin, ignores, smoke harness = test override plus expect-expect assertFunctionNames (expectProtocolError etc., Playwright waits), CommonJS npm launcher may require (DEV-250). One reasoned disable: vue-router 5 deprecates scrollBehavior for the experimental useScrollRestoration (view/main.ts). Bug found and fixed test-first: applyBranding reloaded the repository skin stylesheet on every first load (state.loaded was set before the check; useBranding.spec.ts). Test fixtures made server-shaped (missing tags/status/off on mocks); jsdom gets a scrollIntoView no-op. Evidence: lint:agent, test:agent (1972 Rust, 1433 UI, release 47, hooks 6), test:smoke:agent 372, clippy -D warnings, cargo deny pass. Remaining: owner decision on `!` (then flip the line in .oxlintrc.json and fix the 125, or drop it once the standard allows them); not pushed (lotar is push:false). Guidance: AGENTS.md lint paragraph, frontend instructions, testing-strategy skill, testing.md, SETUP.md updated.'
description: |-
  Owner's lint standard (standards docs/decisions/2026-11-10-lint-standard.md, configs/typescript and configs/rust READMEs).
  Scope: oxlintrc.standard.json copied unchanged, .oxlintrc.json extends it (ignores, vue plugin, smoke harness override, no-non-null-assertion off pending the owner's decision); oxlint + oxlint-tsgolint; ESLint reduced to eslint-plugin-vue template rules; eslint-suppressions.json removed; every finding fixed (no legacy overrides). Rust: [lints.clippy] unwrap_used, clippy.toml = standard plus large-error-threshold 200, test crate roots allow unwrap in helpers, the 27 unwraps in src fixed. Hooks (opt-in, light): oxlint added, clippy short output; CI full output. Formatting (Prettier, rustfmt) and the toolchain pin unchanged; TypeScript stays on 6 (DEV-123).
  Acceptance: lint:agent, test:agent, test:smoke:agent, clippy --all-targets --all-features -D warnings, cargo deny check pass; docs (AGENTS.md, docs/developers/testing.md, .githooks/SETUP.md, skills) describe the new setup.
