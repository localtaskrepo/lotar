description: |-
  Merge jobs rebase their branch onto main and then run the gates in a worktree whose `node_modules` was installed before the rebase. When main changed `package-lock.json`, the gates fail on missing packages and the job stops to ask the owner whether it may run `npm ci`.

  ## Found

  2026-11-14: DEV-549 added `highlight.js`. The merge jobs of DEV-481 and DEV-551 then stopped at `lint:agent` with TS2307 for `highlight.js/lib/core` (see their last comments), and both asked mallox "May I refresh this worktree dependencies with npm ci…?". `npm ci` was all they needed.

  ## Fix

  - After the rebase, a merge job compares `package-lock.json` before and after (or always runs the repo's setup) and refreshes dependencies before the gates, without asking.
  - Where: the merge prompt lives in standards `configs/lotar/automation.yml` (rule "Review passed: merge", step 2); lotar's `.tasks/DEV/automation.yml` is a copy. The other repos' copies follow through the `drift` health check of `scripts/repos.ts`.

  ## Done when

  - [ ] Merge prompt step 2: after the rebase, when `git diff --name-only <HEAD before the rebase> HEAD` lists a lockfile (`package-lock.json`, `pnpm-lock.yaml`), the agent runs the repo's install from standards `repos.json` (`npm ci`) in its worktree before the checks, without asking
  - [ ] Lockfile unchanged (or the rebase changed nothing): no install, the checks run as before
  - [ ] The install fails: hand back as for a failed check (comment, HelpNeeded, mallox), nothing merged
  - [ ] lotar's `.tasks/DEV/automation.yml` holds the same text as the standards source
  - [ ] Covered by a test of the merge job flow: standards `scripts/automation.test.ts` checks that the merge rule's prompt carries the install step before the checks
