  text: 'Progress: SyncOptions (pub, From<&SyncRequest>) replaces the 9-arg push/pull/run; SyncTarget+SyncSinks replace perform_push/perform_pull''s 9 args; all 5 too_many_arguments expects removed. REST registers one handler for push+pull via SyncService::run. File split into sync_service/{mod,report,journal,client,jira,github,mapping,push,pull}.rs mechanically (items moved verbatim, pub(super)); clippy clean, sync tests 51/51. Next: coverage-guided tests for client/auth, jira/github helpers, run() error paths.'
