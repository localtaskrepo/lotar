description: |-
  The Windows CI job is the critical path in 71 of 88 green runs (DEV-493). Its longest step builds the whole lotar library as a unit-test binary (2m44 to 4m58) to run 40 tests that take 2 to 3 s. The owner, 2026-11-13: "Yes on all of those ideas. We really need to try and optimize the build and CI time. The faster tests can run, the cheaper it is to run them more often."

  ## Context

  - Step "Run storage safety, scan, and process regressions (nextest)" in `.github/workflows/ci.yml` runs `--lib --bin lotar-agent-wrapper` with the selectors `test(storage::safety::)`, `test(utils::scan::)`, `binary(lotar-agent-wrapper)`, `test(services::automation_service::windows_async_stdio_tests::)` and `test(services::automation_service::async_run_monitor_tests::)`.
  - Measured locally (DEV-493): building the library's unit-test target takes 43 to 76 s. The integration test binary (`tests/integration.rs`, 52.8k lines) links against the normal library and takes 11.5 s.
  - `tests/ci_windows_reporting_contract_test.rs` pins the selectors and the `--lib` flags. Update it along with the step.

  ## Plan

  - Move the Windows-selected tests out of the inline `#[cfg(test)]` modules into integration tests (`tests/`), or into a small test-only target. Add the narrowest public hooks they need (`#[doc(hidden)] pub` or a `testing` module) instead of making internals public wholesale.
  - The Windows step then builds only the integration binary (or that target) with `--test integration`, with the same module-level selection and the manifest-vs-JUnit gate. Drop `--lib`.
  - Keep the Linux job running everything.

  ## Done when

  - [ ] The Windows step no longer builds the library's unit-test target. The selected tests and the coverage gate still run on Windows.
  - [ ] Wall time of the Windows job before and after, from a CI run or measured locally and marked as such.
