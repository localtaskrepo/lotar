  text: 'Done in c0461ccb. The Windows-selected tests (storage::safety, utils::scan, automation_service async_run_monitor + windows_async_stdio: 41 incl. lotar-agent-wrapper) moved out of inline #[cfg(test)] modules into tests/storage_safety_test.rs, tests/utils_scan_test.rs and tests/automation_async_run_test.rs, compiled as their own small test binary windows_regressions (Cargo.toml [[test]]). Not into the integration binary: built from clean it costs as much as the lib unit-test build (37 s vs 37 s locally), and sccache can''t cache the incremental workspace crate on CI. Hooks made #[doc(hidden)] pub: safety::{atomic_write_file_with_io, is_lock_contention}, scan::{lock_source, write_source_with_prepared}, operations::before_task_write (now always compiled; one thread-local check per task write), automation_service::{BoundedTail, stderr_eof_within_grace, windows_async_stdio}. Windows step: --test windows_regressions --bin lotar-agent-wrapper, no --lib, no -E filter (whole targets); the manifest-vs-JUnit gate uses the same flags. Linux still runs everything (--lib --bins --tests). Contract test, tests/README.md and docs/developers/platform-test-verification.md updated. Timing, measured locally on the Mac (not CI), cargo clean -p lotar then cargo build --profile ci, then nextest --no-run for the step''s targets: before (--lib --bin lotar-agent-wrapper) 51.6 s, after (--test windows_regressions --bin lotar-agent-wrapper) 26.1 s. Nearly all of the remaining 26 s is a second library build: dev-dependencies (predicates, assert_cmd) turn on regex/bstr default features, so test targets can''t reuse the library from the ''Build binary'' step. Possible follow-up: line up those dependency features. Checks: npm run lint, npm test (2140 Rust + 1515 UI), npm run smoke (390) passed; selection run plus check-test-coverage.py OK (41 tests). Not run: Windows itself. A cross-check for x86_64-pc-windows-msvc fails here on ring''s C build (no Windows SDK headers), so the cfg(windows) test module and the now-ungated windows_async_stdio helpers compile only on CI. CI wall time after the change still needs a CI run.'
