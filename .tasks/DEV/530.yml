  text: |-
    Implemented in commit 388d708f on agent/DEV-530 (worktree ~/.t3/worktrees/lotar/DEV-530). It sits on DEV-524's 500370cd, so DEV-524 merges first.

    - When the dependency check holds a job back, the job request (agent, prompt, session, model, effort, provider) and the ticket's earlier status are kept next to the agent queue. `lotar agent queue` lists them under "Waiting for prerequisites"; `queue remove` and `flush` cover them too, and a task with one can't be moved.
    - When the last prerequisite is done (the unblocked event, also the cross-repo `automation run`), the job is queued as it was and the ticket gets its status back, before the unblocked rules run. So the DEV rule on status Blocked leaves those tickets alone and needs no change. A ticket given to someone else meanwhile drops the job.
    - The queue worker checks the prerequisites again just before it starts a job, and holds it back again if one reopened (the DEV-503 brief-Done case).
    - Tests: a_held_back_review_job_resumes_with_its_own_prompt_and_status failed on DEV-524's code and passes now. a_queued_job_whose_prerequisite_reopened_is_held_back_again is a unit test of new code. npm run lint:agent, test:agent (2155 Rust) and test:smoke:agent (401) pass.
    - Live trial in a scratch workspace with the real queue worker: TR-4 sent to review while TR-3 was open went Blocked with @review, and the queue listed the job. After TR-3 was Done, TR-4 was back in Reviewing and the review job ran with "Review TR-4 now". The first attempt ran into the trust gate (untrusted scratch workspace): the worker dropped that job without a word on the ticket. That happens to any queued job, not just held-back ones.
    - Still open from the survey: waits on another repo still need `lotar automation run` from cron (STD-88 has waited since 11-13 19:24). The rule's job prompts are not in @agent-logs.
description: |-
  Follow-up of DEV-524, from a survey of the 21 waiting episodes in lotar and standards (2026-11-14, mallox in the DEV-524 thread: "review what worked so far and what issues occurred ... then try an approach that we test and see how it goes").

  ## Found

  - The "Prerequisites done" rule always continues with tell_agent @fix, whatever step was pending. DEV-501: the fix agent did the review. DEV-467: the review reopened the thread that wrote the fix and refused to review its own commit. tell_agent always continues the last session with the rule's message, but a review needs a fresh thread with the review prompt, and a merge needs the merge prompt.
  - The check runs at every hand-off, so finished work was parked on its way to review or merge (DEV-351, 490, 501, 510, 512).
  - A prerequisite that was Done for only two minutes (DEV-503, 05:32–05:34Z) started DEV-501, 509 and 510 early.

  ## Approach

  - When the check holds a job back, lotar keeps the job request (agent, prompt, session, model, effort, provider) and the ticket's status, next to the agent queue.
  - When the last prerequisite is done (`unblocked`, also the cross-repo `automation run`), that job is queued as it was, and the ticket gets its status back.
  - The queue checks the prerequisites again before it starts a job, and parks it again if one is open by then.
  - DEV's "Prerequisites done" rule acts only on tickets without an assignee (blocked by hand or by triage). Tickets that keep their agent resume on their own.

  ## Done when

  - [ ] A review or merge job held back by an open prerequisite runs with its own prompt and session once the prerequisite is done, and the ticket returns to its earlier status. Test fails before.
  - [ ] A queued job whose prerequisite reopened is parked again, not started. Test fails before.
  - [ ] Docs (help/automation.md) and the DEV rule match.
  - [ ] npm run lint, npm test, npm run smoke pass.
