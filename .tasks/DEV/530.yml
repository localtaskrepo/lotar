- date: 2026-11-15T07:44:22.375106+00:00
  author: claude
  text: |-
    Codex 07:36Z path was real; reworked in `6564ad12` (signed) on `t3/resume-held-jobs-when-unblocked`.

    - Found: in the server, a parked entry that cannot be removed after its job started stayed parked unchanged, so the next resume (`unblocked` or cross-repo `automation run`) ran it a second time.
    - Fix: before the server starts the job, the parked entry is marked `starting` under the queue lock (`AgentQueueService::claim_parked`). Resume and `unpark` skip marked entries, so it never runs twice. A failed start clears the mark (`release_parked`) and the job keeps waiting. A marked entry left behind shows as `(starting)` in `lotar agent queue` (JSON `starting: true`), and a new park, assignment or `queue remove` clears it.
    - Test `a_parked_job_marked_starting_does_not_resume_again`: fails when resume ignores the mark (the job is queued again). The server start-failure test now also checks that the mark is cleared.
    - Docs: `help/agent.md` explains `(starting)`.
    - Checks: `npm run lint:agent`, `test:agent` (2181 Rust, 1537 web), `test:smoke:agent` (401), all pass.
