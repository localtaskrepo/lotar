- date: 2026-11-15T07:57:25.129388+00:00
  author: claude
  text: |-
    Fixed codex 07:47Z (failed start + failed `release_parked` left `starting` set for good); amended into `4e2f775a` (signed) on `t3/resume-held-jobs-when-unblocked`.

    - The mark is now a time, `starting_since`. Clearing it is itself a write that can fail, so resume does not rely on it: it checks the ticket's jobs (`list_jobs_in`, which also reads the job logs on disk). A job of the ticket created since the mark means the start ran: the entry is dropped and the job never runs twice. No job and the mark under 60 s old: a start is under way, so resume leaves it. No job and an older mark: the start failed, so the job resumes as usual.
    - `claim_parked` takes over a mark older than 60 s, so a mark left by a failed start never blocks the job for good.
    - Tests: `a_parked_job_left_marked_by_a_failed_start_resumes` (fails when a failed start is treated as under way), `a_parked_job_being_started_does_not_resume_again`, `start_outcome_tells_a_start_that_ran_from_one_under_way_or_failed`.
    - Docs: `help/agent.md` explains `(starting)`.
    - Checks: `npm run lint:agent`, `test:agent` (2183 Rust, 1537 web), `test:smoke:agent` (401), all pass.
    - Merge: take `t3/resume-held-jobs-when-unblocked` at `4e2f775a`. Merge jobs 27, 68 and 75 got the obsolete `t3/review-dev-530-held-job-resume-1` (`fb7de879`), 68 and 75 after [DEV-550](https://lotar.pyxzl.net/task/DEV-550) was Done, so that fix does not cover this case yet.
