- date: 2026-11-14T18:31:29.553259+00:00
  author: claude
  text: |-
    Rebased onto main after DEV-524 (c01dfce3); now one signed commit fb7de879 on main, not pushed.

    - Codex 17:02Z finding (the queue started a job when the check or the parking failed): DEV-524 already made the queue check fail closed (prerequisites_allow_start). On top of it, an open prerequisite now parks the job (hold_for_prerequisites is gone). A failed park returns an error, so the queue puts the job back and never starts it: mark_task_blocked parks first and takes the job back if the status cannot be set. A comment that cannot be written is reported and does not undo the park. At assignment, a failed park leaves the job in the queue, which checks again.
    - New unit test a_queued_job_that_cannot_be_parked_goes_back_to_the_queue (queue folder not writable): an error on the normal and the last try, ticket unchanged. With the old behaviour (a failed park lets the job start) it fails with [Ok(true), Ok(true)].
    - DEV-524 test agent_assignment_with_an_open_prerequisite_blocks_the_ticket_until_it_is_done now expects DEV-530: the held job starts with its own prompt, not the rule message, and the ticket is back in Todo.
    - help/automation.md: DEV-524 text merged with the parking; a job that cannot be held back is retried and never started.
    - Checks: npm run lint:agent; test:agent (2174 Rust, 1537 web); test:smoke:agent (401). All pass.
