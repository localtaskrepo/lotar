  text: 'Outcome: sprint backlog (CLI positional query + flags, REST /api/sprints/backlog, MCP sprint_backlog) runs the shared task query: every list filter plus query; manual backlog order unless sort_by is given; invalid values now error (REST 400, MCP -32602 with enum hints) instead of empty/unvalidated. REST /api/sprints/add|remove and MCP sprint_add/remove accept query (tasks optional with it); the never-used SprintAssignmentRequest.selection/TaskSelection is removed (api_types.rs, types.ts). task relationships graph --filter ''<query>''. MCP query error mapping shared (query_error). Evidence: tests/dev236_backlog_and_selection_query_test.rs (3), task_order_test converted; lint:agent, test:agent (1830 Rust, 1352 UI), smoke 361 pass. Docs: openapi (backlog params, SprintAssignmentRequest.query), api-quick-reference (sprint add/remove/backlog entries were missing), mcp-tools, sprints.md, task.md. Closes DEV-233. Guidance: no durable finding.'
description: 'Sprint backlog (CLI sprint backlog, REST /api/sprints/backlog, MCP sprint_backlog) filters with its own selector (project, status, tag, assignee; exact-case assignee, unvalidated statuses in CLI/REST) while the web Sprints backlog uses the shared query. REST /api/sprints/add|remove accept a selection field they ignore (DEV-233) and MCP sprint_add/remove take explicit IDs only, unlike CLI --select. lotar task relationships graph has no filter although REST/MCP/web graph do. Move all of them onto the shared task query: backlog takes every filter plus a query (keeps manual backlog order unless a sort is given), REST/MCP sprint add/remove take query (replaces the dead selection field), graph CLI takes --filter ''<query>''. Closes DEV-233.'
