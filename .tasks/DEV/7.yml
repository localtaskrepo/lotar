comments:
- date: 2026-09-06T11:21:52.652842+00:00
  text: 'Backlog reconciliation: Remains Todo for automatic relationship creation from ticket mentions. Explicit relationship editing exists, but does not implement automatic inference. Clarify eligible description/comment/reference surfaces, target relation category, deduplication and removal behavior; coordinate DEV-6/16 and mutation transactions DEV-55.'
- date: 2026-09-06T13:12:53.843574+00:00
  text: |-
    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 8: Option to automatically add ticket reference to relationships if they're not already in a more specific category.
- date: 2026-10-30T00:56:16.612414+00:00
  text: Should have a config flag that allows this to be disabled
- date: 2026-10-30T00:59:28.975592+00:00
  text: 'Decision (developer): mentions of other ticket IDs in the description and in comments add a ''related'' link (two-way) unless the pair is already linked in any category; on by default with a config switch (global + project) to turn it off; links are only added, never removed automatically. Plan: hook into task create/update and comment add/edit server-side so CLI, REST, MCP and UI all behave the same; skip unknown IDs, self, and moved stubs (resolve to current ID). Docs + tests.'
- date: 2026-10-30T01:30:48.566818+00:00
  text: 'Done: auto.link_mentions (default true). Ticket IDs newly written in a description (create/update, CLI/REST/MCP/UI) or comment (add/edit) add a two-way Related link; skipped: unknown/deleted IDs, self, code spans/blocks, pairs already linked in any category, archived targets when both sides are written; moved IDs follow to the current ID. Only new mentions count so hand-removed links stay removed; never removes links. Best effort after the main save. Docs: config-reference, config.md, task.md, environment. Test: tests/dev16_dev7_relationship_automation_test.rs.'
- date: 2026-10-30T01:51:28.772329+00:00
  text: 'Verified: npm run lint:agent, nextest 1866/1866, UI vitest 1393/1393, smoke 367/367 (ui.config-coverage row count updated for the two new relationship switches). No guidance correction.'
description: |-
