  text: 'Sprints page loaded its own task copy and only listened for order changes, so tasks created from the global New task button, another tab or the CLI only appeared after a reload. It now also listens for task created/updated/deleted events and refreshes once per burst. Checked other pages: Tasks, Boards, Calendar and Insights use the shared task store, which already refreshes on these events. Unit test in SprintsList.addTask.spec.ts; verified in a browser with a task added from the CLI.'
