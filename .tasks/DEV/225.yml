  text: 'Done: feature entries on the release page show up to two image attachments of their ticket (12 per release) as <img> from raw.githubusercontent.com at the release commit; the snapshot indexes images in ''@'' folders (e.g. .tasks/DEV/@attachments). Width comes from the image header (PNG/GIF/WebP/JPEG), halved for *-2x.* names (scale-2 captures from scripts/ticket-screenshot.mjs, which now adds that suffix), capped at 720. Unreadable images are skipped with a warning. Tests in release-page.test.mjs and release-ticket-links.test.mjs. Local preview shows DEV-184''s heading snippet at 695 px.'
description: The release page lists commits by ticket. For feature tickets in a release that carry image attachments, show their screenshots (from the release's git snapshot) so readers see what changed.
