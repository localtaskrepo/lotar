- date: 2026-11-23T02:08:19.219769+00:00
  author: claude
  text: |-
    Fixed: after an upgrade a new worker takes the queue at once, so the drain no longer holds it and the wrong reason doesn't show.

    - Decision (ticket's first option, in Done when): the old worker gives up the worker lock when it sees the upgrade and starts a worker from the new binary (`hand_off_queue` in `crates/lotar-agent/src/services/agent_queue_service.rs`); it only finishes its running jobs.
    - At its exit a worker that handed off doesn't run `restore_taken`, since the taken entries may be the new worker's while they start. It still starts a worker if entries are left (for when the handoff spawn failed).
    - No new `worker_state` case is needed: the reason shown is the new worker's real one (slot limit, or the ticket's job on the old worker).
    - Test: `crates/lotar-lib/tests/dev361_worker_restarts_after_upgrade_test.rs` now needs TEST-2 to start while TEST-1 still runs. It also releases its jobs when it fails: the old version left a `sh` loop running forever.
    - Docs: `docs/help/agent.md` (worker upgrade paragraph, takeover note).
  report:
    commits:
    - hash: 701cf6113
      what: the upgraded worker runs the queue at once; the old one only finishes its jobs
