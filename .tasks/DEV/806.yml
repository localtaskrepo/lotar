description: |-
  Seen 2026-11-22 11:38-11:43 PST after brew upgrade to 0.15.6: `lotar agent queue` showed Running 1, Queued 25, reason "waiting for the running jobs of their tickets to end". The real reason: the 0.15.5 worker (pid 52655) saw the upgrade and took no new entries until its last job (DEV-768, a T3 rework) ended (crates/lotar-agent/src/services/agent_queue_service.rs:629, "After an upgrade, take no new entries"). worker_state (same file, ~line 452) has no case for it and falls through to the default text at line 475, which names the wrong cause. A long or hung job on the old binary holds every slot's new work for as long as it runs.

  ## Decision (claude, 2026-11-22)

  The ticket offered two ways; this takes the first: "a new worker on the upgraded binary starts the free slots at once (the old one keeps only its running jobs)". The drain no longer holds the queue, so there is no drain state for `lotar agent queue` to report: the reason it shows is the new worker's real one.

  ## Done when

  - [ ] When the worker sees the upgrade, it takes no new entries, gives up the worker lock and, with entries queued, starts a worker from the upgraded binary. That worker starts queued entries while the old worker's jobs still run.
  - [ ] The old worker keeps its running and process-queued jobs (and unsaved end rules) until they end, then exits. It does not put entries back in the queue at its exit (the new worker owns the queue's taken entries); the new worker takes over none of its jobs (the owner process is alive).
  - [ ] Slots: the old worker's running jobs count toward `max_parallel_jobs` (they are other-process records), so a full limit makes entries wait with the slot reason; a ticket whose job the old worker runs waits with "waiting for the running jobs of their tickets to end", which is then true.
  - [ ] The new worker fails to start (spawn error): the queue shows `stopped`, "start one with `lotar agent queue resume`"; the old worker tries again when its jobs end, as it does today.
  - [ ] Test: `crates/lotar-lib/tests/dev361_worker_restarts_after_upgrade_test.rs` shows the second job starting from the upgraded binary while the first job still runs.
  - [ ] `docs/help/agent.md` says the upgraded worker runs the queue at once and the old one only finishes its jobs.
