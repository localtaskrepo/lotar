description: |-
  Found 2026-11-24 18:10 PST: 12 orphaned processes under /var/folders/*/T/lotar-rust-temp-*/.lotar-test-scratch/, from 4 test runs whose cargo test process had exited (oldest from 2026-11-22 18:18, DEV-767's job worktree). Each run left a 'lotar --tasks-dir <scratch>/.tasks agent worker' (ppid 1) plus its job shell, a 'sh -c ... while [ ! -f <scratch>/release ]; do sleep 0.05; done' loop that forks sleep about 20 times a second until reboot. Tests that start a worker or a job with a release file must stop the worker and remove or release the loops on drop, also when the test fails or times out. Killed by the chief of staff with the owner's OK (2026-11-22, 'Kill and file').

  ## Done when

  - [ ] Every test job or fake-git loop that waits for a release file (`while [ ! -f ... ]` with no bound) in `crates/lotar-lib/tests` also ends as soon as the test process is gone (`common::while_this_test_runs()`), whichever comes first: the release file or the test's end.
  - [ ] This holds when the test passes, fails, panics in a drop, or nextest kills it on a timeout: no Drop needs to run.
  - [ ] With its loops ended, a detached `lotar agent worker` has no running job and exits on its own (its existing idle exit); queued entries it still starts end at once for the same reason.
  - [ ] A test shows a loop built with the helper ends once its owning process is gone, without the release file.
  - [ ] The changed tests still pass (targeted nextest run).
tags:
- fix-retried
- review-returned
