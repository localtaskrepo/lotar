description: 'Found 2026-11-24 18:10 PST: 12 orphaned processes under /var/folders/*/T/lotar-rust-temp-*/.lotar-test-scratch/, from 4 test runs whose cargo test process had exited (oldest from 2026-11-22 18:18, DEV-767''s job worktree). Each run left a ''lotar --tasks-dir <scratch>/.tasks agent worker'' (ppid 1) plus its job shell, a ''sh -c ... while [ ! -f <scratch>/release ]; do sleep 0.05; done'' loop that forks sleep about 20 times a second until reboot. Tests that start a worker or a job with a release file must stop the worker and remove or release the loops on drop, also when the test fails or times out. Killed by the chief of staff with the owner''s OK (2026-11-22, ''Kill and file'').'
