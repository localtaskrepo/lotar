- date: 2026-11-26T00:54:00.167810+00:00
  author: claude
  text: |-
    Test wait loops now end when the test process is gone, even if no release file is ever written.

    - `common::while_this_test_runs()` in `crates/lotar-lib/tests/common/mod.rs` returns `kill -0 <test pid>`. Every unbounded `while [ ! -f release ]` loop and the endless `while :` loop in `crates/lotar-lib/tests` now also checks it.
    - Changed: `agent_safety_test.rs` (job loops and the fake git), `dev320`, `dev361`, `dev592`, `dev630`, `dev646`, `dev660`.
    - Nothing has to run on Drop, so this holds for a pass, a fail, a panic or a nextest timeout kill. Once its loops end, a detached worker has no job left and stops on its idle exit.
    - New test `dev861_test_loops_end_with_the_test_test.rs`: the loop ends once its owner process is killed, and no release file appears.
    - After the run, `ps` shows no scratch loops or workers left behind.
  report:
    commits:
