- date: 2026-11-27T00:08:18.764759+00:00
  author: claude
  text: |-
    Review: passed. Every unbounded release-file wait loop in the tests now also ends once the test process is gone.

    - **Reviewed:** `9917a7c17`, the only commit on `agent/DEV-861` past `main`. No newer commits on the branch. Tests only: the helper `while_this_test_runs()` (`kill -0 <test pid>`) in `crates/lotar-lib/tests/common/mod.rs`, used in 8 test files, plus the new test `dev861_test_loops_end_with_the_test_test.rs`.
    - **Done when:** items 1 to 5 hold. `git grep 'while \[ ! -f'` on `main` finds no unbounded loop the branch misses (including `dev370`, last review's finding). The other loops stop after a fixed count. No new wait loops have landed on `main` since the branch base (60 commits).
    - **New test:** the loop keeps running while its owner process lives, and ends without a release file once the owner is killed. Without the helper, that loop would never end, so the test covers the fix.
    - **Merge note:** `crates/lotar-lib/tests/integration.rs` conflicts with `main`. Only the `mod` list differs: keep both sides, and keep `mod dev861_...` after `mod dev860_...`.
    - **Reran:** `npm ci` passed. `cargo nextest run --workspace -E 'binary(integration) & package(lotar-lib) & test(/dev861|dev320|dev361|dev370|dev592|dev630|dev646|dev660|agent_safety/)'`: 65 of 65 passed. `rustfmt --edition 2024 --check` on the changed files passed. After the run, `ps` showed no loops or workers left from it.
    - **Filed [DEV-916](https://lotar.pyxzl.net/task/DEV-916) (minor):** the DEV-796 branch, now in Merging, adds a new unbounded `while [ ! -f "{go}" ]` loop to the stub `template-team-agent.sh`. Two of these from test runs at 12:37 were still running at 16:07 (ppid 1). I left them running because they aren't from my run. Whichever of the two tickets lands second has to add the helper there.
