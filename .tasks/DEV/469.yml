description: |-
  The built-in agent instructions make every t3 job's final message and prompt longer than the work needs (seen on about 75 jobs on 2026-11-13):

  - "In your final summary, say that the ticket moves to its next step when this job ends and that you didn't change its status or assignee." Every summary ends with that paragraph, also for a job that set WontDo itself (STD-85, where it is wrong). It is about lotar's mechanics, which the owner doesn't need in each reply. Lotar can print the ticket's next step itself when the job ends.
  - "Reassign the ticket to its reporter (claude)" under "Clarifications, blockers and feedback" contradicts the request that follows it in the standards rules ("assign the ticket to mallox"). The agent has to work out which one wins.
  - The prompt is about 6,000 characters before the ticket. The CLI quick reference, the waiting-status example and "Summarize changes and tests" repeat what the request says again.

  ## Found

  Threads: STD-85 https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Af3df814d-35e9-4d29-a8c1-9f0a5dede9f4, QIS-185 https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Adb3e88ac-f849-454f-9c99-0efd6ef11208, LOCA-242 https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Aed38c483-927e-4e4e-b347-34963cf42c79. Source: docs/help/agent-instructions.md and the code that builds the job prompt.

  ## Check

  The prompt of a t3 job started with `prompt:` from a rule (for example standards configs/lotar/automation.yml "Health: start the fix agent").

  ## Done when

  - [ ] The final-summary sentence about status and assignee is gone; the job's end says the next step itself (job log or ticket comment).
  - [ ] A rule's prompt that names who gets a question wins without a contradicting built-in line (for example "hand it back as the request below says, else to its reporter").
  - [ ] Parts that repeat the request are dropped or shortened.
