- date: 2026-11-26T23:34:32.387891+00:00
  author: claude
  text: |-
    Review: blocking. The serial group doesn't fix it: the test still times out at 60 s on all 3 tries.

    - Diff: only `.config/nextest.toml`; the names resolve (`cargo nextest list`).
    - Rerun: `cargo nextest run --workspace --test integration -E 'test(/dev503_harness_jobs_test::a_continued_merge/)'` gave 2 passed, 1 failed. `a_continued_merge_without_a_session_of_its_own_takes_the_reviews_thread` failed at 61 s on tries 1, 2 and 3 (276 s total).
    - Cause, as the fix agent's own comment says: the merges wait on the machine's real check lock, which another worktree's suite holds. Running them serially in this repo's group can't help, because the holder is outside nextest.
    - Fix: the "wait is fixed" route. Set `LOTAR_CHECK_LOCK_HELD=1` in the test processes, as DEV-801 (`925bc14df`) does in `tests/common/mod.rs` and the dev503 test file, and drop the group entry if it isn't needed. Or land DEV-801 first and re-verify this ticket after it.
    - Not a pass, because the fix agent's own 58/58 run needed a retry (57 s) and the filter adds retries that only hide the lock wait.

    Set `review-blocked`.
- date: 2026-11-27T00:29:05.412031+00:00
  author: claude
  text: |-
    Fixed the wait itself: the dev503 merges no longer wait on the machine's check lock.

    - Review read HEAD `05fdc397a` (its only diff, `.config/nextest.toml`).
    - Reproduced before the fix: another session's `node` held port 47586, and both continued-merge tests failed at 60 s with `--retries 0`.
    - Fix: `t3_harness_and` and the harness-to-harness test in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs` set `LOTAR_CHECK_LOCK_HELD=1` (an `EnvVarGuard`), the same variable DEV-801 (`925bc14df`) sets for all tests. Staying in this file avoids a conflict with DEV-801's `tests/common/mod.rs`.
    - The full dev503 run also caught `a_ticket_hands_its_context_from_harness_to_harness_through_its_states` (66 s, same lock wait), so it got the guard too.
    - The `wall-clock` filter entries are dropped. `.config/nextest.toml` matches main again.
    - After the fix, with the lock still held elsewhere: dev503 passed 58/58 in 12.8 s, no retries.
  report:
    commits:
    - hash: 0c95eb011
      what: dev503 harnesses set LOTAR_CHECK_LOCK_HELD=1; wall-clock entries dropped
    checks:
    - command: cargo nextest run --workspace --test integration --retries 0 dev503
      result: passed
      reason: 58/58 in 12.8 s while another session's node held port 47586
    - command: npm run lint
      result: passed
    - command: npm test / smoke
      result: not_run
      reason: the merge runs the full suites
    next: Review again; once DEV-801 lands, its common/mod.rs sets the same variable and these guards become redundant (harmless)
- date: 2026-11-27T03:35:45.164280+00:00
  author: claude
  text: |-
    Review: passed. The merge tests no longer wait on the check lock.

    - Read HEAD `0c95eb011` (one commit, 5 lines in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`). It sets `LOTAR_CHECK_LOCK_HELD=1` in `t3_harness_and` and in the harness-to-harness test. That is the variable `check_lock.rs` reads (`HELD_ENV`), and `.config/nextest.toml` is unchanged from main.
    - Reran `cargo nextest run --workspace --test integration --retries 0 -E 'test(/dev503_harness_jobs_test/)'`: 58/58 passed in 11.5 s, no retries.
    - The sibling ticket DEV-801 sets the same variable in `tests/common/mod.rs`, so the two changes overlap but don't conflict. Once DEV-801 lands, these three lines are redundant but harmless.
    - No stray files; the tree is clean. No minor findings, so no tickets filed.
