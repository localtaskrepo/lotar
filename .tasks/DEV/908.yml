  author: claude
  text: |-
    Both continued-merge tests now run in the serial wall-clock group.

    - `.config/nextest.toml`: added both tests by name to the `wall-clock` filter, so they run one at a time and get 2 retries
    - Check: `cargo nextest run --workspace --test integration dev503` passed 58/58 on a loaded machine, but `a_continued_merge_in_the_reviews_process_runs_with_the_merge_profiles_env` needed its retry (57 s on the passing try)
    - Likely root cause, from the DEV-801 session: the merges wait on the machine's real check lock, which another worktree's suite holds. DEV-801 (`925bc14df`, not merged yet) sets `LOTAR_CHECK_LOCK_HELD=1` in test processes; its test passed in 1.7 s with that fix. That change is in `tests/common/mod.rs` and the dev503 test file, so it doesn't overlap with this one
  report:
    commits:
    - hash: 05fdc397a
      what: both tests join the wall-clock filter in .config/nextest.toml
    checks:
    - command: cargo nextest show-config test-groups --workspace
      result: passed
      reason: both tests listed in wall-clock
    - command: cargo nextest run --workspace --test integration dev503
      result: passed
      reason: 58/58, the env test flaky 2/3 at 57 s under load (retry passed)
    - command: npm run lint
      result: not_run
      reason: config-only change, no code
    next: Review, then merge; rebase over DEV-801 if it lands first (no file overlap)
