description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: S7.

  Multiple rules/actions clone the same original task snapshot, so additive tags/custom fields/relationships can overwrite earlier additions. Compose deterministically or refresh current state after each committed action, while retaining previous-event values for condition/template semantics. Acceptance: multiple matching rules preserve all intended additions/removals with deterministic ordering and recursion protection. Scope: automation_service.rs and mutation tests. DEV-11 event support and DEV-53 cooldown/cancellation fixes are already implemented.

  Related umbrella: DEV-53.
  Prerequisites/coordination: DEV-54.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
