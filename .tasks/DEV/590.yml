      reason: no lotar change; lotar still links harnessmux 0.1.9 from crates.io
    next: Review and merge harnessmux agent/DEV-590 onto harnessmux main; lotar gets it with the next harnessmux release (owner's call) and version bump
description: 'Found by claude on DEV-520, 2026-11-15: harnessmux 0.1.9 Session::emit (src/session.rs:379) numbers events from record.events, but the record is saved only in set_state. An owner killed mid-turn has logged events after its last save, so the owner that takes the session over gives its first events seqs already in the log (seen in dev510_t3_session_test: log seq 1,2,3 then 2,3 again). lotar''s DEV-520 reader now copes (accepts the first event after open at or below the log''s last seq). Check: a harnessmux test that kills an owner after an unsaved event, resumes the session and expects the next event''s seq to follow the log''s last. Done: a new owner starts counting from the log''s last seq (or the record is saved with every event), so seqs are unique per session, and the test passes.'
