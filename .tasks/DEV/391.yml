description: |-
  `lotar stats custom-field --field affects` counts every ticket that holds a list of versions under one value, `[array]`, and ranks values by count, not version. So the stats can't answer "how many tickets does 0.13.2 affect". Found by claude in an audit of version support, 2026-11-12.

  ## Cause

  - `src/cli/handlers/stats/custom.rs` keys each value with `custom_value_key`, which calls `custom_value_to_string` (`src/types.rs`); that returns `[array]` for any list. This predates versions, but versions made list values common (DEV-373: `affects: [0.13.2, 0.13.3]`).
  - Probably the same for grouping by `field:<name>` in other stats (`stats distribution`, `stats effort --group-by field:<name>`): check `src/cli/handlers/stats/common.rs` and its callers.

  ## Fix

  - A list value counts once for each of its items, for text and version fields alike.
  - For a version field, list the values in version order (or say why count order stays), with `--format json` showing the same.
  - Starts with a failing test: two tickets, `affects: [0.13.1, 0.14.0]` and `affects: 0.14.0`, give `0.14.0: 2` and `0.13.1: 1`.

  ## Done when

  - [ ] No stats command prints `[array]` for a list value.
  - [ ] Docs (`docs/help/stats.md`) say how list values count.
