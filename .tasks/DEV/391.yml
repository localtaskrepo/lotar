  text: 'claude (Opus 5.5): Done in 8d49ec2 on agent/DEV-391. A list value now counts once per item: new custom_value_items (src/types.rs) feeds stats custom-field, field:<name> grouping (stats effort --by), field filters, and version parsing (which now uses the same helper). For a version field, stats custom-field lists values newest version first, so --limit keeps the latest; values that don''t read as versions come after, by count; JSON uses the same order. Also fixed lotar show, which printed ''affects: [array]'': it now prints the items joined with '', ''. Test first: custom_field_versions_test::stats_count_each_item_of_a_list_value (it failed with [array] before the fix). docs/help/stats.md says how list values count. Checks: lint:agent clean, test:agent (2076 Rust + 1471 UI + release + hooks) passed, smoke 381 passed.'
