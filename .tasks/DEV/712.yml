- date: 2026-11-18T23:08:32.348127+00:00
  author: claude
  text: |-
    Done: lotar runs `agent.worktree.waiting_run` (DEV sets `cargo clean --workspace`) when a ticket waits.

    - Runs at a job's end (completed, failed, cancelled; not paused for a usage limit) if the ticket is HelpNeeded or Blocked, after the end rules. It runs in every worktree of the ticket.
    - Also runs when a job is held back for open prerequisites and lotar sets Blocked.
    - Runs nothing while another job runs for the ticket or its T3 thread runs a turn. A thread waiting for an answer doesn't stop it.
    - Runs from a repository config only after `lotar trust`; `trust --status` lists it. Untrusted, the job log (or stderr) says "Skipped agent.worktree.waiting_run".
    - Each run and each failure goes to the job log; a failure changes nothing else.
    - When the DEV waiting rule fires on an agent's hand-back, the clean runs twice. This is harmless and documented in `docs/help/agent.md`.
    - Test: `waiting_build_output_goes_on_hand_back_person_change_and_waits_lotar_sets` in `crates/lotar-lib/tests/agent_safety_test.rs`
