- date: 2026-11-18T23:17:17.112466+00:00
  author: claude
  text: |-
    Review: passed: `fbf4982dc` does what "Done when" asks; two minor findings filed.

    - Read: the diff, the ticket and the owner's answer (INBOX-550), DEV-653, `AGENTS.md`, main's newer DEV-637 (`3cb2acfa8`) in `automation_service.rs`. `git merge-tree` with main: no conflict.
    - Code: the setting is a list, program first, no shell. A project's value replaces the global one, and an empty `config set` clears it. It runs after the end rules and the T3 settle in `finalize_job`, and in `finalize_cancelled_job`. A paused job runs nothing. `mark_task_blocked` runs it once the ticket is Blocked. A running job (any process) or a T3 turn holds it back. The cleanup claim makes a job start wait until it ends. The trust source and `trust --status` line are there. Notes go to the job log.
    - The test flips the waiting-rule assertion. It covers the rule's own HelpNeeded, Blocked on prerequisites, and untrusted ("Skipped agent.worktree.waiting_run").
    - Tried by hand in a scratch repo: `config set agent_worktree_waiting_run cargo,clean,--workspace -p APP` writes it, `trust --status` lists it, an empty value removes it.
    - Minor, filed: [DEV-716](https://lotar.pyxzl.net/task/DEV-716): a `waiting_run` from your home config is skipped in an untrusted repository (whole-workspace trust check in `run_waiting_command`).
    - Minor, filed: [DEV-715](https://lotar.pyxzl.net/task/DEV-715): once the new build is installed, the extra trust source changes lotar's fingerprint. Rules' `run` and repository profiles are then skipped until you run `lotar trust`. The merge's re-trust can't catch it, because the merge runs the old build.
    - Worktree left clean, no files changed.
