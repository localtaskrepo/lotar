  author: claude
  text: |-
    Needs your design choice before I code: how should lotar clean a ticket that it or a rule leaves waiting?

    - Builds on [DEV-653](https://lotar.pyxzl.net/task/DEV-653), which is still in review (`agent/DEV-653`, `05ea0d37e`, not on main). Its rule, docs section and test live only there. I'll stack on that commit once you choose.
    - The three waits differ. The rules that hand a ticket to mallox and the T3 thread that waits for an answer both happen at a job's end. Blocked on open prerequisites happens when a job would start, so no job ends there (`mark_task_blocked`, `automation_service.rs`).
    - Lotar already treats `HelpNeeded` and `Blocked` as its waiting statuses by name (`hand_back_waiting_job`, `mark_task_blocked`).

    **Question:** which of these?
    1. **(Recommended) A command lotar runs:** new setting `agent.worktree.waiting_run: [cargo, clean, --workspace]`. Lotar runs it in the ticket's worktrees when it or a rule leaves the ticket HelpNeeded or Blocked: after the job is unregistered, and in `mark_task_blocked` when no job runs. This covers all three waits and saves 3.4 to 0.7 GB, the same as the rule. A repository's config needs `lotar trust` before lotar runs it, as with profiles. If the command fails, the job's log says so and nothing else changes.
    2. **Paths only:** new setting `agent.worktree.waiting_cleanup_paths: [target/debug/incremental]`. It reuses the safe deletion that `cleanup_paths` already does, runs nothing and needs no trust, but saves only about 1.4 GB per ticket.
    3. **Not worth it:** WontDo. The docs already name the waits that keep their build output.
