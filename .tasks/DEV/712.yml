description: |-
  Found in DEV-653's review (2026-11-18): the waiting rule (`updated` on HelpNeeded/Blocked → `lotar agent worktree run <ticket> -- cargo clean --workspace`) fires only on a person's status change and an agent's hand-back. These waits write with `TaskUpdateContext::automation_disabled()` and fire no rule, so their build output (~2 GB each) stays until Done:
  - rules that hand a ticket to mallox: review failed, third blocking review, fix failed again, merge failed again (`.tasks/DEV/automation.yml`; "A rule's own change fires no other rule")
  - a T3 thread that waits for an answer (`hand_back_waiting_job`, `crates/lotar-agent/src/services/agent_job_service.rs`)
  - Blocked on open prerequisites when a job would start (`mark_task_blocked`, `automation_service.rs`)

  Adding the command to those rules' `run` doesn't work: end rules run while the job is still registered, so `worktree run` skips.

  ## Decision
  Owner 2026-11-18 (INBOX-550): "command (A command lotar runs: setting agent.worktree.waiting_run (cargo clean --workspace), needs lotar trust)".

  ## Done when
  - [ ] New setting `agent.worktree.waiting_run` (list, program first, no shell; default none; global or per project, a project's replaces the global; `config set agent_worktree_waiting_run`, empty value turns it off).
  - [ ] A job's end (completed, failed, cancelled; not paused) with the ticket HelpNeeded or Blocked runs it in each of the ticket's worktrees, after the end rules, so a rule's own `set` and lotar's T3 hand-back count. A test shows it (the last assertion of the waiting-rule test in `crates/lotar-lib/tests/agent_safety_test.rs`, flipped).
  - [ ] A job held back for open prerequisites (`mark_task_blocked`) runs it when the ticket goes Blocked; the same test shows it.
  - [ ] Runs nothing while another job runs for the ticket (any process) or its T3 thread runs a turn; a thread waiting for an answer doesn't hold it back (the job just ended on that question). A job for the ticket waits to start until the command ends.
  - [ ] From a repository config it runs only when trusted: `lotar trust` fingerprints it, `trust --status` lists it; untrusted, the job log (stderr without a job) says skipped. Test shows the untrusted case.
  - [ ] Each run and each failure (exit status, last stderr line) goes to the job log; a failure changes nothing else.
  - [ ] `.tasks/DEV/config.yml` sets `[cargo, clean, --workspace]`; the DEV rule stays for a person's status change.
  - [ ] docs/help/agent.md "Build output while a ticket waits", config-reference.md, trust.md and the rule comment in `.tasks/DEV/automation.yml` say so; `view/api/types.ts` lists the field.
