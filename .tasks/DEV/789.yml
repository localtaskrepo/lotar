  text: |-
    Review: blocking. The fix is correct and tested, but the before/after screenshots the UI review rule asks for are missing (owner rule 2026-11-13, STD-97).

    **What I reviewed:** `017d20071`, 4 files under `view/`. Main (`321debdf9`) changed none of them since the base `c8ea61a59`.

    - **Matches the server:** `tool_entry` (`crates/lotar-agent/src/services/agent_job_service.rs:4560`) sets `last_message` only when `tool.status != "completed"`. The UI now does the same in both places:
      - `view/pages/AgentJobs.vue:524`: a completed tool gives `null`, and `mergeJobFields` keeps the old line.
      - `view/composables/useAgentActivity.ts:101`: same rule.
    - **Done when:** both points are met, and nothing outside the ticket changed.
    - **Failing tests first:** with main's two source files put back, both new vitests fail, receiving `"Terminal"`. With the fix they pass: `npx vitest run … AgentJobs.spec.ts AgentActivityIndicator.spec.ts` gives 35 passed.
    - **Full UI run:** 1569 of 1569 passed at load ~27. A first run at load ~50 had 8 failures, with workers taking ~21 s to start. That is the 30 s timeout this branch still has; main raised it to 120 s in DEV-779 (`83043eacf`), so the rebase at merge picks that up.
    - **Lint:** `vue-tsc`, `oxlint`, `eslint` and `prettier --check` are clean on the changed files.
    - **Not rerun:** the Rust suite and `npm run smoke`. The change is UI-only.
    - **My after screenshots:** this branch's web build served by a scratch `lotar serve`, Agents page, a mocked running job with a tool start then a completion over SSE, light and dark at 1920, 1440 and 390 px. The card keeps `Bash: npm test` in all six, with no visible problem. They are in `/tmp/dev789-review/shots/`, not attached.

    **Blocking**
    - DEV-789 has no before/after screenshots attached. The fix comment links none, and `lotar show DEV-789` lists only the two T3 links. The UI review rule says that blocks. To fix: attach the Agents page job card before and after, in light and dark at 1920, 1440 and 390 px, with a running job where a tool starts and then completes (before: `Terminal`; after: the tool's own line). Use `lotar task reference add upload DEV-789 <file>` and link them in the comment. No code change is needed.

    **Filed**
    - DEV-818 (minor, not from this diff): in an agent job, the exported `LOTAR_TASKS_DIR` wins over a scratch folder's `.tasks`. My scratch `lotar add` created a real `@fix` ticket, which I hard-deleted before a job started. `npm run seed:test-tasks` would do the same.
