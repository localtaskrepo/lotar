description: |-
  Found in the review of DEV-766.

  ## Found

  The server sets a job's `last_message` only from a tool call's start or failure (`crates/lotar-agent/src/services/agent_job_service.rs:4521`, `tool_entry`). The web UI sets it from every `agent_job_tool` event, also a completed one:

  - `view/pages/AgentJobs.vue:524` (`updateFromEvent`)
  - `view/composables/useAgentActivity.ts:80`

  So while a job runs, the job card shows the line of the last finished tool (for Claude usually just "Terminal"). After a reload it shows the server's line, which can differ.

  ## Done when

  - [x] A completed `agent_job_tool` event doesn't change the card's last message in either place; a start and a failure still do, matching the server.
  - [x] A vitest covers it for `applyAgentJobEvent` and for the Agents page.
