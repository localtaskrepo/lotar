  text: |-
    Waits for DEV-766: the code this ticket fixes isn't on main yet.

    - `agent_job_tool` and the server's `tool_entry` exist only on `agent/DEV-766` (`15f30d2f4`, status Merging); `main` (`fc82f726e`) has neither.
    - On main, `view/composables/useAgentActivity.ts` still sets the message only from `agent_job_progress`/`agent_job_message`; the `agent_job_tool` case is added by DEV-766.
    - Next: once DEV-766 is on main, rebase `agent/DEV-789` onto it, then change `updateFromEvent` (`view/pages/AgentJobs.vue`) and `applyAgentJobEvent` so that only a tool's start (`running`) or `failed` event sets the message, and add the two vitests.
