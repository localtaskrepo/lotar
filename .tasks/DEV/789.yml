  text: |-
    Done: a finished tool call no longer replaces the job card's last message; a start or failure still does, as on the server.

    - Rebased `agent/DEV-789` onto main (`c8ea61a59`, has DEV-766).
    - `view/pages/AgentJobs.vue` `updateFromEvent` and `view/composables/useAgentActivity.ts` `applyAgentJobEvent` skip `agent_job_tool` with `tool.status == completed`.
    - New vitests in `view/__tests__/AgentJobs.spec.ts` and `view/__tests__/AgentActivityIndicator.spec.ts` (running → completed → failed); both fail without the fix.
    - Checked the Done-when boxes.
