- date: 2026-10-28T03:52:12.359497+00:00
  text: 'Done: tags without a configured colour get a stable colour from their name (FNV-1a over the lower-cased name into 11 distinct hues; gray, brown and near twins left out). Configured colours always win; an invalid configured colour falls back to the automatic one. Preferences > Appearance > Tag colours turns automatic colours off per person (localStorage, default on) with a live preview. Chips wait for the project''s config before colouring so a configured colour never flashes in. Config ''Tag colours'' editor lists tags in use without a row (fetched once with has:tag, up to 1000 tasks) in their current colour; clicking adds a row prefilled with it. Docs: config.md. Tests: tagColors.spec (stability, precedence, preference), smoke ui.tag-colors extended (auto colour, Preferences switch, one-click override); npm run lint, npm test, smoke 361. Snippets attached.'
