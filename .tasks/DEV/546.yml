description: |-
  A `lotar serve --port 0 --host 127.0.0.1` from a smoke run kept running for 38 hours: started Fri 2026-11-13 01:01, parent `launchd` (PID 1), working directory `$TMPDIR/lotar-vitest-temp-BBXdQh/responsive-sprints--70243-5BYd7ZQWRCcj`, binary `/opt/homebrew/bin/lotar`. The owner had it stopped on 2026-11-14 (PID 72775). Leftover servers hold a port, a file watcher and memory, and every agent's smoke run can add one.

  ## Context

  - The workspace name points to `smoke/tests/ui.sprints-responsive.smoke.spec.ts`, which starts servers with `startLotarServer` (`smoke/helpers/server.ts`) and stops them in its own cleanup.
  - That cleanup doesn't run when the test process is killed (an agent's turn cancelled, a timeout, SIGKILL), and the server doesn't notice its parent is gone.
  - It ran the Homebrew binary, not the build under test: check how the helper picks the binary.

  ## Fix

  Make the server end with the test run that started it, even when that run is killed: for example the helper keeps a pipe the server watches, or a parent-exit watchdog in the helper's spawn. Not a new user-facing flag unless needed.

  ## Done when

  - [ ] A smoke test whose process is killed with SIGKILL leaves no `lotar serve` behind (test)
  - [ ] The helper runs the binary under test
