- date: 2026-09-10T21:42:24.743888+00:00
  text: |-
    Review fixes round (backend/docs/Rust tests only; view+smoke edits in tree are the UI agent's concurrent work):

    1. MCP scalar nulls: parse_task_update_patch now maps null->empty sentinel for reporter/assignee/due_date/effort/description, matching REST tri-state. Regressions: tools_call_task_update_null_clears_clearable_scalars + tools_call_task_bulk_update_null_clears.
    2. custom_fields: service resolve_custom_fields canonicalizes configured keys (case-fold collision -> 400), passes through unchanged keys already on the task (config removal cannot reject replace-all echoes), rejects new undeclared keys under restricted configs; CLI edit now validates+canonicalizes before merge. Regression: rest_custom_fields_legacy_keys_survive_config_removal.
    3. Explicit tags clear no longer resurrectes default_tags; get/list no longer re-apply default_tags on reads (persisted state is authoritative). Regression: rest_explicit_tags_clear_does_not_reapply_default_tags.
    4. Blank/whitespace titles rejected at create+update (service guard, all adapters). Regression: rest_update_empty_title_rejected + MCP assertion.
    5. sprints strictness unified: MCP create/update reject non-positive/non-integer entries (-32602) like REST, no silent drops. Regressions in MCP null-clears test.
    6. Sync enum strictness intentional: documented required local-value mapping in docs/help/config-reference.md; regression sync_mapped_status_outside_project_enums_fails_loudly proves per-issue ValidationError with valid values and no orphan task.
    7. MCP membership errors keep the operation envelope (-32000 'Task create failed' + data.message) while enum failures keep -32602+suggestions; mirrors mcp.members smoke expectation. Regression: tools_call_task_create_membership_error_keeps_operation_envelope.
    8. Sprint precheck fails closed on SprintService::list errors before any task write. Limit documented in code: creation is validate-first + best-effort cleanup, NOT a transaction - a crash between task write and sprint writes can leave partial state (DEV-55).

    VERIFICATION: 848/848 nextest (6 git-gated runtime skips; agent_safety_test binary excluded - sandbox git-init restriction, pre-existing). cargo fmt clean; clippy --all-targets -D warnings clean. Docs synced (openapi, api-quick-reference, mcp-tools, config-reference). Full gates incl. smoke still deferred to parent.
