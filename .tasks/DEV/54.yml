- date: 2026-09-10T20:22:36.655912+00:00
  text: |-
    Plan (backend scope, view/smoke owned by follow-up agent):
    1. Shared project-aware mutation validation: TaskService::create/update validate+canonicalize status/priority/type strings against the TARGET project's resolved config (fixes MCP/REST validating against global config). DTO enum fields become Option<String>; adapters pass raw strings. Custom-field names validated against config (wildcard default preserved).
    2. Tri-state patch contract: omitted=no-op, null=clear, value=set for clearable fields (reporter/assignee/due_date/effort/description scalars; tags/acceptance_criteria/relationships/custom_fields/sprints collections). Empty-string/empty-collection clears stay compatible. status/priority/type/title: null=omitted no-op.
    3. acceptance_criteria + custom_fields roundtrip: TaskDTO/TaskCreate/TaskUpdate gain acceptance_criteria; REST /api/tasks/add now honors custom_fields object (legacy fields kv still accepted).
    4. Atomic validated initial status: TaskCreate.status (REST+MCP+CLI --status) validated before write; no add-then-status.
    5. Creation failure safety: sprint ids pre-validated before task write; post-add sprint attach failure triggers best-effort task deletion (documented non-transactional limit, DEV-55 owns full transactions).
    6. Sync contracts: docs/openapi.json, docs/help/api-quick-reference.md, docs/help/mcp-tools.md, MCP tools.rs schemas.
    7. Regressions at public boundaries: two-project custom enums (REST create+update, MCP update/bulk), nullable clears, custom fields+criteria roundtrip, invalid create leaves no files.
    Checks: targeted cargo nextest filters, cargo fmt, clippy fast loop; full gates deferred to parent.
