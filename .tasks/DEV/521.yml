description: 'Found by claude on DEV-501, 2026-11-14: in crates/lotar-lib/src/services/agent_job_service.rs, push_event appends to the job''s log file while JOB_REGISTRY is locked (every update_job/record_and_emit), and cancel_job runs terminate_child, which scans all processes with sysinfo (and taskkill on Windows), under the same lock. Every job''s events, the API''s job list and new job starts wait on that. Check: grep for AgentLogService::append_event inside push_event and terminate_child inside the cancel_job lock. Done: the log append and the process kill run after the lock is released (collect what to write or kill under the lock), behaviour and event order unchanged, tests and smoke pass.'
