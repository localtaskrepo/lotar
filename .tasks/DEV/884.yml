  text: |-
    `lotar show <ID> --brief` cuts each comment to one line; `--comment <N>` prints one in full. The job block now names them.

    - `crates/lotar-lib/src/cli/handlers/task/show.rs`: `--brief` (text and JSON, no `history`, no report/review details), `--comment <N>` (error with the range for 0, past the end or deleted). Default `show` and `--format json show` unchanged, so `standards/scripts/repos.ts` and `staff/src/lotar.rs` keep the full JSON.
    - On the real backlog: DEV-852 9.7 k → 4.3 k characters, DEV-797 19.9 k → 6.5 k (JSON 33.6 k → 6.8 k). The rest is the description.
    - `docs/help/agent-instructions.md`: `show <ID> --brief   # one comment in full: --comment <N>`. Test `job_instructions_show_command_runs` runs that line against a scratch workspace.
    - Docs: `docs/help/task.md`, `main.md`, the `lotar-workflow` and `lotar-dev-tracking` skills.
    - Left as is: the prompt's Comments section still says "All of them: `lotar show <ID>`" (`agent_job_service.rs:1525`); that's outside the "Done when".
    - Mishap, fixed: the installed lotar 0.15.6 took `task edit -D -` literally and set this description to `-`. I restored it from my first read and added "## Done when".
    - No guidance correction.
