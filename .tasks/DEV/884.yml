description: |-
  Found by STD-362 (owner 2026-11-25: all of STD-359's proposals A-F, among them "keep long check output out of the conversation").

  Measured over the 7 days to 2026-11-25 in ~/.claude/projects/*lotar-worktrees*/*.jsonl (Bash tool results by command):
  - lotar show: 2,157 results, 7.8 M characters, 152 over 10 k. The largest group, ahead of git diff (5.8 M).
  - Check commands (cargo nextest, vitest, node --test, test:agent, npm run check): under 2.5 M in all, medians 300-600 characters; the quiet reporters already work.
  - `lotar --format json show STD-359` prints 44 k characters (one long comment plus history); the job prompt already carries the description and relationships, so most of it repeats.

  Each character stays in the session for every later request (cache reads, 95% of job tokens per STD-359).

  Done when (reporter's words): the job instructions' LoTaR CLI block names a compact form (for example `lotar show <ID>` without history, comments cut to their first lines with a way to read one in full), and the show command offers it; a test covers the block's command.

  ## Done when
  - [x] `lotar show <ID> --brief` (text) prints the fields, relationships, description, acceptance criteria and references as today, and each live comment as one line: `#N`, date, marker, author and the comment's first line, cut at 200 characters; `…` marks a cut or a comment with more lines. Report details (commits, checks, next) are left out. A last line names `lotar show <ID> --comment <N>` to read one in full. No history (text show has none today).
  - [x] `lotar --format json show <ID> --brief` prints the task as today without `history`, each comment's `text` cut to its first line the same way, `report` and `review` left out.
  - [x] `lotar show <ID> --comment <N>` prints comment N (the `#N` shown) in full: header line, all text lines, report lines; `--format json` prints that comment object. N that is 0, past the last comment or a deleted comment: error naming the range, exit 1, nothing else printed.
  - [x] `--brief` and `--comment` together: refused ("cannot be used with", exit 1). Without either flag, `lotar show` and `--format json show` are unchanged (scripts in standards `scripts/repos.ts`, staff `src/lotar.rs` read the full JSON).
  - [x] The job instructions' LoTaR CLI block (`docs/help/agent-instructions.md`) names `show <ID> --brief` and `--comment <N>` instead of `--format json show`; the builtin-template test asserts it, and a test runs the block's show command against a workspace and checks it succeeds with the cut comments.
  - [x] `docs/help/task.md` (show), `docs/help/main.md`, `docs/help/skills/lotar-workflow/SKILL.md` and `.github/skills/lotar-dev-tracking/SKILL.md` name the brief form for reading a ticket.
