- date: 2026-11-25T17:08:02.940607+00:00
  author: claude
  text: |-
    Review: blocking. The fix misses the state T3 really reports: a thread on `t3_background_wait` has status `waiting`, not `completed`, so the row still says "Waits for an answer".

    - Reviewed `8d58511cf` (`main..HEAD`, only commit; the ticket branch has nothing newer).
    - `crates/lotar-agent/src/services/agent_job_service/t3_state.rs:96`: `status == "waiting"` → `waiting` is checked before the new `waits_on_background_work` (line 98). T3 shows such a thread with `"status":"waiting"` plus `pendingBackgroundTasks`/`blockedOnThreadWait`. Sources: harnessmux `src/backend/t3.rs:580` (`resumes = status == "waiting" && …`), harnessmux HARN-3 changelog and `tests/cli.rs:979`, and lotar's own fake T3 `crates/lotar-lib/tests/dev503_harness_jobs_test.rs:887` (DEV-729: `status=waiting tasks='["npm test"]'`).
    - So the new path only fires for `completed` + background work, the ticket's wording but not what T3 sends. The real case still shows a question the owner doesn't have.
    - Fix: in `from_shown`, give background work priority over `status == "waiting"` (only `pendingRequestCount > 0` should win), e.g. `if t3_thread_waits(shown) {waiting} else if active || waits_on_background_work(shown) {running} else if status == "waiting" {waiting} …`. Add test rows with `"status":"waiting"` + `pendingBackgroundTasks` → `running`, `"status":"waiting"` + `blockedOnThreadWait: true` → `running`, and `waiting` + pending question → `waiting`. The test should fail on `8d58511cf`.
    - Also fix `docs/help/agent.md:186` to match ("ended its turn waiting" is right; nothing else to change if the behaviour does).
    - Reran: `npm ci` passed; `cargo nextest run -p lotar-agent t3_state` passed, 7 tests. That passing test doesn't cover the real case.
    - UI: the diff changes no page, component or style, only which existing label shows. I didn't start the app because the logic is wrong. After the rework, a screenshot of the Show logs row reading Running for a background-waiting thread would confirm it.
