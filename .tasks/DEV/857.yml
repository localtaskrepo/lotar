description: |-
  Found in the DEV-849 review: `from_shown` in `crates/lotar-agent/src/services/agent_job_service/t3_state.rs` maps T3 status `completed` with no `activeRunId` to `finished`. A thread that ended its turn on `t3_background_wait` (non-empty `pendingBackgroundTasks` or `blockedOnThreadWait: true` in `t3 thread show --json`) is still working: its lotar job ends only after the wake run. The row then says Finished while the job runs. T3 really shows such a thread as `status: waiting` (review 2026-11-25), sometimes `completed`.

  ## Done when
  - [ ] Status `waiting` or `completed` with non-empty `pendingBackgroundTasks` shows Running.
  - [ ] Status `waiting` or `completed` with `blockedOnThreadWait: true` shows Running.
  - [ ] A pending question (`pendingRequestCount > 0`) wins over background work: Waits for an answer.
  - [ ] `waiting` with no background work and no question still shows Waits for an answer; `completed` with none shows Finished.
  - [ ] Unit test on `from_shown` covers each row and fails on `8d58511cf`.
  - [ ] `docs/help/agent.md` T3 Code threads section matches.
