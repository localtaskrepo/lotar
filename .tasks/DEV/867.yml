description: |-
  Found in the DEV-797 review: `adopt_orphaned_job` → `finish_orphaned_job` (`crates/lotar-agent/src/services/agent_job_service.rs`) resumes a merge job's agent session (a t3 thread may still run its full suites) but never takes the machine's check lock (`agent_job_service/check_lock.rs`, port 47586). The OS freed the lock when the old lotar exited, so a second merge can run its suites beside the adopted one, which DEV-797 forbids (a merge agent "holds it until the job ends").

  Check: a test that registers an orphaned merge job, holds the lock from outside, and sees the takeover wait.

  ## Done when
  - [ ] A taken-over merge job (record `merge: true` or a merge profile) whose session is resumed takes the check lock before it resumes the session, and holds it until the job ends.
  - [ ] While another run holds the lock, the takeover waits as in DEV-797: a job-log line "Waiting for the machine's check lock (port …), held by …", the job stays `running`, and the session isn't resumed yet. Once it gets the lock after a wait, the ticket gets a comment "Waited … for the machine's check lock, held by …; the taken-over merge agent goes on now."
  - [ ] Cancelling the job while it waits (also `lotar agent cancel` from another process) ends it cancelled; the session isn't resumed.
  - [ ] The port can't be opened: the takeover goes on without the lock and says so in the job log and on the ticket (same as a merge agent's start). The process that takes over runs with `LOTAR_CHECK_LOCK_HELD=1` (a lotar run above holds it): it goes on without taking it again.
  - [ ] Unchanged: takeovers of jobs that aren't merge jobs, and merge jobs that fail at takeover before any session (killed in setup, `command` runner, no session yet) take no lock.
  - [ ] `docs/help/agent.md` says a taken-over merge job takes the lock too.
  - [ ] Test: orphaned merge job + lock held from outside → waits, no resume; lock freed → resumes and ends; the lock is free after.
