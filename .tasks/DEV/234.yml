description: 'With the shared search syntax, sort_by=title listed ascending in the CLI but descending in the web UI. Decided 2026-10-28: without order= (or --reverse) every interface sorts descending, newest first; --reverse/order=asc flips it. Relevance keeps best match first. Update CLI, docs and tests.'
