comments:
- date: 2026-11-26T19:25:26.201729+00:00
  author: claude
  text: |-
    A repo's `agent.worktree` keys now survive a home config that sets other `agent.worktree` keys.

    - Cause: the repo's `.tasks/config.yml` is the global layer, and a home or env section replaced the whole `agent.worktree` section (`crates/lotar-core/src/config/resolution.rs`). Layer keys also stopped at `agent.worktree`, so a home key set back to its default couldn't win.
    - Fix: `merge_agent_worktree` takes each key the layer sets or that differs from the default. `collect_layer_keys` now records the section's keys one by one.
    - `config show` source labels for `agent.worktree.*` are now per key (`source_labels.rs`), so `build_root` shows `global`.
    - Test: `dev265_config_presence_test::home_agent_worktree_section_merges_key_by_key` (failed before the fix, passes now).
    - Docs: `docs/help/config-reference.md` and `docs/help/precedence.md` say the section merges key by key, with the usual precedence per key.
    - Seen, not fixed: `config show` YAML leaves out `agent.worktree` and labels every default `(home)` when a home config exists, also in the installed build.
  report:
    commits:
    - hash: b3d0631fd
      what: agent.worktree merges key by key across global, home and env layers, with a test and docs
    checks:
    - command: npm run lint
      result: passed
    - command: cargo nextest run --cargo-profile dev --workspace -E 'test(/config|worktree|precedence|source_label/)'
      result: failed
      reason: 283 passed, 2 failed in dev61_reference_kinds_test; they fail the same way without this change (job worktree's target links to the build root), filed as DEV-906
    - command: npm test
