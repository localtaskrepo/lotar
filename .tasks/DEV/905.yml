comments:
- date: 2026-11-26T19:25:26.201729+00:00
  author: claude
  text: |-
    A repo's `agent.worktree` keys now survive a home config that sets other `agent.worktree` keys.

    - Cause: the repo's `.tasks/config.yml` is the global layer, and a home or env section replaced the whole `agent.worktree` section (`crates/lotar-core/src/config/resolution.rs`). Layer keys also stopped at `agent.worktree`, so a home key set back to its default couldn't win.
    - Fix: `merge_agent_worktree` takes each key the layer sets or that differs from the default. `collect_layer_keys` now records the section's keys one by one.
    - `config show` source labels for `agent.worktree.*` are now per key (`source_labels.rs`), so `build_root` shows `global`.
    - Test: `dev265_config_presence_test::home_agent_worktree_section_merges_key_by_key` (failed before the fix, passes now).
    - Docs: `docs/help/config-reference.md` and `docs/help/precedence.md` say the section merges key by key, with the usual precedence per key.
    - Seen, not fixed: `config show` YAML leaves out `agent.worktree` and labels every default `(home)` when a home config exists, also in the installed build.
  report:
    commits:
    - hash: b3d0631fd
      what: agent.worktree merges key by key across global, home and env layers, with a test and docs
    checks:
    - command: npm run lint
      result: passed
    - command: cargo nextest run --cargo-profile dev --workspace -E 'test(/config|worktree|precedence|source_label/)'
      result: failed
      reason: 283 passed, 2 failed in dev61_reference_kinds_test; they fail the same way without this change (job worktree's target links to the build root), filed as DEV-906
    - command: npm test
      result: not_run
      reason: fix job runs targeted checks
    - command: npm run smoke
      result: not_run
      reason: fix job runs targeted checks
    next: Merge; DEV-906 fixes the two dev61 tests in build-root worktrees
- date: 2026-11-26T20:59:10.603403+00:00
  author: claude
  text: |-
    Review: passed. `b3d0631fd` fixes it as "Done when" asks; no blocking or minor findings.

    - Work: one commit, `b3d0631fd`. The branch's other commits are already on main under new hashes (`git cherry main HEAD`). The commit applies cleanly onto main (`bec2f45a4`), and no commit on main since the branch point touches these files except DEV-883, which the branch already has.
    - Read: `resolution.rs` (`merge_agent_worktree`, `collect_layer_keys`, `LayerKeys::has`), `source_labels.rs`, the new test, the doc lines, and DEV-906/DEV-907.
    - Merge: the home, env and CLI layers now override `agent.worktree` key by key. All 12 fields of `AgentWorktreeConfig` are covered, and the project layer already merged key by key (`apply_agent_worktree_override`).
    - Precedence is unchanged (CLI > env > project > home > repo `.tasks/config.yml`). When home and the repo both set `build_root`, home still wins. `docs/help/config-reference.md` and `precedence.md` say so, which covers "say which wins". It is the existing order, not a new decision.
    - Test `home_agent_worktree_section_merges_key_by_key`: I didn't rerun it on the old code. Before the fix, `keys.has("agent_worktree")` replaced the whole section, so `build_root` would be null and the assertion would fail.
    - `npm ci`: passed.
    - `npm run lint`: passed.
    - `cargo nextest run --cargo-profile dev --workspace --no-fail-fast -E 'test(/config|worktree|precedence|source_label|dev265/)'`: 388 passed, 2 failed. The 2 are `dev61_reference_kinds_test` (path escapes the repository through the `target` link to the build root), already filed as DEV-906, as the fix agent said.
    - The `config show` YAML problem the fix agent saw is filed as DEV-907.
    - Worktree left clean.
