description: |-
  Found by the LOCA-571 job (local, 2026-11-26): a `build_root` set in a repo's own `.tasks/config.yml` is silently ignored when `~/.lotar` has any `agent.worktree` section, because the home section replaces the whole section instead of merging key by key. The job's first test run ran without the build root and nothing said so.

  Related: DEV-841 (cleanup doesn't sweep a project's own build_root), DEV-778.

  ## Done when
  - A project's `agent.worktree.*` keys override the home config key by key (or lotar warns when a project key is dropped), with a test.
  - docs/help/config-reference.md says which wins.
