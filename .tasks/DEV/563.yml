- date: 2026-11-15T18:01:34.472793+00:00
  author: claude
  text: |-
    Built and committed; signing with your Developer ID waits on one click at the Mac.

    - `npm run install:local` = `npm run build` + `scripts/install-local.mjs`: signs `lotar` (`net.pyxzl.lotar`) and `lotar-agent-wrapper` (`net.pyxzl.lotar-agent-wrapper`), hardened runtime, then renames both into `LOTAR_INSTALL_DIR` (default `~/.local/bin`)
    - `LOTAR_SIGNING_IDENTITY` wins; set but missing → stops. Developer ID missing → ad hoc + warning. codesign fails or hangs (120 s timeout) → stops, old binaries stay (seen for real)
    - Docs: `docs/help/install.md#build-from-source` (incl. replacing the Homebrew lotar), `docs/release-guide.md`
    - local skill: filed [LOCA-385](https://local.pyxzl.net/task/LOCA-385)
    - Blocker: `codesign --sign "Developer ID Application: Ravi Gairola (3HKD37M482)"` hung 8.5 min here (DEV-564's harnessmux too): macOS is asking whether codesign may use the key

    **Question:** at the Mac, in Terminal, run `cp /bin/ls /tmp/signtest && codesign --force --sign "Developer ID Application: Ravi Gairola (3HKD37M482)" /tmp/signtest` and choose **Always Allow** in the keychain dialog, then answer "done" here? That unblocks lotar and harnessmux both.
  report:
    commits:
    - hash: 7c81ee16
      what: npm run install:local signs and installs lotar + lotar-agent-wrapper
    checks:
    - command: npm run lint
      result: passed
      reason: lint:agent
