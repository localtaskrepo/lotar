      result: passed
      reason: test:agent, 2206 Rust + 1547 UI + release/hooks incl. 9 new install-local tests
    - command: npm run smoke
      result: passed
      reason: 404 tests
    - command: ad-hoc install, real codesign
      result: passed
      reason: Identifier=net.pyxzl.lotar, flags adhoc,runtime, --version runs
