description: |-
  Child of standards STD-138 (https://standards.pyxzl.net/task/STD-138). Owner by voice, 2026-11-15: "sign every local install of lotar, opgate and harnessmux, including builds from source, with my Developer ID, so keychain and firewall approvals survive new builds. Land it in the next version."

  ## Found
  - Releases are signed (DEV-482: Developer ID, identifier `net.pyxzl.lotar`, hardened runtime, notarized). A build from source is not: `/opt/homebrew/Cellar/lotar/0.15.1/bin/lotar` (copied in by hand 2026-11-15 01:05, no INSTALL_RECEIPT) shows `Signature=adhoc`, `Identifier=lotar-45c3c39a9986a3af`. The macOS firewall then blocked it on the LAN until the owner added an exception by hand (Cellar 0.15.0, Developer ID signed, was allowed).
  - There is no documented way to install lotar from source on this Mac; agents improvise it. local's `skills/lotar-services.md` ("Code signature and macOS grants") says "never re-sign the release binary" and treats an ad-hoc build as a release bug.
  - Identity on this Mac: "Developer ID Application: Ravi Gairola (3HKD37M482)" in the login keychain (`security find-identity -v -p codesigning`). Unchecked: whether codesign may use its key without a prompt; if it asks, an agent's install waits for "Always Allow" at the Mac once.

  ## Done when
  - [ ] One documented install-from-source step (docs/help/install.md, and the release guide where it applies) builds lotar and `lotar-agent-wrapper` and signs both with that Developer ID, identifier `net.pyxzl.lotar` (and a fixed one for the wrapper), hardened runtime, before it puts them on PATH. No wrapper script around cargo if an npm script or documented command does it.
  - [ ] `npm run install:local` is that step: `npm run build`, then `scripts/install-local.mjs` installs both binaries into `LOTAR_INSTALL_DIR` (default `~/.local/bin`, as `install.sh`). Wrapper identifier: `net.pyxzl.lotar-agent-wrapper`.
  - [ ] `LOTAR_SIGNING_IDENTITY` (name or SHA-1 from `security find-identity`, `-` for ad hoc) wins over the Developer ID default. Set but not found in the keychain: the step stops, nothing replaced (an explicit choice is never downgraded to ad hoc).
  - [ ] Identity missing (another machine, CI): the build is ad-hoc signed and the step prints a warning naming the identity and saying macOS will ask for firewall and file-access grants again. CI and contributors' builds keep working.
  - [ ] Identity present but codesign fails (locked keychain, denied prompt) or the signed binary doesn't verify or start: the step stops with codesign's error and replaces neither installed binary. Both are signed in staging files first and then renamed over the old ones, so a running server keeps its old file.
  - [ ] Linux and Windows: no signing, same staged install.
  - [ ] `codesign -dvv` on the installed source build shows `Identifier=net.pyxzl.lotar`, `TeamIdentifier=3HKD37M482`; local's `skills/lotar-services.md` is updated (filed there if it needs a LOCA ticket) so it no longer calls a signed source build wrong.
  - [ ] Checked in the next version: a fresh source build installed over the running one, `/usr/libexec/ApplicationFirewall/socketfilterfw --listapps` needs no new exception and the servers answer on the LAN.
