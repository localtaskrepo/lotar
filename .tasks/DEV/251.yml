comments:
- date: 2026-10-30T04:46:19.925715+00:00
  text: 'Plan: custom fields currently render as unstyled ghost text buttons appended to Quick picks, raw names, silently capped at the first 6 configured fields (useCustomFilterPresets / SprintsList slice). Replace with a ''Custom field'' dropdown in the Filter fields grid, styled like Status/Priority: lists every known field (config + task values), a find box when >8 fields, marks fields that already have a filter, picking one pre-fills field:name= in the main search with value suggestions (keeps DEV-98 single-entry search; no new text input). Remove the Quick picks custom section and the redundant customPresets prop/composable on Tasks/Board/Calendar/Sprints/Insights/Dependencies. Checks: FilterBar/SmartListChips unit tests, browser screenshots desktop/dark/390px with 12 fields, lint/test/smoke.'
- date: 2026-10-30T04:55:27.907958+00:00
  text: |-
    Outcome: custom fields moved out of Quick picks into a 'Custom field' dropdown in the Filter fields grid (view/components/FilterBar.vue), styled like Status/Priority. Lists every known field (config custom_fields + names from task values, '*' skipped, case-deduplicated) instead of the old silent cap of 6; a find box appears past 8 fields (Enter picks the first match); fields with an applied filter are bold with a value pill (exclusions shown as 'not x'), and the trigger reads 'Custom field: a, b'. Picking a field still pre-fills field:name= in the main search with value suggestions (DEV-98 single-entry search kept, no new text input). Escape/outside click close it and return focus. Removed the redundant customPresets prop, SmartListChips custom section and useCustomFilterPresets from Tasks/Board/Calendar/Sprints/Insights/Dependencies; docs/help/serve.md updated.
    Evidence: 3 new FilterBar unit cases + 2 migrated preset cases; ui.filter-panel smoke migrated to open the picker (desktop 1600 + mobile 390, popup within viewport). Browser check against a 12-field scratch workspace in light/dark/390px, no horizontal scroll; screenshots attached. npm run lint:agent clean; npm run test:agent 1866 Rust + 1395 UI passed; npm run test:smoke:agent (build-first) 98 files / 367 tests passed.
    Remaining: none in scope. Changes uncommitted. Follow-up DEV-252 (seed script writes custom_fields in an ignored format). DEV-98 gained a 'related DEV-251' link from mention auto-linking in my plan comment.
    Guidance: no durable finding.
