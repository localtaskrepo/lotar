- date: 2026-11-16T03:15:04.430118+00:00
  author: claude
  text: |-
    Fixed: a busy ticket's start asks T3 Code nothing, and an idle answer is cached for 30 s.

    - `start_job_with_tasks_dir_mode` checks the registry and the active-jobs file first. `running_t3_thread` runs only when the ticket has no active job. The check inside the registry lock stays, for races.
    - `RUNNING_T3_THREADS` is now `T3_THREAD_ANSWERS`: ticket → `(Instant, threads asked, Option<(thread, job)>)`. Running and idle answers are both cached for `T3_THREAD_RECHECK`, but only while the ticket's earlier threads stay the same. A job that ended since then means T3 Code is asked again at once.
    - The lock is held only to read and write the cache, not while `t3` runs. The return type is unchanged. I told the [DEV-600](https://lotar.pyxzl.net/task/DEV-600) thread, which rebases onto this.
    - New test `a_start_on_a_busy_ticket_or_after_an_idle_answer_asks_t3_code_nothing` (`dev503_harness_jobs_test.rs`): after a fix job, three starts (queued, busy, after cancel) together run `t3 thread show` once.
    - `docs/help/agent.md` says what is cached.
