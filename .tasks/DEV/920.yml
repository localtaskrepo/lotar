description: |-
  ## Found (review of DEV-912, 2026-11-26)
  - DEV-912's `adopt` (`crates/lotar-agent/src/services/agent_job_service/resumed.rs`, `earlier_request`) reads the request from the earlier job's `run_inputs` log line. A taken-over job writes none: local `job-20261126T204940.803Z-13` (a takeover) has 0 `run_inputs` lines, `job-20261126T204500.272Z-3` has 1.
  - So when T3 Code resumes a taken-over job's thread again (LOCA-631: `job-20261126T231028.491Z-28` took over `-13`), the new job's request is the fallback `GO_ON`. Its usage-limit retry still continues the thread, but a retry that runs in a new session (`run_again_in_new_session`, session `fresh`) gets "Go on ... in this thread" instead of the original request.
  - The paused job's queued limit retry (`limit_retries` in `on_ticket`) holds the original request, and `adopt` removes it unused.

  ## Done when
  - [ ] A test: a job taken over from a taken-over job gets the first job's request (prompt and profile), also after a usage-limit pause in between.
  - [ ] `adopt` takes the request from the limit retry it replaces, else from the earlier job's record or log, else `GO_ON`.
