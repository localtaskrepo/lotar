    - `crates/lotar-agent/src/services/agent_job_service/resumed.rs`: new `takeover_request` used by `adopt`. Order: the usage-limit retry it replaces (`limit_retries`, now read before it is removed), else the earlier job's `request` in this process's registry, else the earlier job's `run_inputs` log line, else `GO_ON`. Profile stays the thread's (`resumed.agent`).
    - `AgentQueueEntry::request` is now `pub(crate)` (`agent_queue_service.rs`).
    - New test `a_job_taken_over_from_a_taken_over_job_asks_the_first_jobs_request` (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs`): takeover → limit pause → takeover → limit pause → takeover completes → takeover → limit pause; every retry is `fix` / "Work on it".
    - For that test, `LOTAR_AGENT_RESUMED_LOOK_SECONDS` overrides the 30 s look interval; documented in `docs/help/agent.md` with the request order.
    - Known gap: a takeover of a job that a now-gone process took over, with no limit retry queued, still gets `GO_ON`, because that job writes no `run_inputs` line.
    - No guidance correction, no durable finding.
