description: |-
  Found in the DEV-767 review (f384ce022).

  `view/components/AgentRunInputs.vue` sets `loaded = true` after a load that returns `inputs: null`, so `toggle()` never loads again. Open the button on a queued job, or a running job still in its worktree setup: it says "Not recorded for this job" until the page reloads, also after the first turn has written its `run_inputs` line.

  Fix: count a `null` result as not loaded while the job hasn't ended (or reload on every open while it runs). Add a Vitest that opens it with `null`, then with a record.

  ## Done when

  - [ ] Opening Instructions after a load that returned `inputs: null` fetches again; a returned record is cached and not fetched again on the next open.
  - [ ] While a fetch runs, a second open doesn't start another one.
  - [ ] A failed fetch shows its error and the next open retries (unchanged).
  - [ ] `view/__tests__/AgentRunInputs.spec.ts`: open with `null` → "Not recorded for this job"; close, reopen with a record → the record shows; reopen → no third fetch.
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass.
