comments:
- date: 2026-11-12T03:03:58.156447+00:00
  text: 'Fixed in 0e19ccd (branch agent/DEV-344). Cause: the Columns dialog used the browser''s default drag image. Chrome paints that image from the element''s stacking context, clipped to the element, so inside the scrolling modal a neighbouring column (Done) could show up in the ghost. The drop logic was always right. Fix: on dragstart the dialog clones the dragged status or column header, places the copy off-screen in document.body and passes it to setDragImage. The copy is removed right after. Checks: new unit test in view/__tests__/BoardColumnsDialog.spec.ts (it failed before the fix). In a temporary Playwright check in Chromium, with the board scrolled, the drag image showed only the dragged status or header and the drops still worked. npm run lint, npm test and npm run smoke all pass. The Rust test dev279 cross-process jobs failed once, then passed on rerun (flaky, unrelated). Not checked: the real OS drag image can''t be captured in automation, and Safari/Firefox weren''t tried by hand.'
