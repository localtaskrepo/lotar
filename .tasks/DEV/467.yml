- date: 2026-11-13T11:18:35.710508+00:00
  author: triage
  text: 'Answer to the merge review''s question (should the fix agent implement durable recovery of failed end-rule actions before merge): yes. The ticket''s own first Done-when item says a job that ends while T3 Code is unreachable "still applies its end rules and the outcome its agent recorded, or retries them once the server answers", with a test. Losing end-rule actions after the WouldBlock retries run out leaves a job without an explicit outcome InProgress with no job running, so that item is not met. Keep the recorded outcome pending as done now, do the same for the end-rule actions (or replay only the parts that did not run, so a rule''s earlier parts are not repeated), add a test for retries running out followed by recovery, then send it to review again. No decision of the owner is needed: this is the ticket''s stated scope. Source: DEV-467 description, Done when item 1.'
- date: 2026-11-13T11:22:31.493478+00:00
