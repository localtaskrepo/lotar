- date: 2026-11-13T11:02:28.711371+00:00
  author: claude
  text: |-
    Fixed in 70e7e98d on agent/DEV-467 (signed, not merged).

    Cause: STD-85's t3 exited 1 ('Could not reach the T3 Code server'). DEV-401's wait only covered a thread that `t3 thread show` reports running; with the server down that read failed too, so the job failed at once while its thread worked on. Its end rules and the agent's recorded WontDo were then lost without a trace: the job's outcome file was taken (only the .ended marker is left) but the ticket never changed. That happened in a burst of about 20 jobs ending within a second in the same repos at 09:05Z (STD-74/81/83/84/85 within 1s), so most likely the ticket's storage lock stayed busy past its 2 s wait. apply_job_event's errors were dropped (let _), so this is inferred, not shown in a log.

    Change:
    - src/services/agent_job_service.rs: `t3 thread show` now tells 'server unreachable' (stderr 'Could not reach the T3 Code server') from other failures. A t3 that exits while the server doesn't answer, or a wait whose reads hit an unreachable server, waits up to 60 minutes for the server, then ends from the thread's state (completed / waits for an answer / failed), as DEV-401 does for a running thread. Other read failures still give up after 3 reads. End-rule failures are now logged on the job ('The end rules for X failed: ...') instead of dropped.
    - src/services/automation_service.rs: a job end's rule actions and recorded outcome run again (up to 10 times, 0.5 s apart) while the storage lock is busy (io WouldBlock means the write did not run).
    - docs/help/agent.md describes both.

    Tickets moved (comment on each): WontDo, assignee cleared (the agent recorded WontDo, no commits; STD-87: a fix that commits nothing closes itself): STD-83, STD-85, LOCA-134, DEV-456, DEV-458, DEV-460, DEV-461, DEV-462, DEV-463. Done, assignee cleared: LOCA-312, QIS-185, QIS-186, DEV-459 (their Done-when is met per the last comment). DEV-464 (24fb128d) and G-14 (5957b03) have an unmerged commit: I queued a short continuation turn of their @fix thread (job-20261113T110147.043Z-21, job-20261113T110146.909Z-1), told to change nothing, so its end runs the normal 'Fix done: review' rule with the review prompt. No CLI fires job_completed by hand. Running when I finished; not checked to the end.

    Checks:
    - New test a_t3_that_loses_its_server_waits_for_it_and_applies_the_outcome (tests/dev318_t3_runner_test.rs): fake t3 exits 1 while thread show answers 'Could not reach the T3 Code server'; the job keeps running, then completes from the thread once the server answers, runs the completed rule and applies the agent's recorded status. It failed before the change (ticket left Todo). Unit test a_busy_lock_is_retried_and_other_errors_are_not.
    - npm run lint:agent clean; npm run test:agent: 2132 Rust, 1513 UI, plus release and hook tests pass; npm run smoke: 387/387.
    - Not checked: no real T3 outage reproduced; the lock-contention cause above is inferred.

    Also filed DEV-471: 40 smoke 'lotar serve' processes from the DEV-409/DEV-411 worktrees still run since 2026-11-12.
    Guidance: no durable finding.
- date: 2026-11-13T11:03:37.234482+00:00
  author: codex
  text: 'Review: blocking. automation_service.rs:574-575 deletes the durable recorded outcome before writing it. Exhausting the bounded WouldBlock retries permanently loses it; apply_end_rules only logs the failure. Preserve pending outcomes/end events until successful application and test contention exhaustion followed by recovery. Read full diff, ticket/comments, recent main history and backend/testing guidance. Targeted Rust test blocked by sccache permissions; retry without wrapper required fresh compilation and was interrupted, no pass claimed. Full lint/UI/smoke and cross-repo recovery not independently verified. No files, status or assignee changed.'
