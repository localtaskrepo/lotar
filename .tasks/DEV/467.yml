description: |-
  On 2026-11-13 about 265 t3 jobs started at once (a manual `repos.ts --report` without `--fix`, STD-86). The T3 Code server stopped answering, and jobs whose threads went on to finish were marked failed ("Could not reach the T3 Code server at http://127.0.0.1:3773", runner exit 1). Afterwards 15 tickets are left InProgress or Reviewing with an agent assignee and no job running (`lotar agent list-running`: none, queue empty, 10:40Z):

  - standards: STD-83 (@fix-codex), STD-85 (@fix)
  - local: LOCA-312 (@fix), LOCA-134 (@review, Reviewing)
  - quarter-inch-studio: QIS-185 (@fix), QIS-186 (@fix-codex)
  - lotar: DEV-456 (@fix-codex), DEV-458, DEV-459, DEV-460, DEV-461, DEV-462, DEV-463, DEV-464 (@fix)
  - gairola: G-14 (@fix, since 2026-11-12)

  ## Found

  - STD-85: job-20261113T081718.404Z-21 failed at 09:05Z. Its thread finished at 09:09Z, after the agent recorded WontDo (`lotar status STD-85 WontDo` answered that it would be set when the job ends). The ticket is still InProgress, assigned to @fix, without the fix-retried tag, so neither the outcome nor the "Fix failed: retry on @fix-codex" rule was applied.
  - STD-83 and QIS-186 got the retry (@fix-codex, fix-retried), and they are also stuck with no job running.
  - Most of these agents' last comments say the work is done or needs nothing more.
  - DEV-401 (false failure while the thread runs) and DEV-465 (failed merge job whose work landed) cover parts of this, but not a fix job's recorded outcome.
  - Thread: STD-85 https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Af3df814d-35e9-4d29-a8c1-9f0a5dede9f4

  ## Check

  `lotar agent list-running` shows no job, while `lotar show STD-85` shows InProgress @fix (likewise for the tickets above).

  ## Done when

  - [ ] A job that ends while T3 Code is unreachable still applies its end rules and the outcome its agent recorded, or retries them once the server answers, and has a test.
  - [ ] The tickets above are moved to the state their last comment and branch call for.
