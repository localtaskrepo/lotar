- date: 2026-11-15T01:55:42.178232+00:00
  author: claude
  text: |-
    Merge blocked: rebasing onto `main` (`bfac50a1`) conflicts with DEV-528, and resolving it needs new code. I aborted the rebase. `3b983482` is unchanged on `t3/job-end-rules-t3-outage`. Nothing merged or pushed, no checks ran.

    - `crates/lotar-lib/src/services/automation_service.rs` `apply_job_event`:
      - main (DEV-528) collects the matching rules first, works out `rule_assigns`, and filters the recorded outcome with `without_agent_reporter_hand_back` (a hand-back to an agent reporter is dropped when an end rule assigns the ticket).
      - This branch applies end actions through `apply_durable_end_action` with `retry_while_busy`, and takes the outcome with `end_and_take_outcome(tasks_dir, job_id, ticket_id)`, deferring it or settling it.
      - Why it's not mechanical: an outcome deferred because the lock is busy is saved before DEV-528's filter runs. `apply_pending_outcomes` then applies it later, unfiltered, so the dropped hand-back to an agent reporter comes back. Keeping both needs the saved outcome filtered (or `rule_assigns` saved with it), an outcome the filter drops settled, and a test. That's new logic, not a conflict resolution.
    - `crates/lotar-lib/src/services/agent_job_service.rs`: mechanical. Main's `ticket_state(tasks_dir, ticket_id)` plus this branch's logging of end-rule failures.
    - `docs/help/agent.md`: main added a DEV-528 line next to the paragraph this branch extends. Keep both.
    - Next: the fix agent rebases, applies DEV-528's filter before the outcome is saved or deferred (with a test: a busy lock, then recovery, then the agent-reporter hand-back is still dropped), reruns `npm run lint`, `npm test` and `npm run smoke`, and sends it to review.
