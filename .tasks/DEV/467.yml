  text: |-
    Rework: the last review found no code defect, only a runner failure in the sandbox. I filed it as DEV-551 and reverified. No code change, HEAD is still `3b983482`.

    - The `xcrun_db` leftover comes from Apple's `xcrun` (the cc/ld shim rustc links through). In a sandbox it can't write its cache to the usual per-user folder, so it writes to the runner's `TMPDIR`, and `scripts/rust-test-runner.mjs` (DEV-315) then fails a passing run. The same thing happened in the DEV-478, DEV-487 and DEV-524 reviews. It doesn't happen outside the sandbox: `RUSTC_WRAPPER= npm run test:rust -- pending_outcome_tests` after a forced relink leaves nothing. Filed as DEV-551 (health, related to DEV-467 and DEV-315), following the owner's INBOX-35 rule: file a ticket for the issues, then retry.
    - Reran: `npm run test:rust -- pending_outcome_tests retry_while_busy_tests a_taken_outcome_stays_pending a_t3_job_that_loses_the_server dev320`: 14 of 14 passed, runner exit 0. This includes the outage integration test `a_t3_job_that_loses_the_server_completes_from_its_thread_and_runs_its_end_rules`.
    - Skipped, because they already passed on HEAD `3b983482` (00:17 comment): `npm run lint`, `npm test` (2180 Rust, 1537 UI), `npm run smoke` (401).
    - Ticket states rechecked: all 15 are WontDo or Done. DEV-464 and G-14 are still assigned to @merge.
    - For the next review: until DEV-551 lands, run the Rust tests with sccache (approved permissions, as on 2026-11-13 19:18). With `RUSTC_WRAPPER=`, an `xcrun_db` leftover means the sandbox, not the change.
