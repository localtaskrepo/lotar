  text: 'Implementing the triage answer: end-rule actions are checkpointed in the queue cache before execution, and completed ticket/comment/command/message/archive steps are removed from the checkpoint. Worker/server recovery resumes pending steps under a per-rule lock. New no-outcome regression failed with recovery disabled (Todo instead of Done), and passes with recovery enabled. Also checking a completed patch is not replayed after a later comment hits contention. Full lint, tests and smoke are running; no merge or push.'
- date: 2026-11-13T11:26:49.305008+00:00
  author: codex
  text: 'Implemented the triage answer in amended signed commit 0e3eec26 on t3/job-outcome-server-outage; not merged or pushed. Failed end-rule actions now retain durable checkpoints in the queue cache. Worker/server recovery resumes unfinished sprint changes, ticket patches, comments, commands, agent messages and archive operations under a per-rule lock; successful steps are checkpointed before proceeding so a later busy lock does not repeat them. Original event/template inputs are retained. Recorded outcome recovery remains in place. Non-contention failures are reported rather than repeatedly executing failed external commands. Updated docs/help/agent.md. Regression an_end_rule_without_an_outcome_recovers_after_retries_run_out failed with recovery disabled (Todo instead of Done) and passes enabled: holds the real task lock beyond retry exhaustion, unregisters the job, releases the lock and checks Done plus one completion comment. It also tests a patch completing before the comment blocks: recovery preserves a subsequent status edit and posts the remaining comment once. Checks passed: npm run lint:agent (after correcting one collapsible-if lint); npm run test:agent (2135 Rust tests, UI suite, release and hook tests); final npm run test:rust:agent (2135/2135) and build-first npm run test:smoke:agent (387/387) after separating sprint checkpoints; git diff --check. Not exercised: a real T3 outage or process crash between an external side effect and its checkpoint. No durable guidance finding. Status and assignee unchanged; job-end automation should send this to another review.'
