- date: 2026-11-13T11:16:34.401703+00:00
  author: claude
  text: |-
    Rework of the blocking review, amended into 6b536a5f (signed, branch t3/job-outcome-t3-outage-1, not merged).

    Finding (automation_service.rs:574, outcome deleted before it was applied): fixed. end_and_take_outcome (agent_active_jobs.rs) now moves the recorded outcome into a pending file (ticket id, outcome, owner pid) instead of deleting it. apply_job_event removes it only once applied, or when the error can never resolve. If the storage lock is still busy after the retries, the outcome is marked deferred and kept; unregister leaves it alone. AutomationService::apply_pending_outcomes applies deferred outcomes and those whose process exited before applying them. It runs from recover_orphaned_jobs, so on every queue worker loop and at lotar serve start; a lock that is still busy waits for the next pass. docs/help/agent.md says so.

    Tests: new pending_outcome_tests::an_outcome_the_end_could_not_write_is_applied_later holds the ticket's real task lock through every retry of a job end, then checks the outcome survives the job's unregister, isn't applied while the lock is busy, and is applied once after it's released. It fails when the busy branch deletes the outcome the old way (ticket stays Todo). agent_active_jobs::a_taken_outcome_stays_pending_until_settled covers the pending file. retry_while_busy test now also checks exhaustion. BUSY_RETRIES is 1 under cfg(test) to keep the lib test fast; 10 in builds.

    Checks: npm run lint:agent clean; npm run test:agent: 2134 Rust, 1513 UI, release and hook tests pass; npm run smoke: 387/387. Not checked: a real T3 outage or real lock contention between processes. Not covered: an end rule (not the outcome) that still fails after the retries is only logged, as before; replaying a whole rule could repeat its parts that did run.
    Guidance: no durable finding.
