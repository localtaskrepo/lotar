- date: 2026-11-26T01:18:53.374835+00:00
  author: claude
  text: |-
    Fixed: the test clicked the card's placeholder Instructions button while the logs were still loading.

    - Cause: while `/api/jobs/logs` loads, `view/pages/AgentJobs.vue` shows a standalone `AgentRunInputs` with its own "Instructions" button. Under load the test clicked that one; when the log arrived it unmounted and `AgentJobLog` mounted with its panel closed, so `Settings` never showed.
    - Reproduced: with `/api/jobs/logs` delayed 1.5 s (temporary `page.route`), the old locator fails (log panel never opens); the fixed test passes.
    - Fix in `smoke/tests/ui.agent-jobs.smoke.spec.ts`: wait for `.job-log__header`, then take the Instructions button from it.
    - The user can hit the same thing, so I filed it as a finding: `ui:agent-jobs-instructions-remount`.
  report:
    commits:
    - hash: 9bb8c306a
      what: the test waits for the loaded log and clicks the Instructions button in its header
    checks:
    - command: npm run -s test:smoke:quick:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts -t 'Instructions button'
      result: passed
      reason: 3 of 3, plus a run with /api/jobs/logs delayed 1.5 s
    - command: npx prettier --check, smoke tsc, oxlint on the file
      result: passed
