description: 'Found: in DEV-769''s merge, `npm run -s smoke` on `bd4c626cb` failed this test in `smoke/tests/ui.agent-jobs.smoke.spec.ts` (already in the serial `wall-clock` group): `/api/jobs/inputs` answered ok, but `getByRole(''table'', { name: ''Settings'' })` never became visible (15 s). It passed 5 out of 5 alone and in 3 more full runs. Check: `npm run -s test:smoke:quick:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts -t ''Instructions button''` repeated, and the full `npm run -s smoke`. Done: the cause is found (for example the log remounting and closing the panel, or an inputs response with no record yet) and the test waits on it, so it no longer fails under load.'
