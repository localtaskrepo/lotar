- date: 2026-11-26T06:17:14.085303+00:00
  author: claude
  text: |-
    Review: passed. The test fix in `9bb8c306a` matches the cause, and the targeted test passed 5 of 5.

    - Read: the ticket and fix comment, DEV-888, DEV-769, `smoke/vitest.config.ts` (the spec is already in `wall-clock`), and the recent commits on main to the touched files.
    - The cause holds in the code. In `view/pages/AgentJobs.vue:280-285`, while `logsLoading` is true the page shows a standalone `AgentRunInputs` with its own Instructions button. Once the log arrives, `AgentJobLog` (`v-else`) replaces it, and its panel starts closed. `loadLogs` runs only once, when the logs open (`:780`), so the header can't remount after the test waits for it.
    - The fix waits for `.job-log__header` and takes the button from it, which covers what "Done" asks: the test waits on the cause. The product side is DEV-888, and the test still works with that fix.
    - Only the spec file changed: no stray files, no second branch. UI review is not needed because no pages, components or styles changed.
    - Reran: `npm ci` passed. `npm run -s test:smoke:quick:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts -t 'Instructions button'` passed 5 of 5 after `npm run -s build:smoke`. The first 3 tries failed before running because the worktree had no binary. `npx prettier --check` and `npx oxlint` on the file are clean.
    - Not rerun: the fix agent's 1.5 s delay repro (it needs a temporary edit). Instead, the cause was confirmed by reading the code.
    - Findings: none. Tickets filed: none.
