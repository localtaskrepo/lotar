  text: |-
    The shipped pipeline template test now waits up to `JOB_END_LIMIT_MS` for its three jobs and for Done.

    - `crates/lotar-lib/tests/agent_automation_integration_test.rs:2376`: `wait_for_completed_jobs(.., 3, 6000)` → `JOB_END_LIMIT_MS`
    - Line 2379: the Done wait goes from `10_000` → `JOB_END_LIMIT_MS`
    - Both waits still stop as soon as the state is reached. The limit only catches a hang.
    - Not changed: the two-job wait at line 456 is outside this ticket's scope (it covers three-job waits only)
    - The check ran at load average 17 to 25, not 35+
