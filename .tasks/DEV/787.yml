  text: |-
    The shipped pipeline template test now waits up to `JOB_END_LIMIT_MS` for its three jobs and for Done.

    - `crates/lotar-lib/tests/agent_automation_integration_test.rs:2376`: `wait_for_completed_jobs(.., 3, 6000)` → `JOB_END_LIMIT_MS`
