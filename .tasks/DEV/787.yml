- date: 2026-11-22T19:07:01.838025+00:00
  author: claude
  text: |-
    Review: passed. Both waits on the shipped pipeline test now use `JOB_END_LIMIT_MS`, which is what "Done" asks for.

    - Reviewed `6ec1ebf01` (`main..HEAD`, 1 commit, 2 lines in `crates/lotar-lib/tests/agent_automation_integration_test.rs`). The ticket branch has no newer commits.
    - Line 2376: the three-job wait goes from `6000` (raised to the 30 s floor) to `JOB_END_LIMIT_MS`. Line 2379: the Done wait goes from `10_000` to `JOB_END_LIMIT_MS`. Both waits still return as soon as the state is reached (`wait_for_completed_jobs`, `wait_for_task_status`), so the test isn't slower.
    - This matches what DEV-772 (`60a9cf1c5`) did for the same pipeline at lines 2586, 2618 and 2691. No commit on main since then touches this file.
    - I found no other wait for three jobs in the file. The REV pipeline around line 2900 waits for one job per step, and line 456 waits for two jobs, so neither is in this ticket's scope.
    - Reran `npm ci` (ok) and `npm run -s test:agent`: passed at load average 26 to 86. The load reached the 35+ the ticket names during the run.
    - Change is test-only: no stray files, no decision for the owner, no tickets filed.
