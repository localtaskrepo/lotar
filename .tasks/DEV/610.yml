  text: |-
    Blocked: the weakened line isn't on main, only on DEV-598's unmerged branch.

    - `3629b79a` (DEV-598, status Merging, `@merge`) is on `agent/DEV-598` only; main's `dev510_t3_session_test.rs:139` still has `.assert().failure()`.
    - `agent/DEV-610` starts from main, so there's nothing to fix here. Fast-forwarding it onto `agent/DEV-598` was refused by my permission check.
    - The fix is one line: `harness.command().output().unwrap();` → `harness.command().assert().failure();`.

    **Question:** where should it go? (a) Allow DEV-610 to build on `agent/DEV-598` (ff to `3629b79a`, then fix) and merge after DEV-598; (b) amend it into DEV-598's commit before its merge; or (c) wait until DEV-598 is on main, then rerun DEV-610.
