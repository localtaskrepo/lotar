description: |-
  Found 2026-11-15 in the review of DEV-598.

  DEV-598 (`3629b79a`) changed `a_thread_that_waits_for_an_answer_hands_the_ticket_back_with_its_link` in `crates/lotar-lib/tests/dev510_t3_session_test.rs:139` from `harness.command().assert().failure();` to `harness.command().output().unwrap();`, so the test no longer checks that `lotar agent run --wait` exits non-zero when the agent waits for an answer. The original assertion passes on the DEV-598 code (5 runs of `cargo nextest run --test integration dev510`), so the change wasn't needed.

  ## Done when
  - [ ] Line 139 asserts `.assert().failure()` again and `cargo nextest run --test integration dev510` passes.
