description: |-
  Found in the DEV-594 review (043e01bd). T3 Code reports a thread that waits for an answer as status running with pendingRequestCount > 0 (harnessmux 0.1.9 backend/t3.rs RunState). running_t3_thread treats that as running, so after a handback the owner's next job on the ticket (a retry option, a reassignment) waits in the queue until the T3 question is answered, and no comment says why. It also ignores activeRunId, which harnessmux counts as running. Check: leave a thread waiting for an answer, assign the ticket to another profile, see the queue entry wait silently.

  Builds on DEV-594's `running_t3_thread` (`043e01bd`, not on main yet) and touches the same function as DEV-599.

  ## Done when
  - [ ] The owner decided whether a thread that waits for an answer (`pendingRequestCount > 0`) holds later jobs on its ticket ("Done when the owner decides whether such a thread blocks"), and the check follows that decision.
  - [ ] A thread counts as running when its `status` is `running` or its `activeRunId` is not null, as harnessmux `RunState` says; either one is enough. A waiting thread's `pendingRequestCount` wins over both, as the owner decides.
  - [ ] A queue entry held by such a thread comments on the ticket once, naming the thread (link) and the job and what lets it go on (the thread ends; for a waiting thread: answer it in T3 Code). Rechecks every 30 s add no comment; the entry's start adds none.
  - [ ] `lotar agent run --wait` fails with a message that says whether the thread runs or waits for an answer.
  - [ ] A `t3 thread show` that fails or returns no status doesn't hold the ticket (as today) and comments nothing.
  - [ ] Tests in `dev503_harness_jobs_test.rs`: `activeRunId` set with a non-running status holds the job; a waiting thread does what the owner decided; the comment is written once over several queue retries. Each fails before the change.
  - [ ] `docs/help/agent.md` (T3 section, queue) says the same.
