- date: 2026-11-16T04:12:05.285498+00:00
  author: claude
  text: |-
    Done as you decided (A): a T3 thread that waits for an answer holds later jobs, and the queue says so once.

    - `running_t3_thread` (`agent_job_service.rs`) holds on status `running`, a non-null `activeRunId` (as harnessmux counts it) or `pendingRequestCount > 0`. It now returns thread, job, link and waiting.
    - `lotar agent run --wait`: `...: the T3 Code thread <thread> of the job <job> still runs` / `waits for an answer`.
    - Queue (`agent_queue_service.rs`): a held entry comments once per entry and thread, with the thread's link and "Answer it in T3 Code" for a waiting thread. The new `held_by` on the entry remembers this across worker restarts; old queue files still load. The cached T3 answer is reused, so no extra `t3` call.
    - Tests (`dev503_harness_jobs_test.rs`): `a_thread_with_an_active_run_or_a_question_holds_the_ticket`, `a_queue_entry_held_by_a_waiting_thread_says_so_once`. Both fail on the old source; the second times out with no comment.
    - Docs: `docs/help/agent.md` (T3 section, queue).
    - Base: branch = main + DEV-599 `dcfbccef` (as `76f3bdca`) + this fix. DEV-599 is still in review.
    - After the full runs I made one more change: the comment now needs the error to name the T3 thread, so a normal job's hold isn't blamed on T3. After it: DEV-503 and queue tests, clippy and fmt passed.
