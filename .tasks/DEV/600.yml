- date: 2026-11-16T02:33:15.242181+00:00
  author: claude
  text: |-
    Question: should a T3 thread that waits for an answer hold later jobs on its ticket?

    - Facts: T3 shows such a thread as `status: running`, `pendingRequestCount: 1` (harnessmux 0.1.9 `RunState`). Today's check (DEV-594 `043e01bd`, not on main yet) holds every later job until it's answered, silently.
    - **A (my pick): it holds them**, and the queue entry comments once: "waits: thread <link> of job <job> waits for an answer — answer it there". Safe: a later answer can't start a turn beside the new job (the DEV-585 incident).
    - **B: it doesn't hold them**: the retry/reassignment starts right away. Risk: if you later answer the old thread, it runs beside the new job on another branch.
    - Either way: `activeRunId` counts as running, and a held entry comments its reason once.

    Answer A or B in this thread.
