- date: 2026-11-18T00:22:24.120141+00:00
  author: claude
  text: |-
    No code fix needed: DEV-680's guard already covers the failed-runner path. Added a test that proves it.

    - In `finalize_job`, `merged_despite_failure` only sets `success = true`. `ensure_branch_merged` still runs after it, and DEV-680's `built_anywhere` check there fails the job.
    - The test named in the ticket (`dev318_t3_runner_test.rs`) was removed in DEV-503, so the new test sits next to DEV-680's in `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`: `a_failed_merge_agent_of_a_ticket_nothing_was_built_for_fails` (merge agent exits 1, empty branch → job `failed`, "nothing was built").
    - Without DEV-680's guard the test fails (`completed`). With it, the test passes.
    - Doc line on `merged_despite_failure` in `crates/lotar-agent/src/services/agent_job_service.rs`.
    - DEV-680 (`c30990af7`) is still Merging, not on main. The branch builds on a cherry-pick of it (`1093eb7cc`). Merge DEV-685 after DEV-680: the rebase then drops the duplicate.
