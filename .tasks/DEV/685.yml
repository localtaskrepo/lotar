description: 'Found reviewing DEV-680 (c30990af7), 2026-11-17: the new nothing-was-built guard (merge::built_anywhere) runs only in ensure_branch_merged. merged_despite_failure (crates/lotar-agent/src/services/agent_job_service.rs, ~line 4965) completes a merge job whose runner failed when the branch is on main, checking work_elsewhere but not built_anywhere. So a merge agent that crashes on a ticket whose fix job committed nothing (the DEV-657 case) still runs job_completed rules and sets it Done. Check: a merge job for a ticket with no commit named after it anywhere, whose runner exits 1 with an empty branch, ends completed. Done: it fails like the ensure_branch_merged path, with a test next to a_merge_job_that_fails_after_its_branch_reached_main_completes in dev318_t3_runner_test.rs.'
