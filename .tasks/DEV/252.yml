    Outcome: scripts/generate-test-tasks.mjs now writes top-level custom_fields: [component, story_points] (matching scripts/demo/workspace.mjs and docs/help/config.md) instead of an ignored issue.custom_fields map.
    Evidence: fresh seed (--count 6) resolves config show --project DEMO to [component, story_points]; task edit --field component=... still applies (4/6 tasks got values). ESLint + Prettier clean on the file. No tests use the script, so full lint/test/smoke from DEV-251 (same session) were not rerun for this one-line dev-script change.
