description: 'scripts/generate-test-tasks.mjs writes custom_fields as a map under issue: (issue.custom_fields: {component: ''*'', story_points: ''*''}), but LoTaR reads a top-level custom_fields list. Seeded workspaces resolve to custom_fields [''*''], so the filter panel''s Custom field picker and custom columns show only names inferred from task values. Fix: emit top-level custom_fields: [component, story_points] (see docs/help/config.md). Found while verifying DEV-251.'
