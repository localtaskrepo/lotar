description: |-
  Found in the DEV-778 review. `AgentHandler` worktree cleanup (`crates/lotar-lib/src/cli/handlers/agent.rs` ~665) calls `sweep_build_root(&repo_root, config, None)` once with the global config only. A project that sets `agent_worktree_build_root` itself (allowed: `dev153_worktree_settings_test::build_root_is_settable`) gets its root swept only through a removed worktree's `target` link, so the last worktree's leftover in that root stays.

  Check: set `agent_worktree_build_root` per project only, leave an orphan `<root>/<repo>/<ticket>` folder with no worktree, run `lotar agent worktree cleanup`: it stays.

  Done: the cleanup's first sweep also covers each project's configured build root (deduplicated), with a test.

  ## Done when

  Builds on DEV-778's `sweep_build_root` (not on main yet).

  - [ ] `lotar agent worktree cleanup` (not `--dry-run`) sweeps, before removing worktrees, the global `agent.worktree.build_root` and every project's own configured `agent.worktree.build_root`, each resolved root once (deduplicated after resolving the path)
  - [ ] A project without its own value uses the global one; a project's own value wins over the global one for that project, and the global root is still swept
  - [ ] A project whose config can't be read is skipped; the sweep of the other roots goes on and the cleanup does not fail on it
  - [ ] What `sweep_build_root` keeps stays as DEV-778 has it (folders of listed worktrees, nothing deleted when git can't list worktrees)
  - [ ] `--dry-run` deletes nothing
  - [ ] Test: a project-only `agent_worktree_build_root` with an orphan `<root>/<repo>/<ticket>` folder and no worktree: `lotar agent worktree cleanup` deletes it; a folder of a listed worktree stays
