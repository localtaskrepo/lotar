- date: 2026-11-27T09:50:44.699223+00:00
  author: claude
  text: |-
    Review: passed. `ecb19aa2b` does everything "Done when" asks and nothing beyond it.

    - Read: the diff against main (`git diff main...HEAD`: `agent_job_service.rs`, `cli/handlers/agent.rs`, `agent_safety_test.rs`, `docs/help/agent.md`), the ticket, DEV-778's `sweep_build_root`, `config_for_project`, and main's newest commits to these files. The branch still merges cleanly onto main (`git merge-tree`).
    - Dedup: `sweep_build_roots` canonicalizes the roots of all configs and puts them into a `BTreeSet`, so each root is swept once. DEV-778's keep rules (names, `target` links, worktrees being added, no sweep when the worktree list fails) are unchanged. They now also apply to each project's `agent.worktree.dir`.
    - Which value wins: each project's config is resolved over the global one, so its own `build_root` wins for that project. The global config stays first in the list, so the global root is still swept.
    - Unreadable project config: `config_for_project` falls back to the base config, and the dedup then drops that duplicate root. Only an error result is skipped. Either way the cleanup doesn't fail.
    - `--dry-run`: the sweep sits inside `if !args.dry_run`, and the test asserts that a dry run deletes nothing.
    - Fails before the fix: the fixture's global config has no `build_root`, so the old single-config sweep had no folder to look at and the orphan stayed.
    - Reran: `npm ci` passed. `cargo build --workspace`, then `cargo nextest run --test integration -E 'test(/agent_safety_test::.*(build|cleanup)/)'`: 21 of 21 passed. `cargo clippy -p lotar-agent -p lotar-lib --all-targets`: no warnings. `rustfmt --check` on the changed files: clean.
    - Not run: the full suites and smoke (the merge runs them). No UI changes, so no screenshots.
    - No minor findings, no tickets filed.
