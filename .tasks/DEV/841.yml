    Done: `lotar agent worktree cleanup` now sweeps each project's own build root too.

    - DEV-778 is on main; branch fast-forwarded to `e844fd11b`, untagged `waits`
    - New `sweep_build_roots` in `crates/lotar-agent/src/services/agent_job_service.rs`: build roots of all configs, deduplicated after canonicalizing; every config's `agent.worktree.dir` counts as "being added". `sweep_build_root` wraps it, so its keep rules stay as in DEV-778
    - `worktree_cleanup` in `crates/lotar-lib/src/cli/handlers/agent.rs` passes the global config plus each project with a `config.yml`; an unreadable project config falls back to the base config (`config_for_project`) or is skipped on error; `--dry-run` sweeps nothing
    - Test `agent_safety_test::cleanup_sweeps_a_build_root_set_only_for_a_project`: an orphan in a project-only root goes, a listed worktree's build stays, `--dry-run` keeps everything
    - Docs: `docs/help/agent.md` build_root paragraph
    - Told the DEV-919 thread, which works on the build root too
