- date: 2026-11-24T17:25:39.314012+00:00
  author: claude
  text: |-
    Review: blocking. The fix is right, but the "Done when" test also passes on the old code.

    - Read: `git log main..HEAD` (one commit `498f00ef3`), its diff, the ticket and comments, DEV-623, DEV-827, AGENTS.md, and the last 5 commits on main to the touched files. `git merge-tree` onto main: no conflicts.
    - Reran (after `npm ci`): `npm run -s lint:agent` passed. The memory gate unit and integration tests passed (`cargo nextest run -p lotar-agent -p lotar-lib -E 'test(memory_gate) | test(full_swap) | …'`, 13 passed).
    - The logic is right: full swap holds only below 20% free (`memory_gate.rs:165`). If free memory can't be read, full swap still holds. The docs say what holds. This Mac right now: swap 80%, `kern.memorystatus_level` 76.
    - **Blocking**: `crates/lotar-lib/tests/dev623_memory_gate_test.rs:93` `full_swap_with_free_memory_starts_the_job` proves nothing. I copied it onto the old code (the merge base, in a detached scratch worktree) and it **passed**. Why: the old `parse_fake` rejects `free=63` as an unknown reading. A failed reading holds nothing, so the job starts and `memory_hold` is null anyway. The handoff said "on the old code swap 90% > 85% holds"; that is wrong for this test.
    - Fix: also assert `memory_error` is null in the `agent queue` JSON (`crates/lotar-lib/src/cli/handlers/agent.rs:493`). Better, add a case in the same test with `swap=3.6/4,free=10` that holds. Then confirm the test fails on the old code.
    - Not blocking: `SWAP_HOLD_FREE_PERCENT = 20` is a fixed constant, not a config key. The ticket left the threshold open. The docs state it.
    - Not rerun: the full `npm test` and `npm run smoke` (the fix agent reported both passed).
