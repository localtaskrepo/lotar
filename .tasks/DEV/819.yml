- date: 2026-11-23T05:03:23.802714+00:00
  author: claude
  text: |-
    Fixed: full swap holds jobs only while less than 20% of memory is free.

    - `memory_gate.rs`: the reading adds free memory (`kern.memorystatus_level` on macOS, `MemAvailable` on Linux). The swap rule holds only below 20% free. Where free memory can't be read, swap alone still holds.
    - The hold reason names free memory: `swap 3.6 of 4.0 GB used (90%, limit 85%, 19% of memory free)`.
    - `LOTAR_MEMORY_READING` takes `free=<percent>`. New integration test `full_swap_with_free_memory_starts_the_job` (`pressure=normal,swap=3.6/4,free=63`: the job runs), plus unit tests.
    - This Mac right now: swap 93% used, `kern.memorystatus_level` 71, pressure normal. That holds on the old code and not on the new.
    - Docs: `docs/help/agent.md` (Memory gate) and `config-reference.md`. Also removed a duplicate `agent.job_history` pair from `config-reference.md`.
    - Logging a hold's start and end (the comment above) is now its own ticket, DEV-827. The detached worker's stderr goes to `/dev/null`, so where the log line is written still has to be decided.
