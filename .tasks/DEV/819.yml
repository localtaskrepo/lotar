description: |-
  Found 2026-11-22: from 22:25Z every queue on the Mac was held with 'waiting for memory: swap 3.4 of 4.0 GB used (85%, limit 85%)' (lotar 36 queued, 0 running; standards 14 queued). At the same time kern.memorystatus_vm_pressure_level was normal and memory_pressure reported 63% free. macOS keeps pages in swap after a shortage is over and gives swap back only slowly or at a reboot, so the swap rule (DEV-623) can hold all jobs indefinitely while RAM is free. Nothing in lotar agent queue says the hold may never clear.

  Done when: swap use alone no longer holds jobs while the pressure level is normal and free memory is high; for example hold on swap only while swap use is still growing, or only together with low free memory (kern.memorystatus_level). A test with LOTAR_MEMORY_READING covers high, flat swap with normal pressure: jobs start. docs/help/agent.md (Memory gate) says what holds.

  Workaround in place: agent.memory_gate.max_swap_percent: 95 in every repo's .tasks/config.yml (owner 2026-11-22). Revert it once this ships.
