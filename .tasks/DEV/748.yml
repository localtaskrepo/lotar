- date: 2026-11-21T01:43:37.241399+00:00
  author: claude
  text: |-
    The test no longer times the merge: it checks that lotar stopped the check's background process.

    - The check is now `sleep 600 & echo $! > <pidfile>`. The process outlives the 60 s deadline in `merge()`, so a merge that waited for it fails there however slow the machine is
    - After the merge the test asserts the PID is gone. lotar kills the check's process group after `OUTPUT_DRAIN_LIMIT` (5 s)
    - Checked that it catches the bug: with `OUTPUT_DRAIN_LIMIT` raised to 700 s the test fails with "the merge job didn't end" (change reverted)
    - `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs` only, commit `136acb93b`
  report:
    commits:
    - hash: 136acb93b
      what: test asserts lotar stopped the background process instead of a 20 s wall-clock budget
    checks:
    - command: npm run -s test:agent
      result: passed
      reason: twice, load avg 21-29, 2428/2428
    - command: npm run -s lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: not_run
      reason: test-only change to one Rust test file
    next: Review, then merge
- date: 2026-11-21T03:38:14.417975+00:00
  author: claude
  text: |-
    Review: passed. The test checks that lotar stopped the check's background process, not how long the merge took.

    - Read: `136acb93b` (one file, `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs:442`), the ticket, [DEV-741](https://lotar.pyxzl.net/task/DEV-741), and the code the test relies on: `merge.rs:596` waits `OUTPUT_DRAIN_LIMIT` (5 s), then `terminate_child` kills the check's process group (`process_group(0)` at `merge.rs:556`)
    - Covers "Done when": `sleep 600` outlives the 60 s limit in `merge()` (line 113), so a merge that waits for it fails there; a slow merge doesn't. No other changes, no stray files
    - Reran: `npm ci` ok; the test alone 3× at load average 25–28: passed in 10 s, 15 s and 26 s. The 26 s run would have failed the old 20 s limit; no `sleep 600` left running afterwards
    - `npm run -s lint`: passed
    - `npm run -s test:agent` at load average ~36: 2299 passed, 1 failed: `sse_delivers_during_a_steady_stream_of_events`. That is DEV-741's flaky test; its fix `eff138b6f` is on main but not on this branch, which the merge's rebase brings in. Nextest stopped at 2300/2428, so the rest of the run (UI, release, hooks) didn't run here
    - No tickets filed
