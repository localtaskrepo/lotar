comments:
- date: 2026-11-21T01:43:37.241399+00:00
  author: claude
  text: |-
    The test no longer times the merge: it checks that lotar stopped the check's background process.

    - The check is now `sleep 600 & echo $! > <pidfile>`. The process outlives the 60 s deadline in `merge()`, so a merge that waited for it fails there however slow the machine is
    - After the merge the test asserts the PID is gone. lotar kills the check's process group after `OUTPUT_DRAIN_LIMIT` (5 s)
    - Checked that it catches the bug: with `OUTPUT_DRAIN_LIMIT` raised to 700 s the test fails with "the merge job didn't end" (change reverted)
    - `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs` only, commit `136acb93b`
  report:
    commits:
    - hash: 136acb93b
      what: test asserts lotar stopped the background process instead of a 20 s wall-clock budget
    checks:
