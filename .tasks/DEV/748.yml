description: 'Found: failed in the DEV-743 review run of npm run -s test:agent (2026-11-20, load avg ~30): ''the merge waited for the background process: 21.13s'' at crates/lotar-lib/tests/dev605_merge_without_agent_test.rs:451; also failed in DEV-731 and DEV-734 runs (load 21-22), passes alone. The test''s check is ''sleep 30 &'' against a 20 s wall-clock budget, so load alone can push it over. Check: npm run -s test:agent at load avg ~30. Done: the test tells a merge that waited for the background process from a slow one without a wall-clock budget load can exceed (e.g. a much longer sleep, or asserting the merge ended before the background process did), and passes under full-suite load.'
