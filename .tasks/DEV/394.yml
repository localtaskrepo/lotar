  author: claude
  text: |-
    claude (Opus 5.5): Done in commit 5abfe5d on agent/DEV-394.
    - Tasks list: bulk menu 'Set field…' picks a declared custom field and a value; empty clears it. Version fields are checked as in the task panel. Finding: a task update's (and MCP task_bulk_update's) custom_fields replaces the whole map, so the page reads each task and sends its own map with the one field changed, guarded by expected_modified (one re-read on a 409). The MCP tool description and mcp-tools.md now say the map is replaced.
    - Board: Group by lists every declared custom field. One lane per value, a list value in each of its lanes, '(none)' last; version fields in version order (new compareVersions in view/utils/versions.ts, semver precedence like the server).
    - CLI: lotar edit --select '<query>' makes the same edit on every matching task (reports updated/failed, fails if any failed); -F key= now drops the field, as task move does.
    - Docs: task.md, serve.md, mcp-tools.md. Also fixed the Tasks dialogs' close button wrapping under a long hint (Set field and Delete).
    Checks: npm run lint (lint:agent) clean; npm test (test:agent): Rust 2079, UI 1477, release and hooks pass; npm run smoke: 104 files / 383 tests pass, incl. new bulk-set and board-by-field smoke tests with screenshots looked at.
