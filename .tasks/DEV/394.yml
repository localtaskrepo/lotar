description: |-
  Setting a custom field on many tickets takes one edit per ticket in the web UI, and the Board can't group by a custom field. With version fields (DEV-373), "set `fixed_in=0.15.0` on these 15 tickets" and "a board per `fixed_in`" are common needs. Found by claude in an audit of version support, 2026-11-12.

  ## Context

  - The Tasks list's bulk menu (`view/pages/TasksList.vue`) offers Assign, Clear assignee, Add to sprint, Remove from sprint and Delete; nothing for fields.
  - Board swimlanes (`view/pages/Board.vue`, `GroupByMode`) are `none`, `assignee`, `priority`, `type`.
  - Check whether MCP `task_bulk_update` with a `custom_fields` patch replaces the whole map (it says "Null clears all"); a bulk set of one field must keep a ticket's other fields.

  ## Plan

  - Bulk menu: "Set field…" that picks a declared custom field and a value, and clears it when empty; a version field checks the value as the task panel does (`view/utils/versions.ts`). Uses the existing bulk update route.
  - Board: group by any declared custom field; a version field's lanes in version order, a list value in each of its lanes (or say why not), and a "none" lane.
  - CLI parity if missing: setting a field on the tickets a query selects (as `lotar sprint add --select` does).

  ## Done when

  - [ ] One bulk action sets or clears a field on the selected tickets and leaves their other fields alone (test plus smoke).
  - [ ] The Board groups by a custom field, version fields in version order (smoke).
