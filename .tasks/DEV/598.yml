description: |-
  Found 2026-11-15 in the review of DEV-593.

  DEV-593 saves a job's takeover record as the job starts (`mark_started` in `crates/lotar-lib/src/services/agent_job_service.rs`). Before that, `run_job` sets up the worktree (`prepare_worktree`, `continued_thread_worktree`, git calls that can take seconds) and only then writes the job log (`init_job_log`). A lotar process killed in that gap leaves neither a log nor a record: no worker or `lotar serve` can take the job over, `lotar agent status` doesn't know it, and the ticket keeps its agent assignee with no job, the same symptom as DEV-593.

  ## Done when
  - [ ] A job whose process is killed during its worktree setup is ended by the next worker or server in that tasks directory (failed, with a reason that names the setup), and its `job_failed` rules run once, also when a second worker or server starts later.
  - [ ] This holds for every runner (t3, other session runners, `command`): a record saved during the setup wins over the runner's own takeover reason, and the takeover starts or resumes no session.
  - [ ] The taken-over job gets a job log (written then, with what the record knows), so `lotar agent status` and `list-jobs` show it as failed with that reason, not unknown or missing.
  - [ ] A worktree setup that fails without a kill (agent worktrees on) is logged too: its job log shows the failure.
  - [ ] A cancel during the setup still ends the job as cancelled; its record is dropped as before.
  - [ ] Builds on DEV-593 (`d7d4c99a`), which isn't on main yet.
