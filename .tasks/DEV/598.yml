- date: 2026-11-16T03:13:34.213619+00:00
  author: claude
  text: |-
    Fixed: a job killed during its worktree setup is now taken over and failed, with its `job_failed` rules run once.

    - Cause: `run_job` saved no record and no log until the worktree setup was done, so the next worker had nothing to take over.
    - Fix (`agent_job_service.rs`): `run_job` saves the record before `prepare_worktree` / `continued_thread_worktree`, with a new field `in_setup` (`agent_active_jobs.rs`, serde default, so old records still load). `mark_started` replaces it as before.
    - Takeover: an `in_setup` record fails for any runner, with no session started: "The lotar process running the job exited while it set up the job's worktree, before the job started." It writes the missing job log first, so `agent status` and `list-jobs` show the failure.
    - Also fixed: a worktree setup that fails without a kill now writes a job log (before, `agent status` didn't know that job either).
    - Tests (`dev510_t3_session_test.rs`): `a_t3_job_killed_during_its_worktree_setup_fails_once_taken_over` (a fake `git` on PATH holds the setup, then the test kills `lotar agent run`) and `a_job_whose_worktree_setup_fails_logs_the_failure`.
    - Docs: `docs/help/agent.md`, "Jobs whose process died".
    - Built on DEV-593's `d7d4c99a` (not on main yet). I told the DEV-593 merge thread.
    - Not covered: a half-made worktree a killed setup leaves stays where it is. The next job reuses it or reports it, as before.
