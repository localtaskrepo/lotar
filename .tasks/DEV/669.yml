    - Reran: `npm ci` ok; `cargo deny check`: advisories, bans, licenses and sources ok; `npm run lint:agent` passed; `npm run test:rust:agent`: 2310/2310 passed.
    - Not rerun: UI tests and `npm run smoke`, because the rework touched no Rust or UI code beyond the rebase. The fix agent ran both after the rebase (1548 UI, 405 smoke).
