comments:
- date: 2026-11-17T18:43:35.138632+00:00
  author: claude
  text: |-
    chrono replaced by jiff 1.0.0 across all four crates; stored and printed timestamps keep their exact bytes.

    - `lotar-core/src/utils/time.rs` holds the shared helpers: `Rfc3339::to_rfc3339` (`+00:00`, fraction 0/3/6/9 digits), `to_rfc3339_z` + `serialize_rfc3339_z` for the audit JSON (`Z`), `parse_rfc3339`, `days`/`weeks`/`whole_days`, `local_date`/`local_midnight`/`utc_date`.
    - New unit tests pin the write shapes (seconds, millis, micros, nanos, `Z`) and parsing of offsets and lower-case `t`/`z`.
    - Checked against chrono in a side crate: same output for every format the code uses, and every input chrono parsed still parses. Only difference: jiff also accepts a few extra ISO 8601 forms.
    - Local-time code keeps chrono's `.single()` semantics (`unambiguous()`), and the time tests also pass under `TZ=America/New_York` and `Asia/Kolkata`.
    - `cargo deny check` passes with no RUSTSEC-2026-0543 ignore. Cargo.lock still lists chrono as a disabled optional dependency of serde_with (via harnessmux); it is never built.
    - Unlike DEV-122 (YAML advisory, won't-do), this ticket asked for the migration, and jiff is stable at 1.0.
  report:
    commits:
