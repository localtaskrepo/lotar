description: |-
  RUSTSEC-2026-0543 marks chrono unmaintained (no vulnerability, no safe upgrade). DEV-665 added a deny.toml ignore to unblock CI. chrono is a workspace dependency in lotar-core, lotar-lib, lotar-agent and lotar-tasks (~185 uses). Evaluate jiff/time like DEV-122 did for YAML: prove task YAML date/time round-trips stay byte-compatible, serde formats and timezone handling; then migrate and drop the ignore entry from deny.toml.

  ## Done when

  - [ ] chrono is gone: no `chrono` in any `Cargo.toml`, `Cargo.lock` or `.rs` file; jiff (latest stable, already a transitive dependency via serde_with) replaces it.
  - [ ] Timestamps written to task YAML, history, comments, sprints, audit and the REST/MCP/JSON output keep chrono's exact `to_rfc3339()` shape: UTC as `+00:00` (not `Z`), fractional seconds as 0, 3, 6 or 9 digits. A unit test pins this for whole seconds, millis, micros and nanos.
  - [ ] Every timestamp shape chrono's `parse_from_rfc3339` accepted still parses to the same instant (`Z`, `+00:00`, other offsets, fractions); a value that fails to parse is handled as before (skipped / error message), not a panic.
  - [ ] Task files with existing timestamps load and save without byte changes (existing no-op round-trip tests pass).
  - [ ] Local-time behaviour stays the same: date-only and naive inputs are local midnight/local time in the system zone (`TZ` wins over `/etc/localtime`); day offsets stay on the same calendar date across DST.
  - [ ] Display formats (`%Y-%m-%d`, `%b %-d %H:%M`, compact `%Y%m%dT%H%M%SZ` ...) print the same text as before.
  - [ ] The `RUSTSEC-2026-0543` ignore entry is not in `deny.toml` once DEV-665 and this ticket are both on main, and `cargo deny check` passes.
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass.
