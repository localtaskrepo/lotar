  text: 'Review: blocking — required disk warning remains unfinished. Reviewed 7f4e3149, its three files, related tickets, recent main history and standards owner decision (keep builds until Done). No cleanup-code defect found. At crates/lotar-lib/src/services/agent_job_service.rs:2387 only retry cleanup is added; standards scripts/repos.ts:1097 still lacks disk monitoring. STD-145 is Blocked awaiting STD-136: finish and verify it or obtain explicit owner acceptance of split delivery. Focused regression passed with RUSTC_WRAPPER= after both ordinary and elevated sccache attempts hit Operation not permitted. Full lint/tests/smoke not rerun; fix agent reports passed. Disk: 196 GiB free. Existing daily idle-worktree cleanup verified. No duplicate finding filed (STD-145 exists). No files, commits, status or assignee changed; no durable guidance finding.'
description: |-
  Found 2026-11-15 by the chief of staff: the Data volume was 100% full (2.3 GB free of 926 GB) and many jobs failed. ~/.t3/worktrees used 280 GB, 243 GB of it lotar worktrees; each worktree's Rust target/ was 5-35 GB (agent-DEV-510 35 GB, t3-38403d38 17 GB, agent-DEV-528 13 GB, ...). Deleting all worktree target/ folders freed ~222 GB (224 GB free now, worktrees 49 GB).
  Check: du -sh ~/.t3/worktrees/*/*/target; df -h /System/Volumes/Data.
  Done when: a job's build output doesn't outlive the job (remove target/ at job end or worktree cleanup), or worktrees share one build cache (sccache, already used; or a shared CARGO_TARGET_DIR per repo) so a new worktree doesn't rebuild 5+ GB; and a disk check warns before the volume fills (e.g. under 50 GB free). Applies to harnessmux worktrees too (15 GB).
