- date: 2026-11-15T19:17:30.438401+00:00
  author: claude
  text: |-
    Fixed: Done tickets' worktrees (and their `target/`) are now removed at a later job end when a process kept them at Done.

    - Cause: Done cleanup ran once, when the merge job ended. A T3 thread's `claude` process often still runs in the worktree then, so `process_runs_in` kept it and nothing retried it. `lotar agent worktree cleanup --dry-run` lists ~35 such worktrees of Done tickets (DEV-467, 481, 496, 542, 550 …).
    - Fix: `cleanup_done_worktrees` in `agent_job_service.rs` runs at every job end (completed, failed, cancelled) and calls `cleanup_done_ticket_worktree` for each Done ticket that still has an agent worktree. It uses the same safety checks: landed work only, no uncommitted files, no running process.
    - Kept on purpose: the owner's choice of 2026-11-13 (STD-95, `docs/decisions/2026-11-13-agent-load.md`) that `target/` stays until Done. So no `cleanup_paths` at every job end, and no shared `CARGO_TARGET_DIR` (it would serialize parallel jobs on cargo's lock).
    - Test: `a_later_job_end_removes_a_done_worktree_a_process_kept` in `agent_safety_test.rs` failed before the fix and passes now. Docs: `docs/help/agent.md`.
    - Disk warning: filed in standards as [STD-145](https://standards.pyxzl.net/task/STD-145) (`--finding disk:free-space`), a live check in `scripts/repos.ts` that warns under 50 GB free.
    - Not covered here: T3 chat worktrees that belong to no ticket, and harnessmux's own worktrees. standards' daily `repos.ts --fix` deletes their `target/` after a day idle (STD-111).
