relationships:
  related:
  - DEV-579
comments:
- date: 2026-11-17T01:42:53.147511+00:00
  author: claude
  text: |-
    harnessmux tests now build 515 MB instead of 907 MB cold, at the same speed: `[profile.dev] debug = false` kept, commit `c066000` on harnessmux branch `agent/DEV-636`.

    Measured in a fresh target dir each, sccache off (`RUSTC_WRAPPER=`), load 70 to 150, so times are rough:

    | | before | debug off | + deps opt-level 2 |
    |---|---|---|---|
    | `cargo nextest run` cold | 52.6 s, 907 MB | 53.3 s, 515 MB | 138.6 s, 482 MB |
    | nextest warm (only runs tests) | 16.4 s | 16.9 s | 15.8 s |
    | + clippy | 14.1 s, 1.0 GB | 26.3 s, 619 MB | 29.1 s, 587 MB |
    | touch `src/lib.rs`, nextest | 19.8 s, 1.1 GB | 20.6 s, 721 MB | 19.8 s, 695 MB |
    | touch, clippy | 1.9 s, 1.2 GB | 2.4 s, 763 MB | 2.9 s, 736 MB |

    - `debug = false` takes `target/debug/deps` from 812 MB to 398 MB; `incremental` (~320 MB) stays the same.
    - Clippy cold A/B, run twice: 12.2/15.4 s before, 13.1/22.7 s after, 198 MB both times. Debug info doesn't change clippy's work, so the 26 s above is load noise.
    - Dependencies at opt-level 2 (lotar's DEV-579 setting): only 30 MB smaller, a cold build 2.6x slower, tests no faster. Not kept.
    - No `--cargo-profile dev` needed: harnessmux has no custom profile, and cargo's `test` profile inherits `dev`. Tests and clippy share `target/debug`.
    - Still the case: `cargo build` after the tests rebuilds `agent-client-protocol` and the binary (+210 MB). AGENTS.md doesn't name `cargo build`, so I left it.
    - Callers: lotar uses harnessmux as a crate (dependency profiles are ignored); staff's launchd plists use `target/release/harnessmux`, which doesn't change. `CHANGELOG.md` not touched: no change for users.
    - lotar's branch `agent/DEV-636` has no commits; the change is in harnessmux only.
  report:
    commits:
    - hash: c066000
      what: harnessmux [profile.dev] debug = false; AGENTS.md names the build (harnessmux branch agent/DEV-636, worktree ~/.t3/worktrees/harnessmux/DEV-636)
    checks:
    - command: cargo fmt --all --check
      result: passed
    - command: cargo clippy --all-targets --all-features -- -D warnings
      result: passed
    - command: cargo nextest run
      result: passed
      reason: 43 of 43
    - command: cargo deny check
      result: passed
    next: Review, then merge harnessmux branch agent/DEV-636 (c066000) onto harnessmux main; lotar's branch has no changes
