- date: 2026-11-15T01:15:04.158766+00:00
  author: claude
  text: |-
    Core is now its own crate `crates/lotar-core`; all checks pass. Commit `284b39b0` on `agent/DEV-499`.

    **Changed**
    - Moved config, storage, utils, types, output, errors, workspace, project, scanner, api_types and api_events into `crates/lotar-core`. `lotar-lib` re-exports them (`pub use lotar_core::{…}`), so `crate::config` and `lotar::config` still work.
    - Items used across the border went from `pub(crate)` to `pub`, the narrowest that works. `FindingReport::describe` moved to core, next to its type. The agent config templates moved next to their only user (`cli/handlers/config/init/templates/`).
    - Transaction fault hooks: `cfg(test)` doesn't reach across crates, and a cargo feature would end up in the release binary through `--all-features`. The checks are now always compiled; the two setters lotar-lib's tests use are `#[doc(hidden)] pub`, the rest stay test-only.
    - Removed `core_layering_test.rs` (DEV-498): the compiler enforces the layering now, since core can't depend on lotar-lib.
    - Shared deps went to `[workspace.dependencies]`. lotar-lib's `parallel` and `schema` features forward to core.
    - `release.yml` and `docs/release-guide.md` now publish `lotar-core` too. Docs, the AGENTS.md contract paths, the skills, the UI and smoke tests that read source paths, and the CI path-filter contract test were updated.

    **Timings** (local, `ci` profile, no incremental, no sccache, machine load 20–50, so wall times are rough; CPU is the steadier number)
    - Change in services: `cargo build` CPU 151 → 113 s (−25%); `nextest --no-run` CPU 380 → 290 s (−24%).
    - Change in core: about the same as before (build 150 → 144 s, tests 373 → 352 s CPU).
    - Core's unit tests alone after a core change: 14 s wall / 88 s CPU (`cargo nextest run -p lotar-core --no-run`).
    - CI before (the last 3 green main runs): Rust Quality Checks 187–294 s, Windows Binary Sanity 168–482 s. The after numbers need a CI run, so they come after the merge. Next step: compare the first green main run after the merge with these.

    **Checks**
    - `npm run lint:agent` pass
    - `npm run test:rust:agent` 2172 passed (166 in lotar-core)
    - `test:ui:agent` 1537 passed; `test:release` and `test:hooks` pass
    - `npm run test:smoke:agent` 401 passed
    - `cargo package --allow-dirty -p lotar-web-assets -p lotar-core -p lotar-lib -p lotar` pass
    - Not run: a Windows build (no Windows target here). CI covers it.

    **Owner step before the next release:** the new crate has to be published once with a token, then get its trusted publisher: [DEV-552](https://lotar.pyxzl.net/task/DEV-552).
