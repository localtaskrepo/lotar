description: |-
  Move the core modules into a crate of their own in the cargo workspace (DEV-493; the owner, 2026-11-13: "Yes on all of those ideas"). Changes above core then don't recompile core, and core's tests build in a fraction of the time.

  ## Context (DEV-493)

  - Core: config, storage, utils, types, output, errors, workspace, project, scanner, api_types, api_events (about 23k of 95k lines).
  - Measured on a scratch probe: the core library builds from scratch in 8 to 16 s (the whole crate: 29 to 49 s), its unit tests in 8 to 24 s (whole crate: 43 to 44 s).
  - It only pays off in CI if unchanged crates are cached (the CI caching ticket).

  ## Plan

  - `crates/lotar-core` (name to settle in the ticket). The `lotar` library re-exports it so paths in `tests/` and the binaries keep working; `pub(crate)` items used across the border become `pub`, the narrowest that works.
  - Later steps in tickets of their own after measuring this one: services/runner, sync, mcp.
  - Keep the release tooling, packaging and the path filters in `ci.yml` working.

  ## Done when

  - [ ] Timings before and after: a change in core, a change in services or cli, and the Windows and Linux CI jobs.
  - [ ] `npm run lint`, `npm test` and `npm run smoke` pass.
