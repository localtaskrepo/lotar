- date: 2026-11-18T00:43:24.759257+00:00
  author: claude
  text: |-
    Built both: stall timeout and the reconcile for running jobs.

    - New `agent_job_service/watch.rs`, checked in the session loop and the `command` runner loop.
    - Profile field `stall_timeout_seconds` (unset or 0: no limit). No output, session event or open question for that long fails the job as "Stalled: …", so `job_failed` rules run.
    - Ticket goes to a done status or to a person (not `@profile`, not an agent name) while the job runs: a note in the job log, then cancel after 120s grace so the agent's own last-step handback still ends cleanly. `job_cancelled` rules run.
    - Merge jobs only stall: their ticket goes Done as they land.
    - Not built: the optional retry of a stalled job.
    - Tests: 4 watch unit tests, harness test `a_silent_agent_fails_its_job_as_stalled`. Docs: help/agent.md, config-reference.md.
