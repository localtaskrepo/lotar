    Fixed the blocker the cut-off review found: jobs on tickets that were Done already got cancelled.

    - The review (`job-20261118T010254.074Z-20`) hit a usage limit. Before that it flagged that `moved_on_now` in `agent_job_service/watch.rs` cancelled every job on a ticket in a done status, also when the ticket was Done before the job started (a follow-up on a closed ticket).
