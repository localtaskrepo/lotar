description: |-
  A running agent job that hangs holds its parallel slot and its ticket indefinitely, and a job keeps running (and spending tokens) after its ticket goes Done or is reassigned. Found in the survey of similar projects mallox asked for on 2026-11-17 ([report](https://claude.ai/artifact/KSCDeRRHZqQRqkqHfjVRKf), section lotar).

  ## Evidence
  - OpenAI Symphony's spec, Apache-2.0: [SPEC.md](https://github.com/openai/symphony/blob/main/SPEC.md) §8.5 stall detection (no agent event for `stall_timeout_ms` kills and retries the run), §8.5 part B (each tick re-reads the tracker: a ticket gone terminal stops the worker and cleans the workspace, a rerouted one stops the worker and keeps it), §8.4 retry with backoff `min(10s·2^(n-1), max)`.
  - lotar today: only `--timeout-seconds` on `agent run`; failed runner jobs are terminal (docs/help/agent.md:424); a ticket reassigned while its job runs only skips the job's end rules, the job runs on (agent.md:243).

  ## Proposal
  - A per-profile `stall_timeout`: no harnessmux event for N minutes ends the job as failed with reason `stalled`, so `job_failed` rules decide (retry with `@fix` or ask).
  - Reconcile: when the ticket of a running job goes Done/WontDo or is assigned to a person, cancel the job (or send its agent one message, deduped) and say so in the job log.
  - Optional: retry a stalled job once with backoff.

  ## Done when
  - [ ] owner decided the scope (question below)
  - [ ] a test job with a recorded agent that goes silent ends as `stalled`
  - [ ] a job whose ticket is set Done mid-run is cancelled and logged
