- date: 2026-11-17T02:46:56.322682+00:00
  author: claude
  text: |-
    Fixed: the tasks watcher seeds its fingerprints from disk before it starts watching, so files written before the server started produce no `task_updated`.

    - `seed_fingerprints` in `crates/lotar-lib/src/web_server.rs` walks the tasks dir (skips dot-entries, as the watcher does) and fills `announced` before `watcher.watch()`; a write between seed and watch still differs and is announced
    - Test `watcher_skips_files_written_before_it_started`: fails with an empty map (`task_error`, `task_updated`, `project_changed`), passes with the fix; a later write is still announced
    - The DEV-614 smoke workaround isn't in this branch, so nothing to remove here
  report:
    commits:
    - hash: 99ee73da0
      what: seed the watcher's fingerprints at start
    checks:
    - command: npm run lint:agent
      result: passed
    - command: npm run test:agent
      result: passed
    - command: npm run test:smoke:agent
      result: passed
      reason: 405 tests
    - command: manual lotar serve + /api/events
      result: passed
      reason: fixed build silent for the pre-start file, announces a later write; the installed build didn't reproduce from the CLI either, so the unit test is the evidence
    next: Review, then merge
