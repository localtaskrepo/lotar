- date: 2026-11-17T03:29:56.004908+00:00
  author: claude
  text: |-
    Review: passed. `99ee73da0` does what "Done when" asks; no findings, no tickets filed.

    - Diff: `seed_fingerprints` in `crates/lotar-lib/src/web_server.rs` fills `announced` before `watcher.watch()`. Keys are relative paths, same as `process_watch_batch` (it also strips the canonical dir), and dot-entries are skipped the same way
    - Test `watcher_skips_files_written_before_it_started`: passes. In a scratch copy with an empty map it fails with `task_error`, `task_updated`, `project_changed`, so it catches the bug
    - Sprint and order snapshots were already seeded at start, so replayed `@sprints` events stay quiet as before
    - Seeded directories (marker `1`) only suppress the first replayed dir event. Before this, later dir events were already suppressed, and new files or deletions still differ
    - `main` gained 8 commits since the branch, none to `web_server.rs`; `git merge-tree` merges cleanly
    - No UI, REST or doc changes; no stray files. The DEV-614 smoke workaround is not on `main`, so there is nothing to remove
