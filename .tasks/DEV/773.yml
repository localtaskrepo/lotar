description: 'Found in the DEV-760 merge (2026-11-21), load average about 32: `npm run -s test:agent` failed at `crates/lotar-lib/src/services/audit_service.rs:1260`, `pid file: NotFound`. The stub `sh -c ''sleep 600 & echo $! > pid; wait''` gets a 300 ms timeout; under load it is killed before it writes the pid file. Check: `npm run -s test:agent` under load. Done: the test waits for the pid file before the timeout can start counting, or reads the child another way, so a slow start can''t fail it, while still asserting the child is gone.'
