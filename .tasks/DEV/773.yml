      result: passed
    - command: npm run -s test:agent
      result: passed
      reason: 2444 tests
    - command: npm run -s smoke
      result: passed
    - command: stub with an extra 1 s start delay
      result: passed
      reason: would have exceeded the old 300 ms window
    next: Review, then merge
