comments:
- date: 2026-11-22T02:10:38.217886+00:00
  author: claude
  text: |-
    Fixed: the test now waits for the pid file before the timeout can start.

    - The 300 ms timeout in `BlobBatch` counts per read (`recv_timeout`), not from spawn. So the test now polls for the pid file (up to 60 s) before it calls `build_tracked_activity_feed`.
    - The stub writes the pid atomically (`echo $! > pid.tmp && mv pid.tmp pid`), so the test can't read a partly written file.
    - The assertion that the child is gone (`kill -0`) is unchanged.
    - File: `crates/lotar-lib/src/services/audit_service.rs`.
  report:
    commits:
    - hash: daaf39a00
      what: test waits for the stub's pid file before the per-read timeout starts
    checks:
