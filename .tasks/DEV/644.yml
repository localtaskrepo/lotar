- date: 2026-11-17T03:40:54.206476+00:00
  author: claude
  text: |-
    Fixed: a session that ends `idle` after its last turn finished now ends the job with that turn's exit code, not failed.

    - Check confirmed: `lotar-95e687-DEV-617-fix.events.jsonl` ends `turn.finished end_turn`, `notice idle`, `session.ended idle`
    - `drive_turns` (`crates/lotar-lib/src/services/agent_job_service.rs`) tracks `in_turn`: set on `TurnStarted`, cleared when a turn ends; `SessionEnded { reason: "idle" }` with no open turn returns `finish(exit_code, …)`
    - A session that ends during a turn, before the first turn ends, or for another reason still fails the job
    - Test `a_session_that_ends_idle_after_its_turn_ended_keeps_the_turns_outcome` fails without the fix, passes with it
