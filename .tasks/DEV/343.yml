- date: 2026-11-12T03:08:20.659456+00:00
  text: |-
    claude (T3 job thread): Fixed in aa4b664 on agent/DEV-343 (signed).
    - Done now cleans up whoever set it: TaskService::update_with_receipt calls cleanup_done_ticket_worktree on every status change. When the ticket is done and cleanup_on_done is set, it removes the worktree on the ticket branch (agent/<ID>) if it is clean and landed. It skips while a job runs for the ticket (checked under the job registry lock, the same way job start checks), and the job's end then calls it again. maybe_cleanup_worktree also calls it after its own worktree, so the merge job's end removes the fix job's worktree.
    - Merged check: git cherry HEAD <branch> instead of merge-base --is-ancestor, so rebased or cherry-picked work counts as landed. This applies to automatic cleanup, lotar agent worktree cleanup, and the merge job's ensure_branch_merged (which no longer fails a merge that landed rebased). Branches are deleted with branch -D, since -d refuses rebased branches, and only after that check passes.
    - Tests (tests/agent_safety_test.rs): fix job then a rebased landing then Done removes the worktree and branch (fails without the fix); Done during a running job leaves the worktree until the job's end; CLI cleanup accepts a cherry-picked branch.
    - Docs: docs/help/agent.md (cleanup section).
    Checks: npm run lint, npm run test:agent (1999 Rust, 1441 UI, release and hook tests), npm run smoke (377): all pass. One full-suite run hit an environmental failure: a lotar-agent-wrapper process for TEST-1 from elsewhere on the machine made cli_configured_reviewer_can_resolve_an_agent_reported_review refuse. It passed 3 times right after, and the next full run was green.
    Found while testing: the agent-reviewed and agent-pipeline templates count HelpNeeded as done (it is their last state), so this cleanup also runs at HelpNeeded. That is safe (clean and landed only, and the next job recreates the worktree), but wrong. Filed as DEV-347.
- date: 2026-11-12T03:37:59.921716+00:00
  text: 'claude: merged into main as bd76b82 (rebased twice, fast-forward, signed). Checks in the worktree after the last rebase: npm run lint, npm test (2000 Rust, 1442 UI, hook tests; one retry on a flaky test), npm run smoke (377): all passed. The flaky test shipped_agent_reviewed_template_handles_hand_back_failure_review_and_merge also fails about 1 in 8 runs on main without this change (2f4184a); filed as a health ticket. Not pushed: main has unpushed commits from other tickets (DEV-344, version bump) that wait for their sessions.'
