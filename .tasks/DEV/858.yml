description: |-
  Found in the DEV-849 review: the endpoint in `crates/lotar-lib/src/routes/jobs.rs` has unit tests for parsing and mapping and a UI test, but no REST test. The 400 for a non-t3 job, 404 for an unknown job, and Unavailable from a failing `t3` were only checked by hand.

  ## Done when

  An integration test in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`, on its fake `t3`, calls `GET /api/jobs/t3-thread?id=<job>` and checks:

  - [ ] Two t3 jobs of one ticket: each answers 200 with its own `thread_id` and link, and T3 Code's state of that thread.
  - [ ] A t3 job whose `t3 thread show` fails: 200 with `state: unavailable` and t3's error as `reason` (no 5xx).
  - [ ] A job of another runner (command): 400 naming the runner; a missing `id`: 400.
  - [ ] An unknown job id: 404 `Job '<id>' not found`.
  - [ ] No production code changes; the test passes with `cargo nextest run --workspace --test integration dev503`.
