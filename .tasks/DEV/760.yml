description: 'Found in the DEV-755 merge (2026-11-21): `npm run -s test:agent` failed at `crates/lotar-lib/tests/dev271_storage_robustness_test.rs:70`, `assert!(!stored.contains("1970"))`. The stored file''s timestamp was `2026-11-21T18:24:50.751970+00:00`: the fraction `751970` contains 1970, no epoch date. Check: `cargo nextest run -p lotar-lib dev271_storage_robustness_test`. Done: the test checks the `created:` value''s year (for example parse it, or match `created: 1970-`), so it can''t hit a timestamp fraction.'
