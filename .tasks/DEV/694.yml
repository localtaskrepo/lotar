comments:
- date: 2026-11-18T04:00:53.460382+00:00
  author: claude
  text: |-
    The failure came from an old build: the fix is on main already (DEV-673), now covered by a test for the DEV-617 sequence.

    - The job ran on the installed `lotar 0.15.3` (built 2026-11-17 01:15). DEV-673 `a11c67715` and DEV-675 `c9a5bae3b` aren't in `v0.15.3` (`git merge-base --is-ancestor`).
    - Without DEV-673, the ending job counted as at work in `agent-DEV-617-935f2c3d0bc84f24`: it continued the session `lotar-95e687-DEV-617-fix` that the earlier jobs there had used.
    - Probe of current `finished_job_worktree` against the real logs, with `ending` = `job-20261118T030735.468Z-23`: `true`, so main would have moved the branch in that worktree.
    - New test `the_tickets_branch_moves_after_a_headless_review_ran_in_the_earlier_worktree` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`. With the `ending` exclusion removed it fails with the DEV-617 error (`cannot force update the branch 'agent/TEST-1' used by worktree`); with main's code it passes.
    - No code change was needed. DEV-617 stays blocked until a release with DEV-673 is installed.
  report:
    commits:
    - hash: 9f14b3716
      what: test for the DEV-617 sequence (fix, headless review in its worktree, fix again in the same session)
    checks:
    - command: npm run lint:agent
      result: passed
    - command: npm run test:agent
      result: passed
      reason: 2371 Rust, 138 UI test files
    - command: npm run smoke
      result: passed
      reason: 405 tests
    next: Release main (DEV-673 and DEV-675 aren't in v0.15.3) and install it, then rerun DEV-617's fix end
