description: 'Found 2026-11-18 on DEV-617: job-20261118T030735.468Z-23 finished its work (rebased commit b4d875195 on t3/fix-codex-retry-rate-limit-2, checks passed) and then failed: ''git branch --force agent/DEV-617 b4d875195 failed: fatal: cannot force update the branch used by worktree /Users/mallox/.t3/worktrees/lotar/agent-DEV-617-935f2c3d0bc84f24''. agent/DEV-617 stayed at 15135f656, so the review would read the old commit. Related: DEV-687 (Done, similar refusal). Check: lotar agent logs job-20261118T030735.468Z-23. Done when: a job whose ticket branch is checked out in another worktree still ends with agent/<ticket> at the thread''s commit (or the move happens in that worktree), with a test.'
