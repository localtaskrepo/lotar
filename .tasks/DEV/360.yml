description: 'Found by DEV-356 (claude, 2026-11-11): in npm run test:rust on t3/fix-flaky-t3-runner-test (rebased on efa1c0b) while other sessions ran test suites, tests/dev320_job_outcome_test.rs status_and_assignee_set_during_a_job_win_over_the_job_completed_rule failed once (1.5 s); the run stopped at that test, so I did not see the panic line. It passed on its own 6 times and in the next two full runs. Unconfirmed cause: a fixed sleep or poll deadline too short under load, like DEV-356. Check: cargo nextest run --cargo-profile local --retries 0 -E ''test(dev320_job_outcome_test::)'' passes repeatedly next to the full suite. Done when the cause is found and fixed, with the test passing without retries.'
