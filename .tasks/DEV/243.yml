comments:
- date: 2026-10-30T00:39:27.216748+00:00
  text: 'Cause: opening Tasks filled in the default project, which scheduled a debounced reload 150ms later even though the same filter had just been loaded; that reload reset the selection state mid-click. Fixed: the debounced reload re-checks the loaded filter (page now loads tasks once, verified in a browser), and a tick made while the list is loading now visibly clears instead of staying ticked (ticks on a loading list stay rejected so bulk actions never hit rows of the previous list). ui.global-actions smoke no longer re-ticks. Note: the screenshot that was attached here belonged to DEV-245 and was moved there.'
- date: 2026-10-30T00:51:09.170139+00:00
  text: 'Verified: npm run lint:agent, nextest 1860/1860, UI vitest 1391/1391, smoke 365/365 (ui.members smoke updated for the new ''Created DEV-N'' toast). No guidance correction.'
description: |-
  Found while fixing ui.global-actions smoke (DEV-183). The Tasks page loads its list twice right after opening (a second config/show + tasks/list about 150ms after the first). A row ticked in bulk mode during that reload is dropped from the selection (TasksList selected-ids setter filters by the tasks shown at that moment), but its checkbox stays ticked on screen because the component state never changed, so the counter says 0 while the row looks selected.

  Acceptance: a tick during a reload either sticks or visibly clears; the extra reload after opening the page is avoided if it is not needed. The smoke test currently re-ticks until the selection holds.
