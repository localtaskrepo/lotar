comments:
- date: 2026-11-17T02:13:45.683800+00:00
  author: claude
  text: |-
    Done: a new lotar job worktree clones `target/` copy-on-write (`clonefile(2)`) right after `git worktree add`. The measured gain is smaller than hoped, because cargo always rebuilds the workspace crates in a new checkout.

    - **Code:** `clone_build_output` in `crates/lotar-lib/src/services/agent_job_service.rs`, called only from `prepare_worktree`'s new-worktree branch.
      - Source, first that applies: the ticket's earlier worktree (T3 thread or detached worktrees, traced as done cleanup traces them; with several, the one built last), then the main checkout, then nothing.
      - A reused worktree, a T3 thread's worktree and t3-runner jobs are untouched. Merge jobs' new worktrees clone too (note in `merge.rs`).
    - **Failure:** the job logs `Couldn't clone target/ from <path>: <err>; this job builds cold.`, removes any partial `target/` and goes on. It never makes a full copy: off macOS the log says clonefile isn't available.
    - **Log:** `Cloned target/ from <path> (copy-on-write).`, or why nothing was cloned.
    - **Tests** (`agent_safety_test.rs`): clone from the main checkout; earlier worktree wins over the main checkout; failed clone (unreadable directory) and no `target/` both build cold.
    - **Docs:** `docs/help/agent.md` (Worktrees). STD-95, `cleanup_paths` and done cleanup are unchanged.

    **Measured** on a separate APFS disk image, so `df` counts only this. Load was 40 to 140, so times are rough.
    - Clone itself: under 1 s, 1.4 MB.
    - `npm run test:rust` with sccache warm: cold 384 s, +1.92 GB, 206 crates compiled; cloned 520 s (load 105 vs 55), +1.43 GB, 4 crates compiled. Test time dominates and load skews it.
    - Build only (`nextest --no-run`) without sccache, as in sandboxed jobs (STD-125): cold 134 s, +1.88 GB; cloned 80 s, +1.36 GB.
    - Why only about 0.5 GB saved: git checkout gives every source file a new mtime, so cargo rebuilds `lotar`, `lotar-lib`, `lotar-core` and `lotar-web-assets`. Their test binaries and incremental data are most of the 1.4 GB. The clone saves all dependency builds.

    **Also**
    - A flaky test seen in a measurement run is filed as [DEV-640](https://lotar.pyxzl.net/task/DEV-640): `chunked_bodies_get_411_and_overload_gets_503`, EINVAL from `set_read_timeout`. A DEV-613 flake also showed once in a measurement run; neither appeared in the gate runs.
    - Told the DEV-634 thread (crate split) that this changes `agent_job_service.rs`.
    - No guidance correction. The testing-strategy skill still names `--cargo-profile local`; that is right until DEV-579 lands.
