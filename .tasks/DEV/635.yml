  - DEV-581
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Ae2a93ce5-f5cd-4e81-80d2-9bba5a154e7a
description: |-
  Owner, 2026-11-17, on DEV-579: "I like the idea of copying existing data over, but I'm not really willing to let t3 handle worktrees again. That was the main reason we moved to harnesmux."

  ## Why
  - Each new job worktree builds cold: 1 to 2 min and about 2.3 GB for lint + tests + smoke (DEV-579).
  - On APFS `cp -c` (clonefile) copies `target/` without using disk until a file changes.

  ## What
  - When lotar's `prepare_worktree` (`crates/lotar-lib/src/services/agent_job_service.rs`) creates a new worktree, it clones `target/` from the ticket's earlier worktree if one exists, else from the main checkout, before the agent starts.
  - Only worktrees lotar creates (headless claude, codex, command jobs over harnessmux). T3 Code worktrees are not touched and no job moves back to T3-made worktrees.

  ## Done when
  - [ ] Only when `prepare_worktree` runs `git worktree add` (a new worktree, merge jobs included): a reused `<dir>/<ticket>` or a T3 thread's worktree on the ticket branch (DEV-581) gets nothing cloned, and t3-runner jobs are untouched.
  - [ ] Source, first that applies: an earlier worktree of the ticket (its T3 thread branches and detached worktrees, as done cleanup traces them) that has a `target/` directory, the one whose `target/` changed last when several do; else the main checkout's `target/`; else nothing, and the worktree starts empty as today. A `target/` that is a symlink is no source.
  - [ ] The job log names the source (`Cloned target/ from <path> (copy-on-write)`) or says why nothing was cloned.
  - [ ] Clone fails (other filesystem, not macOS, copy error): the job logs it, removes any partial `target/` it made, and goes on with a cold build; it never fails the job.
  - [ ] No fallback to a full copy: macOS `clonefile(2)` only; elsewhere the log says clonefile isn't available.
  - [ ] Measured: first `npm test` in a new worktree, time and added disk, cold vs cloned.
  - [ ] A test covers clone from the main checkout, from an earlier worktree over the main checkout, and the fallback; `docs/help/agent.md` (Worktrees) says so.
  - [ ] STD-95 (build output stays until Done) and `cleanup_paths` unchanged.
