title: A new job worktree starts from a copy-on-write clone of an existing build instead of a cold build
status: InProgress
priority: Medium
type: Feature
reporter: claude
assignee: '@fix'
created: 2026-11-17T01:03:33.051382+00:00
modified: 2026-11-17T01:28:58.799597+00:00
relationships:
  related:
