description: |-
  Found in the DEV-818 review: the DEV-818 fix job's description edit at 2026-11-23 04:34Z replaced the ticket's whole Found / Done when text with '-'. DEV-776 fixed the same for lotar comment; task edit and add were left out. The job prompt itself tells agents to run lotar task edit <ID> -D ..., so the heredoc form is what they reach for.

  ## Check
  In a scratch folder: lotar --tasks-dir <dir>/.tasks add x --project TST -D orig, then printf 'new' | lotar --tasks-dir <dir>/.tasks task edit TST-1 -D -. The description becomes '-' (reproduced 2026-11-24).

  ## Done when
  DEV-776 chose to read stdin for comment, so -D - reads stdin here too.
  - [ ] `lotar add`, `lotar task add` and `lotar task edit` (also `lotar edit`, `--select`) with `-D -` / `--description -` save stdin as the description, trailing newlines trimmed like `comment -F -`.
  - [ ] `--select` edits every matching task with the same stdin text (stdin is read once).
  - [ ] stdin can't be read: the command fails with an error and writes nothing.
  - [ ] Any other value, including text that starts with `-`, is saved as given.
  - [ ] `docs/help/add.md` and `docs/help/task.md` say so.
  - [ ] A test covers add and edit.
