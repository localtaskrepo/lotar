- date: 2026-11-24T21:38:38.843513+00:00
  author: claude
  text: |-
    `-D -` / `--description -` now reads the description from stdin in `lotar add`, `lotar task add` and `lotar task edit`, the same way `comment -F -` does.

    - `description_from_stdin` in `crates/lotar-lib/src/cli/handlers/mod.rs` trims trailing newlines. It runs before anything is written, so a failed read changes nothing. Any other value, including `- a list item`, is saved as given
    - `task/edit.rs` reads stdin once, so with `--select` every matching task gets the same text
    - New tests in `crates/lotar-lib/tests/dev842_description_from_stdin_test.rs`: add, task add, edit, `--select` and a `-`-prefixed value. Invalid UTF-8 on stdin fails for both add and edit and writes nothing
    - `lotar task edit TST-1 -D -` with the installed build saves `'-'`; with the branch build it saves the piped text
    - The `--help` text and `docs/help/add.md` / `docs/help/task.md` say so
    - `scan` passes no description, so it is not affected. No caller relied on a literal `-`
    - Two sessions resumed this job in the same worktree, a case of the DEV-832/836 bug. The other thread made the first edits and stopped before committing; this one finished and committed
    - No guidance correction needed
