- date: 2026-11-24T21:38:48.695445+00:00
  author: claude
  text: |-
    `-D -` now reads the description from stdin in `lotar add`, `task add` and `task edit`, as DEV-776 did for `comment`.

    - New `description_from_stdin` in `crates/lotar-lib/src/cli/handlers/mod.rs`: only a lone `-` reads stdin, trailing newlines trimmed; any other value (also `- a list item`) is saved as given
    - Called before any write in `AddHandler::execute_with_finding` and once in `EditHandler::execute` (`task/edit.rs`), so `--select` gives every match the same text and a failed read changes nothing
    - Test `crates/lotar-lib/tests/dev842_description_from_stdin_test.rs`: add, task add, edit, `--select`, a `-`-prefixed value, and unreadable stdin (non-UTF-8: error, nothing written)
    - Repro from the ticket: installed build saved `'-'`, branch build saved `new`
    - `docs/help/add.md`, `docs/help/task.md` and the `-D` help text say so
    - Callers: no repo under `~/Development` passes a literal `-D -`
    - No guidance correction needed
