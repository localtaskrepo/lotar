    7. Tests: new tests/dev57_task_query.rs (transport parity pages+CSV+MCP, sort custom/missing/tie, strict invalid matrix, date/DST boundaries); keep existing relevant API/MCP/CLI tests passing.
    8. Targeted nextest only; no full gates until coordinator.
- date: 2026-09-11T15:44:04.737248+00:00
  text: |-
    Contract locked (coordinator directive, wave 2):
    - REST /api/tasks/list AND /api/tasks/export accept sort_by (builtins: priority|status|effort|due-date(due)|created|modified|assignee|type|project|id, plus custom:<name> with field:<name> alias), order=asc|desc. Default: modified desc, tie canonical ID lexical ASC (never flipped).
    - due=today|soon|later|overdue (date buckets in task local date; soon=(today,today+7], later>today+7, overdue<today), recent=7d (modified >= now-7d), needs=effort,due CSV strict (AND, blank = missing).
    - Strict 400/-32602 on invalid order/sort_by/due/recent/needs/sprints entries/status|priority|type enums; list limit strict 1..=200; export applies full filter+global order, no pagination.
    - MCP task_list gains sort_by/order/due/recent/needs; strict enum+sprints; deterministic default order. CLI list delegates to shared comparator, keeps CLI-only flags and bare-custom sort keys.
    - Docs vocabulary inspected: only recent=7d, needs effort|due exist (openapi list params). No other values.
- date: 2026-09-11T16:11:01.019218+00:00
  text: |-
    Backend implementation complete (not marking Done per coordinator; awaiting integration/full gates + frontend wave).

    Outcome: shared strict query executor + field accessor at src/services/task_query.rs, wired into REST /api/tasks/list AND /api/tasks/export, MCP task_list, and the CLI list comparator; docs/contracts updated.

    Contract as implemented (matches locked plan):
    - sort_by builtins priority|status|effort|due-date(due)|created|modified|assignee|type|project|id + custom:<name> (field:<name> alias, case-insensitive prefix, original name spelling). order asc|desc. Default modified desc; tie canonical ID lexical asc, never flipped.
    - due today|soon|later|overdue bucketed by local calendar date from parsed stored due (RFC3339/naive/date-only; no human-keyword re-eval); soon=(today,today+7], later>today+7, overdue<today; DST-safe date arithmetic + local-midnight conversion. recent=7d inclusive on parsed modified instants. needs CSV strict (effort,due ANDed).
    - Strict 400/-32602: invalid order/sort_by/due/recent/needs, bad sprints CSV entries (REST list+export), MCP invalid status/priority/type (with enum hints, previously silently dropped), MCP bad sprints entries, MCP type-confused params. REST list limit now strict 1..=200 (was clamped); export still ignores page params by design.
    - Export: full filter set + global order, no pagination (was: ignored due/recent/needs/order entirely).
    - MCP task_list schema: new params sort_by/order/due/recent/needs; deterministic default ordering; pagination over the global order.
    - CLI: delegates to shared comparator (parse_sort_by first, then CLI-only bare declared/wildcard custom names; unknown keys still silently ignored); --reverse maps to Desc; keeps mine/high/critical/overdue/due-soon/effort-min/max/--where CLI-extra semantics. CLI default remains storage order (only sorts when asked).

    Files: src/services/task_query.rs (new, 10 unit tests), src/services/mod.rs, src/routes/tasks.rs, src/routes/mod.rs (strict sprints + sort_by known key), src/utils/pagination.rs (parse_page_strict), src/mcp/server/handlers/tasks.rs, src/mcp/server/tools.rs, src/cli/handlers/task/search.rs, src/cli/args/task.rs (help text), docs/openapi.json (list+export params), docs/help/api-quick-reference.md, docs/help/mcp-tools.md, docs/help/list.md, tests/dev57_task_query_test.rs (new, 10 integration tests: transport parity pages+CSV+MCP, custom/missing/tie sorts, strict invalid matrix REST+MCP, due bucket boundaries incl. RFC3339-vs-date-only and no-due, recent cutoff band, effort sort parity, project sort).

    Evidence: nextest targeted: dev57 10/10, web_api_integration 25/25, mcp_server_unit 21/21, combined affected sweep 409/409 passed (1 leaky = scratch dtor), list/sort/export-name sweep 90/90+71/71+141/141, lib/bin units 238/238. cargo clippy --all-targets -D warnings clean; cargo fmt --all --check clean. No full npm test / smoke yet (coordinator holds gates). No git operations.

    Known deltas/risks:
    1. REST list limit>200 or =0 now 400 (was silent clamp) — UI always sends <=200; smoke/frontend agent informed surface.
    2. Modified sorting now parses instants (mixed-offset timestamps sort chronologically, corrupt values sort last asc) instead of raw string compare.
    3. CLI --reverse no longer flips the ID tiebreak (contract: tie always ID asc); verified CLI suites pass.
    4. MCP task_list now returns deterministic modified-desc order by default (was storage order).
    5. Integration recent-boundary test uses +/-2s band around cutoff (handler clock skew); exact inclusivity unit-tested with injected clock.
    6. DEV-65 cache redesign intentionally untouched; DEV-56 identity/root rules untouched.

    Remaining: coordinator to run full gates (npm run lint/test/smoke) and frontend agent to forward sort_by/order + smart filters from view/ (server already authoritative).
- date: 2026-09-11T19:14:52.017810+00:00
  text: |-
    Next-wave checkpoint (review findings addressed; still InProgress per coordinator).

    1) Project-scoped enum validation: REST parse_task_query and MCP task_list now resolve config_for_project(tasks_root, project) for status/priority/type validation when an explicit project is requested (base config for cross-project queries). Regression: project-only enum accepted for its project, other-project enum 400/-32602.
    2) CLI aligned with shared executor: default order now modified desc + canonical-ID asc tie (was storage order); invalid --sort-by is an explicit error (bare configured custom fields still accepted; field:/custom: prefixes accepted); --overdue uses the shared local-date bucket (due before today; a due later today is never overdue); --due-soon[=days] uses the shared inclusive window today..=today+days; --assignee/--mine use the fuzzy member_key predicate (case/@-insensitive) like REST/MCP.
    3) New sort keys restoring UI headers: title (case-sensitive scalar), reporter (Option semantics identical to assignee: None first ascending), tags (array-lex of strings, empty first ascending), sprints (numeric vec-lex of the ascending sprint-id list derived from @sprints membership, empty first ascending). Canonical-ID asc tie unchanged. Documented in openapi.json, MCP tools schema, api-quick-reference.md, mcp-tools.md, list.md; CLI --sort-by help updated.
    4) Strict blanks: explicitly blank due/recent/needs now 400 (REST list+export) and -32602 (MCP); omit the param to clear. UI told to omit empty values.
    5) DST-gap robustness: due smart filters bucket date-only values directly on their calendar date (no local-midnight resolution involved); sorting maps date-only dues to the earliest valid local instant of that date (minute-scan fallback through DST gaps).
    6) task_selection already reuses TaskService::list + the shared where-filter resolver; no ordering/flags added there.

    Files this wave: src/services/task_query.rs (StoredDue, window/overdue predicates, new SortKeys, strict blanks, earliest_local_instant), src/routes/mod.rs, src/mcp/server/handlers/tasks.rs, src/cli/handlers/task/search.rs, src/cli/args/task.rs, docs (openapi.json, api-quick-reference.md, mcp-tools.md, list.md), tests/dev57_task_query_test.rs (14 tests now).

    Verification: dev57 14/14 (incl. project-scoped enums REST+MCP, new keys parity, strict blanks, CLI default order/strict sort/date buckets/fuzzy assignee); affected sweep 436/436; name sweeps 144/144; 405/405 final; cargo clippy --all-targets -D warnings clean; cargo fmt --check clean. No git ops; view/ and smoke/ untouched.
