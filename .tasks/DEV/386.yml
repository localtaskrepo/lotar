description: |-
  Tickets can only depend on tickets in the same tasks directory. Agents in one repo often wait on another repo's ticket: standards STD-54 waits for lotar's release DEV-374, standards tickets wait on lotar features. Today that link is a sentence in the description and nothing wakes the ticket. The owner wants waiting work to continue by itself (2026-11-12, see the related unblocked-hook ticket: "Let's do it right from the start").

  ## Plan
  - A relationship to a ticket in another local repo's lotar (e.g. `depends_on: lotar:DEV-374` resolved through a registry of repos, or by path/server URL); shown with its link (server.public_url of that repo).
  - Dependency evaluation reads the other repo's ticket status; closing that ticket fires the unblocked hook in the dependent's repo (the other repo's process may not know the dependent: a reverse index, or the dependent's repo checks on its own events and on `lotar automation run`).
  - Decide and document what happens when the other repo is missing or unreadable (unresolved, as for deleted prerequisites).

  ## Done when
  - [ ] A standards ticket can depend on a lotar ticket, shows it with its link, and is unblocked when it closes, with a test
  - [ ] Documented
