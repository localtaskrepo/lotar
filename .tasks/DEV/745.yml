    Fixed: the worker no longer hangs when a profile's background process keeps the login shell's output open.

    - `login_shell_path` (`crates/lotar-agent/src/services/agent_queue_service.rs`): the reader thread sends its output over a channel; `recv_timeout` waits only until the same 5 s deadline, then the worker keeps its own PATH
