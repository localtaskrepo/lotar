    - `docs/help/agent.md`: the 5 s limit also covers output a background process keeps open
    - Branch rebased on main `d3040a8e3` (has DEV-731)
    - `npm run smoke`: two full runs each failed one unrelated UI test (`ui.advanced` insights dashboard, `ui.agent-jobs` live log stream); each file passes alone, machine load average was 27
