    Review: passed. `de71379ac` does what "Done when" asks, nothing more, and its test fails without the fix.

    - Read: the ticket, DEV-731, DEV-750, `AGENTS.md`, the diff (`agent_queue_service.rs`, `agent_safety_test.rs`, `docs/help/agent.md`), `git log -5 main` on those files. Main since `d3040a8e3` (DEV-743, DEV-744) doesn't touch them.
    - Fix: `login_shell_path` now gets the shell's output over a channel with `recv_timeout`, inside the same 5 s deadline that limits the shell. On a timeout it returns `None`, so `set_var` doesn't run while the reader thread is still alive. The updated SAFETY comment holds.
    - Test without the fix: in a scratch worktree with `main`'s `agent_queue_service.rs` and the workspace rebuilt, `worker_keeps_its_path_when_login_shell_output_stays_open` failed all 3 tries (`worker did not exit after draining jobs`, 15 s).
    - Gotcha: `cargo nextest run -p lotar-lib` doesn't rebuild `target/debug/lotar`, so the test passed with a stale binary. It needs `--workspace`.
    - Test with the fix: `cargo nextest run --workspace -E 'test(agent_safety) | test(login_shell) | test(merge_paths)'` ran 40 tests, all passed. `automatic_cleanup_preserves_missing_malformed_dirty_and_unmerged_worktrees` needed 3 tries; it's a git cleanup test unrelated to this change, run under load.
    - `cargo clippy -p lotar-agent -p lotar-lib --all-targets -- -D warnings`: clean. `rustfmt --check` on both Rust files: clean. `npm ci`: ok.
    - Docs: `docs/help/agent.md` now says the 5 s limit also covers output a background process keeps open, which matches the code.
    - Not rerun: full `npm run lint`, `npm test`, `npm run smoke` (too long). The fix agent's smoke flakes are DEV-750, which is in Reviewing with its own fix.
    - Not UI work, so no screenshots. No stray files, one commit, no second branch. No findings, no tickets filed.
