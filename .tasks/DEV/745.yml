description: |-
  The queue worker's login-shell PATH lookup (DEV-731) can hang the worker for good, although `docs/help/agent.md` says it gives up after 5 seconds. Found in the DEV-731 review, 2026-11-20.

  ## Cause

  - `login_shell_path` in `crates/lotar-agent/src/services/agent_queue_service.rs` enforces its 5 second limit only while the shell runs (`child.try_wait()` loop)
  - After the shell exits it calls `reader.join()` with no limit. The reader thread only ends when the pipe closes, i.e. when every process holding stdout has exited
  - A profile that starts something in the background without redirecting its stdout (an agent, a daemon, `cmd &`) keeps the pipe open, so the worker blocks before it takes its first job

  ## Fix

  Give up on the reader too once the deadline passes, for example by receiving its output over a channel with `recv_timeout`. On a timeout, keep the PATH the worker got, as the docs already say.

  ## Done when

  - [x] A test with a fake login shell that leaves a background `sleep` holding stdout shows that the worker still runs its job with its own PATH within about 5 s
