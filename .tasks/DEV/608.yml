- date: 2026-11-16T05:07:45.504413+00:00
  author: claude
  text: |-
    Fixed: a T3 merge job no longer hears of earlier uncommitted worktrees, and every other job is told only a fix/rework carries them over.

    - `t3_thread_notes` takes `is_merge_job` and skips the list for merge jobs (profile `merge` or ticket in `Merging`).
    - Note for other jobs: "A job that takes the work over (a fix or rework) reads them there … and carries over what it still needs; a later job may have carried them over or dropped them already, so check the ticket's commits and comments first. A review job leaves them alone."
    - LoTaR can't tell a review job from its profile name (repos name them freely), so the wording covers reviews.
    - Built on DEV-583's `eba9fc33` (cherry-picked as `2f833a1b`), since the code lives only there; DEV-583 has to merge first.
    - Test: `a_retried_t3_job_learns_its_threads_branch_and_where_the_earlier_work_is` now also runs a review and a merge job; fails without the fix.
    - Docs: `docs/help/agent.md` ("This job").
  report:
    commits:
    - hash: 9849ff77
      what: merge jobs get no note; other jobs' note says only a fix/rework carries over, may be done already, review leaves it
    - hash: 2f833a1b
      what: cherry-pick of DEV-583 eba9fc33 (not on main yet); drops out when the merge rebases after DEV-583 lands
    checks:
    - command: npm run lint (lint:agent)
      result: passed
    - command: npm test (test:agent)
      result: passed
    - command: npm run smoke (test:smoke:agent)
      result: passed
      reason: 405/405
    - command: new assertions without the fix
      result: passed
      reason: test fails as it should
    - command: real T3 retry, review, merge end to end
      result: not_run
      reason: covered by the fake-T3 integration test
    next: Review on another model; merge after DEV-583
- date: 2026-11-16T05:59:46.515071+00:00
  author: claude
  text: |-
    Review: passed. `9849ff77` does what "Done when" asks; nothing blocking.

    - Read: the ticket, DEV-583, AGENTS.md, the diff of `main..HEAD`, `is_merge_job_candidate` (`agent_job_service.rs:4520`: profile `merge` or ticket in `Merging`), and `docs/help/agent.md`.
    - Merge jobs: `t3_thread_notes` returns before the worktree list. Other T3 jobs keep path, branch and `git -C` commands, with the new fix/rework/review wording. Non-T3 runners: unchanged, since the note is only added when `t3_thread` is set.
    - Test: `a_retried_t3_job_learns_…` checks that the review prompt has the new wording and the merge prompt doesn't name the old worktree. Both assertions fail on the old code, which gave every T3 job the note.
    - Reran `cargo nextest run --test integration dev503` (26/26 passed) and `npm run lint` (passed). `npm test` and smoke: not rerun; the change only touches prompt text.
    - For the merge agent: main already has DEV-583 as `18314609`. The copied `2f833a1b` won't drop by itself on rebase: its patch differs (main's also edited `.tasks`) and it conflicts in `dev503_harness_jobs_test.rs`. Use `git rebase --onto main 2f833a1b`. I checked that `9849ff77` cherry-picked onto main `3db5898c` applies cleanly and passes dev503 (32/32).
    - No tickets filed.
