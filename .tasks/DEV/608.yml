references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Aa4b5016f-4464-4c66-9b06-16db3ff01f88
description: |-
  Found in the DEV-583 review (eba9fc33). `t3_thread_notes` (`crates/lotar-lib/src/services/agent_job_service.rs`, `uncommitted_ticket_worktrees`) lists every worktree of the ticket with uncommitted changes and says "carry over what you need; leave that worktree as it is". Since the worktree is left as it is, the note stays in every later T3 job on the ticket: the review job (told to change no files) and the merge job (which could pull in changes the fix agent chose to drop). Check: fail a T3 fix job with uncommitted changes, retry it, then start the review: the review prompt still names the old worktree with 'carry over'.

  ## Done when
  - [ ] A T3 merge job (profile `merge` or ticket in `Merging`) gets no note about earlier worktrees' uncommitted changes.
  - [ ] Every other T3 job still names each such worktree (path, branch, `git -C` commands), but says only a job that takes the work over (fix, rework) carries over what it still needs; the changes may be carried over or dropped already (check the ticket's commits and comments first); a review job leaves them alone; nobody changes that worktree.
  - [ ] LoTaR doesn't guess a review job from its profile name (repos name review profiles freely): the wording covers it.
  - [ ] Non-T3 runners: unchanged (no such note).
  - [ ] A test covers both: merge-job prompt lacks the note, a later non-merge job's prompt has the new wording.
  - [ ] `docs/help/agent.md` describes it.
