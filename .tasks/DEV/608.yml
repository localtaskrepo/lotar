title: A T3 job's prompt keeps telling every later job on the ticket to carry over an earlier job's uncommitted changes
status: Reviewing
priority: Medium
type: Bug
reporter: claude
assignee: '@review'
created: 2026-11-16T04:26:06.797877+00:00
