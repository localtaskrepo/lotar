relationships:
  related:
  - DEV-583
comments:
- date: 2026-11-16T05:07:45.504413+00:00
  author: claude
  text: |-
    Fixed: a T3 merge job no longer hears of earlier uncommitted worktrees, and every other job is told only a fix/rework carries them over.

    - `t3_thread_notes` takes `is_merge_job` and skips the list for merge jobs (profile `merge` or ticket in `Merging`).
    - Note for other jobs: "A job that takes the work over (a fix or rework) reads them there … and carries over what it still needs; a later job may have carried them over or dropped them already, so check the ticket's commits and comments first. A review job leaves them alone."
    - LoTaR can't tell a review job from its profile name (repos name them freely), so the wording covers reviews.
    - Built on DEV-583's `eba9fc33` (cherry-picked as `2f833a1b`), since the code lives only there; DEV-583 has to merge first.
    - Test: `a_retried_t3_job_learns_its_threads_branch_and_where_the_earlier_work_is` now also runs a review and a merge job; fails without the fix.
    - Docs: `docs/help/agent.md` ("This job").
  report:
    commits:
    - hash: 9849ff77
      what: merge jobs get no note; other jobs' note says only a fix/rework carries over, may be done already, review leaves it
    - hash: 2f833a1b
      what: cherry-pick of DEV-583 eba9fc33 (not on main yet); drops out when the merge rebases after DEV-583 lands
