description: 'Found in the DEV-583 review (eba9fc33). `t3_thread_notes` (`crates/lotar-lib/src/services/agent_job_service.rs`, `uncommitted_ticket_worktrees`) lists every worktree of the ticket with uncommitted changes and says "carry over what you need; leave that worktree as it is". Since the worktree is left as it is, the note stays in every later T3 job on the ticket: the review job (told to change no files) and the merge job (which could pull in changes the fix agent chose to drop). Check: fail a T3 fix job with uncommitted changes, retry it, then start the review: the review prompt still names the old worktree with ''carry over''. Done: the note reaches only jobs that should take the work over (fix/rework), or says the work may already be carried over and a review or merge job leaves it alone.'
