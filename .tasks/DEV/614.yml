- date: 2026-11-16T19:56:46.513700+00:00
  author: claude
  text: |-
    More evidence for `2f6dd0eb`: the fix holds under heavy load.

    - Before the fix: the two repair-preview tests failed in 4 of 9 full runs; a diagnostic showed the notice "Task data changed. Preview safe repair again before applying." in place of the preview.
    - First helper version waited for the SSE `ready` event, which the server only sends with `?ready=1`. Switched to `open`: the server subscribes before it sends headers.
    - After the fix: both tests passed in 5 of 5 full runs at load average ~110. The other 4–12 failures per run are timeouts in specs this change doesn't touch.
    - Not shown yet: the full smoke passing repeatedly on a quiet machine. The merge agent's rerun covers that.
