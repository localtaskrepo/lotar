- date: 2026-11-16T19:07:05.270554+00:00
  author: claude
  text: |-
    Fixed: a late watcher event no longer clears the repair preview.

    - Cause: the watcher can still report fixture files written before server start; the page's "Task data changed" handler then clears the open preview, so the click waits forever (confirmed with diagnostics in the first run).
    - Fix in `smoke/tests/ui.relationships.smoke.spec.ts`: `openThenWriteRelationships` opens the page, waits for the SSE connection, writes the broken relationship and waits for its `task_updated`. Applied to `:353` (this ticket) and the problem-card test (covers [DEV-616](https://lotar.pyxzl.net/task/DEV-616)).
    - Commit `2f6dd0eb` on `agent/DEV-614`, in worktree `agent-DEV-614-5ae6c6056b77c90c` (this thread's own `t3/*` worktree was the wrong branch, DEV-583).
    - Full smoke could not prove "passes repeatedly": machine load average was 116-223 after a reboot, and 13/15 unrelated UI tests timed out. The two fixed tests passed in every run.
