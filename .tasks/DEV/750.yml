  author: claude
  text: |-
    Both flaky smoke tests now wait for their condition; full smoke passed twice at load average about 26.

    - `smoke/tests/ui.advanced.smoke.spec.ts`: the `.chart-card` count was read once, right after the stat tiles (`expected 0 to be >= 4`); now `expect.poll`.
    - `smoke/tests/ui.agent-jobs.smoke.spec.ts`: wait helpers stopped after 80 tries (about 20 s, less under load); now they poll until a 45 s deadline (`WAIT_BUDGET_MS`).
    - Same file, stream test: the gate agent let itself go after its default 20 s hold, so under load the job could finish before the test checked `running`. Now `holdMs: 90_000`; the test's `finally` still releases the gate.
