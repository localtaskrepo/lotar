- date: 2026-11-21T04:07:03.963867+00:00
  author: claude
  text: |-
    Review: passed. Both flaky tests now wait for their condition and passed in a full smoke run under heavy load.

    - Read: `8a705a8b9` (the only commit in `main..HEAD`, 2 smoke files), the ticket and fix comment, DEV-745, AGENTS.md, the gate fixture (`smoke/helpers/agent-fixtures.ts:342`, `holdMs` → `--hold-ms`) and `smoke/vitest.config.ts` (120 s test timeout). Nothing on main since touches these files.
    - `ui.advanced.smoke.spec.ts:144`: the one-time `.chart-card` count is now `expect.poll`. This is the reported `expected 0 >= 4`.
    - `ui.agent-jobs.smoke.spec.ts`: the wait helpers now use a 45 s deadline (`WAIT_BUDGET_MS`) instead of 80 tries. The stream gate holds for 90 s, longer than the waits before its `running` check. The `finally` block still drains and releases the gate, so a failure doesn't leave the agent running for 90 s.
    - Scope matches Done: no other files changed, no product code, no owner decisions. The failure is load-dependent, so there is no failing-before test, as expected.
    - Reran: `npm ci` ok. `tsc -p smoke`, `oxlint`, `prettier --check` on both files passed. Full `npm run test:smoke:agent` at load average 28–36: both target tests passed, but 5 other tests in 4 untouched files timed out. Those 4 files plus the 2 target files then passed alone (40/40).
    - Filed: [DEV-755](https://lotar.pyxzl.net/task/DEV-755) for the other load flakes (`api.automation`, `api.review-policy`, `ui.dialogs`, `ui.filter-autocomplete`).
    - Not rerun: `npm test` and the full `npm run lint` (Rust is unchanged).
