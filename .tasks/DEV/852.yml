- date: 2026-11-25T08:02:46.204900+00:00
  author: claude
  text: |-
    A rule's `comment:` can now ask a question with options; answering applies the option's `set`.

    - `comment:` keeps the string form and also takes `{ text, question: { options: [{ key, label, set }], recommended, multiple, other } }` (`AutomationComment` in `crates/lotar-agent/src/automation/types.rs`)
    - Written by `automation` through the new `TaskService::ask_question_with_context`, so it fires no `on.commented` rules; `text` and labels take templates
    - Saving rules and `lotar config validate` refuse bad questions with `Rule '<name>' (<event>): comment question: ...`. `config validate` now also checks the scope's `automation.yml`; the standards rules file gives warnings only, no errors
    - `lotar automation simulate` shows `Ask: ...` with the options
    - Web rule builder: a rule with a question is YAML-only, so the builder can't drop it; summaries say `ask`. Only `view/utils` changed (no page, component or style), so no ui tag or screenshots
    - REST/OpenAPI unchanged: rules travel as YAML text
    - Docs: `docs/help/automation.md#asking-a-question`, `docs/help/config.md`. The example was run end to end in a scratch workspace
    - Guidance: no durable finding
