  text: |-
    Review: blocking. The code fix is right; `docs/help/agent.md` still says automation's comments are never picked, but the code picks one as the open question.

    - Read: `bc9ba04c` (only commit beyond main; DEV-620 `1227e5bd` = main's `6a78ba88`), the ticket, DEV-620, DEV-631, `prompt_comments` and `build_prompt`
    - Reran: `cargo nextest run -p lotar-lib --lib agent_job_service` (49 passed), `npm run lint` (passed). The new test would fail on the old code (old header always had "; below the")
    - Done when 1: met
    - Done when 2 not met: `docs/help/agent.md:58` says "When no comment is picked (all are automation's, …)" and "automation's comments are left out". In `agent_job_service.rs:1260` (`before_hand_back`) the open question has no automation filter: only `newest_in` (line 1284) skips `automation`. Example: an automation "job failed" comment, then a hand-back to mallox: that comment becomes the `Open question`, and an all-automation ticket gets a pick
    - Fix: in the doc, say automation's comments are left out of the newest fix and review comments only, and give the no-pick case as the code applies it: no comment before the last hand-back to a person (other than that person's), no question comment, no comment written in a fix or review phase. Leaving out automation in `before_hand_back` too would change DEV-620's behaviour: only if the owner wants that
