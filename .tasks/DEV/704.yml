- date: 2026-11-18T18:50:53.353327+00:00
  author: claude
  text: |-
    Fixed: a failed turn's error stays the job's summary; the "reported no cost" note is in the log only.

    - Cause: `finish` in `drive_turns` (`crates/lotar-agent/src/services/agent_job_service.rs`) wrote the note via `progress`, which also set `last_message`, the source of the summary.
    - Now it records the event without touching `last_message`.
    - Test `a_failed_turns_error_stays_the_last_message_when_no_cost_came`: a rate-limit `TurnFailed` with a budget and no cost; failed before the fix.
    - Check command in standards still lists 51 such jobs: old records, the fix applies to new jobs.
