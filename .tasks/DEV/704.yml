- date: 2026-11-18T19:49:26.301862+00:00
  author: claude
  text: |-
    Review: passed. A failed turn's error now stays the job's summary; the budget note is in the log only.

    - Read: `bf613ebed` (only `crates/lotar-agent/src/services/agent_job_service.rs`), the ticket, AGENTS.md, the last 5 main commits to the file. No newer ticket branch; no stray files.
    - `finish` in `drive_turns` (line 4273) now records the note with `record_and_emit` without setting `last_message`; finalize (line 5052) copies `last_message` to `summary`, so the `TurnFailed` error (line 4446) stays. A completed job keeps the agent's reply as summary too, which the same note used to replace.
    - `pause_cause` (line 5167) still sees the note among the last 10 events; saved jobs take `summary` from the status record. Nothing else depended on the note being the last message.
    - Test `a_failed_turns_error_stays_the_last_message_when_no_cost_came` covers "Done when". Against the old code its `last_message` assert would fail (the old `progress` set it to the note). I didn't run it on the old code.
    - Reran: `npm ci` passed, `npm run lint:agent` passed, `npm run test:rust:agent` passed (2380 tests). `npm run smoke` not rerun: backend-only change, and the fix agent ran it (405 passed).
    - No UI change, no owner decision touched, no tickets filed.
