description: |-
  ## Found
  - The communication review (standards STD-17, 2026-11-18) saw 53 failed headless Claude jobs in standards since 2026-11-16 whose summary is only "The agent reported no cost, so the profile's max_budget_usd was not checked." (18 on 2026-11-18 01:07-01:13Z, INBOX-491 to INBOX-509).
  - Their logs show the real cause one line earlier, e.g. `lotar agent logs job-20261118T011303.077Z-900` (in standards): `Internal error: You've hit your 5-hour limit · resets 6pm (America/Los_Angeles)` with `"errorKind": "rate_limit"`, then the budget note, then `agent_job_failed`.
  - The job's summary is what triage, the Agents page and the owner read, so a usage limit looks like a budget problem.

  ## How to check
  `lotar --format json agent list-jobs -n 2000` in ~/Development/standards: failed jobs whose summary starts "The agent reported no cost".

  ## Done when
  - A job that fails on a turn error keeps that error as its summary; the "budget not checked" note stays in the log only (a test with a rate-limit turn failure).
