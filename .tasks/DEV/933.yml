    Review: passed. `159432151` adds the two tests "Done when" asks for, and they catch the bug.

    - Read: the diff (one file, `crates/lotar-agent/src/services/agent_job_service/hosted.rs`, tests only), `resume_session_to_end` (`agent_job_service.rs:2546`), the fake `LOTAR_SSH` fixture, DEV-931's commit `11cb38081` on main.
    - Done when 1: the takeover test resumes the session through the fake ssh and the agent runs in the host's worktree. It checks that the commits and the leftover came back signed, the host's worktree is gone, the slot is free and the job is `completed`.
    - Done when 2: in the "could not be resumed" test, the commit and leftover come back and the job is `paused` and queued again with `session: fresh`.
    - Reran: `npm ci` (ok); `cargo nextest run -p lotar-agent -E 'test(/a_taken_over_headless_job/) | test(/hosted::/)'`, 22 passed; `npm run lint` passed.
    - Mutation: I used the Mac's agent table in place of `host_agent_table` and test 1 failed. I put the file back and the worktree is clean.
    - Minor, filed: [DEV-936](https://lotar.pyxzl.net/task/DEV-936). No test covers a cancel during the takeover (`finish_on_host(.., Stopped, ..)`). The ticket names this branch in "Found", but "Done when" doesn't ask for it.
