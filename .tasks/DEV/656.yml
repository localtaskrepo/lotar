- date: 2026-11-17T08:55:34.148740+00:00
  author: claude
  text: |-
    Review: blocking. Merged now, the header would name a test binary that doesn't exist on main, and nothing stops the merge from happening now.

    - Read: commit `9eb886fb8` (the only one in `main..HEAD`; `agent/DEV-656` is the same commit), the ticket, DEV-655 and its comments, `crates/lotar-agent/tests/windows_regressions.rs` and the ci.yml comment on `agent/DEV-655`, and the merge rule in `.tasks/DEV/automation.yml`.
    - The wording matches the lotar-agent header and the ci.yml comment, so "Done when" item 1 holds on DEV-655's tree. Reran `npm run lint`: passed. The worktree is clean.
    - **Blocking:** `crates/lotar-lib/tests/windows_regressions.rs:3-4` names "crates/lotar-agent's `windows_regressions`". But the commit is based on main, which has no `crates/lotar-agent` (`git ls-tree main crates/` lists only lotar-core, lotar-lib and lotar-web-assets). Main's ci.yml comment (line 608) still says "binary" and lists async-run under lotar-lib.
    - The "merge after DEV-655" note exists only as a comment. The merge prompt ("Review passed: merge") never reads comments or relationships: it rebases, runs the checks (they pass, since only a comment changed), then fast-forwards and pushes. DEV-655 and DEV-634 are HelpNeeded, waiting for the owner, so DEV-656 would land first and leave main wrong.
    - **Fix, either one:** (a) set DEV-656 to `Blocked` with `depends_on` DEV-655, so "Prerequisites done" continues it after DEV-655 lands, then rebase onto main; or (b) move this hunk into DEV-655's branch, since its "Done when" already asks that the docs naming the Windows selection name both binaries. Then close DEV-656 as WontDo.
    - Minor, not filed (taste): line 6 is 111 characters while the rest of the header wraps at 80. Rewrapping it fits whichever rework happens.
