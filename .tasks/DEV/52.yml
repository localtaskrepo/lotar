- date: 2026-09-04T19:26:11.459882+00:00
  text: 'T1.1+T3 done: single cached config engine (resolution.rs) with (mtime,len) fingerprint validation; ConfigManager delegates to it; new config_for_project() replaces hand-rolled project fallbacks (task_service, automation_service, agent_job_service, routes/agents, cli/agent, effort.rs per-task loops); prefix-based cache invalidation covers per-project entries. Dead code removed: TaskEditor.vue+spec, Inbox.vue, read_to_string_opt, ConfigManager::new/new_with_tasks_dir, storage backend trait.'
- date: 2026-09-04T19:42:31.800634+00:00
  text: 'T1.2-T1.5 done: identity unified onto detector chain (single cache, @me skip in ConfigDefaultReporterDetector); date grammar single-sourced in utils/time (validation.rs facade, automation_matching delegates); tolerant task-YAML parsing in storage/task.rs (parse_status_from_yaml + parse_task_yaml_tolerant, 5 sites); operations::get + audit activity feed route through mtime-validated task cache; list_files_with_ext_recursive replaces 3 hand-rolled walkers.'
- date: 2026-09-05T04:07:32.007239+00:00
  text: 'All audit items complete. T2: TaskService::update_comment (REST+MCP delegate); shared parse_task_query/apply_unknown_key_filters (list+export+MCP, export gains @me/__none__/sprints/unknown-keys); audit_service run_git_log/parse_commit_header/CommitHeader; SprintsList on useColumns (dup watcher gone, keys preserved via storagePrefix); formatRelativeTime/formatDateTime/listFromCsv adoption (FilterBar, TaskRow, SmartListChips, grammar, relationships, automation editor, backlog, TasksList+SprintsList buildServerFilter); useSuggestList (TagEditor+ProjectInsights); routePath option in useProjectFilterSync (SprintsList+Board; Calendar keeps preserve-keys variant by design). T4: is_active_or_overdue + active_sprint_ids; custom_value_to_string delegation; utils/text.ts (titleCase/projectOf/numericOf) + MS_PER_DAY + isTaskOverdue (fixes SprintsList false-overdue on today in non-UTC) + runSprintLifecycle; utils/storage.ts (9 files); config_precedence_test uses shared env mutex. WON''T DO: shared vitest fixture (vi.hoisted runs before imports; specs intentionally self-contained). Wire compat: TaskListFilter.assignee now Vec<String> with string-or-array deser (legacy bodies keep working); UI types updated. Gates: fmt, clippy -D warnings, vue-tsc, nextest 776/776, vitest 238/238, smoke 94 passed/23 git-gated skips. 71 files changed.'
- date: 2026-09-05T04:37:33.686568+00:00
  text: 'Review follow-up (post /review, all findings fixed): (1) MCP task/list @me now fails CLOSED with explicit -32002 error when identity unresolvable; REST parse_task_query errors likewise. (2) Identity precedence corrected: config > git > env > manifest (manifest is last-resort; auto_identity=false keeps Config+Env) — whoami/@me/stamping agree and no longer flip to package.json authors; cli_manifest_identity_test updated to pin new precedence. (3) Assignee matching normalized via fuzzy member_key (case/@/separator-insensitive) restoring documented openapi semantics on all surfaces; fuzzy norm strips leading @ so @alice≈alice everywhere. (4) Config project cache only caches existing project dirs + 256-entry hard cap (fixes unbounded growth via ?project=). (5) audit_service resolve_project_pathspec validates project filters (rejects traversal/nondirs) before git pathspecs. (6) resolve_task_filter_values shared in utils/custom_fields.rs replaces the 4 resolver copies (routes, CLI search, task selection, effort grouping); super_key_from_custom deleted. (7) DST-safe date offsets (offset_from_local_today snaps to local midnight). (8) useColumns/preferences/theme on utils/storage.ts + storageRemove; FilterBar removeItem migrated. (9) Dead bindings + redundant setLifecycleBusy calls removed. Gates: fmt, clippy -D warnings, vue-tsc, nextest 776/776, vitest 238/238, smoke 94 passed.'
- date: 2026-09-05T05:17:07.595022+00:00
  text: 'Doc sync pass: docs/help+docs/developers identity/precedence/whoami pages updated to the new detector order (config > git > env > manifest-last-resort; auto.identity=false keeps config+env) and the single-resolver guarantee; due-date.md documents signed/ago offsets and DST-safe local date arithmetic; mcp.md/mcp-tools.md document the -32002 fail-closed @me error; openapi.json updated (tasks/add chain incl. manifest fallback, tasks/list+assignee param document 400 on unresolvable @me, tasks/export gains a description declaring filter parity with list, all four /api/activity project params document 400-on-invalid); api-quick-reference notes the same. Code harmonized to match docs: list_activity_feed + list_changed_tasks now validate project filters (previously silent fallback/empty), and all four activity route handlers map Unknown/Invalid project errors to 400 instead of 500. Stale src/routes.rs reference fixed to src/routes/whoami.rs. Gates: JSON valid, nextest 776/776, fmt, clippy -D warnings, vitest 238/238, smoke 94 passed/23 git-gated skips.'
description: 'Fix all findings from the 2026-09-04 duplication audit: T1 config/identity/date-grammar/tolerant-parse/cache-bypass; T2 comment mutation, filter building, git-log parsing, SprintsList column store, date/CSV helpers, tag-suggest, route sync; T3 dead code; T4 minor mechanical.'
