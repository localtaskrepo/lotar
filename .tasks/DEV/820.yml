  actor: claude
  changes:
  - field: description
    old: |-
      Found in the DEV-762 review, 2026-11-22.

      - The build root works only when git ignores `target` as a link: `/target`, not `target/` (`git check-ignore` in `clone_build_output`, `crates/lotar-agent/src/services/agent_job_service.rs`; DEV-762, not on main yet).
      - lotar's `.gitignore` has `/target`; staff, harnessmux and autospec have `target/`. With LOCA-571 on, their jobs keep building in the worktree; each job log says why.
      - Fix: either those repos change `target/` to `/target` as part of LOCA-571 step 4, or lotar adds `/target` to the repository's `info/exclude` when `build_root` is set. Choosing between the two is the owner's call.
      - LOCA-571 step 4 also makes each main checkout's `target` a symlink. With `target/` in `.gitignore` that link shows up untracked in the main checkout too, so it needs the same ignore either way.

      ## Done when

      - [ ] Owner's choice recorded here, dated, in his words
      - [ ] staff, harnessmux and autospec: a new job worktree with `build_root` set gets `target` as a link into `<build_root>/<repo>/<ticket>`, and the job log has no "not ignored" fallback line
      - [ ] The link is not in `git status` of the worktree or the main checkout
      - [ ] If lotar changes (info/exclude): it adds the line only when `build_root` is set and the line is missing, never twice; a failed write leaves the build in the worktree and logs why (the current fallback); a test covers both; docs/help/agent.md says so
      - [ ] If the repos change: each repo's `.gitignore` commit is on its main; lotar's docs/help/agent.md still says which line is needed
