- date: 2026-11-23T05:35:12.179349+00:00
  author: claude
  text: |-
    Needs your choice: which fix should make the build root work in staff, harnessmux and autospec?

    - `.gitignore` has `target/` in `~/Development/staff`, `@localtaskrepo/harnessmux` and `@localtaskrepo/autospec`; lotar has `/target`. A `target/` line doesn't ignore a symlink, so the job falls back to building in the worktree
    - LOCA-571 step 4 also turns each main checkout's `target` into a link. With `target/` that link shows as untracked in the main checkouts too, and `info/exclude` set by lotar jobs would cover it only by accident
    - No thread or ticket has an answer yet (searched T3 threads, DEV-762, LOCA-571)
    - DEV-762 (the build root itself) isn't on main yet: it's in Merging

    **Question:** fix it in the repos or in lotar?
    1. **Repos (recommended):** change `target/` to `target` (no slash: still ignores nested ones, like harnessmux's `xtask/`, and also the link) in the 3 repos' `.gitignore`, as part of LOCA-571 step 4. Visible in each repo, covers main checkouts too, no lotar code
    2. **lotar:** when `build_root` is set, lotar writes `/target` into the repo's `.git/info/exclude` (hidden, local to this Mac)
