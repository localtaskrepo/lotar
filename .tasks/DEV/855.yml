- date: 2026-11-25T21:15:27.235762+00:00
  author: claude
  text: |-
    Waits for harnessmux HARN-31: the reset time is in T3's own usage-limit notice, which harnessmux drops.

    - T3's activity for the failed run (`t3_thread_read` view activity, thread `mcp:launch:8435be66…`) has a `system_notice` "Claude usage limit reached. This turn is paused until the 7-day limit resets in 31h 5m.", itemId ending `seven_day:1795536000` (= 2026-11-24T16:00Z, the real reset).
    - harnessmux 0.3.0 `errors_of` (`src/backend/t3.rs`) keeps only `type: error` items, so lotar gets `RateLimited` with `resets_at: None` and waits the default hour.
    - `usage_limit::of_failures` already prefers a failure's `resets_at`, and still ignores the agent's reply (DEV-711).
    - Filed HARN-31 (finding `agent-jobs:t3-limit-notice-reset`). Next here: bump harnessmux to its patch release and add a test that a t3 limit failure with `resets_at` pauses until that time.
- date: 2026-11-25T23:16:33.412388+00:00
  author: claude
  text: 'Stalled since 2026-11-25T22:12Z with no lotar job: the live check restarted @fix-retry, its prerequisites are done (lotar rule "Prerequisites done: continue the waiting ticket"). A second stall at this step goes to mallox (repos.ts --live --report, STD-167).'
- date: 2026-11-26T02:20:27.074051+00:00
  author: claude
  text: |-
    Fixed: lotar now uses harnessmux 0.3.1, which gives a t3 limit failure the reset from T3's own notice.

    - Released harnessmux `v0.3.1` (signed tag on `f481466`, `origin/main`); release.yml run `45740889916` built it and published the crate. Its AGENTS.md lets agents release harnessmux.
    - `Cargo.toml`/`Cargo.lock`: harnessmux `0.3.0` → `0.3.1`.
    - New test `a_t3_limit_waits_for_the_reset_t3s_notice_names` (`crates/lotar-agent/src/services/usage_limit.rs`): the failure as harnessmux builds it for the 2026-11-23 run, with `resets_at` from the notice, resumes at that reset, not after the default hour.
    - No end-to-end test with a fake T3 server: that needs harnessmux's fake MCP/OAuth server, which harnessmux's own `usage_limit_notice_gives_the_reset` covers.
