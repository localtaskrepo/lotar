- date: 2026-11-26T07:11:04.679265+00:00
  author: claude
  text: |-
    Review: passed. The bump to harnessmux 0.3.1 makes a t3 job wait until the reset in T3's limit notice; no findings.

    - Reviewed `514851624` (`main..HEAD`): harnessmux `0.3.0` → `0.3.1` in `Cargo.toml`/`Cargo.lock`, plus test `a_t3_limit_waits_for_the_reset_t3s_notice_names` in `crates/lotar-agent/src/services/usage_limit.rs`. It merges cleanly with current `main` (`git merge-tree`), including DEV-833's change to the same file.
    - The fix itself is in harnessmux `f481466` (signed tag `v0.3.1`, verified). `resets_of` in `src/backend/t3.rs` reads T3's own `system_notice` (epoch in its itemId, else "resets in" counted from `updatedAt`), not the agent's replies, so DEV-711's rule holds. It sets `resets_at` only on `RateLimited`. Epoch `1795536000` = 2026-11-24 16:00Z = the "8am (America/Los_Angeles)" from the ticket.
    - lotar passes `TurnFailed.resets_at` straight into `Failure` (`agent_job_service.rs:4991`), and `of_failures_in` uses it for `RateLimited`, so the reset reaches the pause with no lotar code change.
    - Test that failed before the fix: harnessmux's `usage_limit_notice_gives_the_reset`. lotar's new test sets `resets_at` by hand, so it would pass on 0.3.0 too. It pins down how lotar handles the failure, not the bug. That's fine for a fix that lives upstream.
    - The 0.3.1 patch release was within harnessmux's AGENTS.md and the owner's patch-release rule.
    - Reran: `npm ci` passed; `cargo nextest run --workspace -E 'test(/dev584|usage_limit|t3/)'` passed, 63/63. The worktree is unchanged.
    - Not rerun: full `npm run lint`, `npm test` and `npm run smoke` (the merge runs them). No UI change, so no screenshots needed.
