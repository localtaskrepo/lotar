- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3Aef83f80acc839a4d7f09243dd7af7e36aef01d903c74244e1c1fdcf59d5f736b
description: 'Found 2026-11-24 (DEV-832): DEV-811''s t3 jobs on 2026-11-23 paused with `after the default wait (the provider named no reset time)` and retried every hour until the reset. The runner error was `Usage limit reached: Claude API rate limit reached. Try again later.`; the reset was only in the job''s agent message `You''ve hit your weekly limit · resets Nov 24 at 8am (America/Los_Angeles)`, which usage_limit.rs ignores on purpose (DEV-711: the agent''s words don''t count). Check: `lotar agent logs job-20261123T085509.723Z-112`. Done: a t3 job paused on such a limit waits until the reset that line names (for example, read T3''s own limit notice, not the agent''s replies), with a test.'
