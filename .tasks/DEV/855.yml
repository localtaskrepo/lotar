- date: 2026-11-25T21:15:27.235762+00:00
  author: claude
  text: |-
    Waits for harnessmux HARN-31: the reset time is in T3's own usage-limit notice, which harnessmux drops.

    - T3's activity for the failed run (`t3_thread_read` view activity, thread `mcp:launch:8435be66…`) has a `system_notice` "Claude usage limit reached. This turn is paused until the 7-day limit resets in 31h 5m.", itemId ending `seven_day:1795536000` (= 2026-11-24T16:00Z, the real reset).
    - harnessmux 0.3.0 `errors_of` (`src/backend/t3.rs`) keeps only `type: error` items, so lotar gets `RateLimited` with `resets_at: None` and waits the default hour.
    - `usage_limit::of_failures` already prefers a failure's `resets_at`, and still ignores the agent's reply (DEV-711).
    - Filed HARN-31 (finding `agent-jobs:t3-limit-notice-reset`). Next here: bump harnessmux to its patch release and add a test that a t3 limit failure with `resets_at` pauses until that time.
