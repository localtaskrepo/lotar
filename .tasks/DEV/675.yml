- date: 2026-11-17T20:53:20.312383+00:00
  author: claude
  text: |-
    Root cause (from STD-211, same finding): a job killed by the full disk left the worktree marked busy.

    - `move_ticket_branch` (`crates/lotar-agent/src/services/agent_job_service.rs:2006`) only moves a worktree's branch when `finished_job_worktree` says every job that named it has ended.
    - `job-20261117T001050.777Z-5` (DEV-623 fix, worktree `agent-DEV-623-fdc58bb7d25a0a16`) has an `agent_job_completed` event, but its end rules failed with `No space left on device`, so its log has no `"type":"status"` line.
    - `finished_job_worktree` treats `job.status.is_none()` as a job still at work, so the clean worktree (at `d8659a72`) stays, and `git branch --force agent/DEV-623` then fails in jobs 32 and 39.
    - Fix idea: a log with an `agent_job_completed`/`agent_job_failed` event whose job isn't in the active list counts as ended; test with a log like job-5 (no status line).
    - Safe to move afterwards: the worktree is clean, no job runs there, and `d8659a72` stays on `agent/DEV-645` and `t3/memory-gate-queue-hold-1`.
- date: 2026-11-17T21:05:16.520680+00:00
  author: claude
  text: |-
    Fixed: a job whose end rules failed (no status line) no longer holds its worktree, so the ticket branch moves.

    - `finished_job_worktree` (`crates/lotar-agent/src/services/agent_job_service.rs`) now counts a log with `agent_job_completed`/`failed`/`cancelled` as ended when the job isn't in the active list
    - Test `the_tickets_branch_moves_in_the_worktree_of_a_job_whose_log_lost_its_status` (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs`) uses a log like job-5's: failed before the fix with `cannot force update the branch`, passes now
    - Moved `agent/DEV-623` to `3c5d8a729` with `git reset --keep` in its clean worktree `agent-DEV-623-fdc58bb7d25a0a16` (no job runs there; `d8659a72` stays on `agent/DEV-645` and `t3/memory-gate-queue-hold-1`), so DEV-623 can go to review
    - No guidance correction
