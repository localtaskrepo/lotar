description: |-
  Next lotar release, a **minor** bump to v0.15.0: the owner asked for a minor because it brings new features (2026-11-14, "This is a minor version bump as this introduces a bunch new features").

  Steps: `.github/skills/release/SKILL.md` and `docs/release-guide.md`. Tickets that wait for this release are Blocked and depend on it; closing this ticket hands them to @fix to run their checks.

  ## On main since v0.14.3

  25 tickets, among them DEV-418 (relationships on board cards), DEV-419 (phone layout for Board and Tasks), DEV-464 (releases follow-ups), DEV-494 (`lotar add --depends-on` and the other relationship options), DEV-486, DEV-472, DEV-476, DEV-478, DEV-480 (agent job fixes).

  ## Waiting for this release

  - LOCA-313 (local): the check that macOS keeps its grants after a `brew upgrade` needs a Developer ID signed release, which needs DEV-482 in it.
  - STD-100 (standards): needs the question comments of DEV-488, if DEV-488 ships in this release.

  ## Before the tag: a harnessmux release

  The owner, 2026-11-13: "we should do a release before lotar 0.15.0 releases (the next one), so that we can test the entire release process together". Before tagging lotar, release harnessmux 0.1.2 (localtaskrepo/harnessmux; steps in its AGENTS.md): bump Cargo.toml and CHANGELOG.md, tag `v0.1.2` signed, push the tag with the owner's OK, then check every job of its Release run, the publish job above all (the first through crates.io trusted publishing, environment `release`, set up in DEV-504), and https://crates.io/crates/harnessmux shows 0.1.2.

  ## Open before the release

  - [ ] Owner decides which in-flight tickets go in (DEV-482, DEV-502, DEV-488/489/490, DEV-497).
  - [ ] Those are merged on main.
  - [ ] harnessmux 0.1.2 released first, its crates.io publish job green (see above).
  - [ ] Version bump, QA green, signed tag (owner OK), Release workflow green, `brew upgrade lotar` here.
