comments:
- date: 2026-08-26T03:07:16.979684+00:00
  text: 'Plan: (1) web_server: remove /shutdown, gate /__test/stop behind LOTAR_ALLOW_TEST_STOP, drop ACAO *, add Origin-host validation on mutating methods. (2) storage: central project-prefix validation rejecting absolute/../ paths; atomic temp+rename writes; fs2 per-project lock around ID alloc + RMW; warn-once corrupt-file handling. (3) sprint_service: same lock/atomic-write for sprint files; skip corrupt sprint files instead of failing all endpoints. Tests: new unit tests + full gates.'
- date: 2026-08-26T08:30:50.934684+00:00
  text: 'Milestone: security+integrity code done (web_server origin/CORS/shutdown, storage validation/atomic writes/locks, sprint graceful degrade). Agent automation suite confirmed pre-existing flaky on this machine (fails 5/29 on pristine HEAD too). Next: full gates.'
- date: 2026-08-26T10:16:25.181894+00:00
  text: 'Shipped: web_server.rs removes /shutdown, gates /__test/stop behind LOTAR_ALLOW_TEST_STOP=1, drops wildcard CORS, adds Origin-vs-Host validation (403) on mutating methods, strict unknown-status mapping. storage/safety.rs (new): project-prefix validation, per-directory .lock fs2 locking, atomic temp+rename writes, warn-once corrupt-file handling. Wired into operations.rs (add/get/edit/delete), sprint_service.rs (create/update/delete/list degrade), config/operations.rs save_project_config choke point, utils/project.rs resolve_project_input, search.rs. Vite dev proxy strips Origin. Tests: +8 storage_path_safety_test cases, updated web_api/cli_serve/error-path suites. Verified live: traversal add rejected, foreign-origin POST 403, /shutdown gone, no ACAO header, normal flows intact.'
