- date: 2026-11-26T14:01:26.766753+00:00
  author: claude
  text: |-
    Waits for [STD-371](https://standards.pyxzl.net/task/STD-371): the fix belongs in the shared rule in standards, not in lotar's copy.

    - The Done comes from "Merge agent lifecycle" in `.tasks/DEV/automation.yml`, a copy of `~/Development/standards/configs/lotar/automation.yml` (its header says so). An edit only to lotar's copy would be overwritten the next time the config is copied.
    - A rule in lotar's own section (after line 1252) can't undo it: each action is committed before the next rule runs, so Done and the `unblocked` event (which starts the tickets waiting for the release) have already happened.
    - Planned fix, written into STD-371: "Merge agent lifecycle" skips `title: { matches: '^Release v' }`, and a new rule hands a merged release ticket to @fix (fresh session) to run release skill steps 3 to 8. Step 7 sets Done after the tag is on origin.
    - When STD-371 is done: copy the config into `.tasks/DEV/automation.yml` (lotar's copy is behind its source anyway, for example the small-diff rules from STD-362). Then add a test that runs `AutomationService::simulate` with `JobCompleted` against the real file, on a `Release v9.9.9` ticket and on another @merge ticket, and commit.
    - I wrote nothing to the branch: `git log main..HEAD` is empty.
