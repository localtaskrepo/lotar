    Fixed: a merged `Release v…` ticket now goes to @fix to tag and finish the release; Done comes with the release skill's step 7.

    - STD-371 is done. Copied `~/Development/standards/configs/lotar/automation.yml` into `.tasks/DEV/automation.yml` again: lines 1–1320 now match the source exactly, followed by lotar's own rules.
    - Main's copy from `17cd3a49f` (DEV-884) had already brought in "Release merged", but it was an older copy: it lost lotar's own rules "Waiting: drop the workspace build output" and "Login expired: ask the owner to sign in" (DEV-835). This commit puts them back and also takes STD-354's prompt change.
    - New test `crates/lotar-lib/tests/dev892_release_merge_done_test.rs` runs the real file through `AutomationService::simulate` with `job_completed`. A `Release v9.9.9` @merge ticket gets "Release merged: finish the release" (@fix, InProgress, not Done) and not "Merge agent lifecycle". Another @merge ticket goes Done. The test fails on the old copy (`["Merge agent lifecycle"]`) and passes on the new one.
    - I rebased onto main (`577caa2ff`); the only conflict was the `integration.rs` module list.
    - No small-diff tag: the change is 43 lines outside `.tasks`.
