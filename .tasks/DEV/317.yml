  text: 'Outcome: lotar add --finding <KEY>, MCP task_create finding, REST /api/tasks/add finding. Under <project>/.finding.lock (30 s wait) the newest ticket of the project with the key decides: open -> comment ''Reported again by <reporter> on <date>.'' + description, {created:false,state:open,id}; won''t-do by name (WontDo, Won''t fix, Cancelled, Canceled, Rejected, Declined) -> {created:false,state:suppressed,id}; done (effective done states) -> new ticket related to it, {created:true,state:recurred,id}; none -> {created:true,state:new,id}. Exit 0 always; text names the ID; CLI JSON has created/state/id plus status/message/task_id/task; REST {data, finding} 201/200; MCP {task, finding}. Key stored as custom field ''finding'' (also where custom fields are limited); lotar list finding=<key> works in every project. created automation runs after the lock, only for new tickets. Evidence: tests/dev317_finding_report_test.rs (4 states, 6 parallel processes -> one ticket + 5 comments, created automation once, REST+MCP), finding_service unit tests; related groups 369/369. Docs: add.md#findings, list.md, mcp-tools.md, api-quick-reference.md, openapi.json, view/api/types.ts, lotar-workflow skill. Remaining: none.'
description: 'Owner decision 2026-11-11 (~/Development/standards/docs/decisions/2026-11-11-repo-health.md): every agent that finds a repo-level problem reports it as a ticket only if it isn''t reported yet. lotar add --finding <key>, finding on MCP task_create and REST /api/tasks/add. Atomic across processes (project lock around check+create). Newest ticket with the key decides: open -> comment, {created:false,state:open,id}; WontDo -> {created:false,state:suppressed,id}; Done -> new ticket related to the old one, {created:true,state:recurred,id}; none -> {created:true,state:new,id}. Exit 0 in all cases; text prints the ID. Key filterable in lotar list (finding=<key>). created automation only fires when a ticket is created. Interface fixed for the scanner in ~/Development/standards (scripts/repos.ts).'
