- date: 2026-11-27T11:49:14.511033+00:00
  author: claude
  text: |-
    Review: blocking. When you answer in the waiting thread on dyson, the look that takes it over stops that same thread right away.

    - Reviewed HEAD `cda006455` (same as `agent/DEV-929`) against main `dad3376d8`: `agent_job_service.rs`, `hosted.rs`, `resumed.rs`, `docs/help/agent.md`.
    - **Blocking:** `look` (`resumed.rs:68`) runs `close_dropped_waits_on_host` right after `look_at_threads`. Its comment says "an answered thread is taken over, not stopped", but the takeover doesn't take the `WAITING_ON_HOST` entry before that runs:
      - `adopt` first sets the assignee to `@<agent>` (`resumed.rs:389`), then spawns the job (`resumed.rs:476`).
      - The entry is taken only inside that thread, after `start_job`: `resume_session_to_end` → `resumed_on_host` (`agent_job_service.rs:2605`).
      - Meanwhile the look's own thread goes on to `close_dropped_waits_on_host` (`agent_job_service.rs:4386`). It sees the assignee is no longer the question's, removes the entry, and stops the thread on dyson that was just answered. The taken-over job then runs with no MCP connection, its thread already stopped. Answering in the thread is the main way to answer, so this breaks it, not just an edge case.
    - **Fix:** have `close_dropped_waits_on_host` skip a ticket with an active job in this process (`adopt` registers `active_by_ticket` before it spawns, `resumed.rs:407`). Or have `adopt` take the entry before it changes the ticket and pass the `Hosted` to its job. Add a test: entry with a question, ticket reassigned to the agent and marked active the way `adopt` does it, then `close_dropped_waits_on_host` leaves the entry and runs no stop.
    - Everything else matches "Done when": the commits come back before the stop, a failed stop is logged and commented with the bridge still closed, a closed or reassigned ticket ends the wait, a new job or takeover that takes the entry first wins (`job_id` check), and a cancelled waiting job now stops.
    - Reran: `npm ci` passed. `cargo nextest run -p lotar-agent --lib -E 'test(/agent_job_service/)'`: 138 passed. `npm run lint` passed. Worktree left clean.
    - No UI changes. No tickets filed.
