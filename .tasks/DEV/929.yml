- date: 2026-11-27T11:38:11.691727+00:00
  author: claude
  text: |-
    Review: blocking. The 30-second close forgets the waiting thread, so a new job that starts after it never stops the thread on dyson.

    - Reviewed `7d47c9d2f` against main `0ec35832b`: `agent_job_service.rs`, `hosted.rs`, `resumed.rs`, `docs/help/agent.md`. The ticket branch and HEAD are the same commit.
    - **Blocking:** `close_dropped_waits_on_host` (`crates/lotar-agent/src/services/agent_job_service.rs:4409`, close at `:4437`) removes the whole `WAITING_ON_HOST` entry, thread id included, as soon as the ticket's status or assignee changes. It closes only the bridge.
    - The usual way to answer by ticket changes exactly those two fields: comment, then set the status or assignee back so a new job starts. That new job reaches `collect_waiting_on_host` (`:4369`) only in `run_job`. A queued job (Mac full, or memory, disk or hold gates) gets there only once a slot frees. A look that runs first (`resumed.rs:68`, every 30 s) drops the entry, and then `take_waiting_on_host` finds nothing. The thread on dyson is never stopped, which is the ticket's original bug and goes against Done when #1. The same race exists for a job that starts at once, but the window is small.
    - Fix: when the look drops a question, also stop the thread, as `collect_waiting_on_host` does (a failed stop goes to the job log and a ticket comment). Or keep the thread and its ssh route so a later new job can still stop it. Add a test: question dropped by a reassignment, look runs, new job comes later, and the thread still gets stopped.
    - Rework scope too: a waiting job cancelled before `note_question_on_host` ran (`:4728`) keeps its entry with `question: None`, so the look never closes its bridge. The fix agent named this case in its comment. Closing the bridge when `question` is still `None` after the job ended would cover it.
    - Matches the ticket: the commits come back before the stop (the test checks the order in `ssh.log`). A failed stop goes to the job log and a ticket comment, and the bridge still closes. The job-id check lets a new job or takeover that came first win. The `stop_thread` call matches the cancelled host job's (`:4299`). Docs agree.
    - Reran: `npm ci` ok; `cargo nextest run -p lotar-agent --lib agent_job_service` 137 passed; `cargo nextest run --test integration dev626` 13 passed; `cargo clippy -p lotar-agent --all-targets -- -D warnings` clean. The worktree is unchanged afterwards. Full suites not run: the merge runs them (DEV-797).
    - No UI changes, no stray files, no second branch. No tickets filed.
- date: 2026-11-27T11:47:17.488551+00:00
  author: claude
  text: |-
    Reworked: a dropped question now stops the waiting thread too, and a cancelled waiting job no longer leaves its forward open.

    - Review read HEAD `7d47c9d2f`; both findings fixed in `cda006455` (amended).
    - **Blocking (the look forgot the thread):** `close_dropped_waits_on_host` now ends the wait the same way a new job does, through the shared `end_wait_on_host` (`crates/lotar-agent/src/services/agent_job_service.rs`). The commits come back, the bridge closes, then the thread stops on the host. A failed stop goes to the job log and a ticket comment. A later job finds no entry and nothing left to stop.
    - The look now does this after its takeovers (`resumed.rs`, `look_at_threads` first). So a thread the owner answered is taken over, not stopped.
    - **Cancelled before the question was recorded:** `finish_on_host` treats a waiting end of a cancelled job as `Stopped`. Its thread stops and its commits come back right away, as for any cancelled host job. It no longer parks an entry with `question: None`.
    - Tests (`hosted.rs`): `a_ticket_closed_while_its_thread_waits_ends_the_wait` and `a_ticket_reassigned_while_its_thread_waits_ends_the_wait_before_a_later_job`. Each checks the stop reaches the fake T3 server and the bridge closes. It also checks the commits come back and a later `collect_waiting_on_host` runs no ssh.
    - `docs/help/agent.md` updated to match.
    - No `small-diff` tag on the ticket, so nothing to untag (diff is 268+/19- lines).
