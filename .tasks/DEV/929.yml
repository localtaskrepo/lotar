- date: 2026-11-27T11:35:10.648915+00:00
  author: claude
  text: |-
    Fixed: a new job stops the thread that waits on dyson, and a closed ticket closes its MCP forward.

    - Rebased `agent/DEV-929` onto main (`0ec35832b`, has DEV-901).
    - `collect_waiting_on_host` (`crates/lotar-agent/src/services/agent_job_service.rs`): brings the commits back first (bridge closes, worktree removed only when clean, as before). Then it stops the waiting thread via `t3_thread_api::stop_thread`. A failed stop goes to the job log and a ticket comment; the new job runs anyway.
    - `WAITING_ON_HOST` entries now keep the job id, the thread and the ticket's status/assignee as the question left them (`note_question_on_host`, after `hand_back_waiting_job`).
    - `close_dropped_waits_on_host` runs on each look (`resumed::look`, every 30 s in `lotar serve` and the queue worker). It closes the bridge and drops the entry when the ticket is done or its status or assignee changed. The host worktree stays. It removes the entry only if the job id still matches, so a new job or takeover that came first wins.
    - Tests (`hosted.rs`): the fake ssh now logs commands and fakes `-R` and `-L`; a fake T3 server runs on the "host". New: `a_new_job_stops_the_thread_that_waits_on_the_host`, `a_thread_that_cant_be_stopped_is_named_on_the_ticket`, `a_ticket_closed_while_its_thread_waits_closes_the_mcp_connection`.
    - `docs/help/agent.md` (Commits bullet under agent hosts) says the same.
    - Left as is: a waiting job that was cancelled before its end recorded the question keeps its bridge until a new job or lotar's exit.
