- date: 2026-11-27T11:55:18.958254+00:00
  author: claude
  text: |-
    Review: passed. A new job, a closed ticket or a dropped question now stops the waiting thread on dyson and closes its MCP forward. An answered thread that a job takes over keeps both.

    - Reviewed HEAD `8b6ab2d51` (same as `agent/DEV-929`) against main `dad3376d8`: `agent_job_service.rs`, `hosted.rs`, `resumed.rs`, `docs/help/agent.md`.
    - Last round's finding is fixed: `close_dropped_waits_on_host` skips a ticket that `has_active_job_in` (also other processes). `adopt` registers `active_by_ticket` (`resumed.rs:407`) before it spawns the job, so the look in the same pass leaves the answered thread alone. Covered by `a_thread_taken_over_keeps_its_wait_while_its_job_runs`.
    - Done when:
      - #1: `collect_waiting_on_host` runs in `run_job` before the host/Mac choice.
      - #2: `bring_back` calls `close()` first, so the bridge closes even when the fetch fails. A failed stop goes to the job log and a ticket comment.
      - #3: the commits come back before the stop (the `ssh.log` order check). A failed bring-back leaves the worktree.
      - #4: done, dropped and reassigned are checked on each 30 s look. The question state is recorded after `finalize_job` and the end rules, so a rule's own move isn't mistaken for a drop.
      - #5: the entry is removed only when the job id matches.
      - #6: fake-ssh tests cover all of this.
    - A cancelled waiting job is now treated as `Stopped` (`finish_on_host`), which the earlier review asked for. Docs agree.
    - Reran: `npm ci` ok; `cargo nextest run -p lotar-agent --lib agent_job_service` 139 passed; `cargo nextest run --test integration dev626` 13 passed; `cargo clippy -p lotar-agent --all-targets -- -D warnings` clean. Worktree unchanged. Full suites not run: the merge runs them (DEV-797).
    - No UI changes, no stray files, no second branch. No tickets filed.
