description: |-
  Found in the DEV-901 review (2026-11-27, branch `agent/DEV-901` at `49a3fa827`).

  - `collect_waiting_on_host` (`crates/lotar-agent/src/services/agent_job_service.rs`, in `run_job`): a new job of a ticket whose thread waits on dyson brings the commits back and, when the worktree is clean, removes it (`Hosted::bring_back`). The waiting T3 thread on dyson isn't stopped. When that job runs on the Mac with a handoff, an answer in the old thread runs it on dyson without its worktree or MCP server.
  - `WAITING_ON_HOST` keeps a waiting job's MCP bridge (an `ssh -R` process and the local socket) open until another job of the ticket or a takeover comes. A ticket the owner closes in the meantime keeps the forward open until lotar exits.

  ## Done when
  - [ ] A new job of a ticket whose thread waits on a host: after `collect_waiting_on_host` brings the commits back, the waiting T3 thread on the host is stopped through T3 (`t3_thread_api::stop_thread`, the same call a cancelled host job uses), whether the new job then runs on the Mac or a host.
  - [ ] Stopping fails (T3 or ssh error): the new job still runs; the error goes to the job log and a ticket comment, and the bridge is still closed.
  - [ ] The commits come back before the thread is stopped; a bring-back that fails leaves the worktree and doesn't remove it (as today).
  - [ ] A waiting host job's bridge (`ssh -R` process and local socket) closes and its `WAITING_ON_HOST` entry goes when its ticket reaches a done status (Done, WontDo, or any status the project marks done) or its question is dropped (ticket no longer waiting / reassigned away from the question's assignee), without waiting for another job or lotar's exit.
  - [ ] A new job or takeover that comes first still wins: it takes the entry, and the later close finds nothing to do.
  - [ ] A fake-ssh test covers both: a new job stops the waiting thread; a ticket closed while waiting closes the bridge.
