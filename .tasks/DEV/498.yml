description: |-
  Preparation for a core crate in the cargo workspace the owner approved (DEV-493, 2026-11-13: "Yes on all of those ideas"). The core modules depend on the layers above them, so they can't be a crate of their own yet.

  ## Context (DEV-493)

  - config, storage, utils, types and output depend on each other (one strongly connected group, about 23k lines with errors, workspace, project, scanner, api_types and api_events).
  - They call up into services 17 times: `config/operations.rs` (external_tasks::is_repo_name, agent_runner::AgentRunnerKind, trust_service::TrustService::rewrite, theme_file::validate_path, branding_service::validate_ui_field), `config/validation/validator.rs` (is_repo_name, sync_service::GITHUB_PUSH_FIELDS), `utils/binary_watch.rs` (AgentJobService::shutdown_jobs), `utils/scan.rs` (scan_anchor_service helpers), `utils/custom_fields.rs` (finding_service field names).
  - The test module `utils::scan::reference_mutation_tests` uses cli and services. In services, `agent_job_service.rs` tests call `cli::handlers::agent`.
  - A scratch copy of these modules with the 17 calls stubbed compiled as a crate on its own; its unit-test build took 8 to 24 s against 43 to 44 s for the whole crate.

  ## Plan

  - Move the small helpers and constants down into core modules. Turn the stateful ones (TrustService::rewrite, AgentJobService::shutdown_jobs) into hooks the upper layers register, or move their callers up.
  - Move tests that need upper layers to where those layers are.
  - No crate split in this ticket; behaviour stays the same.

  ## Done when

  - [ ] No `crate::services`, `crate::cli`, `crate::automation`, `crate::routes`, `crate::mcp` or `crate::web_server` reference left in the core modules, enforced by a test.
  - [ ] `npm run lint`, `npm test` and `npm run smoke` pass.
