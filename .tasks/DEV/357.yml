- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Af64fbaa7-89a3-4286-82ce-44e0f34d6476
description: 'Found by DEV-355 (claude, 2026-11-11): in a full npm run test:agent run (branch agent/DEV-355 at 7bd5c46 plus frontend-only changes), tests/cli_whoami_and_dryrun_test.rs:362 failed: lotar status TEST-1 Done --dry-run --explain printed the DRY RUN and Explanation lines but no assignee line, so contains("assignee") failed. It passed in the next full run and alone (with and without LOTAR_DEFAULT_REPORTER=claude). Check: cargo nextest run --cargo-profile local status_dry_run_explain passes repeatedly under full-suite load. Done when the auto-assign preview no longer depends on timing or outside state, or the test pins the input it depends on.'
