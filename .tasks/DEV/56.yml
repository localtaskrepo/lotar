    3 Upload cleanup race (A creates blob, attach fails; B dedups A's blob and attaches; A deletes B's reference): implemented bounded per-attachment-store coordination — AttachmentService::acquire_store_lock(root) returns a per-root mutex from a global registry; the upload handler holds it across store_bytes (dedup/create) + attach + failure cleanup, so a concurrent identical upload is serialized behind the blob's fate: after A's rollback B re-creates fresh (created=true) and attaches; after A's success B dedups a committed blob. Lock order is store-lock -> .task-lock only (store_bytes called solely by the upload handler under the store lock; attach/cleanup paths never take the store lock after the task lock), and hold time is bounded by attachments IO + the timeout-bounded task storage lock — no production timeout changes, no refcount backlog. Poison-recovered (guards mutual exclusion only). Callers audited: store_bytes only routes/tasks.rs; attach_file_reference callers (routes upload under store lock; MCP/CLI/sync attach existing paths without blob creation or deletion and cannot participate in the rollback window). Deterministic regression: tests/common/dev56_upload_coordination_cases.rs included into routes/tasks.rs cfg(test) (DEV-55 #[path] pattern) — A parks between store and attach via thread-local upload_fault hooks (fail_next_attach + arm_park_after_store channels, compiled out of production), B starts while A is parked holding the store lock, then A released -> fails -> cleans up; asserts A!=200, B=200, exactly one blob (no orphan), B's task keeps a live file reference, A's task has none, and B's referenced blob exists on disk. Env isolated via EnvVarGuard set-before-spawn/restored-after-join.

    Files: src/services/attachment_service.rs (store lock registry + upload_fault cfg(test)), src/routes/tasks.rs (guard + fault hook calls + canonical delete emit + cases include), src/services/task_service.rs (carveout canonical + ticket_alias_matches + tests), tests/common/dev56_upload_coordination_cases.rs (new), tests/dev56_task_identity_test.rs (+1).

