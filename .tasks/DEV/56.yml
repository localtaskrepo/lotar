    1 Canonical delete event: routes/tasks.rs delete now parses the request id and emits emit_task_deleted(canonical) — padded alias TP-001 can no longer leak a stale identity into SSE. Regression: dev56 integration test subscribes via api_events::subscribe() and asserts the task_deleted event carries TP-1 after a TP-001 delete (drains unrelated events from the shared registry).

