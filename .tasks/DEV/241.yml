- date: 2026-10-29T23:15:28.375730+00:00
  text: |-
    Plan (developer decisions: one-page editor, on/off switch, time conditions, one combined commit; DEV-240 won't do -> cron):
    Engine: (1) rule 'enabled: false' skips the rule everywhere; (2) time conditions on created, modified and status_changed (last status change from history, else created) with older_than/within/before like due_date; (3) on.manual hook + 'lotar automation run [RULE...] [--select Q] [--dry-run]' evaluating each rule's when against tasks' current state and applying on.manual, REST POST /api/automation/run, 'Run now' (preview then confirm) in the rule list; docs with cron examples.
    Editor: replace the 4-step wizard with one When / If / Then screen: trigger list (events + Manual/cron), condition rows with typed pickers from config (statuses, priorities, types, tags, people + @agent/@user/@any, sprints) and operators per field incl. changed from/to and time conditions; action rows from a + menu (set field, add/remove tag, comment, assign/agent with run settings, run command, archive, sprint, link); template fields with an insert-value menu and ${{ autocomplete limited to the trigger's variables plus live preview on a chosen task; 'Try on a task' (simulate) in the dialog; starter recipes; YAML view in sync; correct per-event summaries, on/off switch and drag reorder in the list.
    Checks: Rust + UI unit tests, smoke for editor and run-now, lint/test/smoke.
- date: 2026-10-29T23:47:08.457884+00:00
  text: |-
    Outcome: automation editor and engine reworked.
    Engine: enabled: false on rules (skipped for events, manual runs and saved-rule simulation); time conditions created / modified / status_changed with older_than, within (past) and before; on.manual hook run by 'lotar automation run [RULE...] [--select Q] [-n]', POST /api/automation/run and 'Run now' (preview then confirm) - the replacement for DEV-240's built-in schedules (cron instead); simulate accepts an unsaved rule; validation rejects unreadable spans and time fields without a time operator; archive actions are now editable in the builder (was flagged YAML-only since DEV-4).
    UI: one-screen When / If / Then editor (view/components/automation/AutomationRuleDialog.vue): trigger chips incl. Manually / cron, condition rows with operators per field kind and project value suggestions (statuses, priorities, types, tags, members, agent profiles, special @tokens), 'changes from/to' rows, actions per trigger from an Add menu, placeholder fields with Insert value menu, ${{ suggestions limited to the triggers' variables and a live preview on a chosen task, Try it (simulate the draft), starter recipes, generated YAML, plain-language footer. Rule list shows one sentence per trigger, on/off switch, Run now, icon reorder/duplicate/delete. Simulator tab offers every event.
    Evidence: tests/dev241_automation_test.rs (4), automation unit tests rewritten (13) + round-trip test, smoke ui.automation (2 new), ui.dialogs updated for the new title; full Rust 1857 passed, UI 1389 passed, smoke 365 passed after labelling the new dialogs by their heading; lint clean. Docs: automation.md (schedules via cron, time conditions, turning rules off, editor), api-quick-reference, serve.md, openapi.
    Limits: nested/NOT conditions remain YAML-only in the editor; Run now uses saved rules (disabled while there are unsaved changes).
