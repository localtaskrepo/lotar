- date: 2026-11-21T19:43:22.666312+00:00
  author: claude
  text: |-
    Review: passed. `d0ded5c40` does all three "Done when" items and nothing more.

    - Read: `git log main..HEAD` (one commit on top of `f2a2f6811`; main has since gained only DEV-751, which doesn't touch these files), the diff, the ticket, DEV-747's "Done when" (`<link>` in the failed settle note) and the latest commits to `kept.rs`/`resumed.rs`/`agent.md` on main (DEV-747 `1ec62d48d`).
    - `kept.rs` `settle`: each due thread now carries `Listed.link` from `t3 thread list`. The `Err` arm writes `link.unwrap_or(&thread.thread)`, so the id appears only when no link is listed. `Listed.link` is now `pub(super)`. The success note's variable was renamed `settled_link`. That rename is only naming, and the success note still comes from organize's reply.
    - `docs/help/agent.md` says `<link>`, and the id when no link is listed. Prettier passes.
    - New dev503 test `a_kept_thread_that_isnt_settled_is_named_by_its_link`: it passes. The fake `thread list` gives the link `https://t3.test/<id>` (`dev503_harness_jobs_test.rs:741`), and the old code wrote `thread-0`, so the assert can't pass on the old code. I started the test against the old code in a detached copy, but at a load average of about 40 it didn't finish compiling within 30 min. I stopped it and removed the copy, so that claim is checked from the code, not by a run.
    - Reran `cargo nextest run -p lotar-lib --test integration -E 'test(/dev503/)'`. The first run had 1 failure, `a_ticket_hands_its_context_from_harness_to_harness_through_its_states` (`timed out waiting for the merged ticket`), a known flaky test under load that this change doesn't touch. The rerun passed 47/47. Filed as [DEV-761](https://lotar.pyxzl.net/task/DEV-761), related.
    - `rustfmt --edition 2024 --check` on the three Rust files passes.
    - Not rerun because of the machine's load (about 40): `npm run lint`, `npm test`, `npm run smoke`. The fix agent reported all three passed.
    - Not UI work, no stray files, `git status` is clean, no other branch with this fix.
