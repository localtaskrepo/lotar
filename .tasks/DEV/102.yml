- date: 2026-10-12T22:32:49.214125+00:00
  text: 'Outcome: DEV-102 expanded no-op mutation scope complete, self-verified and independently reviewed, changes uncommitted. Shared task update compares effective fields under coordinated locks before timestamps/history/writes/events/automation; locked REST receipts suppress repeated comment-edit/delete/restore events and unchanged attachment removal. Config compares raw provenance after full validation/conflict checks, preserving explicit overrides/port pins and missing-file creation. Sprint metadata patches load fresh under lock, preserve memberships/original bytes and warnings on no-op. Automation compares ordered effective rules/limits, canonical predicates and scalar/list actions; variant-sensitive assignee placeholders remain distinct. UI skips obvious same-column/status/custom/assignee/sprint requests and unchanged refreshes; actual CLI/MCP no-op success shapes preserved. Genuine agent-human identity changes, exact nonempty Markdown whitespace edits, intentional duplicate appends/uploads, real membership/order changes and lifecycle semantics remain intact. Evidence: independent core/CLI/sprint review50/50 + member12/12; config13/13; automation9/9 incl red-green shorthand and placeholder controls. Fresh browser/MCP6/6 verified with genuine positive mutations. Initial panel smoke red was wrong positional selector renaming points to product; payload capture proved genuine edit, selector now name-based with strict zero-request assertions unchanged. Final npm run lint:agent PASS (vue-tsc, all-target/all-feature clippy -D warnings, cargo fmt check); initial formatting-only failure corrected with npm run fmt. Final npm run test:agent PASS: Rust1422/1422 across137 binaries, zero retries, existing45 git_required profile exclusions NOT passed; UI792/792 across74 files, pre-existing useFilterBuilder inject warnings remain. Final npm run test:smoke:agent PASS with fresh embedded build:261 passed/25 existing skips,69 files (63 passed/6 skipped); Git-dependent smoke skips NOT passed. git diff --check clean. JUnit target/nextest/gitless/junit.xml; test env isolated OS TMPDIR, TZ UTC, unchanged canonical concurrency/retries. Remaining: live CLI active-job attribution cannot be exercised on macOS sysinfo argv; guard source-reviewed, no live proof claimed. Deferred adjacent pre-existing risks: unlocked CLI sprint start/close snapshots, scan lost-update/integrity legacy mirror, automation plain fs write/read-compare race, broader alias/order cleanup, Windows cancellation orphaning and cosmetic CLI messages; not claimed fixed. No staging/commit/push/branch/user-server changes in this continuation. Worker isolation incident disclosed: temporary .tasks/PNP created during offline replay then removed; parent verified directory absent and only intended DEV-102 change in .tasks Git status; root config unchanged per worker. Earlier unauthorized worker Git checkout remains disclosed historically, not concealed by current completion. Guidance: no durable finding.'
description: 'Original report: dragging a Board ticket back into the same Todo column added modified even though no fields changed. Expanded scope approved2026-10-12: audit task modifications in general across UI/REST, CLI and MCP, including empty/repeated patches, same-state/same-value setters, normalized aliases/collections, bulk operations, sprint memberships/order, references/attachments and relevant automation/sync callers. Effective no-ops must preserve original task/config/sprint bytes and filesystem mtime, modified/history, and emit no mutation SSE/automation/agent side effects. Validate whether history deltas are a reliable signal; prefer shared effective-change detection under existing locks/transactions. Preserve validation, active-job/review ownership, member population, rollback/recovery journals, genuine changes and intentional lifecycle semantics (delete/restore preserve modified while recording real lifecycle changes). Appending a comment or uploading new content is a real action even when similar text already exists; do not silently deduplicate intended appends. Add service/storage and real CLI/MCP/REST/UI regressions proving no-op invariants and corresponding real mutations. Keep response shapes unless a concrete change is required, and synchronize contracts if changed. Acceptance: audit every mutation family and leave exact findings/remaining work, targeted red/green checks, browser behavior and full warning-free lint/nextest/UI/fresh smoke, preserving user-owned data and repository Git state.'
