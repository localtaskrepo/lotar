- date: 2026-10-12T00:58:56.787267+00:00
  text: 'Sprint metadata no-op boundary (worker: sprint scope): Plan — (1) Add tri-state SprintMetadataPatch + locked SprintService::update_with_patch that loads the sprint fresh under the sprints lock (with_storage_lock + journal guard preserved), applies the patch in-lock, and compares canonicalized candidate vs canonicalized baseline; equal => no write, no modified bump, original bytes/mtime preserved. (2) SprintService::update (whole snapshot) gets the same effective-change guard so identical snapshots no longer rewrite/stamp; stage_update skips staging identical snapshots (callers already stage only touched sprints; semantics otherwise unchanged). (3) REST /api/sprints/update, MCP sprint_update, CLI sprint update build the typed patch outside the lock and apply it in-lock via update_with_patch — no more stale full-snapshot merges overwriting membership. Tri-state clear, validation, refusal, 404/-32004 contracts preserved. Warnings: pre-canonicalize baseline silently so only patch-introduced conflicts warn (matches current get+update flow). No SSE/automation emitters exist on sprint mutation paths — verified, none to suppress. Tests: tests/dev102_sprint_noop_test.rs covering service no-op bytes/mtime/modified/members, legacy order not canonicalized on no-op but canonical on real update, tri-state clears, 404, metadata-vs-assignment both orders + threaded barrier race, REST/MCP/CLI no-op + real-change counter-cases. Gates: focused nextest --retries 0, fmt, clippy.'
- date: 2026-10-12T01:09:51.495950+00:00
  text: 'Sprint metadata no-op boundary COMPLETE (self-verified, uncommitted). Design: new tri-state SprintMetadataPatch (set/clear/leave) + SprintService::update_with_patch loads the record fresh INSIDE the sprints storage lock (with_storage_lock + pending-journal refusal preserved, canonical @sprints root), applies the patch in-lock, and compares canonicalized candidate vs canonicalized baseline — equal means NO write: original bytes/mtime/modified preserved, legacy order spellings untouched, warnings []. Genuine change stamps modified and writes canonically (existing contract). SprintService::update (whole-snapshot) now has the same effective-change guard (changed=false on identical snapshots); stage_update skips staging identical snapshots — coordinated DEV-55 txn semantics otherwise unchanged (all callers already stage only touched sprints). SprintOperationOutcome gains changed: bool (service-internal; REST/MCP response shapes untouched). REST /api/sprints/update, MCP sprint_update, CLI sprint update now build the typed patch outside the lock and call update_with_patch — stale full-snapshot merges over membership are gone; pre-get removed, 404/-32004/''Sprint not found'' refusal contracts preserved. Files: src/services/sprint_service.rs, src/storage/sprint.rs (SprintPlan::has_values only), src/routes/{sprints,mod}.rs (helper swap), src/mcp/server/handlers/sprints.rs, src/cli/handlers/sprint/operations/create_update.rs, tests/dev102_sprint_noop_test.rs (21 tests: service no-op bytes+mtime+modified+members, empty patch, legacy-order preserved on no-op / canonical on real write, tri-state clears + idempotent re-clear, not-found, snapshot guard, both-orders metadata-vs-assignment member preservation, threaded Barrier race without delays, REST no-op/real/null+empty-clear, MCP no-op/real/isError, CLI no-op/real/refusal/not-found). Verification: nextest --retries 0 green on dev102(21) + sprint_storage/single_membership/status_unit/config_defaults(32) + dev55/dev58/dev82(27) + cli_sprint suites(40) + dev92/dev89/dev99/mcp_server_unit(61, 1 known sandbox git_required failure = environment, pre-existing) + lib(350/351, same git sandbox failure). clippy -D warnings clean (lib + dev102 + regression tests); owned files rustfmt-clean. Follow-ups (out of scope, not fixed): CLI sprint start/close (lifecycle.rs) still use whole-snapshot update outside lock — genuine changes only by construction, but a locked patch variant could harden them; .tasks/@sprints/.sprints.lock surfaces as an unreadable-sprint warning in this repo''s own task listing (pre-existing, sprint list/lookup filter gap); sprint normalize remains the deliberate canonicalization writer. Note: full-gate lint currently blocked by a parallel config worker''s in-flight src/config/candidate.rs warning in the shared checkout, not by sprint changes.'
- date: 2026-10-12T01:12:21.268844+00:00
  text: 'UI no-op slice implemented in main checkout, no git. Guards: (1) Board.vue onDrop skips same effective-status column drops entirely (no optimistic upsert/POST/toast/refresh); compare via completionStatusKey (server ASCII case-fold on configured labels), separators NOT stripped so a configured __other__ column vs task status Other stays a real write. (2) useTaskPanelPersistence.updateStatus same guard incl. no toast. (3) useTaskPanelCustomFields blur commit deep-equal gated against persisted raw custom_fields snapshot (structural, key-order-insensitive, type-preserving: ''5'' vs 5 differ); missing baseline defers to server. (4) TasksList applyAssignment/unassign skip exact trimmed-assignee matches only (@me/agent aliases defer to server durable no-op); performSprintAction refresh gated on modified/replaced/integrity-cleanup counts. (5) SprintsList onSprintDrop skips only sole-membership move drops and copy-drops onto held sprints; different sprints and multi-membership force_single trims retain add+silent-remove+refresh authority. (6) TaskPanel submitSprintDialog/removeSprintChip refresh gated on the same real-change signals. Tests: Board.spec.ts +4, TaskPanel.autosave.spec.ts +7 (1 rewritten to the no-op contract), NEW TasksList.noopMutations.spec.ts (7), NEW SprintsList.noopMutations.spec.ts (5); focused 73/73, full UI 792/792 in 74 files, lint:frontend (vue-tsc) clean. NEW smoke/tests/ui.noop-mutations.smoke.spec.ts (3 tests: board YAML bytes/mtime/history/modified + zero mutation POSTs, cross-column exactly one POST; panel blur/status re-select zero + edit one; same-sprint zero vs real move add+remove) WRITTEN, NOT RUN — needs the parent fresh build; a stale binary run is red by construction since the old embedded UI always posts. Deliberately left server-authoritative: alias/identity resolution, dialog sprint-token targets (active/next), and any status value not clearly equal to the configured canonical label.'
- date: 2026-10-12T01:33:38.851687+00:00
  text: 'Plan and audit milestone: shared TaskService.update is the main false-modified path (field/history comparisons existed, but modified/write/hooks always ran). Expanded audit covers UI requests, CLI/MCP empty/same/null/bulk patches, references/attachments, lifecycle, automation/sync, sprint/config metadata. Core worker has14 red/green tests and internal update receipt, semantic storage-edit guard with original-byte preservation; parent REST update/status now lets the changed-only service context emit SSE, and typed attachment-remove gates outcome.changed. Sprint worker added fresh-under-lock tri-state metadata patch with no-op guard, preserving members/order/extensions and fixing stale-snapshot metadata race;21 cases green. Existing reference and lifecycle persistence are already idempotent, but REST comment-edit/delete/restore still falsely emit events—locked changed receipts are being added, parent adopts them next. UI worker handles same-column drop/custom blur/status/assignee/sprint request/refresh guards; config worker handles raw candidate equality/provenance/no-op events; real CLI/MCP matrix worker covers public no-op and genuine-action assertions. Preserve validation/journal refusal/active job+review owner guards; intentional comment append remains genuine, lifecycle preserves modified, sprint memberships derived from sprint records remain legitimate model exception. Adjacent alias-dedup/legacy sprint-integrity/scan lost-write findings recorded as follow-ups, not silently included or claimed fixed. Full gates/review pending; no Git mutations/user-server changes. Guidance: no durable finding.'
