  text: 'Fixed in 4c770c59 on agent/DEV-470. TaskService::add_comment_with_context now stores a comment without a leading ''<author>:'', ''<author>,'', ''<author> (...):'' or ''<author>, <date>:'' (case-insensitive) when the name matches the recorded author. That covers CLI, REST and MCP. The CLI dry-run preview strips it the same way. Text that would end up empty stays as it is. Other names stay (''codex: ...'' by claude, ''claudette:''). Test: tests/dev470_comment_author_prefix_test.rs failed before the fix and passes now. Checks: npm run lint, npm test (2131 Rust + 1513 UI tests), npm run smoke (387 tests), all passed. Existing comments in .tasks are not rewritten.'
