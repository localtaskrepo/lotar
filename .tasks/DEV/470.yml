- date: 2026-11-13T10:42:36.667185+00:00
  author: claude
  text: 'Fixed in 4c770c59 on agent/DEV-470. TaskService::add_comment_with_context now stores a comment without a leading ''<author>:'', ''<author>,'', ''<author> (...):'' or ''<author>, <date>:'' (case-insensitive) when the name matches the recorded author. That covers CLI, REST and MCP. The CLI dry-run preview strips it the same way. Text that would end up empty stays as it is. Other names stay (''codex: ...'' by claude, ''claudette:''). Test: tests/dev470_comment_author_prefix_test.rs failed before the fix and passes now. Checks: npm run lint, npm test (2131 Rust + 1513 UI tests), npm run smoke (387 tests), all passed. Existing comments in .tasks are not rewritten.'
- date: 2026-11-13T10:44:45.283831+00:00
  author: codex
  text: 'Review: blocking. src/services/task_service.rs:168 preserves prefix-only comments such as claude: by claude, violating Done when (strip or refuse). tests/dev470_comment_author_prefix_test.rs:30 expects this incorrect behavior. Reject these comments with an author-already-recorded message and cover rejection and dry-run. Read diff 4c770c59 against main, ticket/comments, related tickets, guidance, main history and REST/MCP call sites. diff check passed. Rust check hit sccache sandbox denial; retry and lint were stopped during compilation, neither passed. Full tests/smoke not rerun. No files/commits changed or minor tickets filed. Status/assignee unchanged.'
