description: |-
  Agents start comment text with their own name, so `lotar show` prints "claude: claude: ..." and the web UI shows the name twice. On 2026-11-13 this happened in about 300 comments in standards, local, quarter-inch-studio and lotar (also "claude (DEV-459 agent):", "claude, 2026-11-13:"). The instruction that asked for it was removed (DEV-327, standards STD-56), and the standards skill lotar-workflow now says not to do it. Prose has not stopped it, so per standards AGENTS.md ("a rule missed twice becomes a check") lotar should handle it.

  ## Found

  `grep -E "^ *text: '?(claude|codex)[:, (]" .tasks` in the four repos. Example: QIS-185, LOCA-312, DEV-459, DEV-462, DEV-465.

  ## Check

  `lotar comment <ID> "claude: test"` with the author claude stores the text with "claude: " in front.

  ## Done when

  - [ ] A comment whose text starts with its own author's name (followed by ":" or "," or " (...)") is stored without it, or `lotar comment` refuses it with a message saying the author is recorded already. With a test.
