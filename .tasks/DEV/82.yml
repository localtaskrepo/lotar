    - AutomationSimulateResponse keeps all 5 keys required: matched, actions, task_before (TaskDTO, always an object from the handler's manual json!), rule_name [string,null], task_after anyOf[TaskDTO,null]; the handler always serializes all five keys (manual json! macro), distinct from the unused DTO's skip attrs.
    - src/api_types.rs AutomationSimulateRequest.event doc comment now lists the 9 canonical events + case-insensitive legacy aliases; project documented as ignored (doc-only, no runtime change).

    B2 fixes (strict 3.1, scoped to the transitive closure of the 7 repaired paths incl. shared ApiError):
    - Request Option fields (SprintCreateRequest all, SprintUpdateRequest single-value strings, AutomationSimulateRequest.project) declare [T,null] unions with 'null is accepted and treated as omitted (no clear)'; double-option update fields stay [T,null] explicit clears; NOT blankly stripped.
