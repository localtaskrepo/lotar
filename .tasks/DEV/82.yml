    - SprintUpdateRequest.sprint/SprintDeleteRequest.sprint: minimum 1 (update 0 -> 400 verified by test; delete unknown/0 -> 404).
    - Sprint update 200 example now matches actual serialization: data keys {status,sprint} (warnings omitted), sprint keys omit capacity_points (verified key lists in test).
    - Delete 200 example includes integrity (cleanup_missing=true always runs cleanup -> integrity.auto_cleanup present); test also verifies integrity is OMITTED without cleanup_missing.
    - Accounting: closure nullable occurrences 0; 157 remain elsewhere in components (DEV-83 dialect debt, untouched by design; guard test in_scope_closure_carries_no_legacy_nullable enforces the boundary).
    - Validator rewritten strictly: 3.0 nullable now REJECTED (no masking),  composes with siblings, anyOf/oneOf/allOf compose with siblings, properties/required/additionalProperties apply to object instances and items to arrays regardless of type spelling, unsupported validation keywords (pattern, maxLength, ...) fail loudly, dangling refs return errors. Negative unit tests cover: type-array object missing required, anyOf+minimum sibling, allOf, additionalProperties:false, minimum, enum incl. null rejection, non-null rejection, dangling ref, unsupported keyword, inert nullable, +required sibling.

