- date: 2026-11-18T00:10:06.201500+00:00
  author: claude
  text: |-
    Review: passed. `c30990af7` stops a merge from setting a ticket Done when nothing was built for it. One minor gap is filed as DEV-685.

    - **Read:** the diff of `main..agent/DEV-680` (1 commit; HEAD and the branch are the same), DEV-657/677/679, the merge-failure rules in `.tasks/DEV/automation.yml:572-618`, and the last 5 main commits to the touched files.
    - **Done when is met:** the DEV-657 case now fails the merge job (`ensure_branch_merged`, `agent_job_service.rs:4912`). Rule "Merge failed: retry with @fix" then sends the ticket back to @fix. A second failure goes to mallox as HelpNeeded (tag `merge-retried`), so it can't loop. DEV-657 has no commit on lotar main whose subject starts with its ID, so the check holds for the real case.
    - **Test fails before the fix:** `a_ticket_nothing_was_built_for_is_not_done` uses the same setup as the removed test, which asserted `completed`.
    - **Refactor:** the `work_elsewhere` → `named_checkouts` change keeps the old behavior (same dedup, same skips, first match wins).
    - **Reran:** `npm ci` ok. `npm run lint` passed. `cargo nextest run -p lotar-lib -p lotar-agent -E 'test(/dev605|agent_automation_integration|dev318|dev677|dev679|merge/)'`: 96 passed. Full `npm test` and `npm run smoke` were not rerun by me; the fix agent reports both passing. Worktree left clean.
    - **Minor, filed:** DEV-685. `merged_despite_failure` (`agent_job_service.rs:~4991`) doesn't call `built_anywhere`, so a merge runner that crashes on a nothing-built ticket still completes it as Done.
    - **No UI change:** only a smoke fixture changed (`ui.agent-jobs.smoke.spec.ts`), so no screenshots were needed.
