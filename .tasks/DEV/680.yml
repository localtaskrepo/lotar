- date: 2026-11-17T23:57:49.253640+00:00
  author: claude
  text: |-
    Fixed: a merge job now fails, rather than setting the ticket Done, when nothing was built for the ticket.

    - Guard in `ensure_branch_merged` (`crates/lotar-agent/src/services/agent_job_service.rs`): the job fails when the branch brought nothing since the merge job started and no commit whose subject starts with the ticket ID is on main, in lotar or in a repo the ticket names (`merge::built_anywhere`). The automation rule `Merge failed: retry with @fix` then sends the ticket back to the fix step. An agent that handed the ticket back still passes.
    - `merge::work_elsewhere` now shares the repo lookup (`named_checkouts`) with the new check.
    - Test: `a_ticket_nothing_was_built_for_is_not_done` in `dev605_merge_without_agent_test.rs` is the DEV-657 case. It replaces `a_branch_without_new_commits_has_nothing_to_merge`, which expected "completed" for exactly this case, so the new test fails without the fix. Also new: `a_branch_landed_already_has_nothing_to_merge`.
    - Three older fixtures merged tickets that had no commit at all. They now commit work named after the ticket: two in `agent_automation_integration_test.rs`, one in `smoke/tests/ui.agent-jobs.smoke.spec.ts`.
    - Docs: `docs/help/agent.md`, in the merge job section and the lotar merge steps.
