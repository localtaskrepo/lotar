description: 'Found 2026-11-17 on DEV-657: its fix job only edited the ticket (no harnessmux or lotar commit). The review commented ''Review: nothing to review ... no code is written yet, so every Done when item is still open'' but left status/assignee, so the merge reported ''Nothing to merge: agent/DEV-657 is in main already'' and automation set DEV-657 Done. That restarted DEV-652 via ''Prerequisites done'' with the prerequisite unbuilt. DEV-677''s work_elsewhere guard doesn''t apply: no repo has commits on agent/DEV-657. Check: a ticket whose fix job made no commit anywhere and whose review says nothing was written ends Done. Done: such a ticket goes back to the fix step (or HelpNeeded) instead of Done, with a test.'
