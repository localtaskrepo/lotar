- date: 2026-11-25T23:56:02.836747+00:00
  author: claude
  text: |-
    Review: passed. `e0acc2e12` shows **0 · Max parallel (paused)** at limit 0, and ∞ only without a limit, as "Done" asks.

    - Read: the diff (`view/pages/AgentJobs.vue:33-34`, `view/__tests__/AgentJobs.spec.ts`), the ticket, DEV-786, and `docs/help/agent.md` / `config-reference.md`, which say `0` pauses new jobs, so "(paused)" matches them. On main, nothing since the branch point touches these lines.
    - `?? '∞'` also covers a missing `max_parallel`, since `types.ts:1845` makes it optional.
    - `npm ci` passed. `vitest --config view/vitest.config.ts AgentJobs.spec`: all 35 tests pass.
    - Test failed before the fix: with the old `AgentJobs.vue` in a detached scratch worktree (since removed), the case "shows max_parallel 0 as 0" fails.
    - Backend: built this branch (`cargo build`), served a scratch workspace with `max_parallel_jobs: 0` and a clean `HOME`. `GET /api/jobs` returns `max_parallel: 0`. The installed 0.15.6 binary leaves it out, as the fix agent said.
    - UI: I read the fix agent's 12 screenshots (before and after). My own after shots, light and dark at 1920, 1440 and 390, all show "0 Max parallel (paused)" with no layout problems.
    - No stray files and no second branch. No findings, no tickets filed.
