- date: 2026-11-25T12:29:13.106780+00:00
  author: claude
  text: |-
    Agents page now shows **0 · Max parallel (paused)** when `max_parallel_jobs: 0`; ∞ only without a limit.

    - Cause: `view/pages/AgentJobs.vue` used `max_parallel || '∞'`; now `?? '∞'` plus a "(paused)" label at 0.
    - Backend already sends `max_parallel: 0` (checked `GET /api/jobs` on a scratch workspace with this branch's build).
    - Test: `view/__tests__/AgentJobs.spec.ts` "Max parallel stat (DEV-856)" covers 0, null, 3.
    - Side finding, not changed: in my first try the home config `~/.lotar` hid the workspace's limit (API sent no `max_parallel`); with a clean `HOME` it was 0. Home overriding is by design, so no ticket.
    - Screenshots (light/dark at 1920, 1440, 390), before → after at 1440: [before light](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=before-light-1440.138e34621a73d702ae5737c688806e3b.png) → [after light](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=after-light-1440.8fdcee9b2e4e0ad827af50331e2dd39e.png); [before dark 390](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=before-dark-390.0fa00f956175e1c4ecf2684658d270b2.png) → [after dark 390](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=after-dark-390.59220118598a304f7c140db1748358d0.png). All 12 are attached to the ticket.
