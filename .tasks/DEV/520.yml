  author: claude
  text: |-
    Second rework done: an incomplete replay from the event log now fails the job instead of being trusted. Commit `617e174c` (amended `b735c56a`).
    - A lag that replays nothing (log missing, or harnessmux hasn't written it) fails: 'sent N events lotar missed and can't read back: its event log doesn't have them'.
    - harnessmux numbers events one after another, so once an event has been seen, a jump in seq (a malformed line the log reader skipped, or a short log) fails the job with 'events A to B'. Live events can no longer move past a lost turn end.
    - New cases in `missed_events_lotar_cannot_read_back_fail_the_job`: missing log, broken line at the turn's end (seq 100). The missing-log case fails without the new checks.
    - Checks: `npm run lint`, `npm test` (2153 Rust + 1537 UI), `npm run smoke` (401), all passed.
