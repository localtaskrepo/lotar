- date: 2026-11-15T00:55:51.380531+00:00
  author: claude
  text: |-
    Third rework done: lotar now also catches events missing before the first one it sees. Commit `7f943de1` (amended `617e174c`).
    - `SessionEvents::open` reads the log to its end **before** subscribing and takes its last seq as the baseline, so the first event must be baseline+1. Events written between that read and the subscription come from the log.
    - Pending events are kept by seq. On any gap (lag or a jump in seq), lotar reads the log once more; a gap the log still can't fill fails the job with 'events A to B … its event log doesn't have them'.
    - New cases: lines 1–100 broken (turn end included) fail with 'events 1 to 100' (the reviewer's case); `events_start_after_the_logs_last_one` covers a log with earlier turns and events written while subscribing. Without the baseline the missing-prefix cases fail (the session ends before lotar sees the turn end).
    - Cost: one read of the session's log per job at the start.
    - Checks: `npm run lint`, `npm test` (2154 Rust + 1537 UI), `npm run smoke` (401), all passed.
