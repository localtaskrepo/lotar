description: |-
  Found in the DEV-639 review (2026-11-16), on branch `agent/DEV-639` (`08cd964f2`).

  ## Found
  - `node scripts/rust-test-runner.mjs --agent dev510` (9 tests) and `... --agent dev626` (6 tests) pass, then fail with `tests left 1 entries in the temp folder; remove them where they are created: .lotar-test-scratch`. It happened in 2 of 2 dev510 runs and 4 of 4 dev626 runs.
  - Each dev626 test run alone leaves nothing. So it looks like a race in the scratch-base cleanup (`crates/lotar-lib/tests/common/mod.rs`, `isolate_tmpdir_under_owned_scratch` and its `#[dtor]`) when several test processes end together, not like one test's leftover.

  ## Check
  - Run `node scripts/rust-test-runner.mjs --agent dev510` a few times: it exits 1 with `.lotar-test-scratch` as the leftover.

  ## Done when
  - [ ] A filtered run of several tests that all clean up exits 0 with no leftover, in repeated runs of `dev510` and `dev626`.
  - [ ] A real leftover of one test is still reported.
