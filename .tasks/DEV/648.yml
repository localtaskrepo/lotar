comments:
- date: 2026-11-17T04:29:50.434177+00:00
  author: claude
  text: |-
    Fixed: the leftover was a test's own queue files, not a race in the scratch-base cleanup.

    - A kept temp folder showed `.lotar-test-scratch/<pid>/agent-queue/.../job-*.ended` and `.outcome.lock` left in one process's scratch
    - Cause: `dev510_t3_session_test.rs` waits until the recovered job's status is no longer `running`, then exits while the job's worker thread is still in `RunningJobSlot::drop` → `agent_active_jobs::unregister`; it writes those files during or after the `#[dtor]` removes the scratch
    - Fix: the three "the job to end" waits also wait for `AgentJobService::job_settled` (worker finished). The runner's leftover check is unchanged, so a real leftover still fails (`scripts/tests/rust-test-runner.test.mjs:523`)
    - `dev626` tests are only on `agent/DEV-639` (`08cd964f2`) and have the same wait at `dev626_resumed_t3_threads_test.rs:151,182`: that branch needs the same `job_settled` condition
    - Branch also holds `bb7cc8371` (DEV-633 before it was rebased; main has it as `9c10760fa`): the merge rebase drops it
  report:
    commits:
    - hash: 4b1b43da0
      what: dev510 tests wait for the job's worker to settle
    checks:
    - command: node scripts/rust-test-runner.mjs --agent dev510
      result: passed
      reason: '8 of 8 runs exit 0 (before: 2 of 3 failed)'
    - command: node scripts/rust-test-runner.mjs --agent dev626
      result: not_run
      reason: dev626 tests exist only on unmerged agent/DEV-639
    - command: npm run lint
      result: passed
      reason: lint:agent
    - command: npm test
      result: passed
      reason: test:agent
    - command: npm run smoke
      result: passed
    next: Review, then merge; DEV-639 applies the same wait to dev626_resumed_t3_threads_test.rs:151,182
- date: 2026-11-17T04:43:32.359716+00:00
  author: claude
  text: |-
    Review: blocking. dev510 is fixed, but dev626 still leaves `.lotar-test-scratch` on main (3 of 4 runs).

    - Read: the ticket, the fix comment, `4b1b43da0`, `job_settled` and `RunningJobSlot::drop` in `agent_job_service.rs` (`worker_running` goes false only after `agent_active_jobs::unregister` writes `.ended`), and the recovery path `finish_orphaned_job`. The cause and the fix are correct for dev510.
    - Rerun: `node scripts/rust-test-runner.mjs --agent dev510` exited 0 in 4 of 4 runs here, and in 2 of 2 on main plus the fix.
    - **Blocking:** DEV-626 landed on main as `e39ca4b31` (20:31), after this fix (20:29). `crates/lotar-lib/tests/dev626_resumed_t3_threads_test.rs:130` `wait_for_end` waits only for an end status. On main plus `4b1b43da0`, `--agent dev626` exited 1 in 3 of 4 runs with `tests left 1 entries ... .lotar-test-scratch`. "Done when" asks for repeated dev626 runs to pass.
    - Fix: rebase onto main and add `AgentJobService::job_settled(job_id) &&` to the `wait_for_end` condition. I tried that in a scratch copy: dev626 exited 0 in 4 of 4 runs, dev510 in 2 of 2.
    - A real leftover is still reported: the runner is unchanged, and `scripts/tests/rust-test-runner.test.mjs:523` covers it.
    - The branch still has `bb7cc8371`. Its code matches main's `9c10760fa`, so the rebase drops it.
    - Not rerun: lint, the full test suite and smoke (the diff is in tests only, and the rework changes it anyway).
- date: 2026-11-17T05:08:23.193412+00:00
  author: claude
  text: |-
    Rework done: dev626 now waits for the job's worker too; rebased onto main.

    - Finding (dev626 still leaves `.lotar-test-scratch`): `wait_for_end` in `crates/lotar-lib/tests/dev626_resumed_t3_threads_test.rs:130` now also requires `AgentJobService::job_settled(job_id)`, as the dev510 waits do
    - Rebased onto main `11c077fe6`; skipped the stale `bb7cc8371`: its code patch matches main's `9c10760fa` (DEV-633), the conflicts were only `.tasks` files main has newer
    - Amended into one commit `9a58f4cad` (was `4b1b43da0`)
