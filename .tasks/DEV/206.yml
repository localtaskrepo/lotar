comments:
- date: 2026-10-26T20:43:02.311910+00:00
  text: 'From DEV-201 live runs: Codex runs commands through a login shell (bash -lc) and puts its own directory first on PATH, so prepending the lotar directory to PATH is not enough for Codex; it kept calling Homebrew''s lotar 0.9.1, whose assignee validation rejected the reporter on hand-back. Prefer an absolute path (e.g. LOTAR_BIN in the job env and in the built-in instructions) or the MCP route.'
- date: 2026-10-26T21:28:33.038935+00:00
  text: 'Done: jobs get LOTAR_BIN (absolute path of the lotar that started the job) and the built-in instructions run "${LOTAR_BIN:-lotar}". Test: cli_agent_check_test::agent_jobs_get_the_running_lotar_binary. Live: codex and claude handback pass without any PATH change (codex previously hit Homebrew 0.9.1). The MCP injection option is split into a separate low-priority ticket since the CLI route now works on all three CLIs. Gates: lint, 1728 Rust + 1214 UI, 350 smoke.'
- date: 2026-10-26T21:43:47.806566+00:00
  text: 'Follow-up after the Agents page browser check: Claude Code refuses ${...} expansions and a variable as the command, so "${LOTAR_BIN:-lotar}" made Claude fall back to the PATH lotar. Now the ''This job'' section names the absolute lotar path, its directory goes first on PATH, LOTAR_BIN stays set, and the examples use plain lotar and "$VAR" arguments (new LOTAR_TICKET_PROJECT replaces ${LOTAR_TICKET_ID%-*}). Also: denied-tool notes list each denied command, and the runner''s final answer is the job summary instead of that note. Live: claude and codex handback pass, both calling target/debug/lotar by absolute path. Gates: lint, 1729 Rust + 1214 UI, 350 smoke.'
description: |-
  Agents update their ticket through the lotar CLI today, which works but depends on whichever lotar binary is on PATH (the live checks ran Homebrew's 0.9.1 instead of the build that started the job).

  Options to evaluate:
  - Inject LoTaR's own MCP server into each run (claude --mcp-config JSON, codex -c mcp_servers.lotar.*, copilot --additional-mcp-config) with its tools pre-approved, behind a profile switch such as mcp.lotar: true.
  - At least put the running lotar binary first on PATH (or export LOTAR_BIN) so the CLI the agent calls matches the server.
  Needs live checks per CLI: headless MCP tool approval differs between them. Raised while testing DEV-199/DEV-200.
