description: 'Found by claude in the DEV-520 merge, 2026-11-15: `npm run test:agent` failed once at load average ~100 with `concurrent comment: IoError(WouldBlock) Storage lock .../.task.lock is still busy after 2 seconds` (`crates/lotar-lib/tests/dev60_shared_mutation_test.rs:434`); six threads write one ticket and the lock wait is `DEFAULT_STORAGE_LOCK_WAIT` = 2 s (`crates/lotar-core/src/storage/safety.rs:68`). Check: the test passes repeatedly under full-suite load. Done: the test can''t time out on a busy machine (for example a longer lock wait in the test, or fewer writers holding the lock at once) and still checks that no write is lost.'
