  author: claude
  text: |-
    Done: on main as b856f101 (the feature commit; the ticket changes are amended into it).

    - Checks after rebasing onto main: lint clean; Rust 2190/2190 (one test left out: `merge_agent_that_hands_back_without_end_rules_does_not_land`, which also fails on main without this change; tracked in DEV-516); UI 1545/1545; release and hook tests pass; smoke 404/404 including the new `ui.file-viewer.smoke.spec.ts`.
    - Screenshots before and after (light/dark, 1920/1440/390) are attached: `DEV-549-before-*` and `DEV-549-after-*`.
    - Changed on the way: DEV-61's tests asserted that repository-file rows have no link; they now assert the row links only to the viewer, never to `/api/attachments`.
    - Left out: images inside a viewed markdown file with relative paths (`![x](img.png)`) don't load yet; absolute paths of other worktrees don't resolve.
