description: |-
  Ticket descriptions and comments name repo files (`docs/help/agent.md`, `src/x.rs:42`, `api_types.rs`), but they are plain text. The owner wants to click one and read the file, also from the phone (mallox 2026-11-14: "Mostly I just need to read files. Maybe we create our own file preview instead and support some common file types for pretty rendering."). So a read-only viewer inside lotar, not launching programs on the server machine.

  ## Plan

  - **Linking** in `view/utils/markdown.ts`, next to task references: paths in text and inline code (`path`, `path:42`, `path#L10-20`), absolute paths inside the repo, markdown links to relative paths.
  - **Resolve**: one batched `POST /api/files/resolve` per rendered text; only existing files become links. A bare name links when exactly one file in the repo has it.
  - **Content**: `GET /api/files/content?path=…` serves files of the repo that holds `.tasks`. Refused: outside the repo (symlinks resolved), `.git/`, git-ignored files (keeps `.env` out), over a size cap.
  - **Viewer** dialog like `AttachmentViewer.vue`: markdown rendered (repo links inside open in the viewer), code/JSON/YAML/TOML with line numbers and lazy-loaded highlighting, referenced line or range highlighted and scrolled to, images shown, other binaries offered as download. Open file kept in the URL (`?file=path:42`).
  - Contract: `api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, `docs/help/serve.md`.

  ## Done when

  - [x] File references in descriptions and comments link to existing repo files only
  - [x] The viewer renders markdown, highlights code and jumps to the line
  - [x] Paths outside the repo, `.git/`, ignored files and oversized files are refused (Rust tests)
  - [x] Vitest for linking, Playwright smoke for click → viewer at the line
  - [x] Before/after screenshots attached
  - [x] `npm run lint`, `npm test`, `npm run smoke` pass
