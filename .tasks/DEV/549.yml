  author: claude
  text: |-
    Built on branch `DEV-549` (worktree `~/.t3/worktrees/lotar/DEV-549-file-viewer`), not committed yet.

    - Server: `services/repo_file_service.rs`, routes `POST /api/files/resolve` and `GET /api/files/content` in `routes/files.rs`; only files git would track, symlinks checked, 2 MiB cap.
    - UI: `FileViewer.vue` (rendered/source markdown, highlight.js 11.12.0 loaded on demand, line selection), links in `utils/markdown.ts`; References tab `file`/`code` entries open the viewer too.
    - Found and fixed on the way: the task list read `?file=` as a filter; overlay query keys now live in `utils/overlayQuery.ts`.
    - Checks so far: lint clean; Rust unit + route tests, openapi contract, vitest and the new smoke test pass. Full `npm test` and `npm run smoke` running.
