- date: 2026-11-27T13:11:55.055639+00:00
  author: claude
  text: |-
    Fixed: a build from another checkout's cwd no longer keeps that checkout's paths.

    - Reproduced the ticket's check in a scratch workspace: `b/docs` printed twice.
    - The three build scripts (`crates/lotar-lib/build.rs`, `crates/lotar-agent/build.rs`, `crates/lotar-web-assets/build.rs`) now emit `cargo::rerun-if-changed=<manifest_dir>/build.rs` (absolute). Cargo keeps an absolute path that is not under the building package's root, so the recorded path differs per checkout and the script reruns, whatever the cwd. A repeat build stays fresh (`Finished ... 0.00s`).
    - That alone fixes it, so DEV-919's `LOTAR_CHECKOUT_DIR` (`.cargo/config.toml`, read from the cwd) is removed.
    - `crates/lotar-lib/tests/build_script_checkout_test.rs`: new test runs the ticket's check on two probe crates with the same line. It fails with a relative `rerun-if-changed=build.rs` (prints b's path) and passes with the fix.
  report:
    commits:
    - hash: f61dcb8bb
      what: build scripts watch their build.rs by absolute path; drop LOTAR_CHECKOUT_DIR
