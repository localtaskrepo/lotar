description: 'Found in DEV-919''s review (2026-11-27). Cargo reads `.cargo/config.toml` from the current directory, not the manifest''s, so `cargo build --manifest-path <copy>/Cargo.toml` run from checkout A sets `LOTAR_CHECKOUT_DIR` to A while building the copy; A''s next build then keeps the copy''s `LOTAR_DOCS_DIR`. Check: in a scratch workspace with the DEV-919 config, `cd a && cargo run --manifest-path ../b/Cargo.toml --target-dir t && cargo run --target-dir t` prints b''s path twice. Done when: the build scripts rerun per checkout without relying on cwd, for example by also emitting `rerun-if-changed` on an absolute path under CARGO_MANIFEST_DIR, with a test.'
