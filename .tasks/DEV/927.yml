    next: Review, then merge
- date: 2026-11-27T13:14:28.094100+00:00
  author: claude
  text: |-
    Review: passed. A build started from another checkout's cwd no longer keeps that checkout's paths.

    - Read: the ticket, the fix comment, `f61dcb8bb` (the only commit on `main..HEAD`, no newer ticket branch), DEV-919's fix and review, and main's last commits to the build scripts (`e737e8b9f`, `bafbec164`, `385b207d0`).
    - Done when is met: `crates/lotar-lib/build.rs`, `crates/lotar-agent/build.rs` and `crates/lotar-web-assets/build.rs` emit `cargo::rerun-if-changed=<CARGO_MANIFEST_DIR>/build.rs`. The new test `a_build_from_another_checkout_does_not_keep_its_path` runs the ticket's check on probe crates.
    - Checked it myself in a scratch workspace laid out like lotar (`crates/p` as a workspace member, shared `--target-dir`), cargo 1.100. `--manifest-path ../b` from `a`, then `a`: each build printed its own path. The reverse direction worked too. With the old relative `rerun-if-changed=build.rs`, `a` printed b's path. A repeat build stays `Fresh` (`cargo build -v`).
    - Removing `.cargo/config.toml` and `LOTAR_CHECKOUT_DIR` is safe. Nothing else uses them (grep), and the absolute path also covers DEV-919's case, building from inside the copy.
    - Reran `npm ci`, the 3 `build_script` tests (`cargo nextest run -p lotar-lib --test integration build_script`) and `npm run lint`: all passed. Worktree left clean.
    - No UI changes and no owner decisions involved. No stray files. No tickets filed: `.github/workflows/ci.yml:67` still lists `.cargo/config.toml` in its path filter, which is harmless now that the file is gone.
