- date: 2026-11-21T09:14:31.641598+00:00
  author: claude
  text: |-
    The four flaky smoke files now wait with budgets that hold up under load. Full smoke passes.

    - `api.automation.smoke.spec.ts` chatty stderr: the 10 s wait for `completed-server.marker` is now a wait for the completed **or** aborted marker (up to 90 s). The aborted check runs first. The child's leak-guard bound goes from 15 s to 45 s, so a slow monitor under load doesn't trip it. A wedged monitor still fails, at the bound.
    - `api.review-policy.smoke.spec.ts`: `waitForStarted` 10 s → 45 s, the `running` poll 10 s → 30 s, and the gate holds for 90 s (`holdMs`) instead of the 20 s default, as in DEV-750. The `finally` still releases the gate.
    - `ui.dialogs` and `ui.filter-autocomplete`: no single step timed out; they hit the shared 120 s test cap. They are the suite's four longest tests: 3–7 s alone, 13–18 s in full runs at load 70–95. Their `describe` now gets `{ timeout: 300_000 }`, a one-line change; the per-test option would have re-indented each whole test body.
    - Not reproduced: three full smoke runs at load 45–95 passed before the fix, so the 120 s failures were likely a machine stall in the DEV-750 review run. The before state can't be shown failing.
  report:
    commits:
