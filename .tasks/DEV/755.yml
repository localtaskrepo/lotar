- date: 2026-11-21T14:44:23.379518+00:00
  author: claude
  text: |-
    Review: passed. `8a3d78b35` gives the four flaky smoke tests time budgets that hold up under load, without weakening what they check.

    - Read: the diff (4 files under `smoke/tests/`, +31/−12), the ticket and fix comment, [DEV-750](https://lotar.pyxzl.net/task/DEV-750), AGENTS.md, and the last 5 main commits to each file. No newer main commit changes what the fix relies on. The branch merges cleanly onto main (`f2a2f6811`) and the commit is signed.
    - Chatty stderr (`api.automation.smoke.spec.ts:775,796-813`): the child's own timeout (`--bound-ms`, set in `chattyArgs`) was 15 s, but the test gave up after 10 s, so a slow spawn failed before the guard could ever fire. Now the guard is 45 s and the test waits up to 90 s for either marker, then asserts that `aborted-server.marker` is missing. A wedged monitor still fails, either at the bound or because the aborted marker is there.
    - Review policy (`api.review-policy.smoke.spec.ts:271-277,302,313`): `holdMs: 90_000` exists in `gate-agent.mjs:53` and `agent-fixtures.ts:344`. Starting the job (45 s) plus the poll (30 s) fits inside the 90 s hold, and the `finally` still releases the gate.
    - UI dialogs / filter autocomplete: `describe.concurrent(name, { timeout: 300_000 }, fn)` is a valid vitest 5 option and overrides the 120 s cap in `smoke/vitest.config.ts:15` for those two describes only.
    - No test that failed before the fix: these are timing fixes, and the fix agent says three full runs at load 45–95 did not reproduce the failure. That's acceptable for flaky-timeout work.
    - No stray files, no second copy of the fix.
    - Reran: `npm ci` passed. `npm run test:smoke:agent -- <the 4 files>`: 24/24 passed in 39 s, load 13–31. `npm run lint:frontend` passed. `npx prettier --check <4 files>` passed.
    - Not rerun: full `npm run smoke`, `npm test` and `npm run lint`. The fix agent reports they passed, the full smoke run at load up to 64.
    - No findings, no tickets filed.
