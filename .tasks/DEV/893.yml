description: 'Found (DEV-883 review): with a ~/.lotar whose agents.bad.stall_timeout_seconds is notanumber, `lotar config validate` prints `❌ Invalid home config (~/.lotar): …` and then `✅ Global configuration is valid` before failing with exit 1. The success line contradicts the error above it. Check: HOME=<tmp> with that .lotar, run lotar config validate. Done: no ''Global configuration is valid'' line when the home config fails to parse (crates/lotar-lib/src/cli/handlers/config/validate.rs:43-61).'
