    Review: passed. `a965c1ec7` does what "Done when" asks; nothing blocking, no minor findings.

    - Read: the diff (`resumed.rs`, `run_inputs.rs`, `dev503_harness_jobs_test.rs`, `docs/help/agent.md`), the ticket, DEV-920, the last 5 commits on main to these files.
    - `adopt` writes the `run_inputs` line after `start_job` made the log: one `User request` section, runner `t3`, profile, model, effort, session `resumed`. `earlier_request` reads exactly that format. The lookup order is unchanged: limit retry, this process's record, log line, `GO_ON`. A failed write is ignored (`run_inputs::record`), so the job keeps running.
