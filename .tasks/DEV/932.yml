- date: 2026-11-27T13:52:02.401093+00:00
  author: claude
  text: |-
    Review: passed. `a965c1ec7` does what "Done when" asks; nothing blocking, no minor findings.

    - Read: the diff (`resumed.rs`, `run_inputs.rs`, `dev503_harness_jobs_test.rs`, `docs/help/agent.md`), the ticket, DEV-920, the last 5 commits on main to these files.
    - `adopt` writes the `run_inputs` line after `start_job` made the log: one `User request` section, runner `t3`, profile, model, effort, session `resumed`. `earlier_request` reads exactly that format. The lookup order is unchanged: limit retry, this process's record, log line, `GO_ON`. A failed write is ignored (`run_inputs::record`), so the job keeps running.
    - The only other reader of `run_inputs` is the Instructions/`--inputs` display (`agent_job_service.rs:700`), which now shows the takeover's request where it said "Not recorded". The docs say so.
    - The new test fails without the fix. In a scratch worktree with the `record` line removed, the retry asked `Go on with the ticket's work…` instead of `Work on it`. With the fix it passes.
    - Reran: `npm ci` (ok), `cargo build -p lotar`, `cargo nextest run -p lotar-lib --test integration -E 'test(/dev503_harness_jobs_test::.*(takeover|taken_over|took_over)/)'` (5 passed), `npm run lint` (exit 0). Not run: full suites and smoke (the merge runs them).
    - No stray files, one commit, no UI changes.
