    - The new test fails without the fix. In a scratch worktree with the `record` line removed, the retry asked `Go on with the ticket's work…` instead of `Work on it`. With the fix it passes.
    - Reran: `npm ci` (ok), `cargo build -p lotar`, `cargo nextest run -p lotar-lib --test integration -E 'test(/dev503_harness_jobs_test::.*(takeover|taken_over|took_over)/)'` (5 passed), `npm run lint` (exit 0). Not run: full suites and smoke (the merge runs them).
