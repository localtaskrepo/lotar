description: |-
  ## Found (review of DEV-920, 2026-11-27)
  - DEV-920's `takeover_request` (`crates/lotar-agent/src/services/agent_job_service/resumed.rs`) reads the earlier job's request from the limit retry, then this process's `JOB_REGISTRY`, then the earlier job's `run_inputs` log line.
  - A taken-over job (`adopt`) still writes no `run_inputs` line, and its `agent_active_jobs` record (which holds `request`) is gone once it ends. So when the process that took it over has exited (queue worker gone idle, `lotar serve` restarted) and no limit retry is queued, the next takeover falls back to `GO_ON`. The fix agent noted this as a known gap; `docs/help/agent.md` says "also when that one was taken over in the same process".

  ## Done when
  - [ ] A test: a job taken over in another process (a `lotar agent worker` subprocess that exits, so this process's registry has no record of it), ended without a limit retry, is taken over again and its retry gets the first job's prompt and profile.
  - [ ] A taken-over job writes a `run_inputs` line once its log exists: the request it would ask as its `User request` section, its profile, runner `t3`, session `resumed`. Order stays: limit retry, then this process's record, then the log line, then `GO_ON`. A failed write leaves the job running (as for other jobs); the next takeover then falls back to `GO_ON`.
  - [ ] `docs/help/agent.md`: the takeover line drops "in the same process"; Run inputs says what a taken-over job's line holds.
