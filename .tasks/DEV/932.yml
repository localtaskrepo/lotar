  author: claude
  text: |-
    A taken-over job now writes a `run_inputs` line, so a takeover in a later process asks the first job's request.

    - `adopt` (`crates/lotar-agent/src/services/agent_job_service/resumed.rs`) records, once `start_job` made the log, a `run_inputs` line from new `run_inputs::takeover_inputs`: prompt `User request:\n<request>` as its one `User request` section, runner `t3`, profile, model, effort, session `resumed`. `earlier_request` already reads that section.
    - Order unchanged: limit retry, this process's record, the log line, `GO_ON`. A failed write leaves the job running, as for other jobs.
    - New test `a_takeover_of_a_job_another_process_took_over_asks_the_first_jobs_request` (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs`): a `lotar agent worker` subprocess takes the thread over and exits; the takeover in the test process (no record of that job, no retry queued) pauses on a limit and its retry asks `Work on it` on `fix`.
    - `docs/help/agent.md`: the takeover line says "taken over itself, in this process or another"; Run inputs says what a taken-over job's line holds.
    - Note: the test runs the root `lotar` binary, so `cargo build -p lotar` comes before it.
    - No guidance correction found.
