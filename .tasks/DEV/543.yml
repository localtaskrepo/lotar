comments:
- date: 2026-11-14T18:49:47.537612+00:00
  author: claude
  text: |-
    Fix done, committed, waits for DEV-467 to land on main.

    - `749caaba` on `agent/DEV-543`: an outcome whose job still has an end-action checkpoint is deferred, not applied; `apply_pending_outcomes` replays the checkpoint first and skips outcomes whose checkpoint is still there. `docs/help/agent.md` says the outcome waits behind the checkpoint.
    - Test `pending_outcome_tests::an_outcome_waits_for_the_end_rules_it_follows`: the comment step finds the lock busy, the lock frees before the outcome, and the outcome and its `updated` rule apply only after the end rule's comment. Without the fix it fails.
    - Checks: `npm run lint:agent`, `npm run test:agent` (Rust 2140, UI 1515), `npm run smoke` (390): all pass.
    - Blocked: the code this fixes exists only in DEV-467 (`9439eafe`, `887e36ef`, old `src/` layout), which isn't on main and is HelpNeeded after its merge rebase failed. My branch is reset onto `887e36ef`, so it carries those two commits; merging it now would land DEV-467 unreviewed by its port. Depends on DEV-467 now.
    - Next step once DEV-467 is Done: `git rebase --onto main 887e36ef agent/DEV-543`, move the change to `crates/lotar-lib/src/services/automation_service.rs`, rerun lint, test, smoke. Or the DEV-467 port takes `749caaba` with it and this closes.
- date: 2026-11-15T07:52:22.581710+00:00
  author: claude
  text: |-
    Fix ported onto main after DEV-467 landed (`b67c1d80`): one commit `06c8bd7f` on `agent/DEV-543`, ready for review.

    - Rebased with `git rebase --onto main 887e36ef`: the branch no longer carries DEV-467's old commits. Main still applied the outcome right after a busy end action, so the fix was still needed.
    - `crates/lotar-lib/src/services/automation_service.rs`: `apply_job_event` defers the outcome while the job's end-action checkpoint exists; `apply_pending_outcomes` replays the checkpoint first and skips outcomes whose checkpoint is still there. New helper `end_action_path`.
    - Conflicts: next to main's DEV-528 test (kept both tests) and its `docs/help/agent.md` text (kept main's, added the sentence that the outcome waits behind the checkpoint).
    - Test `pending_outcome_tests::an_outcome_waits_for_the_end_rules_it_follows` frees the lock between the end rule's busy comment and the outcome: it fails without the fix and passes with it.
    - Checks on `06c8bd7f`: `npm run lint:agent` passed; `npm run test:agent` passed (Rust 2205, UI 1547, release 50, hooks 7); `npm run smoke` passed (404).
