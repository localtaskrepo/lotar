description: 'Found in the DEV-467 review (887e36ef). In AutomationService::apply_job_event (src/services/automation_service.rs ~575-600) the recorded outcome is applied even when apply_durable_end_action returned a busy error and left steps pending. If the lock frees between the two, the outcome and its updated/assigned rules run before the remaining end-rule steps (other set fields, add/remove, comment, run, tell_agent), which replay later. Status/assignee can''t conflict (without_outcome_fields strips them), but previous.* is not ''the ticket after the job''s rules ran'' as docs/help/agent.md says, and a queued agent or updated rule can see the ticket before the end rule''s tags. Done when: the outcome waits behind the job''s pending end-action checkpoint (defer it while the checkpoint exists, replay it after), with a test that frees the lock between the two.'
