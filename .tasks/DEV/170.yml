- date: 2026-10-25T00:07:23.315288+00:00
  text: 'Another occurrence 2026-10-24 (full smoke after applying Dependabot #44/#45/#47 locally): ui.insights-isolation ''drawer open and feed refresh cannot alter the Insights activity chart (mocked feed, isolated scopes)'' failed once in a full parallel run, then passed 3/3 in isolation and the next full run passed 343/343. Same load-timing pattern.'
- date: 2026-10-25T01:48:03.384938+00:00
  text: 'More evidence (2026-10-24 full smoke run): ui.relationships (colour assertion rgb(15,23,42) vs rgb(229,231,235)) and ui.sprints-responsive 844px (expect.poll timeout) failed under full parallel load; both specs pass in isolation (26/26).'
- date: 2026-10-25T02:10:00.707792+00:00
  text: 'Another load-only failure (2026-10-24): ui.sync-scope ''keeps an active pull scoped while the user switches projects'' expect.poll timeout at line 314 in the full run; passed 3/3 in isolation.'
description: 'Observed 2026-10-24 on macOS full smoke runs (test:smoke:agent / test:smoke:quick:agent), all passing when rerun in isolation: ui.query-isolation ''surfaces failed calendar query switches without stale rows and recovers via retry'' (once), ui.query-isolation ''keeps a foreign-project task out of the active filtered view while it stays reachable via its own project'' (once) and ui.relationships ''ranks exact IDs first across lookup fields and restores searched content after leaving the view'' (once); about 1 failing run in 5. Same pattern as DEV-132/DEV-136: timing under full parallel load. Next: capture the assertion and timing evidence for each and make the waits condition-based.'
