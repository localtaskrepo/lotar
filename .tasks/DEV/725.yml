  Steps: `.github/skills/release/SKILL.md` and `docs/release-guide.md`. Tickets that wait for this release are Blocked and depend on it (`lotar task relationships add DEV-N <this> --kind depends-on`); closing this ticket hands them to @fix to run their checks.

  ## Done when
  - [ ] `Cargo.toml` workspace version and every internal `=0.15.x` pin read `0.15.6`; `Cargo.lock` matches
  - [ ] `npm run lint`, `npm test` and `npm run smoke` pass on the bump commit
  - [ ] The commit is merged to main and Quality Assurance is green there; a red run stops the release (no tag) and the failure gets a ticket
  - [ ] Signed tag `v0.15.6` pushed, release 0.15.6 marked released, the release guide's remaining steps done
  - [ ] Tickets that depend on DEV-725 (STD-273, STD-259 wait for it) are handed on
