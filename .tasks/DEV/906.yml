description: |-
  Found by the DEV-905 job (2026-11-26): `file_reference_rejects_custom_configured_store_location` and `store_guard_fails_closed_on_invalid_configuration` fail with "Reference path escapes repository", also alone and without DEV-905's change.

  Cause: `isolated_workspace()` makes its temp dir in `CARGO_TARGET_TMPDIR`; in a job worktree `target` is a symlink to `/Volumes/Builds/jobs/lotar/<ticket>` (DEV-762), so the workspace lies outside the repository.

  Check: `cargo nextest run --cargo-profile dev -p lotar-lib --test integration -E 'test(/dev61_reference_kinds_test::/)'` in a job worktree with a build root.

  Done when: these tests pass there too (e.g. a temp workspace inside the worktree, or resolve the link).
