- date: 2026-11-26T20:52:08.089195+00:00
  author: claude
  text: |-
    dev61 tests pass in a job worktree whose `target` links to the build root.

    - Cause confirmed: `CARGO_TARGET_TMPDIR` resolves to `/Volumes/Builds/jobs/lotar/DEV-906/...`, so the canonical workspace path escapes the repo root
    - `crates/lotar-lib/tests/dev61_reference_kinds_test.rs`: new `fixture_base()` keeps `CARGO_TARGET_TMPDIR` when it really lies in the checkout, else uses `<checkout>/.test-tmp/`
    - `.gitignore`: `/.test-tmp/`
    - Before: 3 of 18 failed (`file_reference_rejects_custom_configured_store_location`, `rest_file_reference_add_and_remove_roundtrip`, `code_references_reject_store_paths_and_stale_detach_still_works`); after: 18/18
    - 22 changed lines: no small-diff tag
  report:
    commits:
    - hash: f565ec57a
      what: dev61 fixture uses the checkout's .test-tmp/ when target links outside it
    checks:
    - command: cargo nextest run --cargo-profile dev -p lotar-lib --test integration -E 'test(/dev61_reference_kinds_test::/)'
      result: passed
      reason: 18/18 in this job worktree, 3 failed before
    - command: npm run lint
      result: passed
    - command: npm test
      result: not_run
      reason: merge runs the full suites (DEV-797)
    - command: npm run smoke
      result: not_run
      reason: merge runs it
    next: Review, then merge
