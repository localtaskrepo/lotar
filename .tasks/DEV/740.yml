  text: |-
    Waiting for DEV-711: the code to change is only on `agent/DEV-711` so far.

    - `usage_limit::of_failures_in` and the harnessmux 0.2.0 `Failure` input come from `5cb9e3364` (DEV-711). Main still has the old `usage_limit::find`.
    - DEV-711 is in Merging. Its rebase onto main conflicted in `agent_job_service.rs`, and the merge agent has it.
    - Added "Done when" with the choice: pause on a limit line whatever the kind, so the doc's "A limit wins" stays true. harnessmux's `Failure` doesn't say where its kind came from, so the text match runs for every kind.
    - Next: once DEV-711 is on main, change `of_failures_in`, add tests, update `docs/help/agent.md`.
- date: 2026-11-20T22:37:59.270935+00:00
  author: claude
  text: |-
    Done: a failure harnessmux typed as sign-in, overload, context or transport now pauses when its text has a usage-limit line.

    - Branch fast-forwarded to main (`7b5a53d2c`, has DEV-711's `b98036dbb`).
    - `crates/lotar-agent/src/services/usage_limit.rs`: `of_failures_in` runs the text match for every kind other than `rate_limited`/`quota` (those unchanged: `resets_at` over a time in the text, else default wait).
    - New tests: `auth_required` with a limit line pauses at its time; `overloaded` with one waits the default; any kind without a limit line stays a failure; first limit among several failed turns wins.
    - `docs/help/agent.md` (What counts): a limit line counts whatever kind harnessmux gave; "A limit wins…" stays.
    - The only caller is `usage_limit_pause` in `agent_job_service.rs`, unchanged.
