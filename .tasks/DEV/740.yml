description: |-
  Found in the DEV-711 review (2026-11-20). harnessmux 0.2.0 sorts a failure by its text with sign-in first (`kind_of_text`, `harnessmux-0.2.0/src/failure.rs`: `unauthorized`, `failed to authenticate` … before `usage limit`). So a t3 failure text (`t3 exited with …: <T3's error output>`) that names both comes back as `auth_required`, and `usage_limit::of_failures_in` (`crates/lotar-agent/src/services/usage_limit.rs`) gives no pause. Before DEV-711 the line-by-line text match paused it. `docs/help/agent.md` (Usage limits, What counts) still says 'A limit wins over any other failure in the same output, a full disk or a signing failure included'.
  Check: a TurnFailed of kind auth_required (or overloaded) from text alone whose text has a usage-limit line: either pause on it (e.g. also run the text match for kinds harnessmux took from text) or reword the doc sentence; a unit test covers the choice.
  Done: the doc and the behaviour agree.

  ## Done when
  Chosen: pause, keeping the doc's "A limit wins" (and the behaviour before DEV-711). harnessmux 0.2.0's `Failure` doesn't say whether its kind came from error data or from text, so the text match runs for every kind.
  - [ ] `usage_limit::of_failures_in`: a failure of kind `auth_required`, `overloaded`, `context` or `transport` whose text has a usage-limit line pauses at the time that line names, else the default wait.
  - [ ] `rate_limited`/`quota` unchanged: `resets_at` wins over a time in the text; with neither, the default wait.
  - [ ] A failure of any kind with no limit line in its text still fails (no pause).
  - [ ] Several failed turns: the first one that is a limit wins.
  - [ ] Unit tests in `usage_limit.rs` cover an `auth_required` failure and an `overloaded` failure that both name a limit, and an `auth_required` failure that names none.
  - [ ] `docs/help/agent.md` (Usage limits, What counts) says a limit line in the text counts whatever kind harnessmux gave; "A limit wins…" stays true.
  - [ ] Runs on DEV-711's code (`of_failures_in`); it waits until DEV-711 is on main.
