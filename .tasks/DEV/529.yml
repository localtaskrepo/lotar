description: |-
  Found 2026-11-14 on standards STD-96. The built-in job instructions' quick reference says to read ticket details with `lotar --format json list STD-96`. That is a text search: in standards it returns 7 tickets (STD-105, STD-97, STD-96, INBOX-125, STD-110, INBOX-123, INBOX-54), and the asked-for ticket is not first. An agent that took `tasks[0]` wrote STD-97's description into STD-96 (history 2026-11-13T21:15:12), and lotar's link detection then added a wrong STD-95 relationship.

  ## Done when
  - [ ] The job instructions' quick reference reads a ticket with a command that returns exactly that ticket (e.g. `lotar --format json show <ID>`, or `list` with an exact ID filter).
  - [ ] `lotar list <ID>` with an argument that is a full ticket ID either returns that ticket alone or puts the exact match first; docs/help/list.md says which.
  - [ ] Test: list with a full ID in a workspace where other tickets mention that ID.
