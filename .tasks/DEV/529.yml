  text: 'Fixed in 9976ba1f (agent/DEV-529). Job instructions (docs/help/agent-instructions.md) and the lotar-workflow and lotar-dev-tracking skills now read the ticket with `--format json show <ID>`. `lotar list <ID>` with a full ID (also REST/MCP/web UI, via task_query::apply) puts that task first in every non-relevance order; the others keep their order. docs/help/list.md says so and points to show. New test dev167_text_search_test::cli_list_with_a_full_id_puts_that_task_first (fails without the fix); agent_job_service test updated. Checks: npm run lint, npm run test:agent (2161 Rust + 1537 UI passed), npm run smoke (401 passed).'
