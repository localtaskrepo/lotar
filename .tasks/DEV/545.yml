description: |-
  Opening one ticket downloads up to 200 full tickets of its project only to suggest names, tags and custom field values. On the owner's inbox (standards.pyxzl.net, 2026-11-14) that was 618 KB and 652 ms of the page load for `/api/tasks/get` returning 5 KB, and it grows with the project.

  ## Cause

  `preloadPeople` in `view/composables/useTaskPanelOwnership.ts` calls `api.listTasks({ project, limit: 200 })` and keeps only `assignee`, `reporter`, `tags` and `custom_fields` of each item. The list returns whole tickets: descriptions, comments, history. It also sees only the first 200, so suggestions miss values used in older tickets.

  Measured in the browser (`performance.getEntriesByType('resource')`) on `/task/INBOX-131`: `/api/tasks/list?project=INBOX&limit=200&offset=0` +652 ms, 618 KB; every other API call of the page under 200 KB together.

  ## Fix

  Get the suggestion values without whole tickets: an existing lighter source (`/api/tasks/suggest`, project stats, config members) or a small endpoint returning the distinct people, tags and field values of a project. A REST shape change follows the api-contract skill (`api_types.rs`, `view/api/types.ts`, `docs/openapi.json`).

  ## Done when

  - [x] Opening a ticket (edit or new) requests `GET /api/tasks/values?project=<PREFIX>` for suggestions, not `/api/tasks/list`; the response holds only the distinct names, tags and field values, no ticket bodies
  - [x] The endpoint reads every active ticket of the project (not deleted, not archived, no 200 cap); without `project` it reads all projects, as the panel did before; an unknown project answers 404
  - [x] Values are trimmed, empty ones dropped, each list sorted and without duplicates: people = assignee and reporter as stored; tags; custom fields = string and number values, list fields item by item (other types skipped, as before)
  - [x] Assignee, reporter, tag and custom field suggestions still offer the same values, plus those of tickets beyond the first 200 (Rust test of the endpoint, vitest of the panel)
  - [x] When the request fails, the panel still offers configured members, defaults, agent profiles and the current user, as now
  - [x] Contract agrees: `api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, REST help doc
  - [x] Payload measured before and after on a seeded project of 300+ tickets
