- date: 2026-11-19T19:27:08.722784+00:00
  author: claude
  text: |-
    Fixed in the app, not just the spec: the Boards page cancelled the `g c` move to `/calendar`.

    - Cause: on `/boards` the filter bar loads the project list, picks the only project and the page runs `router.push({ path: '/boards', query: { project } })`. When `g c` already started the move to `/calendar` (lazy chunk still loading under load), that push cancels it. Same kind of bug as DEV-355 on the tasks page.
    - Fix: `useProjectFilterSync` in `view/composables/useFilterBuilder.ts` skips that push while a navigation away is pending (`onBeforeRouteLeave` + `afterEach`, the DEV-355 pattern). Covers Boards, Sprints and Insights.
    - New smoke test in `smoke/tests/ui.keyboard-shortcuts.smoke.spec.ts` holds `/api/projects/list` and the Calendar chunk to force the race: it failed without the fix (`expected '/boards' to be '/calendar'`, the CI error) and passes with it.
    - New unit test in `view/__tests__/useProjectFilterSync.route.spec.ts`; 9 page specs got `onBeforeRouteLeave: vi.fn()` in their `vue-router` mock.
    - Before the fix, 10 runs under CPU load did not reproduce the flake by chance; with the fix the spec passed 10/10 under load. A full smoke in parallel was not possible: the smoke run lock (DEV-586) allows one run per machine.
