- date: 2026-11-19T19:40:26.303597+00:00
  author: claude
  text: |-
    Review: passed. The fix stops the Boards page from cancelling the `g c` move, the new smoke test fails without it, and the spec passes under load.

    - Read: commit `2628f820b` (the only one on `main..HEAD`), the ticket, DEV-355's identical pattern in `view/pages/TasksList.vue:1793`, and the recent `main` commits to the touched files.
    - `view/composables/useFilterBuilder.ts:141-153`: `onBeforeRouteLeave` sets `leaving` and `afterEach` clears it, also after a cancelled move. Query-only pushes on the same page don't trigger the leave guard, so the normal `?project=` sync still works.
    - Reran: `npm ci` passed, `npm run -s lint:agent` passed, `npm run -s test:ui:agent` passed (1563 tests), and `npm run -s test:smoke:agent -- smoke/tests/ui.keyboard-shortcuts.smoke.spec.ts` passed (4/4).
    - Failed before the fix: with `main`'s `useFilterBuilder.ts` the new test fails with `expected '/boards' to be '/calendar'`, the error CI saw. The file was put back afterwards.
    - Under load (6× `yes`), 10 runs in a row: 10/10 passed.
    - Full smoke `npm run -s test:smoke:quick:agent`: 118 files, 406 tests passed.
    - Not run: Rust tests, because nothing on the Rust side changed. No screenshots: the change is routing logic in a composable, with no change to pages, components or styles.
    - No stray files and no second branch. Minor findings: none.
