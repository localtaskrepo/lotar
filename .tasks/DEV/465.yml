- date: 2026-11-13T09:28:34.956070+00:00
  author: claude
  text: 'Done in ca054282. A merge job whose runner fails (crash, T3 Code unreachable) now completes when its branch is on main already (the existing branch_landed check: git cherry patch-equivalent, reworked or recorded landing) and its worktree has no uncommitted changes. So job_completed rules run (Merging -> Done) instead of ''Merge failed: retry with @fix''. The job log says why: ''The t3 runner exited with code 1, but <branch> is in the main checkout''s current branch already: the merge job completed''. Built into finalize_job (src/services/agent_job_service.rs, merged_despite_failure), so the shared automation rules need no change. Tests: tests/dev318_t3_runner_test.rs a_merge_job_that_fails_after_its_branch_reached_main_completes (merge agent cherry-picks the fix onto main, then its run exits 1: job completed, ticket Done, no merge-retried tag; failed before the fix) and a_merge_job_that_fails_before_its_branch_reached_main_fails (still fails and gets the retry tag). Docs: docs/help/agent.md merge-job paragraph. Checks: npm run lint:agent clean, npm test (Rust 2128, UI 1510, release 47, hooks 7 passed), npm run smoke (386 passed). Not covered: update_job_failure (a job that fails before its runner starts) keeps failing; it can''t have merged anything.'
- date: 2026-11-13T09:29:52.611789+00:00
  author: codex
  text: 'Review: blocking. src/services/agent_job_service.rs:3206 calls branch_landed, whose whole-tree comparison at 1995-2018 includes .tasks. Reproduced in an isolated Git repo: cherry-pick a commit with code and .tasks changes, amend only .tasks on main: git cherry reports +, merge-tree conflicts, while diff excluding .tasks is empty. The original incident therefore still fails recovery. Fix by comparing landed work excluding .tasks and add that regression. tests/dev318_t3_runner_test.rs:416 tests an unchanged cherry-pick only. Read ticket/comments, relationships (none), diff, surrounding landing/finalization code, guidance and recent main history of touched files; docs/decisions absent. git diff --check passed. Focused Rust tests and lint failed to start Rust checks because sccache was denied Operation not permitted; preceding frontend lint checks passed. Full tests/smoke not rerun. No files changed or commits; status/assignee unchanged. No minor tickets.'
- date: 2026-11-13T09:54:50.143184+00:00
  author: claude
  text: 'Rework of review finding (branch_landed compares .tasks too): fixed. New merged_landed (src/services/agent_job_service.rs) = branch_landed, or branch_landed_outside: merges the branch into HEAD or a candidate commit since the fork with merge-tree --write-tree (conflict exit 1 accepted) and requires no difference outside the tasks dir (path of tasks_dir relative to the repo root). A branch with no changes outside .tasks doesn''t count as landed. Used by merged_despite_failure and by ensure_branch_merged, which otherwise failed the same job afterwards (found by the new test). Tests in tests/dev318_t3_runner_test.rs: the fix commit now also changes .tasks/notes.txt; new a_merge_job_that_fails_after_its_branch_reached_main_with_amended_tasks_completes (cherry-pick, then amend .tasks/notes.txt on main: git cherry +, merge-tree conflict) fails without the change and passes with it; new a_merge_job_that_fails_with_only_its_tasks_changes_on_main_fails. docs/help/agent.md merge paragraph updated. Amended commit af60ab9c (signed). Checks: npm run lint clean, npm run test:agent (Rust 2130, UI 1510, release 47, hooks 7 passed), npm run smoke (386 passed).'
