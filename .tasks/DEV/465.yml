description: |-
  ## Found
  QIS-180 (quarter-inch-studio, https://qis.pyxzl.net/task/QIS-180): the merge agent rebased the fix, fast-forwarded main and pushed it as 66762e5 (on origin/main). Its job then failed for an infrastructure reason (job-20261113T081737.047Z-10: "Could not reach the T3 Code server at http://127.0.0.1:3773", runner exit 1). The automation treated that as a failed merge: tag merge-retried, back to @fix. The fix retry also failed (job-20261113T084742.566Z-14: T3 server SQLite "database is locked"), then @fix-codex found nothing to do, and the ticket came back to review with agent/QIS-180 still at the pre-rebase commit 527682e, a duplicate of 66762e5. Two agent runs and a review went to work that was already on main.

  ## Check
  After a merge job fails, look whether the ticket's branch commits are already on main (the branch's diff outside .tasks is already in main: git cherry is not enough, because the merge amends .tasks changes into the commit, so here it still showed '+'). If so, the job's work is done and the ticket should take the merged outcome instead of the fix retry.

  ## Done when
  A merge job that fails after its commits reached main does not send the ticket to fix; a test covers it.
