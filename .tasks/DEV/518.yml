description: |-
  ## Why

  What every agent said and did on a task is scattered: comments in one tab, field changes in History, commits in another, and agent threads only on the Agent jobs page, one job at a time and only while the server still holds the job in memory. After a restart the threads vanish from the UI although `@agent-logs/<JOB>.jsonl` still has them. A new agent picking up the task has no way to read what earlier agents said.

  ## Decision (owner, 2026-11-13)

  - Timeline replaces the History tab (changes, comments, commits, agent runs, filterable). Comments and Commits tabs stay.
  - Readable by the owner in the UI and by agents through the CLI and MCP.

  ## Done when

  - [ ] `/api/jobs?ticket_id=` and `/api/jobs/logs` include jobs from the saved job logs, so past jobs and their threads survive a restart (moved tickets still match). The Agent jobs page shows them too.
  - [ ] The task panel's Timeline tab lists changes, comments, commits and agent runs in time order with filter chips; an agent run shows profile, model, status, duration, cost and summary, and expands to its thread (loaded on open, live while running).
  - [ ] `lotar task timeline <ID>` and an MCP tool return the same timeline compactly (summaries, comments, changes), with the full threads on request.
  - [ ] `api_types.rs`, `view/api/types.ts`, `docs/openapi.json` and help docs agree; Playwright smoke covers the tab.

  ## Code

  - `crates/lotar-lib/src/services/agent_log_service.rs`, `agent_job_service.rs`, `routes/jobs.rs`
  - `view/components/task-panel/TaskPanelHistoryTab.vue`, `view/components/AgentJobLog.vue`, `view/components/TaskPanel.vue`
  - `crates/lotar-lib/src/mcp/`, `crates/lotar-lib/src/cli/`

  Not covered: sessions not started by lotar (a T3 Code thread working a ticket by hand) leave only comments and history.
