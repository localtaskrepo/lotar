- date: 2026-11-14T06:31:54.356952+00:00
  author: claude
  text: |-
    Rework of the review's blocker, now commit `6818cb78` on `agent/DEV-518` (amended, signed; main is still `aaa54472`, not merged or pushed).

    **The bug:** for a job the server still held, `/api/jobs/logs` (and so the Timeline's **Show thread**) returned only the last 200 events kept in memory, although the job log had all of them.

    **The fix:**
    - Each log line now stores the event's live `sequence` (`JobLogEntry.sequence`). The saved thread and the SSE stream share one identity, so the Timeline joins them without gaps or duplicates.
    - `job_with_events_in` and `full_thread_in` join the saved log with the events in memory, one per sequence (`merged_thread`, `agent_job_service.rs`). The log has every event since it was opened; memory adds any newer ones and any from before the log opened.
    - A job taken over from a dead process continues numbering after its logged events instead of starting again at 1.
    - Logs from older versions have no sequence; their events count by line, as before.
    - Regression test `a_held_job_past_the_event_cap_returns_its_whole_thread_with_live_sequences`: a held job with 250 events. Without the fix the thread starts at sequence 51; with it, it is complete. Docs (agent.md, api-quick-reference.md, openapi.json) describe the whole-thread behaviour.

    **Checks:** `npm run lint` passes. Tests pass: Rust 2151, UI 1537, release 50, hooks 7. `npm run smoke` passes 401.

    No page, component or style changed in this rework, so the screenshots in the earlier comment still show the current UI.
