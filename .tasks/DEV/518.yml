- date: 2026-11-14T05:51:41.704856+00:00
  author: claude
  text: |-
    Done in commit `0327eb8f` on `agent/DEV-518` (signed, rebased onto main `aaa54472`, not merged or pushed).

    **What changed**
    - **Saved jobs survive a restart.** `GET /api/jobs`, `/api/jobs/get` and `/api/jobs/logs` now also read the job logs in `@agent-logs` (every project's `agent_logs_dir`). A job this server still holds wins over its log. `ticket_id` matches moved tickets as before. `/api/jobs` is now sorted newest first. A logged job with no end is `running` while a live process holds it, otherwise `failed`. Logged events are numbered by their line in the log. The Agents page shows these jobs because it reads the same endpoint.
    - **New `GET /api/tasks/timeline?id=&threads=`** (`TaskTimelineService`). It returns changes, comments, commits of the task file and agent jobs, oldest first, each entry with a `kind`. The `comment_added` change is left out because the comment entry stands for it. `threads=true` adds each job's whole thread, read from its log; this server's memory keeps only the last 200 events.
    - **CLI `lotar task timeline <ID> [--threads]`** prints text or JSON. **MCP tool `task_timeline`** takes `id`, `project` and `threads`.
    - **Web UI:** the History tab is replaced by **Timeline**, which lists entries newest first with chips by kind, changed field and author (`lotar.preferences.taskPanel.timelineFilter`). An agent run shows its status, runner and model, duration, cost and summary, with the profile as the entry's author. **Show thread** loads the thread and follows it over SSE while the job runs. Comments and Commits tabs stay. `TaskPanelHistoryTab.vue` and the panel's `changeLog` code are removed.
    - **Fixed on the way:** `AgentJobLog` overflowed below 640 px, because the message never spanned the row: its rule didn't reach `MarkdownContent`'s root. This also affected the Agents page.
    - **Contracts:** `api_types.rs` (`TaskTimeline`, `TaskTimelineEntry`, and `AgentJobEvent` moved here), `view/api/types.ts`, `docs/openapi.json` and help docs (task.md, agent.md, mcp.md, mcp-tools.md, api-quick-reference.md, serve.md, cli-tour.md) agree. The MCP tool count is now 58.

    **Checks:** `npm run lint` passes. Tests pass: Rust 2150, UI 1537, release 50, hooks 7. `npm run smoke` passes 401, including the new `ui.task-timeline.smoke.spec.ts` (a saved job after a "restart": API, tab, filter chips, thread on demand) and the updated `ui.activity-filter.smoke.spec.ts`. New tests also cover the saved-job reader, the MCP tool (compact and with threads), the CLI text and the Timeline component (filters, live thread). On the real DEV backlog (501 logs), `lotar task timeline DEV-503` takes 0.19 s.

    **Screenshots** (ui-review). Before is the v0.15.0 History tab, after is Timeline; light and dark at 1920, 1440 and 390 px, with invented example data:
    - before: [light 1920](attachment:DEV-518-before-light-1920.a1ccebf5e48ea0821275dee892eec32e.png), [light 1440](attachment:DEV-518-before-light-1440.41a50c326266ca4a0fb3eaa115afa971.png), [light 390](attachment:DEV-518-before-light-390.c0c2f01439f61de9227e378dcbff72fe.png), [dark 1920](attachment:DEV-518-before-dark-1920.2ae320535a8bf95fa9eac0b87805b605.png), [dark 1440](attachment:DEV-518-before-dark-1440.7d671b310bb0b52c66922587e9199bf2.png), [dark 390](attachment:DEV-518-before-dark-390.7befccf34dae605c300be2b2cd6f96c9.png)
    - after: [light 1920](attachment:DEV-518-after-light-1920.1698d219860404ee0650053bfaa07f18.png), [light 1440](attachment:DEV-518-after-light-1440.cb0c5f92ad399ef8c5bd6177a7d7f076.png), [light 390](attachment:DEV-518-after-light-390.900267d4cb7c609f3bfd0f06d7e9672c.png), [dark 1920](attachment:DEV-518-after-dark-1920.f8bad565945611f1079a429b588170e3.png), [dark 1440](attachment:DEV-518-after-dark-1440.034876bc9a1177d40e987cafaae784f6.png), [dark 390](attachment:DEV-518-after-dark-390.1b36f1fd97975cfbf23536d1126a29b0.png)

    **Limits:** with every saved job listed, the Agents page loads up to about 500 jobs and fetches each of their tickets once. That is fine locally; a cap or pagination could be a follow-up. The live thread in the Timeline was checked by unit test and not against a real running agent. Guidance: no durable finding.
