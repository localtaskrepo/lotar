description: 'Found 2026-11-13 in ~/Development/standards (lotar 0.14.1): .tasks/INBOX/config.yml, committed in 5ff623f (STD-54) with three comment lines, was rewritten while the inbox was in use: members [claude, mallox] added (auto.populate_members), project.name changed from inbox to INBOX, and every comment line gone (git -C ~/Development/standards diff .tasks/INBOX/config.yml). The comments explained why the project''s tickets aren''t tracked and why triage has no worktree. Check: in a scratch repo, a project config.yml with a comment line and auto.populate_members on; lotar comment or add as a new user; the comment line is still there. Done: an automatic write to a config file keeps its comments and doesn''t change values nobody asked to change (project.name), with a test; or members live somewhere that doesn''t rewrite a hand-written file.'
