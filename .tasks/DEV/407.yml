comments:
- date: 2026-11-13T03:01:08.871423+00:00
  author: claude
  text: 'Fixed in 42ad6711 on agent/DEV-407. Reproduced first with 0.14.1: lotar add as a new reporter dropped every comment line and turned project.name inbox into INBOX. Cause: automatic writes (auto-populated members, the detected project name) re-serialized the whole config as canonical YAML, and the name rule overwrote a name that matched the prefix in other case. Change: new normalization::to_project_yaml_preserving patches only the members block and project.name line of the existing file, and checks the result parses to exactly the intended config (else canonical YAML, as before); TaskService uses it for add and edit; the name rule leaves a case-only match alone. Removed the unused operations::auto_populate_project_members. Test: tests/dev407_auto_config_comments_test.rs (fails before, passes after). Ticket check in a scratch repo with the new build: add, comment, edit --assignee, add as new users -> comments and name: inbox kept, members appended. Checks: npm run lint:agent, npm run test:agent (2117 Rust + 1507 UI tests), npm run smoke (385) all pass. Note: lotar comment does not add its author to members, which matches current behavior.'
- date: 2026-11-13T03:06:51.902576+00:00
  author: claude
  text: 'Merged and pushed. Rebased agent/DEV-407 onto main (de36a7e1), no conflicts; fix is e2f502be. Checks in the worktree after the rebase: npm run lint:agent, npm run test:agent (2119 Rust + 1507 UI tests), npm run smoke (385) all pass. Fast-forwarded main to e2f502be, committed ticket files as b6b90f34 (DEV-407 Ticket updates), pushed de36a7e1..b6b90f34 to origin/main; the only unpushed commits were these two. Ticket check rerun with a build of the main checkout: in a scratch repo, add and comment as new users kept both comment lines and name: inbox, and appended members.'
references:
