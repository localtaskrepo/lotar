  text: |-
    Merged: `8f698d2e9` is on `main`. LoTaR landed it when my job paused, before my smoke rerun finished.

    - Main had moved on, but only in `.tasks` and screenshots. I rebased onto `19ea22bdb` with no conflicts, and the old DEV-756 commit dropped out as already upstream.
    - Smoke never passed on this branch. lotar's own run failed 6 of 406 at load ~40, starting in `tests/harness.agent-launcher.smoke.spec.ts:89` (`fixture child did not exit within …`). My rerun died with the worktree.
