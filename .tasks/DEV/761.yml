- date: 2026-11-21T20:43:23.208293+00:00
  author: claude
  text: |-
    Fixed: the pipeline test now waits for each of its four jobs separately, so a load spike can't add up past one 60 s bound.

    - Cause: one `wait_for("the merged ticket")` covered fix, review, rework and merge, four jobs run one after another. It takes 1.7 s alone and about 10 to 14 s at load 70 to 150.
    - `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: it waits for each step's prompt in its fake agent's log (a count that only grows, so a status the poll misses can't fail it), then for Done. A stall names its step, e.g. `timed out waiting for the review`. The assertions are unchanged.
    - 20 loaded runs: 4 rounds of 5 concurrent dev503 groups next to 30 `yes` processes, load 131 to 149. All passed.
    - Side note: the ticket's repro command, `-p lotar-lib`, runs a stale `lotar` binary. With it, `a_failed_jobs_thread_is_settled_once_a_later_job_completes` failed every time (yesterday's build, before DEV-747). A workspace run passes it. `testing-strategy` already warns about this, so no guidance change.
  report:
    commits:
