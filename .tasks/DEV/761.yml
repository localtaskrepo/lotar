description: |-
  Found in the review of DEV-754, on the unchanged dev503 test.

  - `cargo nextest run -p lotar-lib --test integration -E 'test(/dev503/)'` at load average about 40: this test failed with `timed out waiting for the merged ticket` (`dev503_harness_jobs_test.rs:158`, 64 s); a rerun passed all 47.
  - The same timeout failed the DEV-747 merge check (`npm run -s test:agent`), and DEV-625 saw it too.

  Done when:
  - [ ] The test passes at a load average of 40, or its wait is bounded so that a load spike can't fail it.
  - [ ] Each of the pipeline's steps (fix, review, rework, merge, then the ticket Done) gets its own wait with the file's 60 s bound, on something that only grows: the step's prompt in its fake agent's log. A transient status the poll misses can't fail it.
  - [ ] A step that stalls fails with a message that names it, such as `timed out waiting for the review`.
  - [ ] The assertions after the wait are unchanged.
  - [ ] 20 runs under load pass: the dev503 group run alongside CPU stress at load average 40 or more.
  - [ ] `npm run lint`, `npm test` and `npm run smoke` pass.
