description: |-
  Found in the DEV-859 review. A search opens the matching tool call and shows its whole output, but the log list scrolls internally. With a long output, for example 20 lines followed by 'npm notice' at 1440 px, the highlighted word sits below the visible part of the log, and the user has to scroll to find it.

  Chosen of the two options: scroll to the first match (no Next/Previous buttons).

  ## Done when
  - [ ] Typing or changing the search, or switching the view (All, Conversation, Problems, Thinking) while a search is on, scrolls the log list so the first visible match (document order) shows, about a third from the list's top (or as far as the list scrolls). A match already in view leaves the list where it is.
  - [ ] Only the log list scrolls; the page doesn't move. With "Full height" the list doesn't scroll itself, so nothing moves.
  - [ ] New entries arriving while a search is on don't move the list back to the match; "Jump to latest" and following the end work as before once the reader is at the bottom.
  - [ ] No match, a cleared search, or a browser without layout (match has no box, e.g. inside a folded setup group): the list stays where it is.
  - [ ] A Vitest and a smoke test cover it (smoke: 40 lines then 'npm notice' at 1440 px, the highlight inside the list's visible area).
