  text: |-
    Done: a search now scrolls the job log to the first match.

    - Chose "scroll to first match" of the ticket's two options; "Done when" spells out the cases.
    - `view/components/AgentJobLog.vue`: after the highlight, `scrollToMatch` puts the first match with a box a third from the list's top, unless it's in view already. Runs on typing the search or switching the view while one is on; new entries, clearing the search and "Full height" don't move anything; the page itself never scrolls.
    - `view/__tests__/AgentJobLog.spec.ts`: new Vitest (jsdom layout stubbed): scrolls, stays when in view, stays on new entries and on clearing.
    - `smoke/tests/ui.agent-jobs.smoke.spec.ts`: new smoke test at 1440 px, 40 lines then `npm notice`: highlight inside the list's visible part.
    - Screenshots attached to the ticket: `dev880-before-*` and `dev880-after-*`, light and dark at 1920, 1440, 390 px. Before: match hidden below the list; after: in view.
    - No other T3 threads were running in the project; no guidance correction.
