description: |-
  Found in the DEV-602 review.

  ## Found
  - `unlanded_ticket_branch` in `crates/lotar-lib/src/services/agent_job_service.rs` (on `agent/DEV-602`, not yet on main) counts every branch whose *name* a saved job of the ticket logged (`.tasks/@agent-logs`), with no check that the branch is still the one the job worked on.
  - Done cleanup deletes `t3/<topic>` branches, and T3 Code can give the freed name to another ticket's thread. When the first ticket is reopened, `follow_ticket_work` can point `agent/<ID>` at the other ticket's work (when `agent/<ID>` has none of its own). And `ensure_branch_merged` can then fail a good merge, naming that branch.
  - Builds on DEV-602 (owner 2026-11-15, options picker: "Wait for DEV-602"): start only once DEV-602 is on main.

  ## Done when
  - [ ] A branch counted only because a saved job logged its name counts only while its tip descends from a `ticket_commit` a job of the ticket logged, or one of its commits missing from the main checkout's branch has a subject that starts with the ticket ID (`DEV-612` followed by a non-alphanumeric character or the end, so `DEV-6120` doesn't match). Otherwise it is skipped. A job that logged no `ticket_commit` relies on the subject check alone.
  - [ ] `agent/<ID>` itself and branches traced to it (`BranchOwners`) count as before: the check covers logged names only.
  - [ ] Both callers get it: `follow_ticket_work` leaves `agent/<ID>` where it is, and `ensure_branch_merged` doesn't fail a merge naming the skipped branch.
  - [ ] A step fails: a git call that can't answer (missing ref, git error) skips the branch, as an unknown owner.
  - [ ] A test: a logged `t3/x`, deleted and recreated with another ticket's commit, leaves `agent/<ID>` where it is, and the merge passes.
tags:
- fix-retried
