description: |-
  Found in the DEV-602 review.

  ## Found
  - `unlanded_ticket_branch` in `crates/lotar-lib/src/services/agent_job_service.rs` counts every branch whose *name* a saved job of the ticket logged (`.tasks/@agent-logs`), with no check that the branch is still the one the job worked on.
  - Done cleanup deletes `t3/<topic>` branches, and T3 Code can give the freed name to another ticket's thread. When the first ticket is reopened, `follow_ticket_work` can point `agent/<ID>` at the other ticket's work (when `agent/<ID>` has none of its own). And `ensure_branch_merged` can then fail a good merge, naming that branch.

  ## Done when
  - [ ] A logged branch counts only while it still descends from the commit the job logged, or holds a commit whose subject starts with the ticket ID. Otherwise it is skipped.
  - [ ] A test: a logged `t3/x`, deleted and recreated with another ticket's commit, leaves `agent/<ID>` where it is, and the merge passes.
