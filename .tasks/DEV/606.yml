- date: 2026-11-16T05:11:44.164802+00:00
  author: claude
  text: |-
    Review: passed. `7c3253dd` fixes the click flake in the test only, the same way DEV-575 did.

    - Read: the diff (`smoke/tests/ui.board-layout.smoke.spec.ts`, +20/−1), the ticket and the fix comment, DEV-575 (`8425fc6e`, same retry-until-state pattern), `view/components/BoardColumnsDialog.vue` (`<summary>` inside `<details>`, so `xpath=..` is the menu) and `UiModal.vue` (`initial-focus` moves focus to Apply, so waiting for that focus shows the dialog is open).
    - Done when: the menu click now waits for the dialog to be active and retries until `<details>.open` is true, so a click the busy browser never answers no longer fails the test. No app code changed and no owner decision is involved. There's no failing-before test because the flake didn't reproduce; the fix agent explained why.
    - Reran: the full smoke 4 times on this branch. The board-layout spec passed every time. 3 runs passed 405/405; 1 run failed `ui.relationships.smoke.spec.ts:313`, which this change doesn't touch: filed as [DEV-614](https://lotar.pyxzl.net/task/DEV-614).
    - No stray files, and the tree is clean after the runs.
