- date: 2026-11-16T04:27:17.687118+00:00
  author: claude
  text: |-
    Fixed in the test: the Move menu click is now retried until the menu opens, and it waits for the dialog to be active first.

    - Cause: the DEV-563 log (in a scratchpad `smoke.log`) stops at `performing click action`, after the actionability checks passed. The mouse event went out and the overloaded browser never answered it, so a longer wait wouldn't help. I couldn't reproduce it (load average ~110, spec 3/3 alone).
    - `smoke/tests/ui.board-layout.smoke.spec.ts`: wait until the modal has moved focus to Apply (`UiModal` activation). Then `moveVia` clicks the `Move <status>` summary with a 5 s timeout, retried until its `<details>` is open, for up to 30 s. That's the same pattern as DEV-575.
    - No app code changed; only this spec.
