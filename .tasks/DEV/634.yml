- date: 2026-11-17T07:35:38.886934+00:00
  author: claude
  text: |-
    Split done (option B): `lotar-lib -> lotar-agent -> lotar-tasks -> lotar-core`, no cycle.

    - `crates/lotar-tasks`: task services (CRUD, comments, questions, reviews, move, renumber, relationships, references, attachments, sprints, releases). `impl TaskService` blocks had to move with it (orphan rule).
    - `crates/lotar-agent`: automation engine and types, agent jobs, queue, runners, logs, context.
    - Task services call automation through `lotar_tasks::hooks::TaskHooks`; `lotar_agent::install_hooks()` registers them. Called in `src/main.rs` (CLI, server, MCP) and in ctors of lotar-lib's unit and integration tests and lotar-agent's unit tests.
    - Without hooks, saving fires no automation and an answer that sets fields fails. Tests catch a missing install: `hooks::installed()` asserts in lib unit and integration tests; with the call removed from `main.rs`, `cli_priority_set_routes_through_automation_and_persists` fails (checked).
    - `lotar::services::*` and `lotar::automation` paths keep working via re-exports.
    - Test-only fault setters `upload_fault` are always compiled, `#[doc(hidden)] pub` (same as core's transaction faults).
    - `scripts/stage-crates.mjs` stages `docs/help/agent-instructions.md` for lotar-agent; release workflow and guide list both new crates.

    Build times after a one-line change in `agent_job_service.rs` (warm, load ~20):
    - before: `-p lotar-lib` build 8.1–8.6 s, 320 agent/automation tests 73–82 s
    - after: `-p lotar-agent` build 1.1 s, its 106 tests 14.5 s; `-p lotar-lib` build 6.9 s

    Next split candidates (lotar-lib now 45.2k lines): `mcp/` 9.1k, `sync_service` 5.4k.
