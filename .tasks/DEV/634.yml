- date: 2026-11-17T07:47:24.480043+00:00
  author: claude
  text: |-
    Split done as the owner chose ("B"): lotar-lib -> lotar-agent -> lotar-tasks -> lotar-core, no cycle (`cargo tree -p lotar-lib`).

    - Took over the previous job's uncommitted work from `agent-DEV-634-e93fcb025e5f17d0`, whose turn ended while `npm test` was still running. Its worktree is left as it was.
    - `crates/lotar-tasks`: the task services. They reach automation and agent jobs only through `lotar_tasks::hooks` (8 hooks). Without hooks, tasks still save, but no automation runs; an answer whose option sets fields fails loudly instead.
    - `crates/lotar-agent`: agent jobs, queue, runner and automation. `lotar::install_hooks()` runs first thing in `main()`, which covers the CLI, `lotar serve` and `lotar mcp`. Guard tests fail when the hooks aren't installed, and without the line in `main()` the CLI automation test fails too.
    - Also in this job: moved 6 service-only automation test files (29 tests) to `crates/lotar-agent/tests`. Tests that run the binary or REST stay in `crates/lotar-lib/tests`, as testing-strategy now says.
    - Restored this ticket's description: the previous job had overwritten it with "-". It now has your "B" decision and an updated "Done when".
    - Before -> after, one-line change in `agent_job_service.rs`: rebuild 8.1–8.6 s -> 1.1 s (lotar-agent) / 6.9 s (lotar-lib). Agent tests 73–82 s -> 14 s via `-p lotar-agent`. `target/debug` 3.7 GB -> 3.5 GB.
    - Next split candidates (not done here): MCP 9.1k and sync 5.4k of lotar-lib's 45.2k lines. lotar-agent is 16.7k lines, lotar-tasks 13.4k.
