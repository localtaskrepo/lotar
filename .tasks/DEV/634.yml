description: |-
  Owner, 2026-11-17, on DEV-579 choosing option A: "Okay, A sounds good." Continues DEV-499's workspace split; STD-131: keep projects small and focused.

  Owner, 2026-11-17, on where the task services go (they and automation call each other): "B" — task services get their own crate `lotar-tasks`; their calls back into automation and agent jobs go through a hook lotar-agent installs at startup.

  ## Why
  - `lotar-lib` src is ~72k lines; agent jobs, runner, queue and automation are ~13.4k and get most of this month's changes, yet every change rebuilds all of lotar-lib and links the 59k-line integration test binary (DEV-579 measurements).

  ## What
  - New crate `crates/lotar-agent`: `services/agent_*`, `services/automation*`, `agent_runner`, with their own tests.
  - New crate `crates/lotar-tasks`: the task services agent code calls (task, list, query, sprints, releases, relationships, references, attachments, ...).
  - lotar-lib depends on lotar-agent; nothing in lotar-agent or lotar-tasks calls up into cli, routes or mcp (as DEV-498 did for core).

  ## Done when
  - [ ] `crates/lotar-agent` holds agent jobs, queue, runner and automation; `crates/lotar-tasks` the task services; `cargo tree` shows lotar-lib -> lotar-agent -> lotar-tasks -> lotar-core, no cycle.
  - [ ] The task services call automation and agent jobs only through `lotar_tasks::hooks`; the CLI binary, `lotar serve` and MCP install the hooks, and a test fails when an entry point doesn't (without hooks automation would silently not run).
  - [ ] The agent and automation tests live in the new crate and run with `cargo nextest run -p lotar-agent --cargo-profile dev`; testing-strategy says so.
  - [ ] Measured, before and after: build and test time and `target/debug` size for a one-line change in `agent_job_service.rs`.
  - [ ] No behaviour change: `npm run lint`, `npm test`, `npm run smoke` pass; REST and CLI output unchanged.
  - [ ] MCP and sync as next candidates: noted in a comment with their size, not done here.
