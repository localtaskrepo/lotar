  text: 'Decision (developer, 2026-10-21): full preview parity. Plan: simulate uses SetPlan with a preview template expander (ticket.* expanded; event-only previous./comment./agent. placeholders left literal with a warning), resolves @me/@reporter/@assignee/@assignee_or_reporter/@least_busy like apply, leaves @round_robin/@random raw with a ''chosen when the rule runs'' warning (round robin advances a shared counter), applies due date/effort (canonical)/custom fields/labels alias and apply''s case-insensitive tag add/remove, lists sprint changes, comments and runs without applying them. Additive ''warnings'' array on simulate responses (CLI JSON/text, REST, api_types, TS, OpenAPI, docs, Automation UI).'
