    Outcome (step 2): simulate now has full apply parity. PreviewContext expands templates from the ticket (TemplateContext::expand_preview keeps event-only previous./comment./agent. placeholders literal and reports them); simulate_action applies every SetPlan field (due date, canonical effort, custom fields, tags over labels), resolves assignee/reporter like apply except @round_robin/@random (token kept + warning; round robin would advance the shared rotation), uses apply's case-insensitive tag add/remove and relationship actions, and warns that sprint changes are listed but not reflected. describe_action covers set_title/description/due_date/effort/tags/custom_field with expanded values; add/remove tags include labels; comment/run descriptions are preview-expanded. Additive 'warnings' array on SimulateResult, REST data, CLI JSON and text output, api_types, view/api/types.ts, OpenAPI schema/examples, api-quick-reference and automation help; Automation simulator UI lists warnings and shows due/effort chips.
