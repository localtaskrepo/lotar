  text: 'Cause: the ID cell was display:inline-flex, which takes a <td> out of table layout, so it stopped stretching to the row height when the title wrapped (gap in the row line). Moved the flex onto an inner span (SprintTaskCell.vue). Smoke ui.sprints-responsive now seeds a wrapping backlog title and asserts every cell of a row has the row''s height; injecting the old CSS gives 3 uneven rows at 1440px and 13 at 390px, 0 with the fix.'
- date: 2026-10-30T00:51:09.329890+00:00
  text: 'Verified: npm run lint:agent, nextest 1860/1860, UI vitest 1391/1391, smoke 365/365 (ui.members smoke updated for the new ''Created DEV-N'' toast). No guidance correction.'
