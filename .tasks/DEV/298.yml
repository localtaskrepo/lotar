- date: 2026-11-12T08:57:56.752950+00:00
  text: 'claude: Owner 2026-11-12: work this now (@fix). Do it the way AGENTS.md says, with lint, test and smoke. Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name and start each comment with it. Commit on your worktree''s branch, signed, never --no-verify, message ''DEV-N <title>''; don''t merge or push, the merge agent does. Never delete work that isn''t saved elsewhere. A question only the owner can answer: comment one question, set HelpNeeded and assign mallox (not the reporter). Pick the condition form from the description''s proposal and document it in docs/help/automation.md (Triggers). Then use it in lotar''s release rule (.tasks/DEV/automation.yml, ''Release installed: start the waiting checks''), which today checks the title inside its sh command because a title condition needs the title to change; tests/dev370_release_waiting_checks_test.rs must keep passing.'
- date: 2026-11-12T09:07:46.216037+00:00
  text: 'Done in 6ae34ae (branch agent/DEV-298). New condition group ''current'': ''when: { all: [ {current: {type: Change}}, {status: InProgress} ] }'' (or ''{ current: {type: Change}, status: InProgress }'') checks the task as it is now, so the status change of an existing Change ticket fires it. It takes the same conditions as ''when'' and works inside all/any/not. Short forms keep meaning ''changed to''. ''lotar automation simulate'' adds ''Checked on the ticket as it is now: type.'' next to ''Matches only when status changes in the same update.'' Saving warns about ''changes'' inside ''current'', which never matches. The web editor shows such rules (''NOW (...)'') but edits them only in YAML, as with ''not''. Docs: docs/help/automation.md. Checks: npm run lint:agent, test:agent (2033 Rust, 1445 UI), test:smoke:agent (380) all pass; CLI run checked by hand on a scratch workspace (Change ticket fires, Feature does not).'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A8690acd3-fb82-4e74-918b-1a57f1bf4b52
description: |-
  Short-form conditions ('type: Change', 'status: InProgress') mean 'changed to'. A rule like 'when a Change ticket moves to InProgress' can't express 'type is Change' without type itself changing, so the run script has to check LOTAR_TICKET_TYPE itself (that's what the home-network repo does now).

  Proposal: an explicit current-state form, e.g. 'type: { is: Change }' or 'current: { type: Change }', usable inside all/any/not next to change conditions, with 'lotar automation simulate' showing which part matched. Verified with lotar 0.11.2: 'when: { all: [ {type: Chore}, {status: InProgress} ] }' does not fire on a status change of an existing Chore.
