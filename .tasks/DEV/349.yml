description: 'Found (DEV-346, 2026-11-11): running_job_for_ticket (src/cli/handlers/agent.rs, list_wrapper_processes) counts every lotar-agent-wrapper process on the machine. While another worktree''s suite runs a wrapper for its TEST-1 or OUTC-1, these tests fail with "has an active agent job (pid N)": dev279_cross_process_jobs_test::jobs_in_another_process_are_seen_guarded_and_cancelled, task_noop_update_test::cli_configured_reviewer_can_resolve_an_agent_reported_review, dev320_job_outcome_test::status_and_assignee_set_during_a_job_win_over_the_job_completed_rule. Failed on both the ci and local profiles in the same runs. Check: run npm run test:rust:agent in two worktrees at once. Done when wrapper processes from another tasks dir are not counted (e.g. match the wrapper''s tasks dir) and the three tests pass while another suite runs.'
