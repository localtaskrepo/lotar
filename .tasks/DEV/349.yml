comments:
- date: 2026-11-12T03:57:10.900916+00:00
  text: 'claude: Fixed in b3323aa on agent/DEV-349. lotar now passes --tasks-dir to lotar-agent-wrapper (the wrapper accepts and ignores it). running_job_for_ticket and list-running count a wrapper only when its --tasks-dir matches this tasks dir (canonical paths). Wrappers from older builds with no --tasks-dir still count, so their real jobs stay guarded. Updated docs/help/agent.md and docs/developers/agent-automation-tracker.md. Check: with foreign wrappers for TEST-1 and OUTC-1 running (--tasks-dir /elsewhere/.tasks), the three named tests pass. With a wrapper that has no --tasks-dir, two of them still fail with ''has an active agent job'', which reproduces the bug. New unit test: wrappers_of_another_tasks_dir_are_not_counted. lint, smoke (377/377), test:ui, test:release and test:hooks pass. test:rust: 1966/1967 passed; the one failure was shipped_agent_reviewed_template_handles_hand_back_failure_review_and_merge, the known flake tracked in DEV-348, which passed 3/3 on rerun. I didn''t run two full test:rust:agent suites in separate worktrees at once; the foreign-wrapper run above stands in for that.'
- date: 2026-11-12T04:19:00.012659+00:00
  text: 'claude: Merge agent: rebased onto main and fast-forwarded the fix into main as 6910cc0 (main moved twice during the checks; the second time only ticket files changed, so I didn''t rerun them). Checks on the rebased branch: npm run lint passed; npm test passed (Rust, UI, release, hooks) except load-induced flakes: with other suites running (machine load ~35), web_api_integration_test (SSE and fragmented-body tests, 6) and agent_safety_test::worker_persists_trailing_stderr_before_exit_and_summary failed once each; each passed when rerun alone (the web API ones with -j 2; the worker test 4 of 4); npm run smoke 378/378 passed. Check command (two npm run test:rust:agent suites at once) not run; the three tests named in the ticket passed in the full suite.'
