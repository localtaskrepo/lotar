- date: 2026-11-26T21:02:37.265751+00:00
  author: claude
  text: |-
    Fixed the Rust flakes; the smoke flake didn't reproduce, so its failure now reports the cause.

    - **Temp-folder leak** (comments 1–10): a queue worker started by a test's `lotar` call ran on after the test and recreated `.tmpX/.tasks` from `--tasks-dir`. Test processes now start with `LOTAR_AGENT_QUEUE_DISABLE_WORKER=1` (`crates/lotar-lib/tests/common/mod.rs`). The tests that need a worker opt in: `agent_safety` worker tests, `dev361`, `cli_agent_check` (it now also waits for its worker to end) and the `dev503` continued-merge test
    - **`dev605_merge_without_agent_test`** (comment 12): test processes now start with `LOTAR_CHECK_LOCK_HELD=1`, also under a plain `cargo nextest run`, so merges never wait on another worktree's lock. This also fixes `dev503 a_continued_merge_without_a_session_of_its_own_takes_the_reviews_thread`, which timed out at 60 s on HEAD
    - New tests for both defaults failed before the fix: `the_tests_never_wait_for_the_machines_check_lock`, `the_tests_start_no_queue_worker_unless_they_ask_for_one`
    - **Smoke 'Instructions button'** (comment 11): passed every run here. Its failure now names the cause: no record, panel closed again, or the log re-mounted
    - No test joined the `wall-clock` group. `dev61_reference_kinds_test` also fails on HEAD; that is DEV-906
    - `crates/lotar-lib/tests/README.md` documents the two defaults and how to opt in
