description: |-
  The repo's flaky list (owner 2026-11-22, "No ticket per flaky test", standards STD-299): a test that fails under machine load and passes when run alone is reported here as a comment (`lotar add "Flaky tests" --finding flaky:tests --tag flaky -D "<test>: <how it failed>, passes alone; <ticket or job>"`), not as a ticket of its own. A test that also fails alone is a bug with its own ticket.

  Fixed in one batch once DEV-797 (full suites once, one at a time) is done: this ticket waits for it, and its fix agent starts then. The fix follows AGENTS.md's testing rules (the wall-clock test group of DEV-785, where it applies).

  Open tickets of this kind when the list started (2026-11-22), left to finish because a job holds each: DEV-779, DEV-785, DEV-787, DEV-788, DEV-792. DEV-799 (fails on the GitHub runner, not under local load) stays a bug.

  ## Done when

  - Every test reported in the comments passes in the full suites under load (DEV-797's lock in place), or is fixed as a bug, each named in the outcome.
