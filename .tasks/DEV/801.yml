- date: 2026-11-27T00:40:36.850113+00:00
  author: claude
  text: |-
    Review: blocking. Half of the fix is already on main: DEV-890 sets `LOTAR_CHECK_LOCK_HELD=1` for the tests.

    Read: the ticket and its 15 comments, DEV-840 and DEV-890 (both Done on main), the diff of `925bc14df`, and the commits to the touched files on main since the branch's base `6d77a20df`. Reran everything on a copy rebased onto main `5f7f70b65`, which applies cleanly.

    **Blocking**
    - `crates/lotar-lib/tests/common/mod.rs:64-71`: the new `LOTAR_CHECK_LOCK_HELD=1` block duplicates main's `d1061401e` (DEV-890). That commit sets the variable in `reset_lotar_test_environment()`, which `init_lotar_test_environment` already calls on line 63. After the rebase the test process sets the variable twice.
    - So the claim in comment 14 no longer holds: `the_tests_never_wait_for_the_machines_check_lock` (`dev797_one_merge_checks_at_a_time_test.rs:291`) fails only on the old base. On main it passes without this change. The `dev503` continued-merge timeout was also fixed on main by DEV-890.
    - Fix: rebase onto main and drop the duplicate block. Keep the test as a guard of DEV-890's default, with its comment naming DEV-890. Make the README line (`crates/lotar-lib/tests/README.md:13`) say the lock default comes from `reset_lotar_test_environment`. In the outcome, credit comment 12's `dev605` fix to DEV-890.

    **Holds**
    - Queue-worker default (`LOTAR_AGENT_QUEUE_DISABLE_WORKER=1`, comments 1–10): adds to DEV-840's fix (`a18d5ff8e`, read-only queue calls) rather than repeating it. DEV-840 does not cover a late worker recreating `.tasks` from `--tasks-dir`. The worker tests added on main (`dev732`, `dev733`, `dev584`, `dev592`, `dev604`, `dev630`, `dev837`) already opt in with `env_remove`.
    - Smoke 'Instructions button' (comment 11): only gets a better error message. The test didn't reproduce for me either, so the merge's full smoke run checks "Done when" for it, as the fix agent's next step says.

    **Reran on the rebased copy**
    - `node scripts/rust-test-runner.mjs --cargo-profile dev -p lotar-lib --test integration -E <dev503, dev660, dev797, cli_agent_check, agent_safety, dev361, dev605, dev732, dev733, dev786, dev860, dev592, dev584, dev604, dev630, dev623, dev837, agent_automation_integration>`: 225/225 passed at load ~12, temp guard clean
    - `npm run -s lint`: passed
    - `npm run -s test:smoke:quick:agent -- smoke/tests/ui.agent-jobs.smoke.spec.ts`: 16/16 passed
    - `npm ci`: ran in both checkouts
    - Not run: `test:agent` and the full smoke suite (the merge runs them). No UI review: the diff changes no pages.

    Tickets filed: none.
