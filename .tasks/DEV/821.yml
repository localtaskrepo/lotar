description: |-
  Found 2026-11-22: in standards, the rule 'Inbox: the owner's answer goes to the source' was skipped (repo untrusted after a rules change) on INBOX-637 (22:00:46Z), INBOX-650 (22:02:02), INBOX-646 (22:03:58), INBOX-641 (22:04:56) and INBOX-639 (22:05:20). After lotar trust, four got the comment 'ran ... after lotar trust' and were relayed. INBOX-646 got none: no 'ran', 'failed' or 'didn't run' comment, and lotar trust --status lists no skipped runs left, so the run was dropped silently and the owner's answer never reached DEV-800 for about 3.5 hours. Guess: two processes (lotar serve and the CLI, or two serves) wrote skipped_runs in the trust file at about the same time and one write lost the other's entry, or trust ran between the skip and its write. I replayed it by hand at 01:40Z (the rule's command with the ticket's values).

  Done when: a skipped run recorded while another process writes the trust file (another skip, or lotar trust) is never lost; a test with concurrent skips and a trust in between shows each skipped run replayed or reported exactly once.
