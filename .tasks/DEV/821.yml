comments:
- date: 2026-11-23T05:48:29.430406+00:00
  author: claude
  text: |-
    Fixed: concurrent writes to the trust file no longer lose skipped runs.

    - Cause: `update_trust_file` in `crates/lotar-core/src/config/trust.rs` read, changed and wrote the trust file without a lock. A serve and a CLI recording skips at the same time overwrote each other's `skipped_runs`, which is how INBOX-646's run was lost.
    - Fix: it now holds an exclusive lock file next to the trust file (`acquire_storage_lock_within`, 10 s wait) for the whole read-modify-write.
    - Second gap: a skip recorded just after `lotar trust` took the runs stayed in the file until the next trust. After recording a skip, automation now replays it if the workspace is trusted by then (`crates/lotar-agent/src/services/automation_service.rs`). The take runs under the lock, so each run is replayed only once.
    - Test `concurrent_skips_and_a_trust_lose_no_skipped_run`: 8 threads record 80 skips while trust and take run 5 times. Every run is taken exactly once. With the lock removed, it loses runs and takes some twice.
    - No test covers the second gap: there is no way to time the trust deterministically between the check and the record.
    - Docs: `docs/help/trust.md`, Skipped runs section.
  report:
    commits:
    - hash: d853d6afa
      what: lock the trust file's read-modify-write; replay a skip recorded after lotar trust took the runs
