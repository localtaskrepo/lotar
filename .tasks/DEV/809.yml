- date: 2026-11-23T07:19:33.468028+00:00
  author: claude
  text: |-
    Review: passed. `e86f6b995` does what "Done when" asks; one minor follow-up filed as [DEV-828](https://lotar.pyxzl.net/task/DEV-828).

    - **Read:** the full diff against `main` (41 files), the ticket and the fix comment, DEV-810, AGENTS.md. Also the callers in other repos: `standards/scripts/repos.ts` (`shown`/`openAsked`) and `staff/src/lotar.rs` both read `lotar --format json show`, which now leaves deleted comments out, so a withdrawn question drops out of the inbox mirror and staff. No other repo parses the text listing, so the new `#N` prefix breaks nothing.
    - **Storage and questions:** `deleted_at` is optional (old files load as before). History records `comment#N.deleted_at` in both directions, and a repeated delete or restore changes nothing. Edit refuses a deleted comment, and a trashed task is refused (`ensure_not_deleted`). `open_questions`, `find_question` and `has:question` skip deleted questions and deleted answers; an answer's fields aren't reverted.
    - **Other views:** comment counts, search, stats, timeline, the template's `ticket.comments`, agent prompts, merge checks and the UI helpers (`openQuestions`, `answerTo`, `latestReview`) all filter deleted comments.
    - **Contracts:** `api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, `mcp-tools.md` and `comment.md` agree. The openapi entries have no request body, the same as the existing `comment/update`.
    - **Reran:** `npm ci`, `npm run -s lint:agent` passed. `npm run -s test:agent`: 2474/2474 Rust tests passed, but the run exited 1 on a leftover temp entry `.tmpZyw5k2`. That is the known flake on DEV-801: the branch's own tests (`npm run -s test:rust -- dev809`) leave nothing behind. `npm run -s test:ui:agent`: 1571 passed. `npm run smoke`: 408 passed.
    - **Manual CLI:** in a scratch workspace, delete, `--deleted`, the restore-first refusal, and the no-match errors for `#0` and an unknown date all behave as the ticket says.
    - **UI:** read the fix agent's before and after screenshots. Took my own at 1920, 1440 and 390 px in light and dark mode, with an open question, an answered question and one deleted comment. Delete, Withdraw, the answer's Delete, the "Hide 1 deleted" toggle and the dashed, greyed deleted comment with Restore read fine, with no layout problem.
    - **Minor, filed [DEV-828](https://lotar.pyxzl.net/task/DEV-828):** the JSON lists from `lotar comment` and `lotar show` drop deleted comments without giving each item its `#N`. An agent counting positions would `--edit` or `--delete` the wrong comment. The fix is a `number` field on each JSON item.
    - **My mistake:** my first scratch `lotar add` wrote to the main checkout because the job sets `LOTAR_TASKS_DIR`. It made an untracked `.tasks/DEMO/` (a single task), which I removed. Nothing tracked changed.
