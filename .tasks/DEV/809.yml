- date: 2026-11-23T02:55:13.202702+00:00
  author: claude
  text: |-
    Comments can be deleted (soft: kept in the file and in history), restored and edited; deleting an open question withdraws it.

    - CLI: `lotar comment <ID> --delete|--restore <N|date>`, `--edit <N|date> <text>`, `--deleted`. Listings now number comments `#N`; `lotar show` and `lotar comment` leave deleted ones out, so the inbox mirror and staff see a withdrawn question as gone.
    - REST `POST /api/tasks/comment/delete` and `/restore` `{id, index}`; MCP `task_comment_delete` and `task_comment_restore`. The DTO keeps deleted comments with `deleted_at`.
    - History records `comment#N.deleted_at`. A withdrawn question can't be answered; a deleted answer reopens its question (fields its option set stay).
    - Counts, search, stats, timeline, automation templates and agent prompts skip deleted comments.
    - Web UI: Delete (Withdraw on an open question) on each comment and answer; "Show N deleted" lists them with Restore.
    - MCP tool count asserts went from 58 to 60 in three tests.
    - Docs: `docs/help/comment.md`, `mcp-tools.md`, `mcp.md`, `api-quick-reference.md`, `docs/openapi.json`.

    Screenshots, Comments tab (after: one comment deleted, list expanded). The "before" set was taken with the installed lotar 0.15.6:
    - Before: [light 1440](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-before-light-1440.ba28e5042307c199162b0cd553995b5a.png), [dark 1440](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-before-dark-1440.ee7477d5665984d6ae4058cbf0813893.png), [light 390](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-before-light-390.0aab3838f25d723f9a136b84361a71c2.png), [dark 390](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-before-dark-390.b66959aac1d403a9ace51fa07a0f4a05.png), [light 1920](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-before-light-1920.bb28c64e95bcf4145f89839f5c44d2ec.png), [dark 1920](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-before-dark-1920.6a685abfa837159ded5001e2082f6368.png)
    - After: [light 1440](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-after-light-1440.4af75e77d784d1369e6e679b5289dfb2.png), [dark 1440](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-after-dark-1440.d971fa707767d0fbf6be7ccbca942da5.png), [light 390](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-after-light-390.1ecfb3aad79bd8302be95ca88190ff21.png), [dark 390](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-after-dark-390.6e23a9796ce4df6e09246452c6dbd3d0.png), [light 1920](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-after-light-1920.d07048c3e7bb0e1b26b290488d8fedb8.png), [dark 1920](https://lotar.pyxzl.net/api/attachments/get?project=DEV&path=dev809-after-dark-1920.57f16c155676c290f5a93c821217d00d.png)
