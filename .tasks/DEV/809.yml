description: |-
  Owner 2026-11-22: "You can't edit an existing question? I thought we support (soft) deletes. If not ... file as a feature request on lotar."

  ## Found

  Tasks have soft delete (`deleted_at`, restore); comments can only be updated (`POST /api/tasks/comment/update`, MCP `task_comment_update`), with no CLI command and no delete. An automation asked a wrong question on STD-302 (retry options on a finished research job), and its inbox entry took over those options; the only way out was editing both YAML files by hand.

  The inbox mirror (`standards/scripts/repos.ts` `openAsked`) and staff (`staff/src/lotar.rs`) read `lotar --format json show` and work out open questions from its comments themselves.

  ## Done when

  Storage
  - [ ] A comment gets an optional `deleted_at` (RFC 3339). Deleting sets it, restoring clears it; the comment stays in the YAML, in place. Old files without it load unchanged.
  - [ ] Delete and restore each add a history entry `comment#N.deleted_at` (N 1-based, as edits record `comment#N`): delete old none, new the time; restore old the time, new none.
  - [ ] Deleting a deleted comment, or restoring one that isn't deleted, changes nothing and adds no history.
  - [ ] Editing a deleted comment is refused ("restore it first"). Comments on a deleted (trashed) task are refused as for other comment changes.

  Questions
  - [ ] A deleted question is withdrawn: it is no open question (`open_questions`, `has:question`, the open question in list rows), and answering it is refused.
  - [ ] A deleted answer no longer answers: its question is open again. The fields its option set stay as they are.

  Surfaces
  - [ ] CLI: `lotar comment <ID> --delete <N|date>`, `--restore <N|date>`, `--edit <N|date> <text>` (text as for a new comment: positional, `-m`, `-F`). N is 1-based as listed; date is a comment's exact `date`. No match: an error naming what was given.
  - [ ] CLI views leave deleted comments out: `lotar comment <ID>` (text and JSON) and `lotar show` (text and JSON), so whatever reads them (the inbox mirror, staff) sees a withdrawn question as gone. The list numbers comments `#N` by their stored position, so numbers don't shift; `lotar comment <ID> --deleted` lists the deleted ones.
  - [ ] REST: `POST /api/tasks/comment/delete` and `/restore` `{id, index}` (0-based, as `comment/update`); the task DTO keeps deleted comments with `deleted_at` so indexes stay stable. `api_types.rs`, `view/api/types.ts`, `docs/openapi.json` agree.
  - [ ] MCP: `task_comment_delete` and `task_comment_restore` `{id, index}`, documented in `docs/help/mcp-tools.md`.
  - [ ] Web UI: each comment has Delete; deleted comments are hidden behind a "N deleted" toggle that shows them greyed with Restore.
  - [ ] Other views skip deleted comments: comment counts, search, stats, timeline, automation templates (`ticket.comments[-1]`), agent prompts.
  - [ ] Docs (`docs/help`) describe delete, restore, edit and withdrawing a question.
  - [ ] Tests for the service, CLI, REST, MCP and UI; `npm run lint`, `npm test`, `npm run smoke` pass.
