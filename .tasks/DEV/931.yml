- date: 2026-11-27T13:30:27.971541+00:00
  author: claude
  text: |-
    Hosted claude/codex jobs no longer strand work on the host (`0d04ac1fd`).

    - **Takeover after a restart**: `resume_session_to_end` now calls `resumed_on_host(.., thread: false)` for headless runners *before* opening the session, and wraps the table with the new `host_agent_table` (also used by `run_session`). `Hosted::attach` takes `thread`. If the session can't be resumed, the commits and leftovers come back before the job runs again. A cancel during takeover frees the host slot and brings the commits back.
    - **Waiting for an answer**: `finish_on_host` gives a headless agent `bring_back(.., true)`: leftovers are committed on the host, everything comes back, the host worktree goes, and nothing is left in `WAITING_ON_HOST`. `t3` threads behave as before.
    - **Reasons**: `host_check` now returns `Result<Check, String>`, e.g. `a command job doesn't run on an agent host`, `no codex agent command to run there: …`, `no t3 CLI on this Mac to compare versions with`. `cached_probe` and `Hosted::set_up` pass that reason through.
    - **Lost-connection note** for headless jobs: `the agent there goes on without lotar's MCP tools, and the job ends with its turn.`
    - **Docs**: `docs/help/agent.md` "Before a job", "Commits" and "Claude and Codex" describe the new behaviour.
    - **Tests** in `hosted.rs`: `a_headless_job_taken_over_after_a_restart_runs_on_the_host_and_brings_its_commits_back`, `a_headless_agent_that_asks_brings_everything_back`, `a_host_check_names_what_is_missing`.
    - **Not covered by a test**: the takeover test calls `resumed_on_host` + `host_agent_table` + `finish_on_host`, not the full `resume_session_to_end`, because that would open a real agent session.
    - No guidance correction; no other T3 threads were running.
