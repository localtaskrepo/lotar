    Review: passed. `0d04ac1fd` does what "Done when" asks and nothing else.

    - **Read**: the ticket and fix comment, DEV-911 and DEV-901, AGENTS.md, and the whole diff (`agent_job_service.rs`, `hosted.rs`, `agent_hosts.rs`, `docs/help/agent.md`). The branch sits on `main` (`c518a585d`), so there is nothing to rebase.
    - **Takeover**: `resume_session_to_end` (`agent_job_service.rs:2567`) attaches the host with `thread: false` before the session opens and runs the agent through `host_agent_table`. That is the same table `run_session` uses. `finish_on_host` brings the commits back at the end. The slot is released on both failure paths: a session that can't be resumed (its commits and leftovers come back first) and a cancel.
    - **Waiting for an answer**: a headless job calls `bring_back(.., true)` (`:4338`). No `WAITING_ON_HOST` entry is left, so the answered job's `set_up` can use the host again. If bringing the work back fails, the job log says so and the worktree stays on the host.
    - **Reasons and note**: `host_check` returns `Result<Check, String>` and the reason reaches `cached_probe` and `set_up` unchanged. The lost-connection note and the docs match the code.
    - **Test before the fix**: `a_headless_agent_that_asks_brings_everything_back` would fail on the old `finish_on_host`, because `draft.txt` stayed on the host. The takeover test only runs the parts on their own, not `resume_session_to_end` (the fix agent says so too) → DEV-933.
    - **Reran**: `npm ci` ok; `npm run lint` passed; `cargo nextest run -p lotar-agent hosted agent_hosts host_check` passed 32/32. `cargo nextest run -p lotar-lib --test integration -E 'test(/dev503|dev510/)'`: 77 of 78 passed.
    - **That 1 failure is not from this change**: `dev503_harness_jobs_test::a_job_records_its_turn_and_reads_only_that_turns_conversation` also fails alone, and on `main` in a detached copy (since removed) → DEV-934 (tag health). The merge's `test:agent` will probably stop on it.
    - **Tickets filed**: [DEV-933](https://lotar.pyxzl.net/task/DEV-933) (minor, related), [DEV-934](https://lotar.pyxzl.net/task/DEV-934) (health).
    - No UI in the change. No stray files and no second branch.
