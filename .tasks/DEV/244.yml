  text: 'Files and links dropped, picked or pasted while creating a task are staged in the panel (thumbnails, removable, ''Attached when you create the task'') and uploaded right after the task is created; a screenshot pasted into the description links to a placeholder that is rewritten to the stored file. Failures are reported with the new ID. Code: view/composables/task-panel/useTaskPanelStagedAttachments.ts, TaskPanel.vue, useTaskPanelAttachmentDrop.ts; tests in TaskPanel.attachFiles/pendingDrops specs; verified end to end in a browser.'
