- date: 2026-11-23T06:54:27.812857+00:00
  author: claude
  text: |-
    Review: blocking. The fix works, but the test for cause 1 (session name reused) also passes without the fix.

    - Reviewed `b5810e539` (`git diff main...HEAD`: `kept.rs`, `resumed.rs`, the dev503 test, `docs/help/agent.md`). It merges cleanly onto main `108a6996c`. `npm ci` passed.
    - `cargo nextest run --cargo-profile dev -p lotar-lib --test integration dev503_harness_jobs_test`: 53 passed.
    - Do the tests fail without the fix? I put main's `kept.rs` and `resumed.rs` back for one run, then restored them:
      - `a_kept_thread_whose_worktree_is_gone_is_settled` fails: good.
      - `a_done_tickets_job_thread_without_a_job_log_is_settled_by_its_title` fails: good.
      - `a_kept_thread_whose_session_holds_a_newer_thread_is_settled` **passes** (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs:1287`).
    - Why: its second `fix` job continues the failed thread-0, which can't be resumed. That takes the hand-off path, and `keep_session` (`agent_job_service.rs:3642`, DEV-611) saves thread-0's record as `<name>.<stamp>`, so the old code finds it. In real use a fresh job overwrites the record without keeping a copy. `~/.local/state/harnessmux/sessions` has only `standards-04f015-STD-298-fix.json` and no kept rounds.
    - So "Done when" item 2 (thread in a job log, its record now holds a newer thread) has no test that failed first. The fix comment's "Tests first, failing" doesn't hold for this test.
    - Fix: run the second job with `run_t3_with(&fixtures, "fix", &["--session", "fresh"])` (or a `session: fresh` profile). Check it fails on main with `no harnessmux session holds it` and passes with `record_for`.
    - No other problems found:
      - `record_for` builds the stand-in record in memory only. harnessmux 0.2.0 `t3::settle` doesn't save it, so no real session record changes.
      - A thread that runs, waits or that a session follows is left alone (status filter, `resumed::followed`).
      - Refusals go out once per process, and lines go to stderr as `[lotar] <ID>: ...`. The docs match the code.
    - Not rerun by me: full `npm run lint`, `npm test`, `npm run smoke` (the fix agent reports them passed). The backlog count after the release still waits for the owner's OK.
    - No minor tickets filed.
