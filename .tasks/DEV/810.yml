description: |-
  Found 2026-11-22 13:30 PST (chief of staff, owner: 't3 still has a lot of open threads. We're on the new version of lotar so I hope this can be cleaned up now?'). T3 Code lists 88 unsettled threads, 56 of them completed full-access job threads ('<ID> fix: ...', '<ID> review: ...'), many of done tickets: STD-298, STD-291, STD-276, DEV-747, DEV-752, HARN-10, LOCA-535 among them (staff briefing 'Threads to settle' lists 42). DEV-747's look (crates/lotar-agent/src/services/agent_job_service/kept.rs, in v0.15.6) should settle them every 30 s in lotar serve and the queue worker, but no log says 'Settled' or 'was not settled'. Suspects: threads() finds threads only from job logs (job_log_dirs) and lotar agent list-jobs shows no jobs for STD-298 any more, so pruned job logs leave a thread unknown; settle_ticket needs a harnessmux session record (resumed::session_of), else 'no harnessmux session holds it'. The chief of staff can't settle them by hand: its thread runs in auto mode, and T3 refuses t3_thread_organize on full-access threads (runtime_mode_escalation_denied). Done when: a failing test first; lotar settles the completed job threads of done tickets also when the job's log or session record is gone (find them from T3's thread list, e.g. thread title or harnessmux metadata), and logs each settle or refusal where repos.ts or the briefing can see it; after the release the current backlog is settled (count before and after). The release needs the owner's OK.

  ## Causes found (job logs, 2026-11-22)
  - The look ran and noted refusals in job logs: 23x `was not settled: no harnessmux session holds it`, 26x `was not settled: could not read the T3 Code thread` (lotar and standards `@agent-logs`).
  - A ticket's session name (`standards-04f015-STD-298-fix`) is reused by its next job, so the harnessmux record holds only the newest thread: older threads have none.
  - `t3 thread show` runs in the session's cwd, the ticket worktree, which cleanup removed after the merge.
  - With every job log pruned, the look found no thread and didn't ask T3 Code at all.

  ## Done when
  - [ ] Failing tests first (`crates/lotar-lib/tests/dev503_harness_jobs_test.rs`), then green.
  - [ ] A kept thread of a job log whose harnessmux record now holds a newer thread (or no record) is settled.
  - [ ] A kept thread whose session cwd (worktree) is gone is settled: `t3` runs in the repository's checkout instead.
  - [ ] A thread no job log names (logs pruned, record gone) is settled when `t3 thread list` shows it completed, unsettled, `full-access`, and its title starts with the ID of a done ticket of this tasks directory ("find them from T3's thread list, e.g. thread title"). A thread that runs, waits, or that a running harnessmux session follows is left alone; open tickets' threads keep the DEV-747 rule (needs a job log).
  - [ ] T3 Code is asked even with no job log, but only when a project of the tasks directory has a `t3` agent profile.
  - [ ] Each settle and each refusal (refusal once per process) goes to the process log (stderr of `lotar serve` / the queue worker, the server log repos.ts points at) as `[lotar] <ID>: Settled the T3 Code thread <link>` / `... was not settled: <why>`, and to the job log when there is one. A failed settle changes nothing else; the next look tries again.
  - [ ] `docs/help/agent.md` says so.
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass.
  - [ ] After the release (owner's OK): count unsettled completed job threads of done tickets before and after (2026-11-22 before: lotar 8, standards 2 completed full-access unsettled threads, many on open tickets).
