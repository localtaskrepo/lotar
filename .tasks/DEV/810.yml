- date: 2026-11-23T02:45:17.990444+00:00
  author: claude
  text: |-
    Fixed: lotar now settles kept T3 Code threads of done tickets also without their session record, worktree or job log.

    - Cause 1 (23 notes in job logs): a ticket's next job reuses its session name (`standards-04f015-STD-298-fix`), so the harnessmux record holds only the newest thread: `no harnessmux session holds it`. Now `record_for` makes a record for the thread.
    - Cause 2 (26 notes): `t3 thread show` ran in the removed ticket worktree: `could not read the T3 Code thread`. Now it runs in the repo checkout.
    - Cause 3: with job logs pruned, the look never asked T3 Code. Now it asks whenever a project has a `t3` profile, and settles completed, unsettled, `full-access` threads whose title starts with a done ticket's ID. `auto` threads (the owner's) and open tickets' threads are left alone.
    - The ticket said no log had these notes: they were in the job logs (`@agent-logs`). Each settle/refusal now also goes to stderr of `lotar serve` / the worker as `[lotar] <ID>: ...`.
    - Tests first, failing, then green: 3 new in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`. Docs: `docs/help/agent.md`.
    - Other running threads (DEV-808, DEV-809, STD-307, STD-320) don't touch `kept.rs`/`resumed.rs`: no heads-up sent.
  report:
    commits:
    - hash: b5810e539
      what: settle kept threads without their session record or worktree, find unlogged job threads of done tickets by title, log each to stderr
    checks:
