description: 'Found 2026-11-12 with lotar 0.14.1 (installed), while setting up STD-56: in ~/Development/@localtaskrepo/lotar, lotar automation run "Merge agent lifecycle" --dry-run printed nothing for 40 s (killed; user 1.6 s, sys 4.6 s, so it waits or does file IO, not CPU), and lotar automation run "Prerequisites done: continue the waiting ticket" --dry-run printed its preview and then did not exit within 60 s (sys 12.9 s). The same ''Merge agent lifecycle'' run in ~/Development/standards (56 tickets) fails at once with ''No rule named ... with a manual or unblocked action'', as it should. Suspect DEV-388''s scan for prerequisites in another repo (it runs on every automation run). Check: time lotar automation run "Merge agent lifecycle" --dry-run in this repo. Done: it ends in a few seconds (the validation error here), a test covers a repo of this size or the slow step, and the cross-repo unblocked scan stays as DEV-388 built it. STD-56 runs this command from a daily job in every repo, so it has to be quick.'
