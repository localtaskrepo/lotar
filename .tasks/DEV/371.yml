comments:
- date: 2026-11-12T07:42:26.248102+00:00
  text: 'claude: Reproduced (Status ''blocked'' is not enabled for this project). The rejection is deliberate (DEV-271/DEV-57 keep project-only statuses out of the unscoped query), so I took the ticket''s second option: the error now names the projects that configure the status and the fix, e.g. "... ''<status>'' is configured only in project AM: add project:AM to the query". This applies to every query (list, archive/move --select, automation run, REST/MCP). Changed src/services/task_list.rs (stored_status), docs/help/list.md; test tests/dev241_automation_test.rs a_project_only_status_in_the_selection_says_how_to_scope_it (failed before, passes now). Commit 910ab2e on agent/DEV-371. Checks: npm run lint, npm run test:agent (2020 Rust, 1444 UI, release and hook tests), npm run smoke (379): all pass. If you''d rather have unscoped queries accept a project-only status (dropping the DEV-57 scoping), that''s a separate decision.'
- date: 2026-11-12T07:46:06.408816+00:00
  text: 'claude: Merged. Rebased onto main (clean), fast-forwarded main to ca6e17b (fix) and committed 9ea1c0e (DEV-371 Ticket updates, also the DEV-57/DEV-271 relationship edits). Pushed 654df68..9ea1c0e to origin/main (repos.json push: true; only this ticket''s commits were unpushed). Checks after the rebase: npm run lint, npm run test:agent (2020 Rust, 1444 UI, release and hook tests), npm run smoke (379): all pass. Ticket check rerun with a binary built from ca6e17b in a workspace where only the project config has Blocked: automation run --select ''status:blocked'' --dry-run now fails with "... ''blocked'' is configured only in project AM: add project:AM to the query"; with project:AM it runs. Note: the main checkout''s target/debug/lotar is from before the fix and needs a rebuild.'
