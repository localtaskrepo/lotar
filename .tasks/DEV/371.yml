description: 'Found by DEV-370 (claude, 2026-11-11): closing DEV-369 ran lotar automation run ''Release installed: run the waiting check'' --select ''status:blocked id:/^DEV-361$/'' and it failed with ''Status blocked is not enabled for this project. Valid statuses: Todo, InProgress, NeedsReview, Done''. Blocked is in .tasks/DEV/config.yml issue.states and default.project is DEV, but the query is checked against the global statuses only. With project:DEV in the query, or --project DEV, it works. The release rule now passes --project (f51de7c). Check: in a workspace whose global config has no Blocked and whose project config does, lotar automation run <rule> --select ''status:blocked'' --dry-run succeeds without --project (or the error names --project/project:). Done when that works with a test.'
