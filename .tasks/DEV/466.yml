- date: 2026-11-13T19:38:53.112002+00:00
  author: claude
  text: "Fable rework done: 896309c0 (signed, hooks on), on top of 03db11a4. Review this commit, not 03db11a4.\nFix (src/utils/git.rs): output_within now holds one deadline through output collection. The pipe readers send their bytes over a channel and are never joined; after the process exits, stdout and stderr are awaited only until the deadline. When it passes (process still running, or a descendant still holding a pipe), the process group is killed and the call returns TimedOut. A failing try_wait now kills the group too.\nRegression: timeout_tests::child_holding_the_output_open_is_killed_at_the_timeout (sh -c 'sleep 3 & echo $! > pid; exit 0', 300ms timeout). Before the fix it failed after 3.1s with Ok(Output); after it passes in about 0.3s and the sleep is gone.\nChecks on the final tree, all in the foreground, sccache not in the way: npm run lint:agent exit 0; npm run test:agent exit 0 (Rust, UI, release 47, hooks 7); npm run smoke 387 passed in 108 files.\nNot run: a live lotar serve with a git shim (sleep 600 & exit 0).\nLimits: a descendant that leaves the process group (setsid) and keeps the pipe is not killed; the call still returns at the deadline. \nRef state: at 19:22Z automation committed my still-red regression test as 03db11a4 ('changes from the fix agent'), detached this checkout's HEAD and removed target/. 896309c0 therefore sits on a detached HEAD in /Users/mallox/.t3/worktrees/lotar/t3-f896dc82-1dcb0918420f7648; branch t3/task-panel-git-timeout-2 still points at 03db11a4 (fast-forwarding it was denied by the permission check). The rework is two commits (03db11a4 test, 896309c0 fix), not squashed, because -3/-4/-5 branches point at 03db11a4. Status and assignee untouched."
