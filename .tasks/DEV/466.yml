description: |-
  Found 2026-11-13 on all six launchd servers (0.14.3): every ticket page stayed on 'Loading task…'. /api/tasks/history and /api/activity/feed never answered; the servers had a pile of git children (git log --follow ..., git ls-files .tasks) that had been waiting for minutes. Cause of the hang: git blocks in open() of ~/.gitconfig (a symlink into Dropbox) while macOS TCC asks whether the upgraded, unsigned lotar binary may read Dropbox files (same thing as 2026-11-05 with 0.12.0). That is the Mac's problem; lotar's problem is that one hanging git call blocks the whole panel: loadTask (view/composables/task-panel/useTaskPanelPersistence.ts) awaits loadCommitHistory before it sets ready, and the server runs git with no timeout, so requests and git processes pile up.

  Check: put a git on PATH that sleeps (e.g. a shim running 'sleep 600'), start lotar serve, open a task: today the panel never leaves 'Loading task…' and curl /api/tasks/history?id=<ID> does not return.

  Done: the task panel shows the task as soon as /api/tasks/get answers; commit history loads on its own and shows its own loading and error state. The server's git calls have a timeout, kill the child when it runs out and answer with an error, so git processes don't pile up. A test covers both with a git that hangs.
