- date: 2026-11-13T10:45:55.825737+00:00
  author: claude
  text: |-
    Fixed in e40e7eef (branch agent/DEV-466).
    Server: new src/utils/git.rs output()/output_within(): runs git with empty stdin in its own process group, kills the group after GIT_TIMEOUT (20s) and returns a TimedOut error. Every git call in audit_service (history, activity feed, ls-files, show, diff, rev-list) goes through it; /api/tasks/history answers 500 'Failed to run git: git did not finish within 20s'.
    Panel: loadTask no longer awaits loadCommitHistory, so the task shows as soon as /api/tasks/get answers; the Commits tab has its own loading state and now an error line (commitsError).
    Tests: Rust unit test with a hanging child (sleep 600) checks it is killed at the timeout; vitest test in TaskPanel.integration.spec.ts with a never-resolving history (fails before the fix, passes after).
    Ticket check run with a git shim that sleeps 600: /api/tasks/get answered in 0.02s, /api/tasks/history answered 500 after 20.06s, no git/sleep children left.
    Checks: npm run lint, npm run test:agent (Rust, UI, release, hooks), npm run smoke (387 passed) all pass.
    Not covered: the long-lived git cat-file --batch reader (BlobBatch) has no timeout; it only starts after a git log has answered. /api/activity/feed with a hanging git takes up to 40s (ls-files, then log). No browser check beyond the smoke suite.
- date: 2026-11-13T10:47:22.677522+00:00
  author: codex
  text: 'Review: blocking. In e40e7eef, src/services/audit_service.rs:22-27 and :44-56 still spawn git cat-file --batch and read its pipes without any deadline. A shim that lets log/ls-files succeed but hangs cat-file leaves the activity request and child alive indefinitely. Earlier log success does not bound a separate process. Add a deadline, child cleanup and endpoint error propagation to BlobBatch, with a regression where only cat-file hangs. This is unfinished explicit ticket scope. Read the diff against main, ticket/comments, relationships (none), guidance and recent main history; docs/decisions does not exist. TaskPanel integration: 17 passed; diff whitespace check passed. Rust attempt failed on sandbox-denied sccache; retry without wrapper was stopped during a cold dependency build before tests ran. Full lint, smoke and live shim reproduction were not rerun. No source edits or commits; status and assignee unchanged.'
- date: 2026-11-13T11:00:35.706894+00:00
  author: claude
  text: 'Review finding fixed (git cat-file --batch had no deadline). BlobBatch now reads responses on a reader thread, and each read waits at most GIT_TIMEOUT (20s). When that runs out, it kills the batch process group (shared spawn_in_process_group/kill_process_group helpers in src/utils/git.rs) and returns TimedOut. load_task_version_batched passes a timeout up as an error and does not fall back to git show, so /api/activity/feed answers 500 ''Failed to run git: git cat-file did not finish within 20s''. New regression test blob_batch_tests::hanging_cat_file_fails_the_activity_feed_at_the_timeout: only the batch process hangs, the feed fails within the timeout, and the hanging child is gone. Live check: a git shim on PATH that hangs only cat-file, lotar serve: /api/tasks/get answered 200 in 0.01s, /api/activity/feed answered 500 after 20.0s, no sleep or cat-file left running. Amended commit 35883139 (signed). Checks: npm run lint:agent, npm run test:agent (Rust, UI, release, hooks) and npm run smoke (387) all pass.'
- date: 2026-11-13T11:01:38.718725+00:00
  author: codex
  text: 'Review: blocking. src/utils/git.rs:74-86 stops checking the deadline when the direct process exits and then joins pipe readers without a timeout. A git shim running sleep 600 & exit 0 leaves its child holding stdout open, so the request waits 600 seconds and the child survives beyond the deadline. Verified pipe behavior: parent exits in 0.003s, EOF waits for its child (2.015s in a short reproduction). Enforce the deadline through output collection, kill remaining process-group children on expiry, and test a parent that exits while a child retains stdout. Earlier cat-file finding is addressed. Read full diff, ticket/comments, relationships (none), guidance and recent main history; docs/decisions absent. Panel integration: 17 passed. Rust attempt blocked before compilation by sandbox-denied sccache. Full lint/tests/smoke and live server reproduction not rerun. No source edits or commits; status and assignee unchanged. Second blocking review: owner routing required by requested workflow.'
- date: 2026-11-13T11:01:46.344104+00:00
  author: automation
  text: The review found blocking problems again after one rework (the comments above). Should an agent rework it once more (lotar assignee DEV-466 @fix), will you decide the findings, or is it WontDo?
