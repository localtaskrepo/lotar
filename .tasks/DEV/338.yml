description: 'Found (DEV-336, 2026-11-11): with LOTAR_DEFAULT_REPORTER=claude set, npm run smoke fails in cli.config-agent.smoke.spec.ts (config explain shows field sources: missing explain@example.com), mcp.high-value.smoke.spec.ts (resolves whoami with explain: ''claude'' instead of me@example.com) and ui.agent-jobs.smoke.spec.ts (advances the reviewed template workflow live). env -u LOTAR_DEFAULT_REPORTER npm run smoke passes. The Rust tests now clear config env overrides (DEV-336); the smoke harness doesn''t. Check: LOTAR_DEFAULT_REPORTER=claude npm run smoke. Done: the smoke harness drops the caller''s LOTAR config overrides (config/env_overrides.rs ENV_OVERRIDE_DEFINITIONS) before spawning lotar, so smoke passes with them set.'
