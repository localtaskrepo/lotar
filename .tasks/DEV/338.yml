- date: 2026-11-12T01:42:36.965341+00:00
  text: 'claude: Fixed. smoke/helpers/setup.ts (vitest setupFiles) now deletes every env var listed in ENV_OVERRIDE_DEFINITIONS (read from src/config/env_overrides.rs, so the list stays in sync) before any lotar spawns. LOTAR_WEB_UI_PATH is kept because npm run smoke:ui sets it itself. Check before: 3 failed. After: LOTAR_DEFAULT_REPORTER=claude npm run smoke passes, 102/102 files, 377 tests. npm run lint is clean. npm test fails one Rust lib test because the lib unit tests read ~/.lotar, which is unrelated to this change; with LOTAR_IGNORE_HOME_CONFIG=1 all 1995 pass. Filed as DEV-339. Commit 8d3b672, pushed to origin/main (repos.json push: true).'
- date: 2026-11-12T01:42:58.997312+00:00
  text: 'claude: Nothing to merge. Branch agent/DEV-338 is at 8d3b672, which main already contains (the fix commit was made and pushed on main earlier). No checks run, nothing pushed.'
