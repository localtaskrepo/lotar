description: 'Developer follow-up to DEV-141: Focus-task auto navigation interrupts/cancels autocomplete; use one real shared search for task lookup and structured filters with stable DOM/draft/caret, no idle focus navigation. Diagnose type-filter autocomplete parity. Fields should control visible graph cards, not a newly added hover-only layer. Use independent relationship-kind checkboxes inside shared FilterBar panel extension slot, not dropdown/forced dependencies. Make relationship kinds clear using readable edge labels, redundant colors/dashes/arrows and a legend in diagram view. Preserve graph-root exploration via explicit task selection/exact-ID Enter and broad text/structured search, old links/history/SSE/safe repair/preference values. No syncing search across views (separate user-created DEV-142), no backend/data migration/bulk repair. Test fail-first cancellation/keyboard/echo/scope behaviors, visible card geometry and accessible relation semantics, actual browser and viewport screenshots, full lint/test/build-first smoke. Keep staged index and unrelated work unchanged; no Git writes/server restart/newdeps.'
