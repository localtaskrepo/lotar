- date: 2026-11-25T12:41:43.534593+00:00
  author: claude
  text: |-
    Review: passed. A t3 job's usage-limit retry now continues the paused job's T3 Code thread, so one thread per job resumes. No blocking findings, no tickets filed.

    - Reviewed `5d6039752` (only commit in `main..HEAD`; `agent/DEV-832` has nothing newer). It merges cleanly onto main `5e53e427c`. The DEV-809 and DEV-806 commits on main touch `agent_job_service.rs` and `agent_queue_service.rs`, but not the code this fix uses.
    - `limit_retry` comes from `entry.not_before.is_some()` (`agent_queue_service.rs:872`). Only `usage_limit_pause` sets `not_before` (`agent_job_service.rs:5791`), so other retries keep their old behavior. Commit retries are excluded (`commit_retry.is_none()`).
    - `run_job` (`agent_job_service.rs:3665-3696`): the retry skips the `continue_within_minutes` check, the cause of DEV-811's 7 threads. It still gets the T3-made-worktree handoff and the resume-failure handling. `session_to_continue` gives the retry the same session the paused job used.
    - Done when "one session per job resumes, with a test": the new test `a_t3_jobs_retry_after_a_usage_limit_continues_the_paused_thread` covers it. With the old `crates/lotar-agent/src` it fails (`the retry started no second thread`, 2 thread starts); with the fix it passes.
    - Reran: `npm ci` passed; `cargo nextest run -E 'test(/dev584|dev626|dev510|dev600|dev639|resumed/)'` 29 passed; `cargo nextest run -p lotar-agent` 236 passed; `cargo clippy -p lotar-agent -p lotar-lib --all-targets -- -D warnings` clean; `rustfmt --check` and `prettier --check` on the changed files clean. Working tree restored and clean.
    - Not run: `npm run lint`, `npm test`, `npm run smoke` (the merge runs them, DEV-797). Also not run: a live count of sessions after a real reset. No UI changed, so no screenshots.
    - `docs/help/agent.md` matches the code. The 1-hour retry wait stays with [DEV-855](https://lotar.pyxzl.net/task/DEV-855).
