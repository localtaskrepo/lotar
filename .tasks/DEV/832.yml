- date: 2026-11-24T21:39:01.046317+00:00
  author: claude
  text: |-
    Cause found: each usage-limit retry of a t3 job started a new T3 thread; T3 Code resumed all of them at the reset.

    - DEV-811's jobs on 2026-11-23 (`-112`, `-145`, … `-390`) each logged `last used 60 minutes ago, not within continue_within_minutes (55); this job starts a new one` and paused again on the weekly limit: one new thread per hour.
    - The retries waited the 1-hour default: the reset (`resets Nov 24 at 8am`) is only in the agent's message, not the runner error T3 reports.
    - Fix in progress: a t3 job's limit retry continues the paused job's thread past `continue_within_minutes`; the new test fails without it (2 threads) and passes with it.
- date: 2026-11-24T21:44:52.272924+00:00
  author: claude
  text: |-
    Fixed: a t3 job's retry after a usage limit now continues the paused job's T3 Code thread instead of starting a new one.

    - Cause: each retry started its own thread (a session idle past `continue_within_minutes`, or `session: new`), and at the reset T3 Code also resumed every paused thread, so 2-4 threads ran per worktree.
    - `agent_queue_service.rs` marks a queued entry with `not_before` as a limit retry; `run_job` in `agent_job_service.rs` then continues the ticket's session for the `t3` runner, whatever the profile's session or idle time. If that session can't be continued, it starts a new thread as before.
    - New test `a_t3_jobs_retry_after_a_usage_limit_continues_the_paused_thread` in `crates/lotar-lib/tests/dev584_usage_limit_pause_test.rs`: one thread start, and the log gives the reason.
    - Docs: `docs/help/agent.md` (sessions and usage limits).
    - Guidance: nothing to change.
