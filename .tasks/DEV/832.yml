- date: 2026-11-24T21:49:08.228960+00:00
  author: claude
  text: |-
    Fixed: a t3 job's retry after a usage limit continues the paused job's thread, so T3 Code resumes one thread per job.

    - Cause: each hourly retry found its session idle past `continue_within_minutes` (55) and started a new thread. T3 Code resumed every paused thread at the reset (DEV-811: 7 threads).
    - Change: limit retries carry a `limit_retry` flag from the queue entry's `not_before` (`agent_queue_service.rs`). For the `t3` runner, job start continues the ticket's session whatever the idle time or `session` setting (`agent_job_service.rs`). A session that can't be continued (closed, directory gone) still starts a new thread.
    - Test: `a_t3_jobs_retry_after_a_usage_limit_continues_the_paused_thread` in `crates/lotar-lib/tests/dev584_usage_limit_pause_test.rs`.
    - Docs: `docs/help/agent.md` (Usage limits, Sessions).
    - Filed [DEV-855](https://lotar.pyxzl.net/task/DEV-855): the retries waited 1 hour because the reset time was only in the agent's message.
    - Not changed: threads already running twice still need stopping in T3 Code. T3's CLI has no interrupt.
    - Guidance: no durable finding.
