- date: 2026-11-24T16:07:52.652624+00:00
  author: claude
  text: |-
    More evidence from 2026-11-24 16:05: the security passes ran again too.

    - STD-336 (W48) thread `mcp:launch:401d357b…` restarted for paused job `job-20261123T180740.455Z-44`, with no lotar job; the ticket is Blocked on LOCA-601.
    - STD-328 (W47) had at least three threads back at once (`job-…-30`, `-40`, `-46`). A security pass touches every repo in `repos.json`, so two of them running at once can step on each other's `sec-<week>` worktrees and pushes.
    - The STD-336 thread checked the ticket and stopped without touching any repo.
