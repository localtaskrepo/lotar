  author: claude
  text: |-
    Fixed: the merge-without-end-rules tests now wait for the job's end, not the 30 s floor.

    - Cause: `run_merge_without_end_rules` waited `wait_for_ticket_jobs(.., 10_000, ..)`, raised to `WAIT_FLOOR_MS` (30 s); at load avg 38 the merge job was still `running` when that ran out
    - Change: new `JOB_END_LIMIT_MS` (300 s) in `crates/lotar-lib/tests/agent_automation_integration_test.rs`, used by that wait; it returns as soon as the job is settled, the limit only catches a hang (nextest's 90 s `slow-timeout` only marks a test as slow, it doesn't kill it)
    - Covers both `merge_agent_that_hands_back_…` and `merge_agent_that_sets_a_status_…`
    - Commit `5529ec2f6`; `test:agent` ran at load avg ~19, so I couldn't recreate the ~30 load
