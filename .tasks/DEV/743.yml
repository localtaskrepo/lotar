- date: 2026-11-20T22:55:24.537133+00:00
  author: claude
  text: |-
    Fixed: the merge-without-end-rules tests now wait for the job's end, not the 30 s floor.

    - Cause: `run_merge_without_end_rules` waited `wait_for_ticket_jobs(.., 10_000, ..)`, raised to `WAIT_FLOOR_MS` (30 s); at load avg 38 the merge job was still `running` when that ran out
    - Change: new `JOB_END_LIMIT_MS` (300 s) in `crates/lotar-lib/tests/agent_automation_integration_test.rs`, used by that wait; it returns as soon as the job is settled, the limit only catches a hang (nextest's 90 s `slow-timeout` only marks a test as slow, it doesn't kill it)
    - Covers both `merge_agent_that_hands_back_…` and `merge_agent_that_sets_a_status_…`
    - Commit `5529ec2f6`; `test:agent` ran at load avg ~19, so I couldn't recreate the ~30 load
  report:
    commits:
    - hash: 5529ec2f6
      what: merge-without-end-rules tests wait for the job's end, 5 min hang limit
    checks:
    - command: npm run -s test:agent
      result: passed
      reason: load avg ~19, not ~30
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
      reason: 2425 Rust tests
    - command: npm run smoke
      result: passed
    next: Review, then merge
- date: 2026-11-21T00:39:04.838991+00:00
  author: claude
  text: |-
    Review: passed. The merge-without-end-rules wait now ends when the job does; no blocking findings.

    - Read: `5529ec2f6` (only `crates/lotar-lib/tests/agent_automation_integration_test.rs`), the ticket, DEV-741, the last 5 main commits to the file (none after the branch's base), AGENTS.md
    - Claim holds: `.config/nextest.toml` sets `slow-timeout = "90s"` with no `terminate-after`, so the 300 s `JOB_END_LIMIT_MS` isn't cut short; `wait_for_ticket_jobs` returns as soon as the predicate holds, so normal runs don't slow down. Both `merge_agent_that_*_without_end_rules_*` tests use the helper
    - No fail-before test: it's a load flake, which the ticket's own check covers
    - `npm ci` ran fine
    - `npm run -s test:agent` at load avg ~30: failed, fail-fast, on `dev605_merge_without_agent_test::a_check_that_leaves_a_process_running_doesnt_hold_up_the_merge` (21.1 s against a 20 s budget). This diff doesn't touch it, and it fails the same way in DEV-731 and DEV-734 runs. The DEV-743 tests hadn't run yet
    - So I ran `cargo nextest run -p lotar-lib --test integration --no-fail-fast --retries 0 -E 'test(/^agent_automation_integration_test::/)'` at load avg 19-28: 58/58 passed, both merge tests included
    - Not rerun: `npm run lint`, `npm test`, `npm run smoke` (the change is in one test file)
    - Filed: [DEV-748](https://lotar.pyxzl.net/task/DEV-748), the dev605 timing flake, related to this ticket
