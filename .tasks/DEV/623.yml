- date: 2026-11-16T23:36:31.467658+00:00
  author: claude
  text: |-
    Review: blocking — in `lotar serve`, a job already queued can stay stuck while memory is short, and the 30 s tick never starts.

    - **Bug** `crates/lotar-lib/src/services/agent_job_service.rs:4703-4706`: `process_pending_queue` returns early while the gate holds, but `start_memory_tick()` only runs from `start_job` (`:325`). Case: a job is queued for a full slot (`max_parallel_jobs`) or a busy merge slot, then memory turns short and the running jobs end. Each job end hits the early return and no tick is running, so the pending job waits until some new job is started. Done when says: "a 30 s tick starts pending jobs once the gate opens (no job end needed)".
    - **Fix**: also call `start_memory_tick()` before that early `return` (or start the tick whenever the pending queue is not empty), and add a test: queued for a slot, gate holds at job end, gate opens, the job starts with no new job request.
    - Everything else matches Done when: the worker uses `JobStartMode::Immediate` and checks the gate before `dequeue_entries`, so `attempts` stay as they were; DEV-378 recovery is not gated; config, docs and the parsing and decision tests are there.
    - Reran `cargo nextest run --workspace -E 'test(memory_gate) | test(dev623) | test(config_validation) | test(agent_queue)'` (with `RUSTC_WRAPPER=`): 43 passed. I did not rerun the full `npm run lint`, `npm test` or `npm run smoke`.
    - Minor, filed: [DEV-629](https://lotar.pyxzl.net/task/DEV-629). `/api/config/show` now also returns `agent_memory_gate`, but `view/api/types.ts` doesn't list it.
