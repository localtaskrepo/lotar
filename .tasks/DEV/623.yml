- date: 2026-11-16T22:24:43.617057+00:00
  author: claude
  text: |-
    Memory gate built: while macOS reports memory pressure (warn/critical) or swap is over 85%, no new agent job starts; held jobs start after 2 min of normal memory.

    - New `crates/lotar-lib/src/services/memory_gate.rs`: reads `sysctl kern.memorystatus_vm_pressure_level vm.swapusage` (Linux: `/proc/meminfo` swap), rereads every 30 s while held, 5 s while open; shared state `memory-gate-<hash>.json` in the queue dir
    - Queue worker takes no entry while held (attempts unchanged, no ticket comments); `lotar serve` queues new jobs and a 30 s tick starts them once memory is normal
    - `lotar agent queue` / `list-jobs`: `waiting for memory: … (held since …)`, JSON `memory_hold`; a failed reading holds nothing and is warned about
    - Config `agent.memory_gate` (`enabled` unset = on on macOS only, `max_swap_percent` 85, `settle_seconds` 120); docs in `docs/help/agent.md` § Memory gate and `config-reference.md`
    - Tests: unit tests with fake readings (warn, critical, swap high, back to normal, settle restart, failed reading), sysctl/meminfo parsing; integration `dev623_memory_gate_test` (held entry, queue + list-jobs output). Tests/smoke set `LOTAR_MEMORY_READING=normal`
    - Heads-up: this Mac reads pressure **warn** right now (swap 3.8 of 5 GB), so with this build jobs would wait until it clears. `agent.memory_gate.enabled: false` turns it off
    - No REST/UI change; the Config page doesn't show the new keys
