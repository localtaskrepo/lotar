  text: |-
    Still blocked: harnessmux 0.2.0 isn't released. Release it, or should lotar depend on the git commit until then?

    - DEV-683 is merged and pushed: harnessmux `main` is at `efc17df`, with `CHANGELOG.md` under `## 0.2.0 (unreleased)` and `version = "0.1.10"` in its `Cargo.toml`.
    - crates.io's newest is still `0.1.10` (`cargo search harnessmux`, crates.io API); no `v0.2.0` tag.
    - lotar asks for `harnessmux = "0.1.10"` (`Cargo.toml:23`), so "bump to 0.2.0" can't build yet.
    - Publishing a crate is your call, so I changed no files.
    - Options: (a) you release harnessmux 0.2.0, then an agent does this ticket; (b) lotar uses `harnessmux = { git = "https://github.com/localtaskrepo/harnessmux", rev = "efc17df" }` now and goes to `0.2.0` once it's out (a git dependency can't go into a crates.io release of lotar).
