- date: 2026-11-20T21:07:44.265012+00:00
  author: claude
  text: |-
    Review: passed. `5cb9e3364` does all three "Done when" points, and the checks I reran pass.

    - Read: the diff against `main` (6 files), the ticket and its comments, DEV-584, DEV-729, and harnessmux 0.2.0's `src/failure.rs` and `src/backend/t3.rs`. `main` has no newer commits to the touched files.
    - `Cargo.toml` uses `harnessmux = "0.2.0"`. `drive_turns` keeps each `TurnFailed { error, kind, resets_at, retryable }` as a `harnessmux::Failure`. `usage_limit::of_failures_in` reads `rate_limited`/`quota` and `resets_at` first. Kind `other` uses the text match, as the ticket asks.
    - Test `a_typed_rate_limit_pauses_the_job_until_its_resets_at`: a fake claude-agent-acp sends `errorKind: rate_limit` with a text that names no limit, so only the typed data can pause the job.
    - Reran: `npm ci` (ok); `cargo nextest run -p lotar-agent usage_limit dev520` (16 passed); `cargo nextest run -p lotar-lib --test integration dev584 dev520` (4 passed); `cargo clippy -p lotar-agent --all-targets -- -D warnings` (clean); `rustfmt --check` and `prettier --check` on the changed files (clean). Full `npm run lint`/`test`/`smoke` not rerun; the fix agent reports them passed.
    - Minor, filed [DEV-740](https://lotar.pyxzl.net/task/DEV-740): harnessmux classifies by text with sign-in first. So a t3 failure text that names both "unauthorized" and a usage limit becomes `auth_required` and no longer pauses. `docs/help/agent.md` still says "a limit wins over any other failure".
    - Merge note: `agent/DEV-729` (`86de0410d`) does the same harnessmux bump and the same test edits in `agent_job_service.rs`. Whichever lands second gets a small rebase conflict at `EventBody::TurnFailed`; keep DEV-711's version.
    - The owner's decisions aren't touched. The fix agent's own calls are announced in its comment: other kinds never pause, and quota retries hourly.
