- date: 2026-11-20T20:07:27.811413+00:00
  author: claude
  text: |-
    Done: the usage-limit pause reads harnessmux 0.2.0's typed failure first, the text match stays the fallback.

    - `cargo search harnessmux` lists `0.2.0`; `Cargo.toml` bumped from `0.1.10`. The branch was behind main (DEV-584 wasn't on it yet), so it fast-forwarded to main first.
    - `agent_job_service.rs` keeps each `TurnFailed { error, kind, resets_at, retryable }` as a `harnessmux::Failure`.
    - `usage_limit::of_failures`: `rate_limited`/`quota` pause, at `resets_at`, else the time the text names, else the default wait. Kind `other` uses the old text match. Other kinds (sign-in, overload, context, transport) don't pause, even when the text looks like a limit.
    - Test `a_typed_rate_limit_pauses_the_job_until_its_resets_at` in `dev584_usage_limit_pause_test.rs`: a fake claude-agent-acp fails the prompt with `errorKind: rate_limit`, `rateLimit.resetsAt` and a text that names no limit. The job pauses until `2099-12-01T00:00:00+00:00`. Also new unit tests in `usage_limit.rs`.
    - `docs/help/agent.md` Usage limits section describes the kind-first order.
  report:
    commits:
    - hash: 5cb9e3364
      what: harnessmux 0.2.0, typed usage-limit pause, fake-ACP test, docs
    checks:
    - command: npm run lint
      result: passed
    - command: npm run test:agent
