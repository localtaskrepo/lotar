description: |-
  Follow-up of DEV-584, which pauses a job on a provider's usage limit by matching the failure text (`crates/lotar-agent/src/services/usage_limit.rs`). harnessmux 0.2.0 (DEV-683) is not released yet: crates.io has 0.1.10, which reports `TurnFailed { error }` with no kind or reset time.

  ## Done when
  - [ ] harnessmux bumped to 0.2.0 in `Cargo.toml`.
  - [ ] `agent_job_service.rs` matches `EventBody::TurnFailed { error, .. }` and reads `kind` (rate_limited, quota) and `resets_at` before `usage_limit::find`; the text match stays as the fallback for runners that give no kind.
  - [ ] A test with a fake harness that reports a typed rate-limit failure pauses the job until its `resets_at`.
