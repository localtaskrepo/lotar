- date: 2026-11-14T04:37:32.681673+00:00
  author: claude
  text: |-
    Built option A, commit 8e01b87f on agent/DEV-485 (signed).
    - New setting ui.custom_fields_from: config | scanned | both (default both), global or per project; config set validates it, inherit/blank clears a project override; shown in config show/inspect with its source.
    - config show adds custom_fields_offered: declared names first, then names the scope's tasks use (most used first; empty values don't count). Names differing only in case merge (declared spelling, else most used); separators don't merge. With 'config' no tasks are read.
    - UI: Board Fields/Group by, Tasks list columns and filters, Calendar, Dependencies, Insights and Sprints use that list. Bulk edit offers only names the server accepts (offered list under the wildcard, else the declared ones). Card/column values match field names regardless of case. Config > Tags & fields: 'Fields offered in pickers' select (checked in light/dark, desktop and phone width).
    - MCP/REST hints unchanged (declared names only). Docs: config-reference, config, serve, openapi.
    - Tests: new tests/dev485_offered_custom_fields_test.rs (4), view useConfig.offeredCustomFields.spec.ts (3), smoke ui.offered-custom-fields (board offers used fields, case-merged lanes, Config page save to 'config' hides them).
    - Checks: npm run lint (lint:agent) clean; npm test: 2141 Rust + 1518 UI + release/hooks passed; npm run smoke: 391/391 passed.
