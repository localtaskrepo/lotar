description: |-
  Evaluate whether the web UI should also offer custom fields that tasks actually use, not only the ones a project lists in `custom_fields`, with a config option to choose the behaviour. The owner asked for this evaluation on 2026-11-13.

  ## Context

  - The board's **Fields** picker and **Group by**, the Tasks list columns and the Calendar and Dependencies cards only offer custom fields declared by name in `custom_fields`. With the default wildcard (`["*"]`), any field is allowed but none is offered (`view/pages/Board.vue` drops `*` from `availableCustomFields`; `view/composables/useColumns.ts` `setCustomFieldKeys`).
  - Seen in standards' INBOX project: every ticket has the fields `source`, `source_repo` and `finding`, but the board offered none of them, so the owner concluded custom fields "are not supported" on the board. standards then used a tag for the project instead (docs/decisions/2026-11-13-inbox-ticket-properties.md in standards).

  ## Questions to answer

  - Where should scanned field names come from (the server's task index, a stats endpoint, the loaded tasks), and what does that cost on a big project?
  - Behaviour options, for example a setting such as `ui.custom_fields_from: config | scanned | both`. Which default? Should a wildcard project show scanned fields by default?
  - How do scanned-only fields behave in filters, suggestions, bulk edit, swimlanes, version types and the MCP and REST hints?
  - Do names that differ only in case or separators (`source_repo`, `Source Repo`) merge?

  ## Done when

  - [ ] A comment with the findings, the options with their cost, and a recommendation.
  - [ ] The ticket waits for the owner (HelpNeeded, assigned to mallox) with one question: which option, if any. No implementation before his answer.
