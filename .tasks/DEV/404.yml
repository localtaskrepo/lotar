description: |-
  Found 2026-11-12 (claude, QIS-55 fix job), lotar 0.14.1.

  **Repro**
  1. Project config `.tasks/TST/config.yml` with `default: { reporter: owner1 }`.
  2. `LOTAR_DEFAULT_REPORTER=claude lotar --tasks-dir <dir> comment TST-1 "hello"`
  3. The comment has `author: owner1`. Without the project `default.reporter` the same command records `author: claude`.

  **Expected** (lotar comment --help, Identity & Users): the author is `default_reporter` such as `LOTAR_DEFAULT_REPORTER`, before other sources, so `claude`.

  **Impact** In quarter-inch-studio (`default.reporter: mallox`) every agent comment is recorded as the owner, so the standards rule "Comments: the owner's comment reaches the agent" starts jobs on agents' own comments: QIS-55, QIS-33 and QIS-170 reopened from Done, and QIS-55's fix job got its own comment back as an owner comment (loop). Possibly a side effect of the fix for "Identity detection ignores project-level default.reporter". Standards follow-up: STD-57.
