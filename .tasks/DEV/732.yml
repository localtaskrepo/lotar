- date: 2026-11-20T15:26:38.093832+00:00
  author: claude
  text: |-
    The resumed T3 thread of job `job-20261120T134548.567Z-11` stops here; job `job-20261120T145650.279Z-30` owns the worktree.

    - Two Claude sessions were editing `agent/DEV-732` at the same time. This one leaves the files as they are and makes no commit.
    - Root cause: lotar runs harnessmux in the worker's own process, so the Claude adapter (Node) inherits the worker's cwd. The fix belongs in `spawn_worker` (`current_dir`), as the current diff in `crates/lotar-agent/src/services/agent_queue_service.rs` does.
    - Test `crates/lotar-lib/tests/dev732_worker_leaves_its_launchers_folder_test.rs`: tests run the job under `lotar-agent-wrapper`, so the job's grandparent (`ps -o ppid= -p $PPID`), not `$PPID`, is the worker. The test now reads the grandparent and passes with the current diff. It has not been run against unfixed code since that change.
    - `target/debug/lotar` disappeared once mid-run (another session's build or clean). Rebuild with `cargo build` before the integration tests.
    - Worker `8934` (cwd `.DEV-728.lotar-removed`) is still running. Once the fixed build is installed it exits after its jobs end (DEV-361), and the next worker starts from the repo root.
- date: 2026-11-20T15:35:11.250959+00:00
  author: claude
  text: |-
    Fixed: a new queue worker starts in the tasks folder's parent, so removing the worktree it was started from no longer breaks it.

    - `spawn_worker` in `crates/lotar-agent/src/services/agent_queue_service.rs` makes the tasks dir absolute and sets `current_dir` to its parent
    - Test `crates/lotar-lib/tests/dev732_worker_leaves_its_launchers_folder_test.rs` walks up from the job to the `agent worker` process and checks its cwd. Earlier probes read the runner wrapper's cwd (`.tasks`) or matched the probe's own command line
    - Worker 8934 still runs in `.DEV-728.lotar-removed`, but I left it running: it holds two running T3 jobs, DEV-733's and this one. The fixed build replaces it once installed
    - Three threads (b70b, f878, 3ff69d) worked in this worktree at once; the first two stopped on request (see DEV-729)
