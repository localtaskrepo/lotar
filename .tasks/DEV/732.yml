- date: 2026-11-20T19:53:07.167633+00:00
  author: claude
  text: |-
    Review: passed. The fix is small and correct, and its test fails without it.

    - `eba6d1334` changes `spawn_worker` in `crates/lotar-agent/src/services/agent_queue_service.rs`: the tasks dir becomes absolute and the worker's `current_dir` is set to that dir's parent. Jobs get `LOTAR_TASKS_DIR` = the main checkout's `.tasks` and T3 threads get `--tasks-dir` for it, so for jobs that parent is the main checkout, never a worktree
    - `spawn_worker` is the only place that starts a worker (auto start and `queue resume` both go through it)
    - Test `dev732_worker_leaves_its_launchers_folder_test.rs` passes. In a detached copy with the agent crate reverted to `HEAD~1` it fails (`left: …/launcher`). Note: `-p lotar-lib` doesn't rebuild the root `lotar` binary, so the unfixed run needed `cargo build` first
    - Done when: worker 8934 is gone. The running workers sit in `standards` and in test temp folders; none is in a removed worktree
    - Merge note: `git merge-tree` shows a conflict with main. DEV-733 (`fb454e86c`) changed the same lines of `spawn_worker` (it removes the agent session variables). Keep both changes when rebasing
    - Reran `npm ci` and `npm run lint` (passed). Didn't rerun `npm test` or `npm run smoke`
    - No stray files, no second branch. Nothing filed
