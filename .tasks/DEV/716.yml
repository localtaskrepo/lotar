- date: 2026-11-18T23:25:31.252203+00:00
  author: claude
  text: |-
    A new lotar build that adds a trust source kind no longer untrusts a trusted repository.

    - `crates/lotar-core/src/config/trust.rs`: the record now stores `kinds:` (the kinds its fingerprint covers). `state` checks only sources of those kinds. A record without `kinds:` (older builds) covers `automation`, `agents`, `merge`, so today's trust files stay valid.
    - Still `changed`: an edit to a covered kind, a removed source, or a build that drops a covered kind.
    - Trade-off: content of a new kind that changed between the last `lotar trust` and the upgrade is accepted without review. The older lotar never ran it; the next `lotar trust` covers it.
    - Tests: unit tests in `trust.rs` (added kind, legacy record, dropped kind, `KINDS` complete) and `a_trust_record_from_an_older_build_stays_trusted` in `dev259_workspace_trust_test.rs`.
    - `docs/help/trust.md` updated.
    - DEV-712 (`fbf4982dc`, not on main) also edits `trust.rs`: on rebase, add `waiting_run` to `KINDS`. The `every_source_kind_is_listed` test flags it if missed.
