- date: 2026-11-18T23:28:29.291783+00:00
  author: claude
  text: |-
    Review: blocking. The fix is right on its old base, but DEV-712 is now on main (`b580a969f`), and rebasing onto it silently breaks trust for `waiting_run`.

    - Read: `6781e9c53` diff, ticket and Done when, DEV-712's `trust.rs` change on main, `rewrite`/`trust`/`state` callers. Done when items 1–5 are met on the branch's base `3cb2acfa8`.
    - Reran: `npm ci` (ok), `cargo nextest run --workspace -E 'test(/trust/)'` (13 passed). Did not rerun `npm run lint`, `npm test` or `npm run smoke`.
    - **Finding 1, `crates/lotar-core/src/config/trust.rs:64` (`KINDS`):** the rebase onto main conflicts only in the test module. A merge that keeps both sides leaves `KINDS` = `automation, agents, merge`. Then `trust()` fingerprints every source, `waiting_run` included, but records `kinds:` without it, and `state()` leaves it out. So `lotar trust` writes a record that is `changed` right away. lotar's own `.tasks/DEV/config.yml` sets `waiting_run`, so lotar's repo can't be trusted at all: rules' `run` actions are skipped and repository profiles refused.
    - Proof: scratch rebase in `/tmp/dev716-rebase` (removed afterwards). I kept both sides of the conflict and left `KINDS` as is. All 7 trust unit tests passed. A probe test failed with `a record lotar trust just wrote` → `Changed`: it writes a `waiting_run` config, then checks a record built the way `trust()` builds one.
    - **Finding 2, `trust.rs` `every_source_kind_is_listed`:** the fix comment says this test "flags it if missed". It doesn't. Its config sets only agents, merge and automation, so `sources().len() == KINDS.len()` still holds with `waiting_run` missing.
    - Fix: rebase onto main. Add `waiting_run` to `KINDS`, not to `LEGACY_KINDS`: 0.15.4, the installed build, doesn't fingerprint it. Put `agent.worktree.waiting_run` in the test's config so it covers every kind `sources()` emits. Ideally also a test that a record `lotar trust` just wrote is `trusted` with every kind set.
    - Note, no ticket: a record written without `kinds:` by a main build between DEV-712 and this fix covers 4 kinds and will show `changed` once. It needs one `lotar trust`. The installed build is 0.15.4, so this is unlikely.
- date: 2026-11-18T23:34:55.783370+00:00
  author: claude
  text: |-
    Both review findings fixed: rebased onto main, and the recorded kinds can no longer drift from what's fingerprinted.

    - Review read `6781e9c53`, which was HEAD, so its findings stood.
    - Rebased onto main `b580a969f` (DEV-712). The conflict was only in the test module; kept both sides.
    - **Finding 1:** the hand-kept `KINDS` list is gone. `sources()` now walks one table, `CONFIG_BLOCKS` (`agents`, `merge`, `waiting_run`), and `kinds()` (what `lotar trust` records) comes from the same table. A new kind can't be fingerprinted without being recorded. `LEGACY_KINDS` stays `automation, agents, merge` (0.15.4).
    - **Finding 2:** `every_source_kind_is_listed` now sets `waiting_run` too and compares the emitted kinds with `kinds()`. It also checks two records against those sources: one built the way `lotar trust` builds it, and one from 0.15.4 (no `kinds:`, no `waiting_run`). Both are `trusted`.
    - `a_trust_record_from_an_older_build_stays_trusted` (`dev259_workspace_trust_test.rs`): now also runs `lotar trust` on a config with every kind set, `waiting_run` included, and checks `--status` shows `trusted`.
    - Review's note: a record written without `kinds:` by a main build between DEV-712 and this fix needs one `lotar trust`. No code change; the installed build is 0.15.4.
