description: |-
  Found in DEV-712's review (2026-11-18).

  - DEV-712 adds `agent.worktree.waiting_run` to `TrustService::sources` (`crates/lotar-core/src/config/trust.rs`), and `.tasks/DEV/config.yml` sets it.
  - The merge job lands it with the installed lotar, which doesn't know that source yet: the fingerprint doesn't change, so the merge's re-trust (`merge.rs` `trust`) does nothing.
  - Once the new build is installed, the fingerprint includes `waiting_run`: lotar's repository shows `changed`, rules' `run` actions are skipped and repository profiles refused until someone runs `lotar trust`. DEV-605 (`agent.merge`) had the same step.

  ## Plan
  The trust record lists the source kinds the lotar that wrote it fingerprinted (`kinds:`); its fingerprint covers only those. A record without `kinds:` (written before this change) counts as `automation`, `agents`, `merge`. A later build checks the record against the current sources of those kinds only; sources of a kind the record doesn't list don't make it `changed`. The next `lotar trust` (or a LoTaR edit through `rewrite`) records all kinds. Accepted trade-off: content of a new kind that changed between the last `lotar trust` and the upgrade is accepted unreviewed; the older lotar never ran it.

  ## Done when
  - [ ] A repository trusted by an older lotar (record without `kinds:`) stays `trusted` with this build, and with a later build that adds a kind (unit test simulating the added kind).
  - [ ] A change to a source of a kind the record lists still makes it `changed` (rules, profiles, `agent.merge`), also for a legacy record.
  - [ ] `lotar trust` writes `kinds:` with every kind this build fingerprints; the trust file stays readable by older builds (extra field ignored).
  - [ ] A build that drops a kind the record lists shows `changed` (safe side: needs `lotar trust`).
  - [ ] `docs/help/trust.md` says a new lotar version doesn't untrust a repository on its own.
