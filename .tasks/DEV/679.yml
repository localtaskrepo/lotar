- date: 2026-11-17T22:29:38.755441+00:00
  author: claude
  text: |-
    Fixed: a merge no longer lands lotar's branch or completes while another repo the ticket names still holds unmerged commits on its `agent/<ID>`.

    - Built on `agent/DEV-677` (`a369866a7`, not on main yet): this fix needs its `work_elsewhere`. Merge DEV-677 first; the rebase then drops it.
    - `merge.rs` `land`: checks `work_elsewhere` before the rebase, whether or not lotar's branch is on main, and hands off to the merge agent without landing anything.
    - `agent_job_service.rs` `ensure_branch_merged`: checks `work_elsewhere` before the fast-forward too. Job fails ("Merge job finished, but <ID>'s work is in another repository: ..."), lotar's branch stays unmerged. A handback still wins. `merged_despite_failure` unchanged (it only applies once lotar's branch is on main).
    - New tests in `dev605_merge_without_agent_test.rs`: deterministic hand-off, agent path fails, agent path that lands the other repo completes and lotar fast-forwards. The first two fail without the fix.
    - `docs/help/agent.md`: merge-job paragraph and merge step 1.
