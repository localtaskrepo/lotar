description: |-
  Found (review of DEV-677, 2026-11-17): DEV-677 checks the other repo (merge::work_elsewhere) only when lotar's own branch is already on main. When lotar's agent/<ID> has commits too, Merge::run (merge.rs) rebases and lands it, and ensure_branch_merged (agent_job_service.rs, Ok(false) arm: git merge --ff-only, then Ok) completes the job without asking work_elsewhere. A ticket with work in both repos then goes Done with the other repo's main unchanged. Check: a ticket whose lotar branch and another named repo's agent/<ID> both hold commits beyond their mains; merge job ends completed with the other repo unmerged. Done: the merge (deterministic and agent path) refuses to complete while work_elsewhere finds unmerged commits, with a test.

  ## Done when

  Case: lotar's `agent/<ID>` and another repo's `agent/<ID>` (named by a path in the ticket) both hold commits beyond their mains.

  - [ ] lotar's own merge (`agent.merge`, deterministic): lands nothing and hands off to the merge agent, saying the ticket's work is also in the other repo (`work_elsewhere` text). It checks this before the rebase, whether or not lotar's branch is on main.
  - [ ] After the merge agent exits 0 (`ensure_branch_merged`): while the other repo still holds unmerged commits, the job fails ("Merge job finished, but <ID>'s work is in another repository: ...") and lotar does not fast-forward its own branch, so the ticket doesn't go Done. A handback (agent changed the assignee) wins over that failure, as before.
  - [ ] Merge agent landed the other repo: lotar fast-forwards its own branch as before and the job completes.
  - [ ] Merge agent's runner fails: the job stays failed (unchanged: `merged_despite_failure` only applies when lotar's branch is on main and already checks `work_elsewhere`).
  - [ ] `git` can't judge lotar's branch: passes as before.
  - [ ] Tests in `dev605_merge_without_agent_test.rs` for the deterministic hand-off, the agent path failing, and the agent path completing; each fails without the fix where it can.
  - [ ] `docs/help/agent.md` describes the case.
