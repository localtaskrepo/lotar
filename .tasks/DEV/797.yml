- date: 2026-11-22T21:30:02.840094+00:00
  author: claude
  text: |-
    Done: one merge runs its checks on the machine at a time, and fix, rework and review jobs run only targeted tests.

    - Lock: `crates/lotar-agent/src/services/agent_job_service/checks_lock.rs`, a file lock `checks.lock` in the agent queue folder (`.../agent-queue/`). Any repo, any lotar process. The OS frees it when the holder exits.
    - lotar's own merge takes it before its first rebase when `agent.merge` has checks. A merge agent takes it before it starts (a hand-off keeps it). It is held until the job ends. Waiting is no stall. The log line names the holder; the merge comment says how long it waited.
    - Fallback: if the lock can't be opened, the merge runs without it and says why.
    - Limit: a waiting merge occupies a job slot.
    - Tests: `crates/lotar-lib/tests/dev797_one_merge_checks_at_a_time_test.rs` holds the lock like another process; both paths wait, then run. Merges in one process were already serialized.
    - Prompts: `.tasks/DEV/automation.yml` (fix, work, review, rework, continue, owner-answer: targeted; merge: full suites). Also `AGENTS.md`, `.github/skills/testing-strategy/SKILL.md`, `docs/help/agent.md` ("The checks lock").
    - Standards source `configs/lotar/automation.yml`: the same edit, identical prefix, **uncommitted** in `~/.t3/worktrees/standards/dev-797-targeted-checks`. The standards commit gate (`npm run -s check`) fails on 2 usage-limit tests (STD-130/133, STD-194) that fail on main too; no `--no-verify`.
    - Git hooks unchanged: pre-commit runs staged-file checks, pre-push runs clippy and the typecheck; neither runs test or smoke.
    - Guidance correction: AGENTS.md and testing-strategy now say targeted checks in agent jobs, full suites only at merge.
