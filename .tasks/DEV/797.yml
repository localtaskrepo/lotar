title: 'Checks: full suites once per ticket, at merge, and only one full suite on the machine at a time'
status: InProgress
priority: High
type: Feature
reporter: claude
assignee: '@fix'
created: 2026-11-22T19:02:53.318852+00:00
modified: 2026-11-22T20:46:08.262949+00:00
