- date: 2026-11-26T02:06:23.547836+00:00
  author: claude
  text: |-
    Folded onto DEV-784's socket lock as decided (INBOX-730). `checks_lock.rs` is gone; rebased on `main`, now `164c930dd` (was `3c444f069`).

    - **Hand-off keeps the lock:** in `merge.rs`, the lock taken for a round's checks now lives on the merge. A check that fails twice hands off with it (`Outcome::HandOff(summary, lock)`), and the merge agent keeps it until the job ends. After the checks the lock is still freed, as in DEV-784.
    - **Merge agent takes it:** in `run_job`, a merge agent with no lock yet waits for it on port 47586, in any repo, and holds it until the job ends. This happens before the agent starts, so the wait is no stall.
    - **No self-deadlock:** a merge agent that holds the lock gets `LOTAR_CHECK_LOCK_HELD=1` in its environment. Its prompt also gets a "Check lock" note to run checks with it, because a T3 thread doesn't get the job's environment.
    - **Wait comment:** lotar's merge comment says `Waited <N> for the machine's check lock, held by <holder>`. A merge agent comments the same, ending `; the merge agent starts now.`, or that it starts without the lock.
    - **Cancel:** `lotar agent cancel` from another process ends the wait (`wait_cancelled` in `agent_job_service.rs`), in both paths.
    - `LOTAR_CHECK_LOCK_PORT` moves the lock to another port, in lotar and `scripts/check-lock.mjs`, so the tests hold their own lock and never the machine's.
    - Tests in `dev797_one_merge_checks_at_a_time_test.rs`:
      - lotar's merge waits for another holder.
      - A merge agent waits, holds the lock while it runs and sees `held=1`.
      - A hand-off from the checks keeps the lock.
      - A cancel from another process ends the wait.
    - Updated `docs/help/agent.md` (new section "Merge checks, once and one at a time"). Dropped the unrelated Prettier changes to `AGENTS.md`.
    - Note: dev605 tests timed out once when run without `LOTAR_CHECK_LOCK_HELD=1`: they then wait for the machine's real lock. They passed when run the way the test runner runs them.
