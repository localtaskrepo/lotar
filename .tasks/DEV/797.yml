    - **Cancel from another process:** `checks_lock.rs` wait loop reads `cancel_requested` and ends with `Cancelled`; `a_cancel_from_another_process_ends_the_wait` covers it.
    - **Merge agent's wait comment:** `comment_checks_lock` comments on the ticket; the test checks the comment.
    - Done when is met: the lock is taken before the first rebase only when there are checks, a hand-off keeps it, the merge agent takes it otherwise, fix and review jobs never take it, an unavailable lock lets the merge go on, and the prompts, AGENTS.md, testing-strategy and `docs/help/agent.md` all match. The git hooks are unchanged and don't run test or smoke suites.
    - **Merge note:** `main` moved on. `git merge-tree` shows conflicts in `.tasks/DEV/automation.yml`, `agent_job_service.rs`, `merge.rs` and `integration.rs`, so the merge needs a rebase.
    - Not a finding, just noise: `AGENTS.md` got unrelated Prettier formatting (the skill table realigned, two continuation lines de-indented). Prettier doesn't check that file.

    Filed (minor):
    - [DEV-867](https://lotar.pyxzl.net/task/DEV-867): a merge job taken over after lotar exits (`adopt_orphaned_job` → `finish_orphaned_job`) resumes its merge agent without the checks lock.
    - [DEV-868](https://lotar.pyxzl.net/task/DEV-868): `comment_checks_lock` was inserted under `comment_merge`'s doc comment (`agent_job_service.rs:3808`).
