    Merge stopped: main already has a different machine-wide check lock (DEV-784, `425fe5664`). Which lock should stay?

    - **Main (DEV-784):** `check_lock.rs`, a TCP socket on `127.0.0.1:47586`. It is held only while a merge round's checks run, and the repo's test scripts (`scripts/check-lock.mjs`, `rust-test-runner.mjs`) take it too. It sets `LOTAR_CHECK_LOCK_HELD=1` and is described in `docs/help/agent.md`.
    - **This branch (DEV-797):** `checks_lock.rs`, a file lock on `checks.lock` in the queue folder. It is held from the checks until the job ends, the hand-off to the merge agent keeps it, and the merge agent also takes it. It comments the wait on the ticket.
    - Keeping both would put two locks around the same checks. Picking one, or folding DEV-797's extras (the merge agent takes it, the hand-off keeps it, the wait comment) into DEV-784's socket lock, is a design choice, so I didn't resolve it.
