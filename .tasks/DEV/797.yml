    - Options: (a) rework DEV-797 on top of DEV-784's socket lock, adding only the merge-agent hold, the hand-off and the wait comment, then drop `checks_lock.rs`; (b) replace DEV-784's lock with the file lock; (c) close DEV-797 as covered by DEV-784 and keep only its prompt and doc changes.
