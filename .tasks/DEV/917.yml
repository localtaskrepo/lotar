  text: |-
    Waits for DEV-810: it rewrites the same lines, and this fix must cover its threads found by title.

    - DEV-810 (`1c909e027`, Merging) changes `settle_ticket`, `Thread` and `note` in `crates/lotar-agent/src/services/agent_job_service/kept.rs`, and the fake t3 tests in `dev503_harness_jobs_test.rs`. A fix on today's main would conflict with it in the same lines.
    - Added "## Done when" with the route per status: `completed` through harnessmux as now, other ended statuses through `t3_thread_api::settle_thread`.
    - No code changed yet; no commits on `agent/DEV-917`.
    - Next: once DEV-810 is on main, rebase `agent/DEV-917` onto main, write the failing test (fake `thread show` reads `listed-<id>`), then the fix and docs.
- date: 2026-11-27T04:21:57.250758+00:00
  author: claude
  text: |-
    Fixed: a done ticket's failed, interrupted, cancelled or idle thread is now settled through T3 Code's internal API, `cee8ea772`.

    - Rebased onto main with DEV-810 (`ca8ed67a5`).
    - **Failing test first:** the fake `t3 thread show` now reports the status in `listed-<id>`. The DEV-876 test (`left: []`) and DEV-810's title test (`left: ["thread-0"]`, thread-9 `failed` missing) failed with the old code.
    - **Fix** in `kept.rs` `settle_ticket`: the list's status picks the route. `completed` still goes through harnessmux, which checks `thread show` first. Any other ended status goes through `t3_thread_api::settle_thread` (`thread.settle`), with or without a job log or session. Followed, running and waiting threads are left alone, as before. A failure is noted once per process as `was not settled: <reason>`.
    - **Fake server:** `thread.settle` over `/ws` is now logged as `ws_settle` and marks the thread settled; `settled_threads` counts it. This made two older tests show what happens live: the later job settles the kept thread-0 as it starts (DEV-876), before its own. Their expected order is now `["thread-0", "thread-1"]`.
    - **Docs:** `docs/help/agent.md` says which route each status takes.
    - Diff 44+/17-, so no `small-diff` tag; removed the `waits` tag.
