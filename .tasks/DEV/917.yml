- date: 2026-11-27T09:56:02.189171+00:00
  author: claude
  text: |-
    Review: passed. `cee8ea772` does what "Done when" asks; one minor gap filed as DEV-928.

    - **Read:** `git diff main...HEAD` (`kept.rs`, `dev503_harness_jobs_test.rs`, `docs/help/agent.md`), the ticket, DEV-810, DEV-876, and the newest main commits to these files. It merges into main without conflicts (`git merge-tree`).
    - **Route:** `settle_ticket` (`kept.rs:195`) sends a thread to `t3_thread_api::settle_thread` when the list's status isn't `completed`, and a `completed` one to harnessmux. Threads a session follows are still skipped first. harnessmux 0.3.1 still refuses any status but `completed` (`backend/t3.rs:1098`), so the split is still needed.
    - **Failing test first:** checked in a scratch worktree with main's `kept.rs`. The DEV-876 test (`left: []`) and DEV-810's title test (`left: ["thread-0"]`) fail; with the fix all 10 settle tests pass.
    - **Changed test order** (`["thread-0", "thread-1"]`): this holds. `settle_superseded` at the later job's start sends `thread.settle`, which the fake server now counts. Before, the server logged it as `ws_rename` and didn't count it.
    - **`due` filter_map** (`kept.rs:144`): drops nothing, because `kept` already needs a listed entry.
    - **Docs:** `agent.md` gives the route for each status.
    - **Minor, filed as DEV-928:** the once-per-process `was not settled` note is tested only on the harnessmux route (`organize-error`), not when the internal API fails (`ws-refuse`).
    - No stray files, no second branch. I changed no files; the scratch worktree is removed.
