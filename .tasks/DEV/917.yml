description: |-
  Found in the DEV-810 review (2026-11-26).

  - `kept::settle` (DEV-876, and DEV-810's threads found by title) picks a done ticket's threads whatever their run ended, but `settle_ticket` settles through `settle_session` → `harnessmux::backend::t3::settle` (harnessmux 0.3.0, `src/backend/t3.rs:1033`), which refuses when `t3 thread show` says anything but `completed`: `ended its last run with status 'failed'`.
  - The tests miss it: the fake t3 changes only the list status (`listed-<id>`), `thread show` still says completed (`dev503_harness_jobs_test.rs` DEV-876 test, DEV-810 title test).
  - So live, a failed/interrupted thread of a done ticket logs once `was not settled` and stays in the sidebar; `docs/help/agent.md` says it is settled.

  ## Done when
  - [ ] Failing test first: the fake t3's `thread show` reports the status `listed-<id>` sets, so the DEV-876 test (`failed`, `interrupted`, `cancelled`, `idle`) and DEV-810's title test fail before the fix with `ended its last run with status '<status>'`.
  - [ ] The look (`kept::settle`) settles a done ticket's thread that `t3 thread list` shows unsettled with an ended status other than `completed` through T3 Code's internal API (`t3_thread_api::settle_thread`, `thread.settle`), as `settle_superseded` does: with or without a job log or harnessmux session (DEV-810's threads found by title). The job log (when there is one) and stderr say `Settled the T3 Code thread <link>`.
  - [ ] Which wins: the list's status picks the route. `completed` keeps going through `harnessmux::backend::t3::settle` (its `thread show` check stays); any other ended status goes through the internal API. A thread that still runs or waits, or one a session follows, is left alone, as now.
  - [ ] A settle that fails is noted once per process, `The T3 Code thread <link> was not settled: <reason>`, and the thread stays; the look tries again next time.
  - [ ] `docs/help/agent.md` says which route each status takes.
