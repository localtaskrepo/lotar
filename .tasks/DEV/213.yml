comments:
- date: 2026-10-27T22:49:29.699119+00:00
  text: 'Decided: an explicit per-run model/effort wins. resolve_profile now drops the profile''s own matching flags from its args for that run (--flag value, --flag=value, Codex -c/--config model_reasoning_effort=…; per runner: --model/-m, --effort, --reasoning-effort, -r, --variant), then applies the override; flags not overridden stay. Command/Amp runners keep their args (they use env vars/modes). docs/help/agent.md updated. Tests: run_overrides_drop_the_profiles_own_model_and_effort_flags, run_overrides_replace_model_and_effort_in_profile_args.'
description: 'Found by the DEV-202 live failure scenario: lotar agent run --model X (and the REST/MCP/automation overrides) is ignored when the profile''s args already contain --model; the documented rule is that profile args win over LoTaR''s model/effort flags. That rule makes sense for the profile''s own model/effort fields, but an explicit per-run override probably should win, or at least the run should warn that it was ignored. Decide the precedence; if overrides should win, drop the profile''s own --model/--effort (and Codex model_reasoning_effort) from args for that run.'
