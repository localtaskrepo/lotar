- date: 2026-11-27T03:13:58.767176+00:00
  author: claude
  text: |-
    Review: passed. A taken-over T3 job now pauses on a usage limit; one minor follow-up filed as DEV-920.

    - **Read:** `ad7f33724` (the only commit on `main..HEAD`, merges cleanly onto main), `resumed.rs` `adopt`, `usage_limit_pause`, `pause_queue` and `run_again_in_new_session` in `agent_job_service.rs`, DEV-584 and DEV-901.
    - **Cause holds:** local `job-20261126T204940.803Z-13`'s log says "T3 Code runs the thread of the job job-20261126T204500.272Z-3 again … this job takes it over". `adopt` gave it `request: None`, so `usage_limit_pause` returned `None` and the job failed.
    - **Fix:** `adopt` builds a request from the earlier job's `run_inputs` "User request" or falls back to `GO_ON`. The active-job record (`active_record_of`) now carries the request too, so a takeover by another process can also pause.
    - **Test failed before:** with `resumed.rs` reverted in a scratch worktree, the new test fails with `left: "failed"`, `right: "paused"`, the same line as LOCA-631. With the fix it passes.
    - **Done when:** both points are met. The fix is not tied to a repo or to how long the job ran. "No retry" here means no failure retry: the paused retry after the reset is DEV-584's design.
    - **Minor, filed DEV-920:** a taken-over job writes no `run_inputs` line (job `-13` has 0, job `-3` has 1). A takeover of a takeover, such as LOCA-631's later `job-20261126T231028.491Z-28`, therefore gets the generic `GO_ON` prompt. It still pauses and continues the thread; only a retry in a new session loses the original request.
    - No stray files. `git status` is clean after the checks.
