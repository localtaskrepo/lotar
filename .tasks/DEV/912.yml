- date: 2026-11-27T00:15:04.901603+00:00
  author: claude
  text: |-
    Fixed: a job that took over a resumed T3 Code thread now pauses on a usage limit, like any other job.

    - **Cause:** not the repo, not the amount of work. LOCA-631's job `job-20261126T204940.803Z-13` was a takeover: its log says "T3 Code runs the thread of the job job-20261126T204500.272Z-3 again, with no lotar job; this job takes it over". `adopt` in `crates/lotar-agent/src/services/agent_job_service/resumed.rs` gave such a job `request: None`. With no request, `usage_limit_pause` has nothing to queue as a retry, returns `None`, and the job fails. That failure fired 'Fix failed again: hand to mallox'. DEV-901's job `job-20261126T212746.696Z-71` was a fresh job that lotar started, so it had a request and paused.
    - **Fix:** `adopt` now gives the job a request: the earlier job's profile and its "User request" from that job's `run_inputs` log line. When the log has none, it uses a "go on in this thread" request. The usage-limit pause, the queue pause and the run-again-in-a-new-session path all work for taken-over jobs now.
    - **Test:** `a_taken_over_t3_job_that_hits_a_usage_limit_pauses_and_its_retry_continues_the_thread` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`. Before the fix it failed with status `failed`, the same line as LOCA-631. Now the job is `paused`, no `agent_job_failed` is logged, and the retry is queued on `fix` with `not_before`, `session: continue` and the original request. The retry then sends its turn to the same thread.
