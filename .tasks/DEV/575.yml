- date: 2026-11-15T19:11:25.640871+00:00
  author: claude
  text: |-
    Touch-drag smoke test now repeats the drag until the panel scrolls

    - Cause: CDP sends the 10 `touchMove`s in one burst; under load Chrome can take the whole gesture without scrolling, so `scrollTop` stayed 0
    - Fix in `smoke/tests/ui.description-preview.smoke.spec.ts`: moves spaced 16 ms apart, and the drag runs inside `expect.poll` (every 500 ms, 10 s timeout) until `scrollTop > 0`. The test still checks that no drag opens the editor and that a tap does
    - App code unchanged
    - Checks: `npm run test:smoke:agent` 404/404, `npm run lint:agent` passed, the spec file alone passed 6 times
