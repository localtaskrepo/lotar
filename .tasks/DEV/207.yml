  text: Make the behavior dependent on a config value, and set the default to what you proposed.
- date: 2026-10-27T00:10:37.238780+00:00
  text: 'Done as decided: new agent.worktree.cleanup_ignored_files (default true). Automatic cleanup and lotar agent worktree cleanup no longer count git-ignored files (git worktree remove deletes them anyway) but still refuse untracked/modified files, unmerged branches and the other DEV-53 guards; false restores the strict check. When automatic cleanup keeps a worktree, the job log says why (with an example path) and how to remove it later. Tests: agent_safety_test automatic_cleanup_removes_worktrees_with_only_ignored_files_unless_disabled (both modes) plus the existing safety tests. Docs: agent.md, config-reference.md. Gates: lint, 1736 Rust + 1225 UI, 352 smoke.'
description: |-
  Found in the DEV-201 live run of the agent-pipeline template. cleanup_on_done (and lotar agent worktree cleanup) refuse to remove a worktree whose git status --ignored lists anything, a guard added in the DEV-53 security pass. Agents almost always leave build or test output (__pycache__, node_modules, target/), usually git-ignored, so in practice finished tickets keep their worktree and agent/ branch.

  Options: allow ignored files that git worktree remove would also drop, remove known build output first, or report the reason on the job or ticket so people know why cleanup was skipped. Keep the protection for untracked and modified files. Needs a decision on the DEV-53 rationale before changing it.
