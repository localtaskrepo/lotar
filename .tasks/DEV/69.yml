description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: U14.

  UiModal and bespoke dialogs lack consistent role/title binding, Escape, focus trap/restore, scroll locking and overlay behavior. Provide one accessible primitive and migrate Config, Scan, Automation, SyncHub and native agent confirmations. Acceptance: keyboard/screen-reader tests verify focus containment/restoration, dismissal and safe confirm/cancel behavior at mobile/desktop sizes; remove duplicate dialog CSS. Preserve established UI styling.

