    - `npm test`: the first run failed in `dev510_t3_session_test::…fails_when_t3_cant_list_its_threads` (60 s timeout). That test also fails on main without this change. Its fix is DEV-520's `cdd2141c`, which isn't merged yet. A full `cargo nextest --no-fail-fast` rerun passed 2228/2228.
    - Smoke: the first full run failed `ui.global-actions` desktop at line 121 (Create task panel never closed). DEV-587, which is Done, fixed an earlier wait in the same test. Filed as DEV-597. The rerun passed 405/405.
    - Ticket check: `automation_agent_settings_reach_the_job_they_start` passed 10 of 10 runs with nothing left in `.lotar-test-scratch`.
    - `.tasks` changes amended into `0bff1e4d`. The merge changed `.tasks/DEV/config.yml`, so I ran `lotar trust`; status: Trusted.
    - No push: the unpushed commits start with STD-170's `ee916064`, and STD-170 is HelpNeeded, waiting for the owner's OK. `0bff1e4d` can't be pushed without it.
