- date: 2026-11-18T02:23:00.938271+00:00
  author: claude
  text: |-
    DEV-604's queue pause is rebased onto main on `agent/DEV-686`, with the review finding fixed. Not merged yet.
    - Took `48d4054e6` (`t3/acb65239`, a pure rebase of `e4edce9b`). Merged it with main's memory gate, slot limits and jiff.
    - Fix: `AgentQueueService::take_held_try`. A job held in `lotar serve` takes a due retry only when no held queue entry waits for it, so a pause whose retry left the queue still ends.
    - Regression test `a_job_held_in_serve_takes_the_due_try_when_no_queue_entry_waits` in `crates/lotar-lib/tests/dev604_queue_pauses_test.rs`: fails before the fix (`never started: queued`), passes after.
    - UI: the view files match `48d4054e6` byte for byte. Attached DEV-604's 12 before/after screenshots (`DEV-604-agents-{before,after}-{dark,light}-{390,1440,1920}`), which the earlier review checked.
    - `git merge-base --is-ancestor e4edce9b main` stays false after the merge, because the hash changes. Check for `79ce70782` on main instead.
    - Branches `agent/DEV-604`, `t3/b9902be4`, `t3/09cc8d99`, `t3/ae62354d`, `t3/pause-queue-on-signing-disk-failure` and `t3/acb65239` are not deleted. Their work only lands with this merge, and two worktrees still hold `t3/b9902be4` (mid-rebase) and `t3/acb65239`.
