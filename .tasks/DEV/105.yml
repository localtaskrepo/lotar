description: Standardize Tasks, sprint, and backlog pagination using one accessible numbered footer component. Each sprint and the backlog paginate independently with the existing page-size preference, preserving current ordering, query membership, selection, and closed-sprint behavior. Review and correct control arrangement and dialog layouts across desktop, tablet, mobile, and short landscape windows; common action controls use a36px baseline with non-shrinking square icons and explicit compact utility exceptions. Use responsive sprint form grids, bounded shared dialog sizing/focus behavior, and preserve Tasks deep-link/back/forward pagination. Backlog ordering (DEV-109), server/API shapes, unrelated dialogs, and data-fetch architecture are outside this scope. Existing approved staged work must remain unchanged in the index; requested modifications are layered in the working tree.
