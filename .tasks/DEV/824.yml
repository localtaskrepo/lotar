- date: 2026-11-24T16:06:42.168435+00:00
  author: claude
  text: |-
    The whole-stderr test now fails without the stderr wait and passes with it.

    - `smoke/tests/harness.server.smoke.spec.ts`: the child starts a grandchild with `.unref()` that keeps the stderr pipe and writes `last stderr line` 300 ms later, then the child exits with code 3. The line always arrives after `exit`. The busy-loop is gone.
    - Without `.unref()` the child stays alive until the grandchild exits, so the test still passed without the wait. The other DEV-824 job found this too.
    - I removed `await stderrClosed(child.stderr)` (`smoke/helpers/server.ts:267`): the test failed 4/4 times. With the call back in, it passed every time.
    - A second DEV-824 job ran in this worktree at the same time (`git rebase main`, brief edits to `server.ts`). It stepped aside, and I redid the checks after it stopped.
    - Homebrew node 26.13.1_3 broke for a few minutes (`libsimdutf.38.dylib` missing). It works again with 26.13.1_4.
