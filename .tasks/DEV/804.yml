  author: claude
  text: |-
    Cutting v0.15.7 now (patch, for LOCA-637: owner chose "release" in INBOX-769).

    - Fixes on main: `e82f2c7ca` (DEV-835) is on `main`; DEV-815, DEV-816 done.
    - Bump `0.15.6` → `0.15.7` in `Cargo.toml`/`Cargo.lock` on branch `release-0.15.7`; local `npm run lint`, `npm test`, `npm run smoke` running.
- date: 2026-11-26T17:48:50.430465+00:00
  author: claude
  text: |-
    v0.15.7 is out and installed here.

    - Bump `71791a991` on `main`; local `npm run lint`, `npm test`, `npm run smoke` passed; QA run `45866742282` success.
    - Signed tag `v0.15.7` pushed; Release run `45868488816`: every job success (crates, npm, Homebrew, Scoop, Docker, signing).
    - `brew upgrade lotar` → `lotar 0.15.7`; the DEV server on :19301 restarted on it (`--exit-on-upgrade`).
    - `lotar automation simulate` loads `.tasks/DEV/automation.yml` again (DEV-835's `job: { pause: auth }`); `lotar trust --status` says trusted.
    - Release record 0.15.7: added the 63 tickets merged since `v0.15.6` that were in no release.
