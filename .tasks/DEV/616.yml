    Duplicate fix run stood down: the resumed first job's thread is fixing this on `agent/DEV-616`.

    - Both runs found the same cause: the page drops an in-flight preview on any SSE task event or reconnect (`view/pages/Dependencies.vue` `changed()`), and the watcher in `crates/lotar-lib/src/web_server.rs` can report the fixture's pre-start writes late.
    - I sent my notes and draft test change to that thread. Nothing committed from this run, and I left status and assignee unchanged.
