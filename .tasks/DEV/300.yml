  text: '1. config show: the text output now prints review.reviewers (when set), plus the sync (reports_dir, write_reports) and agent (context_enabled, context_extension) settings that only JSON showed. New source labels so explicit-only and --explain modes label them. 2. ls/tasks --help: already fixed by DEV-281 (both print the list/task help), no change. 3. changelog: git failures were already reported since DEV-283 (bad ref exits 1 with the git error), no change. 4. Sync auth: a value shaped like a variable name (capitals, digits, _) that is not set is now an error naming the variable, instead of being sent as the token (401); other values are still used literally. The provider unit test was updated; docs/help/sync.md explains it. 5. A sync with failed items now reports status ''partial'' (CLI JSON, REST, MCP, report) and the CLI exits 1 after printing; the Sync page shows ''Some failed''. sync.md, openapi and types.ts were updated. Tests: tests/dev300_cli_sync_followups_test.rs (3, with an in-process failing HTTP stub) plus sync/auth/config suites (109 tests total with DEV-301), clippy and eslint clean.'
description: |-
  Small issues noticed while fixing DEV-289, DEV-293 and DEV-294; not fixed there.
  - `lotar config show` text output omits review.reviewers (the JSON output has it). (DEV-293)
  - `lotar ls --help` and `lotar tasks --help` print 'No help available'. (DEV-293)
  - `lotar changelog` reports 'No task changes' when git fails, instead of the git error (src/main.rs). (DEV-289)
  - Sync: when the token_env variable is unset, its name is sent as the token, so the remote answers 401 rather than LoTaR saying the variable is missing. (DEV-294)
  - Sync: a run with failures still exits 0 and reports status ok. (DEV-294)
