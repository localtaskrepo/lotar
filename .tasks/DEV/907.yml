- date: 2026-11-26T23:33:26.297174+00:00
  author: claude
  text: |-
    Review: passed. `a81285e07` does what "Done when" asks, checked on top of main.

    - **Base:** DEV-905 (`a9459740d`) is on main now, so the "Needs DEV-905" caveat is gone. `a81285e07` cherry-picks cleanly onto main (auto-merge in `source_labels.rs`, `resolution.rs`).
    - **Ticket check** (main + fix, `HOME` in a temp folder, `LOTAR_IGNORE_HOME_CONFIG=0`, repo sets `enabled`/`build_root`, home sets `max_parallel_jobs: 3`): the YAML has `agent.worktree` with all 12 keys: `enabled: true # (global)`, `build_root: /tmp/builds # (global)`, `max_parallel_jobs: 3 # (home)`. That's the only `(home)` line.
    - **Wider home file** (port, priority, tags, sprints, branch aliases, worktree): each key it sets is `(home)` in both YAML and JSON. Defaults the installed build marked `(home)` (`set-reporter`, `tags-from-path`, `reports_dir`, …) now show `(default)`. Nested sprints keys still get `(home)`.
    - **Test fails before the fix:** with the fix's code reverted, the `lotar` binary rebuilt and only the new test kept, `config_show_full_with_home_config_shows_worktree_and_labels_unset_keys_default` fails at `config_explain_test.rs:62`. With the fix it passes.
    - **Reran:** `cargo nextest run -p lotar-lib --test integration -E 'test(config)'` (281 passed), `cargo nextest run -p lotar-core config` (53 passed), `cargo clippy -p lotar-core -p lotar-lib --all-targets -D warnings` (clean), `rustfmt --check` on the 4 files (clean). `npm ci` ran OK. Not UI work, so no screenshots.
    - **Scope:** no stray files, no second branch. The `source_label_for_global` signature cleanup is small and stays inside the fix.
    - No findings, no tickets filed.
