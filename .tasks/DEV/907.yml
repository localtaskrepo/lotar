comments:
- date: 2026-11-26T21:02:05.539044+00:00
  author: claude
  text: |-
    Fixed: `config show` YAML now has an `agent.worktree` block, and a key the home config doesn't set is no longer labelled `(home)`.

    - **YAML:** `render.rs` writes `agent.worktree.*` under `agent:` (12 keys, each with its own label). Before, only the JSON had them.
    - **Labels:** `source_labels.rs` now credits home only for keys the `~/.lotar` file sets (`home_layer_keys()`). Before, it compared values, and every unset key in the parsed home config holds the default, so all defaults matched. `source_label_for_global` now takes the scope context instead of 7 arguments.
    - **Needs DEV-905:** that branch (Reviewing, not merged) makes the merge and labels of `agent.worktree` work key by key. Without it the repo's `enabled`/`build_root` are still lost and `max_parallel_jobs` shows `(default)`. With `b3d0631fd` applied on top, the ticket's check shows `enabled: true # (global)`, `build_root: /tmp/builds # (global)`, `max_parallel_jobs: 3 # (home)`, and nothing else `(home)`. The two branches apply cleanly together.
    - **Test:** `config_show_full_with_home_config_shows_worktree_and_labels_unset_keys_default` in `crates/lotar-lib/tests/config_explain_test.rs`. It doesn't depend on DEV-905.
    - `dev61_reference_kinds_test` fails here with or without this change: that's DEV-906, the `target` link to `/Volumes/Builds`.
