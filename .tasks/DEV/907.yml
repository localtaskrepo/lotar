description: |-
  Found by the DEV-905 job (2026-11-26), also with the installed build: in a workspace whose `.tasks/config.yml` sets `agent.worktree.enabled` and `build_root`, and a home config that sets only `agent.worktree.max_parallel_jobs`, `lotar config show --explain --full` prints no `agent.worktree` keys, and every key the home config doesn't set is labelled `(home)`. JSON (`--format json`) has the values and labels the repo's keys `global` after DEV-905.

  Check: the command above with `HOME` pointing at a temp folder and `LOTAR_IGNORE_HOME_CONFIG=0`.

  Done when: the YAML shows `agent.worktree.*`, and a key the home config doesn't set isn't labelled `(home)`.
