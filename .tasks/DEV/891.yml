- date: 2026-11-26T19:44:15.109415+00:00
  author: claude
  text: |-
    Added the missing test: a finding joins an InProgress bundle whose fix job takes the message.

    - Branch fast-forwarded to main (`577caa2ff`), which has DEV-864 (`eeb1ad55d`).
    - New test `a_finding_joins_an_in_progress_bundle_whose_fix_job_takes_the_message` in `crates/lotar-lib/tests/dev800_finding_bundle_test.rs`.
    - Stand-in session: the test answers on harnessmux's socket for session `dev891-fix` (scratch `HARNESSMUX_HOME`), as a session owner does, and records the prompt.
    - `lotar add --finding b:y --bundle health` runs in its own process and reaches the job through that socket.
    - Asserts: `state: bundled`, id `REPO-1`, the message starts "A new finding joined REPO-1" and holds the `## Red CI` section with ``Finding: `b:y` ``, and the bundle lists `a:x` and `b:y`.
    - Unix only (`#[cfg(unix)]`): on Windows harnessmux uses named pipes.
