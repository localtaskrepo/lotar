description: |-
  Found in the review of DEV-864 (`78263b6a8`).

  - `crates/lotar-lib/tests/dev800_finding_bundle_test.rs` tests only the refusals (gone session, merge job) and that `FindingService::open_bundle` returns the job.
  - The path the feature exists for is untested: `lotar add --finding --bundle` sends the section through `tell_running_job`, gets `true`, and the finding joins the bundle (`state: bundled`).

  ## Done when

  - [ ] A test runs `lotar add --finding <key> --bundle health` against an InProgress bundle whose fix job takes the message (a harnessmux session this test owns, or a stand-in), and asserts the message text arrived and the output is `{"state": "bundled"}` with the bundle's id.
