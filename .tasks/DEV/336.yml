  text: 'claude: Fixed. The test setup now clears every config env override (ENV_OVERRIDE_DEFINITIONS in src/config/env_overrides.rs, LOTAR_DEFAULT_REPORTER included) at process start: src/lib.rs for the lib tests, which had no LOTAR env reset at all, and reset_lotar_test_environment in tests/common/mod.rs for the integration tests. Check passes. With LOTAR_DEFAULT_REPORTER=claude set: npm test passes (1995 Rust, 1441 frontend), npm run lint passes. npm run smoke fails 3 tests with the variable set (same leak in the smoke harness, filed as DEV-338) and passes without it. Commit 882f082, pushed to origin/main.'
