description: 'Found (DEV-335, 2026-11-11): with LOTAR_DEFAULT_REPORTER=claude in the environment, as the fix-agent prompt in .tasks/DEV/automation.yml asks, npm test fails in services::relationships::dev15_relationship_cases::graph_filters_share_identity_dates_sprints_and_needs_semantics (tests/common/dev15_relationship_cases.rs:619, 0 nodes instead of 1): the env var beats the fixture''s default.reporter, so @ME no longer matches alice_smith. env -u LOTAR_DEFAULT_REPORTER npm test passes. Check: LOTAR_DEFAULT_REPORTER=claude cargo nextest run --lib graph_filters_share_identity_dates. Done: tests don''t read the caller''s LOTAR_DEFAULT_REPORTER (the shared test setup clears it), so npm test passes with it set.'
