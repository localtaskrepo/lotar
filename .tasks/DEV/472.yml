  text: 'Done in commit 91013e15 on agent/DEV-472. session: continue and the unmerged-work continuation (session: new) now take the ticket''s newest earlier thread of the job''s own agent profile, and fall back to the newest thread when that profile has no earlier job. session: fresh still builds on the newest thread. The job log header now records agent_profile, so jobs from earlier lotar processes count too; old logs without it count as another profile. When a later thread''s worktree holds the branch (a fresh review), LoTaR commits what that worktree left uncommitted, detaches it and checks the branch out again in the continued thread''s worktree. If git can''t, the job starts a new thread and the log says why. Test: dev318 a_rework_continues_the_fix_thread_after_a_fresh_review_took_its_branch covers fix, fresh review, rework with continue in the fix worktree, a second fresh review that reads the rework commit, then a rework with session new. It fails without the change. Docs: agent.md, automation.md, config-reference.md (which also gained the missing fresh value). Checks: npm run lint, npm test (2134 Rust, 1515 UI, plus release and hook tests), npm run smoke (390) all pass. Still open: the comment naming the release that has this, for standards STD-88. The release agent adds it once this ships.'
