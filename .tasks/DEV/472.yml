description: |-
  A rework after a blocking review starts a new T3 Code thread instead of going back to the fix agent's thread. Together with the fresh review thread and the inbox triage this gives each ticket 3 to 9 top-level threads, which the owner can't follow or tell apart (owner 2026-11-13, standards STD-88: "every task creates 3 threads in t3 so that it becomes overwhelming to handle and read and keep correlated").

  ## Found

  - 2026-11-13, about 10:40Z to 11:05Z: DEV-470 got 9 threads (7 job threads, 2 inbox triage), DEV-466 and DEV-468 got 4 to 5 each.
  - standards `configs/lotar/automation.yml`, rule "Review blocked: back to @fix": the rework runs with session `new`. The ticket's newest earlier thread is the reviewer's (Codex), which has unmerged work on the branch but another model, so the job starts a new thread on the branch (docs/help/agent.md, "Continuing the ticket's last thread"). `session: continue` doesn't help: it takes the newest thread too, so the rework would run in the reviewer's thread on the reviewer's model.

  ## Fix

  - When a job continues an earlier thread (`session: continue`, or `new` with unmerged work), take the ticket's newest earlier thread from a job of the same agent profile. With none, keep today's behaviour (newest thread for `continue`, a new thread on the branch for `new`). So the rework on `@fix` continues the `@fix` thread, a merge (no earlier `@merge` job) still continues the newest thread, and a retry on `@fix-codex` still gets a thread of its own.
  - The earlier thread's worktree was detached when the fresh review took the branch. Free the branch from the later thread's worktree the same way `session: fresh` does today (commit what it left uncommitted, detach it) and check it out again in the earlier thread's worktree. Its worktree is gone: a new thread on the branch, as today, and the log says why.
  - Works with DEV-468 (every job of a ticket uses the ticket's agent branch).

  ## Check

  A test: `@fix` commits, a `session: fresh` review on another provider blocks, the rework on `@fix` with `session: continue` runs `t3 thread send <the fix thread>` in the fix thread's worktree on the ticket's branch, and the next fresh review reads the rework commit.

  ## Done when

  - [ ] `session: continue` and the unmerged-work continuation pick the newest earlier thread of the job's own profile, with the test above.
  - [ ] docs/help/agent.md says so.
  - [ ] A comment here says the release that has it, so standards STD-88 sets `session: continue` on its three rework rules.
