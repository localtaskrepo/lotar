- date: 2026-11-25T21:42:33.214544+00:00
  author: claude
  text: |-
    Fixed: a job that waited in the in-process pending queue now builds its prompt from the ticket when it starts.

    - `PromptInputs::build` (`crates/lotar-agent/src/services/agent_job_service.rs`) holds the prompt building that `start_job_inner` used to do inline; create calls it, and so does `PendingJob::current_prompt` in the spawned start thread of `process_pending_queue`.
    - The job keeps its runner, profile and config from create: only the prompt (ticket context, comments, instructions, notes) is rebuilt.
    - If the ticket or instructions can't be read at the start, the job starts with the prompt built at create.
    - Test `a_job_from_the_pending_queue_builds_its_prompt_when_it_starts`: renames the ticket while its job is held for memory and checks the new title. It fails without the fix.
    - Docs: `docs/help/agent.md` (max_parallel_jobs paragraph).
    - With DEV-845 (`agent/DEV-845`, Merging): the stored `user_prompt` is already filled with the title from create. When the branches are combined, `current_prompt` should fill `${{ticket.title}}` from the raw request with the current title.
