- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3A45021289cd79c488d60288becfc5eda4ec7b52ab4dbb85e9b913bbd7438a6255
description: |-
  Found: reviewing DEV-845. `AgentJobService::create` (`crates/lotar-agent/src/services/agent_job_service.rs:499`) builds the whole prompt (ticket context, filled `${{ticket.title}}`) and stores it in `PendingJob`; `process_pending_queue` (`:6176`) starts it with that text, so a job held there (memory hold, slot wait, paused queue) gets the title and context from when it was queued. DEV-845 covers the persistent queue only.
  Check: rename a ticket while its job waits in the in-process pending queue; the started prompt shows the old title.
  Done: a job from the pending queue builds its prompt from the ticket when it starts.

  ## Done when
  - [ ] A job that waited in the in-process pending queue (memory hold, slot wait, paused queue, busy merge slot) starts with a prompt built from the ticket as it is at the start: its "Ticket context" (title, status, description, relationships, comments) and the request text with `${{ticket.title}}` filled from the current title (with DEV-845).
  - [ ] The job keeps its settings from create (runner, profile, config): only the prompt is rebuilt.
  - [ ] A job that starts at once is unchanged: one prompt, built at create.
  - [ ] Rebuilding fails at the start (ticket unreadable, instructions file gone): the job starts with the prompt built at create, not lost.
  - [ ] A test renames the ticket while its job waits in the pending queue and sees the new title in the started prompt.
