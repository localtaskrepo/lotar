- date: 2026-11-26T17:35:50.629580+00:00
  author: claude
  text: |-
    Review: passed. A job from the in-process pending queue now starts with a prompt built from the ticket as it is then, title in the request text included.

    - Read: `dad9f916b` (diff against `main`), the ticket and its comments, DEV-845, `AGENTS.md`, and the main commits to `agent_job_service.rs` since the rebase (`17cd3a49f` DEV-884, `fd6d2b098` DEV-882).
    - Merge: `git merge-tree --write-tree main HEAD` is clean against main `70f1095a0`.
    - Reran in a scratch copy with main merged in: `cargo nextest run -p lotar-agent agent_job_service` passed (104 tests), `cargo clippy -p lotar-agent --all-targets` passed. `npm ci` passed.
    - Test failed before: with `PendingJob::current_prompt` set back to return the prompt from create, `a_job_from_the_pending_queue_builds_its_prompt_when_it_starts` fails.
    - Done when holds: `PendingJob` keeps the raw `request`. `PromptInputs::build` fills `${{ticket.title}}` and rebuilds the context. `process_pending_queue` is the only way a job leaves that queue, so memory holds, slot waits, a paused queue and a busy merge slot are all covered. Runner, profile and config come from create. A job that starts at once builds its prompt once. A missing ticket or instructions file falls back to the prompt from create.
    - Docs: one sentence added in `docs/help/agent.md`. No stray files.
    - Tickets filed: none.
