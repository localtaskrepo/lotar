- date: 2026-11-26T01:57:50.195942+00:00
  author: claude
  text: |-
    Review: blocking. The branch conflicts with main, and once it is rebased a queued job's request text still has the title from create (DEV-845 is on main now).

    - Read: `3818258e2` (the diff against its base `22f3333bc`), the ticket, DEV-845 and its commit `99c261083` on main, and `AGENTS.md`.
    - Reran: `cargo nextest run -p lotar-agent a_job_from_the_pending_queue` passed. `npm ci` (repos.json install) passed. The worktree is unchanged.
    - Holds: the job keeps the runner, profile and config it was created with. A job that starts at once is unchanged. An unreadable ticket or a missing instructions file (`read_instructions` returns Err) falls back to the prompt built at create. Docs: `docs/help/agent.md`.
    - **Blocking 1, conflict:** `git merge-tree --write-tree main HEAD` reports a conflict in `crates/lotar-agent/src/services/agent_job_service.rs`. Main's `start_job_inner` (main `:386`) now does `user_prompt = fill_ticket_title(req.prompt.trim(), &task.title)` at create, and the branch moved that block into `PromptInputs::build`. Fix: rebase onto main.
    - **Blocking 2, Done when item 1 is not met:** after the rebase, `PendingJob.user_prompt` already has the title from create filled in. `PendingJob::current_prompt` (`agent_job_service.rs:195`) rebuilds from it, so a rule prompt like `"${{ticket.id}} ${{ticket.title}}"` still starts with the old title. The fix agent's own comment names this as open. Fix: keep the raw request in `PendingJob`, or read it from `state.request`. Then fill it with `fill_ticket_title(raw, &task.title)` in `current_prompt`, and pass that text to `run_job` as its `user_prompt` too, so `context_messages` match. Extend the test with a request that contains `${{ticket.title}}`.
    - Not blocking: the test calls `current_prompt` directly, not through `process_pending_queue`. Without the fix it doesn't compile (the method doesn't exist), so there was no run that failed before the fix.
- date: 2026-11-26T06:58:42.319200+00:00
  author: claude
  text: |-
    Fixed both review findings. The branch is rebased onto main, and a queued job now fills `${{ticket.title}}` with the title the ticket has when the job starts.

    - **Blocking 1 (conflict):** rebased onto main `eb9b383f7`. Main's prompt building, including the `job_reporter` line for T3 notes, now lives in `PromptInputs::build` (`crates/lotar-agent/src/services/agent_job_service.rs`).
    - **Blocking 2 (old title in the request text):** `PendingJob` keeps the raw `request`. `PromptInputs::build` fills the title itself and returns the prompt together with the filled request text. `process_pending_queue` passes both to `run_job`. If the ticket can't be read when the job starts, the job falls back to the prompt and request text built at create.
    - Test `a_job_from_the_pending_queue_builds_its_prompt_when_it_starts` now queues `"${{ticket.id}} ${{ticket.title}}: do the thing"`, renames the ticket, and checks that the started prompt and request text have the new title. With the old rebuild from the filled `user_prompt`, the test fails.
    - Commit `dad9f916b` (amended, signed).
