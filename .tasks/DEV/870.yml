  ## Done when
  - [ ] A job that waited in the in-process pending queue (memory hold, slot wait, paused queue, busy merge slot) starts with a prompt built from the ticket as it is at the start: its "Ticket context" (title, status, description, relationships, comments) and the request text with `${{ticket.title}}` filled from the current title (with DEV-845).
