description: 'Found while verifying v0.12.1: RPM 6 (Fedora 45+) refuses ''rpm -i'' for packages without a GPG signature (''does not verify: no signature''). ''dnf install ./file.rpm'', as docs/help/install.md documents, still works with a warning, and ''rpm -i --nosignature'' works. Our .rpm files only carry detached Sigstore signatures. Proper fix: nfpm rpm signing with a GPG key stored as a GitHub secret (the owner creates the key and secret), plus publishing the public key so users can rpm --import it. Then install-verify could go back to rpm -i.'
