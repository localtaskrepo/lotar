- date: 2026-11-13T03:34:23.894208+00:00
  author: claude
  text: 'Done in be55b934 on agent/DEV-408. A new t3 job now reads the earlier thread''s provider and model from t3 thread show (providerInstanceId, model). Same provider and model, or nothing set on the profile: it continues the thread as DEV-377 made it. Another provider or model: it starts a new thread with --worktree <open branch> and the profile''s provider and model, and its prompt names the earlier thread. T3 Code runs plain git worktree add, which refuses a branch that is checked out in another worktree. So to free the branch LoTaR first commits what the earlier thread left uncommitted (''<ID>: uncommitted changes from the earlier thread''), then detaches the earlier worktree with git switch --detach, which keeps its files. If git can''t do either, the job continues the earlier thread and logs why. Docs: docs/help/agent.md. Tests: a new one, a_job_on_another_model_starts_a_new_thread_on_the_unmerged_branch, plus the DEV-377 same-profile test (now sharing a setup helper) and the thread-show parse unit test. Checks: npm run lint:agent clean; npm test passed (2120 Rust tests plus UI, release and hooks; merge_jobs_are_serialized_even_with_parallel_slots was flaky and passed on retry, and it doesn''t touch this code); npm run smoke passed (385). Not checked against a live T3 Code server: the t3 CLI is the fake from the tests. The detached earlier worktree isn''t removed by cleanup_on_done, which looks worktrees up by branch, so it stays until someone removes it by hand.'
