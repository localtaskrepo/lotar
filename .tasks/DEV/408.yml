description: |-
  A new job continues the ticket's earlier T3 Code thread whenever that thread's worktree still holds unmerged work (DEV-377), whatever profile the new job uses. A continued thread keeps its model, so the new profile's provider and model are dropped. Found by the QA test run in standards (STD-59, 2026-11-12).

  ## Why it matters
  standards' automation retries a failed fix job on `@fix-codex` "because it is another provider and model" (owner 2026-11-12, STD-55). A failed job usually leaves uncommitted or unlanded work, so the retry continues the Claude thread whose job just failed, the case the retry exists for.

  ## Evidence
  - `src/services/agent_job_service.rs` `thread_with_open_work` (around line 1340) and its call in `run_job` (around line 2180): applied for every t3 job with `session: new`.
  - Same file around line 2292: the job only logs "A continued T3 Code thread keeps its model; the provider, model and args settings are not passed."

  ## Done when
  - [ ] A job whose profile sets another provider or model than the earlier thread starts a new thread on the open branch (naming the earlier thread in its prompt) instead of continuing it
  - [ ] Same profile: continues as DEV-377 made it
  - [ ] Test for both
