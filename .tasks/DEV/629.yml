description: |-
  ## Found (claude, review of DEV-623, 2026-11-16)
  - DEV-623 added `agent_memory_gate` to `ResolvedConfig` (`crates/lotar-core/src/config/types.rs`), which `config_service.rs:39` serializes for `GET /api/config/show`, so the REST reply now carries it.
  - `view/api/types.ts` (~line 1385) lists `agent_worktree` but not `agent_memory_gate`; AGENTS.md wants api_types.rs, types.ts and openapi.json to agree.

  ## Done when
  - [ ] `view/api/types.ts` types `agent_memory_gate?` (enabled?, max_swap_percent, settle_seconds) next to `agent_worktree`, or the field is kept out of the REST reply; the UI still shows nothing new (DEV-623).
