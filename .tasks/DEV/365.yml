description: |-
  ## Found
  While fixing DEV-362 (2026-11-11): a rule condition written with the alias `labels:` or `task_type:` never fires on a real update, while the same condition written as `tags:` or `type:` does. docs/help/automation.md uses `labels` as an alias in `set`, and matching accepts both aliases for the current value.

  ## Cause
  `matches_field_map` (src/services/automation_matching.rs) reads the current value for `labels` and `task_type`, but in `MatchMode::OnChange` it looks the change up with `changes.changed_field(&field_key)` under the alias name. `ChangeSet::new` records the changes only as `tags` and `type`, so the lookup finds nothing and the condition fails. The `changes:` group probably has the same problem with the aliases. `update_match` (DEV-362) also only collects the names in `CHANGE_FIELDS`, so simulate says nothing about these aliases.

  ## Check
  In a scratch workspace with `LOTAR_IGNORE_HOME_CONFIG=1`: rules `when: { labels: { any: [t] } }`, `when: { tags: { any: [t] } }`, `when: { task_type: Bug }` and `when: { type: Bug }`, each with `on: updated: comment: <name>-fired`. Run `lotar task edit SC-1 --tag t` and `lotar task edit SC-1 --type Bug`. Only tags-fired and type-fired are added.

  ## Done
  `labels`/`tags` and `task_type`/`type` match the same way in field conditions and in `changes`, on real updates and in `lotar automation simulate`. A test covers both aliases.
