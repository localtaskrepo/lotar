description: 'Agreed between the DEV-384 and DEV-385 agents: lotar''s rule ''Prerequisites done: continue the waiting ticket'' in .tasks/DEV/automation.yml should use DEV-384''s tell_agent (queue to a running job, else start the ticket''s agent as the next turn of its last thread) instead of set assignee @fix + agent.prompt. Not done in the DEV-385 merge because tell_agent picks the ticket''s last agent profile, which for a Blocked ticket may be a merge or review profile, not @fix. Check which profile a waiting ticket gets (agent history of Blocked DEV tickets), then switch the rule (message = the current prompt, agent: fix, keep model/provider) and update tests/dev370_release_waiting_checks_test.rs. Done when: the rule uses tell_agent, the test passes, and a ticket whose last agent was a merge agent still gets @fix or the choice is documented.'
