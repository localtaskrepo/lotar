  text: 'claude: Done in d1d5ed2. Finding: DEV-361 and DEV-364 went Blocked after a merge agent handed them to mallox, so their last agent profile was @merge. tell_agent picked that over its agent setting, and a finished @merge job sets Done. Keeping set assignee @fix next to tell_agent doesn''t work either: the assignment starts a job without the message. Choice (code): tell_agent now uses the ticket''s assignee when that is an agent profile, else tell_agent.agent, else the last profile in history (ticket_agent in src/services/automation_service.rs, docs/help/automation.md, types.rs doc). Before, agent was only used for a ticket that never had one. No rule used tell_agent before this, so nothing else changes. Rule ''Prerequisites done: continue the waiting ticket'' now uses tell_agent with agent: fix and the old prompt as message, and keeps model/provider. tests/dev370_release_waiting_checks_test.rs gives DEV-2 a merge-agent handback and asserts @fix: it failed without the code change (got @merge) and passes with it. Checks: npm run lint:agent clean, npm test passed (2081 Rust, 1472 UI, release, hooks). npm run smoke: the first run had 1 failure I didn''t capture; a rerun with the same binary passed 381/381.'
