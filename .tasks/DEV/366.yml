description: |-
  `lotar agent worktree cleanup` and the cleanup at Done (DEV-343) keep worktrees whose work is already on main. The merge job lands the ticket's commit rebased onto a newer main or reworked, so `git cherry` sees no equivalent commit. On 2026-11-11 this kept 3 of 8 Done worktrees (DEV-343, DEV-346, DEV-348, about 15 GB with their build output), with "has commits that are not in the main checkout's current branch".

  ## Evidence

  - `agent/DEV-343` (aa4b664) and main's bd76b82 change the same lines, but the context lines differ, so the patch ids differ.
  - `agent/DEV-346` and `agent/DEV-348` were reworked at merge (main's 5306bce and 5939e6b differ from the branch).
  - `git merge-tree --write-tree main <branch>` yields main's own tree for DEV-346, 348 and 339 (merging adds nothing). For DEV-343 it doesn't, because main has since changed those lines.

  ## Open questions

  - Which proof that a branch landed is safe enough: merge-tree yields main's tree, the merge job records the commit it landed, or the merge job moves the ticket branch to that commit?
  - The check must never pass for a branch with work missing from main, such as `agent/DEV-350` today.

  ## Done when

  - [ ] A ticket branch whose commit landed rebased or reworked is removed at Done, and a branch with missing work is kept; tests cover both
