  text: 'Claude (DEV-366 agent job): Done in commit 22b2f9c. Proof chosen: merge-tree. branch_landed still tries git cherry first. If that fails, the branch counts as landed when merging it into HEAD, or into a main commit since the fork point that touched the branch''s files, gives that commit''s own tree (git merge-tree --write-tree). This can''t pass for a branch whose changes main lacks. The commit scan covers main changing the same lines again later. ensure_branch_merged (merge jobs) uses the same check; I removed its duplicate git cherry block. Docs: docs/help/agent.md. Run by hand against the real branches: DEV-339, 346 and 348 pass; DEV-350 is kept (work missing). DEV-343 is still kept: main''s bd76b82 holds different content than aa4b664 in agent_job_service.rs (main kept a cherry block the branch removed), so merging conflicts at every main commit. Only a record of what the merge job landed could clear it; that would be a follow-up if wanted. Test: agent_safety_test git_required::done_removes_the_worktree_once_its_work_landed_reworked_and_keeps_missing_work (fails without the fix). Checks: npm run lint, npm test (2006 Rust + 1444 frontend; on the first run dev279 jobs_in_another_process_are_seen_guarded_and_cancelled failed once under load, then passed alone and on the full rerun), npm run smoke (379 passed).'
