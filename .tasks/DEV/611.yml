  text: |-
    Review: passed. No blocking findings; one minor ticket filed. I didn't rerun the tests (machine overloaded).

    - Read: `3cf93d5e` diff, the ticket's "Done when", DEV-603, the harnessmux 0.1.9 registry (`save`/`remove`/`validate_name`) and `Session::start`, `earlier_sessions_text`, and main's recent commits to the touched files
    - Every "Done when" point is met. `keep_session` moves the log, then saves the kept record as `ended` with no owner, then removes the old record. A kept name like `<name>.<stamp>` passes harnessmux's name check (64 characters max, `.` allowed). The job keeps a session only when its record has the new session's name. Any other profile's session is just named, with its own log path. A failed keep ends the job failed before any session starts
    - If the rename succeeds but the save fails, the old record stays and the log sits under the kept name. Nothing is lost, and the next keep (same stamp) adds the record back
    - Earlier sessions: the `{prefix}.` match lists kept rounds of a job that has no profile. Kept rounds of a profile already matched `{prefix}-`
    - Branch vs main: DEV-603 is on main as `17e19601`. Its code and docs are identical to this branch's `685654c4` (only `.tasks` differs), so that commit drops on rebase. `git merge-tree` applies `3cf93d5e` onto main cleanly
    - Test-first: the fix agent says the new test failed on the unfixed code. I didn't rerun it
    - Minor: [DEV-621](https://lotar.pyxzl.net/task/DEV-621). There's no test for a failed keep or for the t3 handoff's thread line
    - No UI changes, no stray files, no owner decisions involved
