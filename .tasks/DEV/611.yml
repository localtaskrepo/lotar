  text: |-
    Done: a skipped idle session is kept as `<name>.<last used>` before the new session takes its name; the handoff names that log (and the T3 Code thread for `t3`).

    - `agent_runner::keep_session`: moves the record and `.events.jsonl` to `<name>.<YYYYMMDDTHHMMSSZ>` (name cut to 64), state `ended`, no owner
    - `run_job`: keeps only when the skipped session has the new session's name; a merge skipping the review's session keeps nothing (nothing is replaced) and names that session's log. Keeping fails → the job fails, no session starts
    - `handoff_text`: adds the event log path and, for `t3`, `agent_session` (the thread)
    - `earlier_sessions` also matches `<prefix>.…`, so later jobs list the kept round
    - Test `a_skipped_session_is_kept_and_the_handoff_names_its_event_log` (`dev503_harness_jobs_test.rs`); `docs/help/agent.md` updated
    - Built on DEV-603, which isn't on main yet: cherry-picked `d9e58bcb` as `685654c4`
    - Running threads DEV-598, DEV-599 merges: not about sessions/handoff, not contacted
