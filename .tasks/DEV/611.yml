description: |-
  Found in the review of DEV-603 (`d9e58bcb`).

  ## Found
  When a `session: continue` job skips an idle session of its own profile (a fix rework after a blocking review), it starts a new session under the same name. harnessmux `Session::start` (`harnessmux-0.1.9/src/session.rs:100`) calls `registry.remove(&name)`, which deletes the old record and its `.events.jsonl`. The handoff (`handoff_text` in `agent_job_service.rs`) then names that session and its last-used time, but its log is gone, and later jobs' "Earlier agent sessions" lose that round too. Only the t3 runner keeps the old T3 thread.

  ## Done when
  - [ ] A `continue` job that skips its own profile's idle session (past `continue_within_minutes`) keeps that session before the new one replaces it: its event log and record move to `<name>.<last used, YYYYMMDDTHHMMSSZ>` in the harnessmux sessions folder (the name cut to fit harnessmux's 64 characters), the kept record closed (`ended`), so nobody resumes or sends to it.
  - [ ] Keeping it fails (a rename or write error): the job fails with that error and starts no session, so nothing is deleted.
  - [ ] A skipped session of another profile (a merge past the time that would have continued the review's session) stays where it is; the new session has another name and replaces nothing.
  - [ ] The handoff names the skipped round's event log by its path as it is now (the kept one, or the other profile's own), and for a t3 session its T3 Code thread (`record.agent_session`) too.
  - [ ] Later jobs' "Earlier agent sessions" list the kept round like any other earlier session.
  - [ ] Other replacements (`session: new`/`fresh`, a closed or unusable session) still replace the old session as before: out of scope.
  - [ ] A test: a fix rework past `continue_within_minutes` whose prompt names the kept event log, which exists and holds the first round; the next job's earlier sessions list it.
