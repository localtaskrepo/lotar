description: |-
  Found in the review of DEV-931; it is not caused by that change.

  ## Found
  - `cargo nextest run -p lotar-lib --test integration -E 'test(=dev503_harness_jobs_test::a_job_records_its_turn_and_reads_only_that_turns_conversation)'` fails 3 of 3 times when run alone, on `agent/DEV-931` and on `main` at `c518a585d` (a detached copy).
  - `crates/lotar-lib/tests/dev503_harness_jobs_test.rs:226`: the first job's transcript refs are `[]`, the test expects `[1]`.
  - It also fails with `LOTAR_TASKS_DIR` and `LOTAR_WORKSPACE_ROOT` unset. The run was inside an agent job (macOS, 2026-11-27).
  - The other 77 dev503/dev510 tests pass. The merge's `test:agent` will likely fail on it.
  - Possibly related: DEV-918 (transcript reader `candidates()`, now merging), DEV-909 (added the test).

  ## Done when
  - [ ] The cause is found: the code or the test.
  - [ ] The test passes alone and in the suite on `main`.
