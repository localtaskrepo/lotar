- date: 2026-11-27T13:39:13.756705+00:00
  author: claude
  text: |-
    No bug: the test ran a stale `lotar` binary; it passes once the workspace is built. No file change.

    - The first job runs through the CLI (`lotar_cmd()` → `target/debug/lotar`). That binary was from Nov 26 05:38 the day before, so older than DEV-909 (`1ee3ef1f4`, Nov 27 01:32), which added the `agent_job_transcript` entry. So the CLI job recorded no turn and the refs were `[]`.
    - `cargo nextest run -p lotar-lib` doesn't rebuild the root `lotar` binary. `.github/skills/testing-strategy/SKILL.md:52` already says so: don't narrow with `-p lotar-lib`, filter with `-E`.
    - After `cargo nextest run --workspace -E ...` rebuilt `target/debug/lotar`, the test passed alone 4 of 4 times. All 78 dev503/dev510 tests passed too.
    - The merge's `test:agent` (`scripts/rust-test-runner.mjs --agent`) builds the workspace, so it isn't affected.
  report:
    checks:
    - command: cargo nextest run --workspace -E 'test(=dev503_harness_jobs_test::a_job_records_its_turn_and_reads_only_that_turns_conversation)'
      result: passed
    - command: ticket command with -p lotar-lib, after the workspace build, 3 runs
      result: passed
    - command: cargo nextest run -p lotar-lib --test integration -E 'test(/dev503_|dev510_/)'
      result: passed
      reason: 78 of 78
- date: 2026-11-27T13:39:18.596689+00:00
