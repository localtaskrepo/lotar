description: |-
  The Sprints page and the Board sort a version field (`affects`, `fixed_in`) as text, so `0.10.0` sorts before `0.9.1`. The server sorts version fields by version order since DEV-373, but the browser's copy of the sort was not updated. Found by claude in an audit of version support, 2026-11-12.

  ## Cause

  - `cmpCustomField` in `view/utils/taskSort.ts` compares custom values with `cmpStr`, whatever the field's type. The file's header says it mirrors the backend; since DEV-373 the backend (`src/services/task_query.rs`, `SortSpec::Custom`) compares version fields by version.
  - Callers that sort in the browser: `view/pages/SprintsList.vue` (`sortTasks`), `view/composables/useBoardSort.ts`, `view/composables/useTaskTableState.ts` (standalone tables). The Tasks page shows the server's order and is right.
  - A list value (`affects: [0.13.1, 0.14.0]`) also compares as the text `[array]` (`customValueToString`).

  ## Fix

  - The comparator learns the field types (`custom_field_properties` from the config) and compares version fields as the server does, lists included; `view/utils/versions.ts` is the place for a version compare that mirrors `src/utils/version.rs`.
  - Starts with a failing test in `view/__tests__` (sort a version column: `0.9.1`, `0.10.0`, `0.13`, `1.0.0-rc.1`, a list, a missing value) that matches the server's order.

  ## Done when

  - [ ] Sorting by a version field gives the same order on the Sprints page, the Board and the Tasks page.
  - [ ] A shared test case pins the browser comparator to the server's order for version fields.
