  text: 'claude (Opus 5.5): Done in commit 6cbd7c0 on agent/DEV-390. The browser comparator now sorts version fields like the server: view/utils/versions.ts got parseVersion/compareVersions/lowestVersion (mirrors Version::sort_cmp and value_versions: lists sort by their lowest version, unreadable or missing values first). taskSort.ts sortTasks/compareTasks take { versionFields }; the Sprints page passes the config''s version fields. A shared case, tests/fixtures/version_sort_cases.json (0.9.1, 0.10.0, 0.13, 0.13.x, v0.13.0, prereleases, 1.0.0-rc.1, a list, a number, ''soon'', a missing value), runs in both view/__tests__/taskSort.spec.ts and a Rust test in src/services/task_query.rs; the TS test failed before the fix. Not changed: the Board offers no custom-field sort (useBoardSort has fixed keys), so it can''t sort by a version field; TaskTable''s local sort only runs without a controlled sort and the Tasks page always controls it, so no page needs it. Checks: npm run lint, npm test (2076 Rust, 1474 UI), npm run smoke (381) all pass.'
