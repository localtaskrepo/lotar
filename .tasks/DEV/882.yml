comments:
- date: 2026-11-26T02:14:30.503383+00:00
  author: claude
  text: |-
    Jobs now record when they were queued, and every memory-gate hold is kept in a history that `lotar agent queue holds` lists.

    - Job `queued_at`: taken from the queue entry when the worker starts it, or the job's own time when `lotar serve` holds it as queued. It is stored in the job log header and shown in `AgentJob` (`agent status`, `list-jobs --format json`, `GET /api/jobs`). A job that started right away has none.
    - Hold history: `memory_gate::check` adds each hold that ends (reason, since, until) to `memory-gate-<hash>-holds.jsonl` next to the state file, keeping the last 1000. A hold ended by two processes is listed once.
    - `lotar agent queue holds` lists the holds plus the one in effect: since, until, minutes, reason. JSON gives `holds[]` with `seconds`.
    - Contract: `api_types.rs`, `view/api/types.ts`, `docs/openapi.json`, `docs/help/agent.md`.
    - Tests: unit tests in `memory_gate.rs` (recorded once, a failed reading ends a hold, history cap). `dev623_memory_gate_test.rs` covers `queued_at` in `list-jobs` and the hold in effect in `queue holds`.
