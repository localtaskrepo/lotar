- date: 2026-11-26T07:08:46.490085+00:00
  author: claude
  text: |-
    Review: passed. `4a46916a2` records `queued_at` on jobs and keeps a memory-gate hold history, as the ticket asks. One minor doc issue, filed as DEV-894.

    - Read: the diff `main...HEAD` (12 files, no `.tasks` or stray files), the ticket, DEV-827, AGENTS.md, and the recent main commits to `memory_gate.rs`, `agent_job_service.rs` and `handlers/agent.rs`.
    - Done-when: the queue entry already had `queued_at`. Jobs now carry it in the record, the log header and `AgentJob`. Each hold's reason, start and end go to `memory-gate-<hash>-holds.jsonl`, and `lotar agent queue holds` reads it. The REST contract agrees across `api_types.rs`, `view/api/types.ts` and `docs/openapi.json`. No UI change.
    - Main is 9 commits ahead. `git merge-tree` merges cleanly, and main adds no new `JobLogHeader`/`AgentJobRecord` literals that would lack the new field.
    - Reran: `npm ci` passed. `cargo nextest run -p lotar-agent -E 'test(/memory_gate|queue/)'` passed (34 tests), including the two new tests. `cargo nextest run -p lotar-lib -E 'test(/dev623|contract|openapi/)'` passed (76 tests).
    - Manual: `lotar agent queue holds` in a scratch tasks dir prints "held no jobs", and JSON prints `{"holds":[]}`.
    - Minor, filed as [DEV-894](https://lotar.pyxzl.net/task/DEV-894): `docs/help/agent.md` says `created_at` is when a job left the queue. For a job that `lotar serve` holds, the job's record keeps `created_at` = `queued_at`. Only the saved log header uses the start time.
    - Not blocking: `park()` (`agent_queue_service.rs:304`) resets `queued_at` when a job waits for prerequisites. This behaviour predates this change.
    - Not rerun: `npm run lint`, `npm test`, `npm run smoke` (the merge runs them, DEV-797).
