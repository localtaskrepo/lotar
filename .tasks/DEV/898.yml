description: |-
  Found in the review of DEV-887.

  - `crates/lotar-agent/src/services/disk_gate.rs:427` `state_path` hashes `queue_hash(tasks_dir)` raw. DEV-837 added it on main after DEV-887 branched, so DEV-887 keys queue, lock, memory gate, active jobs and end actions by `canonical_tasks_dir` but not this file.
  - Effect: `.tasks` vs its absolute path, or `/tmp` vs `/private/tmp`, read different disk-gate state.

  ## Done when

  - [ ] `disk_gate::state_path` hashes `canonical_tasks_dir(tasks_dir)`, like `memory_gate::state_path`.
  - [ ] A test: a hold recorded with `.tasks` is read with the absolute path.
