description: |-
  ## Found

  In foundera (FND-23), two agent worktrees lost the same 28 tracked files and nothing else: FND-9 (removed since, FND-21) and FND-14 (`~/.t3/worktrees/foundera/agent-FND-14-108cbf1865fd4c51`, still there).

  - FND-14 went Done at 18:45:24 UTC (`claude`, `lotar status` from its agent). The worktree folder changed at 18:45:27, `node_modules/.pnpm` last at 18:46:20, with 157 of 501 entries left. FND-9 lost its files the minute its merge agent set Done.
  - `status_changed` in `crates/lotar-agent/src/task_hooks.rs` calls `cleanup_done_ticket_worktree` in the same process, here the agent's `lotar status` CLI. `remove_worktree` (`agent_job_service.rs:2651`) then runs `git worktree remove` in the foreground and ignores the result.
  - git deletes entries in directory order (APFS order, the same in every worktree of a repo). It got past the top-level tracked files that come before `node_modules`, then stopped in `node_modules/.pnpm`, most likely because the agent's command or job was killed. The admin dir `.git/worktrees/<id>` and the `.git` file are still there. A clean git failure deletes them both (tried in a scratch repo), so git was killed and did not fail on its own.
  - Result: the worktree is still registered, `git status` shows only ` D` lines, the next cleanup refuses it as "uncommitted", and repos.ts reports it as a leftover worktree with 28 changes.

  ## Check

  `git -C <worktree> status --short` shows only ` D` lines in an agent worktree whose ticket is Done.

  ## Done when

  An interrupted cleanup can't leave a half-removed worktree:
  - Rename the worktree out of the way first (one rename on the same filesystem), drop its git entry, then delete the renamed folder. An interruption leaves only a folder of trash.
  - Or run the removal where an agent's end can't kill it, and have a later cleanup finish a worktree whose only changes are deletions of files that are still in HEAD.

  Add a test for the interrupted case. `remove_worktree` should also log a failure instead of ignoring it.
