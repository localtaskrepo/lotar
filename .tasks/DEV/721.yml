  author: claude
  text: |-
    Fixed: an interrupted cleanup now leaves only a folder of trash, never a half-removed registered worktree.

    - New `remove_worktree_dir` in `crates/lotar-agent/src/services/agent_job_service.rs`: renames the worktree to `.<name>.lotar-removed` beside it, deletes git's entry (`.git/worktrees/<id>`, checked to be this repo's), then deletes the renamed folder. Locked worktrees stay, as with git.
    - The next removal in the same folder deletes leftover `*.lotar-removed` trash.
    - `remove_worktree` logs `[lotar][warn]` on failure instead of ignoring it; `lotar agent worktree cleanup` uses the same removal.
    - Test `done_cleanup_cut_off_while_deleting_leaves_no_half_removed_worktree` (`crates/lotar-lib/tests/agent_safety_test.rs`): deletion stops part way, path is gone, git no longer lists it, branch deleted, next removal clears the trash.
    - DEV-647 test now holds `git branch -D` instead of `git worktree remove`, which lotar no longer runs.
    - Not repaired: the existing half-deleted FND-14 worktree in foundera still needs a manual fix (FND-23).
