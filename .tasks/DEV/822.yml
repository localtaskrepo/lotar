description: 'Found 2026-11-22 (DEV-808): with lotar 0.15.6, `lotar --tasks-dir .tasks priority AR-1 High` in a workspace whose rule has `run: ''pwd > out.txt''` fails with "Automation rule ''r'' failed on AR-1: IO error: No such file or directory (os error 2)" and the command never runs. `--tasks-dir ./.tasks`, an absolute path and no flag all work. Likely the run''s working folder is the tasks dir''s parent, which is the empty path for `.tasks`. Check: a test with `--tasks-dir .tasks` and a run that writes a file. Done: the run runs in the workspace root.'
