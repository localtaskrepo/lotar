- date: 2026-11-25T07:53:18.166830+00:00
  author: claude
  text: |-
    Review: passed. A run now starts in the workspace root with `--tasks-dir .tasks`.

    - Reviewed `f52bafbb5` (the only commit in `main..HEAD`; no newer ticket-branch commits). It merges cleanly onto main `8180a5e1e` (`git merge-tree`).
    - Fix in `crates/lotar-core/src/workspace.rs:54,88`: a relative `--tasks-dir` or `LOTAR_TASKS_DIR` is joined to the working folder. The other resolution branches were already absolute, so `resolve_run_cwd` (`crates/lotar-agent/src/services/automation_service.rs:1607`) and the other `tasks_dir.parent()` callers get a real workspace root.
    - Repro in a scratch git repo with `LOTAR_TRUST_ALL=1`: installed 0.15.6 fails with `IO error: No such file or directory (os error 2)`. The branch build writes `out.txt` holding the workspace path. This confirms the new test `cli_bare_relative_tasks_dir_runs_in_workspace_root` covers a real failure.
    - Side effect, reviewed and accepted: `config show` now prints the absolute path for a flag or env tasks dir. The two tests that changed for this only follow the new output; no docs quote the old output.
    - Reran: `npm ci`, the 3 touched tests, `cargo clippy --all-targets --all-features -D warnings`, `cargo fmt --check`, `npm run test:rust:agent` (2479 passed). Not rerun: the UI and JS lint (no frontend change) and `npm run smoke` (the fix agent ran it: 407 passed).
    - No UI change, no stray files, no owner decision touched. No minor tickets filed.
