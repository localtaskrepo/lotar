comments:
- date: 2026-11-23T06:52:40.712608+00:00
  author: claude
  text: |-
    Fixed: a run now starts in the workspace root with `--tasks-dir .tasks`.

    - Cause: `Path::new(".tasks").parent()` is the empty path, and `resolve_run_cwd` (and other `tasks_dir.parent()` callers) used it as the workspace root.
    - Fix in `crates/lotar-core/src/workspace.rs`: a relative `--tasks-dir` or `LOTAR_TASKS_DIR` is joined to the working folder when it is resolved.
    - New test `cli_bare_relative_tasks_dir_runs_in_workspace_root`: failed before the fix, passes now.
    - `config show` now prints that path as absolute; two identical tests that matched `../other/tasks` now match the path's tail (`project_integration_test.rs`, `relative_path_parent_search_test.rs`).
    - Checks ran with `RUSTC_WRAPPER=`: sccache couldn't create its temp folder in the sandbox.
  report:
    commits:
    - hash: f52bafbb5
      what: relative --tasks-dir and LOTAR_TASKS_DIR made absolute at resolution
    checks:
    - command: npm run lint:agent
      result: passed
