- date: 2026-11-21T04:11:32.549937+00:00
  author: claude
  text: |-
    Cause found: a paused job kept recording the owner's changes as its outcome until its end finished, then dropped them.

    - The queue reads paused before the job ends (its `job_paused` rules, log, cleanup); in that window `lotar assignee TEST-1 sam` was held as the paused job's outcome ("sam will be assigned when job … ends") and deleted at `unregister`. The retry then applied the carried `mallox`.
    - Repro without load: a `job_paused` rule in the test holds the job's end until the owner reassigns; failed at `dev604_queue_pauses_test.rs:253` before the fix.
    - Fix: `close_outcome` in `agent_active_jobs.rs` ends the job's outcome guard when it pauses (`carried_outcome_of`), so later changes apply directly and the retry's change gives way.
- date: 2026-11-21T04:15:51.543540+00:00
  author: claude
  text: |-
    Fixed: an owner's change while a paused job still ends now applies and stays.

    - `carried_outcome_of` (`agent_job_service.rs`) now calls the new `close_outcome` (`agent_active_jobs.rs`): it marks the job ended, so `record_outcome` refuses later changes and they apply directly; the outcome file stays for the job's end if the pause itself fails.
    - Covers both pause paths: full disk / signing (`pause_queue`) and usage limits (`usage_limit_pause`).
    - Test: `a_full_disk_pauses_every_job_until_one_completes` holds the paused job's end in a `job_paused` rule until the owner reassigns; it failed before the fix, without load. Unit test in `an_outcome_recorded_after_the_job_ended_is_refused`.
    - Note: `npm run smoke:agent` doesn't exist; ran `test:smoke:agent`.
