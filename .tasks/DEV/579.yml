    Note: DEV-581 covers part of the build-reuse proposal above.

    - It changes `prepare_worktree` in `agent_job_service.rs` so that a headless job reuses the T3 thread's worktree that already has `agent/<ID>` checked out, which leaves one worktree and one `target/` per ticket in that case.
    - `e2f4698d` doesn't touch that file, so the two don't conflict.
