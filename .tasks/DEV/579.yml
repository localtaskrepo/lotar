- date: 2026-11-15T20:40:48.024583+00:00
  author: claude
  text: |-
    Quick win done: one local build profile; a worktree's tests + lint + smoke now take 2.3 GB instead of 3.3 to 6.1 GB, and the smoke build step takes 2.5 s instead of 29 to 92 s.

    **Before** (cold with sccache warm, load 25 to 50, so times are rough)
    - `npm test` (`local`): 46 s, 1.9 GB; one rebuild after a change adds 0.6 GB (incremental)
    - `npm run build:smoke` (`smoke`, opt-level 2): 92 s cold, 29 s after a change, 0.74 GB
    - clippy (`dev`): 20 s, 0.62 GB
    - raw `cargo nextest run` (`dev` with debug info, as agents run it): 31 s, +2.9 GB
    - One worktree: 3.3 GB for the gates, 6.1 GB with a raw run. Seen today: `agent-DEV-576` had `debug` 2.6 GB + `local` 2.0 GB

    **After** (`e2f4698d`)
    - `dev` takes `local`'s settings (no debug info, dependencies at opt-level 2); `local` and `smoke` are gone
    - `npm test` passes `--cargo-profile dev`: 46 to 58 s (load 50 to 79), 1.9 GB. Without it cargo uses its `test` profile, which rebuilt dependencies (26 s instead of 4 s)
    - `build:smoke` is `cargo build --bins --tests`, the same build: 0.2 s with nothing changed, 2.5 s after `npm test`, +0 GB. Plain `cargo build` would have built about 0.6 GB again, because `tempfile` (a dev dependency) turns on `rustix` and `fastrand` default features
    - Smoke runs the unoptimized `target/debug/lotar` at the same speed (A/B: 6.1 s vs 5.5 s)
    - Lint + tests + smoke in one worktree: 2.3 GB in `target/debug`, about 1 GB (30%) less per job; −2.9 GB more where an agent ran raw dev builds

    **Changed**: `Cargo.toml`, `package.json`, `scripts/rust-test-runner.mjs` and its test, `smoke/helpers/binary.ts`, `scripts/screenshots.mjs`, `scripts/generate-test-tasks.mjs`, docs and skills (`testing-strategy`, `smoke-suite-debugging`, `smoke.instructions.md`). Callers searched in lotar, `~/Development` and open DEV tickets: none left. CI keeps `ci` and `release`.

    **Not changed**: the owner's decision of 2026-11-13 (STD-95: build output stays until Done). Every job still gets a new T3 worktree, so a ticket with fix, review and merge holds about 3 × 2.3 GB until Done.
