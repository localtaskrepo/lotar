- date: 2026-11-15T20:41:01.370006+00:00
  author: claude
  text: |-
    Question for mallox: which part of lotar should become its own crate first: (A) agent jobs and automation, (B) MCP, (C) sync, or (D) move agent jobs out into a project of their own? I recommend A.

    **Why the split** (lines of Rust today)
    - `lotar-lib` src ~72k: services 37k (agent jobs, runner, queue, automation 13.4k; sync 5.4k; sprints 3.1k), cli 19k, mcp 9.1k, routes and web server 5.3k. `lotar-core` 24k (DEV-499). Tests 59k, one integration binary.
    - Most of this month's tickets change agent jobs, yet every change rebuilds all 72k lines and links all 59k lines of tests.
    - (A) crate `lotar-agent`: `agent_*`, `automation*`, the runner; with its own tests a change there builds and tests about a fifth of lotar-lib. Then MCP and sync the same way.
    - (D) goes further: agent job orchestration beside harnessmux, with lotar as one user. That's the "small and focused" rule from STD-131, but it's the most work.

    **More proposals, for you to decide later**
    - Reuse builds between a ticket's jobs: review and merge start in a new T3 worktree with a cold build (1 to 2 min, 2.3 GB each). lotar could copy the earlier worktree's `target/` as an APFS clone (`cp -c`, no extra disk until something rebuilds). That needs a change to the job start, and T3 Code creates the worktree.
    - Once a later job of the ticket has its own build, remove the earlier worktree's `target/`. That changes STD-95 (keep builds until Done), so it's your call.
    - One shared `CARGO_TARGET_DIR`: not proposed. DEV-574 found that cargo's lock would serialize parallel jobs.
    - harnessmux: one profile already, 0.9 to 1.6 GB per worktree (`DEV-510`, `DEV-578`), 5.7 GB in the main checkout, 2.5 GB of worktrees now. The same fix applies: `[profile.dev] debug = false` (or `"line-tables-only"`), plus `--cargo-profile dev` for nextest in its AGENTS.md. Not measured there yet; a small ticket in harnessmux once you agree.
- date: 2026-11-15T20:41:49.151211+00:00
  author: claude
