    Owner's answers filed as three follow-up tickets; the code change stays `e2f4698d`, ready for review.

    - Split, option A ("Okay, A sounds good", 2026-11-17): [DEV-634](https://lotar.pyxzl.net/task/DEV-634), crate `lotar-agent` for agent jobs, queue, runner and automation, measured before and after.
    - Copy builds over, not with T3-made worktrees ("not really willing to let t3 handle worktrees again"): [DEV-635](https://lotar.pyxzl.net/task/DEV-635). lotar's own `prepare_worktree` clones `target/` with `cp -c` from the ticket's earlier worktree or the main checkout; a failed clone falls back to a cold build; STD-95 unchanged.
    - harnessmux ("a ticket once measurements are in"): [DEV-636](https://lotar.pyxzl.net/task/DEV-636), measure first, then dev profile without debug info, kept only if smaller and not slower.
    - No new file changes, so the checks from `e2f4698d` stand; not rerun.
