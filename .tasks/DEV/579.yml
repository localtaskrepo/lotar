description: |-
  Owner, 2026-11-15, in his words: "we need to find a solution for the space being used up. Tasks need to clean up after them properly. At least on lotar we need to do something to optimize the build and development process." Related standing rule (owner 2026-11-15, STD-131): keep projects small and focused; lotar is the example of one that got so big it's hard to change, with long build times.

  ## Found today
  - Disk filled (2.3 GB free of 926 GB): ~230 GB of target/ folders in ~/.t3/worktrees, 5-35 GB per lotar worktree. After a cleanup they regrew ~60 GB in an hour of busy jobs (DEV-574 comment).
  - One worktree builds several profiles side by side (target/debug, target/local, target/smoke, target/release, coverage), each a full build; every new worktree starts cold. sccache exists but fails in sandboxed jobs (Operation not permitted, STD-125).
  - DEV-574 removes build output when a job's worktree is cleaned up, but builds are kept until the ticket is Done (standards owner decision), so active tickets still pile up.

  ## What
  1. Measure first: size and build time per profile, per job type (fix, review, merge), cold vs warm; what each job actually needs to build (a review often needs only the tests the diff touches; a merge only the gate).
  2. Quick wins, each with its measured effect: fewer profiles per worktree (e.g. smoke and local reuse one profile, or dev profile with debug = 0/line-tables-only), one shared build cache that works inside the sandbox (sccache fix or a shared CARGO_TARGET_DIR per repo with cargo's lock), review/merge jobs reuse the fix job's worktree and build instead of a new one, build output removed when a job ends unless the next step of the same ticket reuses it.
  3. Larger: which parts of lotar should become smaller crates or separate projects so a change builds and tests only its part (continues DEV-499's workspace split), as a proposal for the owner.

  ## Done when
  - [ ] Measurements in a comment: disk and build time per profile, cold and warm, and per job step (lint, tests, smoke), before and after.
  - [ ] Quick wins done in lotar, each with its measured effect: one local build profile instead of `dev` + `local` + `smoke`; `npm test`, clippy and `npm run smoke` share `target/debug`; `npm run build:smoke` builds nothing after `npm test`.
  - [ ] Nothing slower: smoke runs on the unoptimized binary in the same time (A/B on the same specs), and `npm run lint`, `npm test`, `npm run smoke` pass.
  - [ ] No caller left on the removed `local`/`smoke` profiles: scripts, smoke helpers, CI, docs, skills; open tickets and other repos checked. CI keeps `ci` and `release`.
  - [ ] The owner's decision of 2026-11-13 (STD-95: build output stays until Done) stays as written; changing it, a shared target dir, and job worktree reuse are proposals, not done here.
  - [ ] The larger split (smaller crates or projects) as a proposal, with one HelpNeeded question to the owner (mallox).
  - [ ] The same treatment proposed for harnessmux.
