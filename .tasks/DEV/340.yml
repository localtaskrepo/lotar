  text: 'The merge agent''s job job-20261112T020243.242Z-8 failed: lotar agent logs job-20261112T020243.242Z-8. The fix is on branch agent/DEV-340. Try again with lotar automation run "Health: retry with @fix" --select ''id:DEV-340'', or for an agent''s ticket lotar assignee DEV-340 @fix.'
