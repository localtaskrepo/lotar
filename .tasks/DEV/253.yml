  text: 'Plan: multi-agent review (user opted in). 9 read-only reviewers in parallel: (1) storage/core/config/YAML compat, (2) REST+SSE+web server + contract parity (src/api_types.rs, view/api/types.ts, docs/openapi.json), (3) MCP + agent jobs + automation, (4) CLI + help, (5) sync/scanner/git/identity, (6) frontend, (7) docs accuracy/readability, (8) performance with large seeded workspaces, (9) security + release/install tooling. Each area''s findings go to an adversarial verifier that re-reads code and reproduces where feasible; only confirmed findings are reported. Reviewers make no file, ticket or git changes; repros use temp workspaces, never port 8080 or the DEV backlog. Then: dedupe, rank, report, one DEV ticket per confirmed actionable issue.'
