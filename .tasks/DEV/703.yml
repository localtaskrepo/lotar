- date: 2026-11-18T06:11:04.439834+00:00
  author: claude
  text: |-
    Review: blocking. `b5d8f1c9a` conflicts with DEV-697 on main, and resolving it the branch's way brings the DEV-697 bug back.

    - **Read:** the ticket, its comment, DEV-697/DEV-693, `docs/help/agent.md` (job history), `git log -5 main` for `agent_job_service.rs`. `npm ci` passed in this worktree.
    - **Base is stale:** the branch forks at `f0fc02a1f`. Main has gained `c763f96e9` (DEV-697) since, which rewrote `ticket_keeps_its_jobs` (`crates/lotar-agent/src/services/agent_job_service.rs:3133` on main) so that `TaskLookupError::Ambiguous` → keep. Applying `b5d8f1c9a` to main gives a content conflict in that function and in the test module.
    - **Bug if the branch's side wins:** at `agent_job_service.rs:3134` the branch does `let Ok(location) = …resolve_task_location(..) else { return false };`, which also drops the logs of an ID held by several roots. Checked in a scratch copy of main with the branch's function: `old_job_log_of_an_ambiguous_ticket_stays` fails. It also contradicts main's `docs/help/agent.md:485` ("… or whose ID several tasks roots hold" is never removed).
    - **The fix itself is right:** with main's function, the new test `old_job_logs_of_archived_and_malformed_tickets_go` fails (the archived Todo ticket's log stays), so the bug is real and the test catches it.
    - **Fix:** rebase onto main and merge the two versions: match on `resolve_task_location` first: `Ok(location) => !location.archived && ticket_done_state(..).is_none_or(|done| !done)`, `Err(Ambiguous { .. }) => true`, `Err(NotFound(_) | Invalid(_)) => false`. Keep both tests and DEV-697's doc comment wording plus "archived whatever its status". In a scratch copy of main this version passed all 4 `dev21_ticket_done_state_tests`.
    - **"Done when" gap:** item 4 should also say that jobs of an ID held by several roots still stay (DEV-697), so the rework can't lose it.
    - **Reran:** `cargo nextest run -p lotar-agent dev21_ticket_done_state_tests` on the branch passed (3/3). I didn't rerun full lint/test/smoke: the branch needs a rebase before they mean anything. No UI changes; no stray files.
