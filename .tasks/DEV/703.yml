  text: |-
    Tests added; they found and I fixed a bug: an archived ticket with an open status kept its old job logs.

    - New test `old_job_logs_of_archived_and_malformed_tickets_go` in `crates/lotar-agent/src/services/agent_job_service.rs`: a 15-day-old log of an archived Todo ticket and one with header ID `not-a-ticket` both go; an open ticket's log stays
    - Bug: `ticket_keeps_its_jobs` checked the status before the archive, so an archived Todo ticket counted as open. `docs/help/agent.md` says archived tickets' logs go. Now: no resolvable location or archived → logs go; otherwise kept unless done (unreadable files still kept)
    - Mutation check: making either case return true fails the test with its own message
    - Description: added the bug and a fourth "Done when" item
