  text: |-
    Agent jobs now comment as their agent: `LOTAR_DEFAULT_REPORTER` is set to the runner's name, and t3 jobs are told the value.

    - `job_env` (`crates/lotar-agent/src/services/agent_job_service.rs`) sets it to the runner (`claude`, `codex`, …); the profile's `env` value wins; `command` runners get none
    - t3: the "This job" notes say `Put LOTAR_DEFAULT_REPORTER=<name> in front of every lotar command`; name from `provider` (`claudeAgent` → `claude`), the profile env value if set, else "your agent name (claude, codex)" when no provider
    - The job's name replaces a reporter the serving lotar process inherited; a command's own prefix or `lotar add --reporter` still wins
    - End-to-end tests in `dev503_harness_jobs_test.rs`: a fake claude agent's `lotar comment` is by `claude` even with `LOTAR_DEFAULT_REPORTER=person` inherited, by `reviewer-bot` when the profile sets it; a t3 prompt names `claude` / the generic text
    - Docs: `docs/help/agent.md` (environment, T3 Code threads), `environment.md`, `identity.md`
    - Left open for DEV-796: whether `@agent` in `comment.author` matches these names
    - Follow-up idea, not done: the standards prompts' "Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name" sentences (18 in `configs/lotar/automation.yml`) are now redundant
    - No guidance correction
