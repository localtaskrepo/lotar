      - [x] lotar: a t3 job asks for `{"summary": string}`. A submitted `summary` becomes the job's last message (its summary) in place of the final reply's text; the reply stays in the log. Status, assignee and the hand-off still come from the ticket; nothing else is read from the result. A missing result, or one without a `summary`: the job's last message is the final reply as today, and the log says "The agent submitted no result …". Other runners don't change.
