- date: 2026-11-26T01:26:18.391829+00:00
  author: claude
  text: |-
    Question: what should the typed result from `t3_submit_output` hold, and what should lotar do with it?

    - Today lotar parses nothing from the final reply. The outcome comes from the ticket (status and assignee set during the job) and the hand-off comment (`lotar comment --commit --check --next`), on every runner.
    - A t3-only result would give t3 jobs a second way to report what claude and codex jobs report through the CLI.
    - The live-state half is clear: T3's `/mcp` serves `thread.run_settled` and `thread.needs_input` events. That work lands mostly in harnessmux (`src/backend/t3.rs`, polls `t3 thread show` every 2 s) and needs a harnessmux release.
    - **Options:**
      1. **Summary only** (recommended): `{summary}` becomes the job's last message in place of the final reply's text. Outcomes still come from the ticket.
      2. **Hand-off fields** (summary, status, commits, checks, next): lotar writes the hand-off comment and applies status from it, for t3 jobs only.
      3. **No typed result**: do only the events half; that part of the ticket becomes WontDo.
    - The Done when in the description has the rest; only the result line waits on this.
    - No code changed yet; no commits on `agent/DEV-877`.
