- date: 2026-11-26T20:13:43.916426+00:00
  author: claude
  text: |-
    Done: t3 jobs read their summary through `t3_submit_output` and their runs' ends through MCP Events.

    - **harnessmux 0.4.0, released** (`710c2f5`, tag `v0.4.0`, on crates.io):
      - `output_schema` / `--output-schema`, and the result as a `turn.output` event.
      - Milestones from `events/stream` end the turn and come out as `milestone` events.
      - Falls back to 2 s `thread show` polling, with one notice per session.
    - **lotar:**
      - A t3 job asks for `{"summary"}`, and a submitted summary becomes the job's last message.
      - Without one, the reply stays the last message and the log says so.
      - Milestones go to the job log.
      - The job view takes the newest milestone when it is newer than `thread show`'s `updatedAt`, or when T3 doesn't answer.
    - Done when is adjusted to what was built:
      - `projectIds` before a launch.
      - A `t3 thread start` first turn ends when that command does.
      - The view's timestamp rule.
    - No guidance finding.
