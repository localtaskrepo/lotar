description: |-
  T3 Code 0.1.12 adds typed turn results (t3_submit_output) and MCP Events webhooks/streams for milestones. lotar's T3 runner could take a structured result instead of parsing the final reply, and get live state instead of polling (related DEV-849). Owner chose to file this 2026-11-25: "the runner asks for a typed result and uses it, takes events for live state, and tests cover both with the fake t3."

  ## Found (2026-11-26)

  - lotar parses no result from a job's final reply. The outcome comes from the ticket (status and assignee set during the job, DEV-320) and the hand-off comment (`lotar comment --commit --check --next`). The reply only becomes the job's last message.
  - The T3 runner is harnessmux's t3 backend (`src/backend/t3.rs`, crate `harnessmux` 0.3.x from crates.io). It follows a run by polling `t3 thread show --json` every 2 s. lotar's job view (DEV-849, `t3_state.rs`) reads `t3 thread show` at most every 10 s while the view is open.
  - `t3 thread start` takes `--output-schema <file>`, MCP `t3_thread_send` / `t3_thread_launch` take `outputSchema`. T3 appends instructions to call `t3_submit_output`, starts a continuation run when a completed run owes the result, and `t3_thread_wait` (`untilOutput`) returns it as `output`.
  - T3's `/mcp` serves milestones as MCP events (SEP-3415) on the stateless revision 2026-07-28 (headers `mcp-protocol-version`, `mcp-method`, `mcp-name`, `_meta` with protocol version and client capabilities): `thread.run_settled` (`runId`, `outcome`: completed, failed, interrupted, cancelled), `thread.needs_input` (`requestId`, `kind`), filtered by `threadIds`. `events/poll` suggests 30 s between polls; `events/stream` pushes SSE notifications (`notifications/events/active`, `…/event`, `…/heartbeat`, `…/terminated`). Checked live against T3 0.1.12 on 2026-11-26.

  ## Decision

  - Owner 2026-11-26 (INBOX-760): "Summary only: {summary} becomes the job's last message; outcomes still come from the ticket".

  ## Done when

  - [x] harnessmux: a profile's `output_schema` (CLI `--output-schema <file>`) goes to T3 with each t3 turn (`outputSchema` / `--output-schema`). After a completed run harnessmux reads the result with `t3_thread_wait` (`untilOutput`) and sends it as a `turn.output` event before `turn.finished`. No result, after T3's own retry, or a failed read: a notice says so and the turn ends as today.
  - [x] lotar: a t3 job asks for `{"summary": string}`. A submitted `summary` becomes the job's last message (its summary) in place of the final reply's text; the reply stays in the log. Status, assignee and the hand-off still come from the ticket; nothing else is read from the result. A missing result, or one without a `summary`: the job's last message is the final reply as today, and the log says "The agent submitted no result …". Other runners don't change.
  - [x] harnessmux's t3 backend opens `events/stream` for `thread.run_settled` and `thread.needs_input` of its thread before it sends (`threadIds`; a new thread from `t3_thread_launch`: `projectIds` before the launch; following a run it didn't send: before its first `thread show`, which may then end the turn). The first turn of a thread `t3 thread start` makes (no worktree) ends when that command does, as before. While the streams run, the turn ends on the run's settled event (completed → finished, else failed with the run's errors as now) or a needs-input event (waiting for an answer); `thread show` still feeds the replies and tool calls but no longer ends the turn. The milestone wins over a `thread show` that still shows the same run running; a newer active run or pending background tasks keep the turn following.
  - [x] Events that can't be read (older T3 without events, a refused sign-in, a stream that fails or drops): the turn goes on with the 2 s `thread show` polling as before, and the session log says so once per session.
  - [x] harnessmux sends each milestone as a `milestone` event (name, run, outcome, request, kind). lotar records it in the job log, and the job view (DEV-849) shows the thread's state from the newest milestone after the job's last prompt (needs_input → waiting, settled → finished/failed/stopped) when it came after the `updatedAt` that `t3 thread show` reports, or T3 Code doesn't answer; else from `t3 thread show` as now. The ticket status and the job outcome never change from it.
  - [x] Tests with the fake t3 cover: a submitted result, a missing result, an event-driven end (with a stale `thread show`), a needs-input event, and the fallback when events fail (harnessmux `tests/cli.rs`); lotar's result handling and the view's milestone state (`crates/lotar-lib/tests/dev510_t3_session_test.rs` or unit tests).
  - [x] The harnessmux change ships as release 0.4.0 that lotar's `Cargo.toml` uses; harnessmux README/CHANGELOG and lotar `docs/help/agent.md` (T3 Code threads) describe the result and the live state.
