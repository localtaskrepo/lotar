  - DEV-849
  - DEV-320
comments:
- date: 2026-11-26T01:26:18.391829+00:00
  author: claude
  text: |-
    Question: what should the typed result from `t3_submit_output` hold, and what should lotar do with it?

    - Today lotar parses nothing from the final reply. The outcome comes from the ticket (status and assignee set during the job) and the hand-off comment (`lotar comment --commit --check --next`), on every runner.
    - A t3-only result would give t3 jobs a second way to report what claude and codex jobs report through the CLI.
    - The live-state half is clear: T3's `/mcp` serves `thread.run_settled` and `thread.needs_input` events. That work lands mostly in harnessmux (`src/backend/t3.rs`, polls `t3 thread show` every 2 s) and needs a harnessmux release.
    - **Options:**
      1. **Summary only** (recommended): `{summary}` becomes the job's last message in place of the final reply's text. Outcomes still come from the ticket.
      2. **Hand-off fields** (summary, status, commits, checks, next): lotar writes the hand-off comment and applies status from it, for t3 jobs only.
      3. **No typed result**: do only the events half; that part of the ticket becomes WontDo.
    - The Done when in the description has the rest; only the result line waits on this.
    - No code changed yet; no commits on `agent/DEV-877`.
- date: 2026-11-26T06:58:09.164379+00:00
  author: mallox
  text: 'Answer: summary (Summary only: {summary} becomes the job''s last message; outcomes still come from the ticket) (answered in INBOX-760)'
- date: 2026-11-26T16:57:51.759386+00:00
  author: claude
  text: 'Stalled since 2026-11-26T06:58Z with no lotar job: the live check restarted @fix as the next turn of its thread, the answered retry started no job, with the fix prompt (lotar rule "Stalled: restart the fix agent"). A second stall at this step goes to mallox (repos.ts --live --report, STD-167).'
- date: 2026-11-26T20:13:43.916426+00:00
  author: claude
  text: |-
    Done: t3 jobs read their summary through `t3_submit_output` and their runs' ends through MCP Events.

    - **harnessmux 0.4.0, released** (`710c2f5`, tag `v0.4.0`, on crates.io):
      - `output_schema` / `--output-schema`, and the result as a `turn.output` event.
      - Milestones from `events/stream` end the turn and come out as `milestone` events.
      - Falls back to 2 s `thread show` polling, with one notice per session.
    - **lotar:**
      - A t3 job asks for `{"summary"}`, and a submitted summary becomes the job's last message.
      - Without one, the reply stays the last message and the log says so.
      - Milestones go to the job log.
      - The job view takes the newest milestone when it is newer than `thread show`'s `updatedAt`, or when T3 doesn't answer.
    - Done when is adjusted to what was built:
      - `projectIds` before a launch.
      - A `t3 thread start` first turn ends when that command does.
      - The view's timestamp rule.
    - No guidance finding.
  report:
