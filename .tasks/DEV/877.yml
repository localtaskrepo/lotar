- date: 2026-11-26T23:38:21.996678+00:00
  author: claude
  text: |-
    Review: blocking. After a rebase onto main, the job view's milestone rule brings back DEV-857's bug: a thread waiting on background work shows Finished.

    - **Bug:** `with_milestone` (`crates/lotar-agent/src/services/agent_job_service/t3_state.rs:201-214`) lets the newest milestone win whenever its log time is later than `thread show`'s `updatedAt`.
      - On main, DEV-857 (`0e78bed6b`) makes `from_shown` return `running` for a thread that is `completed` but has `pendingBackgroundTasks` or `blockedOnThreadWait`. This branch lacks that commit.
      - When the agent ends its turn on `t3_background_wait`, the run settles `completed` and lotar logs the milestone right after T3's `updatedAt`. The milestone then turns DEV-857's `running` back into `finished`, until the wake run starts.
      - The Done when says that for harnessmux ("pending background tasks keep the turn following"), but the view doesn't do the same.
      - **Fix:** let the milestone win only over the stale case (`thread show` still has the milestone's run as `activeRunId`, or T3 doesn't answer), or at least never over a `running` that comes from background work. Add a `t3_state` test with `{"status":"completed","pendingBackgroundTasks":[…]}` plus a newer settled milestone that expects `running`.
    - **Rebase:** `git merge-tree main HEAD` conflicts in `crates/lotar-agent/src/services/agent_job_service.rs` and `docs/help/agent.md`. Main has 11+ newer commits to those files (DEV-895, DEV-871, DEV-870, DEV-886, DEV-876, …). Rebase first, then check the fix against DEV-857.
    - **While there (minor):** `AgentJobT3Thread.t3_status` and `updated_at` now also carry the milestone's outcome and lotar's log time. Their docs still say "When T3 Code last changed the thread" in `crates/lotar-core/src/api_types.rs:804-810`, `view/api/types.ts:1972` and `docs/openapi.json:11148`. Update those three places together.
    - **Holds:**
      - The summary-only result follows the owner's 2026-11-26 decision. Only the t3 runner asks for it (`agent_runner.rs` `t3_result_schema`, `asks_result`), and nothing besides `summary` is read.
      - harnessmux `v0.4.0` (`710c2f5`) is on crates.io. It has the CHANGELOG entry and fake-t3 tests in `tests/cli.rs` for a submitted result, a missing result, a milestone end while `thread show` is behind, needs-input, and the events fallback.
    - **Reran in this worktree (after `npm ci`), all passed:**
      - `cargo nextest run -p lotar-agent -E 'test(/dev877|t3_turn|milestone|t3_state/)'` (10 tests)
      - `cargo nextest run -p lotar-agent -E 'test(/dev520_session_events/)'` (10 tests)
      - `cargo nextest run -p lotar-lib --test integration -E 'test(/dev510_t3_session_test|dev849|dev626/)'` (25 tests)
      - `cargo clippy -p lotar-agent --all-targets`, with no warnings
      - `rustfmt --check` and `prettier --check` on the changed files
    - **Not done:** the bug comes from reading the code, not from a failing run on the rebased tree. No UI work, so no screenshots. Full suites not run (they run at merge). No tickets filed.
- date: 2026-11-27T01:04:17.156156+00:00
  author: claude
  text: |-
    Fixed: the job view's milestone no longer overrides a thread that waits on background work; the branch is rebased onto main.

    - **Blocking finding (DEV-857 regression):** `with_milestone` (`crates/lotar-agent/src/services/agent_job_service/t3_state.rs`) now lets a milestone give the state only when:
      - T3 Code doesn't answer, or
      - a settled run is still `thread show`'s `activeRunId` (it hasn't caught up), or
      - a `thread.needs_input` came after `updatedAt` (a question wins everything anyway).
      - A thread shown past the run (`pendingBackgroundTasks`, `blockedOnThreadWait`, a newer run) keeps its own state, so it stays Running.
      - The `t3 thread show` answer is now cached together with its active run (`Answer`).
      - New tests: `a_thread_waiting_on_background_work_stays_running_after_its_run_settled`, `a_settled_milestone_wins_over_a_thread_show_still_running_its_run_and_an_unavailable_one`, `a_question_wins_when_it_came_after_the_thread_s_last_change`.
    - **Rebase:** onto main `c292a058e`.
      - Conflicts resolved: `TurnSettings` now has both `usage_source` (DEV-862) and `asks_result`.
      - `Cargo.toml` and `Cargo.lock` keep main's 0.15.7 and move only harnessmux from 0.3.1 to 0.4.0.
      - `docs/help/agent.md` keeps main's DEV-857 and DEV-870 text and states the new milestone rule.
    - **Minor finding:** the `t3_status` and `updated_at` docs now say what a milestone puts there. Changed together in `api_types.rs`, `view/api/types.ts` and `docs/openapi.json`.
    - **Note:** `dev626` failed at first only because the `lotar` binary was stale. After `cargo build` it passed.
    - No guidance finding. Diff is 340+/37−, no `small-diff` tag to remove.
