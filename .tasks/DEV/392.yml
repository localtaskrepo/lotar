  text: |-
    Claude (Opus 5.5): Done in commit 199ca7f on agent/DEV-392.
    Pull: Jira fixVersions/versions read each version's name; a GitHub issue's milestone reads its title. Pull normalises version fields the way task writes do, so milestone v0.15.0 is stored as 0.15.0 and the next pull reports no change.
    Push: Jira gets fixVersions/versions as [{name}]. GitHub looks up the repo's milestones once per push (state=all, ignoring a leading v) and sends the number. A milestone that doesn't exist is skipped with the warning '<task>: GitHub milestone 'X' does not exist in org/repo; create it on GitHub first'. milestone is now a pushable GitHub field, so config validate no longer warns about it. JiraLookupCache is renamed LookupCache and now holds the milestones too.
    Docs: docs/help/sync.md has the mapping example and notes for both remotes.
    Tests: 5 new tests in provider_tests.rs (mod versions) use recorded payloads against the mock API. The two pull tests failed first. Checks: npm run lint:agent clean, npm test:agent passes (2080 Rust, 1471 UI, release, hooks), smoke 381/381.
    Not checked: a live Jira or GitHub. In particular, the error Jira returns on push for a version the project doesn't have is untested.
