description: |-
  Mapping a version field to Jira's `fixVersions` or `versions`, or to a GitHub milestone, brings in nothing, so versions can't come over from an existing tracker. Found by claude reading the code in an audit of version support, 2026-11-12; not reproduced against a live Jira or GitHub.

  ## Cause

  - Jira sends `fixVersions` and `versions` as lists of objects (`[{"id": "10001", "name": "0.15.0", ...}]`). `jira_payload_field_value` falls through to `read_generic_field` (`src/services/sync_service/remote_fields.rs`), which keeps only plain strings from a list, so the result is an empty list.
  - A GitHub issue's `milestone` is an object (`{"title": "v0.15.0", ...}`); `read_generic_field` returns nothing for an object.
  - Push: check what `src/services/sync_service/payloads.rs` sends for these fields; Jira expects `[{"name": "0.15.0"}]`, GitHub a milestone number.

  ## Fix

  - Pull: read `name` from Jira version objects and `title` from a GitHub milestone (a leading `v` is dropped by the version field as usual).
  - Push: send the shapes the remotes expect, or refuse the mapping with a clear message where lotar can't (e.g. a milestone that doesn't exist on GitHub).
  - Starts with failing tests in `src/services/sync_service/provider_tests.rs` using recorded payloads.

  ## Done when

  - [ ] `mapping: { fixed_in: fixVersions }` pulls `0.15.0` from Jira, and `fixed_in: milestone` pulls it from GitHub.
  - [ ] Push works or is refused clearly, and `docs/help/sync.md` has an example.
