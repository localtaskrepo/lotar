description: |-
  Make the slowest Rust tests faster, so the suite is cheap to run often. The owner, 2026-11-13: "The faster tests can run, the cheaper it is to run them more often."

  ## Context

  - Agent, automation and job tests are 52% of the Linux test time; `dev318_t3_runner_test` alone takes 57 s (DEV-493 findings).
  - The full local Rust run (`npm run test:rust:agent`) took 79 s of test time for 2138 tests on 2026-11-13.

  ## Plan

  - List the 20 slowest tests from a nextest JUnit report (`target/nextest/*/junit.xml`).
  - Remove fixed sleeps and long polling intervals, shrink fixtures, share expensive setup where it stays isolated. Never weaken what a test proves; record each change's before and after time.

  ## Done when

  - [ ] The slowest tests with their before and after times in a comment, and the total test time before and after.
