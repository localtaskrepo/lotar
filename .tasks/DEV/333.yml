description: |-
  In the task panel, the assignee select offers agent profiles without their `@`. Choosing `fix` stores the assignee `fix`, which is not an agent profile, so no agent starts. Typing `@fix` into the custom field works. Reported by the owner on 2026-11-11 on DEV-330: the history shows `fix` at 00:40:46, then `@fix` at 00:41:31, and only the second started a job.

  ## Cause

  `view/composables/useTaskPanelOwnership.ts` builds the list of known people and strips a leading `@` from every name: from existing tasks' assignees and reporters in `preloadPeople`, and from configured members and defaults in `sanitizedConfiguredMembers` and `defaultOwnershipCandidates`. An earlier ticket assigned to `@fix` therefore appears as plain `fix`. Configured agent profiles are not offered at all; they only show up because some ticket already had one.

  ## Fix

  - Keep `@` on agent profile names: offer the configured profiles (`api.listAgentProfiles(project)`) as `@<name>`, and keep a stored `@<profile>` assignee as it is.
  - Leave the existing user handling as it is (`@me`, members written with `@`).
  - Check whether the filter bar's assignee options need the same change.

  ## Done when

  - [ ] The assignee select lists each configured agent profile as `@<name>`, and choosing one starts its job, as `lotar assignee <id> @fix` does.
  - [ ] No plain `fix` option comes from a ticket assigned to `@fix`.
  - [ ] A unit test in `view/__tests__` covers the options, plus a smoke test that choosing a profile queues a job, if the smoke suite can run agents.
