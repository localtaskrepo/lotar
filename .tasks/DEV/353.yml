- date: 2026-11-17T17:33:26.317312+00:00
  author: claude
  text: 'Owner 2026-11-17 (chief of staff picker): "Yes, start DEV-353". T3 Code v0.1.10 is installed (t3 --version) and has #34696 ("thread --wait returns once background work the agent waits on has ended", merge 671f854). Note: the CLI waits only up to 10 s for the run the background work wakes; check a slow case on a real thread and say what happens.'
- date: 2026-11-17T17:54:53.607493+00:00
  author: claude
  text: |-
    Removed the t3 prompt line: T3 Code v0.1.10's `--wait` now waits for awaited background work, and a real lotar t3 job ended only after the wake run

    - Check, `t3 v0.1.10`: background `sleep 90` + `t3_background_wait`, then end turn → `--wait` returned after 104 s with run ordinal 2's `WAKE-REPLY: BG-DONE`. Same with `sleep 4`, the short case the PR warns about.
    - lotar job `job-20261117T174538.196Z-1` (scratch TEST project, `--runner t3`): `lotar agent logs` shows the first turn's "Waiting for the background sleep." at 17:46:11, `agent_job_completed` at 17:47:12, summary `WAKE-REPLY: BG-DONE`. I removed its worktree and `agent/TEST-1` branch afterwards. The 3 test threads are still in T3 Code.
    - Removed the "job ends with your turn… run checks in the foreground" line and its code comment in `crates/lotar-agent/src/services/agent_job_service.rs` `t3_thread_notes`.
    - `tests/dev318_t3_runner_test.rs` was removed in DEV-503, so no test assertion was left to drop.
    - `docs/help/agent.md` (T3 Code threads) now says the job ends after the wake run (0.1.10+). It names the limit left: T3's CLI looks for the wake run for only 10 s.
    - Standards `configs/lotar/automation.yml` work prompt step 4 ("Don't end your turn while tests or other background work still run"): for t3 jobs it can go. Keep it if the prompt also runs on non-t3 runners: their jobs still end at turn end. Not changed here (other repo).
