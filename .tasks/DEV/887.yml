- date: 2026-11-26T13:56:56.499361+00:00
  author: claude
  text: |-
    Review: passed. `ca7122f52` meets every "Done when" item; one minor follow-up filed as [DEV-898](https://lotar.pyxzl.net/task/DEV-898).

    - Read: the diff of `main...HEAD` (1 commit, 6 files), the ticket and the fix comment, DEV-889, AGENTS.md, the last commits to the touched files on main. `npm ci` ran without errors.
    - `canonical_tasks_dir` (`crates/lotar-agent/src/services/agent_queue_service.rs:1401`) resolves the real path, falling back to `std::path::absolute` for a missing folder. The queue file, worker lock, recorded `tasks_dir`, memory gate, active jobs and end actions all use it.
    - The test `relative_tasks_dir_shares_the_absolute_paths_queue` would fail before the fix: both repos' `.tasks` hashed to one file, so `other_pending` would hold TEST-1. I worked this out from the code and didn't rerun it on the old code.
    - Existing queues keep their names: `realpath` of lotar's `.tasks` is the path already hashed. The old file with the 7 entries is untouched, and its state is reported on DEV-889 (owner tag). The fix decides nothing for the owner.
    - Reran: `cargo nextest run -p lotar-agent` 255/255 passed. `agent_safety_test::` (integration) 42/42 passed. `rustfmt --check` and `prettier --check` on the changed files pass.
    - It merges cleanly onto main (`git merge-tree`).
    - Minor (DEV-898): `crates/lotar-agent/src/services/disk_gate.rs:427` on main (DEV-837, added after this branch) still hashes the raw `tasks_dir` for disk-gate state. The fix: `canonical_tasks_dir` there too. This merge doesn't introduce it.
    - No UI changes, no stray files, no second branch. Guidance: no durable finding.
- date: 2026-11-26T16:56:48.812217+00:00
  author: claude
  text: 'Stalled since 2026-11-26T14:32Z with no lotar job: the live check restarted the merge after the passed review (lotar rule "Stalled: merge after a passed review"). A second stall at this step goes to mallox (repos.ts --live --report, STD-167).'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3A8013082b72e0bfd4b9e6194ee238a6d9d376eecd3f849f16d034532dfc5bd182
description: |-
  Found in the review of DEV-865.

  - `crates/lotar-agent/src/services/agent_queue_service.rs:1391` `queue_file_path` and `:1405` `queue_hash` hash the tasks dir **as given**, not its absolute path. Every process that queues with `--tasks-dir .tasks` (or `LOTAR_TASKS_DIR=.tasks`), in any repo, shares one file.
  - On this Mac: `~/Library/Caches/lotar/agent-queue/queue-b06823c0….json` has `"tasks_dir": ".tasks"` and 7 pending entries from two repos: DEV-850, DEV-849, DEV-848, DEV-827, DEV-872 (lotar) and STD-336, STD-359 (standards), queued 2026-11-24/25. `lotar agent queue` in the repos (absolute path) doesn't show them, so they wait with no worker.
  - Repro: `lotar --tasks-dir .tasks agent queue` in any folder (for example a new scratch repo) lists those DEV/STD entries.
  - Caller: lotar 0.15.6 and older passed `--tasks-dir .tasks` / `LOTAR_TASKS_DIR=.tasks` through unchanged (for example `.github/skills/lotar-dev-tracking/SKILL.md` tells agents to run `lotar --tasks-dir .tasks …`). DEV-822 (`87f6d2cf1`) made the CLI resolver absolute; this ticket makes the queue's own paths independent of how a caller spells the folder.

  ## Done when

  - [ ] The queue file, worker lock and memory-gate state paths are keyed by the canonical absolute tasks dir (as active-job and end-action paths already are), so `.tasks`, `./.tasks`, its absolute path and a symlinked spelling (`/tmp` vs `/private/tmp`) give the same file. A folder that doesn't exist yet is keyed by its absolute path (joined to the working folder).
  - [ ] The queue file records that canonical path in `tasks_dir`.
  - [ ] Entries already in a relative-path queue file are not lost: the old file stays untouched; what happens to its 7 entries is the owner's call in DEV-889 (tag owner). This ticket reports their current state there.
  - [ ] A test: queueing with `.tasks` from the repo root and listing with the absolute path show the same entries.
