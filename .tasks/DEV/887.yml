  text: |-
    Review: passed. `ca7122f52` meets every "Done when" item; one minor follow-up filed as [DEV-898](https://lotar.pyxzl.net/task/DEV-898).

    - Read: the diff of `main...HEAD` (1 commit, 6 files), the ticket and the fix comment, DEV-889, AGENTS.md, the last commits to the touched files on main. `npm ci` ran without errors.
    - `canonical_tasks_dir` (`crates/lotar-agent/src/services/agent_queue_service.rs:1401`) resolves the real path, falling back to `std::path::absolute` for a missing folder. The queue file, worker lock, recorded `tasks_dir`, memory gate, active jobs and end actions all use it.
    - The test `relative_tasks_dir_shares_the_absolute_paths_queue` would fail before the fix: both repos' `.tasks` hashed to one file, so `other_pending` would hold TEST-1. I worked this out from the code and didn't rerun it on the old code.
