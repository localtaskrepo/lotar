- date: 2026-11-26T04:58:34.505827+00:00
  author: claude
  text: |-
    Fixed: the agent queue is keyed by the tasks dir's real path, so `.tasks` and its absolute path share one queue and repos no longer share one.

    - `canonical_tasks_dir` (`crates/lotar-agent/src/services/agent_queue_service.rs`): canonicalizes, or makes absolute a folder that doesn't exist yet. Used for the queue file, worker lock, the queue's recorded `tasks_dir`, the memory-gate state (`memory_gate.rs`), and now also active jobs and end actions, which already canonicalized.
    - Caller: lotar 0.15.6 passed `--tasks-dir .tasks` through unchanged (the `lotar-dev-tracking` skill tells agents to use it). DEV-822 already makes CLI paths absolute on main; this change protects the queue whichever way a caller spells the path, `/tmp` vs `/private/tmp` included.
    - Real repos keep their queue files: `realpath` of the lotar and standards `.tasks` equals the path already hashed.
    - Test `relative_tasks_dir_shares_the_absolute_paths_queue`: queue with `.tasks` from one repo, list with the absolute path → same entry; another repo's `.tasks` → empty. Fails before the fix.
    - `agent_safety_test.rs` wrote a queue file under the raw temp path; it now hashes the canonical one.
    - The 7 old entries: all their tickets are Done or Merging; file left untouched, noted on [DEV-889](https://lotar.pyxzl.net/task/DEV-889) (owner decides).
    - Guidance: no durable finding.
