description: |-
  Next lotar release, a **patch** bump to v0.15.1, so lotar runs its agent jobs on harnessmux. The owner, 2026-11-14: "we need to take everything in there and create a new patch version so that we can use the harnesmux properly"; scope chosen the same day: "Everything harnessmux".

  Steps: `.github/skills/release/SKILL.md` and `docs/release-guide.md`. Tickets that wait for this release are Blocked and depend on it; closing this ticket hands them to @fix to run their checks.

  ## Scope

  - harnessmux: DEV-503 (switch lotar's jobs to the harnessmux crate), DEV-510 (gaps of the t3 agent), DEV-509 (Claude's sandbox and rule-based permission answers), DEV-511 (budget limit, agent options, live replies), DEV-512 (agent command per profile, fuller usage), DEV-501 (review of the job code that stays). DEV-509 to 512 and DEV-501 start after DEV-503 lands.
  - Fixes with commits that were stuck on 2026-11-14: DEV-466 (git timeouts), DEV-467 (job outcomes during a T3 outage), DEV-468 (rework commits on the ticket branch), DEV-477 (automation simulate shows all rules), DEV-491 (automation comments muted).

  ## Not in it

  DEV-485 (custom fields, the owner chose A on 2026-11-14) goes into the release after. DEV-483 closes as not reproducible (the owner's answer "2"). DEV-493 shipped in v0.15.0.

  ## Upgrade

  Upgrade lotar to this release only while no agent job runs: a job started by the old runner is not picked up by the new one (DEV-510).
