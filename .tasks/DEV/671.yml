    - Fix agent's cause holds: the job log `job-20261117T183404.304Z-25.jsonl` header says `runner: t3, agent_profile: review`, and `~/.lotar` mtime is 18:34:55Z, after the job started 18:34:06Z. STD-206's own ticket notes `~/.lotar` wasn't installed yet ("This review ran on the old T3 profile").
    - Code: `runner_kind` comes from the profile; `continuable_session` (`crates/lotar-agent/src/services/agent_runner.rs:194`) refuses another runner's session. `docs/help/agent.md:50` ("one of another runner ... starts a new session") matches, so "Done when" (check holds, with a test) is met.
