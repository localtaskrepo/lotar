- date: 2026-11-17T19:18:28.632110+00:00
  author: claude
  text: |-
    No lotar bug: the job ran on t3 because ~/.lotar still gave @review `runner: t3` when it started. Added the ticket's check as a test.

    - Job log `job-20261117T183404.304Z-25.jsonl` (standards): header `runner: t3`, `agent_profile: review`, created 18:34:06Z.
    - STD-124 (review → `runner: claude`) was committed 18:32:46Z, but `~/.lotar` was rewritten (global.ts install) at 18:34:55Z, 49 s *after* the job started. Until then the home config had the pre-STD-124 profiles.
    - lotar takes the runner from the profile (`resolve_profile`), and `continuable_session` in `crates/lotar-agent/src/services/agent_runner.rs` already refuses a session of another runner ("runs the t3 agent, not claude; this job starts a new one."). docs/help/agent.md is correct as written.
    - New test `a_continued_job_on_another_runner_starts_a_session_of_its_own` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: fix thread on t3, then a `session: continue` review on claude → job runner `claude`, log says why, nothing sent to the thread. It fails when that runner check is disabled.
