  text: |-
    Waits for DEV-731: the code this ticket changes isn't on main yet.

    - `complete_path_from_login_shell` comes from DEV-731's commit `ed15359af`, which is only on `agent/DEV-731` (status `Merging`). `git log main..HEAD` on `agent/DEV-746` is empty, and `grep complete_path crates` finds nothing
    - Plan once it's on main: move the call out of `run_worker` (`crates/lotar-agent/src/services/agent_queue_service.rs`) into the `lotar agent worker` handler (`crates/lotar-lib/src/cli/handlers/agent.rs`), so in-process `run_worker` in tests (`dev503_harness_jobs_test.rs:1246`, `agent_automation_integration_test.rs`) starts no login shell and calls no `set_var`
    - Then check that `worker_started_with_short_path_runs_jobs_with_login_path` still passes
references:
