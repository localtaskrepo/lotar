description: |-
  Tests that call `AgentQueueService::run_worker` in process now run the developer's real login shell and change PATH with `std::env::set_var`, which can happen while other threads are running. Found in the DEV-731 review, 2026-11-20.

  ## Cause

  - DEV-731 added `complete_path_from_login_shell` at the start of `run_worker`, in `crates/lotar-agent/src/services/agent_queue_service.rs`. Its SAFETY comment says the worker has started no thread yet. That holds for `lotar agent worker`, where the CLI runs single-threaded
  - In tests it doesn't hold: `crates/lotar-lib/tests/dev503_harness_jobs_test.rs:1246` runs `run_worker` on a spawned thread while the main thread keeps reading tickets. `agent_automation_integration_test.rs` (3371, 3424, 3432, 3606, 3678) calls it in process too
  - These tests also take `$SHELL -l` from the developer's machine, so their PATH depends on that machine's profile

  ## Fix

  Run the PATH completion only in the `lotar agent worker` CLI entry (`crates/lotar-lib/src/cli/handlers/agent.rs`, `worker`), before it calls `run_worker`. Or leave it out when the worker runs in process.

  ## Done when

  - [ ] An in-process `run_worker` never calls `set_var` and starts no login shell
  - [ ] `worker_started_with_short_path_runs_jobs_with_login_path` still passes
