description: |-
  Found in the DEV-763 review (2026-11-22).

  - `list_running_jobs_everywhere` in `crates/lotar-lib/src/cli/handlers/agent.rs` calls `with_wrapper_processes(jobs, None)`, so `--all` lists every `lotar-agent-wrapper` on the machine, each with `tasks_dir` `-` (`list_wrapper_processes` sets `tasks_dir: None`) although the wrapper's command line has `--tasks-dir`.
  - `docs/help/agent.md` ("`list-running` also lists the `lotar-agent-wrapper` processes ... of this tasks directory") doesn't say that `--all` lists them all.

  ## Done when

  - [ ] `lotar agent list-running --all` (text and `--format json`): a wrapper row's `tasks_dir` is the `--tasks-dir` value from the wrapper's command line before `--` (canonicalized like job records; the value as written when it can't be resolved).
  - [ ] A wrapper without `--tasks-dir` (an older lotar) still shows `-` (JSON `null`) and is still listed under `--all`.
  - [ ] Without `--all`: same filtering as before (only this tasks directory's wrappers); their JSON `tasks_dir` is filled the same way.
  - [ ] A wrapper whose job record is also listed is still shown once (the record row wins).
  - [ ] `docs/help/agent.md` says that `--all` lists the wrappers of every tasks directory, with their `tasks_dir`.
  - [ ] Unit test for reading `--tasks-dir` from a wrapper command line, including the older-wrapper case.
