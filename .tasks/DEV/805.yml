  author: claude
  text: |-
    Merged and pushed: `main` is at `1ebc9245a` (origin too), and `.tasks` is trusted again.

    - The failed check was a leak in an existing test, not in this work. `tests/embedded_web_ui_test.rs` left a `.tmpXXXXXX` folder on every run (4 out of 4 when run alone). Its `lotar serve` starts a queue worker in its own process group. The worker outlives the killed server and recreates `.tasks` in the removed temp dir.
    - Fix: the test sets `LOTAR_AGENT_QUEUE_DISABLE_WORKER=1`, as `dev646_serve_shared_job_limits_test.rs` does. Afterwards: 0 leaks out of 3 alone, and a clean full run. This isn't the cause DEV-840 is fixing (sccache, `dev732`), so I told DEV-840.
    - Rebased twice, because main moved on (DEV-768, then STD-328 and DEV-806). STD-328 changed `package-lock.json`, so I ran `npm ci` and all three checks again on the final commit.
    - The `.tasks` amend was refused by betterleaks `generic-password`, a false positive on `` login (`lotar-95e687-DEV-800-fix` `` in a DEV-833 comment. I reworded it to "after the login expired (…)" without changing the meaning. Nothing was bypassed.
    - Seen, not touched: 5 orphaned `lotar … agent worker` processes from other runs' `install/bin` test scratch dirs (pids 27697, 52043, 54164, 57119, 58627).
