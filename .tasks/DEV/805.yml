description: |-
  Found in the DEV-763 review (2026-11-22).

  - `list_running_jobs_everywhere` in `crates/lotar-lib/src/cli/handlers/agent.rs` calls `with_wrapper_processes(jobs, None)`, so `--all` lists every `lotar-agent-wrapper` on the machine, each with `tasks_dir` `-` (`list_wrapper_processes` sets `tasks_dir: None`) although the wrapper's command line has `--tasks-dir`.
  - `docs/help/agent.md` ("`list-running` also lists the `lotar-agent-wrapper` processes ... of this tasks directory") doesn't say that `--all` lists them all.

  Done when: wrapper rows under `--all` show the `--tasks-dir` from their command line (`-` for older wrappers), and the docs paragraph says what `--all` lists.
