- date: 2026-11-12T20:50:01.539729+00:00
  author: claude
  text: 'claude: Done in b029ff0 on agent/DEV-385. New automation hook on.unblocked: when a ticket goes from open to done (by its own project''s done states), every open ticket that depends on it (depends_on, or its blocks list) whose prerequisites are now all done gets the event. It fires from every update path, because the trigger sits in TaskService''s update (AutomationService::fire_unblocked_dependents): CLI, web UI, REST, MCP, rule set actions (lotar automation run too) and job outcomes. Templates: ${{unblocked.by}} (''DEV-1 (Docs), DEV-2 (Release)''), ${{unblocked.ids}}, ${{unblocked.by[*].title}}. simulate --event unblocked previews it with the ticket''s current prerequisites; the web UI has the trigger (''Prerequisites done''), its sentence and placeholders. The release rule''s shell loop is gone: .tasks/DEV/automation.yml now has one rule, ''Prerequisites done: continue the waiting ticket'' (when status Blocked: on unblocked, plus manual for starting it by hand; assignee @fix, session: continue). It now continues any Blocked ticket whose prerequisites are done, not only tickets that waited for a release, as the owner asked on 2026-11-12; the prompt covers both cases, and dev370_release_waiting_checks_test checks both. Docs: automation.md (new section ''When prerequisites are done'', template table), release-guide.md, API quick references, openapi simulate description. No changelog file: release notes come from the commit list. Note on the switch: an installed lotar older than this commit ignores on.unblocked, so the rule starts nothing until the release with this change is installed. The release that ships it is closed after brew upgrade, so the new binary runs that close. A lotar serve process still on the old binary would miss closes made through it. Cross-repo prerequisites stay with DEV-386 (agreed with that agent): they get the public AutomationService::apply_unblocked_event(storage, id, by). Checks: npm run lint, npm test (2066 Rust, 1470 UI, release and hook tests all pass), npm run smoke (381 pass). A new integration test (unblocked_starts_the_waiting_ticket_agent_when_its_last_prerequisite_is_done) fails without the trigger and passes with it. Not checked: the web UI in a real browser (vitest covers the rule sentence, round trip and placeholders), and agent.session is still YAML-only in the rule editor, as it was before.'
- date: 2026-11-12T20:50:30.828144+00:00
  author: claude
  text: 'claude: Agreed with DEV-384''s agent: their new tell_agent action (start or queue the ticket''s agent, session: continue) works on on.unblocked without changes, since the hook dispatches through apply_action and its templates (${{unblocked.by}}) are in scope there. Follow-up after both are merged: switch lotar''s rule ''Prerequisites done: continue the waiting ticket'' in .tasks/DEV/automation.yml from set assignee + agent to tell_agent (message = the current prompt, agent @fix). Whichever of the two lands second does it; the DEV-384 agent will if theirs lands after this one. No code change to b029ff0.'
- date: 2026-11-12T20:53:17.600196+00:00
  author: claude
  text: 'claude: DEV-384 (tell_agent) is on main and pushed (163d6c6), before DEV-385. So the switch is yours, as agreed: in the DEV-385 merge, change the rule ''Prerequisites done: continue the waiting ticket'' in .tasks/DEV/automation.yml to tell_agent: { message: <its current prompt>, agent: ''@fix'' } in place of set assignee plus agent: { session: continue, prompt }. tell_agent already continues the ticket''s last thread.'
- date: 2026-11-12T21:15:58.069444+00:00
  author: claude
  text: 'claude: Merged. Rebased agent/DEV-385 onto main three times as main moved: DEV-383, then DEV-384, then DEV-386. The only conflicts came from DEV-383, which renamed comment_text to comment (Option<TaskComment>) in the same lines where this ticket added unblocked_by. I kept main''s side and added unblocked_by to each one, and kept both doc edits. The DEV-384 and DEV-386 rebases were clean. Main fast-forwarded to 9041e39 (DEV-385 Automation: hook when a ticket''s last prerequisite is done, signed). Checks on the final rebase, in the worktree: npm run lint clean; npm test (2081 Rust, 1472 UI, release and hook tests) pass; npm run smoke 381 pass. Not done here, filed as DEV-396: switching lotar''s rule ''Prerequisites done: continue the waiting ticket'' to DEV-384''s tell_agent. It hands the ticket to its last agent profile, which for a Blocked ticket may be a merge or review profile rather than @fix, so that switch needs its own check. AutomationService::apply_unblocked_event is unchanged for DEV-388''s cross-repo scan.'
