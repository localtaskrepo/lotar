description: |-
  The owner (2026-11-12), his words: "when a ticket the blocks other tickets is done, it should automatically kick of agents for those tickets, since the work can now probably continue. Or a review can happen for an integration, or whatever the agent was waiting on. [...] Let's do it right from the start."

  Today only lotar's own release rule does this ("Release installed: start the waiting checks" in .tasks/DEV/automation.yml), as a shell loop over `${{ticket.relationships.blocks[*]}}` that recognises the release by its title. It should be a built-in event instead, so any repo's rules can use it.

  ## Plan
  - A new automation hook on the dependent ticket (e.g. `unblocked`): fires when its last open prerequisite reaches a done state (each prerequisite by its own project's done-state policy, as dependency evaluation does today). Also from `lotar automation run` and the CLI, REST and MCP edits that close a prerequisite.
  - Templates for what was resolved (e.g. `${{unblocked.by}}`: the prerequisite IDs and titles), so the prompt tells the agent what it waited for.
  - The rule then decides: start the ticket's agent with a prompt, as the next turn of its last thread (`session: continue`) where there is one.
  - Replace the release rule's shell loop with it; simulate and the web UI's rule sentences support it; docs (automation.md, changelog).
  - Cross-repo prerequisites (a standards ticket waiting on a lotar release, STD-54 on DEV-374) need relationships to tickets in another repo: see the related ticket.

  ## Done when
  - [ ] A rule on the new hook starts an agent for a Blocked ticket when its last prerequisite goes Done, with a test
  - [ ] The release rule uses it
  - [ ] Documented
