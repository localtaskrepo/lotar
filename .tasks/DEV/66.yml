    Outcome: Insights and activity consumers own query-scoped, refreshable state — keyed ActivityFeedHandle queries with latest-wins generations (success/error/loading/release), drawer-scoped global 30d/200 feed, Insights' own project/window feed handle, retained DEV-65 task query handle with retryable error UX, generation/disposed-guarded stats and refresh orchestration with Reload forcing visible-project refetches, unambiguous JSON tuple feed keys with normalized project, and zero-tag/untagged-only fixes. Review blockers D1 (error+Retry vs false empty; same-key rows+banner), D2 (unmount invalidates async stats/feed continuation, no orphan handle/toast/publication), P1 (key normalization, literal '*' never global) fixed and signed off by independent review.
