- date: 2026-09-13T17:21:12.765618+00:00
  text: |-
    Review fixes (frontend + unit tests only; ticket stays InProgress):

    D1 (task query error UX): ProjectInsights now surfaces taskQueryHandle.error — a failed NEW scope (no snapshot) renders the DEV-65-style UiEmptyState ('We couldn't load tasks' + Retry) instead of a false 'No tasks match'; a failed SAME-scope refresh keeps the valid rows with a role=alert banner ('Refresh failed: …' + Retry). Startup keeps the queued loader (loading/refreshing) rather than a false empty. retry() = refreshData({forceStats:true}). The test that enshrined the false-empty bug was replaced.

    D2 (unmount invalidation): onBeforeUnmount now sets insightsDisposed and bumps refreshGeneration before releasing handles; all async continuations guarded via isStaleRun(generation)/disposed — refreshData stages/catch/toast, refreshActivityFeedWindow entry, fetchProjectStats map publication and error rethrow, loadSelectedProjectStats publish/toast, ensureProjectStatsMap entry/toast. A slow task query resolving after unmount can no longer continue stats/feed requests, adopt an unreleased feed handle, or toast.

    P1 (feed key hardening): useActivity uses an unambiguous JSON tuple key [project|null, windowDays, limit] and normalizes the project ONCE (trimmed) for both key and request params; a literal '*' project stays an explicit filter (rejected as-is by the API if invalid) and never collides with the global feed.

    P2/P3 left as-is (out of scope; DEV-21 predicates untouched). Smoke agent's new browser file untouched.

    Tests: useActivity.feed.spec +2 (trim consistency, literal '*' non-collision); ProjectInsights.spec failure test replaced + same-key banner, initial-failure queued loader, strengthened unmount (zero post-unmount stats/feed calls, no toast, no publication into released query). Focused 26/26; npm run test:ui:agent 58 files / 404 tests passed; npm run lint:frontend clean. Source changed since smoke run — fresh build required for final gates; review/browser/full lint+test+smoke still pending; ticket remains InProgress.
