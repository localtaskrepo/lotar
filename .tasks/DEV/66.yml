  text: |-
    Plan (DEV-66):
    - Scope: view/composables/useActivity.ts, view/components/ActivityDrawer.vue, view/pages/ProjectInsights.vue + unit tests. No backend/API/store changes expected; DEV-21 terminal predicates and DEV-68 Board Other stay out.
    - useActivity: keep singleton local log (items/touches/add/markTaskTouch...) for TasksList; replace the single global feed slice with keyed per-query feed handles (key = project|windowDays|limit, timestamps computed per request) with latest-wins generations covering loading/error/success, release invalidating in-flight work.
    - ActivityDrawer: consume its own feed handle scoped to {global, 30d, 200}; manual refresh always genuinely refetches.
    - ProjectInsights: consume a feed handle keyed to {selectedProject, windowDays, 400}; migrate tasks source to DEV-65 store.getQuery handle with retain/release; request generations for stats + refresh orchestration so stale successes/errors cannot publish under a new project/window; Reload refetches visible project stats (latest wins per prefix).
    - Fix tag filtering: zero visible tasks must not count the whole feed; untagged-only filter must not include tagged tasks when requiredTags is empty.
    - Tests: deferred/out-of-order project+window requests, concurrent drawer/insights feeds, refresh overlap, stats reload/stale guard, tag zero/untagged, retain/release + failure isolation; keep existing DEV-65/53 suites green.
    - Checks: focused vitest, then npm run test:ui and npm run lint:frontend (isolated TMPDIR). No Rust/smoke now.
- date: 2026-09-13T16:59:34.436340+00:00
  text: |-
    Progress (DEV-66) — implementation complete:

    Files changed:
    - view/composables/useActivity.ts: replaced the single global feed slice (feed/feedLoading/feedError/refreshFeed, busy-guarded, no generations) with keyed ActivityFeedHandle queries via useActivity().getFeedQuery({project, windowDays, limit}). since/until are computed per refresh (never part of the key), so manual refresh genuinely refetches without unbounded key growth. Latest-wins generations cover success/error/loading; background errors preserve the last snapshot; release() invalidates in-flight work when the last owner leaves. Local log/touches API for TasksList unchanged. _resetActivityStore() added for tests.
    - view/components/ActivityDrawer.vue: owns a global 30d/limit-200 handle (released on scope dispose); open and manual refresh always issue a real request; error banner renders alongside the preserved snapshot.
    - view/pages/ProjectInsights.vue: activity chart uses its own keyed handle (project/windowDays/limit 400, adopted+released symmetrically); tasks migrated off the global active query to a retained DEV-65 store.getQuery handle (retain/release, refresh replaces membership); refreshData now generation-based (no busy-guard drops, stale successes/errors/finally publish nothing, stage bails between phases); per-prefix stats generations with Reload forcing refetch of ALL visible projects while older fill-missing responses cannot overwrite fresh values; tag fixes: zero tag matches count no feed activity, untagged-only no longer includes tagged tasks.

    Tests:
    - view/__tests__/useActivity.feed.spec.ts rewritten (9 tests): scoped request shape, first-load failure, background error keeps snapshot, latest-wins overlap incl. stale failure drop, cross-scope isolation (drawer vs insights), release invalidation, fresh key isolation, local log compat.
    - view/__tests__/ActivityDrawer.spec.ts new (4): request shape on open (global, 30d, 200), no fetch while closed, genuine manual refresh, error + snapshot.
    - view/__tests__/ProjectInsights.spec.ts new (9): global mount/overview fill, tag-zero counts nothing (avg/day tile), untagged-only, rapid project switch out-of-order settle, failed query no stale rows under new label, Reload force + stale fill guard, window switch stale-publish guard, feed failure surfaced, unmount releases (late response inert).

    Checks: focused specs green; npm run test:ui:agent full suite 58 files / 400 tests passed; npm run lint:frontend (vue-tsc) clean. Rust tests and full smoke descoped per developer instruction for this pass; worktree also carries prior DEV-65 edits and staged approved work, untouched and uncommitted.
