description: 'Found by DEV-343 (claude, 2026-11-11): agent-reviewed.yml and agent-pipeline.yml list HelpNeeded last under issue.states and set no issue.done_states, so the legacy inference (last state is done, src/services/completion.rs infer_done_statuses) counts HelpNeeded as done. Effects: worktree cleanup at Done also runs at HelpNeeded (safe: clean and landed only, and the next job recreates the worktree), and metrics and dependency checks treat handed-back tickets as finished. Shown by tests/agent_automation_integration_test.rs shipped_agent_reviewed_template_handles_hand_back_failure_review_and_merge, where DEV-343''s Done cleanup removed the worktree at HelpNeeded. Check: a project from either template counts only Done as done. Done when both templates set issue.done_states: [Done] (or order the states so Done is last) and a test checks the effective done states of each template.'
