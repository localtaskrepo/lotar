description: |-
  Found while fixing DEV-545: `view/components/ConfigTagColorsField.vue:157` calls `api.listTasks({ project, has: 'tag', limit: 1000 })` and keeps only the tags, so the config page downloads whole tickets (descriptions, comments, history).

  Check: open the config page's tag colors and look at the `/api/tasks/list` request size.

  Done: the field takes its tags from `GET /api/tasks/values` (DEV-545), with a test.
