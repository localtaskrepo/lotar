- date: 2026-11-18T03:07:27.408206+00:00
  author: claude
  text: |-
    Review: blocking. The fix is right, but once merged onto current main it doesn't compile. It needs a rebase and two one-line additions.

    - **Reviewed:** `15135f656` on `agent/DEV-617`. It is the same commit as `t3/fix-codex-retry-rate-limit-2`, so there is no newer rework.
    - **Does what the owner asked (INBOX-379, "rename … don't retry a job that failed on a rate limit"):** the new rule condition `job: { error: { matches: … } }` matches a failed job's last message. The rename and the guard are in standards: `configs/lotar/agents.yml:35` (`fix-retry`) and `configs/lotar/automation.yml:531`. Jobs that didn't fail and other events never match. The test `job_error_condition_tells_a_rate_limit_from_other_failures` covers both paths.
    - **Blocking: doesn't build on main.** Since DEV-634 (`bafbec164`), these files live in `crates/lotar-agent`. Git carries the diff over cleanly (`git merge-tree` shows no conflict). But two tests that main added later, from DEV-633 and DEV-642, build `AutomationJobContext` without the new field. `cargo check --tests -p lotar-agent` on the merge result fails:
      - `crates/lotar-agent/src/services/automation_service.rs:3789` (`end_rules_whose_checkpoint_cannot_be_saved_run_later`): `E0063 missing field error`
      - `crates/lotar-agent/src/services/automation_service.rs:3838` (closure `let job = |id: &str|` in `end_rules_whose_checkpoint_fails_permanently_are_not_kept`): same error
    - **Fix:** rebase `agent/DEV-617` onto main, add `error: None,` to both literals, then run `npm run lint`, `npm test` and `npm run smoke`. Smoke has never run on this branch.
    - **With that fix applied (scratch copy, since removed):** `cargo nextest run --workspace -E 'test(/automation|job|hand_back|moved/)'` passed 338 of 338. `npx vitest run view/__tests__/automationRules.spec.ts` passed 9 of 9.
    - **Not run:** full `npm test`, `npm run lint`, `npm run smoke`. No UI pages changed, only text helpers in `view/utils`, so no screenshots needed. No stray files. No minor findings, no tickets filed.
