- date: 2026-11-16T19:17:10.926669+00:00
  author: claude
  text: |-
    Needs your call: @fix-codex runs on Claude on purpose, by your 2026-11-15 decision, so its retry hits the same Claude limit.

    - Check confirmed: `~/.local/state/harnessmux/sessions/lotar-95e687-DEV-606-fix-codex.json` has `provider: claudeAgent`, `model: claude-opus-5-5`.
    - Source: standards `configs/lotar/agents.yml` (commit `18f28c2`, "fix-codex retries on Claude while Codex credits are out"; your words: "Back to codex, gpt-6.1-sol when its credits last"). Nothing in lotar's code is wrong here.
    - Codex still has no credits: STD-189 is Blocked "when it has credits", and no Codex job thread has run since 07:09Z today.
    - The real fix for limit failures is DEV-584 (pause until the reset). It is Blocked.

    **Question:** what should the failed-fix retry do until Codex has credits? (a) back to Codex `gpt-6.1-sol` now, (b) rename the profile to `@fix-retry`, keep it on Claude, and don't retry a job that failed on a rate limit, (c) leave it as it is until DEV-584 lands.
- date: 2026-11-16T22:32:21.573886+00:00
  author: mallox
  text: 'Answer: rename (Rename profile to @fix-retry, keep it on Claude, don''t retry a job that failed on a rate limit) (answered in INBOX-379)'
- date: 2026-11-16T23:50:08.209224+00:00
  author: claude
  text: |-
    Rules can now tell a rate-limit failure from other failures; the rename goes to STD-194 in standards.

    - New condition `job: { error: { matches: '(?i)rate limit|usage limit' } }` matches the failed job's last message (`t3 exited ... Claude API rate limit reached`). It never matches on other events. It is validated on save, documented in `docs/help/automation.md`, and the rule editor shows it as YAML-only.
    - Test: `job_error_condition_tells_a_rate_limit_from_other_failures`, with a rate-limited stub job and a plain failing one.
    - Rename to `@fix-retry` and the guard in the retry rules: [STD-194](https://standards.pyxzl.net/task/STD-194). The profile and rules live in standards `configs/lotar/`. lotar 0.15.1 reads `job:` as an unknown custom field, so the guard only takes effect from the release that includes this commit.
    - Disk is almost full (1–2 GB free; about 110 lotar worktrees keep `target/` dirs of up to 10 GB). I deleted only my own incremental cache.
