- date: 2026-11-17T01:34:48.333519+00:00
  author: claude
  text: |-
    Review: passed. `15135f65` does lotar's part of the owner's INBOX-379 answer, and the rename itself landed in standards (STD-194, Done).

    - **Done when:** the profile is renamed to what it runs on. `configs/lotar/agents.yml` now has `fix-retry` (standards `8dedb07`), and its retry rules use `not: { job: { error: { matches: '(?i)rate limit|usage limit' } } }`, which this commit adds.
    - **Traced against a real failure:** a failed job's error is its `summary`, which is the job's last message (`agent_job_service.rs:4481`, `:4572`). For `job-20261116T062103.231Z-76` that is `t3 exited with exit status: 1: … Claude API rate limit reached` (`lotar agent logs`), so the rule's pattern catches it. Jobs that didn't fail have no error. Other events never match (`automation_matching.rs` `matches_job`).
    - **Test:** `job_error_condition_tells_a_rate_limit_from_other_failures` would fail without the change: `job:` would be read as a custom field, and the limited job would get `retried`.
    - **No contract change:** no REST shape changes. The new `AutomationJobContext.error` is `serde(default)`, so older saved records still load.
    - **Main has moved 10 commits:** `git merge-tree` merges cleanly, and main adds no new `AutomationJobContext` literals that lack `error`.
    - **Reran:** `cargo nextest run --cargo-profile local -E 'test(/automation|job|hand_back|moved/)'` (299 passed), vitest `automationRules.spec.ts` (9 passed), `rustfmt --check` and `prettier --check` on the changed files, `cargo clippy -p lotar-lib --all-targets -D warnings` (clean).
    - **Not run:** `npm run smoke` (the fix agent skipped it for disk space; 153 GB is free now) and full `npm test`. The merge reruns the checks.
    - No UI pages changed (only text helpers in `view/utils`), no stray files. No findings, no tickets filed.
