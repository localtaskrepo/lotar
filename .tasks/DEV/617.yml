- date: 2026-11-16T19:17:10.926669+00:00
  author: claude
  text: |-
    Needs your call: @fix-codex runs on Claude on purpose, by your 2026-11-15 decision, so its retry hits the same Claude limit.

    - Check confirmed: `~/.local/state/harnessmux/sessions/lotar-95e687-DEV-606-fix-codex.json` has `provider: claudeAgent`, `model: claude-opus-5-5`.
    - Source: standards `configs/lotar/agents.yml` (commit `18f28c2`, "fix-codex retries on Claude while Codex credits are out"; your words: "Back to codex, gpt-6.1-sol when its credits last"). Nothing in lotar's code is wrong here.
    - Codex still has no credits: STD-189 is Blocked "when it has credits", and no Codex job thread has run since 07:09Z today.
    - The real fix for limit failures is DEV-584 (pause until the reset). It is Blocked.

    **Question:** what should the failed-fix retry do until Codex has credits? (a) back to Codex `gpt-6.1-sol` now, (b) rename the profile to `@fix-retry`, keep it on Claude, and don't retry a job that failed on a rate limit, (c) leave it as it is until DEV-584 lands.
