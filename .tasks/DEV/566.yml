- date: 2026-11-15T18:41:50.804636+00:00
  author: claude
  text: |-
    Another case, other trigger: STD-45 (standards) went to Done unmerged with a blocking review.
    - Not an `automation run`: a second @fix job `job-20261115T072832.176Z-373` (same owner answer, queued twice) started at 07:28:32.47, 0.3 s after the first fix job's end set Reviewing/@review. So its start assignee was already @review.
    - Its end matched "Review passed: merge" (Merging/@merge). The review job `…072848.852Z-408` then blocked, and its end matched "Merge agent lifecycle": Done, `review-blocked` removed, no merge ran.
    - The first fix (assignee after start rules) doesn't catch this, since the assignee didn't change during the job. The queue-start check (entry @fix, ticket @review) should. Please cover this order in a test.
    - Check: `lotar --tasks-dir ~/Development/standards/.tasks agent logs job-20261115T072832.176Z-373`
