- date: 2026-11-15T18:13:42.492529+00:00
  author: claude
  text: |-
    Fixed: a job's end rules no longer move a ticket that was reassigned while the job ran.

    - Cause (LOCA-333): fix job `job-20261115T173815.583Z-7` started with the ticket on `mallox`. The agent ran `lotar automation run "Answered in the thread: review on Codex"`, which sets Reviewing/@review at once (not a deferred job outcome). At the job's end the rules matched the *new* assignee @review, so "Review passed: merge" set Merging/@merge and queued merge job `…174245.273Z-26`. The review job `…174010.077Z-13` was then created while the ticket was Merging, so lotar judged it a merge job.
    - Fix: every job now records its ticket's assignee after its start rules (before: merge jobs only). `apply_job_event` skips the end rules when the assignee changed since; a recorded outcome still applies. The job log says `… was reassigned (to @review) while the job ran: its end rules don't move it again`.
    - Second "Done when" item: in this flow the merge job came only from that end rule, so it isn't queued now; the review's end then sees @review plus `review-blocked` and sends it back to @fix.
    - Files: `crates/lotar-lib/src/services/automation_service.rs` (`reassigned_during_job`), `agent_job_service.rs`, `AutomationJobContext.assignee_at_start`. Docs: `docs/help/agent.md`, `docs/help/automation.md`.
    - Test: `crates/lotar-lib/tests/dev566_moved_during_job_test.rs`.
  report:
    commits:
    - hash: 1dc53b41
      what: a job's end rules skip a ticket reassigned while the job ran; start assignee recorded for every job
    checks:
    - command: cargo nextest dev566_moved_during_job_test
      result: passed
      reason: main case failed with the skip disabled
