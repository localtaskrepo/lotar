- date: 2026-11-15T22:40:57.441479+00:00
  author: claude
  text: |-
    Rework 3: the `review-blocked` guard now covers every job lotar runs as a merge job, not only profile `merge`.

    - **Finding (Merging ticket, other or no profile bypassed the guard):** fixed. `review_blocks_merge` in `crates/lotar-lib/src/services/agent_job_service.rs` uses `is_merge_job_candidate`, the same classification that gives a job the merge worktree and checks. The comment names the job: `The @fix job didn't start: <ID> carries tag review-blocked, …`, or `The merge job …` without a profile.
    - The queue check in `automation_service.rs` `queued_stage_allows_start` now runs it before the profile early return, so an entry without a profile is covered too.
    - **Tests:** the unit test adds Merging + `review-blocked` with `@fix` and with no profile. The integration test `merge_job_does_not_start_while_review_blocked` adds a direct `@fix` start on a Merging ticket. Both fail under the old profile-only guard and pass now.
    - Removed the unit assertion that a `@fix` job on a blocked Merging ticket starts: lotar runs that job as a merge job. The rework rules set @fix and remove the tag together, so a real rework still starts.
    - `docs/help/agent.md` says which jobs the guard covers.
    - `agent/DEV-566` (`~/.t3/worktrees/lotar/agent-DEV-566-7288458cdef30afb`) moved to `eadf0315` with `git reset --keep`; `9b70f43d` stays on `t3/fix-blocking-review-end-rule-3`.
