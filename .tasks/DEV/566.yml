- date: 2026-11-15T20:42:36.196822+00:00
  author: claude
  text: |-
    Rework 2: a merge job no longer starts while `review-blocked` is set, whether queued or started directly.

    - **Finding 1 (merge allowed with @merge + review-blocked):** fixed. `review_blocks_merge` in `crates/lotar-lib/src/services/agent_job_service.rs` refuses a job of profile `merge` while the ticket has tag `review-blocked`. It runs in `start_job` (every start path) and in `queued_stage_allows_start` (`automation_service.rs`), which drops the queue entry and comments `The @merge job didn't start: <ID> carries tag review-blocked, and no rework has removed it.` The rework rules remove the tag, so a reworked ticket merges as before.
    - The tag name is now known to lotar, next to the `merge` profile and the `Merging` status it already treats specially. `docs/help/agent.md` documents it.
    - **Finding 2 (`Review failed: merge without it` ignores the tag):** covered by finding 1: that rule's merge job now refuses to start. Upstream rule fix still tracked in STD-139.
    - **STD-45 order (comment 18:41):** the unit test now covers an @fix entry while the ticket is at @review. It doesn't start.
    - **Tests:** `a_queued_job_does_not_start_after_its_ticket_moved_on` (unit, replaces the test that allowed the blocked merge) and `merge_job_does_not_start_while_review_blocked` (integration, direct start). Both fail with the check turned off and pass with it on.
  report:
    commits:
    - hash: 9b70f43d
