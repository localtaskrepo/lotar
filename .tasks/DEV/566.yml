- date: 2026-11-15T18:23:53.361982+00:00
  author: claude
  text: |-
    Reworked for the review: a queued merge job no longer starts after a blocking review sent the ticket back.

    - Finding (merge starts while `review-blocked`): fixed at the start boundary. On LOCA-333 the merge job `…174245.273Z-26` sat in the agent queue while the review ran, then started after the ticket had gone back to @fix with `review-blocked`. Now the queue worker checks just before it starts an entry (next to DEV-524's prerequisite check): when the ticket is assigned to *another agent profile* than the entry's, the job doesn't start and the ticket gets `The queued @merge job didn't start: <ID> is assigned to @fix now.` Assigned to a person, or still to its own profile: it starts as before.
    - Why the assignee, not the tag: lotar gives `review-blocked` no meaning. The repo's rules do: "Review passed: merge" already excludes it, and a blocking review always sends the ticket to a fix profile. So "moved to another agent" covers the stale merge without lotar hard-coding a tag.
    - Gap left in the rules, filed as STD-139 (standards): "Review failed: merge without it" merges a ticket that a failed reviewer had already tagged `review-blocked`. That's a rule change in `configs/lotar/automation.yml`, not lotar.
    - Code: `queued_stage_allows_start` in `crates/lotar-lib/src/services/automation_service.rs`, called from `start_entry` in `agent_queue_service.rs`. Docs: `docs/help/agent.md` (queue worker). Commit amended.
  report:
    commits:
    - hash: b3168b0f
      what: end rules skip a ticket reassigned during the job; a queued job doesn't start once its ticket is assigned to another agent profile
    checks:
    - command: cargo nextest a_queued_job_does_not_start_after_its_ticket_moved_to_another_agent
      result: passed
