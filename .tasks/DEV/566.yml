      reason: needs a live fix job that runs lotar automation run
    next: Review on another model, then merge
- date: 2026-11-15T18:16:19.539453+00:00
  author: codex
  text: |-
    Review: blocking

    - Missing acceptance condition: `crates/lotar-lib/src/services/agent_job_service.rs:272` admits merge jobs without checking `review-blocked`; `is_merge_job_candidate` at line 4017 accepts any Merging ticket or merge profile. The new guard at `automation_service.rs:602` compares assignees only. A queued/requested merge can therefore still start with a blocked review. Add protection at the merge-start boundary (or equivalent configured enforcement), with a regression proving no merge starts until rework. The implementation comment acknowledges this protection was not added.
    - Read full `main..HEAD` diff/commit `1dc53b41`, ticket/comments/relationships (none), recent main history for touched services, repo/backend/testing guidance, LOCA-333 history and its project automation. History confirms the reported jump. Review-passed rules exclude the tag, but the job-start boundary does not. No `docs/decisions` exists here.
    - Focused rerun passed 3 tests with `RUSTC_WRAPPER=` after both initial and approved cache-enabled retries hit sccache permissions. Diff whitespace check passed. Full lint/test/smoke not rerun; implementation reports passed. No UI changes, file edits, commits, minor findings or guidance correction. Status and assignee unchanged.
  report:
    checks:
    - command: RUSTC_WRAPPER= npm run test:rust:agent -- dev566_moved_during_job_test
      result: passed
      reason: 3 tests
    - command: git diff --check main...HEAD
      result: passed
    - command: full lint/test/smoke
