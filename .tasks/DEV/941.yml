- date: 2026-11-27T22:26:42.443797+00:00
  author: claude
  text: 'On 2026-11-27 the owner archived the 2,241 top-level threads that had been settled for more than 7 days (list: ~/.t3/archived-2026-11-27-ids.txt). After that, `t3 thread list --project` returns 625 threads and 676 KB for lotar (was 1,633 and 1.6 MB), 260 for standards and 252 for local. One call still takes 0.3 to 0.4 s, mostly the Electron start, so the cost per look stays and the fix here is still needed. Within a week the lists grow back, since about 170 threads are added a day.'
- date: 2026-11-27T22:38:09.630512+00:00
  author: claude
  text: |-
    lotar now lists T3 threads over T3 Code's internal WebSocket, not by starting `t3 thread list` for every look.

    - `crates/lotar-agent/src/services/t3_thread_api.rs`: `list_threads` reads the `orchestration.subscribeShell` snapshot (`omitOlderSettled`). The bearer comes from one `t3 auth session issue --scope orchestration:read --ttl 60m`, cached per process and reissued about once an hour. The output has the CLI's JSON shape (status, settled, hosted link).
    - `/mcp` rejects an issued bearer with 401 `invalid_mcp_credential`, so the WebSocket is the only route that needs no Electron start. Live probe: 38 threads, 116 KB, 1.6 s.
    - `agent_job_service/resumed.rs`: if the API fails, lotar falls back to `t3 thread list` and logs that once. Host jobs (DEV-901) still list over ssh with the CLI.
    - `agent_job_service/kept.rs`: a thread the list leaves out (an older settled or archived one) counts as settled for the DEV-747 cut.
    - Tests: the dev503 fake server answers `subscribeShell`, and the dev626 fake refuses it, so the CLI fallback path stays covered. Added 4 unit tests.
    - A stale `target/debug/lotar` (DEV-934) failed one dev503 test until `cargo build --workspace --bins` rebuilt it.
    - No guidance correction.
