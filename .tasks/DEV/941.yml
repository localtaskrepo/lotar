- date: 2026-11-27T22:42:32.361172+00:00
  author: claude
  text: |-
    Review: passed. `c316658fd` does what "Done when" asks; two minor follow-ups filed.

    - **Read:** the diff of `main..HEAD` (one commit, based on main's tip `4d569cdf3`, no newer main commits to the touched files), the ticket and both comments, AGENTS.md, and T3 Code's own source (the extracted app bundle) for `t3_thread_list`, `listedThreadStatus`, `threadSettlement`, `hostedThreadLink` and the CLI's `resolveProject`.
    - **Matches T3 Code:** the status derivation (`activityRunStatus`, then `failed`, then `waiting` for an awaited task, a subagent or a background task), `settled` from `settledOverride`, the hosted link encoding and the deepest-project match all agree with T3 Code's code. A live snapshot from the fix agent's probe has every field lotar reads.
    - **Session:** one `t3 auth session issue --scope orchestration:read --ttl 60m` per T3 home, reissued after 55 min. A refused WebSocket drops it. All the flags exist in `t3 auth session issue --help`.
    - **Fallback:** if the API fails, lotar uses `t3 thread list` and logs that once. Host jobs (DEV-901) are still listed over ssh. `settle_now` and `settle_superseded` go through the same `resumed::list_threads`.
    - **Tests:** the DEV-626/810/836/876 tests changed only their fake servers and the expected link (now T3 Code's hosted link). Their assertions are otherwise unchanged.
    - **Reran:** `npm ci` (ok), `cargo build --workspace --bins`, `cargo nextest run -E 'test(t3_thread_api) | test(/dev503_harness_jobs_test::|dev626_resumed_t3_threads_test::/)'` (91 passed), `npm run lint` (passed). The worktree is unchanged.
    - **Minor, filed:** [DEV-942](https://lotar.pyxzl.net/task/DEV-942): when no T3 project contains the repo, the WebSocket list returns an empty success instead of falling back to the CLI. [DEV-943](https://lotar.pyxzl.net/task/DEV-943): no test covers the new rule that a missing thread counts as settled (`kept.rs:145`).
    - **Still open, after release:** measure `t3_thread_list` calls and new `auth_sessions` rows per hour. The full suites and smoke run at merge.
