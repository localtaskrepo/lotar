description: |-
  Every lotar server lists all of its project's T3 Code threads every 30 seconds, settled ones included, so the cost of each look grows with every job thread ever run. Measured on 2026-11-27 in a performance check from a standards thread. The owner picked "lotar perf ticket" on 2026-11-27, after reading the numbers below.

  ## Measured (2026-11-27)

  - `resumed::look` runs `t3 thread list --project <repo> --json` at most every `LOOK_EVERY` (30 s) per tasks dir. `kept::settle_now` (a job ends) and `kept::settle_superseded` (a job starts) call it again. With 6 `lotar serve` processes, the T3 server's trace shows about 14 CLI sessions a minute, 7,544 `t3_thread_list` calls in 88 minutes.
  - Each call starts the T3 Code Electron binary as node: 0.4 to 0.6 s, 0.32 s CPU and 230 MB peak memory (`/usr/bin/time -l`). That happens about 14 times a minute on a Mac that is often short of memory (swap at 86% on 2026-11-25, see the reliability evidence in standards).
  - The CLI pages through every unarchived thread of the project. For lotar that is 1,633 threads, 1.6 MB of JSON and up to 17 MCP pages per call, and all 1,633 are settled. standards has 832 (829 settled), local 657 (656 settled).
  - `look_at_threads` uses only threads whose status is `running` or `waiting`. `kept` uses only threads that aren't settled yet. Nearly all of the data is thrown away.
  - Each CLI call also mints a bearer session ("t3 thread cli") that T3 Code never deletes. There are 644k rows in `auth_sessions` now (230 MB). That part is T3 Code's own bug and is being reported upstream; fewer calls from lotar also shrink it.

  ## Fix

  - Ask T3 Code only for the threads lotar can act on. T3's MCP tool `t3_thread_list` already takes `settled: false` and `statuses: [...]`; the CLI's `thread list` has neither flag. Options, cheapest first:
    - call the MCP endpoint (or the internal WebSocket API that `t3_thread_api.rs` already uses) with `settled: false`, through one session per look instead of a new CLI process per call;
    - or, if that turns out fragile, keep the CLI and look less often when no `t3` job ended in the last hour.
  - One list per look serves `resumed`, `kept::settle` and `unlogged` (it already does). `settle_now` and `settle_superseded` can use the same filtered list.
  - Keep the behaviour of DEV-626, DEV-810, DEV-836 and DEV-876 (takeover, kept threads, superseded threads); their tests must still pass.

  ## Done when

  Found 2026-11-27: `/mcp` takes only an MCP client credential, which T3 Code mints in-process for its own CLI; a bearer from `t3 auth session issue` gets 401 there. The internal WebSocket's `orchestration.subscribeShell` with `omitOlderSettled` takes that bearer and sends every unsettled thread of all projects plus the recently settled ones (38 threads, 116 KB on 2026-11-27, against 1.6 MB for lotar's 1,633 by CLI).

  - [ ] `resumed::look`, `kept::settle_now` and `kept::settle_superseded` get the project's threads from `orchestration.subscribeShell` (`omitOlderSettled: true`): every unsettled thread, no settled ones paged through. Each listed thread has the same fields the CLI gave (status as T3 Code's MCP list derives it, `latestRunId`, hosted link, `settled` from `settledOverride`, title, `runtimeMode`).
  - [ ] The bearer session (`orchestration:read`) is issued once per process and reused until shortly before its TTL (1 h) ends: at most one `t3` start and one new `auth_sessions` row per process an hour for looks, not one per look. A refused WebSocket drops the session, and the next look issues a new one.
  - [ ] When the WebSocket route fails (server not running, refused, T3 Code changed the API), the look falls back to `t3 thread list` as before, and the process logs the reason once. A failed CLI too: no list, the next look tries again (as now).
  - [ ] A kept thread the list doesn't show counts as settled or archived, as T3 Code left it out: the "later job's thread settled" rule (DEV-747) treats it as settled; nothing is settled or stopped that isn't listed unsettled.
  - [ ] Host jobs' threads (DEV-901) are still listed by `t3 thread list` on the host over ssh (on the host, not this Mac).
  - [ ] The tests of DEV-626, DEV-810, DEV-836, DEV-876 pass unchanged; unit tests cover the snapshot parsing (project match, status, settled, link) and the WebSocket round trip against a fake server.
  - [ ] Measured after release: `t3_thread_list` calls and new "t3 thread cli" rows in `auth_sessions` per hour, before and after, in a comment.
