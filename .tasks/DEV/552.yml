description: |-
  DEV-499 adds the workspace crate `lotar-core` (lotar-lib depends on it). `release.yml` publish-crates now publishes `lotar-web-assets lotar-core lotar-lib lotar`, through trusted publishing only (docs/release-guide.md, "crates.io trusted publishing setup").

  ## Found

  - `lotar-core` is not on crates.io yet (the API returns 404 on 2026-11-14). The name is free.
  - Trusted publishing can't create a crate: the first publish needs a token. Until then the next release's publish-crates fails at `lotar-core`, and `lotar-lib` and `lotar` stay unpublished.

  ## Owner steps (before the next release tag)

  1. Publish `lotar-core` once with a token: `npm run build:web && node scripts/stage-crates.mjs && cargo publish --allow-dirty -p lotar-core` (the current workspace version, or the next release's).
  2. Register its trusted publisher: owner `localtaskrepo`, repository `lotar`, workflow `release.yml`, environment `release`. Turn on "trusted publishing only".
  3. Revoke the token.

  ## Done when

  - [ ] crates.io lists `lotar-core` with the trusted publisher, and the next release's publish-crates job passes.
