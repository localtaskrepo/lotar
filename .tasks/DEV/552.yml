  text: 'An agent can''t do these steps: they need the owner''s crates.io account and a token. Checked on 2026-11-15: crates.io still returns 404 for lotar-core. `cargo publish --dry-run -p lotar-core` passes for v0.15.0 (it packages and builds the crate). lotar-core has no path dependencies and stage-crates copies nothing into it, so step 1 is just `cargo publish -p lotar-core`, with no web build, staging or --allow-dirty. Question for mallox: please publish lotar-core 0.15.0 with a token, register its trusted publisher (localtaskrepo/lotar, release.yml, environment release, trusted publishing only), revoke the token, then set this ticket to Done.'
