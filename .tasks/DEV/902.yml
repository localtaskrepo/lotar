  author: claude
  text: |-
    Review: passed. `1d2f71d10` does what "Done when" asks; merge can go ahead.

    - Read: the commit diff (`agent-team.yml`, the new test, `docs/help/templates.md`), the ticket, DEV-796, the example in `docs/help/automation.md` ("When prerequisites are done"), and the last 5 main commits on the touched files. DEV-843 (`03663babd`) is already in the branch base.
    - Rule: `unblocked` now has `set: status: InProgress`, like the docs example. `remove tags [waits]` and `tell_agent` are unchanged. The other template rules agree: `job_started` sets InProgress anyway, and no `updated` rule reacts to InProgress in a way that would start a second job.
    - Test `shipped_agent_team_template_continues_a_waiting_ticket_once` passes. With the old template restored for a moment, it fails at line 3156 (`Blocked` ≠ `InProgress`). I restored the file and the worktree is clean.
    - The "one tell comment" point differs from "Done when", and the reason holds: `automation_service.rs:2733` comments "told no agent … yet" only when `tell_agent` returns a reason. A queued job returns none. The test checks one queued `implement` job and no new comment on the second run, which covers what the ticket meant.
    - Nothing extra in the commit: 3 files, no stray files. No owner decision touched.
    - Minor, filed: [DEV-926](https://lotar.pyxzl.net/task/DEV-926) (tag owner). DEV's own rule in `.tasks/DEV/automation.yml:1048` has the same missing `set`, and the daily `repos.ts --fix` run reaches it.
