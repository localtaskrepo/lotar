- date: 2026-11-27T04:10:15.130444+00:00
  author: claude
  text: |-
    Fixed: agent-team's "Prerequisites done" rule now moves the ticket to InProgress, so a second run finds nothing.

    - Branch fast-forwarded to main (DEV-796 landed); the rule there still had no `set`.
    - `agent-team.yml`: the `unblocked` action sets `status: InProgress`; `remove tags [waits]` and `tell_agent` stay.
    - New test `shipped_agent_team_template_continues_a_waiting_ticket_once` in `agent_automation_integration_test.rs`: it inits from the template, runs `lotar config validate`, then runs `lotar automation run "Prerequisites done: continue the waiting ticket"` twice. The ticket is InProgress while its job waits in the queue, the queue holds 1 `implement` job, and the second run says "none match" and adds no comment.
    - Deviation: the test doesn't check for a "told no agent … yet" comment. A command-runner job from the CLI goes to the queue file without that comment. The test checks instead that the second run adds no comment.
    - `docs/help/templates.md`: the Prerequisites bullet says the ticket goes back to InProgress.
    - Finding, not changed: DEV's own rule of the same name in `.tasks/DEV/automation.yml` (line 1025) also has no `set`, so a scheduled run can tell a Blocked DEV ticket again. That's the owner's config.
