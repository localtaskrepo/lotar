description: |-
  Found in the DEV-796 review (2026-11-26). The rule "Prerequisites done: continue the waiting ticket" in `crates/lotar-lib/src/cli/handlers/config/init/templates/agent-team.yml` (on `agent/DEV-796`, not yet on main) has no `set` that moves the ticket out of Blocked. docs/help/automation.md (When prerequisites are done) says such a rule needs one, because `lotar automation run` fires `unblocked` on every run while the ticket matches. The ticket only leaves Blocked at job_started. While the job waits for a slot, each scheduled run tells the agent again and leaves another "told no agent on <ID> yet" comment.

  ## Done when

  - [ ] The agent-team rule "Prerequisites done: continue the waiting ticket" sets `status: InProgress` in its `unblocked` action, as the docs/help/automation.md example does; its `remove tags [waits]` and `tell_agent` stay.
  - [ ] A test inits a workspace from the agent-team template, makes a Blocked ticket whose prerequisites are done, runs `lotar automation run "Prerequisites done: continue the waiting ticket"` twice and gets exactly one agent job and one tell comment; the second run reports none match.
  - [ ] The ticket is InProgress after the first run, also while its job waits for a free slot.
  - [ ] `lotar config validate` still passes on a workspace from the template.
