description: 'Found in the DEV-638 merge on 2026-11-17: in a full smoke run (load average ~38) smoke/tests/harness.mcp-client.smoke.spec.ts:80 got ''Timed out waiting for MCP response with id 1'' instead of /exceeded maximum/ (5000 ms wait). It passed 3 of 3 runs alone and in a second full run. Check: npm run test:smoke:agent under load. Done when the oversized-line rejection does not depend on a 5 s response wait (e.g. the client rejects as soon as the line passes the limit) and the test passes under load.'
