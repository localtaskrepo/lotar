    Plan: typed reference in the job log, a paged reader by job id, a Conversation section loaded on open.

    - Job log: new event `agent_job_transcript` with `transcript {source, session, agent, agent_session, turn, format: 1, link}`, after `Session::send` (`drive_session`) and for each later turn of the job (`drive_turns`, `TurnStarted`).
    - `GET /api/jobs/transcript?id=&after=&limit=`: finds the session from the reference, else from the job log's `harnessmux attach <name>` line plus the job's time window; reads only `<harnessmux state>/sessions/<name>.events.jsonl` (and its kept `<name>.<stamp>` copies), names checked with harnessmux's `validate_name`. Tool calls and thoughts are merged server-side, `raw` is dropped. Unknown job: 404.
    - UI: Show conversation under Show thread, request only on open; states loading, expired, error + retry, unsupported with the attach command; t3: Open in T3 and "Tool calls are in T3" when the turn has no tool events.
    - Told DEV-901, DEV-867 and DEV-782 threads about the shared files.
- date: 2026-11-26T23:38:29.800560+00:00
  author: claude
  text: |-
    The Timeline now reads a job's conversation from its harnessmux event log, and only when you open it.

    - **Reference:** each job logs an `agent_job_transcript` entry with the turn `Session::send` returned. A continued session's second job logs turn 2, and a message sent to a running job adds its turn.
    - **REST:** `GET /api/jobs/transcript?id=&after=&limit=` returns only the job's turns, in pages by harnessmux `seq`.
      - It takes the job id only. Any other parameter is a 400, an unknown job a 404.
      - The session name from the job log must pass harnessmux `validate_name`, and only `<sessions>/<name>.events.jsonl` and its kept copies are read.
    - **Old logs** without a reference read the session their progress line names, the turns that started while the job ran. With no match, they show the unsupported state.
    - **UI:** Show thread → **Show conversation** on Timeline jobs (not `command` jobs).
      - States: loading; expired ("The conversation is no longer on this machine.", the summary stays); offline or error with Retry; unsupported with `harnessmux attach <name> --from-start` to copy.
      - "Turn N of M" header and Load more.
      - t3 jobs: **Open in T3**, and "Tool calls are in T3" when the log has no tool events.
    - **Contract:** `api_types.rs`, `types.ts`, `openapi.json`, `agent.md`, `api-quick-reference.md` and `sse.md` agree. I also changed `AgentJobLogEntry`'s `nullable` (inert in OpenAPI 3.1) to `type: [.., "null"]`, so the published schema now validates.
    - **Screenshots** at phone width, 390px: [before](attachment:dev909-before-thread.fd9f40c2dae2d70b7b0c5e2368ddefcf.png) · [Claude turn](attachment:dev909-after-claude.298a81cf368d1b239d68e7e0ff93b451.png) · [reused session, turn 2](attachment:dev909-after-reused.4a320b1a036d3c2bd3dcd9e5588b2db0.png) · [t3 without tools](attachment:dev909-after-t3-without-tools.da6aa91325d8cbd6194730883e83e38c.png) · [expired](attachment:dev909-after-expired.7d39dd080addb79ce12fed29c644cfd5.png)
    - **Guidance:** no durable finding. One thing to know: `cargo nextest -p lotar-lib` doesn't rebuild the root `lotar` bin that the CLI tests run, so build it first.
