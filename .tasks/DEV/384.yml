comments:
- date: 2026-11-12T20:26:55.335514+00:00
  author: claude
  text: 'claude: Owner 2026-11-12 widened the scope: ''if we can configure an automation that a comment on any tickets kicks of or queues for an agent, then we should do that as well. Let''s do it right from the start.'' So: any ticket, not only one with an agent (no agent yet: the rule starts one that reads the comment and acts on it); configurable as a rule action, because standards'' shared automation.yml will turn it on in every repo (STD-56). Related: DEV-385 (unblocked hook) may share the start-or-queue mechanics.'
- date: 2026-11-12T20:27:57.708785+00:00
  author: claude
  text: 'claude: Plan after the owner widened the scope (relayed by the standards thread, 2026-11-12): a rule action `tell_agent: { message, agent }`, usable on any hook (on.commented now, DEV-385''s hook next). Running job on the ticket: the message is queued to it; for the t3 runner it runs as the thread''s next turn inside the same job, so end rules wait for the answer (the job drains an inbox file next to its active-job record, so a comment from any process reaches it). Idle ticket: its agent is the assignee if that is an agent profile, else the last agent profile in its history, else the action''s `agent`; the ticket is assigned to it and a job starts with the message as prompt, as the next turn of its last T3 thread (session: continue) when there is one. Who may trigger it is the rule''s conditions (DEV-383''s author condition); comments from inside an agent job (LOTAR_AGENT_JOB_ID set) never do. Asked the DEV-383 thread for its author field name and told the DEV-385 thread about the shared action.'
- date: 2026-11-12T20:48:01.251023+00:00
  author: claude
  text: 'claude: Done in e7b3400 on agent/DEV-384 (signed, not merged). It sits on top of 5f4fc78 (DEV-383, not merged yet), so the merge agent must land DEV-383 first. What changed: a new rule action, tell_agent: { message, agent }, usable on any hook (src/automation/types.rs, src/services/automation_service.rs tell_agent(); DEV-385 can put it on its new hook as is). If a job is running on the ticket, the message is queued to it. A t3 job runs it as its thread''s next turn inside the same job, before the end rules (an inbox file next to the active-job record in agent_active_jobs.rs, so it works from any process, including taken-over jobs). A Claude job in the same process gets it on stdin. For other runners, a job with the message is queued behind the running one. Idle ticket: it goes to its agent (the assignee if that''s an agent profile, else the last agent profile in its history, else the action''s agent), which starts with the message, as the next turn of its last T3 thread. Safety: at most 10 queued turns per job; a runner with LoTaR''s env never tells itself. Pair the action with DEV-383''s comment author condition, as in the docs example. Validation and simulate know the action; the web UI describes it, and its editor edits it in YAML only. Docs: automation.md (Telling the ticket''s agent), agent.md. Also fixed a race I hit in npm test: the agent context file is now written atomically (agent_context_service.rs), so a job starting right after another can''t read it half-written. Checks: npm run lint passed; npm test passed (2075 Rust incl. 3 new t3 tests and 2 new unit tests, 1471 UI); npm run smoke 381/381. Not checked: a real T3 Code thread (tests use a fake t3).'
- date: 2026-11-12T20:53:17.511871+00:00
  author: claude
  text: 'claude: Merged and pushed. DEV-383 had already landed as 71984c8 (the same change as the 5f4fc78 this branch was built on), so I replayed only this ticket''s commit onto main: 163d6c6 (signed). Fast-forwarded main to it, committed the ticket files as dcc5d79 (DEV-384 Ticket updates), and pushed 167fcf1..dcc5d79 to origin; the pre-push hooks passed. Checks in the worktree after the rebase: npm run lint passed, npm test passed (2075 Rust, 1471 UI, release and hook tests), npm run smoke 381/381. Left for DEV-385, which lands after this: switch lotar''s rule ''Prerequisites done: continue the waiting ticket'' in .tasks/DEV/automation.yml to tell_agent (message = its current prompt, agent ''@fix''), as agreed with the DEV-385 agent.'
