description: |-
  The owner's idea (2026-11-12), his words: "I may find something where I comment from browser through the different boards and that should probably generally kick off either an agent to check what I said and how to action on it, or be queued up to the agent currently working on the task so it knows there's a response or comment. Lotar can then actually also become a communication platform focused on project management. A ticket then becomes a watch for a project agent in a way. And maybe that's another feature we want to add to lotar if we don't already have a way to do that."

  Today a person's comment on a ticket reaches no agent: a running job doesn't see it, and nothing starts one.

  ## Plan
  - Check what exists first (commented hook, `session: continue`, the t3 runner's thread) and what a rule could already do.
  - A person's comment (not an agent's; comment authors exist since DEV-327) on a ticket with an agent:
    - job running: deliver it to that job (for the t3 runner, as a message to its thread) so the agent sees it on its next turn;
    - no job running: start one that reads the comment and acts on it, as the next turn of the ticket's last thread (`session: continue`) where there is one.
  - Configurable per project (which people, which profiles), off by default; docs.
  - Depends on the comment-author condition (related ticket) if it's built as a rule.

  ## Done when
  - [ ] A comment by the owner on a ticket whose agent is running reaches that agent; on an idle ticket it starts one
  - [ ] Tested and documented
