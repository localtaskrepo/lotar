description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: C14.

  read_current_branch/read_remotes still assume .git is a directory although discovery accepts gitdir files. Resolve linked-worktree metadata or reuse sanitized Git commands. Acceptance: branch task inference and remote discovery work in normal and linked worktrees, including relative gitdir/common-dir paths; unknown repository state fails safely. DEV-53 agent isolation helpers already exist and should be reused where appropriate.

