description: |-
  Found in the DEV-649 review (2026-11-16).

  ## Found
  - `crates/lotar-lib/tests/web_api_integration_test.rs:855`: the test drops the peer before `shutdown(Both)`. When the peer's close lands first, `shutdown` answers `NotConnected` (DEV-649 now accepts it), but then `set_read_timeout` succeeds, so that run never reaches the EINVAL branch of `read_until_deadline` it was written for (DEV-640).
  - A scratch loop of the same steps on macOS saw `shutdown=NotConnected timeout=ok read=0` once and `shutdown=ok timeout=InvalidInput read=0` four times.

  ## Check
  - Run the test's steps in a loop: every iteration has `set_read_timeout` fail with `InvalidInput`.

  ## Done when
  - [ ] The test reaches the EINVAL branch on every run, e.g. by shutting the socket down while the peer is still alive and dropping the peer afterwards.
