  text: 'Fixed in 25cb89e4: the fixture repo sets user.name, user.email and commit.gpgsign=false in its local config, which LoTaR''s own commit of leftover changes reads. Local: the 17 dev318 tests pass and npm run lint is clean; I couldn''t reproduce CI''s missing identity on the Mac (the harness scrubs GIT_CONFIG*, and git still finds one). CI: Quality Assurance run 43381803290 passed, the first green run on main since DEV-408.'
description: |-
  Quality Assurance on main fails since DEV-408 (runs 43367062775 to 43380454839): dev318_t3_runner_test::a_job_on_another_model_starts_a_new_thread_on_the_unmerged_branch. The fixture sets the git identity only with -c on its own git calls; LoTaR's commit of the earlier thread's leftover changes runs without it, and the CI runner has no identity ("empty ident name"), so the job falls back to continuing the earlier thread. On the Mac git finds an identity, so it passes locally. Blocks the v0.14.3 release (DEV-415).

  ## Done when
  - [ ] The fixture repo has its own user.name, user.email and commit.gpgsign=false in its local config
  - [ ] QA green on main
