description: 'Found during DEV-467 review: npm run test:rust fails before compilation because /opt/homebrew/bin/sccache rustc -vV returns Operation not permitted in the restricted agent sandbox. Repeated reviews stopped without trying authorized execution. Check: run npm run test:rust -- pending_outcome_tests in the restricted harness. Done when agent verification guidance or harness permissions provide a working authorized retry and distinguish sandbox denial from a code failure. Related DEV-467.'
