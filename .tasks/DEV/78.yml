  text: 'Plan (session 2026-09-11): fix three researched failing-test issues + two coverage/hermeticity items, all test-infra side, no production behavior changes. (1) tests/agent_automation_integration_test.rs async_run_action_does_not_block: replace sleep-0.1 timing assumption with a child release gate (script waits bounded ~10s for a release file, then writes marker) + Drop guard that releases on any exit path, so a blocking regression fails promptly and no child leaks. (2) .config/nextest.toml: put binary(agent_safety_test) into the agent-processes group (max-threads=1) like agent_automation_integration_test; retries stay configured but nothing relies on them because test:agent overrides --retries 0. (3) src/storage/transaction.rs concurrent_transactions_serialize_on_the_coordinated_locks: bounded retry on IoError kind WouldBlock (the legitimate 2s busy timeout under fsync load) only, preserving the read-back-own-write serialization assertion and the recovery_waits_for_the_journal_projects_task_lock timeout test; no production timeout change. (4) tests/dev56_task_identity_test.rs mcp_single_file_reference_blocks_on_held_store_lock: try .git FILE marker (find_repo_root supports files), then fall back to a fixture under CARGO_TARGET_TMPDIR so find_repo_root discovers the real checkout root by ancestry (sandbox denies creating ANY .git path - verified dir+file both EPERM); genuine contention coverage without git commands or production repo-discovery changes; DEV-79 records any remaining gap. (5) tests/common/mod.rs ctor: isolate TMPDIR under a dot-prefixed owned scratch per test process (DEV-90) so fixtures are not siblings of leftover workspaces in the shared temp dir. Verification: focused nextest runs per test, then npm run test:agent (default concurrency, retries 0) and npm run lint:agent.'
