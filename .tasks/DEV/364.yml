- date: 2026-11-12T08:05:34.892803+00:00
  text: 'claude: Owner 2026-11-12: no v0.13.4 for this alone (''Wait, clean up by hand''); the fix ships with the next release (DEV-372). Cleanup by hand 2026-11-12: lotar''s worktrees had grown from 24 GB (2026-11-11 cleanup) to 85 GB. With no agent job running and no process in them, I deleted the git-ignored target/ in the 19 worktrees that had one (7 agent-DEV-*, 12 t3-*), so the worktrees went to 17 GB and the free space from 135 to 167 GiB. The local Time Machine snapshot com.apple.TimeMachine.2026-11-11-213344.local still holds the deleted files; thinning it was refused by this session''s permissions and is left to the owner (tmutil thinlocalsnapshots / 200000000000 4).'
