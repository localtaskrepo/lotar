description: |-
  Finished agent jobs leave their build output behind: every lotar job worktree keeps a 2 to 7 GB `target/`, so 41 lotar worktrees grew to 144 GB and the Mac's disk reached 98% (13 GiB free) on 2026-11-11. The owner: "That's a little too much storage used in parallel. we don't have that much space available actually". Reported by the pyxzl.net thread "Split Repo Binaries to Skip CI Builds".

  ## Cause

  - Each worktree builds three profiles of its own (`debug` for lint, `local` for tests, `smoke`), about half of it `incremental/` data. sccache (`~/.cargo/config.toml`, STD-40) already shares the compile cache, at an 86% hit rate, but every `target/` still holds full copies.
  - DEV-343's cleanup at Done removes a worktree only when `git cherry` finds every branch commit on main. The merge jobs land the commit rebased or reworked, so 3 of the 8 Done worktrees were refused (DEV-343, 346, 348). DEV-366 tracks that.
  - Jobs that end with the ticket open (HelpNeeded, failures) keep their worktree on purpose, and with it `target/`.
  - T3 thread worktrees (`t3-*`) are T3's. lotar only touches the ones its `t3` runner plans for a job.

  ## Cleanup done 2026-11-11 (owner approved)

  - Removed the 8 agent worktrees of Done tickets (5 by `lotar agent worktree cleanup`, 3 by `git worktree remove` after checking they were clean). Their branches stay.
  - Deleted `target/` in the 25 idle worktrees. Running jobs (DEV-358, 360, 361, 362) and active threads were left alone.
  - Thinned Time Machine's local snapshots, which still held the deleted files (`tmutil thinlocalsnapshots / 200000000000 4`).
  - The worktrees went from 144 GB to 24 GB. The disk went from 13 GiB to 207 GiB free; the snapshots also held other deleted data.

  ## Fix (owner approved 2026-11-11: "Go ahead, @fix job builds it")

  - A setting such as `agent.worktree.cleanup_paths` (lotar's repo: `["target"]`). When a job ends and no other job runs in its worktree, lotar deletes those paths if git ignores them, and the worktree stays. This covers the `t3` runner's worktrees too. A resumed job rebuilds, mostly from sccache.
  - No shared `CARGO_TARGET_DIR`. Parallel jobs would wait on Cargo's build lock and rebuild one another's branches, and sccache already shares the compiling.
  - The `npm ci` on worktree creation stays (the owner's T3 setting, about 230 MB a worktree). It matters little once finished worktrees lose their build output.
  - Interactive T3 threads' worktrees are cleaned by `scripts/repos.ts` in standards, a day after they are clean and merged (STD-41). Dropping `target/` as soon as such a thread settles is a proposal for standards.

  ## Done when

  - [x] Space freed without losing work
  - [ ] Ending a job deletes the configured build output from its worktree; tests cover the success, HelpNeeded and running-job cases
  - [ ] Docs (`docs/help/agent.md`, `docs/help/config-reference.md`) and lotar's own config updated
  - [ ] Reporter thread told when it is released
