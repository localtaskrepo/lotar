description: |-
  Found by the refine pilot (standards STD-96, docs/evidence/refine-pilot.md), 2026-11-13. src/services/agent_job_service.rs thread_with_open_work: when release_branch fails, the Err arm returns OpenWork::Continue for every profile, also for session: fresh. DEV-414 chose this to match DEV-408. But fresh exists for the @review stage (STD-59): a reviewer that continues the author's thread reviews its own work in the author's context, the case DEV-414 was made to prevent.

  ## Done when
  - [ ] A session: fresh job whose branch can't be freed fails with the git error in the log, instead of continuing the earlier thread. session: new keeps DEV-408's fallback.
  - [ ] Test: fresh with release_branch failing fails the job; new with the same failure still continues.
  - [ ] docs/help/agent.md says what fresh does when the branch can't be freed.
