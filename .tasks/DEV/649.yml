description: |-
  Found in the DEV-639 merge (2026-11-16).

  ## Found
  - `crates/lotar-lib/tests/web_api_integration_test.rs:861` (added by DEV-640): `stream.shutdown(Shutdown::Both).unwrap()` panics with `Os { code: 57, kind: NotConnected }` when the dropped peer's reset arrives first.
  - `node scripts/rust-test-runner.mjs --agent read_until_deadline` failed 1 of 5 runs; `npm run test:agent` failed on it once.

  ## Check
  - Run `node scripts/rust-test-runner.mjs --agent read_until_deadline` 20 times: every run passes.

  ## Done when
  - [ ] The test no longer fails when `shutdown` returns `NotConnected` (accept that error, the socket is shut down either way), and still covers the EINVAL path of `read_until_deadline`.
  - [ ] 20 repeated runs pass.
