- date: 2026-11-17T05:52:01.505728+00:00
  author: claude
  text: |-
    Review: passed. `c9ed2248e` fixes the panic; one minor gap filed as [DEV-650](https://lotar.pyxzl.net/task/DEV-650).

    - Read: the diff (`crates/lotar-lib/tests/web_api_integration_test.rs:861`), the ticket, DEV-640's commit `bfb2cb834` and `read_until_deadline` (line 27). No other commits on main touch the file since. No stray files; not UI work.
    - Reran `node scripts/rust-test-runner.mjs --agent read_until_deadline` 20 times: 20 passed.
    - Failing before the fix: a scratch loop of the same steps (outside the repo) hit `shutdown` → `NotConnected` in 1 of 5 iterations, which the old `unwrap()` turns into the reported panic. So the race is real and the fix covers it.
    - Minor: in that `NotConnected` run `set_read_timeout` succeeds, so the run skips the EINVAL branch. The claim "shut down either way" is only partly true. Most runs still cover EINVAL, so the merge can go ahead. Filed [DEV-650](https://lotar.pyxzl.net/task/DEV-650): shut down before dropping the peer.
