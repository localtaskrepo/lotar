- date: 2026-11-17T05:41:58.862263+00:00
  author: claude
  text: |-
    Fixed: the test accepts `NotConnected` from `shutdown`, so the race no longer panics.

    - `crates/lotar-lib/tests/web_api_integration_test.rs`: `shutdown(Both)` now passes on `Ok` or `NotConnected` and panics on any other error. Either way the socket is shut down, so `read_until_deadline` still runs its EINVAL path.
    - Before the fix the race didn't show up in 10 runs. After it, 20 out of 20 runs of `node scripts/rust-test-runner.mjs --agent read_until_deadline` passed.
    - `npm run lint:agent` is clean, and `npm run test:rust:agent` passed all 2294 tests.
