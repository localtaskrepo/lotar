- date: 2026-11-27T17:16:29.529219+00:00
  author: claude
  text: |-
    Disk gate now counts purgeable space on macOS.

    - `read_free` in `crates/lotar-agent/src/services/disk_gate.rs` reads `kCFURLVolumeAvailableCapacityForImportantUsageKey` via CoreFoundation FFI (no new crate); statvfs on other systems or when macOS gives no value.
    - Hold reason names the reading: `41.5 GB free on the job worktrees' disk (available for important use, purgeable included), under the floor of 60 GB`; `(statvfs)` or `(LOTAR_DISK_FREE_GB)` otherwise. The cleanup log line names it too.
    - `LOTAR_DISK_FREE_GB` still wins over both.
    - New test `the_reading_counts_purgeable_space_on_macos_and_is_statvfs_elsewhere` reads the real disk.
    - On this Mac: `df` 367 GB available, important-use 378 GB.
    - Docs: `docs/help/agent.md` Disk gate section.
