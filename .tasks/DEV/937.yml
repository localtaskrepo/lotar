description: |-
  Found 2026-11-27 on the owner's Mac: Data volume 865 of 926 GB used, the disk gate read 61 GB free; after the local Time Machine snapshots went, 160 GB free. Snapshot space is purgeable: macOS frees it by itself when space runs short. read_free (crates/lotar-agent/src/services/disk_gate.rs:402) uses fs2::available_space (statvfs f_bavail), which leaves purgeable space out, so the gate holds jobs at the floor (owner's config 30 GB, default 60 GB) though the space is there. 2026-11-26 the gate held jobs from 09:52 at 37 GB free while the snapshots held about 420 GB.

  Owner 2026-11-27, asked whether lotar should count purgeable space: "lotar counts purgeable (Recommended)".

  Done when: on macOS the gate reads the space available for important use (NSURLVolumeAvailableCapacityForImportantUsageKey, which includes purgeable space; statvfs elsewhere), the hold message names which reading it used, LOTAR_DISK_FREE_GB still overrides it, and a test covers the reading.
