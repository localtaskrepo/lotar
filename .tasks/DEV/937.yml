- date: 2026-11-27T17:18:02.408469+00:00
  author: claude
  text: |-
    Review: passed. The fix does everything "Done when" asks, nothing blocks the merge, and I filed no tickets.

    - **Read:** the diff of `012d3b0f6`, compared against `main` at `76f28e5ad`. Also the ticket, the owner's decision ("lotar counts purgeable (Recommended)"), the DEV-837 docs and `AGENTS.md`. No other commits or branches carry this fix.
    - **Done when:**
      - On macOS, `read_volume` asks CoreFoundation for `kCFURLVolumeAvailableCapacityForImportantUsageKey`; other systems, or a macOS call that gives no value, fall back to statvfs. See `crates/lotar-agent/src/services/disk_gate.rs:420`.
      - The hold message and the cleanup log line both name the reading they used (`disk_gate.rs:246`).
      - `LOTAR_DISK_FREE_GB` is still checked before any real reading (`disk_gate.rs:414`).
      - The new test `the_reading_counts_purgeable_space_on_macos_and_is_statvfs_elsewhere` could not have passed before the fix. It relies on the unit-test ctor setting `LOTAR_DISK_FREE_GB`; the ctor does set it (`crates/lotar-core/tests/common/unit_test_environment.rs:35`, included through `crates/lotar-agent/src/lib.rs:25`).
    - **FFI:** every CoreFoundation object the code creates or copies is released exactly once, and the value's type is checked before it is read as a number. No new crate.
    - **Docs:** the Disk gate section of `docs/help/agent.md` matches the code.
    - **Reran, all passed:**
      - `npm ci`
      - `cargo nextest run -p lotar-agent --lib disk_gate` (6 tests)
      - `cargo clippy -p lotar-agent --all-targets`
      - `cargo build --bin lotar`, then `cargo nextest run -p lotar-lib --test integration dev837`
      - `rustfmt --check` and `prettier --check` on the changed files
    - **Not rerun:** the full `npm run lint`, `npm test` and `npm run smoke`; the merge runs them. No UI changed, so no screenshots were needed.
    - The worktree is clean.
