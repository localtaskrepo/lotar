- date: 2026-11-17T22:12:35.529796+00:00
  author: claude
  text: |-
    Review: blocking. A merge agent that exits 0 without landing the other repo's branch still completes the job, so the ticket goes Done with that repo's main unchanged.

    - **Read:** HEAD `08d2ef118` (= `agent/DEV-677`, no newer branch commits): `merge.rs` `work_elsewhere`, `named_paths`, `common_dir`; `agent_job_service.rs` `merged_despite_failure`, `ensure_branch_merged`, `finalize_job`; both new tests in `dev605_merge_without_agent_test.rs`; `docs/help/agent.md` steps 304 and 383; the ticket and its 3 comments.
    - **Reran:** `npm ci` (ok), `cargo fmt --all --check`, `cargo clippy --all-targets --all-features -- -D warnings`, `npm run test:rust:agent -- merge` (50 passed). Not rerun: full `npm test`, `npm run smoke`.
    - **Fixed since last review:** a failed merge runner now leaves the job `failed` (`merged_despite_failure` checks `work_elsewhere`). Sound.
    - **Blocking:** `crates/lotar-agent/src/services/agent_job_service.rs:4862` `ensure_branch_merged`, `Ok(true)` arm. After a successful merge agent run it only asks whether lotar's own `agent/<ID>` is on main, which it always is in this case, so the job completes. The other repo is never checked. Likely in practice: the merge agent runs in lotar's worktree, and its sandbox refuses writes to the other checkout ("leave the changes: LoTaR commits them"). It exits 0, and the ticket goes Done with the other repo unmerged, which is the bug this ticket fixes. The test `a_ticket_whose_work_is_in_another_repository_is_not_done` (`dev605_merge_without_agent_test.rs:224`) asserts exactly this: its stub agent merges nothing and the job is `completed`. Ticket's Done asks that "the merge refuses Done when the ticket names another repo's branch with commits beyond its main".
    - **Fix:** in that `Ok(true)` arm, next to the `unlanded_ticket_branch` guard, return `Err("Merge job finished, but <ID>'s work is in another repository: <work_elsewhere text>")` when `merge::work_elsewhere(tasks_dir, ticket_id, &repo_root, &branch)` is `Some`. Change that test to expect `failed` (stub doesn't merge), and add one where the stub fast-forwards the other repo's main → `completed`. Mention it in `docs/help/agent.md:304`.
- date: 2026-11-17T22:18:49.831529+00:00
  author: claude
  text: |-
    Rework: a merge agent that exits 0 without landing the other repo's branch now fails the job, so the ticket doesn't go Done.

    - Review read HEAD `08d2ef118`, so the finding stands. Fixed as suggested.
    - `agent_job_service.rs` `ensure_branch_merged`, `Ok(true)` arm: when `merge::work_elsewhere` still finds the ticket's commits in another repo, the job fails ("Merge job finished, but <ID>'s work is in another repository: ..."). A handback (agent changed the assignee) still ends without the failure, as before. The handback check moved into a closure so both paths use it.
    - Tests in `dev605_merge_without_agent_test.rs`: `a_ticket_whose_work_is_in_another_repository_is_not_done` now expects `failed` (its agent merges nothing); new `a_merge_agent_that_lands_the_other_repository_completes` (agent fast-forwards the other repo → `completed`); the failed-runner test stays.
    - `docs/help/agent.md` merge-job paragraph describes the new failure.
