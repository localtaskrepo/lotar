description: 'Found (STD-138, 2026-11-17): DEV-564 lives in lotar''s .tasks but its work is harnessmux branch agent/DEV-564 (9977dec). Twice, review and merge ran in lotar''s checkout, saw lotar''s empty agent/DEV-564, reported ''Nothing to merge: agent/DEV-564 is in main already'' and automation set DEV-564 Done, though the reopen comment named the harnessmux checkout and branch. DEV-636 landed only because its reviewer read the fix comment''s next step. Check: a ticket in lotar''s .tasks with commits only in another repo''s agent/<ID> ends Done with that repo''s main unchanged. Done: jobs for such a ticket run in the repo that holds the work (or the merge refuses Done when the ticket names another repo''s branch with commits beyond its main), with a test.'
