description: |-
  Found (DEV-339, 2026-11-11): agents end their summary with lines like "left its status and assignee for the job to move on". The owner read that as the ticket already being in the merge phase; it only moves when the job ends, through the automation rules. Agents copy the wording from the job prompt in src/services/agent_job_service.rs (the handles_job_end note, "move this ticket to the next step as if you finished ... don't change its status or assignee"), which tells them what to do but not how to report it.

  Proposal: add one sentence to that note, e.g. "In your final summary, say that the ticket moves to its next step when this job ends and that you didn't change its status or assignee." Owner decides the wording.

  Check: run an agent job on a ticket with job-end automation and read its final summary. Done: the summary says the ticket moves when the job ends, not that it already moved; the prompt test in agent_job_service covers the new sentence.
