    - `crates/lotar-agent/src/services/t3_worktree_setup.rs`: `RESULT_SECS` is 2 days. `prune()` deletes older `.result` files first, judged by file age (unreadable age counts as now, so the file is kept). It then handles `.json` records as before. `record()` and `setup()` both run it.
