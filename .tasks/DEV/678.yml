description: |-
  Found reviewing DEV-674 (`crates/lotar-agent/src/services/t3_worktree_setup.rs`).

  - `prune()` turns an expired `<job>.json` into a `<job>.result`, and `setup()` writes one for each record it claims. Only `finish()` deletes a `.result`. A job whose process died before `finish()` (lotar killed, Mac restarted) leaves its `.result` behind for good. Before DEV-674 the leftover was a `.json`; now it is a `.result`.

  ## Done when
  - [ ] `prune()` also deletes `.result` files older than a limit long enough for any session to end (for example 2 days, by file age).
  - [ ] A unit test covers an old `.result` being deleted and a fresh one being kept.
