comments:
- date: 2026-11-26T10:20:54.801404+00:00
  author: claude
  text: |-
    Fixed: the test waited on the machine's check lock, not on the merge code.

    - Cause: a direct `cargo nextest run` leaves `LOTAR_CHECK_LOCK_HELD` unset, so the test's merge job took the real lock on port `47586` (DEV-784). While another run held it (here DEV-862's Rust suite), the job waited and `merge()` hit its 60 s deadline: "the merge job didn't end: running". `npm test` sets the variable, so only direct nextest runs fail.
    - Reproduced before the fix: 1 of 1 failed at 60.3 s, the lock held by DEV-862's suite.
    - Fix in `crates/lotar-lib/tests/common/mod.rs`: `reset_lotar_test_environment` sets `LOTAR_CHECK_LOCK_HELD=1`, like the memory and disk gates. No change to product code.
    - After: 5 of 5 alone with `--retries 0` and all 21 dev605 tests pass, with another suite holding the lock the whole time.
  report:
    commits:
    - hash: 87323f0c3
      what: tests set LOTAR_CHECK_LOCK_HELD=1, like the memory and disk gates
    checks:
    - command: cargo nextest run -p lotar-lib --test integration a_check_that_leaves_a_process_running --retries 0 (5x)
      result: passed
      reason: 5 of 5, 6.7 s each, with another worktree's suite holding the lock
    - command: cargo nextest run -p lotar-lib --test integration dev605 --retries 0
      result: passed
      reason: 21 of 21
    - command: rustfmt --check, cargo clippy -p lotar-lib --tests
      result: passed
    - command: npm run lint / npm test / npm run smoke
      result: not_run
      reason: the merge runs them (DEV-797)
    next: Review, then merge
