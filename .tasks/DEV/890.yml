description: |-
  Found: in the review of DEV-863 on 2026-11-25, `cargo nextest run -p lotar-lib --test integration dev605` on main `cc453dc5c` plus DEV-863's test-only commit failed it 3 of 3 tries (60 s, the merge job still running); load average 7-10. Run alone on `cc453dc5c` (`cargo nextest run -p lotar-lib --test integration a_check_that_leaves_a_process_running`) it failed once and passed on retry (nextest: 1 flaky). DEV-885 closed it as passing alone on `2e49a88db` 4 of 4; main's merge code hasn't changed since, so it is intermittent, not fixed.
  Check: run the alone command with `--retries 0` 5 times under normal load.
  Done: the test passes 5 of 5 alone with `--retries 0` and in the full suite.
