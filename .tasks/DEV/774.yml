- date: 2026-11-23T00:23:28.071900+00:00
  author: claude
  text: |-
    Done: lotar is on harnessmux 0.3.0, Claude tool rows name their command or path, and plans appear in the job log.

    - `Cargo.toml`: harnessmux `0.3.0`. I fast-forwarded the branch to main first so it has DEV-766
    - `agent_runner.rs`: resume maps the new `Error::NotResumable`, the same line as DEV-777. Without it, 0.3 would break the fallback to a new session
    - `agent_job_service/tools.rs`: input, paths and output now come from `tool.started`, `tool.updated` and `tool.finished`, not `raw`. The newest input wins. For Codex, the output is harnessmux's joined terminal output. A cut longer than 16 KB keeps its full size in `output_bytes`
    - A `tool.updated` that changes the title, input or paths writes another `running` entry. The log shows only each call's newest entry (`visibleLogEntries`), so a running Claude Bash call shows its command live
    - `plan` events become `agent_job_plan` entries: `plan` holds the steps, and `message` is a Markdown task list, or "Plan cleared". `api_types.rs`, `types.ts`, `openapi.json`, `agent.md` and `sse.md` all agree
    - Tests: the event shapes come from harnessmux's live Claude recording, plus Codex shapes. The driver test runs 40 Claude calls and 2 plans; its log stays under 200 KB
  report:
    commits:
