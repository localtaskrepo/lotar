- date: 2026-09-11T15:17:33.479237+00:00
  text: 'Implemented under DEV-78 scope (session 2026-09-11). Fixture hermeticity against sibling .tasks contamination now holds at the TMPDIR level: a ctor in tests/common/mod.rs (and a mirrored #[cfg(test)] ctor in src/lib.rs for the lib test binary) redirects TMPDIR to .lotar-test-scratch/<pid>-<nanos>/ under a dot-prefixed base that candidate_task_roots sibling scanning can never see. mod common was added to the 14 fixture-creating test files that lacked it (config_validation, config_validate_integration, storage_path_safety, sync_report_safety, config_service_inspect, config_service_branch_alias, storage_search_freshness, sprint_storage, scanner_custom_ticket_patterns, cli_project_resolver_unit, config_normalization_safety, workspace_unit, sprint_single_membership, scan_ignore_and_filters). Under nextest each test runs in its own process, so fixtures of different tests are no longer siblings of each other or of unrelated leftover workspaces (the ws1-3 failure class); multiple fixtures inside one test remain siblings as before. Cleanup: #[dtor] removes the scratch on regular exits, and each process sweeps base entries whose owning pid is dead, because nextest kills finished test processes before destructors; leaked scratches stay invisible to scans either way. Evidence: ctor DIAG output showed per-process scratches (e.g. .../T/kilo/.lotar-test-scratch/<pid>-<nanos>), a direct binary run swept 4 stale dead-owner dirs, and full gates below. Verification: npm run test:rust:agent -- --no-fail-fast -> 1000 tests, 994 passed, 6 failed (all six are the pre-existing sandbox .git-denied agent_safety git tests, unrelated to this change; see DEV-79); npm run test:ui:agent 291/291; npm run lint:agent clean. Smoke not run per session instruction (test-infra-only change; smoke gate deferred to integration). Uncommitted, unstaged; no production behavior changed.'
