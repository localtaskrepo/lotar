title: Rust test fixtures are not hermetic to sibling .tasks workspaces under the shared temp dir
status: Todo
priority: Medium
type: Bug
reporter: mallox
created: 2026-09-11T06:20:31.516893+00:00
description: |-
  StorageLocator::candidate_task_roots (src/storage/locator.rs) scans visible sibling directories of a workspace for .tasks folders (monorepo layout). Test fixtures use tempfile::tempdir() directly under the shared per-session temp dir, so any leftover visible sibling workspace containing .tasks leaks its tasks into every fixture that shares a project prefix.

  Evidence (2026-09-11 final DEV-55 verification): scratch workspaces ws1/ws2/ws3 (TEST projects with @sprints, created ~11:29-11:33 local) under the shared temp dir caused 6 deterministic failures with InvalidTaskId and task-count assertions: services::sync_service::retry_safety_tests::{sync_dry_run_never_writes_journal_tasks_or_remote, sync_dry_recovery_preserves_journal_and_rejects_cross_scope_linking, sync_creation_link_failure_recovers_once_both_providers_and_directions, sync_returned_identity_journal_failure_never_recreates, sync_replacement_io_failure_preserves_all_pending_intents} and sync_report_safety_test::sync_push_dry_run_does_not_persist_even_when_reports_requested. search() merges sibling TEST-1..3 phantoms while get/canonical_sync_task_id only read the primary root. Rerunning with an isolated clean TMPDIR passed the full suite unchanged, so this is environmental, not a DEV-55 regression.

  Scope: consider nesting fixture tempdirs one level deeper (dedicated parent per suite/run), or a test-only guard asserting candidate_task_roots returns only the fixture root. Not fixed during DEV-55 verification (read-only mandate); ws1-3 are the concurrent reviewer's scratch data and were left untouched.
