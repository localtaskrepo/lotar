- date: 2026-11-13T19:36:50.553507+00:00
  author: claude
  text: 'Seen again 2026-11-13 in DEV-477 rework: test:smoke:agent 389/390, harness.server.smoke.spec.ts:409 killed-run registry still present; the spec alone passed 3/3 and a full rerun passed 390/390.'
- date: 2026-11-13T20:12:42.464363+00:00
  author: claude
  text: 'Fixed 2 of the 3 flakes in commit 3784d308. (1) merge_jobs_are_serialized_even_with_parallel_slots: the stub agent used sleep 1, and the test waited only 1.5s for the first job to reach running, so a slow worktree startup failed it. The stub now waits on a release file (bounded at ~30s, opened by a Drop guard). The test checks that the second job is still queued while the first runs, then opens the gate. The serialization check is now stronger, not just given a longer timeout. (2) harness.server.smoke.spec.ts:409: the reaper kills the servers and only then removes the registry, but the test checked the registry as soon as the server exited. It now polls until the registry is gone. (3) ui.soft-delete:176 did not reproduce in 5 sequential and 6 parallel runs under full CPU load, and reading the code found no cause, so it is filed as DEV-483 rather than masked. A new flake seen once in ui.version-fields under full load is filed as DEV-484. Checks: npm run lint ok, npm run test:agent ok (2133 Rust tests plus UI, release and hooks), npm run test:smoke:agent 389/390 (the DEV-484 flake), then 390/390 on rerun.'
- date: 2026-11-13T21:26:03.227632+00:00
  author: claude
  text: 'Seen again 2026-11-13 in DEV-491 (branch without 3784d308): smoke 391/392, harness.server.smoke.spec.ts:409 killed-run registry still present; the file alone 19/19, full rerun 392/392.'
- date: 2026-11-13T22:08:14.305089+00:00
  author: claude
  text: 'Seen again 2026-11-13 (DEV-493, full npm run smoke at machine load 28): harness.server.smoke.spec.ts ''stops the servers of a run that is killed (DEV-471)'' failed: expect(existsSync(registry)).toBe(false) got true, at line 409, right after the exit poll. The spec passed twice when run alone (19/19). It looks like the registry file is removed after the process exits, and the assertion does not wait for that.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A6c227a71-21a4-46cb-8af4-a68a07438dc9
description: 'Found during DEV-467 verification on 2026-11-13: initial test:agent failed merge_jobs_are_serialized_even_with_parallel_slots at tests/agent_automation_integration_test.rs:2637 waiting 1500ms for running; full retry passed all 2139 Rust tests. First smoke run passed 389/390 but harness.server.smoke.spec.ts:409 found a killed-run registry still present. Second smoke run passed 389/390 but ui.soft-delete.smoke.spec.ts:176 timed out waiting for the deleted task row. These are observed intermittent verification failures, not established product root causes. Check: npm run test:agent and npm run test:smoke:agent under concurrent agent activity. Done when the timing and cleanup races are reproduced and corrected without masking behavior failures. Related DEV-467 and DEV-471.'
