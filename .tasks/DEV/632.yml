description: 'Found: in the DEV-607 merge (2026-11-16, load ~60) serve_honors_explicit_tasks_dir_for_api_requests failed at crates/lotar-lib/tests/cli_serve_features_test.rs:169 with ''output capture did not finish: Err(Timeout)'' (recorded on DEV-624). stop() waits STOP_TIMEOUT (5 s, :21, :240) for the child''s stdout/stderr readers to finish; DEV-624 only raised the per-request read wait, not this one. Check: npm run test:agent under load, or the cli_serve_features_test filter in parallel. Done: the output-capture wait no longer fails a child that exits late on a loaded machine, and the filter passes 5 times in a row in parallel.'
