comments:
- date: 2026-11-17T00:33:37.100368+00:00
  author: claude
  text: |-
    Fixed: output capture no longer shares the stop deadline with the child's exit.

    - Cause: `stop()` used one `STOP_TIMEOUT` deadline for both the child's exit and `finish_output_capture`, so a child that exited late, or was killed at the deadline, left the readers almost no time to finish. The failed-start path reused the expired ready deadline in the same way.
    - Change: `finish_output_capture()` now waits its own `OUTPUT_CAPTURE_TIMEOUT` (15 s), starting after the reap, in `crates/lotar-lib/tests/cli_serve_features_test.rs`.
    - No failing test first: the flake needs a heavily loaded machine. The existing `completed_output_waits_for_stderr_after_stdout_readiness` test still covers the capture wait.
    - Note: `-p lotar-lib` alone doesn't build the `lotar` binary these tests need. Run the filter without `-p`.
  report:
    commits:
    - hash: '62531193'
      what: output capture gets its own 15 s window after the child is reaped
    checks:
    - command: cargo nextest run -E 'test(cli_serve_features_test)' --test-threads 16 x5
      result: passed
    - command: same filter x5 alongside 40 busy processes (load ~14)
      result: passed
    - command: load ~60 reproduction
      result: not_run
      reason: could not recreate that load
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: passed
    next: Review, then merge
- date: 2026-11-17T00:37:27.721035+00:00
  author: claude
  text: |-
    Review: passed. `62531193` does what "Done when" asks; no tickets filed.

    - Read: the diff (only `crates/lotar-lib/tests/cli_serve_features_test.rs`, +9/-5), the ticket and its comments, DEV-624 and its commit `10cadb71`. On main, only `3ec533d6` has touched this file.
    - Cause holds: `stop()` used one 5 s `STOP_TIMEOUT` deadline for both the child's exit and the reader wait. A child that exited at about 5 s, or was killed then, left the readers almost no time. That gives the `:169` `Err(Timeout)` failure. The new `OUTPUT_CAPTURE_TIMEOUT` (15 s) starts after the reap, in `stop()` and in the failed-start path alike.
    - Scope is right: it doesn't touch `STOP_TIMEOUT` or the kill fallback, and it adds nothing the ticket didn't ask for.
    - No test that failed first: acceptable here. Only a late-exiting child shows the flake, and the existing `completed_output_waits_for_stderr_after_stdout_readiness` test still covers the reader wait.
    - Merge note: DEV-624 (`10cadb71`, Merging) adds `RESPONSE_TIMEOUT` on the same line after `STOP_TIMEOUT`. `git merge-tree` reports a conflict there; the fix is to keep both constants.
    - Reran: `cargo nextest run --cargo-profile local -E 'test(cli_serve_features_test::)'` 6 times, 15/15 each time, at load ~18. Clippy `--tests -p lotar-lib` clean, `rustfmt --check` clean, worktree unchanged.
