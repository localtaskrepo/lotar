  text: |-
    No fix in this repo: lotar already is a T3 Code project, the check misreads it. Filed STD-282.

    - The project exists: `t3 project list` shows `lotar` at `/Users/mallox/Development/@localtaskrepo/lotar`, and `t3 thread list --project <dir> --json` exits 0 (the "Done when" holds).
    - Cause: that output is 1,080,266 bytes, over the 1 MiB `spawnSync` default in `scripts/repos.ts` (`t3` helper, ~line 2977), so it fails with `ENOBUFS` and the check reports a missing project.
    - Every repo will show this as threads pile up; `t3 project add` would not help.
    - Nothing to commit here.
