  text: |-
    Review: passed. `ad0e78fce` does what "Done when" asks; two minor follow-ups are filed (DEV-857, DEV-858).

    **Read**
    - `git diff main...HEAD` (14 files; `main` is 2 commits ahead and doesn't touch these files), the ticket, the fix comment, `AGENTS.md`, `docs/help/agent.md`.
    - Ticket link: the job reads its ticket with `TaskService::get`, which fills `url` from `server.public_url`, so every turn's prompt has `- Link:` under the ID. A turn that continues an older thread goes through the same `build_prompt`.
    - Thread state only reads (`t3 thread show --json --messages 0`) and changes neither the job nor the ticket. API types, `types.ts`, `openapi.json` and the help pages agree.

    **Reran**
    - `npm ci`: passed.
    - `cargo nextest run -p lotar-agent -E 'test(t3_state) | test(build_prompt)'`: 10 passed.
    - `cargo nextest run -p lotar-lib -E 'test(jobs) & test(t3)'`: 11 passed.
    - `vitest --config view/vitest.config.ts AgentT3Thread.spec.ts AgentJobs.spec.ts`: 36 passed.
    - Live check: this branch's `lotar serve` on a scratch workspace with copies of DEV-849's real job logs.
      - Two t3 jobs resolved to two different real threads (`4e0d…`, `38f9…`), both `finished`. The fix agent's check had seen `4e0d…` as `running`, so the state change shows up, and the ticket stayed `Reviewing`.
      - A claude job got 400; an unknown job got 404.
    - I checked `t3 thread show` output on 0.1.11 by hand. It has the fields the parser reads (`status`, `activeRunId`, `pendingRequestCount`, `link`, `updatedAt`). A thread T3 doesn't have gives "…is no longer available."

    **Screenshots**
    - I read the fix agent's before and after sets (all 12 attached). They look right.
    - My own after set, light and dark at 1920, 1440 and 390 px, with real threads: the row reads well in both themes, the chip shows its state as text, and the row wraps cleanly at 390 px. No problems.

    **Not verified**
    - The `- Link:` line inside a real T3 thread. Every existing thread was started by the installed 0.15.6, so the first t3 job after install should show it.

    **Filed (minor)**
    - [DEV-857](https://lotar.pyxzl.net/task/DEV-857): a thread whose turn ended on `t3_background_wait` (`completed`, background tasks pending) shows Finished while its job still runs.
    - [DEV-858](https://lotar.pyxzl.net/task/DEV-858): no REST test for `GET /api/jobs/t3-thread` (400, 404, unavailable, two threads on one ticket).
