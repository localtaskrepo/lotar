description: |-
  A LoTaR ticket already links to its T3 Code job threads. From T3, the ticket ID is easy to spot in the thread title, but getting back to the ticket takes a search. In LoTaR, the job and ticket statuses do not tell you whether the attached T3 thread is running, waiting for you, or finished.

  Ravi approved reciprocal links and live T3 state in LoTaR on 2026-11-24 and asked to queue the work for when credits reset. The GitHub mirror is deferred.

  ## Done when

  - [ ] LoTaR-launched T3 work includes a clickable link to the canonical LoTaR ticket in the job context shown in T3. Cover fresh threads and continuation or retry of a thread that predates the feature. Resolve the URL using the project or deployment's existing public URL configuration, or add a documented setting if needed. Keep the ticket ID usable when no URL is configured. Keep the existing LoTaR-to-T3 link.
  - [ ] The existing LoTaR Agents job detail shows the linked thread's current T3 state and a way to open it. Use the recorded environment and thread identity so multiple attempts on a ticket resolve to the correct thread. Show useful states for running, waiting for input when known, finished, failed, and unavailable. Display T3 state separately from the LoTaR job outcome and ticket status. A T3 run ending must not change either one.
  - [ ] Refresh while the relevant job detail is open using a bounded read path supported by T3 Code 0.1.11, through the existing T3 or harnessmux integration where practical. Keep the job view usable when T3 is offline, the thread is gone, or a historical job lacks an identity. Non-T3 jobs keep their existing behavior. Document the freshness and unavailable behavior.
  - [ ] Verify against a real T3-backed job that the two links open their intended destinations and that a thread state change appears in LoTaR without changing ticket status. Cover retries or multiple threads, an unavailable T3 server, and non-T3 jobs with targeted tests. Attach the UI review screenshots and record the checks that ran.

  ## Starting points

  - `docs/help/agent.md` (T3 Code threads), `crates/lotar-agent/src/services/agent_job_service.rs` (job context and harnessmux session links), and `view/pages/AgentJobs.vue` (job detail).
  - T3 exposes `t3_thread_read` over MCP and the host CLI provides `t3 thread show`. This investigation verified a live thread read on 0.1.11. DEV-810 was still `InProgress` while its sampled T3 run had failed. See DEV-600 for waiting-for-input handling and DEV-832 for multiple runs around a usage-limit reset.
