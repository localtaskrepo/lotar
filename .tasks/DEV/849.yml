- date: 2026-11-24T21:53:36.161937+00:00
  author: claude
  text: |-
    Done: tickets and T3 threads link both ways, and a t3 job's **Show logs** panel shows its thread's state in T3 Code, in `ad0e78fce`.

    - **Ticket link**: every job prompt has `- Link: <public_url>/task/<ID>` under the ID. A turn that continues an older thread sends it too. Without `server.public_url`, the prompt has only the ID.
    - **Thread state**: new `GET /api/jobs/t3-thread?id=<job>` runs `t3 thread show`.
      - States: Running, Waits for an answer, Finished, Failed, Stopped, Unavailable (with the reason).
      - The thread comes from the job's own log, so each retry shows its own thread.
      - Limits: one check per thread every 10 s, 10 s timeout.
      - It never changes the job or the ticket. Jobs that aren't t3 get no row.
    - **UI**: new `view/components/AgentT3Thread.vue` with an **Open in T3 Code** link. It checks again every 15 s while visible, and on **Refresh**. A failed check keeps the last answer.
    - **Docs**: `agent.md` (T3 Code threads), `config-reference.md`, `api-quick-reference.md`, `openapi.json`.
    - **Live check** (built binary, test workspace):
      - This job's real thread: `running`, with its link and environment.
      - A thread T3 doesn't have: Unavailable, "Thread … is no longer available."
      - A job that recorded no thread: Unavailable, with the reason.
      - A CLI job: 400. An unknown job: 404.
    - **Limit**: the T3 CLI has no environment flag. It asks this Mac's T3 Code server, the one t3 jobs start their threads on. The recorded environment is used only for the link.

    Screenshots (test workspace, all three jobs with logs open):

