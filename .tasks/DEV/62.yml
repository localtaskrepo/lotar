- date: 2026-10-02T20:14:13.194428+00:00
  text: |-
    Plan (tracking agent; source changes owned by implementation agents). Scope: align MCP lifecycle notifications and smoke transport with the advertised protocol (audit M1 M2 T1).

    1. Standards-compliant initialize: negotiate protocolVersion, advertise capabilities, and handle/echo clientInfo per spec.
    2. Reach Ready only after the client sends notifications/initialized; before that, reject premature requests BEFORE any side effects (no dispatch, no mutation, consistent error).
    3. Support ping requests per spec once initialized.
    4. Emit tool-change notifications with the correct method notifications/tools/list_changed (replacing tools/listChanged).
    5. Retain the intentional 2-second polling fallback alongside list-changed notifications.
    6. Smoke transport: make the NDJSON client the primary smoke path with complete initialize parameters plus notifications/initialized; keep framed transport only as explicit compatibility coverage.

    Verification: targeted regressions for handshake sequence, ping, premature-request rejection ordering, list_changed method name, polling fallback, and both smoke client transports; then final npm run lint, npm test, npm run smoke, and independent review before Done.

    Status: no implementation or test results claimed yet; this comment records the plan only. Umbrella: DEV-53.
- date: 2026-10-02T21:01:16.239936+00:00
  text: |-
    Stage release (tracking agent; remains InProgress until full gates + independent review; NOT Done).

    Outcome: Core lifecycle/transport stage released. Standards-compliant initialize (protocolVersion negotiation to 2025-06-18, capabilities, clientInfo validation), Ready granted only after notifications/initialized (out-of-order/repeat never grants; second initialize answers without reset), ping answered pre/post-ready, premature operational requests rejected -32002 'Server not initialized' with zero side effects, notifications never replied and tool-shaped notifications never executed, method corrected to notifications/tools/list_changed (capability key tools.listChanged unchanged), pre-ready list changes deferred+coalesced, intentional 2-second polling fallback retained, NDJSON primary with framed compatibility retained.

    Evidence: 294 lib + 173 affected nextest passed (retries 0, gitless profile); targeted clippy -D warnings and fmt clean; logs in target/mcp-repair-20261002/core.

    Remaining: full npm run lint/test/smoke gates; independent core and client real-wire review; do not close yet.

    Guidance: factual notification/NDJSON corrections are already in docs (help/mcp.md, developers/mcp.md, smoke-suite-debugging SKILL.md) and will get final validation with the full gates; no full completion claimed. Umbrella: DEV-53.
