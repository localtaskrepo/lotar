- date: 2026-11-15T23:27:32.181248+00:00
  author: claude
  text: |-
    Binding the existing checkout ("extend", INBOX-307) can't be built from our side: T3 Code's CLI has no flag for it, and T3 Code doesn't take feature PRs.

    - T3's server can do it: `t3_thread_launch` takes `workspaceStrategy: {type: existing_worktree, worktreePath}`.
    - But `t3 thread start` (v0.1.9 and upstream `main` today) maps only `--worktree <base> [--branch]` to a *new* worktree (`launchWorkspaceStrategy` in `apps/server/src/cli/thread.ts`). harnessmux talks to T3 only through that CLI.
    - Calling `/mcp` directly from harnessmux would mean copying T3's internal auth (the CLI mints a session token through the server's `EnvironmentAuth`). Not a sound route.
    - pingdotgg/t3code `CONTRIBUTING.md`: "We are explicitly NOT INTERESTED in new feature addition PRs" (auto-closed). No issue asks for this yet.
    - Already on `agent/DEV-583` (`eba9fc33`, checks passed): the prompt names the branch the thread really runs on and every earlier worktree of the ticket that has uncommitted changes. That is the ticket's second "Done" option.

    Question: how should a retry get the failed job's work?
    1. **Prompt fix only**: review and merge `eba9fc33` as it is; the agent reads the old worktree.
    2. **Prompt fix + LoTaR carries it over**: before a retry starts, LoTaR commits the failed job's leftover changes on `agent/<ID>` ("changes from the failed <profile> job"), so the new thread starts with them.
    3. **Prompt fix + upstream issue**: I draft an issue asking T3 Code to add `t3 thread start --checkout <path>`, show you the draft, then file it and bind the checkout once T3 ships the flag.
  report:
    commits:
    - hash: eba9fc33
      what: T3 prompt names the thread's real branch and the earlier jobs' uncommitted worktrees
