    - Minor, filed as [DEV-608](https://lotar.pyxzl.net/task/DEV-608): the note stays in every later job on the ticket, so review and merge jobs are also told to "carry over" the stale changes.
    - No stray files. `t3/reuse-agent-worktree` is codex's clean, empty worktree, not a second copy of the fix.
