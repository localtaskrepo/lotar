  text: |-
    Review: passed. `eba9fc33` meets the ticket's second "Done" option, which the owner chose ("1", prompt fix only).

    - Read: the diff, the ticket and its comments, the owner's answer, `follow_thread_branch`/`move_ticket_branch`/`agent_worktrees`/`continued_thread_worktree`, and main's newer commits to these files (DEV-593/594/595/596). The branch merges onto main without conflicts.
    - Claims hold: LoTaR moves `agent/<ID>` to the thread's branch when a T3 job ends (`follow_thread_branch`). A continued thread whose own worktree is dirty is refused and gets a new thread, so the note never lists the job's own worktree.
