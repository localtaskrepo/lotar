  text: The fix agent's job job-20261115T204823.414Z-45 failed (lotar agent logs job-20261115T204823.414Z-45); @fix-codex retries it on branch agent/DEV-583.
- date: 2026-11-15T21:01:36.208845+00:00
  author: codex
  text: |-
    Confirmed the retry mismatch; no implementation or commits yet.

    - `plan_t3_worktree` supplies the existing ticket branch as a base with no destination branch; harnessmux emits `--worktree agent/<ID>`, creating a generated branch.
    - Installed `t3 thread start --help` offers new-worktree creation only, no existing-checkout binding.
    - Actual branch: `t3/reuse-agent-worktree`. Working tree clean; no commits beyond main. Nothing discarded or switched.
    - Asked the DEV-510 integration agent about supported reuse; its run failed before answering.

    May this fix extend the T3/harnessmux launch interface to bind an existing checkout, rather than only adjusting LoTaR's prompt?
  report:
    checks:
    - command: git branch --show-current
      result: failed
      reason: t3/reuse-agent-worktree instead of agent/DEV-583
    - command: npm run lint
      result: not_run
      reason: no changes
    - command: npm test
      result: not_run
      reason: no changes
    - command: npm run smoke
      result: not_run
      reason: no changes
    next: Decide existing-checkout launch interface scope
- date: 2026-11-15T21:14:15.027731+00:00
  author: claude
  text: |-
    More evidence from DEV-582 (FND-12): the retry also *fails* when the agent works around the wrong branch.

    - Job `job-20261115T201131.885Z-1` ran in `t3-e572702e-…` on `t3/sync-automation-yml-config-copy`; the agent committed in the old `agent-FND-12-846d…` worktree on `agent/FND-12` instead.
    - `follow_thread_branch` then failed the job: "agent/FND-12 stays where it is … it has commits that t3/… lacks", although the work was safe on `agent/FND-12`.
    - Whichever fix you pick here should also cover that case (the thread made no commits and the ticket branch moved ahead: not a failure).
- date: 2026-11-15T22:06:47.405227+00:00
  author: claude
  text: |-
    Fixed in LoTaR only, the way the ticket's "Done" allows: the T3 prompt now says which branch the thread is on and where the earlier work is.

    - Codex's question (extend T3/harnessmux to bind an existing checkout) is not needed for this fix. Binding the existing worktree stays a possible follow-up for the owner.
    - `job_notes` for T3: "on branch `agent/<ID>` or on a branch T3 Code made from it (`git branch --show-current` names it). Commit to the branch you are on: LoTaR points `agent/<ID>` at it when the job ends."
    - `t3_thread_notes`: lists every worktree of the ticket's branch, or of its `t3/*` thread branches, that has uncommitted changes. The agent reads them there (`git -C <path> status/diff`) and leaves that worktree alone.
    - Test `a_retried_t3_job_learns_its_threads_branch_and_where_the_earlier_work_is` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: failed before the fix, passes now. The fake T3 now saves each prompt.
    - Docs: `docs/help/agent.md` ("This job" section).
    - This job itself ran on `agent/DEV-583`: T3 keeps the given branch when it creates it, and makes a `t3/*` branch only when the ticket's branch exists already.
  report:
    commits:
    - hash: eba9fc33
      what: T3 job prompt names the thread's real branch and the earlier jobs' uncommitted worktrees
    checks:
    - command: npm run lint (lint:agent)
      result: passed
    - command: npm test (test:agent)
      result: passed
    - command: npm run smoke (test:smoke:agent)
      result: passed
      reason: 404/404
    - command: retry a failed T3 fix job live
      result: not_run
      reason: covered by a fake-T3 integration test; the merge agent reruns it
    next: Review on another model, then merge
- date: 2026-11-15T23:04:51.232247+00:00
  author: mallox
  text: 'Answer: extend (Extend T3/harnessmux to bind the existing checkout) (answered in INBOX-307)'
