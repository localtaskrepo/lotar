- date: 2026-11-15T22:06:47.405227+00:00
  author: claude
  text: |-
    Fixed in LoTaR only, the way the ticket's "Done" allows: the T3 prompt now says which branch the thread is on and where the earlier work is.

    - Codex's question (extend T3/harnessmux to bind an existing checkout) is not needed for this fix. Binding the existing worktree stays a possible follow-up for the owner.
    - `job_notes` for T3: "on branch `agent/<ID>` or on a branch T3 Code made from it (`git branch --show-current` names it). Commit to the branch you are on: LoTaR points `agent/<ID>` at it when the job ends."
    - `t3_thread_notes`: lists every worktree of the ticket's branch, or of its `t3/*` thread branches, that has uncommitted changes. The agent reads them there (`git -C <path> status/diff`) and leaves that worktree alone.
    - Test `a_retried_t3_job_learns_its_threads_branch_and_where_the_earlier_work_is` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: failed before the fix, passes now. The fake T3 now saves each prompt.
    - Docs: `docs/help/agent.md` ("This job" section).
    - This job itself ran on `agent/DEV-583`: T3 keeps the given branch when it creates it, and makes a `t3/*` branch only when the ticket's branch exists already.
