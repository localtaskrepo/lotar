- date: 2026-11-13T22:15:29.865898+00:00
  author: claude
  text: 'Done in ae59218a. `lotar add` and `lotar task add` take `--depends-on`, `--blocks`, `--related`, `--fixes` (repeatable), `--parent` and `--duplicate-of`, with the ID forms of `relationships add` (`DEV-12`, `12`, `lotar:DEV-374`). They go into the creating write with their reciprocals (same transaction REST/MCP create use), so `created` rules see them. `--dry-run` lists them and fails on missing IDs or cycles, like the real add. Docs: `docs/help/add.md`, `lotar-workflow` skill (create a waiting ticket with `--status <waiting> --depends-on <id>`). Test: `tests/dev494_add_relationships_test.rs` (links + reciprocals at creation, a `created` rule with `when: status: Blocked` comments `${{ticket.relationships.depends_on[*]}}` = RL-1, every kind, missing/invalid IDs create nothing). Note: rule conditions have no relationship field (only status, tags, ...), so the test checks the rule''s template sees the link; a `depends_on` condition would be a separate ticket. Checks: npm run lint:agent, test:agent (Rust 2141, UI 1515, release, hooks), test:smoke:agent (390) all pass.'
