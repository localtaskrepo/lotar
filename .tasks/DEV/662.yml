description: |-
  Found while reworking standards STD-199 (2026-11-17).

  ## Found
  - `lotar list 'id:STD-12'` in standards lists STD-12 and STD-120 to STD-129; `lotar automation run "<rule>" --select 'id:STD-12' --dry-run` checks 11 tickets and would act on STD-124.
  - `id:"STD-12"` matches the same; `id:=STD-12` matches nothing. docs/help/list.md has no exact form.
  - Callers that mean one ticket: standards `scripts/repos.ts` stall recovery (`--select id:<ID>`, restarts agents), inbox "triage again", and the standards automation prompts ("lotar automation run ... --select 'id:STD-199'"). Restarting STD-12 can start agents on STD-120 to 129 too.

  ## Check
  `lotar list 'id:STD-12'` (standards) lists only STD-12; `automation run ... --select 'id:STD-12' --dry-run` checks 1 ticket.

  ## Done when
  - `id:<full ID>` matches that ticket only (or a documented exact form exists, and the docs say which one to use for scripts); a test covers it.
