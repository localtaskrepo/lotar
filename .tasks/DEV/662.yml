- date: 2026-11-17T17:24:59.564024+00:00
  author: claude
  text: |-
    Fixed: `id:STD-12` now selects STD-12 only, not STD-120 to STD-129.

    - Cause: `id:` values matched as substrings (`crates/lotar-core/src/utils/text_search.rs`).
    - Fix: a full ID after `id:` (also quoted, any case) must equal the ID or a moved-from ID. Partial IDs (`id:STD`, `id:120`) and plain `STD-12` still match as text.
    - Test `id_scope_with_a_full_id_matches_that_task_only`; `docs/help/list.md` says scripts use `--select 'id:<ID>'`.
    - Callers in standards (`scripts/repos.ts`, inbox, prompts) need no change once the merged build is installed.
    - Guidance: no durable finding.
