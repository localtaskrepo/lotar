comments:
- date: 2026-09-06T11:21:52.696878+00:00
  text: 'Backlog reconciliation: Remains Todo for the requested show/update aliases. Existing ls/c/task aliases do not implement those spellings. Define top-level versus task subcommand forms and add parser/help coverage; corrected DEV-53 injected instructions intentionally use currently supported commands instead.'
- date: 2026-09-06T13:12:54.089384+00:00
  text: |-
    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 19: Add aliases for command commands so that LLMs don't get tripped up (e.g. it's often trying "lotar show <id>", and "lotar update <id>")
- date: 2026-10-30T00:59:29.000238+00:00
  text: 'Plan: top-level ''lotar show <id>'' printing the full task (text, and JSON with --format json), and ''lotar update <id> ...'' / ''lotar edit <id> ...'' as aliases of ''task edit''; also ''task show'' / ''task update'' aliases. Parser + help tests.'
- date: 2026-10-30T01:30:19.760856+00:00
  text: 'Done: ''lotar show <id>'' (alias ''view'', also ''task show''; full task as text, --format json gives the REST DTO; numeric/moved/deleted IDs work) and ''lotar edit/update <id> …'' (also ''task update'') sharing task edit. Help aliases for show/view/edit/update. Docs: help/task.md, help/main.md. Test: tests/dev18_show_update_aliases_test.rs.'
- date: 2026-10-30T01:51:28.530866+00:00
  text: 'Verified: npm run lint:agent, nextest 1866/1866, UI vitest 1393/1393, smoke 367/367 (ui.config-coverage row count updated for the two new relationship switches). No guidance correction.'
description: |-
  Migrated checklist requirements:
  Consider familiar aliases such as lotar show <id> and lotar update <id> so agent-generated commands are less error-prone. Agree top-level/subcommand semantics and preserve existing commands; test parser and help behavior. Existing ls/c aliases are not this request.
