- date: 2026-11-17T02:18:44.708558+00:00
  author: claude
  text: |-
    Fixed: the queue worker now keeps each project at its own `max_parallel_jobs` and counts jobs from every process.

    - `agent_queue_service.rs`: `dequeue_startable` takes queued entries in order while their project has a free slot; the limit comes from `config_for_project` (the project's own, else the global one)
    - Running jobs per project = this process's registry (`AgentJobService::active_jobs`, new) plus the `agent_active_jobs` records of other processes, deduplicated by job id
    - `lotar agent queue` reason names the full project: `waiting for a free slot (1 of LIM's agent.worktree.max_parallel_jobs 1 running)`
    - Behavior change: a global limit now applies to each project separately, not to all projects together
    - Test `dev630_queue_project_parallel_limit_test`: projects LIM (limit 1) and FREE (none), LIM-1 runs via `agent run --wait` in another process; FREE-1/2 start, LIM-2 waits until LIM-1 ends. Against the old code it fails (LIM-2 starts at once)
    - Docs: `docs/help/agent.md` (worktree config, `agent queue`)
    - The full suite hit the existing flake [DEV-613](https://lotar.pyxzl.net/task/DEV-613) once; it fails 2 of 8 runs on unchanged code too, and the rerun passed
