- date: 2026-11-17T03:02:17.397040+00:00
  author: claude
  text: |-
    Review: blocking. The per-project limit works, but a global limit no longer caps all jobs together, and the owner hasn't decided that.

    **Blocking**
    - `crates/lotar-lib/src/services/agent_queue_service.rs:478` (`project_slots`): the global `max_parallel_jobs` becomes a separate limit for each project. A global limit of 2 with 3 projects now lets the worker run 6 jobs. Before this change the global limit was a machine-wide total (`docs/help/agent.md:337`: "Limit concurrent agent jobs"). `lotar serve` still applies it as one total (`agent_job_service.rs:334-336`). The limit exists to protect the Mac from load (DEV-626: the Mac was overloaded). "Project config over global" in "Done when" only says which value wins. It doesn't make the global limit per project. The fix agent called this a behavior change only in chat; the owner made no decision.
    - Fix: keep the global limit as a total across all projects (count every project's jobs in every process), and apply a project's own limit to that project on top of it. Rewrite the `agent.md:346` line to match. If you want the per-project behavior instead, ask mallox first.

    **Checked**
    - Reran `cargo nextest run --workspace -E 'test(/^dev630_/) | test(/agent_queue_service::tests/)'`: 6 passed.
    - Counting across processes (this process's registry plus the live `agent_active_jobs` records, deduplicated by job id), a limit of `0`, queue order and the reason text are correct.
    - HEAD also carries `1227e5bde` (DEV-620), the same patch as `6a78ba884` on main, so a rebase drops it. Not a stray change.
    - Not rerun: full `npm run lint`, `npm test` and `npm run smoke` (the fix agent reports them passing).
