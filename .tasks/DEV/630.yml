- date: 2026-11-17T04:07:55.741029+00:00
  author: claude
  text: |-
    Review: passed. Read HEAD `3d2c2aae9` (same as the ticket branch). The first review's blocking finding is fixed.

    - **Global limit is a total again:** `JobSlots` in `crates/lotar-lib/src/services/agent_queue_service.rs` checks the global `max_parallel_jobs` across all projects first, then the project's own limit. Each limit is re-read every tick; the config cache checks file fingerprints.
    - **Counted across processes:** this process's jobs plus `agent_active_jobs::list`, which skips records whose owner process has died. Jobs are deduplicated by (ticket, job id).
    - **Done when:** project limit over global ✔; jobs counted in every process ✔; test with two projects, one limit of 1, a job in another process ✔; `docs/help/agent.md` ✔.
    - **Reran:** `cargo nextest run -E 'test(dev630) | test(/agent_queue_service::tests/)'`: 8 passed.
    - **Fails before the fix:** in a scratch copy with the queue, job and CLI-handler sources taken from `3d2c2aae9^`, both `dev630` tests fail at `dev630_queue_project_parallel_limit_test.rs:72`: the old worker starts every job. Scratch copy removed.
    - **Not rerun:** full `npm run lint`, `npm test`, `npm run smoke` (the fix agent reports them passed).
    - **Merge:** `3d2c2aae9` applies cleanly on current main (`git merge-tree`, exit 0). The DEV-620 copy `1227e5bde` matches `6a78ba884` on main (`git cherry`), so a rebase drops it.
    - No minor tickets filed. Serve's own counting stays with DEV-646.
