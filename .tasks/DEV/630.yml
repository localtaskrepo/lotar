- date: 2026-11-17T03:49:03.888326+00:00
  author: claude
  text: |-
    Rework done: the global `max_parallel_jobs` is a machine-wide total again; a project's own limit applies on top.

    - Review finding (global limit became per project): fixed in `agent_queue_service.rs` (`JobSlots`). A queued ticket starts only when the global limit (all jobs of all projects, every process) and its project's limit both have a free slot.
    - Queue reason names the full limit: `... of the global agent.worktree.max_parallel_jobs 2 running` or `... of LIM's ...`.
    - For DEV-646: new public `AgentQueueService::slot_wait_reason(tasks_dir, ticket_id, own_jobs)` returns `None` (may start) or the wait reason. `own_jobs` = this process's `(ticket, job id)` list, passed by the caller so it can hold the registry lock; `agent_active_jobs` records are added and deduplicated.
    - Tests: new `worker_keeps_all_projects_together_at_the_global_limit` (global limit 2, one job in another process); it fails on `076bd5a2c`. New unit test `the_global_limit_caps_all_projects_together_and_a_projects_limit_its_own`.
    - Docs: `docs/help/agent.md` describes both limits.
