description: |-
  Found 2026-11-16 in DEV-626 (lotar ran 4 jobs while .tasks/DEV/config.yml sets agent.worktree.max_parallel_jobs: 2).

  ## Found
  - `resolve_max_parallel` in `crates/lotar-lib/src/services/agent_queue_service.rs` reads the global config (`get_resolved_config`); the global .tasks/config.yml sets no limit, so the worker starts every entry (`JobStartMode::Immediate`).
  - The worker counts only its own process's jobs (`queue_stats().running`); jobs that `lotar serve`, `lotar agent run` or a taken-over job run elsewhere aren't counted.
  - Same on main (checked at 1227e5bd).

  ## Done when
  - [ ] The worker applies each entry's project limit (project config over global), counting the project's running jobs in every process (agent_active_jobs records).
  - [ ] Test: two projects, one with a limit of 1, jobs in two processes; docs in docs/help/agent.md.
