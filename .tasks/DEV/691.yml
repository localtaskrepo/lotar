references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Aad01813e-ca32-4de5-939e-c516b2e63466
description: |-
  Found in the review of DEV-684 (harnessmux `65a95a0`).

  - `LAST_PARAGRAPH_FAILURES` (`src/acp_map.rs:84-89`) has four of Codex's error texts. codex 0.169.0's binary has more that codex-acp sends the same way (text chunk, then `end_turn`): "Policy-restricted capacity is unavailable. Please try again later." and "Flex capacity unavailable…".
  - The check reads the last paragraph of the whole turn's text (`turn.reply`, all message chunks joined without separators, `src/backend/acp.rs:240`). If an earlier Codex message doesn't end in a blank line, the error chunk is glued onto it and the check misses it. Not seen in a real run yet: in acpx #850 the turn had no earlier message.
  - codex-acp 2.6.0 (`createErrorEvent`) sends the error as one `agent_message_chunk` of its own, without `messageId`, text plus a blank line. So the last chunk of the turn holds the error alone, whatever came before it.
  - Work goes in harnessmux on top of DEV-684's `agent/DEV-684` (not on main yet); the only caller of `failure_in_reply` is harnessmux `src/backend/acp.rs`, lotar doesn't call it.

  ## Done when
  - [ ] A turn whose last paragraph starts with "Policy-restricted capacity is unavailable" ends as `turn.failed`, also after tools ran (unit test in `src/acp_map.rs`)
  - [ ] The same for "Flex capacity unavailable" (unit test)
  - [ ] A turn whose last message chunk starts with one of the Codex error texts fails, also when that chunk is glued onto an earlier message without a blank line; a recorded replay test (`tests/cli.rs` + recording) shows `turn.failed` with the error text alone as `error`
  - [ ] Either check failing the turn wins: the last paragraph of the whole reply or the last chunk. A cancelled turn still ends as cancelled (unchanged)
  - [ ] A reply that only mentions such a text mid-paragraph or in an earlier paragraph still finishes (unchanged test stays green)
  - [ ] `cargo fmt --all --check`, clippy `-D warnings`, `cargo nextest run`, `cargo deny check` pass in harnessmux
