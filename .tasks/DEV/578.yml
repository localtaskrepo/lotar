description: 'Found in DEV-510 rework 5: in harnessmux tests/cli.rs a send accepted by an owner that then died (kill -9) left `harnessmux send --wait` following the event log until the test''s 40 s limit. `client::wait_turn` (src/client.rs) ends only on the turn''s end or session.ended, which a killed owner never writes. Check: kill an owner after it accepts a prompt, then see whether `send --wait` returns. Done when the wait notices the owner is gone (socket no longer answers) and ends with an error or resumes the session.'
