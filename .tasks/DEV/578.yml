- date: 2026-11-15T19:57:05.207219+00:00
  author: claude
  text: |-
    Fixed in harnessmux `1d8fd5d` on branch `agent/DEV-578` (worktree `~/.t3/worktrees/harnessmux/DEV-578`). Nothing changed in lotar.

    - **Cause:** `client::wait_turn` followed the event log until the turn's end or `session.ended`. A killed owner writes neither.
    - **Fix:** after 2 s without new events the wait asks the owner for its status over the socket. If no one answers, it reads the log once more (the end may have come just before the owner stopped), then fails: "the owner of <name> stopped during turn N without ending it; `harnessmux send <name>` resumes the session". Covers `send --wait`, `run` and the MCP `wait` tool.
    - **Test (the ticket's check):** `tests/cli.rs` `a_wait_whose_owner_dies_mid_turn_ends_with_an_error` kills the owner during `send --wait`. Before the fix it hung until the 40 s limit; now it ends in about 2.4 s (passed 3 runs in a row).
    - CHANGELOG `Unreleased` entry and a README line added. DEV-510's unmerged branch also edits `CHANGELOG.md` and `tests/cli.rs`, so the merge may need a small conflict fix there.
