- date: 2026-11-17T03:22:15.949221+00:00
  author: claude
  text: |-
    `docs/help/agent.md` now describes both kept cases of job end rules.

    - Busy lock: as before; added that a step failing on a full disk (`ENOSPC`) stays in the checkpoint and runs again.
    - Checkpoint refused by a full disk: none of the rules ran, the ending process keeps them in memory and retries saving and running them every 30 s, a queue worker stays up meanwhile, lost if the process exits first.
    - Outcome waits behind rules kept in memory too.
    - Checked against `keep_unsaved_end_action`, `is_retryable`, `apply_pending_outcomes` in `automation_service.rs` and the worker loop in `agent_queue_service.rs`.
