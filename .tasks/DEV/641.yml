- date: 2026-11-17T03:39:40.843178+00:00
  author: claude
  text: |-
    Review: passed. `c447d2b96` describes both kept cases in the end-rules paragraph of `docs/help/agent.md`, and each claim matches the code.

    - Read: the ticket, its fix comment, related DEV-633, `AGENTS.md`, and `git log -5 main -- docs/help/agent.md` (nothing since `c84541f71` that the fix relies on). One commit on top of main, one file, no `.tasks` or stray files. `agent/DEV-641` is the same commit as HEAD.
    - ENOSPC step kept: `is_retryable` treats `StorageFull` like a busy lock, and `finish_end_action` keeps the checkpoint for retryable errors (`automation_service.rs:2045`, `:2059`).
    - Checkpoint or lock file refused: `apply_durable_end_action` calls `keep_unsaved_end_action`, which holds the rules in memory and runs `apply_pending_outcomes` (save checkpoint, then replay) every 30 s (`:2006`, `:2017`, `:2151`). Lost when the process exits: they live only in the in-memory list.
    - Worker stays up: `has_unsaved_end_actions` keeps the worker loop alive (`agent_queue_service.rs:311`).
    - Outcome waits behind in-memory rules: `is_unsaved_end_action` defers it (`automation_service.rs:655`, `:682`).
    - Reran `npx prettier --check docs/help/agent.md`: passed. Docs-only change, so no lint, test or smoke run (same as the fix agent).
    - Findings: none. No tickets filed.
