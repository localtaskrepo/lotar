- date: 2026-11-26T01:25:45.401486+00:00
  author: claude
  text: |-
    A new `t3` job now settles every earlier thread of its ticket whose run ended, and a done ticket gets all of its ended threads settled, not only the `completed` ones.

    - Cause: `kept::settle_superseded` (DEV-836) settled only `failed` earlier threads, and `kept::settle` (DEV-747) settled only `completed` threads on done tickets
    - `crates/lotar-agent/src/services/agent_job_service/kept.rs`: new `ended()` check: any status except `running`, `waiting`, `queued`, `starting`, `preparing`. Threads still running are left to the 30 s look, and the thread the job continues stays as it is
    - New log line: `Settled the T3 Code thread <link> of the earlier job <job> (<status>): this job is the ticket's attempt now.`
    - Tests: `a_new_job_settles_the_ended_threads_of_the_earlier_jobs_on_the_ticket` (failed, completed and interrupted settled, running left alone) and `a_done_tickets_ended_threads_are_settled_whatever_their_outcome` (failed, interrupted, cancelled, idle)
    - `docs/help/agent.md` updated
    - Not part of this ticket: threads no harnessmux session holds any more ("no harnessmux session holds it", e.g. DEV-842's older threads) and threads no job log names. DEV-810's fix (`agent/DEV-810`, `b7f520caf`) covers those, and it touches the same functions
    - The running T3 threads: only DEV-808 runs, on other files, so nobody needed telling
  report:
    commits:
    - hash: 5b4629984
      what: settle every ended earlier thread on a new job, and every ended thread of a done ticket
    checks:
    - command: cargo nextest run --cargo-profile dev -E 'test(/t3/) | test(/dev503_harness/) | test(/dev626/)'
      result: passed
      reason: 97 tests
    - command: both new tests against main's kept.rs
      result: failed
      reason: as expected, they fail without the fix
    - command: cargo clippy -p lotar-agent -p lotar-lib --tests
      result: passed
      reason: no warnings
    - command: rustfmt --check and prettier --check on the changed files
      result: passed
    - command: npm run lint, npm test, npm run smoke
      result: not_run
      reason: the merge runs them (owner 2026-11-22, DEV-797)
    next: 'Review on another model, then merge. DEV-810 changes kept.rs settle_ticket and settle_superseded too: the second of the two to merge rebases.'
- date: 2026-11-26T06:19:50.219492+00:00
  author: claude
  text: |-
    Review: passed. `5b4629984` does what the ticket asks; one ticket-record problem below, no code findings.

    - Read: the diff (`kept.rs`, `dev503_harness_jobs_test.rs`, `dev626_resumed_t3_threads_test.rs`, `docs/help/agent.md`), the fix comment, the timeline, DEV-836/DEV-747 behaviour it widens, and main's newer `t3_state.rs` change (DEV-857 `0e78bed6b`)
    - Done when (original text, see below): a new job settles the earlier threads (`settle_superseded`, any ended status, not the continued one), a done ticket settles all ended threads (`settle`), and a test covers each. Threads still running or waiting stay alone, as documented. The non-done path is unchanged (`completed` only)
    - `npm ci`: passed. `cargo nextest run --cargo-profile dev -E 'test(/t3/) | test(/dev503_harness/) | test(/dev626/) | test(/settle/) | test(/kept/)'`: 106 passed
    - Both new tests fail against main's `kept.rs` (swapped in, then restored with `git checkout`), so they are real regression tests
    - `cargo clippy -p lotar-agent -p lotar-lib --tests`: no warnings. `rustfmt --check` and `prettier --check` on the changed files: clean. `git merge-tree main HEAD`: merges cleanly with main's DEV-857 `agent.md` edit
    - **Ticket record:** the fix agent's `lotar task edit -D -` at 01:21Z replaced the description with a lone `-` (the DEV-842 bug, in the older lotar build that ran the job). The fix agent's "Done when" checklist was never saved. The lost text, to put back: "Found 2026-11-25: 205 unsettled T3 threads; 86 are older attempts on open tickets (DEV-810 15 threads, DEV-828 13, DEV-827..831 and DEV-777 about 12 each), 31 belong to Done tickets. Each retry or review job starts a new thread and never settles the previous one. Done when: starting a job settles the ticket's earlier job threads, closing a ticket settles all of them, and a test covers both. Owner chose to file this 2026-11-25."
    - Still open, as the fix agent said: threads no harnessmux session or job log names stay unsettled until DEV-810 lands. Whichever of DEV-810 and DEV-876 merges second has to rebase over `kept.rs`
    - Tickets filed: none
