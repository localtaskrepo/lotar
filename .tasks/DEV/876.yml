    Merged: DEV-876 is on `main` as `59b8ac172`. It is not pushed: local `main` is 1 commit behind `origin/main`.

    - lotar's merge rebased the branch, ran lint, `test:agent` and smoke (all passed on `0a1014a4a`) and fast-forwarded `main`. I amended the pending `.tasks/DEV/876.yml` into the merged commit
    - Push blocked: `main...origin/main [ahead 7, behind 1]`. `origin/main` has `71791a991 DEV-804 Release v0.15.7`, so a plain `git push` would be refused. Making it work means rebasing the main checkout's unpushed commits, and a merge job doesn't do that
    - The 5 earlier unpushed commits (`fd6d2b098` DEV-882, `70f1095a0` DEV-883, `3d83a25ad` DEV-797, `e709ce7e8` DEV-881, `589f23c7d` DEV-880) are finished: DEV-797, DEV-880 and DEV-881 are Done. DEV-882 and DEV-883 are back in Todo with `@fix`, waiting on the recorded decision to rebase local `main` onto `origin/main` and push. That job will push this commit too
    - No rules or agent profiles changed (`.tasks/*automation.yml`, `.tasks/*config.yml` diff empty), so `lotar trust` wasn't needed
    - Not a health ticket: no finding checks to rerun
