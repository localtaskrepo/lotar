- date: 2026-11-26T01:25:45.401486+00:00
  author: claude
  text: |-
    A new `t3` job now settles every earlier thread of its ticket whose run ended, and a done ticket gets all of its ended threads settled, not only the `completed` ones.

    - Cause: `kept::settle_superseded` (DEV-836) settled only `failed` earlier threads, and `kept::settle` (DEV-747) settled only `completed` threads on done tickets
    - `crates/lotar-agent/src/services/agent_job_service/kept.rs`: new `ended()` check: any status except `running`, `waiting`, `queued`, `starting`, `preparing`. Threads still running are left to the 30 s look, and the thread the job continues stays as it is
    - New log line: `Settled the T3 Code thread <link> of the earlier job <job> (<status>): this job is the ticket's attempt now.`
    - Tests: `a_new_job_settles_the_ended_threads_of_the_earlier_jobs_on_the_ticket` (failed, completed and interrupted settled, running left alone) and `a_done_tickets_ended_threads_are_settled_whatever_their_outcome` (failed, interrupted, cancelled, idle)
    - `docs/help/agent.md` updated
    - Not part of this ticket: threads no harnessmux session holds any more ("no harnessmux session holds it", e.g. DEV-842's older threads) and threads no job log names. DEV-810's fix (`agent/DEV-810`, `b7f520caf`) covers those, and it touches the same functions
    - The running T3 threads: only DEV-808 runs, on other files, so nobody needed telling
  report:
    commits:
