  text: |-
    Fixed: a headless job runs in the worktree that already has `agent/<ID>` checked out (a T3 thread's).

    - `prepare_worktree` (`crates/lotar-lib/src/services/agent_job_service.rs`): after its own `<dir>/<ticket>`, it looks for a linked worktree on the ticket branch and runs there; the job log says "agent/<ID> is checked out in the worktree <path>, so this job runs there."
    - The branch stays checked out in the thread's worktree, so a `session: continue` rework continues the thread there; a branch checked out in the main checkout still fails as before.
    - New test `headless_jobs_run_in_the_t3_threads_worktree_that_has_the_tickets_branch` (`dev503_harness_jobs_test.rs`): T3 fix -> command review -> T3 rework (continues thread-0) -> command merge fast-forwards main -> Done removes the worktree. Without the fix it fails with the ticket's `already used by worktree` error.
    - `docs/help/agent.md` (Worktrees) describes it.
    - Told the DEV-510 merge and DEV-579 threads about the change.
