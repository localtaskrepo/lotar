description: |-
  Found in standards STD-124 (2026-11-15): reviews and merges are to run headless (claude, codex runners) after a fix on the t3 runner. The t3 fix thread works in T3 Code's worktree (~/.t3/worktrees/<repo>/agent-<ID>-…) with the ticket branch agent/<ID> checked out. A later claude, codex or command job calls prepare_worktree (crates/lotar-lib/src/services/agent_job_service.rs), which runs `git worktree add <dir>/<ticket> agent/<ID>`; git refuses, and the job fails before the agent starts:

  ```
  Worktree setup failed: Validation error: git worktree add …/.lotar-worktrees/repo/STD-1 agent/STD-1 failed: Preparing worktree (checking out 'agent/STD-1')
  fatal: 'agent/STD-1' is already used by worktree at '…/t3tree'
  ```

  So no headless phase can follow a T3 phase on one ticket. Detaching the T3 worktree instead would break the other direction: a rework that continues the fix thread (session: continue) then finds its worktree off the ticket branch and T3 can't start a new thread on agent/<ID> while lotar's worktree holds it.

  Check (lotar 0.15.1 and main e0f88162): a repo with agent.worktree.enabled, profile review `runner: command`, `command: /bin/sh`, `args: ["-c", "pwd"]`; `git worktree add -b agent/STD-1 ../t3tree`; then `lotar agent run STD-1 "x" --agent review --wait` fails as above.

  ## Done when
  - [ ] A non-t3 job on a ticket whose branch is checked out in another linked worktree of the same repository (not the main checkout) runs in that worktree, the way prepare_worktree reuses its own <dir>/<ticket>; the job log names it. The owner on one worktree per ticket: "Ideally, it raises the one the rest of the task is running on" (standards docs/decisions/2026-11-13-thread-noise.md).
  - [ ] A later t3 job with session: continue still continues the fix thread in its worktree (the branch stays checked out there), and a merge job in that worktree still fast-forwards main.
  - [ ] Done cleanup still removes that worktree.
  - [ ] A test covers t3 fix -> headless review -> t3 rework on one ticket; docs/help/agent.md (Worktrees) says so.
