description: |-
  ## Found

  claude (DEV-378 agent), 2026-11-12: ~/Library/Caches/lotar/agent-queue holds 12863 entries, nearly all empty active-<hash> folders and queue-<hash>.json files of temporary test tasks dirs. One `npm test` run tonight added 127 active-* folders and 9 queue files. Integration tests that start agent jobs (tests/dev318_t3_runner_test.rs, dev320_job_outcome_test.rs, agent_safety_test.rs, ...) don't set LOTAR_AGENT_QUEUE_DIR, so job records go to the real cache; AGENTS.md says automated tests use isolated temporary workspaces.

  ## Check

  Count entries in ~/Library/Caches/lotar/agent-queue, run `npm test`, count again: the count is unchanged.

  ## Done when

  - [ ] Tests write job records and queue files only under their temp folders.
  - [ ] Ask the owner before deleting the existing leftovers: some entries belong to real tasks dirs.
