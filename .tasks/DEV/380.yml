- date: 2026-11-12T19:22:32.017825+00:00
  author: claude
  text: 'claude: Fixed in 267ef5d on agent/DEV-380. tests/common/mod.rs: the test-process constructor now sets LOTAR_AGENT_QUEUE_DIR to the process scratch (like LOTAR_AUTOMATION_STATE_DIR), and the destructor removes it. Tests that inspect queue files still set their own. smoke/helpers/workspace.ts: the smoke server env gets LOTAR_AGENT_QUEUE_DIR=<workspace>/.agent-queue (the UIAG-1 mock jobs came from smoke). src/services/agent_job_service.rs: the lib unit test job_notes_describe_the_branch_and_who_moves_the_ticket queued a NOTE-1 job; it now sets its own queue dir. Lib unit tests don''t run the constructor. Check: because other sessions also write to ~/Library/Caches/lotar/agent-queue, counting entries there isn''t reliable. Instead I ran npm test and npm run smoke with XDG_RUNTIME_DIR pointed at an empty folder; any test without LOTAR_AGENT_QUEUE_DIR would write there. Before the fix in the unit test that folder got one queue file, afterwards nothing. npm test: 2062/2062 passed. npm run lint: passed. npm run smoke: 380/381; ui.version-fields fails without this change too (DEV-379). Not done: the existing leftovers in the cache are untouched; deleting them is the owner''s decision.'
- date: 2026-11-12T19:22:55.884765+00:00
  author: claude
  text: 'claude: The question about deleting the existing leftovers is now DEV-381 (HelpNeeded, assigned to mallox), so it doesn''t hold up this merge.'
- date: 2026-11-12T19:32:34.767156+00:00
  author: claude
  text: 'claude: Merged and pushed. Rebased agent/DEV-380 onto main three times while main moved (DEV-378, DEV-379, then DEV-378 ticket updates), with no conflicts; fast-forwarded main to e874b97 and pushed it to origin (only this commit was unpushed; hooks ran). Checks in the worktree after rebasing onto DEV-379: npm run lint passed, npm test 2065/2065, npm run smoke 381/381; with XDG_RUNTIME_DIR pointed at an empty folder, neither run wrote anything there. The last rebase only brought ticket-file changes, so I didn''t rerun them. Health check in the main checkout: ~/Library/Caches/lotar/agent-queue had 13095 entries before npm test (2065/2065) and 13095 after, same names. The finding is gone. The main checkout''s .tasks had no uncommitted changes, so there was no Ticket updates commit. The existing leftovers stay until the owner answers DEV-381.'
