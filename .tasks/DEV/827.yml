description: |-
  Found in DEV-819 (comment for STD-296, the standards reliability role): a memory hold leaves no record once it clears. Log its start and end (reason, since, until) in the server log ~/Library/Logs/lotar-services/<repo>.log.

  Note: the hold is decided by whichever process calls memory_gate::check (lotar serve or the detached queue worker, whose stderr goes to /dev/null), so logging at the transition in check() reaches the server log only when serve sees it. Decide where the line is written.

  ## Decision

  The line is written by `lotar serve`, whichever process decided the hold: `check()` keeps the last ended hold (reason, since, until) in the gate state file, and serve's 30 s background loop reads that file (no memory reading of its own) and writes each start and end to its stderr, which launchd sends to the server log.

  ## Done when

  - [ ] A hold that starts (in serve or the queue worker) gives one line in serve's log: `memory hold started: <reason>, since <time>`.
  - [ ] Its end gives one line: `memory hold ended: <reason>, since <time>, until <time>`. The reason is the last short-of-memory reason, not the "memory is normal again" settle text.
  - [ ] A hold that starts and ends between two of serve's reads still gives both lines, once each.
  - [ ] A failed reading ends a hold too: it is logged as ended with the time of that reading.
  - [ ] Serve started during a hold logs its start once; an ended hold from before serve started is not logged again.
  - [ ] Gate disabled: no lines. A missing or unreadable state file: no lines, no error.
  - [ ] Covered by unit tests in `memory_gate.rs`.
