description: |-
  Found in the review of DEV-871.

  - `crates/lotar-agent/src/services/agent_queue_service.rs:518`: `worker_state` returns `idle` when the queue file has no `pending` entries
  - Since DEV-871, `queue_stats` (line 558) adds the jobs other processes hold in memory (`queued_elsewhere`) to Queued
  - So with `lotar serve` holding 1 queued job and an empty queue file, `lotar agent queue` shows Queued 1 and state `idle`, which `docs/help/agent.md` explains as "nothing queued"

  ## Done when

  - [ ] With jobs queued only in another process, `lotar agent queue` doesn't say `idle`/nothing queued: it says the jobs wait in that process (for example "queued in lotar serve, waiting for a free slot"), or the docs' `idle` wording says it covers only the queue file
  - [ ] A test covers the case
