  text: |-
    Review: passed. `15d212009` does what "Done when" asks; one minor doc-comment slip, filed as DEV-915.

    - Read: `git diff main...HEAD` (3 files), the ticket, DEV-871, `docs/help/agent.md`, `queued_elsewhere` in `agent_active_jobs.rs`, the CLI print in `cli/handlers/agent.rs:546`. Main has 3 newer commits; none touch these files
    - Done when 1: when the queue file is empty, `worker_state` now gives a reason that names the tickets held in memory and the process holding them (`Queue: nothing in the queue file; queued in a lotar process's memory …`), for both `idle` and `active`. The docs now say `idle` covers only the queue file. No ticket is counted twice: `queued_elsewhere` skips this process's own records, and this process's queue is added through `queued_tickets`
    - Done when 2: the extended test `queued_counts_the_jobs_other_processes_queue` checks the reason, and checks that it's `None` once the record is gone. Without the fix the reason is `None`, so the test fails
    - No REST shape change: state values and fields are unchanged. No stray files, no second branch
    - Reran: `npm ci` passed; `cargo nextest run -p lotar-agent agent_queue_service` passed (19 tests); `npm run lint` passed. Worktree left clean
    - Minor: `held_in_memory` was placed under `combined_stats`'s doc comment, so it took that doc over (`agent_queue_service.rs:1054`): [DEV-915](https://lotar.pyxzl.net/task/DEV-915)
