- date: 2026-11-26T23:15:33.484236+00:00
  author: claude
  text: |-
    `lotar agent queue` no longer leaves `idle` unexplained when jobs wait in another process's memory.

    - Branch fast-forwarded to main first: it lacked DEV-871's `queued_elsewhere`
    - `worker_state` (`crates/lotar-agent/src/services/agent_queue_service.rs`): with an empty queue file, the reason lists the tickets queued in a lotar process's memory and its pid, e.g. `Queue: nothing in the queue file; queued in a lotar process's memory (such as `lotar serve`'s), which starts them: DEV-4 in lotar process 1234`. Covers this process's queue too (`AgentJobService::queued_tickets`), so `GET /api/jobs` from `lotar serve` says the same
    - State values stay `active`/`stopped`/`idle` (no REST enum change); `docs/help/agent.md` now says `idle` covers only the queue file and explains the reason
    - Test: extended `queued_counts_the_jobs_other_processes_queue`; it fails without the fix
