  text: |-
    Review: blocking. The docs describe DEV-734's behaviour, which isn't on main and went back to rework. Nothing makes this ticket wait for it.

    - Read: `883e00b06` (3 docs files, one line each), the ticket's Done when, the fix comment, DEV-734's timeline and `git diff main...agent/DEV-734`. Reran `npm ci` (passed) and `npx prettier --check` on the 3 files (passed). The anchors `#usage-limits`, `#paused-queue` and `#jobs-whose-process-died` exist in `docs/help/agent.md`. Grepping `job_paused` in `docs/` finds no other page that lists only two causes
    - **Blocking 1, `docs/help/automation.md:230`, `docs/help/sse.md:48`, `docs/developers/sse.md:41`:** they say a taken-over job whose session can't be resumed pauses and runs again. On main and on this branch, `docs/help/agent.md:226` still says "the job fails and says why", and the code does the same. DEV-734 (`aa2b8b2f8`, now `c79911816` on `agent/DEV-734`) went Merging → HelpNeeded → Todo at 21:28Z because it breaks `dev604_queue_pauses_test::a_signing_failure_pauses_the_queue_and_its_retry_makes_only_the_commit`. DEV-739 is only `related` to DEV-734, so a merge now would put docs on main that contradict agent.md and the code. Fix: add `lotar relationships add DEV-739 --kind depends-on DEV-734`, then rebase onto main after DEV-734 lands. Also check that DEV-734's final agent.md bullet still matches this wording
    - **Blocking 2, `docs/help/automation.md:230`, same line:** "`job: { error: ... }` matches the pause note, which names the provider and when the job runs again". That is true for a usage limit, but DEV-734's takeover note is `<why>. Paused, not failed: the job runs again in a new session, first in the queue.` (`run_again_in_new_session` in `agent_job_service.rs`), which names neither a provider nor a time. Fix: say what the note names for each cause, or drop that clause. The sse.md `"message": "Paused, not failed: ..."` example also doesn't fit the takeover note, which starts with the reason. Mention that, or leave the example as an illustration only
    - Done when: items 1, 2 and 4 are met. Item 3 is met in substance ("a job with nothing to run again fails"), but it leaves out the two examples (T3 Code thread, older build). That's fine to leave out
    - Scope: the extra sse.md fixes are the same gap and in the spirit of Done when item 4. No stray files, and no other branch with this fix
