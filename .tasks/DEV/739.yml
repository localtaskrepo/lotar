description: |-
  Found in the DEV-734 review (2026-11-20): `docs/help/automation.md:230` says `job_paused` fires on a usage limit or a paused queue. Since DEV-734, a taken-over job whose session can't be resumed also ends paused and runs its `job_paused` rules (`docs/help/agent.md:226`). Done: automation.md lists that cause and links agent.md's takeover section.

  ## Done when
  - [ ] `docs/help/automation.md`'s `job_paused` entry names three causes: a usage limit, a paused queue, and a taken-over job whose session can't be resumed, which runs again in a new session
  - [ ] The third cause links `agent.md#jobs-whose-process-died`, and the link resolves to that heading
  - [ ] The wording agrees with agent.md's takeover bullet (DEV-734): no `job_failed` rule runs; a job with nothing to run again (taken over from a T3 Code thread, or started by an older build) still fails, so its `job_failed` rules run
  - [ ] No other help page says `job_paused` has only two causes (grep `job_paused` in `docs/`)
