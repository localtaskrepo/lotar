  text: |-
    Done: both missing tests added; each fails when the code it covers is broken.

    - `a_failed_keep_fails_the_job_and_starts_no_session` (`dev503_harness_jobs_test.rs`): a folder takes the kept log's name, so the keep fails. The job fails with "Could not keep the session …", no `session/new`, no new or kept record, and the old record and event log are unchanged
    - `a_t3_handoff_names_the_skipped_sessions_thread` (`dev510_t3_session_test.rs`): a rework 56 min after the last use starts a second thread, and its handoff has `- Its T3 Code thread: t1`. The fake t3 now writes `thread start` prompts to a `prompts` file
    - Checked: dropping the thread line, or carrying on after a failed keep, makes each test fail
    - Also fixed a race in DEV-611's own test: `continue_job` now waits until the job leaves the active list (it failed once with "already has an active job" under load)
    - DEV-611 wasn't on main when I started, so I cherry-picked it as `84ef6218` and told the DEV-611 merge thread. It has landed as `c9802f1d`, so a rebase drops the copy
