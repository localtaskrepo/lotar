description: |-
  Found in the review of DEV-611 (`3cf93d5e`).

  ## Found
  `a_skipped_session_is_kept_and_the_handoff_names_its_event_log` covers the kept log, the handoff and the next job's earlier sessions. Two "Done when" points have no test:
  - `keep_session` fails (`agent_runner.rs`, the rename or `registry.save`): `run_job` ends the job failed and starts no session (`agent_job_service.rs`, the `handoff_from` match).
  - The t3 handoff names the old T3 Code thread (`- Its T3 Code thread: <agent_session>` in `handoff_text`).

  ## Done when
  - [ ] A test: keeping fails (for example a read-only sessions folder, or a kept name already taken by a directory); the job ends failed with "Could not keep the session …", no new session record exists, and the old record and event log are still there.
  - [ ] A t3 test (`dev510_t3_session_test.rs`): a rework past `continue_within_minutes` whose prompt names the old thread's id.
