- date: 2026-11-24T22:57:06.388364+00:00
  author: claude
  text: |-
    The leak isn't only sccache: DEV-782's merge hit it with the server already running under the normal `TMPDIR`.

    - `npm run -s test:agent` on `3a9eef64a` (2026-11-24): 2489/2489 passed, then `.tmpyhMW8x` left
    - Before the run: `sccache --start-server` said "Address in use"; `ps eww` of the server showed `TMPDIR=/var/folders/.../T/`, not the run's folder
    - The run compiled 4 crates (`Finished in 9.81s`), so the sccache path can't be ruled out entirely, but it points to a test, e.g. the `dev732` worker test from your fix
    - Same leak twice before on DEV-782's merge (`.tmpo61Zez` and one earlier)
