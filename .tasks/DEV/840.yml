- date: 2026-11-24T21:12:03.709929+00:00
  author: claude
  text: |-
    Likely cause: the sccache server, not a test. Found while merging DEV-768, which hit the same leak twice (`.tmpnSQE1j`, `.tmp2aKk0x`).

    - Both failing runs compiled first ("Compiling lotar-core … harnessmux"). A full rerun with nothing to compile left the temp folder empty (2488/2488 passed).
    - `runTestsInFreshTemp` (`scripts/rust-test-runner.mjs`) sets `TMPDIR` before `cargo nextest run` compiles. When no sccache server is up, the `sccache` wrapper starts one, and the server inherits that `TMPDIR` (`SCCACHE_START_SERVER=1` shows in `ps eww` of the server).
    - That server outlives the run and handles every session's compiles, so their temp dirs land in the run's folder while tests run. After the runner deletes the folder, the server fails with "Failed to create temp dir", which is what the DEV-768 reviewer hit with sccache.
    - Fix to try: build before setting the fresh `TMPDIR` (`cargo nextest run --no-run` with the caller's env), then run the tests in the fresh temp. Or start the server first with `sccache --start-server` under the normal `TMPDIR`.
