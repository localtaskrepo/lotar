- date: 2026-11-24T21:37:55.876201+00:00
  author: claude
  text: |-
    Fixed both likely sources of the leftover `.tmpXXXXXX` in commit `53c39bfc2`.

    - `scripts/rust-test-runner.mjs`: `runTestsInFreshTemp` first runs `cargo nextest run --no-run` with the caller's `TMPDIR`, and only then runs the tests with the fresh one. A compile can no longer start the shared sccache server inside the run's temp folder. The test step now compiles nothing (`Finished in 0.12s`).
    - `crates/lotar-lib/tests/dev732_worker_leaves_its_launchers_folder_test.rs`: before its `TempDir` drops, the test waits for `agent queue` to report the worker idle, as `dev733` already does. A peer session found this one: it was the only real-worker test that returned while its worker was still writing.
    - New runner tests: the build runs first with the caller's `TMPDIR`, and a failed build skips the tests.
