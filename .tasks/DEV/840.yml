description: |-
  Found: the DEV-816 merge check `npm run -s test:agent` (2026-11-23, at 2480/2480 passed, after waiting 5 min for the check lock) failed with `rust-test-runner: error: tests left 1 entries in the temp folder: .tmpGLFMn2`. A rerun on 2026-11-24 passed with nothing left. The `.tmp` + 6 chars name is the tempfile crate's default prefix, so a `tempfile::tempdir()`/`NamedTempFile` was probably dropped while a child process or thread still wrote into it, or was never dropped.
  Check: find the test that creates it, for example by running nextest under load with `--no-fail-fast` and listing the runner's temp folder per test.
  Done: the test removes what it creates; a full run under load leaves nothing in the temp folder.
