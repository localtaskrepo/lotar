description: |-
  The web UI shows a job's activity live only when the job runs inside the `lotar serve` process that serves the page. Jobs run by the queue worker, `lotar agent run --wait` or an MCP session only append to `.tasks/@agent-logs/<job>.jsonl`. The Agents page, the task panel's thread and the board's activity pills see those lines only after a reload or an SSE reconnect. Automation jobs (@fix, @review, @merge) usually run in the queue worker, so most jobs aren't live. The owner asked on 2026-11-21: "make sure that the Web UI properly represents the activity of any agents we're running through harnessmux … in real time".

  ## Cause

  - Events reach SSE only through `record_and_emit` → `emit_job_event` in the process that runs the job (`crates/lotar-agent/src/services/agent_job_service.rs`), over the in-process bus (`crates/lotar-core/src/api_events.rs`).
  - The tasks watcher in `crates/lotar-lib/src/web_server.rs` (`start_tasks_watcher`, `process_watch_batch`) already watches `.tasks` recursively but ignores `@agent-logs`.
  - A few entries are written with bare `push_event` and never go out over SSE even in-process (AJS about :5577, :5715, :5735, `agent_job_service/kept.rs` :130). Check whether they should.
  - `view/composables/useAgentActivity.ts` doesn't subscribe to `agent_job_input`, `agent_job_question` or `agent_job_result`.

  ## Plan

  - [ ] `lotar serve` follows `@agent-logs/<job>.jsonl` for jobs it does not run itself (the active-job records next to the queue say which process runs a job). For each new `event` line, emit the same `agent_job_*` SSE event an in-process job would, built from the header and the latest `status` line. Emit a job's end from its `status` line. Read only appended bytes (keep an offset per file), and ignore partial last lines.
  - [ ] Honour `agent_logs_dir` (moved or `off`) and the project filter.
  - [ ] The UI already removes duplicates by `sequence` (`view/pages/AgentJobs.vue` ~:629). Check that the task panel thread and `useAgentActivity` do too.
  - [ ] `useAgentActivity` handles input, question and result events, so a question shows on the board pill.
  - [ ] Tests: an integration test where a second process (or a direct append to the log) adds lines and an SSE client receives them in order. A smoke test that a job written by another process updates the Agents page without reload.
  - [ ] `docs/help/agent.md` says what is live from where.

  ## Done when

  - [ ] A queue-worker job's messages, tool lines, questions and end appear on the Agents page, in the task panel's thread and on the board's activity pill within about a second, without reload (owner: "properly represents the activity of any agents … in real time").
  - [ ] `lotar serve` sends each new `event` line of a job log as the `agent_job_*` SSE event an in-process job sends: same kind, `sequence`, `at`, `message`, and the job fields from the header and the log's latest `status` line (no status line yet: `running`; `question` stays null, only the job's own process can answer it).
  - [ ] Which wins: a job this server's process holds (it runs it, or took it over) goes out only from memory, as before; its log lines are not sent again. Every other job goes out from its log.
  - [ ] Only appended bytes are read (an offset per file); a partial last line waits for its newline; a malformed line is skipped; a log that shrank or was replaced is read again from its start; a deleted log is forgotten. Logs that exist when the server starts are not replayed.
  - [ ] Logs in a moved `agent_logs_dir` (also outside `.tasks`) are followed; `off` follows nothing. The folders are the ones configured when `lotar serve` starts. The SSE `project` filter applies as for in-process jobs (by `ticket_id`).
  - [ ] The notes written with bare `push_event` (ticket moved / reassigned after the end rules, T3 thread settled or kept) go out over SSE too, so the live view matches a reload.
  - [ ] `useAgentActivity` subscribes to input, question and result events, shows a question on the pill, drops events it saw already (by `sequence`), and removes a job whose event carries an ended status. The task panel and Agents page keep deduplicating by `sequence`.
  - [ ] Tests: a Rust integration test appends lines to a log behind a running server and an SSE client gets them in order, the partial line only once complete, the end with its status. A smoke test appends to a log and the Agents page shows the lines without reload. `docs/help/agent.md` says what is live from where.
