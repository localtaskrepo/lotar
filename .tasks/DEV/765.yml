  text: |-
    Done: `lotar serve` now streams jobs of other processes (queue worker, `agent run --wait`, MCP) from their logs; the pill says **Asks** when the agent waits on a question.

    - Follower: `crates/lotar-agent/src/services/agent_job_service/follow.rs`, wired into the watcher in `crates/lotar-lib/src/web_server.rs`; reads only appended lines, skips jobs this process runs, no replay of old logs
