description: |-
  On a phone the Board and the Tasks list are wider than the screen: board columns are at least 260 px wide (about 1.2 fit at 390 px) and the task table is about 1,570 px wide, so status, priority and assignee sit three screens to the right. The owner asked on 2026-11-13 for a more digestible phone layout, with a preference to keep the classic one.

  ## Decisions (owner, 2026-11-13)

  - Board on phones: **tabs + swipe**, one column at a time.
  - Phones get the **compact layout by default**; Preferences switches back to Classic.
  - File this ticket and build it.

  ## Research

  - Swiping one column at a time is the common phone board (Jira iOS/Android, Trello, GitScrum, SwiftKanban). Trello users asked for a way to jump to a column instead of swiping through each (TRELLO-1063), hence tabs.
  - Drag and drop is fragile on touch (Jira JSWCLOUD-20716, SmartSuite feedback); Trello and Asana offer a "Move to" menu.
  - GitHub Projects on mobile shows tables as a list with field pills; reading one task at a time suits rows-as-cards better than a wide table.
  - Android treats < 600 dp as compact; lotar already uses a 640 px breakpoint.

  ## Plan

  - `Narrow screens: Compact / Classic` in Preferences (default Compact); a composable answers "compact now?" from `(max-width: 640px)` and the preference.
  - **Board, compact:** status tabs with counts (and WIP warning) above one full-width column; tap a tab or swipe (CSS scroll snap) to change columns. Cards: ID, priority, assignee · title (2 lines) · meta line, honouring the card-field settings. Group by becomes collapsible sections inside the column. A ⋯ button on each card opens a sheet with "Move to <status>" and Open.
  - **Tasks, compact:** rows instead of the table: ID, status, priority, updated · title · the other visible columns as a meta line. Sort control where the headers used to be; bulk select and row actions stay.
  - Desktop and Classic stay unchanged.

  ## Done when

  - [x] Preference stored and shown in Preferences; Classic restores today's layout on narrow screens
  - [x] Board compact: tabs, swipe, cards, grouping, Move-to sheet, add-task
  - [x] Tasks compact: rows, sort, bulk select, row actions
  - [x] No horizontal page scroll at 390 px on both pages
  - [x] Vitest coverage for the composable; smoke specs at 390 px for both pages
  - [x] `npm run lint`, `npm test`, `npm run smoke` pass

  ## Not in scope

  - The 13-item top navigation that also scrolls sideways on phones (own ticket).
