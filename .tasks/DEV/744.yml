- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3Afcac4c32621b06e3af47986ebaa016611f886cf96d34c2870bda623f33e0394a
description: |-
  Found in STD-276 (standards). Job job-20261120T222210.199Z-25 (DEV-739, fix) ran the rule 'Jobs: set up the worktree' (job_started, `run` of `node .../scripts/worktree.ts create`, timeout 20m, ignore_failure). It ran: node_modules and the stamp `standards-install` in the worktree's git dir appeared at 22:24, before the session started. The job log shows nothing between `agent_job_started` (22:22:31) and the next progress line (22:24:14), so a reader can't tell that the rule ran, how long it took, or whether it failed (ignore_failure hides a failure too). DEV-726 fixed the same gap for the end-of-job waiting cleanup.

  ## Done when

  - [ ] Each `run` action of a job_started rule writes one progress line to the job log: rule name, exit code, duration; with ignore_failure and a non-zero exit, the line says it failed and was ignored.
  - [ ] A skipped run (untrusted repo) also leaves a line saying so.
  - [ ] Test covers both lines; docs/help/agent.md names them.
  - [ ] The line is the DEV-726 run note (`Automation rule '<rule>' ran `<cmd>` on <ID>`), now with `exit <code>` and the duration; the job-end run notes get the same two fields. A run that fails without ignore_failure or times out says so with the error and the duration; the job still goes on as before (job_started rules' errors don't stop the job).
  - [ ] A `wait: false` run logs that it started (no exit code, no duration).
  - [ ] A failure of the job_started rules themselves (not a run) also leaves a line; before it was dropped.
  - [ ] Runs outside a job (a person's `lotar status`) stay stderr only.
