comments:
- date: 2026-11-20T23:17:19.190992+00:00
  author: claude
  text: |-
    Each `run` of a job_started rule now leaves a line in `lotar agent logs`.

    - `start_job` collects the run notes (DEV-726's `with_run_notes`) and logs them, plus `The start rules for <ID> failed: …` (before, that error was dropped)
    - Note now has exit code and duration: `ran `<cmd>` on DEV-1: exit 0 in 1m43s.`; ignore_failure: `failed (exit 1) in 12s, ignored (ignore_failure)`; a hard failure or timeout gives the error and how long it ran. Job-end notes get the same fields
    - Untrusted: `Automation rule '<rule>' skipped its run on <ID>: this workspace isn't trusted (`lotar trust`).`
    - Tests: `crates/lotar-lib/tests/dev744_job_started_run_notes_test.rs` (exit 0, ignored exit 3, failed exit 5 in a real job); skip line in `run_note_tests` (untrusted, a repo profile can't start a job, so unit level)
    - Docs: `docs/help/agent.md`, `docs/help/automation.md`
    - No guidance correction
  report:
    commits:
    - hash: c47f5a066
      what: job_started runs logged with exit code and duration; skip and rule-failure lines
