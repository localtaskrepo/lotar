      result: passed
      reason: 406 tests
    next: Review on another model, then merge
- date: 2026-11-21T01:02:43.499886+00:00
  author: claude
  text: |-
    Review: passed. `c47f5a066` does what "Done when" asks, and the branch merges cleanly with main (`5a68d24a7`).

    - Read: the ticket, DEV-726 and how its run notes work (`with_run_notes`, `note_run`), the diff, and the newer main commits to `agent_job_service.rs` and `docs/help/agent.md` (DEV-730, DEV-731). Running `git merge-tree` shows no conflict.
    - `start_job` (`agent_job_service.rs:3711`) now collects the notes from the start rules and logs them, plus `The start rules for <ID> failed: …`. The job still starts, as before.
    - `execute_run_action` (`automation_service.rs:1887`): exit 0, a failure that `ignore_failure` lets pass, and a hard failure or timeout now each show their duration. The job-end notes use the same function, so they get the same fields. The `wait: false` note is unchanged.
    - An untrusted skip now adds a note (`automation_service.rs:2666`). `note_run` does nothing outside `with_run_notes`, so a person's `lotar status` still prints to stderr only.
    - The new test `dev744_job_started_run_notes_test.rs` fails without the fix: before it, `start_job` dropped every note. A unit test covers the skip line.
    - Nothing outside lotar reads the old note text: I searched standards, local, autospec, `view/` and `smoke/`, and found only ticket text.
    - Rerun: `npm ci` passed. `npm run lint:agent` passed. `cargo nextest run -p lotar-agent run_note_tests` passed (4 tests). `cargo nextest run --test integration -E 'test(dev744) | test(agent_safety)'` passed (38 tests).
    - One test was flaky in that run: `agent_safety_test::git_required::a_later_job_end_removes_a_done_worktree_a_process_kept` passed on its second try (24s under parallel load). Run alone 3 times with `--retries 0` it passed each time in 3s. That test checks worktree removal, which this change doesn't touch.
    - Not rerun: the full `npm test` and `npm run smoke`, because they take too long for a review. The fix agent reports both passed.
    - No UI changes, no stray files, no owner decision needed. Tickets filed: none.
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3Afcac4c32621b06e3af47986ebaa016611f886cf96d34c2870bda623f33e0394a
description: |-
  Found in STD-276 (standards). Job job-20261120T222210.199Z-25 (DEV-739, fix) ran the rule 'Jobs: set up the worktree' (job_started, `run` of `node .../scripts/worktree.ts create`, timeout 20m, ignore_failure). It ran: node_modules and the stamp `standards-install` in the worktree's git dir appeared at 22:24, before the session started. The job log shows nothing between `agent_job_started` (22:22:31) and the next progress line (22:24:14), so a reader can't tell that the rule ran, how long it took, or whether it failed (ignore_failure hides a failure too). DEV-726 fixed the same gap for the end-of-job waiting cleanup.

  ## Done when

  - [ ] Each `run` action of a job_started rule writes one progress line to the job log: rule name, exit code, duration; with ignore_failure and a non-zero exit, the line says it failed and was ignored.
  - [ ] A skipped run (untrusted repo) also leaves a line saying so.
  - [ ] Test covers both lines; docs/help/agent.md names them.
  - [ ] The line is the DEV-726 run note (`Automation rule '<rule>' ran `<cmd>` on <ID>`), now with `exit <code>` and the duration; the job-end run notes get the same two fields. A run that fails without ignore_failure or times out says so with the error and the duration; the job still goes on as before (job_started rules' errors don't stop the job).
  - [ ] A `wait: false` run logs that it started (no exit code, no duration).
  - [ ] A failure of the job_started rules themselves (not a run) also leaves a line; before it was dropped.
  - [ ] Runs outside a job (a person's `lotar status`) stay stderr only.
