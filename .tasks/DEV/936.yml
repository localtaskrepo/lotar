  text: |-
    A new test covers cancelling a headless dyson job during its takeover. It builds on DEV-933, so this branch holds DEV-933's commit.

    - `a_headless_job_cancelled_during_its_takeover_brings_its_commits_back_and_frees_the_host` in `hosted.rs`: the job is marked Cancelled before `resume_session_to_end` runs. Its session resumes on dyson, the agent gets no `session/prompt`, its commits come back signed and its slot is free.
    - Corrected the Done-when to match the code. A stopped run doesn't commit what the agent left uncommitted (`bring_back(.., good = false)`). So `left.txt` stays in dyson's worktree, that worktree is kept, and the log says "Kept the worktree". The test checks this, not that the leftover came back.
    - Built on `agent/DEV-933` (`159432151`, which is Merging) for `headless_job_to_take_over`. Added depends-on DEV-933. When DEV-933 lands, the rebase drops the duplicate commit.
    - Dropping the `finish_on_host` call in the cancel branch makes the test fail (line 1480).
    - 38 lines changed, so no `small-diff` tag.
