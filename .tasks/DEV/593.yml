- date: 2026-11-15T23:05:51.463565+00:00
  author: claude
  text: |-
    Fixed: a job killed between `agent_job_started` and its runner start is now taken over and failed.

    - Cause: `run_job` wrote the job's record (`agent_active_jobs::register`) only after the `job_started` rules and git lookups. A process killed in between left a log with only `agent_job_started` and no record, so `recover_orphaned_jobs` had nothing to take over. The three LOCA jobs have no record and no `.ended` marker in `~/Library/Caches/lotar/agent-queue/active-*`, which fits.
    - Fix (`agent_job_service.rs`): the record is written as the job starts, with no session. It gets the session just before the runner starts, as before. A takeover of a session job without a session fails it: "The lotar process running the job exited before the job ended, before it started the t3 session." It doesn't resume a continued session from an earlier job.
    - Test: `dev510_t3_session_test::a_t3_job_killed_before_its_session_started_fails_once_taken_over`. It kills `lotar agent run` while a `job_started` rule sleeps, then checks: record left, takeover fails the job with the reason, `job_failed` runs once (also after a second recovery), no `t3 thread` call, `agent status` and `list-jobs` show `failed`.
    - Docs: `docs/help/agent.md`, "Jobs whose process died", has a line for this case.
    - Not covered: jobs killed before this fix (like the three LOCA ones) have no record, so nothing takes them over. They were restarted by hand.
    - `dev510 …fails_when_t3_cant_list_its_threads` hangs on main too (3/3 runs without this change). That's the known DEV-520 `cdd2141c` / DEV-590 issue. It passed in the full `test:agent` run.
