    next: Write the recovery record before publishing agent_job_started and cover that boundary.
- date: 2026-11-16T00:16:42.798449+00:00
  author: claude
  text: |-
    Rework: the record is now saved before `agent_job_started` is logged. Amended as `89b0ebff`.

    - Finding (record written after the start event): fixed. The new `mark_started` in `agent_job_service.rs` sets Running, saves the record (no session), then records `agent_job_started`. It does all three inside the same registry update as the cancel check, so a cancelled job gets no record.
    - Boundary test: no test hook can kill lotar between two lines. Two unit tests cover it instead:
      - `a_job_saves_its_record_before_its_start_is_logged`: the start step leaves the record (no session) next to `agent_job_started`.
      - `a_job_killed_before_its_session_started_fails_when_taken_over`: a record with a log that has only its header (killed after the record, before the start was logged) is taken over and failed with "…exited before the job ended, before it started the t3 session."
    - The integration test from the first pass (kill during a `job_started` rule, `job_failed` once, `agent status`/`list-jobs` show `failed`) is unchanged and passes.
    - The known DEV-520/DEV-590 flake (`…fails_when_t3_cant_list_its_threads`) failed in a targeted run and passed in the full run.
