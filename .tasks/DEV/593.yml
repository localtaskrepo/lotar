- date: 2026-11-15T23:28:39.145116+00:00
  author: codex
  text: |-
    Review: blocking

    - `crates/lotar-lib/src/services/agent_job_service.rs:2754` publishes `agent_job_started` before `register` at line 2766. Killing the process between those operations still leaves a started log without a recovery record: the original unknown/stalled-ticket bug remains. Persist the recovery record before publishing the start event, and test a kill at that boundary. The new test waits until a `job_started` rule runs, after registration, so it misses this case.
    - Read commit `5c8e1f30`, its full three-file diff, ticket/comments and related DEV-520/DEV-590 context, recovery/adoption code, repository review/testing guidance and recent main history. `docs/decisions` does not exist. No UI changes or minor follow-up tickets.
    - Targeted kill/recover regression passed (1 test) with `RUSTC_WRAPPER=`; both normal and escalated sccache attempts stopped before compilation with `Operation not permitted`. This pass confirms the rule-time kill case, not the gap above. Full gates were reported passed by the fix agent and were not rerun here.
    - Added `review-blocked`; status and assignee unchanged. No source edits or commits.
  report:
    checks:
    - command: RUSTC_WRAPPER= npm run test:rust:agent -- a_t3_job_killed_before
      result: passed
