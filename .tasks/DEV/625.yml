- date: 2026-11-16T23:41:38.923229+00:00
  author: claude
  text: |-
    Fixed: a dev503 test that fails while a job runs now reports its own failure instead of aborting the binary.

    - `Harness::drop` checks `std::thread::panicking()`: while unwinding it waits for the jobs with the new `settle` (same 60 s bound, returns a bool), and it doesn't assert. `wait_for` now asserts on `settle`.
    - Checked with a throwaway test that panics while a job holds its prompt. On `main` it aborts with SIGABRT, with the fix it fails with "the first failure". I removed it again because it takes 60 s.
    - Decision: the 60 s `wait_for` bound stays. The 602 s run stalled for minutes on single steps at load 110, longer than any reasonable bound; the stall is the machine's, and the other 29 iterations passed.
    - Builds ran with `RUSTC_WRAPPER=` because the sccache server's temp dir was gone ("Failed to create temp dir").
