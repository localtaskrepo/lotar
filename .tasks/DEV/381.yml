- date: 2026-11-13T01:22:55.975350+00:00
  author: claude
  text: 'claude: Owner 2026-11-13, asked whether to delete the test leftovers in ~/Library/Caches/lotar/agent-queue: "Yes". Delete only entries whose tasks_dir is a temporary test folder (under /var/folders or /tmp) and that no running job uses; keep the rest; comment the counts before and after.'
- date: 2026-11-13T01:28:51.211517+00:00
  author: claude
  text: 'claude, 2026-11-13: Cleaned ~/Library/Caches/lotar/agent-queue: 13104 entries before, 32 after. Moved 13072 entries into ~/Library/Caches/lotar/agent-queue-DEV-381-removed (8.6 MB): 1083 queue-*.json and 1083 worker-*.lock whose tasks_dir is under /var/folders or /tmp, plus 10906 active-* folders whose hash (blake3 of the canonical tasks dir) matches a temp tasks dir or no tasks dir on disk (searched ~ to depth 8). Their job records are test projects (CAN, REV, UIAG, AUTO, TEST-1 with agent mock...). None is used by a running job: every PID still alive in a record belongs to an unrelated process started after the job, and only the lotar and standards worker locks are held (kept). Kept: entries for the real tasks dirs (lotar, gairola, standards, foundera, local, quarter-inch-studio, decorator-depdenency-injection, relative .tasks) and 5 entries from a running STD-54 e2e test (changed in the last 30 min). The final rm -rf was refused by the agent''s permission check as irreversible, so the moved entries are still on disk.'
- date: 2026-11-13T01:28:51.469813+00:00
  author: claude
  text: 'Question for mallox: may I delete ~/Library/Caches/lotar/agent-queue-DEV-381-removed (13072 moved test leftovers), or will you run: rm -rf ~/Library/Caches/lotar/agent-queue-DEV-381-removed ?'
- date: 2026-11-13T01:42:51.578262+00:00
  author: claude
  text: 'Owner 2026-11-13: "Why not just move the folder to trash and the system will take care of it with the chance to recover". Done: moved ~/Library/Caches/lotar/agent-queue-DEV-381-removed to the Trash via Finder (recoverable with Put Back). Question above is answered; nothing left to do.'
- date: 2026-11-13T01:43:27.788245+00:00
  author: claude
  text: 'claude, 2026-11-13: Checked again: ~/Library/Caches/lotar/agent-queue has 32 entries, ~/Library/Caches/lotar/agent-queue-DEV-381-removed is gone, and Finder lists agent-queue-DEV-381-removed in the Trash (recoverable). DEV-380 keeps new test leftovers out. Nothing left to do; no repo changes.'
- date: 2026-11-13T01:44:00.377623+00:00
  author: claude
  text: 'claude, 2026-11-13: Merge job: nothing to merge. The branch has no commits beyond main; the work was a cache cleanup outside the repo, with no repo changes.'
