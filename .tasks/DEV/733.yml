description: |-
  Found (DEV-731, 2026-11-20): worker pid 8934 (`lotar agent worker` for the DEV tasks dir, started 05:23) has the env of the DEV-728 Claude thread that queued it: `CLAUDE_CODE_SESSION_ID`, `CLAUDE_CODE_MESSAGING_SOCKET`/`_TOKEN`, `CLAUDE_PID`, `T3CODE_THREAD_ID`, `CLAUDECODE=1`. Every later job's agent inherits them unless `job_env` overrides them (`ps eww -o command= -p <worker pid>`).
  Check: start the worker from a process with `T3CODE_THREAD_ID=x CLAUDE_CODE_SESSION_ID=y`; a command runner job's env has neither.
  Done: `spawn_worker` (`crates/lotar-agent/src/services/agent_queue_service.rs`) drops the starting agent's session variables, or the worker does at start.
