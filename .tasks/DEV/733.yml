- date: 2026-11-20T15:30:54.443303+00:00
  author: claude
  text: |-
    Fixed: a queue worker no longer passes the starting agent's session to later jobs.

    - `spawn_worker` (`crates/lotar-agent/src/services/agent_queue_service.rs`) removes `AGENT_SESSION_VARS`: `CLAUDECODE`, `CLAUDE_CODE_SESSION_ID`, `CLAUDE_CODE_MESSAGING_SOCKET`/`_TOKEN`, `CLAUDE_PID`, `CODEX_THREAD_ID`, `T3CODE_THREAD_ID`, etc. Settings like `T3CODE_HOME` stay.
    - Test `dev733_worker_drops_agent_session_env_test`: `lotar add` runs with `T3CODE_THREAD_ID=x CLAUDE_CODE_SESSION_ID=y CLAUDECODE=1`, and the command runner job's env has none of them. It fails without the fix.
    - `docs/help/agent.md` (queue worker section) says this.
    - Already running workers (e.g. pid `8934`) keep the old env until they exit.
  report:
