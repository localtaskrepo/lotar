  text: 'Fixed in eca8ccb2. ensure_branch_merged (agent_job_service.rs) no longer fast-forwards main when the merge agent handed the ticket back, meaning the job recorded a status or assignee as its outcome, which is how DEV-518 and DEV-514 stopped (HelpNeeded, mallox). The job completes, the outcome moves the ticket, and the job log says ''The merge agent handed the ticket back: left the main checkout as it was, <branch> is not merged''. A branch already on main is still recorded as landed. The fast-forward for an agent that wanted to merge and could not stays (DEV-411/DEV-465: the merge tests still pass). New regression test merge_job_that_hands_the_ticket_back_leaves_main_alone failed before the fix (main got feature.txt). Its stub unsets LOTAR_AGENT_JOB_ID: the command runner hands that variable to the agent, which makes its changes apply directly instead of being recorded as the outcome. T3 threads don''t get it. The review-blocked tag is not used as a signal, because it is specific to DEV''s automation.yml. docs/help/agent.md updated. Checks: npm run lint, npm test (2151 Rust + 1537 UI) and npm run smoke (401) pass. I ran npm run build:web first because the fresh worktree had no embedded UI.'
