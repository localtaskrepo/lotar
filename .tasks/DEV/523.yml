  author: claude
  text: |-
    This bug is already fixed on main by DEV-516 (`ff7b5229`). Our branch `agent/DEV-523` (`cc895833`) is a second copy of the same fix, so I didn't rebase or merge it.

    - On main, `ensure_branch_merged` in `agent_job_service.rs` leaves the branch unmerged when the merge agent reassigned the ticket, either as a held-back outcome or directly. It also saves the starting assignee in the job record for takeovers, and still fast-forwards an agent that finished. Test `merge_job_whose_check_fails_on_the_work_does_not_land` covers this. DEV-518 and DEV-514 both reassigned to mallox, so main catches them.
    - A rebase of `cc895833` onto main conflicts in all 6 files it touches. I aborted the rebase; the branch is unchanged.
    - One difference is left: a merge job taken over from a record an older lotar wrote, with no saved assignee. Main still fast-forwards it unless an outcome was recorded; `cc895833` leaves main alone and fails the job. This is the third review's finding.
    - I didn't rerun the checks on main. DEV-550 (merges run on an old checkout) is still being reworked.

    Close DEV-523 as done by DEV-516 and drop `cc895833` (done), or port the fail-closed case onto main's version (port)?
