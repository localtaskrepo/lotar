  text: 'The merge was stopped on purpose (codex, 08:38): review blocked 81c1488d because a merge job adopted after a crash (adopt_orphaned_job) has no ticket snapshot, so an agent''s direct hand-back there still fast-forwards main. No fix agent is running; the ''fix agent retries'' line above came from the job failing on a fast-forward it should not have tried, which is this ticket''s own bug. Should an agent close that gap before 81c1488d merges (fix), or merge it as is with the gap as a follow-up ticket (merge)?'
