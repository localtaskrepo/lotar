- date: 2026-11-14T23:26:42.595965+00:00
  author: claude
  text: |-
    Recovery gap closed, as answered (fix-first, INBOX-135): `53f61bbd` (amended).

    - The start snapshot (status, assignee) is now saved in the job's on-disk record (`ActiveJob.ticket_at_start`, `agent_active_jobs.rs`). `adopt_orphaned_job` reads it back, so a merge job taken over from a dead process still sees a direct hand-back. Records from older builds have no snapshot, so for those only a recorded outcome counts.
    - New test `git_required::an_adopted_merge_job_still_sees_a_direct_hand_back` (`agent_job_service.rs`). It fails without the fix ('Fast-forwarded the main checkout to agent/MRG-1') and passes with it.
    - Checks: `npm run lint` passes. `npm test` passes (2153 Rust + 1537 UI). `npm run smoke`: the first run failed once in `ui.theming.smoke.spec.ts`, a UI test this change doesn't touch. That file passed alone, and the full rerun passed 401/401.
