  text: |-
    Review: blocking. The code is correct and its tests pass, but the UI screenshots are missing.

    - **Blocking:** the fix comment links no before and after screenshots of the Agents page job log, in light and dark mode at 1920, 1440 and 390 px. The ticket has tag `ui`, so the review requires them. Fix: attach them to the ticket and link them in the fix comment. The code needs no change.
    - Reviewed `9e05afd76`, the only commit in `main..HEAD`. `agent/DEV-859` has no newer commits. I read the diff against the ticket, DEV-769 and `view/utils/agentJobLog.ts`: the call's match test uses the same trimmed, lower-case query as `layoutLog`, and checks the same fields (input and output; `what` is always visible).
    - Done when:
      - A matching call opens, grouped (Vitest) or alone (smoke, `git status`).
      - A match only past the first 12 lines shows the whole output, without a "Show all" button (`matchClipped`, `view/components/AgentJobToolCall.vue:63`).
      - A failed call stays open (`status === 'failed' || matches`), and clearing the search folds the calls again.
      - A Vitest and a smoke test cover it.
    - Reran:
      - `npm ci`: ok.
      - `npx vitest run --config view/vitest.config.ts view/__tests__/AgentJobLog.spec.ts view/__tests__/AgentJobs.spec.ts`: 45 passed.
      - The same test with main's `AgentJobLog.vue` and `AgentJobToolCall.vue`: the new test fails. I restored both files.
      - `npx vitest run --config smoke/vitest.config.ts smoke/tests/ui.agent-jobs.smoke.spec.ts -t 'filters the log, folds'`: passed.
    - My own screenshots, taken with a temporary spec that I removed afterwards (scratch folder `/tmp/dev859-shots`): light and dark mode at 1920, 1440 and 390 px. I saw no visual problem. After a search for `npm`, `make test` opens with its whole 21-line output; clearing the search folds the group again.
    - Minor, filed as [DEV-880](https://lotar.pyxzl.net/task/DEV-880): the log doesn't scroll to the match, so a match deep in a long output stays below the log's visible area.
