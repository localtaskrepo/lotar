    - Mutation: with `&& *known == asked` removed, the new test fails at "asks about both threads again" (`left: 6, right: 8`), matching what the fix agent reported.
    - Not rerun: full `npm run lint`/`test`/`smoke`. The machine was overloaded (load ~150, the build took 53 min). Only test code changed, and the fix agent reports all three passed.
