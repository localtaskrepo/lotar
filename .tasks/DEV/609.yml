  text: |-
    Merge stopped: `npm run test:agent` fails on two serve tests that this change doesn't touch.

    - Rebased onto main `804cb0f9`: DEV-599 had landed (`01a9160e`), so I dropped the branch's copy `45730a7f`. The DEV-609 test is now `2b7224a0`, the same diff (`git range-diff` shows `=`), signed.
    - `npm run lint:agent` passed.
    - `npm run test:agent` failed twice. `serve_honors_explicit_tasks_dir_for_api_requests` (`cli_serve_features_test.rs:532`) got status 0 in both runs, and `serve_with_project_data_lists_exact_tasks` (`:496`) in the second. Status 0 means no response inside the 1.5 s read timeout. The Mac's load average was 140-170 from other sessions.
    - Both pass alone, and all 15 serve tests pass with `-j 1`. The DEV-609 commit only adds a test to `dev503_harness_jobs_test.rs`, so main fails the same way.
    - Filed DEV-624 (health) for the flaky serve tests.
    - Smoke not run. Nothing merged, pushed or trusted.

    Question: merge `2b7224a0` anyway, or wait until DEV-624 is fixed?
