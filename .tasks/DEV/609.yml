  text: |-
    Added the test: a T3 job ending on the ticket drops the cached idle answer.

    - Branch builds on DEV-599 (`dcfbccef`, still in Merging): cherry-picked as `45730a7f`, as DEV-599 did with DEV-594. The cache this tests exists only there.
    - New test `a_t3_job_ending_on_the_ticket_drops_its_cached_idle_answer` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: fix job, in-process start caches the idle answer, `review` T3 job ends (thread-1), next start runs `t3 thread show` for both threads, a third start runs none.
    - With `&& *known == asked` removed from `running_t3_thread`, the test fails (6 shows, 8 expected).
    - Only test code changed: no docs or UI.
