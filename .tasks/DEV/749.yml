- date: 2026-11-21T01:56:55.124064+00:00
  author: claude
  text: |-
    Fixed: the sandboxed-check merge tests wait for the end state, not a fixed 30 s.

    - Cause: `run_merge_with_sandboxed_check` waited `10_000` ms (raised to the 30 s `WAIT_FLOOR_MS`) for three agent jobs; under load the merge job was still running (ticket at Merging)
    - `crates/lotar-lib/tests/agent_automation_integration_test.rs`: that wait and the SBF test's merge-job wait now use `JOB_END_LIMIT_MS` (300 s, as DEV-743), which ends as soon as the state is reached and only catches a hang
    - Commit `e128a27b5`
