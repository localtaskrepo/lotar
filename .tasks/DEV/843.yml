- date: 2026-11-24T21:50:01.597365+00:00
  author: claude
  text: |-
    Fixed: a queued job no longer outlives its ticket, and its prompt shows the ticket's title at start.

    - Queue entries keep `ticket_created` (`agent_queue_service.rs`). A new ticket reusing the ID replaces the stale entry; the worker drops an entry whose ticket is gone or re-created, with a comment, no retries. Only "ticket not found" drops; other read errors retry as before. Old entries without the field aren't checked.
    - Parked entries, paused retries and `requeue_first` fill the field too; `unpark` carries it.
    - Rule `agent.prompt`: event values fill in when the rule fires, `${{ticket.*}}` when the job starts (`template.rs` `expand_keeping_ticket` / `expand_ticket_only`, `start_job_inner`). Other placeholders in a manual prompt stay as written.
    - Tests: `a_ticket_that_reuses_a_deleted_tickets_id_replaces_its_queued_job`, `an_entry_whose_ticket_was_deleted_leaves_the_queue_without_starting`, `a_jobs_prompt_shows_the_tickets_title_when_the_job_starts`, plus 2 unit tests.
    - Docs: `docs/help/automation.md` (agent run settings).
    - Two jobs (-39, -67) resumed in this worktree at once (DEV-833); -67 stopped without edits. Told the DEV-786 thread about the new entry field.
    - No guidance correction.
