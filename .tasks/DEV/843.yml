description: |-
  Found in the DEV-818 review. On 2026-11-22 a review job's scratch lotar add created DEV-818 'Example ticket for the Agents page' (assignee @fix, 22:42Z) in the real backlog and hard-deleted it. At 22:45Z the finding ticket got the same ID DEV-818 and was also assigned @fix. The fix job that started 2026-11-23 04:32Z (job-20261123T043208.499Z-57) got the prompt 'Work ticket DEV-818 ("Example ticket for the Agents page")' and the order to commit as 'DEV-818 Example ticket for the Agents page'. So commit 4cf6a8cd7 carries the deleted ticket's title.

  ## Check
  - .tasks/DEV/DEV-818.context, first user message: the old title.
  - .tasks/@agent-logs/job-20261122T220133.344Z-22.jsonl: the deleted ticket with that title.
  - Likely cause: the queue entry from 22:42Z kept its rendered prompt (DEV-786: entries keep their prompt) when the ticket was deleted and the ID reused. Not confirmed in code.

  ## Done when
  - [ ] A queue entry remembers when its ticket was created (`ticket_created`). Entries queued before this change have none and are not checked.
  - [ ] Queueing a job for a ticket whose entry (same ID, same profile) belongs to an earlier, deleted ticket replaces that entry: the new ticket's job is queued, with the new rule's prompt and settings. Test.
  - [ ] When the worker takes an entry whose ticket no longer exists, or exists with another created time, it drops the entry without starting a job and without spending retries; it says so on stderr and, when a ticket with that ID exists, in an automation comment on it. Test.
  - [ ] A parked entry (waiting for prerequisites) keeps its `ticket_created` when it moves back to the queue.
  - [ ] A rule's `agent.prompt` fills in event values (`comment.*`, `previous.*`, `unblocked.*`, `agent.*`) when the rule fires, but `${{ticket.*}}` values when the job starts, from the ticket as it is then. So a queued job's prompt shows the ticket's current title. Test: queue, rename the ticket, start: the prompt has the new title.
  - [ ] A prompt with no `${{ticket.*}}` placeholders starts unchanged; a value filled in at the rule (e.g. a comment's text) is not expanded a second time except for `${{ticket.*}}` it contains.
  - [ ] Docs on the rule's `prompt` say when ticket values are filled in.
