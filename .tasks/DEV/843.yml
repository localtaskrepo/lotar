- date: 2026-11-26T00:04:41.360122+00:00
  author: claude
  text: |-
    Not merged: DEV-845 on main fixes the same prompt-title bug differently, in the same lines. Which design should stay?

    - Rebase of `0dde35870` onto main (`1d326e6e4`) conflicts in `template.rs`, `agent_job_service.rs`, `automation_service.rs` and `docs/help/automation.md`. I aborted it, so `agent/DEV-843` is unchanged and nothing landed.
    - **Main (DEV-845, `99c261083`):** only `${{ticket.title}}` waits until the job starts (`expand_for_queued_job` plus `fill_ticket_title`). Main also moved the placeholder loop into `replace_placeholders`.
    - **DEV-843:** every `${{ticket.*}}` waits until the job starts (`expand_keeping_ticket` plus `expand_ticket_only`). Its queue changes (`ticket_created`, dropping stale entries) don't conflict.
    - DEV-843's approach covers DEV-845's. Resolving it means removing DEV-845's functions and rewriting its tests and doc sentence, which is more than keeping both sides.
    - Proposal: keep DEV-843's design, rebuilt on `replace_placeholders` (skip `ticket.*` at queue time, fill them in at start). Port DEV-845's test cases to it (a title containing `${{…}}` is not expanded again). Use DEV-843's doc sentence. Then run the full checks and merge.
    - Checks: none ran, because the rebase stopped first.
