- date: 2026-11-25T12:36:17.573665+00:00
  author: claude
  text: |-
    Review: passed. `0dde35870` does what "Done when" asks, with no stray files, and it rebases cleanly onto main (`git merge-tree` shows no conflicts; main is 14 commits ahead).

    - **Read:** the diff `main...HEAD` (6 files), the ticket and the fix comment, the `@fix` and `@work` prompts in `.tasks/DEV/automation.yml`, the worker loop in `agent_queue_service.rs`, and the last 3 commits on main for each touched file.
    - **Cause confirmed:** the rule prompts start with `Work ticket ${{ticket.id}} ("${{ticket.title}}")` and contain the `"${{ticket.id}} ${{ticket.title}}"` commit order. Before this fix they were filled in at queue time. Now `expand_keeping_ticket` (`automation_service.rs:3087`) leaves them for `expand_ticket_only` in `start_job_inner` (`agent_job_service.rs:381`).
    - **Queue:** `ticket_created` is set on enqueue, park, pause and `requeue_first`, and `unpark` carries it. When a new ticket reuses an ID, its enqueue replaces the stale entry. `start_entry` drops an entry whose ticket is gone or was re-created: it returns `Ok`, so the worker settles the entry without spending retries, and it writes the stderr line and an automation comment. Old entries without the field are not checked.
    - **Failed before the fix:** the queue tests use the new field and functions, so they could not have passed before. The integration test would have failed before: the old start code didn't expand the prompt, so the literal `${{ticket.id}}` stayed in it.
    - **Rerun, all passed:** `npm ci`. `cargo nextest run -p lotar-agent -E 'test(agent_queue_service) | test(template) | test(automation_service)'` (57 tests). `cargo nextest run -p lotar-lib --test integration -E 'test(agent_automation_integration_test)'` (60 tests). `cargo clippy -p lotar-agent --all-targets -- -D warnings`, plus `rustfmt --check` and `prettier --check` on the changed files.
    - **Note, not blocking:** `a_jobs_prompt_shows_the_tickets_title_when_the_job_starts` passes a hand-written placeholder prompt to `start_job_with_tasks_dir` instead of going rule → queue → start. Together with the unit test `a_rules_prompt_keeps_the_tickets_values_for_the_jobs_start`, the whole chain is still covered.
    - No UI changes. No tickets filed. No guidance correction.
