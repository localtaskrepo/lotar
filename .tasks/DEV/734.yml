comments:
- date: 2026-11-20T18:37:16.210363+00:00
  author: claude
  text: |-
    Cause found; fix written, full checks running.

    - Claude never wrote the session's transcript: `~/.claude/projects/-Users-mallox-Development--localtaskrepo--lotar-worktrees-lotar-DEV-732/` has no `7d15b17f-….jsonl`, so `session/load` can't succeed. lotar can't make that resume work
    - Fix: the job's record (`ActiveJob`) now keeps its request; a takeover whose resume fails queues the job again, first, with `session: fresh`, and ends it `paused` (its `job_paused` rules run, not `job_failed`)
    - Test `a_taken_over_job_whose_session_cant_be_resumed_runs_again` failed before the fix (`status: failed`) and passes now
- date: 2026-11-20T19:52:43.472278+00:00
  author: claude
  text: 'Stalled since 2026-11-20T18:37Z with no lotar job: the live check restarted @fix as the next turn of its thread, with the fix prompt (lotar rule "Stalled: restart the fix agent"). A second stall at this step goes to mallox (repos.ts --live --report, STD-167).'
- date: 2026-11-20T19:52:48.234533+00:00
  author: claude
  text: |-
    Fixed: a taken-over job whose session can't be resumed runs again, it doesn't fail to HelpNeeded.

    - Cause: Claude never saved the transcript of `7d15b17f-…` (no `.jsonl` under `~/.claude/projects/…-DEV-732/`), so no resume can work. lotar now runs the job again instead
    - `ActiveJob` (`agent_active_jobs.rs`) keeps the job's request. On a failed resume, `run_again_in_new_session` (`agent_job_service.rs`) queues it first with `session: fresh` and the status/assignee change it recorded; the job ends `paused` and its `job_paused` rules run
    - A T3 thread lotar took over, or a record from 0.15.5, has no request and fails as before
    - `requeue_after_limit` is now `requeue_first` (used by both); `docs/help/agent.md` updated
    - Commit `aa2b8b2f8`
