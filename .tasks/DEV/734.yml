- date: 2026-11-20T19:52:48.234533+00:00
  author: claude
  text: |-
    Fixed: a taken-over job whose session can't be resumed runs again, it doesn't fail to HelpNeeded.

    - Cause: Claude never saved the transcript of `7d15b17f-…` (no `.jsonl` under `~/.claude/projects/…-DEV-732/`), so no resume can work. lotar now runs the job again instead
    - `ActiveJob` (`agent_active_jobs.rs`) keeps the job's request. On a failed resume, `run_again_in_new_session` (`agent_job_service.rs`) queues it first with `session: fresh` and the status/assignee change it recorded; the job ends `paused` and its `job_paused` rules run
    - A T3 thread lotar took over, or a record from 0.15.5, has no request and fails as before
    - `requeue_after_limit` is now `requeue_first` (used by both); `docs/help/agent.md` updated
    - Commit `aa2b8b2f8`
