- date: 2026-11-20T18:37:16.210363+00:00
  author: claude
  text: |-
    Cause found; fix written, full checks running.

    - Claude never wrote the session's transcript: `~/.claude/projects/-Users-mallox-Development--localtaskrepo--lotar-worktrees-lotar-DEV-732/` has no `7d15b17f-….jsonl`, so `session/load` can't succeed. lotar can't make that resume work
    - Fix: the job's record (`ActiveJob`) now keeps its request; a takeover whose resume fails queues the job again, first, with `session: fresh`, and ends it `paused` (its `job_paused` rules run, not `job_failed`)
    - Test `a_taken_over_job_whose_session_cant_be_resumed_runs_again` failed before the fix (`status: failed`) and passes now
