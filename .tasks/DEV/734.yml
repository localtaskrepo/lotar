  text: |-
    Not merged: the fix breaks the signing-pause retry. Should the fix agent rework it, or do you want something else?

    - Rebased onto main `c11351f1f` as `c79911816` (lotar's merge). Lint passed
    - `dev604_queue_pauses_test::a_signing_failure_pauses_the_queue_and_its_retry_makes_only_the_commit` fails every time, also when run alone. After signing works again the queue never resumes: `pause` stays set, `next_try_at` passes, `running_jobs: 1`, TEST-2 stays pending (`dev604_queue_pauses_test.rs:173`)
    - Cause: the branch. In `active_record_of` (`agent_job_service.rs`), I put back `request: None` instead of `state.request.clone()` and the test passed (9.8 s). Then I restored the file, so the worktree is clean
    - `dev605_merge_without_agent_test::a_check_that_leaves_a_process_running_doesnt_hold_up_the_merge` also failed in lotar's run, but it passes alone. It is a timing test, and the load average was 21
