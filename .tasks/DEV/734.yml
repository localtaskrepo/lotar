- date: 2026-11-20T21:53:22.498268+00:00
  author: claude
  text: |-
    No regression to fix: the branch doesn't cause the dev604 failure, so `c79911816` stays as it is and can be merged again.

    - With `state.request.clone()` kept, `a_signing_failure_pauses_the_queue_and_its_retry_makes_only_the_commit` passed every time: 6 runs alone, 12 in parallel, 16 in parallel with CPU stress (load 30), with a lotar job's `LOTAR_*` variables set, and in the full `npm run -s test:rust:agent` (2421/2421)
    - By the code it can't matter: only `adopt_orphaned_job` reads the request from the record. A taken-over `command` job (this test's runner) still fails in `finish_orphaned_job` as before. The new rerun is only on the `resume_session_to_end` path of session runners
    - The failure was load: in lotar's run the test took 26 s (alone it takes 8 s), at load average 21, and dev605's timing test failed in the same run. The merge agent's pass with `request: None` was a single run
    - `dev605 ...a_check_that_leaves_a_process_running...` passes alone (6.3 s)
    - Filed the flaky test as [DEV-742](https://lotar.pyxzl.net/task/DEV-742)
