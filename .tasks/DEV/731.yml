description: |-
  Found (DEV-730, 2026-11-20): `lotar agent worker` is spawned by whichever lotar process queues a job and inherits its environment. Workers started by the triage agent's `lotar assignee` ran without `~/.cargo/bin` on PATH (live harnessmux worker pid 94972, started 12:51 UTC: `PATH=/opt/homebrew/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin`), and one such worker ran DEV jobs -1..-27 from 05:22 to 13:06 UTC, so every `agent.worktree.waiting_run` (`cargo clean --workspace`) in that time failed (DEV-726, DEV-727, DEV-728). The jobs' agents got the same short PATH. Where Claude Code's headless shell gets that PATH is not known yet; the standards service's own PATH is complete.
  Check: start the worker from a process with PATH=/usr/bin:/bin; a job's command runner and waiting_run still find a program in the service's PATH (or the job log says the PATH is short).
  Done: a worker's jobs don't depend on which agent shell happened to queue first, and the short PATH's source is known.
tags:
- health
custom_fields:
  finding: worker:inherited-path
