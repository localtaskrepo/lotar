    - Not rerun: smoke and UI tests (no UI change; the fix agent ran them at 15:43)
    - Merge: `docs/help/agent.md` conflicts with DEV-733, as the fix agent said: keep both sentences
    - Minor, filed: DEV-745 (the 5 s limit doesn't cover reading the shell's stdout, so a profile with a background process can hang the worker), DEV-746 (in-process `run_worker` in tests calls `set_var` while other threads run and uses the developer's login shell)
