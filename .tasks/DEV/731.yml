- date: 2026-11-20T14:57:20.153604+00:00
  author: claude
  text: |-
    The queue worker now adds the login shell's PATH, and the short PATH came from launchd plists.

    - Source: `~/Development/local/scripts/mac/net.pyxzl.repo-health.plist` (and `live-checks`) set `PATH=/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin`. lotar puts its own dir in front, which gives the doubled `/opt/homebrew/bin` seen in pid 94972. Filed as LOCA-557
    - Fix: `complete_path_from_login_shell` in `crates/lotar-agent/src/services/agent_queue_service.rs` runs `$SHELL -l -c` once when the worker starts (5 s timeout, a marker skips anything the profile prints). It appends the entries the worker's PATH lacks. If that fails, it says so on stderr and keeps the PATH it got
    - Test: `worker_started_with_short_path_runs_jobs_with_login_path` starts the worker with `PATH=/usr/bin:/bin` and a fake login shell. The job finds a program on the login PATH
    - Docs: `docs/help/agent.md` (queue worker)
    - Also found: the worker keeps the queuing agent's `CLAUDE_CODE_SESSION_ID`/`T3CODE_THREAD_ID` (pid 8934), filed as DEV-733
  report:
    commits:
    - hash: ed15359af
      what: worker completes its PATH from the login shell
    checks:
