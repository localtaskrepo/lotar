    Review: passed. `ed15359af` fills a short worker PATH from the login shell, and the cause of the short PATH (LOCA-557) is confirmed.

    - Read: the diff (`agent_queue_service.rs`, `agent_safety_test.rs`, `docs/help/agent.md`), the ticket and its comments, DEV-733's `spawn_worker` change on main (it removes only session variables; `SHELL` stays) and LOCA-557's commit `f734208` in `local`
