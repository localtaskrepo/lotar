  text: |-
    Review: passed. `99ef012b3` makes the top Queued and the Queued tab agree (this process's queued jobs + queue-file tickets), as "Done when" asks.

    - Read: the diff, the ticket and its "Done when", DEV-798, DEV-871, `docs/help/agent.md`, `AgentJobService::queue_stats` (`agent_job_service.rs:616`), `GET /api/jobs` (`routes/jobs.rs:38`), `lotar agent queue` (`cli/handlers/agent.rs:497`), the tab code (`AgentJobs.vue:384-411`)
    - Holds: `list_pending` returns queue-file entries (pending + taken). `registry.pending_queue` holds jobs already started, so adding the two counts doesn't count anything twice. The only overlap is the instant between `start_entry` and `settle_taken` (`agent_queue_service.rs:689-690`), too short to matter. Without `queue`, the tab falls back to queued jobs only (`?? 0`)
    - Fix agent's "Done when" edit is fine: the CLI can't see another process's memory. DEV-871 tracks it. The MCP `agent/list_jobs` still counts this process only, as before (not in scope)
    - Test fails before the fix: the Vitest tab expects 4, and the old code gave 5 (1 job + 3 tickets + 1 prerequisite job). The Rust test checks `combined_stats` with plain values, not a real registry. That's enough here
    - Reran: `npm ci` ok; `cargo nextest run -p lotar-agent -E 'test(queued_adds) | test(each_waiting_entry)'` 2/2 passed; `npx vitest run --config view/vitest.config.ts view/__tests__/AgentJobs.spec.ts` 32/32 passed; `rustfmt --check` and `prettier --check` on the changed files: clean
    - UI: read the fix agent's before/after screenshots (before 3/4, after 4/4, light and dark at 1920/1440/390). My own run: scratch `lotar serve` from this branch, 1 running job, 1 queued in the server, 3 tickets in the queue file. API `queue_stats.queued` 4; page shows 4 at the top and 4 in the tab in all 6 shots (`/tmp/rev865/shots/`). No layout problems
    - Found while setting it up, not caused by this change: a relative `--tasks-dir .tasks` shares one queue file across repos, and 7 DEV/STD tickets wait there with no worker. Filed DEV-887 (related)
