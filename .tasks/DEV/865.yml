description: |-
  Found in the review of DEV-798.

  - `crates/lotar-agent/src/services/agent_queue_service.rs:486`: `stats.queued = stats.queued.max(pending.len())` takes the larger count
  - `view/pages/AgentJobs.vue:409`: the Queued tab adds this process's queued jobs to the queue file's waiting tickets
  - The two lists don't overlap (`registry.pending_queue` holds jobs already started from the queue), so with 1 queued job and 3 waiting tickets the top shows 3 Queued and the tab shows 4
  - `docs/help/agent.md` says the tab counts "as the Queued count at the top does"

  Check: 1 queued job in this process and 3 tickets in the queue file give the same Queued count at the top, in the tab and in `lotar agent queue`.

  ## Done when

  One rule for every surface: Queued = this process's queued jobs + the tickets waiting in the queue file. Jobs waiting for prerequisites don't count (`docs/help/agent.md`: "Jobs waiting for prerequisites don't count as queued"); the tabs still list them.

  - [ ] `AgentQueueService::queue_stats` adds the two counts instead of taking the larger: a server with 1 queued job and 3 queue-file tickets gives `queue_stats.queued` 4 in `GET /api/jobs`
  - [ ] `lotar agent queue` follows the same rule in its own process, which has no queued jobs: it shows the 3 queue-file tickets. Jobs queued in another process's memory (`lotar serve`) aren't visible to it: follow-up ticket
  - [ ] Agents page: the Queued tab counts this process's queued jobs + the queue's `pending` tickets, not the jobs waiting for prerequisites, so it equals the top Queued for the same response
  - [ ] Without a queue overview in the response (`queue` missing), the tab counts this process's queued jobs only, as before
  - [ ] `docs/help/agent.md` states the rule for the top count and the tab
  - [ ] A Rust test (1 queued job in the registry + 3 pending entries → 4) and a Vitest (tab count = top count, prerequisites not counted) cover it
