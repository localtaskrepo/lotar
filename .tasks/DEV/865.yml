  text: |-
    Queued now adds this process's queued jobs to the queue file's tickets, at the top and in the tab.

    - `agent_queue_service.rs`: `queue_stats` adds the counts (new `combined_stats`, Rust test `queued_adds_this_process_jobs_to_the_queue_file_tickets`); running still takes the larger count, because the job records include this process's running jobs
    - `AgentJobs.vue`: the Queued tab counts queued jobs + `queue.pending`. It no longer counts the jobs waiting for prerequisites, which the docs say "don't count as queued". The tab still lists them
    - `AgentJobs.spec.ts`: 1 queued job + 3 tickets + 1 prerequisite job gives 4 at the top and 4 in the tab
    - `docs/help/agent.md`: states the rule for the top count and the tab
    - Browser check: scratch `lotar serve` with 1 running job, 1 queued job and 3 tickets in the queue file. Before: top 3, tab 4. After: 4 and 4 (screenshots attached: `before-*`/`after-*`, light/dark, 1920/1440/390)
    - Not fixable here: `lotar agent queue` still says 3. The server's queued job exists only in the server's memory, and no other process can see it. I changed "Done when" to match and filed DEV-871
    - Also seen, not changed: the wait reason reads "2 of the global max_parallel_jobs 1 running" while only 1 job runs
