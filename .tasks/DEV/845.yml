- date: 2026-11-25T11:28:04.505695+00:00
  author: claude
  text: |-
    Review: passed. `34c737675` makes a rule's job fill `${{ticket.title}}` when the job starts, and it merges cleanly onto main `d3c11b78c`.

    - **Read:** the diff of `34c737675` (4 files), the ticket and the fix comment, DEV-825's timeline, `AgentJobService::create` and the queue/retry paths, and `docs/help/automation.md`. Main touched these files since (DEV-809, DEV-821), but `git merge-tree` shows no conflict.
    - **Fix holds:** `from_action` (`automation_service.rs:3085`) now leaves the title placeholder in. `create` (`agent_job_service.rs:379`) fills it from the ticket it loads, the same one the "Ticket context" comes from. Retries keep the placeholder in `req.prompt`, so they also get the title at their start. The other placeholders are still filled in when the rule runs, as documented.
    - **Evidence:** the DEV-825 session log contains `DEV-825 first` twice. Rule ran 04:27Z, job started 07:20Z. That matches the fix agent's cause.
    - **Test failed before the fix:** `a_rule_job_prompt_leaves_the_title_for_the_job_start` gets the title already filled in with the old `tmpl.expand`.
    - **Reran:** `RUSTC_WRAPPER= cargo nextest run -p lotar-agent --lib -E 'test(/template|a_rule_job_prompt_leaves_the_title|agent_run_settings|thread_name/)'`: 14 passed, both new tests included. Lint, the full suites and smoke were not rerun: the merge runs them.
    - **Side effect, harmless:** a CLI, MCP or REST prompt that contains a literal `${{ticket.title}}` now gets the title filled in too.
    - No UI change, no stray files, no second branch.
    - **Minor, filed [DEV-870](https://lotar.pyxzl.net/task/DEV-870):** a job held in the in-process pending queue still starts with the whole prompt built at `create` (`agent_job_service.rs:499`, `:6176`). That covers its title and ticket context. Older behaviour, not this rule-queue path.
    - **At merge:** DEV-825's commit still needs its real title (an amend). This branch doesn't do that.
