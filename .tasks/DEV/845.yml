description: 'Found: reviewing DEV-825, commit `3fad61477` on `agent/DEV-825` is titled "DEV-825 first". The fix job was told so: its prompt (session `lotar-95e687-DEV-825-fix`) says `message "DEV-825 first"`, where `.tasks/DEV/automation.yml:134` has `"${{ticket.id}} ${{ticket.title}}"`. Other jobs got their full title (DEV-747, DEV-563). DEV-825 was filed from a review worktree on 2026-11-23 and briefly had a scratch-looking relation to DEV-3, so the title the job read may have come from a scratch ticket. Check: `grep -o "DEV-825 first" ~/.local/state/harnessmux/sessions/lotar-95e687-DEV-825-fix.events.jsonl`. Done: the cause is found and fixed, and a job prompt always carries the ticket''s current title. The DEV-825 commit gets its real title when it is merged (unpushed, so an amend).'
