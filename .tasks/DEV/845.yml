- date: 2026-11-24T21:45:49.823571+00:00
  author: claude
  text: |-
    Fixed: a queued job's prompt now uses the ticket's title from when the job starts, not from when the rule queued it.

    - **Cause:** the rule filled in the job prompt (`${{ticket.title}}` included) when it queued the job. The "Ticket context" is built later, when the job starts. DEV-825 was queued at 04:27Z, when its title was still "first" (a scratch-looking first version, with no title change in its history), and the job started at 07:20Z. The prompt's "Ticket context" shows the real title, but its commit line says `"DEV-825 first"`.
    - **Fix:** `AgentRunSettings::from_action` in `automation_service.rs` now leaves `${{ticket.title}}` unfilled, and the job start fills it in from the ticket (`fill_ticket_title`, `template.rs`). Other variables (`previous.*`, `comment.*`, `ticket.status`, ...) are still filled in when the rule runs: the triage prompt needs the status and assignee from that moment.
    - **Tests:** `a_rule_job_prompt_leaves_the_title_for_the_job_start` and `a_queued_job_prompt_fills_the_title_when_the_job_starts`. Documented in `docs/help/automation.md`.
    - **DEV-825:** `agent/DEV-825` is still at `879f137c7 "DEV-825 first"`, unpushed. Its merge should amend the title. This job didn't touch that branch.
