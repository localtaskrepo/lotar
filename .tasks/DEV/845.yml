- date: 2026-11-24T21:21:19.109499+00:00
  author: claude
  text: |-
    Fixed: a rule's job prompt now takes the ticket's title when the job starts, not when the rule queued it.

    - Cause: the rule expanded `${{ticket.title}}` at 04:27 on 2026-11-23, when DEV-825 still read "first"; the job started at 07:21 and its Ticket context already showed the real title, but the prompt kept the old one. The title change isn't in the ticket's history, so it happened before the file got tracked (filed from a review worktree).
    - `TemplateContext::expand_for_queued_job` leaves `${{ticket.title}}` in the prompt; `fill_ticket_title` fills it in `start_job_inner` (`crates/lotar-agent/src/services/agent_job_service.rs`), the path that queued jobs start through too.
    - Tests: `a_queued_job_prompt_fills_the_title_when_the_job_starts`, `a_rule_job_prompt_leaves_the_title_for_the_job_start`; `docs/help/automation.md` describes it.
    - Check: `grep "DEV-825 first"` still finds the old session; it is a log of the old run, and DEV-825's commit `3fad61477` still needs its amend at merge.
