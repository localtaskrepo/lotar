description: |-
  `lotar automation simulate` stops at the first rule that matches, while a real event applies every matching rule ("When several rules set the same field, the last rule in file order wins", docs/help/automation.md). So a rule further down can't be checked at all when an earlier rule matches the same event.

  ## Found

  2026-11-13, standards: `lotar automation simulate --ticket STD-91 --event created` names only "Health: start the fix agent"; the rule "STD: review in a child thread (pilot)" at the end of `.tasks/STD/automation.yml` (adds tag `review-child` on created) never shows. Cause: `simulate_rules` in `src/services/automation_service.rs` returns on the first match.

  ## Done when

  - [ ] simulate lists every matching rule with its actions, in file order, and the preview applies them all as a real event would, with a test.
