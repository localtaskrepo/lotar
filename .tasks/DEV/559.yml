description: |-
  Found: in DEV-467's full `npm test` (2026-11-15, branch t3/job-end-rules-t3-outage on main f92de862), `services::agent_job_service::tests::output_after_exit_is_limited` (crates/lotar-lib/src/services/agent_job_service.rs ~4717) failed with left: Ok(()) right: Err(TimedOut). It passed 5 of 5 runs alone and in the full rerun. The test's descendant thread writes to the pipe in a loop. Under load it can be descheduled for longer than the 50 ms drain limit, the pipe runs empty, and read_job_output returns Ok before the limit is reached. The branch doesn't touch this code.

  Check: npm run test:rust under full-suite load (or with a loaded CPU) fails it now and then.

  Done when: the test proves the drain limit without depending on the writer outpacing the reader, for example by holding the pipe full or with a writer that never yields, and it passes repeated full runs.
