description: |-
  Found in the DEV-808 review (2026-11-27): `kill_process_group` in `crates/lotar-core/src/utils/git.rs` now calls `kill_tree`, which SIGSTOPs the group and lists the process table with `ps -A` twice. `BlobBatch`'s `Drop` (`crates/lotar-lib/src/services/audit_service.rs:97`) calls it at the normal end of every tracked activity feed, so each feed request spawns two `ps` (~40 ms each here) to stop a `git cat-file --batch` that has no children.

  ## Done when

  - [x] A normal `BlobBatch` drop closes git's stdin first and waits up to 1 s for `git cat-file --batch` to exit on that end of input; it then calls no kill, so no `ps` runs.
  - [x] A batch process that is still running after that wait is killed with `kill_process_group` (DEV-808's `kill_tree` once merged), as before. A read that timed out keeps killing at once (DEV-466 test unchanged).
  - [x] If closing stdin or waiting fails, the drop falls back to `kill_process_group`; the drop never panics.
  - [x] Test in `audit_service.rs` `blob_batch_tests`: a stub batch that writes a marker after it reads end of input fails before the change (killed before stdin closes) and passes after.
  - [x] The change stays in `audit_service.rs`: no conflict with DEV-808's `git.rs`. `npm run lint` and the `blob_batch_tests` pass.
