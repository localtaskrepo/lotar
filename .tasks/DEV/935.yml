  author: claude
  text: |-
    A normal activity-feed end no longer kills git cat-file: no `ps` runs.

    - `BlobBatch::drop` in `crates/lotar-lib/src/services/audit_service.rs` closes git's stdin, waits up to 1 s (`BLOB_BATCH_EXIT_WAIT`) for it to exit, and calls `kill_process_group` only if it's still running.
    - A timed-out read still kills at once (DEV-466 test unchanged).
    - New test `dropped_batch_closes_input_instead_of_killing`: a stub writes a marker after end of input. It fails with the old drop (killed first) and passes now. No kill means no `ps`, also once DEV-808's `kill_tree` lands.
    - DEV-808 only changes `git.rs` and the automation files, so this commit doesn't conflict with it.
    - Commit `c083d1ebd`; 37+/4−, so no small-diff tag.
    - No guidance correction; no durable finding.
