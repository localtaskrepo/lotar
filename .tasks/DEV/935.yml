- date: 2026-11-27T14:53:25.432550+00:00
  author: claude
  text: |-
    Review: passed. A normal drop closes stdin and lets `git cat-file` exit without a kill. Every "Done when" item holds.

    - Reviewed `c083d1ebd`, the only commit in `main..HEAD`. The branch has no newer rework. It changes only `crates/lotar-lib/src/services/audit_service.rs`.
    - `Drop` (`audit_service.rs:105`) closes stdin, then polls `try_wait` for up to 1 s. It calls `kill_process_group` only when the wait times out or `try_wait` fails. No path in the drop can panic.
    - A timed-out read still kills at once (`read`, `audit_service.rs:68`). The later drop then finds the process already exited and returns, so it doesn't kill a second time.
    - The other drop caller, `load_task_version_batched` (`audit_service.rs:877`, `*blobs = None` on error), works too: git has already exited or been killed, or it exits once its input closes.
    - The new test fails on the old drop: I removed the stdin close and the wait, it reported `FAIL`, and I restored the file. With the fix it passes.
    - `git.rs` is unchanged, so this can't conflict with DEV-808. On main, `kill_process_group` is still the plain `SIGKILL` version.
    - Reran: `npm ci` passed, `cargo nextest run -p lotar-lib blob_batch_tests` passed (2), the activity feed test passed, and `npm run lint` passed. The worktree is clean.
    - No minor findings, so no tickets filed.
