description: |-
  The merge's `finding_check` (`crates/lotar-agent/src/services/agent_job_service/merge.rs`, `fn finding_check`) has no test. Since DEV-800 it runs once per key of a bundle ticket and stops at the first key the check still lists. Found in the review of DEV-800: `grep -rn finding_check crates smoke` finds only the code and its config type.

  ## Done when

  - [ ] A test with a ticket that has two finding keys: a check that lists neither passes the merge, and a check that still lists the second key hands off with that key named.
  - [ ] A ticket without a finding key, or with no `finding_check` set, skips the check.
