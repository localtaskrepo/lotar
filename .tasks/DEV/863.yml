    - No stray files and no second branch. `npm ci` passed.
    - Reran on HEAD: `cargo nextest run -p lotar-lib --test integration dev605` passed 25 of 25, `cargo clippy -p lotar-lib --tests -- -D warnings` passed, and `rustfmt --edition 2024 --check` on the file passed.
    - Reran on main `cc453dc5c` plus this commit, in a scratch copy: the older test `a_check_that_leaves_a_process_running_doesnt_hold_up_the_merge` failed 3 of 3 tries, at load 7-10. On main alone it failed once, then passed on retry. This change doesn't cause it: it only adds tests and doesn't touch that one. Filed as minor DEV-890, related to DEV-885, which closed it as passing.
