    Review: passed. The four `finding_check` tests in `7b4d30c40` cover both "Done when" points, and no product code changed.

    - Read: the diff (`crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`, +95), `fn finding_check` in `crates/lotar-agent/src/services/agent_job_service/merge.rs:410`, DEV-800 and the fix comment. `merge.rs` hasn't changed on main since DEV-800 (`d79bf634c`).
    - Done when 1: keys `a:x` and `b:y`. A check that lists neither completes without an agent. A check that still lists `[b:y]` lands, then hands off naming `[b:y]` and not `[a:x]`. A run of only the first key would fail the per-key file assert, so the test pins DEV-800's behaviour.
