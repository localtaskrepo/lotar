description: |-
  ## Found

  On 2026-11-12 several tickets each got several T3 threads, each writing its own fix on its own branch without knowing about the others (reported by the DEV-376 fix agent, thread mcp:9580a0f1-3171-44b1-ae40-b08351230335, passed on at the owner's request):

  - DEV-361: 6 threads (for example mcp:b7be4f58-8651-4692-8cf6-4cb0c810c1c9, mcp:9d6c1af5-42de-408e-bad9-68435488fc61), 3 branches (`t3/restart-agent-worker-after-upgrade`, `-1`, `t3/lotar-worker-restart-on-upgrade`).
  - DEV-365: 4 threads (mcp:0f2206be-e055-4829-a0bc-79907b8b08b3, mcp:c72b7f37-06d5-4e5b-9de0-97daecfab188, mcp:78efb4ae-e7de-4471-9faa-b47a7dec7e8f, mcp:3ac5dec7-ebec-4f8c-9960-503be09cc459), 3 branches.
  - DEV-339, 346, 356, 359, 360, 362, 367: 2 or 3 branches each.

  Result: 20 commits only on this Mac ([DEV-376](https://lotar.pyxzl.net/task/DEV-376), finding unpushed:branches). 13 copy what landed. 7 are different fixes for Done tickets (DEV-343, 346, 362, 363, 365, 370) that main landed another way, and an agent now compares them by hand.

  Likely cause: jobs were retried after failed merges while the worker ran an old build (DEV-361). Each retry started a new thread instead of continuing the ticket's earlier thread or building on its open branch. DEV-368 continues the ticket's last thread only for the follow-up merge job, not for a new or retried fix job.

  ## Fix

  Before a job starts for a ticket, check for that ticket's earlier jobs: a thread that is still running or waiting, or an unmerged agent branch or worktree. Then do one of these:
  - continue that thread (as DEV-368 does for merges), or
  - start the job on the open branch, with the earlier job named in its prompt, or
  - refuse the duplicate and comment why.

  A running job for the same ticket should never get a second one. The retry rules in standards `configs/lotar/automation.yml` ("Health: retry with @fix", the failed-merge retry from STD-46) could also set `session: continue` once this works. Say in a comment whether they should, so standards can change them.

  ## Check

  A test: start a job for a ticket that already has a running job, or one with an unmerged agent branch, and assert that no second thread or branch appears. `git branch --list 't3/*' 'agent/*'` per ticket after a day of jobs.

  ## Done when

  - [ ] A second job for the same ticket continues or reuses the first job's thread or branch, or is refused with a comment.
  - [ ] Tested as above; docs/help/agent.md says how it behaves.
