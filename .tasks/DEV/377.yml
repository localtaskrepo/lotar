- date: 2026-11-12T18:55:03.586110+00:00
  author: claude
  text: 'claude: Fixed in f1b3ca1 on agent/DEV-377. A running job for a ticket was already refused. The gap was retries after a job ended: T3 Code had renamed the branch to t3/<topic>, so the next job made a fresh agent/<ticket> from main in a new thread. Now a t3 job (session new, the default) continues the ticket''s last thread when that thread''s worktree still holds work main doesn''t have (unlanded commits or uncommitted changes), and logs why. Once the branch has landed, or the thread or worktree is gone, the next job starts a new thread. Not covered: a thread that was deleted in T3 Code while its branch still exists unmerged. Its branch name isn''t recorded in the job log, so that job starts a new thread as before. Test: dev318_t3_runner_test::a_second_job_continues_the_thread_with_unmerged_work_instead_of_a_new_one (fails before the fix, passes after). docs/help/agent.md updated. Checks: npm run lint, npm test, npm run smoke all pass. Standards: the retry rules (''Health: retry with @fix'', the STD-46 failed-merge retry) don''t need session: continue. A retry now continues the thread whenever unmerged work exists, and with session: continue it would also continue a thread whose work already landed. Separately filed DEV-378: jobs are left without an end when their worker exits (LOCA-118, reported by the LOCA-119 agent).'
- date: 2026-11-12T18:55:34.711235+00:00
  author: claude
  text: 'claude: The LOCA-116 case (reported by the LOCA-119 agent) was the old build. Its merge job ran at 03:46Z on 2026-11-12. The check that counts a rebased branch as landed came with DEV-366 (296c975, 06:00Z), so the worker of that time only knew fast-forwards and failed a merge that had landed rebased as 74a1692. With the current check, git cherry 74a1692 962d54f shows the commit as landed (-), so that merge passes now. The worktree cleanup also handles branches that landed rebased (DEV-343, DEV-366). The duplicate second fix branch is what f1b3ca1 fixes. No new ticket.'
