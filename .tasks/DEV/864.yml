- date: 2026-11-25T17:07:36.562079+00:00
  author: claude
  text: |-
    Done: a finding joins the day's bundle while its fix job runs, and the job gets it as a message (owner's answer "message").

    - `FindingService::open_bundle` (`crates/lotar-lib/src/services/finding_service.rs`) now takes an `InProgress` bundle when a fix job runs on it that can take a message (session runner, not a merge job, not the job filing the report).
    - `lotar add --bundle` tells that job first (`tell_running_job`, the finding's section as its next turn), then adds the finding. Job can't take it: a new bundle, as before, so no job closes a finding it didn't see.
    - `Reviewing` and `Merging` bundles still take none. The merge's `finding_check` already runs on every key.
    - Decision recorded in the description; `docs/help/add.md` Bundles updated.
    - New tests in `crates/lotar-lib/tests/dev800_finding_bundle_test.rs`. The path where the message actually arrives isn't tested end to end (it needs a live agent session); it reuses DEV-384's `tell_running_job`.
