description: |-
  `lotar add --finding <key> --bundle health` (DEV-800) puts a new finding into the day's open bundle only while no agent job holds it. With the shared rules, a health bundle starts its fix agent as soon as it is created, so a bundle will rarely collect more than one finding. STD-299's goal, one health ticket per repo per day, then isn't met for findings agents file.

  ## Cause

  - `.tasks/DEV/automation.yml` "Health: start the fix agent" runs `on: created` for tag `health`. "Health: fix agent lifecycle" sets `InProgress` on `job_started`.
  - `FindingService::open_bundle` (`crates/lotar-lib/src/services/finding_service.rs`) skips a bundle in `InProgress`, `Reviewing` or `Merging`. The next report of the day starts a new bundle, and that one starts its own fix agent.
  - Agents file their findings spread over the day (about 55 in 72 h, STD-299). So only reports that come in while the job waits in the queue are bundled.
  - DEV-800's tests pass because they run without automation rules.

  ## Options (owner decides)

  - A bundle's fix agent starts later, like the flaky list (STD-301): for example the daily `repos.ts --report` run, or a set time after the bundle was created.
  - A new finding reaches the running job: the job gets it as a message, and the merge's `finding_check` runs on every key.
  - Keep one ticket per finding for agent-filed findings, and bundle only the daily run (that is how it works today).

  ## Decision

  - 2026-11-25, owner (via INBOX-715): "A new finding is sent to the running job; the merge check covers every key".

  ## Done when

  - [x] The owner picked one option, and it is recorded here in his words.
  - [ ] Agent findings of one day give about one bundle per repo with the standards rules in place.
