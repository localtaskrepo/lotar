  text: |-
    A health bundle starts its fix agent as soon as it is created, so later findings that day start new bundles. How should agent findings be bundled?

    Options:
    - later: The bundle's fix agent starts later (daily run or a set delay) (recommended)
    - job: New findings reach the running job
    - single: Agent findings stay one ticket each; only the daily run bundles
