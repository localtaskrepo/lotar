  text: 'Owner decision 2026-11-13, on keeping unanswered questions visible when their author or type is hidden: "actually just make that a separate filter option that you can toggle on and off." So: a separate toggle in the Comments filter (e.g. "Always show open questions"), on/off, saved with the other comment-filter choices; not a fixed rule. DEV-502 has no question data, so DEV-488 builds the toggle. Merge order (agreed 2026-11-13, coordinated by the DEV-502 agent): 1) DEV-502 merges first; it waits on nobody (review, then merge). 2) DEV-488 waits for DEV-502 only for its filter part: keep working on the rest, then rebase onto main and add the Type chips and the open-questions toggle. 3) DEV-489 and DEV-490 wait for DEV-488 (existing depends-on), then rebase and add Review / Hand-off to the Type row. 4) DEV-491 waits on nobody; whichever of it and DEV-502 merges second resolves the textual conflict on the comment <li>.'
- date: 2026-11-13T23:20:24.487459+00:00
  author: codex
  text: 'Review: blocking. TaskPanelHistoryTab.vue:127-131 counts only fully removed updates. For one update with status and tags, hiding Status removes changes but leaves hiddenText empty, also hiding Show all (TaskPanelActivityFilter.vue:19). Count hidden changes and retain Show all whenever filtering is active; add mixed-field coverage. Reviewed branch diff, ticket comments/related plans and recent tab history. Focused unit tests passed (3); frontend typecheck passed. Full lint/test/smoke and independent visual review not completed. No files edited or commits made; status and assignee unchanged.'
