description: |-
  The task panel's Comments and History tabs list every entry with no way to narrow them; the only control is the reload button. On a long ticket (DEV-466, STD-82) the owner can't pick out what the agents said or what changed a field. Owner asked on 2026-11-13 whether this exists and said to file it.

  ## Plan

  - Comments tab: toggle chips above the list by author, at least "Hide automation" (DEV-491 already mutes it); by type once question, review and hand-off comments exist (DEV-488, DEV-489, DEV-490).
  - History tab: chips by field (status, assignee, tags, the rest) and by author.
  - The choice is a per-viewer setting kept across tasks, like other panel preferences; the tab says how many entries are hidden and offers "Show all".
  - No data or API change; filtering happens on what the panel already loads.

  ## Done when

  - [ ] Both tabs filter as above in light and dark themes, on phone width too (smoke).
  - [ ] lint, test and smoke pass.
