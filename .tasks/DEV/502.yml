- date: 2026-11-13T23:05:36.846916+00:00
  author: claude
  text: |-
    Done in 5be105ee on agent/DEV-502.

    - Comments tab: once a task has comments by more than one author, an Author row of chips shows or hides each author's comments. Click **automation** to hide automation's comments. The type chips the plan mentions wait for DEV-488/489/490: none of those comment types are on main yet.
    - History tab: chips by field (Status, Assignee, Tags, Other) and by author. An entry shows only its changes to shown fields and drops out when none are left.
    - Both tabs say how many entries are hidden ("2 of 4 comments hidden.") and offer **Show all**. The choice is kept per browser across tasks (lotar.preferences.taskPanel.commentFilter / historyFilter). Filtering works on what the panel already loads; no API or data change. Help: docs/help/serve.md.
    - New: view/components/task-panel/TaskPanelActivityFilter.vue, view/composables/task-panel/useActivityFilter.ts.

    Tests: unit view/__tests__/TaskPanelActivityFilter.spec.ts; smoke smoke/tests/ui.activity-filter.smoke.spec.ts at 390px in light and dark (hide, count, no horizontal scroll, the choice carries over to the next task, Show all).
    Checks: npm run lint ok; npm run test:agent ok (2140 Rust, 1518 UI, release and hooks tests); npm run smoke 392/392.

    Screenshots (before = main, after = this branch, task panel activity section, 390/1440/1920px, light and dark; the 1920px after-shots are identical to the 1440px ones, because the side panel has the same width, so they were stored once):
