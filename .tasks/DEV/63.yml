description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: M3 M4 M5.

  tools/call can reach control-plane methods through recursive dispatch, advertised schemas are not enforced, and domain failures become protocol errors. Use a single tool registry, validate every direct/standard call argument object, and separate malformed envelopes/unknown tools from isError tool execution failures. Acceptance: initialize/tools/list cannot be invoked as tools; unknown fields such as dryrun cannot trigger a live sync; recoverable domain failures have the correct MCP shape. Preserve shipped aliases or document compatibility decisions.

  Related umbrella: DEV-53.
  Prerequisites/coordination: DEV-58, DEV-62.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
