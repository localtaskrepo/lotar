    Research/coordination note (status stays Todo; no implementation started).

    Goals for the eventual fix (audit M3 M4 M5):
    - Safe tool registry: initialize/tools/list and other control-plane methods must not be reachable through recursive tools/call dispatch; one registry governs all dispatch.
    - Enforce advertised schemas on every direct/standard call argument object before side effects; unknown fields such as dryrun must never trigger a live sync.
    - Error classification: separate malformed envelopes/unknown tools (protocol errors) from isError tool-execution failures so recoverable domain failures return the correct MCP shape; preserve shipped aliases or document compatibility decisions.

    Dependency assessment:
    - DEV-62 (lifecycle, High) is now InProgress and is being implemented first; DEV-63 follows and is not started.
    - DEV-58 (REST domain-error to HTTP mapping, Medium, Todo) is being assessed as a genuine dependency for shared error classification; it is NOT automatically started and NOT declared done by this note.
    - Existing dependency links (Prerequisites/coordination: DEV-58, DEV-62) remain in place and were not removed.

    No source changes, no test results claimed. Umbrella: DEV-53.
