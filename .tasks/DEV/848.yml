- date: 2026-11-25T12:22:10.277218+00:00
  author: claude
  text: |-
    Review: passed. `17db87998` does what "Done when" asks; the CLI refuses bad tokens and emails and sends nothing.

    - Read: the diff (`client.rs`, `provider_tests.rs`, `docs/help/sync.md`), the ticket and its timeline, DEV-300, the fix session's prompts, recent main commits to the touched files (nothing since `41c1e63d5` DEV-300 that the fix relies on)
    - `npm ci` passed. `cargo nextest run -p lotar-lib -E 'test(/auth::/)'`: 6 passed. The new test fails without the fix, because `error()` panics on `Ok`
    - `rustfmt --check` and `prettier --check` on the changed files: clean
    - Ran the CLI from the worktree build with an isolated `HOME`, a dummy token and a local fixture that counts requests:
      - `sync check` with a token wrapped inside `"…"`: "a space at character 19", exit 1, 0 requests
      - curly quotes: `U+201C at character 1`, exit 1; a tab in `$LOTAR_JIRA_TOKEN`: "in $LOTAR_JIRA_TOKEN holds a control character", exit 1, nothing sent
      - `push` and `pull` with a zero-width space in the email: refused, exit 1, nothing sent
      - a clean token with `-_+/=` and a padded env value: check OK
    - Both `build_auth_context` callers (`sync_service/mod.rs:193` check, `:290` push/pull) resolve auth before the first request, so the web UI and MCP sync go through the same check
    - Scope: the fix agent added the last three "Done when" items (21:19Z). They follow the ticket's "next safe diagnostic" item and add no setting or policy
    - Not proven: the cause on the owner's machine is still a hypothesis. If the first `lotar sync check` on the live config passes the new check and still returns 401, the cause lies elsewhere and needs a new ticket
    - Note, no ticket: an email with non-ASCII letters (`josé@…`) is now refused too, as "Done when" asks
    - No stray files, no second branch. Tickets filed: none
