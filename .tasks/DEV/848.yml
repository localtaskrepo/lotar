- date: 2026-11-24T21:48:47.412343+00:00
  author: claude
  text: |-
    Likely cause found: the inline token in the file differs from the real one (line wrap, curly quotes or an invisible character). LoTaR now says so instead of sending it and getting a 401.

    - Installed 0.15.6 with an isolated `HOME`, a dummy token and a local fixture: inline and env tokens send the same correct Basic header. Plain, single or double quotes, a trailing comment, CRLF line ends, a BOM and a trailing NBSP all pass, so config loading and the request are fine
    - These give a 401 with the email right and the token changed: curly quotes `“…”` (+2 chars), a zero-width space (+1), and a long token wrapped onto a second line inside `"…"`, where YAML turns the break into a space (+1)
    - Pasting the value from an editor can hide all three, which explains the byte-for-byte match the owner saw
    - Fix in `crates/lotar-lib/src/services/sync_service/client.rs`: `resolve_auth_value` refuses any character outside printable ASCII, for inline and env values alike, and nothing is sent. Example error: `token in the profile holds a space at character 46`. The DEV-300 order is unchanged
    - Regression test in `provider_tests.rs`; `docs/help/sync.md` says to keep the token on one line
    - Not verified against the live config: the job didn't read the owner's `~/.lotar`
  report:
    commits:
    - hash: 17db87998
      what: refuse tokens/emails with spaces, line breaks or non-ASCII before any request; error names the character and position, not the value
