description: |-
  The owner asked on Nov 24 to investigate why installed LoTaR 0.15.6 on macOS returns HTTP 401 for a Jira Cloud scoped token stored inline. The same installed CLI connects when the token comes from the environment. This affects the test site for STD-317.

  ## Reproduction and controls

  - Read-only `lotar sync check` with remote project `KAN` and explicit `--auth-profile jira.default` returned 401 with `LOTAR_JIRA_TOKEN` unset and a quoted inline token in the home profile.
  - With `token_env: LOTAR_JIRA_TOKEN` and the verified scoped token in that environment variable, the installed CLI passed the check for the same project.
  - The owner confirmed one `jira.default` profile. Its redacted settings have `method: basic`, the token owner's email in `email_env`, the Jira site as `base_url`, and the verified Cloud ID in `api_url: https://api.atlassian.com/ex/jira/<cloudId>`. LoTaR's redacted inspection confirmed Basic auth and the expected endpoint.
  - The owner copied the current inline value into a secure prompt. It matched the previously verified token byte for byte, required no YAML quote escaping, and authenticated to Jira project `KAN` directly (HTTP 200).
  - An isolated diagnostic using LoTaR's YAML parser and v0.15.6 request construction preserved the inline value and authenticated to the same Jira project with `LOTAR_JIRA_TOKEN` unset. The installed CLI still returned 401 afterward. The cause remains open.

  ## Done when

  - [ ] Compare the installed CLI's full config loading and sync request path for inline and environment-backed auth. Start with an isolated config, a dummy token, and a local fixture to verify the endpoint and Authorization header without logging its value.
  - [ ] Identify where the live and isolated paths diverge, or document which hypotheses were ruled out and the next safe diagnostic. Start with `crates/lotar-core/src/config/persistence.rs` and `crates/lotar-lib/src/services/sync_service/client.rs`.
  - [ ] If a LoTaR defect is confirmed, add a regression test and verify the fix through the CLI. Record the commands, outcomes, and any verification limits.
  - [ ] Before any request, `lotar sync check`, push and pull refuse a token or email (inline in the profile or from its environment variable) that holds a space, tab, line break, control character or non-ASCII character (curly quotes, zero-width space, non-breaking space inside the value). The error names the profile, the field (token or email), where it came from (the profile or `$VAR`), the kind of character and its position, never the value; the command exits non-zero and sends nothing.
  - [ ] Leading and trailing whitespace stays trimmed as before; valid tokens with `=`, `-`, `_`, `+`, `/` pass unchanged. An environment variable named by the value still wins over the literal (DEV-300 order unchanged).
  - [ ] `docs/help/sync.md` says a token must sit on one line and how to fix the error.

  Keep real credentials out of prompts, tests, logs, fixtures, and ticket comments. Honor the credential-file guard and leave the user's live config alone during isolated diagnostics.
