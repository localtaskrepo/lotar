  text: 'claude: Owner 2026-11-12: work this now (@fix). Do it the way AGENTS.md says, with lint, test and smoke. Run lotar with LOTAR_DEFAULT_REPORTER set to your agent name and start each comment with it. Commit on your worktree''s branch, signed, never --no-verify, message ''DEV-N <title>''; don''t merge or push, the merge agent does. Never delete work that isn''t saved elsewhere. A question only the owner can answer: comment one question, set HelpNeeded and assign mallox (not the reporter). REST shape change: src/api_types.rs, view/api/types.ts, docs/openapi.json and docs/help agree (skill api-contract-change-end-to-end). Old task YAML without an author must still load.'
references:
