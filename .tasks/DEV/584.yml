comments:
- date: 2026-11-16T00:14:23.282323+00:00
  author: claude
  text: |-
    More evidence from DEV-585 (2026-11-15, see DEV-594): T3 Code pauses a turn at the usage limit and resumes it on its own.

    - Job `job-20261115T205914.061Z-57` failed after 4 s: `t3` exited 1, "Thread mcp:c6c8c4b1… stopped with status failed: Claude API rate limit reached".
    - T3 Code had noted "This turn is paused until the 5-hour limit resets in 11m" and sent "Continue where you left off." at 21:10; the thread then worked till 22:07 and committed `1011487e`, outside any lotar job.
    - Meanwhile the @fix-codex retry and a second @fix job ran. DEV-594 now holds back a job while an earlier job's thread is `running`, but during the pause the thread reads `failed`, so the retry still starts then. A t3 job that waits through T3's pause would close that gap.
- date: 2026-11-17T18:18:13.928112+00:00
  author: claude
  text: |-
    Needs your call: the pause this ticket builds on (DEV-604) never landed, so I changed no files.

    - DEV-604 says "this ticket builds the pause and DEV-584 adds the usage-limit reason to it". Its work (`QueuePause`, `agent_job_paused`, `paused` status) is not on `main`: `git merge-base --is-ancestor e4edce9b main` says no, and `grep -i pause crates/lotar-agent/src` finds nothing.
    - The work sits on `agent/DEV-604` (`e4edce9b`) and an unreported rework on `t3/acb65239` (`48d4054e`). Both are based on `804cb0f9` (2026-11-15), still under `crates/lotar-lib/src/services/`, and conflict with main, where that code now lives in `crates/lotar-agent`.
    - DEV-604 reads Done, but its last review (2026-11-16 19:28Z) is blocking: in `lotar serve` a pause can hold jobs forever. The comment after it asks you to reopen DEV-604; nobody has.

    **Question:** how should the pause get built? (a) Reopen DEV-604: port it onto main, fix the review finding, land it; then DEV-584 adds the usage-limit reason and the `job_paused` rule event on top (recommended: one commit per feature, the order DEV-604 set). (b) DEV-584 ports DEV-604's pause onto main itself, fixes the finding, adds the usage limit, and DEV-604 closes into it: one big commit. (c) DEV-584 builds a usage-limit pause on main without DEV-604's code.
  report:
    checks:
    - command: git merge-base --is-ancestor e4edce9b main
      result: failed
      reason: DEV-604's pause isn't on main
    next: Owner picks the order; then the chosen ticket starts
- date: 2026-11-17T18:18:24.794329+00:00
  author: automation
  text: 'Automation rule ''Inbox: file what waits for the owner'' skipped on DEV-584. Skipped its run command: this repository''s automation rules and agent profiles have changed since you last trusted them. Review them with `lotar trust --status`, then run `lotar trust` (or set LOTAR_TRUST_ALL=1 in CI). The rule''s other actions applied.'
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Ae237cd7b-56b1-4808-8d93-a5027ca90283
description: |-
  Step 2 of standards STD-133 (owner 2026-11-15: "Detect usage-limit and quota failures as their own state and pause cleanly instead of looping @fix retries or blaming code bugs; stop asking me the same question repeatedly."). Waits for step 1 (STD-133: no merge without a passed review), in the owner's order.

  ## Found
  - 2026-11-15 05:32Z: Codex's usage limit failed every review and merge in its thread ("You've hit your usage limit. Upgrade to Pro or try again at ..."); each failed merge asked the owner "retry with @fix?" and the retry failed the same way (standards STD-130).
  - lotar's rules see only job_failed, not why: the shared rules (standards configs/lotar/automation.yml) can't tell a usage limit from a crash, so after STD-133 a review that fails on a limit asks the owner once per ticket.

  ## Done when
  - [ ] A job whose agent output or error matches a provider limit (usage limit, quota, rate limit, "try again at <time>") ends as its own outcome (for example `paused` with reason quota, the provider and the reset time when the message names one), not job_failed: no failure rule fires, no fix attempt or retry tag is counted, nobody is asked.
  - [ ] lotar requeues the job on the same profile after the reset time (no time named: a configurable default, for example 1 hour), and the ticket keeps its status and assignee meanwhile; `lotar agent list-jobs` shows it paused with the time.
  - [ ] Which wins: a limit message and a real failure in the same job: the limit (the job didn't get to run). A requeued job that hits the limit again pauses again, with no cap on owner questions because none is asked.
  - [ ] Rules can match the new event (for example `job_paused`), so standards' rules can comment once instead of asking.
  - [ ] Uses harnessmux's typed failures (DEV-683): bump harnessmux to 0.2.0, match `EventBody::TurnFailed { error, .. }` in `agent_job_service.rs`, and read `kind` (rate_limited, quota) and `resets_at` before the text match.
  - [ ] Tests with a fake t3 that prints Codex's message, as in standards `scripts/automation.test.ts` (STD-130).
