- date: 2026-11-18T19:42:35.513807+00:00
  author: claude
  text: |-
    Done: a job that stops on a provider's usage limit now pauses until the reset and runs again on the same profile. It no longer fails.

    - The limit is found in the job's error, last message and events: `crates/lotar-agent/src/services/usage_limit.rs`. It reads Codex's "try again at Nov 20th, 2026 7:43 PM", Claude's "resets 3pm (Europe/Berlin)", RFC 3339 times, epochs and "try again in N minutes".
    - When no time is named the job waits `LOTAR_AGENT_USAGE_LIMIT_WAIT_SECONDS` (default `3600`). A limit wins over a real failure in the same job. A retry that hits the limit again pauses again, with no cap.
    - The job ends as `paused`, so no `job_failed` rule runs and the ticket keeps its status and assignee. The retry waits in the queue (`not_before`) and the queue itself stays open. `lotar agent list-jobs` shows `paused (until <time>)`, and `agent queue` gives the reason.
    - New rule event `job_paused` (alias `pause`): in automation YAML, `simulate`, the web UI's rule editor and `docs/help/automation.md`. The REST shape of a job record is unchanged.
    - Not done: harnessmux's typed failures. 0.2.0 isn't released (crates.io has `0.1.10`), so it moves to DEV-711, which waits on DEV-683.
    - The DEV-617 test used a rate limit as its example failure. A rate limit now pauses, so the test uses a worktree-setup failure instead.
    - The standards rule `configs/lotar/automation.yml` (`not … rate limit|usage limit` on `job_failed`) no longer matters, but it does no harm.
  report:
    commits:
    - hash: e837e05f
      what: the usage-limit pause, the job_paused event, docs and tests (branch t3/usage-limit-pause)
