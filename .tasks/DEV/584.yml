- date: 2026-11-18T21:17:40.972467+00:00
  author: claude
  text: |-
    Review: passed. A job that hits a usage limit now pauses until the reset and asks nobody. An agent that only mentions a rate limit no longer pauses its job.

    - **Reviewed** `fa2b3f679`, the only commit on `main..HEAD`. `t3/usage-limit-pause` has nothing newer.
    - **Last review's blocker is fixed:** `usage_limit_pause` (`agent_job_service.rs:5178`) reads only `runner_errors`, which `EventBody::TurnFailed` fills (`:4449`). New test `an_agent_that_only_talks_about_a_rate_limit_fails` covers it.
    - **Real case:** real logs show the limit inside the runner's `turn.failed` error. Examples: `lotar-95e687-DEV-520-merge.events.jsonl` and `DEV-563-fix-codex` (`t3 exited with exit status: 1: Thread mcp:… stopped with status failed: You’ve hit your usage limit … try again at Nov 21st, 2026 9:36 PM.`). The pattern and the `try again at` reader match that line. Claude's `You've hit your 5-hour limit · resets 6pm (America/Los_Angeles)` (DEV-704) matches through `-hour limit` and `resets`.
    - **Done when, all met:**
      - The job ends `paused` and runs `job_paused` rules, not `job_failed`.
      - The retry goes first in the queue on the same profile, with `not_before`. Without a named time it waits 1 h, or `LOTAR_AGENT_USAGE_LIMIT_WAIT_SECONDS`.
      - `list-jobs` shows `paused (until …)`.
      - A limit wins over other failures. A retry that hits it again pauses again.
      - Tests use a fake t3.
      - Typed failures moved to DEV-711, as the owner decided (INBOX-549).
    - **Contract:** `api_types.rs`, `openapi.json`, `view/utils` and `docs/help` all list `job_paused`.
    - **Reran:**
      - `npm ci`: passed.
      - `cargo nextest run --cargo-profile dev -E 'test(usage_limit) | test(dev584) | test(dev626) | test(dev617) | test(job_error_condition) | test(pause) | test(automation)'`: 197 passed.
      - Not rerun: full `npm test`, `npm run lint` and `npm run smoke`. The fix agent ran them on this same code.
    - **UI:** no screenshots needed. The diff changes only `view/utils` text, no pages, components or styles.
    - **For the merge:** rebasing onto `main` conflicts in `agent_queue_service.rs`. DEV-530 (`77ff5dce8`) moved the entry literal into `queue_entry()`, so `not_before: None` belongs there. It's a mechanical fix.
    - **Filed:** standards STD-246 (Blocked on this ticket). Once this ticket ships, the shared rules should comment once on `job_paused`, and their stale rate-limit comments and conditions go (`configs/lotar/automation.yml:338`, `:516`).
