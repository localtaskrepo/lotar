- date: 2026-11-18T20:09:57.966160+00:00
  author: claude
  text: |-
    Review: blocking. Any failed job whose agent merely *talked* about a rate limit pauses and reruns every hour, with no end.

    Reviewed `e837e05f0` (the only commit on `main..HEAD`; `t3/usage-limit-pause` is the same commit). Reran: `npm ci` (passed), `cargo nextest run --cargo-profile dev -E 'test(usage_limit) | test(dev584) | test(dev617) | test(automation) | test(pause) | test(queue)'` (208 passed), `npm run lint:agent` (passed), `vitest view/utils` (passed). `npm test` and `npm run smoke` in full: not rerun. No UI screenshots: the diff changes only `view/utils`, not pages, components or styles.

    **Blocking**
    - `crates/lotar-agent/src/services/agent_job_service.rs:5146` (`usage_limit_pause`) reads `failure_texts`: the agent's last message and the job's last 10 events. Those events hold the agent's reply parts (`agent_job_message`) and its tool calls (`Tool: <command>`, line ~4367). The pattern in `usage_limit.rs:400` is ordinary English (`rate limit`, `usage limit`, `too many requests`, `try again at`).
      - Failure case: an agent on DEV-711, or any review of this ticket, runs `rg "rate limit"` or writes "the rate limit test fails". The job then fails for a real reason (stall, failed commit, exit 1). It becomes `paused`, waits an hour, runs again in full, and repeats forever. No `job_failed` rule runs and nobody is asked. That is the loop this ticket was meant to end, now silent and with no cap.
      - DEV-604 avoids this with patterns no prose contains (`ENOSPC`, `os error 28`). These patterns don't have that protection.
      - Fix: match only what the runner or provider reports. That means LoTaR's failure note (`t3 exited …: <stderr>`, the command runner's error) and the `TurnFailed { error }` / `Notice` texts. Not agent messages or `Tool:`/`Failed:` lines. Mark those events, or collect them separately, at `agent_job_service.rs:4441`.
      - Add a test: last message "I checked the rate limit code", failing exit, no limit from the runner. The job must fail, not pause.
    - Done-when "Uses harnessmux's typed failures" is not met. The fix agent moved it to [DEV-711](https://lotar.pyxzl.net/task/DEV-711). The owner didn't decide that split.
      - harnessmux `main` already has it (`efc17df` DEV-683, `TurnFailed { error, kind, resets_at, retryable }`). Only the 0.2.0 release is missing; crates.io and `Cargo.toml` are on `0.1.10`.
      - Fix: ask the owner. Either he releases harnessmux 0.2.0 and DEV-584 uses it, or he accepts DEV-711 as the follow-up. Don't guess.

    **For the rework to check (not blocking on its own)**
    - `docs/help/agent.md:184` says T3 Code itself resumes a turn it paused for a usage limit. The thread may then resume at the reset while LoTaR's queued retry waits for it. Since the ticket has a queued entry, the thread isn't taken over (DEV-626), so its outcome isn't recorded and the retry runs the work once more. Confirm or rule this out with a test.

    **Holds**
    - No `job_failed` rule runs and the ticket keeps its status and assignee. The retry goes first on the same profile with `not_before`, and the worker stays alive while it waits (`agent_queue_service.rs:584`). `list-jobs` shows `paused (until …)`. `job_paused` works in YAML, `simulate`, the UI and the docs. The fake-t3 tests cover Codex's and Claude's messages and a pause that repeats.
    - `update_job_failure` now runs `job_paused` rules for DEV-604 queue pauses too. The docs say so; that is fine.
