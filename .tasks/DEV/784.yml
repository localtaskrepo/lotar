description: |-
  Evidence 2026-11-21 (owner asked to speed the queue up; he picked this, 2026-11-21 ~19:00 PST): last 48 h 55 tickets, 189 jobs, 82.5 slot-hours on 3 slots; merge agent 34 jobs, median 34 min, 33 h; flaky-test tickets 27 h (DEV-748..761); load average 17-20 on 14 cores, 36 seen (DEV-755). Three jobs each run lint, the full suite (2,445 Rust, 1,563 UI) and smoke (406) at once; timing tests then time out and become merge-agent jobs and flaky-test tickets. Do: a machine-wide lock (or token) that heavy check runs take: lotar's merge checks, and the repo's test/smoke scripts that fix and review jobs run; editing and agent turns stay parallel. Waiting for the lock shows in the job log. Done when: two jobs' check runs never overlap (test), load during a full queue stays near the core count.

  ## Done when

  The lock: a listening socket on `127.0.0.1:47586`, the port DEV-586's smoke lock used, so the OS frees it when its holder ends or is killed. A run that holds it sets `LOTAR_CHECK_LOCK_HELD=1` for its children.

  - [ ] **lotar's merge** (`agent.merge`, any repository): a round's checks run under the lock, from the first check to the last (`install` runs before, outside it). The checks get `LOTAR_CHECK_LOCK_HELD=1`, so the repo's scripts inside them don't wait for their own merge.
  - [ ] **Waiting shows in the job log**: `Waiting for the machine's check lock (port 47586), held by <holder>` once, then `Took the check lock after <N> min`. A cancelled job stops waiting.
  - [ ] **The repo's scripts**: a full Rust run (`scripts/rust-test-runner.mjs` without a test filter: `npm test`, `npm run test:agent`), a full UI run and a full smoke run (Vitest without file or `-t` filters; the owner's "one full test run at a time", so a targeted smoke run no longer waits as under DEV-586) take the lock; they print the same waiting line on stderr, which the agent's tool output and so the job log show.
  - [ ] **Agents keep working in parallel**: editing, agent turns, lint and targeted runs (a file, a test name, a nextest filter) don't take the lock.
  - [ ] **Which wins**: under `LOTAR_CHECK_LOCK_HELD=1` a run never takes the lock again (no self-deadlock); otherwise every full run waits. A test run's own processes (nextest, Vitest workers) always get `LOTAR_CHECK_LOCK_HELD=1`, also in a targeted run, so tests of lotar's merge never wait for the machine's lock.
  - [ ] **When a step fails**: the port can't be opened for another reason than "in use" (a sandbox forbids listening): the run goes on without the lock and says so. A script waits at most 90 min, then fails naming the holder and `lsof -i :47586`; lotar's merge waits until the holder ends or the job is cancelled. A holder that crashes frees the lock with its process.
  - [ ] **Test**: two holders' runs never overlap (Rust unit test and Node test), and merge checks run with `LOTAR_CHECK_LOCK_HELD=1` (DEV-605 test).
  - [ ] **Docs**: `docs/help/agent.md` (lotar's own merge), `docs/help/config-reference.md`, `smoke/README.md`, testing-strategy skill.
  - [ ] Load during a full queue stays near the core count: checked on the queue after the new build is installed (not testable in CI).
