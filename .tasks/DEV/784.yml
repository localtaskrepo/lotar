    - Tests: Rust and Node no-overlap tests, DEV-605 merge test; by hand a merge waited ~11 s for a Node holder
    - Docs: `docs/help/agent.md`, `config-reference.md`, `smoke/README.md`, testing-strategy skill
    - Guidance: no durable finding
