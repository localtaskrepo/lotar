description: |-
  After the first release that publishes lotar to crates.io, switch the three crates from the stored token to trusted publishing only. The owner decided this on 2026-11-14 in the thread ("Trusted, token once"; details in DEV-507). The steps need his crates.io login, so they are his.

  ## Before you start

  - Check that https://crates.io/crates/lotar, https://crates.io/crates/lotar-lib and https://crates.io/crates/lotar-web-assets exist. If they don't, the release shipped without DEV-507: make this ticket depend on the next release ticket instead.
  - The GitHub environment `release` already exists in localtaskrepo/lotar, limited to `v*` tags (created 2026-11-14, same as harnessmux).

  ## Steps

  - [ ] On crates.io, for **each** of `lotar`, `lotar-lib` and `lotar-web-assets`: Settings → Trusted Publishing → add GitHub: owner `localtaskrepo`, repository `lotar`, workflow `release.yml`, environment `release`.
  - [ ] For each of the three crates, turn on "trusted publishing only", so a token can't publish them any more.
  - [ ] On crates.io, Account Settings → API Tokens: revoke the token used for the first publish.
  - [ ] Delete the repo secrets: `gh secret delete CARGO_REGISTRY_TOKEN -R localtaskrepo/lotar` and `gh secret delete CARGO_REGISTRY_TOKEN -R localtaskrepo/harnessmux` (harnessmux doesn't use its copy).
  - [ ] Hand back to an agent (assign @fix) to remove the token fallback from `publish-crates` in `.github/workflows/release.yml` and the first-release step from docs/release-guide.md.
