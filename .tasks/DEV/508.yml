  text: 'Not due yet: the crates don''t exist on crates.io (lotar, lotar-lib, lotar-web-assets all return 404; latest tag is v0.14.3), so the ''Before you start'' check fails. The first release that publishes them is v0.15.0 (DEV-417), which waits for DEV-497 and DEV-507. DEV-508 now depends on DEV-417 and stays blocked without an assignee until the release has shipped and the three crates exist; it needs the owner only then, for the crates.io steps.'
