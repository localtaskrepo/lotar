description: |-
  Found in the review of DEV-766.

  ## Found

  `docs/help/sse.md:45` shows an `agent_job_tool` payload with `"message": "Run: cargo test"`. The server never writes that. `tool_line` in `crates/lotar-agent/src/services/agent_job_service/tools.rs` writes `<title>` or `<title>: <input>`, with `Failed: ` in front of a failed call. For this example (title and input both `cargo test`) the message is `cargo test`.

  ## Done when

  - [ ] The example's `message` is `cargo test`, and the text says how `message` is built.
