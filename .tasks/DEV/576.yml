- date: 2026-11-15T20:09:24.982832+00:00
  author: claude
  text: |-
    Rework done: the review's finding (the test leaves `.lotar-test-scratch`) is fixed. Only the test changed.

    - Cause, two parts, both in the test: the generic `@work` job matched the test's own "Done: review" rule, which started a second `@review` job. That job either made the job count 2 (failed about 2 in 6 runs) or was still running when the test ended
    - The test also returned once a job was `completed` but before its worker had settled, so the job end still wrote into the dropped fixture (`.tmpXXX/.tasks`, `agent-queue/*.ended`)
    - Fix in `crates/lotar-lib/tests/agent_automation_integration_test.rs`: the rules wait for a tag no test ticket has, so no hand-started job hands on; each run waits for `AgentJobService::job_settled` (as DEV-553's merge test does) and asserts `completed`
    - Before: 3 of 10 focused runs exited 1. After: 12 of 12 exit 0
    - The older DEV-200 test `automation_agent_settings_reach_the_job_they_start` has the same settle race (1 in 8 runs): filed DEV-580
  report:
    commits:
    - hash: 3b7330ef
      what: 'hand assignment uses the matching rule''s agent settings (amended: test no longer leaks or flakes)'
    checks:
