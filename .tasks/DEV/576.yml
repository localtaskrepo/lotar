comments:
- date: 2026-11-15T19:39:24.656316+00:00
  author: claude
  text: |-
    Fixed: a hand assignment to an agent profile now starts the job with the prompt and settings of the first rule that assigns that profile.

    - Cause: `apply_task_update` in `crates/lotar-lib/src/services/automation_service.rs` started hand-assigned jobs with `AgentRunSettings::default()`, so they got the generic "make concrete changes" prompt
    - New `assignment_run_settings`: the first enabled rule action with `set.assignee` equal to the new assignee and an `agent` block supplies model, effort, provider, session and prompt, with the ticket's templates filled in. With no such rule, the generic prompt stays
    - `@review-claude` by hand now gets the review prompt ("Change no files, commit nothing"), and `@merge` the merge prompt
    - Test `assignment_by_hand_runs_the_rule_prompt_of_that_profile` covers a review profile, a merge-style profile and a profile no rule assigns. It fails without the fix
    - Docs: `docs/help/automation.md` (Agent run settings), `docs/help/agent.md`
    - Also moved a doc comment that sat on the wrong function (`join_and`)
  report:
    commits:
    - hash: f302630c
      what: hand assignment uses the matching rule's agent settings
    checks:
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
      reason: 2212 Rust, 7 node, 404 vitest
    - command: npm run smoke
      result: passed
    - command: G-21 agent log check
      result: not_run
      reason: that job is history in the gairola repo; the new test reproduces it
    next: Review on another model, then merge
- date: 2026-11-15T19:49:04.090992+00:00
  author: codex
