  text: 'Outcome: Cargo.toml now has a [lints.clippy] table for all targets (allow_attributes_without_reason, dbg_macro, todo = warn; -D warnings in CI/pre-push makes them blocking); needless_pass_by_value stays library-only in src/lib.rs because enabling it package-wide flagged 25 owned-value test helpers (stale comment there replaced). All src #[allow]s were converted to #[expect(..., reason = ...)]: 26 were already stale under default, --all-features and --no-default-features and were removed (incl. 15 dead_code on items that are used/public, and workspace::is_current_directory which was genuinely dead and is deleted); the remaining 36 carry specific reasons (CLI-flag adapters, shared sync options, owned temporaries, explicit validator borrow ends). tests/common (and env_mutex, also included by lib tests via #[path]) replace 23 per-item dead_code allows with one reasoned module-level allow; a stale allow on an underscore field in cli_noop_mutations_test was dropped. rustfmt.toml edition 2021 -> 2024 to match Cargo.toml (cargo fmt already formatted in 2024 style; standalone rustfmt in editors now agrees; pinning style_edition 2021 would have reformatted 611 hunks). Evidence: clippy --all-targets --all-features clean; a probe #[allow(dead_code)] without reason is reported; cargo fmt --check clean; test:rust:agent 1668/1668. Guidance: no durable finding.'
description: 'Cargo.toml has no [lints] table (one crate-level clippy attribute) and src has 63 #[allow]s (21 dead_code) that never report when stale. Move lint levels into Cargo.toml [lints], convert allows to #[expect(..., reason = ...)] or remove them when unneeded, and fix rustfmt.toml edition = 2021 vs crate edition 2024. Keep clippy warning-free and formatting stable.'
