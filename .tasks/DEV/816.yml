  text: |-
    Patch releases now ship without the owner's OK; minor and major ones still ask him.

    - `.github/skills/release/SKILL.md` step 4: patch tags and pushes without asking, quoting his 2026-11-22 words; minor/major ask first (HelpNeeded when he can't be asked directly). Step 2 now says "minor or major".
    - `docs/release-guide.md` Pre-Release Checklist step 1: patch by default, ships without asking; minor/major only when he asks for or approves it.
    - Grep found no other text saying every release needs his OK. Step 1's "ask the owner whether to wait" for a fix not on main is a different question and stays.
    - Anchors and links unchanged. "## Done when" added to the ticket with checkboxes.
