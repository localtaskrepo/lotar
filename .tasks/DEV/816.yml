description: |-
  Owner 2026-11-22 (chief of staff thread): "Let's change the rule for releasing. Only minor changes need my okay. Patch level updates can always be done". Scope (picker): every repo; a major release asks him too. Shared rule: standards global/AGENTS.md ("publishing but patch releases"), docs/decisions/2026-11-22-releases.md (STD-311).

  ## Done when
  - [ ] `.github/skills/release/SKILL.md` step 4: a patch release (only Z of vX.Y.Z changes) is tagged, pushed and released without asking; a minor or major one asks him first (HelpNeeded on the release ticket when he can't be asked directly), quoting his words.
  - [ ] Step 2 and `docs/release-guide.md` (Pre-Release Checklist, step 1): the bump is a patch by default; a minor or major only when he asks for or approves it. When both could apply (he asked for a minor, the ticket title says patch), his request wins.
  - [ ] A failed step (QA red, tag push refused, Release job fails twice) stops the release and is reported on the release ticket, as before; no tag is pushed before QA is green.
  - [ ] No other text in AGENTS.md, docs/ or .github/ says every release needs his OK (`grep -rniE "release|tag" ... | grep -iE "owner|OK"`).
