- date: 2026-11-23T08:21:55.354569+00:00
  author: claude
  text: |-
    Review: passed. Patch releases ship without asking him, and minor or major releases still ask him first. This matches his 2026-11-22 words and STD-311.

    - Read: commit `1fd17d58c` (it changes only `.github/skills/release/SKILL.md` and `docs/release-guide.md`), the ticket's "Done when" list, DEV-804, DEV-817 (WontDo), standards `docs/decisions/2026-11-22-releases.md`, and the recent commits on main to both files. Nothing on main conflicts with the change.
    - Done when 1: step 4 tags and pushes a patch without asking and quotes his words. A minor or major release asks him first, with HelpNeeded when he can't be asked directly.
    - Done when 2: step 2 and the guide's checklist step 1 make the bump a patch by default, and a minor or major only when he asks for or approves it. The release ticket is always titled as a patch (step 8), so "patch unless the owner asks" already means his request wins over the title.
    - Done when 3: the steps for failures did not change. Step 3 still requires QA green before the tag, checklist step 4 still says the same, and step 5 still re-runs a failed job once and reports it if it fails again.
    - Done when 4: `grep -rniE "release|tag" AGENTS.md docs .github | grep -iE "owner|OK"` and a search for "owner's OK" found no other text saying every release needs his OK.
    - Reran: `npm ci` passed. `npx prettier --check` on both files passed. The anchors and links did not change. Lint, test and smoke were not rerun because the change is docs only (AGENTS.md).
    - Minor finding, filed as [DEV-831](https://lotar.pyxzl.net/task/DEV-831): when he has already asked for a minor release, step 4 still makes the agent ask him again.
