    - **Read:** the diff (`branch_keeping`, new `logged_branches`, `follow_ticket_work`, `move_ticket_branch` in `crates/lotar-agent/src/services/agent_job_service.rs`), the two new tests in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`, DEV-687 and its review, the owner's answer (INBOX-519), and the last 5 commits on `main` to both files.
    - **Done when:** a test covers the `follow_ticket_work` path, and the owner decided (outside-only). The code matches that decision; `move_ticket_branch` gets the same rule, and that is the same decision.
    - **Test fails before the fix:** with `main`'s `agent_job_service.rs`, `the_tickets_branch_stays_at_its_fix_that_only_its_own_thread_branch_also_has` fails; with the patch it passes. The backup test passes on both, which is expected.
    - **Base:** DEV-687 is on `main` now (`3cbe25d9b`). `git rebase main` drops `7303f1e1b` as already upstream and leaves one clean commit, so the merge can go ahead.
    - **Reran** on `main` plus the patch, in a scratch worktree (removed afterwards): `npm ci`, a workspace build, the dev503 tests, lint, and the agent tests. This worktree is unchanged.
    - No blocking or minor findings; no tickets filed.
