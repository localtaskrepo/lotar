- date: 2026-11-18T02:54:04.888798+00:00
  author: claude
  text: |-
    Test added; one decision is yours before this is Done.

    - New test `the_tickets_branch_follows_newer_work_when_an_older_thread_branch_keeps_its_fix` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: `agent/TEST-1` sits at `t3/topic-0`'s fix, newer `t3/topic-1` has TEST-1 work not built on it. Today the next job moves `agent/TEST-1` to `t3/topic-1` and notes "Its commits that t3/topic-1 lacks stay on t3/topic-0."
    - It fails with DEV-687's `branch_keeping` check in `follow_ticket_work` removed (the DEV-602 guard then keeps the branch at the fix).
    - Built on DEV-687's `7303f1e1b` (not on main yet, Merging): merge DEV-687 first.
    - So the fix on `t3/topic-0` drops out of the review and merge; it isn't lost, only left on the old branch.

    **Question:** should an older `t3/` branch of the same ticket count as keeping the ticket's work (keep today's behaviour, the test stays), or should only branches outside the ticket's own thread branches (like `backup/...`) count, so `agent/TEST-1` stays at the fix as DEV-602 had it?
