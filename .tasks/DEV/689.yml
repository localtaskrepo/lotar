  text: |-
    Done as decided: only branches outside the ticket's own thread branches count as keeping its work.

    - `branch_keeping` (`crates/lotar-agent/src/services/agent_job_service.rs`) now skips the ticket branch and every branch a job of the ticket logged as its worktree branch; applies in `follow_ticket_work` and `move_ticket_branch`. New helper `logged_branches`, also used by `unlanded_ticket_branch`.
    - Tests in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: with only `t3/topic-0` holding the fix, `agent/TEST-1` stays at it and the review starts from it (fails on the previous code); with `backup/TEST-1-fix` it moves to the newer work and the note names the backup.
    - Amended my earlier commit into `d9d678448` (unpushed). Still built on DEV-687's `7303f1e1b`: merge DEV-687 first.
