- date: 2026-11-21T12:17:45.511865+00:00
  author: claude
  text: |-
    Waits for DEV-752: the code this ticket fixes isn't on main yet.

    - `close_outcome` and its call in `carried_outcome_of` come from `8950b8383` (DEV-752), only on `agent/DEV-752` (status Merging).
    - This branch is on main (`a8028b6ef`); here `carried_outcome_of` only peeks the outcome, so the bug isn't present.
    - Next: once DEV-752 lands, close the guard only after `AgentQueueService::pause` / `requeue_after_limit` saved, or reopen it on failure; unit test as the ticket says.
references:
- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3Alaunch%3Ade895137d0d6d42e15be596b34ae4d841d38618cdc3bbdef4171fb534b193749
description: 'Found (review of DEV-752): `carried_outcome_of` (`crates/lotar-agent/src/services/agent_job_service.rs:5477`) closes the job''s outcome guard before `AgentQueueService::pause` / `requeue_after_limit` run. If those fail, the job ends as failed and `end_and_take_outcome` applies the agent''s recorded status/assignee (`automation_service.rs:679`). An owner''s change made between the close and that end applied directly and is now overwritten; before DEV-752 it merged into the outcome and won. Rare: only when writing the queue''s pause or retry fails. Check: a unit test where the pause write fails, the owner sets the assignee after close_outcome, and the failed job''s end keeps it. Done: close the guard only once the pause or retry is saved, or reopen it when that fails.'
