  author: claude
  text: |-
    Waits for DEV-752: the code this ticket fixes isn't on main yet.

    - `close_outcome` and its call in `carried_outcome_of` come from `8950b8383` (DEV-752), only on `agent/DEV-752` (status Merging).
    - This branch is on main (`a8028b6ef`); here `carried_outcome_of` only peeks the outcome, so the bug isn't present.
    - Next: once DEV-752 lands, close the guard only after `AgentQueueService::pause` / `requeue_after_limit` saved, or reopen it on failure; unit test as the ticket says.
- date: 2026-11-21T20:36:27.873869+00:00
  author: claude
  text: |-
    Fixed: a failed pause or retry no longer overwrites the owner's change.

    - Rebased `agent/DEV-756` onto main (DEV-752 `32891539f` is in).
    - `carried_outcome_of` is now `save_retry` (`agent_job_service.rs`): it reads the ticket, closes the guard, saves; when the save fails it calls the new `reopen_outcome` (`agent_active_jobs.rs`), which drops recorded fields the ticket changed in since the close.
    - Covers all three callers: disk/signing pause, usage-limit requeue, new-session requeue.
    - New test `an_owners_change_while_the_pause_fails_outlasts_the_failed_jobs_end`: the ticket's check. It failed with the reopen disabled (end kept assignee `claude`).
