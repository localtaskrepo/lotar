- link: https://app.t3.codes/threads/d834978d-9e75-43fb-ba01-45747238fc44/mcp%3A44cef934-b359-4836-8412-5bb359c86114
description: |-
  A t3 job with session: new continues the ticket's last thread when its worktree holds unmerged work (DEV-377), unless its provider or model differs; then it starts a new thread on that branch (DEV-408). A reviewer needs a fresh context on the author's branch even on the same provider and model. Found while wiring in the review stage in standards (STD-59, owner 2026-11-12: "Yes, I agree with your recommendations"): @fix-light runs on claude-sonnet-5-5 and its reviewer @review-light on the same cheap model, so with DEV-408 alone the review would run as a further turn of the author's thread and check its own work. A ticket whose fields set the fix agent's provider to the reviewer's has the same problem.

  ## Evidence
  - src/services/agent_job_service.rs thread_with_open_work (around line 1366) and runs_other_model (around line 1408): a new thread on the branch only when the provider or model differs.
  - docs/help/agent.md, Continuing the ticket's last thread.

  ## Done when
  - [ ] A setting on a profile and on a rule's agent settings (for example session: fresh) starts a new thread on the ticket's open branch whatever its provider and model, freeing the branch as DEV-408 does, and its prompt names the earlier thread
  - [ ] session: new keeps today's behaviour
  - [ ] Docs (docs/help/agent.md, automation.md) and tests
