  author: claude
  text: 'Done in f646cb08 on agent/DEV-414. New session value `fresh` (AgentSession::Fresh) for profiles, a rule''s agent settings, `lotar agent run --session fresh` and POST /api/jobs: when the ticket''s last t3 thread has unmerged work, the job starts a new thread on that branch whatever its provider and model, frees the branch as DEV-408 does, and its prompt names the earlier thread; log: ''... and the job asks for a fresh thread (session: fresh); this job starts a new thread on <branch>.'' Without unmerged work it behaves like `new`; `new` is unchanged. If git can''t free the branch it continues the earlier thread and logs why, as DEV-408 does. Docs: agent.md, automation.md, openapi.json, view/api/types.ts. Test: a_fresh_session_starts_a_new_thread_on_the_unmerged_branch_on_the_same_model (rule-driven reviewer on the same model; also checks that session: new still continues). Checks: lint:agent, test:agent (2126 Rust, 1507 UI, release, hooks) and test:smoke:agent (385) all passed.'
