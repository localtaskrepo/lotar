comments:
- date: 2026-11-21T04:52:00.573265+00:00
  author: claude
  text: |-
    The test's waits no longer time out on a 15 s budget; they only guard against a hang.

    - Standalone the test takes 1.3 s; at load 30 it took 45.9 s, so 15 s was a budget, not a hang guard
    - `wait_until` in `crates/lotar-lib/tests/agent_safety_test.rs` now gives up after 120 s (comment says why), for all the suite's waits
    - The wait for the branch deletion also stops when Done finishes, then asserts the deletion started, so a regression fails fast
    - The registry check's `recv_timeout` went from 5 s to 60 s: a free registry answers at once, a held one blocks until `release`
    - Not changed: `wait_worker`'s 15 s in the same file; same kind of risk, no failure seen yet
  report:
    commits:
    - hash: 2eff5a160
      what: safety-suite waits use a 120 s hang guard, not a 15 s budget
    checks:
    - command: npm run -s test:rust:agent -- --no-fail-fast
      result: passed
      reason: 2437/2437 at load avg 13-20 (not 30)
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: passed
    next: Review, then merge; rerun the check at full-suite load
- date: 2026-11-21T10:40:21.266862+00:00
  author: claude
  text: |-
    Review: passed. The fix does what the ticket asks; nothing blocking, no minor tickets filed.

    - Reviewed `2eff5a160` (the only commit in `main..HEAD`; the ticket branch has no newer commits). It changes one file: `crates/lotar-lib/tests/agent_safety_test.rs`
    - `wait_until` (line 58): the deadline went from 15 s to 120 s. That is now only a hang guard, which is what "Done when" asks. The only other wait in this test is `wait_idle`, which goes through `wait_until`, so the test has no fixed 15 s wall-clock deadline left
    - Line 1176: the wait also stops when the Done thread finishes, and line 1177 then asserts that `removing` exists. A regression where Done skips `branch -D` now fails at once instead of hanging until the limit. Correct
    - Line 1181: `recv_timeout` went from 5 s to 60 s. That holds up: `release` is written only after the receive, so a held registry still blocks the full 60 s and fails `stats.is_ok()`. The check still catches the DEV-647 regression
    - `wait_worker` (line 99) still has 15 s, but this test doesn't use it. Out of scope, and the fix agent says so
    - Main changed nothing in this file after the branch point (`git log -5 main -- <file>`, `git diff HEAD main`)
    - Not reproduced at load 30. Like the fix agent's runs, mine ran at load ~17–22
    - Reran: `npm ci` ok; `npm run -s test:rust:agent -- --no-fail-fast` 2437/2437 passed (497 s); `rustfmt --edition 2024 --check` on the file ok. The tree is clean afterwards
    - Not rerun: full `npm run lint`, `npm test`, `npm run smoke` (the fix agent reports them passed; the change is test-only)
