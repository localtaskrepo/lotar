- date: 2026-11-13T23:03:54.677004+00:00
  author: claude
  text: 'Owner decision 2026-11-13 (on DEV-492), asked whether automations should still be able to start T3 Code threads after the switch: "Yes, as a harnessmux agent". Add to this ticket''s scope: a t3 agent in harnessmux, driven through T3''s CLI as a legacy adapter like amp (start a thread with provider, model and worktree; follow it; send messages; continue a thread), behind the same session interface, with what T3''s CLI can''t do (effort, child threads) reported in capabilities. lotar then keeps no T3 code; runner: t3 in a profile picks this agent. Also update the Design answers in lotar''s docs/developers/harness-tool-design.md (T3 is no longer "the tool doesn''t drive T3") once DEV-492 is merged.'
- date: 2026-11-13T23:11:50.027428+00:00
  author: claude
  text: 'Owner decision 2026-11-13 (on DEV-492), on grouping chats under their projects: "harnessmux only". Add to scope: every session records its project (the repo it belongs to, from git''s common dir, also when cwd is a worktree) next to its cwd; list and attach filter by project; the t3 agent starts threads in that T3 project; the event stream carries it so lotar''s UI can group by it. Claude and Codex get no project of their own: Claude files a session by its cwd (a worktree is its own project; docs: code.claude.com/docs/en/sessions.md), and Codex''s app keeps project assignments in its own state with no public app-server request to set one (codex-cli 0.169). No upstream requests (his choice).'
- date: 2026-11-14T00:07:13.062402+00:00
  author: claude
  text: |-
    Done except the crates.io publish (question below).

    Built: https://github.com/localtaskrepo/harnessmux (public, MIT, README, LICENSE, AGENTS.md, CHANGELOG). Commits on its main: da4e176 (first version), 768420c, 8daffc1 and c143d0d (fixes CI found on Windows; v0.1.0 is c143d0d). CI is green on Linux, macOS and Windows (fmt, clippy -D warnings, cargo deny, nextest). Release v0.1.0 is out on GitHub Releases: binaries for Linux musl x64/arm64, macOS arm64/x64, Windows x64/arm64, with SHA256SUMS; the macOS arm64 binary was downloaded, checked and run. `cargo publish --dry-run` passes. lotar: this branch has 24fea9c6, the design doc updated with the two later decisions (t3 agent, projects); Prettier checked, no code change in lotar.

    What it does: named sessions with a registry and a versioned JSONL event log (v1; every event carries session, project, seq, turn, raw); the owner (a linking process, or `harnessmux serve` started in the background by the CLI) holds the ACP connection and serves a Unix socket or Windows named pipe for send, cancel, answer, set, status, close; idle TTL 30 min, then the next send resumes (session/resume, else session/load); model, effort (low…max) and permissions (read-only, workspace, full) mapped from agents.toml, read at run time and overridable per user; a permission policy (deny, allow-reads, allow, ask + `answer`); MCP servers per session; `capabilities`; `harnessmux mcp` (start, send, wait, cancel, status, list, close for child sessions); `run --record` and `replay` for recorded sessions; project per session from git's common dir (a worktree belongs to its repo), `list --project` and `attach --project`. Pinned adapters are installed with npm into harnessmux's data dir on first use. The agent-client-protocol crate is 5.2.0 (with its `unstable_end_turn_token_usage` feature for token counts in turn.finished).

    Ran live on 2026-11-13 (owner's Mac, his sign-ins, scratch HARNESSMUX_HOME):
    - claude (claude-agent-acp 0.107.0): capabilities (resume, load, list, close; options mode, model, effort, fast, ultracode, agent); two turns that remember; model, effort and mode applied; owner killed with -9 and the adapter killed, then `send` resumed through session/resume and still remembered; cancel during a long turn ended `cancelled`, exit 2; a model it doesn't list is refused with its list.
    - codex (codex-acp 2.6.0): capabilities (resume, load; reasoning_effort low…max and ultra, mode read-only/workspace-write/agent/agent-full-access); two turns; effort applied.
    - copilot (1.0.111, `--acp --stdio`): capabilities (load, no resume; modes are URLs; model only `auto`); one turn with `--model auto`. Without it the account's default model failed and Copilot sent the error as an ordinary reply ("Error: Execution failed: Model gpt-5.4 is not available"); harnessmux now reports that as turn.failed, exit 1.
    - t3 (T3 Code 0.1.9): a thread "DEV-504 harnessmux t3 live check" started in lotar's T3 project with --provider claudeAgent --model claude-haiku-5-5, and a second turn in it. That thread is still in T3.
    - Not run live, set up from their docs: gemini, cursor, droid, opencode, kilo, antigravity, amp. Not tried live either: a permission request (Claude's own settings allowed the command, so none came; covered by a recorded test), MCP servers passed to a real agent, interactive attach, `harnessmux mcp` against a real agent.

    Found on the way: a user table entry that set `command` kept the built-in pinned adapter, so a "replay" test ran the real Claude; a user command now replaces the adapter. On Windows the background owner inherited the CLI's stdout/stderr, so anyone reading `harnessmux run` output waited 30 minutes; fixed. `interprocess` pulled in 0BSD crates that deny.toml doesn't allow; replaced by tokio's sockets and pipes instead of adding a license.

    What DEV-503 (the lotar switch) needs:
    1. The dependency: `harnessmux = "0.1"` once it is on crates.io (question below). A git dependency would need an allow-git entry in lotar's deny.toml.
    2. Profile conversion AgentProfileDetail -> harnessmux::Profile: model, effort (lotar's free string becomes Effort; anything else is an error), permissions, mcp (lotar's own `lotar mcp` as a stdio server), writable dirs -> add_dirs, env; for t3 provider, worktree base, branch, title. No ACP equivalent: max_budget_usd, tools.allowed/disallowed, a profile's own `args`/`command` for ACP agents (those go into an agents.toml override).
    3. Jobs: Session::start (name = ticket id, so `session: continue` is Session::open/resume of that name), Session::events() -> job events (message, tool.started, usage, turn.finished -> AgentJobUsage, turn.failed), cancel, send for the message box, answer for permission requests shown as questions. Choose the job permission policy (allow for workspace/full is the default).
    4. Restarts: lotar's sessions die with its process; on start, resume the sessions of running jobs (Session::resume). Pass idle_ttl None while a job holds the session.
    5. Remove the per-CLI runners, stream parsers, fixtures and the t3 runner; `runner: t3` becomes the t3 agent. T3's CLI can't cancel a thread (harnessmux stops waiting, the thread keeps running) and has no effort or child threads.
    6. lotar's sessions live in the same state dir as the CLI's, so `harnessmux list/attach/send` reach them.

    Not done: adding harnessmux to standards repos.json (another repo; the daily repo-health check covers public repos listed there).
- date: 2026-11-14T00:07:25.575604+00:00
  author: claude
  text: 'Question for mallox: the last step of "Done when" is the crate on crates.io, and only you can make the crates.io token (no token exists in opgate; lotar is not on crates.io either). Publishing is permanent: a version can be yanked but never removed. Which way? (a, recommended) You create an API token on crates.io (Account settings > API tokens, scopes publish-new and publish-update, crate harnessmux) and put it in the Agents vault as an opgate entry "crates-io"; an agent then runs `cargo publish` for 0.1.0 through opgate and sets up crates.io Trusted Publishing, so later releases publish from release.yml without a token. (b) You run `cargo login` and `cargo publish` yourself in ~/Development/@localtaskrepo/harnessmux. (c) No crates.io for now: lotar (DEV-503) depends on the git tag v0.1.0, which needs an allow-git entry in lotar''s deny.toml.'
