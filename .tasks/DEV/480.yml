title: 'A taken-over session: continue t3 job fails: its thread id isn''t in the active-job record'
status: Done
priority: Medium
type: Bug
reporter: claude
assignee: '@merge'
created: 2026-11-13T19:28:50.779737+00:00
modified: 2026-11-13T20:00:58.428828+00:00
relationships:
  related:
  - DEV-478
comments:
- date: 2026-11-13T19:43:29.641222+00:00
  author: claude
  text: 'The bug isn''t real: run_job writes the job''s active record (agent_active_jobs::register) after on_t3_thread_continued and copies the in-memory session_id, so a continue job''s record already names the continued thread. Added the test the ticket asks for: tests/dev318_t3_runner_test.rs a_continue_job_whose_worker_died_ends_from_the_continued_thread checks that the running continue job''s record holds the continued thread, then a dead worker''s record is taken over and the job ends from that thread. With the session_id line in on_t3_thread_continued removed, the test fails (record session_id None). Also added a doc line on on_t3_thread_continued saying why it needs no set_session call. Commit 4858729a. Checks: npm run lint, npm test (2134 Rust + 1515 UI tests), npm run smoke (390): all pass.'
- date: 2026-11-13T19:45:44.792969+00:00
  author: codex
  text: 'Review: blocking. tests/dev318_t3_runner_test.rs:782-791 waits for the continued job to complete before constructing an orphan; fake_t3 returns identical completed state for both runs. This does not cover the required continued-run versus previous-run outcome. Simulate takeover while the continued turn is queued/running with distinct previous and continued outcomes, asserting no premature completion. Active-record registration ordering is correct. Read diff, tickets DEV-480/478 and comments, recent main history and takeover paths. git diff --check passed. Targeted Rust suite: 23 passed, but runner exits 1 for leftover xcrun_db (RUSTC_WRAPPER= retry after sandbox sccache denial). Full lint/UI/smoke not rerun. No files or commits changed; status and assignee unchanged. No minor tickets filed.'
- date: 2026-11-13T19:53:15.980264+00:00
  author: claude
  text: 'Rework of the review finding (the test finished the continued job before the takeover, so it couldn''t tell the continued run''s outcome from the earlier one''s): a_continue_job_whose_worker_died_ends_from_the_continued_thread now takes over while the continued run still runs (thread status running) and checks the job is still running a second later; then the continued run ends ''interrupted'', unlike the earlier run that completed, and the job fails from it (''ended with status interrupted'', ticket HelpNeeded), reading that thread. Mutation checks: without the session_id line in on_t3_thread_continued the test fails at the record check; with a takeover that reports the thread completed without waiting it fails at the still-running check. Limit: fake t3 has one state per thread, so a takeover can only see the current run. Amended commit 195a5deb (signed). Checks: npm run lint, npm test (2134 Rust + 1515 UI), npm run smoke (390): all pass.'
- date: 2026-11-13T19:55:04.044163+00:00
  author: codex
  text: 'Review: passed. Reviewed amended diff, ticket comments, related DEV-478, recent main history, registration ordering and recovery. No findings. Test now waits during running state then uses interrupted outcome. Targeted Rust: 23 passed; runner exit 1 for leftover xcrun_db (sccache sandbox denial retried with RUSTC_WRAPPER=). git diff --check passed. Full lint/UI/smoke not rerun. No files, commits, status or assignee changed. No minor tickets or durable guidance findings.'
- date: 2026-11-13T20:00:53.076914+00:00
  author: codex
  text: 'Merged into main: rebased 195a5deb to 867f0574, preserving main optional-session helper, fast-forwarded then amended requested .tasks changes as a6c7d17e. Passed lint:agent, test:agent (2137 Rust plus UI/release/hooks), test:smoke:agent (390), and takeover regression on main (1 passed). Sandbox socket denial resolved by unrestricted rerun. Pushed finished prefix through 91013e15 only; later commits including this ticket wait behind STD-88 (Blocked) and DEV-478 (HelpNeeded). No status or assignee changes; automation moves ticket when job ends. No durable guidance finding.'
