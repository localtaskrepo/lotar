description: 'Found while doing DEV-478: on_t3_thread_continued (src/services/agent_job_service.rs) sets the job''s session_id in memory but never calls agent_active_jobs::set_session, so a process that takes the job over has no thread id. The DEV-478 lookup can''t help, because it only finds threads created after the job started. Check: a continue job whose worker dies ends from the continued thread''s state, not from the run before it. Done when a test covers this takeover.'
