comments:
- date: 2026-09-06T11:21:52.641675+00:00
  text: 'Backlog reconciliation: Remains Todo: MarkdownContent currently renders sanitized GFM without task-ID transformation or hover-card binding. Existing general task hover components do not fulfill markdown references. Remaining acceptance: recognize task references while preserving code blocks/ordinary links and sanitization, then attach the shared hover UI.'
- date: 2026-09-06T13:12:53.821924+00:00
  text: |-
    Checklist migration: preserved the original wording below; implementation status is unchanged.
    Former TODO.md line 7: Support references to other tickets in the description when rendering markdown (e.g. "See TASK-1234 for more info" becomes a link with hover card).
- date: 2026-10-29T18:24:32.836305+00:00
  text: Since we don't have a way to choose a view filter for the hover card, use all available details to render the card, but reuse existing elements and don't create a new one.
- date: 2026-10-29T18:29:24.093205+00:00
  text: 'Plan: view/utils/markdown.ts links task IDs after DOMPurify (text nodes only, skipping a/code/pre; only prefixes of existing projects, so UTF-8/SHA-256 stay text). MarkdownContent fetches the task on hover/focus (15s shared cache) and shows the existing TaskHoverCard/TaskHoverCardBody, using a new anchor mode for triggers it can''t wrap, with all fields including every custom field. Click opens the task through navigateTask; modifier clicks open /task/<id>; presses don''t start description editing. Applies to descriptions, comments and agent job text. Checks: unit tests for linking and hover, smoke for hover + click in the task panel, lint/test/smoke.'
- date: 2026-10-29T19:07:18.660891+00:00
  text: |-
    Outcome: task IDs in descriptions, comments and agent messages render as links (only prefixes of existing projects; code, code blocks and existing links untouched; linking runs after DOMPurify on text nodes only). Hover/focus shows the existing TaskHoverCard/TaskHoverCardBody via a new anchor mode, with every field including all custom fields; click opens the task via navigateTask, modifier clicks open /task/<id>; presses on a reference no longer start description editing. Docs: docs/help/serve.md (Task references).
    Evidence: view/__tests__/markdownTaskReferences.spec.ts and MarkdownContent.spec.ts (new cases); UI suite 1382 passed; new smoke smoke/tests/ui.task-references.smoke.spec.ts; full smoke 363 passed after fixing ui.sprints smoke, which clicked the first panel header button and hit DEV-4's new Archive button instead of Close; lint clean. Rust unchanged since the last full nextest pass, so not rerun.
    Remaining: none. Hover is mouse/keyboard only; on touch a tap opens the task.
    Guidance: no durable finding.
