- date: 2026-11-22T05:51:11.110659+00:00
  author: claude
  text: |-
    Leftover DEV-754 folder removed, and worktree setup now clears such a folder itself.

    - Cause: `.lotar-worktrees/lotar/DEV-754` held only `target/nextest/default/junit.xml` (written 2026-11-21 12:20 by a 567 s nextest run): the worktree was removed while the test run was still going.
    - Removed the folder (`lsof` showed nothing using it); `git worktree add` at that path now works (added and removed again).
    - `prepare_worktree` (`crates/lotar-agent/src/services/agent_job_service.rs`): a ticket folder with no worktree that holds only `target/` is removed before `git worktree add`. The job log says `Removed the leftover folder <path> (only target/, no worktree).` A folder with anything else in it stays, and the job fails as before.
    - Test `a_leftover_folder_with_only_build_output_gives_way_to_the_worktree` (`crates/lotar-lib/tests/agent_safety_test.rs`) fails without the fix; `docs/help/agent.md` describes the new behaviour.
  report:
