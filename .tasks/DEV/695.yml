  author: claude
  text: |-
    Added the end-to-end test: a job whose ticket goes Done mid-run ends `cancelled`, with both notes in its log.

    - New test `a_job_whose_ticket_goes_done_mid_run_ends_cancelled` in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs`: the fake agent holds its prompt, the test sets TEST-1 Done, and the job ends `cancelled`. Both notes are in its log and the agent got `session/cancel`. It runs in about 1s.
    - `watch.rs`: `LOTAR_TEST_MOVED_ON_GRACE_MS` replaces the 120s grace. While the grace is shorter than 5s, the job also checks the ticket that often. If the variable is unset or not a number, the 120s grace stays.
    - Docs: the variable is listed with the other test variables in `docs/developers/environment.md` and `docs/help/environment.md`.
    - Built on `agent/DEV-682` (`bdbffc029`, still Merging), because that code isn't on main yet. Merge DEV-682 first; after that, the rebase onto main keeps only `f6be0c9f5`.
