description: |-
  DEV-682's reconcile is tested only at the watch: `a_job_whose_ticket_moved_on_is_cancelled_after_the_grace` (`crates/lotar-agent/src/services/agent_job_service/watch.rs`) checks that `JobWatch::check_at` returns `MovedOn` and logs the notes. Nothing runs a job and sees it end as cancelled with `job_cancelled` rules, through `drive_turns` or `run_command` (`agent_job_service.rs`).

  Builds on DEV-682 (`agent/DEV-682`, not on main yet).

  ## Done when
  - [ ] a harness test in `crates/lotar-lib/tests/dev503_harness_jobs_test.rs` sets the ticket Done while a held fake agent runs, and the job ends `cancelled` with both notes ("went Done while the job ran; LoTaR cancels…" and "…LoTaR cancelled the job.") in its log, and the agent got `session/cancel`
  - [ ] the 120s grace (`MOVED_ON_GRACE`) can be shortened for that test with `LOTAR_TEST_MOVED_ON_GRACE_MS` (milliseconds), so it finishes in seconds; the ticket is then also looked at every that-many ms when that is shorter than the usual 5s
  - [ ] unset, empty or not a number: the 120s grace and 5s look stay (no error); the variable is listed with the other test variables in `docs/developers/environment.md` and `docs/help/environment.md`
  - [ ] `npm run lint`, `npm test`, `npm run smoke` pass
tags:
- tests
