- date: 2026-11-21T21:08:53.318891+00:00
  author: claude
  text: |-
    The cause is a machine stall. I also made the two tests that timed out about half as expensive.

    - The tests that timed out, 'applies persisted manual backlog order…' (578 ms) and 'resets offsets…' (499 ms), were the two slowest of all 1563 UI tests at load 35.
    - In the failed run, worker startup took ~14 s per file; normally it's 0.27 s. That's about 50× slower, enough to push a 0.5 s test to 30 s. CPU load alone doesn't do that: the full suite took 7.6 s at load 34 and 10 s at load 80. It was a stall, not a slow step in the file.
    - Fix in `view/__tests__/SprintsList.backlogPagination.spec.ts`: both tests set `lotar.preferences.tasks.pageSize` to 25 (the smallest allowed) and use half the tasks. The paging checks are the same, with the offsets scaled.
    - Measured on the file alone, 3 runs each: 198–267 ms vs 345–440 ms, and 135 ms vs 255 ms.
    - A similar stall can still time out other heavy tests (`Board.spec.ts` is now the slowest at ~0.5 s).
  report:
    commits:
