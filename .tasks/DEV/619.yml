- date: 2026-11-17T20:16:39.568374+00:00
  author: claude
  text: |-
    Review: passed. `224f47363` does what "Done when" asks, but it doesn't rebase cleanly onto main: the merge has to move it into `lotar-agent` and swap chrono for jiff.

    - **Read:** the ticket and its comments, the owner answers (INBOX-351, INBOX-444), the diff `main...224f47363` and AGENTS.md. `agent/DEV-619`, `t3/t3-thread-name-template` and `t3/dev-619-thread-name-template` all point at the same commit, so there's no second copy.
    - **Done when:**
      - The rule's `thread_name` wins over the profile's, and an empty one keeps the profile's (`resolve_profile`, `thread_name_template`).
      - The templates are filled in once, when the job starts. An empty result falls back to `<ID> <title>`.
      - A new thread gets `--title`. A continued thread is renamed before its turn is sent, and only when `thread_name` is set. Without it, names stay as today.
      - A failed rename is logged and the job runs on.
      - `POST /api/jobs`: `api_types.rs`, `types.ts` and `openapi.json` agree. The docs are updated.
    - **T3 Code 0.1.10 is installed now** (`~/.t3/userdata/server-runtime.json`), so this was the first "check after an update":
      - `t3 thread --help` still lists only list/start/send/show, so there is still no rename command.
      - `t3 auth session issue` still has `--scope`, `--ttl`, `--label` and `--json`.
      - The app bundle still has `orchestrationProtocol`, `orchestration.dispatchCommand`, and `thread.metadata.update` with `commandId`, `threadId` and `title`.
      - The fix agent also renamed a live thread on 0.1.10 and back.
    - **Reran:**
      - `npm ci`: OK.
      - `cargo nextest run --workspace -E 'test(t3_thread) | test(thread_name) | test(a_t3_threads_title) | test(renamed) | test(/dev510_t3_session_test/)'`: 22 passed.
      - `npm run lint`: passed.
      - Not rerun: `npm test` and `npm run smoke`. The fix agent passed both on this commit, and they have to run again after the rebase anyway.
    - **For the merge (not a code fault):** the branch is based on `804cb0f96`, and main has moved about 50 commits since. A trial `git rebase main` conflicts in `Cargo.lock`, `config/types.rs` (DEV-620's `context_entries` and `full_history` sit next to `thread_name`, keep all three), `services/mod.rs` and `agent.md`. Beyond the conflicts:
      - DEV-634 moved `agent_job_service.rs` into `crates/lotar-agent`. `t3_thread_api.rs` and the `tungstenite` dependency have to move with it, or `crate::services::t3_thread_api` won't resolve.
      - DEV-669 removed chrono. `t3_thread_api.rs:34` `chrono::Utc::now().timestamp_millis()` needs jiff, for example `jiff::Timestamp::now().as_millisecond()`.
    - **Follow-up, as the fix agent planned (`--next`):** after the release, a standards ticket sets `thread_name`, drops the rename step from `configs/lotar/automation.yml` and adds the after-update check. Until then, the two open "Done when" boxes stay open.
    - **Filed:** no tickets. Calling `t3 auth session issue` with no timeout is the same pattern the other `t3` calls use, so it isn't a finding.
