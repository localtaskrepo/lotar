- date: 2026-11-17T19:52:36.369603+00:00
  author: claude
  text: |-
    Continued T3 threads are renamed now, through T3 Code's internal API, as you decided (INBOX-444).

    - lotar issues a 2-minute `orchestration:operate` session (`t3 auth session issue`), sends `thread.metadata.update` over `/ws` (the call T3 Code's own app makes), then revokes the session. New module `crates/lotar-lib/src/services/t3_thread_api.rs`, new dependency `tungstenite` 0.30.0 (latest, no TLS).
    - `/mcp` (what `t3_thread_update` uses) accepts only MCP client sessions signed in through OAuth with approval, so lotar can't use it.
    - When: a continued job with a `thread_name`, after the session opens and before the turn is sent. The job log says `Renamed the T3 Code thread …` or `Could not rename … : <why>`, and the job runs on.
    - Tried live on T3 Code 0.1.10: renamed this thread and back, a missing thread is refused, no session left over.
    - Upstream: no issue or PR asks for a CLI rename (searched `pingdotgg/t3code`); nothing filed. `t3` 0.1.10 still has only `list/start/send/show`.
    - Not filed in standards yet: a new STD ticket goes to `@fix` right away and would drop the rename step before a lotar with this change is installed. The steps are in `--next`.
    - Docs: `agent.md` (route, failure, what to check after a T3 update), `automation.md`, `config-reference.md`. Commit `224f47363` amends `67fbb375`.
