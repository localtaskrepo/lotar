description: |-
  Source: standards STD-183 (docs/evidence/job-context.md). Owner 2026-11-15: "All six" (answered in INBOX-351), proposal 2: lotar names the thread itself.

  ## Found
  - Every standards job prompt asks the agent first to rename its thread to "<ID> <step>: <title>" (owner 2026-11-13, standards STD-88). ToolSearch ran in 486 of 735 Claude job sessions, nearly all to load t3_thread_update for it: two extra model calls per job, each re-reading about 50k tokens. About $40 in a 40-hour window.
  - lotar names a new thread "<ID> <title>"; a continued thread keeps its name.
  - T3's CLI (t3 0.1.9) sets a title only at `t3 thread start --title`; it has no rename and `thread send` takes no title (2026-11-16).

  ## Done when
  - [x] A profile (`agents.<name>.thread_name`) and a rule (`agent.thread_name`) set the thread name as a template, for example `thread_name: "${{ticket.id}} fix: ${{ticket.title}}"`. The rule's value wins over the profile's; an empty one keeps the profile's.
  - [x] The job fills in the ticket's templates when it starts, once: a ticket title that holds `${{` stays as written. A name that comes out empty falls back to `<ID> <title>`.
  - [x] A new thread starts with that name (`t3 thread start --title`).
  - [x] A continued thread is renamed to it before its turn is sent, through the T3 Code server's internal API (owner 2026-11-17: "Implement with the internal API", INBOX-444): a short `t3 auth session issue` session, `thread.metadata.update` over `/ws`, session revoked. A rename that fails (T3 Code doesn't answer, the API changed) logs it and the job runs on.
  - [x] No T3 Code issue is filed (owner: "Don't file"); checked that none asks for a CLI rename yet.
  - [ ] After each T3 Code update someone checks that the route still works and whether `t3 thread` got a rename command (owner: "we just need to react when the next version gets installed"): standards' daily review, once standards uses `thread_name`.
  - [x] Without the setting, names stay as today (`<ID> <title>`).
  - [x] `POST /api/jobs` takes `thread_name` like `provider`; `api_types.rs`, `view/api/types.ts`, `docs/openapi.json` agree.
  - [ ] Docs say so (agent.md T3 section, automation.md, config-reference.md: done); standards then drops the rename step from its prompts (configs/lotar/automation.yml).
