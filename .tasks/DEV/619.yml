- date: 2026-11-16T22:25:19.837146+00:00
  author: claude
  text: |-
    New threads are named now; renaming a continued thread needs your call, because T3 Code's CLI can't rename a thread.

    - `agents.<name>.thread_name` and the rule's `agent.thread_name` (the rule wins) take a template like `"${{ticket.id}} fix: ${{ticket.title}}"`. The job fills it in from the ticket when it starts and passes it to `t3 thread start --title`. Unset or empty: `<ID> <title>` as today.
    - `POST /api/jobs` takes `thread_name`; `api_types.rs`, `types.ts` and `openapi.json` agree. Docs: `agent.md`, `automation.md`, `config-reference.md`.
    - Blocker: `t3` 0.1.9 has only `list/start/send/show`. Nothing renames a thread, and `send` takes no title. So for now a continued thread (merge, rework: `session: continue`) keeps its name, and the job log says so.
    - `a_queue_entry_held_by_a_waiting_thread_says_so_once` failed twice under load, then passed on its own. That's the flake [DEV-613](https://lotar.pyxzl.net/task/DEV-613) covers, not this change.

    **Question:** how should a continued thread get its new name?
    1. (Recommended) Keep it as it is now. Standards drops the rename step from the fix and review prompts and keeps it only in merge and rework, which continue a thread. I'd also draft a T3 Code feature request for `t3 thread rename` (or `send --title`) for you to approve before filing.
    2. lotar renames through the T3 Code server's internal API, which T3 doesn't document and can change in any release.
  report:
