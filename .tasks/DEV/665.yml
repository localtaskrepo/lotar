- date: 2026-11-17T18:13:36.028055+00:00
  author: claude
  text: |-
    CI red on main only because of cargo-deny: new advisory `RUSTSEC-2026-0543` marks chrono unmaintained. Accepted it in `deny.toml` like unsafe-libyaml in DEV-122.

    - Every other job in run `44142333082` passed; Security Audit failed only on `error[unmaintained]: chrono` (no vulnerability, "No safe upgrade is available").
    - Commit `e03bb43c2` adds an ignore entry with its reason to `deny.toml`; `cargo deny check` now reports advisories ok, bans ok, licenses ok, sources ok.
    - The chrono → jiff/time migration (~185 uses in 4 crates) is filed as DEV-669; that ticket also removes the ignore entry.
  report:
    commits:
