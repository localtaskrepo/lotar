description: |-
  Found in the DEV-941 review (2026-11-27).

  - `project_threads` in `crates/lotar-agent/src/services/t3_thread_api.rs` returns an empty list when no snapshot project's `workspaceRoot` holds `session_project(tasks_dir)`. `list_threads` then reports success, so `resumed::list_threads` never falls back to `t3 thread list` and nothing is logged.
  - T3 Code's CLI `resolveProject` (`binCli-*.mjs`) goes further in that case: it finds the project through the repo's other git checkouts (a T3 project registered on a worktree). lotar then looks at no threads for that tasks dir, silently.

  ## Done when

  - [ ] No matching project in the snapshot is an error from `t3_thread_api::list_threads`, so the look falls back to `t3 thread list` and logs the reason once.
  - [ ] A unit test covers it.
