description: |-
  ## Found

  Found while reviewing DEV-789. `lotar serve --tasks-dir /tmp/x --web-ui-path /tmp/web --port 18791` fails with `error: a value is required for '--web-ui-path <PATH>' but none was supplied`. `--web-ui-path=/tmp/web` works, and so does putting `--port` first.

  `normalize_serve_args` (`crates/lotar-lib/src/cli/preprocess.rs:237`) reads the first bare positional after `serve` as the port. Only `--host`, `--tasks-dir`, `--format`, `--log-level`, `--project`, `-f` and `-l` are known to take a value (`preprocess.rs:247`), so the value of `--web-ui-path` (and `--allow-host`) becomes `--port <value>`. `docs/help/serve.md` documents `--web-ui-path <PATH>` and `--allow-host <NAME>` in the space form.

  ## Check

  `lotar serve --web-ui-path <dir>` and `lotar serve --allow-host <name>` without an earlier port.

  ## Done when

  - [ ] Every serve option that takes a value keeps its value with a space, also without an earlier port. A test in the preprocess tests covers `--web-ui-path <dir>` and `--allow-host <name>`.
