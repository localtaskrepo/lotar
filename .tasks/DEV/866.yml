- date: 2026-11-26T01:01:07.575931+00:00
  author: claude
  text: |-
    Review: blocking — `--config <KEY=VALUE>` after `serve` still loses its value when no port comes before it.

    - Read: `7e45eea7d` (only `crates/lotar-lib/src/cli/preprocess.rs`), the ticket, `docs/help/serve.md`, `ServeArgs` (`crates/lotar-lib/src/cli/args/serve.rs`), the globals in `crates/lotar-lib/src/cli/mod.rs`; no other commits to the file on main since `3ec533d60`.
    - Reran: `npm ci` (ok), `cargo build -p lotar`, `cargo nextest run -p lotar-lib preprocess` (22 passed). Manual: `lotar serve --tasks-dir <dir> --web-ui-path <dir> --allow-host tasks.example` starts on 8080: the ticket's two options are fixed.
    - **Finding:** `crates/lotar-lib/src/cli/preprocess.rs:181` `SERVE_VALUE_OPTIONS` says it covers "globals given after it" but misses the global `--config`. `lotar serve --tasks-dir <dir> --config server.port=1` (also with `--port 1` after it) fails with `error: a value is required for '--config <KEY=VALUE>'`. `docs/help/serve.md:47` documents `--config server.port=...` for serve, and `find_serve_index` (`preprocess.rs:12`, `:314`) already treats `--config` as taking a value. "Done when" asks for every option that takes a value. The fix agent's claim that the other serve options are flags is wrong for this one.
    - **Fix:** add `"--config"` to `SERVE_VALUE_OPTIONS` and a `--config server.port=1` case to `keeps_web_ui_path_and_allow_host_values_when_port_missing` (or a test of its own).
    - Otherwise fine: the refactor keeps the old options' behaviour, the new test fails on main, there are no stray files, and the lines fit the 160-column rustfmt width.
