- date: 2026-11-17T09:15:01.176254+00:00
  author: claude
  text: |-
    Blocked: harnessmux can't call `t3_thread_launch` itself without losing full access. Only T3's own CLI gets a full-access token. One question below.

    - T3 caps a thread's mode at its caller's access ("modes cannot exceed yours", `t3_thread_launch`). `t3 thread start` signs in internally with `access: "full-access"`.
    - The only headless token, `t3 auth session issue --subject mcp-client --scope orchestration:read --scope orchestration:operate`, is accepted by `/mcp`, but without a mode ceiling. `authenticateMcpClient` then falls back to `"approval-required"`. Same in upstream main (`apps/server/src/auth/EnvironmentAuth.ts:1542`). A thread launched that way would stop at every permission prompt, so lotar jobs couldn't run unattended.
    - The other way to full access is T3's MCP OAuth sign-in: you approve harnessmux once in T3 Code, and the token lasts 30 days (`MCP_CLIENT_SESSION_TTL`). Then you approve it again.
    - Checked in the 0.1.9 bundle (`app.asar`) and upstream `pingdotgg/t3code` main (`d6419d9`). No live launch (it would start a real thread).
    - No code changed, nothing committed, so I told no other thread about file changes.

    **Question:** How should a t3 job get a full-access thread in lotar's worktree?
    1. (Recommended) Upstream: I file a T3 Code issue (or PR) for `t3 thread start --worktree-path <path>`. That flag maps to `existing_worktree`, a few lines in `launchWorkspaceStrategy`. harnessmux passes it, and DEV-652 waits for the T3 release (DEV-353 was fixed upstream within a day).
    2. harnessmux's own MCP OAuth sign-in with your one-time approval in T3 Code, renewed every 30 days. Much more code, and a job fails when the approval runs out.
    3. Without T3 changes: lotar registers each ticket worktree as its own T3 project (an extra project per ticket in the sidebar, removed at cleanup).
