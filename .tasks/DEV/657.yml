- date: 2026-11-17T22:53:24.960749+00:00
  author: claude
  text: |-
    Correction: a headless full-access sign-in to T3's `/mcp` exists. My 09:15 "only T3's own CLI gets full access" was wrong.

    - Tencent/teamai-cli (MIT, `packages/runtime-t3/src/auth.ts`, guide `docs/guide/runtime-t3.md`) signs in through T3's MCP OAuth. It approves its own sign-in by POSTing a pairing code from `t3 auth pairing create --json --scope orchestration:read --scope orchestration:operate --scope settings:write --scope source-control:write --ttl 2m` to the authorization page's `decision` endpoint, with access `full-access`. The token lasts 30 days; then it signs in again the same way, with no human.
    - `t3 auth pairing create` exists in our T3 0.1.10. Not tried live yet.
    - With it, harnessmux can call `t3_thread_launch` with `existing_worktree` itself (the original plan). No per-worktree projects needed. It also gets `clientRequestId` (no duplicate thread on retry) and thread settling.
    - Other T3 orchestrators: ski043/marshal-factory (Linear→PR, lets T3 make the worktree), Codecaine-AI/annotations (`t3 thread start`). Neither solves the existing-worktree case.
    - Plan not changed yet: waits on the owner's pick.
