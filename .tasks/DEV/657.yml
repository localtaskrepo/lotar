description: |-
  Owner 2026-11-17 (DEV-652, answered in INBOX-412): "harnessmux's t3 agent calls T3's t3_thread_launch itself, without the CLI (a harnessmux ticket)". DEV-652 (lotar side) waits for this.
  Owner 2026-11-17: backed upstream `t3 thread start --worktree-path` (pingdotgg/t3code discussion #23945; no maintainer reply yet).
  Owner 2026-11-17, after the pairing sign-in was found: picked "Pairing sign-in". This replaces his earlier interim pick "project per work tree".
  Owner 2026-11-17: "I'm like the idea about the id let's implement it, and yes moving threads into settled that I didn't need to look at are also a good idea".

  ## Found
  - `t3 thread start` (T3 Code 0.1.10) only has `--worktree <base>`: T3 makes a new worktree. MCP `t3_thread_launch` takes `workspaceStrategy: {type: existing_worktree, worktreePath}`; the path must be in `git worktree list` of the project's `workspaceRoot` (lotar's `git worktree add` worktrees pass).
  - A thread's mode can't exceed its caller's sign-in. A plain `t3 auth session issue --subject mcp-client` token only gets `approval-required`.
  - Full access with no human: Tencent/teamai-cli (MIT; `packages/runtime-t3/src/auth.ts`, `docs/guide/runtime-t3.md`) uses T3's MCP OAuth (client registration + PKCE). It approves its own sign-in by POSTing `{authorization, decision: {_tag: "pairing-code", access: "full-access", code}}` to the authorization page's `decision` endpoint. The code comes from `t3 auth pairing create --json --base-dir ~/.t3 --scope orchestration:read --scope orchestration:operate --scope settings:write --scope source-control:write --ttl 2m --label harnessmux`. The token lasts 30 days, then it signs in again the same way. Its `t3.ts` also uses `clientRequestId` (a repeated launch returns the same thread) and settles finished threads (T3's Settled group).

  ## What
  - Sign-in: harnessmux keeps one T3 credential (0600 file in its state dir), reuses it while valid, and signs in again with a fresh pairing code when it has expired or `/mcp` refuses it. It never prints the pairing code or the token.
  - A t3 session whose `cwd` is a git worktree of its `project` (and no `worktree_base`) starts its thread with `t3_thread_launch`, `existing_worktree` at `cwd`, full-access mode, keeping title, provider/model and the prompt, with a `clientRequestId` derived from the session, so a retry or resume never makes a second thread. Later turns, `show`, resume and the thread lookup by title stay as they are (`t3 thread send/show/list`).
  - Request IDs: every launch and every later turn goes through MCP with a `clientRequestId` derived from the session and the turn (`t3_thread_launch`, `t3_thread_send`), so a retry, a resume or a restarted harnessmux re-sending a turn never makes a second thread or a second run. A repeated launch that T3 refuses with `invalid_request` or `runtime_mode_escalation_denied` launched nothing (teamai's rule); any other answer to a repeat means the thread exists: look it up, never launch again.
  - Settling: harnessmux offers settling a session's thread (`t3_thread_organize` with `action: settle`; it stays reachable by its link). It settles only when asked and only a thread whose last run finished and isn't waiting for an answer; a thread that failed, was interrupted, or waits for the owner stays active. lotar (DEV-652) asks at job end only when the ticket doesn't wait for the owner (not HelpNeeded and not assigned to him) and the job didn't fail: the threads the owner didn't need to look at. A settle T3 refuses is logged and doesn't fail the job.
  - Which wins: `worktree_base` set and `cwd` a worktree → refuse with an error naming both, no thread started. `cwd` equal to `project` → `t3 thread start` as today.
  - A failed sign-in or launch (server unreachable, pairing refused, path rejected, mode refused) fails the turn with T3's error text and starts no thread; `agent_session_asked` handling stays.
  - `worktree_base`/`branch` go once lotar no longer sets them (DEV-652): remove them in the same release if nothing else uses them (search lotar and standards configs).

  ## Done when
  - [ ] Live check first: the pairing sign-in gets a token whose launch runs a `full-access` thread (`t3 thread show --json`), and `t3 auth session list` shows one harnessmux session, not one per run.
  - [ ] Live check: a t3 session with `cwd` = a `git worktree add` worktree of a T3 project runs its thread there (`t3 thread show --json` names that path), and `~/.t3/worktrees` gets nothing new.
  - [ ] A second turn and a resume continue the same thread; a repeated launch or turn with the same `clientRequestId` returns the same thread and run (live check: send it twice, one run); the started event carries the thread link.
  - [ ] Settling: a finished thread settled through harnessmux moves to T3's Settled group and its link still opens it; a thread waiting for an answer or failed is not settled (tests, plus one live check).
  - [ ] Tests (replayed, no real agent) cover: launch in a worktree, kept token reused, expired or refused token signs in again, `worktree_base` + worktree refused, launch failure fails the turn without a thread, repeated `clientRequestId` makes no second thread, settle refused for a waiting or failed thread.
  - [ ] README t3 row and CHANGELOG say it (including the T3 session it creates and how to revoke it: `t3 auth session revoke <id>`); fmt, clippy, nextest, deny pass.
  - [ ] A release with it on crates.io (tagging and publishing: the owner's OK first unless he gave it), so lotar can bump `harnessmux` in DEV-652.
