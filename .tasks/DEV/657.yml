- date: 2026-11-18T00:05:44.063045+00:00
  author: claude
  text: |-
    harnessmux 0.1.10 is on crates.io: t3 sessions in a worktree launch their thread there through T3's MCP, signed in with a pairing code.

    - A session in a git worktree calls `t3_thread_launch` (`existing_worktree`, full access). `--worktree` is refused there.
    - Every later t3 turn goes through `t3_thread_send`. Each launch and send carries a `clientRequestId`, so a retry starts no second thread or run (checked live).
    - Sign-in: a 2-minute pairing code from `t3 auth pairing create` is traded for an OAuth token. The token is kept 30 days in `<state>/t3-credential.json` (0600). T3 shows it as session `harnessmux`, and a revoked or expired token signs in again.
    - New: `harnessmux settle <name>` and `backend::t3::settle` move a finished thread to Settled. A thread that waits for an answer, still runs or failed is refused.
    - Live check against T3 Code 0.1.10 done; its session is revoked again. Tests use a fake T3 server, no real agent.
    - Left for DEV-652: bump harnessmux to 0.1.10 in lotar, and drop lotar's `worktree_base`/`branch` use for t3 jobs.
