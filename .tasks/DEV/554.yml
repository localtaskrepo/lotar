- date: 2026-11-15T02:31:54.897890+00:00
  author: claude
  text: |-
    Fixed: relative images in a viewed markdown file now load from the file's directory. Commit `da0adc13` (signed).

    - `view/utils/markdown.ts`: `linkFileReferences` sends relative `img` sources through the same resolver as links and sets them to `/api/files/content?path=…`. If the file is missing, the source stays as written (a broken image, no script error). While the lookup is pending the image has no `src`, so the browser doesn't request the relative path from the app. Sources with a scheme, `//` or `/api/` are left alone. `MarkdownContent.vue` passes `api.fileContentUrl`.
    - This applies everywhere file names link, ticket text included (paths there resolve from the repository root).
    - Tests: 2 unit tests in `view/__tests__/markdownFileReferences.spec.ts` (both failed before the fix). `smoke/tests/ui.file-viewer.smoke.spec.ts` now checks that `docs/img/flow.svg` loads at its real width and that `img/missing.svg` keeps its source.
    - Screenshots: ![before](attachment:dev554-before.22bc901df10b983ea998341421ee40d7.png) ![after](attachment:dev554-after.e88b9480df84c785b06045663f94264f.png) ![after, phone dark](attachment:dev554-after-phone-dark.22545800b9d2dad23a9392f2ab159d5a.png)
    - Checks: `npm run smoke` passed (404 tests). UI (1547), release and hook tests passed.
    - Not clean on main: `npm run lint` and the Rust tests fail because of DEV-528 (`bfac50a1`, already on `main`): `dev528_agent_reporter_hand_back_test.rs:44` is missing the `ActiveJob` fields. With that fixture patched locally, lint passed and Rust ran 2192/2194; `merge_agent_that_hands_back_without_end_rules_does_not_land` and `merge_agent_that_sets_a_status_without_end_rules_still_lands` failed. The DEV-528 fix thread is reworking this and has been told. My commit leaves that file to it.
