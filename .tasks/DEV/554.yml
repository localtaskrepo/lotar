description: |-
  Left over from DEV-549. In the file viewer, a markdown file renders, but an image it references by a relative path (`![diagram](img/flow.png)`) resolves against the app URL instead of the file's directory, so it shows as broken.

  ## Fix

  - In the viewer's rendered markdown, rewrite relative `img` sources through `/api/files/resolve` (with the file's directory as `base`) to `/api/files/content?path=…`, as `MarkdownContent` already does for links.

  ## Done when

  - [ ] A relative image in a viewed markdown file (`docs/guide.md` with `![flow](img/flow.png)`) loads from `/api/files/content?path=docs/img/flow.png`
  - [ ] While the lookup is pending the image has no `src`, so the browser never requests the relative path against the app URL
  - [ ] An image the resolver does not find (missing or git-ignored) keeps its source as written and stays a broken image; no script error
  - [ ] Sources with a scheme (`https:`, `data:`), `//host` or `/api/` (resolved attachments) are left alone
  - [ ] The same rewrite applies wherever `MarkdownContent` links file names (ticket text resolves against the repository root), as links already do
  - [ ] Unit test in `view/__tests__/markdownFileReferences.spec.ts` and smoke check in `smoke/tests/ui.file-viewer.smoke.spec.ts`; before and after screenshots attached
