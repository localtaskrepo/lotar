  text: 'Done on branch t3/dev-388-unblocked-hook-cross-repo (fast-forwarded to main first for DEV-385/386), commit DEV-388. lotar automation run (and POST /api/automation/run, which shares run_manual) now fires the unblocked rules of each open ticket that has a repo:ID in depends_on and no open prerequisite left; --dry-run, --select, -p and rule names apply. Guard: the rule''s own conditions (when status: Blocked plus a set that leaves Blocked), as DEV-385 suggested; no marker, since a rule without such a condition is documented to fire on every run. ${{unblocked.by}} now includes cross-repo tasks (new Prerequisite type in template.rs), also in simulate and the local hook. Not done: the dependent repo''s own events (no cheap trigger). Test: dev386 automation_run_fires_unblocked_once_a_prerequisite_in_another_repo_is_done. Docs: automation.md (When prerequisites are done, automation run), task.md (Tasks in another repo), CLI help, openapi description. Checks: lint, test (2107 Rust, 1503 UI), smoke (384) all pass.'
