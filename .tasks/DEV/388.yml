description: |-
  DEV-386 added cross-repo prerequisites (`depends_on: [lotar:DEV-374]`, resolved through the global `repos` setting). The other repo never learns about the dependent, so DEV-385's `unblocked` hook, which fires on a local prerequisite's close, never fires for them.

  ## Plan
  - In `lotar automation run` (and on the dependent repo's own events where cheap), find open tickets with a `repo:ID` in depends_on whose `relationships::blocked_dependencies` is now empty, and call DEV-385's `AutomationService::apply_unblocked_event(storage, dependent_id, by)` with the cross-repo tasks as `by` (`external_tasks::resolve` gives title, status, link).
  - Fire once per unblocking: the DEV-385 agent suggests the rule's own conditions as the guard (`when: status: Blocked` plus a `set` that moves it out of Blocked); add a marker only if that is not enough.
  - Docs: drop the 'Nothing in this repo is notified' sentence in docs/help/task.md (Tasks in another repo), automation.md.

  ## Done when
  - [ ] A standards-like repo's Blocked ticket depending on lotar:DEV-1 gets its unblocked rule run by `lotar automation run` after DEV-1 closes, once, with a test
  - [ ] Documented

  Blocked on DEV-385 (the hook) and DEV-386 (cross-repo references) being merged.
