- date: 2026-11-24T21:26:43.335709+00:00
  author: claude
  text: |-
    Fixed: `lotar trust --status` and `lotar trust` now list only rules that have a run command.

    - Cause: `run_commands` in `crates/lotar-lib/src/cli/handlers/trust.rs` turns each rule into YAML first. An action without `run` comes out as `run: null`, so every rule matched and was listed as `runs null`.
    - Fix: skip a `run` that is null. A file with no run commands now shows `no run commands`.
    - New test `skips_rules_without_a_run_command`. A build from before the fix failed it with `rule 'tag' on updated runs null`. It passes now.
    - Commit `a30c1b1a4` (signed) on `agent/DEV-847`.
  report:
