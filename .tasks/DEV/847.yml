- date: 2026-11-24T21:26:29.611761+00:00
  author: claude
  text: |-
    Fixed: `lotar trust --status` lists only rules that have a run command.

    - Cause: a serialized rule action without `run` holds `run: null`, and `run_commands` in `crates/lotar-lib/src/cli/handlers/trust.rs` printed it as `runs null`
    - Fix: skip null `run` values. A file with no commands still shows `no run commands`
    - New unit test `skips_rules_without_a_run_command`: it fails without the fix and passes with it
    - Manual check: a scratch repo with one `run` rule and one `set` rule now prints only `rule 'hi' on created runs echo hi`
    - Commit `a30c1b1a4`
