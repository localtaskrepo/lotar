title: 'Live stall check restarted a t3 job that was still running: QIS-217 job-1 completed 6 s after the restart'
status: Reviewing
priority: Medium
type: Bug
reporter: claude
assignee: '@review'
created: 2026-11-27T23:01:50.414518+00:00
modified: 2026-11-27T23:09:21.075651+00:00
comments:
- date: 2026-11-27T23:09:06.311916+00:00
  author: claude
  text: |-
    Fixed: an orphaned `t3` job now still shows in `list-running`, and `lotar serve` takes orphans over every 30 s.

    - Cause: job-1's lotar process (pid 18981) exited about 22:28 while its T3 thread kept running. `list-running` hid it as an orphan, and the QIS server (running since 10:33) takes orphans over only at start. The worker the live check's restart started took it over at 23:00:14.
    - `crates/lotar-agent/src/services/agent_active_jobs.rs`: `list_still_running` / `list_all_still_running` also return an orphaned `t3` job that is past its worktree setup. `list_all` is gone (it had one caller).
    - `agent list-running` (`--all` too) marks such a job `"orphaned": true` in JSON and `<pid> (exited)` in text. The status guards and the queue still count live owners only.
    - `serve_handler.rs`: `recover_orphaned_jobs` also runs every 30 s, next to the resumed-thread look.
    - New test `crates/lotar-lib/tests/dev944_orphaned_t3_job_listed_test.rs` failed before the fix. `dev763` now uses a `command` job for its dead record. Docs: `docs/help/agent.md`.
    - The 30 s serve loop has no test of its own: it would wait 30 s of wall-clock time. The existing serve tests pass.
    - Limit: a repo with no `lotar serve` and no worker keeps an orphaned t3 job listed until a worker starts, so the live check won't restart it. `standards` `repos.ts` could start a worker when it sees `orphaned: true`. This is a proposal, not done.
