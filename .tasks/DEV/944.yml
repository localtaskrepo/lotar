description: |-
  Found by claude on 2026-11-27 (QIS-217, lotar 0.16.1).

  ## What happened
  - `job-20261127T222541.806Z-1` (runner t3, QIS-217) started 22:25:41Z. Its log has events until about 22:28, then nothing until a burst at 23:00:20 (summary), `agent_job_completed` 23:00:21.
  - At 23:00:14 the standards live check (`repos.ts --live --report`) commented "Stalled since 2026-11-27T22:28Z with no lotar job" and ran "Stalled: restart the fix agent", which started job-2 (23:00:24) as the next turn of the same thread.
  - The first job's deferred changes (HelpNeeded, mallox) were applied at 23:00:28, after the restart, so the ticket now has a needless second job and a false stall comment.

  ## Check
  - `lotar --tasks-dir ~/Development/quarter-inch-studio/.tasks agent logs job-20261127T222541.806Z-1`: the gap from 22:28 to 23:00, then completion at 23:00:21.
  - `lotar task timeline QIS-217`: the stall comment at 23:00:14 before the status change at 23:00:28.

  ## Cause
  - The lotar process that ran job-1 (pid 18981) exited about 22:28; the job's T3 Code thread kept running. `list-running` hides a job whose owner exited (an orphan), and `lotar serve` takes orphans over only when it starts (the QIS server ran since 10:33). The next worker, started by the live check's restart at 23:00:14, took it over and it completed.

  ## Done when
  - [ ] `lotar agent list-running` (also `--all`, text and `--format json`) still lists a `t3` job whose lotar process exited before it ended, with `"orphaned": true` in JSON and `(exited)` after its `owner_pid` in text: its thread still runs, so the live check counts the ticket as busy. Test in `crates/lotar-lib/tests/`.
  - [ ] Other orphans (`command` and session runners, and a `t3` job that died in its worktree setup, before its thread started) are not listed, as before: their agent stopped with the process.
  - [ ] A running `lotar serve` takes orphans over every 30 s (with its look for resumed T3 threads), not only at start, so an orphan waits at most about 30 s while the server runs. A takeover that fails leaves the record for the next look, as at start.
  - [ ] `docs/help/agent.md` says both.
