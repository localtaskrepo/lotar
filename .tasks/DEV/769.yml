- date: 2026-11-24T22:00:38.717599+00:00
  author: claude
  text: |-
    Done: the job log viewer has views, search, folded tool calls, a live status line and a result card; the jobs list has filters.

    - Log views (All, Conversation, Tools, lotar, Problems) and a Thinking chip, remembered per viewer; search highlights matches, also in tool output
    - Tool calls between messages fold into one row (`3 commands · 1 read · 1 failed`); a failed call opens with its output, ANSI stripped; setup notes fold into one row
    - Running job: live line (`Running <cmd> · 42s`, context %), Jump to latest; one result card at the end; questions show the call that asked
    - Log header: Instructions button, `Link` to `/agents?job=<id>`, Full height. The link also waits for a job that joins the list later
    - Jobs list: search, agent/runner and ticket filters
    - New: `view/utils/agentJobLog.ts`, `view/components/AgentJobToolCall.vue`; tests `view/__tests__/AgentJobLog.spec.ts`, `agentJobLogLayout.spec.ts`, smoke test in `smoke/tests/ui.agent-jobs.smoke.spec.ts`
    - Smoke fix on the side: two tests in that `describe.concurrent` file used the global `expect.poll` and failed about half the time; they now take `expect` from the test
    - DEV-849 adds `AgentT3Thread` to the log panel; I told it to put it in the `#actions` slot next to `AgentRunInputs`. Whichever lands second rebases
    - No guidance correction
