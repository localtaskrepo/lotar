description: |-
  DEV-53 second-pass audit follow-up.
  Audit findings: U13.

  ScanView directly reads/writes localStorage before confirmation or runScan, so storage-denied/quota exceptions prevent scanning. Use existing safe storage utilities and make preference persistence nonfatal. Acceptance: denied get/set still allows confirmation and a single scan submission; skip-next-time works when storage is available. No new storage abstraction is needed.

  Related umbrella: DEV-53.
  Definition of done: regression coverage, relevant docs/contracts, and repository lint/test/smoke gates; preserve user-owned data.
