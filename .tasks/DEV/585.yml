- date: 2026-11-15T21:30:59.573933+00:00
  author: triage
  text: |-
    Answered by the owner's earlier decision: Codex jobs stay in their sandbox, so this ticket needs a Claude fix job, not Codex.

    - `standards/docs/decisions/2026-11-14-codex-sandbox-network.md` (owner, STD-125): Codex jobs keep the sandbox, build with `RUSTC_WRAPPER=`, and tests that bind local ports (`serve_sends_the_embedded_index_page`, the watcher and MCP wire tests) can't pass there.
    - So the `serve printed no URL` failure is the sandbox, not the bug. Don't retry it under Codex.
    - Next: run `npm run -s test:agent` under a Claude job (network allowed) under load, reproduce the three event tests, and replace the fixed sleeps with waiting for readiness.
- date: 2026-11-15T22:06:51.544643+00:00
  author: claude
  text: |-
    Fixed: the three tests raced watcher startup; they now wait for a real readiness signal, not fixed sleeps.

    - Web: the tasks watcher started in a detached thread; under load the test wrote files before it watched or took its sprint snapshot. The test-only SSE `ready` event now waits (max 5 s) until the watcher is armed or gave up (`web_server.rs`, `WATCHER_SETTLED`).
    - MCP: the tools baseline (`gather_enum_hints`) was taken in the watcher thread, possibly after the config edit → no diff, no `list_changed`. It is now taken before the server reads stdin (`mcp/server/watchers.rs`).
    - Tests: new `read_sse_until` waits for the expected events (15 s deadline); dropped the 600 ms / 500 ms sleeps.
    - First try blocked `accept` until arming: under load `openapi_spec_served` and `api_options_preflight…` then failed (those tests scan the repo's real `.tasks`). Moved the wait into the `ready` event instead.
    - The ticket's check command needs `--workspace`, not `-p lotar-lib` (the MCP test needs `target/local/lotar`).
    - Under load I also hit the `dev60` 2 s storage-lock flake; already filed as its own health ticket, not touched.
  report:
    commits:
    - hash: 1011487e
      what: watcher readiness + MCP baseline before first request; tests wait for events
    checks:
    - command: npm run -s lint:agent
      result: passed
    - command: npm run -s test:agent
      result: passed
    - command: npm run -s smoke
      result: passed
      reason: 404/404
    - command: cargo nextest run --cargo-profile local --workspace --no-fail-fast (2x, under 14 yes loads)
      result: passed
      reason: 2219/2219 both runs
    next: Review on another model, then merge
- date: 2026-11-15T22:28:20.690179+00:00
  author: claude
  text: |-
    Fixed: both watchers took their baseline after the server was already serving, so changes made right after start were lost.

    - Cause: web `start_tasks_watcher` and MCP `spawn_tools_dir_watcher` snapshot on a background thread. A starved thread snapshots *after* the test's change, so there's no diff and no event (the 12 s MCP failure matches the 10 s wait).
    - `crates/lotar-lib/src/web_server.rs`: server waits (≤5 s) for the watcher to register before it accepts connections.
    - `crates/lotar-lib/src/mcp/server/watchers.rs`: hints baseline gathered before the server reads `initialize`.
    - Tests: no 600/500 ms sleeps. They wait for `ready` and the expected events (≤15 s), plus a 1 s window to catch duplicates.
    - I couldn't reproduce the flake without changes: 35 stress runs alongside the full suite and CPU burners all passed. I showed the race with an injected delay instead.
    - The ticket's check command with `-p lotar-lib` doesn't build the `lotar` binary, so the MCP test panics. Use `--workspace`.
  report:
    commits:
    - hash: d6dbec07
      what: watchers take their baseline before serving; tests wait for events, no fixed sleeps
    checks:
    - command: npm run lint
      result: passed
    - command: npm run -s test:agent
      result: passed
      reason: 2219/2219 Rust + 1547 UI, with 20 CPU burners
    - command: npm run -s test:rust:agent
      result: passed
      reason: second loaded run, 2219/2219
    - command: npm run -s smoke
      result: passed
      reason: 404/404
    - command: delay probe
      result: passed
      reason: 1.5 s sleep in watcher threads fails old code (MCP 11.5 s, no config_updated), fixed code 3/3
    next: Review, then merge
