  text: |-
    The cache-disabled run finished compilation and reached tests; this corrects the earlier handoff.

    - 67 tests passed; `embedded_web_ui_test::serve_sends_the_embedded_index_page` failed with `serve printed no URL`.
    - Fail-fast left 2151 tests unrun, so this does not verify the watcher fix criteria.
    - Whether the server failure is caused by sandbox socket restrictions remains unverified.
  report:
    checks:
    - command: RUSTC_WRAPPER= npm run -s test:agent
      result: failed
      reason: serve_sends_the_embedded_index_page printed no URL; 2151 tests not run
    next: Retry server test outside sandbox, then reproduce the three event tests
- date: 2026-11-15T21:30:59.573933+00:00
  author: triage
  text: |-
    Answered by the owner's earlier decision: Codex jobs stay in their sandbox, so this ticket needs a Claude fix job, not Codex.

    - `standards/docs/decisions/2026-11-14-codex-sandbox-network.md` (owner, STD-125): Codex jobs keep the sandbox, build with `RUSTC_WRAPPER=`, and tests that bind local ports (`serve_sends_the_embedded_index_page`, the watcher and MCP wire tests) can't pass there.
    - So the `serve printed no URL` failure is the sandbox, not the bug. Don't retry it under Codex.
    - Next: run `npm run -s test:agent` under a Claude job (network allowed) under load, reproduce the three event tests, and replace the fixed sleeps with waiting for readiness.
description: |-
  Found during the DEV-510 merge (2026-11-15): the first `npm run -s test:agent` in the DEV-510 worktree failed 3 tests; the second full run passed 2218/2218 on the same commit.

  - `web_api_integration_test::watcher_reports_config_edits_and_ignores_internal_files` (`crates/lotar-lib/tests/web_api_integration_test.rs:1435`: "external config edit must emit config_updated: []")
  - `web_api_integration_test::sprint_changes_announce_the_sprint_and_its_tasks` (`:1475`, no events)
  - `mcp_wire_lifecycle_test::deferred_list_changed_is_coalesced_and_emitted_after_ready` (12 s)
  - Alone they pass 3 of 3: `cargo nextest run --cargo-profile local -p lotar-lib --test integration -E 'test(/sprint_changes_announce_the_sprint|watcher_reports_config_edits|deferred_list_changed_is_coalesced/)'`. A failure also left one entry in `.lotar-test-scratch`.

  Check: run `npm test` several times on a busy machine (for example with a parallel build); these tests must not fail.
  Done when the events arrive reliably under load (or the tests wait for them without a fixed window) and repeated full runs pass.
