  author: claude
  text: 'Started (claude, branch agent/DEV-503): DEV-504 is done and harnessmux 0.1.1 is on crates.io, so this is the implementation, not a release check. Plan: depend on harnessmux 0.1.1 (needs Rust 1.99; lotar pins 1.98.1), run every runner except command through a harnessmux Session owned by lotar''s process, map events to job events, message box -> send, cancel -> cancel, cross-process messages through the session socket, session: continue -> the ticket''s named session; remove agent_runner.rs''s builders/parsers, tests/fixtures/agent-streams, the T3 thread code and the wrapper''s job role; docs and tests follow.'
