- date: 2026-11-14T02:07:21.603350+00:00
  author: claude
  text: |-
    Done: commit b141e26a on agent/DEV-503 (signed, not merged or pushed).

    What changed: lotar depends on harnessmux 0.1.1 (Rust toolchain 1.98.1 -> 1.99.1, also in ci.yml). Every runner but command runs as a harnessmux session owned by lotar's process, named <ticket>-<profile> (DEV-7-fix), in harnessmux's normal state dir so harnessmux attach/send reach it. Message box, tell_agent and other processes queue the session's next turn (max 10 turns per job); cancel cancels the turn; session: continue resumes the ticket's session of the same profile; a job whose process died resumes its session and asks the agent to continue. Permission requests: new profile key on_permission (deny, allow-reads, allow, ask); with ask they show as AgentJob.question with buttons on the Agents page, answered via new POST /api/jobs/answer (api_types, view types, openapi, help docs updated). runner: t3 is harnessmux's t3 agent (owner decision on this ticket); lotar asks T3 for the worktree and records the one that appeared. Removed: per-CLI builders/parsers (agent_runner.rs now ~350 lines), tests/fixtures/agent-streams, the T3 thread code in agent_job_service.rs (~830 lines), the file inbox in agent_active_jobs.rs, docs/developers/agent-integrations-plan.md and agent-cli-research.md. Profiles of agent runners that set command/args are refused with a hint (harnessmux agents.toml sets the program); max_budget_usd, tools and mcp.allow are no longer passed (job log notes it).

    Side effects to know: the ACP crates turn on serde_json preserve_order for the whole build (all tests still pass); Clippy 1.99's result_large_err made the MCP server box its error responses. Behaviour lost from the T3 code: a T3 thread link is no longer added to the ticket; a T3 thread that waits for an answer now fails the job with the link instead of handing the ticket to the reporter as HelpNeeded; the 'continue an earlier thread with unmerged work' and branch-freeing logic is gone.

    Live runs 2026-11-14 in a scratch repo (scratch HARNESSMUX_HOME, adapters installed by harnessmux on first use): Claude fix job (haiku) created and committed hello.txt; a second process with --session continue resumed it (session/resume) and remembered the commit hash; Codex review job via lotar serve took a REST message during its running turn and ran it as turn 2 of the same job; Codex --session continue resumed too; Claude merge job fast-forwarded main. Not run live: t3, amp and the other agents, and on_permission: ask with a real agent (covered by a shell ACP fake in tests/dev503_harness_jobs_test.rs and a Node fake in a new Playwright smoke test).

    Checks: npm run lint passed; npm test passed (2111 Rust, 1521 UI, release and hook tests); npm run smoke passed (393). cargo deny check passed (licenses, advisories, sources).

    For the merge agent/owner: the research notes moved to harnessmux on its own branch agent/DEV-503 (commit 55b90cc in worktree ~/.t3/worktrees/harnessmux/DEV-503, not merged or pushed). The owner's own profiles in ~/.lotar are all runner: t3; they keep working through the t3 agent.
