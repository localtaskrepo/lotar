description: |-
  Found (chief of staff, 2026-11-18): lotar 0.15.4 includes DEV-652 (da8d50d0e), which should settle a completed t3 job's thread when the ticket doesn't wait for a person (owner 2026-11-17: "moving threads into settled that I didn't need to look at are also a good idea"). No job does it. 20 finished job threads of Done, Reviewing and Merging tickets across lotar, standards, local, gairola, mailgpg and autospec stayed unsettled, and the owner reads them as spam. None of the t3 job logs since the install has a note from settle_t3_thread, neither 'Settled the T3 Code thread', 'was not settled' nor 'stays active'. Example: job-20261118T185623.076Z-10 (DEV-629) ends with agent_job_completed, then 'DEV-629 is now Reviewing, assigned to @review', and nothing after that. Settling by hand worked on the same session: `harnessmux settle lotar-95e687-DEV-629-fix` returned the thread link. So one of the silent early returns in crates/lotar-agent/src/services/agent_job_service.rs settle_t3_thread fires: the registry entry or its session_id is missing, the runner is not 't3', or agent_runner::registry().load(&session) fails.

  Check: run one t3 job to completion on a ticket that moves to an agent-assigned status (e.g. Reviewing, @review). Its thread lands in T3's Settled group, and its log carries 'Settled the T3 Code thread <link>'. A HelpNeeded ticket or one assigned to a person keeps its thread active and logs 'stays active'.

  Done when: the cause is fixed, with a test that failed before the fix; every early return in settle_t3_thread logs a job note saying why it didn't settle; the check above passes live after the release.
