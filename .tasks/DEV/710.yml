- date: 2026-11-18T20:00:36.631324+00:00
  author: claude
  text: |-
    Cause: 0.15.4 doesn't contain DEV-652. Fixed the silent exits; the live check needs release 0.15.5.

    - Tag `v0.15.4` is `592abd9c4`, before DEV-652 `da8d50d0e`; DEV-652 is in release 0.15.5 (`.tasks/@releases/10.yml`)
    - The installed binary has none of the settle notes (`grep -a "Settled the T3 Code thread"` in `/opt/homebrew/Cellar/lotar/0.15.4/bin/lotar` finds 0), and the DEV-629 log still carries the pre-DEV-652 "Pointed agent/DEV-629 at t3/…" note
    - On main, the settle already works: `dev503_harness_jobs_test.rs` covers settling, staying active, and a refusal
    - `settle_t3_thread` now notes "was not settled: the job has no harnessmux session" and "… session X can't be read: …" instead of returning silently
    - Two exits stay silent, on purpose: a job that isn't a t3 job (it has no thread) and a job no longer in the registry (there's no log to note in)
    - New test `a_t3_job_that_cannot_settle_its_thread_says_why` failed before the fix and passes after it
