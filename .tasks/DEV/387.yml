description: 'Found: while merging DEV-383 (2026-11-12), one full npm run test:agent run failed this test at tests/dev318_t3_runner_test.rs:442 with SerializationError("Invalid context payload: EOF while parsing a value at line 1 column 0"): it read the context payload while it was still empty or half-written. Five runs of the file alone and the next full run passed. Check: cargo nextest run --test integration dev318_t3_runner_test under full-suite load (npm run test:rust:agent). Done: the test, or the code that writes the payload, no longer reads an empty or partial file, and repeated full-suite runs pass.'
