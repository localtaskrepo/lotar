- date: 2026-11-22T15:41:01.500671+00:00
  author: claude
  text: |-
    Review: blocking. The picker itself works well, but two "Done when" items aren't met and the screenshot set is incomplete.

    **What I read and reran on `a7cd6024f`**
    - Read the diff (25 files), the ticket, and the 23:38Z and 02:49Z comments.
    - `npm ci` passed. Frontend lint (vue-tsc, oxlint, eslint, prettier) passed.
    - `npm run test:ui:agent`: 1581/1581 passed.
    - `npm run build:smoke`, then the 5 touched smoke specs (`test:smoke:quick`): 22/22 passed.
    - I didn't rerun the Rust tests, clippy or the full smoke suite: the diff touches no Rust code.
    - My own screenshots (1920/1440/390 px, light and dark) of the task panel, the search and the Run dialog look right. Typing "light" + Enter picks `@fix-light`. Escape closes only the picker, and focus goes back to the button. The phone sheet and "No match" work.

    **Blocking**
    1. **Agent order doesn't match "Done when".** "Done when" asks for roles in the order of their first profile (`fix`, `review`, `merge`) and variants in config order. The build shows roles alphabetically (`fix`, `merge`, `review`, `triage`) and variants by name (`fix-codex` before `fix-light`).
       - Where: `view/utils/assigneeOptions.ts:88-104`. The server sorts by name (`crates/lotar-lib/src/routes/agents.rs:40`), and the config is a `BTreeMap` (`crates/lotar-core/src/config/types.rs:1244`), so the config order is lost.
       - The fix agent decided to deviate on its own and only mentioned it in a comment. Either keep config order (an order-preserving map, and drop the sort), or ask the owner to accept name order and update "Done when".
    2. **Agent descriptions never show.** The API always sends `description: None` (`crates/lotar-lib/src/routes/agents.rs:28`), so no agent row ever has the second line that "Done when" asks for.
       - The smoke fixture sets a `description` for `fix-light` (`smoke/tests/ui.agent-jobs.smoke.spec.ts:579`), but no test checks that it shows.
       - Adding a description key to the config needs the owner's decision. Ask him, or have him drop the item from "Done when".
    3. **Screenshots are missing.** None are at 1920 px. The Run dialog has no 1440 dark shot, bulk Assign has no dark or phone shot, and the rule editor has only one width.
       - Fix: attach the missing before and after shots.

    **Not blocking**
    - Search, keyboard, Recent, Special group, Run dialog (agents only) and bulk Assign match "Done when". I found no stray files and no second branch.
    - I filed no minor tickets.
    - Note: my first `lotar add` in a scratch folder used the job's `LOTAR_TASKS_DIR`. It created an untracked `.tasks/PICK` in the main checkout, which I deleted right away. Nothing tracked was touched.
