- date: 2026-11-21T23:38:35.065578+00:00
  author: claude
  text: |-
    Assignee picker done: one searchable picker for the task panel, bulk assign, the agent Run dialog and the rule editor.

    - Groups: Unassigned, Recent (last 4 picks), You, People, then **Agents** by role (the profile name up to the first `-`). Each agent shows its runner · model · effort · provider.
    - Typing searches name, runner, model and description; a value nobody has gets an "Assign to …" row. Arrows, Enter, Esc, PageUp/PageDown; on a phone it opens as a bottom sheet.
    - Run dialog lists agents only; the rule editor adds the specials (`@reporter`, `@assignee`, …) and replaces the old datalists.
    - Docs: new "Assignee picker" bullet in `docs/help/serve.md`.

    Differs from Done-when:
    - Variants show the base profile first, then by name: the server sorts profiles, so config order isn't available.
    - Descriptions show only when the API sends one. The profile config has no description key yet, so today none show. Adding the key is your call.
    - Home/End jump in the list only while the search is empty; in text they move the cursor.
    - No role config key added: the role comes from the name.

    Screenshots, before → after:
    - Panel 1440 light: [before](attachment:before-panel-light-1440.01c5790c7b4f3981145bba18fc75451f.png) → [after](attachment:after-panel-light-1440.168f3b496f1073d6cf46e8cafbbee719.png)
