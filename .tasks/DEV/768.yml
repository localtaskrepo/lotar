  text: |-
    Review: passed. All three earlier blocking findings are fixed in `f6a3671d2`, and the description line works end to end.

    **What I read and reran**
    - Read the ticket, all 12 comments, the full diff (35 files), and the Rust and docs changes since `a7cd6024f` line by line.
    - Main is 21 commits ahead. `git merge-tree` shows no conflicts, and no main change touches `agents`/`agent_profiles`.
    - `npm ci` passed. `npm run lint:agent` passed (clippy, fmt, vue-tsc, oxlint, eslint, prettier).
    - `cargo nextest -p lotar-core`: 182/182 passed. It ran with `RUSTC_WRAPPER=` because sccache failed with "Failed to create temp dir".
    - `cargo nextest -p lotar-lib` on agent profiles, dev209 and config: 280/280 passed.
    - `npm run test:ui:agent`: 1581/1581 passed.
    - `build:smoke`, then the 5 touched smoke specs: 22/22 passed.
    - Not run: the full Rust suite and the full smoke suite. The fix agent reports both passed.

    **Checked against Done when**
    - Order: profiles stay in config order (`IndexMap`; project profiles override global ones in place), so it shows `fix`, `fix-light`, `fix-fable`; `review`, `review-claude`; `merge`.
    - Descriptions: the owner answered "add" (2026-11-22). `agents.<name>.description` is trimmed, left out when empty, documented in `config-reference.md` and covered by the REST test and smoke.
    - Screenshots: the attached set covers 1920, 1440 and 390 px in light and dark, plus all 9 skins, and the `dev768-desc-*` shots. I found no visible problem in them.
    - My own screenshots of the task panel (served from this branch, 6 profiles with and without descriptions, 1920/1440/390 px, light and dark) look right. The description shows as the second line. Typing "cheaper" finds `@fix-light` by its description, and Enter assigns it and puts focus back on the button. The phone view is a bottom sheet.

    **Minor (filed, not blocking)**
    - [DEV-829](https://lotar.pyxzl.net/task/DEV-829): `docs/help/serve.md` (Assignee picker bullet) still says search matches "name, runner, model, effort or provider". It leaves out the description. `docs/help/api-quick-reference.md` also leaves `description?` out of the profiles field list.
