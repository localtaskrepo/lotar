description: |-
  The task panel's assignee menu is hard to read and pick from now that there are many agent profile variants. It's a native `<select>` (`view/components/task-panel/TaskPanelOwnershipSection.vue` :36-63 via `UiSelect`) with people and every `@fix`, `@fix-light`, `@fix-fable`, `@fix-retry`, `@review-claude`, `@merge`… in one alphabetical list (`view/composables/useTaskPanelOwnership.ts` :71-87). It shows no runner, model or effort and has no search. "Custom…" swaps in a text field. The owner asked on 2026-11-21 for this select to "be rebuilt in a better way".

  Related pickers that should use the same component:

  - Run agent dialog: raw `<select>` showing `@name · runner` (`view/components/AgentRunDialog.vue` :38-45).
  - Bulk Assign dialog: free text with a "Use @me" button (`view/pages/TasksList.vue` :290-331).
  - Automation rule editor: `<datalist>` (`view/components/automation/AutomationRuleDialog.vue` :564-580).
  - Reporter field: the same select as assignee.

  ## Plan

  - [ ] A combobox component (for example `view/components/AssigneePicker.vue`): a button showing the current value (avatar or agent glyph, name, short detail) that opens a popover with a search field and a grouped listbox. Build on ThemeSelect's popover listbox and `useSuggestList` / `useListKeyNavigation`, with full ARIA combobox semantics. On a phone it is a sheet.
  - [ ] Groups:
    - **You** (whoami).
    - **People** (members, task values).
    - **Agents** grouped by role, as the owner chose on 2026-11-21: "By role". Base profile first, variants under it: `fix`, then `fix-light`, `fix-fable`, `fix-retry`, `fix-codex`; then `review`, `review-claude`, `review-light`; then `merge`.
    - Each agent row shows runner · model · effort (· provider) and the profile's description as a second line, from `AgentProfileInfo` (`view/api/types.ts` :1905). The composable keeps only the name today.
  - [ ] Role = the profile name up to its first `-`, unless a profile config says otherwise. Find out whether a `role`/`group` key is worth adding; ask before adding config.
  - [ ] Search matches name, runner, model and description. Recent picks first (per viewer, `localStorage`, guarded). Typing a name that isn't listed offers "Assign to '<typed>'", replacing Custom…. "Unassigned" stays first.
  - [ ] Use it in the task panel (assignee and reporter), the Run agent dialog, bulk Assign and the automation rule editor.
  - [ ] Tests: vitest for grouping, search and keyboard. Update the smoke specs that call `selectOption` on `#task-panel-assignee-select` (`ui.agent-jobs.smoke.spec.ts` :589, `ui.members.smoke.spec.ts` :88) and add one that picks an agent variant by search.
  - [ ] Skill ui-review: light and dark, every theme skin, phone width, before and after screenshots attached.

  ## Done when

  - [ ] With all of this repo's profiles, the right variant can be found and picked by typing or by keyboard in a few keystrokes, and each row says what it runs.
  - [ ] `AssigneePicker` (`view/components/AssigneePicker.vue`): a button shows the current value (avatar initial or agent glyph, name, short detail); click, Enter, Space or ArrowDown opens a popover with a search field (`role="combobox"`, `aria-expanded`, `aria-controls`, `aria-activedescendant`) over a grouped `role="listbox"`.
  - [ ] Order: **Unassigned** first (where the field may be empty), then **Recent** (up to 4, only while the search is empty), **You**, **People**, **Agents** with one sub-heading per role. Base profile first, variants in config order: `fix`, `fix-light`, `fix-fable`, `fix-retry`, `fix-codex`; `review`, `review-claude`, `review-light`; `merge`. Roles in the order of their first profile.
  - [ ] Role = profile name up to its first `-`. No `role`/`group` config key is added (the prefix groups every profile here; adding config waits for the owner).
  - [ ] Each agent row: `@name`, then `runner · model · effort · provider` (only the parts set), the description as a second line.
  - [ ] Search: every typed word must match the name, runner, model, effort, provider or description (any order, case-insensitive). The first match is active, so Enter picks it.
  - [ ] A typed value that is no listed name offers "Assign to “<typed>”" (reporter: "Set reporter to “<typed>”") as the last row; this replaces Custom…. Where custom values aren't allowed (Run agent) it shows "No match".
  - [ ] Which wins: a value that is both whoami and a member shows once, under You; `@name` of a known profile shows only under Agents; an unknown `@name` or a current value no list knows shows under People.
  - [ ] Keyboard: ArrowUp/Down, Home/End move across groups; Enter picks; Escape closes the popover and is consumed (the task panel stays open); Tab closes it; focus goes back to the button after a pick or Escape.
  - [ ] Recent picks are stored per viewer in `localStorage` (`lotar.assigneePicker.recent`). Storage missing, full or holding bad JSON: no Recent group, no error.
  - [ ] Profiles fail to load: the Agents group is empty, people and typed values still work.
  - [ ] Phone width (≤ 640 px): the popover is a bottom sheet over a backdrop; tapping the backdrop closes it.
  - [ ] Task panel: assignee and reporter use it; a pick saves the field at once (edit mode) as before; the Custom… option and "Use list" button are gone.
  - [ ] Run agent dialog: agents only (no Unassigned, no typed value); picking one sets the profile, its model and effort show as before.
  - [ ] Bulk and single Assign dialog (tasks list): the picker with You, People, Agents and typed values; submit is disabled while empty; the last assignee is preselected as before.
  - [ ] Automation rule editor: assignee/reporter values (condition `=`/`≠`, changes from/to, Set) use the picker with a **Special** group (`@assignee`, `@reporter`, `@me`, `@least_busy`… or `@agent`, `@user`, `@any` for conditions) with their descriptions; `in` and `matches` keep the text field.
  - [ ] Tests: vitest for grouping, search, recent storage and keyboard; smoke specs that used `selectOption` on `#task-panel-assignee-select` pick through the picker; a new smoke picks `@fix-light` by typing "light".
  - [ ] Skill ui-review: light and dark, every theme skin, phone width; before and after screenshots attached.
