- date: 2026-11-24T17:04:04.358081+00:00
  author: claude
  text: |-
    Built `lotar add --finding <key> --bundle <name>`: a day's findings share one bundle ticket.

    - First report of the day creates `Health <date>: <title>` with field `finding_bundle: health:<date>`. Later reports with new keys add the key to `finding` and a section to the description, and bump the title (`... and 1 more`). Output: `state: bundled`.
    - Same day, new ticket: a bundle in `InProgress`, `Reviewing`, `Merging`, done or won't do takes no new keys. The report starts a new bundle, so a running fix job never closes a finding it didn't see. Next day: new bundle.
    - Keys keep their meaning per key: a repeat report becomes a comment on the bundle, a won't-do bundle suppresses all its keys, and `lotar list finding=a:x` finds the bundle.
    - Joining holds the finding lock (`FindingService::join_bundle` in `crates/lotar-lib/src/services/finding_service.rs`).
    - The merge job's `finding_check` now runs once per key (`merge.rs`).
    - Docs: `docs/help/add.md#bundles`, `agent.md`, `mcp-tools.md`. `bundled` added to `api_types.rs`, `types.ts`, `openapi.json`. `--bundle` is CLI only.
    - Tests: `crates/lotar-lib/tests/dev800_finding_bundle_test.rs` covers all 3 code criteria. Criterion 4's standards switch is left for standards.
