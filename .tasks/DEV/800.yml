    Approve this lotar feature (a `--bundle` option for `lotar add --finding`)?

    - Why: STD-299 bundles the daily run's findings in standards; agent-filed findings need lotar to do the same.
    - Yes: an agent builds it as the Done when says. No: WontDo; agents keep one ticket per finding.
- date: 2026-11-23T01:32:23.697338+00:00
