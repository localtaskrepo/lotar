- date: 2026-11-24T17:05:03.662524+00:00
  author: claude
  text: |-
    Built `lotar add --finding <key> --bundle <name>`: findings of one day share one bundle ticket.

    - A key with no ticket joins the project's open bundle of today (`finding_bundle: health:<date>`). Its key goes into the `finding` list, a `## <title>` section goes into the description, and the title counts the findings (`Health 2026-11-24: Stale worktree and 1 more`). JSON state `bundled`.
    - No open bundle today: a new bundle ticket. The next day starts a new one.
    - A bundle in `InProgress`, `Reviewing` or `Merging`, done or won't-do takes no new keys. The report starts a new bundle that day, so a fix job never closes a finding it didn't see (criterion 3).
    - Each key keeps its meaning: a repeat report goes to the bundle as a comment, a won't-do bundle suppresses all its keys, and `lotar list finding=a:x` finds the bundle.
    - Joining holds the finding lock. The merge job's `finding_check` now runs once per key (`merge.rs`).
    - Docs: `docs/help/add.md#bundles`, `agent.md`, `mcp-tools.md`. `bundled` was added to `api_types.rs`, `view/api/types.ts` and `openapi.json`. `--bundle` works in the CLI only.
    - Tests: `crates/lotar-lib/tests/dev800_finding_bundle_test.rs` (criteria 1–3) plus unit tests in `finding_service.rs`.
    - The first smoke run hit its 10-minute limit while waiting for DEV-798's check lock. The rerun passed.
