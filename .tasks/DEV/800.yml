  author: claude
  text: |-
    Review: passed. Commit `65b240a99` does what the three code criteria of "Done when" ask. I filed two follow-ups: one needs an owner decision, the other is a missing test.

    - **Read:** the diff of `main..agent/DEV-800`, the ticket and the fix agent's comments, STD-299, the health rules in `.tasks/DEV/automation.yml`, skill `lotar-workflow`, and the main commits to the touched files since the branch started. The branch rebases cleanly onto main (`git merge-tree`).
    - **Reran:** `npm ci` passed. `cargo nextest run -p lotar-lib -E 'test(dev800) | test(dev317) | test(dev562) | test(finding_service)'`: 17 of 17 passed. That covers the new bundle tests, and the older finding tests still pass. The worktree is clean afterwards. lint, the full test suite and smoke weren't rerun: the merge runs them.
    - **Criteria:** 1) two keys on one day share one ticket, and the next day starts a new one; 2) `finding=a:x` finds the bundle, and a won't-do bundle suppresses its keys; 3) a bundle in `InProgress`, `Reviewing` or `Merging` takes no new keys, and the report starts a new bundle, which the ticket allows. 4) Switching standards to `--bundle health` is left for standards, as the ticket says. The REST types agree: `api_types.rs`, `view/api/types.ts`, `openapi.json`.
    - **Not blocking, needs the owner (DEV-864):** "Health: start the fix agent" starts the fix agent as soon as a health ticket is created, and job_started sets `InProgress`. So a bundle usually takes no more findings after its first, and agent findings spread over the day still get about one ticket each. The tests pass because they run without these rules. Before standards switches to `--bundle health`, the owner should pick how bundles start their fix agent.
    - **Minor (DEV-863):** no test covers the merge's `finding_check`, before this change or after, and it now loops once per key (`merge.rs`, `fn finding_check`).
    - **Filed:** [DEV-864](https://lotar.pyxzl.net/task/DEV-864) (HelpNeeded, question to mallox), [DEV-863](https://lotar.pyxzl.net/task/DEV-863).
