  text: Can't we add a custom field for this? Does this need to be a feature? (answered in INBOX-646)
- date: 2026-11-23T05:39:50.543336+00:00
  author: claude
  text: |-
    Partly: the `finding` custom field already holds a list, but a custom field alone won't put a new report into today's bundle. That still needs a small change in `lotar add`.

    - Already works: `FindingService::prior` (`crates/lotar-lib/src/services/finding_service.rs`) matches any value of a list `finding` field. A ticket with `finding: [a:x, b:y]` already turns a repeat report into a comment, a won't-do already suppresses both keys, and `lotar list finding=a:x` already finds it. So done criterion 2 needs no new code.
    - Missing: `lotar add --finding b:y` finds no ticket for `b:y` and creates a new one. To join the bundle, an agent would have to run 4 steps itself: look up the key, list today's open `bundle=health:<date>` ticket, add the key to its field, then comment. The finding lock (`.finding.lock`) doesn't cover those steps, so two agents at the same moment would create 2 bundles or drop a key. A job already running on the bundle would also miss the new report (criterion 3).
    - Smallest build: in `FindingService::report`, when no ticket has the key and `--bundle` is given, add the key and a section to the project's open bundle ticket created today, under the same lock. Otherwise create the bundle ticket. If the bundle is InProgress, Reviewing or Merging, start a new bundle. That's about one function plus tests and the `add.md` docs.
    - My recommendation: build `--bundle` like this, with no new field type and no other changes.
