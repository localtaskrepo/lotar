description: |-
  Standards STD-299 (owner 2026-11-22, his pick verbatim: "Bundle health findings"): one health ticket per repo per day collects that day's findings. The daily `repos.ts --report` run now does that itself (finding `health:<date>`, one section per finding). Agents that file a problem during the day (`lotar add --finding <check>:<subject> --tag health`, about 55 tickets in 72 h besides flaky tests) still get one ticket each: lotar has no way to add a new key to an open ticket.

  Proposal: `lotar add --finding <key> --bundle <name>`: with no ticket for the key, the report goes into the project's open ticket of bundle <name> created today (a section and the key added to the ticket), else a new bundle ticket; `finding=<key>` lists the bundle too; open, won't-do and done keep their current meaning per key. Open question for the design: a report added while the bundle's fix job runs, reviews or merges must reach that job or start a new bundle, so it isn't closed unfixed.

  Done when:
  - [ ] Two `lotar add --finding a:x --bundle health` and `--finding b:y --bundle health` on one day give one ticket that lists both keys; a third on the next day gives a new ticket.
  - [ ] `lotar list finding=a:x` finds the bundle; a won't-do bundle suppresses its keys.
  - [ ] A report while the bundle is in a job (InProgress, Reviewing, Merging) is not lost (reaches the job or starts a new bundle).
  - [ ] Docs (findings help) describe it; standards then switches the global rule and repos.ts to `--bundle health`.
tags:
- proposal
