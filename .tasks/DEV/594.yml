- date: 2026-11-16T02:30:09.319041+00:00
  author: claude
  text: |-
    Review: passed. The fix does what "Done when" asks; two minor findings filed.

    - Read: diff `main...043e01bd` (`agent_job_service.rs`, `dev503_harness_jobs_test.rs`, `docs/help/agent.md`), the ticket and its comments, related DEV-573/581/584/585, AGENTS.md, and main's recent commits to these files (DEV-520 `40670683`, DEV-596 `b2bab7f9`, DEV-581 `e5762570`).
    - Covers the DEV-585 incident: the second job started at 21:55 while the resumed thread was `running` (21:10–22:07). Now the queue holds the entry (`is_ticket_busy` matches "already has an active job"), and production automation queues rather than starting directly, so "Answered in the thread" still works.
    - Usage-limit pause (thread reads `failed`) is left to [DEV-584](https://lotar.pyxzl.net/task/DEV-584), and the docs say so. Fine.
    - Test: the new test asserts the second start fails, which can't pass without the check. Reran the DEV-503 suite: 24/24 passed.
    - No second fix: `6d352640` on `agent/DEV-594` and the `t3/e4b9051b` and `t3/prevent-parallel-fix-jobs-1` branches is the same patch (`git range-diff` shows `=`), rebased onto a stale DEV-520 commit `3643595f`, not main's `40670683`. Merge from `043e01bd`.
    - Minor, filed: [DEV-599](https://lotar.pyxzl.net/task/DEV-599) calls `t3` once per earlier thread on every 300 ms queue retry, with a global lock held, because only a running result is cached. [DEV-600](https://lotar.pyxzl.net/task/DEV-600): a thread waiting for an answer reports `running`, so it holds later jobs without a comment, and the check ignores `activeRunId`.
    - I didn't touch the ticket's status or assignee (HelpNeeded, mallox, retry question pending).
