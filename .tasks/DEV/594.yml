- date: 2026-11-16T00:14:57.744466+00:00
  author: claude
  text: |-
    Fixed: no job on a ticket starts while T3 Code still runs an earlier job's thread on it.

    - Cause (job logs and T3 thread `mcp:c6c8c4b1…`): job `…205914.061Z-57` hit the Claude usage limit and failed after 4 s. T3 Code had only *paused* the turn, then resumed it at 21:10 ("Continue where you left off."). That thread ran outside any lotar job until 22:07 and committed `1011487e` on `agent/DEV-585`.
    - At 21:55 the next @fix job saw that worktree's uncommitted changes, so it started a new thread. `agent/DEV-585` was checked out there, so T3 put the new thread on `t3/fix-flaky-watcher-mcp-event-tests` → `d6dbec07`.
    - Fix (`agent_job_service.rs`, `running_t3_thread`): before a job starts, lotar runs `t3 thread show` for the ticket's earlier t3 jobs' threads. If one is `running`, the job gets "already has an active job: T3 Code still runs the thread … of the job …". The queue keeps the entry until the thread ends (and checks again every 30 s). When the thread ends, the next fix job continues it on `agent/<ID>`, so the branch matches the prompt.
    - Test `no_job_starts_while_t3_code_still_runs_an_earlier_jobs_thread` (`dev503_harness_jobs_test.rs`): fails before the fix.
    - Test cleanup: the extra start-up work exposed an existing race in 4 harness tests. They ended while a job still finished writing, which left `.lotar-test-scratch` behind. They now wait for jobs and the queue worker to end (`wait_for_jobs_to_end`); 0/8 leaks per test after the change, 2–6/8 before.
    - Docs: `docs/help/agent.md` (T3 section, queue).
    - Not covered: during T3's pause the thread reads `failed`, so the @fix-codex retry can still start then. That is the usage-limit pause in [DEV-584](https://lotar.pyxzl.net/task/DEV-584) (Blocked); I added this evidence there.
