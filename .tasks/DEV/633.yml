  text: |-
    Review: passed. `df1790ea` keeps job end rules whose checkpoint a full disk refused and runs them once the checkpoint saves. That is what "Done when" asks.

    - Read: the diff (`automation_service.rs`, `agent_queue_service.rs`), the ticket and the fix comment, DEV-543/DEV-604, `docs/help/agent.md`, and the last commits on main to both files. The commit merges cleanly onto main (`git merge-tree`). Its 3 other commits are already on main under new hashes (DEV-620/632/624).
    - Logic: `acquire_storage_lock` keeps the error kind, so ENOSPC arrives as `StorageFull`. The kept copy is saved only if no checkpoint exists, and the replay runs it. The recorded outcome waits behind it, as in DEV-543. The worker loop and a 30 s thread both retry.
    - Test before the fix: not run. On the old code the checkpoint is never saved, so `PX-1` stays `Todo` and the test's `Done` assert fails.
    - Reran: `cargo nextest run -p lotar-lib --lib automation_service` 17/17 passed (both new tests included). `cargo clippy -p lotar-lib --all-targets`: clean. `cargo nextest run -E 'test(/outcome|end_rule|end_action|queue|job_failed|job_completed/)'`: 44/45 passed. The failing test is `a_queue_entry_held_by_a_waiting_thread_says_so_once`, the known DEV-613 flake: it failed 3 of 7 runs and passed the rest.
    - Not rerun: the full `npm run lint`, `npm test`, `npm run smoke`, and the ticket's check on a really full disk.
    - Minor, filed: [DEV-641](https://lotar.pyxzl.net/task/DEV-641): `docs/help/agent.md:238` doesn't mention the full-disk case. [DEV-642](https://lotar.pyxzl.net/task/DEV-642): every checkpoint error is kept, not only transient ones. A permanent one retries forever and keeps the worker from exiting. Both depend on DEV-633.
