- date: 2026-11-17T01:28:18.972368+00:00
  author: claude
  text: |-
    Fixed: end rules a full disk keeps from their checkpoint are now kept and run once it saves.

    - Cause: `apply_durable_end_action` failed opening the checkpoint lock (ENOSPC) before writing the checkpoint, so the replay had nothing to run.
    - Now that job end stays in this process's memory (`UNSAVED_END_ACTIONS`); every look for pending outcomes (worker poll, plus a 30 s retry thread for server and MCP jobs) saves the checkpoint and the normal replay runs it. Nothing had run yet, so a retry can't apply anything twice.
    - The queue worker doesn't exit while such end rules wait (`agent_queue_service.rs`); the job's recorded outcome waits behind them, as it does for a saved checkpoint (DEV-543).
    - A step that fails with ENOSPC (`StorageFull`) keeps its checkpoint instead of dropping it, like a busy lock does.
    - Limit: if the process exits before the disk frees up, the kept end rules are lost (there was no disk to write them to).
    - Tests: `end_rules_whose_checkpoint_cannot_be_saved_run_later`, `a_step_refused_by_a_full_disk_is_retried` in `automation_service.rs`.
