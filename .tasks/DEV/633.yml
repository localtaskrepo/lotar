description: |-
  Found in LOCA-493: DEV-625's review job `job-20261117T001051.648Z-6` failed at 00:10Z (T3 setup script exited 1 while the disk was full), then its end rules failed: "Cannot open storage lock .../agent-queue/end-actions-.../*.lock: No space left on device (os error 28); mutation was not run" (`lotar agent logs job-20261117T001051.648Z-6`). Nothing retried them, so "Review failed: merge without it" never ran and the ticket stayed Reviewing/@review with no job. repos.ts `nextStep` skips tickets whose last job failed (it leaves them to the failure rules), so the live check could only report the stall, not recover it. DEV-604 pauses the queue on a full disk before a job starts, but doesn't cover a job that is already running.

  ## Check
  After an end-rule run fails with an IO error, `lotar agent logs <job>` shows it ran later (or the ticket was moved by the job_failed/job_completed rule) once the disk has space again.

  ## Done when
  End rules that fail on a transient IO error (ENOSPC, lock) are kept and retried, e.g. by the queue worker, until they run once.
