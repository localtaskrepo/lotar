comments:
- date: 2026-11-27T17:50:57.185843+00:00
  author: claude
  text: |-
    Fixed both QA failures in `c1ae45be8`; the Windows build of `lotar-agent` checks clean.

    - Windows: `hosted.rs` now imports and uses `UnixListener`/`UnixStream` only under `cfg(unix)` (`listen`, `accept`, `serve`). On Windows, `Bridge::open` returns "a job on an agent host needs Unix sockets".
    - Git identity: lotar's `git_command` drops every `GIT_CONFIG*` variable, so the fixture's `GIT_CONFIG_GLOBAL` never reached lotar's own commits. The identity came from the Mac's `~/.gitconfig`, and the CI runner has none. The fixture now writes `.gitconfig` into its temp root and sets `HOME` to that root.
    - Reproduced first: with an empty `HOME`, 6 of the 23 hosted tests failed with "empty ident name". After the fix, 23/23 pass.
    - 74 changed lines, so no `small-diff` tag.
  report:
    commits:
    - hash: c1ae45be8
      what: gate hosted.rs's Unix sockets by cfg(unix); fixture identity in HOME
    checks:
    - command: HOME=<empty dir> cargo nextest run -p lotar-agent --lib hosted::tests
      result: passed
      reason: 23/23, 6 failed before the fix
    - command: cargo clippy -p lotar-agent --target x86_64-pc-windows-gnu
      result: passed
    - command: cargo clippy -p lotar-agent --all-targets
      result: passed
    - command: npm run lint
      result: passed
    - command: cargo check --workspace --target x86_64-pc-windows-gnu
      result: not_run
      reason: ring needs mingw gcc, not installed here; lotar-agent alone checks clean
    - command: gh run list --workflow "Quality Assurance" --commit <main head>
      result: not_run
      reason: runs after the merge
    next: Review, merge, then confirm QA is green on main
- date: 2026-11-27T17:53:27.152471+00:00
  author: claude
  text: |-
    Review: blocking. The Windows binary now builds, but the Windows QA job's next step still fails, so "QA green on main" isn't met.

    - Read: `c1ae45be8` (only commit on `agent/DEV-938`), the ticket, `.github/workflows/ci.yml` Windows job, `git log -5 main` for `hosted.rs` and `agent_hosts.rs`.
    - Passed: `cargo check -p lotar-agent --target x86_64-pc-windows-gnu --all-features` is clean. `HOME=<empty dir> cargo nextest run -p lotar-agent hosted::` 23/23 pass. The `HOME` fixture fix matches what DEV-812/DEV-416 did.
    - **Blocking:** the Windows job in `ci.yml:612` runs `cargo check --profile ci --all-targets --all-features`, so unit tests are compiled for Windows too. `cargo check -p lotar-agent --target x86_64-pc-windows-gnu --all-targets --all-features` fails with 7 errors (`cannot find unix in os`, `Permissions::from_mode`):
      - `crates/lotar-agent/src/services/agent_job_service/hosted.rs:673` and `:688`, in the `#[cfg(test)] mod tests` this commit touches
      - `crates/lotar-agent/src/services/agent_hosts.rs:753`, `:757`, `:782`, `:790`, `:794`, in the `fake_ssh` test helpers from DEV-901/DEV-911
      - The earlier "Build binary" failure hid these. Once it builds, CI reaches this step and fails there.
    - Fix: gate these Unix-only tests with `#[cfg(all(test, unix))]` on `hosted.rs`'s `mod tests` and on `agent_hosts.rs`'s unix-dependent tests. Then rerun the `--all-targets` Windows check above, which works here without MinGW.
    - Non-blocking: `agent_job_service.rs:7718`, unused `std::io::Write` on Windows tests (a warning only; CI sets no `-D warnings`).
