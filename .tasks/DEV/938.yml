description: |-
  Found: every Quality Assurance run on main since `227942904` (DEV-901) fails; the last green one is `2cbbf322a` (DEV-902). It blocks the v0.16.1 tag (DEV-924).

  - Windows (`Windows Binary Sanity`, `Release target build (Windows arm64)`): `error[E0433]: cannot find unix in os` at `crates/lotar-agent/src/services/agent_job_service/hosted.rs:25` (`use std::os::unix::net::{UnixListener, UnixStream};` not gated by `cfg(unix)`).
  - Linux `Rust Quality Checks` (run `46041622870`): `hosted::tests::a_headless_agent_runs_over_ssh_in_the_worktree_there_with_the_profile_env` panics at `hosted.rs:665`: `git commit: fatal: empty ident name ... not allowed`. The test fixture needs a git identity, as DEV-416 fixed for another test.

  Check: `gh run list --workflow "Quality Assurance" --commit <sha>` succeeds for main's head.
  Done when: QA is green on main.
