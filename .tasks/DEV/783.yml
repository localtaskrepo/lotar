comments:
- date: 2026-11-22T08:38:28.396704+00:00
  author: claude
  text: |-
    A failed merge check now reruns once on its own; it lands without @merge when the rerun passes.

    - `crates/lotar-agent/src/services/agent_job_service/merge.rs`: new `check()` reruns a failed check right away, before the next one starts. The checks already run one at a time, so no other check of this merge runs beside it. Only a second failure hands off to @merge.
    - The job log says `Rerunning the check <cmd> once on its own: its first run failed`. The report lists both runs (`failed`/"first run; the rerun passed", then `passed`/"rerun"). The comment quotes the first run's output.
    - Not rerun: `install`, `finding_check`, a check that couldn't start. Rebase conflicts hand off as before.
    - Tests in `dev605_merge_without_agent_test.rs`: `a_check_that_fails_once_then_passes_lands_without_an_agent` (new); `a_failed_check_hands_off_with_its_output` now expects two failed runs.
    - Docs: `docs/help/agent.md`, `agent.merge` steps.
    - Side note: `-p lotar-lib` fails `a_failed_jobs_thread_is_settled_once_a_later_job_completes` on HEAD too, because it runs a stale binary (known, DEV-761). It passes with `--workspace`.
  report:
    commits:
    - hash: 029efdbb7
      what: lotar's merge reruns a failed check once before handing off
    checks:
    - command: npm run lint
      result: passed
    - command: npm test
      result: passed
    - command: npm run smoke
      result: passed
    - command: cargo nextest run --workspace -E 'test(/dev605_/)'
      result: passed
    next: Review, then merge
