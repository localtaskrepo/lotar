description: |-
  Evidence 2026-11-21 (owner asked to speed the queue up; he picked this, 2026-11-21 ~19:00 PST): last 48 h 55 tickets, 189 jobs, 82.5 slot-hours on 3 slots; merge agent 34 jobs, median 34 min, 33 h; flaky-test tickets 27 h (DEV-748..761); load average 17-20 on 14 cores, 36 seen (DEV-755). Nearly every merge-agent job came from lotar's own merge failing a check that passes alone: sse_delivers_during_a_steady_stream_of_events (DEV-726, 730, 740, 744), the 'Created task' test (DEV-734, 742, 748-751), vitest worker timeouts (DEV-752), smoke timeouts (DEV-756, 761). Do: when a check fails, rerun that check once (no other check of this merge running) and merge if it passes; log both runs. Hand to @merge only when the rerun fails too or the rebase conflicts. Done when: a test shows a check that fails once then passes lands without a merge agent; the job log names the rerun.

  ## Done when

  Owner's words: "when a check fails, rerun that check once (no other check of this merge running) and merge if it passes; log both runs. Hand to @merge only when the rerun fails too or the rebase conflicts."

  - [ ] lotar's merge (`crates/lotar-agent/src/services/agent_job_service/merge.rs`): a check in `agent.merge.checks` that exits nonzero runs once more right away, before the next check starts (the checks run one at a time, so no other check of this merge runs beside it).
  - [ ] Rerun passes: the merge goes on with the next check and lands without the merge agent. The outcome comment's report lists both runs (`failed`, reason "first run; the rerun passed", then `passed`, reason "rerun"), and its steps say the first run failed, with its output's tail.
  - [ ] Rerun fails too: lotar hands off to @merge as today; the hand-off text and report name both failed runs, with the rerun's output.
  - [ ] Each check gets one rerun per rebase round (when main moves on and lotar checks again, a check may again fail once and rerun once).
  - [ ] The job log has a progress line naming the rerun (`Rerunning the check ... once on its own: its first run failed`).
  - [ ] Not rerun: a check that couldn't start, `install`, `finding_check` (it fails on its output, not by flaking): they hand off as today. A rebase conflict hands off as today.
  - [ ] Test in `crates/lotar-lib/tests/dev605_merge_without_agent_test.rs`: a check that fails on its first run and passes on its second lands without a merge agent, the comment and job log name the rerun; a check that always fails still hands off after two runs.
  - [ ] `docs/help/agent.md` (`agent.merge` steps) describes the rerun.
