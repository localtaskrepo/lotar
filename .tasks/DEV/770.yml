  text: |-
    A reset more than 7 days after the pause is now ignored: the job waits the default and its note says so.

    - `UsageLimit::ignored_reset` in `crates/lotar-agent/src/services/usage_limit.rs`: the named time, when it is past now + 7 days; `resume_at` then waits the default (1 h or `LOTAR_AGENT_USAGE_LIMIT_WAIT_SECONDS`). Exactly 7 days is kept.
    - Note in `agent_job_service.rs`: `… after the default wait (ignored the named reset <time>, more than 7 days away)`.
    - Unit tests for both cases; `dev584_usage_limit_pause_test.rs` now uses resets 3 days ahead (it used 2099) plus a new 2099 test: default wait, note, retry completes.
    - `docs/help/agent.md#usage-limits` updated. Only caller: `usage_limit_pause`. No other running T3 threads touched these files.
