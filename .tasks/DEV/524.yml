  author: claude
  text: |-
    Done in commit 500370cd on agent/DEV-524.

    - An agent job that waits for an open prerequisite now sets the ticket to Blocked (where the project has it), keeps its agent as assignee and comments "The @<agent> job waits for its open prerequisites: <IDs>." No reporter, no HelpNeeded, no blocked/blocked-by: tags (nothing read them, and nothing removed them). The "Prerequisites done" rule matches on status Blocked, and its tell_agent starts the ticket's own agent (assignee first).
    - The dependency check returns an error instead of a fake "dependency graph unavailable" prerequisite. It is tried 3 times, 500 ms apart, on top of the snapshot's own 500 ms lock wait. A check that still fails starts no job and parks nothing: it comments the reason on the ticket ("Assign @<agent> again to retry"), prints it and sends automation_failed. A failed check during `unblocked` is reported the same way, and the cross-repo run skips the ticket.
    - DEV-468 at 19:40Z took a different path: the merge agent itself set HelpNeeded/claude during its job, and that recorded outcome replaced the failure rule's @fix (DEV-320). No blocked tag was added. Filed as DEV-528.
    - Docs: help/automation.md (agent job queueing; the "When prerequisites are done" example now uses tell_agent, because a job-blocked ticket keeps its assignee and `agent:` starts a job only when the assignee changes), release-guide.md.
    - Tests: agent_assignment_with_an_open_prerequisite_blocks_the_ticket_until_it_is_done and agent_assignment_reports_a_failed_dependency_check_and_never_parks_the_ticket both failed on the old code (HelpNeeded instead of Blocked/Todo). dependency_check_retries_a_busy_lock_and_returns_an_error_when_it_stays (unit) can't compile against the old Vec return. Ran npm run lint:agent, test:agent and test:smoke:agent (401 smoke): all pass.
    - For the reviewer: the DEV rule's tell_agent message is written for @fix. A ticket parked while queued for @review or @merge now goes back to that agent with the same message. Its wording for those agents is the owner's call; I didn't change .tasks/DEV/automation.yml.
