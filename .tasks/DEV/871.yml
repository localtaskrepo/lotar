- date: 2026-11-26T19:40:39.167874+00:00
  author: claude
  text: |-
    Review: passed. `87d878d83` counts the jobs other live processes hold in their own job queue as Queued. One minor follow-up is filed as DEV-910.

    - Read: the diff on `main..HEAD` (one commit; nothing newer on the ticket branch), the comments, DEV-865 (its Done when names this follow-up), and the recent main commits to the 3 Rust files
    - `register_queued` and `unregister_queued` cover every place `pending_queue` changes (`start`, `cancel_job`, `reset_for_tests`, `process_pending_queue`), and `unregister` removes the record too. Both sides use the same canonical `dir(tasks_dir)`
    - `records_in` and `list_pending` only read `.json`, `.pending.json` and `.ended`, so a `.queued` file doesn't show up as a running job
    - `queued_elsewhere` skips this process's own records, so `lotar serve` doesn't count its own jobs twice. Records of dead pids are removed
    - DEV-865's sum rule is on main (`combined_stats`, `agent_queue_service.rs:1075`). The added line at `:558` builds on it
    - Test: `queued_counts_the_jobs_other_processes_queue` would give 3 instead of 4 without line `:558`
    - Minor, filed: DEV-910. `worker_state` (`:518`) still says `idle` ("nothing queued") when only `lotar serve` holds queued jobs, while Queued shows them
    - Not checked: a live `lotar serve` against the CLI (same as the fix agent). No UI changes, so no screenshots. No stray files
