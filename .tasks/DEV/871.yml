    old: |-
      Found in DEV-865.

      - A job queued in a process's registry (`registry.pending_queue`, e.g. a run started from the Agents page while the slots are full) lives only in that process's memory
      - `lotar agent queue` and every other process count the queue file's tickets and the running jobs' records (`agent_active_jobs`), not those queued jobs
      - Checked: `lotar serve` with 1 running and 1 queued job plus 3 queue-file tickets: the Agents page shows 4 Queued, `lotar agent queue` shows 3

      ## Done when

      - [ ] Every process counts the jobs queued in other processes for the same tasks directory (for example as records next to the running jobs' ones), so the CLI and the page show the same Queued
      - [ ] A dead process's queued records don't count
      - [ ] Rust test covers it
