- date: 2026-11-26T01:00:37.633350+00:00
  author: claude
  text: |-
    Every process now counts the jobs that other processes hold in their own job queue for the same tasks directory.

    - `agent_active_jobs.rs`: a job in a process's `pending_queue` writes `<job>.queued` (job, ticket, owner pid) next to the running jobs' records. `queued_elsewhere` reads them, skips this process's own records, and removes records of dead pids
    - `agent_job_service.rs`: the record is written where a job enters the queue (`start`) and removed where it leaves (`process_pending_queue`, `cancel_job`, `reset_for_tests`, `unregister`). If a write fails, the job still queues; other processes just don't see it
    - `agent_queue_service.rs`: `queue_stats` adds `queued_elsewhere` to Queued. The worker's exit check (`AgentJobService::queue_stats`) is unchanged
    - Tests: `queued_records_of_other_live_processes_count` and `queued_counts_the_jobs_other_processes_queue` (3 queue-file tickets + 1 live record from another process + 1 dead-pid record → 4)
    - `docs/help/agent.md`: the `lotar agent queue` line says Queued counts the jobs every process holds in its own queue
    - Depends on DEV-865 (not on main yet): main still takes `max(own, pending)`. My line is added after it, so it should merge without conflict. Only with both in place do the CLI and the page agree (4 and 4 in the ticket's case)
    - Not changed: the Agents page's Queued tab lists only what its own process knows. A job queued in another process counts at the top but isn't listed in the tab
    - Not checked: a live `lotar serve` against the CLI. The tests cover the counting rule
  report:
    commits:
