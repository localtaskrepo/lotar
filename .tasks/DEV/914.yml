  Found by the DEV-892 review, 2026-11-26. DEV-892 (`15a6d7cf1`) copied the standards automation.yml into `.tasks/DEV/automation.yml` at STD-354 and kept lotar's own rule 'Login expired: ask the owner to sign in' (DEV-835) after it. STD-370 (standards `380f51c2`, later the same day) puts its own 'Login expired' rule into the shared file. The next copy brings in both, so one auth pause files two sign-in tickets for mallox.

  ## Check
