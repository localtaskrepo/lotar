  text: |-
    Built: a continue job whose session the agent can't resume now starts a new session with the DEV-603 handoff instead of failing.

    - `open_session` (`crates/lotar-agent/src/services/agent_runner.rs`) now tells a refused resume/load (harnessmux `Protocol` error, e.g. `Resource not found: sessionId`) apart from other errors (`OpenSessionError::NotResumable` vs `Other`)
    - `run_session` (`agent_job_service.rs`) keeps the old session as `<name>.<last used>`, logs `This job would have continued the session <name>, but it could not be resumed (<error>), so it starts a new one with a handoff.`, and starts a new session with the handoff
    - Other start errors (missing agent program, files, sockets) still fail. A `t3` session also still fails, as DEV-738 decides (its thread may still run)
    - The handoff now says why it starts a new session (idle too long, couldn't be resumed, or a T3 thread in a T3-made worktree), not always "idle too long"
    - Tests in `dev503_harness_jobs_test.rs`: `a_continue_job_whose_session_cant_be_resumed_starts_a_new_one_with_a_handoff` (failed first: the job failed) and `a_continue_job_whose_agent_cant_start_still_fails`
    - `docs/help/agent.md` (Sessions) describes the fallback next to the idle case
