    old: |-
      Trigger: Quality Assurance CI run 37036203848 failed on current main 0f8d8da (2026-10-02). User-directed independent repair scope; historical Done tickets (DEV-72/76/77/78/79/80/81 and the CI-completion exception accepted by the developer) stay closed and are not reopened for this work.

      Enumerated failures to fix:
      1. Cold-run Rust Quality Checks cannot compile: the job neither builds nor downloads the frontend assets embedded by include_dir! from target/web-embed (src/web_server.rs:15), so Rust tests and coverage were skipped. CI must produce the embed inputs on a cold runner before cargo builds.
      2. Windows asset compression path bug: scripts/compress-web.mjs derives paths via URL.pathname, which on Windows yields a leading-slash drive form (/D:/...), producing malformed double-drive output paths after successful frontend compilation. Use portable fileURLToPath-equivalent conversion with unit coverage.
      3. Cargo.lock pins rustls 0.23.43, covered by advisory RUSTSEC-2026-0285 which requires >= 0.45. Bump the lockfile and verify the dependency tree still builds and tests green.
      4. Two smoke fixtures assume the initial branch of a freshly initialized repository is main; runners with a different default branch name break them. Make branch expectations explicit and portable (smoke git fixture helper and the affected api spec).
      5. Agent jobs queued-state snapshot race in the UI (queued job rendering versus snapshot updates).
      6. Custom-store attachment UI chip times out (15s) after removal; root cause pending. Diagnosis test first, minimal runtime fix only if the root cause requires it.

      Acceptance: all applicable targeted and full gates pass locally with no weakened checks: npm run lint; agent Rust/UI tests with default retries 0; build-first smoke with an actual Git probe when the invocation context permits, otherwise the Git-gated subset is explicitly excluded and reported, never claimed as covered; cargo audit and npm audit run with declared scope, addressing only warnings related to the change diff where feasible and never running a blind npm audit fix. True Windows CI evidence is unavailable without push and must remain an explicit developer-accepted exception; remote green is not claimed. No commits or pushes are authorized for this ticket.

      Constraints: all lanes work in the current shared checkout with isolated build targets; preserve existing changes from other workers; no repository Git operations; no foreign cleanup.

      Definition of done: coordinated lanes land, independent review passes, final gate evidence is recorded in this ticket, and remaining platform/CI evidence limits are documented explicitly.
