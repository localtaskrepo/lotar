description: |-
  Found (2026-11-14, during DEV-551): `merge_agent_that_hands_back_without_end_rules_does_not_land` (crates/lotar-lib/tests/agent_automation_integration_test.rs, added in ff7b5229 / DEV-516) passes alone but leaves `.lotar-test-scratch/<pid>-<nanos>/.lotar-worktrees/.tmpXXXX/NRH-1` (a git worktree with feature.txt, README.md, .git). scripts/rust-test-runner.mjs then fails the run: 'tests left 1 entries in the temp folder: .lotar-test-scratch'. The test's intermittent assertion failure is DEV-516's.

  Check: node scripts/rust-test-runner.mjs --agent merge_agent_that_hands_back_without_end_rules_does_not_land exits 1 with .lotar-test-scratch as the leftover after 1 passed.

  Done when: the test (and the merge job code path it drives, if that is what leaves the worktree) removes the worktree, and the check exits 0.
