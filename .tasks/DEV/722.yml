- date: 2026-11-19T19:55:36.511324+00:00
  author: claude
  text: |-
    Fixed: cleanup prunes the git entry of an agent worktree whose folder is gone, then deletes its branch.

    - `missing_worktree_entry` / `prune_missing_worktree` in `crates/lotar-agent/src/services/agent_job_service.rs`: finds the `.git/worktrees/<id>` whose `gitdir` points at the gone folder (locked entries stay) and deletes it, as `git worktree prune` would for that one entry only.
    - `cleanup_done_ticket_worktree` prunes it first; the branch then goes with the idle branches as usual (landed or superseded only).
    - `lotar agent worktree cleanup` does the same (`--dry-run` says "Would prune").
    - Test `cleanup_prunes_a_worktree_whose_folder_is_gone_and_deletes_its_branch` covers both paths; it fails without the fix.
