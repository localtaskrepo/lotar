- date: 2026-11-19T19:59:20.471998+00:00
  author: claude
  text: |-
    Review: passed. Cleanup now prunes the git entry of a gone agent worktree and deletes its branch, as "Done when" asks.

    - Reviewed `29cc68a92` (only commit in `main..HEAD`; ticket branch = HEAD).
    - `missing_worktree_entry` / `prune_missing_worktree` in `crates/lotar-agent/src/services/agent_job_service.rs`: removes only the `.git/worktrees/<id>` whose `gitdir` matches the gone path; locked entries stay, same as `git worktree prune`.
    - `cleanup_done_ticket_worktree` and `worktree_cleanup` in `crates/lotar-lib/src/cli/handlers/agent.rs` prune first. The branch then goes through the existing idle-branch path (`branch_removal`), so it is still deleted only when landed or superseded.
    - Test `cleanup_prunes_a_worktree_whose_folder_is_gone_and_deletes_its_branch` covers both paths. I didn't rerun it against the old code. Without the fix, `check_done_worktree_cleanup` fails on `canonicalize` and the branch stays checked out, so the test would fail.
    - No stray files, no second branch. Nothing in it is a decision only the owner can make.
    - Minor, filed: [DEV-723](https://lotar.pyxzl.net/task/DEV-723). Pruning leaves the renamed `.<name>.lotar-removed` trash folder behind.
    - Also minor, not filed: a `--dry-run` doesn't list the branch that would go after a prune, because git still lists it as checked out.
