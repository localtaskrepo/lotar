description: |-
  ## Found

  Review of DEV-721 (`2ce1b2ad8`): `remove_worktree_dir` in `crates/lotar-agent/src/services/agent_job_service.rs` renames the worktree aside, then deletes `.git/worktrees/<id>`. Cut off between the two, git still lists the worktree at a path that no longer exists (prunable). lotar never runs `git worktree prune`: `check_worktree_clean` fails on `canonicalize`, so every cleanup skips it, and `git branch -D` refuses the branch as checked out until git's own prune (gc, months later). The window is two syscalls wide, so rare.

  ## Check

  `git worktree list --porcelain` shows a `prunable` agent worktree whose ticket is Done.

  ## Done when

  Done cleanup (and `lotar agent worktree cleanup`) prunes the git entry of an agent worktree whose path is gone, then deletes its branch as usual; a test covers it.
