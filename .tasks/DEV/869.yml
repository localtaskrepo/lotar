description: 'Found while reviewing DEV-847: a rule with `run: {command: echo, args: [x]}` is listed as `runs {"command":"echo","args":["x"],"env":{},"cwd":null,"ignore_failure":false,"wait":true}`. `run_commands` in `crates/lotar-lib/src/cli/handlers/trust.rs` prints the serialized AutomationRunCommand with every default. Check: `lotar trust --status` in a repo with a structured run rule. Done: it reads like the command line (`echo x`), plus only the settings that differ from the default (env, cwd).'
