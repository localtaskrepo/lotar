comments:
- date: 2026-11-14T07:23:38.148933+00:00
  author: claude
  text: 'Fixed in 38015b94 on agent/DEV-527: npm scripts test:rust and test:rust:agent now run npm run build:web first (like build and build:smoke), so test:agent and npm test build target/web-embed themselves. CI is unaffected: it calls cargo nextest directly after its own build:web step. Updated the fresh-worktree notes in .github/skills/testing-strategy/SKILL.md and docs/developers/testing.md. Checks: reproduced the failure (embedded_web_ui_test panics without target/web-embed); after the fix, from a target with no web/web-embed, npm run test:agent passes (2151 Rust, 1537 UI, release and hooks tests); npm run lint and npm run smoke (401 tests) pass.'
- date: 2026-11-14T07:48:50.949749+00:00
  author: codex
  text: 'Review: passed. No findings in commit 38015b94 after reading full diff, ticket/comments, related DEV-519, guidance, main history, asset build/rebuild logic and CI. Both Rust test scripts build assets first; CI already does so independently. Existing regression test demonstrated the original failure. npm run lint passed. test:agent built web assets and compiled with RUSTC_WRAPPER= after sccache permission failures; embedded index assertion passed, but server startup failed (serve printed no URL) under sandbox restrictions. 2108/2151 tests were not run; temp guard reported xcrun_db. Full suite pass therefore not independently verified; UI/release/hooks and smoke not rerun. Fix agent reports all gates passed. diff --check passed; checkout clean. Files, commits, status and assignee unchanged. No follow-up tickets or durable guidance finding.'
