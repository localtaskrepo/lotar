description: 'Found in the DEV-519 merge (2026-11-13): npm run test:agent from a worktree without a web build fails, because tests/embedded_web_ui_test.rs needs target/web-embed/index.html.gz and test:agent (and test:rust) does not run build:web first. Check: in a fresh worktree run npm run test:agent without npm run build:web. Done: test:agent passes from a clean target (it builds the web assets first, or the test gets what it needs another way).'
