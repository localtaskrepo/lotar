ui:
  theme: synthwave:ice
default:
  project: DEV
server:
  public_url: https://lotar.pyxzl.net
agent:
  memory_gate:
    max_swap_percent: 95
  merge:
    checks:
    - npm run -s lint:agent
    - npm run -s test:agent
    - npm run -s smoke
    install: npm ci
    push: true
    finding_check: node ~/Development/standards/scripts/repos.ts localtaskrepo/lotar
