# The lotar library (crate name `lotar`), built on crates/lotar-core (DEV-499)
# and crates/lotar-agent (DEV-634), whose modules it re-exports.
# The root package builds the `lotar` binary from it plus the embedded web UI
# (DEV-497).
[package]
name = "lotar-lib"
description = "The lotar library: services, CLI handlers, MCP and the web server, on lotar-agent and lotar-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# docs/ is the copy scripts/stage-crates.mjs makes for cargo package
# (DEV-507); the tests stay in the repository.
include = ["/src/**", "/build.rs", "/docs/**"]
# Integration tests are modules of one binary (tests/integration.rs, DEV-302).
autotests = false
autobins = false

[lib]
name = "lotar"

[lints]
workspace = true

[build-dependencies]
# build.rs compresses the embedded help docs and OpenAPI spec (DEV-221).
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[dependencies]
lotar-core.workspace = true
lotar-agent.workspace = true
harnessmux.workspace = true
jiff.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
dirs.workspace = true
clap.workspace = true
clap_complete = "4.6.11"
ignore.workspace = true
notify = "8.2.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
blake3.workspace = true
base64.workspace = true
ureq = { version = "3.4.2", features = ["json"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libc.workspace = true
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
fs2.workspace = true
schemars = { workspace = true, optional = true }
# Not used directly: enables the features assert_cmd turns on, so test targets
# reuse the library `cargo build` made instead of compiling it again (DEV-495).
# The extra code is never called; release LTO removes it.
bstr = "1.13.1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
regex.workspace = true
assert_cmd = "2.2.2"
# No default features: its regex feature would turn on regex defaults (DEV-495).
predicates = { version = "3.1.4", default-features = false }
tempfile.workspace = true
ctor.workspace = true
dtor.workspace = true
# The tests fake T3 Code's server (DEV-619).
tungstenite = "0.30.0"

[features]
default = ["parallel"]
schema = ["schemars", "lotar-core/schema", "lotar-agent/schema"]

# Optional features
parallel = ["lotar-core/parallel"]

# DEV-302: one binary for the integration tests (each tests/*.rs file is a
# module of tests/integration.rs); the guard, the performance budgets and the
# tests the Windows CI job runs (DEV-495) keep their own binaries.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "nextest_guard_test"
path = "tests/nextest_guard_test.rs"

[[test]]
name = "performance_test"
path = "tests/performance_test.rs"

[[test]]
name = "windows_regressions"
path = "tests/windows_regressions.rs"
