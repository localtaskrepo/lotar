# The task services of the lotar library (DEV-634): tasks, lists and queries,
# relationships, sprints, releases, references and attachments, on lotar-core.
# Automation and agent jobs (crates/lotar-agent) sit above it and answer its
# calls back through `hooks`, so a change there doesn't recompile this crate.
[package]
name = "lotar-tasks"
description = "The task services of the lotar library: tasks, relationships, sprints, releases and attachments, on lotar-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# tests/ holds the unit tests' fixtures.
include = ["/src/**", "/tests/**"]

[lints]
workspace = true

[dependencies]
lotar-core.workspace = true
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
fs2.workspace = true
ignore.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
ctor.workspace = true
dtor.workspace = true
tempfile.workspace = true
