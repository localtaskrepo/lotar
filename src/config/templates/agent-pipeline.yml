# Agent Pipeline Project Template
# Fully automated agent workflow: Implementation → Testing → Merging → Done.
# Every phase works in the ticket's own git worktree and branch.
#
# `lotar init --template agent-pipeline` writes the `config:` block below into
# the project config and the `automation:` block into the project's
# automation.yml. Assign a ticket to @implement to start the pipeline.

name: "Agent Pipeline"
description: "Automated agent workflow with implementation, testing, and merge phases"
config:
  project:
    name: "{{project_name}}"
  issue:
    states:
      - Todo              # Backlog
      - InProgress        # Agent implementing
      - Testing           # Agent testing
      - Merging           # Agent merging into main
      - Done              # Complete
      - HelpNeeded        # Waiting for a person
    types:
      - Feature
      - Bug
      - Chore
      - Refactor
    priorities:
      - Low
      - Medium
      - High
      - Critical
    tags:
      - "*"

  # One agent profile per phase. LoTaR adds its own instructions to every job
  # (how to use the lotar CLI, the worktree branch, and how the job ends);
  # the instructions here describe the phase.
  #
  # runner: claude, codex, copilot or gemini. model and effort are passed to
  # that CLI, so use names it knows (for example claude: sonnet/opus/haiku and
  # effort low…max; codex: effort minimal…high).
  agents:
    implement:
      runner: claude
      # model: sonnet
      # effort: high
      instructions: |
        You are in the IMPLEMENTATION phase. Write working code that satisfies the ticket.
        - Read the ticket, its relationships and the repository guidance before editing.
        - Make the code changes, and add or update tests when behavior changes.
        - Run the checks the repository asks for.
        - Commit your work to the ticket branch with a focused message.
        - Finish with a summary of what changed and how you checked it.

    test:
      runner: claude
      # model: sonnet
      # effort: medium
      instructions: |
        You are in the TESTING phase. Prove that the implementation on this branch works.
        - Run the relevant tests, then exercise the change the way the ticket describes.
        - Add tests that are missing and commit them to the ticket branch.
        - Fix small, clear failures yourself and commit the fix.
        - If the implementation is wrong or incomplete in a way you cannot fix safely, hand the ticket back as described under "Clarifications, blockers and feedback" and explain what fails.

    merge:
      runner: claude
      # model: sonnet
      instructions: |
        You are in the MERGING phase. Bring the ticket branch into the main branch.
        - Rebase the ticket branch onto the main branch and resolve conflicts.
        - Rerun the checks the repository asks for.
        - Fast-forward the main checkout to the branch:
            git -C "${{workspace.root}}" merge --ff-only ${{agent.worktree_branch}}
          If the main checkout is not on the main branch, or its uncommitted changes block the merge, do not force it: hand the ticket back and explain.
        - Do not push unless the repository guidance says to.

  agent:
    worktree:
      enabled: true
      branch_prefix: "agent/"
      cleanup_on_done: true
      cleanup_delete_branches: true
      # Maximum parallel agent jobs. Omit for unlimited; extra jobs wait in a queue.
      # max_parallel_jobs: 4

automation:
  rules:
    - name: Implementation phase
      when:
        assignee: "@implement"
      on:
        job_started:
          set:
            status: InProgress
        job_completed:
          set:
            status: Testing
            assignee: "@test"

    - name: Testing phase
      when:
        assignee: "@test"
      on:
        job_started:
          set:
            status: Testing
        job_completed:
          set:
            status: Merging
            assignee: "@merge"

    - name: Merging phase
      when:
        assignee: "@merge"
      on:
        job_started:
          set:
            status: Merging
        job_completed:
          set:
            status: Done
            assignee: "@reporter"

    # A job that crashes or is stopped goes back to the reporter instead of
    # moving on (or retrying in a loop). An agent that needs help hands the
    # ticket back itself, so none of the rules above match when its job ends.
    - name: Agent failures go to the reporter
      when:
        assignee: "@agent"
      on:
        job_failed:
          set:
            status: HelpNeeded
            assignee: "@reporter"
          add:
            tags: [agent-failed]
        job_cancelled:
          set:
            assignee: "@reporter"
