# Copy of the owner's shared gitleaks rules (standards repo, configs/gitleaks/base.toml), copied because
# this repo is public and must work from a clone alone. Update it from there.
[extend]
useDefault = true

[[rules]]
id = "anthropic-oauth-token"
description = "Claude Code OAuth token"
regex = '''sk-ant-oat\d{2}-[A-Za-z0-9_\-]{40,}'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''\b1//0[A-Za-z0-9_\-]{30,}'''
keywords = ["1//0"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''\bGOCSPX-[A-Za-z0-9_\-]{20,}'''
keywords = ["gocspx-"]

# betterleaks' generic-password rule fires on references, not values (2026-11-10): 1Password item names and error
# messages in comments ("1Password: \"<item>\"", gairola; 1Password: `<error>` in a lotar ticket, STD-140) and
# {env}NAME lookups in configs (local webdav). Its match drops the "1" of 1Password, so the 1Password allowlist checks
# the whole line: at least one 1Password reference and no other passw, psw or pw (a "p" it can't rule out keeps
# the finding). A plain Password: "<value>", or a password next to a reference, still fires (tested 2026-11-15); a
# login(user, "<secret>") call next to a reference doesn't. Both allowlists cover generic-password only, so another
# rule's finding on the line, like a token next to a reference, still fires (STD-165).
[[allowlists]]
description = "references to a secret, not the secret: 1Password item names and errors"
regexTarget = "line"
targetRules = ["generic-password"]
regexes = ['''(?i)^[\r\n]*(?:(?:[^p"\x60\r\n]|p+(?:[^aspw"\x60\r\n]|a[^ps"\x60\r\n]|as[^ps"\x60\r\n]|ass[^pw"\x60\r\n]|s[^pw"\x60\r\n]))|["\x60])*1password: (?:"(?:[^p"\x60\r\n]|p+(?:[^aspw"\x60\r\n]|a[^ps"\x60\r\n]|as[^ps"\x60\r\n]|ass[^pw"\x60\r\n]|s[^pw"\x60\r\n]))+"|\x60(?:[^p"\x60\r\n]|p+(?:[^aspw"\x60\r\n]|a[^ps"\x60\r\n]|as[^ps"\x60\r\n]|ass[^pw"\x60\r\n]|s[^pw"\x60\r\n]))+\x60)(?:1password: (?:"(?:[^p"\x60\r\n]|p+(?:[^aspw"\x60\r\n]|a[^ps"\x60\r\n]|as[^ps"\x60\r\n]|ass[^pw"\x60\r\n]|s[^pw"\x60\r\n]))+"|\x60(?:[^p"\x60\r\n]|p+(?:[^aspw"\x60\r\n]|a[^ps"\x60\r\n]|as[^ps"\x60\r\n]|ass[^pw"\x60\r\n]|s[^pw"\x60\r\n]))+\x60)|(?:(?:[^p"\x60\r\n]|p+(?:[^aspw"\x60\r\n]|a[^ps"\x60\r\n]|as[^ps"\x60\r\n]|ass[^pw"\x60\r\n]|s[^pw"\x60\r\n]))|["\x60]))*[\r\n]*$''']

[[allowlists]]
description = "references to a secret, not the secret: {env}NAME lookups"
regexTarget = "line"
targetRules = ["generic-password"]
regexes = ['''password"?\s*[:=]\s*"\{env\}[A-Z0-9_]+"''']
