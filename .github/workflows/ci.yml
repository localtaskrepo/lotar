name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_artifacts:
    name: Build Frontend & Release Binary
    runs-on: ubuntu-latest
    env:
      # Designated git-capable runner: build.rs refuses to compile git
      # behavior out (panics if creating .git is denied).
      LOTAR_REQUIRE_GIT: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      # No explicit toolchain input: the action installs the toolchain pinned
      # in rust-toolchain.toml so CI and local development stay identical.

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ci-${{ runner.os }}
        save-if: true

    - name: Install sccache
      uses: taiki-e/install-action@v2
      with:
        tool: sccache

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: .sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Determine Node version
      id: node_version
      shell: bash
      run: |
        version=$(node -p "require('./package.json').engines.node")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.node_version.outputs.version }}
        cache: npm

    - name: Install npm dependencies
      run: npm ci --prefer-offline

    - name: Build web assets
      run: npm run build:web

    - name: Verify web assets exist
      run: test -f target/web/index.html

    - name: Build release binary
      run: cargo build --release --all-features

    - name: Bundle artifacts for reuse
      run: |
        rm -rf ci-artifacts
        mkdir -p ci-artifacts/target/web ci-artifacts/target/release
        rsync -a target/web/ ci-artifacts/target/web/
        found=0
        for bin in target/release/lotar*; do
          if [ -f "$bin" ]; then
            cp "$bin" ci-artifacts/target/release/
            found=1
          fi
        done
        if [ "$found" -eq 0 ]; then
          echo "No release binaries were bundled" >&2
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: lotar-build-artifacts
        path: ci-artifacts/
        retention-days: 3

  rust_checks:
    name: Rust Quality Checks
    runs-on: ubuntu-latest
    env:
      USER: mallox
      USERNAME: mallox
      # Git capability is a build-time contract here: build.rs panics rather
      # than setting no_git_tests, runtime require_git() probes fail closed,
      # and the manifest gate below asserts every selected test executed.
      LOTAR_REQUIRE_GIT: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        # Toolchain comes from rust-toolchain.toml.
        components: rustfmt, clippy
        
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ci-${{ runner.os }}
        save-if: true

    - name: Install sccache
      uses: taiki-e/install-action@v2
      with:
        tool: sccache

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: .sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest

    # include_dir! embeds target/web-embed (src/web_server.rs), so every
    # Rust compile step on this cold runner needs freshly generated web
    # assets first; same Node engine/setup pattern as build_artifacts and
    # windows_checks (docs/developers/testing.md). No cache reliance: the
    # gzip tree is rebuilt in-job before fmt/clippy/tests.
    - name: Determine Node version
      id: node_version
      shell: bash
      run: |
        version=$(node -p "require('./package.json').engines.node")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.node_version.outputs.version }}
        cache: npm

    - name: Install npm dependencies
      run: npm ci --prefer-offline

    - name: Build web assets
      run: npm run build:web

    - name: Verify embed assets exist
      run: test -f target/web-embed/index.html.gz

    - name: Check code formatting
      run: cargo fmt --all --check

        
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      
    - name: Run tests (nextest, ci profile)
      run: |
        cargo nextest run \
          --cargo-profile ci \
          --all-features \
          --failure-output=immediate-final \
          --retries 0 \
          --lib --bins --tests

    - name: Enforce full-suite coverage (manifest vs JUnit)
      run: |
        set -euo pipefail
        python3 scripts/check-test-coverage.py --self-test
        mkdir -p target/nextest
        # The list intentionally includes ignored tests (--run-ignored all):
        # the default list reports them as filter mismatches, which would let
        # a selected-but-ignored test slip past the gate unseen.
        cargo nextest list --cargo-profile ci --all-features --lib --bins --tests --run-ignored all --message-format json > target/nextest/manifest.json
        python3 scripts/check-test-coverage.py \
          --label 'linux full suite' \
          --manifest target/nextest/manifest.json \
          --junit target/nextest/default/junit.xml

    - name: Upload nextest report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: nextest-report
        path: |
          target/nextest/default/junit.xml
          target/nextest/manifest.json
        if-no-files-found: ignore
        retention-days: 7

  ui_tests:
    name: UI Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Determine Node version
      id: node_version
      shell: bash
      run: |
        version=$(node -p "require('./package.json').engines.node")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.node_version.outputs.version }}
        cache: npm

    - name: Install npm dependencies
      run: npm ci --prefer-offline

    - name: Run Vitest suite
      run: npm run test:ui

    # Unit gate for the runtime Git test-selection runner (DEV-79); see the
    # matching step in windows_checks.
    - name: Run rust-test-runner unit tests
      run: node --test scripts/tests/rust-test-runner.test.mjs

    # Path-portability regression gate for the web asset compression script
    # (Windows drives, spaces, Unicode, POSIX, gz-only embed tree); see the
    # matching step in windows_checks.
    - name: Run compress-web unit tests
      run: node --test scripts/tests/compress-web.test.mjs

  smoke_tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [build_artifacts]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        name: lotar-build-artifacts
        path: artifact-cache

    - name: Restore build artifacts
      run: |
        mkdir -p target
        if [ ! -d artifact-cache/target ]; then
          echo "Expected target directory not found in artifact" >&2
          ls -R artifact-cache
          exit 1
        fi
        rsync -a artifact-cache/target/ target/
        rm -rf artifact-cache

    - name: Ensure binaries are executable
      run: chmod +x target/release/lotar target/release/lotar-agent-wrapper 2>/dev/null || true

    - name: Verify web assets exist
      run: test -f target/web/index.html

    - name: Determine Node version
      id: node_version
      shell: bash
      run: |
        version=$(node -p "require('./package.json').engines.node")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.node_version.outputs.version }}
        cache: npm

    - name: Install npm dependencies
      run: npm ci --prefer-offline

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run smoke suite
      env:
        LOTAR_BINARY_PATH: ${{ github.workspace }}/target/release/lotar
        # Force embedded UI to ensure we test the bundled assets, not stale filesystem copies
        LOTAR_WEB_UI_EMBEDDED: '1'
        # Designated CI runner: the smoke helper's real git-init probe is
        # fatal here instead of producing skipped git-dependent specs; the
        # workflow itself runs no git commands (DEV-79).
        LOTAR_SMOKE_REQUIRE_GIT: '1'
      run: npm run test:smoke:quick

  windows_checks:
    name: Windows Binary Sanity and Portable Smoke
    runs-on: windows-latest
    env:
      USER: mallox
      USERNAME: mallox
      LOTAR_REQUIRE_GIT: '1'
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      RUSTC_WRAPPER: sccache
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      # Toolchain comes from rust-toolchain.toml.

    - name: Install sccache
      uses: taiki-e/install-action@v2
      with:
        tool: sccache

    - name: Cache sccache
      uses: actions/cache@v5
      with:
        path: .sccache
        key: sccache-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-${{ runner.os }}-

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: ci-${{ runner.os }}
        save-if: true

    # Node is required before the first Rust build: the binary embeds the
    # generated target/web-embed directory via include_dir!, so a cold
    # runner must build the web assets first (docs/developers/testing.md).
    # The same Node install runs the browser-free portable agent smoke
    # selection and the rust-test-runner unit gate below.
    - name: Determine Node version
      id: node_version
      shell: bash
      run: |
        version=$(node -p "require('./package.json').engines.node")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.node_version.outputs.version }}
        cache: npm

    - name: Install npm dependencies
      run: npm ci --prefer-offline

    - name: Build web assets
      run: npm run build:web

    - name: Build binary (ci profile)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        cargo build --profile ci --all-features

    - name: Sanity-check binary + basic path usage
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $bin = Join-Path $env:GITHUB_WORKSPACE 'target/ci/lotar.exe'
        if (-not (Test-Path $bin)) {
          Write-Error "Binary not found at $bin"
        }

        & $bin --version
        & $bin --help | Out-Null

        $work = Join-Path $env:RUNNER_TEMP 'lotar-win-sanity'
        if (Test-Path $work) {
          Remove-Item -Recurse -Force $work
        }
        New-Item -ItemType Directory -Force -Path $work | Out-Null
        New-Item -ItemType Directory -Force -Path (Join-Path $work '.tasks') | Out-Null

        $config = @(
          'default:',
          '  project: CLI',
          'issue:',
          '  states: [Todo, Done]',
          '  priorities: [Low]',
          '  types: [Feature]'
        ) -join "`n"
        $config | Out-File -FilePath (Join-Path $work '.tasks/config.yml') -Encoding utf8

        Push-Location $work
        & $bin add "Windows CI task" --format=json | Out-Host
        & $bin list --format=json | Out-Host
        Pop-Location

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: nextest

    # Module selection, not a name list: every test under the storage
    # safety and scan modules runs here, so platform-specific cases (the
    # Windows atomic-readonly one included) and future additions are
    # covered without maintaining witness names.
    - name: Run storage safety and scan selection (nextest)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        cargo nextest run --cargo-profile ci --all-features --retries 0 --failure-output=immediate-final --lib --bins --tests -E 'test(storage::safety::) | test(utils::scan::)'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Enforce selection coverage (manifest vs JUnit)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path target/nextest | Out-Null
        # --run-ignored all keeps ignored tests visible as selected-but-ignored
        # so the checker rejects them instead of silently filtering them out.
        cargo nextest list --cargo-profile ci --all-features --lib --bins --tests --run-ignored all --message-format json -E 'test(storage::safety::) | test(utils::scan::)' | Out-File -Encoding utf8 target/nextest/windows-manifest.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts/check-test-coverage.py --label 'windows storage::safety + utils::scan' --manifest target/nextest/windows-manifest.json --junit target/nextest/default/junit.xml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload Windows nextest report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: windows-nextest-report
        path: |
          target/nextest/default/junit.xml
          target/nextest/windows-manifest.json
        if-no-files-found: warn
        retention-days: 7

    # Browser-free portable agent + automation smoke selection (DEV-80).
    # These specs need no Playwright browser: fixture launchers, the agent
    # job REST lifecycle, CLI automation, and REST automation endpoints all
    # exercise the real binary via helpers only. LOTAR_BINARY_PATH points
    # at the ci-profile binary built above; ensureBinaryExists fails loudly
    # instead of building. LOTAR_SMOKE_REQUIRE_GIT marks this designated
    # runner: the helper's real-git probe is fatal rather than producing
    # silently skipped git-dependent specs. Vitest exits non-zero on any
    # failure and when a filter selects no test files, so an empty or
    # failing selection is red by construction (no pass-count floor).
    - name: Run portable agent + automation smoke selection (browser-free)
      shell: pwsh
      env:
        LOTAR_BINARY_PATH: ${{ github.workspace }}/target/ci/lotar.exe
        LOTAR_SMOKE_REQUIRE_GIT: '1'
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path target/smoke-report | Out-Null
        npm run test:smoke:quick -- `
          smoke/tests/fixtures.agent.smoke.spec.ts `
          smoke/tests/api.agent-jobs.smoke.spec.ts `
          smoke/tests/cli.automation.smoke.spec.ts `
          smoke/tests/api.automation.smoke.spec.ts `
          --reporter=default `
          --reporter=junit `
          "--outputFile.junit=$env:GITHUB_WORKSPACE/target/smoke-report/portable-agent-smoke.junit.xml"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Real Windows results are recorded as JUnit and uploaded unconditionally
    # (if: always), so a red run still leaves evidence. if-no-files-found:
    # error turns a missing report (startup crash before the reporter wrote)
    # into a failure instead of a silent empty upload; on such runs the smoke
    # step itself already failed, so the erroring upload cannot mask a green.
    - name: Upload Windows portable smoke report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: windows-portable-smoke-report
        path: target/smoke-report/
        if-no-files-found: error
        retention-days: 7

    # Unit gate for the runtime Git test-selection runner (DEV-79). The
    # runner wraps cargo nextest for cross-platform use, so its own tests
    # run on both Node-enabled lanes.
    - name: Run rust-test-runner unit tests
      run: node --test scripts/tests/rust-test-runner.test.mjs

    # Path-portability regression gate for the web asset compression script,
    # run on Windows itself: the same windows:true unit proofs plus a child
    # fixture run through this lane's real drive-letter script URL.
    - name: Run compress-web unit tests
      run: node --test scripts/tests/compress-web.test.mjs

  # Security audit (optimized with caching, runs in parallel)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo-audit
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cargo-audit
        key: cargo-audit-${{ runner.os }}
        
    - name: Install cargo-audit (if not cached)
      run: |
        if ! command -v cargo-audit >/dev/null 2>&1; then
          echo "Installing cargo-audit..."
          cargo install cargo-audit --locked
        else
          echo "Using cached cargo-audit"
        fi
      
    - name: Run security audit
      run: cargo audit