name: Verify Install Scripts and Packages

# DEV-250: checks site/install.sh, site/install.ps1, the .deb/.rpm release
# assets, and the npm packages against a published release. Pull requests that
# touch the scripts run the script jobs against the latest release; run it
# manually after a release to check the packages too.

on:
  workflow_dispatch:
    inputs:
      lotar_version:
        description: "Release tag to install, e.g. v0.12.0 (defaults to the latest release)"
        required: false
  pull_request:
    paths:
      - site/install.sh
      - site/install.ps1
      - .github/workflows/install-verify.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOTAR_VERSION: ${{ inputs.lotar_version }}

jobs:
  install-script-unix:
    name: install.sh (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, label: Ubuntu x64, arch: x86-64 }
          - { runner: ubuntu-24.04-arm, label: Ubuntu arm64, arch: aarch64 }
          # BusyBox sh and wget, no curl or bash.
          - { runner: ubuntu-latest, label: Alpine x64, arch: x86-64, container: 'alpine:3' }
          - { runner: macos-15, label: macOS arm64, arch: arm64 }
          - { runner: macos-15-intel, label: macOS x64, arch: x86_64 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with install.sh
        shell: sh
        run: |
          set -eu
          dir="${RUNNER_TEMP:-/tmp}/lotar-bin"
          sh site/install.sh --to "$dir"
          "$dir/lotar" --version
          if [ -n "${LOTAR_VERSION:-}" ]; then
            "$dir/lotar" --version | grep -q "${LOTAR_VERSION#v}"
          fi
          # Reinstalling over an existing binary must work too.
          sh site/install.sh --to "$dir" >/dev/null

      - name: Check binary architecture
        if: matrix.container == ''
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          output="$(file "${RUNNER_TEMP}/lotar-bin/lotar")"
          echo "$output"
          [[ "$output" == *"${EXPECTED_ARCH}"* ]]

  install-script-windows:
    name: install.ps1 (${{ matrix.runner }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm gets the native ARM64 build (DEV-309), or the x64 build
        # for releases that have none.
        runner: [windows-latest, windows-11-arm]
        # pwsh is PowerShell 7; powershell is the Windows PowerShell 5.1 that ships with Windows.
        shell: [pwsh, powershell]
    defaults:
      run:
        # A step's own shell cannot come from the matrix; the job default can.
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with install.ps1 (piped, as documented)
        run: |
          $ErrorActionPreference = 'Stop'
          # A %VAR% entry must stay unexpanded after the installer edits Path (DEV-291).
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $before = [string]$envKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $envKey.SetValue('Path', ((@($before -split ';' | Where-Object { $_ }) + '%USERPROFILE%\lotar-path-probe') -join ';'), [Microsoft.Win32.RegistryValueKind]::ExpandString)
          $envKey.Close()
          Get-Content -Raw site/install.ps1 | Invoke-Expression
          $envKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = [string]$envKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $kind = $envKey.GetValueKind('Path')
          $envKey.Close()
          if ($raw -notmatch '%USERPROFILE%\\lotar-path-probe') { throw "The installer expanded %VAR% entries in the user Path: $raw" }
          if ($kind -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw "The user Path became $kind instead of ExpandString" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\lotar\lotar.exe'
          $output = & $exe --version
          Write-Host $output
          if ($env:LOTAR_VERSION -and $output -notmatch [regex]::Escape($env:LOTAR_VERSION.TrimStart('v'))) {
            throw "Expected $env:LOTAR_VERSION, got $output"
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains (Split-Path $exe)) { throw 'Install directory was not added to the user PATH' }
          # Reinstalling over an existing binary must work too.
          Get-Content -Raw site/install.ps1 | Invoke-Expression

      - name: Check binary architecture
        # Releases from DEV-309 on have a native ARM64 build; pull requests
        # test against the latest release, which may predate it.
        if: github.event_name == 'workflow_dispatch'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\lotar\lotar.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ($env:RUNNER_ARCH -eq 'ARM64') { 0xAA64 } else { 0x8664 }
          Write-Host ("PE machine 0x{0:X4}, expected 0x{1:X4}" -f $machine, $expected)
          if ($machine -ne $expected) { throw 'The installed lotar.exe is not built for this CPU' }

  armv7-emulated:
    name: Linux armv7 (QEMU) install.sh and npm
    # There is no 32-bit ARM runner, so the release's armv7 build runs under
    # QEMU (DEV-309). It needs a release with that build, so pull requests skip it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: install.sh in Alpine armv7
        shell: bash
        run: |
          set -euo pipefail
          # The single-quoted script expands $LOTAR_VERSION inside the container.
          # shellcheck disable=SC2016
          docker run --rm --platform linux/arm/v7 -e LOTAR_VERSION -v "$PWD:/src:ro" alpine:3 sh -c '
            set -eu
            sh /src/site/install.sh --to /tmp/lotar-bin
            /tmp/lotar-bin/lotar --version
            if [ -n "${LOTAR_VERSION:-}" ]; then /tmp/lotar-bin/lotar --version | grep -q "${LOTAR_VERSION#v}"; fi
          '

      - name: npm in Debian armv7
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          # node:24 has no 32-bit ARM image; node:22 still has one.
          docker run --rm --platform linux/arm/v7 -e LOTAR_VERSION node:22-bookworm-slim bash -c '
            set -euo pipefail
            version="${LOTAR_VERSION:-latest}"
            npm install --global "@localtaskrepo/lotar@${version#v}"
            lotar --version
            ls "$(npm root --global)/@localtaskrepo/lotar/node_modules/@localtaskrepo"
          '

  linux-packages:
    name: ${{ matrix.format }} package (${{ matrix.arch }})
    # Packages exist only for releases newer than v0.11.0, so pull requests skip this.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x64, format: deb, image: 'debian:stable-slim' }
          - { runner: ubuntu-24.04-arm, arch: arm64, format: deb, image: 'debian:stable-slim' }
          # 32-bit ARM runs under QEMU; there is no armv7 rpm (DEV-309).
          - { runner: ubuntu-latest, arch: armv7, format: deb, image: 'debian:stable-slim', platform: 'linux/arm/v7' }
          - { runner: ubuntu-latest, arch: x64, format: rpm, image: 'fedora:latest' }
          - { runner: ubuntu-24.04-arm, arch: arm64, format: rpm, image: 'fedora:latest' }
    steps:
      - name: Download and check the package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          tag="${LOTAR_VERSION:-$(gh release view --repo localtaskrepo/lotar --json tagName --jq .tagName)}"
          file="lotar-${tag}-linux-${ARCH}.${FORMAT}"
          gh release download "$tag" --repo localtaskrepo/lotar --pattern "$file" --pattern "$file.sha256"
          sha256sum --check "$file.sha256"
          echo "PACKAGE=$file" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: matrix.platform != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Install, run, and remove in ${{ matrix.image }}
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # The single-quoted scripts expand $PACKAGE and $TAG inside the container.
          # shellcheck disable=SC2016
          if [ "$FORMAT" = deb ]; then
            script='apt-get install -y -qq "/pkg/$PACKAGE" && lotar --version | grep -q "${TAG#v}" && apt-get remove -y -qq lotar && ! test -e /usr/bin/lotar'
          else
            # As documented: dnf installs the local package. RPM 6 (Fedora 45+)
            # refuses `rpm -i` of a package without a GPG signature.
            script='dnf install -y -q "/pkg/$PACKAGE" && lotar --version | grep -q "${TAG#v}" && dnf remove -y -q lotar && ! test -e /usr/bin/lotar'
          fi
          docker run --rm ${PLATFORM:+--platform "$PLATFORM"} -e PACKAGE -e TAG -v "$PWD:/pkg:ro" "$IMAGE" bash -c "$script"

  npm-package:
    name: npm package (${{ matrix.label }})
    # Needs a release that publish-npm has published, so pull requests skip this.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, label: Linux x64 }
          - { runner: ubuntu-24.04-arm, label: Linux arm64 }
          - { runner: macos-15, label: macOS arm64 }
          - { runner: macos-15-intel, label: macOS x64 }
          - { runner: windows-latest, label: Windows x64 }
          - { runner: windows-11-arm, label: Windows arm64 }
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install globally and with npx
        shell: bash
        run: |
          set -euo pipefail
          version="${LOTAR_VERSION:-latest}"
          spec="@localtaskrepo/lotar@${version#v}"
          npm install --global "$spec"
          lotar --version
          if [ -n "${LOTAR_VERSION:-}" ]; then
            lotar --version | grep -q "${LOTAR_VERSION#v}"
          fi
          # Only the package for this platform is installed.
          ls "$(npm root --global)/@localtaskrepo/lotar/node_modules/@localtaskrepo"
          npx --yes "$spec" --version
