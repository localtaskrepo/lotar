name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  require-qa-green:
    name: Ensure QA succeeded
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify latest QA run for this commit is green
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'completed'
            });
            const success = response.data.workflow_runs.find(run => run.conclusion === 'success');
            if (!success) {
              core.setFailed('No successful Quality Assurance workflow run found for this commit.');
            }

  create-release:
    name: Create Release
    needs: require-qa-green
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          TAG_BASE="${TAG%%-*}"
          if [ -z "$TAG_BASE" ]; then
            TAG_BASE="$TAG"
          fi
          CARGO_VERSION=$(grep -E '^version\s*=\s*"' Cargo.toml | head -n1 | sed -E 's/.*version\s*=\s*"([^"]+)".*/\1/')
          echo "Tag: $TAG | Base: $TAG_BASE | Cargo.toml: $CARGO_VERSION"
          if [ "$TAG_BASE" != "$CARGO_VERSION" ]; then
            echo "Error: tag base ($TAG_BASE) does not match Cargo.toml version ($CARGO_VERSION)." >&2
            exit 1
          fi

      # A tag with a suffix (v1.0.0-rc.1) is a prerelease: never the repository's
      # latest release, which the install scripts install, and it skips the Docker
      # `latest` tag, the Homebrew tap, and the Scoop bucket below. npm uses the
      # same rule for its `next` dist-tag (scripts/npm-packages.mjs, DEV-290).
      - name: Create or update release (no assets yet)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    # Runs npm, vite, cargo build scripts and cross with a read-only token and
    # no signing identity; the build-and-release job below signs and uploads
    # (DEV-291).
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            rust_target: aarch64-apple-darwin
            artifact: macos-arm64
            bin: lotar
          - os: macos-latest
            target: macos
            rust_target: x86_64-apple-darwin
            artifact: macos-x64
            bin: lotar
          - os: ubuntu-latest
            target: linux
            rust_target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            bin: lotar
          - os: ubuntu-latest
            target: linux-musl
            rust_target: x86_64-unknown-linux-musl
            artifact: linux-musl-x64
            bin: lotar
          - os: ubuntu-latest
            target: linux-musl
            rust_target: aarch64-unknown-linux-musl
            artifact: linux-musl-arm64
            bin: lotar
            cross: true
          # 32-bit ARM (Raspberry Pi OS 32-bit, older Pis), static (DEV-309).
          - os: ubuntu-latest
            target: linux-musl
            rust_target: armv7-unknown-linux-musleabihf
            artifact: linux-musl-armv7
            bin: lotar
            cross: true
          - os: windows-latest
            target: windows
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-x64
            bin: lotar.exe
          # Native build on GitHub's Windows ARM runner (DEV-309).
          - os: windows-11-arm
            target: windows
            rust_target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            bin: lotar.exe
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        # The input is required once the action is pinned to a SHA; cargo
        # still uses the compiler pinned in rust-toolchain.toml.
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: release-${{ matrix.os }}-${{ matrix.rust_target }}

      - name: Write Node version file
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.engines?.node;
            if (!version) {
              core.setFailed('package.json is missing engines.node');
            } else {
              fs.writeFileSync('.node-version', `${version}\n`);
            }

      - name: Setup Node (for web build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      - name: Install musl toolchain (linux-musl)
        if: matrix.target == 'linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust target
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup target add "$RUST_TARGET"

      - name: Install cross (ARM Linux)
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cross >/dev/null 2>&1; then
            # v0.2.5, pinned by commit; its image is pinned by digest in Cross.toml.
            cargo install cross --git https://github.com/cross-rs/cross --rev 88f49ff79e777bef6d3564531636ee4d3cc2f8d2 --locked
          fi

      - name: Build Web UI
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build:web
          fi

      - name: Build (release via cross)
        if: matrix.cross
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          cross build --release --locked --all-features --target "$RUST_TARGET"

      # ring compiles its assembly with clang on Windows on ARM.
      - name: Find clang (Windows arm64)
        if: matrix.rust_target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null 2>&1; then
            llvm="/c/Program Files/LLVM/bin"
            if [ -x "$llvm/clang.exe" ]; then
              cygpath -w "$llvm" >> "$GITHUB_PATH"
            else
              echo "::error::clang not found; ring needs it to build for aarch64-pc-windows-msvc"
              exit 1
            fi
          fi

      - name: Build (release)
        if: ${{ !matrix.cross }}
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          # Keep the runner's home and checkout paths out of the binary and
          # shorten the source paths embedded in panic messages (DEV-221).
          # (The cross build above runs in a container with generic paths.)
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          flags="--remap-path-prefix=$(native "$cargo_home")=/cargo"
          flags="$flags --remap-path-prefix=$(native "$rustup_home")=/rustup"
          # Later prefixes win: map each registry index folder to /cargo too,
          # so dependency paths shrink to /cargo/<crate>-<version>/...
          for index in "$cargo_home"/registry/src/*/; do
            [ -d "$index" ] && flags="$flags --remap-path-prefix=$(native "${index%/}")=/cargo"
          done
          flags="$flags --remap-path-prefix=$(native "${GITHUB_WORKSPACE:-$PWD}")=/lotar"
          export RUSTFLAGS="${RUSTFLAGS:-} $flags"
          cargo build --release --locked --all-features --target "$RUST_TARGET"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          BIN: ${{ matrix.bin }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          BIN_PATH="target/$RUST_TARGET/release/$BIN"
          if [[ "$CROSS" == true || "$RUST_TARGET" == aarch64-* ]]; then
            echo "Skipping strip for cross-compiled target"
            exit 0
          fi
          if command -v strip >/dev/null 2>&1; then
            strip "$BIN_PATH" || true
          fi

      - name: Package artifact (non-Windows)
        if: matrix.target != 'windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
          RUST_TARGET: ${{ matrix.rust_target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          mkdir -p dist out
          NAME="lotar-$TAG-$ARTIFACT"
          BIN_PATH="target/$RUST_TARGET/release/$BIN"
          cp "$BIN_PATH" "dist/$BIN"
          tar -czf "out/$NAME.tar.gz" -C dist "$BIN"
          cd out
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$NAME.tar.gz" > "$NAME.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$NAME.tar.gz" > "$NAME.sha256"
          else
            echo "WARN: no checksum tool; creating empty checksum file" >&2
            : > "$NAME.sha256"
          fi

      - name: Package artifact (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
          RUST_TARGET: ${{ matrix.rust_target }}
          BIN: ${{ matrix.bin }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Path dist, out -ItemType Directory -Force | Out-Null
          $name = "lotar-$($env:TAG)-$($env:ARTIFACT)"
          $binPath = "target/$($env:RUST_TARGET)/release/$($env:BIN)"
          Copy-Item $binPath "dist/$($env:BIN)"
          Compress-Archive -Path "dist/$($env:BIN)" -DestinationPath "out/$name.zip"
          $hash = (Get-FileHash -Path "out/$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Out-File -FilePath "out/$name.sha256" -Encoding ascii

      # The macOS archives go to sign-macos first; only its signed copies are
      # named release-* (DEV-482).
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target == 'macos' && 'unsigned' || 'release' }}-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  sign-macos:
    name: Sign and notarize macOS (${{ matrix.artifact }})
    # Signs the macOS binaries with the Developer ID certificate, so macOS keeps
    # firewall and file-access grants across upgrades (DEV-482). Like
    # build-and-release it runs no build code and only sees the archives.
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        artifact: [macos-arm64, macos-x64]
    permissions:
      contents: read
    env:
      SIGN_IDENTITY: 'Developer ID Application: Ravi Gairola (3HKD37M482)'
      TEAM_ID: 3HKD37M482
      # Part of the designated requirement macOS grants are tied to: never change it.
      BUNDLE_ID: net.pyxzl.lotar
    steps:
      - name: Check signing secrets
        shell: bash
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in P12 P12_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Missing macOS signing secrets (MACOS_DEVELOPER_ID_P12_BASE64, MACOS_DEVELOPER_ID_P12_PASSWORD, APPLE_NOTARY_KEY_P8_BASE64, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID); see docs/release-guide.md. The release does not ship unsigned macOS archives."
            exit 1
          fi

      - name: Download unsigned archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ matrix.artifact }}
          path: unsigned

      - name: Import Developer ID certificate
        shell: bash
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode -o "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain" | grep -F "$SIGN_IDENTITY"

      - name: Sign, notarize and re-pack
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARTIFACT: ${{ matrix.artifact }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          NAME="lotar-$TAG-$ARTIFACT"
          (cd unsigned && shasum -a 256 --check "$NAME.sha256")
          mkdir -p dist out
          tar -xzf "unsigned/$NAME.tar.gz" -C dist lotar

          codesign --force --options runtime --timestamp --identifier "$BUNDLE_ID" \
            --keychain "$KEYCHAIN_PATH" --sign "$SIGN_IDENTITY" dist/lotar
          codesign --verify --strict --verbose=2 dist/lotar
          details="$(codesign -dvv dist/lotar 2>&1)"
          echo "$details"
          grep -qx "Identifier=$BUNDLE_ID" <<<"$details"
          grep -qx "TeamIdentifier=$TEAM_ID" <<<"$details"
          grep -q "flags=0x10000(runtime)" <<<"$details"

          # notarytool takes a zip; a bare Mach-O can't be stapled, so
          # Gatekeeper looks the ticket up online.
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode -o "$key"
          ditto -c -k dist/lotar "$RUNNER_TEMP/$NAME.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/$NAME.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --output-format json)"
          echo "$result"
          status="$(jq -r .status <<<"$result")"
          if [ "$status" != Accepted ]; then
            id="$(jq -r .id <<<"$result")"
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::Notarization of $NAME ended with status $status"
            exit 1
          fi

          # Gatekeeper's online lookup can lag the notarization a little.
          # --type install, not execute: execute rejects a bare command-line binary as
          # "does not seem to be an app" even when it is notarized.
          for attempt in 1 2 3 4 5 6; do
            if assessment="$(spctl --assess --type install -vv dist/lotar 2>&1)"; then
              break
            fi
            [ "$attempt" = 6 ] && { echo "$assessment"; exit 1; }
            sleep 10
          done
          echo "$assessment"
          grep -q "source=Notarized Developer ID" <<<"$assessment"

          COPYFILE_DISABLE=1 tar -czf "out/$NAME.tar.gz" -C dist lotar
          (cd out && shasum -a 256 "$NAME.tar.gz" > "$NAME.sha256")
          ls -l out

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

      - name: Upload signed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  build-and-release:
    name: Sign and upload release assets
    # Holds the write token and the signing identity, and runs no build code:
    # it only signs what the build job produced and attaches it (DEV-291).
    # The macOS archives come from sign-macos, already Developer ID-signed.
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # Pinned to the Cosign v2 line: the signing steps below produce the
        # .sig/.pem assets documented in docs/help/install.md, and Cosign v3
        # requires --bundle for sign-blob (DEV-171).
        with:
          cosign-release: 'v2.6.5'

      - name: Sign artifacts
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          cd assets
          for archive in *.tar.gz *.zip; do
            [ -e "$archive" ] || continue
            cosign sign-blob --yes \
              --output-signature "$archive.sig" \
              --output-certificate "$archive.pem" \
              "$archive"
          done
          ls -l

      - name: Create GitHub Release (append assets)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-linux:
    name: Package .deb and .rpm
    # Built from the static musl archives the build job uploaded, so a package
    # runs on any distribution (DEV-250). The tap and bucket do not wait for it.
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NFPM_VERSION: '2.48.0'
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nfpm
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum --check
          tar -xzf nfpm.tar.gz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          rm nfpm nfpm.tar.gz
          nfpm --version

      - name: Download static Linux builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          for arch in x64 arm64 armv7; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloads \
              --pattern "lotar-${TAG}-linux-musl-${arch}.tar.gz" \
              --pattern "lotar-${TAG}-linux-musl-${arch}.sha256"
          done
          (cd downloads && sha256sum --check ./*.sha256)

      - name: Build packages
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          mkdir -p packages
          for arch in x64 arm64 armv7; do
            formats="deb rpm"
            case "$arch" in
              x64) export ARCH=amd64 ;;
              arm64) export ARCH=arm64 ;;
              # nfpm writes armhf for arm7. No rpm: Fedora and RHEL dropped
              # 32-bit ARM, while Raspberry Pi OS and Debian still ship armhf.
              armv7) export ARCH=arm7; formats="deb" ;;
            esac
            # packaging/nfpm.yaml always packages ./build/lotar.
            rm -rf build && mkdir build
            tar -xzf "downloads/lotar-${TAG}-linux-musl-${arch}.tar.gz" -C build
            for format in $formats; do
              file="packages/lotar-${TAG}-linux-${arch}.${format}"
              nfpm package --config packaging/nfpm.yaml --packager "$format" --target "$file"
              (cd packages && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
            done
          done
          ls -l packages

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        # Same Cosign v2 line as the build job, so packages get .sig/.pem assets too.
        with:
          cosign-release: 'v2.6.5'

      - name: Sign packages
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -euo pipefail
          for file in packages/*.deb packages/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Upload packages to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber packages/*

  publish-npm:
    name: Publish npm packages
    # The lotar package plus one @localtaskrepo/lotar-<platform> package per
    # binary, assembled from the uploaded archives (DEV-250). Publishes with npm
    # trusted publishing (OIDC), which each package must have configured; see
    # "One-Time npm Setup" in docs/release-guide.md.
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm ${version}"
          # Trusted publishing needs npm 11.5.1 or newer.
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != 11.5.1 ]; then
            npm install --global npm@11
            npm --version
          fi

      - name: Download release archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          for platform in macos-arm64 macos-x64 linux-musl-arm64 linux-musl-armv7 linux-musl-x64 windows-x64 windows-arm64; do
            ext=tar.gz
            case "$platform" in windows-*) ext=zip ;; esac
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloads \
              --pattern "lotar-${TAG}-${platform}.${ext}" \
              --pattern "lotar-${TAG}-${platform}.sha256"
          done
          # The Windows checksum file is uppercase with CRLF line endings; sha256sum
          # accepts either case but not the trailing CR.
          sed -i 's/\r$//' downloads/*.sha256
          (cd downloads && sha256sum --check ./*.sha256)

      - name: Assemble packages
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/npm-packages.mjs --tag "$TAG" --archives downloads --out npm-dist

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version npm-dist/publish-order.json)"
          dist_tag="$(jq -r .distTag npm-dist/publish-order.json)"
          # Platform packages come first, so lotar never points at missing versions.
          jq -r '.packages[] | "\(.name)\t\(.dir)"' npm-dist/publish-order.json |
            while IFS=$'\t' read -r name dir; do
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                echo "${name}@${version} is already published; skipping"
                continue
              fi
              (cd "$dir" && npm publish --access public --provenance --tag "$dist_tag")
            done

  publish-crates:
    name: Publish crates
    # lotar-web-assets, lotar-lib, then lotar on crates.io (DEV-507) through
    # trusted publishing only (DEV-508). Cargo.toml holds the version without the
    # tag's suffix, so prereleases publish nothing here.
    needs: build-and-release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Write Node version file
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.engines?.node;
            if (!version) {
              core.setFailed('package.json is missing engines.node');
            } else {
              fs.writeFileSync('.node-version', `${version}\n`);
            }

      - name: Setup Node (for web build)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            **/package-lock.json

      # The packaged crates carry docs/ and the web UI as copies inside their
      # folders (scripts/stage-crates.mjs); those copies are gitignored, hence
      # --allow-dirty.
      - name: Stage the docs and the web UI into the crates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build:web
          node scripts/stage-crates.mjs

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Versions already on crates.io are skipped, so the job can be re-run.
          packages=()
          for crate in lotar-web-assets lotar-lib lotar; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'lotar release (github.com/localtaskrepo/lotar)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [ "$status" = 200 ]; then
              echo "${crate}@${version} is already published; skipping"
            else
              packages+=(-p "$crate")
            fi
          done
          if [ "${#packages[@]}" -gt 0 ]; then
            # Cargo publishes them in dependency order and verifies each one.
            cargo publish --locked --allow-dirty "${packages[@]}"
          fi

  update-release-page:
    name: Update Release Page
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Add quick download links and commit list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { loadTicketDetails, loadTicketSnapshot, releaseCommitSubjects, renderReleaseChanges } = require('./.github/scripts/release-ticket-links.cjs');
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            const versionTagRegex = /^v\d+\.\d+\.\d+(?:[-+].+)?$/;
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner,
              repo,
              per_page: 100,
            });

            const currentIndex = tags.findIndex((t) => t.name === tag);
            const previousTag =
              currentIndex >= 0
                ? tags.slice(currentIndex + 1).map((t) => t.name).find((name) => versionTagRegex.test(name))
                : tags.map((t) => t.name).find((name) => versionTagRegex.test(name) && name !== tag);

            let commitsSectionBody = '_No previous tag found to compare against._';
            if (previousTag) {
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: previousTag,
                head: tag,
              });

              const { subjects, remaining } = releaseCommitSubjects(comparison.data.commits ?? [], 100);

              const warn = (message) => core.warning(message);
              const snapshot = await loadTicketSnapshot({ github, owner, repo, tag, warn });
              // Grouped by ticket type, with feature screenshots (DEV-177, DEV-225).
              const details = await loadTicketDetails({ github, owner, repo, snapshot, subjects, warn });
              const lines = await renderReleaseChanges({
                github, owner, repo, subjects, remaining, snapshot, details, warn,
              });

              commitsSectionBody = lines.length ? lines.join('\n') : '_No commits found in this range._';
            }

            const assetBase = `https://github.com/${owner}/${repo}/releases/download/${tag}`;
            const dockerTag = tag.startsWith('v') ? tag.slice(1) : tag;
            const dockerUrl = `https://hub.docker.com/r/mallox/lotar/tags?name=${dockerTag}`;
            const quickLinks = [
              { label: 'macOS (Apple Silicon)', file: `lotar-${tag}-macos-arm64.tar.gz` },
              { label: 'macOS (Intel)', file: `lotar-${tag}-macos-x64.tar.gz` },
              { label: 'Linux (glibc x64)', file: `lotar-${tag}-linux-x64.tar.gz` },
              { label: 'Linux (musl x64)', file: `lotar-${tag}-linux-musl-x64.tar.gz` },
              { label: 'Linux (musl arm64)', file: `lotar-${tag}-linux-musl-arm64.tar.gz` },
              { label: 'Linux (musl armv7, 32-bit)', file: `lotar-${tag}-linux-musl-armv7.tar.gz` },
              { label: 'Windows (x64)', file: `lotar-${tag}-windows-x64.zip` },
              { label: 'Windows (ARM64)', file: `lotar-${tag}-windows-arm64.zip` },
              { label: 'Debian/Ubuntu package (x64)', file: `lotar-${tag}-linux-x64.deb` },
              { label: 'Debian/Ubuntu package (arm64)', file: `lotar-${tag}-linux-arm64.deb` },
              { label: 'Debian/Ubuntu package (armv7)', file: `lotar-${tag}-linux-armv7.deb` },
              { label: 'Fedora/RHEL package (x64)', file: `lotar-${tag}-linux-x64.rpm` },
              { label: 'Fedora/RHEL package (arm64)', file: `lotar-${tag}-linux-arm64.rpm` },
            ];

            const lines = quickLinks.map((entry) => `- [${entry.label}](${assetBase}/${entry.file})`);
            // The install scripts default to the latest stable release, so a
            // prerelease page names its own version (DEV-290).
            const prerelease = dockerTag.includes('-');
            const installLines = [
              '## Install Script',
              ...(prerelease
                ? [
                    `- Linux and macOS: \`curl -fsSL https://localtaskrepo.github.io/lotar/install.sh | sh -s -- --version ${tag}\``,
                    `- Windows: \`$env:LOTAR_VERSION = '${tag}'; irm https://localtaskrepo.github.io/lotar/install.ps1 | iex\``,
                  ]
                : [
                    '- Linux and macOS: `curl -fsSL https://localtaskrepo.github.io/lotar/install.sh | sh`',
                    '- Windows: `irm https://localtaskrepo.github.io/lotar/install.ps1 | iex`',
                  ]),
              `- npm: \`npm install --global @localtaskrepo/lotar@${dockerTag}\` or \`npx -y @localtaskrepo/lotar@${dockerTag}\``,
              '',
              '## Docker Image',
              `- \`mallox/lotar:${dockerTag}\` ([Docker Hub tag](${dockerUrl}))`,
            ];
            const markerStart = '<!-- QUICK-LINKS:START -->';
            const markerEnd = '<!-- QUICK-LINKS:END -->';
            const quickLinksSection = [
              markerStart,
              '## Download Quick Links',
              ...lines,
              '',
              ...installLines,
              '> Need another build? Scroll down to the Assets list for checksums and signatures.',
              markerEnd,
            ].join('\n');

            const commitsMarkerStart = '<!-- COMMITS:START -->';
            const commitsMarkerEnd = '<!-- COMMITS:END -->';
            const commitsSection = [
              commitsMarkerStart,
              'Changes:',
              commitsSectionBody,
              commitsMarkerEnd,
            ].join('\n');

            const existingBody = release.data.body ?? '';
            const regex = new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`);
            const nextBody = regex.test(existingBody)
              ? existingBody.replace(regex, () => quickLinksSection)
              : `${quickLinksSection}\n\n${existingBody}`.trim();

            const commitsRegex = new RegExp(`${commitsMarkerStart}[\\s\\S]*?${commitsMarkerEnd}`);
            const nextBodyWithCommits = (() => {
              if (commitsRegex.test(nextBody)) {
                return nextBody.replace(commitsRegex, () => commitsSection);
              }

              const quickLinksEndIndex = nextBody.indexOf(markerEnd);
              if (quickLinksEndIndex !== -1) {
                const insertAt = quickLinksEndIndex + markerEnd.length;
                return `${nextBody.slice(0, insertAt)}\n\n${commitsSection}\n\n${nextBody.slice(insertAt)}`.trim();
              }

              return `${commitsSection}\n\n${nextBody}`.trim();
            })();

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body: nextBodyWithCommits,
            });

  publish-docker-image:
    name: Publish Docker Image
    needs: update-release-page
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect release metadata
        id: release_meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Prereleases move `next`, never `latest` (same rule as the npm dist-tag).
          case "$version" in
            *-*) channel=next ;;
            *) channel=latest ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            LOTAR_VERSION=${{ steps.release_meta.outputs.version }}
          tags: |
            mallox/lotar:${{ steps.release_meta.outputs.channel }}
            mallox/lotar:${{ steps.release_meta.outputs.version }}

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: update-release-page
    # The tap and the bucket carry stable releases only (DEV-290).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: localtaskrepo/homebrew-lotar
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Collect release metadata
        id: release_meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "asset_base=${asset_base}"
          } >> "$GITHUB_OUTPUT"

      - name: Download macOS and Linux checksums
        env:
          ASSET_BASE: ${{ steps.release_meta.outputs.asset_base }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          cd tap
          curl -sSfL "${ASSET_BASE}/lotar-${TAG}-macos-arm64.sha256" -o arm64.sha
          curl -sSfL "${ASSET_BASE}/lotar-${TAG}-macos-x64.sha256" -o x64.sha
          # Homebrew on Linux gets the static musl builds, which run on any distro.
          curl -sSfL "${ASSET_BASE}/lotar-${TAG}-linux-musl-arm64.sha256" -o linux-arm64.sha
          curl -sSfL "${ASSET_BASE}/lotar-${TAG}-linux-musl-x64.sha256" -o linux-x64.sha

      - name: Update formula
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          BASE_URL: ${{ steps.release_meta.outputs.asset_base }}
        run: |
          cd tap
          ARM64_SHA=$(cut -d ' ' -f1 arm64.sha)
          X64_SHA=$(cut -d ' ' -f1 x64.sha)
          LINUX_ARM64_SHA=$(cut -d ' ' -f1 linux-arm64.sha)
          LINUX_X64_SHA=$(cut -d ' ' -f1 linux-x64.sha)
          export ARM64_SHA X64_SHA LINUX_ARM64_SHA LINUX_X64_SHA
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          base = os.environ['BASE_URL']
          arm_sha = os.environ['ARM64_SHA']
          x64_sha = os.environ['X64_SHA']
          linux_arm_sha = os.environ['LINUX_ARM64_SHA']
          linux_x64_sha = os.environ['LINUX_X64_SHA']
          for name, value in [('macos-arm64', arm_sha), ('macos-x64', x64_sha),
                              ('linux-musl-arm64', linux_arm_sha), ('linux-musl-x64', linux_x64_sha)]:
              if len(value) != 64:
                  raise SystemExit(f"Bad checksum for {name}: {value!r}")

          formula = f"""class Lotar < Formula
            desc "Local-first task and project management CLI"
            homepage "https://github.com/localtaskrepo/lotar"
            version "{version}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "{base}/lotar-v{version}-macos-arm64.tar.gz"
                sha256 "{arm_sha}"
              else
                url "{base}/lotar-v{version}-macos-x64.tar.gz"
                sha256 "{x64_sha}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "{base}/lotar-v{version}-linux-musl-arm64.tar.gz"
                sha256 "{linux_arm_sha}"
              else
                url "{base}/lotar-v{version}-linux-musl-x64.tar.gz"
                sha256 "{linux_x64_sha}"
              end
            end

            def install
              bin.install "lotar"
            end

            test do
              assert_match "lotar", shell_output("#{{bin}}/lotar --version")
            end
          end
          """

          # Ruby's #{...} must be written #{{...}} in this f-string (DEV-250).
          if "<built-in" in formula or "#{bin}" not in formula:
              raise SystemExit("Formula template interpolation is broken")
          Path("Formula/lotar.rb").write_text(formula)
          PY

      - name: Commit and push tap update
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lotar.rb
          git commit -m "Update lotar formula to v$VERSION" || echo "No changes"
          git push

  update-scoop-bucket:
    name: Update Scoop Bucket
    needs: update-release-page
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout scoop bucket repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: localtaskrepo/scoop-lotar
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: scoop-bucket

      - name: Collect release metadata
        id: scoop_meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "asset_base=${asset_base}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Windows checksums
        env:
          ASSET_BASE: ${{ steps.scoop_meta.outputs.asset_base }}
          TAG: ${{ steps.scoop_meta.outputs.tag }}
        run: |
          cd scoop-bucket
          curl -sSfL "${ASSET_BASE}/lotar-${TAG}-windows-x64.sha256" -o windows.sha
          curl -sSfL "${ASSET_BASE}/lotar-${TAG}-windows-arm64.sha256" -o windows-arm64.sha

      - name: Update manifest
        env:
          VERSION: ${{ steps.scoop_meta.outputs.version }}
          BASE_URL: ${{ steps.scoop_meta.outputs.asset_base }}
          TAG: ${{ steps.scoop_meta.outputs.tag }}
        run: |
          cd scoop-bucket
          mkdir -p bucket
          hash=$(cut -d ' ' -f1 windows.sha)
          export HASH="$hash"
          # Windows checksum files end lines with CRLF.
          arm64_hash=$(cut -d ' ' -f1 windows-arm64.sha | tr -d '\r')
          export ARM64_HASH="$arm64_hash"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          base = os.environ['BASE_URL']
          tag = os.environ['TAG']
          hash_value = os.environ['HASH']
          arm64_hash = os.environ['ARM64_HASH']

          manifest = {
              "version": version,
              "description": "Local-first task and project management CLI",
              "homepage": "https://github.com/localtaskrepo/lotar",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": f"{base}/lotar-{tag}-windows-x64.zip",
                      "hash": hash_value,
                  },
                  "arm64": {
                      "url": f"{base}/lotar-{tag}-windows-arm64.zip",
                      "hash": arm64_hash,
                  },
              },
              "bin": "lotar.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/localtaskrepo/lotar/releases/download/v$version/lotar-v$version-windows-x64.zip",
                      },
                      "arm64": {
                          "url": "https://github.com/localtaskrepo/lotar/releases/download/v$version/lotar-v$version-windows-arm64.zip",
                      },
                  }
              }
          }

          Path("bucket/lotar.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit and push bucket update
        env:
          VERSION: ${{ steps.scoop_meta.outputs.version }}
        run: |
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/lotar.json
          git commit -m "Update lotar manifest to v${VERSION}" || echo "No changes"
          git push
