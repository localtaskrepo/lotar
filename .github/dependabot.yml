# Dependency updates (DEV-163). Minor and patch updates are grouped into one
# PR per ecosystem; major updates arrive individually for review. Security
# updates are not grouped and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript majors wait for vue-tsc and typescript-eslint support
      # (DEV-123); minor and patch updates still arrive.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Workflow actions are pinned to commit SHAs with the tag as a comment;
  # Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
